    # The ferias of Advent up to the 16th of December, but for the ember days
    # (nn. 25b, 91.25). They give way to third-class feasts and are commemorated
    # as privileged when impeded (n. 108e), and as of the season.
    - type: feria #91.25 25b
      commemorated: privileged #108e
      of-the-season: true
      occurence: { type: "!dominica", start: advent, end: 16-12 }
    # The vigil of the third class, that of St Lawrence (nn. 32, 91.26): kept
    # over fourth-class days, commemorated when impeded, and left out on a Sunday
    # or a first-class feast (n. 33).
    - type: vigilia #91.26 32
      omitted-on: [{ type: dominica }, { class: 1, type: festum }] #33
      calendar:
        09-08: { id: in-vigilia-s-laurentii-mart, honours: [laurentii] }
  # Days of the fourth class (n. 91, IV). They admit two commemorations
  # (n. 111d), and are commemorated as ordinary, but for the ferias and Our
  # Lady on Saturday, which are never commemorated (nn. 26, 108).
  - liturgical-class: 4
    commemorated: ordinary #108
    admits: { count: 2 } #111d
    items:
    # Our Lady on Saturday, kept on a Saturday that would otherwise be a feria of
    # the fourth class (nn. 78, 91.27). Its Mass is of the season of the year it
    # falls in. A fourth-class day, it is not commemorated when impeded.
    - type: feria #91.27
      color: white
      commemorated: never #26
      honours: [beatae-mariae-virginis] #112d
      items:
      - id: maria-in-sabbato-in-tempore-adventus
        occurence: { type: sabbato, start: advent, end: 24-12 }
      - id: maria-in-sabbato-a-nativitate-domini-usque-ad-purificationem
        occurence: { type: sabbato, start: 01-01, end: 02-02 } # Start at 01-01 for the correct year
      - id: maria-in-sabbato-a-die-3-februari-usque-ad-feriam-iv-hebdomadae-sanctae
        occurence: { type: sabbato, start: 03-02, end: { date: easter, difference: -4 } }
      - id: maria-in-sabbato-in-tempore-paschali
        occurence: { type: sabbato, start: easter, end: { date: easter, difference: 49 } }
      - id: maria-in-sabbato-a-festo-trinitatis-usque-ad-sabbatum-ante-dominicam-i-adventus
        occurence: { type: sabbato, start: { date: easter, difference: 56 }, end: advent }
    # The ferias of the fourth class: every one not named above (nn. 26,
    # 91.28). They are never commemorated.
    - type: feria #91.28 26
      commemorated: never #26
      occurence: { start: 01-01, end: 31-12 }
    # The commemorations of particular calendars, below every liturgical day:
    # they are said only within the office and Mass of the day (n. 5).
    - slot: dioecesis-4
    - slot: ecclesiae-4
    - slot: congregationis-4
