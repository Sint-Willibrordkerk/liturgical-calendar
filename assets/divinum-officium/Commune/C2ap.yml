  lectio4-in-2-loco:
    - De Epístola sancti Cypriáni Epíscopi et Mártyris ad Mártyres et
      Confessóres.
    - "!Lib. 2. Epist. 6."
    - "Quibus ego vos láudibus prǽdicem, fortíssimi Mártyres? robur péctoris
      vestri, et perseverántiam fídei, quo præcónio vocis exórnem? Tolerástis
      usque ad consummatiónem glóriæ duríssimam quæstiónem: nec cessístis
      supplíciis, sed vobis pótius supplícia cessérunt. Finem dolóribus, quem
      torménta non dabant, corónæ dedérunt. Laniéna grávior ad hoc diu
      perseverávit, non ut stantem fidem dejíceret, sed ut hómines Dei ad Deum
      velócius mítteret."
  lectio5-in-2-loco:
    - "Vidit admírans præséntium multitúdo cæléste certamen, certámen Dei,
      certámen spiritále, prǽlium Christi: stetísse servos ejus voce líbera,
      mente incorrúpta, virtúte divína, telis quidem sæculáribus nudos, sed
      armis fídei ardéntis armátos. Stetérunt torti torquéntibus fortióres: et
      pulsántes ac laniántes úngulas, pulsáta ac laniáta membra vicérunt.
      Inexpugnábilem fidem superáre non pótuit sǽviens diu plaga repetíta,
      quamvis rupta compáge víscerum torqueréntur in servis Dei jam non membra,
      sed vúlnera. Fluébat sanguis, qui incéndium persecutiónis exstíngueret,
      qui flammas et ignes gehénnæ glorióso cruóre sopíret."
  lectio6-in-2-loco:
    - "O quale illud fuit spectáculum Dómino, quam sublíme, quam magnum, quam
      Dei óculis sacraménto ac devotióne mílitis ejus accéptum: sicut scriptum
      est in Psalmis, Spíritu Sancto loquénte ad nos páriter et monénte:
      Pretiósa est in conspéctu Dómini mors justórum ejus. Pretiósa mors hæc
      est, quæ emit immortalitátem prétio sui sánguinis; quæ accépit corónam de
      consummatióne virtútis. Quam lætus illic Christus fuit, quam libens in
      tálibus servis suis et pugnávit, et vicit protéctor fídei, dans
      credéntibus tantum, quantum se credit cápere qui sumit! Certámini suo
      ádfuit, præliatóres atque assertóres sui nóminis eréxit, corroborávit,
      animávit. Et qui pro nobis mortem semel vicit, semper vincit in nobis."
  lectio7-in-2-loco:
    - Léctio sancti Evangélii secúndum Joánnem
    - "!Joannes 15:5-10"
    - "In illo témpore: Dixit Jesus discípulis suis: Ego sum vitis, vos
      pálmites: qui manet in me, et ego in eo, hic fert fructum multum: quia
      sine me nihil potéstis fácere. Et réliqua."
    - _
    - Homilía sancti Augustíni Epíscopi
    - "!Tract. 81 in Joan., sub med."
    - "Ne quisquam putáret saltem parvum áliquem fructum posse a semetípso
      pálmitem ferre: cum dixísset, Hic fert fructum multum; non ait, Quia sine
      me parum potéstis fácere; sed, Nihil potéstis fácere. Sive ergo parum,
      sive multum, sine illo fíeri non potest, sine quo nihil fíeri potest: quia
      etsi parum attúlerit palmes, eum purgat agrícola, ut plus áfferat; tamen
      nisi in vite mánserit, et víxerit de radíce, quantúmlibet fructum a
      semetípso non potest ferre. Quamvis autem Christus vitis non esset, nisi
      homo esset: tamen istam grátiam palmítibus non præbéret, nisi étiam Deus
      esset."
  lectio8-in-2-loco:
    - "Verum quia ita sine ista grátia non potest vivi, ut et mors in potestáte
      sit líberi arbítrii: Si quis in me, inquit, non mánserit; mittétur foras
      sicut palmes, et aréscet, et cólligent eum, et in ignem mittent, et ardet.
      Ligna ítaque vitis tanto sunt contemptibilióra si in vite non mánserint,
      quanto gloriosióra si mánserint. Dénique sicut de his étiam per Ezechiélem
      prophétam Dóminus dicit, præcísa nullis agricolárum úsibus prosunt, nullis
      fabrílibus opéribus deputántur. Unum de duóbus pálmiti congruit, aut
      vitis, aut ignis: si in vite non est, in igne erit: ut ergo in igne non
      sit, in vite sit."
  lectio9-in-2-loco:
    - "Si manséritis in me, inquit, et verba mea in vobis mánserint: quodcúmque
      voluéritis petétis, et fiet vobis. Manéndo quippe in Christo, quid velle
      possunt, nisi quod cónvenit Christo? Quid velle possunt manéndo in
      Salvatóre, nisi quod non est aliénum a salúte? Áliud quippe vólumus quia
      sumus in Christo: et áliud vólumus quia sumus adhuc in hoc sǽculo. De
      mansióne namque hujus sǽculi nobis aliquándo subrépit, ut hoc petámus,
      quod nobis non expedíre nescímus. Sed absit ut fiat nobis, si manémus in
      Christo, qui non facit quando pétimus, nisi quod éxpedit nobis."
    - "&teDeum"
  introitus:
