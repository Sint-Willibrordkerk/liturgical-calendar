oratio:
  - "Præsta, quǽsumus, omnípotens Deus: ut, qui beáti N. Mártyris tui natalítia
    cólimus, intercessióne ejus in tui nóminis amóre roborémur."
  - $Per Dominum
lectio1:
  - De Epístola beáti Pauli Apóstoli ad Romános
  - "!Rom 8:12-19"
  - "12 Fratres: Debitóres sumus non carni, ut secúndum carnem vivámus."
  - "13 Si enim secúndum carnem vixéritis, moriémini: si autem spíritu facta
    carnis mortificavéritis, vivétis."
  - 14 Quicúmque enim spíritu Dei agúntur, ii sunt fílii Dei.
  - "15 Non enim accepístis spíritum servitútis íterum in timóre, sed accepístis
    spíritum adoptiónis filiórum, in quo clamámus: Abba (Pater)."
  - 16 Ipse enim Spíritus testimónium reddit spirítui nostro quod sumus fílii
    Dei.
  - "17 Si autem fílii, et herédes: herédes, quidem Dei, coherédes autem
    Christi: si tamen compátimur ut et conglorificémur."
  - 18 Exístimo enim quod non sunt condígnæ passiónes hujus témporis ad futúram
    glóriam, quæ revelábitur in nobis.
  - 19 Nam exspectátio creatúræ revelatiónem filiórum Dei exspéctat.
lectio2:
  - "!Rom 8:28-34"
  - 28 Scimus autem quóniam diligéntibus Deum ómnia cooperántur in bonum iis qui
    secúndum propósitum vocáti sunt sancti.
  - 29 Nam quos præscívit et prædestinávit confórmes fíeri imáginis Fílii sui ut
    sit ipse primogénitus in multis frátribus.
  - "30 Quos autem prædestinávit, hos et vocávit: et quos vocávit, hos et
    justificávit: quos autem justificávit, illos et glorificávit."
  - 31 Quid ergo dicémus ad hæc? Si Deus pro nobis, quis contra nos?
  - 32 Qui étiam próprio Fílio suo non pepércit, sed pro nobis ómnibus trádidit
    illum, quómodo non étiam cum illo ómnia nobis donávit?
  - 33 Quis accusábit advérsus eléctos Dei? Deus qui justíficat,
  - 34 quis est qui condémnet? Christus Jesus, qui mórtuus est, immo qui et
    resurréxit, qui est ad déxteram Dei, qui étiam interpéllat pro nobis.
lectio3:
  - "!Rom 8:35-39"
  - 35 Quis ergo nos separábit a caritáte Christi? tribulátio? an angústia? an
    fames? an núditas? an perículum? an persecútio? an gládius?
  - "36 (sicut scriptum est: Quia propter te mortificámur tota die: æstimáti
    sumus sicut oves occisiónis.)"
  - 37 Sed in his ómnibus superámus propter eum qui diléxit nos.
  - 38 Certus sum enim quia neque mors, neque vita, neque Ángeli, neque
    Principátus, neque Virtútes, neque instántia, neque futúra, neque fortitúdo,
  - 39 neque altitúdo, neque profúndum, neque creatúra ália póterit nos separáre
    a caritáte Dei, quæ est in Christo Jesu Dómino nostro.
secreta:
  - "Munéribus nostris, quǽsumus, Dómine, precibúsque suscéptis: et cœléstibus
    nos munda mystériis, et cleménter exáudi."
  - $Per Dominum
postcommunio:
  - "Da, quǽsumus, Dómine, Deus noster: ut, sicut tuórum commemoratióne
    Sanctórum temporáli gratulámur offício; ita perpétuo lætémur aspéctu."
  - $Per Dominum
