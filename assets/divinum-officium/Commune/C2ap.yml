  lectio:
    - Léctio libri Sapiéntiæ
    - "!Sap 5:1-5"
    - "Stabunt justi in magna constántia advérsus eos, qui se angustiavérunt et
      qui abstulérunt labóres eórum. Vidéntes turbabúntur timore horríbili, et
      mirabúntur in subitatióne insperátæ salútis, dicéntes intra se,
      poeniténtiam agéntes, et præ angústia spíritus geméntes: Hi sunt, quos
      habúimus aliquándo in derísum et in similitúdinem impropérii. Nos
      insensáti vitam illórum æstimabámus insániam, et finem illórum sine
      honóre: ecce, quómodo computáti sunt inter fílios Dei, et inter Sanctos
      sors illórum est."
  graduale:
    - Allelúja, allelúja.
    - "!Ps 88:6"
    - "Confitebúntur cœli mirabília tua, Dómine: étenim veritátem tuam in
      ecclésia sanctórum. Allelúja."
    - "!Ps 20:4"
    - Posuísti, Dómine, super caput ejus corónam de lápide pretióso. Allelúja.
  evangelium:
    - Sequéntia ++ sancti Evangélii secúndum Joánnem
    - "!Joannes 15:1-7"
    - "In illo témpore: Dixit Jesus discípulis suis: Ego sum vitis vera: et
      Pater meus agrícola est. Omnem pálmitem in me non feréntem fructum, tollet
      eum: et omnem, qui fert fructum, purgábit eum, ut fructum plus áfferat.
      Jam vos mundi estis propter sermónem, quem locútus sum vobis. Manéte in
      me: et ego in vobis. Sicut palmes non potest ferre fructum a semetípso,
      nisi mánserit in vite: sic nec vos, nisi in me manséritis. Ego sum vitis,
      vos pálmites: qui manet in me, et ego in eo, hic fert fructum multum: quia
      sine me nihil potéstis fácere. Si quis in me non mánserit, mittétur foras
      sicut palmes, et aréscet, et cólligent eum, et in ignem mittent, et ardet.
      Si manséritis in me, et verba mea in vobis mánserint: quodcúmque
      voluéritis, petétis, et fiet vobis."
  offertorium:
    - "!Ps 88:6"
    - "Confitebúntur cœli mirabília tua, Dómine: et veritátem tuam in ecclésia
      sanctórum, allelúja, allelúja."
