evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 13:44-52"
  - "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Símile est
    regnum cœlórum thesáuro abscóndito in agro: quem qui invénit homo,
    abscóndit, et præ gáudio illíus vadit, et vendit univérsa, quæ habet, et
    emit agrum illum. Íterum símile est regnum cœlórum hómini negotiatóri,
    quærénti bonas margarítas. Invénta autem una pretiósa margaríta, ábiit, et
    véndidit ómnia, quæ hábuit, et emit eam. Íterum símile est regnum cœlórum
    sagénæ missæ in mare et ex omni génere píscium congregánti. Quam, cum
    impléta esset, educéntes, et secus litus sedéntes, elegérunt bonos in vasa,
    malos autem foras misérunt. Sic erit in consummatióne sǽculi: exíbunt
    Angeli, et separábunt malos de médio justórum, et mittent eos in camínum
    ignis: ibi erit fletus et stridor déntium. Intellexístis hæc ómnia? Dicunt
    ei: Etiam. Ait illis: Ideo omnis scriba doctus in regno cœlórum símilis est
    hómini patrifamílias, qui profert de thesáuro suo nova et vétera."
offertorium:
  - "!Ps 44:15-16"
  - "Afferéntur Regi Vírgines post eam: próximæ ejus afferéntur tibi in lætítia
    et exsultatióne: adducéntur in templum Regi Dómino. (Allelúja.)"
communio:
  - "!Matt 13:45-46"
  - "Símile est regnum cœlórum hómini negotiatóri, quærénti bonas margarítas:
    invénta autem una pretiósa margaríta, dedit ómnia sua, et comparávit eam."
evangelium-in-2-loco:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 19:3-12"
  - "In illo témpore: Accessérunt ad Jesum pharisǽi, tentántes eum et dicéntes:
    Si licet hómini dimíttere uxórem suam quacúmque ex causa? Qui respóndens,
    ait eis: Non legístis, quia, qui fecit hóminem ab inítio, másculum et
    féminam fecit eos? et dixit: Propter hoc dimíttet homo patrem, et matrem, et
    adhærébit uxóri suæ, et erunt duo in carne una. Itaque jam non sunt duo, sed
    una caro. Quod ergo Deus conjúnxit, homo non séparet. Dicunt illi: Quid ergo
    Móyses mandávit dare libéllum repúdii, et dimíttere? Ait illis: Quóniam
    Móyses ad durítiam cordis vestri permísit vobis dimíttere uxóres vestras: ab
    inítio autem non fuit sic. Dico autem vobis, quia, quicúmque dimíserit
    uxórem suam, nisi ob fornicatiónem, et áliam dúxerit, mœchátur: et qui
    dimíssam dúxerit, mœchátur. Dicunt ei discípuli ejus: Si ita est causa
    hóminis cum uxóre, non expédit núbere. Qui dixit illis: Non omnes cápiunt
    verbum istud, sed quibus datum est. Sunt enim eunúchi, qui de matris útero
    sic nati sunt; et sunt eunúchi, qui facti sunt ab homínibus; et sunt
    eunúchi, qui seípsos castravérunt propter regnum cœlórum. Qui potest cápere,
    cápiat."
