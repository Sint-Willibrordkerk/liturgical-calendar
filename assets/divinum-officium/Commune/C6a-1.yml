    - _
    - "!Tractus"
    - "!Ps 44:11-12"
    - "Audi, fília, et vide, et inclína aurem tuam: quia concupívit Rex spéciem
      tuam."
    - "!Ps 44:13; 44:10"
    - "Vultum tuum deprecabúntur omnes dívites plebis: fíliæ regum in honóre
      tuo."
    - "!Ps 44:15-16"
    - "V. Adducéntur Regi Vírgines post eam: próximæ ejus afferéntur tibi."
    - "V. Afferéntur in lætítia et exsultatióne: adducéntur in templum Regis."
  offertorium:
    - "!Ps 44:10"
    - Fíliæ regum in honóre tuo, ástitit regína a dextris tuis in vestítu
      deauráto, circúmdata varietáte. (Allelúja.)
  secreta:
    - "Accépta tibi sit, Dómine, sacrátæ plebis oblátio pro tuórum honóre
      Sanctórum: quorum se méritis de tribulatióne percepísse cognóscit
      auxílium."
    - $Per Dominum
  communio:
    - "!Matt 25:4-6"
    - "Quinque prudéntes vírgines accepérunt óleum in vasis suis cum lampádibus:
      média autem nocte clamor factus est: Ecce, sponsus venit: exíte óbviam
      Christo Dómino. (Allelúja.)"
  postcommunio:
    - "Satiásti, Dómine, famíliam tuam munéribus sacris: ejus, quǽsumus, semper
      interventióne nos réfove, cujus sollémnia celebrámus."
    - $Per Dominum
