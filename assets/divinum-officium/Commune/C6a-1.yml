lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Corínthios
  - "!1 Cor 7:25-34"
  - "Fratres: De virgínibus præcéptum Dómini non hábeo: consílium autem do,
    tamquam misericórdiam consecútus a Dómino, ut sim fidélis. Exístimo ergo hoc
    bonum esse propter instántem necessitátem, quóniam bo; num est hómini sic
    esse. Alligátus es uxóri? noli quǽrere solutiónem. Solútus es ab uxóre? noli
    quǽrere uxórem. Si autem accéperis uxórem, non peccásti. Et si núpserit
    virgo, non peccávit: tribulatiónem tamen carnis habébunt hujúsmodi. Ego
    autem vobis parce. Hoc ítaque dico, fratres: Tempus breve est: réliquum est,
    ut, et qui habent uxóres, tamquam non habéntes sint; et qui flent, tamquam
    non flentes; et qui gaudent, tamquam non gaudéntes; et qui emunt, tamquam
    non possidéntes; et qui utúntur hoc mundo, tamquam non utántur; prǽterit
    enim figúra hujus mundi. Volo autem vos sine sollicitúdine esse. Qui sine
    uxóre est, sollícitus est, quæ Dómini sunt, quómodo pláceat Deo. Qui autem
    cum uxóre est, sollícitus est, quæ sunt mundi, quómodo pláceat uxóri, et
    divísus est. Et múlier innúpta et virgo cógitat, quæ Dómini sunt, ut sit
    sancta córpore et spíritu: in Christo Jesu, Dómino nostro."
