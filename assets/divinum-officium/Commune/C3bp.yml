  introitus:
    - "!Ps 144:10-11"
    - "v. Sancti tui, Dómine, benedícent te: glóriam regni tui dicent,
      allelúja, allelúja."
    - "!Ps. 144:1"
    - "Exaltábo te, Deus meus, Rex: et benedícam nómini tuo in sǽculum, et
      in sǽculum sǽculi."
    - "&Gloria"
    - "v. Sancti tui, Dómine, benedícent te: glóriam regni tui dicent,
      allelúja, allelúja."
  lectio:
    - Léctio Epístolæ beáti Petri Apóstoli
    - "!1 Petr 1:3-7"
    - "Benedíctus Deus et Pater Dómini nostri Jesu Christi, qui secúndum
      misericórdiam suam magnam regenerávit nos in spem vivam, per
      resurrectiónem Jesu Christi ex mórtuis, in hereditátem incorruptíbilem
      et incontaminátam et immarcescíbilem, conservátam in cœlis in vobis,
      qui in virtúte Dei custodímini per fidem in salútem, parátam revelári
      in témpore novíssimo. In quo exsultábitis, módicum nunc si opórtet
      contristári in váriis tentatiónibus: ut probátio vestræ fídei multo
      pretiósior auro [quod per ignem probátur] inveniátur in laudem et
      glóriam et honórem, in revelatióne Jesu Christi, Dómini nostri."
  graduale:
    - Allelúja, allelúja.
    - "!Sir 39:19"
    - "Sancti tui, Dómine, florébunt sicut lílium: et sicut odor bálsami
      erunt ante te. Allelúja."
    - "!Ps 115:15"
    - Pretiósa in conspéctu Dómini mors Sanctórum ejus. Allelúja.
  evangelium:
    - Sequéntia ++ sancti Evangélii secúndum Joánnem
    - "!Joannes 15:5-11"
    - "In illo témpore: Dixit Jesus discípulis suis: Ego sum vitis, vos
      pálmites: qui manet in me, et ego in eo, hic fert fructum multum: quia
      sine me nihil potéstis fácere. Si quis in me non mánserit, mittétur foras
      sicut palmes, et aréscet, et cólligent eum, et in ignem mittent, et ardet.
      Si manséritis in me, et verba mea in vobis mánserint: quodcúmque
      voluéritis, petétis, et fiet vobis. In hoc clarificátus est Pater meus,
      ut fructum plúrimum afferátis, et efficiámini mei discípuli. Sicut
      diléxit me Pater, et ego diléxi vos. Manéte in dilectióne mea. Si
      præcépta mea servavéritis, manébitis in dilectióne mea, sicut et ego
      Patris mei præcépta servávi, et máneo in ejus dilectióne. Hæc locútus
      sum vobis, ut gáudium meum in vobis sit, et gáudium vestrum impleátur."
  offertorium:
    - "!Ps 31:11"
    - "Lætámini in Dómino et exsultáte, justi: et gloriámini, omnes recti
      corde, allelúja, allelúja."
  secreta:
    - "@Commune/C3"
  communio:
    - "!Ps 32:1"
    - "Gaudéte, justi, in Dómino, allelúja: rectos decet collaudátio,
      allelúja."
  postcommunio:
    - "@Commune/C3"
communi-summorum-pontificum/officium:
  - Commune plurium Summorum Pontificum Martyrum Tempore Paschali
communi-summorum-pontificum/rule:
  - Psalmi Dominica
  - Antiphonas horas
  - Psalm5 Vespera=116
  - Psalm5 Vespera3=115
  - Prefatio=Apostolis
communi-summorum-pontificum/oratio:
  - "v. Gregem tuum, Pastor ætérne, placátus inténde: et per beátos N. et N.
    Mártyres tuos atque Summos Pontífices perpétua protectióne custódi; quos
    totíus Ecclésiæ præstitísti esse pastóres."
  - $Per Dominum
communi-summorum-pontificum/lectio7:
  - "@Sancti/03-12"
communi-summorum-pontificum/lectio8:
  - "@Sancti/03-12"
communi-summorum-pontificum/lectio9:
  - "@Sancti/03-12"
communi-summorum-pontificum/introitus:
  - "!Joann 21:15-17"
  - v. Si díligis me, Simon Petre, pasce agnos meos, pasce oves meas. (Allelúja,
    allelúja.)
  - "!Ps 29:2"
  - Exaltábo te, Dómine, quóniam suscepísti me, nec delectásti inimícos meos
    super me.
  - "&Gloria"
  - v. Si díligis me, Simon Petre, pasce agnos meos, pasce oves meas. (Allelúja,
    allelúja.)
communi-summorum-pontificum/lectio:
  - Léctio Epístolæ beáti Petri Apóstoli
  - "!1 Pet 5:1-4; 5:10-11"
  - "Caríssimi: Senióres, qui in vobis sunt, obsécro consénior et testis Christi
    passiónum, qui et ejus, quæ in futúro revelánda est, glóriæ communicátor:
    páscite qui in vobis est gregem Dei, providéntes non coácte, sed spontánee
    secúndum Deum, neque turpis lucri grátia, sed voluntárie; neque ut
    dominántes in cleris, sed forma facti gregis ex ánimo. Et, cum apparúerit
    princeps pastórum, percipiétis immarcescíbilem glóriæ corónam. Deus autem
    omnis grátiæ, qui vocávit nos in ætérnam suam glóriam in Christo Jesu,
    módicum passos ipse perfíciet, confirmábit solidabítque. Ipsi glória et
    impérium in sǽcula sæculórum. Amen."
communi-summorum-pontificum/graduale:
  - "@Commune/Coronatio"
communi-summorum-pontificum/gradualep:
  - Allelúja, allelúja.
  - "!Matt 16:18"
  - Tu es Petrus, et super hanc petram ædificábo Ecclésiam meam. Allelúja.
  - "!Ps 44:17-18."
  - "Constítues eos príncipes super omnem terram: mémores erunt nóminis tui,
    Dómine. Allelúja."
communi-summorum-pontificum/tractus:
  - "!Ps 106:32; 106:31"
  - "Exáltent eum in Ecclésia plebis: et in cáthedra seniórum laudent eum."
  - V. Confiteántur Dómino misericórdiæ ejus; et mirabília ejus fíliis hóminum
  - "!Ps 39:10-11"
  - "Annuntiávi justítiam tuam in ecclésia magna, ecce, lábia mea non prohibébo:
    Dómine, tu scisti."
  - "V. Justítiam tuam non abscóndi in corde meo: veritátem tuam et salutáre
    tuum dixi."
  - V. Non abscóndi misericórdiam tuam, et veritátem tuam a concílio multo.
communi-summorum-pontificum/evangelium:
  - "@Commune/Coronatio"
communi-summorum-pontificum/offertorium:
  - "!Jer 1:9-10"
  - "Ecce, dedi verba mea in ore tuo: ecce, constítui te super gentes et super
    regna, ut evéllas et déstruas, et ædífices et plantes. (Allelúja.)"
communi-summorum-pontificum/secreta:
  - "Oblátis munéribus, quǽsumus, Dómine, Ecclésiam tuam benígnus illúmina: ut,
    et gregis tui profíciat ubíque succéssus, et grati fiant nómini tuo, te
    gubernánte, pastóres."
  - $Per Dominum
communi-summorum-pontificum/communio:
  - "@Commune/Coronatio"
communi-summorum-pontificum/postcommunio:
  - "Refectióne sancta enutrítam gubérna, quǽsumus, Dómine, tuam placátus
    Ecclésiam: ut, poténti moderatióne dirécta, et increménta libertátis
    accípiat et in religiónis integritáte persístat."
  - $Per Dominum
