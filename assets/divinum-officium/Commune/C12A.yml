lectio1:
  - "!Luc 1:26-28"
  - 26 Missus est Angelus Gabriel a Deo in civitatem Galilaeae, cui nomen
    Nazareth,
  - "27 Ad virginem desponsatam viro, cui nomen erat Joseph, de domo David: et
    nomen virginis Maria."
  - "28 Et ingressus Angelus ad eam dixit: Ave gratia plena: Dominus tecum:
    benedicta tu in mulieribus."
responsory1:
  - "R. Missus est Gábriel Angelus ad Maríam Vírginem desponsátam Joseph,
    núntians ei verbum; et expavéscit Virgo de lúmine: ne tímeas, María,
    invenísti grátiam apud Dóminum:"
  - "* Ecce concípies et páries, et vocábitur Altíssimi Fílius. (Allelúja.)"
  - V. Dabit ei Dóminus Deus sedem David, patris ejus, et regnábit in domo Jacob
    in ætérnum.
  - R. Ecce concípies et páries, et vocábitur Altíssimi Fílius. (Allelúja.)
lectio2:
  - "!Luc 1:29-33"
  - 29 Quae cum audisset, turbata est in sermone ejus, et cogitabat qualis esset
    ista salutatio.
  - "30 Et ait Angelus ei: Ne timeas, Maria: invenisti enim gratiam apud Deum:"
  - "31 Ecce concipies in utero, et paries filium, et vocabis nomen ejus Jesum:"
  - "32 Hic erit magnus, et Filius Altissimi vocabitur, et dabit illi Dominus
    Deus sedem David patris ejus: et regnabit in domo Jacob in aeternum,"
  - 33 Et regni ejus non erit finis.
responsory2:
  - "R. Ave, María, grátia plena; Dóminus tecum:"
  - "* Spíritus Sanctus supervéniet in te, et virtus Altíssimi obumbrábit tibi:
    quod enim ex te nascétur Sanctum, vocábitur Fílius Dei. (Allelúja.)"
  - V. Quómodo fiet istud, quóniam virum non cognósco? Et respóndens Angelus,
    dixit ei.
  - "R. Spíritus Sanctus supervéniet in te, et virtus Altíssimi obumbrábit tibi:
    quod enim ex te nascétur Sanctum, vocábitur Fílius Dei. (Allelúja.)"
lectio3:
  - "!Luc 1:34-38"
  - "34 Dixit autem Maria ad Angelum: Quomodo fiet istud, quoniam virum non
    cognosco?"
  - "35 Et respondens Angelus dixit ei: Spiritus Sanctus superveniet in te, et
    virtus Altissimi obumbrabit tibi. Ideoque et quod nascetur ex te Sanctum,
    vocabitur Filius Dei."
  - "36 Et ecce Elisabeth cognata tua, et ipsa concepit filium in senectute sua:
    et hic mensis sextus est illi, quae vocatur sterilis:"
  - 37 Quia non erit impossibile apud Deum omne verbum.
  - "38 Dixit autem Maria: Ecce ancilla Domini: fiat mihi secundum verbum tuum."
responsory3:
  - "R. Súscipe verbum, Virgo María, quod tibi a Dómino per Angelum transmíssum
    est: concípies et páries Deum páriter et hóminem,"
  - "* Ut benedícta dicáris inter omnes mulíeres."
  - "V. Páries quidem fílium, et virginitátis non patiéris detriméntum:
    efficiéris grávida, et eris mater semper intácta."
  - R. Ut benedícta dicáris inter omnes mulíeres.
