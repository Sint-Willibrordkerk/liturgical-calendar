  - Sicut myrrha * elécta, odórem dedísti suavitátis, sancta Dei Génetrix.;;18
  - Ante torum * hujus Vírginis frequentáte nobis dúlcia cántica drámatis.;;23
  - Sicut lætántium * ómnium nostrum habitátio est in te, sancta Dei
    Génetrix.;;86
  - "Gaude, María Virgo: * cunctas hǽreses sola interemísti in univérso
    mundo.;;95"
  - "Dignáre me * laudáre te, Virgo sacráta: da mihi virtútem contra hostes
    tuos.;;96"
  - "Post partum, * Virgo, invioláta permansísti: Dei Génetrix, intercéde pro
