versum-1:
  - V. Diffúsa est grátia in lábiis tuis.
  - R. Proptérea benedíxit te Deus in ætérnum.
ant-1:
  - "Spíritus Sanctus * in te descéndet, María: ne tímeas, habébis in útero
    Fílium Dei, allelúja."
oratio:
  - "Deus, qui de beátæ Maríæ Vírginis útero Verbum tuum, Angelo nuntiánte,
    carnem suscípere voluísti: præsta supplícibus tuis; ut, qui vere eam
    Genetrícem Dei crédimus, ejus apud te intercessiónibus adjuvémur."
  - $Per eundem
commemoratio:
  - "!Commemoratio de Sanctis"
  - "Ant. Ecce Dóminus véniet, et omnes Sancti ejus cum eo: et erit in die illa
    lux magna, allelúja."
  - V. Ecce apparébit Dóminus super nubem cándidam.
  - R. Et cum eo Sanctórum míllia.
  - $Oremus
  - "v. Consciéntias nostras, quǽsumus, Dómine, visitándo purífica: ut, véniens
    Jesus Christus, Fílius tuus, Dóminus noster, cum ómnibus Sanctis, parátam
    sibi in nobis invéniat mansiónem:"
  - $Qui tecum
invit:
  - Ave María, grátia plena, * Dóminus tecum.
ant-matutinum-9:
  - Ángelus Dómini * nuntiávit Maríæ, et concépit de Spíritu Sancto.;;97
