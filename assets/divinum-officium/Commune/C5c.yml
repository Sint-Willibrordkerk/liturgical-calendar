    - "V. Potens in terra erit semen ejus: generátio rectórum benedicétur."
    - "V. Glória et divítiæ in domo ejus: et justítia ejus manet in sǽculum
      sǽculi."
  evangelium:
    - Sequéntia ++ sancti Evangélii secúndum Lucam
    - "!Luc 12:35-40"
    - "In illo témpore: Dixit Jesus discípulis suis: Sint lumbi vestri
      præcíncti, et lucernæ ardéntes in mánibus vestris, et vos símiles
      homínibus exspectántibus dóminum suum, quando revertátur a núptiis: ut,
      cum vénerit et pulsáverit, conféstim apériant ei. Beáti servi illi, quos,
      cum vénerit dóminus, invénerit vigilántes: amen, dico vobis, quod
      præcínget se, et fáciet illos discúmbere, et tránsiens ministrábit illis.
      Et si vénerit in secúnda vigília, et si in tértia vigília vénerit, et ita
      invénerit, beáti sunt servi illi. Hoc autem scitóte, quóniam, si sciret
      paterfamílias, qua hora fur veníret, vigiláret útique, et non síneret
      pérfodi domum suam. Et vos estóte paráti, quia, qua hora non putátis,
      Fílius hóminis véniet."
  offertorium:
    - "!Ps 88:25"
    - "Véritas mea et misericórdia mea cum ipso: et in nómine meo exaltábitur
      cornu ejus. (Allelúja.)"
  secreta:
    - "Laudis tibi, Dómine, hóstias immolámus in tuórum commemoratióne
      Sanctórum: quibus nos et præséntibus éxui malis confídimus et futúris."
    - $Per Dominum
  communio:
    - "!Matt 24:46-47"
    - "Beátus servus, quem, cum vénerit dóminus, invénerit vigilántem: amen,
      dico vobis, super ómnia bona sua constítuet eum. (Allelúja.)"
  postcommunio:
    - "Refécti cibo potúque cœlésti, Deus noster, te súpplices exorámus: ut, in
      cujus hæc commemoratióne percépimus, ejus muniámur et précibus."
    - $Per Dominum
officium:
  - Commune plurium Confessorum non Pontificum
lectio1:
  - De libro Ecclesiastici
  - "!Sir 44:1-5"
  - 1 Laudémus viros gloriósos, et paréntes nostros in generatióne sua.
  - "2 Multam glóriam fecit Dóminus: magnificéntia sua a sǽculo."
  - "3 Dominántes in potestátibus suis, hómines magni virtúte et prudéntia sua
    prǽditi, nuntiántes in prophétis dignitátem prophetárum:"
  - "4 et imperántes in præsénti pópulo, et virtúte prudéntiæ pópulis
    sanctíssima verba:"
  - "5 in perítia sua requiréntes modos músicos, et narrántes cármina
    Scripturárum:"
lectio2:
  - "!Sir 44:6-9"
  - 6 Hómines dívites in virtúte, pulchritúdinis stúdium habéntes, pacificántes
    in dómibus suis.
  - 7 Omnes isti in generatiónibus gentis suæ glóriam adépti sunt, et in diébus
    suis habéntur in láudibus.
  - 8 Qui de illis nati sunt reliquérunt nomen narrándi laudes eórum.
  - "9 Et sunt quorum non est memória: periérunt quasi qui non fúerint: et nati
    sunt quasi non nati, et fílii ipsórum cum ipsis."
lectio3:
  - "!Sir 44:10-15"
  - 10 Sed illi viri misericórdiæ sunt, quorum pietátes non defuérunt.
  - "11 Cum sémine eórum pérmanent bona:"
  - "12 hæréditas sancta nepótes eórum, et in testaméntis stetit semen eórum:"
  - "13 et fílii eórum propter illos usque in ætérnum manent: semen eórum et
    glória eórum non derelinquétur."
  - 14 Córpora ipsórum in pace sepúlta sunt, et nomen eórum vivit in
    generatiónem et generatiónem.
  - 15 Sapiéntiam ipsórum narrent pópuli, et laudem eórum núntiet ecclésia.
oratio:
  - "Deus, qui nos beatórum N. et N. Confessórum tuórum ánnua solemnitáte
    lætíficas: concéde propítius; ut quorum natalítiæ cólimus, étiam actiónes
    imitémur."
  - $Per Dominum.
