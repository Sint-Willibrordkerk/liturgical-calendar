    ant-matutinum:
      - "Beátus vir, * qui in lege Dómini meditátur: volúntas ejus pérmanet die
        ac nocte, et ómnia quæcúmque fáciet, semper prosperabúntur.;;1"
      - Beátus iste Sanctus, * qui confísus est in Dómino, prædicávit præcéptum
        Dómini, constitútus est in monte sancto ejus.;;2
      - Tu es glória mea, * tu es suscéptor meus, Dómine; tu exáltans caput
        meum, et exaudísti me de monte sancto tuo.;;3
      - Invocántem * exaudívit Dóminus Sanctum suum; Dóminus exaudívit eum, et
        constítuit eum in pace.;;4
      - Læténtur omnes * qui sperant in te, Dómine; quóniam tu benedixísti
        justo, scuto bonæ voluntátis tuæ coronásti eum.;;5
      - Dómine, Dóminus noster, * quam admirábile est nomen tuum in univérsa
        terra! quia glória et honóre coronásti Sanctum tuum, et constituísti eum
        super ópera mánuum tuárum.;;8
      - Dómine, * iste Sanctus habitábit in tabernáculo tuo, operátus est
        justítiam, requiéscet in monte sancto tuo.;;14
      - "Vitam pétiit * a te, et tribuísti ei, Dómine: glóriam et magnum decórem
        imposuísti super eum; posuísti in cápite ejus corónam de lápide
        pretióso.;;20"
      - "Hic accípiet * benedictiónem a Dómino, et misericórdiam a Deo salutári
        suo: quia hæc est generátio quæréntium Dóminum.;;23"
    nocturn-2-versum:
      - V. Elégit eum Dóminus sacerdótem sibi.
      - R. Ad sacrificándum ei hóstiam laudis.
    nocturn-3-versum:
      - V. Tu es sacérdos in ætérnum.
      - R. Secúndum órdinem Melchísedech.
    lectio1:
      - De Epístola prima beáti Pauli Apóstoli ad Timótheum
      - "!1 Tim 3:1-7"
      - "1 Fidélis sermo: si quis episcopátum desíderat, bonum opus desíderat."
      - 2 Opórtet ergo epíscopum irreprehensíbilem esse, uníus uxóris virum,
        sóbrium, prudéntem, ornátum, pudícum, hospitálem, doctórem,
      - 3 non vinoléntum, non percussórem, sed modéstum; non litigiósum, non
        cúpidum, sed
      - 4 suæ dómui bene præpósitum, fílios habéntem súbditos cum omni castitáte.
      - 5 Si quis autem dómui suæ præésse nescit, quómodo Ecclésiæ Dei
        diligéntiam habébit?
      - 6 Non neóphytum, ne in supérbiam elátus, in judícium íncidat diáboli.
      - 7 Opórtet autem illum et testimónium habére bonum ab iis qui foris sunt,
        ut non in oppróbrium íncidat, et in láqueum diáboli.
    responsory1:
      - "R. Euge, serve bone et fidélis, quia in pauca fuísti fidélis, supra
        multa te constítuam:"
      - "* Intra in gáudium Dómini tui."
      - V. Dómine, quinque talénta tradidísti mihi, ecce ália quinque
        superlucrátus sum.
      - R. Intra in gáudium Dómini tui.
    lectio2:
      - De Epístola ad Titum
      - "!Titus 1:7-11"
      - "7 Opórtet enim epíscopum sine crímine esse, sicut Dei dispensatórem:
        non supérbum, non iracúndum, non vinoléntum, non percussórem, non turpis
        lucri cúpidum:"
      - 8 sed hospitálem, benígnum, sóbrium, justum, sanctum, continéntem,
      - "9 amplecténtem eum, qui secúndum doctrínam est, fidélem sermónem: ut
        potens sit exhortári in doctrína sana, et eos qui contradícunt,
        argúere."
      - "10 Sunt enim multi étiam inobediéntes, vaníloqui, et seductóres: máxime
        qui de circumcisióne sunt:"
      - "11 quos opórtet redárgui: qui univérsas domos subvértunt, docéntes quæ
        non opórtet, turpis lucri grátia."
    responsory2:
      - "R. Ecce sacérdos magnus, qui in diébus suis plácuit Deo:"
      - "* Ideo jurejurándo fecit illum Dóminus créscere in plebem suam."
      - V. Benedictiónem ómnium géntium dedit illi, et testaméntum suum
        confirmávit super caput ejus.
      - R. Ideo jurejurándo fecit illum Dóminus créscere in plebem suam.
    lectio3:
      - "!Titus 2:1-8"
      - "1 Tu autem lóquere quæ decent sanam doctrínam:"
      - "2 senes ut sóbrii sint, pudíci, prudéntes, sani in fide, in dilectióne,
        in patiéntia:"
      - "3 anus simíliter in hábitu sancto, non criminatríces, non multo vino
        serviéntes, bene docéntes:"
      - 4 ut prudéntiam dóceant adolescéntulas, ut viros suos ament, fílios suos
        díligant,
      - 5 prudéntes, castas, sóbrias, domus curam habéntes, benígnas, súbditas
        viris suis, ut non blasphemétur verbum Dei.
      - 6 Júvenes simíliter hortáre ut sóbrii sint.
      - 7 In ómnibus teípsum præbe exémplum bonórum óperum, in doctrína, in
        integritáte, in gravitáte,
      - "8 verbum sanum, irreprehensíbile: ut is qui ex advérso est, vereátur,
        nihil habens malum dícere de nobis."
    responsory3:
      - "R. Jurávit Dóminus, et non pœnitébit eum:"
      - "* Tu es sacérdos in ætérnum secúndum órdinem Melchísedech."
      - V. Dixit Dóminus Dómino meo, Sede a dextris meis.
      - R. Tu es sacérdos in ætérnum secúndum órdinem Melchísedech.
      - "&Gloria"
      - R. Tu es sacérdos in ætérnum secúndum órdinem Melchísedech.
    lectio4:
      - Sermo sancti Maxími Epíscopi
      - "!Homilia 78, quæ est 2 de S. Eusebio Vercellensi"
      - "Ad sancti ac beatíssimi Patris nostri N., cujus hódie festa celebrámus,
        laudes addidísse áliquid, decerpsísse est; síquidem virtútem ejus
        grátia, non sermónibus exponénda est, sed opéribus comprobánda. Cum enim
        dicat Scriptúra: Glória patris est fílius sápiens; quantæ hujus sunt
        glóriæ, qui tantórum filiórum sapiéntia et devotióne lætátur? In Christo
        enim Jesu per Evangélium ipse nos génuit."
    responsory4:
      - "R. Invéni David servum meum, óleo sancto meo unxi eum:"
      - "* Manus enim mea auxiliábitur ei."
      - V. Nihil profíciet inimícus in eo, et fílius iniquitátis non nocébit ei.
      - R. Manus enim mea auxiliábitur ei.
    lectio5:
      - Quidquid ígitur in hac sancta plebe potest esse virtútis et grátiæ, de
        hoc, quasi quodam fonte lucidíssimo, ómnium rivulórum púritas emanávit.
        Etenim, quia castitátis pollébat vigóre, quia abstinéntiæ gloriabátur
        angústiis, quia blandiméntis erat prǽditus lenitátis, ómnium cívium in
        Deum provocávit afféctum; quia Pontíficis administratióne fulgébat,
        plures e discípulis relíquit sui sacerdótii successóres.
    responsory5:
      - "R. Pósui adjutórium super poténtem, et exaltávi eléctum de plebe mea:"
      - "* Manus enim mea auxiliábitur ei."
      - V. Invéni David servum meum, óleo sancto meo unxi eum.
      - R. Manus enim mea auxiliábitur ei.
    lectio6:
      - "Bene et cóngrue in hac die, quam nobis beáti Patris nostri N. ad
        paradísum tránsitus exsultábilem reddit, præséntis Psalmi versículum
        decantávimus: In memória ætérna erit justus. Digne enim in memóriam
        vértitur hóminum, qui ad gáudium tránsiit Angelórum. Dicit sermo
        divínus: Ne laudes hóminem in vita sua; tamquam si díceret: Lauda post
        vitam, magnífica post consummatiónem. Dúplici enim ex causa utílius est
        hóminum magis memóriæ laudem dare quam vitæ; ut illo potíssimum témpore
        mérita sanctitátis extóllas, quando nec laudántem adulátio movet, nec
        laudátum tentat elátio."
    responsory6:
      - "R. Iste est, qui ante Deum magnas virtútes operátus est, et omnis terra
        doctrína ejus repléta est:"
      - "* Ipse intercédat pro peccátis ómnium populórum."
      - V. Iste est, qui contémpsit vitam mundi, et pervénit ad cæléstia regna.
      - R. Ipse intercédat pro peccátis ómnium populórum.
      - "&Gloria"
      - R. Ipse intercédat pro peccátis ómnium populórum.
    lectio7:
      - Léctio sancti Evangélii secúndum Matthǽum
      - "!Matt 25:14-23"
      - "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Homo
        péregre proficíscens, vocávit servos suos, et trádidit illis bona sua.
        Et réliqua."
      - _
      - Homilía sancti Gregórii Papæ
      - "!Homilia 9 in Evangelia"
      - "Léctio sancti Evangélii, fratres caríssimi, solícite consideráre nos
        ádmonet, ne nos, qui plus céteris in hoc mundo accepísse áliquid
        cérnimur, ab Auctóre mundi grávius inde judicémur. Cum enim augéntur
        dona, ratiónes étiam crescunt donórum. Tanto ergo esse humílior atque ad
        serviéndum Deo prómptior quisque debet ex múnere, quanto se obligatiórem
        esse cónspicit in reddénda ratióne. Ecce homo, qui péregre
        proficíscitur, servos suos vocat, eisque ad negótium talénta partítur.
        Post multum vero témporis positúrus ratiónem revértitur: bene operántes
        pro apportáto lucro remúnerat, servum vero a bono ópere torpéntem
        damnat."
    responsory7:
      - "R. Amávit eum Dóminus, et ornávit eum: stolam glóriæ índuit eum,"
      - "* Et ad portas paradísi coronávit eum."
      - V. Induit eum Dóminus lorícam fídei, et ornávit eum.
      - R. Et ad portas paradísi coronávit eum.
    lectio8:
      - "Quis ítaque iste homo est qui péregre proficíscitur, nisi Redémptor
        noster, qui, in ea carne quam assúmpserat, ábiit in cælum? Carnis enim
        locus próprius terra est; quæ quasi ad peregrína dúcitur, dum per
        Redemptórem nostrum in cælo collocátur. Sed homo iste, péregre
        proficíscens, servis suis bona sua trádidit; quia fidélibus suis
        spirituália dona concéssit. Et uni quidem quinque talénta, álii duo,
        álii vero commísit unum. Quinque étenim sunt córporis sensus, vidélicet:
        visus, audítus, gustus, odorátus et tactus. Quinque ergo taléntis, donum
        quinque sénsuum, id est, exteriórum sciéntia, exprímitur. Duóbus vero,
        intelléctus et operátio designátur. Uníus autem talénti nómine,
        intelléctus tantúmmodo designátur."
    responsory8:
      - "R. Sint lumbi vestri præcíncti, et lucérnæ ardéntes in mánibus vestris:"
      - "* Et vos símiles homínibus exspectántibus dóminum suum, quando
        revertátur a núptiis."
      - V. Vigiláte ergo, quia nescítis qua hora Dóminus vester ventúrus sit.
      - R. Et vos símiles homínibus exspectántibus dóminum suum, quando
        revertátur a núptiis.
      - "&Gloria"
      - R. Et vos símiles homínibus exspectántibus dóminum suum, quando
        revertátur a núptiis.
    lectio9:
      - "Sed is, qui quinque talénta accéperat, ália quinque lucrátus est: quia
        sunt nonnúlli, qui, etsi intérna ac mýstica penetráre nésciunt, pro
        intentióne tamen supérnæ pátriæ docent recta quos possunt; de ipsis
        exterióribus, quæ accepérunt, duplum taléntum portant; dumque se a
        carnis petulántia et a terrenárum rerum ámbitu atque a visibílium
        voluptáte custódiunt, ab his étiam álios admonéndo compéscunt. Et sunt
        nonnúlli, qui, quasi duóbus taléntis ditáti, intelléctum atque
        operatiónem percípiunt, subtília de intérnis intélligunt, mira in
        exterióribus operántur; cumque et intelligéndo et operándo áliis
        prǽdicant, quasi duplicátum de negótio lucrum repórtant."
      - "&teDeum"
