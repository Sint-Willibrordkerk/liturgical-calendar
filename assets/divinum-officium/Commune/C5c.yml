    - "R. Iste cognóvit justítiam, et vidit mirabília magna, et exorávit
      Altíssimum:"
    - "* Et invéntus est in número Sanctórum."
    - V. Iste est qui contémpsit vitam mundi, et pervénit ad cæléstia regna.
    - R. Et invéntus est in número Sanctórum.
    - "&Gloria"
    - R. Et invéntus est in número Sanctórum.
  lectio4:
    - Sermo sancti Joánnis Chrysóstomi
    - "!In Orat. de S. Philogonio"
    - "Beáti N. dies, cujus festivitátem celebrámus, ad ipsíus recte factórum
      enarrationem línguam nostram evocavit. Síquidem hódie beátus iste ad
      tranquillam, omnísque perturbationis expertem vitam tránsiit: eóque
      navigium áppulit, ubi deínceps non póterit metuere naufragium, nec ullam
      ánimi perturbationem, aut dolórem. Et quid mirum est, si locus ille purus
      est ab omni molestia ánimi, cum Paulus homínibus adhuc in hac vita
      degentibus loquens dicat: Semper gaudéte, sine intermissióne orate?"
  responsory4:
    - "R. Honéstum fecit illum Dóminus, et custodívit eum ab inimícis, et a
      seductóribus tutávit illum:"
    - "* Et dedit illi claritátem ætérnam."
    - V. Justum dedúxit Dóminus per vias rectas, et osténdit illi regnum Dei.
    - R. Et dedit illi claritátem ætérnam.
  lectio5:
    - "Quod si hic, ubi morbi, ubi insectatiónes, ubi præmaturæ mortes, ubi
      calumniæ, ubi invidiæ, ubi perturbationes, ubi iræ, ubi cupiditates, ubi
      innumerábiles insidiæ, ubi quotidianæ sollicitudines, ubi perpétua sibíque
      succedentia mala sunt, innúmeros ex omni parte dolóres afferentia, Paulus
      dixit fíeri posse, ut semper gaudeamus, si quis paululum ex rerum
      mundanarum flúctibus erexerit caput, vitámque suam recte composuerit:
      multo magis, postquam hinc demigraverimus, fácile cómpotes érimus ejus
      boni, cum hæc ómnia sublata fúerint, advérsa valetudo, morbi, peccandi
      matéria, ubi non est meum ac tuum, frígidum illud verbum, et quidquid est
      malórum in vitam nostram invehens, innumeraque gignens bella."
  responsory5:
    - "R. Amávit eum Dóminus, et ornávit eum: stolam glóriæ índuit eum,"
    - "* Et ad portas paradísi coronávit eum."
    - V. Índuit eum Dóminus lorícam fídei, et ornávit eum.
    - R. Et ad portas paradísi coronávit eum.
  lectio6:
    - "Quam ob rem maximópere gratulor hujus Sancti felicitáti, quod quamquam
      translátus est, atque hanc, quæ apud nos est, civitátem relíquit, tamen in
      álteram adscríptus est civitátem, nempe Dei. Et digréssus ab hac Ecclésia,
      ad illam pervénit, quæ est primogenitorum descriptorum in cælis: ac
      relíctis hisce festis, tránsiit ad celebritatem Angelórum. Étenim quod et
      cívitas sursum sit, et Ecclésia, et celebritas, audi Paulum dicéntem:
      Accessistis ad civitátem Dei viventis, Jerúsalem cæléstem, et Ecclésiam
      primitivorum, qui conscripti sunt in cælis, et ad multórum millium
      Angelórum frequentiam."
  responsory6:
    - "R. Iste homo perfécit ómnia quæ locútus est ei Deus, et dixit ad eum:
      Ingrédere in réquiem meam:"
    - "* Quia te vidi justum coram me ex ómnibus géntibus."
    - V. Iste est, qui contémpsit vitam mundi, et pervénit ad cæléstia regna.
    - R. Quia te vidi justum coram me ex ómnibus géntibus.
