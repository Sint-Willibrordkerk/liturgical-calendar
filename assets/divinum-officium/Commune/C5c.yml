  lectio7:
    - Léctio sancti Evangélii secúndum Lucam
    - "!Luc 12:35-40"
    - "In illo témpore: Dixit Jesus discípulis suis: Sint lumbi vestri
      præcincti, et lucernæ ardentes in mánibus vestris. Et réliqua."
    - _
    - Homilía sancti Gregórii Papæ
    - "!Homilia 13 in Evang."
    - "Sancti Evangélii, fratres caríssimi, apérta vobis est léctio recitata.
      Sed ne alíquibus ipsa ejus planíties alta fortásse videátur, eam sub
      brevitáte transcúrrimus, quátenus ejus exposítio ita nesciéntibus fiat
      cógnita, ut tamen sciéntibus non sit onerósa. Dóminus dicit: Sint lumbi
      vestri præcíncti. Lumbos enim præcíngimus, cum carnis luxúriam per
      continéntiam coarctámus. Sed quia minus est, mala non ágere, nisi étiam
      quisque stúdeat, et bonis opéribus insudáre, prótinus ádditur: Et lucérnæ
      ardéntes in mánibus vestris. Lucérnas quippe ardéntes in mánibus tenémus,
      cum per bona ópera próximis nostris lucis exémpla monstrámus. De quibus
      profécto opéribus Dóminus dicit: Lúceat lux vestra coram homínibus, ut
      vídeant ópera vestra bona, et gloríficent Patrem vestrum qui in cælis
      est."
  responsory7:
    - "R. Iste est qui ante Deum magnas virtútes operátus est, et de omni corde
      suo laudávit Dóminum:"
    - "* Ipse intercédat pro peccátis ómnium populórum."
    - V. Ecce homo sine queréla, verus Dei cultor, ábstinens se ab omni ópere
      malo, et pérmanens in innocéntia sua.
    - R. Ipse intercédat pro peccátis ómnium populórum.
  lectio8:
    - "Duo autem sunt, quæ jubéntur, et lumbos restríngere, et lucérnas tenére:
      ut et mundítia sit castitátis in córpore, et lumen veritátis in
      operatióne. Redemptóri étenim nostro unum sine áltero placére nequáquam
      potest: si aut is qui bona agit, adhuc luxúriæ inquinaménta non déserit:
      aut is qui castitáte præéminet, necdum se per bona ópera exércet. Nec
      cástitas ergo magna est sine bono ópere, nec opus bonum est áliquod sine
      castitáte. Sed et si utrúmque ágitur, restat, ut quisquis ille est, spe ad
      supérnam pátriam tendat, et nequáquam se a vítiis pro mundi hujus
      honestáte contíneat."
  lectio9:
    - "Et vos símiles homínibus exspectántibus dóminum suum, quando revertátur a
      núptiis: ut cum vénerit et pulsáverit, conféstim apériant ei. Venit quippe
      Dóminus, cum ad judícium próperat: pulsat vero, cum jam per ægritúdinis
      moléstias esse mortem vicínam desígnat. Cui conféstim aperímus, si hunc
      cum amóre suscípimus. Aperíre enim júdici pulsánti non vult, qui exíre de
      córpore trépidat: et vidére eum, quem contempsísse se méminit, júdicem
      formídat. Qui autem de sua spe et operatióne secúrus est, pulsanti
      conféstim áperit, quia lætus júdicem sústinet; et, cum tempus propínquæ
      mortis advénerit, de glória retributiónis hilaréscit."
    - "&teDeum"
