  lectio4-in-2-loco:
    - Ex libro Moralium sancti Gregorii Papæ.
    - "!Lib. 10. cap. 16. in cap. 12. Job."
    - "Deridétur justi simplícitas. Hujus mundi sapiéntia est, cor
      machinatiónibus tégere, sensum verbis veláre: quæ falsa sunt, vera
      osténdere; quæ vera sunt, falsa demonstráre. Hæc nimírum prudéntia usu a
      juvénibus scitur hæc a púeris prétio díscitur; hanc qui sciunt, céteros
      despiciéndo supérbiunt: hanc qui nésciunt, subjécti et tímidi in áliis
      mirántur: quia ab eis hæc éadem duplicitátis iníquitas nómine palliáta
      dilígitur, dum mentis pervérsitas urbánitas vocátur. Hæc sibi
      obsequéntibus præcipit honórum cúlmina quærere, adépta temporális glóriæ
      vanitáte gaudére, irrogáta ab áliis mala multiplícius réddere: cum vires
      súppetunt, nullis resisténtibus cédere: cum virtútis possibílitas deest,
      quidquid explére per malítiam non valent, hoc in pacífica bonitáte
      simuláre."
  lectio5-in-2-loco:
    - "At contra, sapiéntia justórum est: nil per ostensiónem fíngere, sensum
      verbis aperíre, vera ut sunt dilígere, falsa devitáre; bona gratis
      exhibére, mala libéntius toleráre quam fácere; nullam injúriæ ultiónem
      quærere, pro veritáte contuméliam lucrum putáre. Sed hæc justórum
      simplícitas deridétur; quia ab hujus mundi sapiéntibus puritátis virtus
      fatúitas créditur. Omne enim quod innocénter ágitur, ab eis proculdúbio
      stultum putátur; et quidquid in ópere véritas ápprobat, carnáli sapiéntiæ
      fátuum sonat. Quid namque stúltius vidétur mundo, quam mentem verbis
      osténdere, nil cállida machinatióne simuláre, nullas injúriis contumélias
      réddere, pro maledicéntibus oráre, paupertátem quærere, posséssa
      relínquere, rapiénti non resístere, percutiénti álteram maxíllam præbére?"
  lectio6-in-2-loco:
    - "!Cap. 17 post init."
    - "Lampas contémpta apud cogitatiónes dívitum. Sæpe contíngit, ut eléctus
      quisque, qui ad ætérnam felicitátem dúcitur, contínua hic adversitáte
      deprimátur; non hunc rerum abundántia fúlciat, non dignitátum glória
      honorábilem osténdat, nulla ei obsequéntium frequéntia súppetat, nulla
      hunc humánis óculis véstium pompa compónat. A cunctis vero despicábilis
      cérnitur, et hujus mundi grátia indígnus æstimátur; sed tamen ante occúlti
      júdicis óculos virtútibus émicat, vitæ méritis corúscat: honorári métuit,
      déspici non réfugit: corpus continéntia áfficit, sola in ánimo dilectióne
      pinguéscit: mentem semper ad patiéntiam præparat, er, eréctus pro
      justítia, de percéptis contuméliis exsúltat: afflíctis ex corde
      compátitur, de bonórum prosperitátibus quasi de própriis lætátur, sacri
      verbi pábula in mente sollícitus rúminat, et, inquisítus, quódlibet éloqui
      duplíciter ignórat."
  lectio7-in-2-loco:
    - Léctio sancti Evangélii secúndum Lucam
    - "!Luc 12:32-34"
    - "In illo témpore: Dixit Jesus discípulis suis: Nolíte timére pusíllus
      grex, quia complácuit Patri vestro dare vobis regnum. Et réliqua."
    - _
    - Homilía sancti Bedæ Venerábilis Presbýteri
    - "!Lib. 4, Cap. 54, in Luc. 12"
    - "Pusíllum gregem electórum, vel ob comparatiónem majóris númeri
      reprobórum, vel pótius ob humilitátis devotiónem nóminat: quia vidélicet
      Ecclésiam suam quantálibet numerositáte jam dilatátam, tamen usque ad
      finem mundi humilitáte vult créscere, et ad promíssum regnum humilitáte
      perveníre. Ideóque ejus labóres blande consolátus, quam regnum Dei tantum
      quærére prǽcipit, eídem regnum a Patre dandum complácita benignitáte
      promíttit."
  lectio8-in-2-loco:
    - "Véndite quæ possidétis, et date eleemósynam. Nolíte, inquit, timére, ne
      propter regnum Dei militántibus, hujus vitæ necessária desint: quin étiam
      posséssa propter eleemósynam véndite. Quod tunc digne fit, quando quis
      semel pro Dómino suis ómnibus spretis, nihilóminus post hæc labóre mánuum,
      unde et victum transígere, et eleemósynam dare queat, operátur. Unde
      gloriátur Apóstolus, dicens: Argéntum, et aurum, aut vestem nullíus
      concupívi: ipsi scitis, quóniam ad ea quæ mihi opus erant, et his qui
      mecum sunt, ministravérunt manus istæ. Ómnia osténdi vobis, quóniam sic
      laborántes opórtet suscípere infírmos."
  lectio9-in-2-loco:
    - "Fácite vobis sácculos qui non veteráscunt: eleemósynas vidélicet operándo
      quarum merces in ætérnum máneat. Ubi non hoc præcéptum esse putándum est,
      ut nil pecúniæ reservétur a sanctis, vel suis scílicet, vel páuperum
      úsibus suggeréndæ: cum et ipse Dóminus, cui ministrábant Ángeli, tamen ad
      informándam Ecclésiam suam lóculos habuísse legátur, et a fidélibus obláta
      consérvans, et suórum necessitátibus aliísque indigéntibus tríbuens; sed
      ne Deo propter ista serviátur, et ob inópiæ timórem justítia deserátur."
    - "&teDeum"
  lectio7-in-3-loco:
    - Léctio sancti Evangélii secúndum Lucam
    - "!Luc 19:12-26"
    - "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Homo quidam
      nóbilis ábiit in regiónem longinquam, accípere sibi regnum, et revérti. Et
      réliqua."
    - _
    - Homilía sancti Ambrósii Epíscopi
    - "!Lib. 8. in Lucam."
    - "Bonus ordo, ut vocatúrus gentes, et Judǽos jussúrus intérfici, qui
      noluérunt regnáre supra se Christum, hanc præmítteret comparatiónem, ne
      dicerétur: Nihil déderat pópulo Judæórum, unde póterat mélior fíeri? ut
      quid ab eo qui nihil recépit, exígitur? Non medíocris ista est mna, quam
      supra múlier evangélica quia non invénit, lucérnam accéndit, lúmine quærit
      admóto, gratulátur invéntam."
  lectio8-in-3-loco:
    - "Dénique ex una decem mnas álius fecit, álius quinque. Fortásse iste
      morália habet, quia quinque sunt córporis sensus: ille duplícia, id est,
      mýstica legis, et morália probitátis. Unde et Matthǽus quinque talénta, et
      duo talénta pósuit: in quinque taléntis ut sint morália, in duóbus
      utrúmque, mýsticum atque morále. Ita quod número inférius, re ubérius."
  lectio9-in-3-loco:
    - Et hic póssumus decem mnas decem verba intellígere, id est, legis
      doctrínam; quinque autem mnas, magistéria disciplínæ. Sed legisperítum in
      ómnibus volo esse perféctum; non enim in sermóne, sed in virtúte est
      regnum Dei. Bene autem, quia de Judǽis dicit, duo soli multiplicátam
      pecúniam déferunt, non útique æris, sed dispensatiónis usúris. Ália est
      enim pecúniæ fœnébris, ália doctrínæ cæléstis usúra.
    - "&teDeum"
