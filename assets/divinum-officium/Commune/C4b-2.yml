  lectio1:
    - De libro Ecclesiástici
    - "!Sir 39:1-5"
    - 1 Sapiéntiam ómnium antiquórum exquíret sápiens, et in prophétis vacábit.
    - 2 Narratiónem virórum nominatórum conservábit, et in versútias parabolárum
      simul introíbit.
    - 3 Occúlta proverbiórum exquíret, et in abscónditis parabolárum
      conversábitur.
    - 4 In médio magnatórum ministrábit, et in conspéctu prǽsidis apparébit.
    - 5 In terram alienigenárum géntium pertránsiet; bona enim et mala in
      homínibus tentábit.
  lectio2:
    - "!Sir 39:6-10"
    - 6 Cor suum tradet ad vigilándum dilúculo ad Dóminum, qui fecit illum, et
      in conspéctu Altíssimi deprecábitur.
    - 7 Apériet os suum in oratióne, et pro delíctis suis deprecábitur.
    - "8 Si enim Dóminus magnus volúerit, spíritu intellegéntiæ replébit illum:"
    - "9 et ipse tamquam imbres mittet elóquia sapiéntiæ suæ, et in oratióne
      confitébitur Dómino:"
    - 10 et ipse díriget consílium ejus, et disciplínam, et in abscónditis suis
      consiliábitur.
  lectio3:
    - "!Sir 39:11-14"
    - 11 Ipse palam fáciet disciplínam doctrínæ suæ, et in lege testaménti
      Dómini gloriábitur.
    - 12 Collaudábunt multi sapiéntiam ejus, et usque in sǽculum non delébitur.
    - 13 Non recédet memória ejus, et nomen ejus requirétur a generatióne in
      generatiónem.
    - 14 Sapiéntiam ejus enarrábunt gentes, et laudem ejus enuntiábit Ecclésia.
  lectio4:
    - Ex libro Morálium sancti Gregórii Papæ
    - "!Lib. 9. cap. 11., n. 45"
    - Qui, post Oríonas, Hýadum nómine, nisi Doctóres sanctæ Ecclésiæ
      designántur? Qui, subdúctis Martýribus, eo jam témpore ad mundi notítiam
      venérunt, quo fides clárius elúcet, et, représsa infidelitátis híeme,
      áltius per corda fidélium sol veritátis calet. Qui, remóta tempestáte
      persecutiónis, explétis longis nóctibus infidelitátis, tunc sanctæ
      Ecclésiæ orti sunt, cum ei jam per credulitátis vernum lucídior annus
      aperítur.
  lectio5:
    - "Nec immérito Doctóres sancti Hýadum nuncupatióne signántur. Græco quippe
      elóquio hýetos plúvia vocátur, et Hýades nomen a plúviis accepérunt, quia
      ortæ procul dúbio imbres ferunt. Bene ergo Hýadum appellatióne expréssi
      sunt, qui, ad statum universális Ecclésiæ quasi in cæli fáciem dedúcti,
      super aréntem terram humáni péctoris, sanctæ prædicatiónis imbres
      fudérunt. Si enim prædicatiónis sermo plúvia non esset, Móyses mínime
      dixísset: Exspectétur sicut plúvia elóquium meum; et nequáquam per Isaíam
      Véritas díceret: Mandábo núbibus meis, ne pluant super eam imbrem; atque
      hoc, quod paulo ante protúlimus: Quam ob rem prohíbitæ sunt stellæ
      pluviárum."
  lectio6:
    - "Dum ergo Hýades cum plúviis véniunt, ad cæli spátia altióra sol dúcitur:
      quia, apparénte Doctórum sciéntia, dum mens nostra imbre prædicatiónis
      infúnditur, fídei calor augétur. Et perfúsa terra ad fructum próficit, cum
      lumen ætheris ignéscit: quia ubérius frugem boni óperis réddimus, dum per
      sacræ eruditiónis flammam in corde clárius ardémus. Dumque per eos diébus
      síngulis magis magísque sciéntia cæléstis osténditur, quasi intérni nobis
      lúminis vernum tempus aperítur; ut novus sol nostris méntibus rútilet, et,
      eórum verbis nobis cógnitus, seípso quotídie clárior micet. Urgénte étenim
      mundi fine, supérna sciéntia próficit, et lárgius cum témpore excréscit."
  lectio7:
    - Léctio sancti Evangélii secúndum Matthǽum
    - "!Matt 5:13-19"
    - "In illo témpore: Dixit Jesus discípulis suis: Vos estis sal terræ. Quod
      si sal evanúerit, in quo saliétur? Et réliqua."
    - _
    - Homilía sancti Augustíni Epíscopi
    - "!Lib. 1 de Sermone Domini in monte, cap. 6"
    - Osténdit Dóminus fátuos esse judicándos, qui temporálium bonórum vel
      cópiam sectántes vel inópiam metuéntes, amíttunt ætérna, quæ nec dari
      possunt ab homínibus nec auférri.  Itaque, si sal infatuátum fúerit, in
      quo saliétur? Id est, si vos, per quos condiéndi sunt quodámmodo pópuli,
      metu persecutiónum temporálium amiséritis regna cælórum; qui erunt
      hómines, per quos a vobis error auferátur, cum vos elégerit Deus, per quos
      errórem áuferat ceterórum?
  lectio8:
    - Ergo ad níhilum valet sal infatuátum, nisi ut mittátur foras et calcétur
      ab homínibus.  Non ítaque calcátur ab homínibus qui pátitur persecutiónem;
      sed qui, persecutiónem timéndo, infatuátur. Calcári enim non potest nisi
      inférior; sed inférior non est, qui, quamvis córpore multa in terra
      sustíneat, corde tamen fixus in cælo est.
  responsory8:
