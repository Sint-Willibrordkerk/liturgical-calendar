      - De Homilía venerábilis Bedæ Presbýteri
      - "!In Natali S. Benedicti"
      - "Duo sunt órdines electórum in judício futúri: unus judicántium cum
        Dómino, de quibus hoc loco mémorat, qui reliquérunt ómnia, et secúti
        sunt illum: alius judicandórum a Dómino, qui non quidem ómnia sua
        páriter reliquérunt, sed de his tamen quæ habébant, quotidiánas dare
        eleemósynas Christi paupéribus curábant: unde et auditúri sunt in
        judício: Veníte, benedícti Patris mei, possidíte præparátum vobis regnum
        a constitutióne mundi. Esurívi enim, et dedístis mihi manducáre: sitívi,
        et dedístis mihi bíbere."
    responsory7-in-4-loco:
      - "R. Iste est qui ante Deum magnas virtútes operátus est, et de omni
        corde suo laudávit Dóminum:"
      - "* Ipse intercédat pro peccátis ómnium populórum."
      - V. Ecce homo sine queréla, verus Dei cultor, ábstinens se ab omni ópere
        malo, et pérmanens in innocéntia sua.
      - R. Ipse intercédat pro peccátis ómnium populórum.
    lectio8-in-4-loco:
      - "Sed et reprobórum duos ibi futúros órdines Dómino narránte comperímus:
        unum eórum, qui fídei christiánæ mystériis initiáti, ópera fídei
        exercére contémnunt, quibus in judício testátur: Discédite a me
        maledícti in ignem aetérnum, qui præparátus est diábolo, et ángelis
        ejus: esurívi enim, et non dedístis mihi manducáre. Alterum eórum, qui
        fidem et mystéria Christi vel numquam suscepére, vel suscéptam per
        apostasíam deseruére: de quibus dicit: Qui autem non credit, jam
        judicatus est: quia non credit in nómine unigéniti Fílii Dei."
    responsory8-in-4-loco:
      - "R. Sint lumbi vestri præcíncti, et lucérnæ ardéntes in mánibus vestris:"
