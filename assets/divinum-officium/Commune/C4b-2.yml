        revertátur a núptiis."
      - V. Vigiláte ergo, quia nescítis qua hora Dóminus vester ventúrus sit.
      - R. Et vos símiles homínibus exspectántibus dóminum suum, quando
        revertátur a núptiis.
      - "&Gloria"
      - R. Et vos símiles homínibus exspectántibus dóminum suum, quando
        revertátur a núptiis.
    lectio9-in-4-loco:
      - "Verum his cum timóre et pavóre débito paulísper commemorátis, ad
        lætíssima pótius Dómini et Salvatóris nostri promíssa convertámus
        audítum. Videámus quæ tantæ grátia pietátis: non ætérnae tantúmmodo vitæ
        præmia suis sequácibus, sed et præséntis múnera pollicétur exímia. Et
        omnis, inquit, qui relíquerit domum, vel fratres, aut soróres, aut
        patrem, aut matrem, aut uxórem, aut fílios, aut agros, propter nomen
        meum, céntuplum accípiet, et vitam ætérnam possidébit. Qui enim terrénis
        afféctibus sive possessiónibus pro Christi discipulátu renuntiáverit,
        quo plus in ejus amórem profécerit, eo plures invéniet, qui se intérno
        suscípere afféctu, et suis gáudeant sustentáre substántiis."
      - "&teDeum"
