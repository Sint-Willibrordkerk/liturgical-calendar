    - V. Jucunditátem et exsultatiónem thesaurizávit super eum.
    - R. Et implévit eum Dóminus spíritu sapiéntiæ et intelléctus.
    - "&Gloria"
    - R. Et implévit eum Dóminus spíritu sapiéntiæ et intelléctus.
  lectio9:
    - Vos estis lumen mundi. Quómodo dixit supérius sal terræ, sic nunc dicit
      lumen mundi. Nam, neque supérius ista terra accipiénda est, quam pédibus
      corpóreis calcámus; sed hómines, qui in terra hábitant, vel étiam
      peccatóres, quorum condiéndis et exstinguéndis putóribus apostólicum salem
      Dóminus misit. Et hic mundum non cælum et terram, sed hómines qui sunt in
      mundo vel díligunt mundum, opórtet intélligi; quibus illuminándis Apóstoli
      missi sunt. Non potest cívitas abscóndi super montem pósita; id est,
      fundáta super insígnem magnámque justítiam, quam signíficat étiam ipse
      mons, in quo dísputat Dóminus.
    - "&teDeum"
  ant-3:
    - O Doctor óptime, * Ecclésiæ sanctæ lumen, beáte N., divínæ legis amátor,
      deprecáre pro nobis Fílium Dei.
  lectio7-in-2-loco:
    - Léctio sancti Evangélii secúndum Matthǽum
    - "!Matt 5:13-19"
    - "In illo témpore: Dixit Jesus discípulis suis: Vos estis sal terræ. Quod
      si sal evanúerit, in quo saliétur? Et réliqua."
    - _
    - Homilía sancti Hilárii Epíscopi
    - "!Comm. in Matthæum, cap. 4, n. 10"
    - "Vos estis sal terræ: Quod si sal infatuátum fúerit, ad níhilum valet id
      quod saliétur. Sal, ut árbitror, terræ nullum est. Quómodo ergo Apóstolos
      sal terræ nuncupávit? Sed propríetas est quærénda dictórum, quam et
      Apostolórum offícium, et ipsíus salis natúra monstrábit. Sal est in se uno
      cóntinens aquæ et ignis eleméntum, et hoc ex duóbus est unum."
  lectio8-in-2-loco:
    - Hic ígitur in omnem usum humáni géneris efféctus, incorruptiónem
      corpóribus, quibus fúerit aspérsus, impértit, et ad omnem sensum cónditi
      sapóris aptíssimus est. Apóstoli autem sunt rerum cæléstium prædicatóres,
      et æternitátis velut satóres, immortalitátem ómnibus corpóribus, quibus
      eórum sermo aspérsus fúerit, conferéntes. Mérito ígitur sal terræ
      nuncupáti sunt, per doctrínæ virtútem saliéndi modo æternitáti córpora
      reservántes.
  lectio9-in-2-loco:
    - "Sed natúra salis semper éadem est, nec immutári umquam potest. Verum quia
      conversióni homo súbjacet, et solus beátus, qui usque ad finem in ómnibus
      Dei opéribus permánserit: ídeo eos sal terræ nuncupátos monet in tráditæ
      sibi potestátis virtúte persístere, ne infatuáti nihil sáliant, et ipsi,
      sensu accépti sapóris amísso, vivificáre corrúpta non possint, et projécti
      de Ecclésiæ promptuáriis, cum his quos salíerint, pédibus incedéntium
      proterántur."
    - "&teDeum"
  lectio7-in-3-loco:
    - Léctio sancti Evangélii secúndum Matthǽum
    - "!Matt 5:13-19"
    - "In illo témpore: Dixit Jesus discípulis suis: Vos estis sal terræ. Quod
      si sal evanúerit, in quo saliétur? Et réliqua."
    - _
    - Homilía sancti Joánnis Chrysóstomi
    - "!Homilia 15 in Matthæum, sub medium"
    - "Atténdite quid díxerit, Vos estis sal terræ: per quod osténdit quam
      necessário ista præcípiat. Non enim de vestra, inquit, tantúmmodo vita,
      sed de univérso orbe vobis ratio reddénda est. Non ad duas quippe urbes,
      aut decem, aut vigínti, neque ad unam gentem vos mitto, sicut mittébam
      prophétas: sed ad omnem terram prorsus ac mare, totúmque mundum, et hunc
      váriis crimínibus oppréssum."
  lectio8-in-3-loco:
    - "Dicéndo enim, Vos estis sal terræ, osténdit univérsam hóminum infatuátam
      esse natúram, et peccatórum vi corrúptam: et idcírco illas ab eis virtútes
      requírit, quæ máxime ad multórum salútem procurándam necessáriæ sunt atque
      útiles. Nam qui mansuétus est ac modéstus, et miséricors et justus, non
      intra se tantúmmodo hæc recte facta conclúdit, verum in aliórum quoque
      utilitátem præcláros hos fáciet efflúere fontes. Igitur qui corde mundo
      est atque pacíficus, et persecutiónem pro veritáte pátitur, nihilóminus in
      commúne cómmodum vitam instítuit."
  lectio9-in-3-loco:
    - "Ne ígitur putétis, inquit, ad lévia vos ducéndos esse certámina, neque
      exiguárum rerum vobis ineúndam esse ratiónem. Vos estis sal terræ. Quid
      ígitur? Ipsine putrefácta medicáti sunt? Nequáquam: neque enim fíeri
      potest, ut ea quæ jam corrúpta sunt, salis perfricatióne reparéntur. Non
      ergo hoc fecérunt, sed ante renováta, sibíque trádita, atque ab illa jam
      putrédine liberáta, aspergébant sale, et in ea novitáte conservábant, quam
      a Dómino suscéperant. Liberáre quippe a putrédine peccatórum, Christi
      virtútis est: ut autem ad illa íterum non revertántur, Apostolórum curæ
      est ac labóris."
    - "&teDeum"
  introitus:
    - "!Eccli 15:5"
    - "v. In médio Ecclésiæ apéruit os ejus: et implévit eum Dóminus spíritu
      sapiéntiæ et intelléctus: stolam glóriæ índuit eum. (Allelúja, allelúja.)"
    - "!Ps 91:2"
    - "Bonum est confitéri Dómino: et psállere nómini tuo, Altíssime."
    - "&Gloria"
    - "v. In médio Ecclésiæ apéruit os ejus: et implévit eum Dóminus spíritu
      sapiéntiæ et intelléctus: stolam glóriæ índuit eum. (Allelúja, allelúja.)"
  lectio:
    - Léctio Epístolæ beáti Pauli Apóstoli ad Timótheum
    - "!2 Tim 4:1-8"
    - "Caríssime: Testíficor coram Deo, et Jesu Christo, qui judicatúrus est
      vivos et mórtuos, per advéntum ipsíus et regnum ejus: prǽdica verbum,
      insta opportúne, importune: árgue, óbsecra, íncrepa in omni patiéntia, et
      doctrína. Erit enim tempus, cum sanam doctrínam non sustinébunt, sed ad
      sua desidéria, coacervábunt sibi magistros, pruriéntes áuribus, et a
      veritáte quidem audítum avértent, ad fábulas autem converténtur. Tu vero
      vígila, in ómnibus labóra, opus fac Evangelístæ, ministérium tuum imple.
      Sóbrius esto. Ego enim jam delíbor, et tempus resolutiónis meæ instat.
      Bonum certámen certávi, cursum consummávi, fidem servávi. In réliquo
      repósita est mihi coróna justítiæ, quam reddet mihi Dóminus in illa die,
      justus judex: non solum autem mihi, sed et iis, qui díligunt advéntum
      ejus."
  graduale:
    - "!Ps 36:30-31"
    - Os justi meditábitur sapiéntiam, et lingua ejus loquétur judícium.
    - "V. Lex Dei ejus in corde ipsíus: et non supplantabúntur gressus ejus."
    - Allelúja, allelúja.
    - "!Eccli 45:9"
    - "Amávit eum Dóminus, et ornávit eum: stolam glóriæ índuit eum. Allelúja."
  gradualep:
    - Allelúja, allelúja.
    - "!Eccli 45:9"
    - "Amávit eum Dóminus, et ornávit eum: stolam glóriæ índuit eum."
    - "!Osee 14:6"
    - "Justus germinábit sicut lílium: et florébit in ætérnum ante Dóminum.
      Allelúja."
  tractus:
    - "!Ps 36:30-31"
    - Os justi meditábitur sapiéntiam, et lingua ejus loquétur judícium.
    - "V. Lex Dei ejus in corde ipsíus: et non supplantabúntur gressus ejus."
    - "!Ps 111:1-3"
    - "Beátus vir, qui timet Dóminum: in mandátis ejus cupit nimis."
    - "V. Potens in terra erit semen ejus: generátio rectórum benedicétur."
    - "V. Glória et divítiæ in domo ejus: et justítia ejus manet in sǽculum
      sǽculi."
  evangelium:
    - Sequéntia ++ sancti Evangélii secúndum Matthǽum
    - "!Matt 5:13-19"
    - "In illo témpore: Dixit Jesus discípulis suis: Vos estis sal terræ. Quod
      si sal evanúerit, in quo saliétur? Ad níhilum valet ultra, nisi ut
      mittátur foras, et conculcétur ab homínibus. Vos estis lux mundi. Non
      potest cívitas abscóndi supra montem pósita. Neque accéndunt lucérnam, et
      ponunt eam sub módio, sed super candelábrum, ut lúceat ómnibus, qui in
      domo sunt. Sic luceat lux vestra coram homínibus, ut vídeant ópera vestra
      bona, et gloríficent Patrem vestrum, qui in cœlis est. Nolíte putáre,
      quóniam veni sólvere legem aut prophétas: non veni sólvere, sed adimplére.
      Amen, quippe dico vobis, donec tránseat cœlum et terra, jota unum aut unus
      apex non præteríbit a lege, donec ómnia fiant. Qui ergo sólverit unum de
      mandátis istis mínimis, et docúerit sic hómines, mínimus vocábitur in
      regno cœlórum: qui autem fécerit et docúerit, hic magnus vocábitur in
      regno cœlórum."
  offertorium:
    - "!Ps 91:13"
    - "Justus ut palma florébit: sicut cedrus, quæ in Líbano est,
      multiplicábitur. (Allelúja.)"
  secreta:
    - "Sancti N. Pontíficis tui atque Doctóris nobis, Dómine, pia non desit
      orátio: quæ et múnera nostra concíliet; et tuam nobis indulgéntiam semper
      obtíneat."
    - $Per Dominum
  postcommunio:
    - "Ut nobis, Dómine, tua sacrifícia dent salútem: beátus N. Póntifex tuus et
      Doctor egrégius, quǽsumus, precátor accédat."
    - $Per Dominum
  lectio-in-2-loco:
    - Léctio libri Sapiéntiæ
    - "!Eccli 39:6-14"
    - "Justus cor suum tradet ad vigilándum dilúculo ad Dóminum, qui fecit
      illum, et in conspéctu Altíssimi deprecábitur. Apériet os suum in
      oratióne, et pro delíctis suis deprecábitur. Si enim Dóminus magnus
      volúerit, spíritu intellegéntias replébit illum: et ipse tamquam imbres
      mittet elóquia sapiéntiæ suæ, et in oratióne confitébitur Dómino: et ipse
      díriget consílium ejus et disciplínam, et in abscónditis suis
      consiliábitur. Ipse palam fáciet disciplínam doctrínæ suæ, et in lege
      testaménti Dómini gloriábitur. Collaudábunt multi sapiéntiam ejus, et
      usque in sǽculum non delébitur. Non recédet memória ejus, et nomen ejus
      requirétur a generatióne in generatiónem. Sapiéntiam ejus enarrábunt
      gentes, et laudem ejus enuntiábit ecclésia."
