evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 2:15-20"
  - "In illo témpore: Pastóres loquebántur ad ínvicem: Transeámus usque
    Béthlehem, et videámus hoc verbum, quod factum est, quod Dóminus osténdit
    nobis. Et venérunt festinántes, et invenérunt Maríam, et Joseph, et Infántem
    pósitum in præsépio. Vidéntes autem cognovérunt de verbo, quod dictum erat
    illis de Púero hoc. Et omnes, qui audiérunt, miráti sunt: et de his, quæ
    dicta erant a pastóribus ad ipsos. María autem conservábat ómnia verba hæc,
    cónferens in corde suo. Et revérsi sunt pastores, glorificántes et laudántes
    Deum in ómnibus, quæ audíerant et víderant, sicut dictum est ad illos."
offertorium:
  - "Felix namque es, sacra Virgo María, et omni laude digníssima: quia ex te
    ortus est sol justítiæ, Christus, Deus noster."
postcommunio:
  - "Hæc nos commúnio, Dómine, purget a crímine: et, intercedénte beáta Vírgine
    Dei Genetríce María, cœléstis remédii fáciat esse consórtes."
  - $Per eundem
