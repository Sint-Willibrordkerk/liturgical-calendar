  lectio-m01:
    - Ex Epístola sancti Ambrósii Epíscopi ad Sirícium Papam
    - "!Epist. 81, alias 7, post initium"
    - "De via perversitátis prodúntur dícere: Virgo concépit, sed non virgo
      generávit. Pótuit ergo virgo concípere, non pótuit virgo generáre, cum
      semper concéptus præcédat, partus sequátur? Sed, si doctrínis non créditur
      sacerdótum, credátur oráculis Christi; credátur mónitis Angelórum
      dicéntium: Quia non est impossíbile Deo omne verbum; credátur Sýmbolo
      Apostolórum, quod Ecclésia Romána intemerátum semper custódit et servat.
      Audívit María vocem Angeli, et, quæ ante díxerat: Quómodo fiet istud; non
      de fide generatiónis intérrogans, respóndit póstea: Ecce ancílla Dómini,
      contíngat mihi secúndum verbum tuum."
    - "&teDeum"
  lectio-m02:
    - Ex libro sancti Hierónymi Presbýteri advérsus Joviniánum
    - "!Apologia ad Pammachium pro lib. adversus Jovinianum, in fine"
    - "Christus virgo, Mater vírginis nostri virgo perpétua, mater et virgo.
      Jesus enim clausis ingréssus est óstiis; et in sepúlcro ejus, quod novum
      et in petra duríssima fúerat excísum, nec ántea quis nec póstea pósitus
      est. Hortus conclúsus, fons signátus. De quo fonte ille flúvius manat,
      juxta Joël, qui írrigat torréntem vel fúnium vel spinárum: fúnium,
      peccatórum, quibus ante alligabámur; spinárum, quæ suffócant seméntem
      patrisfamílias. Hæc est porta orientális, ut ait Ezéchiel, semper clausa
      et lúcida, opériens in se vel ex se próferens Sancta sanctórum; per quam
      Sol justítiæ et Póntifex noster secúndum órdinem Melchísedech ingréditur
      et egréditur."
    - "&teDeum"
  lectio-m03:
    - Ex libro sancti Irenǽi Epíscopi et Mártyris advérsus hǽreses
    - "!Lib. 5, c. 19"
    - "In sua própria veniénte Dómino et sua própria eum bajulánte conditióne,
      quæ bajulátur ab ipso, et recapitulatiónem ejus quæ in ligno fuit
      inobediéntiæ, per eam quæ in ligno est obediéntiam, faciénte, et
      seductióne illa solúta, qua sedúcta est male illa, quæ jam viro destináta
      erat, virgo Heva; per veritátem evangelizáta est bene ab Angelo jam sub
      viro Virgo María. Quemádmodum enim illa per Angélicum sermónem sedúcta
      est, ut effúgeret Deum, prævaricáta verbum ejus: ita et hæc per Angélicum
      sermónem evangelizáta est, ut portáret Deum, obédiens ejus verbo. Et sicut
      illa sedúcta est, ut effúgeret Deum; sic hæc suása est obedíre Deo, ut
      vírginis Hevæ Virgo María fíeret advocáta. Et quemádmodum adstríctum est
      morte genus humánum per vírginem, solvátur per Vírginem: æqua lance
      dispósita virginális inobediéntia per Virginitátem obediéntiam."
    - "&teDeum"
  lectio-m04:
    - De Expositióne sancti Hierónymi Presbýteri in Ezechiélem Prophétam
    - "!Lib. 13 in cap. 44"
    - "Porta hæc clausa erit, et non aperiétur. Pulchre quidam portam clausam,
      per quam solus Dóminus Deus Israël ingréditur, et dux cui porta clausa
      est, Maríam Vírginem intéllegunt, quæ et ante partum et post partum virgo
      permánsit. Etenim témpore, quo Angelus loquebátur: Spíritus Sanctus véniet
      super te, et virtus Altíssimi obumbrábit te: quod autem nascétur ex te
      Sanctum, vocábitur Fílius Dei; et quando natus est, virgo permánsit
      ætérna; ad confundéndos eos, qui arbitrántur eam post nativitátem
      Salvatóris habuísse de Joseph fílios, ex occasióne fratrum ejus, qui
      vocántur in Evangélio."
    - "&teDeum"
  lectio-m05:
    - Ex Tractátu S. Augustíni Epíscopi de Sýmbolo ad Catechúmenos
    - "!Lib. 3 cap. 4 in fine"
    - "Per féminam mors, per féminam vita: per Hevam intéritus, per Maríam
      salus. Illa, corrúpta, secúta est seductórem: hæc, íntegra, péperit
      Salvatórem. Illa póculum a serpénte propinátum libénter accépit et viro
      trádidit, ex quo simul mereréntur occídi: hæc, grátia cælésti désuper
      infúsa, vitam prótulit, per quam caro mórtua possit resuscitári. Quis est
      qui hæc operátus est, nisi Vírginis Fílius et vírginum Sponsus, qui
      áttulit Matri fecunditátem, sed non ábstulit integritátem?"
    - "&teDeum"
  lectio-m06:
    - Sermo sancti Bernárdi Abbátis
    - "!De Verbis Apocalypsis cap. 12, Signum magnum"
    - Veheménter quidem nobis, dilectíssimi, vir unus et múlier una nocuére;
      sed, grátias Deo, per unum nihilóminus virum et mulíerum unam ómnia
      restaurántur, nec sine magno fǽnore gratiárum. Neque enim sicut delíctum,
      ita et donum; sed excédit damni æstimatiónem benefícii magnitúdo. Sic
      nimírum prudentíssimus et clementíssimus ártifex, quod quassátum fúerat,
      non confrégit, sed utílius omníno refécit, ut vidélicet nobis novum
      formáret Adam ex véteri, Hevam transfúnderet in Maríam.
    - "&teDeum"
  lectio-m07:
    - Ex Epístola sancti Ambrósii Epíscopi ad Sirícium Papam
    - "!Epist. 81, alias 7, circa medium"
    - "Non excédit fidem, quod homo exívit de vírgine, quando petra fontem
      prófluum scaturívit, ferrum super aquas natávit, ambulávit homo super
      aquas. Ergo si hóminem unda portávit, non pótuit hóminem virgo generáre,
      atque hóminem, de quo légimus: Et mittet illis Dóminus hóminem, qui salvos
      fáciet eos et notus erit Dóminus Ægýptiis? In véteri ítaque Testaménto
      virgo Hebræórum per mare duxit exércitum: in novo Testaménto Virgo,
      géneris aula cæléstis, elécta est ad salútem."
    - "&teDeum"
  lectio-m08:
    - De Expositióne sancti Gregórii Papæ in libros Regum
    - "!In 1 Reg. 1"
    - "Fuit vir unus de Ramáthaim Sophim, de monte Ephraim. Potest, hujus montis
      nómine, beatíssima semper Virgo María, Dei Génetrix, designári. Mons
      quippe fuit, quæ omnem eléctæ creatúræ altitúdinem, electiónis suæ
      dignitáte, transcéndit. An non mons sublímis María, quæ, ut ad
      conceptiónem ætérni Verbi pertíngeret, meritórum vérticem, supra omnes
      Angelórum choros, usque ad sólium Deitátis eréxit? Hujus enim montis
      præcellentíssimam dignitátem Isaías vatícinans, ait: Erit in novíssimis
      diébus præparátus mons domus Dómini in vértice móntium. Mons quippe in
      vértice móntium fuit, quia altitúdo Maríæ supra omnes Sanctos refúlsit."
    - "&teDeum"
  lectio-m09:
    - Ex Epístola sancti Leónis Papæ ad Pulchériam Augústam
    - "!Epist. 13, ante medium"
    - Sacraméntum reconcilatiónis nostræ, ante témpora ætérna dispósitum, nullæ
      implébant figúræ; quia nondum supervénerat Spíritus Sanctus in Vírginem
      nec virtus Altíssimi obumbráverat ei, ut, et intra intemeráta víscera,
      ædificánte sibi Sapiéntia domum, Verbum caro fíeret, et, forma Dei ac
      forma servi in unam conveniénte persónam, Creátor témporum nascerétur in
      témpore, et, per quem facta sunt ómnia, ipse inter ómnia gignerétur. Nisi
      enim novus homo, factus in similitúdinem carnis peccáti, nostram
      suscíperet vetustátem, et, consubstantiális Patri, consubstantiális esse
      dignarétur et matri, naturámque sibi nostram solus a peccáto liber uníret;
      sub jugo diáboli generáliter tenerétur humána captívas.
    - "&teDeum"
  lectio-m10:
    - Sermo sancti Bernárdi Abbátis
    - "!Serm. in cap. 12 Apoc., ante med."
    - "Amplectámur Maríæ vestígia, fratres mei, et devotíssima supplicatióne
      beátis illíus pédibus provolvámur. Teneámus eam nec dimittámus, donec
      benedíxerit nobis; potens est enim. Nempe vellus est médium inter rorem et
      áream: múlier inter solem et lunam: María inter Christum et Ecclésiam
      constitúta. Sed forte miráris, non tam vellus opértum rore, quam amíctam
      sole mulíerem. Magna síquidem familiáritas, sed mira omníno vicínitas
      solis et mulíeris. Quómodo enim in tam veheménti fervóre tam frágilis
      natúra subsístit? Mérito quidem admiráris, Móyses sancte, et curiósius
      desíderas intuéri. Verúmtamen solve calceaménta de pédibus tuis, et
      involúcra pone carnálium cogitatiónum, si accédere concupíscis."
    - "&teDeum"
  lectio-m101:
    - Sermo sancti Bernárdi Abbátis
    - "!In Dom. infra Oct. Assumpt. B. Mariæ Virg."
    - Quid ergo sidéreum micat in generatióne Maríæ? Plane quod ex régibus orta,
      quod ex sémine Abrahæ, quod generósa ex stripe Davi. Si id parum vidétur,
      adde quod generatióni illi ob singuláre privilégium sanctitátis divínitus
      nóscitur esse concéssa, quod longe ante eísdem pátribus cǽlitus
      repromíssa, quod mýsticis præfiguráta miráculis, quod oráculis prænuntiáta
      prophéticis. Hanc enim sacerdotális virga, dum sine radíce flóruit; hanc
      Gedeónis vellus, dum in médio siccæ áreæ máduit; hanc in Ezechiélis
      visióne orientális porta, quæ nulli umquam pátuit, præsignábat. Hanc
      dénique præ céteris Isaías nunc virgam de radíce Jesse oritúram
      promittébat, nunc evidéntius vírginem paritúram. Mérito signum hoc magnum
      in cælo apparuísse scríbitur, quod tanto ante de cælo nóscitur fuísse
      promíssum.
    - "&teDeum"
  lectio-m11:
    - De Expositióne S. Basilíi Epíscopi in Isaíam Prophétam
    - "!In cap. 8 post initium"
    - "Accéssi, inquit, ad prophetíssam, et in útero accépit et péperit fílium.
      Quod María prophetíssa fúerit, ad quam próxime accéssit Isaías per
      prænotiónem spíritus, nemo contradíxerit, qui sit memor verbórum Maríæ,
      quæ prophético affláta spíritu elocúta est. Quid enim ait? Magníficat
      ánima mea Dóminum: et exsultávit spíritus meus in Deo, salutári meo. Quia
      respéxit humilitátem ancíllæ suæ: ecce enim ex hoc beátam me dicent omnes
      generatiónes. Quod si ánimum accommodáveris univérsis ejus verbis, non
      útique per dissídium negáveris eam fuísse prophetíssam, quod Dómini
      Spíritus in eam supervénerit, et virtus Altíssimi obumbráverit ei."
    - "&teDeum"
  lectio-m12:
    - Ex libro Officiórum S. Ambrósii Epíscopi
    - "!Lib. 1, cap. 18"
    - "Bonus regéndæ castitátis pudor est comes, qui primus, in ipso cognitiónis
      ingréssu, Dómini Matrem comméndat legéntibus, et tamquam testis lócuples
      dignam quæ ad tale munus eligerétur ástruit: quod in cubículo, quod sola,
      quod salutáta ab Angelo tacet et mota est in intróitu ejus, quod ad
      virílis sexus spéciem peregrínam turbátur aspéctus Vírginis. Itaque,
      quamvis esset húmilis præ verecúndia tamen non resalutávit, nec ullum
      respónsum rétulit, nisi ubi de suscipiénda Dómini generatióne cognóvit; ut
      qualitátem efféctus dísceret, non ut sermónem refélleret."
    - "&teDeum"
  introitus:
    - "!Sedulius"
    - "v. Salve, sancta parens, eníxa puérpera Regem: qui cælum terrámque regit
      in sǽcula sæculórum."
    - "!Ps 44:2"
    - "Eructávit cor meum verbum bonum: dico ego ópera mea Regi."
    - "&Gloria"
    - "v. Salve, sancta parens, eníxa puérpera Regem: qui cælum terrámque regit
      in sǽcula sæculórum."
  lectio:
    - Léctio libri Sapiéntiæ
    - "!Eccli 24:14-16"
    - Ab inítio et ante sǽcula creáta sum, et usque ad futúrum sǽculum non
      désinam, et in habitatióne sancta coram ipso ministrávi. Et sic in Sion
      firmáta sum, et in civitáte sanctificáta simíliter requiévi, et in
      Jerúsalem potéstas mea. Et radicávi in pópulo honorificáto, et in parte
      Dei mei heréditas illíus, et in plenitúdine sanctórum deténtio mea.
  graduale:
    - "Benedícta et venerábilis es, Virgo María: quæ sine tactu pudóris invénta
      es Mater Salvatóris."
    - V. Virgo, Dei Génetrix, quem totus non capit orbis, in tua se clausit
      víscera factus homo. Allelúja, allelúja.
    - "V. Post partum, Virgo, invioláta permansísti: Dei Génetrix, intercéde pro
