  evangelium:
    - Sequéntia ++ sancti Evangélii secúndum Lucam
    - "!Luc 11:27-28"
    - "In illo témpore: Loquénte Jesu ad turbas, extóllens vocem quædam múlier
      de turba, dixit illi: Beátus venter, qui te portávit, et úbera, quæ
      suxísti. At ille dixit: Quinímmo beáti, qui áudiunt verbum Dei, et
      custódiunt illud."
  offertorium:
    - "!Luc 1:28 1:42"
    - "Ave, María, grátia plena; Dóminus tecum: benedícta tu in muliéribus, et
      benedíctus fructus ventris tui. (Allelúja.)"
  secreta:
    - Tua, Dómine, propitiatióne, et beátæ Maríæ semper Vírginis intercessióne,
      ad perpétuam atque præséntem hæc oblátio nobis profíciat prosperitátem et
      pacem.
    - $Per Dominum
  communio:
    - Beáta víscera Maríæ Vírginis, quæ portavérunt ætérni Patris Fílium.
      (Allelúja.)
  postcommunio:
    - "Sumptis, Dómine, salútis nostræ subsídiis: da, quǽsumus, beátæ Maríæ
      semper Vírginis patrocíniis nos ubíque prótegi; in cujus veneratióne hæc
      tuæ obtúlimus majestáti."
    - $Per Dominum
missa:
  - Vultum tuum (a Nativitate usque ad Purificationem)
ant-1:
  - "Magnum * hereditátis mystérium: templum Dei factus est úterus nesciéntis
    virum: non est pollútus ex ea carnem assúmens; omnes gentes vénient
    dicéntes: Glória tibi, Dómine."
oratio:
  - "Deus, qui salútis ætérnæ, beátæ Maríæ virginitáte fecúnda, humáno generi
    præmia præstitísti: tríbue, quǽsumus; ut ipsam pro nobis intercédere
    sentiámus, per quam merúimus auctórem vitæ suscípere, Dóminum nostrum Jesum
    Christum, Fílium tuum:"
  - $Qui tecum
rubrica-tridentina/ant-laudes:
  - "O admirábile commércium: * Creátor géneris humáni, animátum corpus sumens,
    de Vírgine nasci dignátus est; et procédens homo sine sémine, largítus est
    nobis suam Deitátem.;;109"
  - "Quando natus es * ineffabíliter ex Vírgine, tunc implétæ sunt Scriptúræ:
    sicut plúvia in vellus descendísti, ut salvum fáceres genus humánum: te
    laudámus, Deus noster.;;112"
  - "Rubum, quem víderat Móyses * incombústum, conservátam agnóvimus tuam
    laudábilem virginitátem: Dei Génetrix, intercéde pro nobis.;;121"
  - "Germinávit radix Jesse, * orta est stella ex Jacob: Virgo péperit
    Salvatórem; te laudámus, Deus noster.;;126"
  - "Ecce María génuit * nobis Salvatórem, quem Joánnes videns, exclamávit,
    dicens: Ecce Agnus Dei, ecce qui tollit peccáta mundi, allelúja.;;147"
ant-2:
  - "Mirábile mystérium * declarátur hódie: innovántur natúræ, Deus homo factus
    est: id quod fuit permánsit, et quod non erat assúmpsit; non commixtiónem
    passus, neque divisiónem."
