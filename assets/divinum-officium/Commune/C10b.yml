lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Titum
  - "!Tit 3:4-7"
  - "Caríssime: Appáruit benígnitas et humánitas Salvatóris nostri Dei: non ex
    opéribus justítiæ, quæ fécimus nos, sed secúndum suam misericórdiam salvos
    nos fecit, per lavácrum regeneratiónis et renovatiónis Spíritus Sancti, quem
    effúdit in nos abúnde per Jesum Christum, Salvatórem nostrum: ut,
    justificáti grátia ipsíus, herédes simus secúndum spem vitæ ætérnæ: in
    Christo Jesu, Dómino nostro."
