evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 10:26-32"
  - "In illo témpore: Dixit Jesus discípulis suis: Nihil est opértum, quod non
    revelábitur; et occúltum, quod non sciétur. Quod dico vobis in ténebris,
    dícite in lúmine: et quod in aure audítis, prædicáte super tecta. Et nolíte
    timére eos, qui occídunt corpus, ánimam autem non possunt occídere; sed
    pótius timéte eum, qui potest et ánimam et corpus pérdere in gehénnam. Nonne
    duo pásseres asse véneunt: et unus ex illis non cadet super terram sine
    Patre vestro? Vestri autem capílli cápitis omnes numeráti sunt. Nolíte ergo
    timére: multis passéribus melióres estis vos. Omnis ergo, qui confitébitur
    me coram homínibus, confitébor et ego eum coram Patre meo, qui in coelis
    est."
offertorium:
  - "!Ps 20:4-5"
  - "Posuísti, Dómine, in cápite ejus corónam de lápide pretióso: vitam pétiit a
    te, et tribuísti ei, allelúja."
secreta:
  - "Accépta sit in conspéctu tuo, Dómine, nostra devótio: et ejus nobis fiat
    supplicatióne salutáris, pro cujus sollemnitáte defértur."
  - $Per Dominum
communio:
  - "!Joann 12:26"
  - "Qui mihi mínistrat, me sequátur: et ubi sum ego, illic et miníster meus
    erit. (Allelúja.)"
postcommunio:
  - "Refécti participatióne múneris sacri, quǽsumus, Dómine, Deus noster: ut,
    cujus exséquimur cultum, intercedénte beáto N. Mártyre tuo, sentiámus
    efféctum."
  - $Per Dominum
lectio-in-2-loco:
  - Léctio Epístolæ beáti Jacóbi Apóstoli
  - "!Jac 1:2-12."
  - "Caríssimi: Omne gáudium existimáte, cum in tentatiónes várias incidéritis:
    sciéntes, quod probátio fídei vestræ patiéntiam operátur. Patiéntia autem
    opus perféctum habet: ut sitis perfécti et íntegri, in nullo deficiéntes. Si
    quis autem vestrum índiget sapiéntia, póstulet a Deo, qui dat ómnibus
    affluénter, et non impróperat: et dábitur ei. Póstulet autem in fide nihil
    hǽsitans: qui enim hǽsitat, símilis est flúctui maris, qui a vento movétur
    et circumfértur. Non ergo ǽstimet homo ille, quod accípiat áliquid a Dómino.
    Vir duplex ánimo incónstans est in ómnibus viis suis. Gloriétur autem frater
    húmilis in exaltatióne sua: dives autem in humilitáte sua, quóniam sicut
    flos fæni transíbit: exórtus est enim sol cum ardóre, et arefécit fænum, et
    flos ejus décidit et decor vultus ejus depériit: ita et dives in itinéribus
    suis marcéscet. Beátus vir, qui suffert tentatiónem: quóniam, cum probátus
    fúerit, accípiet corónam vitæ, quam repromísit Deus diligéntibus se."
lectio-in-3-loco:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Corínthios
  - "!2 Cor 10:17-18; 11:1-2"
  - "Fratres: Qui gloriátur, in Dómino gloriétur. Non enim, qui seípsum
    comméndat, ille probátus est; sed quem Deus comméndat. Utinam sustinerétis
    módicum quid insipiéntiæ meæ, sed et supportáte me: æmulor enim vos Dei
    æmulatióne. Despóndi enim vos uni viro vírginem castam exhibére Christo."
evangelium-in-2-loco:
  - "@Sancti/02-01"
