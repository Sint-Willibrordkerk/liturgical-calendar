  lectio:
    - Léctio libri Sapiéntiæ
    - "!Sap 10:10-14"
    - "Justum dedúxit Dóminus per vias rectas, et ostendit illi regnum Dei, et
      dedit illi sciéntiam sanctórum: honestávit illum in labóribus, et
      complévit labores illíus. In fraude circumveniéntium illum áffuit illi, et
      honéstum fecit illum. Custodívit illum ab inimícis, et a seductóribus
      tutávit illum, et certámen forte dedit illi, ut vínceret et sciret,
      quóniam ómnium poténtior est sapiéntia. Hæc vénditum justum non
      derelíquit, sed a peccatóribus liberávit eum: descendítque cum illo in
      fóveam, et in vínculis non derelíquit illum, donec afférret illi sceptrum
      regni, et poténtiam advérsus eos, qui eum deprimébant: et mendáces
      osténdit, qui maculavérunt illum, et dedit illi claritátem ætérnam,
      Dóminus, Deus noster."
