  evangelium:
    - Sequéntia ++ sancti Evangélii secúndum Matthǽum
    - "!Matt 10:34-42"
    - "In illo témpore: Dixit Jesus discípulis suis: Nolíte arbitrári, quia
      pacem vénerim míttere in terram: non veni pacem míttere, sed gládium. Veni
      enim separáre hóminem advérsus patrem suum, et fíliam advérsus matrem
      suam, et nurum advérsus socrum suam: et inimíci hóminis doméstici ejus.
      Qui amat patrem aut matrem plus quam me, non est me dignus: et qui amat
      fílium aut fíliam super me, non est me dignus. Et qui non áccipit crucem
      suam, et séquitur me, non est me dignus. Qui invénit ánimam suam, perdet
      illam: et qui perdíderit ánimam suam propter me, invéniet eam. Qui récipit
      vos, me récipit: et qui me récipit, récipit eum, qui me misit. Qui récipit
      prophétam in nómine prophétæ, mercédem prophétæ accípiet: et qui récipit
      justum in nómine justi, mercédem justi accípiet. Et quicúmque potum
      déderit uni ex mínimis istis cálicem aquæ frígidæ tantum in nómine
      discípuli: amen, dico vobis, non perdet mercédem suam."
  offertorium:
    - "!Ps 8:6-7"
    - "Glória et honóre coronásti eum: et constituísti eum super ópera mánuum
      tuárum, Dómine."
  secreta:
    - "Munéribus nostris, quǽsumus, Dómine, precibúsque suscéptis: et cœléstibus
      nos munda mystériis, et cleménter exáudi."
    - $Per Dominum
  communio:
    - "!Matt 16:24"
    - Qui vult veníre post me, ábneget semetípsum, et tollat crucem suam, et
      sequátur me.
  postcommunio:
    - "Da, quǽsumus, Dómine, Deus noster: ut, sicut tuórum commemoratióne
      Sanctórum temporáli gratulámur offício; ita perpétuo lætémur aspéctu."
    - $Per Dominum
missa:
  - Laetabitur
oratio:
  - "Præsta, quǽsumus, omnípotens Deus: ut, intercedénte beáto N. Mártyre tuo,
    et a cunctis adversitátibus liberémur in córpore, et a pravis cogitatiónibus
    mundémur in mente."
  - $Per Dominum
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 10:26-32"
  - "In illo témpore: Dixit Jesus discípulis suis: Nihil est opértum, quod non
    revelábitur; et occúltum, quod non sciétur. Et réliqua."
  - _
  - Homilía sancti Hilárii Epíscopi
  - "!Comment. in Matthaeum, can. 10 post medium"
  - "Dóminus diem judícii osténdit, quæ abstrúsam voluntátis nostræ consciéntiam
    prodet: et ea quæ nunc occúlta existimántur, luce cognitiónis públicæ
    déteget. Ígitur non minas, non consília, non potestátes insectántium monet
    esse metuéndas: quia dies judícii nulla hæc fuísse, atque inánia revelábit.
    Et quod dico vobis in ténebris, dícite in lúmine: et quod in aure audítis,
    prædicáte super tecta. Non légimus Dóminum sólitum fuísse nóctibus
    sermocinári, et doctrínam in ténebris tradidísse: sed quia omnis sermo ejus
    carnálibus ténebræ sunt, et verbum ejus infidélibus nox est."
lectio8:
  - "Ítaque id quod a se dictum est, cum libertáte fídei et confessiónis vult
    esse loquéndum. Idcírco quæ in ténebris dicta sunt prædicári jussit in
    lúmine: ut quæ secréto áurium commíssa sunt, super tecta, id est, excélso
    loquéntium præcónio audiántur. Constánter enim Dei ingerénda cognítio est,
    et profúndum doctrínæ evangélicæ secrétum in lúmine prædicatiónis apostólicæ
    revelándum: non timéntes eos, quibus cum sit licéntia in córpora, tamen in
    ánimam jus nullum est: sed timéntes pótius Deum, cui perdéndæ in gehénna et
    ánimæ et córporis sit potéstas."
lectio9:
  - "Nolíte timére eos qui occídunt corpus. Nullus ígitur córporum nostrórum
    casus est pertimescéndus, neque ullus interiméndæ carnis admitténdus est
    dolor: quando pro natúræ suæ atque oríginis conditióne resolúta, in
    substántiam spirituális ánimæ refundátur. Et quia doctrínis tálibus
    confirmátos opórtet líberam confiténdi Dei habére constántiam, étiam
    conditiónem, qua tenerémur, adjécit: negatúrum se eum Patri in cælis, qui se
    homínibus in terra negásset: eum porro qui conféssus coram homínibus se
    fuísset, a se in cælis confiténdum: qualésque nos nóminis sui testes
    homínibus fuissémus, tali nos apud Deum Patrem testimónio ejus usúros."
  - "&teDeum"
introitus:
  - "!Ps 63:11"
  - "v. Lætábitur justus in Dómino, et sperábit in eo: et laudabúntur omnes
    recti corde. (Allelúja, allelúja.)"
  - "!Ps 63:2"
  - "Exáudi, Deus, oratiónem meam cum déprecor: a timóre inimíci éripe ánimam
    meam."
  - "&Gloria"
  - "v. Lætábitur justus in Dómino, et sperábit in eo: et laudabúntur omnes
    recti corde. (Allelúja, allelúja.)"
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Timótheum
  - "!2 Tim 2:8-10; 3:10-12."
  - "Caríssime: Memor esto, Dóminum Jesum Christum resurrexísse a mórtuis ex
    sémine David, secúndum Evangélium meum, in quo labóro usque ad víncula,
    quasi male óperans: sed verbum Dei non est alligátum. Ideo ómnia sustíneo
    propter eléctos, ut et ipsi salútem consequántur, quæ est in Christo Jesu,
    cum glória coelésti. Tu autem assecútus es meam doctrínam, institutiónem,
    propósitum, fidem, longanimitátem, dilectiónem, patiéntiam, persecutiónes,
    passiónes: quália mihi facta sunt Antiochíæ, Icónii et Lystris: quales
    persecutiónes sustínui, et ex ómnibus erípuit me Dóminus. Et omnes, qui pie
    volunt vívere in Christo Jesu, persecutiónem patiéntur."
graduale:
  - "!Ps 36:24"
  - "Justus cum cecíderit, non collidétur: quia Dóminus suppónit manum suam."
  - "!Ps 36:26"
  - "Tota die miserétur, et cómmodat: et semen ejus in benedictióne erit.
    Allelúja, allelúja"
  - "!Joann 8:12"
  - "Qui séquitur me, non ámbulat in ténebris: sed habébit lumen vitæ ætérnæ.
    Allelúja."
