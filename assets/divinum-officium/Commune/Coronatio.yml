      Dómine. Allelúja."
  communi-summorum-pontificum/tractus:
    - "!Ps 106:32; 106:31"
    - "Exáltent eum in Ecclésia plebis: et in cáthedra seniórum laudent eum."
    - V. Confiteántur Dómino misericórdiæ ejus; et mirabília ejus fíliis hóminum
    - "!Ps 39:10-11"
    - "Annuntiávi justítiam tuam in ecclésia magna, ecce, lábia mea non
      prohibébo: Dómine, tu scisti."
    - "V. Justítiam tuam non abscóndi in corde meo: veritátem tuam et salutáre
      tuum dixi."
    - V. Non abscóndi misericórdiam tuam, et veritátem tuam a concílio multo.
  communi-summorum-pontificum/evangelium:
    - Sequéntia ++ sancti Evangélii secúndum Matthǽum
    - "!Matt 16:13-19"
    - "In illo témpore: Venit Jesus in partes Cæsaréæ Philíppi, et interrogábat
      discípulos suos, dicens: Quem dicunt hómines esse Fílium hóminis? At illi
      dixérunt: Alii Joánnem Baptístam, alii autem Elíam, álii vero Jeremíam,
      aut unum ex prophétis. Dicit illis Jesus: Vos autem quem me esse dícitis?
      Respóndens Simon Petrus, dixit: Tu es Christus, Fílius Dei vivi.
      Respóndens autem Jesus, dixit ei: Beátus es, Simon Bar Jona: quia caro et
      sanguis non revelávit tibi, sed Pater meus, qui in cœlis est. Et ego dico
      tibi, quia tu es Petrus, et super hanc petram ædificábo Ecclésiam meam, et
      portæ ínferi non prævalébunt advérsus eam. Et tibi dabo claves regni
      cœlórum. Et quodcúmque ligáveris super terram, erit ligátum et in cœlis:
      et quodcúmque sólveris super terram, erit solútum et in cœlis."
  communi-summorum-pontificum/offertorium:
    - "!Jer 1:9-10"
    - "Ecce, dedi verba mea in ore tuo: ecce, constítui te super gentes et super
      regna, ut evéllas et déstruas, et ædífices et plantes. (Allelúja.)"
  communi-summorum-pontificum/secreta:
    - "Oblátis munéribus, quǽsumus, Dómine, Ecclésiam tuam benígnus illúmina:
      ut, et gregis tui profíciat ubíque succéssus, et grati fiant nómini tuo,
      te gubernánte, pastóres."
    - $Per Dominum
  communi-summorum-pontificum/secreta-pro-commemoratio:
    - "Múnera, quæ tibi, Dómine, lætántes offérimus, súscipe benígnus, et
      præsta: ut, intercedénte beáto N., Ecclésia tua et fídei integritáte
      lætétur, et témporum tranquillitáte semper exúltet."
    - $Per Dominum
  communi-summorum-pontificum/communio:
    - "!Matt 16:18"
    - Tu es Petrus, et super hanc petram ædificábo Ecclésiam meam. (Allelúja.)
  communi-summorum-pontificum/postcommunio:
    - "Refectióne sancta enutrítam gubérna, quǽsumus, Dómine, tuam placátus
      Ecclésiam: ut, poténti moderatióne dirécta, et increménta libertátis
      accípiat et in religiónis integritáte persístat."
    - $Per Dominum
  communi-summorum-pontificum/postcommunio-pro-commemoratio:
    - "Multíplica, quǽsumus, Dómine, in Ecclésia tua spíritum grátiæ, quem
      dedísti: ut beáti N. Summi Pontíficis deprecatióne nec pastóri obœdiéntia
      gregis nec gregi desit cura pastóris."
    - $Per Dominum
