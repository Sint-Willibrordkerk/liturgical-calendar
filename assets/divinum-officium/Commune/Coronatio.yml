      - "!Homilía 78, de S. Eusebio 2, circa medio"
      - Beáti Patris N. mérita, jam in tuto pósita, secúri magnificémus; qui,
        gubernáculum fídei viríliter tenens, ánchoram spei tranquílla jam in
