oratio:
  - "Deus, ómnium fidélium pastor et rector, fámulum tuum N.p, quem pastórem
    Ecclésiæ tuæ præésse voluísti, propítius réspice: da ei, quǽsumus, verbo et
    exémplo, quibus præest, profícere; ut ad vitam, una cum grege sibi crédito,
    pervéniat sempitérnam."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Petri Apóstoli
  - "!1 Pet 1:1-7"
  - "Petrus, Apóstolus Jesu Christi, eléctis ádvenis dispersiónis Ponti,
    Galátiæ, Cappadóciæ, Asiæ et Bithýniæ secúndum præsciéntiam Dei Patris, in
    sanctificatiónem Spíritus, in obœdiéntiam, et aspersiónem sánguinis Jesu
    Christi: grátia vobis et pax multiplicétur. Benedíctus Deus et Pater Dómini
    nostri Jesu Christi, qui secúndum misericórdiam suam magnam regenerávit nos
    in spem vivam, per resurrectiónem Jesu Christi ex mórtuis, in hereditátem
    incorruptíbilem et incontaminátam et immarcescíbilem, conservátam in cœlis
    in vobis, qui in virtúte Dei custodímini per fidem in salútem, parátam
    revelári in témpore novíssimo. In quo exsultábitis, módicum nunc si opórtet
    contristári in váriis tentatiónibus: ut probátio vestræ fídei multo
    pretiósior auro [quod per ignem probatur] inveniátur in laudem et glóriam et
    honórem, in revelatióne Jesu Christi, Dómini nostri."
