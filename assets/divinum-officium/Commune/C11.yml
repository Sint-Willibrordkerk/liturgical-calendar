evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 11:27-28"
  - "In illo témpore: Loquénte Jesu ad turbas, extóllens vocem quædam múlier de
    turba, dixit illi: Beátus venter, qui te portávit, et úbera, quæ suxísti. At
    ille dixit: Quinímmo beáti, qui áudiunt verbum Dei, et custódiunt illud."
offertorium:
  - "!Luc 1:28 1:42"
  - "Ave, María, grátia plena; Dóminus tecum: benedícta tu in muliéribus, et
    benedíctus fructus ventris tui. (Allelúja.)"
secreta:
  - Tua, Dómine, propitiatióne, et beátæ Maríæ semper Vírginis intercessióne, ad
    perpétuam atque præséntem hæc oblátio nobis profíciat prosperitátem et
    pacem.
  - $Per Dominum
communio:
  - Beáta víscera Maríæ Vírginis, quæ portavérunt ætérni Patris Fílium.
    (Allelúja.)
postcommunio:
  - "Sumptis, Dómine, salútis nostræ subsídiis: da, quǽsumus, beátæ Maríæ semper
    Vírginis patrocíniis nos ubíque prótegi; in cujus veneratióne hæc tuæ
    obtúlimus majestáti."
  - $Per Dominum
