nocturn-1-versum:
  - V. Spécie tua et pulchritúdine tua.
  - R. Inténde, próspere procéde, et regna.
nocturn-2-versum:
  - V. Adjuvábit eam Deus vultu suo.
  - R. Deus in médio ejus, non commovébitur.
nocturn-3-versum:
  - V. Elégit eam Deus, et præelégit eam.
  - R. In tabernáculo suo habitáre facit eam.
lectio1:
  - De Parábolis Salomónis
  - "!Prov 8:12-17"
  - 12 Ego sapiéntia hábito in consílio et erudítis intérsum cogitatiónibus.
  - "13 Timor Dómini odit malum: arrogántiam, et supérbiam, et viam pravam, et
    os bilíngue detéstor."
  - 14 Meum est consílium et ǽquitas, mea est prudéntia, mea est fortitúdo.
  - 15 Per me reges regnant, et legum conditóres justa decérnunt;
  - 16 per me príncipes ímperant, et poténtes decérnunt justítiam.
  - 17 Ego diligéntes me díligo; et qui mane vígilant ad me, invénient me.
responsory1:
  - "R. Sancta et immaculáta virgínitas, quibus te láudibus éfferam, néscio:"
  - "* Quia quem cæli cápere non póterant, tuo grémio contulísti."
  - V. Benedícta tu in muliéribus, et benedíctus fructus ventris tui.
  - R. Quia quem cæli cápere non póterant, tuo grémio contulisti.
lectio2:
  - "!Prov 8:18-25"
  - 18 Mecum sunt divítiæ et glória, opes supérbæ et justítia.
  - 19 Mélior est enim fructus meus auro et lápide pretióso, et genímina mea
    argénto elécto.
  - 20 In viis justítiæ ámbulo, in médio semitárum judícii,
  - 21 ut ditem diligéntes me et thesáuros eórum répleam.
  - 22 Dóminus possidébit me in inítio viárum suárum, ántequam quidquam fáceret
    a princípio.
  - 23 Ab ætérno ordináta sum et ex antíquis, ántequam terra fíeret.
  - 24 Nondum erant abýssi, et ego jam concépta eram;
  - 25 necdum fontes aquárum erúperant, necdum montes gravi mole constíterant;
    ante colles ego parturiébar.
responsory2:
  - "R. Congratulámini mihi, omnes qui dilígitis Dóminum: quia cum essem
    párvula, plácui Altíssimo,"
  - "* Et de meis viscéribus génui Deum et hóminem."
  - V. Beátam me dicent omnes generatiónes, quia ancíllam húmilem respéxit Deus.
  - R. Et de meis viscéribus génui Deum et hóminem.
lectio3:
  - "!Prov 8:34-36; 9:1-5"
  - 34 Beátus homo qui audit me, et qui vígilat ad fores meas cotídie, et
    obsérvat ad postes óstii mei.
  - 35 Qui me invénerit, invéniet vitam, et háuriet salútem a Dómino;
  - 36 qui autem in me peccáverit, lædet ánimam suam. Omnes, qui me odérunt,
    díligunt mortem.
  - 1 Sapiéntia ædificávit sibi domum, excídit colúmnas septem.
  - 2 Immolávit víctimas suas, míscuit vinum et propósuit mensam suam.
  - "3 Misit ancíllas suas ut vocárent ad arcem et ad mœ́nia civitátis:"
  - "4 Si quis est párvulus, véniat ad me. Et insipiéntibus locúta est:"
  - 5 Veníte, comédite panem meum, et bíbite vinum quod míscui vobis.
responsory3:
  - "R. Beáta es, Virgo María, quæ Dóminum portásti, Creatórem mundi:"
  - "* Genuísti qui te fecit, et in ætérnum pérmanes Virgo."
  - V. Ave, María, grátia plena; Dóminus tecum.
  - R. Genuísti qui te fecit, et in ætérnum pérmanes Virgo.
  - "&Gloria"
  - R. Genuísti qui te fecit, et in ætérnum pérmanes Virgo.
lectio4:
  - Sermo sancti Joánnis Chrysóstomi
  - "!Apud Metaphrasten"
  - Dei Fílius non dívitem aut locuplétem áliquam féminam sibi matrem elégit,
    sed beátam Vírginem illam, cujus ánima virtútibus ornáta erat. Cum enim
    beáta María supra omnem humánam natúram castitátem serváret, proptérea
    Christum Dóminum in ventre concépit. Ad hanc ígitur sanctíssimam Vírginem et
    Dei Matrem accurréntes, ejus patrocínii utilitátem assequámur. Itaque,
    quæcúmque estis vírgines, ad Matrem Dómini confúgite; illa enim
    pulchérrimam, pretiosíssimam et incorruptíbilem possessiónem, patrocínio
    suo, vobis conservábit.
responsory4:
  - "R. Sicut cedrus exaltáta sum in Líbano, et sicut cypréssus in monte Sion:
    quasi myrrha elécta,"
  - "* Dedi suavitátem odóris."
  - V. Et sicut cinnamómum et bálsamum aromatízans.
  - R. Dedi suavitátem odóris.
lectio5:
  - Magnum revéra miráculum, fratres dilectíssimi, fuit beáta semper Virgo
    María. Quid namque illa majus aut illústrius ullo umquam témpore invéntum
    est, seu aliquándo inveníri póterit? Hæc sola cælum ac terram amplitúdine
    superávit. Quidnam illa sánctius? Non Prophétæ, non Apóstoli, non Mártyres,
    non Patriárchæ, non Angeli, non Throni, non Dominatiónes, non Séraphim, non
    Chérubim; non deníque áliud quidpíam, inter creátas res visíbiles aut
    invisíbiles, majus aut excelléntius inveníri potest. Eádem ancílla Dei est
    et mater; eádem Virgo et Génetrix.
responsory5:
  - R. Quæ est ista quæ procéssit sicut sol, et formósa tamquam Jerúsalem?
  - "* Vidérunt eam fíliæ Sion, et beátam dixérunt, et regínæ laudavérunt eam."
  - V. Et sicut dies verni circúmdabant eam flores rosárum et lília convállium.
  - R. Vidérunt eam fíliæ Sion, et beátam dixérunt, et regínæ laudavérunt eam.
lectio6:
  - "Hæc ejus mater est, qui a Patre ante omne princípium génitus fuit; quem
    Angeli et hómines agnóscunt Dóminum rerum ómnium. Visne cognóscere quanto
    Virgo hæc præstántior sit cæléstibus Poténtiis? Illæ cum timóre et tremóre
    assístunt, fáciem velántes suam: hæc humánum genus illi offert, quem génuit.
    Per hanc et peccatórum véniam conséquimur. Ave ígitur, mater, cælum, puélla,
    virgo, thronus. Ecclésiæ nostræ decus, glória et firmaméntum: assídue pro
    nobis precáre Jesum, Fílium tuum et Dóminum nostrum, ut per te misericórdiam
    inveníre in die judícii, et quæ repósita sunt iis qui díligunt Deum bona
    cónsequi possímus, grátia et benignitáte Dómini nostri Jesu Christi: cum quo
    Patri simul et Sancto Spirítui glória, et honor, et impérium, nunc et semper
    in sǽcula sæculórum. Amen."
responsory6:
  - "R. Ornátam monílibus fíliam Jerúsalem Dóminus concupívit:"
  - "* Et vidéntes eam fíliæ Sion, beatíssimam prædicavérunt, dicéntes: *
    Unguéntum effúsum nomen tuum."
  - V. Astitit regína a dextris tuis in vestítu deauráto, circúmdata varietáte.
  - "R. Et vidéntes eam fíliæ Sion, beatíssimam prædicavérunt, dicéntes:"
  - "&Gloria"
  - R. Unguéntum effúsum nomen tuum.
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 11:27-28"
  - "In illo témpore: Loquénte Jesu ad turbas, extóllens vocem quædam múlier de
    turba dixit illi: Beátus venter qui te portávit. Et réliqua."
  - _
  - Homilía sancti Bedæ Venerábilis Presbýteri
  - "!Lib 4. cap. 49. in Luc. 11."
  - Magnæ devotiónis et fídei hæc múlier osténditur, quæ, scribis et pharisǽis
    Dóminum tentántibus simul et blasphemántibus, tanta ejus incarnatiónem præ
    ómnibus sinceritáte cognóscit, tanta fidúcia confitétur, ut et præséntium
    prócerum calúmniam, et futurórum confúndat hæreticórum perfídiam. Nam, sicut
    tunc Judǽi, Sancti Spíritus ópera blasphemándo, verum consubstantialémque
    Patri Dei Fílium negábant; sic hærétici póstea, negándo Maríam semper
    Vírginem, Sancti Spíritus operánte virtúte, nascitúro cum humánis membris
    Unigénito Dei, carnis suæ matériam ministrásse, verum consubstantialémque
    matri Fílium hóminis fatéri non debére dixérunt.
responsory7:
  - "R. Felix namque es, sacra Virgo María, et omni laude digníssima:"
  - "* Quia ex te ortus est sol justítiæ, Christus, Deus noster."
  - "V. Ora pro pópulo, intérveni pro clero, intercéde pro devóto femíneo sexu:
    séntiant omnes tuum juvámen, quicúmque célebrant tuam sanctam festivitátem."
  - R. Quia ex te ortus est sol justítiæ, Christus, Deus noster.
lectio8:
  - "Sed, si caro Verbi Dei secúndum carnem nascéntis a carne Vírginis matris
    pronuntiátur extránea, sine causa venter qui eam portásset, úbera quæ
    lactássent, beatificántur. Dicit autem Apóstolus: Quia misit Deus Fílium
    suum, factum ex mulíere, factum sub lege. Neque audiéndi sunt, qui legéndum
    putant: Natum ex mulíere, factum sub lege, sed Factum ex mulíere; quia
    concéptus ex útero virgináli, carnem non de níhilo, non aliúnde, sed matérna
    traxit ex carne. Alióquin nec vere Fílius hóminis dicerétur, qui oríginem
    non habéret ex hómine. Et nos ígitur, his contra Eutychen dictis, extollámus
    vocem cum Ecclésia cathólica, cujus hæc múlier typum gessit, extollámus et
    mentem de médio turbárum, dicamúsque Salvatóri: Beátus venter qui te
    portávit, et úbera quæ suxísti. Vere enim beáta parens, quæ, sicut quidam
    ait, Eníxa est puérpera Regem, qui cælum terrámque tenet per sǽcula."
responsory8:
  - R. Beátam me dicent omnes generatiónes,
  - "* Quia fecit mihi Dóminus magna qui potens est, et sanctum nomen ejus."
  - V. Et misericórdia ejus a progénie in progénies timéntibus eum.
  - R. Quia fecit mihi Dóminus magna qui potens est, et sanctum nomen ejus.
  - "&Gloria"
  - R. Quia fecit mihi Dóminus magna qui potens est, et sanctum nomen ejus.
lectio9:
  - Quinímmo beáti qui áudiunt verbum Dei et custódiunt. Pulchre Salvátor
    attestatióni mulíeris ánnuit, non eam tantúmmodo quæ Verbum Dei corporáliter
    generáre merúerat, sed et omnes qui idem Verbum spiritáliter audítu fídei
    concípere, et boni óperis custódia vel in suo vel in proximórum corde párere
    et quasi álere studúerint, asséverans esse beátos; quia, et éadem Dei
    Génetrix, et inde quidem beáta quia Verbi incarnándi minístra facta est
    temporális, sed inde multo beátior quia ejúsdem semper amándi custos manébat
    ætérna.
  - "&teDeum"
versum-0:
  - V. Ora pro nobis sancta Dei Génetrix.
  - R. Ut digni efficiámur promissiónibus Christi.
