versum-1:
  - V. Dignáre me laudáre te, Virgo sacráta.
  - R. Da mihi virtútem contra hostes tuos.
ant-1:
  - "Sancta María, * succúrre míseris, juva pusillánimes, réfove flébiles, ora
    pro pópulo, intérveni pro clero, intercéde pro devóto femíneo sexu: séntiant
    omnes tuum juvámen, quicúmque célebrant tuam sanctam festivitátem."
oratio:
  - "Concéde nos fámulos tuos, quǽsumus, Dómine Deus, perpétua mentis et
    córporis sanitáte gaudére: et, gloriósa beátæ Maríæ semper Vírginis
    intercessióne, a præsénti liberári tristítia, et ætérna pérfrui lætítia."
  - $Per Dominum
invit:
  - Sancta María, Dei Génetrix Virgo, * Intercéde pro nobis.
