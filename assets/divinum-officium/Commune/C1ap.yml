officium:
  - Commune Evangelistarum tempore Paschali
lectio1:
  - Incipit liber Ezechiélis Prophétæ
  - "!Ezech 1:1-4"
  - 1 Et factum est in trigésimo anno, in quarto, in quinta mensis, cum essem in
    médio captivórum juxta flúvium Chobar, apérti sunt cæli, et vidi visiónes
    Dei.
  - 2 In quinta mensis, ipse est annus quintus transmigratiónis regis Jóachim,
  - "3 factum est verbum Dómini ad Ezechiélem fílium Buzi sacerdótem, in terra
    Chaldæórum, secus flumen Chobar: et facta est super eum ibi manus Dómini."
  - "4 Et vidi, et ecce ventus túrbinis veniébat ab Aquilóne, et nubes magna, et
    ignis invólvens, et splendor in circúitu ejus: et de médio ejus, quasi
    spécies eléctri, id est, de médio ignis:"
lectio2:
  - "!Ezech 1:5-9"
  - 5 Et in médio ejus similitúdo quátuor animálium, et hic aspéctus eórum,
    similitúdo hóminis in eis.
  - 6 Quátuor fácies uni, et quátuor pennæ uni.
  - "7 Pedes eórum, pedes recti, et planta pedis eórum quasi planta pedis
    vítuli: et scintíllæ quasi aspéctus æris candéntis."
  - "8 Et manus hóminis sub pennis eórum, in quátuor pártibus: et fácies et
    pennas per quátuor partes habébant,"
  - 9 junctǽque erant pennæ eórum altérius ad álterum. Non revertebántur cum
    incéderent, sed unumquódque ante fáciem suam gradiebátur.
lectio3:
  - "!Ezech 1:10-12"
  - 10 Similitúdo autem vultus eórum, fácies hóminis et fácies leónis a dextris
    ipsórum quátuor, fácies autem bovis a sinístris ipsórum quátuor, et fácies
    áquilæ désuper ipsórum quátuor.
  - "11 Fácies eórum et pennæ eórum exténtæ désuper: duæ pennæ singulórum
    jungebántur, et duæ tegébant córpora eórum:"
  - "12 et unumquódque eórum coram fácie sua ambulábat: ubi erat ímpetus
    spíritus, illuc gradiebántur, nec revertebántur cum ambulárent."
lectio4:
  - De Expositióne sancti Gregórii Papæ super Ezechiélem Prophétam
  - "!Homilia 3, Lib. 1"
  - "Sancta quátuor animália, quæ prophetíæ spíritu futúra prævidéntur, subtíli
    narratióne describúntur, cum dícitur: Quátuor fácies uni, et quátuor pennæ
    uni. Quid per fáciem, nisi notítia; et quid per pennas, nisi volátus
    exprímitur? Per fáciem quippe unusquísque cognóscitur: per pennas vero in
    altum ávium córpora sublevántur. Fácies ítaque ad fidem pértinet, penna ad
    contemplatiónem. Per fidem namque ab omnipoténti Deo cognóscimur, sicut ipse
    de suis óvibus dicit: Ego sum pastor bonus, et cognósco oves meas, et
    cognóscunt me meæ. Qui rursus ait: Ego scio quos elégerim. Per
    contemplatiónem vero, qua super nosmetípsos tóllimur, quasi in áëra
    levámur."
lectio5:
  - "Quátuor ergo fácies uni sunt: quia si requíras quid Matthǽus de
    incarnatióne Dómini séntiat: hoc nimírum sentit, quod Marcus, Lucas, et
    Joánnes. Si quæras quid Joánnes séntiat; hoc procul dúbio, quod Lucas,
    Marcus, et Matthǽus. Si quæras quid Marcus; hoc quod Matthǽus, Joánnes, et
    Lucas. Si quæras quid Lucas; hoc quod Joánnes, Matthǽus, et Marcus sentit.
    Quátuor ergo fácies uni sunt: quia notítia fídei, qua cognoscúntur a Deo,
    ipsa est in uno, quæ est simul in quátuor. Quidquid enim in uno invéneris,
    hoc in ómnibus simul quátuor cognósces."
lectio6:
  - "Et quátuor pennæ uni: quia Dei omnipoténtis Fílium Dóminum! nostrum Jesum
    Christum simul omnes concórditer prǽdicant: et ad divinitátem ejus mentis
    óculos levántes, penna contemplatiónis volant. Evangelistárum ergo fácies ad
    humanitátem Dómini pértinet, penna ad divinitátem: quia in eum, quem
    corpóreum aspíciunt, quasi fácies inténdunt: sed dum hunc esse
    incircumscríptum atque incorpóreum ex divinitáte annúntiant, per
    contemplatiónis pennam quasi in áëra levántur. Quia ítaque una est fides
    incarnatiónis ejus in ómnibus, et par contemplátio divinitátis ejus in
    síngulis, recte nunc dícitur: Quátuor fácies uni, et quátuor pennæ uni."
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 10:1-9"
  - "In illo témpore: Designávit Dóminus et álios septuagínta duos: et misit
    illos binos ante fáciem suam, in omnem civitátem et locum, quo erat ipse
    ventúrus. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 17 in Evangelia"
  - "Dóminus et Salvátor noster, fratres caríssimi, aliquándo nos sermónibus,
    aliquándo vero opéribus ádmonet. Ipsa étenim facta ejus præcépta sunt: quia
    dum áliquid tácitus facit, quid ágere debeámus innotéscit. Ecce enim binos
    in prædicatiónem discípulos mittit: quia duo sunt præcépta caritátis, Dei
    vidélicet amor, et próximi: et minus quam inter duos cáritas habéri non
    potest. Nemo enim próprie ad semetípsum habére caritátem dícitur: sed
    diléctio in álterum tendit, ut cáritas esse possit."
lectio8:
  - "Ecce enim binos ad prædicándum discípulos Dóminus mittit: quátenus hoc
    nobis tácitus ínnuat, quia qui caritátem erga álterum non habet,
    prædicatiónis offícium suscípere nullátenus debet. Bene autem dícitur, quia
    misit eos ante fáciem suam in omnem civitátem et locum, quo erat ipse
    ventúrus. Prædicatóres enim suos Dóminus séquitur: quia prædicátio prǽvenit,
    et tunc ad mentis nostræ habitáculum Dóminus venit, quando verba
    exhortatiónis præcúrrunt: atque per hoc véritas in mente suscípitur."
lectio9:
  - "Hinc namque eísdem prædicatóribus Isaías dicit: Paráte viam Dómini, rectas
    fácite sémitas Dei nostri. Hinc fíliis Psalmísta ait: Iter fácite ei, qui
    ascéndit super occásum. Super occásum namque Dóminus ascéndit: quia unde in
    passióne occúbuit, inde majórem suam glóriam resurgéndo manifestávit. Super
    occásum vidélicet ascéndit; quia mortem quam pértulit, resurgéndo calcávit.
    Ei ergo qui ascéndit super occásum, iter fácimus, cum nos ejus glóriam
    vestris méntibus prædicámus, ut eas et ipse post véniens, per amóris sui
    præséntiam illústret."
  - "&teDeum"
