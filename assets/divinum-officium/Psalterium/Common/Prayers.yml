aportainferi:
  - V. A porta ínferi.
  - R. Erue, Dómine, ánimas eórum.
a-porta-inferi:
  - V. A porta ínferi.
  - R. Erue, Dómine, ánimas eórum.
  - V. Requiéscant in pace.
  - R. Amen.
  - V. Dóminus vobíscum.
  - R. Et cum spíritu tuo.
  - V. Dómine, exáudi oratiónem meam.
  - R. Et clamor meus ad te véniat.
  - /:secunda «Domine, exaudi» omittitur:/
  - "&Dominus_vobiscum2"
oratio-visita_:
  - "v. Vísita, quǽsumus, Dómine, habitatiónem istam, et omnes insídias inimíci
    ab ea longe repélle: Ángeli tui sancti hábitent in ea, qui nos in pace
    custódiant; et benedíctio tua sit super nos semper."
