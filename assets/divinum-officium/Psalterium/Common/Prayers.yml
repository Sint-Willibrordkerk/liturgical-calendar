confiteor_:
  - "v. Confíteor Deo omnipoténti, beátæ Maríæ semper Vírgini, beáto Michaéli
    Archángelo, beáto Joánni Baptístæ, sanctis Apóstolis Petro et Paulo, et
    ómnibus Sanctis, quia peccávi nimis, cogitatióne, verbo et ópere: /:percutit
    sibi pectus:/ mea culpa, mea culpa, mea máxima culpa. Ídeo precor beátam
    Maríam semper Vírginem, beátum Michaélem Archángelum, beátum Joánnem
    Baptístam, sanctos Apóstolos Petrum et Paulum, et omnes Sanctos, oráre pro
    me ad Dóminum Deum nostrum."
