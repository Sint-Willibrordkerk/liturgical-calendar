rubrica-ordo-praedicatorum/confiteor:
  - "v. Confiteor Deo omnipotenti, et beáte Maríae semper Vírgini, et beáto
    Domínico Patri nostro, et omnibus Sanctis: quia peccavi nimis cogitatione,
    locutione, opere et omissione, me cupla: precor beátam Maríam semper
    Vírginem, et beátum Domínicum Patrem nostrum, et omnes Sanctos oráre pro
    me."
misereatur:
  - v. Misereátur nostri omnípotens Deus, et dimíssis peccátis nostris, perdúcat
    nos ad vitam ætérnam. Amen.
rubrica-ordo-praedicatorum/misereatur:
  - v. Misereatur mei omnipotens Deus, et dimittat mihi omnia peccata mea,
    liberet me ab omni malo, salvet, et confirmet in omni opere bono, et
    perducat me ad vitam aeternam. Amen.
indulgentiam:
  - v. Indulgéntiam, + absolutiónem et remissiónem peccatórum nostrórum tríbuat
    nobis omnípotens et miséricors Dóminus. Amen.
domine-labia:
  - V. Dómine, lábia ++ mea apéries.
  - R. Et os meum annuntiábit laudem tuam.
