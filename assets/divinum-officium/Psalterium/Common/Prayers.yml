benedictio-prima2:
  - Benedictio. Dóminus nos benedícat, + et ab omni malo deféndat, et ad vitam
    perdúcat ætérnam. Et fidélium ánimæ per misericórdiam Dei requiéscant in
    pace.
benedicite:
  - V. Benedícite.
  - R. Deus.
commemoratio-omnium_:
  - R.br. Commemorátio ómnium fratrum, familiárum Órdinis nostri, atque
    benefactórum nostrórum.
commemoratio-omnium_c:
  - /:Deinde dicit Lector::/ Commemorátio ómnium fratrum, familiárium et
