oratio_domine:
  - "v. Dómine Deus omnípotens, qui ad princípium hujus diéi nos perveníre
    fecísti: tua nos hódie salva virtúte; ut in hac die ad nullum declinémus
    peccátum, sed semper ad tuam justítiam faciéndam nostra procédant elóquia,
    dirigántur cogitatiónes et ópera."
benedictio-completorium_:
  - Benedictio. Noctem quiétam et finem perféctum concédat nobis Dóminus
    omnípotens.
