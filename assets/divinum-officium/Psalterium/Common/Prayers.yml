pater-noster:
  - "v. Pater noster, qui es in cælis, sanctificétur nomen tuum: advéniat regnum
    tuum: fiat volúntas tua, sicut in cælo et in terra. Panem nostrum cotidiánum
    da nobis hódie: et dimítte nobis débita nostra, sicut et nos dimíttimus
    debitóribus nostris: et ne nos indúcas in tentatiónem: sed líbera nos a
    malo. Amen."
pater-noster-et:
  - "v. Pater noster, qui es in cælis, sanctificétur nomen tuum: advéniat regnum
    tuum: fiat volúntas tua, sicut in cælo et in terra. Panem nostrum cotidiánum
    da nobis hódie: et dimítte nobis débita nostra, sicut et nos dimíttimus
    debitóribus nostris:"
  - "V. Et ne nos indúcas in tentatiónem:"
  - R. Sed líbera nos a malo.
ave-maria:
  - "v. Ave María, grátia plena; Dóminus tecum: benedícta tu in muliéribus, et
    benedíctus fructus ventris tui Jesus. Sancta María, Mater Dei, ora pro nobis
    peccatóribus, nunc et in hora mortis nostræ. Amen."
ave-maria-parvum:
  - "V. Ave María, grátia plena; Dóminus tecum:"
  - R. Benedícta tu in muliéribus, et benedíctus fructus ventris tui.
credo:
  - "v. Credo in Deum, Patrem omnipoténtem, Creatórem cæli et terræ. Et in Jesum
    Christum, Fílium ejus únicum, Dóminum nostrum: qui concéptus est de Spíritu
    Sancto, natus ex María Vírgine, passus sub Póntio Piláto, crucifíxus,
    mórtuus, et sepúltus: descéndit ad ínferos; tértia die resurréxit a mórtuis;
    ascéndit ad cælos; sedet ad déxteram Dei Patris omnipoténtis: inde ventúrus
    est judicáre vivos et mórtuos. Credo in Spíritum Sanctum, sanctam Ecclésiam
    cathólicam, Sanctórum communiónem, remissiónem peccatórum, carnis
    resurrectiónem, vitam ætérnam. Amen."
credo-carnis:
  - "v. Credo in Deum, Patrem omnipoténtem, Creatórem cæli et terræ. Et in Jesum
    Christum, Fílium ejus únicum, Dóminum nostrum: qui concéptus est de Spíritu
    Sancto, natus ex María Vírgine, passus sub Póntio Piláto, crucifíxus,
    mórtuus, et sepúltus: descéndit ad ínferos; tértia die resurréxit a mórtuis;
    ascéndit ad cælos; sedet ad déxteram Dei Patris omnipoténtis: inde ventúrus
    est judicáre vivos et mórtuos. Credo in Spíritum Sanctum, sanctam Ecclésiam
    cathólicam, Sanctórum communiónem, remissiónem peccatórum."
  - V. Carnis resurrectiónem.
  - R. Vitam ætérnam. Amen.
