conclusio-cisterciensis:
  - Ant. Spíritus sanctus in te descéndet, María, ne tímeas, habébis in útero
    Fílium Dei.
  - _
  - V. Ecce ancílla Dómini.
  - R. Fiat mihi secúndum verbum tuum.
  - _
  - $Oremus
  - v. Lætífica, et ádjuva nos, omnípotens et miséricors Deus, Domínicæ
    Conceptiónis gáudia recoléntes, et pia Dei Génitrix Virgo semper María (in
    cujus veneratióne hæc commemorámus) in cunctis necessitátibus nostris
    grátiam sancti Spíritus nobis ímpetret, et levámen. Per eúmdem Christum
    Dóminum nostrum.
  - $Amen
quorum-animae:
  - V. Quorum ánimæ piis ádmodum reverendórum patrum ac religiosórum fratrum
    suffrágiis commendántur!
lectio-regulae:
  - Lectio ex Regula S.P.N.Benedicti, Caput №
ant-alma-redemptoris-mater:
  - "{:S-AlmaRedemptoris:}v. Alma Redemptóris Mater, quæ pérvia cæli porta
    manes,"
  - et stella maris, succúrre cadénti,
  - "Súrgere qui curat, pópulo: tu quæ genuísti,"
  - Natúra miránte, tuum sanctum Genitórem,
  - Virgo prius ac postérius, Gabriélis ab ore
  - Sumens illud Ave, peccatórum miserére.
  - _
  - V. {::}Ángelus Dómini nuntiávit Maríæ.
  - R. Et concépit de Spíritu Sancto.
  - _
  - $Oremus
  - "v. Grátiam tuam, quǽsumus, Dómine, méntibus nostris infúnde: ut, qui,
    Ángelo nuntiánte, Christi Fílii tui incarnatiónem cognóvimus; per passiónem
    ejus et crucem, ad resurrectiónis glóriam perducámur. Per eúmdem Christum
    Dóminum nostrum. Amen."
tempore-nativitatis/ant-alma-redemptoris-mater:
  - "{:S-AlmaRedemptoris:}v. Alma Redemptóris Mater, quæ pérvia cæli"
  - Porta manes, et stella maris, succúrre cadénti,
  - "Súrgere qui curat, pópulo: tu quæ genuísti,"
  - Natúra miránte, tuum sanctum Genitórem,
  - Virgo prius ac postérius, Gabriélis ab ore
  - Sumens illud Ave, peccatórum miserére.
  - _
  - V. {::}Post partum, Virgo, invioláta permansísti.
  - R. Dei Génetrix, intercéde pro nobis.
  - _
  - $Oremus
  - "v. Deus, qui salútis ætérnæ, beátæ Maríæ virginitáte fecúnda, humáno géneri
    prǽmia præstitísti: tríbue, quǽsumus; ut ipsam pro nobis intercédere
    sentiámus, per quam merúimus auctórem vitæ suscípere, Dóminum nostrum Jesum
    Christum Fílium tuum. Amen."
