benedictio-completorium-final:
  - Benedictio. Benedícat et custódiat nos omnípotens et miséricors Dóminus, +
    Pater, et Fílius, et Spíritus Sanctus.
benedictio-completorium2:
  - Benedictio. Benedícat et custódiat nos omnípotens et miséricors Dóminus, +
    Pater, et Fílius, et Spíritus Sanctus.
rubrica-ordo-praedicatorum/benedictio-completorium2:
  - Benedictio. Benedíctio Dei omnipoténtis + Patris, et Fílii, et Spíritus
    Sancti descéndat super nos et máneat semper.
