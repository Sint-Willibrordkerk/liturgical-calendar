respice:
  - V. Réspice in servos tuos, Dómine, et in ópera tua, et dírige fílios eórum.
  - R. Et sit splendor Dómini Dei nostri super nos, et ópera mánuum nostrárum
    dírige super nos, et opus mánuum nostrárum dírige.
dirigere:
  - "v. Dirígere et sanctificáre, régere et gubernáre dignáre, Dómine Deus, Rex
    cæli et terræ, hódie corda et córpora nostra, sensus, sermónes et actus
    nostros in lege tua, et in opéribus mandatórum tuórum: ut hic et in ætérnum,
    te auxiliánte, salvi et líberi esse mereámur, Salvátor mundi: Qui vivis et
    regnas in sǽcula sæculórum."
benedictio-prima_:
  - Benedictio. Dies et actus nostros in sua pace dispónat Dóminus omnípotens.
  - R. Amen.
benedictio-prima:
  - (rubrica cisterciensis) $Adjutorium nostrum
  - (rubrica divino)$rubrica Jube
  - V. Jube, domne, benedícere.
  - Benedictio. Dies et actus nostros in sua pace dispónat Dóminus omnípotens.
  - R. Amen.
