requiescant:
  - V. Requiéscant in pace.
  - R. Amen.
deus-veniae_:
  - "v. Deus véniæ largítor et humánæ salútis amátor: quǽsumus cleméntiam tuam:
    ut nostræ congregatiónis fratres, propínquos et benefactóres, qui ex hoc
    sǽculo transiérunt, beáta María semper vírgine intercedénte cum ómnibus
    sanctis tuis ad perpétuæ beatitúdinis consórtium perveníre concédas."
