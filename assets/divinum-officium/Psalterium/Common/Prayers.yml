ante:
  - /:flexis genibus:/
  - "v. Aperi Dómine, os meum ad benedicéndum nomen sanctum tuum: munda quoque
    cor meum ab ómnibus vanis, pervérsis et aliénis cogitatiónibus; intelléctum
    illúmina, afféctum inflámma, ut digne, atténte ac devóte hoc Offícium
    recitáre váleam, et exaudíri mérear ante conspéctum divínæ Majestátis tuæ.
    Per Christum Dóminum nostrum."
  - R. Amen.
  - v. Dómine, in unióne illíus divínæ intentiónis, qua ipse in terris laudes
    Deo persolvísti, has tibi Horas /:(vel:/ hanc tibi Horam/:):/ persólvo.
post:
  - v. Sacrosánctæ et indivíduæ Trinitáti, crucifíxi Dómini nostri Jesu Christi
    humanitáti, beatíssimæ et gloriosíssimæ sempérque Vírginis Maríæ fœcúndæ
    integritáti, et ómnium Sanctórum universitáti sit sempitérna laus, honor,
    virtus et glória ab omni creatúra, nobísque remíssio ómnium peccatórum, per
    infiníta sǽcula sæculórum.
  - R. Amen.
  - _
  - V. Beáta víscera Maríæ Vírginis, quæ portavérunt ætérni Patris Fílium.
  - R. Et beáta úbera, quæ lactavérunt Christum Dóminum.
  - _
  - /:Et dicitur secreto:/ Pater noster. /:et:/ Ave Maria.
conclmart:
  - V. Et álibi aliórum plurimórum sanctórum Mártyrum et Confessórum, atque
    sanctárum Vírginum.
