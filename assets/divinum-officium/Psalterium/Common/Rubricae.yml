pac-ad-completorium:
  - /:Si post Completorium immediate sequatur Matutinum, tunc bis dicitur «Pater
    noster, Ave Maria» et «Credo,» pro fine videlicet Officii diei præcedentis,
    et pro initio Officii diei sequentis.:/
