ante:
  - /:Antequam inchoëtur Officium laudabiliter dicitur, sub singulari semper
    numero, sequens Oratio; pro qua Summus Pontifex Pius Pp. XI sub die 17
    Novembris 1933 Indulgentiam trium annorum concessit.:/
post:
  - /:Cum expletum fuerit Officium, laudabiliter dicitur sequens Oratio; pro qua
    Summus Pontifex Pius Papa XI sub die 1 Decembris 1933 indulgentiam trium
    annorum concessit. Prreterea Clericis in sacris constitutis et Sacerdotibus
    eam devote post Officium recitantibus Summus Pontifex Leo X defectus et
    culpas in eo persolvendo ex humana fragilitate contractas, indulsit. Dicitur
    autem  flexis semper genibus in privata etiam recitatione, præter quam ab
    iis, qui ob certam infirmitatem vel gravioris impedimenti causam nequeant
    genuflectere.:/
