conclusio-cisterciensis:
  - /:Et quandocumque terminata Hora discendum est a Choro (nisi quando
    immediate subsequitur Missa aut cum Officio diei Officium Defunctorum, vel
    Sepultura, vel Processio, aut Litaniæ, ut in Rogationibus, etc.) dicitur::/
