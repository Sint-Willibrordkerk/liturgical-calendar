matutinum:
  - "!Reliqua omittuntur, nisi %Laudes% separandæ sint."
rubrica-tridentina/matutinum:
  - "!Dicto Hymno « Te Deum » aut nono vel tertio Responsorio ejus loco ponitur,
    statim inchoantur %Laudes%, præterquam in Nocte Nativitatis Domini; quia
    tunc dicitur Oratio, postea celebratur Missa, ut suo loco notatur."
rubrica-monastica/matutinum:
  - "!Reliqua omittuntur, nisi %Laudes% separandæ sint."
rubrica-tridentina/rubrica-monastica/matutinum:
  - "!Reliqua omittuntur in Officium duodecim Lectionum, quando immediatæ
    subsequuntur %Laudes%. Sed in Festi Simplicis, et in Officio Ferialis tam
    trium, quam unius Lectionis semper dicuntur ut sequitur."
rubrica-divino/rubrica-monastica/matutinum:
  - "!Reliqua omittuntur in Officium duodecim Lectionum, quando immediatæ
    subsequuntur %Laudes%. Sed in Festi Simplicis, et in Officio Ferialis tam
    trium, quam unius Lectionis semper dicuntur ut sequitur."
rubrica-cisterciensis/rubrica-monastica/matutinum:
  - "!Reliqua omittuntur in Officium xij. Lectionum, quas immediatæ subsequuntur
    %Laudes%. Sed tam in Feriis, quam in Festis iij. Lectionum, in Hieme et in
    Æstate semper dicuntur ut sequitur."
matutinum-parvum:
  - "!Reliqua omittuntur, et statim inchoatur %Laudes%."
