rubrica-monastica/martyrologium:
  - /:Deinde in Choro legitur Martyrologium, quod laudabiliter fit etiam extra
    Chorum.:/
rubrica-tridentina/rubrica-monastica/martyrologium:
  - /:Quo dicto Prima de B. Maria, si dicenda est. Deinde immediate legitur
    Martyrologium et reliqua iuxta Rubrica generalem. Extra Conventum non
    legitur Martyrologium, sed immediate post Orationem Primæ, dicto
    «Benedicamus Domino,» dicitur «Preiósa,» cum reliquis, ut infra.:/
rubrica-cisterciensis/rubrica-monastica/martyrologium:
  - /:Hic expletur Prima. Deinde legitur Martyrologium in Capitulo sine
    benedictione. Extra Conventum non legitur Martyrologium, sed immediate
    incipitur « Pretiósa. » ut infra.:/
rubrica-monastica/regula:
  - /:Extra Chorum etiam laudabiliter dicitur lectio ex S. Regulæ; secus dicitur
    Lectio brevis.:/
rubrica-cisterciensis/rubrica-monastica/regula:
  - /:Cum vero recitatur privatim, hæc erit brevis Lectio per totum annum.:/
rubrica-cisterciensis/regula-ante:
  - /:In Capitulo legitur unum caput, vel pars capitis ex Regula S. Benedicti.:/
examen:
  - /:Examen conscientiæ vel «Pater Noster» totum secreto.:/
