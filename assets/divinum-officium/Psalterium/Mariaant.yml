advent:
  - "{:S-AlmaRedemptoris:}v. Alma Redemptóris Mater, quæ pérvia cæli porta
    manes,"
  - et stella maris, succúrre cadénti,
  - "Súrgere qui curat, pópulo: tu quæ genuísti,"
  - Natúra miránte, tuum sanctum Genitórem,
  - Virgo prius ac postérius, Gabriélis ab ore
  - Sumens illud Ave, peccatórum miserére.
  - _
  - V. {::}Ángelus Dómini nuntiávit Maríæ.
  - R. Et concépit de Spíritu Sancto.
  - _
  - $Oremus
  - "v. Grátiam tuam, quǽsumus, Dómine, méntibus nostris infúnde: ut, qui,
    Ángelo nuntiánte, Christi Fílii tui incarnatiónem cognóvimus; per passiónem
    ejus et crucem, ad resurrectiónis glóriam perducámur. Per eúmdem Christum
    Dóminum nostrum. Amen."
nativiti:
  - "{:S-AlmaRedemptoris:}v. Alma Redemptóris Mater, quæ pérvia cæli"
  - Porta manes, et stella maris, succúrre cadénti,
  - "Súrgere qui curat, pópulo: tu quæ genuísti,"
  - Natúra miránte, tuum sanctum Genitórem,
  - Virgo prius ac postérius, Gabriélis ab ore
  - Sumens illud Ave, peccatórum miserére.
  - _
  - V. {::}Post partum, Virgo, invioláta permansísti.
  - R. Dei Génetrix, intercéde pro nobis.
  - _
  - $Oremus
  - "v. Deus, qui salútis ætérnæ, beátæ Maríæ virginitáte fecúnda, humáno géneri
    prǽmia præstitísti: tríbue, quǽsumus; ut ipsam pro nobis intercédere
    sentiámus, per quam merúimus auctórem vitæ suscípere, Dóminum nostrum Jesum
    Christum Fílium tuum. Amen."
quadragesimae:
  - "{:S-AveRegina:}v. Ave, Regína cælórum,"
  - "Ave, Dómina Angelórum:"
  - Salve radix, salve porta,
  - "Ex qua mundo lux est orta:"
  - _
  - Gaude, Virgo gloriósa,
  - Super omnes speciósa,
  - Vale, o valde decóra,
  - Et pro nobis Christum exóra.
  - _
  - V. {::}Dignáre me laudáre te, Virgo sacráta.
  - R. Da mihi virtútem contra hostes tuos.
  - _
  - $Oremus
  - v. Concéde, miséricors Deus, fragilitáti nostræ præsídium; ut, qui sanctæ
    Dei Genetrícis memóriam ágimus; intercessiónis ejus auxílio, a nostris
    iniquitátibus resurgámus. Per eúmdem Christum Dóminum nostrum. Amen.
paschalis:
  - "{:S-ReginaCaeli:}v. Regína cæli, lætáre, allelúja;"
  - Quia quem meruísti portáre, allelúja,
  - "Resurréxit, sicut dixit, allelúja:"
  - Ora pro nobis Deum, allelúja.
  - _
  - V. {::}Gaude et lætáre, Virgo María, allelúja.
  - R. Quia surréxit Dóminus vere, allelúja.
  - _
  - $Oremus
  - "v. Deus, qui per resurrectiónem Fílii tui, Dómini nostri Jesu Christi,
    mundum lætificáre dignátus es: præsta, quǽsumus; ut, per ejus Genetrícem
    Vírginem Maríam, perpétuæ capiámus gáudia vitæ. Per eúmdem Christum Dóminum
    nostrum. Amen."
postpentecost:
  - "{:S-SalveRegina:}v. Salve, Regína, mater misericórdiæ;"
  - vita, dulcédo et spes nóstra, salve.
  - Ad te clamámus éxsules fílii Hevæ.
  - Ad te suspirámus geméntes et flentes
  - In hac lacrimárum valle.
  - Eja ergo, advocáta nostra,
  - illos tuos misericórdes óculos ad nos convérte.
  - Et Jesum, benedíctum fructum ventris tui,
  - nobis post hoc exsílium osténde.
  - O clemens, o pia, o dulcis Virgo María.
  - _
  - V. {::}Ora pro nobis, sancta Dei Génetrix.
  - R. Ut digni efficiámur promissiónibus Christi.
  - _
  - $Oremus
  - "v. Omnípotens sempitérne Deus, qui gloriósæ Vírginis Matris Maríæ corpus et
    ánimam, ut dignum Fílii tui habitáculum éffici mererétur, Spíritu Sancto
    cooperánte, præparásti: da, ut, cujus commemoratióne lætámur, ejus pia
    intercessióne, ab instántibus malis et a morte perpétua liberémur. Per
    eúmdem Christum Dóminum nostrum. Amen."
ant-ad-s_dominicum:
  - "Ant. O Lumen Ecclesiae, doctor veritatis, rosa patientiae, ebur castitatis:
    aquam sapientiae propinásti gratis, praedicator gratiae, nos junge beatis.
    (Allelúja.)"
  - _
  - V. Ora pro nobis, beate Pater Dominice. (Allelúja.)
  - R. Ut digni efficiamur promissionibus Christi. (Allelúja.)
  - _
  - $Oremus
  - v. Concede, quaesumus omnipotens Deus, ut qui peccatorum nostrorum pondere
    premimur, beati Dominici confessoris tui Patris nostri patrocinio
    sublevemur.~
  - $Per Christum
  - _
  - $Fidelium animae
