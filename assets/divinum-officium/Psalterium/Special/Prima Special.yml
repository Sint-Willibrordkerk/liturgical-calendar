dominica:
  - "!1 Tim. 1:17"
  - v. Regi sæculórum immortáli et invisíbili, soli Deo honor et glória in
    sǽcula sæculórum. Amen.
feria:
  - "!Zach 8:19"
  - v. Pacem et veritátem dilígite, ait Dóminus omnípotens.
per-annum:
  - "!2 Thess 3:5"
  - v. Dóminus autem dírigat corda et córpora nostra in caritáte Dei et
    patiéntia Christi.
adv:
  - "!Isa 33:2"
  - "v. Dómine, miserére nostri: te enim exspectávimus: esto brácchium nostrum
    in mane, et salus nostra in témpore tribulatiónis."
nat:
  - "!Heb 1:11-12"
  - "v. Ipsi períbunt, tu autem permanébis; et omnes sicut vestiméntum
    veteráscent: et velut amíctum mutábis eos, et mutabúntur: tu autem idem ipse
    es, et anni tui non defícient."
epi:
  - "!Isa 60:6"
  - v. Omnes de Saba vénient, aurum et thus deferéntes, et laudem Dómino
    annuntiántes.
asc:
  - "!Act. 1:11"
  - v. Viri Galilǽi, quid statis aspiciéntes in cælum? Hic Jesus, qui assúmptus
    est a vobis in cælum, sic véniet, quemádmodum vidístis eum eúntem in cælum.
quad:
  - "!Isa 55:6"
  - "v. Quǽrite Dóminum dum inveníri potest: invocáte eum, dum prope est."
quad5:
  - "!Isa 50:6-7"
  - v. Fáciem meam non avérti ab increpántibus, et conspuéntibus in me. Dóminus
    Deus auxiliátor meus, et ídeo non sum confúsus.
pasch:
  - "!Col 3:1-2"
  - "v. Si consurrexístis cum Christo, quæ sursum sunt quǽrite, ubi Christus est
    in déxtera Dei sedens: quæ sursum sunt sápite, non quæ super terram."
pent:
  - "!Act. 2:11"
  - "v. Judǽi quoque, et Prosélyti, Cretes, et Arabes: audívimus eos loquéntes
    nostris linguis magnália Dei."
