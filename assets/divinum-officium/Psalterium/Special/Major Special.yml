  - /:fiat com. consueata ante vel post Commemorationes prædictas, pro dignitate
    illius, et ultimo loco::/
  - _
  - "!De Pace"
  - Ant. Da pacem Dómine in diébus nostris, quia non est álius, qui pugnet pro
    nobis, nisi tu Deus noster. (Allelúja.)
  - _
