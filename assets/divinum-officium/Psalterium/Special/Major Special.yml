suffragium-divino:
  - Ant. Beáta Dei Génitrix Virgo María, Sanctíque omnes intercédant pro nobis
    ad Dóminum.
  - _
  - V. Mirificávit Dóminus Sanctos suos.
  - R. Et exaudívit eos clamántes ad se.
  - _
  - "!Oratio"
  - /:In hac oratione, ad litteram N. exprimitur nomen Titularis propriæ
    ecclesiæ, dummodo Titulus non sit Persona divina vel Mysterium Domini, aut
    de ipso ratione Festi factum non fuerit Officium vel Commemoratio, aut
    illius nomen non sit in eadem Suffragii Oratione expressum; ac nomina
    sanctorum Angelorum et sancti Joannis Baptistæ, si Titulares fuerint,
    præponuntur nomini sancti Joseph. In hisce autem omnibus casibus omittuntur
    verba «atque beáto N.»:/
  - $Oremus
  - "v. A cunctis nos, quǽsumus, Dómine, mentis et córporis defénde perículis:
    et, intercedénte beáta et gloriósa semper Vírgine Dei Genitríce María, cum
    beáto Joseph, beátis Apóstolis tuis Petro et Paulo, atque beáto~"
  - r. N. et ómnibus Sanctis, salútem nobis tríbue benígnus et pacem; ut,
    destrúctis adversitátibus et erróribus univérsis, Ecclésia tua secúra tibi
    sérviat libertáte.
  - $Per eundem
suffragium-divino1:
