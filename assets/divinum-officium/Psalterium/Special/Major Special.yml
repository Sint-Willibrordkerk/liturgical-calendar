rubrica-tridentina/suffragium-vespera:
  - "!De cruce"
  - Ant. Per signum Crucis de inimícis nostris líbera nos, Deus noster.
  - _
  - V. Omnis terra adóret te, et psallat tibi.
  - R. Psalmum dicat nómini tuo, Dómine.
  - _
  - $Oremus
  - v. Perpétua nos, quǽsumus, Dómine, pace custódi, quos per lignum sanctæ
    Crucis redímere dignátus es.
  - _
  - "@:Suffragium BMV Ant"
  - _
  - "@:Versum et Oratio BMV"
  - _
  - "!De sancto Joseph"
  - Ant. Ecce fidélis servus et prudens, quem constítuit Dóminus super famíliam
    suam. (Allelúja.)
  - _
  - V. Glória et divítiæ in domo ejus. (Allelúja.)
  - R. Et justítia ejus manet in sǽculum sǽculi. (Allelúja.)
  - _
  - $Oremus
  - "v. Deus, qui ineffábili providéntia beátum Joseph sanctíssimæ Genitrícis
    tuæ sponsum elígere dignátus es: præsta quǽsumus; ut quem protectórem
    venerámur in terris, intercessórem habére mereámur in cælis."
  - _
  - "!De Apostolis"
  - Ant. Petrus Apóstolus, et Paulus Doctor Géntium, ipsi nos docuérunt legem
    tuam Dómine.
  - _
  - V. Constítues eos príncipes super omnem terram.
  - R. Mémores erunt nóminis tui Dómine.
  - _
  - $Oremus
  - "v. Deus, cujus déxtera beátum Petrum ambulántem in flúctibus, ne
    mergerétur, eréxit, et coapóstolum ejus Paulum tértio naufragántem de
    profúndo pélagi liberávit: exáudi nos propítius, et concéde; ut ambórum
    méritis, æternitátis glóriam consequámur."
  - _
  - "!De Patrono vel Titulo Ecclesiæ"
  - /:fiat com. consueata ante vel post Commemorationes prædictas, pro dignitate
    illius, et ultimo loco::/
  - _
  - "!De Pace"
  - Ant. Da pacem Dómine in diébus nostris, quia non est álius, qui pugnet pro
    nobis, nisi tu Deus noster. (Allelúja.)
  - _
  - V. Fiat pax in virtúte tua. (Allelúja.)
  - R. Et abundántia in túrribus tuis. (Allelúja.)
  - _
  - $Oremus
  - "v. Deus, a quo sancta desidéria, recta consília, et justa sunt ópera: da
    servis tuis illam, quam mundus dare non potest, pacem; ut et corda nostra
    mandátis tuis dédita, et hóstium subláta formídine, témpora sint tua
    protectióne tranquílla."
  - $Per Dominum
