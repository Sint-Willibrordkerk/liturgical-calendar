    illius nomen non sit in eadem Suffragii Oratione expressum; ac nomina
    sanctorum Angelorum et sancti Joannis Baptistæ, si Titulares fuerint,
    præponuntur nomini sancti Joseph. In hisce autem omnibus casibus et
    omittuntur verba «atque beáto N.». Si Titularis ante omnes fuerit
    nominandus, particula «cum» omittitur ante nomen sanctorum Petri et Pauli ac
    præponitur nomini Sancti Joseph.:/
  - $Oremus
  - "v. A cunctis nos, quǽsumus, Dómine, mentis et córporis defénde perículis:
