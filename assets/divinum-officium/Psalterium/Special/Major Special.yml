    de ipso ratione Festi factum non fuerit Officium vel Commemoratio, aut
    illius nomen non sit in eadem Suffragii Oratione expressum; ac nomina
    sanctorum Angelorum et sancti Joannis Baptistæ, si Titulares fuerint,
    præponuntur nomini sancti Joseph. In hisce autem omnibus casibus et
    omittuntur verba «atque beáto N.». Si Titularis ante omnes fuerit
    nominandus, particula «cum» omittitur ante nomen sanctorum Petri et Pauli ac
    præponitur nomini Sancti Joseph.:/
  - $Oremus
  - "v. A cunctis nos, quǽsumus, Dómine, mentis et córporis defénde perículis:
    et, intercedénte beáto Joseph, cum beátis Apóstolis tuis Petro et Paulo,
    atque beáto~"
  - r. N. et ómnibus Sanctis, salútem nobis tríbue benígnus et pacem; ut,
    destrúctis adversitátibus et erróribus univérsis, Ecclésia tua secúra tibi
    sérviat libertáte.
  - $Per eundem
tempore-paschali/rubrica-divino/suffragium:
  - Ant. Crucifíxus surréxit a mórtuis, et redémit nos, allelúja, allelúja.
  - _
  - V. Dícite in natiónibus, allelúja.
  - R. Quia Dóminus regnávit a ligno, allelúja.
  - _
  - $Oremus
  - "v. Deus qui pro nobis Fílium tuum Crucis patíbulum subíre voluísti, ut
    inimíci a nobis expélleres potestátem: concéde nobis fámulis tuis; ut
    resurrectiónis grátiam consequámur."
  - $Per eundem
rubrica-tridentina/suffragium-laudes:
