hymnus-pasch-laudes:
  - "{:H-Auroracoelum:}v. Auróra cælum púrpurat,"
  - Æther resúltat láudibus,
  - Mundus triúmphans júbilat,
  - "Horrens avérnus ínfremit:"
  - _
  - Rex ille dum fortíssimus
  - De mortis inférno specu
  - Patrum senátum líberum
  - Edúcit ad vitæ jubar.
  - _
  - Cujus sepúlcrum plúrimo
  - Custóde signábat lapis,
  - Victor triúmphat, et suo
  - Mortem sepúlcro fúnerat.
  - _
  - Sat fúneri, sat lácrimis,
  - "Sat est datum dolóribus:"
  - Surréxit exstínctor necis,
  - Clamat corúscans Ángelus.
  - _
  - Ut sis perénne méntibus
  - Paschále, Jesu, gáudium,
  - A morte dira críminum
  - Vitæ renátos líbera.
  - _
  - "* Deo Patri sit glória,"
  - Et Fílio, qui a mórtuis
  - Surréxit, ac Paráclito,
  - In sempitérna sǽcula.
  - Amen.
hymnusm-pasch-laudes_:
  - v. Auróra lucis rútilat,
  - Cælum láudibus íntonat,
  - Mundus exsúltans júbilat,
  - "Gemens inférnus úlulat:"
  - _
  - Cum Rex ille fortíssimus,
  - Mortis confráctis víribus,
  - Pede concúlcans tártara,
  - Solvit a pœna míseros.
  - _
  - Ille qui clausus lápide
  - Custodítur sub mílite,
  - Triúmphans pompa nóbili,
  - Victor surgit de fúnere.
  - _
  - Solútis jam gemítibus,
  - Et inférni dolóribus,
  - Quia surréxit Dóminus,
  - Respléndens clamat Ángelus.
  - _
  - Quǽsumus, Auctor ómnium,
  - In hoc pascháli gáudio,
  - Ab omni mortis ímpetu
  - Tuum defénde pópulum.
  - _
  - Glória tibi Dómine,
  - Qui surrexíst[i] a mórtuis,
  - Cum Patr[e] et Sancto Spíritu,
  - In sempitérna sǽcula.
  - Amen.
hymnusm-pasch-laudesop_:
  - v. Sermóne blando Angelus
  - "Predíxit muliéribus:"
  - In Galilǽa Dóminus
  - Vidéndus est quantócius.
  - _
  - Illæ dum pergunt cóncite
  - Apóstolis hoc dícere,
  - Vidéntes eum vívere,
  - Osculántur pedes Dómini.
  - _
  - Quo ágnito discípuli
  - In Galilǽam própere
  - Pergunt vidére fáciem
  - Desiderátam Dómini.
  - _
  - Claro pascháli gáudio
  - Sol mundo nitet rádio,
  - Cum Christum jam Apóstoli
  - Visu cernunt corpóreo.
  - _
  - Osténsa sibi vúlnera,
  - In Christi carne fúlgida,
  - Resurrexísse Dóminum
  - Voce faténtur pública.
  - _
  - Rex Christe clementíssime,
  - "Tu corda nostra pósside:"
  - Ut tibi laudes débitas
  - Reddámus omni témpore.
  - _
  - Quǽsumus, Auctor ómnium,
  - In hoc pascháli gáudio,
  - Ab omni mortis ímpetu
  - Tuum defénde pópulum.
  - _
  - Glória tibi Dómine,
  - Qui surrexísti a mórtuis,
  - Cum Patre et Sancto Spíritu
  - In sempitérna sǽcula.
  - Amen.
