rubrica-cisterciensis/comment:
  - In Suffragium Vespera, the original regex included “s/$/~ /gm s/~
    (\s+[VvR]\.|\s+\$|$)/$1/sg”
  - However, this made the Antiphons very confusing and ugly, therefore deleting.
preces-feriales-laudes:
  - $Kyrie
  - $Pater noster Et
  - $Preces feriales Laudes
  - $Domine exaudi
preces-feriales-vespera:
  - $Kyrie
  - $Pater noster Et
  - $Preces feriales Vespera
  - $Domine exaudi
dominica-versum-0:
  - V. Excélsus super omnes gentes Dóminus.
  - R. Et super calos glória ejus.
feria-versum-0:
  - V. Fiat misericórdia tua, Dómine, super nos.
  - R. Quemádmodum sperávimus in te.
adv-versum-0:
  - V. Emítte Agnum, Dómine, dominatórem terræ.
  - R. De Petra desérti ad montem fília Sion.
nat-versum-0:
  - V. Puer natus est nobis.
  - R. Et fílius datus est nobis.
quadp-versum-0:
  - V. Excélsus super omnes gentes Dóminus.
  - R. Et super celos glória ejus.
quad-versum-0:
  - V. In mánibus portábunt te.
  - R. Ne forte offéndas ad lápidem pedem tuum.
quad5-versum-0:
  - V. Inténde ánimæ meæ, et líbera eam.
  - R. Propter inimícos meos éripe me.
pasch-versum-0:
  - V. In resurrectióne tua, Christe, allelúja.
  - R. Cæli et terra læténtur, allelúja.
asc-versum-0:
  - V. Ascéndo ad Patrem meum et Patrem vestrum, allelúja.
  - R. Deum meum et Deum vestrum, allelúja.
pent-versum-0:
  - V. Emítte Spíritum tuum, et creabúntur, allelúja.
  - R. Et renovábis fáciem terræ, allelúja.
suffragium-depatrono:
  - "!De Patrono vel Titulo Ecclesiæ"
  - /:fiat com. consueata ante vel post Commemorationes prædictas, pro dignitate
    illius, et ultimo loco::/
