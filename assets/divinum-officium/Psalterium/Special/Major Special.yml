feria2-ant-2:
  - Benedíctus * Dóminus Deus Israël, quia visitávit et liberávit nos.
rubrica-tridentina/feria2-ant-2:
  - Benedíctus * Dóminus Deus Israël.
rubrica-monastica/feria2-ant-2:
  - Benedíctus * Dóminus Deus Israël.
feria3-ant-2:
  - Eréxit nobis * Dóminus cornu salútis in domo David púeri sui.
feria3c-ant-2:
  - Salútem * ex inimícis nostris, et de manu ómnium, qui nos odérunt, líbera
    nos, Dómine.
feria4-ant-2:
  - De manu ómnium * qui odérunt nos, liberávit nos Dóminus.
rubrica-tridentina/feria4-ant-2:
  - De manu ómnium * qui odérunt nos, líbera nos Dómine.
rubrica-monastica/feria4-ant-2:
  - De manu ómnium * qui odérunt nos, líbera nos Dómine.
feria5-ant-2:
  - In sanctitáte * serviámus Dómino, et liberábit nos ab inimícis nostris.
feria5c-ant-2:
  - Ad dandam sciéntiam * plebi tuæ, Dómine, in remissiónem peccatórum eórum.
feria6-ant-2:
  - Per víscera misericórdiæ * Dei nostri visitávit nos Óriens ex alto.
feria7-ant-2:
  - Illúmina, Dómine, * sedéntes in ténebris et umbra mortis, et dírige pedes
    nostros in viam pacis.
rubrica-tridentina/feria7-ant-2:
