versum-4:
  - V. Custódi nos, Dómine, ut pupíllam óculi.
  - R. Sub umbra alárum tuárum prótege nos.
ant-4:
  - Salva nos, * Dómine, vigilántes, custódi nos dormiéntes; ut vigilémus cum
    Christo, et requiescámus in pace.
ant-4-quad:
  - Evígila super nos, * ætérne Salvátor, ne nos apprehéndat cállidus tentátor,
    quia tu nobis factus es sempitérnus adjútor.
ant-4-quad3:
  - "Média vita in morte sumus: quem quǽrimus adjutórem, nisi te, Dómine, qui
    pro peccátis nostris juste irásceris? * Sancte Deus, Sancte fortis, Sancte
    et miséricors Salvátor, amáræ morti ne tradas nos."
  - V. Ne projícias nos in témpore senectutis; cum defécerit virtus nostra, ne
    derelínquas nos, Dómine. Sancte Deus.
ant-4-quad5:
  - "O Rex glorióse inter Sanctos tuos, qui semper es laudábilis et tamen
    ineffábilis: tu in nobis es, Dómine, et nomen sanctum tuum invocátum est
    super nos: ne derelínquas nos Deus noster: ut in die judícii nos collocáre
    dignéris inter Sanctos et Eléctos tuos, Rex benedícte."
ant-4-pasch:
  - "Allelúja. Resurréxit Dóminus, allelúja: sicut dixit vobis, allelúja,
    allelúja."
ant-4-asc:
  - Allelúja. Ascéndens Christus in altum, allelúja, captívam duxit
    captivitátem, allelúja, allelúja.
ant-4-pent:
  - Allelúja. Spíritus Paráclitus, allelúja, docébit vos ómnia, allelúja,
    allelúja.
