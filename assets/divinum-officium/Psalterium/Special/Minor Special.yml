rubrica-ordo-praedicatorum/hymnus-completorium-pasch:
  - v. Jesu nostra redémptio,
  - Amor et desidérium,
  - Deus Creátor ómnium,
  - "Homo in fine témporum:"
  - _
  - Quæ te vicit cleméntia,
  - Ut ferres nostra crímina,
  - Crudélem mortem pátiens,
  - Ut nos a morte tólleres!
  - _
  - Inférni claustra pénetrans,
  - Tuos captívos rédimens,
  - Victor triúmpho nóbili
  - Ad dextram Patris résidens.
  - _
  - Ipsa te cogat píetas,
  - Ut mala nostra súperes
  - Parcénd[o], et voti cómpotes
  - Nos tuo vultu sáties.
  - _
  - Tu esto nostrum gáudium,
  - Qui es futúrus prǽmium,
  - Sit nostra in te glória,
  - Per cuncta semper sǽcula.
  - Amen.
  - v. Ad cenam Agni próvidi,
  - Et stolis albis cándidi,
  - Post tránsitum maris Rubri,
  - Christo canámus Príncipi.
  - _
  - Cujus corpus sanctíssimum,
  - In ara crucis tórridum,
  - Cruóre ejus róseo
  - Gustándo vívimus Deo.
  - _
  - Protécti Paschæ véspere
  - A devastánte Angelo,
  - Erépti de duríssimo
  - Pharaónis império.
  - _
  - Jam Pascha nostrum Christus est,
  - "Qui immolátus agnus est:"
  - Sinceritátis ázyma,
  - Caro ejus obláta est.
  - _
  - O vere digna hóstia,
  - Per quam fracta sunt tártara,
  - Redémpta plebs captiváta,
  - Réddita vitæ prǽmia.
  - _
  - Consúrgit Christus túmulo,
  - Victor redit de bárathro,
  - Tyránnum trudens vínculo,
  - Et Paradísum réserans.
  - _
  - Quǽsumus, Auctor ómnium,
  - In hoc pascháli gáudio,
  - Ab omni mortis ímpetu
  - Tuum defénde pópulum.
  - _
  - Glória tibi Dómine,
  - Qui surrexíst[i] a mórtuis,
  - Cum Patr[e] et Sancto Spíritu,
  - In sempitérna sǽcula.
  - Amen.
