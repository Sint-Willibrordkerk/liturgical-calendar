rubrica-praedicatorum/hymnusm-quad:
  - Summi largítor prǽmii,
  - Spes qui es única mundi,
  - Preces inténde servórum,
  - Ad te devóte clamántium.
  - _
  - Nostra te consciéntia
  - "Grave offendísse monstra:"
  - Quam emúndes, supplicamus,
  - Ab ómnibus piáculis.
  - _
  - Si rénuis, quis tríbuet?
  - "Indúlge, qui potens es:"
  - Te corde rogáre mundo
  - Fac nos precámur, Dómine.
  - _
  - Ergo nunc accépta nostrum,
  - "Qui sacrásti jejúnium:"
  - Quo mýstuce paschália
  - Capiámus sacraménta.
  - _
  - Summa nobis hoc cónferat
  - "In Deitáte Trínitas:"
  - In qua gloriátur unus
  - Per cuncta sǽcula Deus.
  - Amen.
