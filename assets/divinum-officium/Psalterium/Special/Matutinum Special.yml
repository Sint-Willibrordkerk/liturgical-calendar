day0-hymnus1m:
  - v. Primo diérum ómnium,
  - Quo mundus extat cónditus,
  - Vel quo resúrgens Cónditor
  - Nos morte victa líberat.
  - _
  - Pulsis procul torpóribus
  - Surgámus omnes ócius,
  - Et nocte quærámus pium
  - Sicut prophétam nóvimus.
  - _
  - Nostras preces ut áudiat,
  - "Suámque dextram pórrigat:"
  - Et expiátos sórdibus
  - Reddat polórum sédibus.
  - _
  - Ut quique sacratíssimo
  - Hujus diéi témpore
  - Horis quiétis psállimus,
  - Donis beátis múneret.
  - _
  - Jam nunc patérna cláritas
  - "Te postulámus áffatim:"
  - Absit libído sórdidans
  - Et omnis actus nóxius.
  - _
  - Ne fœda sit, vel lúbrica
  - Compágo nostri córporis,
  - Per quem Avérni ígnibus
  - Ipsi cremémur ácrius.
  - _
  - Ob hoc Redémptor, quǽsumus,
  - Ut probra nostra díluas,
  - Vitæ perénnis cómmoda
  - Nobis benígne cónferas.
  - _
  - Quo carnis actu éxsules
  - Effécti ipsi cælibes,
  - Ut præstolámur cérnui,
  - Melos canámus glóriæ.
  - _
  - "* Præsta, Pater piíssime,"
  - Patríque compar Únice,
  - Cum Spíritu Paráclito
  - Regnans per omne sǽculum.
  - Amen.
rubrica-cisterciensis/day0-hymnus1m:
  - v. Ætérne rerum Cónditor,
  - Noctem diémque qui regis,
  - Et témporum das témpora,
  - Ut álleves fastídium.
  - _
  - Præco diéi jam sonat,
  - Noctis profúndæ pérvigil,
  - Noctúrna lux viántibus,
  - A nocte noctem ségregans.
  - _
  - Hoc excitátus Lúcifer
  - Solvit polum calígine,
  - Hoc omnis errónum cohors
  - Viam nocéndi déserit.
  - _
  - Hoc nauta vires cólligit,
  - "Pontíque mitéscunt freta:"
  - Hoc, ipsa Petr[a] Ecclésiæ,
  - Canénte, culpam díluit.
  - _
  - Surgámus ergo strénue,
  - Gallus jacéntes éxcitat,
  - Et somnoléntos íncrepat,
  - Gallus negántes árguit.
  - _
  - Gallo canénte spes redit,
  - Ægris salus refúnditur,
  - Mucro latrónis cónditur,
  - Lapsis fides revértitur.
  - _
  - Jesu labéntes réspice,
  - "Et nos vidéndo córrige:"
  - Si réspicis, lapsus cadunt,
  - Fletúque culpa sólvitur.
  - _
  - Tu lux refúlge sénsibus,
  - "Mentísque somnum díscute:"
  - Te nostra vox primum sonet,
  - Et vota solvámus tibi.
  - _
  - Deo Patri sit glória,
  - Ejúsque soli Fílio,
  - Cum Spíritu Paráclito,
  - Et nunc et in perpétuum.
  - Amen.
day0-hymnus1:
  - "{:H-MatDom4:}v. Primo die, quo Trínitas"
  - Beáta mundum cóndidit,
  - Vel quo resúrgens Cónditor
  - "Nos, morte victa, líberat:"
  - _
  - Pulsis procul torpóribus,
  - Surgámus omnes ócius,
  - Et nocte quærámus Deum,
  - "Prophéta sicut prǽcipit:"
  - _
  - Nostras preces ut áudiat
  - Suámque dextram pórrigat,
  - Et expiátos sórdibus
  - "Reddat polórum sédibus:"
  - _
  - Ut, quique sacratíssimo
  - Hujus diéi témpore
  - Horis quiétis psállimus,
  - Donis beátis múneret.
  - _
  - Jam nunc, patérna cláritas,
  - "Te postulámus áffatim:"
  - Absint faces libídinis,
  - Et omnis actus nóxius.
  - _
  - Ne fœda sit, vel lúbrica
  - Compágo nostri córporis,
  - Ob cujus ignes ígnibus
  - Avérnus urat ácrius.
  - _
  - Mundi Redémptor, quǽsumus,
  - Tu probra nostra díluas;
  - Nobísque largus cómmoda
  - Vitæ perénnis cónferas.
  - _
  - "* Præsta, Pater piíssime,"
  - Patríque compar Únice,
  - Cum Spíritu Paráclito
  - Regnans per omne sǽculum.
  - Amen.
day1-hymnusm:
  - "{:H-MatFeria:}v. Somno reféctis ártubus,"
  - "Spreto cubíli, súrgimus:"
  - Nobis, Pater, canéntibus
  - Adésse te depóscimus.
  - _
  - Te lingua primum cóncinat,
  - "Te mentis ardor ámbiat:"
  - Ut áctuum sequéntium
  - Tu, Sancte, sis exórdium.
  - _
  - Cedant tenébræ lúmini,
  - Et nox diúrno síderi,
  - Ut culpa, quam nox íntulit,
  - Lucis labáscat múnere.
  - _
  - Precámur iídem súpplices,
  - Noxas ut omnes ámputes,
  - Et ore te canéntium
  - Laudéris omni témpore.
  - _
  - "* Præsta, Pater piíssime,"
  - Patríque compar Únice,
  - Cum Spíritu Paráclito
  - Regnans per omne sǽculum.
  - Amen.
