hymnusm-pasch:
  - v. Rex sempitérne Dómine,
  - Rerum Creátor ómnium,
  - Qui eras ante sǽcula
  - "Semper cum Patre Fílius:"
  - _
  - Qui mundi in primórdio
  - "Adam plásmasti hóminem:"
  - Cui tuæ imágini
  - Vultum dedísti símilem.
  - _
  - Quem diábolus decéperat,
  - Hostis humáni géneris,
  - Cujus tu formam córporis
  - "Assúmere dignátus es:"
  - _
  - Ut hóminem redímeres,
  - "Quem ante jam plasmáveras:"
  - Et nos Deo conjúngeres,
  - Per carnis contubérnium.
  - _
  - Quem éditum ex Vírgine
  - "Pavéscit omnis ánima:"
  - Per quem et nos resúrgere
  - Devóta mente crédimus.
  - _
  - Qui nobis in Baptísmate
  - Donásti indulgéntiam,
  - Qui tenebámur vínculis
  - Ligáti consciéntiæ.
  - _
  - Qui Crucem propter hóminem
  - "Suscípere dignátus es:"
  - Dedísti tuum sánguinem
  - Nostræ salútis prétium.
  - _
  - Quǽsumus Auctor ómnium,
  - In hoc Pascháli gáudio,
  - Ab omni mortis ímpetu
  - Tuum defénde pópulum.
  - _
  - Glória tibi Dómine,
  - Qui surrexísti a mórtuis,
  - Cum Patre et Sancto Spíritu,
  - In sempitérna sǽcula.
  - Amen.
rubrica-praedicatorum/hymnusm-pasch:
  - v. Auróra lucis rútilat,
  - Cælum láudibus íntonat,
  - Mundus exsúltans júbilat,
  - "Gemens inférnus úlulat:"
  - _
  - Cum Rex ille fortíssimus,
  - Mortis confráctis víribus,
  - Pede concúlcans tártara,
  - Solvit a pœna míseros.
  - _
  - Ille qui clausus lápide
  - Custodítur sub mílite,
  - Triúmphans pompa nóbili,
  - Victor surgit de fúnere.
  - _
  - Solútis jam gemítibus,
  - Et inférni dolóribus,
  - Quia surréxit Dóminus,
  - Respléndens clamat Ángelus.
  - _
  - Quǽsumus, Auctor ómnium,
  - In hoc pascháli gáudio,
  - Ab omni mortis ímpetu
  - Tuum defénde pópulum.
  - _
  - Glória tibi Dómine,
  - Qui surrexíst[i] a mórtuis,
  - Cum Patr[e] et Sancto Spíritu,
  - In sempitérna sǽcula.
  - Amen.
hymnus-pasch:
  - "{:H-MatPasc:}v. Rex sempitérne Cǽlitum,"
  - Rerum Creátor ómnium,
  - Æquális ante sǽcula
  - "Semper Parénti Fílius:"
  - _
  - Nascénte qui mundo Faber
  - Imáginem vultus tui
  - Tradens Adámo, nóbilem
  - Limo jugásti spíritum.
  - _
  - Cum livor et fraus dǽmonis
  - "Fœdásset humánum genus:"
  - Tu, carne amíctus, pérditam
  - Formam refórmas ártifex.
  - _
  - Qui, natus olim e Vírgine,
  - Nunc e sepúlcro násceris,
  - Tecúmque nos a mórtuis
  - Jubes sepúltos súrgere.
  - _
  - Qui, pastor ætérnus, gregem
  - "Aqua lavas baptísmatis:"
  - "Hæc est lavácrum méntium:"
  - Hæc est sepúlcrum críminum.
  - _
  - Nobis diu qui débitæ
  - Redémptor affíxus cruci,
  - Nostræ dedísti pródigus
  - Prétium salútis sánguinem.
  - _
  - Ut sis perénne méntibus
  - Paschále, Jesu, gáudium,
  - A morte dira críminum
  - Vitæ renátos líbera.
  - _
  - "* Deo Patri sit glória,"
  - Et Fílio, qui a mórtuis
  - Surréxit, ac Paráclito,
  - In sempitérna sǽcula.
  - Amen.
mm-lb-pasch:
  - "!Osea 6:1-3"
  - v. Veníte, et revertámur ad Dóminum, quia ipse cepit, et sanábit nos;
    percútiet, et curábit nos. Vivificábit nos post duos dies; in die tértia
    suscitábit nos, et vivémus in conspéctu ejus. Sciémus, sequemúrque, ut
    cognoscámus Dóminum.
  - $Tu autem
  - _
  - R.br. Gavísi sunt discípuli, * Allelúja, allelúja.
  - R. Gavísi sunt discípuli, * Allelúja, allelúja.
  - V. Viso Dómino.
  - R. Allelúja, allelúja.
  - "&Gloria"
  - R. Gavísi sunt discípuli, * Allelúja, allelúja.
mm-lb1:
  - "!Lam 2:19"
  - "v. Consúrge, lauda in nocte in princípio vigiliárum: effúnde sicut aquam
    cor tuum ante conspéctum Dómini: leva ad eum manus tuas."
  - $Tu autem
  - _
  - R.br. Benedícam Dóminum * In omni témpore.
