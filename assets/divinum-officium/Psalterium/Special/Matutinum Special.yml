day6-hymnusm:
  - v. Summæ Deus cleméntiæ,
  - Mundíque Factor máchinæ,
  - Unus potentiáliter,
  - "Trinúsque personáliter:"
  - _
  - Nostros pius cum cánticis
  - "Fletus benígne súscipe:"
  - Quo corde puro sórdibus
  - Te perfruámur lárgius.
  - _
  - Lumbos, jecúrque mórbidum
  - Adúre igni cóngruo,
  - Accíncti ut sint pérpetim,
  - Luxu remóto péssimo.
  - _
  - Ut quique horas nóctium
  - Nunc concinéndo rúmpimus,
  - Donis beátæ pátriæ
  - Ditémur omnes áffatim
  - _
  - "* Præsta, Pater piíssime,"
  - Patríque compar Únice,
  - Cum Spíritu Paráclito
  - Regnans per omne sǽculum.
  - Amen.
day6-hymnus:
  - "{:H-MatFeria:}v. Summæ Parens cleméntiæ,"
  - Mundi regis qui máchinam,
  - Uníus et substántiæ,
  - "Trinúsque persónis Deus:"
  - _
  - Nostros pius cum cánticis
  - "Fletus benígne súscipe:"
  - Ut corde puro sórdium
  - Te perfruámur lárgius.
  - _
  - Lumbos, jecúrque mórbidum
  - Flammis adúre cóngruis,
  - Accíncti ut artus éxcubent,
  - Luxu remóto péssimo.
  - _
  - Quicúmque ut horas nóctium
  - Nunc concinéndo rúmpimus,
  - Ditémur omnes áffatim
  - Donis beátæ pátriæ.
  - _
  - "* Præsta, Pater piíssime,"
  - Patríque compar Únice,
  - Cum Spíritu Paráclito
  - Regnans per omne sǽculum.
  - Amen.
hymnusm-adv:
  - v. Verbum supérnum, pródiens
  - A Patre olim éxiens,
  - Qui natus orbi súbvenis,
  - Cursu declívi témporis.
  - _
  - Illúmina nunc péctora,
  - Tuóque amóre cóncrema;
  - Audíto ut præcónio
  - Sint pulsa tandem lúbrica.
  - _
  - Judéxque cum post áderis
  - Rimári facta péctoris,
  - Reddens vicem pro ábditis,
  - Justísque regnum pro bonis.
  - _
  - Non demum arctémur malis
  - Pro qualitáte críminis;
  - Sed cum beátis cómpotes
  - Simus perénnes cælibes.
  - _
  - Laus, honor, virtus, glória,
  - Deo Patri, et Fílio,
  - Sancto simul Paráclito,
  - In sæculórum sǽcula.
  - Amen.
hymnus-adv:
  - "{:H-MatAdv:}v. Verbum supérnum, pródiens"
  - E Patris ætérni sinu,
  - Qui natus orbi súbvenis,
  - "Labénte cursu témporis:"
  - _
  - Illúmina nunc péctora,
  - Tuóque amóre cóncrema;
  - Ut cor cadúca déserens
  - Cæli volúptas ímpleat.
  - _
  - Ut, cum tribúnal Júdicis
  - Damnábit igni nóxios,
  - Et vox amíca débitum
  - Vocábit ad cælum pios;
  - _
  - Non esca flammárum nigros
  - Volvámur inter túrbines,
  - Vultu Dei sed cómpotes
  - Cæli fruámur gáudiis.
  - _
  - "* Patri, simúlque Fílio,"
  - Tibíque, Sancte Spíritus,
  - Sicut fuit, sit júgiter
  - Sæclum per omne glória.
  - Amen.
hymnusm-quad:
  - "{:H-MatQuad:}v. Ex more docti mýstico"
  - Servémus hoc jejúnium,
  - Deno diérum círculo
  - Ducto quater notíssimo.
  - _
  - Lex et prophétæ prímitus
  - Hoc prætulérunt, póstmodum
  - Christus sacrávit, ómnium
  - Rex atque factor témporum.
  - _
  - Utámur ergo párcius
  - Verbis, cibis et pótibus,
  - Somno, jocis, et árctius
  - Perstémus in custódia.
  - _
  - Vitémus autem nóxia,
  - "Quæ súbruunt mentes vagas:"
  - Nullúmque demus cállidi
  - Hostis locum tyránnidi.
  - _
  - Flectámus iram víndicem,
  - Plorémus ante Júdicem,
  - Clamémus ore súpplici,
  - "Dicámus omnes cérnui:"
  - _
  - Nostris malis offéndimus
  - "Tuam, Deus, cleméntiam:"
  - Effúnde nobis désuper,
  - Remíssor, indulgéntiam.
  - _
  - Meménto quod sumus tui,
  - "Licet cadúci, plásmatis:"
  - Ne des honórem nóminis
  - Tui, precámur, álteri.
  - _
  - Laxa malum, quod fécimus,
  - "Auge bonum, quod póscimus:"
  - Placére quo tandem tibi
  - Possímus hic, et pérpetim.
  - _
  - Præsta, beáta Trínitas,
  - Concéde, simplex Únitas,
  - Ut fructuósa sint tuis
  - Jejuniórum múnera.
  - Amen.
