bissextal-note:
  - "{In anno bissextili Februarius est dierum} 29, {et Festum S. Matthiæ
    celebratur die} 25,"
  - "{ac Festum S. Gabrielis a Virgo Perdolente die} 28 {Februarii,}"
  - "{et bis dicitur} Sexto Kalendas, {id est die} 24 {et die} 25 {et littera
    Dominicalis, quæ assumpta fuit in mense Januario, mutatur in præcedentem;
    ut, si in Januario littera Dominicalis fuerit} A, {mutetur in præcedentem,
    quæ est} g {etc.; et littera} f {bis servit,} 24 {et} 25."
nigra19-note:
  - "{Hæc Epacta} 19 {nigra nunquam est in usu, nisi quando eadem anna concurrit
    cum Aurea numero} xix."
