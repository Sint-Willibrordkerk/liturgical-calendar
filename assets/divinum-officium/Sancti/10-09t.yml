  - "@C3a"
lectio4:
  - "Dionysius Atheniensis, unus ex Areopagitis judicibus, vir fuit omni
    doctrinæ genere instinctus. Qui cum adhuc in Gentilitatis errore versaretur,
    eo die quo Christus Dominus cruci affixus est, solem præter naturam
    defecisse animadvertens, exclamasse traditur: Aut Deus naturæ patitur, aut
    mundi machina dissolvetur. Sed cum Paulus Apostolus veniens Athenas, et in
    Areopagum ductus, rationem reddidisset ejus doctrinæ quam prædicabat,
    affirmans Christum Dominum resurrexisse, et mortuos omnes in vitam redituros
    esse: cum alii multi, tum ipse Dionysius in Christum credidit."
lectio5:
  - "Itaque et baptizatus est ab Apostolo, et Atheniensium ecclesiæ præfectus.
    Qui cum postea Romam venisset, a Clemente Pontifice missus est in Galliam
    prædicandi Evangelii causa. Quem Lutétiam usque Parisiorum Rusticus
    presbyter, et Eleutherius diaconus prosecuti sunt: ubi a Fescennio præfecto,
    quod multos ad christianam religionem convertisset, ipse cum sociis virgis
    cæsus est: cumque in prædicatione christianæ fidei constantissime
    perseveraret, in craticulam subjecto igne injicitur, multisque præterea
    suppliciis una cum sociis cruciatur."
lectio6:
  - Sed ea tormentorum genera omnibus forti ac libenti animo perferentibus
    Dionysius annum agens supra centesimum, cum reliquis securi percutitur
    septimo Idus Octobris. De quo illud memoriæ proditum est, abscissum suum
    caput sustulisse, et progressum ad duo millia passuum in manibus gestasse.
    Libros scripsit admirabiles, ac plane cælestes, de divinis nominibus, de
    cælesti et ecclesiastica hierarchia, de mystica theologia, et alios quosdam.
lectio94:
  - "Dionysius Atheniénsis, unus ex Areopagítis judícibus, cum adhuc in
    gentilitátis erróre versarétur, eo die, quo Christus Dóminus Cruci affixus
    est, solem præter natúram defécisse animadvertens, exclamasse tráditur: Aut
    Deus natúræ pátitur, aut mundi máchina dissolvitur. Cum autem Paulus
    Apóstolus in Areopágo Christum annuntiásset, Dionysius fidem christianam
    amplexus, ab eodem Apóstolo Atheniensium ecclésiæ præfectus est. Postea, ut
    traditur, Romam veniens, et a Cleménte Pontifice missus in Gálliam, Lutétiam
    usque Parisiórum, cum Rustico presbytero et Eleutherio diacono, Evangélium
    prædicávit. Ibi omnes, quod Christum prædicarent, a Fescennio præfecto
    apprehénsi, variis tormentis cruciántur, et demum secúri feriúntur septimo
    Idus Octobris."
