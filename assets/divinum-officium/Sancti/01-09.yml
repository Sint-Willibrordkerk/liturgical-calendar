ant-1:
  - Lux de luce * apparuísti, Christe, cui Magi múnera ófferunt, allelúja,
    allelúja, allelúja.
responsory1:
  - "R. Tria sunt múnera pretiósa, quæ obtulérunt Magi Dómino in die ista, et
    habent in se divína mystéria:"
  - "* In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum
    consídera: et in myrrha, Domínicam sepultúram."
  - V. Salútis nostræ auctórem Magi veneráti sunt in cunábulis, et de thesáuris
    suis mýsticas ei múnerum spécies obtulérunt.
  - "R. In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum
    consídera: et in myrrha, Domínicam sepultúram."
responsory2:
  - "R. In colúmbæ spécie Spíritus Sanctus visus est, Patérna vox audíta est:"
  - "* Hic est Fílius meus diléctus, in quo mihi bene complácui."
  - V. Cæli apérti sunt super eum, et vox Patris intónuit.
  - R. Hic est Fílius meus diléctus, in quo mihi bene complácui.
responsory3:
  - "R. Reges Tharsis et ínsulæ múnera ófferent:"
  - "* Reges Arabum et Saba dona Dómino Deo addúcent."
  - V. Omnes de Saba vénient, aurum et thus deferéntes.
  - R. Reges Arabum et Saba dona Dómino Deo addúcent.
  - "&Gloria"
  - R. Reges Arabum et Saba dona Dómino Deo addúcent.
lectio4:
  - Sermo sancti Leónis Papæ
  - "!Sermo 1 de Epiphania"
  - "Celebrato próximo die, quo intemeráta virginitas humani generis edidit
    Salvatórem, Epiphaníæ nobis, dilectíssimi, veneranda festívitas dat
    perseverantiam gaudiórum: ut inter cognatárum solemnitátum vicina
    sacramenta, exsultatiónis vigor, et fervor fidei non tepescat. Ad ómnium
    enim hóminum spectat salútem, quod infántia mediatoris Dei et hóminum, jam
    universo declarabátur mundo, cum adhuc exíguo detinerétur oppídulo."
lectio5:
  - "Quamvis enim Israëliticam gentem, et ipsíus gentis unam familiam
    delegísset, de qua natúram univérsæ humanitátis assumeret: nóluit tamen
    intra maternæ habitatiónis angustias ortus sui latére primordia: sed mox ab
    ómnibus vóluit agnosci, qui dignátus est pro ómnibus nasci. Tribus ígitur
    Magis in regióne Oriéntis stella novæ claritátis appáruit, quæ illustrior
    ceteris pulchriorque sidéribus, fácile in se intuéntium óculos animosque
    convérteret: ut conféstim adverterétur, non esse otiosum, quod tam insólitum
    videbátur."
lectio6:
  - "Dedit ergo aspiciéntibus intelléctum, qui præstitit signum: et quod fecit
    intelligi, fecit inquiri, et se inveniéndum óbtulit requisítus. Sequúntur
    tres viri superni lúminis ductum, et prævii fulgoris indícium inténta
    contemplatióne comitántes, ad agnitiónem veritátis, gratiæ splendore
    ducúntur: qui humano sensu significátum sibi Regis ortum æstimavérunt in
    civitáte regia esse quæréndum. Sed qui servi susceperat formam, et non
    judicáre vénerat, sed judicári, Bethlehem præelégit nativitáti, Jerosolymam
    passióni."
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 2:1-12"
  - "Cum natus esset Jesus in Bethlehem Juda in diébus Herodis regis, ecce Magi
    ab Oriénte venérunt Jerosolymam, dicéntes: Ubi est qui natus est Rex
    Judæórum? Et réliqua."
  - _
  - De Homilía sancti Gregórii Papæ
  - "!Ex Homilía 10 in Evangelia"
  - "Magnum vero nobis aliquid Magi ínnuunt, quod in regiónem suam per aliam
    viam revertúntur. In eo namque quod admóniti faciunt, nobis profecto
    insinuant quid faciámus. Regio quippe nostra paradisus est: ad quam, Jesu
    cógnito, redire per viam, qua vénimus, prohibemur. A regióne étenim nostra
    superbiéndo, inobediendo, visibília sequéndo, cibum vétitum gustando
    discessimus: sed ad eam necesse est, ut flendo, obediendo, visibília
    contemnendo, atque appetítum carnis refrenando redeamus."
lectio8:
  - "Per aliam ergo viam ad regiónem nostram regrédimur: quóniam qui a paradisi
    gaudiis per delectaménta discessimus, ad hæc per laménta revocamur. Unde
    necesse est, fratres caríssimi, ut semper pávidi, semperque suspecti,
    ponámus ante óculos cordis, hinc culpas operis, illinc judícium extremæ
    districtiónis. Pensemus, quam districtus judex véniat, qui judícium minátur,
    et latet: terróres peccatóribus intentat, et tamen adhuc sústinet: et
    idcirco veníre citius differt, ut minus invéniat quod condemnet."
lectio9:
  - "Puniámus fletibus culpas, et cum Psalmistæ voce, præveniámus fáciem ejus in
    confessione. Voluptátum nos ergo fallacia nulla decipiat, nulla vana lætítia
    seducat. In próximo namque est judex, qui dixit: Væ vobis, qui ridetis nunc;
    quia lugébitis et flébitis. Hinc enim Sálomon ait: Risus dolori miscébitur:
    et, Extrema gaudii luctus óccupat. Hinc íterum dicit: Risum deputávi
    errórem, et gáudio dixi, Quid frustra decíperis? Hinc rursus ait: Cor
    sapiéntium ubi tristítia est: et cor stultórum ubi lætítia."
  - "&teDeum"
ant-2:
  - Vídimus stellam ejus * in Oriénte, et vénimus cum munéribus adoráre Dóminum.
ant-3:
  - "Interrogábat * Magos Heródes: Quod signum vidístis super natum Regem?
    Stellam vídimus fulgéntem, cujus splendor illúminat mundum."
