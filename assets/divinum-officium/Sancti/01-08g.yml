  lectio1:
    - Incipit Epístola prima beáti Pauli Apóstoli ad Corínthios
    - "!1 Cor 1:1-3"
    - 1 Paulus vocátus Apóstolus Jesu Christi per voluntátem Dei, et Sósthenes
      frater,
    - 2 ecclésiæ Dei, quæ est Corínthi, sanctificátis in Christo Jesu, vocátis
      sanctis, cum ómnibus qui ínvocant nomen Dómini nostri Jesu Christi, in
      omni loco ipsórum et nostro.
    - 3 Grátia vobis, et pax a Deo Patre nostro, et Dómino Jesu Christo.
  lectio2:
    - "!1 Cor 1:4-9"
    - "4 Grátias ago Deo meo semper pro vobis in grátia Dei, quæ data est vobis
      in Christo Jesu:"
    - 5 quod in ómnibus dívites facti estis in illo, in omni verbo, et in omni
      sciéntia.
    - "6 Sicut testimónium Christi confirmátum est in vobis:"
    - 7 ita ut nihil vobis desit in ulla grátia, exspectántibus revelatiónem
      Dómini nostri Jesu Christi,
    - 8 qui et confirmábit vos usque in finem sine crímine, in die advéntus
      Dómini nostri Jesu Christi.
    - "9 Fidélis Deus: per quem vocáti estis in societátem fílii ejus Jesu
      Christi Dómini nostri."
  lectio3:
    - "!1 Cor 1:10-13"
    - "10 Obsécro autem vos fratres per nomen Dómini nostri Jesu Christi: ut
      idípsum dicátis omnes, et non sint in vobis schísmata: sitis autem
      perfécti in eódem sensu, et in eádem senténtia."
    - 11 Significátum est enim mihi de vobis fratres mei ab iis, qui sunt
      Chloes, quia contentiónes sunt inter vos.
    - "12 Hoc autem dico, quod unusquísque vestrum dicit: Ego quidem sum Pauli:
      ego autem Apóllo: ego vero Cephæ: ego autem Christi."
    - 13 Divísus est Christus? numquid Paulus crucifíxus est pro vobis? aut in
      nómine Pauli baptizáti estis?
