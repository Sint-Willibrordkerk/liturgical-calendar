  lectio4:
    - Sermo sancti Leónis Papæ
    - "!Serm. 4. de Epiphania"
    - Justum et rationábile, dilectíssimi, veræ pietátis obséquium est, in
      diébus, qui divínæ ópera misericórdiæ protestántur, toto corde gaudére, et
      honorífice ea, quæ ad salútem nostram gesta sunt, celebráre, vocánte nos
      ad hanc devotiónem ipsa recurréntium témporum lege, quæ nobis post diem,
      in quo coætérnus Patri Fílius Dei natus ex Vírgine est, brevi intervállo
      Epiphaníæ íntulit festum, ex apparitióne Dómini consecrátum.
  lectio5:
    - "In quo fídei nostræ magnum præsídium providéntia divína constítuit: ut,
      dum solémni veneratióne recólitur adoráta in exórdiis suis Salvatóris
      infántia, per ipsa originália documénta probarétur veri hóminis in Christo
      orta natúra. Hoc enim est, quod justíficat ímpios: hoc est, quod ex
      peccatóribus facit sanctos, si in uno eodémque Dómino nostro Jesu Christo
      et vera Déitas, et vera credátur humánitas: Déitas, qua ante ómnia sǽcula
      in forma Dei æquális est Patri: humánitas, qua novíssimis diébus in forma
      servi unítus est hómini."
  lectio6:
    - Ad roborándum ergo hanc fidem, quæ contra omnes pronuntiabátur erróres, ex
      magna gestum est divíni pietáte consílii, ut gens in longínqua Orientális
      plagæ regióne consístens, quæ spectandórum síderum arte pollébat, signum
      nati púeri, qui supra omnem Israël esset regnatúrus, accíperet. Nova
      étenim cláritas apud Magos stellæ illustrióris appáruit, et intuéntium
      ánimos ita admiratióne sui splendóris implévit, ut nequaquam sibi
      créderent negligéndum, quod tanto nuntiabátur indício.
  lectio7:
    - Léctio sancti Evangélii secúndum Lucam
    - "!Luc 2:42-51"
    - Cum factus esset Jesus annórum duódecim, ascendéntibus illis Jerosólymam
      secúndum consuetúdinem diéi festi, consummatísque diébus, cum redírent,
      remánsit puer Jesus in Jerúsalem. Et réliqua.
    - _
    - Homilía sancti Ambrósii Epíscopi
    - "!Lib. 2. in cap. 2. Lucæ, in fine"
    - "A duodécimo anno, ut légimus, Domínicæ súmitur disputatiónis exórdium.
      Hic enim prædicándæ fídei evangelizántium númerus debebátur. Nec otióse
      ímmemor suórum secúndum carnem paréntum, qui secúndum carnem útique
      sapiéntia Dei implebátur et grátia, post tríduum reperítur in templo: ut
      esset indício, quia post tríduum triumphális illíus passiónis, in sede
      cælésti, et honóre divíno, fídei nostræ se suscitátus offérret, qui
      mórtuus credebátur."
  lectio8:
    - "Quid est quod me quærebátis? Duæ sunt in Christo generatiónes: una est
      patérna, matérna áltera. Patérna illa divínior; matérna vero, quæ in
      nostrum labórem usúmque descéndit. Et ídeo quæ supra natúram, supra
      ætátem, supra consuetúdinem fiunt, non humánis assignánda virtútibus, sed
      divínis referénda sunt potestátibus. Alibi eum ad ministérium mater
      impéllit, hic mater arguitur, quia adhuc quæ humána sunt, éxigat. Sed cum
      hic duódecim describátur annórum, illic discípulos habére dicátur; vides
      matrem didicísse a fílio, ne exígeret a validióre ministérium, quæ
      stupébat in junióre miráculum."
  lectio9:
    - "Et venit Názareth, et erat súbditus illis. Quid enim magíster virtútis,
      nisi offícium pietátis impléret? Et mirámur, si Patri defert, qui súbditur
      matri? Non útique infirmitátis, sed pietátis ista subjéctio est: attóllat
      licet sævis emíssus látebris cóluber perfídiæ caput, et serpentínis évomat
      venéna pectóribus. Cum dicit se Fílius missum, majórem hæréticus appéllet
      Patrem, ut imperféctum Fílium dicat, qui potest habére majórem: ut aliénis
      auxíliis ásserat eum, qui míttitur, indigére. Numquid et humáno egébat
      auxílio, ut matérno servíret império?"
    - "&teDeum"
  ant-2:
    - "@:Ant 1"
  ant-3:
    - Fili, quid fecísti * nobis sic? Ego et pater tuus doléntes quærebámus te.
      Quid est quod me quærebátis? nesciebátis quia in iis, quæ Patris mei sunt,
      opórtet me esse?
  officium:
    - Dominica infra Octavam Epiphaniæ
  introitus:
