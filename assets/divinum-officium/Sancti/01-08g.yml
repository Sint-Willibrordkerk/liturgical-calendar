  oratio:
    - "Vota, quǽsumus, Dómine, supplicántis pópuli cælésti pietáte proséquere:
      ut et, quæ agénda sunt, vídeant, et ad implénda, quæ víderint,
      convaléscant."
    - $Per Dominum
  commemoratio-oratio:
    - "!Pro Octavam Epiphaniæ"
    - "@Sancti/01-06:Oratio"
  lectio:
    - Léctio Epístolæ beáti Pauli Apóstoli ad Romános.
    - "!Rom 12:1-5"
    - "Fratres: Obsecro vos per misericórdiam Dei, ut exhibeátis córpora vestra
      hóstiam vivéntem, sanctam, Deo placéntem, rationábile obséquium vestrum.
      Et nolíte conformári huic sǽculo, sed reformámini in novitáte sensus
      vestri: ut probétis, quæ sit volúntas Dei bona, et benéplacens, et
      perfécta. Dico enim per grátiam, quæ data est mihi, ómnibus qui sunt inter
      vos: Non plus sápere, quam opórtet sápere, sed sápere ad sobrietátem: et
      unicuique sicut Deus divísit mensúram fídei. Sicut enim in uno córpore
      multa membra habémus, ómnia autem membra non eúndem actum habent: ita
      multi unum corpus sumus in Christo, sínguli autem alter alteríus membra:
      in Christo Jesu, Dómino nostro."
  graduale:
    - "!Ps 71:18 ; 71:3"
    - Benedíctus Dóminus, Deus Israël, qui facit mirabília magna solus a sǽculo.
    - V. Suscípiant montes pacem pópulo tuo, et colles justítiam. Allelúja,
      allelúja
    - "!Ps 99:1"
    - "Jubiláte Deo, omnis terra: servíte Dómino in lætítia. Allelúja."
  evangelium:
    - Sequéntia ++ sancti Evangélii secúndum Lucam.
    - "!Luc 2:42-52"
    - "Cum factus esset Jesus annórum duódecim, ascendéntibus illis Jerosólymam
      secúndum consuetúdinem diéi festi, consummatísque diébus, cum redírent,
      remánsit puer Jesus in Jerúsalem, et non cognovérunt paréntes ejus.
      Existimántes autem illum esse in comitátu, venérunt iter diéi, et
      requirébant eum inter cognátos et notos. Et non inveniéntes, regréssi sunt
      in Jerúsalem, requiréntes eum. Et factum est, post tríduum invenérunt
      illum in templo sedéntem in médio doctórum, audiéntem illos et
      interrogántem eos. Stupébant autem omnes, qui eum audiébant, super
      prudéntia et respónsis ejus. Et vidéntes admiráti sunt. Et dixit Mater
      ejus ad illum: Fili, quid fecísti nobis sic? Ecce, pater tuus et ego
      doléntes quærebámus te. Et ait ad illos: Quid est, quod me quærebátis?
      Nesciebátis, quia in his, quæ Patris mei sunt, opórtet me esse? Et ipsi
      non intellexérunt verbum, quod locútus est ad eos. Et descéndit cum eis,
      et venit Názareth: et erat súbditus illis. Et Mater ejus conservábat ómnia
      verba hæc in corde suo. Et Jesus proficiébat sapiéntia et ætáte et grátia
      apud Deum et hómines."
  offertorium:
    - "!Ps 99:1; 99:2"
    - "Jubiláte Deo, omnis terra, servíte Dómino in lætítia: intráte in
      conspéctu ejus in exsultatióne: quia Dóminus ipse est Deus."
  secreta:
    - Oblátum tibi, Dómine, sacrifícium vivíficet nos semper et múniat.
    - $Per Dominum
  commemoratio-secreta:
    - "!Pro Octavam Epiphaniæ"
    - "@Sancti/01-06:Secreta"
  communio:
    - "!Luc 2:48; 2:49"
    - Fili, quid fecísti nobis sic? ego et pater tuus doléntes quærebámus te. Et
      quid est, quod me quærebátis? nesciebátis, quia in his, quæ Patris mei
      sunt, opórtet me esse?
  postcommunio:
    - "Súpplices te rogámus, omnípotens Deus: ut, quos tuis réficis sacraméntis,
      tibi étiam plácitis móribus dignánter deservíre concédas."
    - $Per Dominum
  commemoratio-postcommunio:
    - "!Pro Octavam Epiphaniæ"
    - "@Sancti/01-06:Postcommunio"
