lectio1:
  - De Actibus Apostolórum
  - "!Act 3:1-5"
  - 1 Petrus autem et Joánnes ascendébant in templum ad horam oratiónis nonam.
  - 2 Et quidam vir, qui erat claudus ex útero matris suæ, bajulabátur; quem
    ponébant cotídie ad portam templi, quæ dícitur Speciósa, ut péteret
    eleemósynam ab introëúntibus in templum.
  - 3 Is, cum vidísset Petrum et Joánnem incipiéntes introíre in templum,
    rogábat ut eleemósynam accíperet.
  - "4 Intuens autem in eum Petrus cum Joánne, dixit: Réspice in nos."
  - 5 At ille intendébat in eos, sperans se áliquid acceptúrum ab eis.
responsory1:
  - "@Sancti/02-22"
lectio2:
  - "!Act 3:6-10"
  - "6 Petrus autem dixit: Argéntum et aurum non est mihi: quod autem hábeo, hoc
    tibi do: In nómine Jesu Christi Nazaréni surge, et ámbula."
  - 7 Et, apprehénsa manu ejus déxtera, allevávit eum, et prótinus consolidátæ
    sunt bases ejus, et plantæ.
  - 8 Et exsíliens stetit, et ambulábat; et intrávit cum illis in templum
    ámbulans, et exsíliens, et laudans Deum.
  - 9 Et vidit omnis pópulus eum ambulántem, et laudántem Deum.
  - 10 Cognoscébant autem illum, quod ipse erat, qui ad eleemósynam sedébat ad
    Speciósam portam templi; et impléti sunt stupóre et éxtasi in eo, quod
    contígerat illi.
responsory2:
  - "@Sancti/02-22"
lectio3:
  - "!Act 3:11-16"
  - 11 Cum tenéret autem Petrum et Joánnem, cucúrrit omnis pópulus ad eos ad
    pórticum, quæ appellátur Salomónis, stupéntes.
  - "12 Videns autem Petrus, respóndit ad pópulum: Viri Israëlítæ, quid mirámini
    in hoc, aut nos quid intuémini, quasi nostra virtúte aut potestáte fecérimus
    hunc ambuláre?"
  - 13 Deus Abraham, et Deus Isaac, et Deus Jacob, Deus patrum nostrórum
    glorificávit Fílium suum Jesum, quem vos quidem tradidístis et negástis ante
    fáciem Piláti, judicánte illo dimítti.
  - "14 Vos autem Sanctum et Justum negástis, et petístis virum homicídam donári
    vobis:"
  - 15 Auctórem vero vitæ interfecístis, quem Deus suscitávit a mórtuis, cujus
    nos testes sumus.
  - "16 Et in fide nóminis ejus, hunc, quem vos vidístis et nostis, confirmávit
    nomen ejus: et fides, quæ per eum est, dedit íntegram sanitátem istam in
    conspéctu ómnium vestrum."
responsory3:
  - "@Sancti/02-22"
lectio4:
  - Sermo sancti Leónis Papæ
  - "!Sermo 1 in natali App. Petri et Pauli"
  - Omnium quidem sanctárum solemnitátum, dilectíssimi, totus mundus est
    párticeps, et uníus fídei píetas éxigit, ut quidquid pro salúte universórum
    gestum recólitur, commúnibus ubíque gáudiis celebrétur. Verúmtamen hodiérna
    festívitas, præter illam reveréntiam quam toto terrárum orbe proméruit,
    speciáli et própria nostræ Urbis exsultatióne veneránda est; ut, ubi
    præcipuórum Apostolórum glorificátus est éxitus, ibi in die martýrii eórum
    sit lætítiæ principátus. Isti enim sunt viri, per quos tibi Evangélium
    Christi, Roma, resplénduit; et, quæ eras magístra erróris, facta es
    discípula veritátis.
responsory4:
  - R. Dómine, si tu es, jube me veníre ad te super aquas.
  - "* Et exténdens manum apprehéndit eum, et dixit Jesus: Módicæ fídei, quare
    dubitásti?"
  - "V. Cumque vidísset ventum válidum veniéntem, tímuit; et, cum cœpísset
    mergi, clamávit dicens: Dómine, salvum me fac."
  - "R. Et exténdens manum apprehéndit eum, et dixit Jesus: Módicæ fídei, quare
    dubitásti?"
lectio5:
  - Isti sunt patres tui veríque pastóres, qui te regnis cæléstibus inseréndam
    multo mélius multóque felícius condidérunt, quam illi quorum stúdio prima
    mœ́nium tuórum fundaménta locáta sunt; ex quibus is qui tibi nomen dedit,
    fratérna te cæde fœdávit. Isti sunt, qui te ad hanc glóriam provexérunt, ut
    gens sancta, pópulus eléctus, cívitas sacerdotális et régia, per sacram
    beáti Petri Sedem caput orbis effécta, látius præsidéres religióne divína
    quam dominatióne terréna. Quamvis enim, multis aucta victóriis, jus impérii
    tui terra maríque protúleris; minus tamen est quod tibi béllicus labor
    súbdidit, quam quod pax christiána subjécit.
responsory5:
  - "R. Surge, Petre, et índue te vestiméntis tuis, áccipe fortitúdinem ad
    salvándas gentes:"
  - "* Quia cecidérunt caténæ de mánibus tuis."
  - "V. Angelus Dómini ástitit, et lumen refúlsit in habitáculo cárceris,
    percussóque látere Petri, excitávit eum, dicens: Surge, velóciter."
  - R. Quia cecidérunt caténæ de mánibus tuis.
lectio6:
  - Disposítio namque divínitus óperi máxime congruébat, ut multa regna uno
    confœderaréntur império, et cito pérvios habéret pópulos prædicátio
    generális, quos uníus tenéret régimen civitátis. Hæc autem cívitas ignórans
    suæ provectiónis auctórem, cum pene ómnibus dominarétur géntibus, ómnium
    géntium serviébat erróribus; et magnam sibi videbátur assumpsísse
    religiónem, quia nullam respúerat falsitátem. Unde, quantum erat per
    diábolum tenácius illigáta, tantum per Christum est mirabílius absolúta.
responsory6:
  - "@Sancti/02-22:Responsory4"
  - "&Gloria"
  - R. Et ídeo tibi tráditæ sunt claves regni cælórum.
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 16:13-19"
  - "In illo témpore: Venit Jesus in partes Cæsaréæ Philíppi, et interrogábat
    discípulos suos, dicens: Quem dicunt hómines esse Fílium hóminis? Et
    réliqua."
  - _
  - Homilía sancti Hierónymi Presbýteri
  - "!Lib. 3 Comment. in Matth. cap. 16"
  - "Pulchre intérrogat: Quem dicunt hómines esse Fílium hóminis? quia qui de
    fílio hóminis loquúntur, hómines sunt; qui vero divinitátem ejus
    intéllegunt, non hómines, sed dii appellántur. At illi dixérunt: Alii
    Joánnem Baptístam, álii autem Elíam. Miror quosdam intérpretes causas
    errórum inquírere singulórum, et disputatiónem longíssimam téxere, quare
    Dóminum nostrum Jesum Christum álii Joánnem putáverint, álii Elíam, álii
    Jeremíam aut unum ex prophétis; cum sic potúerint erráre in Elía et Jeremía,
    quo modo Heródes errávit in Joánne, dicens: Quem ego decollávi Joánnem, ipse
    surréxit a mórtuis, et virtútes operántur in eo."
responsory7:
  - "R. Ego pro te rogávi, Petre, ut non defíciat fides tua:"
  - "* Et tu aliquándo convérsus confírma fratres tuos."
  - V. Caro et sanguis non revelávit tibi, sed Pater meus, qui est in cælis.
  - R. Et tu aliquándo convérsus confírma fratres tuos.
lectio8:
  - "Vos autem quem me esse dícitis? Prudens lector, atténde quod, ex
    consequéntibus textúque sermónis, Apóstoli nequáquam hómines, sed dii
    appellántur. Cum enim dixísset: Quem dicunt hómines esse Fílium hóminis?
    subjécit: Vos autem quem me esse dícitis? Illis, quia hómines sunt, humána
    opinántibus, vos qui estis dii, quem me esse existimátis? Petrus ex persóna
    ómnium Apostolórum profitétur: Tu es Christus Fílius Dei vivi. Deum vivum
    appéllat, ad distinctiónem eórum deórum, qui putántur dii, sed mórtui sunt."
responsory8:
  - "@Sancti/02-22:Responsory7"
  - "&Gloria"
  - R. Et ego dico tibi, quia tu es Petrus, et super hanc petram ædificábo
    Ecclésiam meam.
lectio9:
  - "Respóndens autem Jesus, dixit ei: Beátus es, Simon Bar-Jona. Testimónio de
    se Apóstoli reddit vicem. Petrus díxerat: Tu es Christus Fílius Dei vivi;
    mercédem recépit vera conféssio: Beátus es, Simon Bar-Jona. Quare? Quia non
    revelávit tibi caro et sanguis, sed revelávit Pater. Quod caro et sanguis
    reveláre non pótuit, Spíritus Sancti grátia revelátum est. Ergo ex
    confessióne sortítur vocábulum, quod revelatiónem ex Spíritu Sancto hábeat,
    cujus et fílius appellándus sit. Síquidem Bar-Jona in nostra lingua sonat
    Fílius colúmbæ."
  - "&teDeum"
