  - "R. Cornélius Centúrio, vir religiósus, ac timens Deum, vidit maniféste
    Angelum Dei dicéntem sibi:"
  - "* Cornéli, mitte et accérsi Simónem, qui cognominátur Petrus; hic dicet
    tibi quid te opórteat fácere."
  - "V. Cum orásset Cornélius, nondum in Christo renátus, appáruit ei Angelus,
    dicens:"
  - R. Cornéli, mitte et accérsi Simónem, qui cognominátur Petrus; hic dicet
    tibi quid te opórteat fácere.
