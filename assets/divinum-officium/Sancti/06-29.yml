oratio:
  - "Deus, qui hodiérnam diem Apostolórum tuórum Petri et Pauli martýrio
    consecrásti: da Ecclésiæ tuæ, eórum in ómnibus sequi præcéptum; per quos
    religiónis sumpsit exórdium."
  - $Per Dominum
lectio:
  - Léctio Actuum Apostolórum
  - "!Act 12:1-11"
  - "In diébus illis: Misit Heródes rex manus, ut afflígeret quosdam de
    ecclésia. Occidit autem Jacóbum fratrem Joánnis gládio. Videns autem, quia
    placéret Judæis, appósuit, ut apprehénderet et Petrum. Erant autem dies
    azymórum. Quem cum apprehendísset, misit in cárcerem, tradens quátuor
    quaterniónibus mílitum custodiéndum, volens post Pascha prodúcere eum
    pópulo. Et Petrus quidem servabátur in cárcere. Orátio autem fiébat sine
    intermissióne ab ecclésia ad Deum pro eo. Cum autem productúrus eum esset
    Heródes, in ipsa nocte erat Petrus dórmiens inter duos mílites, vinctus
    caténis duábus: et custódes ante óstium custodiébant cárcerem. Et ecce,
    Angelus Dómini ástitit: et lumen refúlsit in habitáculo: percussóque látere
    Petri, excitávit eum, dicens: Surge velóciter. Et cecidérunt caténæ de
    mánibus ejus. Dixit autem Angelus ad eum: Præcíngere, et cálcea te cáligas
    tuas. Et fecit sic. Et dixit illi: Circúmda tibi vestiméntum tuum, et
    séquere me. Et éxiens sequebátur eum, et nesciébat, quia verum est, quod
    fiébat per Angelum: existimábat autem se visum vidére. Transeúntes autem
    primam et secúndam custódiam, venérunt ad portam férream, quæ ducit ad
    civitátem: quæ ultro apérta est eis. Et exeúntes processérunt vicum unum: et
    contínuo discéssit Angelus ab eo. Et Petrus ad se revérsus, dixit: Nunc scio
    vere, quia misit Dóminus Angelum suum, et erípuit me de manu Heródis et de
    omni exspectatióne plebis Judæórum."
graduale:
  - "!Ps 44:17-18"
  - "Constítues eos príncipes super omnem terram: mémores erunt nóminis tui,
    Dómine."
  - "V. Pro pátribus tuis nati sunt tibi fílii: proptérea pópuli confitebúntur
    tibi. Allelúja, allelúja."
  - "!Matt 16:18"
  - Tu es Petrus, et super hanc petram ædificábo Ecclésiam meam. Allelúja.
