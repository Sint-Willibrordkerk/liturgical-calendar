oratio:
  - "Deus, qui per stultítiam Crucis eminéntem Jesu Christi sciéntiam beátum
    Justínum Mártyrem mirabíliter docuísti: ejus nobis intercessióne concéde;
    ut, errórum circumventióne depúlsa, fídei firmitátem consequámur."
  - $Per eundem
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Corínthios
  - "!1 Cor 1:18-25; 1:30"
  - "Fratres: Verbum crucis pereúntibus quidem stultítia est: iis autem, qui
    salvi fiunt, id est nobis, Dei virtus est. Scriptum est enim: Perdam
    sapiéntiam sapiéntium et prudéntiam prudéntium reprobábo. Ubi sápiens? ubi
    scriba? ubi conquisítor hujus sǽculi? Nonne stultam fecit Deus sapiéntiam
    hujus mundi? Nam quia in Dei sapiéntia non cognóvit mundus per sapiéntiam
    Deum: placuit Deo per stultítiam prædicatiónis salvos fácere credéntes.
    Quóniam et Judæi signa petunt, et Græci sapiéntiam quærunt: nos autem
    prædicámus Christum crucifíxum: Judæis quidem scándalum, géntibus autem
    stultítiam, ipsis autem vocátis Judæis, atque Græcis. Christum Dei virtútem
    et Dei sapiéntiam: quia, quod stultum est Dei, sapiéntius est homínibus: et,
    quod infírmum est Dei, fórtius est homínibus. Ex ipso autem vos estis in
    Christo Jesu, qui factus est nobis sapiéntia a Deo et justítia ei
    sanctificátio et redémptio."
graduale:
