evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam.
  - "!Luc 12:2-8"
  - "In illo témpore: Dixit Jesus discípulis suis: Nihil est opértum, quod non
    revelétur, neque abscónditum, quod non sciátur. Quóniam quæ in ténebris
    dixístis, in lúmine dicéntur: et quod in aurem locúti estis in cubículis,
    prædicábitur in tectis. Dico autem vobis amícis meis: Ne terreámini ab his,
    qui occidunt corpus et post hæc non habent ámplius, quid fáciant. Osténdam
    autem vobis, quem timeátis: timéte eum, qui, postquam occídent, habet
    potestátem míttere in gehénnam; ita dico vobis, hunc timéte. Nonne quinque
    pásseres véneunt dipóndio, et unus ex illis non est in oblivióne coram Deo?
    Sed et capílli capitis vestri omnes numeráti sunt. Nolíte ergo timére:
    multis passéribus pluris estis vos. Dico autem vobis: Omnis, quicúmque
    conféssus fúerit me coram homínibus, et Fílius hóminis confitébitur illum
    coram Angelis Dei."
offertorium:
  - "!1 Cor 2:2;"
  - Non enim judicávi me scire áliquid inter vos, nisi Jesum Christum, et hunc
