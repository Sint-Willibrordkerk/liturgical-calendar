lectio4:
  - Justínus, Prisci fílius, ex Græco genere Flaviæ Neápolis in Syria Palæstina
    natus, adolescéntiam in litterárum ómnium stúdiis transegit. Vir factus adeo
    philosophíæ amóre correptus est, ut ad veritátem assequéndam, quotquot
    aderant, philosophórum sectis nomen déderit, eorúmque præcépta scrutátus
    sit. Cum in his fallacem tantum sapiéntiam errorémque reperísset, superna
    illustratióne per senem quemdam ignotum aspectuque venerábilem edoctus, veræ
    christianæ fídei philosophíam amplexus est. Hinc sacræ Scripturæ libros diu
    noctuque præ mánibus habens, ita ex eórum meditatióne divinus ignis in ánima
    ejus exársit, ut ea qua pollébat eruditiónis vi, eminentem Jesu Christi
    sciéntiam adeptus, plurima conscripserit volúmina ad christiánam fidem
    exponéndam magisque propagandam.
lectio5:
  - "Inter præclaríssima Justini ópera binæ eminent fídei christianæ apologíæ,
    quas cum coram senatu, imperatóribus Antonino Pio ejúsque fíliis nec non
    Marco Antonino Vero et Lucio Aurelio Cómmodo Christi ásseclas sævíssime
    divexántibus, porrexísset, eamdemque fidem disputándo strenue propugnasset,
    obtinuit, ut a Christianórum cæde publico príncipum edícto temperátum
    fúerit. Verum Justino haud parcitum est. Nam Crescéntis cynici, cujus vitam
    et mores nefarios redargúerat, insídiis accusatus, a satellítibus
    comprehénsus est. Adductus autem ad Romæ præsidem nómine Rústicum, cum hic
    ab eo quæsivísset, quænam essent Christianórum præcépta, hanc bonam
    confessiónem coram multis testibus conféssus est: Rectum dogma, quod nos
    christiáni hómines cum pietáte servamus, hoc est: ut Deum unum existimémus
    Factórem atque Creatórem ómnium quæ vidéntur, quæque corpóreis óculis non
    cernúntur; et Dóminum Jesum Christum Dei Fílium confiteámur, olim a
    prophétis prænuntiátum, qui et humani generis Judex ventúrus est."
lectio6:
  - Quóniam Justinus in prima sua apología exposúerat quómodo Christiáni
    convenírent ad Sacra celebranda, et quænam fúerint sacri hujus convéntus
    mysteria, ad repelléndas ethnicórum calumnias; exquisívit ab eo præses, in
    quonam loco conveníret ipse et ceteri hujus Urbis Christifidéles. Justinus
    autem réticens convéntuum loca, ne sancta et fratres próderet cánibus,
    domicílium tantum suum indicávit, ubi manére et discípulos excólere solébat
    penes célebrem títulum Pastoris in ædibus Pudéntis. Demum præses optiónem ei
    dedit vel ut diis sacrificaret, vel per totum corpus flagellis cædi
    perferret. Cum invictus fídei vindex assereret se in votis semper habuísse
    cruciátus pérpeti propter Dóminum Jesum Christum, a quo magnam in cælis
    mercédem cónsequi expectabat, præses in eum capitálem senténtiam
    pronuntiávit. Itaque mirábilis philósophus Deum collaudans, post vérbera,
    fuso pro Christo sánguine, glorióso martyrio coronátus est. Quidam vero
    fidéles clam illíus sustulérunt corpus, et in loco idoneo condidérunt. Leo
    décimus tertius Póntifex maximus ejúsdem Offícium et Missam ab univérsa
    Ecclésia celebrári præcepit.
lectio94:
  - Justínus, Prisci fílius, ex Græco génere Fláviæ Neápolis in Syria Palæstína
    natus, ádeo philosophíæ amóre corréptus est, ut ad veritátem assequéndam,
    quotquot áderant, philosophórum sectis nomen déderit. In quibus tamen cum
    fallácem tantum sapiéntiam reperísset, supérna illustratióne edóctus,
    christiánæ fídei philosophíam ampléxus est. Hinc sacræ Scriptúræ libros diu
    noctúque versans ibíque eminéntem Jesu Christi sciéntiam adéptus, plura
    conscrípsit ad christiánam fidem exponéndam magísque propagándam; quæ inter
    binæ præstant pro fide christiána apologíæ. Quas cum imperatóribus Antoníno
    Pio ejúsque fíliis porrexísset, et fidem disputándo strénue propugnásset,
    obtínuit, ut a Christianórum cæde público príncipem edícto temperarétur.
    Ipse tamen Crescéntis Cýnici, cujus et ímpios mores redargúerat, insídiis
    accusátus, a satellítibus captus est; et ad Rústicum præféctum addúctus, cum
    in confessióne fídei strénue permanéret, cápitis damnátus, glorióso martýrio
    coronátus occúbuit.
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Lucam.
  - "!Luc 12:2-8"
  - "In illo témpore: Dixit Jesus discípulis suis: Nihil opertum est, quod non
    revelétur; neque abscónditum, quod non sciátur. Et réliqua."
  - _
  - Homilía sancti Joánnis Chrysostomi.
  - "!Homilia in cap. x Matth. v. 26. et seq."
  - "Nihil est opertum quod non revelábitur, nec occultum quod non sciétur. Quod
    autem dicit, hujúsmodi est: Sufficit quidem vobis ad consolatiónem, si ego
    Magister et Dóminus consors sim conviciórum. Si vero adhuc doletis hæc
    audiéntes, illud quoque animo reputate, vos non multum póstea ab hac
    suspicióne liberátum iri. Cur enim id ægre fertis? quia præstigiatores et
    deceptores vos vocant? At paululum exspectáte, et servatores benefactoresque
    orbis vos prædicábunt omnes. At enim tempus illa ómnia, quæ subobscura
    erant, revelabit, et illórum calumniam déteget, virtutémque vestram
    conspicuam reddet. Cum enim ex rebus ipsis comprobabímini salvatores esse et
    benefici, et omni virtúte conspicui, illórum dictis hómines non attendent,
    sed rei veritáti; ac illi quidam sycophantæ, mendáces, malédici, vos vero
    ipso sole splendidióres deprehendémini. Multum quippe témporis spatium vos
    notos reddet, prædicabit, et tuba clariórem emíttet vocem, vestræque
    virtútis testes univérsos hómines exhibétur. Ne ítaque ea, quæ nunc
    dicúntur, vos dejíciant, sed spes futurórum bonórum érigat. Non possunt enim
    ea, quæ ad vos spectant, occultári."
lectio8:
  - "Deínde, postquam illos omni angore, timóre et sollicitúdine liberávit, et
    probris ómnibus superióres réddidit, demum illos opportune de libertáte
    prædicándi allóquitur; nam dicit: Quod dico vobis in ténebris, dícite in
    lúmine; et quod in aure audítis, prædicate super tecta. Quamquam non erant
    ténebræ cum hæc diceret, neque ad aurem loquebátur: sed hæc hyperbólice
    dicta sunt. Quia enim solos alloquebátur, et in parvo Palæstinæ angulo, ídeo
    dicit, In ténebris et In aure; hunc loquéndi modum cómparans cum loquéndi
    fiducia, qua illos póstea instructurus erat. Ne in una, duabus tribusque
    civitátibus, sed per totum orbem prædicate, terram máreque peragrántes,
    habitátam, non habitátam; ac tyrannis, pópulus, philosophis, rhetóribus cum
    magna fiducia ómnia dícite. Ideo dixit super tecta et in lúmine; sine ullo
    subterfugio, et cum omni libertáte."
