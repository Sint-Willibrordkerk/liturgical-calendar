secreta:
  - "Múnera nostra, Dómine Deus, benígnus súscipe: quorum mirábile mystérium
    sanctus Martyr Iustínus advérsum impiórum calúmnias strénue deféndit."
  - $Per Dominum
communio:
  - "!2 Tim 4:8;"
  - Repósita est mihi coróna justítiæ, quam reddet mihi Dóminus in illa die
    justus judex. (Alleluia)
postcommunio:
  - "Cœlésti alimónia refécti, súpplices te, Dómine, deprecámur: ut, beáti
    Justíni Mártyris tui mónitis, de accéptis donis semper in gratiárum actióne
    maneámus."
  - $Per Dominum.
