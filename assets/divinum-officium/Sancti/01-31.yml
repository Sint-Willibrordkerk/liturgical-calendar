oratio:
  - "Deus, qui sanctum Joánnem Confessórem tuum adolescentium patrem et
    magístrum excitásti, ac per eum, auxiliatríce Vírgine María, novas in
    Ecclésia tua famílias floréscere voluísti: concéde, quǽsumus; ut eódem
    caritátis igne succénsi, ánimas quærere, tibíque soli servíre valeámus."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Philippénses.
  - "!Philipp 4:4-9"
  - "Fratres: Gaudéte in Dómino semper: íterum dico, gaudéte. Modéstia vestra
    nota sit ómnibus homínibus: Dóminus prope est. Nihil sollíciti sitis; sed in
    omni oratióne et obsecratióne, cum gratiárum actióne, petitiónes vestræ
    innotéscant apud Deum. Et pax Dei quæ exsúperat omnem sensum, custódiat
    corda vestra et intelligéntias vestras, in Christo Jesu. De cétero, fratres,
    quæcúmque sunt vera, quæcúmque púdica, quæcúmque justa, quæcúmque sancta,
    quæcúmque amabília, quæcúmque bonæ famæ, si qua virtus, si qua laus
    disciplínæ, hæc cogitáte. Quæ et didicístis, et accepístis, et audístis, et
    vidístis in me, hæc agite: et Deus pacis erit vobíscum."
graduale:
