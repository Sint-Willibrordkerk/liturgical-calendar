tractus:
  - "!Ps 60:4-6"
  - "Factus es spes mea, Dómine: turris fortitúdinis a fácie inimíci."
  - "V. Inhabitábo in tabernáculo tuo in sǽcula: prótegar in velaménto alárum
    tuárum."
  - "V. Quóniam tu, Deus, exaudísti oratiónem meam: dedísti hereditátem
    timéntibus nomen tuum."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum.
  - "!Matt 18:1-5"
  - "In illo témpore: Accessérunt discípuli ad Jesum dicéntes: Quis, putas,
    major est in regno cælórum? Et ádvocans Jesus párvulum, státuit eum in médio
    eórum, et dixit: Amen dico vobis, nisi convérsi fueritis, et efficiámini
    sicut párvuli, non intrábitis in regnum cœlórum. Quicúmque ergo humiliáverit
    se sicut párvulus iste, hic est major in regno cœlórum. Et qui suscéperit
    unum párvulum talem in nómine meo, me súscipit."
offertorium:
  - "!Ps 33:12"
  - "Veníte, fílii, audíte me: timórem Dómini docébo vos."
secreta:
  - "Súscipe, Dómine, oblatiónem mundam salutáris Hóstiæ, et præsta: ut, te in
    ómnibus et super ómnia diligéntes, in glóriæ tuæ laudem vívere mereámur."
  - $Per Dominum
communio:
  - "!Rom 4:18"
  - Contra spem in spem crédidit, ut fíeret pater multárum géntium, secúndum
    quod dictum est ei.
postcommunio:
  - "Córporis et Sánguinis tui, Dómine, mystério satiátis, concéde, quǽsumus;
    ut, intercedénte sancto Joánne Confessóre tuo, in gratiárum semper actióne
    maneámus:"
  - $Qui vivis
rubrica-cisterciensis/rank:
  - S. Joannis Bosco, Confessoris (1965)
  - Commemoratio
  - "1"
  - "@C5"
lectio4:
  - Joánnes Bosco, humili loco natus apud Castum Novum in Astensibus atque
    sanctíssime, patre amisso, disciplína materna institútus, mira de se vel a
    prima ætate portendit. Ingenio enim mitis atque ad pietátem pronus,
    singulari se gerebat auctoritate inter æquales, quorum lites dirímere,
    faciles rixas compónere, turpia verba jocosque lascivos compéscere mature
    cœpit. Tum verbis eos jucundis ad se advocare, ludis preces insérere, quæ
    sacra elóquia in templo audivísset mirábili sermónis copia ac dulcédine
    referre, ad Pœniténtiæ et Eucharistiæ sacraménta rite suscipienda puerulos
    quam primum quamque creberrime inducere sategit. Oris quoque decor
    verecundus, morum suávitas, atque innocentíssimæ vitæ candor ómnium animos
    ad eum pertrahebant. Licet vero, familiáris rei angustia pressus labórum
    ærumnarúmque plenam adolescéntiam égerit, in id tamen unum hílaris ac Deo
    fidens contendit, ut sacerdotio augerétur.
lectio5:
  - Voti tandem compos effectus, Cheriensem civitátem primum, ac dein Augustam
    Taurinórum pétiit, quo acrius, beato Josepho Cafasso magistro, et in
    sciéntia sanctórum profíceret et ad sacram morum doctrinam addiscéndam
    ánimum adjungeret. Ibi autem, cum voluntátis inclinatióne tum superno
    instinctu incitatus, suum in adolescéntulos ánimum convértit, ut prima iis
    christianæ sapiéntiæ traderet rudimenta. Quorum cum fieret in dies major
    numerus, sedem ad eos coadunándos stábilem ac firmam, haud sine cælésti
    afflatu, ásperis et diuturnis difficultátibus superatis, in illa urbis parte
    collocávit, quæ vulgo Valdocco appellátur, in eamque rem totus incúbuit.
    Paulo vero post, Vírgine Deípara auxiliante, quæ ei puérulo per visum in
    somnis futura innúerat, Joánnes Salesianórum Societátem institúere decrevit,
    cujus esset præsertim juveníles ánimas Christo lucrifácere; item novam
    familiam suscépit constituéndam sacrárum vírginum, quæ, ab Auxiliatrice Dei
    Matre nuncupátæ, adolescéntulas dirígerent in vias Dómini; quibus demum pium
    Cooperatórum cœtum adjecit ad Salesianórum ópera studio ac pietáte fovenda.
    Itaque brevi factum est, ut permagnam et christianæ et civíli societáti
    utilitátem afferret.
lectio6:
  - "Animárum enim studio flagrans, nulli pepércit labori nullique impensæ, ut
    festórum diérum asceteria pro adolescentulis, pupillórum hospitia, pusiónum
    operariórum scholas, ædes púeris alendis, instituéndis, templa Deo longe
    lateque per orbem excitaret. Simul Christi fidem in Subalpinis verbo et
    exemplo fovére, per totam Italiam optimos libros conficiendo, edendo,
    divulgando tutari, Evangélii præcones ad gentes infidéles sæpius mitténdo
    propagare non desiit. Simplex ac rectus homo Dei, ad omne opus bonum
    instructus, omnígenis virtútibus flóruit, quas incensíssimæ caritátis ardor
    alebat. Mente in Deum constanter erecta ac supernis charismátibus cumulátus,
    nullis sanctíssimus vir, nec minis terreri, nec labóribus fatigari, nec
    curis ópprimi, neque rebus adversis perturbari videbátur. Tria autem
    pietátis offícia suis maxime commendávit: ut quam sæpíssime ad sacram
    exhomologésim sacramque synáxim accederent, ut Mariam Auxiliatricem
    peramanter cólerent, ut Pontifici máximo ceu fílii addictíssimi
    obsequeréntur. Nec silentio prætereundum est eum, in difficilimis rerum
    adjunctis, præsto non semel Romano Pontifici adfuísse, ut mala ex légibus
    contra Ecclésiam eo témpore latis deriváta temperaret. Vitæ cursum, tot
    tantisque opéribus ac labóribus refertum, confecit pridie Kalendas
    Februarias anno salútis millesimo octingentésimo octogesimo octavo, ætátis
    septuagesimo tertio. Quem multis clarum miraculis Pius undecimus, Pontifex
    maximus, anno millesimo nongentésimo vigesimo nono Beatórum, quinquennio
    post, die solemni Paschæ, décimo nono exeunte sæculo a peracta humani
    generis Redemptióne, géntibus ex orbe universo in Urbem confluéntibus,
    Sanctórum ordínibus adserebat."
lectio94:
  - "Joánnes Bosco, húmili loco natus, post ærumnósam innocentissimámque
    puerítiam, stúdiis Chérii óperam dedit, quo quidem témpore ingénii et
    virtútum laude enítuit. Sacérdos creátus, Augústam Taurinórum pétiit, ubi
    ómnibus ómnia factus est; sed præsértim in adolescéntulos eósque páuperes ac
    derelíctos adjuvándos curam impéndit. Liberálibus disciplínis, opifícum
    scholis, festórum diérum ascetériis a venenátis errórum vitiorúmque pábulis
    puerílem ætátem removére omni ope stúduit: quam ad rem duas in Ecclésia
    virórum virginúmque famílias excitávit. Plúrimos ipse édidit libros
    christiána sapiéntia refértos. De ætérna étiam infidélium salúte per sacras
    suórum sodálium expeditiónes óptime méruit. Mente in Deum constánter erécta,
    nullis homo sanctíssimus, nec minis terréri, nec labóribus fatigári, nec
    curis ópprimi, nec rebus advérsis perturbári videbátur. Obiit anno salútis
    millésimo octingentésimo octogésimo octávo, ætátis septuagésimo tértio. A
    Pio undécimo, Pontífice máximo, in Sanctórum númerum relátus est."
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 18:1-5"
  - "In illo témpore: Accessérunt discípuli ad Jesum, dicéntes: Quis, putas,
    major est in regno cælórum? Et réliqua."
  - _
  - Homilía sancti Joánnis Chrysostomi
  - "!Homilia 60 in Matth. cap. 18"
  - "Vide quot modis nos inducat Dóminus ad curam vel minórum fratrum? Ne ítaque
    dixeris: Ærarius est ille, aut calceórum sutor, agricola, insípiens, ut ideo
    despícias illum. Ne enim in illud mali íncidas, perpende quot modis te
    inducat, ut modeste agas et eórum curam geras. Puerum in médio státuit et
    ait: Efficiámini ut párvuli: et: Quicúmque suscéperit párvulum talem, me
    suscipit: et: Qui scandalizaverit, extrema patiétur. Si ergo Deus ita gaudet
    de párvulo qui repertus est, cur tu despícias eos quos Deus tam sollicite
    curat, cum oporteret ánimam ipsam tradere pro uno ex párvulis istis? Tanta
    quippe est Deo cura de anima, ut ne Fílio quidem suo pepércerit. Quare,
    óbsecro, primo dilúculo cum a domo exiérimus, hunc unum scopum habeámus et
    hanc præcipue sollicitúdinem, ut periclitántem eripiámus. Non loquor hic de
    sensibili periculo; hoc enim ne periculum quidem est; sed de periculo ánimæ,
    quod homínibus parat diabolus."
lectio8:
  - "Improbus, inquis, difficile tolerátur. Atque ideo debes illi amóre jungi,
    ut eum a vítio removeas, ut convértas et ad virtútem redúcas. At non
    obtemperat, inquis, neque consílium admittit. Unde hoc nosti? An exhortátus
    es et emendare studuísti? Hortátus sæpe sum, inquies. Quóties? Sæpius: semel
    et íterum. Idne sæpius vocas? Etiamsi per totam vitam id fecisses, nec
    deficere, nec desperáre oportebat. Non vides quómodo nos Deus semper
    hortátur per Prophétas, per Apóstolos, per Evangelistas? Quid ígitur? Num
    recte operamur? Num in ómnibus obtemperamus? Minime. Num ideo finem fecit
    admonendi?"
lectio9:
  - "Nihil quippe tam pretiósum est quam ánima: quid enim prodest homini, si
    mundum univérsum lucrétur, ánimæ vero suæ detriméntum patiátur? Verum ómnia
    pervértit et dejécit pecuniárum amor, Deique timórem decussit, sicut
    tyrannus arcem sic ánimas occupans. Idcirco et filiórum et nostram
    neglígimus salútem. Hinc magna insipiéntia; hinc líberi servis vilióres
    fiunt. Ecquid de servis loquor? Mulum si quis habeat, multum curat ut
    agasónem illi optimum provideat, non ímprobum, non furacem, non temuléntum,
    non artis suæ imperítum: si autem fílio pædagogum dare opus sit, casu et
    sine delectu obvium quemque excipimus; etsi hac arte nulla sit major. Quid
    par illi arti, quæ dirigendæ juvenis menti et índoli incumbit? Qui tali
    instructus est facultate, plus diligéntiæ exhibeat oportet, quam quivis
    pictor aut statuarius."
  - "&teDeum"
