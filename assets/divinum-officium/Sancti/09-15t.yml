lectio6o:
  - "Te adjutrice gentes veniunt ad pœnitentiam. Quid plura? Per te unigenitus
    Dei Filius vera illa lux effulsit sedentibus in tenebris et umbra mortis. Te
    Prophetæ prænuntiarunt, te apostoli summis laudibus celebrarut.. Quisnam
    poterit tuarum laudum præconia explicare, Maria Mater et Virgo? Hanc,
    fratres dilectissimi, celebremus, ejus Filium Ecclesiæ sponsum immaculatum
    adorantes: cui honor et gloria in sæcula sæculorum. Amen."
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum.
  - "!Matt 1:1-17"
  - Liber generationis Jesu Christi filii David, filii Abraham. Abraham genuit
    Isaac. Isaac autem genuit Jacob. Et réliqua.
  - _
  - Homilia sancti Joannis Chrysostomi.
  - "!Homil. 2. in Matth., post init."
  - "Auditu quidem mirabile est quod ineffabilis Deus, et qui nec sermonibus
    explicari potest, nec cogitationibus comprehendi, Patrique per omnia
    coæqualis, per Virginis ad nos venit uterum, et fieri ex muliere dignatus
    est, et habere progenitores David et Abraham: et quid dico, David et
    Abraham? étiam illas, quod magis stupendum est, feminas, quas paulo ante
    memoravi. Hæc igitur audiens mente consurge, nihilque humile suspiceris, sed
    potius propter hoc ipsum maxime mirare, quia cum verus et dilectus Filius
    sit sempiterni Dei, étiam filius David esse dignatus est, modo ut te filium
    faceret Dei: servum patrem habere dignatus est, ut tibi servo patrem faceret
    ipsum Deum."
responsory7:
  - "@Sancti/07-02:Responsory7"
lectio8:
  - "Vides ab ipso statim principio, quam læta sint hæc unita. Quod si ambigis
    de his quæ ad tuum spectant honorem, ab iis quæ illius sunt, étiam tua disce
    credere. Quantum enim consequi potest humana ratio, multo est difficilius
    Deum hominem fieri, quam hominem Dei filium consecrari. Cum ergo audieris,
    quia Filius Dei filius sit et David et Abrahæ: dubitare jam desine, quod et
    tu, qui filius es Adæ, futurus sis filius Dei. Non enim semetipsum ita
    humiliasset, nisi nos esset exaltaturus. Natus est enim secundum carnem, ut
    tu nascerere spiritu: natus est ex muliere, ut tu desineres filius esse
    mulieris."
responsory8:
  - "@Sancti/07-02:Responsory8"
