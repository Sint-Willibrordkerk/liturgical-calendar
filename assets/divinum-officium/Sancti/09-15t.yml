lectio4o:
  - Sermo sancti Cyrilli Epíscopi Alexandrini.
  - "!Homilia contra Nestorium."
  - "Hilarem video hodie cœtum fidelium omnium, qui convenerunt promptis animis,
    a sancta et Dei Matre Maria semper Virgine convocati. Laus et gloria sit
    tibi sancta Trinitas, quod omnes nos ad hanc celebritatem convocaris. Sit
    étiam tibi sancta Dei Mater laus. Tu enim es pretiosa margarita orbis
    terrarum: tu lucerna inextincti luminis, corona virginitatis, sceptrum
    orthodoxæ fidei, templum indissolubile continens eum qui nusquam contineri
    potest, Mater et Virgo: tu benedicta inter inter mulieres, ejus parens qui
    benedictus venit in nomine domini."
