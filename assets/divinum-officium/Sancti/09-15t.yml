lectio5o:
  - "Per te Trinitas sanctificatur: per te crux pretiosa dicitur, et adoratur in
    toto orbe terrarum. Per te exsultat cælum, lætantur Angeli et Archangeli,
    fugantur dæmones, et homo ipse ad cælum revocatur. Omnis creatura idolorum
    errore detenta, conversa est ad notitiam veritatis, et fideles homines ad
    sanctum baptisma pervenerunt, atque in toto orbe terrarum constructæ sunt
    ecclesiæ."
