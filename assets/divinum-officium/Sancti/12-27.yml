  - "!Ps 91:13."
  - "Justus ut palma florébit: sicut cedrus Líbani multiplicábitur. Allelúja."
tractus:
  - "!Ps 111:1-3"
  - "Beátus vir, qui timet Dóminum: in mandátis ejus cupit nimis."
  - "V. Potens in terra erit semen ejus: generátio rectórum benedicétur."
  - "V. Glória et divítiæ in domo ejus: et justítia ejus manet in sǽculum
    sǽculi."
evangelium:
  - Sequéntia ++ sancti Evangélii secundum Joánnem
  - "!Joann 21:19-24"
  - "In illo témpore: Dixit Jesus Petro: Séquere me. Convérsus Petrus vidit
    illum discípulum, quem diligébat Jesus, sequéntem, qui et recúbuit in cena
    super pectus ejus, et dixit: Dómine, quis est qui tradet te ? Hunc ergo cum
    vidísset Petrus, dixit Jesu: Dómine, hic autem quid? Dicit ei Jesus: Sic eum
    volo manére, donec véniam, quid ad te? tu me séquere. Exiit ergo sermo iste
    inter fratres, quia discípulus ille non móritur. Et non dixit ei Jesus: Non
    móritur; sed: Sic eum volo manére, donec véniam: quid ad te? Hic est
    discípulus ille, qui testimónium pérhibet de his, et scripsit hæc: et
    scimus, quia verum est testimónium ejus."
