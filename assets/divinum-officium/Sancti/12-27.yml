oratio:
  - "Ecclésiam tuam, Dómine, benígnus illústra: ut, beáti Joánnis Apóstoli tui
    et Evangelístæ illumináta doctrínis, ad dona pervéniat sempitérna."
  - $Per Dominum
commemoratio-oratio:
  - "@Sancti/12-26"
lectio:
  - Lectio libri Sapiéntiæ
  - "!Eccli 15:1-6"
  - "Qui timet Deum, fáciet bona: et qui cóntinens est justítiæ, apprehéndet
    illam, et obviábit illi quasi mater honorificáta. Cibábit illum pane vitæ et
    intelléctus, et aqua sapiéntiæ salutáris potábit illum: et firmábitur in
    illo, et non flectétur: et continébit illum, et non confundétur: et
    exaltábit illum apud próximos suos, et in médio ecclésiæ apériet os ejus, et
    adimplébit illum spíritu sapiéntiæ et intelléctus, et stola glóriæ véstiet
    illum. Jucunditátem et exsultatiónem thesaurizábit super illum, et nómine
    ætérno hereditábit illum, Dóminus, Deus noster."
graduale:
  - "!Joann 21:23; 21:19"
  - "Exiit sermo inter fratres, quod discípulus ille non móritur: et non dixit
    Jesus: Non móritur,"
  - "V. Sed: Sic eum volo manére, donec véniam: tu me séquere."
  - Allelúja, allelúja.
  - "!Joann 21:24"
  - "V. Hic est discípulus ille, qui testimónium pérhibet de his: et scimus,
    quia verum est testimónium ejus. Allelúja."
gradualep:
  - Allelúja, allelúja.
  - "!Joann 21:24"
