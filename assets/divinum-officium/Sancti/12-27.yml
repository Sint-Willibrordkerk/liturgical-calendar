versum-1:
  - V. Valde honorándus est beátus Joánnes.
  - R. Qui supra pectus Dómini in cena recúbuit.
rubrica-cisterciensis/versum-1:
  - "@CommuneCist/C1"
ant-1:
  - "Iste est Joánnes, * qui supra pectus Dómini in cena recúbuit: beátus
    Apóstolus, cui reveláta sunt secréta cæléstia."
octava-1:
  - "@:Octava 3"
lectio1:
  - Incipit Epístola prima beáti Joánnis Apóstoli
  - "!1 Joannes 1:1-5"
  - "1 Quod fuit ab inítio, quod audívimus, quod vídimus óculis nostris, quod
    perspéximus, et manus nostræ contrectavérunt de verbo vitæ:"
  - "2 et vita manifestáta est, et vídimus, et testámur, et annuntiámus vobis
    vitam ætérnam, quæ erat apud Patrem, et appáruit nobis:"
  - 3 quod vídimus, et audívimus, annuntiámus vobis, ut et vos societátem
    habeátis nobíscum, et socíetas nostra sit cum Patre et cum Fílio ejus Jesu
    Christo.
  - 4 Et hæc scríbimus vobis ut gaudeátis, et gáudium vestrum sit plenum.
  - "5 Et hæc est annuntiátio, quam audívimus ab eo, et annuntiámus vobis:
    Quóniam Deus lux est, et ténebræ in eo non sunt ullæ."
responsory1:
  - "R. Valde honorándus est beátus Joánnes, qui supra pectus Dómini in cena
    recúbuit:"
  - "* Cui Christus in cruce Matrem vírginem vírgini commendávit."
  - V. Virgo est eléctus a Dómino, atque inter céteros magis diléctus.
  - R. Cui Christus in cruce Matrem vírginem vírgini commendávit.
lectio2:
  - "!1 Joannes 1:6-10"
  - 6 Si dixérimus quóniam societátem habémus cum eo, et in ténebris ambulámus,
    mentímur, et veritátem non fácimus.
  - 7 Si autem in luce ambulámus sicut et ipse est in luce, societátem habémus
    ad ínvicem, et sanguis Jesu Christi, Fílii ejus, emúndat nos ab omni
    peccáto.
  - 8 Si dixérimus quóniam peccátum non habémus, ipsi nos sedúcimus, et véritas
    in nobis non est.
  - 9 Si confiteámur peccáta nostra, fidélis est et justus, ut remíttat nobis
    peccáta nostra, et emúndet nos ab omni iniquitáte.
  - 10 Si dixérimus quóniam non peccávimus, mendácem fácimus eum, et verbum ejus
    non est in nobis.
responsory2:
  - "R. Hic est discípulus ille, qui testimónium pérhibet de his, et scripsit
    hæc:"
  - "* Et scimus quia verum est testimónium ejus."
  - V. Fluénta Evangélii de ipso sacro Domínici péctoris fonte potávit.
  - R. Et scimus quia verum est testimónium ejus.
lectio3:
  - "!1 Joannes 2:1-5"
  - "1 Filíoli mei, hæc scribo vobis, ut non peccétis. Sed et si quis
    peccáverit, advocátum habémus apud Patrem, Jesum Christum justum:"
  - "2 et ipse est propitiátio pro peccátis nostris: non pro nostris autem
    tantum, sed étiam pro totíus mundi."
  - 3 Et in hoc scimus quóniam cognóvimus eum, si mandáta ejus observémus.
  - 4 Qui dicit se nosse eum, et mandáta ejus non custódit, mendax est, et in
    hoc véritas non est.
  - 5 Qui autem servat verbum ejus, vere in hoc cáritas Dei perfécta est.
responsory3:
  - R. Hic est beatíssimus Evangelísta et Apóstolus Joánnes,
  - "* Qui privilégio amóris præcípui, céteris áltius a Dómino méruit honorári."
  - V. Hic est discípulus ille, quem diligébat Jesus, qui supra pectus Dómini in
    cena recúbuit.
  - R. Qui privilégio amóris præcípui, céteris áltius a Dómino méruit honorári.
  - "&Gloria"
  - R. Qui privilégio amóris præcípui, céteris áltius a Dómino méruit honorári.
lectio4:
  - Ex libro sancti Hierónymi Presbýteri de Scriptóribus ecclesiásticis
  - "!Cap. 9"
  - "Joánnes Apóstolus, quem Jesus amávit plúrimum, fílius Zebedǽi, frater
    Jacóbi Apóstoli, quem Heródes post passiónem Dómini decollávit, novíssimus
    ómnium scripsit Evangélium, rogátus ab Asiæ epíscopis, advérsus Cerínthum,
    aliósque hæréticos, et máxime tunc Ebionitárum dogma consúrgens, qui
    ásserunt Christum ante Maríam non fuísse: unde et compúlsus est divínam ejus
    nativitátem edícere."
responsory4:
  - "R. Qui vícerit, fáciam illum colúmnam in templo meo, dicit Dóminus:"
  - "* Et scribam super eum nomen meum, et nomen civitátis novæ Jerúsalem."
  - V. Vincénti dabo édere de ligno vitæ, quod est in paradíso Dei mei.
  - R. Et scribam super eum nomen meum, et nomen civitátis novæ Jerúsalem.
lectio5:
  - "Quarto décimo ígitur anno, secúndam post Nerónem persecutiónem movénte
    Domitiáno, in Patmos ínsulam relegátus, scripsit Apocalýpsim, quam
    interpretátur Justínus Martyr et Irenǽus. Interfécto autem Domitiáno, et
    actis ejus ob nímiam crudelitátem a senátu rescíssis, sub Nerva príncipe
    rédiit Ephesum: ibíque usque ad Trajánum príncipem persevérans, totas Asiæ
    fundávit rexítque ecclésias: et conféctus sénio, sexagésimo octávo post
    passiónem Dómini anno mórtuus, juxta eándem urbem sepúltus est."
responsory5:
  - "R. Diligébat autem eum Jesus, quóniam speciális prærogatíva castitátis
    amplióri dilectióne fécerat dignum:"
  - "* Quia virgo eléctus ab ipso, virgo in ævum permánsit."
  - V. In cruce dénique moritúrus, huic Matrem suam vírginem vírgini commendávit.
  - R. Quia virgo eléctus ab ipso, virgo in ævum permánsit.
lectio6:
  - Ex Commentáriis ejúsdem in Epístolam ad Gálatas
  - "!Lib. 3, Cap. 6"
  - "Beátus Joánnes Evangelísta, cum Ephesi morarétur usque ad últimam
    senectútem, et vix inter discipulórum manus ad ecclésiam deferrétur, nec
    posset in plura vocem verba contéxere; nihil áliud per síngulas solébat
    proférre colléctas, nisi hoc: Filíoli, dilígite altérutrum. Tandem discípuli
    et fratres, qui áderant, tǽdio affécti quod éadem semper audírent, dixérunt:
    Magíster, quare semper hoc lóqueris? Qui respóndit dignam Joánne senténtiam:
    Quia præcéptum Dómini est; et, si solum fiat, súfficit."
responsory6:
  - R. In médio Ecclésiæ apéruit os ejus,
  - "* Et implévit eum Dóminus spíritu sapiéntiæ et intelléctus."
  - V. Jucunditátem et exsultatiónem thesaurizávit super eum.
  - R. Et implévit eum Dóminus spíritu sapiéntiæ et intelléctus.
  - "&Gloria"
  - R. Et implévit eum Dóminus spíritu sapiéntiæ et intelléctus.
lectio7:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 21:19-24"
  - "In illo témpore: Dixit Jesus Petro: Séquere me. Convérsus Petrus, vidit
    illum discípulum, quem diligébat Jesus, sequéntem. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tract. 124 in Joann., post med."
  - "Duas vitas sibi divínitus prædicátas, et commendátas novit Ecclésia: quarum
    est una in fide, áltera in spécie; una in témpore peregrinatiónis, áltera in
    æternitáte mansiónis; una in labóre, áltera in réquie; una in via, áltera in
    pátria; una in ópere actiónis, áltera in mercéde contemplatiónis. Una
    declínat a malo, et facit bonum: áltera nullum habet, a quo declínet, malum;
    et magnum habet, quo fruátur, bonum. Una cum hoste pugnat; áltera sine hoste
    regnat."
responsory7:
  - "R. In illum diem suscípiam te servum meum, et ponam te sicut signáculum in
    conspéctu meo:"
  - "* Quóniam ego elégi te, dicit Dóminus."
  - V. Esto fidélis usque ad mortem, et dabo tibi corónam vitæ.
  - R. Quóniam ego elégi te, dicit Dóminus.
lectio8:
  - Una súbvenit indigénti; áltera ibi est, ubi nullum ínvenit indigéntem. Una
    aliéna peccáta, ut sua sibi ignoscántur, ignóscit; áltera nec pátitur quod
    ignóscat, nec facit quod sibi poscat ignósci. Una flagellátur malis, ne
    extollátur in bonis; áltera tanta plenitúdine grátiæ caret omni malo, ut
    sine ulla tentatióne supérbiæ cohǽreat summo bono.
responsory8:
  - "R. Iste est Joánnes, qui supra pectus Dómini in cena recúbuit:"
  - "* Beátus Apóstolus, cui reveláta sunt secréta cæléstia."
  - V. Fluénta Evangélii de ipso sacro Domínici péctoris fonte potávit.
  - R. Beátus Apóstolus, cui reveláta sunt secréta cæléstia.
  - "&Gloria"
  - R. Beátus Apóstolus, cui reveláta sunt secréta cæléstia.
lectio9:
  - "Ergo una bona est, sed adhuc mísera; áltera mélior, et beáta. Ista
    significáta est per Apóstolum Petrum, illa per Joánnem. Tota hic ágitur ista
    usque in hujus sǽculi finem, et illic ínvenit finem; différtur illa
    complénda post hujus sǽculi finem, sed in futúro sǽculo non habet finem.
    Ideo dícitur huic: Séquere me. De illo autem: Sic eum volo manére, donec
    véniam: quid ad te? tu me séquere. Quid enim est hoc? Quantum sápio, quantum
    cápio, quid est hoc? nisi tu me séquere per imitatiónem perferéndi
    temporália mala: ille máneat, donec sempitérna vénio redditúrus bona."
  - "&teDeum"
