  - R. Reges Arabum et Saba dona Dómino Deo addúcent.
lectio4:
  - Sermo sancti Augustíni Epíscopi
  - "!Sermo 2 de Epiphania, qui est 30 de Tempore"
  - "Ad partum Vírginis adorándum Magi ab Oriénte venérunt. Hunc diem hódie
    celebrámus: huic debitum solemnitáti sermónem persolvimus. Illis dies iste
    primus illuxit, anniversaria nobis festivitate rediit. Illi erant primítiæ
    Géntium, nos pópulus Géntium. Nobis hoc lingua nuntiávit Apostolórum, stella
    illis tamquam lingua cælórum; et nobis iídem Apóstoli, tamquam alii cæli,
    enarravérunt glóriam Dei."
lectio5:
  - "Magnum sacraméntum: in præsepi jacebat, et Magos ab Oriénte ducebat.
    Abscondebátur in stábulo, et agnoscebátur in cælo: ut ágnitus in cælo
    manifestarétur in stábulo, et appellarétur Epiphanía dies iste, quod Latine
    manifestátio dici potest: simul ejus celsitúdinem humilitatémque commendans,
    ut qui in aperto cælo signis sidéreis monstrabátur magnus, in angusto
    diversorio quæsítus invenirétur inválidus, infantílibus in membris natus,
    infantilibúsque pannis involutus, adorarétur a Magis, timerétur a malis."
lectio6:
  - Tímuit enim eum rex Herodes, eisdem sibi Magis nuntiántibus, cum adhuc
    quærerent párvulum, quem cognóverant cælo teste jam natum. Quid erit
    tribúnal judicántis, quando supérbos reges cunábula terrébant infantis?
    Quanto consultius reges, non sicut Heródes interfícere quærant, sed sicut
    Magi potius adorare delecténtur; jam præsertim eum, qui et ipsam mortem,
    quam cupiebat inimícus inférre, étiam pro ipsis inimícis ab inimícis
    sustinuit, eamque in suo corpore occisus occídit. Pie timeant reges ad
    Patris déxteram jam sedéntem, quem rex ímpius tímuit adhuc matris úbera
    lambéntem.
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 2:1-12"
  - "Cum natus esset Jesus in Bethlehem Juda in diébus Herodis regis, ecce Magi
    ab Oriénte venérunt Jerosolymam, dicéntes: Ubi est qui natus est Rex
    Judæórum? Et réliqua."
  - _
  - De Homilía sancti Gregórii Papæ
  - "!Homilia 10 in Evangelia"
  - "Nativitáte Regis nostri cógnita, Heródes ad callida arguménta convértitur;
    et ne terreno regno privarétur, renuntiari sibi ubi puer inveniátur,
    postulat. Adorare eum velle se símulat, ut hunc, si inveníri possit,
    exstinguat. Sed quanta est humana malítia contra consílium divinitátis?
    Scriptum quippe est: Non est sapiéntia, non est prudéntia, non est consílium
    contra Dóminum. Nam ea, quæ appáruit stella, Magos perducit: natum Regem
    reperiunt, múnera déferunt: et ne redire ad Heródem debeant, in somnis
    admonéntur. Sicque fit, ut Jesum, quem quærit Heródes, inveníre non possit.
    Cujus persona qui alii, quam hypócritæ designántur, qui dum ficte quærunt,
    inveníre Dóminum numquam merentur?"
lectio8:
  - "Sed inter hæc sciéndum, quod Priscilliánistæ hæretici nasci unumquemque
    hóminem sub constitutiónibus stellárum putant: et hoc in adjutórium sui
    erroris assumunt, quod nova stella éxiit cum Dóminus in carne appáruit;
    cujus fuísse fatum eamdem, quæ appáruit, stellam putant. Sed si Evangélii
    verba pensamus, quibus de eádem stella dícitur: Usque dum veniens staret
    supra, ubi erat puer: dum non puer ad stellam, sed stella ad púerum
    cucúrrit, si dici liceat, non stella fatum púeri, sed fatum stellæ is, qui
    appáruit puer fuit."
lectio9:
  - "Sed a fidelium córdibus absit, ut aliquid esse fatum dicant. Vitam quippe
    hóminum solus hic Cónditor, qui creávit, adminístrat. Neque enim propter
    stellas homo, sed stellæ propter hóminem factæ sunt: et si stella fatum
    hóminis dícitur, ipsis suis ministériis subesse homo perhibétur. Certe cum
    Jacob de útero egrédiens, prioris fratris plantam tenéret manu, prior
    perfecte nequáquam égredi pótuit, nisi súbsequens inchoasset: et tamen cum
    uno témpore, eodémque momento utrumque mater fúderit, non una utriusque vitæ
    qualitas fuit."
  - "&teDeum"
ant-2:
  - "Ab Oriénte * venérunt Magi in Béthlehem adoráre Dóminum: et apértis
    thesáuris suis, pretiósa múnera obtulérunt: aurum, sicut Regi magno; thus,
    sicut Deo vero; myrrham, sepultúræ ejus, allelúja."
ant-3:
  - "Vidéntes stellam Magi, * gavísi sunt gáudio magno: et intrántes domum,
    obtulérunt Dómino aurum, thus, et myrrham, allelúja."
