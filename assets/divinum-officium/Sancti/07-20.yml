evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 19:13-21"
  - "In illo témpore: Obláti sunt Jesu párvuli, ut manus eis impóneret et
    oráret. Discípuli autem increpábant eos. Jesus vero ait eis: Sínite
    párvulos, et nolíte eos prohibére ad me veníre: tálium est enim regnum
    cœlórum. Et cum imposuísset eis manus, ábiit inde. Et ecce, unus accedens,
    ait illi: Magíster bone, quid boni fáciam, ut hábeam vitam ætérnam? Qui
    dixit ei: Quid me intérrogas de bono? Unus est bonus, Deus. Si autem vis ad
    vitam íngredi, serva mandáta. Dicit illi: Quæ? Jesus autem dixit: Non
    homicídium fácies: Non adulterábis: Non fácies furtum: Non falsum
    testimónium dices: Hónora patrem tuum et matrem tuam, et díliges próximum
    tuum sicut te ipsum. Dicit illi adoléscens: Omnia hæc custodívi a juventúte
    mea: quid adhuc mihi deest? Ait illi Jesus: Si vis perféctus esse, vade,
    vende, quæ habes, et da paupéribus, et habébis thesáurum in cœlo: et veni,
    séquere me."
offertorium:
  - "!Tob 12:12"
  - "Quando orábas cum lácrimis, et sepeliébas mórtuos, et derelinquébas
    prándium tuum, et mórtuos abscondébas per diem in domo tua, et nocte
    sepeliébas eos: ego óbtuli oratiónem tuam Dómino."
secreta:
  - "Clementíssime Deus, qui, véteri homine consúmpto, novum secúndum te in
    beáto Hierónymo creáre dignátus es: da, per mérita ipsíus; ut nos, páriter
    renováti, hanc placatiónis hóstiam in odórem tibi suavíssimum offerámus."
  - $Per Dominum
communio:
  - "!Jac 1:27"
  - "Relígio munda et immaculáta apud Deum et Patrem hæc est: Visitáre pupíllos
    et víduas in tribulatióne eórum, et immaculátum se custodíre ab hoc sǽculo."
postcommunio:
  - "Angelórum pane refécti te, Dómine, supplíciter deprecámur: ut, qui ánnuam
    beáti Hierónymi Confessóris tui memóriam celebráre gaudémus; ejúsdem étiam
    et exémplum imitémur, et amplíssimum in regno tuo præmium obtinére
    valeámus."
  - $Per Dominum
