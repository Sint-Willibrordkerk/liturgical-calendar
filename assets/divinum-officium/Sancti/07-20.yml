lectio4:
  - Hieronymus, e gente patrícia Æmiliáni Venetiis ortus, a prima adolescéntia
    milítiæ addictus, difficillimis reipublicæ tempóribus Casto novo ad Quarum
    in móntibus Tarvisinis præfícitur. Arce ab hostibus capta, ipse in
    teterrimum carcerem detrúditur, mánibus ac pédibus vinctus; cui omni humana
    ope destituto beatíssima Virgo, ejus precibus exorata, clemens adest,
    víncula solvit, et per médios hostes, qui vias omnes obséderant, in Tarvisii
    conspéctum incólumum ducit. Urbem ingréssus, ad Deíparæ aram, cui se
    vóverat, mánicas, compedes, catenas, quas secum detulerat, in accepti
    beneficii testimónium suspendit. Reversus Venetias, cœpit pietátis stúdia
    impensius cólere, in páuperes mire effúsus, sed puerórum præsertim misértus,
    qui paréntibus orbati, egeni et sórdidi per urbem vagabántur; quos in ædes a
    se conductas recepit de suo alendos, et christiánis móribus imbuéndos.
lectio5:
  - "Per eos dies Venetias appúlerant beátus Cajetanus et Petrus Caráfa
    (postmodum Paulus quartus), qui, Hierónymi spíritu novoque instituto
    colligéndi órphanos probato, illum in Incurabílium hospitale adduxérunt, in
    quo órphanos simul educaret, atque ægrotis pari caritate inservíret. Mox
    eorúmdem hortatu in próximam continentem profectus, Brixiæ primum, deínde
    Bérgomi atque Novocómi orphanotróphia eréxit: Bérgomi præsertim, ubi præter
    duo, pro púeris unum et pro puellis álterum, domum excipiendis, novo in
    illis regiónibus exemplo, muliéribus a turpi vita ad pœniténtiam conversis,
    apéruit. Somaschæ, in humili pago agri Bergoménsis ad Vénetæ ditiónis fines,
    sibi ac suis ibi sedem constítuit, formamque indúxit, congregatiónis, cui
    proptérea a Somascha nomen factum; quam subinde auctam et propagatam, nedum
    orphanórum regímini et ecclesiárum cultui, sed ad majórem christianæ
    reipublicæ utilitátem, adolescéntium in litteris et bonis móribus
    institutióni in collegiis, academíis et seminariis addictam, sanctus Pius
    quintus inter religiósos ordines adscripsit, ceteríque Pontifices
    privilegiis ornarunt."
lectio6:
  - Orphanis colligéndis intentus, Mediolanum proficíscitur atque Ticinum; et
    utrobíque collectis agmínibus puerórum, tectum, victum, vestem, magistros,
    nobílibus viris favéntibus, próvide constítuit. Inde Somascham redux,
    ómnibus ómnia factus, a nullo abhorrebat opere, quod in próximi bonum cédere
    prævidéret. Agricolis immixtus per agros sparsis, dum se illis adjutórem in
    meténdis frugibus præbet, mysteria fidei explicábat; puerórum cápita
    porígine fœda abstergens, et patienter tractans curábat; pútridis rusticórum
    vulnéribus medebátur eo successu, ut grátia curatiónum donatus censerétur.
    In monte, qui Somaschæ imminet, repérta specu, in illam se ábdidit; ubi, se
    flagellis cædens, dies integros jejunus tránsigens, oratióne in plurimum
    noctem protracta, super nudo saxo brevem somnum carpens, sui aliorúmque
    noxárum pœnas luebat. In hujus specus interiori recessu ex árido sílice
    exstillat aqua, precibus servi Dei, ut constant tradítio est, impetrata, quæ
    usque in hodiérnam diem jugiter manans, et in varias regiónes delata, ægris
    sanitátem plerumque conciliat. Tandem, ex contagióne quæ per omnem vallem
    serpebat, dum ægrotántibus inservit, et vita functos propriis humeris ad
    sepultúram defert, contracto morbo, annos natus sex et quinquagínta, quam
    paulo ante prædixerat, pretiósam mortem obiit anno millesimo quingentésimo
    trigesimo septimo. Quem plúribus in vita et post mortem miraculis illustrem,
    Benedíctus décimus quartus Beatórum, Clemens vero décimus tertius Sanctórum
    fastis solemniter adscripsit.
lectio94:
  - Hierónymus, e gente patrícia Æmiliána Venétiis ortus, a prima adolescéntia
    milítiæ addíctus, difficíllimis reipúblicæ tempóribus Castro novo ad Quarum
    in móntibus Tarvisínis præfícitur. Arce ab hóstibus capta, ipse in
    tetérrimum cárcerem detrúditur, a quo beatíssimæ Vírginis ope liberátur.
    Venétiis cœpit pietátis stúdia impénsius cólere, puerórum præsértim
    misértus, qui, paréntibus orbáti, per urbem vagabántur, quos in ædes a se
    condúctas recépit de suo aléndos et christiánis móribus imbuéndos. Per eos
    dies Venétias appúlerant beátus Cajetánus et Petrus Caráfa (póstmodum Paulus
    quartus), qui, Hierónymi spíritu probáto, illum in Incurabílium hospitále
    adduxérunt, in quo órphanos simul educáret et ægrótis inservíret. Mox,
    eorúndem hortátu, in próximam continéntem proféctus, Bríxiæ primum, deínde
    Bérgomi atque Novocómi orphanotrophía alíaque pia institúta eréxit. Somáschæ
    demum subsístens, in húmili pago agri Bergoménsis, sedem constítuit novæ
    congregatiónis, cui proptérea a Somáscha nomen factum, quam sanctus Pius
    quintus approbávit. Tandem contagióne, dum ægrotántibus inservíret,
    contrácto morbo, annos natus sex et quinquagínta, pro frátribus ánimam
    pósuit, anno millésimo quingentésimo trigésimo séptimo.
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 19:13-21"
  - "In illo témpore: Obláti sunt Jesu párvuli, ut manus eis impóneret, et
    oraret. Et réliqua."
  - _
  - Homilía sancti Joánnis Chrysostomi
  - "!Homilia 62 in Matthæum"
  - Cur discípuli púeros abigebant? Dignitátis causa. Quid ergo ille? Ut doceat
    illos modeste sapere, fastumque mundanum conculcare, et suscipit, et ulnis
    complectitur, talibúsque regnum cælórum pollicétur; id quod étiam dixit
    superius. Et nos ígitur, si volumus heredes esse cælórum, hanc virtútem cum
    diligéntia magna sectemur. Hoc est enim philosophíæ culmen, simplicem esse
    cum prudéntia; hæc vita est angelica. Anima enim puéruli ómnibus animi
    morbis vacua est; non memóriam retinet injuriárum, sed eas inferéntes adit
    ut amicos, ac si nihil factum esset. Et quamvis a matre verbéribus cædátur,
    eam semper quærit, et ómnibus antepónit.
lectio8:
  - "Si regínam ipsi ostendas diadémate ornatam, non præfert eam matri pannis
    detritis vestitæ, malletque illam incultam vidére, quam regínam mirifice
    amíctam. Nam, quod suum, quod aliénum est, non ex paupertáte vel divítiis,
    sed ex amóre existimare solet; et nihil plus requirit quam necessaria, atque
    ut lacte repletus est, statim a mamma abscedit. Non eisdem, quibus nos,
    ærumnis prémitur, nec pecuniárum jactura, rebusque simílibus; nec iisdem,
    quibus nos, fluxis rebus lætátur, neque córporum pulchritúdinem mirátur.
    Ideo dicebat: Talium est enim regnum cælórum; ut ex proposito voluntátis
    illa operemur, quæ natúra sua púeri faciunt."
lectio9:
  - Quia enim pharisæi non aliunde quam a nequítia et arrogántia ad agéndum
    ferebántur, ideo ubíque discipulos suos simplices esse jubet, illosque
    subíndicat, dum hos instituit. Nihil enim ita supérbiam parit, ut
    principátus et primi conséssus. Quóniam ígitur discípuli per totum terrárum
    orbem multum honoris consecuturi erant, ipsórum animos prævenit, nec sinit
    eos humánum quid pati, nec honórema vulgo expétere, vel ante alios sese
    efferre. Nam, etiamsi hæc parva vidéntur esse, at malis ingéntibus causam
    præbent. Sic enim institúti pharisæi in malórum culmen ascendérunt,
    salutatiónes, primos conséssus et médios requiréntes; hinc in ardentem
    glóriæ cupiditátem, inde vero in impietátem lapsi sunt.
  - "&teDeum"
