oratio:
  - "Deus, misericordiárum pater, per mérita et intercessiónem beáti Hieronymi,
    quem órphanis adjutorem et patrem esse voluísti: concéde; ut spíritum
    adoptiónis, quo fílii tui nominámur et sumus, fidéliter custodiámus."
  - $Per Dominum
lectio:
  - Léctio Isaíæ Prophétæ
  - "!Is 58:7-11."
  - "Hæc dicit Dóminus: Frange esuriénti panem tuum, et egénos vagósque induc in
    domum tuam: cum víderis nudum, operi eum, et carnem tuam ne despéxeris. Tunc
    erúmpet quasi mane lumen tuum, et sánitas tua citius oriétur, et anteíbit
    fáciem tuam justítia tua, et glória Dómini cólliget te. Tunc invocábis, et
    Dóminus exáudiet: clamabis, et dicet: Ecce, adsum; si abstúleris de médio
    tui caténam, et desíeris exténdere dígitum, et loqui quod non prodest. Cum
    effúderis esuriénti ánimam tuam, et ánimam afflíctam repléveris. Oriétur in
    tenebris lux tua, et ténebræ tuæ erunt sicut merídies. Et réquiem tibi dabit
    Dóminus semper, et implébit splendóribus ánimam tuam, et ossa tua liberábit,
    et eris quasi hortus irríguus, et sicut fons aquárum, cujus non defícient
    aquæ."
graduale:
  - "!Prov 5:16"
  - Derivéntur fontes tui foras, et in platéis aquas tuas divide.
  - "!Ps 111:5-6"
  - "Jucúndus homo, qui miserétur et cómmodat: dispónet sermónes suos in
    judício, quia in ætérnum non commovébitur. Allelúja, allelúja."
  - "!Ps 111:9"
  - "V. Dispérsit, dedit paupéribus: justítia ejus manet in sǽculum sǽculi.
    Allelúja."
