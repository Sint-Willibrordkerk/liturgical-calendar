lectio:
  - Léctio Daniélis Prophétæ
  - "!Dan 9:21-26"
  - "In diébus illis: Ecce, vir Gabriël, quem víderam in visióne a princípio,
    cito volans tétigit me in témpore sacrifícii vespertíni. Et dócuit me et
    locútus est mihi dixítque: Dániel, nunc egréssus sum, ut docérem te et
    intellégeres. Ab exórdio precum tuárum egréssus est sermo: ego autem veni,
    ut indicárem tibi, quia vir desideriórum es: tu ergo animadvérte sermónem et
    intéllege visiónem. Septuagínta hebdómades abbreviátæ sunt super pópulum
    tuum et super urbem sanctam tuam, ut consummétur prævaricátio, et finem
    accípiat peccátum, et deleátur iníquitas, et adducátur justítia sempitérna,
    et impleátur vísio et prophetía, et ungátur Sanctus sanctórum. Scito ergo et
    animadvérte: Ab éxitu sermónis, ut íterum ædificétur Jerúsalem, usque ad
    Christum ducem, hebdómades septem et hebdómades sexagínta duæ erunt: et
    rursum ædificábitur platéa et muri in angústia témporum. Et post hebdómades
    sexagínta duas occidétur Christus: et non erit ejus pópulus, qui eum
    negatúrus est. Et civitátem et sanctuárium dissipábit pópulus cum duce
    ventúro: et finis ejus vástitas, et post finem belli statúta desolátio."
