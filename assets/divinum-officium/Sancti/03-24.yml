lectio4:
  - Sermo sancti Bedæ venerábilis Presbýteri
  - "!Expositio in Luc. 1, 11-20."
  - "Appáruit Zacharíæ Angelus, stans a dextris altáris incénsi. Bene Angelus et
    in templo, et juxta altáre, et dextris appáret; quia vidélicet et veri
    sacerdótis advéntum, et mystérium sacrifícii universális, et cæléstis doni
    gáudium prǽdicat. Nam, sicut per sinístram præséntia, sic per déxteram sæpe
    bona prænuntiántur ætérna. Juxta quod in sapiéntiæ laude cánitur: Longitúdo
    diérum in déxtera ejus; in sinístra illíus divítiæ et glória. Treméntem
    Zacharíam confórtet Angelus, quia, sicut humánæ fragilitátis est spiritális
    creatúræ visióne turbári, ita et angélicas benignitátis est pavéntes de
    aspéctu suo mortáles mox blandiéndo solári. At contra dæmónicæ est
    ferocitátis, quos sui præséntia térritos sénserit, amplióri semper horróre
    concútere, qua nulla mélius ratióne quam fide superátur intrépida."
responsory4:
  - R. Factum est, cum sacerdótio fungerétur Zacharías in órdine vicis sufflánte
    Deum,
  - "* Appáruit ei Angelus Gábriel, stans a dextris altáris incénsi."
  - V. Cumque, ingréssus in templum Dómini, incénsum póneret secúndum
    consuetúdinem sacerdótii sui.
  - R. Appáruit ei Angelus Gábriel, stans a dextris altáris incénsi.
lectio5:
  - "Angelus, deprecatiónem dicens exaudítam, partum contínuo promíttit uxóris.
    Non quod ille, qui pro pópulo oblatúrus intráverat, relíctis públicis votis,
    pro accipiéndis fíliis oráre potúerit, præsértim quia nemo orat quod se
    acceptúrum despérat. Adeo autem ille, jam suæ ætátis et infœcúndæ cónjugis
    memor, nasci sibi fílios desperábat, ut nec Angelo hoc promitténti créderet.
    Sed quod dicit: Exaudíta est deprecátio tua, pro pópuli redemptióne
    signíficat; Et uxor tua páriet tibi fílium, ejúsdem redemptiónis órdinem
    pandit, quod vidélicet natus Zacharíæ fílius Redemptóri illíus pópuli
    præconándo sit iter factúrus. Quia enim Zacharíam, pro plebe supplicántem,
    díxerat exaudítum, docet quo órdine plebs eádem salvári et pérfici débeat,
    ad prædicatiónem vidélicet Joánnis pæniténdo et credéndo in Christum."
responsory5:
  - R. Descéndit Gábriel Angelus ad Zacharíam dicens
  - "* Ne tímeas quóniam exaudíta est deprecátio tua, et uxor tua Elísabeth
    paret tibi fílium, et vocábis nomen ejus Joánnem"
  - "V. Et Zacharías turbátus est videns, et timor írruit super eum: ait autem
    ad illum Angelus"
  - R. Ne tímeas quóniam exaudíta est deprecátio tua, et uxor tua Elísabeth
    paret tibi fílium, et vocábis nomen ejus Joánnem.
lectio6:
  - Zacharías ob altitúdinem promissórum hǽsitans, signum quo crédere váleat,
    inquírit cui sola Angeli vísio vel allocútio pro signo suffícere debúerat.
    Unde méritam diffidéntiæ tacéndo pœnam luit, cui tacitúrnitas eádem et
    signum fídei quod quæsívit, et infidelitátis esset pœna quem méruit. Vult
    intélligi quod si homo tália promítteret, impúne signum flagitáre licéret,
    at cum ángelus promíttat, jam dubitári non déceat. Datque signum quod
    rogátur, ut qui discredéndo locútus est, jam tacéndo crédere discat. Ubi
    notándo quod Angelus se et ante Deum adstáre, et ad evangelizándum Zacharíæ
    missum esse testátur; quia et cum ad nos véniunt Angeli, sic extérius
    implent ministérium, ut tamen nunquam desint intérius per contemplatiónem.
    Et mittúntur ígitur et assístunt, quia, et si circumscríptus est angélicus
    spíritus, summus tamen spíritus ipse qui Deus est, circumscríptus non est.
    Angeli ítaque et missi ante ipsum sunt, quia, quólibet missi véniunt, intra
    ipsum currunt. -- Festum sancti Gabriélis Archángeli Benedíctus Papa décimus
    quintus ad univérsam ecclésiam exténdit.
responsory6:
  - R. Ego sum Gábriel Angelus, qui asto ante Dóminum.' et missus sum loqui te,
    et hæc evangelizáre
  - "* Ecce eris tacens, et non póteris loqui usque in diem quo hæc fiant"
  - V. Pro eo quod non credidísti verbis meis, quæ implebúntur témpore suo
  - R. Ecce eris tacens, et non póteris loqui usque in diem quo hæc fiant
  - "&Gloria"
  - R. Ecce eris tacens, et non póteris loqui usque in diem quo hæc fiant.
