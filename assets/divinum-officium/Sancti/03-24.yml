lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 1:26-38"
  - "In illo témpore: Missus est Angelus Gábriel a Deo in civitátem Galilǽæ, cui
    nomen Názareth, ad Vírginem desponsátam viro, cui nomen erat Joseph de domo
    David, et nomen Vírginis María. Et réliqua."
  - _
  - Homilía Sancti Bernárdi Abbátis
  - "!Homilia 1 supra Missus est n. 2"
  - Non árbitror hunc ángelum de minóribus esse, qui quálibet ex causa crebra
    sóleant ad terras fungi legatióne. Quod ex ejus nómine palam intélligi
    dícitur, quod interpretátio Fortitúdo Dei dícitur; et quia non ab álio
    áliquo forte excellentióre se (ut ássolet) spíritu, sed ab ipso Deo mitti
    perhibétur. Propter hoc ergo pósitum est, A Deo. Vel ídeo dictum est, A Deo,
    ne cui, vel beatórum spirítuum suum Deus, ántequam Vírgini, revelásse
    putétur consílium, excépto dumtáxat Archángelo Gabriéle; qui útique tantæ
    inter suos inveníri potúerit excelléntiæ, ut tali et nómine dignus haberétur
    et núntio.
responsory7:
  - "R. Missus est Gábriel Angelus ad Maríam Vírginem desponsátam Joseph,
    núntians ei verbum: et expavéscit Virgo de lúmine."
  - "* Ne tímeas, María, invenísti enim grátiam apud Dóminum: ecce concípies, et
    páries, et vocábitur Altíssimi Fílius"
  - V. Quæ cum audísset turbáta est in sermóne ejus, et cogitábat qualis esset
    ista salutátio; et ait Angelus ei.
  - "R. Ne tímeas, María, invenísti enim grátiam apud Dóminum: ecce concípies,
    et páries, et vocábitur Altíssimi Fílius."
lectio8:
  - Nec discórdat nomen a núntio. Dei quippe virtútem Christum quem mélius
    nuntiáre decébat quam hunc, quem símile nomen honórat? Nam quid est áliud
    fortitúdo, quam virtus? Non autem dedécens aut incóngruum videátur, Dóminum
    et núntium commúni censéri vocábulo; cum símilis in utróque appellatiónis,
    non sit tamen utriúsque símilis causa. Aliter quippe Christus fortitúdo vel
    virtus Dei dícitur, áliter Angelus; Angelus enim tantum nuncupatíve,
    Christus autem étiam substantíve.
responsory8:
  - "R. Gaude, María Virgo cunctas hǽreses sola interemísti:"
  - "* Quæ Gabriéli Archángeli dictis credidísti, dum Virgo Deum a hóminem
    genuísti, et post partum, Virgo, invioláta permansísti."
  - V. Benedícta tu in muliéribus, et benedíctus fructus ventris tui.
  - R. Quæ Gabriéli Archángeli dictis credidísti, dum Virgo Deum a hóminem
    genuísti, et post partum, Virgo, invioláta permansísti.
  - "&Gloria"
  - R. Quæ Gabriéli Archángeli dictis credidísti, dum Virgo Deum a hóminem
    genuísti, et post partum, Virgo, invioláta permansísti.
lectio9:
  - "Christus Dei virtus et dícitur et est, qui forti armáto, qui suum átrium in
    pace custodíre solébat, fórtior supervéniens, ipsum suo bráchio debellávit:
    et sic ei vasa captivitátis poténter erípuit. Angelus vero fortitúdo Dei
    appellátus est, vel quod hujúsmodi merúerit, prærogatívam offícii, quo
    ejúsdem nuntiáret advéntum virtútis: vel quia vírginem natúra pávidam,
    símplicem, verecúndam, de miráculi novitáte ne expavésceret, confortáre
    debéret; quod et fecit, Ne tímeas, ínquiens, María, invenísti enim grátiam
    apud Deum. Conveniénter ítaque Gábriel ad hoc opus elígitur, immo quia tale
    illi negótium injúngitur, recte tali nómine designátur."
  - "&teDeum"
