  - Simplex
  - "1.1"
  - "@C3"
rule:
  - vide C3;
oratio:
  - "Præsta, quǽsumus, omnípotens Deus: ut, qui sanctórum tuórum Alexándri,
    Evéntii, Theodúli atque Juvenális natalítia cólimus; a cunctis malis
    imminéntibus, eórum intercessiónibus, liberémur."
  - $Per Dominum
secreta:
  - "Super has hóstias, quǽsumus, Dómine, benedíctio copiósa descéndat: quæ et
    sanctificatiónem nobis cleménter operátur, et de Sanctórum nos sollemnitáte
    lætíficet."
  - $Per Dominum
postcommunio:
  - "Refécti participatióne múneris sacri, quǽsumus, Dómine, Deus noster: ut,
    cujus exséquimur cultum, intercedéntibus sanctis tuis Alexándro, Evéntio,
    Theodúlo et Juvenále, sentiámus efféctum."
  - $Per Dominum
lectio94:
  - "Alexander Romanus, Hadriáno imperatóre regens Ecclésiam, magnam partem
    Romanæ nobilitátis ad Christum convértit. Is constítuit ut tantummodo panis
    et vinum in mysterio offerrétur: vinum autem aqua miscéri jussit, propter
    sánguinem et aquam, quæ ex Jesu Christi látere profluxérunt; et in Cánone
    Missæ addidit, Qui pridie quam paterétur. Idem decrevit ut aqua benedicta,
    sale admixto, perpetuo in ecclésia asservarétur, et in cubiculis adhiberétur
    ad fugándos dæmones. Sedit annos decem, menses quinque et dies viginti, vitæ
    sanctitáte et salutáribus institútis illustris. Martyrio coronátus est una
    cum Eventio et Theodúlo presbyteris, sepultúsque est via Nomentana, tertio
    ab Urbe lápide, eodem in loco, ubi secúri percússus fuerat; creátis diverso
    témpore mense Decembri presbyteris sex, diáconis duobus et epíscopis per
    diversa loca quinque. Eórum corpora, póstea in Urbem translata, in ecclésia
    sanctæ Sabinæ condita sunt. In eumdem diem incidit beáta mors sancti
    Juvenalis, Narniénsis epíscopi; qui, cum plurimos in ea urbe sanctitáte et
    doctrina Christo peperísset, clarus miraculis in pace quiévit ibique
    honorifice sepúltus est."
  - "&teDeum"
