oratio:
  - "Fac nos, Dómine Deus, supereminéntem Jesu Christi sciéntiam, spíritu Pauli
    Apóstoli, edíscere: qua beátus Antónius María mirabíliter erudítus, novas in
    Ecclésia tua clericórum et vírginum famílias congregávit."
  - $Per eundem
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Timótheum
  - "!1. Tim 4:8-16."
  - "Caríssime: Píetas ad ómnia utilis est: promissiónem habens vitæ, quæ nunc
    est, et futúræ. Fidélis sermo et omni acceptióne dignus. In hoc enim
    laborámus et maledícimur, quia sperámus in Deum vivum, qui est Salvátor
    ómnium hóminum, maxime fidélium. Præcipe hæc et doce. Nemo adolescentiam
    tuam contémnat: sed exémplum esto fidélium in verbo, in conversatióne, in
    caritáte, in fide, in castitáte. Dum vénio, atténde lectióni, exhortatióni
    et doctrínæ. Noli neglégere grátiam, quæ in te est, quæ data est tibi per
    prophetíam, cum impositióne mánuum presbytérii. Hæc meditáre, in his esto:
    ut proféctus tuus maniféstus sit ómnibus. Attende tibi et doctrínæ: insta in
    illis. Hoc enim fáciens, et teípsum salvum fácies, et eos qui te áudiunt."
