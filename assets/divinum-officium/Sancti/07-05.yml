tractus:
  - "!2 Cor 10:17-18"
  - "Qui gloriátur, in Dómino gloriétur: non enim, qui seípsum comméndat, ille
    probátus est: sed quem Deus comméndat."
  - "!Gal 6:14"
  - "Mihi autem absit gloriári, nisi in Cruce Dómini nostri Jesu Christi: per
    quem mihi mundus crucifíxus est, et ego mundo."
  - "!Philipp 1:21"
  - Mihi vívere Christus est, et mori lucrum.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Marcum
  - "!Marc 10:15-21"
  - "In illo témpore: Dixit Jesus discípulis suis: Quisquis non recéperit regnum
    Dei velut párvulus, non intrábit in illud. Et compléxans párvulos et
    impónens manus super illos, benedicébat eos. Et cum egréssus esset in viam,
    procúrrens quidam, genu flexo ante eum, rogábat eum: Magíster bone, quid
    fáciam, ut vitam ætérnam percípiam? Jesus autem dixit ei: Quid me dicis
    bonum? Nemo bonus, nisi unus Deus. Præcépta nosti: Ne adúlteres, ne occídas,
    ne furéris, ne falsum testimónium díxeris, ne fraudem féceris, honora patrem
    tuum et matrem. At ille respóndens, ait illi: Magíster, hæc ómnia observávi
    a juventúte mea. Jesus autem intúitus eum, diléxit eum et dixit ei: Unum
    tibi deest: vade, quæcúmque habes, vende et da paupéribus, et habébis
    thesáurum in cælo: et veni, séquere me."
offertorium:
  - "!Ps 137:1-2"
  - "In conspéctu Angelórum psallam tibi: adorábo ad templum sanctum tuum, et
    confitébor nómini tuo."
secreta:
  - Ad mensam cœléstis convívii fac nos, Dómine, eam mentis et córporis
    puritátem afférre, qua beátus Antónius María, hanc sacratíssimam hóstiam
    ófferens, mirífice ornátus enítuit.
  - $Per Dominum
communio:
  - "!Philipp 3:17"
  - Imitatóres mei estóte, fratres, et observáte eos, qui ita ámbulant, sicut
    habétis formam nostram.
postcommunio:
  - "Cœlésti dape, qua pasti sumus, Dómine Jesu Christe, eo corda nostra
    caritátis igne flamméscant: quo beátus Antónius María salutáris hóstiæ
    vexíllum, contra Ecclésiæ tuæ hostes, éxtulit ad victóriam:"
  - $Qui vivis.
lectio4:
  - Antonius Maria Zaccaría, Cremonæ in Insubria nobili genere natus, jam a
    púero qua futurus esset sanctitáte porténdere visus est. Eximiárum enim in
    eo virtútum significatiónes mature eluxérunt, pietátis in Deum ac beátam
    Vírginem; insígnis præsertim in páuperes misericórdiæ; quorum inópiæ
    sublevandæ, vel pretiósa veste sibi detracta, haud semel præsto fuit.
    Humanióribus litteris in pátria excultus, Ticíni philosophíæ, Patavii
    medicinæ addiscendæ operam dedit; utque ómnibus vitæ integritate, ita et
    æquálibus acúmine ingenii facile antecelluit. Lauream adeptus ac domum
    reversus, ubi intelléxit se Dei mónitu ad animórum magis quam córporum
    morbis medéndum vocari, in sacras disciplínas percipiendas sédulo incúbuit.
    Interea ægrotos vísere, púeros christiana doctrina informare, júvenum cœtus
    pietáte excólere, ætate étiam provectos ad mores emendándos frequenter
    hortari non déstitit. Sacris initiatus, cum primo litáret, cælésti oborto
    lúmine, Angelórum coróna circúmdatus stupénti pópulo apparuísse tráditur.
    Exinde animárum salúti impensius consúlere, depravátis móribus summa ope
    obsístere curæ fuit. Ad hæc ádvenas, egénos, afflictos paterno complexus
    afféctu, piis alloquiis atque subsidiis recreatos ita solari, ut ejus domus
    miserórum perfúgium haberétur, ípseque pater pátriæ atque angelus merúerit a
    suis civibus appellari.
lectio5:
  - Mediolani, cum secum agitaret uberióres in rem christianam manare posse
    fructus, si in vinea Dómini sibi labórum socios adscísceret, re communicáta
    cum Bartholomæo Ferrario et Jacobo Morígia, nobilíssimis et sanctíssimis
    viris, sodalitátis Clericórum regulárium fundaménta jecit; quam, ob suum in
    Géntium Apostolum amórem, a sancto Paulo nuncupávit. Quæ, Cleménte septimo
    Pontifice máximo approbante et Paulo tertio confirmánte, brevi per complures
    regiónes propagáta est. Sanctimoniálium quoque Angelicárum socíetas ipsum
    Antónium Mariam parentem et auctórem hábuit. Qui tamen adeo de se submisse
    sentiebat, ut nullo pacto præésse suo ordini umquam volúerit. Tanta vero
    fuit patiéntia, ut formidolosíssimas tempestates in suos commótas constanti
    animo perferret; tanta caritate, ut piis adhortatiónibus religiósos viros ad
    Dei amórem inflammare, sacerdótes ad apostolicam vivéndi normam revocare,
    patrumque familias sodalítia ad bonam frugem institúere numquam
    intermíserit. Immo, intérdum præláta cruce per cómpita plateasque cum suis
    progréssus, férvida ac veheménti oratióne aberrántes improbosque hómines ad
    salútem redúceret.
lectio6:
  - Illud étiam memorándum, quod, in Jesum crucifixum amóre flagrans, crucis
    mystérium ab ómnibus, ad statum æris campani indícium, sexta quaque feria
    sub vésperas, recoléndum curávit. Sanctíssimum Christi nomen in suis
    scriptis passim usurpábat et in ore semper habebat; ejusdémque cruciatus,
    vere Pauli discipulus, in corpore suo præ se ferebat. In sacram Eucharistiam
    singulari caritate ferebátur; cujus et frequenter percipiendæ consuetúdinem
    instaurávit, et morem e sublimi throno publice in triduum adorandæ invexísse
    perhibétur. Pudicítiam adeo coluit, ut étiam in exsangui corpore,
    revivíscere visus, ejus amórem testarétur. Accéssere cæléstia dona éxtasis,
    lacrimárum, futurórum eventuum cognitiónis, scrutatiónis cordium, virtútis
    in humani generis hostem. Tandem, magnis labóribus ubíque exantlátis,
    Guastallæ quo pacis sequester accítus fuerat, gravi morbo correptus est.
    Cremonam adductus, inter suórum fletus et complexus piíssimæ matris, quam
    proxime obituram prædixit, superna Apostolórum visióne recreatus,
    sodalitátis suæ increménta prænuntians, tertio Nonas Julii anno millesimo
    quingentésimo trigesimo nono, sanctíssime obiit, annos natus sex supra
    trigínta. Cultum tanto viro, ob exímiam ejus sanctitátem et signórum copiam
    a christiáno pópulo statim exhíbitum, Leo décimus tertius Pontifex maximus
    ratum hábuit et confirmávit; eumdémque anno millesimo octingentésimo
    nonagesimo septimo, in festo Ascensiónis Dominicæ, solemni ritu Sanctórum
    fastis adscripsit.
lectio94:
  - Antónius María Zaccaría, Cremónæ nóbili génere natus, jam a púero morum
    pudicítia et misericórdia in páuperes elúxit. Humánis lítteris, philosophíæ
    ac medicínæ vacans, integritáte vitæ et ingénii acúmine æquálibus
    antecélluit. Dei mónitu, disciplínas sédulo excóluit; mox, sacerdótio
    auctus, talem se prǽbuit, ut pater pátriæ atque ángelus merúerit a suis
    cívibus appellári. Medioláni, cum Bartholomǽo Ferrário et Jacóbo Morígia,
    sanctíssimis viris, sodalitátem Clericórum regulárium, a sancto Paulo
    nuncupátam, et Sanctimoniálium Angelicárum societátem instítuit. Sacræ
    Eucharístiæ cultor assíduus, públicam sanctíssimi Sacraménti expositiónem
    mirífice promóvit. Cæléstibus donis a Deo ditátus, magnísque labóribus
    oppréssus, gravem morbum cum nactus esset, Cremónæ, tértio nonas júlii, anno
    millésimo quingentésimo trigésimo nono, sanctíssime óbiit. Leo Papa décimus
    tértius cultum ei exhíbitum, ratum hábuit et confirmávit, eúmque Sanctórum
    catálogo adscrípsit.
  - "&teDeum"
