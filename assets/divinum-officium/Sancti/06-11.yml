oratio:
  - "Deus, qui nos beáti Bárnabæ Apóstoli tui méritis et intercessióne
    lætíficas: concéde propítius; ut, qui tua per eum benefícia póscimus, dono
    tuæ grátiæ consequámur."
  - $Per Dominum
lectio:
  - Léctio Actuum Apostolórum
  - "!Act 11:21-26; 13:1-3"
  - "In diébus illis: Multus númerus credéntium Antiochíæ convérsus est ad
    Dóminum. Pervénit autem sermo ad aures ecclésiæ, quæ erat Jerosólymis, super
    istis: et misérunt Bárnabam usque ad Antiochíam. Qui cum pervenísset et
    vidísset grátiam Dei, gavísus est: et hortabátur omnes in propósito cordis
    permanére in Dómino: quia erat vir bonus, et plenus Spiritu Sancto et fide.
    Et appósita est multa turba Dómino. Proféctus est autem Bárnabas Tarsum, ut
    quæreret Saulum: quem cum invenísset, perdúxit Antiochíam. Et annum totum
    conversáti sunt ibi in ecclésia: et docuérunt turbam multam, ita ut
    cognominaréntur primum Antiochíæ discípuli Christiáni. Erant autem in
    ecclésia, quæ erat Antiochíæ, prophétæ et doctóres, in quibus Bárnabas, et
    Simon qui vocabátur Niger, et Lúcius Cyrenénsis, et Mánahen qui erat Heródis
    Tetrárchæ collactáneus, et Saulus. Ministrántibus autem illis Dómino et
    jejunántibus, dixit illis Spíritus Sanctus: Segregáte mihi Saulum et
    Bárnabam in opus, ad quod assúmpsi eos. Tunc jejunántes et orantes
    imponentésque eis manus, dimisérunt illos."
graduale:
  - "!Ps 18:5; 18:2"
  - "In omnem terram exívit sonus eórum: et in fines orbis terræ verba eórum."
  - "V. Cœli enárrant glóriam Dei: et ópera mánuum ejus annúntiat firmaméntum.
    Allelúja, allelúja."
  - "!Ps 15:16"
  - "Ego vos elégi de mundo, ut eátis et fructum afferátis: et fructus vester
    maneat. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 10:16-22"
  - "In illo témpore: Dixit Jesus discípulis suis: Ecce, ego mitto vos sicut
    oves in médio lupórum. Estóte ergo prudéntes sicut serpentes, et símplices
    sicut colúmbæ. Cavéte autem ab homínibus. Tradent enim vos in concíliis, et
    in synagógis suis flagellábunt vos: et ad præsides et ad reges ducémini
    propter me in testimónium illis et géntibus. Cum autem tradent vos, nolíte
    cogitáre, quómodo aut quid loquámini: dábitur enim vobis in illa hora, quid
    loquámini. Non enim vos estis, qui loquímini, sed Spíritus Patris vestri,
    qui lóquitur in vobis. Tradet autem frater fratrem in mortem, et pater
    fílium: et insúrgent fílii in paréntes, et morte eos affícient: et éritis
    odio ómnibus propter nomen meum: qui autem perseveráverit usque in finem,
    hic salvus erit."
offertorium:
  - "@Sancti/02-24"
secreta:
  - Múnera, Dómine, obláta sanctífica, et, intercedénte beáto Bárnaba Apostolo
    tuo, nos per hæc a peccatórum nostrórum máculis emúnda.
  - $Per Dominum
communio:
  - "@Sancti/02-24"
postcommunio:
  - "Súpplices te rogámus, omnípotens Deus: ut, quos tuis réficis sacraméntis,
    intercedénte beáto Bárnaba Apóstolo tuo, tibi étiam plácitis móribus
    dignánter tríbuas deservíre."
  - $Per Dominum
lectio1:
  - De Actibus Apostolórum
  - "!Acts 13:43-47"
  - 43 Cum dimíssa esset synagóga, secúti sunt multi Judæórum et coléntium
    advenárum, Paulum et Bárnabam; qui loquéntes suadébant eis ut permanérent in
    grátia Dei.
  - 44 Sequénti vero sábbato pene univérsa cívitas convénit audíre verbum Dei.
  - 45 Vidéntes autem turbas Judǽi, repléti sunt zelo, et contradicébant his,
    quæ a Paulo dicebántur, blasphemántes.
  - "46 Tunc constánter Paulus et Bárnabas dixérunt: Vobis oportébat primum
    loqui verbum Dei; sed, quóniam repéllitis illud, et indígnos vos judicátis
    ætérnæ vitæ, ecce convértimur ad gentes;"
  - "47 sic enim præcépit nobis Dóminus: Pósui te in lucem Géntium, ut sis in
    salútem usque ad extrémum terræ."
lectio2:
  - "!Act 13:48-52"
  - "48 Audiéntes autem gentes, gavísæ sunt, et glorificábant verbum Dómini: et
    credidérunt quotquot erant præordináti ad vitam ætérnam."
  - 49 Disseminabátur autem verbum Dómini per univérsam regiónem.
  - "50 Judǽi autem concitavérunt mulíeres religiósas et honéstas, et primos
    civitátis, et excitavérunt persecutiónem in Paulum et Bárnabam: et ejecérunt
    eos de fínibus suis."
  - 51 At illi, excússo púlvere pedum in eos, venérunt Icónium.
  - 52 Discípuli quoque replebántur gáudio, et Spíritu Sancto.
lectio3:
  - "!Act 14:1-3"
  - 1 Factum est autem Icónii, ut simul introírent in synagógam Judæórum, et
    loqueréntur, ita ut créderet Judæórum et Græcórum copiósa multitúdo.
  - 2 Qui vero incréduli fuérunt Judǽi, suscitavérunt et ad iracúndiam
    concitavérunt ánimas Géntium advérsus fratres.
  - 3 Multo ígitur témpore demoráti sunt, fiduciáliter agéntes in Dómino,
    testimónium perhibénte verbo grátiæ suæ, dante signa et prodígia fíeri per
    manus eórum.
lectio4:
  - Bárnabas Levítes, Cýprius génere, qui et Joseph, cum Paulo Géntium Apóstolus
    ordinátus est ad prædicándum Jesu Christi Evangélium. Is, agro véndito quem
    habébat, redáctam ex eo pecúniam áttulit Apóstolis. Missus autem Antiochíam
    prædicatiónis causa, cum ibi multos ad Christi Dómini fidem convérsos esse
    comperísset, incredibíliter lætátus, eos hortabátur ut in Christi fide
    permanérent. Qua cohortatióne multum proficiébat, quod ab ómnibus vir bonus
    et Spíritu Sancto plenus habebátur.
lectio5:
  - "Proféctus inde Tarsum ut quæreret Paulum, cum eo Antiochíam venit. In ejus
    urbis ecclésia annum commoráti, christiánæ fídei et vitæ illis homínibus
    præcépta dedérunt: ubi étiam Jesu Christi cultóres primum Christiáni sunt
    appelláti. Discípuli autem Pauli et Bárnabæ, suis facultátibus Christiános,
    qui in Judǽa erant, sustentábant, eo mitténtes pecúniam per Paulum et
    Bárnabam. Qui perfúncti illo caritátis offício, adhíbito Joánne, cui
    cognómen erat Marcus, rediérunt Antiochíam."
lectio6:
  - "Cum autem Antiochíæ in Ecclésia, cum céteris prophétis et doctóribus,
    Paulus et Bárnabas in jejúnio et oratióne Dómino deservírent, dixit Spíritus
    Sanctus: Segregáte mihi Saulum et Bárnabam in opus, ad quod assúmpsi eos.
    Tunc jejunántes et orántes, imponentésque eis manus, dimisérunt illos.
    Itaque Seleucíam venérunt, inde in Cyprum; ac multas prætérea urbes
    regionésque, prædicántes Evangélium summa cum audéntium utilitáte,
    peragrárunt. Postrémo Bárnabas digréssus a Paulo, una cum Joánne, qui
    cognominátus est Marcus, navigávit in Cyprum; ibíque círciter séptimum
    Nerónis annum, tértio Idus Júnii ad apostólici múneris laudem, martyrii
    corónam adjúnxit. Ejus corpus, Zenóne imperatóre, repértum est in ínsula
    Cypro; ad cujus pectus erat Evangélium Matthæi, Bárnabæ manu conscríptum."
lectio94:
  - Bárnabas Levítes, Cyprius génere, cum Paulo Apóstolo ordinátus est ad
    prædicándum Jesu Christi Evangélium. Is, agro véndito quem habébat, redáctam
    ex eo pecúniam áttulit Apóstolis. Missus Antiochíam prædicatiónis causa,
    multos ibi ad Christi fidem convérsos suis hortatiónibus confirmávit. Inde
    proféctus cum eódem Paulo, multas urbes regionésque summa cum audiéntium
    utilitáte peragrávit. Postrémo, digréssus a Paulo, una cum Joánne, qui
    cognominátus est Marcus, navigávit in Cyprum, ibíque, séptimo Nerónis anno,
    ad apostólici múneris laudem martýrii corónam adjúnxit.
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum.
  - "!Matt 10:16-22"
  - "In illo témpore: Dixit Jesus discípulis suis: Ecce ego mitto vos sicut oves
    in médio lupórum. Et réliqua."
  - _
  - Homilía sancti Joánnis Chrysóstomi.
  - "!Homilia 34 in Matthæum, post initium"
  - Cum Dóminus omnem sollicitúdinem a discipulórum córdibus ejécerit, et
    ostensióne signórum armáverit, atque, ab ómnibus negótiis sæculáribus
    alienátos et ab omni temporálium rerum cura liberátos, férreos quodámmodo
    atque adamántinos fécerit, tum dénique eventúra illis advérsa prædicit.
    Multa enim ex hac prædicatióne futurárum rerum cómmoda consequebántur.
    Primum, ut ejus præsciéntiæ vim edíscerent. Deínde, ut nemo suspicarétur, ex
    Magístri infirmitáte tam grávia mala descéndere. Prætérea, ne, qui ea
    passúri erant, súbito ac inopináto rerum evéntu perturbaréntur. Dénique, ne,
    cum ista sub ipsum passiónis suæ tempus audírent, nímium commoveréntur.
lectio8:
  - "Jam vero, ut intélligant novum hoc esse belli genus et insólitum præliándi
    morem, cum illos nudos mítteret, una indútos túnica, sine cálceis, absque
    virga et absque zona et pera, et ab excipiéntibus ali jubéret; non fecit hic
    dicéndi finem, sed inexplicábilem virtútem suam próferens, Etiam sic eúntes,
    inquit, mansuetúdinem tamen óvium osténdite, quamvis ad lupos itúri, nec
    simplíciter ad lupos, sed étiam in médio lupórum: (neque vero óvium tantum
    mansuetúdinem habére jubet, sed étiam colúmbæ simplicitátem); sic enim
    virtútem meam máxime osténdam, cum ab óvibus lupi superabúntur; et quamvis
    illæ sint in médio lupórum, et innúmeris móribus laceréntur, non modo non
    consúmptæ fúerint, verum étiam illos in sui natúram transmutáverint."
lectio9:
  - Majus certe atque admirabílius est mentem adversariórum commutáre, et ánimum
    in divérsum transférre, quam illos occídere; præsértim cum duódecim tantum
    essent, et lupis plenus esset orbis univérsus. Erubescámus ígitur, qui,
    longe divérsa faciéntes, tamquam lupi in adversários rúimus. Nam, quámdiu
    oves fuérimus, víncimur; tunc enim a nobis pastóris auxílium recédit, qui
    non lupos, sed oves pascit.
  - "&teDeum"
