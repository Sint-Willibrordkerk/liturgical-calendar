commemoratio-2:
  - "!Commemoratio Octavæ Ss. Petri et Pauli"
  - Ant. Gloriósi príncipes terræ, quómodo in vita sua dilexérunt se, ita et in
    morte non sunt separáti.
  - _
  - V. In omnem terram exívit sonus eórum.
  - R. Et in fines orbis terræ verba eórum.
  - _
  - "!Oratio."
  - "Deus, qui hodiérnam diem Apostolórum tuórum Petri et Pauli martýrio
    consecrásti: da Ecclésiæ tuæ, eórum in ómnibus sequi præcéptum, per quos
    religiónis sumpsit exórdium."
  - $Per Dominum
