lectio4:
  - Sermo sancti Gregórii Papæ
  - "!Homil. 34 in Evang. ante medium"
  - "Novem Angelórum órdines dícimus, quia vidélicet esse, testánte sacro
    elóquio, scimus: Angelos, Archángelos, Virtútes, Potestátes, Principátus,
    Dominatiónes, Thronos, Chérubim atque Séraphim. Esse namque Angelos et
    Archángelos pene omnes sacri elóquii páginæ testántur. Chérubim vero atque
    Séraphim sæpe, ut notum est, libri prophetárum loquúntur. Quátuor quoque
    órdinum nómina Paulus Apóstolus ad Ephésios enúmerat, dicens: Supra omnem
    Principátum, et Potestátem, et Virtútem, et Dominatiónem. Qui rursus ad
    Colossénses scribens, ait: Sive Throni, sive Potestátes, sive Principátus,
    sive Dominatiónes. Dum ergo illis quátuor, quæ ad Ephésios dixit,
    conjungúntur Throni, quinque sunt órdines; quibus dum Angeli et Archángeli,
    Chérubim atque Séraphim adjúncta sunt, procul dúbio novem esse Angelórum
    órdines inveniúntur."
lectio5:
  - "Sciéndum vero quod Angelórum vocábulum nomen est offícii, non natúræ. Nam
    sancti illi cæléstis pátriæ Spíritus, semper quidem sunt Spíritus, sed
    semper vocári Angeli nequáquam possunt; quia tunc solum sunt Angeli, cum per
    eos áliqua nuntiántur. Unde et per Psalmístam dícitur: Qui facit Angelos
    suos spíritus; ac si paténter dicat: Qui eos, quos semper habet Spíritus,
    étiam, cum volúerit, Angelos facit. Hi autem qui mínima núntiant, Angeli;
    qui vero summa annúntiant, Archángeli vocántur. Hinc est enim quod ad Maríam
    Vírginem non quílibet Angelus, sed Gábriel Archángelus míttitur. Ad hoc
    quippe ministérium, summum Angelum veníre dignum fúerat, qui summum ómnium
    nuntiábat. Qui idcírco étiam privátis nomínibus censéntur, ut signétur per
    vocábula, étiam in operatióne quid váleant. Míchaël namque, Quis ut Deus?
    Gábriel autem, Fortitúdo Dei; Ráphaël vero dícitur Medicína Dei."
lectio6:
  - "Et quóties miræ virtútis áliquid ágitur, Míchaël mitti perhibétur; ut ex
    ipso actu et nómine detur intéllegi quia nullus potest fácere, quod fácere
    prǽvalet Deus. Unde et ille antíquus hostis, qui Deo esse per supérbiam
    símilis concupívit, dicens: In cælum conscéndam, super astra cæli exaltábo
    sólium meum, símilis ero Altíssimo; dum in fine mundi in sua virtúte
    relinquétur extrémo supplício periméndus, cum Michaéle Archángelo
    præliatúrus esse perhibétur, sicut per Joánnem dícitur: Factum est prǽlium
    cum Michaéle Archángelo. Ad Maríam quoque Gábriel míttitur, qui Dei
    Fortitúdo nominátur; illum quippe nuntiáre veniébat, qui ad debellándas
    aéreas potestátes húmilis apparére dignátus est. Ráphaël quoque
    interpretátur, ut díximus, Medicína Dei; quia vidélicet, dum Tobíæ óculos
    quasi per offícium curatiónis tétigit, cæcitátis ejus ténebras tersit."
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 18:1-10"
  - "In illo témpore: Accessérunt discípuli ad Jesum, dicéntes: Quis, putas,
    major est in regno cælórum? Et réliqua."
  - _
  - Homilía sancti Hierónymi Presbýteri
  - "!Lib. 3 Comm. in cap. 18 Matth."
  - Post invéntum statérem, post tribúta réddita, quid sibi vult Apostolórum
    repentína interrogátio, Quis, putas, major est in regno cælórum? Quia
    víderant pro Petro et Dómino idem tribútum rédditum, ex æqualitáte prétii
    arbitráti sunt Petrum ómnibus Apóstolis esse prælátum, qui in redditióne
    tribúti Dómino fúerat comparátus; ídeo intérrogant quis major sit in regno
    cælórum. Vidénsque Jesus cogitatiónes eórum, et causas erróris intéllegens,
    vult desidérium glóriæ, humilitátis contentióne, sanáre.
lectio8:
  - "Si autem manus tua vel pes tuus scandalízat te, abscínde eum et próice abs
    te. Necésse est quidem veníre scándala; væ tamen ei est hómini, qui, quod
    necésse est ut fiat in mundo, vítio suo facit ut per se fiat. Igitur omnis
    truncátur afféctus et univérsa propínquitas amputátur, ne per occasiónem
    pietátis unusquísque credéntium scándalis páteat. Si, inquit, ita est quis
    tibi conjúnctus, ut manus, pes, óculus; et est útilis atque sollícitus, et
    acútus ad perspiciéndum, scándalum autem tibi facit, et propter dissonántiam
    morum te pértrahit in gehénnam: mélius est ut et propinquitáte ejus et
    emoluméntis carnálibus cáreas, ne, dum vis lucri fácere cognátos et
    necessários, causam hábeas ruinárum."
lectio9:
  - "Dico vobis quia Angeli eórum in cælis semper vident fáciem Patris mei.
    Supra díxerat, per manum et pedem et óculum, omnes propinquitátes et
    necessitúdines, quæ scándalum fácere póterant, amputándas; austeritátem,
    ítaque senténtiæ subjécto præcépto témperat, dicens: Vidéte ne contemnátis
    unum ex pusíllis istis. Sic, inquit, præcípio severitátem, ut commiscéri
    cleméntiam dóceam. Quia Angeli eórum in cælis vident semper fáciem Patris.
    Magna dígnitas animárum, ut unaquǽque hábeat ab ortu nativitátis, in
    custódiam sui, Angelum delegátum. Unde légimus in Apocalýpsi Joánnis: Angelo
    Ephesi, et reliquárum ecclesiárum, scribe hæc. Apóstolus quoque prǽcipit
    velári cápita, in ecclésiis, feminárum propter Angelos."
  - "&teDeum"
rubrica-cisterciensis/ant-3:
  - Stetit Angelus * juxta aram templi, habens thuríbulum áureum in manu sua, et
    data sunt ei incénsa multa, et ascéndit fumus arómatum in conspéctu Dómini
    de manu Angeli.
