  - Concússum est mare, * et contrémuit terra, ubi Archángelus Míchaël
    descendébat de cælo.;;8
  - Laudémus Dóminum, * quem laudant Ángeli, quem Chérubim et Séraphim, Sanctus,
    Sanctus, Sanctus proclámant.;;10
  - Ascéndit * fumus arómatum in conspéctu Dómini de manu Ángeli.;;14
  - Míchaël Archángele, * veni in adjutórium pópulo Dei.;;18
  - Míchaël * præpósitus paradísi, quem honoríficant Angelórum cives.;;23
  - "Gloriósus * apparuísti in conspéctu Dómini: proptérea decórem índuit te
    Dóminus.;;33"
  - Ángelus Archángelus Míchaël, * Dei núntius pro animábus justis, allelúja,
    allelúja.;;95
  - Data sunt ei * incénsa multa, ut adoléret ea ante altáre áureum, quod est
    ante óculos Dómini.;;96
  - Multa magnália * de Michaéle Archángelo, qui, fortis in prǽlio, fecit
    victóriam.;;102
