rubrica-cisterciensis/ant-vespera:
  - "Dum præliarétur * Míchaël Archángelus cum dracóne, audíta est vox
    dicéntium: Salus Deo nostro, allelúia."
  - "Dum commítteret * bellum draco cum Michaéle Archángelo, audíta est vox
    míllia míllium dicéntium: Salus Deo nostro."
  - "Míchael, Gábriel, * Chérubim et Séraphim, qui non cessant clamáre quotídie,
    dicéntes: Dignus es, Dómine, accípere glóriam, allelúia"
  - Angeli Dómini, * Dóminum benedícite in ætérnum.
  - Angeli, Archángeli, * Throni et Dominatiónes, Principátus et Potestátes,
    Virtútes cælórum, laudáte Dóminum de cælis, allelúia.
