oratio:
  - "Deus, qui, ad christiánam páuperum eruditiónem et ad juvéntam in via
    veritátis firmándam, sanctum Joánnem Baptístam Confessórem excitásti, et
    novam per eum in Ecclésia famíliam collegísti: concéde propítius; ut ejus
    intercessióne et exémplo, stúdio glóriæ tuæ in animárum salúte fervéntes,
    ejus in cœlis corónæ partícipes fíeri valeámus."
  - $Per Dominum
