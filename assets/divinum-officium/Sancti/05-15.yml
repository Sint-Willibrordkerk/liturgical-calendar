evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum.
  - "!Matt 18:1-5"
  - "In illo témpore: Accessérunt discípuli ad Jesum, dicéntes: Quis, putas,
    major est in regno cœlórum? Et ádvocans Jesus párvulum, státuit eum in médio
    eórum et dixit: Amen, dico vobis, nisi convérsi fuéritis et efficiámini
    sicut párvuli, non intrábitis in regnum cœlórum. Quicumque ergo humiliáverit
    se sicut párvulus iste, hic est major in regno cœlórum. Et qui suscéperit
    unum párvulum talem in nómine meo, me súscipit."
