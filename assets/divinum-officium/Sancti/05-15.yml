lectio4:
  - "Joánnes Baptista de la Salle, Rhemis claro genere ortus, puer adhuc móribus
    et factis in sortem Dómini se vocándum et sanctimoniæ laude honestándum
    portendit. Adoléscens in Rheménsi academía litteras ac philosophicas
    disciplínas didicit: quo témpore, etsi ob animi virtútes et álacre ingenium
    ac suave ómnibus carus esset, ab æqualium tamen societáte abhorrebat, ut
    solitudini addictus facílius Deo vacaret. In clericalem milítiam jampridem
    cooptatus, sexto décimo ætátis anno inter Rhemenses canonicos adscriptus
    est, Lutétiam Parisiórum, theologíæ in Sorbónica universitáte datúrus
    operam, contendit, atque in Sulpitianum seminárium adscítus est. At brevi
    paréntibus orbatus, domum régredi coactus, fratres educándos suscépit; quod,
    scientiárum interim sacrárum stúdia non intermittens, optimo cum fructu
    præstitit, uti éxitus comprobávit."
lectio5:
  - Sacerdotio demum auctus, qua præstanti fide animique ardore primum ad aram
    fecit, eisdem toto vitæ témpore Sacris est operatus. Interea, salútis
    animárum studio incénsus, totum in earumdem utilitátem sese impendit.
    Sorórum a Jesu infante, puellis educandis institutárum, regimen suscépit;
    easque non modo prudentíssime est moderátus, sed ab excidio vindicávit. Hinc
    porro ánimum advértit ad púeros de plebe religióne bonisque móribus
    informándos. Atque in hoc quidem illum suscitaverat Deus, ut scilicet, nova
    in Ecclésia sua religiosórum hóminum família cóndita, puerórum, præsertim
    páuperum, scholis perenni efficacíque ratióne consuleret. Demandátum vero a
    Dei providéntia munus, per contradictiónes plurimas magnasque ærúmnas,
    feliciter implévit, fundáta fratrum sodalitate, quam a Scholis christiánis
    nuncupávit.
lectio6:
  - Adjunctos ígitur sibi hómines in gravi opere et arduo, apud se primum
    suscépit; tum aptiori in sede constitutos disciplína sua optime imbuit iis
    légibus sapientibúsque institutis, quæ póstea a Benedicto décimo tertio sunt
    confírmata. Ex demissióne animi ac paupertátis amóre primum canonicatu se
    abdicávit, omniáque sua bona in páuperes erogávit; quin étiam serius, quod
    frustra sæpius tentaverat, fundáti a se institúti regimen sponte depósuit.
    Nihil tamen interim de fratrum sollicitúdine remíttens deque scholis ab eo,
    plúribus jam locis, apertis, impensius Deo vacare cœpit. Assidue jejuniis,
    flagellis aliisque asperitátibus in se ipsum sæviens, noctes orando ducebat.
    Donec, virtútibus ómnibus conspicuus, præsertim obediéntia, studio divinæ
    voluntátis implendæ, amóre ac devotióne in apostolicam Sedem; meritis
    onustus, sacramentis rite susceptis, obdormívit in Dómino annos natus duo de
    septuagínta. Eum Leo décimus tertius, Pontifex maximus, Beatórum catálogo
    inseruit; novisque fulgentem signis, anno jubilæi millesimo nongentésimo,
    Sanctórum honóribus decorávit. Pius vero duodecimus ómnium magistrórum
    púeris adulescentibúsque instituéndis præcipuum apud Deum cælestem Patronum
    constítuit.
lectio94:
  - Joánnes Baptísta de la Salle, Rhemis claro génere ortus, adoléscens in
    Rheménsi academía lítteras ac philosophíam dídicit. Clericáli milítiæ
    adscríptus, sextodécimo ætátis anno inter canónicos Rheménses adscítus fuit,
    et póstea Parísiis in Sulpitiánum seminárium recéptus. Sacerdótio auctus,
    Sorórum a Jesu infánte, quæ puéllis educándis incúmbunt, régimen suscépit,
    quas prudentíssime moderátus est ac deféndit. Púeris de plebe religióne
    bonísque móribus informándis, post plúrimas contradictiónes, fundávit
    fratrum sodalitátem, quam a Scholis christiánis nuncupávit, a Benedícto
    décimo tértio deínde confirmátam. Abdicáto canonicátu, suísque bonis in
    páuperes erogátis, et fundáti a se institúti regímine ex humilitáte demísso,
    virtútibus et méritis onústus, obdormívit in Dómino, annos natus duo de
    septuagínta. Eum Leo Papa décimus tértius primo Beatórum catálogo inséruit,
    dein in album Sanctórum rétulit. Pius vero duodécimus ómnium magistrórum
    púeris adulescentibúsque instituéndis præcípuum apud Deum cæléstem Patrónum
    constítuit.
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 18:1-5"
  - "In illo témpore: Accessérunt discípuli ad Jesum, dicéntes: Quis, putas,
    major est in regno cælórum? Et réliqua."
  - _
  - Homilía sancti Joánnis Chrysostomi
  - "!In Cap. 18 Matth. Hom. 60"
  - Vidéte ne aliquem istórum contempséritis parvulórum, quia eórum Angeli
    Patris mei fáciem semper aspíciunt, et quia ego propter eos veni, et hæc
    Patris mei volúntas est. Ad tuéndos conservándosque pusillos diligentiores
    nos reddit. Pérspicis quam ingéntia in tutelam tenúium mœnia erexerit, et
    quantum studium curamque habeat, ne perdántur; tum quia supremas
    despiciéntibus eos pœnas státuit, tum quia summam pollicétur mercedem his
    qui curam eórum suscipiunt, idque tam suo quam Patris exemplo corróborat.
lectio8:
  - Dóminum ígitur étiam nos imitemur, et nihil pro frátribus omittamus, étiam
    eórum quæ humília viliáque nimium vidéntur. Sed, si administratióne nostra
    étiam opus fúerit, quamvis ténuis atque abjéctus quidem, cui administrándum
    sit, fúerit, quamvis ardua nobis res atque labóris plena esse videátur;
    ómnia hæc pro fratris salúte tolerabilióra facilióraque, oro, videántur.
    Tanto enim studio tantáque cura Deus dignam esse ánimam osténdit, ut neque
    Fílio suo pepercerit.
lectio9:
  - Si non est nobis satis ad salútem, quod virtuose ipse vivamus, sed oportet
    aliórum salútem re ipsa desiderare; cum neque nos recte vivámus neque alios
    hortemur, quid respondébimus? quæ nobis spes salútis réliqua erit? Quid
    majus quam ánimis moderari, quam adolescentulórum fingere mores? Omni certe
    pictore, omni certe statuario, ceterisque hujusmodi ómnibus excellentiórem
    hunc duco, qui juvenum animos fingere non ignoret.
  - "&teDeum"
