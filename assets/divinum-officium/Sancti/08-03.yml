lectio2:
  - "!Acts 7:55-58"
  - "55 Cum autem esset plenus Spíritu Sancto, inténdens in cælum, vidit glóriam
    Dei, et Jesum stantem a dextris Dei. Et ait: Ecce video cælos apertos, et
    Fílium hóminis stantem a dextris Dei."
  - 56 Exclamántes autem voce magna, continuérunt aures suas, et ímpetum
    fecérunt unanímiter in eum.
  - "57 Et ejiciéntes eum extra civitátem lapidábant: et testes deposuérunt
    vestiménta sua secus pedes adolescentis, qui vocabátur Saulus."
  - "58 Et lapidábant Stephanum, invocántem et dicéntem: Dómine Jesu, suscipe
    spíritum meum."
