lectio4:
  - Sanctórum córpora Stephani Protomártyris, Gamaliélis, Nicodémi et Abibónis,
    quæ diu in obscúro ac sórdido loco jacúerant, Honorio imperatóre, Luciáno
    presbytero divínitus admónito, invénta sunt prope Jerosolymam. Cui Gamaliel
    cum in somnis apparuísset, gravi quadam et præclára senis spécie, locum
    jacéntium córporum commonstrávit, imperans ut Joánnem Jerosolymitanum
    antístitem adíret, agerétque cum eo ut honestius illa córpora sepelirentur.
responsory4:
  - "@Sancti/12-26"
lectio5:
  - Quibus auditis Jerosolymórum antístes, finitimárum urbium epíscopis
    presbyterisque convocatis, ad locum pergit; defossos lóculos ínvenit, unde
    suavíssimus odor efflabátur. Cujus rei fama commóta, magna hóminum multitúdo
    eo convénit, multique ex variis morbis ægroti ac débiles sani et íntegri
    domum rediérunt. Sacrum autem sancti Stephani corpus, quod summa tunc
    celebritate in sanctam ecclésiam Sion illátum est, sub Theodosio junióre
    Constantinópolim, inde Romam, Pelagio primo summo Pontifice, translátum, in
    agro Verano in sepúlcro sancti Lauréntii Mártyris collocátum est.
responsory5:
  - "@Sancti/12-26"
lectio6:
  - Ex libro sancti Augustíni Epíscopi de Civitáte Dei
  - "!Liber 22, cap. 8, circa medium"
  - "Ad aquas Tibilitanas, episcopo afferénte Projecto relíquias Mártyris
    gloriosíssimi Stephani, ad ejus memóriam veniebat magnæ multitúdinis
    concursus et occúrsus. Ibi cæca mulier, ut ad episcopum portántem pígnora
    sacra ducerétur, orávit: flores, quos ferebat, dedit; recepit, óculis
    admóvit, prótinus vidit. Stupéntibus qui áderant, præibat exsultans, viam
    carpens et viæ ducem ulterius non requírens. Memoráti memóriam Mártyris, quæ
    pósita est in castello Synicénsi, quod Hipponénsi coloniæ vicinum est,
    ejusdem loci Lucillus epíscopus, pópulo præcedénte atque sequente, portábat;
    fístula, cujus molestia jamdiu laboraverat, et familiaríssimi sui médici,
    qui eam secaret, opperiebátur manus, illíus piæ sarcinæ vectatióne repénte
    sanáta est."
responsory6:
  - "@Sancti/12-26"
lectio94:
  - Sanctórum córpora Stéphani Protomártyris, Gamaliélis, Nicodémi et Abibónis,
    suavíssimum odórem manántia, a Joánne Jerosolymitárum antístite, invénta
    sunt prope Jerosólymam. Cujus rei fama commóta, magna hóminum multitúdo eo
    convénit, multíque ex váriis morbis ægróti ac débiles, sani et íntegri domum
    rediérunt. Sacrum autem sancti Stéphani corpus, quod summa tunc celebritáte
    in sanctam ecclésiam Sion illátum est, sub Theodósio junióre
    Constantinópolim, inde Romam, Pelágio primo summo Pontífice, translátum, in
    agro Veráno in sepúlcro sancti Lauréntii Mártyris collocátum est.
  - "&teDeum"
