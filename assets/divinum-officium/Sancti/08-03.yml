lectio3:
  - "!Acts 7:59; 8:1-2"
  - "59 Positis autem genibus, clamávit voce magna: Dómine, ne statuas illis hoc
    peccátum. Et cum hoc dixísset, obdormívit in Dómino. Saulus autem erat
    consentiens neci ejus."
  - 1 Facta est autem in illa die persecútio magna in ecclésia quæ erat
    Jerosolymis; et omnes dispersi sunt per regiónes Judææ et Samaríæ, præter
    Apóstolos.
  - 2 Curavérunt autem Stephanum viri timorati, et fecérunt planctum magnum
    super eum.
