  - De Actibus Apostolorum
  - "!Acts 7:51-54"
  - "51 Dura cervice et incircumcisis córdibus et áuribus, vos semper Spiritui
    Sancto resístitis: sicut patres vestri, ita et vos."
  - 52 Quem prophetárum non sunt persecúti patres vestri? Et occidérunt eos, qui
    prænuntiábunt de adventu Justi, cujus vos nunc proditores et homicidæ
    fuistis,
  - 53 qui accepístis legem in dispositióne Angelórum et non custodistis.
  - 54 Audiéntes autem hæc, disseccabántur córdibus suis, et stridébant déntibus
    in eum.
