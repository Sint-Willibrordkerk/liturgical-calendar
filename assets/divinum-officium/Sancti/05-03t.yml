lectio8:
  - "@Sancti/05-03::s/.*Respóndit/Respóndit/ s/$/~/"
  - "Cum ergo ex eo numero Nicodemus esset, venit ad Dominum: sed nocte venit;
    et hoc forte ad rem pertinet. Ad Dominum venit, et nocte venit: ad lucem
    venit, et in tenebris venit. Renati autem ex aqua et Spiritu, quid audiunt
    ab Apostolo? Fuistis aliquando tenebrae; nunc autem lux in Domino: sicut
    filii lucis ambulate."
ant-laudes:
  - Helena Constantini mater Jerusalem petiit, alleluja.
  - Tunc praecepit eos omnes igne cremari at illi timentes tradiderunt Judam,
    alleluja.
  - Mors et vita apposita sunt tibi si non ostendas mihi crucem Christi,
    alleluja.
  - Cumque ascendisset Judas de lacu perrexit ad locum ubi jacebat sancta crux,
    alleluja.
  - Orabat Judas deus deus meus ostende mihi lignum sanctae crucis, alleluja.
