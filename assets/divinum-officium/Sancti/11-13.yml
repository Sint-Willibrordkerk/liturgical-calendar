oratio:
  - "Omnípotens sempitérne Deus, qui dispositióne mirábili infírma mundi éligis,
    ut fórtia quæque confúndas: concéde propítius humilitáti nostræ; ut, piis
    beáti Dídaci Confessóris tui précibus, ad perénnem in cœlis glóriam
    sublimári mereámur."
  - $Per Dominum
lectio4:
  - Dídacus, Hispanus, ex oppido sancti Nicolai de Portu diœcesis Hispalénsis,
    ab ineunte ætate, pii sub sacerdotis disciplína, sanctioris vitæ, solitaria
    in ecclésia, tirocinium exercuit. Deínde, ut firmius Deo se conjungeret, in
    convéntu de Arizzáfa fratrum Minórum (quos Observántes vocant) sancti
    Francisci regulam in statu laicali proféssus est. Magna ibi alacritate
    húmilis obediéntiæ et regularis observantiæ jugum subiens, contemplatióni in
    primis déditus, mira Dei luce perfundebátur, adeo ut de rebus cæléstibus,
    litterárum expers, mirándum in modum et plane divinitus loquerétur.
lectio5:
  - Canariis in insulis, ubi frátribus sui ordinis præfuit, multa perpéssus,
    martyrii æstuans desidério, plures infidéles verbo et exemplo ad Christi
    fidem convértit. Romam veniens anno jubilæi, Nicolao quinto Pontifice,
    ægrotórum curæ in convéntu Aræ cæli destinátus, eo caritátis afféctu munus
    hoc exercuit, ut, Urbe annonæ inópia laborante, ægrotis tamen, quorum
    aliquándo úlcera étiam lambéndo abstergebat, nihil pénitus necessarii
    defécerit. Eximia quoque fides et grátia curatiónum in eo eluxit, cum
    lámpadis, quæ collucebat ante imáginem beatíssimæ Dei Genitrícis, quam summa
    devotióne colebat, oleo ægros inungens, signo crucis impresso, multórum
    morbos mirabíliter sanaverit.
lectio6:
  - "Demum, Complúti finem sibi vitæ adesse intélligens, lácera et obsoleta
    indútus túnica, conjectis in crucem óculis, singulari devotióne illis verbis
    ex sacro hymno pronuntiátis: Dulce lignum, dulces clavos, dulcia ferens
    póndera, quæ fuísti digna portare Regem cælórum et Dóminum, ánimam Deo
    réddidit pridie Idus Novembris, anno Dóminis supra millesimum
    quadringentésimo sexagesimo tertio. Ejus corpus, cum menses non paucos (ut
    pio confluéntium desidério fieret satis) insepúltum mansísset, quasi jam
    incorruptiónem indúerit, odórem suavíssimum efflávit. Illum, multis et
    illustribus miraculis clarum, Xystus quintus, Pontifex maximus, Sanctórum
    número adscripsit."
lectio94:
  - Dídacus, Hispánus, ex óppido sancti Nicolái de Portu diœcésis Hispalénsis,
    ab ineúnte ætáte, pii sub sacerdótis disciplína, sanctióris vitæ tirocínium
    exércuit. Deínde, ut fírmius Deo se conjúngeret, in convéntu de Arizzáfa
    sancti Francísci Assisiénsis régulam in statu laicáli proféssus est. Magna
    ibi alacritáte húmilis obediéntiæ et reguláris observántiæ jugo se
    subíciens, contemplatióni in primis déditus, mira Dei luce perfundebátur,
    ádeo ut de rebus cæléstibus, litterárum expers, mirándum in modum et plane
    divínitus loquerétur. Canáriis in ínsulis multa perpéssus, martýrii ǽstuans
    desidério, plures infidéles verbo et exémplo ad Christi fidem convértit.
    Romæ in convéntu Aræ cæli ægrotórum curæ destinátus, miro caritátis afféctu
    hoc munus exércuit. Grátia ínsuper curatiónum in eo elúxit. Demum Complúti
    piíssime ex hac vita migrávit, anno Dómini millésimo quadringentésimo
    sexagésimo tértio. Illum, multis miráculis clarum, Xystus quintus Sanctórum
    número adscrípsit.
  - "&teDeum"
