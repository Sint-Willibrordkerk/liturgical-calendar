evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 6:6-11"
  - "In illo témpore: Factum est et in álio sábbato, ut intráret Jesus in
    synagógam et docéret. Et erat ibi homo, et manus ejus déxtera erat árida.
    Observábant autem scribæ et pharisæi, si in sábbato curáret: ut invenírent,
    unde accusárent eum. Ipse vero sciébat cogitatiónes eórum. Et ait hómini,
    qui habébat manum áridam: Surge et sta in médium. Et surgens stetit. Ait
    autem ad illos Jesus: Intérrogo vos, si licet sábbatis benefácere, an male:
    ánimam salvam fácere, an pérdere? Et circumspéctis ómnibus dixit hómini:
    Exténde manum tuam. Et exténdit: et restitúta est manus ejus. Ipsi autem
    repléti sunt insipiéntia, et colloquebántur ad ínvicem, quidnam fácerent
    Jesu."
offertorium:
  - "!Job 14:7"
  - "Lignum habet spem: si præcísum fúerit, rursum viréscit, et rami ejus
    púllulant."
secreta:
  - "Ut, quæ tibi, Dómine, offérimus, dona tuo sint digna conspéctu: beáti
    Joánnis et Sanctórum, quos ejus ópera expósitos in templis cólimus, pia
    suffragátio conspíret."
  - $Per Dominum
communio:
  - "!Ps 36:17"
  - Bráchia peccatórum conteréntur, confírmat autem justos Dóminus.
postcommunio:
  - "Sumpta nos, quǽsumus, Dómine, dona cœléstibus armis tueántur: et beáti
    Joánnis patrocínia circúmdent Sanctórum unánimi suffrágio cumuláta; quorum
    imágines evícit in Ecclésia esse venerándas."
  - $Per Dominum
