oratio:
  - "Omnípotens sempitérne Deus, qui, ad cultum sacrárum imáginum asseréndum,
    beátum Joánnem cœlésti doctrína et admirábili spíritus fortitúdine imbuísti:
    concéde nobis ejus intercessióne et exémplo; ut, quorum cólimus imagines,
    virtútes imitémur et patrocínia sentiámus."
  - $Per Dominum
