oratio:
  - "Fámulis tuis, quǽsumus, Dómine, cœléstis grátiæ munus impertíre: ut, quibus
    beátæ Vírginis partus éxstitit salútis exórdium; Nativitátis ejus votíva
    sollémnitas pacis tríbuat increméntum."
  - $Per Dominum
lectio:
  - Léctio libri Sapiéntiæ
  - "!Prov 8:22-35"
  - "Dóminus possedit me in inítio viárum suárum, ántequam quidquam fáceret a
    princípio. Ab ætérno ordináta sum, et ex antíquis, ántequam terra fíeret.
    Nondum erant abýssi, et ego jam concépta eram: necdum fontes aquárum
    erúperant: necdum montes gravi mole constíterant: ante colles ego
    parturiébar: adhuc terram non fécerat et flúmina et cárdines orbis terræ.
    Quando præparábat cœlos, áderam: quando certa lege et gyro vallábat abýssos:
    quando æthera firmábat sursum et librábat fontes aquárum: quando circúmdabat
    mari términum suum et legem ponébat aquis, ne transírent fines suos: quando
    appendébat fundaménta terræ. Cum eo eram cuncta compónens: et delectábar per
    síngulos dies, ludens coram eo omni témpore: ludens in orbe terrárum: et
    delíciæ meæ esse cum filiis hóminum. Nunc ergo, filii, audíte me: Beáti, qui
    custódiunt vias meas. Audíte disciplínam, et estóte sapiéntes, et nolíte
    abjícere eam. Beátus homo, qui audit me et qui vígilat ad fores meas
    cotídie, et obsérvat ad postes óstii mei. Qui me invénerit, invéniet vitam
    et háuriet salútem a Dómino."
