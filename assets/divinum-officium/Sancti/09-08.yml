lectio4:
  - Sermo sancti Augustíni Epíscopi
  - "!Sermo 18 de Sanctis, qui est 2 de Annunt. Dominica"
  - "Adest nobis, dilectíssimi, optátus dies beátæ ac venerábilis semper
    Vírginis Maríæ; ídeo cum summa exsultatióne gáudeat terra nostra, tantæ
    Vírginis illustráta natáli. Hæc est enim flos campi, de qua ortum est
    pretiósum lílium convállium, per cujus partum mutátur natúra protoplastórum,
    delétur et culpa. Præcísum est in ea illud Hevæ infelicitátis elógium, quo
    dícitur: In dolóre páries fílios tuos; quia ista in lætítia Dóminum
    péperit."
responsory4:
  - R. Natívitas gloriósæ Vírginis Maríæ ex sémine Abrahæ, ortæ de tribu Juda,
    clara ex stirpe David;
  - "* Cujus vita ínclita cunctas illústrat ecclésias."
  - V. Hódie nata est beáta Virgo María ex progénie David.
  - R. Cujus vita ínclita cunctas illústrat ecclésias.
lectio5:
  - "Heva enim luxit, ista exsultávit: Heva lácrimas, María gáudium in ventre
    portávit; quia illa peccatórem, ista édidit innocéntem. Mater géneris nostri
    pœnam íntulit mundo, Génetrix Dómini nostri salútem íntulit mundo. Auctrix
    peccáti Heva, auctrix mériti María. Heva occidéndo óbfuit, María vivificándo
    prófuit. Illa percússit, ista sanávit. Pro inobediéntia enim obediéntia
    commutátur, fides pro perfídia compensátur."
responsory5:
  - R. Cum jucunditáte Nativitátem beátæ Maríæ celebrémus,
  - "* Ut ipsa pro nobis intercédat ad Dóminum Jesum Christum."
  - V. Corde et ánimo Christo canámus glóriam in hac sacra solemnitáte præcélsæ
    Genetrícis Dei Maríæ.
  - R. Ut ipsa pro nobis intercédat ad Dóminum Jesum Christum.
lectio6:
  - "Plaudat nunc órganis María, et inter velóces artículos týmpana puérperæ
    cóncrepent. Cóncinant lætántes chori, et alternántibus módulis dulcísona
    cármina misceántur. Audíte ígitur, quemádmodum tympanístria nostra
    cantáverit; ait enim: Magníficat ánima mea Dóminum: et exsultávit spíritus
    meus in Deo, salutári meo. Quia respéxit humilitátem ancíllæ suæ: ecce enim
    ex hoc beátam me dicent omnes generatiónes. Quia fecit mihi magna qui potens
    est. Causam ígitur invalescéntis erráti, miráculum novi partus evícit; et
    Hevæ planctum Maríæ cantus exclúsit."
responsory6:
  - R. Natívitas tua, Dei Génetrix Virgo, gáudium annuntiávit univérso mundo;
  - "* Ex te enim ortus est sol justítiæ, Christus Deus noster: * Qui, solvens
    maledictiónem, dedit benedictiónem; et confúndens mortem, donávit nobis
    vitam sempitérnam."
  - V. Benedícta tu in muliéribus, et benedíctus fructus ventris tui.
  - R. Ex te enim ortus est sol justítiæ, Christus Deus noster.
  - "&Gloria"
  - R. Qui, solvens maledictiónem, dedit benedictiónem; et confúndens mortem,
    donávit nobis vitam sempitérnam.
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 1:1-16"
  - Liber generatiónis Jesu Christi, fílii David, fílii Abraham. Abraham génuit
    Isaac, Isaac autem génuit Jacob. Et réliqua.
  - _
  - Homilía sancti Hierónymi Presbýteri
  - "!Liber 1 Comment. in Matth., in initium"
  - "In Isaía légimus: Generatiónem ejus quis enarrábit? Non ergo putémus
    Evangelístam Prophétæ esse contrárium, ut quod ille impossíbile dixit
    effátu, hic narráre incípiat: quia ibi de generatióne Divinitátis, hic de
    incarnatióne est dictum. A carnálibus autem cœpit, ut per hóminem, Deum
    díscere incipiámus. Fílii David, fílii Abraham. Ordo præpósterus, sed
    necessário commutátus. Si enim primum posuísset Abraham et póstea David,
    rursus ei repeténdus fúerat Abraham, ut generatiónis séries texerétur."
responsory7:
  - R. Beátam me dicent omnes generatiónes,
  - "* Quia fecit mihi Dóminus magna qui potens est, et sanctum nomen ejus."
  - V. Et misericórdia ejus a progénie in progénies timéntibus eum.
  - R. Quia fecit mihi Dóminus magna qui potens est, et sanctum nomen ejus.
lectio8:
  - "Ideo autem, céteris prætermíssis, horum fílium nuncupávit, quia ad hos
    tantum facta est de Christo repromíssio. Ad Abraham: In sémine, inquit, tuo
    benedicéntur omnes gentes, quod est Christus. Ad David: De fructu ventris
    tui ponam super sedem tuam. Judas autem génuit Phares et Zaram de Thamar.
    Notándum, in genealogía Salvatóris nullam sanctárum assúmi mulíerum, sed eas
    quas Scriptúra reprehéndit; ut, qui propter peccatóres vénerat, de
    peccatóribus nascens, ómnium peccáta deléret. Unde et in consequéntibus Ruth
    Moabítis pónitur, et Bethsabée uxor Uríæ."
responsory8:
  - "@Sancti/07-02:Responsory8:s/Visitatiónem/Nativitátem/"
lectio9:
  - Jacob autem génuit Joseph. Hunc locum objécit nobis Juliánus Augústus de
    dissonántia Evangelistárum, cur Evangelísta Matthǽus Joseph díxerit fílium
    Jacob et Lucas eum fílium appellárit Heli; non intéllegens consuetúdinem
    Scripturárum, quod alter secúndum natúram, alter secúndum legem ei pater
    sit. Scimus enim hoc per Móysen, Deo jubénte, præcéptum, ut, si frater aut
    propínquus absque líberis mórtuus fúerit, álius accípiat uxórem ad
    suscitándum semen fratris vel propínqui sui. Joseph virum Maríæ. Cum virum
    audíeris, suspício tibi non súbeat nuptiárum; sed recordáre consuetúdinis
    Scripturárum, quod sponsi viri, et sponsæ vocéntur uxóres.
  - "&teDeum"
