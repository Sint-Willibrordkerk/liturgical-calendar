evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joann 19:25-27."
  - "In illo témpore: Stabant juxta Crucem Jesu Mater ejus, et soror Matris
    ejus, María Cléophæ, et María Magdaléne. Cum vidísset ergo Jesus Matrem, et
    discípulum stantem, quem diligébat, dicit Matri suæ: Múlier, ecce fílius
