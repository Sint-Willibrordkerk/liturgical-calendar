lectio8:
  - "!Epist. 25 ad Ecclesiam Vercellensem, prope finem"
  - María Mater Dómini ante crucem Fílii stabat. Nullus me hoc dócuit, nisi
    sanctus Joánnes Evangelísta. Mundum álii concússum in passióne Dómini
    conscripsérunt, cælum ténebris obdúctum, refugísse solem, in paradísum
    latrónem, sed post piam confessiónem, recéptum. Joánnes dócuit, quod álii
    non docuérunt, quemádmodum in cruce pósitus Matrem appelláverit. Pluris
    putátur quod victor suppliciórum pietátis offícia Matri exhibébat, quam quod
    regnum cæléste donábat. Nam si religiósum est quod latróni donátur vénia,
    multo uberióris pietátis est quod a Fílio Mater tanto afféctu honorátur.
responsory8:
