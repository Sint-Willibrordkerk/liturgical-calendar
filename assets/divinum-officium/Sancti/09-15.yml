lectio:
  - Léctio libri Judith
  - "!Judith 13:22; 13:23-25"
  - "Benedíxit te Dóminus in virtúte sua, quia per te ad níhilum redégit
    inimícos nostros. Benedícta es tu, fília, a Dómino, Deo excélso, præ ómnibus
    muliéribus super terram. Benedíctus Dóminus, qui creávit cœlum et terram:
    quia hódie nomen tuum ita magnificávit, ut non recédat laus tua de ore
    hóminum, qui mémores fúerint virtútis Dómini in ætérnum, pro quibus non
    pepercísti ánimæ tuæ propter angústias et tribulatiónem géneris tui, sed
    subvenísti ruínæ ante conspéctum Dei nostri."
