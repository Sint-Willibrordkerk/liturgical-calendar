  - R. Ut perficiátur propitiátio et benedíctio.
  - "&Gloria"
  - R. Ut perficiátur propitiátio et benedíctio.
lectio9:
  - "Ecce, inquit, fílius tuus: ecce mater tua. Testabátur de cruce Christus, et
    inter matrem atque discípulum dividébat pietátis offícia. Condébat Dóminus
    non solum públicum, sed étiam domésticum testaméntum: et hoc ejus
    testaméntum signábat Joánnes, dignus tanto testatóre testis. Bonum
    testaméntum, non pecúniæ, sed vitæ ætérnæ; quod non atraménto scriptum est,
    sed Spíritu Dei vivi, qui ait: Lingua mea cálamus scribæ velóciter
    scribéntis."
  - "&teDeum"
