lectio2:
  - "!Lam. 2:13, 15-16"
  - "13 (Mem) Cui comparábo te? vel cui assimilábo te, fília Jerúsalem? cui
    exæquábo te, et consolábor te, virgo fília Sion? Magna est enim velut mare
    contrítio tua: quis medébitur tui?"
  - "15 (Samech) Plausérunt super te mánibus omnes transeúntes per viam:
    sibilavérunt, et movérunt caput suum super fíliam Jerúsalem: Hǽccine est
    urbs, dicéntes, perfécti decóris, gáudium univérsæ terræ?"
  - "16 (Phe) Aperuérunt super te os suum omnes inimíci tui, sibilavérunt et
    fremuérunt déntibus, et dixérunt: Devorábimus."
