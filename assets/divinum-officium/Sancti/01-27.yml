lectio4:
  - "Joánnes Antiochénus, propter áureum eloquéntiæ flumen cognoménto
    Chrysóstomus, a forensibus et sæcularibus stúdiis ad divinas litteras summa
    cum ingenii et industriæ laude se cóntulit. Itaque sacris initiátus ac
    presbyter Antiochenæ ecclésiæ factus, mortuo Nectario, Arcadii imperatóris
    opera, invitus Constantinopolitanæ ecclésiæ præfícitur. Quo suscepto
    pastorali munere, depravatos mores, et nobiliórum hóminum vivéndi licéntiam
    vehementius objurgare cœpit: qua ex libertáte magnam multórum subiit
    invidiam. Apud Eudoxiam etiam, quod eam propter Callítropæ víduæ pecúniam,
    et alterius víduæ agrum reprehendísset, gráviter offendit."
lectio5:
  - "Quare aliquot episcopórum acto Chalcédone convéntu, quo ipse vocátus ire
    nóluit, quod nec legítimum concílium nec publicum esse diceret, niténte in
    primis ipsa contra Chrysóstomum Eudoxia, ejícitur in exsílium: sed paulo
    post propter ejus desidérium seditióne pópuli facta, admirábili civitátis
    plausu ab exsílio revocátur. Verum cum pérditos mores increpare non
    desísteret, et ad argenteam Eudoxiæ státuam in foro sanctæ Sophíæ ludos
    fíeri prohibéret; conspiratióne inimicórum episcopórum íterum exsulare
    cógitur, viduis et egéntibus ómnibus communis parentis ejectiónem
    lugéntibus. In exsílio Chrysóstomus incredibile est et quanta mala perpéssus
    sit, et quam multos ad Jesu Christi fidem convérterit."
lectio6:
  - "Verum dum, concílio Romæ hábito, decreto Innocentii primi Pontificis
    restitúitur, a milítibus, qui eum custodiébant, miris in itinere malis et
    calamitátibus affícitur. Cumque per Armeniam ducerétur, sanctus Basiliscus
    Martyr, in cujus templo antea oraverat, noctu sic eum affátus est: Joánnes
    frater, crástinus dies nos loco conjunget. Quare postridie sumpto
    Eucharistiæ sacraménto seque crucis signo muniens, ánimam Deo réddidit,
    décimo octavo Kalendas Octobris. Quo mortuo, horribilis grando
    Constantinópoli cécidit, et quatríduo Augusta cessit e vita. Ejus corpus
    insígni pompa et hóminum multitúdine celebrátum, Theodosius Arcadii fílius
    Constantinópolim portándum, et honorifice sepeliéndum curávit sexto Kalendas
    Februarii: cujus étiam relíquias veneratus, paréntum suórum véniam pétiit:
    quod deínde Romam translátum in basilica Vaticana cónditum est.
    Multitúdinem, pietátem, ac splendórem conciónum ceterorúmque ejus
    scriptórum, interpretándi étiam ratiónem, et inhærentem senténtiæ sacrórum
    librórum explanatiónem omnes admirántur; dignumque existimant, cui Paulus
    Apóstolus, quem ille mirifice coluit, scribénti et prædicanti multa dictasse
    videátur. Hunc vero præclaríssimum univérsæ Ecclésiæ Doctórem Pius décimus
    Pontifex maximus cælestem oratórum sacrórum patronum declarávit atque
    constítuit."
lectio94:
  - Joánnes Antiochénus, propter áureum eloquéntiæ flumen cognoménto
    Chrysóstomus, présbyter Antiochénæ ecclésiæ factus, mórtuo Nectário, Arcádii
    imperatóris ópera, invítus Constantinopolitánæ ecclésiæ præfícitur. Quo in
    múnere, cum depravátos mores et nobílium hóminum vivéndi licéntiam
    veheméntius objurgáret, magnam multórum súbiit invídiam. Apud Eudóxiam
    étiam, quod eam propter Callítropæ víduæ pecúniam, et altérius víduæ agrum
    reprehendísset, gráviter offéndit. Quare exsuláre cógitur, víduis et
    egéntibus ómnibus commúnis paréntis ejectiónem lugéntibus. Incredíbile dictu
    est, quanta mala in exsílio perpéssus sit, et quam multos ad Jesu Christi
    fidem convérterit. Multitúdinem, pietátem ac splendórem conciónum
    ceterorúmque ejus scriptórum, omnes admirántur. Animam Deo réddidit décimo
    octávo kaléndas octóbris, ejúsque corpus in basílica Vaticána cónditum est.
    Hunc præclárum totíus Ecclésiæ Doctórem Pius Papa décimus cæléstem
    prædicatórum patrónum constítuit.
  - "&teDeum"
