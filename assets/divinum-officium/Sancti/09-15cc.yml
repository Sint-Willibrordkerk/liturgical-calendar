  - Commemoratio
  - "1"
  - "@C2a"
lectio93:
  - Nicomedes presbyter, persequénte Christiános Domitiáno imperatóre, quod
    corpus Felículæ Vírginis, propter confessiónem christianæ fidei a Flacco
    cómite interfectæ, sepelísset, comprehéndi jussus est; ductúsque ad statuas
    deórum, cum eis sacrificáre velle (quod fácere jubebátur) constanter
    negavísset, proptérea quod sacrifícium uni Deo vero, qui regnat in cælis,
    deberétur, plumbátis cæsus, in eo martyrio ánimam Deo réddidit. Cujus corpus
    cum idem comes in profluentem Tiberim projíci imperásset, Justus, Nicomedis
    clericus diligénter conquisítum, ad muros Urbis via Nomentana honorífice in
    sepúlcro cóndidit.
