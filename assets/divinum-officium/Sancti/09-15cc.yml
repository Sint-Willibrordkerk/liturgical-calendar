officium:
  - S. Nicomedis Martyris
rank:
  - ""
  - Simplex
  - "1.1"
  - "@C2a"
rule:
  - vide C2a;
oratio:
  - "Adésto, Dómine, pópulo tuo: ut, beáti Nicomédis Mártyris tui mérita
    præclára suscípiens, ad impetrándam misericórdiam tuam semper ejus
    patrocíniis adjuvétur."
  - $Per Dominum
secreta:
  - "Súscipe, Dómine, múnera propítius obláta: quæ majestáti tuæ beáti Nicomédis
    Mártyris comméndet orátio."
  - $Per Dominum
postcommunio:
  - "Puríficent nos, Dómine, sacraménta quæ súmpsimus: et, intercedénte beáto
    Nicoméde Mártyre tuo, a cunctis effíciant vitiis absolútos."
  - $Per Dominum
rubrica-cisterciensis/rank:
