officium:
  - S. Joseph Sponsi B.M.V. Confessoris
rank:
  - ""
  - Duplex
  - "3"
  - "@C5"
rule:
  - ex C5;
  - Psalmi Dominica
  - Antiphonas horas
  - 9 lectiones;
  - Psalm5 Vespera=116
  - Gloria
  - Prefatio=Joseph=Festivitate
introitus:
  - "@Commune/C5-1"
oratio:
  - "Sanctíssimæ Genetrícis tuæ Sponsi, quǽsumus, Dómine, méritis adjuvémur: ut,
    quod possibílitas nostra non óbtinet, ejus nobis intercessióne donétur:"
  - $Qui vivis
lectio:
  - "@Commune/C5b"
graduale:
  - "!Ps 20:4-5."
  - "Dómine, prævenísti eum in benedictiónibus dulcédinis: posuísti in cápite
    ejus corónam de lápide pretióso."
  - V. Vitam pétiit a te, et tribuísti ei longitúdinem diérum in sǽculum sǽculi.
  - "!Ps 111:1-3."
  - "Beátus vir, qui timet Dóminum: in mandátis ejus cupit nimis."
  - "V. Potens in terra erit semen ejus: generátio rectórum benedicétur."
  - "V. Glória et divítiæ in domo ejus: et justítia ejus manet in sǽculum
    sǽculi."
gradualep:
  - Allelúja, allelúja
  - "!Ps 45:9."
  - "Amávit eum Dóminus, et ornávit eum: stolam glóriæ índuit eum. Allelúja."
  - "!Osee 14. 6"
  - "Justus germinábit sicut lílium: et florébit in ætérnum ante Dóminum.
    Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum.
  - "!Matt 1:18-21."
  - "Cum esset desponsáta Mater Jesu María Joseph, ántequam convenírent, invénta
    est in útero habens de Spíritu Sancto. Joseph autem, vir ejus, cum esset
    justus et nollet eam tradúcere, vóluit occúlte dimíttere eam. Hæc autem eo
    cogitánte, ecce, Angelus Dómini appáruit in somnis ei, dicens: Joseph, fili
    David, noli timére accípere Maríam cónjugem tuam: quod enim in ea natum est,
    de Spíritu Sancto est. Páriet autem fílium, et vocábis nomen ejus Jesum:
    ipse enim salvum fáciet pópulum suum a peccátis eórum."
offertorium:
  - "@Commune/C2"
secreta:
  - "Débitum tibi, Dómine, nostræ réddimus servitútis, supplíciter exorántes:
    ut, suffrágiis beáti Joseph, Sponsi Genetrícis Fílii tui Jesu Christi,
    Dómini nostri, in nobis tua múnera tueáris, ob cujus venerándam festivitátem
    laudis tibi hóstias immolámus."
  - $Per eundem
communio:
  - "!Matt 1:20."
  - "Joseph, fili David, noli timére accípere Maríam cónjugem tuam: quod enim in
    ea natum est, de Spíritu Sancto est. (Allelúja.)"
postcommunio:
  - "Adésto nobis, quǽsumus, miséricors Deus: et, intercedénte pro nobis beáto
    Joseph Confessóre, tua circa nos propitiátus dona custódi."
  - $Per Dominum
lectio4:
  - "@Sancti/03-19::s/$/~/"
  - "@Sancti/03-19:Lectio5:s/ Illi.*//"
lectio5:
  - "@Sancti/03-19::s/.*Illi/Illi/s s/$/~/"
  - "@Sancti/03-19:Lectio6:s/$/~/"
  - "Huc accedit quod dicitur fuísse de domo David. Vere enim de domo David,
    vere de regia stirpe descenditur iste vir Joseph nobili genere, mente
    nobilior: plane filius David non degerans a patre suo David."
lectio6:
  - "Prorsus, inquam, filius David non tantum carne, sed fide, sed sanctitate,
    sed devotione: quem tamquam alterum David Dominus inuenit secundum cor suum,
    cui tuto committere secretissimum atque sacratissimum sui cordis arcanum:
    cui tamquam alteri David incerta & occulta sapientiæ suæ manifestavit; et
    dedit illi non ignarum esse mysterii, quod nemo principum hujus sæculi
    agnovit: cui denique datum est, quod multi reges et prophetæ, cum vellent
    videre, non viderunt; audire & non audierunt; non solum videre et audire,
    sed étiam portare, deducere, amplecti, deosculari, & nutrire & custodire."
lectio7:
  - "@Sancti/12-24o:Lectio1"
lectio8:
  - "@Sancti/12-24o:Lectio2"
lectio9:
  - "@Sancti/12-24o:Lectio3"
