officium:
  - Ss. Felicis, Simplicii, Faustini et Beatricis Martyrum
rank:
  - ""
  - Simplex
  - "1.1"
  - "@C3a"
rule:
  - vide C3a;
  - Gloria
oratio:
  - "Præsta, quǽsumus, Dómine: ut, sicut pópulus christiánus Mártyrum tuórum
    Felícis, Simplícii, Faustíni et Beatrícis temporáli sollemnitáte congáudet,
    ita perfruátur ætérna; et, quod votis célebrat, comprehéndat efféctu."
  - $Per Dominum
secreta:
  - "Hóstias tibi, Dómine, pro sanctórum Mártyrum tuórum Felícis, Simplícii,
    Faustíni et Beatrícis commemoratióne deférimus: supplíciter deprecántes; ut
    indulgéntiam nobis páriter cónferant et salútem."
  - $Per Dominum
postcommunio:
  - "Præsta, quǽsumus, omnípotens Deus: ut sanctórum Martyrum tuórum Felícis,
    Simplícii, Faustíni et Beatrícis cœléstibus mýsteriis celebráta sollémnitas,
    indulgéntiam nobis tuæ propitiatiónis acquírat."
  - $Per Dominum
