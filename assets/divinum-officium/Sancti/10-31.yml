introitus:
  - "!Sap 3:8"
  - "v. Júdicant Sancti gentes et dominántur pópulis: et regnábit Dóminus, Deus
    illórum, in perpétuum."
  - "!Ps 32:1"
  - "Exsultáte, justi, in Dómino: rectos decet collaudátio."
  - "&Gloria"
  - "v. Júdicant Sancti gentes et dominántur pópulis: et regnábit Dóminus, Deus
    illórum, in perpétuum."
oratio:
  - "Dómine, Deus noster, multiplica super nos grátiam tuam: et, quorum
    prævenimus gloriósa sollémnia, tríbue subsequi in sancta professione
    lætítiam."
  - $Per Dominum
lectio:
  - Léctio libri Apocalýpsis beáti Joánnis Apóstoli
  - "!Apoc 5:6-12"
  - "In diébus illis: Ecce, ego Joánnes vidi in médio throni et quatuor
    animálium et in médio seniórum Agnum stantem tamquam occísum, habéntem
    córnua septem et óculos septem: qui sunt septem spíritus Dei, missi in omnem
    terram. Et venit: et accépit de déxtera sedéntis in throno librum. Et cum
    aperuísset librum, quatuor animália et vigínti quatuor senióres ceciderunt
    coram Agno, habéntes singuli cítharas, et phiálas áureas plenas
    odoramentórum, quæ sunt oratiónes sanctórum: et cantábant cánticum novum,
    dicéntes: Dignus es, Dómine, accípere librum et aperíre signácula ejus:
    quóniam occisus es, et redemísti nos Deo in sánguine tuo ex omni tribu et
    lingua et pópulo et natióne: et fecísti nos Deo nostro regnum et sacerdótes:
    et regnábimus super terram. Et vidi, et audívi vocem Angelórum multórum in
    circúitu throni et animálium et seniórum: et erat númerus eórum mília
    mílium, dicéntium voce magna: Dignus est Agnus, qui occísus est, accípere
    virtútem et divinitátem et sapiéntiam et fortitúdinem et honórem et glóriam
    et benedictiónem in sǽcula sæculórum. Amen."
graduale:
  - "!Ps 149:5; 149:1"
  - "Exsultábunt Sancti in glória: lætabúntur in cubílibus suis."
  - "V. Cantáte Dómino cánticum novum: laus ejus in ecclésia sanctórum."
evangelium:
  - "@Commune/C3a"
offertorium:
  - "@Commune/C3a"
secreta:
  - "Altáre tuum, Dómine, munéribus cumulámus oblátis: da, quǽsumus; ut ad
    salútem nostram, ómnium Sanctórum tuórum precatióne, profíciant, quorum
    sollémnia ventúra præcúrrimus."
  - $Per Dominum
communio:
  - "@Sancti/06-02"
postcommunio:
  - "Sacraméntis, Dómine, et gáudiis optátæ celebritátis explétis: quǽsumus; ut
    eórum précibus adjuvémur, quorum recordatiónibus exhibéntur."
  - $Per Dominum
