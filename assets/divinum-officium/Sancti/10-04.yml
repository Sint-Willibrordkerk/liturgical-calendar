oratio:
  - "Deus, qui Ecclésiam tuam, beáti Francisci méritis fœtu novæ prolis
    amplíficas: tríbue nobis; ex ejus imitatióne, terréna despícere et cœléstium
    donórum semper participatióne gaudére."
  - $Per Dominum
