gradualep:
  - Allelúja, allelúja.
  - V. Francíscus pauper et húmilis cœlum dives ingréditur, hymnis cœléstibus
    honorátur.
  - "!Ps 111:1"
  - "Beátus vir, qui timet Dóminum: in mandátis ejus cupit nimis. Allelúja."
tractus:
  - "!Ps 111:1-3"
  - "Beátus vir, qui timet Dóminum: in mandátis ejus cupit nimis."
  - "V. Potens in terra erit semen ejus: generátio rectórum benedicétur."
  - "V. Glória et divítiæ in domo ejus: et justítia ejus manet in sǽculum
    sǽculi."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 11:25-30"
  - "In illo témpore: Respóndens Jesus, dixit: Confíteor tibi, Pater, Dómine
    cœli et terræ, quia abscondísti hæc a sapiéntibus et prudéntibus, et
    revelásti ea párvulis. Ita, Pater: quóniam sic fuit plácitum ante te. Omnia
    mihi trádita sunt a Patre meo. Et nemo novit Fílium nisi Pater: neque Patrem
    quis novit nisi Fílius, et cui volúerit Fílius reveláre. Veníte ad me,
    omnes, qui laborátis et oneráti estis, et ego refíciam vos. Tóllite jugum
    meum super vos, et díscite a me, quia mitis sum et húmilis corde: et
    inveniétis réquiem animábus vestris. Jugum enim meum suave est et onus meum
    leve."
