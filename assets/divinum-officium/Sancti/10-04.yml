lectio4:
  - "Francíscus, Assísii in Umbria natus, patris exémplum secútus, a prima ætáte
    mercatúram fecit. Qui, quodam die, páuperem, pro Christi amóre flagitántem
    pecúniam, cum præter consuetúdinem repulísset, repénte eo facto commótus,
    large ei misericórdiam impertívit; et ex eo die Deo promísit se némini
    umquam poscénti eleemósynam negatúrum. Cum vero post in gravem morbum
    incidísset, ex eo aliquándo confirmátus, cœpit ardéntius cólere offícia
    caritátis; qua in exercitatióne tantum profécit, ut, evangélicæ perfectiónis
    cúpidus, quidquid habéret, paupéribus largirétur. Quod ferens iníquius
    pater, eum ad Assisinátem epíscopum duxit, ut coram illo bonis céderet
    patérnis; qui, rejéctis étiam véstibus, patri concéssit ómnia, illud
    subjúngens, sibi in pósterum majórem facultátem fore dicéndi: Pater noster,
    qui es in cælis."
lectio5:
  - "Cum autem illud ex Evangélio audísset: Nolíte possidére aurum, neque
    argéntum, neque pecúniam in zonis vestris, non peram in via, neque duas
    túnicas, neque calceaménta; sibi eam régulam servándam propósuit. Itaque,
    detráctis cálceis et una conténtus túnica, cum duódecim sócios adhibuísset,
    órdinem Minórum instítuit. Quare Romam venit anno salútis millésimo
    ducentésimo nono, ut sui órdinis régula ab apostolica Sede confirmarétur.
    Quem cum accedéntem ad se summus Póntifex Innocéntius tértius rejecísset;
    quod in somnis póstea sibi ille, quem repúlerat, collabéntem Lateranénsem
    basílicam suis húmeris sustinére visus esset, conquisítum accérsi jussit,
    benignéque accípiens, omnem ejus institutórum ratiónem confirmávit.
    Francíscus ígitur, dimíssis in omnes orbis terræ partes frátribus ad
    prædicándum Christi Evangélium, ipse cúpiens sibi áliquam dari martyrii
    occasiónem, navigávit in Syriam; ubi, a rege soldáno liberalíssime
    tractátus, cum nihil profíceret, rédiit in Itáliam."
lectio6:
  - Multis ígitur exstrúctis suæ famíliæ domicíliis, se in solitúdinem montis
    Alvérni cóntulit; ubi quadragínta diérum, propter honórem sancti Michaélis
    Archángeli, jejúnio inchoáto, festo die Exaltatiónis sanctæ Crucis, ei
    Séraphim crucifíxi effígiem inter alas cóntinens appáruit; qui ejus et
    mánibus, et pédibus, et láteri vestígia clavórum impréssit. Quæ sanctus
    Bonaventúra, cum Alexándri quarti summi Pontíficis prædicatióni interésset,
    narrásse Pontíficem a se visa esse, lítteris commendávit. His insígnibus
    summi in eum Christi amóris, máximam habébat ómnium admiratiónem. Ac biénnio
    post, gráviter ægrótans, deférri vóluit in ecclésiam sanctæ Maríæ Angelórum;
    ut, ubi grátiæ spíritum a Deo accéperat, ibi spíritum vitæ rédderet. Eo in
    loco fratres ad paupertátem ac patiéntiam, et sanctæ Románæ Ecclésiæ fidem
    servándam cohortátus, Psalmum illum pronúntians, Voce mea ad Dóminum
    clamávi; in eo versículo, Me exspéctant justi, donec retríbuas mihi,
    efflávit ánimam quarto Nonas Octóbris. Quem, miráculis clarum, Gregórius
    nonus Póntifex máximus in Sanctórum númerum adscrípsit.
lectio94:
  - "Francíscus, Assísii in Umbria natus, patris exémplum secútus, a prima ætáte
    mercatúram fecit. Gravi morbo corréptus, cum convaluísset, cœpit ardéntius
    cólere caritátis offícia, et patri id indígne ferénti, bona ómnia cessit,
    subjúngens sibi in pósterum majórem facultátem fore dicéndi: Pater noster,
    qui es in cælis. Cum autem ex Evangélio apostólicæ paupertátis mónita
    audísset, detráctis cálceis et una conténtus túnica, cum duódecim sócios
    adhibuísset, órdinem Minórum instítuit; quem, a summo Pontífice Innocéntio
    tértio, cǽlitus admónito, confirmátum, mirífice propagávit. Mox in
    solitúdinem montis Alvérni se cóntulit, ibíque, die Exaltatiónis sanctæ
    Crucis a Séraphim crucifíxi effígiem inter alas præ se ferénte, sacra
    accépit stígmata; in ejus mánibus, pédibus et látere clavórum et lánceæ
    vestígiis apparéntibus. Biénnio post gráviter ægrótans, in ecclésia sanctæ
    Maríæ Angelórum, ubi grátiæ spíritum a Deo accéperat, fratres ad
    paupertátem, patiéntiam et sanctæ Románæ Ecclésiæ fidem servándam hortátus,
    piíssime ánimam efflávit quarto nonas octóbris."
  - "&teDeum"
