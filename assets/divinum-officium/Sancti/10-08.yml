lectio4:
  - Birgitta, in Suecia illustribus et piis paréntibus orta, sanctíssime vixit.
    Cum adhuc in útero gestarétur, a naufragio propter eam mater erepta est.
    Decennis, post audítum de passióne Dómini sermónem, sequénti nocte Jesum in
    cruce, recénti sánguine perfusum, vidit, et de eadem passióne secum
    loquentem. Quo ex témpore in ejusdem meditatióne ita afficiebátur, ut de ea
    sine lácrimis cogitare deinceps numquam posset.
lectio5:
  - Ulfoni, Nericiæ principi, in matrimónium tradita, virum ipsum ad pietátis
    officia, tum optimis exemplis, tum efficacibus verbis, adhortáta est. In
    filiórum educatióne piíssima; paupéribus, et maxime infirmis, domo ad id
    muneris dicata, inserviébat quam diligentíssime, illórum pedes sólita lavare
    et osculari. Cum autem una cum viro suo rediret Compostella, ubi sancti
    Jacobi Apóstoli sepúlcrum visitaverant, et Atrébati Ulfo gráviter ægrotaret,
    sanctus Dionysius Birgittæ noctu appáruit, et de mariti salúte aliisque de
    rebus, quæ futuræ erant, præmonuit.
lectio6:
  - Viro Cisterciénsi monacho facto et paulo post defuncto, Birgitta, audíta
    Christi voce in somnis, arctiórem vitæ formam est aggressa. Cui deínde
    arcana multa fuérunt divínitus revelata. Monastérium Vastanense sub regula
    sancti Salvatoris, ab ipso Dómino accepta, instituit. Romam Dei jussu venit,
    ubi plurimos ad amórem divinum veheménter accendit. Inde Jerosolymam pétiit,
    et íterum Romam. Qua ex peregrinatióne cum in febrim incidísset, gravibus
    per annum integrum afflictáta morbis, cumuláta meritis, prænuntiáto mortis
    die, migrávit in cælum. Corpus ejus ad Vastanense monastérium translátum
    est; et miraculis illustrem Bonifatius nonus in Sanctórum númerum retulit.
lectio94:
  - Birgítta, in Suécia illústribus et piis paréntibus orta, sanctíssime vixit.
    In passiónis Domínicæ meditatióne ita afficiebátur, ut de ea sine lácrimis
    cogitáre non posset. Ulfóni, Neríciæ príncipi, in matrimónium trádita, virum
    ipsum ad pietátis offícia, tum óptimis exémplis, tum efficácibus verbis
    adhortáta est. In filiórum educatióne piíssima, paupéribus et infírmis
    inserviébat. Viro Cisterciénsi mónacho facto et paulo post defúncto,
    Birgítta arctiórem vitæ formam est aggréssa. Cui deínde arcána multa fuérunt
    divínitus reveláta. Monastérium Vastanénse sub régula sancti Salvatóris
    instítuit; Jerosólymam, devotiónis causa, pétiit. Tandem Romæ, grávibus per
    annum íntegrum afflictáta morbis, migrávit in cælum. Ipsam, miráculis
    illústrem, Bonifátius nonus in Sanctórum númerum rétulit.
  - "&teDeum"
