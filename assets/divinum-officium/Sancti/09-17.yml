lectio1:
  - De Epistola beáti Pauli Apóstoli ad Gálatas
  - "!Gal 5:25-26; 6:1-6"
  - 25 Si Spíritu vívimus, spíritu et ambulemus.
  - 26 Non efficiámur inánis glóriæ cúpidi, invicem provocántes, invicem
    invidéntes.
  - 1 Fratres, etsi præoccupátus fúerit homo in aliquo delícto, vos, qui
    spirituales estis, hujusmodi instrúite in spíritu lenitátis consíderans te
    ipsum, ne et tu tenteris.
  - 2 Alter alterius onera portate, et sic adimplébitis legem Christi.
  - 3 Nam, si quis existimat se aliquid esse, cum nihil sit, ipse se sedúcit.
  - 4 Opus autem suum probet unusquísque, et sic in semetípso tantum glóriam
    habébit et non in altero.
  - 5 Unusquisque enim onus suum portabit.
  - 6 Communicet autem is qui catechizátur verbo, ei qui se catechízat in
    ómnibus bonis.
lectio2:
  - "!Gal 6:7-13"
  - "7 Nolíte errare: Deus non irridétur."
  - 8 Quæ enim seminaverit homo hæc et metet. Quóniam qui seminat in carne sua,
    de carne et metet corruptiónem; qui autem seminat in spiritu, de spíritu
    metet vitam ætérnam.
  - 9 Bonum autem faciéntes non deficiámus; témpore enim suo metémus non
    deficiéntes.
  - 10 Ergo, dum tempus habemus, operemur bonum ad omnes, maxime autem ad
    domesticos fidei.
  - 11 Vidéte quálibus litteris scripsi vobis mea manu.
  - 12 Quicúmque enim volunt placére in carne, hi cogunt vos circumcidi, tantum
    ut crucis Christi persecutiónem non patiántur.
  - 13 Neque enim qui circumcidúntur, legem custódiunt; sed volunt vos
    circumcidi, ut in carne vestra glorientur.
lectio3:
  - "!Gal 6:14-18"
  - 14 Mihi autem absit gloriari, nisi in cruce Dómini nostri Jesu Christi; per
    quem mihi mundus crucifixus est, et ego mundo.
  - 15 In Christo enim Jesu neque circumcisio aliquid valet neque præputium, sed
    nova creatura.
  - 16 Et quicúmque hanc regulam secúti fúerint, pax super illos et misercordia
    et super Israël Dei.
  - 17 De cetero nemo mihi molestus sit; ego enim Stígmata Dómini Jesu in
    corpore meo porto.
  - 18 Gratia Dómini nostri Jesu Christi cum spíritu vestro, fratres. Amen.
lectio4:
  - Ex Commentariis sancti Bonaventuræ Episcopi
  - "!Legenda S. Francisci cap. 13"
  - Fidelis revera famulus et minister Christi, Franciscus, biennio antequam
    spíritum redderet cælo, cum in loco excélso seorsum, qui mons Alverniæ
    dícitur, quadragenárium ad honórem Archangeli Michaélis jejunium inchoasset,
    supernæ contemplatiónis dulcédine abundantius sólito superfusus ac cæléstium
    desideriórum ardentiori flamma succénsus, supernárum cœpit immissiónum
    cumulatius dona sentire. Dum ígitur seráphicis desideriórum ardóribus sursum
    agerétur in Deum, et afféctus compassiva teneritúdine in eum
    transformarétur, cui ex caritate nimia crucifigi complácuit; quodam mane
    circa festum Exaltatiónis sanctæ Crucis, in látere montis orans, vidit quasi
    spéciem uníus Séraphim, sex alas tam fúlgidas quam ignítas habentem, de
    cælórum sublimitate descendere. Qui, volatu celerrimo ad áëris locum viro
    Dei propinquum perveniens, non solum alatus, sed et crucifixus appáruit;
    manus quidem et pedes habens extensos et cruci affixos, alas vero sic miro
    modo hinc inde dispositas, ut duas supra caput erigeret, duas ad volándum
    extenderet, duabus vero réliquis totum corpus circumplecténdo velaret. Hoc
    videns veheménter obstupuit, mixtumque dolori gáudium mens ejus incurrit,
    dum et in gratióso ejus aspectu, sibi tam mirabíliter quam familiáriter
    apparentis, excessivam quamdam concipiebat lætítiam, et dira conspecta
    crucis affixio ipsíus ánimam compassívi dolóris gládio pertransívit.
lectio5:
  - Intelléxit quidem, illo docénte interius qui et apparebat exterius, quod,
    licet passiónis infirmitas cum immortalitate spíritus seráphici nullátenus
    conveníret, ideo tamen hujusmodi visio suis fuerat præsentáta conspéctibus,
    ut amícus ipse Christi prænosceret, se, non per martyrium carnis sed per
    incendium mentis, totum in Christi Jesu crucifixi expressam similitúdinem
    transformándum. Dispárens ítaque visio, post arcanum ac familiare
    collóquium, mentem ipsíus seráphico interius inflammávit ardore; carnem vero
    Crucifixo conformi exterius insignívit effigie, tamquam si ad ignis
    liquefactivam virtútem præámbulam sigillativa quædam esset impréssio
    subsecuta. Statim namque in mánibus et pédibus ejus apparere cœpérunt signa
    clavórum, ipsórum capítibus in inferióri parte mánuum et superiori pedum
    apparéntibus, et eórum acumínibus exsisténtibus ex adverso. Dextrum quoque
    latus, quasi lancea transfixum, rubra cicatrice obductum erat, quod sæpe,
    sánguinem sacrum effúndens, túnicam et femoralia respergebat.
lectio6:
  - Postquam ígitur novus homo Franciscus novo et stupéndo miraculo cláruit, cum
    singulari privilegio retroactis sæculis non concesso insignítus appáruit,
    sacris vidélicet Stigmátibus decoratus, descéndit de monte secum ferens
    Crucifixi effigiem, non in tábulis lapídeis vel ligneis manu figuratam
    artíficis, sed in carneis membris descriptam digito Dei vivi. Quóniam
    sacraméntum regis seraphicus vir abscóndere bonum esse optime norat, secreti
    regalis cónscius, signácula illa sacra pro viribus occultábat. Verum, quia
    Dei est ad glóriam suam magna revelare quæ facit, Dóminus ipse, qui
    signácula illa sacra pro viribus occultábat. Verum, quia Dei est ad glóriam
    suam magna revelare quæ facit, Dóminus ipse, qui signácula illa secrete
    impresserat, miracula quædam aperte per ipsa monstrávit; ut illórum occúlta
    et mira vis Stígmatum manifesta patéret claritate signórum. - Porro rem
    admirábilem ac tantopere testatam atque in pontificiis diplomátibus
    præcipuis laudibus et favóribus exáltatam, Benedíctus Papa undecimus
    anniversaria solemnitate celebrari vóluit; quam póstea Paulus quintus
    Pontifex maximus, ut corda fidelium in Christi crucifixi accenderéntur
    amórem, ad universam Ecclésiam propagávit.
lectio94:
  - Francíscus singulári privilégio retroáctis sæculis non concésso insignítus
    appáruit, cum sacris Stigmátibus decorátus descéndit de monte, secum ferens
    Crucifíxi effígiem, non in tábulis lapídeis vel lígneis manu figurátam
    artíficis, sed in cárneis membris descríptam dígito Dei vivi. Quóniam
    sacraméntum regis seráphicus vir abscóndere bonum esse óptime norat, secréti
    regális cónscius, signácula illa sacra pro víribus occultábat. Verum, quia
    Dei est ad glóriam suam magna reveláre quæ facit, Dóminus ipse, qui
    signácula illa secréte imprésserat, mirácula quædam apérte per ipsa
    monstrávit; ut illórum occúlta et mira vis Stígmatum manifésta patéret
    claritáte signórum. - Porro rem admirábilem ac tantópere testátam atque in
    pontifíciis diplomátibus præcípuis láudibus et favóribus exaltátam,
    Benedíctus Papa undécimus anniversária solemnitáte celebrári vóluit; quam
    póstea Paulus quintus Póntifex máximus, ut corda fidélium in Christi
    crucifíxi accenderéntur amórem, ad univérsam Ecclésiam propagávit.
  - "&teDeum"
