oratio:
  - "Dómine Jesu Christe, qui, frigescénte mundo, ad inflammándum corda nostra
    tui amóris igne, in carne beatíssimi Francísci passiónis tuæ sacra Stígmata
    renovásti: concéde propítius; ut ejus méritis et précibus crucem júgiter
    ferámus, et dignos fructus pæniténtiæ faciámus:"
  - $Qui vivis
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Gálatas
  - "!Gal 6:14-18"
  - "Fratres: Mihi autem absit gloriári, nisi in Cruce Dómini nostri Jesu
    Christi: per quem mihi mundus crucifíxus est, et ego mundo. In Christo enim
    Jesu neque circumcísio áliquid valet neque præpútium, sed nova creatúra. Et
    quicúmque hanc régulam secúti fúerint, pax sin per illos et misericórdia, et
    super Israël Dei. De cetero nemo mihi moléstus sit: ego enim stígmata Dómini
    Jesu in córpore meo porto. Grátia Dómini nostri Jesu Christi cum spíritu
    vestro, fratres. Amen."
graduale:
  - "!Ps 36:30-31"
  - Os justi meditábitur sapiéntiam, et lingua ejus loquétur judícium.
  - "V. Lex Dei ejus in corde ipsíus: et non supplantabúntur gressus ejus."
  - Allelúja, allelúja.
  - V. Francíscus pauper et húmilis cœlum dives ingréditur, hymnis cœléstibus
    honorátur. Allelúja.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 16:24-27"
  - "In illo témpore: Dixit Jesus discípulis suis: Si quis vult post me veníre,
    ábneget semetípsum, et tollat crucem suam, et sequátur me. Qui enim volúerit
    ánimam suam salvam fácere, perdet eam: qui autem perdíderit ánimam suam
    propter me, invéniet eam. Quid enim prodest hómini, si mundum univérsum
    lucrétur, ánimæ vero suæ detriméntum patiátur? Aut quam dabit homo
    commutatiónem pro ánima sua? Fílius enim hóminis ventúrus est in glória
    Patris sui cum Angelis suis: et tunc reddet unicuíque secúndum ópera ejus."
offertorium:
  - "@Commune/C2"
secreta:
  - "Múnera tibi, Dómine, dicata sanctífica: et, intercedénte beáto Francísco,
    ab omni nos culpárum labe purífica."
  - $Per Dominum
