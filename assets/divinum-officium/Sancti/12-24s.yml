introitus:
  - "@Sancti/12-24:Introitus"
oratio:
  - "Deus, qui nos redemptiónis nostræ ánnua exspectatióne lætíficas: præsta; ut
    Unigénitum tuum, quem Redemptórem læti suscípimus, veniéntem quoque Júdicem
    secúri videámus, Dóminum nostrum Jesum Christum, Fílium tuum:"
  - $Qui tecum
lectio:
  - Lectio Epístolæ beati Pauli Apostoli ad Romános
  - "!Rom 1:1-6"
  - "Paulus, servus Jesu Christi, vocátus Apóstolus, segregátus in Evangélium
    Dei, quod ante promíserat per Prophétas suos in Scriptúris sanctis de Fílio
    suo, qui factus est ei ex sémine David secúndum carnem: qui prædestinátus
    est Fílius Dei in virtúte secúndum spíritum sanctificatiónis ex
    resurrectióne mortuórum Jesu Christi, Dómini nostri: per quem accépimus
    grátiam, et apostolátum ad obœdiéndum fídei in ómnibus géntibus pro nómine
    ejus, in quibus estis et vos vocáti Jesu Christi, Dómini nostri."
graduale:
  - "!Exod 16:6; 16:7"
  - "Hódie sciétis, quia véniet Dóminus et salvábit nos: et mane vidébitis
    glóriam ejus."
  - "!Ps 79:2-3"
  - "Qui regis Israël, inténde: qui dedúcis, velut ovem, Joseph: qui sedes super
    Chérubim, appáre coram Ephraim, Bénjamin, et Manásse. Allelúja, allelúja."
  - "V. Crástina die delébitur iníquitas terræ: et regnábit super nos Salvátor
    mundi. Allelúja."
evangelium:
  - "@Sancti/03-19"
offertorium:
  - "!Ps 23:7"
  - "Tóllite portas, principes, vestras: et elevámini, portæ æternáles, et
    introíbit Rex glóriæ."
secreta:
  - "Da nobis, quǽsumus, omnípotens Deus: ut, sicut adoránda Fílii tui natalítia
    prævenímus, sic ejus múnera capiámus sempitérna gaudéntes:"
  - $Qui tecum
communio:
  - "!Isa 40:5"
  - "Revelábitur glória Dómini: et vidébit omnis caro salutáre Dei nostri."
postcommunio:
  - "Da nobis, quǽsumus, Dómine: unigéniti Fílii tui recensíta nativitáte
    respiráre; cujus cœlésti mystério páscimur et potámur."
  - $Per eundem
