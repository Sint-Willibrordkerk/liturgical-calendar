introitus:
  - "v. Gaudeámus omnes in Dómino, diem festum celebrántes sub honóre Sanctórum
    ómnium: de quorum sollemnitáte gaudent Angeli et colláudant Fílium Dei."
  - "!Ps 32:1"
  - "Exsultáte, justi, in Dómino: rectos decet collaudátio."
  - "&Gloria"
  - "v. Gaudeámus omnes in Dómino, diem festum celebrántes sub honóre Sanctórum
    ómnium: de quorum sollemnitáte gaudent Angeli et colláudant Fílium Dei."
oratio:
  - "Omnípotens sempitérne Deus, qui nos ómnium Sanctórum tuórum mérita sub una
    tribuísti celebritáte venerári: quǽsumus; ut desiderátam nobis tuæ
    propitiatiónis abundántiam, multiplicátis intercessóribus, largiáris."
  - $Per Dominum
lectio:
  - Léctio libri Apocalýpsis beáti Joánnis Apóstoli.
  - "!Apoc 7:2-12"
  - "In diébus illis: Ecce, ego Joánnes vidi álterum Angelum ascendéntem ab ortu
    solis, habéntem signum Dei vivi: et clamávit voce magna quátuor Angelis,
    quibus datum est nocére terræ et mari, dicens: Nolíte nocére terræ et mari
    neque arbóribus, quoadúsque signémus servos Dei nostri in fróntibus eórum.
    Et audívi númerum signatórum, centum quadragínta quátuor mília signáti, ex
    omni tribu filiórum Israël. Ex tribu Juda duódecim mília signáti. Ex tribu
    Ruben duódecim mília signáti. Ex tribu Gad duódecim mília signati. Ex tribu
    Aser duódecim mília signáti. Ex tribu Néphthali duódecim mília signáti. Ex
    tribu Manásse duódecim mília signáti. Ex tribu Símeon duódecim mília
    signáti. Ex tribu Levi duódecim mília signáti. Ex tribu Issachar duódecim
    mília signati. Ex tribu Zábulon duódecim mília signáti. Ex tribu Joseph
    duódecim mília signati. Ex tribu Bénjamin duódecim mília signáti. Post hæc
    vidi turbam magnam, quam dinumeráre nemo póterat, ex ómnibus géntibus et
    tríbubus et pópulis et linguis: stantes ante thronum et in conspéctu Agni,
    amícti stolis albis, et palmæ in mánibus eórum: et clamábant voce magna,
    dicéntes: Salus Deo nostro, qui sedet super thronum, et Agno. Et omnes
    Angeli stabant in circúitu throni et seniórum et quátuor animálium: et
    cecidérunt in conspéctu throni in fácies suas et adoravérunt Deum, dicéntes:
    Amen. Benedíctio et cláritas et sapiéntia et gratiárum áctio, honor et
    virtus et fortitúdo Deo nostro in sǽcula sæculórum. Amen."
graduale:
  - "!Ps 33:10; 33:11"
  - "Timéte Dóminum, omnes Sancti ejus: quóniam nihil deest timéntibus eum."
  - V. Inquiréntes autem Dóminum, non defícient omni bono. Allelúja, allelúja.
  - "!Matt 11:28"
  - "Veníte ad me, omnes, qui laborátis et oneráti estis: et ego refíciam vos.
    Allelúja."
