communio:
  - "!Matt 5:8-10"
  - "Beáti mundo corde, quóniam ipsi Deum vidébunt; beáti pacífici, quóniam
    filii Dei vocabúntur: beáti, qui persecutiónem patiúntur propter justítiam,
    quóniam ipsórum est regnum cœlórum."
postcommunio:
