rubrica-divino-et-mense-10-et-feria-2/doxology:
  - "@Sancti/10-DU"
ant-1:
  - Ángeli, * Archángeli, Throni et Dominatiónes, Principátus et Potestátes,
    Virtútes cælórum, Chérubim atque Séraphim, Patriárchæ et Prophétæ, sancti
    legis Doctóres, Apóstoli, omnes Christi Mártyres, sancti Confessóres,
    Vírgines Dómini, Anachorítæ, Sanctíque omnes, intercédite pro nobis.
rubrica-cisterciensis/ant-1:
  - "Salvátor mundi * salva nos omnes: sancta Dei Génitrix, Virgo semper María,
    ora pro nobis: précibus quoque sanctórum Apostolórum, Mártyrum et
    Confessórum, atque sanctárum Vírginum supplíciter pétimus, ut a malis
    ómnibus eruámur, bonísque ómnibus nunc et semper pérfrui mereámur."
invit:
