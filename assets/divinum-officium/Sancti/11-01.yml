  - "v. Ecce ego Joánnes vidi álterum Angelum ascendéntem ab ortu solis,
    habéntem signum Dei vivi: et clamávit voce magna quátuor Ángelis, quibus
    datum est nocére terræ et mari, dicens: Nolíte nocére terræ et mari, neque
    arbóribus, quoadúsque signémus servos Dei nostri in fróntibus eórum."
  - $Deo gratias
