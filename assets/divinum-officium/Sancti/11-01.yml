lectio1:
  - De libro Apocalýpsis beáti Joánnis Apóstoli
  - "!Apo 4:2-8"
  - 2 Et ecce sedes pósita erat in cælo, et supra sedem sedens.
  - "3 Et qui sedébat símilis erat aspéctui lápidis jáspidis, et sárdinis: et
    iris erat in circúitu sedis símilis visióni smarágdinæ."
  - "4 Et in circúitu sedis sedília vigínti quátuor: et super thronos vigínti
    quátuor senióres sedéntes, circumamícti vestiméntis albis, et in capítibus
    eórum corónæ áureæ."
  - "5 Et de throno procedébant fúlgura, et voces, et tonítrua: et septem
    lámpades ardéntes ante thronum, qui sunt septem spíritus Dei."
  - "6 Et in conspéctu sedis tamquam mare vítreum símile crystállo: et in médio
    sedis, et in circúitu sedis quátuor animália plena óculis ante et retro."
  - 7 Et ánimal primum símile leóni, et secúndum ánimal símile vítulo, et
    tértium ánimal habens fáciem quasi hóminis, et quartum ánimal símile áquilæ
    volánti.
  - "8 Et quátuor animália, síngula eórum habébant alas senas: et in circúitu,
    et intus plena sunt óculis: et réquiem non habébant die ac nocte, dicéntia:
    Sanctus, Sanctus, Sanctus Dóminus Deus omnípotens, qui erat, et qui est, et
    qui ventúrus est."
responsory1:
  - "@Tempora/Pent01-0"
lectio2:
  - "!Apo 5:1-8"
  - 1 Et vidi in déxtera sedéntis supra thronum, librum scriptum intus et foris,
    signátum sigíllis septem.
  - "2 Et vidi ángelum fortem, prædicántem voce magna: Quis est dignus aperíre
    librum, et sólvere signácula ejus?"
  - 3 Et nemo póterat neque in cælo, neque in terra, neque subtus terram aperíre
    librum, neque respícere illum.
  - 4 Et ego flebam multum, quóniam nemo dignus invéntus est aperíre librum, nec
    vidére eum.
  - "5 Et unus de senióribus dixit mihi: Ne fléveris: ecce vicit leo de tribu
    Juda, radix David, aperíre librum, et sólvere septem signácula ejus."
  - "6 Et vidi: et ecce in médio throni et quátuor animálium, et in médio
    seniórum, Agnum stantem tamquam occísum, habéntem córnua septem, et óculos
    septem: qui sunt septem spíritus Dei, missi in omnem terram."
  - "7 Et venit: et accépit de déxtera sedéntis in throno librum."
  - "8 Et cum aperuísset librum, quátuor animália, et vigínti quátuor senióres
    cecidérunt coram Agno, habéntes sínguli cítharas, et phíalas áureas plenas
    odoramentórum, quæ sunt oratiónes sanctórum:"
responsory2:
  - "@Sancti/08-15:Responsory8:s/&Gloria.*//s"
lectio3:
  - "!Apo 5:9-14"
  - "9 Et cantábant cánticum novum, dicéntes: Dignus es, Dómine, accípere
    librum, et aperíre signácula ejus: quóniam occísus es, et redemísti nos Deo
    in sánguine tuo ex omni tribu, et lingua, et pópulo, et natióne:"
  - "10 et fecísti nos Deo nostro regnum, et sacerdótes: et regnábimus super
    terram."
  - "11 Et vidi, et audívi vocem angelórum multórum in circúitu throni, et
    animálium, et seniórum: et erat númerus eórum míllia míllium,"
  - "12 dicéntium voce magna: Dignus est Agnus, qui occísus est, accípere
    virtútem, et divinitátem, et sapiéntiam, et fortitúdinem, et honórem, et
    glóriam, et benedictiónem."
  - "13 Et omnem creatúram, quæ in cælo est, et super terram, et sub terra, et
    quæ sunt in mari, et quæ in eo: omnes audívi dicéntes: Sedénti in throno, et
    Agno, benedíctio et honor, et glória, et potéstas in sǽcula sæculórum."
  - "14 Et quátuor animália dicébant: Amen. Et vigínti quátuor senióres
    cecidérunt in fácies suas: et adoravérunt vivéntem in sǽcula sæculórum."
responsory3:
  - "R. In conspéctu Angelórum psallam tibi:"
  - "* Et adorábo ad templum sanctum tuum, et confitébor nómini tuo, Dómine."
  - V. Super misericórdia tua et veritáte tua, quóniam magnificásti super nos
    nomen sanctum tuum.
  - R. Et adorábo ad templum sanctum tuum, et confitébor nómini tuo, Dómine.
  - "&Gloria"
  - R. Et adorábo ad templum sanctum tuum, et confitébor nómini tuo, Dómine.
lectio4:
  - Sermo sancti Bedæ Venerábilis Presbýteri
  - "!Sermo 18 de Sanctis"
  - "Hódie, dilectíssimi, ómnium Sanctórum sub una solemnitátis lætítia
    celebrámus festivitátem: quorum societáte cælum exsúltat, quorum patrocíniis
    terra lætátur, triúmphis Ecclésia sancta coronátur, quorum conféssio quanto
    in passióne fórtior, tanto est clárior in honóre: quia, dum crevit pugna,
    crevit et pugnántium glória, et martýrii triúmphus multíplici passiónum
    génere adornátur: perque gravióra torménta, gravióra fuére et prǽmia: dum
    cathólica mater Ecclésia, quæ per totum orbem longe latéque diffúsa est, in
    ipso cápite suo Christo Jesu edúcta est, contumélias, cruces et mortem non
    timére; magis magísque roboráta, non resisténdo, sed perferéndo, univérsis,
    quos ágmine ínclito carcer pœnális inclúsit, pari et símili calóre virtútis
    ad geréndum certámen, glóriam triumphálem inspirávit."
responsory4:
  - "@Sancti/06-24:Responsory7"
lectio5:
  - O vere beáta mater Ecclésia, quam sic honor divínæ dignatiónis illúminat,
    quam vincéntium gloriósus Mártyrum sanguis exórnat, quam inviolátæ
    confessiónis cándida índuit virgínitas! Flóribus ejus nec rosæ nec lília
    desunt. Certent nunc caríssimi, sínguli, ut ad utrósque honóres amplíssimam
    accípiant dignitátem, corónas, vel de virginitáte cándidas, vel de passióne
    purpúreas. In cæléstibus castris pax et ácies habent flores suos, quibus
    mílites Christi coronántur.
responsory5:
  - "@Commune/C1:Responsory7"
lectio6:
  - "Dei enim ineffábilis et imménsa bónitas étiam hoc provídit, ut labórum
    quidem tempus et agónis non exténderet, nec longum fáceret, aut ætérnum, sed
    breve, et ut ita dicam, momentáneum: ut in hac brevi et exígua vita agónes
    essent et labóres; in illa vero quæ ætérna est, corónæ et prǽmia meritórum:
    ut labóres quidem cito finiréntur, meritórum vero prǽmia sine fine durárent:
    ut post hujus mundi ténebras visúri essent candidíssimam lucem, et acceptúri
    majórem passiónum cunctárum acerbitátibus beatitúdinem, testánte hoc idem
    Apóstolo, ubi ait: Non sunt condígnæ passiónes hujus témporis ad
    superventúram glóriam, quæ revelábitur in nobis."
responsory6:
  - "@Commune/C3:Responsory8"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 5:1-12"
  - "In illo témpore: Videns Jesus turbas, ascéndit in montem, et cum sedísset,
    accessérunt ad eum discípuli ejus. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Lib. 1 de Sermone Domini in monte, sub initium"
  - "Si quǽritur quid signíficet mons, bene intellégitur significáre majóra
    præcépta justítiæ, quia minóra erant quæ Judǽis data sunt. Unus tamen Deus
    per sanctos prophétas et fámulos suos, secúndum ordinatíssimam
    distributiónem témporum, dedit minóra præcépta pópulo, quem adhuc timóre
    alligári oportébat: et per Fílium suum majóra pópulo, quem caritáte jam
    liberári convénerat. Cum autem minóra minóribus, majóra majóribus dantur, ab
    eo dantur, qui solus novit congruéntem suis tempóribus géneri humáno
    exhibére medicínam."
responsory7:
  - "@Commune/C4:Responsory8:s/&Gloria.*//s"
lectio8:
  - "Nec mirum est, quod dantur præcépta majóra propter regnum cælórum, et
    minóra data sunt propter regnum terrénum, ab eódem uno Deo, qui fecit cælum
    et terram. De hac ergo justítia, quæ major est, per prophétam dícitur:
    Justítia tua sicut montes Dei: et hoc bene signíficat, quod ab uno magístro,
    solo docéndis tantis rebus idóneo, docétur in monte. Sedens autem docet,
    quod pértinet ad dignitátem magistérii. Et accédunt ad eum discípuli ejus,
    ut audiéndis illíus verbis hi essent étiam córpore vicinióres, qui præcéptis
    adimpléndis étiam ánimo propinquábant. Et apériens os suum docébat eos,
    dicens. Ista circumlocútio, qua scríbitur, Et apériens os suum, fortássis
    ipsa mora comméndat aliquánto longiórem futúrum esse sermónem. Nisi forte
    non vacet, quod nunc eum dictum est aperuísse os suum, quod ipse in lege
    véteri aperíre soléret ora prophetárum."
responsory8:
  - "@Commune/C6"
lectio9:
  - "Quid ergo dicit? Beáti páuperes spíritu: quóniam ipsórum est regnum
    cælórum. Légimus scriptum de appetitióne rerum temporálium: Omnia vánitas,
    et præsúmptio spíritus. Præsúmptio autem spíritus, audáciam et supérbiam
    signíficat. Vulgo étiam magnos spíritus supérbi habére dicúntur: et recte,
    quandóquidem spíritus étiam ventus vocátur. Unde scriptum est: Ignis,
    grando, nix, glácies, spíritus procellárum. Quis vero nésciat supérbos
    inflátos dici, tamquam vento disténtos? Unde est étiam illud Apóstoli:
    Sciéntia inflat, cáritas vero ædíficat. Quaprópter recte hic intellegúntur
    páuperes spíritu, húmiles et timéntes Deum, id est, non habéntes inflántem
    spíritum."
  - "&teDeum"
