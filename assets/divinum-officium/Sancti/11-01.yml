ant-matutinum:
  - Novit Dóminus * viam justórum, qui in lege ejus meditántur die ac nocte.;;1
  - Mirificávit * Dóminus Sanctos suos, et exaudívit eos clamántes ad se.;;4
  - "Admirábile est * nomen tuum, Dómine: quia glória et honóre coronásti
    Sanctos tuos, et constituísti eos super ópera mánuum tuárum.;;8"
  - Dómine, * qui operáti sunt justítiam, habitábunt in tabernáculo tuo, et
    requiéscent in monte sancto tuo.;;14
  - Hæc est generátio * quæréntium Dóminum, quæréntium fáciem Dei Jacob.;;23
  - Lætámini in Dómino, * et exsultáte justi, et gloriámini omnes recti
