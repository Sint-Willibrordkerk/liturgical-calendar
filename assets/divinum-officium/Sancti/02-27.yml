lectio4:
  - Gabriel, Assisii in Umbria, honesto genere natus, et Franciscus ob seráphici
    civis memóriam vocatus, egregiam animi índolem a púero osténdit. Adoléscens,
    cum Spoleti litteris operam daret, inani sæculi spécie et pompa aliquantulum
    állici visus est. Sed miserentis Dei munere, qui eum ad perfectiónem
    christianæ vitæ jamdúdum invitabat, cum in morbum incidísset, sæculi
    vanitátem fastidire cœpit, atque immortalia dumtáxat bona appétere. Quo
    autem citius Deo vocanti obtemperaret, factum est, ut insignem illam
    beatíssimæ Vírginis Icónem, solemni pompa extra Spoletinæ ecclésiæ septa
    delatam intúitus, divini amoris flammam conciperet, simulque Institutum
    Clericórum a Passióne Jesu amplecti statúeret. Itaque non exíguas
    difficultates eluctatus, in recessu Morrovallénsi, lúgubrem vestem lætus
    induit, et Gabriel a Vírgine perdolénte maluit appellari; ad ejusdem
    gaudiórum et dolórum memóriam perpetuo recoléndam.
lectio5:
  - In tirocinio, cum regulari observántia et ómnium exercitatióne virtútum
    cotidie magis eminéret, brevi eo pérvenit, ut absolutæ sanctimoniæ exemplar
    haberétur non modo a sodálibus, vel provectis, sed étiam ultra cœnobii
    septa, factus bonus odor Christi in omni loco. Dominicæ passiónis cultor
    assiduus, in ea meditanda dies noctesque insumebat. In divinam Eucharistiam,
    quæ ejusdem Passiónis memóriam prodit, incredibili quodam studio ferebátur;
    qua cum se refíceret, seraphico ardore flagrábat. Nihil autem insígnius quam
    ejus erga magnam Dei Parentem pietas fuit. Ipsam omni obsequii genere
    percólere consuevit; sed præsertim confectam afflictamque cruciátibus Jesu
    tam dolenter contemplari, ut vim lacrimárum profúnderet. Pérdolens Virgo
    quasi tota ei vitæ rátio fuit, adeptæque ab eo sanctitátis magistra; ita ut
    inter æquales una fúerit senténtia, ideo excitátum Dei famulum divinitus
    fuísse, ut cultus Maríæ perdolentis magnum exemplo ejus cáperet increméntum.
lectio6:
  - "Inter ceteras virtútes christianam humilitátem et obœdiéntiam maxime
    diléxit: nam inter omnes se minimum exístimans, abjectíssima quæque
    ministeria domus cupide affectabat, et antistitum suórum non modo jussa, sed
    et optáta diligentíssime perficiebat. Idem, refrenátis sensibus et vitæ
    asperitáte usus, illibátum retinuit florem virginitátis ac plane mundo
    crucifixus unice Deo vixit, intima Dómini sui fruítus consuetúdine. Ita
    brevem vitæ cursum tot virtútibus nobilitátum conficiens, Insulæ in Aprutio,
    caritátis incendio verius quam vi morbi consumptus, divinæque Matris ope
    recreatus, placidíssimo éxitu ad Superos evolávit, anno millesimo
    octingentésimo sexagesimo secundo, ætátis suæ vigesimo quarto. Eum deinceps,
    a Deo miraculis illustrátum, Pius Papa décimus Cælitum beatórum número
    accensuit. Benedíctus vero décimus quintus, Pontifex maximus, anno millesimo
    nongentésimo vigesimo, post cónditum Institutum a Passióne ducentésimo, in
    solemnitate Ascensiónis Dómini, beato júveni Sanctórum honores decrevit; et
    Pius undecimus ejus Offícium et Missam ad universam Ecclésiam extendit."
lectio94:
  - Gábriel, Assísii in Umbria natus, et Francíscus ob seráphici civis memóriam
    vocátus, egrégiam ánimi índolem osténdit. Adoléscens cum miseréntis Dei
    múnere, eum ad perfectiórem vitam jamdúdum invitántis, in morbum incidísset,
    sǽculi vanitátem fastidíre cepit. Institútum Clericórum a Passióne
    ampléctens, Gábriel a Vírgine Perdolénte máluit appellári ad ejúsdem
    gaudiórum et dolórum memóriam perpétuo recoléndam. Ipsam omni obséquii
    génere percólere, præsértim conféctam afflictámque Jesu cruciátibus tam
    dolénter contemplári solébat, ut vim lacrimárum profúnderet. Illibátum
    virginitátis florem retínuit, et suæ sodalitátis asperitáte usus, plane
    mundo crucifíxus, únice Deo vixit. Ita brevem vitæ cursum ómnium virtútum
    exercitatióne confíciens, caritátis incéndio vérius quam vi morbi
    consúmptus, divinǽque matris ope recreátus, ad Súperos evolávit anno
    millésimo octingentésimo sexagésimo secúndo. Eum deínceps Pius Papa décimus
    beatórum, Benedíctus vero décimus quintus Sanctórum número accénsuit, et
    Pius undécimus ejus Offícium et Missam ad univérsam Ecclésiam exténdere
    dignátus est.
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Marcum
  - "!Marc 10:13-21"
  - "In illo témpore: Offerébant Jesu párvulos, ut tángeret illos: discípuli
    autem comminabántur offeréntibus. Et réliqua."
  - _
  - Homilía sancti Bedæ Venerábilis Presbýteri
  - "!Commentárium in Marcum 10:13-21"
  - "Ait discípulis Jesus: Sínite párvulos veníre ad me, et ne prohibuéritis
    eos; talium enim est regnum Dei. Significanter dixit: Talium est; non:
    Istórum; ut osténderet, non ætátem regnare, sed mores; et his, qui similem
    haberent innocéntiam et simplicitátem, præmium repromitti: Apóstolo quoque
    in eandem senténtiam congruénte: Fratres, nolíte fíeri púeri sensibus; sed
    malítia párvuli estote, sensu autem ut perfecti sitis. Amen, dico vobis:
    quisquis non recéperit regnum Dei velut párvulus, non intrábit in illud.
    Sicut puer non persevérat in iracúndia, non læsus méminit, non videns
    pulchram mulierem delectátur, non aliud cogitat, aliud lóquitur; sic et vos,
    nisi talem habuéritis innocéntiam et animi puritátem, regnum cælórum non
    poteritis intrare. Aliter, regnum Dei, id est doctrinam Evangélii, sicut
    párvuli accípere jubemur; quia quómodo párvulus in discéndo non contradicit
    doctóribus neque ratiónes et verba componit advérsum eos resistens, sed
    fideliter suscipit quod docétur et cum metu obtemperat et quiescit; ita et
    nos, in obœdiéndo simpliciter et sine ulla rectractatióne verbis Dómini,
    fácere debemus. Et complexans eos, et impónens manus super illos,
    benedicebat eos. Complexus benedicit párvulos, ut húmiles spíritu sua
    benedictióne, grátia et dilectióne dignos esse significet."
lectio8:
  - "Et, cum egréssus esset in viam, procurrens quidam, genu flexo ante eum,
    rogábat eum: Magister bone, quid fáciam, ut vitam ætérnam percipiam?
    Audierat, credo, iste quæsítor vitæ ætérnæ a Dómino, tantum eos, qui
    parvulórum velint esse similes, dignos esse introítu regni cæléstis: atque
    ideo curam gerens tractátus certioris, poscit sibi non per parábolas, sed
    aperte, quibus óperum meritis vitam ætérnam cónsequi possit, exponi. Jesus
    autem dixit ei: Præcepta nosti. Hæc est puerílis innocéntiæ castitas, quæ
    nobis imitanda propónitur, si regnum Dei volumus intrare. At ille
    respondens, ait ille: Magister, hæc ómnia observávi a juventúte mea. Non est
    putandus homo iste vel voto tentántis (ut quidam putavére) Dóminum
    interrogasse, vel de sua esse vita mentitus, cum se legis mandáta custodisse
    dicebat; sed, simpliciter, ut víxerit esse conféssus. Quia si mendacii aut
    simulatiónis noxa reus tenerétur, nequaquam intuitus arcana cordis ejus, eum
    diligere dicerétur Jesus."
lectio9:
  - "Díligit enim Dóminus eos, qui mandáta legis, quamvis minora, custódiunt:
    sed nihilóminus, quod in lege minus fuerat, iis qui perfecti esse
    desiderant, osténdit, quia non venit solvere legem aut Prophétas, sed
    adimplere. Ad quam profecto adimpletiónem pertinet, quod hic consequenter
    adjungitur: Vade, quæcúmque habes vende et da paupéribus, et habebis
    thesáurum in cælo, et veni, séquere me. Quicúmque perfectus esse volúerit,
    debet vendere quæ habet; et non ex parte véndere, sicut Ananías et Saphira,
    sed totum véndere: et cum vendiderit, dare omne paupéribus, et sic sibi
    præparáre thesáurum in regno cælórum. Nec hoc ad perfectiónem sufficit,
    nisi, post contemptas divítias, Salvatórem sequátur; id est relictis malis,
    fáciat bona. Facílius enim sæculum contemnitur quam volúntas. Multi divítias
    relinquéntes, Dóminum non sequúntur. Sequitur autem Dóminum, qui imitator
    ejus est et per vestígia illíus graditur. Qui enim dicit se in Christo
    credere, debet, quómodo ille ambulávit, et ipse ambuláre."
  - "&teDeum"
