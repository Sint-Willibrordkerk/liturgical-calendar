evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Marcum
  - "!Marc 10:13-21"
  - "In illo témpore: Offerébant Jesu parvulos, ut tángeret illos. Discípuli
    autem comminabántur offeréntibus. Quos cum vidéret Jesus, indígne tulit et
    ait illis: Sinite párvulos veníre ad me, et ne prohibuéritis eos: tálium
    enim est regnum Dei. Amen, dico vobis: Quisquis non recéperit regnum Dei
    velut párvulus, non intrábit in illud. Et compléxans eos et impónens manus
    super illos, benedicébat eos. Et cum egréssus esset in viam, procúrrens
    quidam genu flexo ante eum, rogábat eum: Magíster bone, quid fáciam, ut
    vitam ætérnam percípiam? Jesus autem dixit ei: Quid me dicis bonum? Nemo
    bonus, nisi unus Deus. Præcépta nosti: Ne adúlteris, Ne occídas, Ne furóris,
    Ne falsum testimónium díxeris, Ne fraudem féceris, Hónora patrem tuum et
    matrem. At ille respóndens, ait illi: Magíster, hæc ómnia observávi a
    juventúte mea. Jesus autem intúitus eum, diléxit eum et dixit ei: Unum tibi
    deest: vade, quæcúmque habes, vende et da paupéribus, et habébis thesáurum
    in cœlo: et veni, séquere me."
