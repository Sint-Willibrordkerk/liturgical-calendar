graduale:
  - "!Ps 88:6; 88:2"
  - "Confitebúntur cœli mirabília tua, Dómine: etenim veritátem tuam in ecclésia
    sanctórum."
  - "V. Misericórdias tuas, Dómine, in ætérnum cantábo: in generatióne et
    progénie. Allelúja, allelúja."
  - "V. Hæc est vera fratérnitas, quæ vicit mundi crímina: Christum secúta est,
    ínclita tenens regna cœléstia. Allelúja."
