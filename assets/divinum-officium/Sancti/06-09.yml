  - "@C3a"
lectio93:
  - "Primus et Felicianus fratres, in persecutióne Diocletiáni et Maximiáni
    accusáti christianæ religiónis, in víncula conjiciúntur; quibus soluti, inde
    eripiúntur ab Angelo. Mox ad prætorem adducti, cum christianam fidem
    acerrime tueréntur, alter ab altero distracti sunt; ac primum varie tentáta
    est constántia Feliciáni. Sed, cum suasores impietátis se posse quidquam
    verbis proficere desperárent, affixis stipiti mánibus ejus et pédibus, ipsum
    sine cibo et potu inde triduum pendentem reliquérunt. Postridie ejus diéi,
    prætor vocátum ad se Primum sic affátur: Vides quanto sit prudentior, quam
    tu, frater tuus, qui obsecutus imperatóribus, apud ipsos est honoratus? Quem
    si tu quoque imitari volueris, particeps eris ejus honoris et gratiæ. Cui
    Primus: Qui factum sit fratri meo, cognóvi ex Angelo. Utinam, quemádmodum
    sum cum eo voluntáte conjunctíssimus, sic ab eodem ne martyrio disjungar.
    Quo dicto excanduit prætor, et ad ceteros cruciatus, quibus Primum affecit,
    præsénte jam Feliciáno, liquátum igne plumbum in os ejus jussit infundi. Mox
    utrumque perduci imperat in theatrum, in eosque immitti duos leónis; qui,
    prostráti ad eórum genua, cápite et cauda ipsis blandiebántur. Ad id
    spectaculum cum ámplius duódecim míllia hóminum convenissent, quingénti cum
    suis familiis christianam religiónem suscepérunt. Quibus rebus permotus
    prætor, eos secúri pércuti jussit."
  - "&teDeum"
