hymnus-matutinum:
  - "@Sancti/12-08"
lectio94:
  - Méxici, in colle Tepeiacénsi, anno millésimo quingentésimo trigésimo primo
    Deípara Virgo María Joánni Dídaco neóphyto, uti pie tráditur, sese vidéndam
    prǽbuit, eíque ad antístitem Joánnem de Zumárraga mandátum dedit, quod et
    instánter iterávit, de æde síbimet ínibi construénda. Epíscopus vero signum
    expétiit. Mox neóphytum pátruo moritúro sacraménta longínquius ab
    apparitiónis loco quæréntem, tértio visu dignátur alma Mater, de pátrui
    sanitáte serénat, rosásque extra tempus obórtas, in ejus pállio compósitas,
    ad epíscopum deférri jubet. Cujus in conspéctu rosis effúsis, Maríæ imágo,
    ipsi pállio impréssa, uti tráditur, mirum in modum præséntibus appáruit. Quæ
    in sacéllo episcopáli primum asserváta, dein ad exstrúctam ædem in colle
    Tepeiacénsi transláta, dénique in magnífico templo excépta est, quo turmátim
    plebes Mexicánæ magis magísque conveníre cœpérunt, veneratiónis grátia et
    frequéntiæ miraculórum. Ideóque tamquam præsentíssimum præsídium Mexicáni
    antístites, univérso pópulo plaudénte, beatam Vírginem Maríam de Guadalúpe
    in primáriam Patrónam gentis Mexicánæ elegérunt, quod Benedíctus décimus
    quartus apostólica auctoritáte rite confirmávit. Leo tértius décimus sacram
    effígiem áurea coróna, Colúmbi recurrénte die, anno millésimo octingentésimo
    nonagésimo quinto per Mexicánum archiepíscopum decorávit. Sanctus vero Pius
    décimus beátam Vírginem Guadalupénsem univérsæ Américæ Latínæ Patrónam
    declarávit.
  - "&teDeum"
