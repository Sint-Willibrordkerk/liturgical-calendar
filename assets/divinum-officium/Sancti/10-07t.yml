lectio93:
  - Marcus, Romanus, Constantino Magno imperatóre Pontifex, instituit ut
    epíscopus Ostiénsis, a quo Romanus Pontifex consecrátur, pallio uterétur.
    Duas Romæ basilicas ædificávit, álteram in Urbe, álteram via Ardeatina; quas
    Constantinus, auctas, magnis munéribus exornávit. Vixit in pontificatu
    menses octo, sepultúsque est in cœmeterio Balbinæ.
  - "&teDeum"
