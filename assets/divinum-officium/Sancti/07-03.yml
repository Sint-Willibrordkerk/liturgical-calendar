oratio:
  - "Deus, qui beátum Leónem Pontíficem sanctórum tuórum méritis coæquásti:
    concéde propítius; ut, qui commemoratiónis ejus festa percólimus, vitæ
    quoque imitémur exémpla."
  - $Per Dominum
communi-summorum-pontificum/oratio: []
lectio4:
  - Leo secúndus, Póntifex máximus, Sículus, humánis et divínis lítteris Græce
    et Latíne doctus, músicis étiam erudítus fuit; ipse enim sacros Hymnos et
    Psalmos in Ecclésia ad concéntum meliórem redúxit. Probávit acta sextæ
    Synodi, quæ Constantinópoli celebráta est, præsidéntibus legátis apostólicæ
    Sedis, præsénte quoque Constantíno imperatóre, et duobus patriárchis,
    Constantinopolitáno et Antiochéno, ac centum septuagínta epíscopis; quam et
    in Latínum tránstulit.
lectio5:
  - In eo concílio Cyrus, Sergius et Pyrrhus condemnáti sunt, unam tantúmmodo
    voluntátem et operatiónem in Christo prædicántes. Hic fregit supérbiam
    antístitum Ravennátum, qui, exarchórum freti poténtia, Sedi apostólicæ non
    obtemperábant. Quam ob rem decrévit ut eléctio cleri Ravennátis írrita
    esset, nisi Románi Pontíficis auctoritáte comprobarétur.
lectio6:
  - Vere pater páuperum fuit; non enim pecúnia solum, sed opera, labóre et
    consíliis, egéntium viduárum et pupillórum inópiam ac solitúdinem
    sublevábat. Qui, dum síngulos non magis prædicatióne quam vita ad pie
    sanctéque vivéndum adhortarétur, obdormívit in Dómino mense sui pontificátus
    undécimo, quinto Nonas Julii, anno sexcentésimo octogésimo tertio,
    sepultúsque est in basilica sancti Petri. Ordinatióne una, mense Junio,
    creávit presbýteros novem, diáconos tres, epíscopos divérsis in locis
    vigínti tres.
lectio94:
  - Leo secúndus, Sículus, humánis et divínis lítteris Græce et Latíne doctus,
    músicis étiam erudítus fuit; ipse enim sacros Hymnos et Psalmos in Ecclésia
    ad concéntum meliórem redúxit. Probávit acta sextæ Synodi, quæ,
    præsidéntibus legátis apostólicæ Sedis, Constantinópoli celebráta est; quam
    et in Latínum tránstulit. In eo Concílio Cyrus, Sérgius et Pyrrhus
    condemnáti sunt, unam tantúmmodo voluntátem et operatiónem in Christo
    prædicántes. Vere pater páuperum fuit; non enim pecúnia solum, sed opera,
    labóre et consíliis egéntium viduárum et pupillórum inópiam et solitúdinem
    sublevábat. Obdormívit in Dómino mense sui pontificátus undécimo, quinto
    Nonas Júlii, anno sexcentésimo octogésimo tértio, sepultúsque est in
    basílica sancti Petri.
  - "&teDeum"
