graduale:
  - "Benedícta et venerábilis es, Virgo María: quæ sine tactu pudóris invénta es
    Mater Salvatóris."
  - V. Virgo, Dei Génetrix, quem totus non capit orbis, in tua se clausit
    víscera factus homo. Allelúja, allelúja.
  - "V. Post partum, Virgo, invioláta permansísti: Dei Génetrix, intercéde pro
    nobis. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 1:26-38"
  - "In illo témpore: Missus est Angelus Gábriel a Deo in civitátem Galilææ, cui
    nomen Názareth, ad Vírginem desponsátam viro, cui nomen erat Joseph, de domo
    David, et nomen Vírginis María. Et ingréssus Angelus ad eam, dixit: Ave,
    grátia plena; Dóminus tecum: benedícta tu in muliéribus. Quæ cum audísset,
    turbáta est in sermóne ejus: et cogitábat, qualis esset ista salutátio. Et
    ait Angelus ei: Ne tímeas, María, invenísti enim grátiam apud Deum: ecce,
    concípies in útero et páries fílium, et vocábis nomen ejus Jesum. Hic erit
    magnus, et Fílius Altíssimi vocábitur, et dabit illi Dóminus Deus sedem
    David, patris ejus: et regnábit in domo Jacob in ætérnum, et regni ejus non
    erit finis. Dixit autem María ad Angelum: Quómodo fiet istud, quóniam virum
    non cognósco? Et respóndens Angelus, dixit ei: Spíritus Sanctus supervéniet
    in te, et virtus Altíssimi obumbrábit tibi. Ideóque et quod nascétur ex te
    Sanctum, vocábitur Fílius Dei. Et ecce, Elisabeth, cognáta tua, et ipsa
    concépit fílium in senectúte sua: et hic mensis sextus est illi, quæ vocátur
    stérilis: quia non erit impossíbile apud Deum omne verbum. Dixit autem
    María: Ecce ancílla Dómini, fiat mihi secúndum verbum tuum."
