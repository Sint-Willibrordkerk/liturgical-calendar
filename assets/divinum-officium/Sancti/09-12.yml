lectio4:
  - Sermo sancti Bernárdi Abbátis
  - "!Ex Homil. 2 super Missus est, circa finem"
  - Et nomen, inquit, Vírginis Maria. Loquámur pauca, et super hoc nómine, quod
    interpretátum maris stella dícitur, et Matri Vírgini valde conveniénter
    aptátur. Ipsa namque aptíssime síderi comparátur, quia sicut sine sui
    corruptióne sidus suum emíttit rádium, sic absque sui læsióne Virgo
    parturívit Fílium. Nec síderi rádius suam mínuit claritátem, nec Vírgini
    Fílius suam integritátem. Ipsa est ígitur nóbilis illa stella ex Jacob orta,
    cujus rádius univérsum orbem illúminat, cujus splendor et præfúlget in
    supérnis, et ínferos pénetrat; terras étiam perlústrans, et calefáciens
    magis mentes quam córpora, fovet virtútes, éxcoquit vítia. Ipsa, inquam, est
    præclára et exímia stella super hoc mare magnum et spatiósum necessário
    subleváta, micans méritis, illústrans exémplis.
lectio5:
  - O quisquis te intélligis in hujus sǽculi proflúvio magis inter procéllas et
    tempestátes fluctuáre, quam per terram ambuláre; ne avértas óculos a fulgóre
    hujus síderis, si non vis óbrui procéllis. Si insúrgant venti tentatiónum,
    si incúrras scópulos tribulatiónum, réspice stellam, voca Maríam. Si
    jactáris supérbiæ undis, si ambitiónis, si detractiónis, si æmulatiónis,
    réspice stellam, voca Maríam. Si iracúndia aut avarítia aut carnis illécebra
    navículam concússerit mentis, réspice ad Maríam. Si críminum immanitáte
    turbátus, consciéntiæ fœditáte confúsus, judícii horróre pertérritus,
    bárathro incípias absorbéri tristítiæ, desperatiónis abýsso, cógita Maríam.
lectio6:
  - "In perículis, in angústiis, in rebus dúbiis Maríam cógita, Maríam ínvoca.
    Non recédat ab ore, non recédat a corde; et, ut ímpetres ejus oratiónis
    suffrágium, non déseras conversatiónis exémplum. Ipsam sequens, non dévias;
    ipsam rogans, non despéras; ipsam cógitans, non erras; ipsa tenénte, non
    córruis; ipsa protegénte, non métuis; ipsa duce, non fatigáris; ipsa
    propítia, pérvenis: et sic in temetípso experíris quam mérito dictum sit: Et
    nomen Vírginis María. - Quod quidem venerábile nomen, jamprídem in quibúsdam
    christiáni orbis pártibus speciáli ritu cultum, Innocéntius undécimus
    Románus Póntifex, ob insígnem victóriam sub ejusdem Vírginis Maríæ præsídio
    de immaníssimo Turcárum tyránno, cervícibus pópuli christiáni insultánti,
    Viénnæ in Austria partam, et in perenne tanti benefícii monuméntum, in
    Ecclésia universáli síngulis annis celebrári præcépit."
lectio94:
  - "Venerábile Vírginis Maríæ nomen, quod interpretátum maris stella dícitur,
    Matri Vírgini valde conveniénter aptátur. Ipsa namque aptíssime síderi
    comparátur, quia, sicut sine sui corruptióne sidus suum emíttit rádium, sic
    absque sui læsióne Virgo parturívit Fílium. Nec síderi rádius suam mínuit
    claritátem, nec Vírgini Fílius suam integritátem. Ipsa est ígitur nóbilis
    illa stella ex Jacob orta, super hoc mare magnum et spatiósum necessário
    subleváta, micans méritis, illústrans exémplis. O quisquis te intéllegis in
    hujus sǽculi proflúvio magis inter procéllas et tempestátes fluctuáre, quam
    per terram ambuláre, ne avértas óculos a fulgóre hujus síderis. Maríam
    cógita, Maríam ínvoca, ut sic in temetípso experiáris, quam mérito dictum
    sit: Et nomen Vírginis María. - Quod quidem dulcíssimum nomen, jamprídem in
    quibúsdam christiáni orbis pártibus speciáli ritu cultum, Innocéntius
    undécimus Románus Póntifex, ob insígnem victóriam de immaníssimo Turcárum
    tyránno, cervícibus pópuli christiáni insultánte, Viénnæ in Austria partam,
    et in perénne tanti benefícii monuméntum, in Ecclésia universáli síngulis
    annis celebrári præcépit."
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 1:26-38"
  - "In illo témpore: Missus est Angelus Gabriel a Deo in civitátem Galilææ, cui
    nomen Nazareth, ad Vírginem desponsatam viro, cui nomen erat Joseph, de domo
    David, et nomen Vírginis Maria. Et réliqua."
  - _
  - Homilía sancti Petri Chrysólogi
  - "!Sermo 142 de Annuntiatione"
  - Audístis hódie, fratres caríssimi, Angelum cum muliere de hóminis
    reparatióne tractántem. Audístis agi, ut homo cursibus eisdem, quibus
    delapsus fuerat ad mortem, rediret ad vitam. Agit, agit cum Maria Angelus de
    salúte, quia cum Heva angelus egerat de ruína. Audístis Angelum de carnis
    nostræ limo templum divinæ majestátis arte ineffábili construentem. Audístis
    in terris Deum in cælis hóminem sacraménto incomprehensibili collocari.
    Audístis inaudíta ratióne in uno corpore Deum hominémque misceri. Audístis
    frágilem nostræ carnis natúram ad portandam totam Deitátis glóriam angelica
    exhortatióne roborari.
responsory7:
  - "@Commune/C11:Responsory7:s/tuam sanctam festivitátem/tui sancti nóminis
    commemoratiónem/"
lectio8:
  - "Denique, ne tanto pónderi cæléstis fabricæ in Maria subtilis nostri
    corporis arena succumberet, et in Vírgine totius generis humani portatúra
    fructum, virga ténuis frangerétur; fugatúra metum vox Angeli mox præcessit,
    dicens: Ne timeas, Maria. Ante causam dignitas Vírginis annuntiátur ex
    nómine; nam Maria Hebræo sermóne, Latine Domina nuncupátur. Vocat ergo
    Angelus Dominam, ut Dominatoris Genitricem trepidátio déserat servitutis,
    quam nasci et vocari Dominam ipsa sui Gérminis fecit et impetrávit
    auctoritas. Ne timeas, Maria, invenísti enim grátiam. Verum est, quia, qui
    invénit grátiam, nescit timére: Invenísti grátiam."
lectio9:
  - "Beata, quæ inter hómines audíre sola méruit præ ómnibus: Invenísti grátiam.
    Quantam? Quantam supérius díxerat: plenam. Et vere plenam, quæ largo imbre
    totam fúnderet et infúnderet creatúram: Invenísti enim grátiam apud Deum.
    Hæc cum dicit, et ipse Angelus mirátur, aut féminam tantum, aut omnes
    hómines vitam meruísse per féminam: stupet Angelus totum Deum veníre intra
    virginális úteri angústias, cui tota simul angústa est creatúra. Hinc est
    quod remorátur Angelus, hinc est quod vírginem vocat de mérito, de grátia
    compéllat, vix causam prodit audiénti, sane ut sensum promóveat, vix longa
    trepidatióne compónit."
  - "&teDeum"
