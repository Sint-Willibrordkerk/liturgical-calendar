oratio:
  - "Concéde, quǽsumus, omnípotens Deus: ut fidéles tui, qui sub sanctíssimæ
    Vírginis Maríæ Nómine et protectióne lætántur; ejus pia intercessióne a
    cunctis malis liberéntur in terris, et ad gáudia ætérna perveníre mereántur
    in cœlis."
