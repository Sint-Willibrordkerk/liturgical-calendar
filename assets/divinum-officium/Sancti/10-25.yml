oratio:
  - "Beatórum Mártyrum tuórum, Dómine, Chrysánthi et Daríæ, quǽsumus, adsit
    nobis orátio: ut, quos venerámur obséquio, eórum pium júgiter experiámur
    auxílium."
  - $Per Dominum
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc. 11:47-51"
  - "In illo témpore: Dicébat Jesus scribis et pharisǽis: Væ vobis, qui
    ædificátis monuménta prophetárum: patres autem vestri occidérunt illos.
    Profécto testificámini, quod consentítis opéribus patrum vestrórum: quóniam
    ipsi quidem eos occidérunt, vos autem ædificátis eórum sepúlcra. Proptérea
    et sapiéntia Dei dixit: Mittam ad illos prophétas et apóstolos, et ex illis
    occídent et persequántur: ut inquirátur sanguis ómnium prophetárum, qui
    effúsus est a constitutióne mundi a generatióne~ ista, a sánguine Abel usque
    ad sánguinem Zacharíæ, qui périit inter altáre et ædem. Ita dico vobis,
    requirétur ab hac generatióne."
secreta:
  - Pópuli tui, quǽsumus, Dómine, tibi grata sit hóstia, quæ in natalítiis
    sanctórum Mártyrum tuórum Chrysánthi et Daríæ sollémniter immolátur.
  - $Per Dominum
postcommunio:
  - "Mýsticis, Dómine, repléti sumus votis et gáudiis: præsta, quǽsumus; ut,
    intercessiónibus sanctórum Mártyrum tuórum Chrysánthi et Daríæ, quæ
    temporáliter ágimus, spirituáliter consequámur."
  - $Per Dominum
lectio93:
  - Chrysanthus et Daría cónjuges, nobili genere nati, fide étiam clariores,
    quam Daría, maríti opera, cum baptismo susceperat; Romæ innumerábilem
    hóminum multitúdinem, hæc mulíerum, ille virórum, ad Christum convertérunt.
    Quare Celerinus præfectus comprehensos trádidit Cláudio tribuno, qui jussit
    a milítibus Chrysanthum vinctum cruciátibus torqueri; sed víncula ómnia
    resoluta sunt, mox cómpedes, in quos conjéctus fuerat, confracti. Deínde,
    bovis corio inclusum, in ardentíssimo sole constituunt. Tum, pédibus ac
    mánibus catena constrictis, in obscurum carcerem detrudunt; ubi, solutis
    catenis, claríssima lux locum illustrávit. Daría veri in lupánar compulsa,
    leónis tutela, dum in oratióne defixa est, a contumelia divinitus defensa
    est. Denique in arenariam, quæ est via Salaria, uterque ductus, effossa
    terra, lapidibus óbruti, parem martyrii corónam adepti sunt.
  - "&teDeum"
