lectio93:
  - Hippolytus, a sancto Lauréntio baptizatus, domi suæ, dum Eucharistiam
    sumeret, comprehénsus, et ad Valerianum imperatórem adductus, ab eo de suæ
    religiónis professióne interrogátus, líbere se Christianum proféssus est.
    Quam ob rem fustibus cæditur; quibus in verbéribus cum ejus fides
    constantior invenirétur, munéribus et honórum promissis tentátur. Quæ cum
    ómnia frustra diceréntur, præfecto occidendus traditur. Qui, domum Hippolyti
    veniens, ut ejus facultates publicaret, totam familiam christianam esse
    cognoscit; atque, iis a christiana fide frustra deterritis, primum plumbátis
    cæsa Concordia, Hippolyti nutríce, quæ ceteros confirmábat, réliquos extra
    portam Tiburtinam occídi jubet. Hippolytus, indómitis equis raptátus per
    loca tríbulis et cárduis cónsita, lacerato corpore, spíritum Deo réddidit,
    unáque cum réliquis a Justino presbytero ad agrum Veranum sepúltus est.
    Eadem die, ad Forum Syllæ, crudelíssimo supplicio afféctus est Cassianus
    Martyr; qui, vinctis post terga mánibus, puerórum, quos erudiebat, férreis
    stylis configendus excarnificandúsque traditur. Quorum quanto erat infirmior
    vis, tanto ejus pœna martyrii gravior ac diuturnior, pálmaque illustrior.
  - "&teDeum"
