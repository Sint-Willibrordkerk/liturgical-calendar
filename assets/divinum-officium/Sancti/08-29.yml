introitus:
  - "!Ps 118:46-47"
  - "v. Loquébar de testimóniis tuis in conspéctu regum, et non confundébar: et
    meditábar in mandátis tuis, quæ diléxi nimis."
  - "!Ps 91:2"
  - "Bonum est confitéri Dómino: et psállere nómini tuo, Altíssime."
  - "&Gloria"
  - "v. Loquébar de testimóniis tuis in conspéctu regum, et non confundébar: et
