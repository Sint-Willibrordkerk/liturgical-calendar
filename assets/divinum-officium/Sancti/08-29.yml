oratio:
  - "Sancti Joánnis Baptístæ Præcursóris et Martyris tui, quǽsumus, Dómine,
    veneránda festívitas: salutáris auxílii nobis præstet efféctum:"
  - $Qui vivis
lectio:
  - Léctio Jeremíæ Prophétæ
  - "!Jer 1:17-19"
  - "In diébus illis: Factum est verbum Dómini ad me, dicens: Accínge lumbos
    tuos, et surge, et lóquere ad Juda ómnia, quæ ego præcípio tibi. Ne formides
    a fácie eórum: nec enim timére te fáciam vultum eórum. Ego quippe dedi te
    hódie in civitátem munítam, et in colúmnam férream, et in murum æreum, super
    omnem terram, régibus Juda, princípibus ejus, et sacerdótibus, et pópulo
    terræ. Et bellábunt advérsum te, et non prævalebunt: quia ego tecum sum, ait
    Dóminus, ut líberem te."
graduale:
  - "!Ps 91:13; 91:14"
  - "Justus ut palma florébit: sicut cedrus Líbani multiplicábitur in domo
    Dómini."
  - "!Ps 91:3"
  - Ad annuntiándum mane misericórdiam tuam, et veritátem tuam per noctem.
  - Allelúja, allelúja.
  - "!Osee 14:6"
  - "Justus germinábit sicut lílium: et florébit in ætérnum ante Dóminum.
    Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Marcum
  - "!Marc 6:17-29"
  - "In illo témpore: Misit Heródes, ac ténuit Joánnem, et vinxit eum in cárcere
    propter Herodíadem, uxorem Philíppi fratris sui, quia dúxerat eam. Dicebat
    enim Joánnes Heródi: Non licet tibi habére uxórem fratris tui. Heródias
    autem insidiabátur illi, et volébat occídere eum, nec póterat. Heródes enim
    metuébat Joánnem, sciens eum virum justum et sanctum: et custodiébat eum, et
    audíto eo multa faciébat, et libénter eum audiébat. Et cum dies opportúnus
    accidísset, Heródes natális sui cœnam fecit princípibus et tribúnis et
    primis Galilææ. Cumque introísset fília ipsíus Herodíadis, et saltásset, et
    placuísset Heródi simúlque recumbéntibus; rex ait puéllæ: Pete a me, quod
    vis, et dabo tibi. Et jurávit illi: Quia quidquid petiéris dabo tibi, licet
    dimídium regni mei. Quæ cum exiísset, dixit matri suæ: Quid petam? At illa
    dixit: Caput Joánnis Baptístæ. Cumque introísset statim cum festinatióne ad
    regem, petívit dicens: Volo, ut protínus des mihi in disco caput Joánnis
    Baptístæ. Et contristátus est rex: propter jusjurándum et propter simul
    discumbéntes nóluit eam contristáre: sed misso spiculatóre, præcépit afférri
    caput ejus in disco. Et decollávit eum in cárcere. Et áttulit caput ejus in
    disco: et dedit illud puéllæ, et puella dedit matri suæ. Quo audíto,
    discípuli ejus venérunt et tulérunt corpus ejus: et posuérunt illud in
    monuménto."
offertorium:
  - "@Commune/C5-1"
secreta:
  - "Múnera, quæ tibi, Dómine, pro sancti Martyris tui Joánnis Baptístæ passióne
    deférimus: quǽsumus; ut ejus obténtu nobis profíciant ad salútem."
  - $Per Dominum
communio:
  - "!Ps 20:4"
  - Posuísti, Dómine, in cápite ejus corónam de lápide pretióso.
postcommunio:
  - "Cónferat nobis, Dómine, sancti Joánnis Baptístæ sollémnitas: ut et
    magnífica sacraménta, quæ súmpsimus, significáta venerémur, et in nobis
    pótius édita gaudeámus."
  - $Per Dominum
