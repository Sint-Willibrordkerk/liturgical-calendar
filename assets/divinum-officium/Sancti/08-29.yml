lectio4:
  - Ex libro sancti Ambrósii Epíscopi de Virgínibus
  - "!Lib. 3 post initium."
  - Quóniam beáti Joánnis Baptistæ non strictim prætereunda est recordátio,
    interest ut quis et a quibus et quam ob causam, quo modo et quo témpore sit
    occisus, advertere debeamus. Ab adúlteris justus occíditur, et a reis in
    judicem capitális sceleris pœna convértitur. Deínde præmium saltatricis,
    mors est Prophetæ. Postremo (quod étiam omnes bárbari horrére consuevérunt)
    inter epulas atque convivia consummandæ crudelitátis profertur edictum; et a
    convívio ad carcerem, de carcere ad convivium feralis flagitii circumfertur
    obsequium. Quanta in uno facínore sunt crimina!
responsory4:
  - "@Commune/C2a:Responsory2"
lectio5:
  - "Quis non, cum e convívio ad carcerem cursari vidéret, putaret Prophétam
    jussum esse dimitti? Quis, inquam, cum audísset natalem esse Herodis,
    solemne convivium, puellæ optiónem eligéndi quod vellet datam; missum ad
    Joánnem ob solutiónem non arbitrarétur? Quid crudelitáti cum deliciis? quid
    cum funéribus voluptati? Rápitur ad pœnam Prophéta convivali témpore,
    convivali præcépto, quo non cuperet vel absolvi: perímitur gládio, caput
    ejus affertur in disco. Hoc crudelitáti férculum debebátur, quo insatiáta
    épulis féritas vescerétur."
responsory5:
  - "R. Iste cognóvit justítiam, et vidit mirabília magna, et exorávit
    Altíssimum:"
  - "* Et invéntus est in número Sanctórum."
  - V. Iste est, qui contempsit vitam mundi, et pervenit ad cæléstia regna.
  - R. Et invéntus est in número Sanctórum.
lectio6:
  - Intuére, rex acerbíssime, tuo spectacula digna convivio. Pórrige déxteram,
    ne quid sævítiæ tuæ desit; ut inter digitos tuos rivi défluant sacri
    cruoris. Et, quóniam non exsaturari épulis fames, non restingui póculis
    pótuit inauditæ sævítiæ sitis; bibe sánguinem scaturiéntibus adhuc venis
    exsecti cápitis profluentem. Cerne óculos in ipsa morte sceleris tui testes,
    aversántes conspéctum deliciárum. Claudúntur lúmina non tam mortis
    necessitate quam horrore luxuriæ. Os aureum illud exsangue, cujus senténtiam
    ferre non poteras, conticescit, et adhuc timétur.
responsory6:
  - "R. Honestum fecit illum Dóminus, et custodívit eum ab inimícis, et a
    seductóribus tutávit illum:"
  - "* Et dedit illi claritátem ætérnam."
  - V. Descendítque cum illo in fóveam, et in vinculis non derelíquit eum.
  - R. Et dedit illi claritátem ætérnam.
  - "&Gloria"
  - R. Et dedit illi claritátem ætérnam.
lectio94:
  - Ex libro sancti Ambrósii Epíscopi de Virgínibus
  - _
  - Quóniam beáti Joánnis Baptístæ non strictim prætereúnda est recordátio,
    ínterest ut quis et a quibus et quam ob causam, quo modo et quo témpore sit
    occísus, advértere debeámus. Ab adúlteris justus occíditur, et a reis in
    júdicem capitális scéleris pœna convértitur. Deínde prǽmium saltatrícis,
    mors est Prophétæ. Postrémo (quod étiam omnes bárbari horrére consuevérunt)
    inter épulas atque convívia consummándæ crudelitátis profértur edíctum; et a
    convívio ad cárcerem, de cárcere ad convívium ferális flagítii circumfértur
    obséquium. Quanta in uno facínore sunt crímina!
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Marcum
  - "!Marc 6:17-29"
  - "In illo témpore: Misit Heródes ac ténuit Joánnem, et vinxit eum in cárcere
    propter Herodíadem, uxórem Philíppi fratris sui, quia duxerat eam. Et
    réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Sermo 10 in novis. Serm."
  - "Cum sanctum Evangélium legerétur, crudele spectaculum ante óculos nostros
    constitutum est: caput sancti Joánnis in disco, feralis missus crudelitátis
    propter ódium veritátis. Puella saltat, et sævit mater; et inter lascivias
    et delicias convivántium témere jurátur, et ímpie, quod jurátur, implétur.
    Factum est Joánni, quod ipse prædixerat; de Dómino enim Jesu Christo
    dixerat: Illum oportet crescere, me autem minui. Iste minutus est in cápite,
    ille crevit in cruce. Odium péperit véritas. Non pótuit æquo animo tolerári
    quod homo Dei sanctus monebat; qui útique salútem eórum quærebat, quos sic
    monebat. Respondérunt illi mala pro bonis."
responsory7:
  - "@Commune/C2a:Responsory5"
lectio8:
  - "Quid enim ille diceret, nisi quo plenus erat? et quid illi respondérent,
    nisi quo pleni erant? Ille tríticum seminávit, sed spinas invénit. Dicebat
    regi: Non licet tibi habere uxórem fratris tui. Vincebat enim regem libído:
    tenebat apud se prohíbitam uxórem fratris sui. Sed eum tamen sic libebat, ut
    non sæviret; honorábat eum, a quo verum audiebat. Sed mulier detestábilis
    ódium concipiebat, quod aliquándo dato témpore páreret. Quando autem
    parturiebat, péperit filiam, filiam saltántem."
responsory8:
  - "@Commune/C2a:Responsory6"
