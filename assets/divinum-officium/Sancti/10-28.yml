introitus:
  - "@Sancti/02-24"
oratio:
  - "Deus, qui nos per beátos Apóstolos tuos Simónem et Judam ad agnitiónem tui
    nóminis veníre tribuísti: da nobis eórum glóriam sempitérnam et proficiéndo
    celebráre, et celebrándo profícere."
  - $Per Dominum
lectio:
  - "@Tempora/Pasc5-3"
graduale:
  - "!Ps 44:17-18"
  - "Constítues eos príncipes super omnem terram: mémores erunt nóminis tui,
    Dómine."
  - "V. Pro pátribus tuis nati sunt tibi fílii: proptérea pópuli confitebúntur
    tibi. Allelúja, allelúja"
  - "!Ps 138:17"
  - "Nimis honoráti sunt amíci tui, Deus: nimis confortátus est principátus
    eórum. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joann 15:17-25"
  - "In illo témpore: Dixit Jesus discípulis suis: Hæc mando vobis, ut diligátis
    ínvicem. Si mundus vos odit: scitóte, quia me priórem vobis odio hábuit. Si
    de mundo fuissétis, mundus quod suum erat dilígeret; quia vero de mundo non
    estis, sed ego elegi vos de mundo, proptérea odit vos mundus. Mementóte
    sermónis mei, quem ego dixi vobis: Non est servus major dómino suo. Si me
    persecúti sunt, et vos persequántur: si sermónem meum servavérunt, et
    vestrum servábunt. Sed hæc ómnia fácient vobis propter nomen meum: quia
    nésciunt eum, qui misit me. Si non veníssem et locútus fuíssem eis, peccátum
    non háberent: nunc autem excusatiónem non habent de peccáto suo. Qui me
    odit: et Patrem meum odit. Si ópera non fecíssem in eis, quæ nemo álius
    fecit, peccátum non háberent: nunc autem et vidérunt et odérunt et me et
    Patrem meum. Sed ut adimpleátur sermo, qui in lege eórum scriptus est: Quia
    ódio habuérunt me gratis."
offertorium:
  - "@Sancti/07-04oct"
secreta:
  - "Glóriam, Dómine, sanctórum Apostolórum tuórum Simónis et Judæ perpétuam
    venerántes: quǽsumus; ut eam, sacris mystériis expiati, dígnius celebrémus."
  - $Per Dominum
communio:
  - "@Sancti/02-24"
postcommunio:
  - "Percéptis, Dómine, sacraméntis, supplíciter exorámus: ut, intercedéntibus
    beátis Apóstolis tuis Simóne et Juda, quæ pro illórum veneránda gérimus
    passióne, nobis profíciant ad medélam."
  - $Per Dominum
