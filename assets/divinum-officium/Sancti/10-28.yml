lectio4:
  - Simon Chananǽus, qui et Zelótes, et Thaddǽus, qui et Judas Jacóbi appellátur
    in Evangélio, uníus ex cathólicis Epístolis scriptor; hic Mesopotámiam, ille
    Ægýptum evangélica prædicatióne peragrávit. Póstea in Pérsidem conveniéntes,
    cum innumerábiles fílios Jesu Christo peperíssent fidémque in vastíssimis
    illis regiónibus et efferátis géntibus disseminássent, doctrína et
    miráculis, ac dénique glorióso martýrio, simul sanctíssimum Jesu Christi
    nomen illustrárunt.
lectio5:
  - "@Commune/C1:Lectio4"
lectio6:
  - "@Commune/C1:Lectio5"
lectio7:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 15:17-25"
  - "In illo témpore: Dixit Jesus discípulis suis: Hæc mando vobis, ut diligátis
    ínvicem. Si mundus vos odit, scitóte quia me priórem vobis ódio hábuit. Et
    réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tractatus 87 in Joannem"
  - "In lectióne evangélica quæ hanc antecédit, díxerat Dóminus: Non vos me
    elegístis; sed ego elégi vos et pósui vos, ut eátis, et fructum afferátis,
    et fructus vester máneat: ut quodcúmque petiéritis Patrem in nómine meo, det
    vobis. Hic autem dicit: Hæc mando vobis, ut diligátis ínvicem. Ac per hoc
    intellégere debémus hunc esse fructum nostrum, de quo ait: Ego vos elégi, ut
    eátis, et fructum afferátis, et fructus vester máneat. Et quod adjúnxit, Ut
    quodcúmque petiéritis Patrem in nómine meo, det vobis, tunc útique dabit
    nobis, si diligámus ínvicem; cum et hoc ipsum ipse déderit nobis, qui nos
    elégit non habéntes fructum, quia non eum nos elegerámus, et pósuit nos ut
    fructum afferámus, hoc est, ínvicem diligámus."
lectio8:
  - "Cáritas ergo est fructus noster, quam defínit Apóstolus, De corde puro, et
    consciéntia bona, et fide non ficta. Hac dilígimus ínvicem, hac dilígimus
    Deum; neque enim vera dilectióne diligerémus ínvicem, nisi diligéntes Deum.
    Díligit enim unusquísque próximum suum tamquam seípsum, si díligit Deum.
    Nam, si non díligit Deum, non díligit seípsum; in his enim duóbus præcéptis
    caritátis tota lex pendet et prophétæ. Hic est fructus noster. De fructu
    ítaque nobis mandans, Hæc mando, inquit, vobis, ut diligátis ínvicem. Unde
    et Apóstolus Paulus, cum contra ópera carnis commendáre fructum spíritus
    vellet, a cápite hoc pósuit: Fructus, inquit, spíritus, cáritas est; ac
    deínde cétera, tamquam ex isto cápite exórta et religáta contéxuit, quæ
    sunt, gáudium, pax, longanímitas, benígnitas, bónitas, fides, mansuetúdo,
    continéntia, cástitas."
lectio9:
  - Quis autem bene gaudet, qui bonum non díligit unde gaudet? Quis pacem veram,
    nisi cum illo potest habére, quem veráciter díligit? Quis est longánimis in
    bono ópere perseveránter manéndo, nisi férveat diligéndo? Quis est benígnus,
    nisi díligat cui opitulátur? Quis bonus, nisi diligéndo efficiátur? Quis
    salúbriter fidélis, nisi ea fide quæ per dilectiónem operátur? Quis utíliter
    mansuétus, cui non diléctio moderétur? Quis ab eo cóntinet unde turpátur,
    nisi díligat unde honestátur? Mérito ítaque Magíster bonus dilectiónem sic
    sæpe comméndat, tamquam sola præcipiénda sit, sine qua non possunt prodésse
    cétera bona, et quæ non potest habéri sine céteris bonis, quibus homo
    effícitur bonus.
  - "&teDeum"
