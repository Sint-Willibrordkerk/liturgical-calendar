  - "1"
  - "@C2a"
lectio93:
  - "Chrysógonus, Diocletiáno imperatóre, Romæ inclusus in carcere, ibi biennium
    sanctæ Anastasiæ facultátibus vixit; quam etiam, afflictam propter Christum
    a viro suo Publio, proptereáque a suis oratiónibus per litteras auxílium
    postulántem, mútuis epistolis est consolatus. Sed, cum imperátor Romam
    scripsísset ut, reliquis Christiánis qui in vinculis essent interfectis,
    Chrysógonus Aquilejam ad se mitterétur, eo perductus est. Cui imperátor:
    Accersívi, inquit, te, Chrysógone, ut honóribus augeam, si modo induxeris
    ánimum deos cólere. At ille: Ego eum, qui vere est Deus, mente et oratióne
    véneror; deos autem, qui nihil sunt nisi dæmonum simulacra, odi et éxsecror.
    Quo responso excandéscens imperátor, ad Aquas Gradatas eum secúri pércuti
    jubet octavo Kalendas Decembris. Cujus corpus, projectum in mare, paulo post
    in littore invéntum, Zóilus presbyter in suis ædibus sepelívit."
  - "&teDeum"
