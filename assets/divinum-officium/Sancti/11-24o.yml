oratio:
  - "Adésto, Dómine, supplicatiónibus nostris: ut, qui ex iniquitáte nostra reos
    nos esse cognóscimus, beáti Chrysógoni Mártyris tui intercessióne
    liberémur."
  - $Per Dominum
secreta:
  - "Oblátis, quǽsumus, Dómine, placáre munéribus: et, intercedénte beáto
    Chrysógono Mártyre tuo, a cunctis nos defénde perículis."
  - $Per Dominum
postcommunio:
  - "@Tempora/Quad1-3:Postcommunio"
