lectio93:
  - Pontianus, Romanus, præfuit Ecclésiæ Alexandro imperatóre; qui sanctum
    Pontificem, propter christianæ fidei confessiónem, in Sardiniam insulam cum
    Hippólyto presbytero relegávit. Ubi is, pro Christi fide multis
    calamitátibus afflíctus, tertio Kalendas Novembris e vita migrávit. Ejus
    corpus, Fabiáno Pontifice, cum clero Romam delátum, in cœmeterio Callísti
    via Appia sepelítur. Sedit annos quatuor, menses quatuor, dies viginti
    quinque. Fecit ordinatiónes duas mense Decembri, quibus creávit presbyteros
    sex, diaconos quinque, episcopos per diversa loca sex.
  - "&teDeum"
