graduale:
  - Allelúja, allelúja
  - "!Ps 91:13"
  - "Justus ut palma florébit: sicut cedrus Líbani multiplicábitur. Allelúja"
  - "!Ps 14:6"
  - "V. Justus germinábit sicut lílium: et florébit in ætérnum ante Dóminum.
    Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 20:20-23"
  - "In illo témpore: Accessit ad Jesum mater filiórum Zebedæi cum fíliis suis,
    adórans et petens áliquid ab eo. Qui dixit ei: Quid vis? Ait illi: Dic, ut
    sédeant hi duo fílii mei, unus ad déxteram tuam et unus ad sinístram in
    regno tuo. Respóndens autem Jesus, dixit: Néscitis, quid petátis. Potéstis
    bíbere cálicem, quem ego bibitúrus sum? Dicunt ei: Póssumus. Ait illis:
    Cálicem quidem meum bibétis: sedére autem ad déxteram meam vel sinístram,
    non est meum dare vobis, sed quibus parátum est a Patre meo."
