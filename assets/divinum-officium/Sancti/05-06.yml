lectio4:
  - Ex libro sancti Hierónymi Presbýteri contra Jovinianum.
  - "!Liber 1, n. 26"
  - "Joánnes Apóstolus, unus ex discupulis Dómini, qui minimus natu traditur
    fuísse inter Apóstolos, et quem fides Christi vírginem repérerat, virgo
    permansit; et ideo plus amátur a Dómino, et recumbit super pectus Jesu; et,
    quod Petrus, qui uxórem habuerat, interrogare non audet, illum rogat, ut
    interroget; et post resurrectiónem, nuntiánte Maria Magdalene quod Dóminus
    resurrexísset, uterque cucúrrit ad sepúlcrum, sed ille prævenit; cumque
    essent in navi, et piscaréntur in lacu Genésareth, Jesus stabat in líttore,
    nec sciébant Apóstoli quem vidérent; solus virgo Vírginem agnoscit, et dicit
    Petro: Dóminus est."
lectio5:
  - "Fuit autem Joánnes et Apóstolus, et Evangelista, et Prophéta: Apóstolus,
    quia scripsit ad ecclésias ut magister; Evangelista, quia librum Evangélii
    cóndidit, quod, excepto Matthæo, alii ex duódecim Apóstoli non fecérunt;
    Prophéta, vidit enim in Patmos insula, in qua fuerat a Domitiáno príncipe ob
    Dómini martyrium relegatus, Apocalypsim, infiníta futurórum mysteria
    continentem. Refert autem Tertullianus, quod Romæ missus in ferventis ólei
    dolium, purior et vegetior exíverit, quam intraverit."
lectio6:
  - "Sed et ipsum ejus Evangélium multum distat a ceteris. Matthæus quasi de
    hómine incipit scribere: Liber generatiónis Jesu Christi, fílii David, fílii
    Abraham; Lucas a sacerdotio Zacharíæ; Marcus a prophetía Malachíæ et Isaíæ.
    Primus habet fáciem hóminis, propter genealogíam; secundus fáciem vítuli,
    propter sacerdotium; tertius fáciem leónis, propter vocem clamántis in
    desérto, Parate viam Dómini, rectas fácite sémitas ejus. Joánnes vero noster
    quasi áquila ad superna volat, et ad ipsum Patrem pérvenit, dicens: In
    principio erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum."
lectio94:
  - Ex libro sancti Hierónymi Presbýteri contra Joviniánum
  - "Joánnes Apóstolus, unus ex discípulis Dómini, qui mínimus natu tráditur
    fuísse inter Apóstolos, et quem fides Christi vírginem repérerat, virgo
    permánsit; et ídeo plus amátur a Dómino, et recúmbit super pectus Jesu; et,
    quod Petrus, qui uxórem habúerat, interrogáre non audet, illum rogat, ut
    intérroget; et post resurrectiónem, nuntiánte María Magdaléne quod Dóminus
    resurrexísset, utérque cucúrrit ad sepúlcrum, sed ille prævénit; cumque
    essent in navi, et piscaréntur in lacu Genésareth, Jesus stabat in líttore,
    nec sciébant Apóstoli quem vidérent; solus virgo Vírginem agnóscit, et dicit
    Petro: Dóminus est. Fuit autem Joánnes et Apóstolus, et Evangelísta, et
    Prophéta. Refert autem Tertulliánus, quod Romæ missus in fervéntis ólei
    dólium, púrior et vegétior exíverit, quam intráverit."
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum.
  - "!Matt 20:20-23"
  - "In illo témpore: Accessit ad Jesum mater filiórum Zebedæi cum fíliis suis,
    adorans et petens aliquid ab eo. Et réliqua."
  - _
  - Homilía sancti Hierónymi Presbýteri.
  - "!Liber 3 Comm. in Matth. c. 20."
  - "Unde opiniónem regni habet mater filiórum Zebedæi, ut cum Dóminus dixerit:
    Fílius hóminis tradétur princípibus sacerdotum et scribis, et condemnábunt
    eum morte, et tradent Géntibus ad illudéndum et flagellándum et
    crucifigéndum; et ignomíniam passiónis timéntibus discípulis nuntiáret, illa
    gloriam postulet triumphantis? Hac, ut reor, ex causa, quia post ómnia
    dixerat Dóminus, Et tertia die resurget; putávit eum mulier post
    resurrectiónem illico regnatúrum, et hoc, quod in secundo adventu
    promittitur, in primo esse compléndum; et, aviditate feminea præséntia
    cupit, immemor futurórum."
lectio8:
  - "Mater póstulat, et Dóminus discípulis lóquitur, intélligens preces ejus ex
    filiórum descendere voluntáte. Potestis bibere calicem, quem ego bibiturus
    sum? Calicem in Scripturis divinis passiónem intellígimus, juxta illud:
    Pater, si possibile est, tránseat a me calix iste; et in Psalmo: Quid
    retríbuam Dómino pro ómnibus quæ retríbuit mihi? Calicem salutáris accípiam,
    et nomen Dómini invocábo. Statimque infert quis iste sit calix: Pretiósa in
    conspéctu Dómini mors Sanctórum ejus."
lectio9:
  - Quæritur quómodo calicem martyrii fílii Zebedæi, Jacobus videlicet et
    Joánnes, bíberint; cum Scriptúra narret Jacobum tantum Apostolum ab Herode
    cápite truncátum, Joánnes autem propria morte vitam finíerit. Sed, si
    legámus ecclesiásticas historias, in quibus fertur, quod et ipse propter
    martyrium sit missus in ferventis ólei dolium, et inde ad suscipiéndam
    corónam Christi athleta processerit, statimque relegátus in Patmos insulam
    sit; vidébimus martyrio ánimum non defuísse, et bibisse Joánnem calicem
    confessiónis, quem et tres púeri in camino ignis bibérunt, licet persecutor
    non fuderit sánguinem.
  - "&teDeum"
