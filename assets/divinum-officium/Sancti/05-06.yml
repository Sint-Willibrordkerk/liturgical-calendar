oratio:
  - "Deus, qui cónspicis, quia nos úndique mala nostra pertúrbant: præsta,
    quǽsumus; ut beáti Joánnis Apóstoli tui et Evangelístæ intercéssio gloriósa
    nos prótegat."
  - $Per Dominum.
