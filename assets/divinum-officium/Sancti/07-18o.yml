lectio2:
  - "Symphorosa Tiburtina, Getulli martyris uxor, ex eo septem filios peperit,
    Crescentium, Julianum, Nemesium, Primitivum, Justinium, Stacteum, et
    Eugenium: qui omnes propter christianæ fidei professionem una cum matre,
    Adriano imperatore, comprehensi sunt: quorum pietas multis variisque tentata
    suppliciis, cum stabilis permaneret, mater, quæ filiis fidei magistra
    fuerat, dux eisdem ad martyrium exstitit. Nam saxo ad collum alligato, in
    profluentem dejicitur: cujus corpus conquistum a fratre ejus Eugenio
    sepelitur."
lectio3:
  - "Postridie ejus diei, qui fuit decimoquinto Calendas Augusti, septem fratres
    singuli ad palum alligati, varie sunt interfecti. Crescentio guttur ferro
    transfigitur: Juliano pectus confoditur: Nemesio cor transverberatur:
    Primitivo trajicitur umbilicus: Justinus membratim secatur: Stacteus telis
    configitur: Eugenius a pectore in duas partes dividitur. Ita octo hostiæ Deo
    gratissimæ sunt immolatæ. Corpora in altissimam foveam projecta sunt via
    Tiburtina, nono ab urbe lapide: quæ postea Romam translata, condita sunt in
    Ecclesia sancti Michaelis in foro piscario."
rubrica-1888-aut-rubrica-1906-aut-rubrica-divino/lectio93:
  - "Symphorosa Tiburtina, Getulii Mártyris uxor, ex eo septem fílios péperit,
    Crescéntium, Julianum, Nemesium, Primitivum, Justinum, Stacteum, et
    Eugenium; qui omnes propter christianæ fidei professiónem una cum matre,
    Hadriáno imperatóre, comprehénsi sunt. Quorum pietas, multis variisque
    tentáta suppliciis, cum stábilis permanéret, mater, quæ fíliis fidei
    magistra fúerat, dux eisdem ad martyrium éxstitit. Nam, saxo ad collum
    alligato, in profluentem dejícitur: cujus corpus, conquisítum a fratre ejus
    Eugenio, sepelítur. Postridie ejus diéi, qui fuit décimo quinto Kalendas
    Augusti, septem fratres singuli ad palum alligati, varie sunt interfécti:
    Crescentio guttur ferro transfígitur; Juliáno pectus confóditur; Nemesio cor
    transverberátur; Primitivo trajícitur umbilicus; Justinus membratim secátur;
    Stacteus telis confígitur; Eugenius a péctore in duas partes dividitur. Ita
    octo hostiæ Deo gratíssimæ sunt immolátæ. Corpora in altíssimam fóveam
    projecta sunt via Tiburtina, nono ab Urbe lápide; quæ, póstea Romam
    translata, cóndita sunt in ecclésia sancti Angeli in piscina."
  - "&teDeum"
