ant-1:
  - Omnes de Saba * vénient, aurum et thus deferéntes, allelúja, allelúja.
responsory1:
  - "R. Tria sunt múnera pretiósa, quæ obtulérunt Magi Dómino in die ista, et
    habent in se divína mystéria:"
  - "* In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum
    consídera: et in myrrha, Domínicam sepultúram."
  - V. Salútis nostræ auctórem Magi veneráti sunt in cunábulis, et de thesáuris
    suis mýsticas ei múnerum spécies obtulérunt.
  - "R. In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum
    consídera: et in myrrha, Domínicam sepultúram."
responsory2:
  - "R. In colúmbæ spécie Spíritus Sanctus visus est, Patérna vox audíta est:"
  - "* Hic est Fílius meus diléctus, in quo mihi bene complácui."
  - V. Cæli apérti sunt super eum, et vox Patris intónuit.
  - R. Hic est Fílius meus diléctus, in quo mihi bene complácui.
responsory3:
  - "R. Reges Tharsis et ínsulæ múnera ófferent:"
  - "* Reges Arabum et Saba dona Dómino Deo addúcent."
  - V. Omnes de Saba vénient, aurum et thus deferéntes.
  - R. Reges Arabum et Saba dona Dómino Deo addúcent.
  - "&Gloria"
  - R. Reges Arabum et Saba dona Dómino Deo addúcent.
lectio4:
  - Sermo sancti Fulgéntii Epíscopi
  - "!Ex Serm. 5 qui est de Epiphania, sub initium"
  - "Ipse Deus, qui sibi in véteri testaménto primítias offérri mandávit, homo
    natus Géntium primítias suo cultui dedicávit. Pastóres fuérunt primítiæ
    Judæórum: Magi facti sunt primítiæ Géntium. Illi de próximo addúcti, isti de
    longínquo redúcti. Ubi est, ínquiunt, qui natus est Rex Judæórum? De Heróde
    rege Judæórum fílii jam fúerant nati. Archeláus natus est in palátio,
    Christus in diversório. Archeláus natus, est in lecto argénteo pósitus,
    Christus autem natus, in præsépio est brevíssimo collocátus: et tamen ille
    natus in palátio contémnitur, iste natus in diversório quæritur: ille a
    Magis nullátenus nominátur, iste invéntus supplíciter adorátur."
lectio5:
  - "Quis est iste Rex Judæórum? Páuperet dives, húmilis et sublímis. Quis est
    iste Rex Judæórum, qui portátur ut párvulus, adorátur ut Deus? Parvus in
    præsépio, imménsus in cælo: vilis in pannis, pretiósus in stellis. Quid est
    quod sic turbáris, Heródes? Rex iste, qui natus est, non venit reges
    pugnándo superáre, sed moriéndo mirabíliter subjugáre. Nec ídeo natus est,
    ut tibi succédat, sed ut in eum mundus fidéliter credat. Venit ergo, non ut
    pugnet vivus, sed ut triúmphet occísus."
lectio6:
  - Puer iste, qui nunc a Magis dícitur Rex Judæórum, idem Creátor est, et
    Dóminus Angelórum. Quaprópter cujus times infántiam nascéntis, magis timére
    debes omnipoténtiam judicántis. Noli eum timére regni tui successórem, sed
    time infidelitátis tuæ justíssimum damnatórem. Ite, inquit, et renuntiáte
    mihi, ut et ego véniens adórem eum. O callíditas ficta, o incredúlitas
    ímpia, o nequítia fraudulénta! Sanguis Innocéntium, quem crudéliter
    effudísti, attestátur quid de hoc púero voluísti.
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 2:1-12"
  - "Cum natus esset Jesus in Béthlehem Juda in diébus Heródis regis, ecce Magi
    ab Oriénte venérunt Jerosólymam, dicéntes: Ubi est qui natus est Rex
    Judæórum? Et réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Liber 2 in Lucam cap. 2, post init."
  - "Quæ sunt ista veræ fídei múnera? Aurum Regi, thus Deo, myrrha defúncto.
    Aliud enim Regis insígne, áliud divínæ sacraméntum potestátis, áliud honor
    est sepultúræ, quæ non corrúmpat corpus mórtui, sed resérvet. Nos quoque,
    qui hæc audímus et légimus, de thesáuris nostris tália, fratres, múnera
    proferámus. Habémus enim thesáurum in vasis fictílibus. Si ígitur in teípso
    quod es, non ex te debes æstimáre, sed ex Christo: quanto magis in Christo
    non tua debes æstimáre, sed Christi?"
lectio8:
  - "Ergo Magi de thesáuris suis ófferunt múnera. Vultis scire quam bonum
    méritum hábeant? Stella ab his vidétur: ubi Heródes est, non vidétur; ubi
    Christus est, rursus vidétur, et viam demónstrat. Ergo stella hæc via est,
    et via Christus: quia secúndum incarnatiónis mystérium Christus est stella.
    Oriétur enim stella ex Jacob, et exsúrget homo ex Israël. Dénique ubi
    Christus, et stella est. Ipse enim est stella spléndida et matutína. Sua
    ígitur ipse luce se signat."
lectio9:
  - "Accipe áliud documéntum. Alia venérunt via Magi, ália rédeunt. Qui enim
    Christum víderant, Christum intelléxerant; melióres útique, quam vénerant,
    revertúntur. Duæ quippe sunt viæ: una, quæ ducit ad intéritum; alia, quæ
    ducit ad regnum. Illa peccatórum est, quæ ducit ad Heródem: hæc Christus
    est, qua redítur ad pátriam. Hic enim temporális est incolátus, sicut
    scriptum est: Multum íncola facta est ánima mea."
  - "&teDeum"
ant-2:
  - Vénient ad te, * qui detrahébant tibi, et adorábunt vestígia pedum tuórum.
ant-3:
