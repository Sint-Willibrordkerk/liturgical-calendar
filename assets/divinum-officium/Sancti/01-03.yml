rubrica-tridentina/ant-vespera-3:
  - Valde honorándus est * beátus Joánnes, qui supra pectus Dómini in cena
    recúbuit.
  - "Hic est discípulus ille * qui testimónium pérhibet de his: et scimus quia
    verum est testimónium ejus."
  - "Hic est discípulus meus: * sic eum volo manére, donec véniam."
  - Sunt de hic stántibus, * qui non gustábunt mortem, donec vídeant Fílium
    hóminis in regno suo.
  - Ecce puer meus, * eléctus, quem elégi, pósui super eum Spíritum meum.
