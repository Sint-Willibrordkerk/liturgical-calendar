rubrica-tridentina/commemoratio-oratio:
  - "!Pro Ss. Innocentibus"
  - "Deus, cujus hodiérna die præcónium Innocéntes Mártyres non loquéndo, sed
    moriéndo conféssi sunt: ómnia in nobis vitiórum mala mortífica; ut fidem
    tuam, quam lingua nostra lóquitur, étiam móribus vita fateátur."
  - $Per Dominum
rubrica-tridentina/commemoratio-secreta:
  - "!Pro Ss. Innocentibus"
  - "Sanctórum tuórum, Dómine, nobis pia non desit orátio: quæ et múnera nostra
    concíliet, et tuam nobis indulgéntiam semper obtíneat."
  - $Per Dominum
rubrica-tridentina/commemoratio-postcommunio:
  - "!Pro Ss. Innocentibus"
  - "Votíva, Dómine, dona percépimus: quæ Sanctórum nobis précibus, et
    præséntis, quǽsumus, vitæ páriter et ætérnæ tríbue conférre subsídium."
  - $Per Dominum
rubrica-tridentina/commemoratio:
  - "!Commemoratio Octavæ Ss. Innocentium"
  - "Ant. Hi sunt, qui cum muliéribus non sunt coinquináti: vírgines enim sunt,
    et sequúntur Agnum quocúmque íerit."
  - _
  - V. Heródes irátus occídit multos púeros.
  - R. In Béthlehem Judæ civitáte David.
  - _
  - $Oremus
  - "v. Deus, cujus hodiérna die præcónium Innocéntes Mártyres non loquéndo, sed
    moriéndo conféssi sunt: ómnia in nobis vitiórum mala mortífica; ut fidem
    tuam, quam lingua nostra lóquitur, étiam móribus vita fateátur."
  - $Per Dominum
rubrica-tridentina/lectio1:
  - De libro Apocalýpsis beáti Joánnis Apóstoli
  - "!Apo 4:1-5"
  - "1 Post hæc vidi: et ecce óstium apértum in cælo, et vox prima, quam audívi
    tamquam tubæ loquéntis mecum, dicens: Ascénde huc, et osténdam tibi quæ
    opórtet fíeri post hæc."
  - "2 Et statim fui in spíritu: et ecce sedes pósita erat in cælo, et supra
    sedem sedens."
  - "3 Et qui sedébat símilis erat aspéctui lápidis jáspidis, et sárdinis: et
    iris erat in circúitu sedis símilis visióni smarágdinæ."
  - "4 Et in circúitu sedis sedília vigínti quátuor: et super thronos vigínti
    quátuor senióres sedéntes, circumamícti vestiméntis albis, et in capítibus
    eórum corónæ áureæ."
  - "5 Et de throno procedébant fúlgura, et voces, et tonítrua: et septem
    lámpades ardéntes ante thronum, qui sunt septem spíritus Dei."
rubrica-tridentina/lectio2:
  - "!Apo 4:5-8"
  - "5 Et de throno procedébant fúlgura, et voces, et tonítrua: et septem
    lámpades ardéntes ante thronum, qui sunt septem spíritus Dei."
  - "6 Et in conspéctu sedis tamquam mare vítreum símile crystállo: et in médio
    sedis, et in circúitu sedis quátuor animália plena óculis ante et retro."
  - 7 Et ánimal primum símile leóni, et secúndum ánimal símile vítulo, et
    tértium ánimal habens fáciem quasi hóminis, et quartum ánimal símile áquilæ
    volánti.
  - "8 Et quátuor animália, síngula eórum habébant alas senas: et in circúitu,
    et intus plena sunt óculis."
rubrica-tridentina/lectio3:
  - "!Apo 4:8-11"
  - "8 Et réquiem non habébant die ac nocte, dicéntia: Sanctus, Sanctus, Sanctus
    Dóminus Deus omnípotens, qui erat, et qui est, et qui ventúrus est."
  - "!Apo 4:9-11"
  - 9 Et cum darent illa animália glóriam, et honórem, et benedictiónem sedénti
    super thronum, vivénti in sǽcula sæculórum,
  - "10 procidébant vigínti quátuor senióres ante sedéntem in throno, et
    adorábant vivéntem in sǽcula sæculórum, et mittébant corónas suas ante
    thronum, dicéntes:"
  - "11 Dignus es, Dómine, Deus noster, accípere glóriam, et honórem, et
    virtútem: quia tu creásti ómnia, et propter voluntátem tuam erant, et creáta
    sunt."
lectio4:
  - Ex Tractatu sancti Augustíni Epíscopi in Joánnem
  - "!Tractatus 36"
  - "In quátuor Evangéliis, vel pótius quátuor libris uníus Evangélii, sanctus
    Joánnes Apóstolus non immérito secúndum intelligéntiam spiritálem áquilæ
    comparátus, áltius multóque sublímius áliis tribus eréxit prædicatiónem
    suam: et in ejus erectióne étiam corda nostra érigi vóluit. Nam céteri tres
    Evangelístæ tamquam cum hómine Dómino in terra ámbulant, et de divinitáte
    ejus pauca dixérunt: istum autem quasi pigúerit in terra ambuláre, sicut
    ipso exórdio sui sermónis intónuit, eréxit se non solum super terram, et
    super omnem ámbitum áëris et cæli, sed super omnem étiam exércitum
    Angelórum, omnémque constitutiónem invisibílium Potestátum: et pervénit ad
    eum, per quem facta sunt ómnia, dicéndo: In princípio erat Verbum, et Verbum
    erat apud Deum, et Deus erat Verbum."
lectio5:
  - "Huic tantæ sublimitáti princípii étiam cétera cóngrua prædicávit, et de
    Dómini divinitáte, quómodo nullus álius, est locútus: hoc ructábat, quod
    bíberat. Non enim sine causa de illo in isto ipso Evangélio narrátur, quia
    et in convívio super pectus Dómini discumbébat. De illo ergo péctore in
    secréto bibébat, sed quod in secréto bibit, in manifésto eructávit: ut
    pervéniat ad omnes gentes non solum incarnátio Fílii Dei, pássio, et
    resurréctio, sed étiam quod erat ante incarnatiónem únicus Patri, Verbum
    Patris, coætérnus generánti, æquális ei a quo missus est."
lectio6:
  - "Aquila ipse est Joánnes, sublímium prædicátor, et lucis intérnæ atque
    ætérnæ fixis óculis contemplátor. Dicúntur enim et pulli aquilárum a
    paréntibus sic probári, patris scílicet ungue suspéndi, et rádiis solis
    oppóni. Qui firme contemplátus fúerit, fílius agnóscitur: si ácie
    palpitáverit, tamquam adulterínus ab ungue dimíttitur. Jam ergo vidéte, quam
    sublímia loqui débuit, qui est áquilæ comparátus: et tamen étiam nos humi
    repéntes, infírmi, et vix ullíus moménti inter hómines, audémus tractáre
    ista, et ista expónere: et putámus nos aut cápere posse cum cogitámus, aut
    capi dum dícimus."
lectio7:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 21:20-24"
  - "In illo témpore: Dixit Jesus Petro: Séquere me. Convérsus Petrus, vidit
    illum discípulum, quem diligébat Jesus, sequéntem. Et réliqua."
  - _
  - Homilía sancti Joánnis Chrysóstomi
  - "!Hom. 87. in Joann., circa med."
  - "Cum magna Christus Petro communicásset, orbis terrárum curam demandásset,
    martýrium prædixísset et majórem erga eum dilectiónem testátus esset: cum
    vellet Petrus Joánnem sócium et collégam, inquit: Hic autem quid? Numquid
    eámdem viam aggrediétur? Et quemádmodum in cena interrogáre non ausus,
    Joánnem suffécit; ita nunc vicem reddit, arbitrátus eum velle, sed non
    audére de se sciscitári. Tum Christus: Si eum volo manére donec véniam, quid
    ad te?"
lectio8:
  - "Nam cum nímia id caritáte díceret Petrus, nec ab eo dívidi vellet,
    osténdens Christus, quod quantávis eum dilectióne prosequerétur, suam
    ássequi non posset, inquit: Si eum volo manére, quid ad te? His verbis nos
    erúdiens, neque doléndum, neque curiósius præter divínam voluntátem
    investigándum. Nam cum Petrus semper in hujúsmodi interrogatiónes fervéntius
    prosilíret, íterum ejus fervórem retúndens, quod non sit ultérius
    inquiréndum, in hunc modum respóndit."
lectio9:
  - "Exiit ergo sermo iste inter fratres, quod discípulus ille non móritur: et
    non dixit ei Jesus, quia non móritur; sed, Si eum volo manére donec véniam
    quid ad te? Noli arbitrári, inquit, eódem modo me de vobis disposuísse. Hoc
    autem dixit, ut intempestívum afféctum, et consuetúdinis desidérium
    tólleret. Cum enim essent orbis terrárum curam susceptúri, simul ámplius
    esse non oportébat: magnum enim fuísset mundo detriméntum. Idcírco inquit:
    Opus suscepísti, id consídera: pérfice, labóra, et te certamínibus expóne.
    Quid ad te, si volo eum manére hic? tu offícium tuum cura, et exséquere."
  - "&teDeum"
