evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 10:23-28."
  - "In illo témpore: Dixit Jesus discípulis suis: Cum persequéntur vos in
    civitáte ista, fúgite in áliam. Amen, dico vobis, non consummábitis
    civitátes Israël, donec véniat Fílius hóminis. Non est discípulus super
    magístrum nec servus super Dominum suum. Súfficit discípulo, ut sit sicut
    magíster ejus: et servo, sicut dóminus ejus. Si patremfamílias Beélzebub
    vocavérunt; quanto magis domésticos ejus? Ne ergo timuéritis eos. Nihil enim
    est opértum, quod non revelábitur: et occúltum, quod non sciétur. Quod dico
    vobis in ténebris, dícite in lúmine: et quod in aure audítis, prædicáte
    super tecta. Et nolíte timére eos, qui occídunt corpus, ánimam autem non
    possunt occídere: sed pótius timéte eum, qui potest et ánimam et corpus
    pérdere in gehénnam."
secreta:
  - "Réspice, Dómine, immaculátam hóstiam, quam tibi offérimus: et præsta; ut,
    méritis beáti Pontíficis et Confessóris tui Cyrílli, eam mundo corde
    suscípere studeámus."
  - $Per Dominum
postcommunio:
  - "Sacraménta Córporis et Sánguinis tui, quæ súmpsimus, Dómine Jesu Christe:
    beáti Cyrílli Pontíficis précibus, mentes et corda nostra sanctíficent; ut
    divínæ consórtes natúræ éffici mereámur:"
  - $Qui vivis
name:
  - Cyrille
lectio4:
  - Cyrillus Hierosolymitanus a teneris annis divinarum scripturarum studio
    summopere deditus, adeo in earum scientia profecit, ut orthodoxæ fidei
    strenuus assertor evaserit. Monasticis institutis imbutus, perpetuæ
    continentiæ, omnique severiori vivendi rationi se addictum voluit. Postquam
    a sancto Maximo Hierosolymæ episcopo presbyter ordinatus fuit, munus verbi
    divini fidelibus prædicandi et catechumenos edocendi summa cum laude
    implevit, atque illas vere mirandas conscripsit catecheses, quibus totam
    ecclesiasticam doctrinam dilucide et copiose complexus, singula religionis
    dogmata contra fidei hostes solide propugnavit. Ita vero in his enucleate et
    distincte disseruit, ut non solum jam exortas hæreses, sed futuras étiam
    quasi præsagiens everterit, quemadmodum præstitit asserendo Corporis et
    Sanguinis Christi realem præsentiam in mirabili Eucharistiæ sacramento. Vita
    autem functo sancto Maximo, a provinciæ episcopis in illius locum suffectus
    est.
lectio5:
  - In episcopatu injurias multas et calamitates, non secus ac beatus
    Athanasius, cui cœvus erat, ab Arianorum factionibus fidei causa perpessus
    fuit. Hi enim ægre ferentes Cyrillum vehementer hæresibus obsistere, ipsum
    calumniis aggrediuntur, et in conciliabulo depositum e sua sede deturbant.
    Quorum furori ut se subtraheret, Tarsum Ciliciæ aufugit, et quoad vixit
    Constantius, exsilii rigorem pertulit. Post illius mortem, Juliano Apostata
    ad imperium evecto, Hierosolymam redire potuit, ubi ardenti zelo gregi suo
    ab erroribus et a vitiis revocando operam navavit. Sed iterum, Valente
    imperatore, exsulare coactus est, donec, reddita Ecclesiæ pace per
    Theodosium Magnum, et Arianorum crudelitate audaciaque repressa, ab eodem
    imperatore tamquam fortissimus Christi athleta honoribus susceptus suæ sedi
    restitutus fuit. Quam strenue et sancte sublimis officii sui munia
    impleverit, luculenter apparet ex florenti tunc temporis Hierosolymitanæ
    ecclesiæ statu, quem sanctus Basilius loca sancta veneraturus, ibi
    aliquamdiu commoratus, describit
lectio6:
  - Venerandi hujus præsulis sanctitatem cælestibus signis a Deo fuísse
    illustratam memoriæ traditum accepimus. Inter hæc recensetur præclara
    crucis, solis radiis fulgentioris, apparitio, quæ episcopatus ejus initia
    decoravit. Hujusmodi prodigii ethnici et Christiani testes oculares fuerunt
    cum ipso Cyrillo qui gratiis primum in Ecclesia Deo redditis, illud per
    epistolam Constantio imperatori narravit. Nec minus admiratione dignum, quod
    Judæis templum a Tito eversum restaurare ex impio imperatoris Juliani jussu
    conantibus, evenit. Vehementi enim terræmotu oborto, et ingentibus flammarum
    globis e terra erumpentibus, omnia opera ignis consumpsit, ita ut Judæi et
    Julianus deterriti, ab incepto destiterint; prout scilicet indubitanter
    futurum Cyrillus prædixerat. Qui demum paulo ante obitum Concilio œcumenico
    Constantinopolitano interfuit, in quo Macedonii hæresis, et iterum Ariana
    condemnata est. Ac Jerúsalem inde reversus, fere septuagenarius, trigesimo
    quinto sui episcopatus anno sancto fine quievit. Ejus Officium ac Missam Leo
    decimus tertius Pontifex Maximus ab universa Ecclesia celebrari mandavit.
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum.
  - "!Matt 10:23-28"
  - "In illo témpore: Dixit Jesus discipulis suis: Cum persequentur vos in
    civitate ista, fugite in aliam. Et réliqua."
  - _
  - Homilia sancti Athanasii Epíscopi.
  - "!In Apologia de fuga sua, ante med."
  - "In lege præceptum erat ut constituerentur civitates refugiorum, ut qui
    quomodocumque ad necem quærerentur, servari possent. In consummatione porro
    sæculorum cum advenisset illud ipsum Verbum Patris, quod Moysi antea locutum
    fuerat, rursus hoc præceptum dedit: Cum vos, inquiens, persecuti fuerint in
    civitate ista, fugite in aliam. Pauloque post subjicit: Cum videritis illam
    abominationem desolationis quæ dicta est per Danielem prophetam,
    consistentem in loco sancto (qui legit, intelligat), tunc qui in Judǽa sunt
    fugiant ad montes et qui in tecto est, ne descendat tollere aliquid de domo
    sua: et qui in agro est, non revertatur tollere tunicam suam."
