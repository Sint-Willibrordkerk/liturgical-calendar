lectio1:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 21:15-17"
  - "In illo témpore: Dixit Jesus Simóni Petro: Simon Joánnis, díligis me plus
    his? Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tractatus 123 in Joannem, in medio"
  - "Rédditur negatióni trinæ trina conféssio, ne minus amóri lingua sérviat,
    quam timóri: et plus vocis elicuísse videátur mors ímminens, quam vita
    præsens. Sit amóris offícium páscere Domínicum gregem, si fuit timóris
    indícium negáre pastórem. Qui hoc ánimo pascunt oves Christi, ut suas velint
    esse, non Christi, se convincúntur amáre, non Christum: vel gloriándi vel
    dominándi, vel acquiréndi cupiditáte; non obediéndi, et subveniéndi, et Deo
    placéndi caritáte."
lectio2:
  - Contra hos ergo vígilat tótidem inculcáta ista vox Christi, quos Apóstolos
    gemit sua quǽrere, non quæ Jesu Christi. Nam quid est áliud, si díligis me,
    pasce oves meas; quam si dicerétur, si me díligis, non te páscere cógita?
    Sed oves meas, et sicut meas pasce, non sicut tuas; glóriam meam in eis
    quære, non tuam; domínium meum, non tuum; lucra mea, non tua; ne sis in
    eórum societáte qui pértinent ad témpora periculósa, seípsos amántes, et
    cétera quæ huic malórum inítio connectúntur.
lectio3:
  - "Mérito dícitur Petro: díligis me, et respóndet, amo te, eíque refértur,
    pasce agnos meos, et hoc íterum, hoc tértio. Ubi étiam demonstrátur unum
    atque idem esse amórem et dilectiónem; nam étiam Dóminus novíssime non ait,
    díligis me, sed amas me. Non ergo nos, sed ipsum amémus, et in pascéndis
    óvibus ejus ea quæ sunt ejus, non ea quæ sunt nostra, quærámus. Néscio enim
    quo inexplicábili modo, quisquis seípsum, non Deum amat, non se amat: et
    quisquis Deum, non seípsum, amat, ipse se amat. Qui enim non potest vívere
    de se, móritur útique amándo se: non ergo se amat, qui ne vivat se amat."
