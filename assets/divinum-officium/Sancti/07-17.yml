lectio4:
  - Aléxius, Romanórum nobilíssimus, propter exímium Jesu Christi amórem prima
    nocte nuptiárum peculiari Dei mónitu relínquens intactam sponsam, illustrium
    orbis terræ ecclesiárum peregrinatiónem suscépit. Quibus in itinéribus cum
    ignotus septémdecim annos fuísset, aliquándo apud Edessam, Syriæ urbem, per
    imáginem sanctíssimæ Maríæ Vírginis, ejus nómine divulgato, inde navi
    discessit. Ad portum Romanum appulsus, a patre suo tamquam alienus pauper
    hospítio accipitur; apud quem, ómnibus incógnitus, cum decem et septem annos
    vixísset, relícto scripto sui nóminis, sánguinis, ac totius vitæ cursus,
    migrávit in cælum, Innocentio primo summo Pontifice.
