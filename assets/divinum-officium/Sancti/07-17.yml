lectio94:
  - Aléxius, Romanórum nobilíssimus, propter exímium Jesu Christi amórem prima
    nocte nuptiárum peculiári Dei mónitu relínquens intáctam sponsam, illústrium
    orbis terræ ecclesiárum peregrinatiónem suscépit. Quibus in itinéribus cum
    ignótus septémdecim annos fuísset, aliquándo apud Edéssam, Syriæ urbem, per
    imáginem sanctíssimæ Maríæ Vírginis, ejus nómine divulgáto, inde navi
    discéssit. Ad portum Románum appúlsus, a patre suo tamquam aliénus pauper
    hospítio accípitur; apud quem, ómnibus incógnitus, cum decem et septem annos
    vixísset, relícto scripto sui nóminis, sánguinis, ac totíus vitæ cursus,
    migrávit in cælum, Innocéntio primo summo Pontífice.
