oratio:
  - "Deus, qui beátæ Annæ grátiam conférre dignatus es, ut Genetrícis unigéniti
    Fílii tui mater effici mererétur: concéde propítius; ut, cujus sollémnia
    celebrámus, ejus apud te patrocíniis adjuvémur."
  - $Per eundem
