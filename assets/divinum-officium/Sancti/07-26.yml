postcommunio:
  - "Cœléstibus sacraméntis vegetáti, quǽsumus, Dómine, Deus noster: ut,
    intercessióne beátæ Annæ, quam Genetrícis Fílii tui matrem esse voluísti, ad
    ætérnam salútem perveníre mereámur."
  - $Per eundem
