secreta:
  - "Sacrifíciis præséntibus, quǽsumus, Dómine, placatus inténde: ut per
    intercessiónem beátæ Annæ, quæ Genetrícis Fílii tui, Dómini nostri Jesu
    Christi, mater éxstitit, et devotióni nostræ profíciant et salúti."
  - $Per eundem
