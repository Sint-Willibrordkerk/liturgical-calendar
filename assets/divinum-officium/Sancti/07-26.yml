lectio4:
  - Sermo sancti Joánnis Damascéni
  - "!Oratio 2 de Nativ. B. Mariæ, prope finem"
  - "Propónitur nobis Annæ thálamus, conjugális vitæ simul et virginitátis
    formam réferens, illam matris, hanc fíliæ: quarum áltera recens sterilitáte
    liberáta est, áltera autem aliquánto post, Christi partum, ad nostræ natúræ
    conditiónem divíno opifício formátum, supra natúram est editúra. Mérito
    ígitur Anna, divíno Spíritu plena, læto hilaríque ánimo pérsonat: Congaudéte
    mecum, quæ promissiónis germen ex stérili ventre péperi, ac benedictiónis
    fructum ubéribus meis, ut optáveram, nútrio. Sterilitátis mæstítiam, éxui,
    ac lætum fecunditátis vestem índui. Congáudeat mecum hódie Anna illa,
    Phenénnæ adversária, et novum hoc atque inopinátum miráculum, quod in me
    gestum est, suo exémplo concélebret."
lectio5:
  - "Exsúltet Sara, seníli gáudio géstiens, meúmque ab sterilitáte concéptum
    præfigúrans. Cóncinant simul stériles et infecúndæ visitatiónem meam,
    admirábili modo cǽlitus factam. Dicant item matres omnes hac fecunditáte
    prǽditæ: Benedíctus, qui orántibus id quod optábant, largítus est, et
    fecunditátem stérili dedit, ac felicíssimum illud germen Vírginis concéssit,
    quæ Mater Dei secúndum carnem fuit, cujus venter cælum est, in qua habitávit
    is qui nullo loco capi potest. Cónsonam his nos quoque ipsi, quæ vocabátur
    sterilis nunc autem virgínei thálami mater éxstitit, laudem offerámus.
    Dicámus ad eam cum Scriptúra: Quam beáta domus David, ex qua prodiísti, et
    venter, in quo Deus sanctificatiónis arcam, hoc est, eam a qua ipse sine
    semine concéptus est, fabricávit."
lectio6:
  - Vere beáta es, ac ter beáta, quæ beatitúdine donátam a Deo infántem, hoc
    est, Maríam, nómine quoque ipso magnópere venerándam, peperísti; ex qua
    Christus vitæ flos éxstitit, cujus Vírginis et gloriósus fuit ortus, et
    partus mundo sublímior. Nos quoque, o beatíssima fémina, tibi gratulámur;
    étenim nostrum ómnium spem divínitus concéssam, hoc est, promissiónis fœtum
    peperísti. Beáta revéra es, et beátus fructus ventris tui. Piórum autem
    lingua germen tuum magníficat, ac sermo omnis lætus partum tuum prǽdicat.
    Dignum sane quidem, ac máxime dignum est eam laudáre, quæ divína benignitáte
    oráculum accépit, ac talem et tantum nobis fructum édidit, ex quo dulcis
    Jesus pródiit.
