lectio93:
  - "!Commemoratio pro Ss. Mart. Proto et Hyacintho."
  - Protus et Hyacinthus fratres, beátæ Eugeniæ Vírginis eunuchi, una cum illa
    ab Héleno episcopo baptizati, ac stúdiis déditi divinárum litterárum,
    aliquámdiu in Ægypto inter ascetas mira humilitate et vitæ sanctitáte
    vixérunt. Sed póstea, sanctam Vírginem Eugeniam Romam prosecuti, Gallieno
    imperatóre, in Urbe propter christianæ fidei professiónem comprehénsi sunt.
    A quibus cum nullo modo impetrari posset ut, christianam religiónem
    deseréntes, deos cólerent, acerbis verbéribus cæsi, secúri feriúntur tertio
    Idus Septembris.
  - "&teDeum"
