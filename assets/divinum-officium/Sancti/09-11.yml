rule:
  - vide C3a-1
  - Gloria
oratio:
  - "Beatórum Mártyrum tuórum Proti et Hyacínthi nos, Dómine, fóveat pretiósa
    conféssio: et pia júgiter intercéssio tueátur."
  - $Per Dominum
secreta:
  - "Pro sanctórum Mártyrum tuórum Proti et Hyacínthi commemoratióne, múnera
    tibi, Dómine, quæ debémus, exsólvimus: præsta, quǽsumus; ut remédium nobis
    perpétuæ salútis operéntur."
  - $Per Dominum
postcommunio:
  - "Ut percépta nos, Dómine, tua sancta puríficent: beatórum Mártyrum tuórum
    Proti et Hyacínthi, quǽsumus, ímploret orátio."
  - $Per Dominum
