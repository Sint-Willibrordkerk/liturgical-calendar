lectio93:
  - Faustinus et Jovita fratres, nobiles Brixiani, in multis Italiæ urbibus, quo
    vincti sæviente Trajani persecutione ducebantur, acerbissima supplicia
    perpessi, fortes in christianæ fidei confessione perstiterunt. Nam Brixiæ
    diu vinculis constricti, feris étiam objecti in ignemque conjecti, et a
    bestiis et a flamma íntegri et incolumes servati sunt. Inde vero eisdem
    catenis colligati Mediolanum venerunt; ubi eorum fides tentata
    exquisitissimis tormentis, tamquam igne aurum, in cruciatibus magis enituit.
    Postea Romam missi, ab Evaristo Pontifice confirmati, ibi quoque
    crudelissime torquentur. Denique perducti Neápolim, in ea étiam urbe varie
    cruciati, vinctis manibus pedibusque in mare demerguntur; unde per Angelos
    mirabiliter erepti sunt. Quare multos et constantia in tormentis et
    miraculorum virtute ad Christi fidem converterunt. Postrémo reducti Brixiam
    initio suscepti ab Hadriano imperii, securi percussi, illustrem martyrii
    coronam acceperunt.
  - "&teDeum"
