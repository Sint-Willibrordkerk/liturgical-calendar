lectio93:
  - Remigius, epíscopus Rheménsis, flóruit Clodovéo rege Francórum; quem étiam
    baptizávit, et, primus ómnium, doctrina et miraculis Francos ad Christi
    Dómini fidem perdúxit. Ejus oratióne, mortua puella revixit. Multos
    interpretátus est divinæ Scripturæ libros. Amplius septuagínta annos summa
    cum laude Rhemensem ecclésiam administrávit. Cujus vita et mortis
    sanctitátem multa, quæ consecuta sunt, miracula comprobarunt.
  - "&teDeum"
