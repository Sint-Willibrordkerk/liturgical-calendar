evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 12:46-50"
  - "In illo témpore: Loquente Jesu ad turbas, ecce, Mater ejus et fratres
    stabant foris, quæréntes loqui ei. Dixit autem ei quidam: Ecce, mater tua et
    fratres tui foris stant, quæréntes te. At ipse respóndens dicénti sibi, ait:
    Quæ est mater mea et qui sunt fratres mei? Et exténdens manum in discípulos
    suos, dixit: Ecce mater mea et fratres mei. Quicúmque enim fécerit
    voluntátem Patris mei, qui in cœlis est: ipse meus frater et soror et mater
    est."
