  - "1"
  - "@C3"
lectio4:
  - "Septem fratres, fílii sanctæ Felicitátis, Romæ in persecutióne Marci
    Aurélii Antonini a Publio præfécto primum blandítiis, deínde terróribus
    tentati, ut Christo renuntiántes, deos veneraréntur; et, sua virtúte, et
    matre hortante, in fidei confessióne perseverántes, varie necáti sunt.
    Januarius plumbátis cæsus; Felix et Philippus fustibus contusi; Silvanus ex
    altíssimo loco præceps dejéctus est; Alexander, Vitalis et Martialis cápite
    plectúntur. Mater eórum quarto post mense eamdem martyrii palmam consecuta
    est: illi sexto Idus Julii spíritum Dómino reddidérunt."
lectio5:
  - "Rufina et Secunda sorores, vírgines Romanæ, rejecto connubio Armentárii et
    Verini, quibus a paréntibus desponsæ fuerant, quod Jesu Christo virginitátem
    vovissent, Valeriáno et Gallieno imperatóribus, comprehendúntur. Quas cum
    nec promissis nec terróre Juníus præfectus a proposito posset abducere,
    Rufinam primum virgis cædi jubet; in cujus verbéribus Secunda judicem sic
    interpellat: Quid est, quod sorórem meam honore, me áfficis ignomínia? Jube
    ambas simul cædi, quæ simul Christum Deum confitemur. Quibus verbis incénsus
    judex imperat utramque detrudi in tenebricósum et fœtidum carcerem. Quo loco
    statim claríssima luce et suavíssimo odore completo, in ardénte balnei solio
    includúntur. Et cum inde étiam integræ evasissent, mox saxo ad collum
    alligato in Tiberim projectæ sunt; unde ab Angelo liberátæ, extra Urbem via
    Aurelia milliario décimo, cápite plectúntur. Quarum corpora, a Plautilla
    matrona in ejus prædio sepúlta, ac póstea in Urbem translata, in basilica
    Constantiniana prope baptistérium cóndita sunt."
lectio6:
  - Sermo sancti Augustíni Epíscopi
  - "!Sermo 110 de diversis"
  - "Magnum spectaculum, fratres, positum est ante óculos fidei nostræ. Aure
    audívimus, corde vídimus optántem matrem ante se finire istam vitam fílios
    suos, longe contrariis votis consuetudini humanæ. Omnes enim hómines fílios
    suos, ex hac vita migrando, præcedere volunt, non sequi; illa autem optávit
    posterior mori. Non enim ammitebat fílios, sed præmittebat; nec intuebátur
    quam vitam finirent, sed quam inchoarent. Desinébant enim vivere, ubi
    quandoque fuerant morituri; et incipiébant vivere, sine fine victuri. Parum
    est fuísse spectatricem; miráti sumus potius hortatricem. Fœcundior
    virtútibus quam fœtibus: videns certántes, in quibus omnibus ipsa certabat,
    et in omnibus vincéntibus ipsa vincebat."
lectio94:
  - Septem Fratres, fílii sanctæ Felicitátis, Romæ in persecutióne Marci Aurélii
    Antoníni a Públio præfécto frustra tentáti, ut idóla veneraréntur, sexto
    idus júlii, ipsa fortíssima matre eos ad martýrium hortánte várie necáti
    sunt. Januárius plumbátis cæsus; Felix et Philíppus fústibus contúsi;
    Silvánus ex altíssimo loco præceps dejéctus est; Alexánder, Vitális et
    Martiális cápite plectúntur. Mater dénique, quarto post mense, eándem
    martýrii palmam consecúta est. Rufína et Secúnda soróres, vírgines Románæ,
    rejécto connúbio Armentárii et Veríni, quod virginitátem Christo vovíssent,
    Valeriáno et Galliéno imperatóribus, comprehénsæ, Júnii præfécti a
    blandítiis et minis a propósito mínime abdúctæ, vário tormentórum génere
    afflíctæ sunt. Cum vero, ab Angelis custodítæ, in sancto propósito
    perseverárent, via Aurélia, milliário décimo, cápite plectúntur. Quarum
    córpora, a Plautílla matróna in ejus prǽdio extra Urbem sepúlta, póstea in
    basílica Constantiniána prope baptistérium cóndita sunt.
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 12:46-50"
  - "In illo témpore: Loquénte Jesu ad turbas, ecce Mater ejus et fratres
    stabant foris quæréntes loqui ei. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 3 in Evangelia"
  - "Sancti Evangélii, fratres caríssimi, brevis est léctio recitata, sed magnis
    mysteriórum pondéribus grávida. Jesus étenim, cónditor et redémptor noster,
    Matrem se nosse dissimulat, et quæ ei mater sit et qui propinqui, non per
    cognatiónem carnis, sed per conjunctiónem spíritus designat, dicens: Quæ est
    mater mea, et qui sunt fratres mei? Quicúmque enim fécerit voluntátem Patris
    mei, qui in cælis est, ipse meus frater, et soror, et mater est. Quibus
    nobis verbis quid aliud innuit, nisi quod obsequéntes jussiónibus suis
    multos ex Gentilitate colligit; et Judǽam, ex cujus carne est génitus, non
    agnoscit?"
lectio8:
  - "Sed cum is, qui voluntátem Patris fécerit, soror et frater Dómini dícitur,
    propter utrumque sexum qui ad fidem collígitur, mirum non est; mirándum vero
    valde est, quómodo étiam mater dicátur. Fideles enim discipulos fratres
    vocare dignátus est, dicens: Ite, nuntiáte frátribus meis. Qui ergo frater
    Dómini fíeri ad fidem veniéndo potúerit, quæréndum est quómodo étiam et
    mater esse possit."
lectio9:
  - Sed sciéndum nobis est, quia qui Christi soror et frater est credendo, mater
    effícitur prædicando. Quasi enim parit Dóminum, quem cordi audiéntis
    infuderit; et mater ejus prædicando effícitur, si per ejus vocem amor Dómini
    in próximi mente generátur. Ad quam rem nobis idónee confírmandam adest
    beáta Felícitas, cujus hódie natalícia celebramus, quæ credéndo exstitit
    ancílla Christi, et prædicando facta est mater Christi. Septem quippe
    fílios, sicut in gestis ejus emendatióribus legitur, sic post se tímuit
    vivos in carne relínquere, sicut carnales paréntes solent metúere ne mórtuos
    præmittant.
  - "&teDeum"
