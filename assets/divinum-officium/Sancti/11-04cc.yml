lectio93:
  - Vitalis et Agricola ejus dominus, in persecutióne Diocletiáni et Maximiáni,
    Bononiæ ob Jesu Christi prædicatiónem comprehénsi sunt. Cumque Vitalis, quo
    magis precibus et minis tentarétur ut senténtiam mutaret, eo magis se
    Christi cultórem ac servum profiterétur; vario tormentórum genere cruciatus,
    constanter ómnia pérferens, in oratióne spíritum Deo réddidit. Agricola
    vero, cum ejus supplícium dilátum esset, si forte, tormentis servi permotus,
    Christo vellet renuntiáre, ejus exemplo magis confirmátus est. Itaque, cruci
    affixus, Vitali servo consors et cosius fuit nobilis martyrii. Eórum
    corpora, ad Judæórum sepúlcra cum essent humata, a sancto Ambrosio invénta,
    in sacrum celebremque locum transláta sunt.
  - "&teDeum"
