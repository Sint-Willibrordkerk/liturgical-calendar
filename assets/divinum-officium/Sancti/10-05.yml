lectio93:
  - Plácidus Romæ, Tertúlllo patre in primis nóbili, natus, puer Deo oblátus et
    sancto Benedícto tráditus, tantum ejus disciplína et monásticæ vitæ
    institútis profécit, ut inter præcípuos illíus discípulos numerétur. Ab eo
    in Sicíliam missus, monastérium et ecclésiam in honórem sancti Joánnis
    Baptístæ prope Messánæ portum constrúxit, ubi cum mónachis admirábili
    sanctitáte vixit. Ejus viséndi causa cum eo veníssent Eutychius et
    Victorínus, illíus fratres, et Flávia, virgo soror, eódem témpore illuc
    áppulit immánis quidam piráta, Manúcha nómine; qui, capto monastério, cum
    Plácidum et céteros nullo modo addúcere potuísset ut Christum negárent,
    ipsum fratrésque illíus ac sorórem crudéliter necári jussit. Cum quibus
    étiam Donátus, Firmátus diáconus, Faustus aliíque trigínta mónachi, martyrii
    agónem felíciter consummárunt tértio Nonas Octóbris, anno salútis
    quingentésimo trigésimo nono.
  - "&teDeum"
