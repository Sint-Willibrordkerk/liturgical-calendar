secreta:
  - "Da nobis, clementíssime Jesu: ut præclára beáti Francísci mérita
    recoléntes, eódem nos, ac ille, caritátis igne succénsi, digne in circúitu
    sacræ hujus mensæ tuæ esse valeámus:"
  - $Qui vivis
communio:
  - "!Ps 30:20"
  - Quam magna multitúdo dulcédinis tuæ, Dómine, quam abscondísti timéntibus te!
    (Allelúja.)
postcommunio:
  - Sacrosáncta sacrifícii, quǽsumus, Dómine, quod hódie in sollemnitáte beáti
    Francísci tuæ obtúlimus majestáti, grata semper in méntibus nostris memória
    persevéret et fructus.
  - $Per Dominum
lectio4:
  - Francíscus, dictus ántea Ascánius, ex nóbili família Carácciolo in óppido
    sanctæ Maríæ de Villa in Aprútio ortus, a primis annis exímio enítuit
    pietátis cultu. Adoléscens gráviter ægrótans státuit sese prorsus Dei
    proximíque mancipáre servítio. Neápolim proféctus, sacerdótio initiátus
    sacróque adscríptus sodalítio, contemplatióni lucrandísque animábus se totum
    devóvit, ac extrémo supplício damnátis hortatórem se præbuit assíduum.
    Cóntigit autem, ut epístolum álteri destinátum ei per errórem redderétur,
    quo a piíssimis viris Joánne Augustíno Adórno et Fabrício Carácciolo ad novi
    religiósi institúti fundatiónem vocabátur. Rei novitáte captus et divínæ
    voluntátis demirátus consília, álacri ánimo sese illis adjúnxit. Cónditis
    autem in Camaldulénsium erémo, quo secésserant, novi órdinis légibus, inde
    Romam simul profécti confirmatiónem a Xysto quinto impetrárunt, qui eósdem
    cléricos reguláres Minóres appellári vóluit, áddito ad tria consuéta áltero
    de non ambiéndis dignitátibus voto.
lectio5:
  - "Solémni emíssa professióne, ob singulárem ejus in divum Francíscum
    Assisinátem cultum, Francísci nomen assúmpsit. Adórno biénnio post vita
    functo, ipse toti religióni, quamquam invítus, præfícitur; quo in múnere
    virtútum ómnium præclára præbuit exémpla. Institúti amplificándi
    studiosíssimus, id assíduis oratiónibus, lácrimis, et jugi córporis
    maceratióne eníxe a Deo postulábat. Quam ob rem tértio in Hispániam se
    cóntulit, peregríni hábitu indútus, victúmque ostiátim mendícans. In itínere
    aspérrima quæque perpéssus, Omnipoténtis auxílium mirum in modum expértus,
    navim quam conscénderat, ab imminénti naufrágio oratiónis præsídio servávit
    incólumem. Ut in regnis illis voti compos fíeret, plúrimum laborávit; sed,
    ejus sanctitátis fama prælucénte, amplissimáque catholicórum regum Philíppi
    secúndi et Philíppi tértii munificéntia, adversariórum conátibus singulári
    ánimi fortitúdine superátis, plura sui órdinis domicília fundávit: quod pari
    evéntu per Itáliam præstitit."
lectio6:
  - "Humilitáte ádeo excélluit, ut Romam véniens, in páuperum hospítio recéptus,
    se lepróso sociáverit, et ecclesiásticas dignitátes a Paulo quinto sibi
    oblátas constantíssime recusáverit. Illibátam perpétuo servávit
    virginitátem, effrontésque mulíeres, ejus castimóniæ insidiántes, Christo
    lucrifécit. Erga diviníssimum Eucharístiæ mystérium ardénti æstuans amóre,
    noctes pene íntegras in ejus adoratióne insómnes ducébat: quod pium
    exercítium, véluti sui órdinis tésseram, in eo perpétuo servándum
    constítuit. Deíparæ Vírginis cultum impénse fovit. In próximum exímia
    exársit caritáte. Prophetíæ dono et córdium scrutatióne ditátus fuit.
    Quadragésimum quartum ætátis suæ annum agens, dum in sacra Lauretána, æde in
    oratióne persísteret, sibi vitæ finem imminére cognóvit. Aprútium statim
    defléxit, et in óppido Agnóni apud alúmnos sancti Philíppi Nerii letháli
    febre corréptus, sacraméntis Ecclésiæ devotíssime suscéptis, prídie Nonas
    Júnii anni millésimi sexcentésimi octávi, in pervigílio festi Córporis
    Christi, placidíssime obdormívit in Dómino. Sacrum ejus corpus, Neápolim
    delátum, in ecclésia sanctæ Maríæ Majóris, ubi prima sui órdinis jécerat
    fundaménta, honorífice cónditum fuit. Eum póstea, miráculis clarum, Clemens
    decimus quartus Póntifex máximus solémni ritu inter Beátos; Pius vero
    séptimus Póntifex máximus, novis fulgéntem signis, anno millésimo
    octingentésimo séptimo, Sanctórum albo adscrípsit."
lectio94:
  - Francíscus, dictus ántea Ascánius, ex nóbili família Carácciolo, in óppido
    sanctæ Maríæ de Villa in Aprútio ortus est. Adoléscens gráviter ægrótans
    státuit sese prorsus Dei proximíque mancipáre servítio. Neápolim proféctus
    et sacerdótio initiátus, contemplatióni lucrandísque animábus se totum
    devóvit, ac extrémo supplício damnátis hortatórem se prǽbuit assíduum.
    Joánni Augustíno Adórno et Fabrício Carácciolo, mira Dei dispositióne,
    adjúnctus, Clericórum regulárium Minórum órdinem instítuit, áddito ad tria
    consuéta áltero de non ambiéndis dignitátibus voto; quem, post óbitum
    Adórni, sanctíssime rexit, et summo stúdio per Hispániam et Itáliam
    propagávit. Erga sanctíssimæ Eucharístiæ sacraméntum tanto æstuábat afféctu,
    ut noctes pene íntegras in ejus adoratióne impénderet; quod pium exercítium,
    véluti sui órdinis tésseram, perpétuo in eo servándum constítuit. Tandem
    prophetíæ dono et córdium scrutatióne ditátus, quadragésimum quartum annum
    agens, in óppido Agnóni in Aprútio letháli febre corréptus, in Dómino
    obdormívit prídie nonas júnii, anno millésimo sexcentésimo octávo. Sacrum
    ejus corpus, Neápolim delátum, in ecclésia sui órdinis cónditum est.
  - "&teDeum"
