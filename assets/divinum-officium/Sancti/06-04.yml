oratio:
  - "Deus, qui beátum Francíscum, novi órdinis institutórem, orándi stúdio et
    pœniténtiæ amóre decorásti: da fámulis tuis in ejus imitatióne ita
    profícere; ut, semper orántes et corpus in servitútem redigéntes, ad
    cœléstem glóriam perveníre mereántur."
  - $Per Dominum
lectio:
  - Léctio libri Sapiéntiæ
  - "!Sap 4:7-14"
  - "Justus, si morte præoccupátus fúerit, in refrigério erit. Senéctus enim
    venerábilis est non diutúrna, neque annórum número computáta: cani autem
    sunt sensus hóminis, et ætas senectútis vita immaculáta. Placens Deo Jactus
    est diléctus, et vivens inter peccatóres translátus est. Raptus est, ne
    malítia mutáret intelléctum ejus, aut ne fíctio decíperet ánimam illíus.
    Fascinátio enim nugacitátis obscúrat bona, et inconstántia concupiscéntiæ
    transvértit sensum sine malítia. Consummátus in brevi explévit témpora
    multa, plácita enim erat Deo ánima illíus: propter hoc properávit edúcere
    illum de médio iniquitátum."
