officium:
  - S. Abdon et Sennen Martyrum
rank:
  - ""
  - Simplex
  - "1.1"
  - "@C3"
rule:
  - vide C3;
  - Gloria
oratio:
  - "Deus, qui sanctis tuis Abdon et Sennen ad hanc glóriam veniéndi copiósum
    munus grátiæ contulísti: da fámulis tuis suorum véniam peccatórum; ut,
    Sanctórum tuórum intercedéntibus méritis, ab ómnibus mereántur
    adversitátibus liberáti."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Corínthios
  - "!2 Cor 6:4-10"
  - "Fratres: Exhibeámus nosmetípsos sicut Dei minístros, in multa patiéntia, in
    tribulatiónibus, in necessitátibus, in angústiis, in plagis, in carcéribus,
    in seditiónibus, in labóribus, in vigíliis, in jejúniis, in castitáte, in
    sciéntia, in longanimitáte, in suavitáte, in Spíritu Sancto, in caritáte non
    ficta, in verbo veritátis, in virtúte Dei, per arma justítiæ a dextris et a
    sinístris: per glóriam et ignobilitátem: per infámiam et bonam famam: ut
    seductóres et veráces: sicut qui ignóti et cógniti: quasi moriéntes et ecce,
    vívimus: ut castigáti et non mortificáti: quasi tristes, semper autem
    gaudéntes: sicut egéntes, multos autem locupletántes: tamquam nihil habéntes
    et ómnia possidéntes."
graduale:
  - "!Exodi 15:11"
  - "Gloriosus Deus in Sanctis suis: mirábilis in majestáte, fáciens prodígia."
  - "!Exod 15:6"
  - "Déxtera tua. Dómine, glorificáta est in virtúte: déxtera manus tua
    confrégit inimícos."
  - Allelúja, allelúja.
  - "!Ps 3:1"
  - Justórum ánimæ in manu Dei sunt, et non tanget illos torméntum malítiæ.
    Allelúja.
evangelium:
  - "@Sancti/06-05"
offertorium:
  - "@Commune/C3"
secreta:
  - "Hæc hóstia, quǽsumus, Dómine, quam sanctórum Mártyrum tuórum natalítia
    recenséntes offérimus: et víncula nostræ pravitátis absolvat, et tuæ nobis
    misericórdiæ dona concíliet."
  - $Per Dominum
communio:
  - "!Ps 78:2 & 11"
  - "Posuérunt mortália servórum tuórum, Dómine, escas volatílibus cœli, carnes
    Sanctórum tuórum béstiis terræ: secúndum magnitúdinem bráchii tui pósside
    fílios morte punitórum."
postcommunio:
  - "Per hujus, Dómine, operationem mystérii, et vitia nostra purgéntur: et,
    intercedéntibus sanctis Martyribus tuis Abdon et Sennen, justa desidéria
    compleántur."
  - $Per Dominum
lectio93:
  - Abdon et Sennen Persæ, Decio imperatóre, accusáti quod córpora
    Christianórum, quæ inhumáta projiciebántur, in suo prædio sepelissent, jussu
    imperatóris comprehendúntur, et diis jubéntur sacrificare. Quod cum fácere
    neglígerent, et Jesum Christum Deum constantíssime prædicarent, tráditos in
    arctam custódiam, Romam póstea rédiens Decius vinctos duxit in triumpho. Qui
    cum in Urbe ad simulacra attracti essent, ea detestáti conspuérunt. Quam ob
    rem ursis ac leónibus objecti sunt; quos feræ non audébant attingere. Demum,
    gládiis trucidati, colligátis pédibus tracti sunt ante solis simulacrum.
    Quorum corpora, clam inde asportata, Quirínus diaconus sepelívit in suis
    ædibus.
  - "&teDeum"
