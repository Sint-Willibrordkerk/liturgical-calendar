lectio93:
  - Felix, Diocletiano et Maximiano imperatoribus, propter susceptam Christi
    religionem comprehensus, in Serapidis templum adductus est. Cui sacrificare
    cum juberetur, os simulacri conspuit. Quo facto, statim serea statua
    corruit. Quod cum iterum ac tertio in sede Mercurii Dianæque factum esset,
    impietatis et magicæ artis accusatus, equuleo torquetur. Mox ad secundum ab
    Urbe lapidem via Ostiensi ducitur, ut securi feriretur. Cui inter viam
    oblatus quidam Christianus, cum Felicem agnoscens ad martyrium duci videret,
    Ego quoque, clara voce inquit, eadem, qua iste, lege vivo ego eumdem Jesum
    Christum colo. Itaque Felicem osculatus, cum eo securi percutitur, tertio
    Kalendas Septembris. Cujus nomen cum ignotum esset Christianis, is Adaucti
    nomine nobilitatus est, quod sancto Martyri Felici adauctus sit ad coronam
  - "&teDeum"
