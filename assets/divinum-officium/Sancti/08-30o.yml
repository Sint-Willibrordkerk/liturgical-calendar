oratio:
  - "Majestátem tuam, Dómine, súpplices exorámus: ut, sicut nos júgiter
    Sanctórum tuórum commemoratióne lætíficas; ita semper supplicatióne
    deféndas."
  - $Per Dominum
lectio:
  - Léctio libri Sapiéntiæ
  - "!Sap 10:17-20"
  - "Réddidit Deus justis mercédem labórum suorum, et dedúxit illos in via
    mirábili: et fuit illis in velaménto diéi et in luce stellárum per noctem:
    tránstulit illos per Mare Rubrum, et transvéxit illos per aquam nímiam.
    Inimícos autem illórum demérsit in mare, et ab altitúdine inferórum edúxit
    illos. Ideo justi tulérunt spólia impiórum, et decantavérunt, Dómine, nomen
    sanctum tuum, et víctricem manum tuam laudavérunt páriter, Dómine, Deus
    noster."
graduale:
  - "!Sap 3:1-2; 3:3"
  - "Justórum ánimæ in manu Dei sunt: et non tanget illos torméntum malítiæ."
  - "V. Visi sunt óculis insipiéntium mori: illi autem sunt in pace."
  - Allelúja, allelúja.
  - V. Fulgébunt justi, et tamquam scintíllæ in arundinéto discúrrent in
    ætérnum. Allelúja.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 10:16-20"
  - "In illo témpore: Dixit Jesus discípulis suis: Qui vos audit, me audit: et
    qui vos spernit, me spernit. Qui autem me spernit, spernit eum, qui misit
    me. Revérsi sunt autem septuagínta duo cum gáudio, dicéntes: Dómine, étiam
    dæmónia subiiciúntur nobis in nómine tuo. Et ait illis: Vidébam sátanam
    sicut fulgur de cœlo cadéntem. Ecce, dedi vobis potestátem calcándi supra
    serpéntes et scorpiónes, et super omnem virtútem inimíci: et nihil vobis
    nocébit. Verúmtamen in hoc nolíte gaudére, quia spíritus vobis subiiciúntur:
    gaudéte autem, quod nómina vestra scripta sunt in cœlis."
offertorium:
  - "!Ps 31:11"
  - "Lætámini in Dómino et exsultáte, justi: et gloriámini, omnes recti corde."
secreta:
  - "Hóstias, Dómine, tuæ plebis inténde: et, quas in honóre Sanctórum tuórum
    devóta mente celébrat, profícere sibi séntiat ad salútem."
  - $Per Dominum
communio:
  - "!Matt 10:27"
  - "Quod dico vobis in ténebris, dícite in lúmine, dicit Dóminus: et quod in
    aure audítis, prædicáte super tecta."
postcommunio:
  - "Repléti, Dómine, munéribus sacris: quǽsumus: ut, intercedéntibus Sanctis
    tuis, in gratiárum semper actióne maneámus."
  - $Per Dominum
