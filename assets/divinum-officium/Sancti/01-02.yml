rubrica-divino-aut-rubrica-tridentina-aut-rubrica-monastica/oratio:
  - "Omnípotens sempitérne Deus, qui primítias Mártyrum in beati Levítæ Stephani
    sánguine dedicásti: tríbue, quǽsumus; ut pro nobis intercéssor exsístat, qui
    pro suis étiam persecutóribus exorávit Dóminum nostrum Jesum Christum,
    Fílium tuum:"
  - $Qui tecum
rubrica-tridentina/commemoratio-oratio:
  - "!Pro S. Joanne Evangelista"
  - "Ecclésiam tuam, Dómine, benígnus illústra: ut, beáti Joánnis Apóstoli tui
    et Evangelístæ illumináta doctrínis, ad dona pervéniat sempitérna."
  - $Per Dominum
  - "!Pro Ss. Innocentibus"
  - "Deus, cujus hodiérna die præcónium Innocéntes Mártyres non loquéndo, sed
    moriéndo conféssi sunt: ómnia in nobis vitiórum mala mortífica; ut fidem
    tuam, quam lingua nostra lóquitur, étiam móribus vita fateátur."
  - $Per Dominum
rubrica-tridentina/commemoratio-secreta:
  - "!Pro S. Joanne Evangelista"
  - Súscipe, Dómine, múnera, quæ in ejus tibi sollemnitáte deférimus, cujus nos
    confídimus patrocínio liberári.
  - $Per Dominum
  - "!Pro Ss. Innocentibus"
  - "Sanctórum tuórum, Dómine, nobis pia non desit orátio: quæ et múnera nostra
    concíliet, et tuam nobis indulgéntiam semper obtíneat."
  - $Per Dominum
rubrica-tridentina/commemoratio-postcommunio:
  - "!Pro S. Joanne Evangelista"
  - "Refécti cibo potúque cœlésti, Deus noster, te súpplices exorámus: ut, in
    cujus hæc commemoratióne percépimus, ejus muniámur et précibus."
  - $Per Dominum
  - "!Pro Ss. Innocentibus"
  - "Votíva, Dómine, dona percépimus: quæ Sanctórum nobis précibus, et
    præséntis, quǽsumus, vitæ páriter et ætérnæ tríbue conférre subsídium."
  - $Per Dominum
