rubrica-tridentina/commemoratio-2:
  - "!Commemoratio Octavæ S. Joannis"
  - "Ant. Iste est Joánnes, qui supra pectus Dómini in cena recúbuit: beátus
    Apóstolus, cui reveláta sunt secréta cæléstia."
  - _
  - V. Hic est discípulus ille, qui testimónium pérhibet de his.
  - R. Et scimus quia verum est testimónium ejus.
  - _
  - $Oremus
  - "v. Ecclésiam tuam, Dómine, benígnus illústra: ut beáti Joánnis Apóstoli tui
    et Evangelístæ, illumináta doctrínis, ad dona pervéniat sempitérna."
  - $Per Dominum
  - "!Commemoratio Octavæ Ss. Innocentium"
  - "Ant. Hi sunt, qui cum muliéribus non sunt coinquináti: vírgines enim sunt,
    et sequúntur Agnum quocúmque íerit."
  - _
  - V. Heródes irátus occídit multos púeros.
  - R. In Béthlehem Judæ civitáte David.
  - _
  - $Oremus
  - "v. Deus, cujus hodiérna die præcónium Innocéntes Mártyres non loquéndo, sed
    moriéndo conféssi sunt: ómnia in nobis vitiórum mala mortífica; ut fidem
    tuam, quam lingua nostra lóquitur, étiam móribus vita fateátur."
  - $Per Dominum
rubrica-tridentina/ant-vespera-3:
  - "Lapidavérunt Stéphanum, * et ipse invocábat Dóminum, dicens: Ne státuas
    illis hoc peccátum."
  - "Lápides torréntis * illi dulces fuérunt: ipsum sequúntur omnes ánimæ justæ."
  - Adhǽsit ánima mea * post te, quia caro mea lapidáta est pro te, Deus meus.
  - "Stéphanus vidit * cælos apértos, vidit, et introívit: beátus homo, cui cæli
    patébant."
  - Ecce vídeo * cælos apértos, et Jesum stantem a dextris virtútis Dei.
