rubrica-tridentina/lectio1:
  - De Actibus Apostolorum
  - "!Acts 7:51-54"
  - "51 Dura cervíce, et incircumcísis córdibus et áuribus, vos semper Spirítui
    Sancto resístitis: sicut patres vestri, ita et vos."
  - "52 Quem prophetárum non sunt persecúti patres vestri? et occidérunt eos qui
    prænuntiábant de advéntu Justi, cujus vos nunc proditóres et homicídæ
    fuístis:"
  - 53 qui accepístis legem in dispositióne angelórum, et non custodístis.
  - 54 Audiéntes autem hæc, dissecabántur córdibus suis, et stridébant déntibus
    in eum.
rubrica-tridentina/lectio2:
  - "!Acts 7:55-58"
  - "55 Cum autem esset plenus Spíritu Sancto, inténdens in cælum, vidit glóriam
    Dei, et Jesum stantem a dextris Dei. Et ait: Ecce vídeo cælos apértos, et
    Fílium hóminis stantem a dextris Dei."
  - 56 Exclamántes autem voce magna continuérunt aures suas, et ímpetum fecérunt
    unanímiter in eum.
  - "57 Et ejiciéntes eum extra civitátem, lapidábant: et testes deposuérunt
    vestiménta sua secus pedes adolescéntis qui vocabátur Saulus."
  - "58 Et lapidábant Stéphanum invocántem, et dicéntem: Dómine Jesu, súscipe
    spíritum meum."
rubrica-tridentina/lectio3:
  - "!Acts 7:59; 8:1-2"
  - "59 Pósitis autem génibus, clamávit voce magna, dicens: Dómine, ne státuas
    illis hoc peccátum. Et cum hoc dixísset, obdormívit in Dómino. Saulus autem
    erat conséntiens neci ejus."
  - 1 Facta est autem in illa die persecútio magna in ecclésia quæ erat
    Jerosólymis, et omnes dispérsi sunt per regiónes Judǽæ et Samaríæ præter
    Apóstolos.
  - 2 Curavérunt autem Stéphanum viri timoráti, et fecérunt planctum magnum
    super eum.
lectio4:
  - Sermo sancti Augustíni Epíscopi.
  - "!Serm. 2. de S. Stephano."
  - "Post hestérnum festivíssimum diem, quo Salvatóris nostri Christi nobis
    Natívitas illúxit, étiam hodiérnus dies beáti Mártyris Stéphani coróna
    illustrátur. Mártyris illíus mérita nulla pars orbis ignórat: passus enim
    est in ipso princípio Ecclésiæ, id est, in ipsa urbe Jerosólyma. Ibi enim
    Diáconus ministrávit: et in ipso juventútis flore decórem ætátis suæ
    sánguine purpurávit. Pássio ejus insígnis est, multúmque mirábilis. Hanc
    modo de libro Actuum Apostolórum, cum legerétur, non solum audívimus, sed
    étiam óculis spectávimus."
lectio5:
  - Christus ergo caput Mártyrum prior passus est pro nobis, relínquens vobis
    exémplum, ut sequámini vestígia ejus. Cujus passiónis vestígia prosecútus
    beatíssimus Stéphanus, confiténdo Christum lapidátus a Judǽis, corónam
    méruit tamquam suo sibi nómine pósitam. Stéphanus enim Græce, Latíne coróna
    appellátur. Jam coróna nomen habébat, et ídeo palmam martýrii suo nómine
    præferébat.
lectio6:
  - "Qui cum lapidarétur, non solum non exspectábat de persecutóribus reportáre
    vindíctam, sed eis pótius a Deo véniam postulábat. Memínerat enim dixísse
    Dóminum: Mihi vindíctam, ego retríbuam, dicit Dóminus. Et íterum: Ne
    díxeris, Ulcíscar me de inimícis meis; sed exspécta Dóminum, ut tibi auxílio
    sit. Exspectáre nos jubet Dóminus Deus, ut in die futúræ retributiónis cum
    sanctis Martýribus vindicémur."
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 23:34-35"
  - "In illo témpore: Dicébat Jesus scribis et pharisǽis: Ecce ego mitto ad vos
    prophétas, et sapiéntes, et scribas: et ex illis occidétis, et crucifigétis.
    Et réliqua."
  - _
  - Homilía sancti Hierónymi Presbýteri
  - "!Lib. 4. Comment. in cap. 23. Matth."
  - "Jerúsalem, Jerúsalem, quæ occídis prophétas. Jerúsalem, non saxa et
    ædifícia civitátis, sed habitatóres vocat: quam plangit patris afféctu,
    sicut et in álio loco légimus, quod videns eam, fléverit. In eo autem quod
    dicit: Quóties vólui congregáre fílios tuos: omnes retro prophétas a se
    missos esse testátur. Gallínæ quoque similitúdinem congregántis sub alas
    pullos suos, in cántico Deuteronómii légimus: Sicut áquila prótegit nidum
    suum, et super pullos suos desiderávit: expándens alas suas, suscépit eos,
    et tulit super pennas suas."
lectio8:
  - "Ecce relinquétur vobis domus vestra desérta. Hoc ipsum ex persóna Jeremíæ
    jam ante díxerat: Relíqui domum meam, dimísi hereditátem meam: facta est
    mihi heréditas mea quasi spelúnca hyǽnæ. Desértam Judæórum domum, id est,
    templum illud, quod fulgébat augústius, óculis comprobámus, quia habitatórem
    Christum pérdidit, et hereditátem prærípere géstiens, occídit herédem."
lectio9:
  - "Dico enim vobis: Non me vidébitis ámodo, donec dicátis: Benedíctus qui
    venit in nómine Dómini. Ad Jerúsalem lóquitur, et ad pópulum Judæórum.
    Versículum autem istum, quo et párvuli atque lacténtes in ingréssu Jerúsalem
    Dómini Salvatóris usi sunt, quando dixérunt: Benedíctus qui venit in nómine
    Dómini, hosánna in excélsis, sumpsit de centésimo décimo séptimo Psalmo, qui
    maniféste de advéntu Dómini scriptus est."
  - "&teDeum"
