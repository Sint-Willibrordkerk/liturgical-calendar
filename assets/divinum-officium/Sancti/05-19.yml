lectio4:
  - Petrus, a nomine quo Pontifex est appellatus, Cælestinus dictus, honestis
    catholicisque parentibus Aeserniæ in Samnitibus natus, adolescentiam vix
    ingressus, ut ánimum a mundi illecebris custodiret, in solitudinem secessit.
    Ibi contemplationibus mentem mitriens, corpus in servitutem redigens,
    ferream catenam ad nudam carnem adhibebat. Congregationem, quæ postea
    Cælestinorum dicta est, sub regula sancti Benedicti instituit. Hinc quasi
    lucerna supra candelabrum posita, cum abscondi nequiret, (Romana Ecclesia
    diu viduata pastore) in Petri cathedram ignorans et absens ascitus, magna
    novitatis admiratione non minus quam repentino gaudio cunctos affecit. Cum
    autem in pontificatus sublimitate collocatus, variis distentus curis,
    assuitis incumbere meditationibus vix posse cognosceret, oneri pariter et
    honori voluntarie cessit. Indeque priscam vitæ rationem repetens, obdormivit
    in Domino, ejusque pretiosam mortem crux præfulgens in aëre ante cubiculi
    ostium reddidit amplius gloriosam. Miraculis multis tam vivens, quam post
    obitum claruit; quibus rite examinatis, Clemens quintus anno postquam
    decessit undecimo, sanctorum numero adscripsit.
