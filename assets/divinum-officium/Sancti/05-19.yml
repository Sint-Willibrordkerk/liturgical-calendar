lectio94:
  - Petrus, a nómine quo Póntifex est appellátus, Cælestínus dictus, honéstis
    catholicísque paréntibus Æsérniæ in Samnítibus natus, adolescéntiam vix
    ingréssus, ut ánimum a mundi illécebris custodíret, in solitúdinem secéssit.
    Ibi contemplatiónibus mentem nútriens, corpus in servitútem rédigens,
    férream caténam ad nudam carnem adhibébat. Congregatiónem, quæ póstea,
    Cælestinórum dicta est, sub régula sancti Benedícti instítuit. Hinc, quasi
    lucérna supra candelábrum pósita, cum abscóndi nequíret, (Romána Ecclésia
    diu viduáta pastóre) in Petri Cáthedram ignórans et absens adscítus, magna
    novitátis admiratióne non minus quam repentíno gáudio cunctos affécit. Cum
    autem in pontificátus sublimitáte collocátus, váriis disténtus curis,
    assuétis incúmbere meditatiónibus vix posse cognósceret, óneri páriter et
    honóri voluntárie cessit. Indeque priscam vitæ ratiónem répetens, obdormívit
    in Dómino, ejúsque pretiósam mortem crux præfúlgens in áëre ante cubículi
    óstium réddidit ámplius gloriósam. Miráculis multis tam vivens quam post
    óbitum cláruit; quibus rite examinátis, Clemens quintus anno postquam
    decéssit undécimo, eum Sanctórum número adscrípsit.
  - "&teDeum"
