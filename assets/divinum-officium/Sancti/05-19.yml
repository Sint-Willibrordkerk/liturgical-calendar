oratio:
  - "Deus, qui beátum Petrum Cœlestínum ad summi pontificátus ápicem sublimásti,
    quique illum humilitáti postpónere docuísti: concéde propítius; ut ejus
    exémplo cuncta mundi despícere, et ad promíssa humílibus præmia perveníre
    felíciter mereámur."
