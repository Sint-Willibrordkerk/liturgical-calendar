secreta:
  - "Cœlésti, Dómine Jesu Christe, sacrifícii igne corda nostra in odórem
    suavitátis exúre: qui beáto Alfónso Maríæ tribuísti et hæc mystéria
    celebráre, et per éadem hóstiam tibi sanctam seípsum exhibére:"
  - $Qui vivis
communio:
  - "!Eccli 50:1; 50:9"
  - Sacérdos magnus, qui in vita sua suffúlsit domum, et in diébus suis
    corroborávit templum, quasi ignis effúlgens et thus ardens in igne.
postcommunio:
  - "Deus, qui beátum Alfónsum Maríam Confessórem tuum atque Pontíficem fidelem
    divíni mystérii dispensatórem et præcónem effecísti: ejus méritis
    precibúsque concéde; ut fidéles tui et frequénter percípiant, et percipiéndo
    sine fine colláudent."
  - $Per Dominum
