name:
  - Alfónsum Maríam
  - Ant=Alfónse María
lectio4:
  - Alfonsus Maria de Ligorio, Neapoli nobílibus paréntibus natus, ab ineunte
    ætate non obscura præbuit sanctitátis indicia. Eum adhuc infántem cum
    paréntes obtulissent sancto Francisco de Hieronymo e societáte Jesu, is bene
    precátus edíxit eumdem ad nonagesimum usque annum perventurum, ad
    episcopalem dignitátem evectum iri, maximóque Ecclésiæ bono futurum. Jam tum
    a puerítia, a ludis abhorrens, nóbiles ephébos ad christianam modestiam
    verbo et exemplo componebat. Adoléscens, dato piis sodalitátibus nómine, in
    publicis nosocomíis ægrotis inservire, jugi in templis oratióni vacare, ac
    sacra mysteria frequenter obire in deliciis habebat. Pietátem litterárum
    stúdiis adeo conjunxit, ut séxdecim vix annos natus utriusque juris lauream
    in pátria universitáte fúerit assecutus. Patri obtemperans, causárum
    patrocinia suscépit; in quo munere obeundo, etsi magnam sibi laudem
    comparasset, fori tamen pericula expertus, ejusmodi vitæ institutum ultro
    dimísit. Spreto ígitur præcláro conjugio sibi a patre propósito, avíta
    primogenitúra abdicata, et ad aram Vírginis de Mercede ense suspenso,
    divinis ministériis se mancipávit. Sacerdos factus, tanto zelo irruit in
    vitia, ut apostolico munere fungens, huc illuc pérvolans, ingéntes
    perditórum hóminum conversiónes perágeret. Páuperum præsertim et ruricolárum
    miseratus, congregatiónem Presbyterórum instituit sanctíssimi Redemptoris,
    qui, ipsum Redemptórem secuti, per agros, pagos, et castella paupéribus
    evangelizarent.
lectio5:
  - Ne autem a propósito umquam diverteret, perpetuo se voto obstrinxit nullam
    témporis jacturam faciéndi. Hinc animárum zelo succénsus, tum divini verbi
    prædicatióne, tum scriptis sacra eruditióne et pietáte refertis, ánimas
    Christo lucrifácere et ad perfectiórem vitam adducere studuit. Mirum sane
    quot odia exstinxerit, quot devios ad rectum salútis iter revocaverit. Dei
    Genitrícis cultor exímius, de illíus laudibus librum edidit, ac de iis dum
    ferventius concionando disserit, a Vírginis imagine, in eum immisso miro
    splendore, totus fácie coruscare et in éxtasim rapi coram universo pópulo
    non semel visus est. Dominicæ passiónis et sacræ Eucharistiæ contemplator
    assiduus, ejus cultum mirifice propagávit. Dum vero ad ejus aram oraret vel
    Sacrum fáceret, quod numquam omisit, præ amoris veheméntia, vel seraphicis
    liquescebat ardóribus, vel insólitis quatiebátur mótibus, vel abstrahebátur
    a sensibus. Miram vitæ innocéntiam, quam nulla umquam lethali labe fœdávit,
    pari cum pœniténtia socians, corpus suum inedia, férreis caténulis, ciliciis
    cruentáque flagellatióne castigábat. Inter hæc prophetíæ, scrutatiónis
    cordium, bilocatiónis et miraculórum donis incláruit.
lectio6:
  - Ab ecclesiásticis dignitátibus sibi oblátis constantíssime abhorruit; at,
    Clementis décimi tertii Pontificis auctoritate coactus, sanctæ Agathæ
    Gothórum ecclésiam gubernándum suscépit. Epíscopus, externum dumtaxat
    habitum, non autem sevéram vivéndi ratiónem immutávit. Eadem frugalitas,
    summus christianæ disciplinæ zelus, impensum in vitiis coërcéndis
    arcendisque erróribus, et in réliquis pastorálibus munéribus obeundis
    studium. Liberalis in páuperes, omnes ecclésiæ proventus iisdem
    distribuebat, ac, urgénte annonæ caritate, ipsam domesticam supellectilem in
    aléndis famélicis erogávit. Omnibus ómnia factus, sanctimoniáles ad
    perfectiórem vivéndi formam redégit, suæque congregatiónis moniálium
    monastérium constituéndum curávit. Episcopatu ob graves habitualesque morbos
    dimisso, ad alumnos suos, a quibus pauper discesserat, revértitur pauper.
    Demum, quamvis senio laboribúsque, diuturna arthrítide aliisque gravíssimis
    morbis fractus corpore, spíritu tamen alacrior, de cæléstibus rebus
    disseréndi aut scribéndi finem numquam adhibuit, donec nonagenarius,
    Kaléndis Augusti, anno millesimo septingentésimo octogesimo septimo, Nucériæ
    Paganórum, inter suórum alumnórum lácrimas, placidíssime exspirávit. Eum,
    inde virtútibus et miraculis clarum, Pius septimus Pontifex maximus anno
    millesimo octingentésimo décimo sexto Beatórum fastis; novisque fulgentem
    signis, Gregórius décimus sextus in festo sanctíssimæ Trinitátis, anno
    millesimo octingentésimo trigesimo nono, solemni ritu, Sanctórum catálogo
    accensuit. Tandem Pius nonus Pontifex maximus, ex sacrórum Rituum
    Congregatiónis consulto, universalis Ecclésiæ Doctórem declarávit.
lectio94:
  - Alfónsus María de Ligório, Neápoli nobílibus paréntibus natus, vix ut
    adolévit, ægrótis in públicis nosocomíis inservíre ac jugi in templis
    oratióni vacáre in delíciis habébat. Patri obtémperans, causárum patrocínia
    suscépit; fori tamen perícula expértus, ejúsmodi vitæ institútum ultro
    dimísit. Avíta primogenitúra abdicáta, et sacerdótio initiátus, tanto zelo
    írruit in vítia, ut ingéntes perditórum hóminum conversiónes perágeret.
    Páuperum præsértim et ruricolárum miserátus, congregatiónem Presbyterórum
    sanctíssimi Redemptóris ad eórum evangelizatiónem instítuit. Ne autem a
    propósito umquam divérteret, perpétuo se voto obstrínxit nullam témporis
    jactúram faciéndi. Domínicæ passiónis et sacræ Eucharístiæ contemplátor
    assíduus, atque Dei Genetrícis cultor exímius, non semel cæléstis ejus
    protectiónis signis est recreátus. Multa édidit sacra eruditióne ac pietáte
    reférta, quibus ánimas Christo lucrifácere stúduit. Ab ecclesiásticis
    dignitátibus sibi oblátis constantíssime abhórruit; apostólica tamen
    auctoritáte coáctus, sanctæ Agathæ Gothórum ecclésiam gubernándam suscépit.
    Liberális in páuperes, ómnibus ómnia factus, sanctimoniáles ad perfectiórem
    vivéndi formam redégit. Episcopátu ob graves habitualésque morbos dimísso,
    ad suos revértitur. Tandem nonagenárius, innocéntia vitæ et pœniténtia
    fulgens, anno millésimo septingentésimo octogésimo séptimo placidíssime
    exspirávit. Eum Pius Papa nonus Ecclésiæ universális Doctórem declarávit, et
    Pius duodécimus ómnium confessariórum ac moralistárum cæléstem apud Deum
    Patrónum constítuit.
  - "&teDeum"
