oratio:
  - "Deus, qui per beátum Alfónsum Maríam Confessórem tuum atque Pontíficem,
    animárum zelo succénsum, Ecclésiam tuam nova prole fecundásti: quǽsumus; ut,
    ejus salutáribus mónitis edócti et exémplis roboráti, ad te perveníre
    felíciter valeámus."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Timótheum
  - "!2 Tim 2:1-7"
  - "Caríssime: Confortáre in grátia, quæ est in Christo Jesu: et quæ audísti a
    me per multos testes, hæc comménda fidélibus homínibus, qui idónei erunt et
    alios docére. Labóra sicut bonus miles Christi Jesu. Nemo mílitans Deo
    ímplicat se negótiis sǽculáribus: ut ei pláceat, cui se probávit. Nam et qui
    certat in agóne, non coronátur, nisi legítime certáverit. Laborántem
    agrícolam opórtet primum de frúctibus percípere. Intéllege quæ dico: dabit
    enim tibi Dóminus in ómnibus intelléctum."
graduale:
  - "!Ps 118:52-53"
  - "Memor fui judiciórum tuórum a sǽculo, Dómine, et consolátus sum: deféctio
    ténuit me pro peccatóribus derelinquéntibus legem tuam."
  - "!Ps 39:11"
  - "Justítiam tuam non abscóndi in corde meo: veritátem tuam et salutáre tuum
    dixi. Allelúja, allelúja."
  - "!Eccles. 49:3-4"
  - "Ipse est diréctus divínitus in pæniténtiam gentis, et tulit abominatiónes
    impietátis: et gubernávit ad Dóminum cor ipsíus: et in diébus peccatórum
    corroborávit pietátem. Allelúja."
gradualep:
  - Allelúja, allelúja.
  - "!Ps 132:1-2"
  - Ecce, quam bonum et quam jucúndum, habitáre fratres in unum! Sicut unguéntum
