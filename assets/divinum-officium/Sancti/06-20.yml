lectio93:
  - "Silverius Campanus post Agapitum proxime Pontifex creatus est: cujus
    doctrina et sanctitas illuxit in insectandis hæreticis, et constantis animi
    magnitudo perspecta est in tuendo judicio Agapiti. Nam Anthimum, quem, quia
    Eutychianam hæresim defendebat, Agapitus ab episcopatu Constantinopolitano
    deposuerat, cum a Theodora Augusta sæpissime rogatus esset, restituere
    noluit. Quam ob rem irata mulier mandat Belisario ut Silverium mittat in
    exsilium. Qui exsulavit in insula Pontia, unde his verbis scripsisse fertur
    ad Amatorem episcopum: Sustentor pane tribulationis et aqua angustiæ; nec
    tamen dimisi, aut dimitto officium meum. Et sane, brevi incommodis
    ærumnisque confectus, obdormivit in Domino, duodecimo Kalendas Julii; Cujus
    corpus Romam delatum, et in basilica Vaticana depositum, multis miraculis
    illustratum fuit. Præfuit Ecclesiæ annos tres et amplius, creatis mense
    Decembri presbyteris tredecim diaconis quinque, episcopis per diversa loca
    decem et novem."
  - "&teDeum"
