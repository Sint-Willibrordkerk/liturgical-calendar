oratio:
  - "Concéde, quǽsumus, Ecclésiæ tuæ, omnípotens Deus: ut beátum Stéphanum
    Confessórem tuum, quem regnántem in terris propagatórem hábuit,
    propugnatórem habére mereátur gloriósum in cœlis."
  - $Per Dominum
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 19:12-26"
  - "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Homo quidam
    nóbilis ábiit in regionem longínquam accípere sibi regnum, et reverti.
    Vocátis autem decem servis suis, dedit eis decem mnas, et ait ad illos:
    Negotiámini, dum vénio. Cives autem ejus óderant eum: et misérunt legatiónem
    post illum, dicéntes: Nolumus hunc regnáre super nos. Et factum est, ut
    redíret accépto regno: et jussit vocári servos, quibus dedit pecúniam, ut
    sciret, quantum quisque negotiátus esset. Venit autem primus, dicens:
    Dómine, mna tua decem mnas acquisívit. Et ait illi: Euge, bone serve, quia
    in módico fuísti fidélis, eris potestátem habens super decem civitátes. Et
    alter venit, dicens: Dómine, mna tua fecit quinque mnas. Et huic ait: Et tu
    esto super quinque civitátes. Et alter venit, dicens: Dómine, ecce mna tua,
    quam hábui repósitam in sudário: tímui enim te, quia homo austérus es:
    tollis, quod non posuísti, et metis, quod non seminasti. Dicit ei: De ore
    tuo te júdico, serve nequam. Sciébas, quod ego homo austérus sum, tollens,
    quod non pósui, et metens, quod non seminávi: et quare non dedísti pecúniam
    meam ad mensam, ut ego véniens cum usúris útique exegíssem illam? Et
    astántibus dixit: Auferte ab illo mnam et date illi, qui decem mnas habet.
    Et dixérunt ei: Dómine, habet decem mnas. Dico autem vobis: Quia omni
    habénti dabitur, et abundábit: ab eo autem, qui non habet, et, quod habet,
    auferetur ab eo."
offertorium:
  - "@Commune/C2"
secreta:
  - "Réspice, quas offérimus, hóstias, omnípotens Deus: et præsta; ut, qui
    passiónis Dominicæ mystéria celebrámus, imitémur quod ágimus."
  - $Per eundem
communio:
  - "@Commune/C4-1"
postcommunio:
  - "Præsta, quǽsumus, omnípotens Deus: ut beáti Stephani Confessóris tui fidem
    cóngrua devotióne sectémur; qui, pro ejúsdem fídei dilatatióne, de terréno
    regno ad cœléstis regni glóriam méruit perveníre."
  - $Per Dominum
rubrica-cisterciensis/officium:
  - S. Stephani, Regis Hungariæ et Confessoris
lectio4:
  - "Stephanus in Hungariam Christi fidem et regium nomen invéxit. Regia coróna
    a Romano Pontifice impetrata, ejusque jussu in regem inunctus, regnum Sedi
    apostolicæ obtulit. Varia pietátis domicília Romæ, Jerosolymis,
    Constantinopoli: in Hungaria archiepiscopátum Strigoniensem, episcopátus
    decem admirábili religióne et munificéntia fundavit. Par in páuperes amor et
    liberalitas, quos véluti Christum ipsum complectens, neminem a se mærentem
    ac vacuum umquam dismisit; quin ad eórum inópiam sublevandam, amplíssimis
    facultátibus erogatis, domesticam quoque supellectilem exímia benignitate
    frequenter distríbuit.  Suis ínsuper mánibus lavare páuperum pedes, noctu
    solus et ignotus nosocomía frequentare, decumbéntibus inservire ac cetera
    caritátis offícia exhibere consuevit. Quarum virtútum merito, illíus
    déxtera, resoluto cetero corpore, incorrupta permansit."
lectio5:
  - Orándi studio noctes pene totas ducebat insomnes; atque in cæléstium rerum
    contemplatióne defixus, interdum extra sensus raptus, sublimis in áëra ferri
    visus fuit. Perduellium conspiratiónes ac validiórum hostium ímpetus, miro
    prorsus modo, non semel oratiónis præsidio evitavit. Susceptum ex Ghisella
    Bavárica, sancti Henrici imperatóris sorore, quam sibi matrimonio junxerat,
    Emerícum fílium tanta morum disciplína talíque pietáte enutrívit, quantum
    ejus póstea sanctitas declaravit. Regni vero negotia ita dispósuit, ut,
    accitis undique prudentíssimis et sanctíssimis viris, nihil umquam sine
    illórum consílio molirétur; humillimis interim precibus in cínere et cilício
    Deum déprecans, ut univérsum Hungariæ regnum, antequam e vita migraret,
    catholicum vidére mererétur; vere, propter ingens dilatandæ fidei studium,
    illíus gentis Apóstolus nuncupatus, facta a Romano Pontifice ipsi
    posterisque régibus præferendæ crucis potestate.
lectio6:
  - Dei Genitricem, quam ardentíssime venerabátur, amplíssimo in ejus honórem
    constructo templo, Hungariæ patrónam instítuit; ab eádem vicíssim Vírgine
    recéptus in cælum ipso suæ Assumptiónis die, quem Húngari e sancti regis
    instituto Magnæ Dominæ diem appellant. Sacrum ejus corpus, suavíssimo
    fragrans odore, liquore cælésti scatens, inter multa et varia miracula,
    Romani Pontificis jussu, nobiliórem in locum translátum est atque
    honorificentius cónditum. Ejus autem festum Innocentius undecimus Pontifex
    maximus, quarto Nonas Septembris, ob insignem victoriam ab exercitu Leopoldi
    primi, Romanórum elécti imperatóris et Hungariæ regis, eádem die in Budæ
    expugnatióne, ope divina, e Turcis reportatam, celebrándum instituit.
lectio94:
  - "Stéphanus, Hungarórum rex, in Hungáriam Christi fidem et régium nomen
    invéxit. Régia coróna a Románo Pontífice impetráta, ejúsque jussu rex
    inúnctus, regnum Sedi apostólicæ óbtulit. Vária pietátis domicília Romæ,
    Jerosólymis, Constantinópoli constítuit: in Hungária archiepiscopátum
    Strigoniénsem et episcopátus decem admirábili religióne et munificéntia
    fundávit. Exímia in páuperes caritáte et assíduo orándi stúdio enítuit. Dei
    Genetrícem quam ardentíssime venerabátur, amplíssimo in ejus honórem
    constrúcto templo, Hungáriæ patrónam instítuit; ab eádem vicíssim Vírgine
    recéptus in cælum ipso suæ Assumptiónis die, quem Húngari e sancti Regis
    institúto Magnæ Dóminæ diem appéllant. Ejus tamen festum ex constitutióne
    Innocéntii Papæ undécimi hac die potíssimum recólitur, quæ Budæ munitíssima
    arx, sancti Regis ope, ab exércitu christiáno strénue recuperáta fuit."
  - "&teDeum"
