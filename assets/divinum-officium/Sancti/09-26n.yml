oratio:
  - "Deus, qui primítias fídei in amplíssimis Boreális Americæ regiónibus
    sanctórum Mártyrum tuórum Joánnis, Isaáci eorúmque Sociórum prædicatióne et
    sánguine consecrásti: concéde propítius: ut, eórum intercessióne, flórida
    christianórum seges ubíque in dies augeátur."
  - $Per Dominum
lectio:
  - Lectio Epístolæ beáti Pauli Apóstoli ad Corínthios.
  - "!2 Cor. 12:11-15"
  - "Fratres: Ego a vobis débui commendári: nihil enim minus fui ab its qui sunt
    supra modum Apóstoli, tamétsi nihil sum. Signa tamen apostolátus mei facta
    sunt super vos, in omni patiéntia, in signis et prodígiis et virtútibus.
    Quid est enim quod minus habuístis præ céteris ecclésiis, nisi quod ipse non
    gravávi vos? Donáte mihi hanc injúriam. Ecce tértio hoc parátus sum veníre
    ad vos; et non ero gravis vobis. Non enim quæro quæ vestra sunt, sed vos;
    net enim debent fílii paréntibus thesaurizáre, sed paréntes fíliis. Ego
    autem libénter impéndam et superimpéndar ipse pro animábus vestris: licet
    plus vos díligens, minus díligar."
graduale:
  - "!Ps 123:7-8"
  - Anima nostra sicut passer erépta est de láqueo venántium.
  - "V. Laqueus contrítus est et nos liberati sumus: adjutórium nostrum in
    nómine Dómine, qui fecit cælum et terram. Allelúia, allelúia."
  - "!2 Cor 1:5"
  - V. Sicut abúndant passiónes Christi in nobis, ita et per Christum abúndat
    consolátio nostra, allelúia.
evangelium:
  - Sequentia ++ sancti Evangelii secundum Lucam.
  - "!Luc 6:17-23"
  - "In illo témpore: Descéndens Jesus de monte stetit in loco campéstri, et
    turba discipulórum ejus, et multitúdo copiósa plebis ab omni Judǽa, et
    Jerúsalem, et marítima, et Tyri, et Sidónis, qui vénerant, ut audírent eum,
    et sanaréntur a languóribus suis. Et qui vexabántur a spirítibus immúndis,
    curabántur. Et omnis turba quærébat eum tángere: quia virtus de illo exíbat,
    et sanábat omnes. Et ipse elevátis óculis in discípulos suos, dicébat:
    “Beáti páuperes: quia vestrum est regnum Dei. Beáti, qui nunc esúritis, quia
    saturabímini. Beáti, qui nunc fletis: quia ridébitis. Beáti éritis, cum vos
    óderint hómines, et cum separáverint vos, et exprobráverint, et ejécerint
    nomen vestrum tamquam malum, propter Fílium hóminis. Gaudéte in illa die, et
    exsultáte: ecce enim merces vestra multa est in Cœlo.”"
offertorium:
  - "!Sap 3:6"
  - Tamquam aurum in fornáce probávit illos Dóminus, et quasi holocáusti hóstiam
    accépit illos.
secreta:
  - Immaculátam Hóstiam fac nos, Dómine, méntibus tibi puris offérre, quam
    sanctis Martyribus tuis illibátus vitæ candor et juge mortificatiónis
    stúdium dapem suavíssimam efficiébant.
  - $Per Dominum
communio:
  - "!Phil 1:20-21"
  - "Magnificábitur Christus in córpore meo, sive per vitam sive per mortem:
    mihi enim vívere Christus est et mori lucrum."
postcommunio:
  - "Fórtium pane reféctis tríbue nobis, omnípotens Deus: ut, sicut sancti
    Mártyres tui Joánnes, Isaácus eorúmque Sócii, eódem roboráti, ánimam suam
    pro frátribus pónere non dubitárunt; ita nos, alter altérius ónera
    portántes, próximos nostros ópere et veritáte diligámus."
  - $Per Dominum
lectio4:
  - Ex iis Societatis Jesu sodalibus, qui Ecclesiæ in America boreali exordia
    medio sæculo septimo maxime illustrarunt, octo purissimas hostias sibi
    elegit Deus, ut fidei semina earum sanguine irrigata in uberiores segetes
    deínde succrescerent. Omnes hi Martyres, in Gallia nati et, præter duos
    laicos, sacerdotio aucti, in Missionem Canadensem, quæ Novæ Galliæ tunc
    vocabatur, a Superioribus missi, post innumeros ex urbe Quebecensi per
    varias illas immensas regiones apostolicos excursus, asperrimosque labores
    ob unam eamdemque religionis causam, etsi non uno eodemque tempore nec loco,
    crudelissime necati sunt. Horum veluti duces ac magistri merito censentur
    Joannes de Brebeuf, Condæi in diocesi olim Baiocensi nunc Constantiensi
    nobili genere ortus, et Isaacus Jogues, aurelianensis, viri strenuo et
    apostolico zelo incensi, mortificationi maxime dediti, cum Deo in oratione
    conjunctissimi, cælestibus étiam visionibus quandoque illustrati. Ab iis
    haud absimiles erant quatuor socii sacerdotes Antonius Daniel, dieppensis,
    Gabriel Lalemant et Carolus Garnier, parisienses, Natalis Chabanel,
    mimatensis; qui omnes variis in pagis potissimum inter Hurones sacris
    muneribus fideliter fungebantur.
responsory4:
  - "R. Sancti tui, Domine, mirabile consecuti sunt iter, servientes præceptis
    tuis, ut invirentur illæsi in aquis validis:"
  - "* Terra apparuit arida, et in Mari Rubro via sine impedimento."
  - V. Quoniam percussit petram et fluxerunt aquæ et torrentes inundaverunt.
  - R. Terra apparuit arida, et in Mari Rubro via sine impedimento.
lectio5:
  - Frequentes finitimorum Iroquensium incursiones, Huronicam missionem sæpe
    vastantes, haud raro in supremum discrimen Patrum vitam vocabant. Anno
    millesimo sexcentesimo quadragesimo secundo, Isaacus Jogues, cum Renato
    Goupil, Societatis Jesu coadjutore temporali, ex urbe Quebecensi ad Hurones
    iter faciens, in Iroquenses incidit, qui eum ejusque socium dirissime
    torquent et in servitutem redigunt. Eodem anno die vigesima nona Septembris,
    Renatus, in odium salutiferæ crucis a barbaro sene interfici jussus, prope
    Auriesville, in hodierno Neo-Eboracensi Statu, candidissimam animam
    efflavit. Isaacus anno proximo, aufugiendi occasionem nactus, in Galliam
    revertit; sed post annum Americam repetens et semel atque iterum ad eosdem
    barbaros, suos olim carnifices, cum Joanne de la Lande, Societatis Jesu item
    coadjutore, progressus, die decima octava Octobris anno millesimo
    sexcentesimo quadragesimo sexto, in hodierna diocesi Albanensi, acinace
    percussus martyrii palmam consecutus est. Postero vero die ejus socius
    Joannes, eadem redimitus corona, ad cælum evolavit.
responsory5:
  - "R. Verbera carnificum non timuerunt Sancti Dei, morientes pro Christi
    nomine:"
  - "* Ut heredes fierent in domo Domini."
  - V. Tradiderunt corpora sua propter Deum ad supplicia.
  - R. Ut heredes fierent in domo Domini.
lectio6:
  - Anno millesimo sexcentesimo quadragesimo octavo, die quarta Julii Antonius
    Daniel, qui pagi Sancti Joseph inter Hurones curam gerebat, contra invasores
    Iroquenses gregem suum impavidus defendens, sagittis et ignitis glandibus
    confossus, ad templi fores bonus pastor pro ovibus animam posuit. Anno
    proximo, die decima sexta Martii, Joannes de Brebeuf, Huronum apostolus
    merito nuncupatus, una cum Gabriele Lalemant, ab Iroquensibus comprehensus,
    post diuturnos sævissimosque cruciatus, ipsis barbaris invictam Christi
    pugilis fortitudinem demirantibus, in pago Sancti Ignatii in hodierna
    Canadensi regione Ontario nuncupata, gloriosus occubuit; quem postridie
    Gabriel Lalemant eadem cruenta via eademque virtute secutus est. Mense autem
    Decembri ejusdem anni millesimi sexcentesimi quadragesimi noni, in
    pervigilio Immaculatæ Conceptionis beatæ Mariæ Virginis, Carolus Garnier,
    vulneribus confossus et securi percussus, innocentissimam vitam glorioso
    exitu conclusit. Postero demum die, Natalis Chabanel, ab Hurone apostata
    dolose invasus et in profluentem dejectus, in dilecta sibi Missione, cui
    perpetuo colendæ, natura frustra obsistente, heroico voto se obstrinxerat,
    optatam martyrii palmam adeptus est. Hos octo Americæ borealis primores
    Martyres Pius Undecimus Pontifex Maximus, anno sacro millesimo nongentesimo
    vigesimo quinto, Beatorum numero, eosque quinque post annis Sanctorum fastis
    ascripsit.
responsory6:
  - "R. Tamquam aurum in fornace probavit electos Dominus, et quasi holocausti
    hostiam accepit illos; et in tempore erit respectus illorum:"
  - "* Quoniam donum et pax est electis Dei."
  - "V. Qui confidunt in illum, intellegent veritatem: et fideles in dilectione
    acquiescent illi."
  - R. Quoniam donum et pax est electis Dei.
  - "&Gloria"
  - R. Quoniam donum et pax est electis Dei.
lectio94:
  - Ex iis Societátis Jesu sodálibus, qui médio sǽculo décimo séptimo aspérrimam
    missiónem Novæ Gálliæ excoléntes, Ecclésiæ  primórdia in América
    Septentrionáli summópere illustrárunt, octo puríssimas hóstias sibi elégit
    Deus, in hodiérnis regiónibus Neo-Eboracénsi et Ontário in Cánada immolátas.
    In his véluti duces et magístri habéntur Joánnes de Brébeuf et Isaácus
    Jogues, viri strénui et apostólico animárum stúdio incénsi, mortificatióni
    máxime déditi, cum Deo in oratióne coniunctíssimi. Haud dispáribus
    virtútibus ornabántur sacerdótes Antónius Daniel, Gábriel Lalemant, Cárolus
    Garnier et Natális Chabanel, necnon Renátus Goupil et Joánnis de la Lande,
    Patrum adjutóres.  Vitam ob indigenárum Eurónum índolem miserrimámque
    vivéndi ratiónem, martýrio símilem, omnes cruénta more propter unam
    religiónis causam, etsi non uno loco nec témpore, cumulárunt; quidam vero
    torménta vix credibília ádeo invícta fortitúdine pertulérunt, ut ipsi
    bárbari carnífices eos admiraréntur. Quos Pius undécimus Beatórum, ac mox
    miráculis claros Sanctórum número adscrípsit.
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 6:17-23"
  - "In illo témpore: Descendens Jesus de monte, stetit in loco campestri, et
    turba discipulorum ejus, et multitudo copiosa plebis ab omni Judǽa, et
    Jerúsalem, et maritima, et Tyri, et Sidonis. Et réliqua."
  - _
  - Homilia sancti Petri Canisii Presbýteri
  - "!Notæ in evangelicas lectiones: in die festo Omnium Sanctorum, post initium"
  - "Notabo Christum longe aliter quam hunc mundum, de beatitudine docere atque
    pronuntiare. Mundi etenim est proprium rebus caducis et fluxis, quæ hic
    relinquendæ sunt, mentiri hominis felicitatem, perinde ac si dicatur: Beatus
    populus, cui hæc sunt. Immo vero quos Christus beatos hic pronuntiat, eos
    insipiens mundus tantum pro miseris et infelicibus ducit, eosdem de more
    contemnit atque aversatur, ut hinc étiam Christus ipse testetur Apostolis:
    Amen, amen dico vobis, quia plorabitis et flebitis vos; mundus autem
    gaudebit, vos autem contristabimini. Recteque dixit Salomon: Ambulans recto
    itinere et timens Deum, despicitur ab eo qui infami graditur via."
responsory7:
  - "R. Propter testamentum Domini et leges paternas, Sancti Dei perstiterunt in
    amóre fraternitatis:"
  - "* Quia unus fuit semper spiritus in eis, et una fides."
  - V. Ecce quam bonum et quam jucundum habitare fratres in unum!
  - R. Quia unus fuit semper spiritus in eis, et una fides.
lectio8:
  - "Beati demum sunt qui persecutionem propter justitiam patiuntur, suaque
    invicta patientia Christi regnum æternum obtinent. Ad hoc genus
    beatitudinis, nulli magis quam protomartyr Stephanus aliique fortissimi
    Christi milites ac martyres referendi sunt: quoniam velut oves ad occisionem
    pertractæ, ad sanguinem usque pro justitia christiana certarunt, nulla ut
    hostium vis atque barbaries, nulla tribulationis vel tentationis acerbitas
    eos a fidei confessione, Christi caritate, doctrina Ecclesiæ et justitiæ
    tramite potuerit abducere ac separare. O felices illi qui bona testari
    conscientia potuerunt: Quis nos separabit a caritate Christi? Tribulatio? an
    angustia? an fames? an nuditas? an periculum? an persecutio? an gladius? In
    his omnibus superamus propter eum qui dilexit nos. Transivimus per ignem et
    aquam, et eduxisti nos in refrigerium."
responsory8:
  - "R. Sancti mei, qui in carne positi certamen habuistis:"
  - "* Mercedem laboris ego reddam vobis."
  - V. Venite, benedicti Patris mei, percipite regnum.
  - R. Mercedem laboris ego reddam vobis.
  - "&Gloria"
  - R. Mercedem laboris ego reddam vobis.
lectio9:
  - Præterea felices omnes qui hanc scalam Jacob, superioribus gradibus octo
    distinctam, in hunc usque diem ascendunt, relictis omnibus impedimentis, ita
    ut capitales hostes, mundum, carnem ac satanam, cotidie vincant sibique
    virtutum studio gradum faciant ad beatam immortalitatem. Verum longe
    feliciores et illi, qui pugnandi et vincendi fecere finem et, ipso
    ascendendi labore confecto, ad certaminis coronam pervenerunt jamque, veluti
    rude donati et emeriti milites, quiete summa potiuntur, et in cælesti
    tabernaculo habitant, mercede amplissima cumulati. Nec dubium quin sancti
    Martyres piique Doctores præ ceteris florescant electis in perpetuas
    æternitates, quoniam ob virtutes heroicas aureolam, sicut Theologi vocant,
    et excellentem lauream peculiari privilegio consequentur.
  - "&teDeum"
