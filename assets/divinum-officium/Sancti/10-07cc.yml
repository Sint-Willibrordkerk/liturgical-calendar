officium:
  - Ss. Sergii, Bacchi, Marcelli et Apuleji Martyrum
rank:
  - ""
  - Simplex
  - "1.1"
  - "@C3a"
rule:
  - vide C3a;
  - Suffragium=Maria3;;
oratio:
  - "Sanctórum Martyrum tuórum nos, Dómine, Sérgii, Bacchi, Marcélli et Apuléji
    beáta mérita prosequántur: et tuo semper fáciant amóre fervéntes."
  - $Per Dominum
secreta:
  - Majestátem tuam nobis, Dómine, quǽsumus, hæc hóstia reddat immolánda
    placátam, tuórum digna postulatióne Sanctórum.
  - $Per Dominum
postcommunio:
  - "Sacraméntis, Dómine, muniámur accéptis: et sanctórum Mártyrum tuórum
    Sérgii, Bacchi, Marcélli et Apuléji intercessióne, contra omnes nequítias
    irruéntes, annis cœléstibus protegámur."
  - $Per Dominum
