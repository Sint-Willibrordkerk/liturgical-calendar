lectio1:
  - De Actibus Apostolórum
  - "!Act 13:1-4"
  - 1 Erant autem in Ecclésia quæ erat Antiochíæ, prophétæ et doctóres, in
    quibus Bárnabas et Simon, qui vocátur Niger, et Lucius Cyrenénsis et
    Mánahen, qui erat Heródis tetrárchæ collactáneus, et Saulus.
  - "2 Ministrántibus autem illis Dómino et jejunántibus, dixit illis Spíritus
    Sanctus: Segregáte mihi Saulum et Bárnabam, in opus ad quod assúmpsi eos."
  - 3 Tunc jejunántes et orántes imponentésque eis manus dimisérunt illos.
  - 4 Et ipsi quidem missi a Spíritu Sancto abiérunt Seleucíam et inde
    navigavérunt Cyprum.
responsory1:
  - "R. Qui operátus est Petro in apostolátum, operátus est et mihi inter
    gentes:"
  - "* Et cognovérunt grátiam Dei, quæ data est mihi."
  - V. Grátia Dei in me vácua non fuit, sed grátia ejus semper in me manet.
  - R. Et cognovérunt grátiam Dei, quæ data est mihi.
lectio2:
  - "!Act 13:5-8"
  - 5 Et, cum veníssent Salamínam, prædicábant verbum Dei in synagógis Judæórum;
    habébant autem et Joánnem in ministério.
  - 6 Et, cum perambulássent univérsam ínsulam usque Paphum, invenérunt quemdam
    virum magum pseudoprophétam Judǽum, cui nomen erat Barjésu,
  - 7 qui erat cum procónsule Sérgio Paulo, viro prudénte. Hic, accersítis
    Bárnaba et Saulo, desiderábat audíre verbum Dei.
  - 8 Resistébat autem illis Elymas magus (sic enim interpretátur nomen ejus)
    quærens avértere procónsulem a fide.
responsory2:
  - "R. Bonum certámen certávi, cursum consummávi, fidem servávi:"
  - "* Ideóque repósita est mihi coróna justítiæ."
  - V. Scio cui crédidi, et certus sum quia potens est depósitum meum serváre in
    illum diem.
  - R. Ideóque repósita est mihi coróna justítiæ.
lectio3:
  - "!Act 13:9-13"
  - 9 Saulus autem, qui et Paulus, replétus Spíritu Sancto, íntuens in eum,
  - "10 dixit: O plene omni dolo et omni fallácia, fili diáboli, inimíce omnis
    justítiæ, non désinis subvértere vias Dómini rectas?"
  - 11 Et nunc ecce manus Dómini super te, et eris cæcus, non videns solem usque
    ad tempus. Et conféstim cécidit in eum calígo et ténebræ, et circúiens
    quærébat qui ei manum daret.
  - 12 Tunc procónsul, cum vidísset factum, crédidit admírans super doctrína
    Dómini.
  - 13 Et, cum a Papho navigássent, Paulus et qui cum eo erant venérunt Pergen
    Pamphýliæ; Joánnes autem discédens ab eis revérsus est Jerosólymam.
responsory3:
  - R. Repósita est mihi coróna justítiæ,
  - "* Quam reddet mihi Dóminus in illum diem justus judex."
  - V. Scio cui crédidi, et certus sum quia potens est depósitum meum serváre in
    illum diem.
  - R. Quam reddet mihi Dóminus in illum diem justus judex.
  - "&Gloria"
  - R. Quam reddet mihi Dóminus in illum diem justus judex.
lectio4:
  - Ex libro sancti Augustíni Epíscopi de grátia et líbero arbítrio
  - "!Cap. 6-7"
  - "Apóstolus Paulus, quem certe invénimus sine ullis méritis bonis, immo cum
    multis méritis malis, Dei grátiam consecútum, reddéntis bona pro malis,
    videámus quid dicat, sua jam propinquánte passióne, scribens ad Timótheum:
    Ego enim jam ímmolor, inquit, et tempus resolutiónis meæ instat. Bonum
    certámen certávi, cursum consummávi, fidem servávi. Ista útique jam mérita
    sua bona commémorat; ut post bona mérita consequátur corónam, qui post
    mérita mala consecútus est grátiam. Dénique atténdite quid sequátur:
    Súperest, inquit, mihi coróna justítiæ, quam reddet mihi Dóminus in illa die
    justus judex. Cui rédderet corónam justus judex, si non donásset grátiam
    miséricors Pater? Et quómodo esset ista coróna justítiæ, nisi præcessísset
    grátia, quæ justíficat ímpium? Quómodo ista débita redderétur, nisi prius
    illa gratúita donarétur?"
responsory4:
  - R. Tu es vas electiónis, sancte Paule Apóstole, prædicator veritátis in
    univérso mundo,
  - "* Per quem omnes gentes cognovérunt grátiam Dei."
  - V. Intercéde pro nobis ad Deum, qui te elégit.
  - R. Per quem omnes gentes cognovérunt grátiam Dei.
lectio5:
  - "Proínde considerémus ipsa mérita Apóstoli Pauli, quibus dixit corónam
    redditúrum júdicem justum, et videámus utrum mérita ipsíus tamquam ipsíus,
    id est, ex ipso ei comparáta, an dona sint Dei. Bonum, inquit, certámen
    certávi, cursum consummávi, fidem servávi. Primo ista bona ópera, si non ea
    præcessíssent cogitatiónes bonæ, nulla essent. Atténdite ítaque quid de
    ipsis cogitatiónibus dicat; ait enim scribens ad Corínthios: Non quia idónei
    sumus cogitáre áliquid a nobis, tamquam a nobismetípsis; sed sufficiéntia
    nostra ex Deo est. Deínde síngula inspiciámus."
responsory5:
  - "R. Grátia Dei sum id quod sum:"
  - "* Et grátia ejus in me vacua non fuit, sed semper in me manet."
  - V. Qui operátus est Petro in apostolátum, operátus est et mihi inter gentes.
  - R. Et grátia ejus in me vacua non fuit, sed semper in me manet.
lectio6:
  - "Bonum, inquit, certámen certávi. Quæro qua virtúte certáverit, utrum quæ
    illi ex semetípso fúerit, an quæ désuper data sit? Sed absit ut tantus
    doctor ignoráverit legem Dei, cujus vox est in Deuteronómio: Ne dicas in
    corde tuo: Fortitúdo mea et poténtia manus meæ fecit mihi virtútem magnam
    hanc; sed memoráberis Dómini Dei tui, quia ipse tibi dat fortitúdinem fácere
    virtútem. Quid autem prodest bonum certámen, nisi sequátur victória? Et quis
    dat victóriam, nisi ille, de quo dicit ipse: Grátias Deo, qui dat nobis
    victóriam per Dóminum nostrum Jesum Christum?"
responsory6:
  - R. Saulus, qui et Paulus, magnus prædicátor,
  - "* A Deo confortátus convalescébat, et confundébat Judæos."
  - V. Osténdens quia hic est Christus, Fílius Dei.
  - R. A Deo confortátus convalescébat, et confundébat Judæos.
  - "&Gloria"
  - R. A Deo confortátus convalescébat, et confundébat Judæos.
