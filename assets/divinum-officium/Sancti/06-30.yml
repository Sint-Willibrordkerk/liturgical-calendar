lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 10:16-22"
  - "In illo témpore: Dixit Jesus discípulis suis: Ecce ego mitto vos sicut oves
    in médio lupórum. Et réliqua."
  - _
  - Homilía sancti Joánnis Chrysóstomi
  - "!Homilia 34 in Matth., longe post initium"
  - "Sed dícere vidétur: Nolíte turbári, si, cum vos inter lupos mitto, tamquam
    oves et colúmbas esse júbeo. Nam, etsi possum contrárium quoque præstáre, et
    non permíttere ut grave áliquid patiámini, nec lupis tamquam oves subjécti
    sitis, sed effícere ut leónibus terribilióres evadátis; tamen sic éxpedit
    fíeri: hoc et vos quoque illustrióres fáciet, et meam declarábit virtútem.
    Sic enim póstea dixit Paulo: Súfficit tibi grátia mea, nam virtus mea in
    infirmitáte perfícitur. Ipse ígitur vos ut tales essétis feci."
responsory7:
  - R. Sancte Paule Apóstole, prædicátor veritátis et doctor géntium,
  - "* Intercéde pro nobis ad Deum, qui te elégit, ut digni efficiámur grátia
    Dei."
  - V. Tu es vas electiónis, sancte Paule Apostole, prædicátor veritátis.
  - R. Intercéde pro nobis ad Deum, qui te elégit, ut digni efficiámur grátia
    Dei.
lectio8:
  - "Sed inspiciámus quam prudéntiam éxigit: serpéntis certe. Nam, quemádmodum
    serpens totum seípsum tradit, nec mínimum curat si ipsum quoque corpus
    incídi necésse sit, dúmmodo caput suum íntegrum servet; eódem tu quoque
    modo, præter fidem cétera pérdere non cures, sive pecúnias, sive corpus,
    sive étiam vitam ipsam profúndere necésse sit. Fides enim caput est et
    radix; qua serváta, etiámsi ómnia perdas, ómnia tamen rursus majóre cum
    glória recuperábis. Idcírco nec símplices solum jussit esse, nec prudéntes
    solum; sed ambo hæc in unum míscuit, ut ea in virtútem convertántur."
responsory8:
  - "R. Damasci, præpósitus gentis Aretæ regis vóluit me comprehéndere:"
  - "* Et a frátribus per murum demíssus sum in sporta, * Et sic evasi manus
    ejus in nómine Dómini."
  - V. Deus et Pater Dómini nostri Jesu Christi scit quia non mentior.
  - R. Et a frátribus per murum demissus sum in sporta.
  - "&Gloria"
  - R. Et sic evasi manus ejus in nómine Dómini.
lectio9:
  - "Quod si rebus ipsis id ita fíeri vidére desíderas, lege Actuum Apostolórum
    librum; perspícies profécto, cum sæpe Judæórum pópulus in Apóstolos
    insurréxerit ac dentes exacúerit, illos, colúmbæ simplicitátem imitándo et
    cum decénti modéstia respondéndo, iram ipsórum superásse, furórem
    exstinxísse, ímpetum retardásse. Nam, cum illi dícerent: Nonne præcipiéndo
    præcépimus vobis, ne docerétis in nómine isto? quamvis innúmera possent
    édere mirácula, nihil tamen ásperum neque dixérunt neque fecérunt; sed summa
    cum mansuetúdine respondéntes dicébant: Si justum est vos audíre magis quam
    Deum, judicáte. Perspexísti simplicitátem colúmbæ, vide nunc serpéntis
    prudéntiam: Non enim póssumus, ínquiunt, nos quæ vídimus et audívimus, non
    loqui."
  - "&teDeum"
