secreta:
  - "Apóstoli tui Pauli précibus, Dómine, plebis tuæ dona sanctífica: ut, quæ
    tibi tuo grata sunt institúto, gratióra fiant patrocínio supplicántis."
  - $Per Dominum
commemoratio-secreta:
  - "!Commemoratio S. Petri"
  - "Ecclésiæ tuæ, quǽsumus, Dómine, preces et hóstias beáti Petri Apóstoli
    comméndet orátio: ut, quod pro illíus glória celebrámus, nobis prosit ad
    véniam."
  - $Per Dominum
communio:
  - "@Commune/C5-1"
postcommunio:
  - "Percéptis, Dómine, sacraméntis: beáto Paulo Apóstolo tuo interveniénte,
    deprecámur; ut, quæ pro illíus celebráta sunt glória, nobis profíciant ad
    medélam."
  - $Per Dominum
commemoratio-postcommunio:
  - "!Commemoratio S. Petri"
  - "Lætíficet nos, Dómine, munus oblátum: ut, sicut in Apóstolo tuo Petro te
    mirábilem prædicámus; sic per illum tuæ sumamus indulgéntiæ largitátem."
  - $Per Dominum
ant-vespera:
  - Ego plantávi, * Apollo rigávit, Deus autem increméntum dedit, allelúja.
  - Libénter gloriábor * in infirmitátibus meis, ut inhábitet in me virtus
    Christi.
  - Grátia Dei * in me vácua non fuit, sed grátia ejus semper in me manet.
  - "Damásci, præpósitus * gentis Arétæ regis vóluit me comprehéndere: a
    frátribus per murum demíssus sum in sporta, et sic evási manus ejus in
    nómine Dómini."
  - Ter virgis cæsus sum, * semel lapidátus sum, ter naufrágium pértuli pro
    Christi nómine.
