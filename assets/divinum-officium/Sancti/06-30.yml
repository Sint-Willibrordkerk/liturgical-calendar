oratio:
  - "Deus, qui multitúdinem géntium beáti Pauli Apóstoli prædicatióne docuísti:
    da nobis, quǽsumus; ut, cujus natalícia cólimus, ejus apud te patrocínia
    sentiámus."
  - $Per Dominum.
commemoratio-oratio:
  - "!Commemoratio S. Petri"
  - "Deus, qui beáto Petro Apóstolo tuo, collátis clávibus regni Cœléstis,
    ligándi atque solvéndi pontifícium tradidísti: concéde; ut, intercessiónis
    ejus auxílio, a peccatórum nostrórum néxibus liberémur."
  - $Qui vivis
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Gálatas
  - "!Gal 1:11-20"
  - "Fratres: Notum vobis facio Evangélium, quod evangelizátum est a me, quia
    non est secúndum hóminem: neque enim ego ab hómine accépi illud neque
    dídici, sed per revelatiónem Jesu Christi. Audístis enim conversatiónem meam
    aliquándo in Judaísmo: quóniam supra modum persequébar Ecclésiam Dei, et
    expugnábam illam, et proficiébam in Judaísmo supra multos coætáneos meos in
    génere meo, abundántius æmulátor exsístens paternárum mearum traditiónum.
    Cum autem plácuit ei, qui me segregávit ex útero matris meæ, et vocávit per
    grátiam suam, ut reveláret Fílium suum in me, ut evangelizárem illum in
    géntibus: contínuo non acquiévi carni et sánguini, neque veni Jerosólymam ad
    antecessóres meos Apóstolos: sed ábii in Arábiam: et íterum revérsus sum
    Damáscum: déinde post annos tres veni Jerosólymam vidére Petrum, et mansi
    apud eum diébus quíndecim: álium autem Apostolórum vidi néminem, nisi
    Jacóbum fratrem Dómini. Quæ autem scribo vobis, ecce coram Deo, quia non
    méntior."
graduale:
  - "!Gal 2:8-9"
  - "Qui operátus est Petro in apostolátum, operátus est et mihi inter gentes:
    et cognovérunt grátiam Dei, quæ data est mihi."
  - "!1 Cor 15:10"
  - "Grátia Dei in me vácua non fuit: sed grátia ejus semper in me manet.
    Allelúja, allelúja."
  - V. Sancte Paule Apóstole, prædicátor veritátis et doctor géntium, intercéde
    pro nobis. Allelúja.
gradualep:
  - Allelúja, allelúja.
  - "!Ps 106:8"
  - Confiteántur Dómino misericórdiæ ejus. et mirabília ejus fíliis hóminum.
