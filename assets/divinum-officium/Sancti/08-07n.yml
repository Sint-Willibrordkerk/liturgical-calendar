officium:
  - S. Sixti II, Papæ, et Sociorum, Martyrum
rank:
  - ""
  - Duplex optional
  - "2"
  - "@C3"
rule:
  - vide C3;
oratio:
  - "Deus, qui nos concédis sane in Mártyrum tuórum Xysti Felicíssimi et Agapíti
    natalítia cólere: da nobis in ætérna beatitúdine de eórum societáte
    gaudére."
  - $Per Dominum
secreta:
  - "@Commune/C3a"
postcommunio:
  - "Præsta nobis, quǽsumus, Dómine: intercedéntibus sanctis Martyribus tuis
    Xysto, Felicíssimo et Agapíto; ut, quod ore contíngimus, pura mente
    capiámus."
  - $Per Dominum
