postcommunio:
  - "Cœléstibus, Dómine, pasti delíciis: quǽsumus; ut beáti Philippi Confessóris
    tui méritis et imitatióne, semper eadem, per quæ veráciter vívimus,
    appetámus."
  - $Per Dominum
