lectio4:
  - Philippus Nerius, piis honestisque paréntibus Floréntiæ natus, ab ipsa
    ineunte ætate non obscura dedit futuræ sanctitátis indicia. Adoléscens,
    ampla patrui hereditáte dimissa, Romam se contulit; ubi philosophía ac
    sacris litteris eruditus, totum se Christo dicávit. Ea fuit abstinéntia, ut
    sæpe jejunus triduum permanserit. Vigiliis et oratiónibus intentus, septem
    Urbis Ecclésias frequenter visitans, apud cœmetérium Callísti in cæléstium
    rerum contemplatióne pernoctare consuevit. Sacerdos ex obediéntia factus, in
    animárum salúte procuranda totus fuit; et in confessiónibus audiéndis ad
    extremum usque diem perseverans, innumeros penne fílios Christo péperit;
    quos verbi Dei quotidiáno pabulo, sacramentórum frequéntia, oratiónis
    assiduitate, aliisque piis exercitatiónibus enutriri cupiens, Oratórii
    congregatiónem instituit.
lectio5:
  - "Caritate Dei vulnerátus languebat jugiter, tantoque cor ejus æstuábat
    ardore, ut, cum intra fines suos contineri non posset, illíus sinum,
    confractis atque elátis duabus cóstulis, mirabíliter Dóminus ampliaverit.
    Sacrum vero fáciens aut ferventius orans, in áëra quandoque sublatus, mira
    undique luce fulgere visus fuit. Egenos et páuperes omni caritátis officio
    prosequebátur: dignus, qui et Angelo in spécie páuperis eleemosynam
    erogaret; et, dum egéntibus noctu panem deferret, in fóveam lapsus, inde
    páriter ab Angelo incolumis eriperétur. Humilitáti addictus, ab honóribus
    semper abhorruit, atque ecclesiásticas dignitates, étiam primárias, non
    semel ultro delatas, constantíssime recusávit."
lectio6:
  - Prophetíæ dono fuit illustris, et in animórum sensibus penetrandis mirifice
    enituit. Virginitátem perpetuo illibatam servávit; idque assecutus est, ut
    eos qui puritátem cólerent, ex odore, qui vero secus, ex fœtóre dignosceret.
    Abséntibus interdum appáruit, iisque periclitántibus opem tulit. Ægrotos
    plurimos et morti próximos sanitáti restituit. Mortuum quoque ad vitam
    revocávit. Cælestium spirituum et ipsíus Deiparæ Vírginis frequenter fuit
    apparitióne dignátus, ac plurimórum ánimas splendore circumfusas in cælum
    conscéndere vidit. Denique, anno salútis millesimo quingentésimo nonagesimo
    quinto, octavo Kalendas Junias, in quem diem inciderat festum Corporis
    Christi, Sacro maxima spíritus exsultatióne peracto, ceterisque functiónibus
    expletis, post mediam noctem, qua prædixerat hora, octogenarius obdormívit
    in Dómino. Quem Gregórius décimus quintus, miraculis clarum, in Sanctórum
    númerum rétulit.
lectio94:
  - Philíppus Nérius, piis honestísque paréntibus Floréntiæ natus, ampla pátrui
    hereditáte dimíssa, Romam se cóntulit; ubi, philosophía ac sacris lítteris
    erudítus, totum se Christo dicávit. Sacérdos ex obediéntia factus, in
    animárum salúte procuránda totus fuit, et in confessiónibus audiéndis ad
    extrémum usque diem persevérans, innúmeros pene fílios Christo péperit; quos
    verbi Dei cotidiáno pábulo, sacramentórum frequéntia, oratiónis assiduitáte
    aliísque piis exercitatiónibus enutríri cúpiens, Oratórii congregatiónem
    instítuit. Caritáte Dei vulnerátum tanto cor ejus æstuábat ardóre, ut, cum
    intra fines suos continéri non posset, sinum, confráctis atque elátis duábus
    cóstulis, mirabíliter Dóminus ampliáverit. Prophetíæ dono fuit illústris, et
    in animórum sénsibus penetrándis mirífice enítuit. Virginitátem perpétuo
    illibátam servávit; idque assecútus est, ut eos, qui puritátem cólerent, ex
    odóre, qui vero secus, ex fœtóre dignósceret. Anno salútis millésimo
    quingentésimo nonagésimo quinto, octogenárius obdormívit in Dómino.
  - "&teDeum"
