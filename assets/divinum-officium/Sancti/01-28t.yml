officium:
  - S. Agnetis Virginis et Martyris secundo
rank:
  - ""
  - Simplex
  - "1.1"
  - "@C6-1"
rule:
  - vide C6-1;
  - in 3 Nocturno Lectiones ex Commune in 2 loco
introitus:
  - "@Commune/C10b"
oratio:
  - "Deus, qui nos ánnua beátæ Agnetis Vírginis et Martyris tuæ sollemnitáte
    lætíficas: da, quǽsumus; ut, quam venerámur officio, étiam piæ
    conversatiónis sequámur exémplo."
  - $Per Dominum
lectio:
  - "@Commune/C6a"
graduale:
  - "@Commune/C6a"
tractus:
  - "@Commune/C6a"
secreta:
  - "Super has, quǽsumus, Dómine, hóstias benedíctio copiósa descéndat: quæ et
    sanctificatiónem nobis cleménter operétur, et de Mártyrum nos sollemnitáte
    lætíficet."
  - $Per Dominum
communio:
  - "@Commune/C6a-1"
postcommunio:
  - "Súmpsimus, Dómine, celebritátis ánnuæ votiva sacraménta: præsta, quǽsumus;
    ut et temporális vitæ nobis remédia prǽbeant et ætérnæ."
  - $Per Dominum
ant-1:
  - Stans a dextris ejus * Agnus nive candidior, Christus sibi sponsam et
    Mártyrem consecrávit.
lectio93:
  - "Beáta Agnes, paréntibus ad ejus sepúlcrum assidue vigilántibus, quadam
    nocte choro vírginum comitáta cum apparuísset, sic ad eos locuta dícitur: Ne
    me, paréntes, mortuam lugeátis; nam una cum his virgínibus vivo apud illum
    in cælis, quem in terris tota mente diléxi. Cum aliquot post annos
    Constantia, Constantini imperatóris fília, insanábili úlceri medicinam
    quærens, nondum christiana ad idem sepúlcrum accessísset; obdórmiscens sibi
    audíre visa est vocem hanc Agnetis: Constanter age, Constántia: crede in
    Jesum Christum Fílium Dei, qui te sanam fáciet. Quæ sanata, paulo post una
    cum multis ex família imperatóris baptismum suscípiens, ibi ecclésiam nómine
    beátæ Agnétis ædificávit."
  - "&teDeum"
ant-2:
  - "@Sancti/01-21"
