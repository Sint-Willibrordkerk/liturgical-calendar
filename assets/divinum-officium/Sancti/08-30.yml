lectio4:
  - "Primus Americæ Meridionalis flos sanctitatis, virgo Rosa, christianis
    parentibus Limæ progenita, mox ab incunabulis claruit futuræ sanctimoniæ
    indiciis. Nam vultus infantis mirabiliter in rosæ effugiem transfiguratus,
    huic nomini occasionem dedit: cui postea Virgo Deipara cognomen adjecit,
    jubens vocari deinceps Rosam a sancta Maria. Quinquennis votum perpetuæ
    virginitatis emisit. Adultior, ne a parentibus ad nuptias cogeretur, clam
    sibimet venustissimam capitis cæsariem præscidit. Jejuniis supra humánum
    modum addicta, integras Quadragesimas transegit, pane abstinens, ac dietim
    solis quinque granulis mali citrini victitans."
lectio5:
  - "Habitu tertii ordinis sancti Dominici assumpto, pristinas vitæ austeritates
    duplicavit: oblongo asperrimoque cilicio sparsim mimisculas acus innexuit:
    sub velo coronam densis aculeis introrsus obarmatam interdiu noctuque
    gestavit. Sanctæ Catharinæ Senensis ardua premens vestigia, catena ferrea,
    triplici nexu circumducta, lumbos cinxit. Lectulum sibi e truncis nodosis
    composuit, horumque vacuas commissuras fragminibus testarum implevit.
    Cellulam sibi angustissimam struxit in extremo horti angulo, ubi cælestium
    contemplationi dedita, crebris disciplinis, inedia, vigiliis corpusculum
    extenuans, at spiritu vegetata, larvas dæmonum, frequenti certamine victrix,
    impavide protrivit ac superavit."
lectio6:
  - "Aegritudinum tormentis, domesticorum insultibus, linguarum morsibus dire
    agitata, nondum satis pro merito se affligi quærebatur. Per quindecim annos
    ad plusculas horas desolatione spiritus et ariditate miserrime contabescens,
    forti animo tulit agones omni morte amariores. Exinde cœpit supernis
    abundare deliciis, illustrari visionibus, colliquescere seraphicis
    ardoribus. Angelo tutelori, sanctæ Catharinæ Senensi, Virgini Deiparæ inter
    assiduas apparitiones mire familiaris, a Christo has voces audire meruit:
    Rosa cordis mei, tu mihi sponsa esto. Denique Sponsi hujus paradiso
    feliciter invectam, plurimisque ante et post obitum miraculis coruscam,
    Clemens decimus Pontifex Maximus sanctarum Virginum catalogo ritu solemni
    adscripsit."
lectio94:
  - "Primus Américæ Meridionális flos sanctitátis, virgo Rosa, christiánis
    paréntibus Limæ progénita, mox ab incunábulis cláruit futúræ sanctimóniæ
    indíciis; nam vultus infántis, mirabíliter in rosæ effígiem transfigurátus,
    huic nómini occasiónem dedit. Ne a paréntibus ad núptias cogerétur, clam
    síbimet venustíssimam comam præcídit. Singuláris fuit ejus vitæ austéritas.
    Assúmpto hábitu tértii órdinis sancti Domínici, sanctæ Catharínæ Senénsis
    árdua pressit vestígia. Per quíndecim annos, ad plúsculas horas desolatióne
    spíritus et ariditáte misérrime contabéscens, fórtiter tulit agónes omni
    morte amarióres. Angelo tutelári, sanctæ Catharínæ Senénsi, Vírgini Deíparæ
    inter assíduas apparitiónes mire familiáris, a Christo has voces audíre
    méruit: Rosa cordis mei, tu mihi sponsa esto. Plúribus ante et post mortem
    miráculis claram, Clemens Papa décimus eam sanctárum Vírginum catálogo
    adscrípsit."
  - "&teDeum"
