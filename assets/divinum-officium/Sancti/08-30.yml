oratio:
  - "Bonórum ómnium largítor, omnípotens Deus, qui beátam Rosam, cœléstis grátiæ
    rore prævéntam, virginitátis et patiéntiæ decóre Indis floréscere voluísti:
    da nobis fámulis tuis; ut, in odórem suavitátis ejus curréntes, Christi
    bonus odor éffici mereámur:"
  - $Qui tecum
