lectio93:
  - Thecla virgo, ex illustribus paréntibus Iconii nata, a Paulo Apóstolo fidei
    præceptis instituta, miris sanctórum Patrum laudibus celebrátur. Quæ décimum
    octavum annum agens, Thamíride sponso relícto, cum eam paréntes, quod
    Christiana esset, accusassent, in ardentem rogum, qui, nisi Christo
    renuntiáret, ei parátus erat, prius signo crucis armata, seipsam injecit.
    Sed igne, plúvia quæ repénte exorta est, exstincto, Antiochíam venit; ubi,
    feris objecta et tauris in diversa incitátis alligata, mox conjecta in
    fossam plenam serpéntibus, ex ómnibus Jesu Christi grátia liberátur. Cujus
    ardore fidei et vitæ sanctitáte multi ad Christum convérsi sunt. Iterum in
    pátriam rédiens, in montem sola secessit. Deínde, multis virtútibus et
    miraculis insígnis, nonagenaria migrávit ad Dóminum, ac Seleucíæ sepúlta
    est.
