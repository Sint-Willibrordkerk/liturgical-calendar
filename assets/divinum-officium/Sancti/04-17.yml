lectio93:
  - Anicétus Syrus, imperatóre Marco Aurélio Antoníno, præfuit Ecclésiæ.
    Decrévit ne clérici comam nutrírent. Quínquies mense Decémbri ordinávit
    presbyteros decem et septem, diáconos quátuor, epíscopos per divérsa loca
    novem. Vixit in pontificátu annos octo, menses octo, dies vigínti quátuor.
    Propter Christi fidem martyrio coronátus, sepúltus est via Appia in
    cœmetério, quod póstea Callísti appellátum est, décimo quinto Kaléndas
    Majas.
  - "&teDeum"
