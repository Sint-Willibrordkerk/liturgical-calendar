oratio:
  - "Deus, qui beátam Francíscam fámulam tuam, inter cétera grátiæ tuæ dona,
    familiári Angeli consuetúdine decorásti: concéde, quǽsumus; ut,
    intercessiónis ejus auxílio, Angelórum consórtium cónsequi mereámur."
  - $Per Dominum
invit:
  - Laudémus Deum nostrum, * In confessióne beátæ Francíscæ.
rubrica-innovata/lectio1:
  - "@Commune/C7a:Lectio1"
lectio4:
  - "Francisca nobilis matrona Romana, ab ineunte ætate illustria dedit virtutum
    exempla: etenim pueriles ludos et illecebras mundi respuens, solitudine et
    oratione magnopere delectabatur. Undecim annos nata, virginitatem suam Deo
    consecrare, et monasterium ingredi proposuit: parentum tamen voluntati
    humiliter obtemperans, Laurentio de Pontianis, juveni æque diviti ac nobili
    nupsit. In matrimonio arctioris vitæ propositum, quantum licuit, semper
    retinuit: a spectaculis, conviviis, aliisque hujusmodi oblectamentis
    abhorrens, lanea ac vulgari veste utens, et quidquid a domesticis curis
    supererat temporis, orationi aut proximorum utilitati tribuens: in id vero
    maxima sollicitudine incumbens, ut matronas Romanas a pompis sæculi et
    ornatus vanitate revocaret. Quapropter domum Oblatarum, sub regula sancti
    Benedicti, congregationis Montis Oliveti, adhuc viro alligata, in Urbe
    instituit. Viri exsilium, bonorum jacturam, ac universæ domus mœrorem non
    modo constantissime toleravit: sed gratias agens cum beato Job, illud
    frequenter usurpabat: Dominus dedit, Dominus abstulit: sit nomen Domini
    benedictum."
lectio5:
  - "Viro defuncto, ad prædictam Oblatarum domum convolans, nudis pedibus, fune
    ad collum alligato, humi prostrata, multis cum lacrimis earum numero
    adscribi suppliciter postulavit. Voti compos facta, licet esset omnium
    mater, non alio tamen quam ancillæ, vilissimæque feminæ, et immunditiæ
    vasculi titulo gloriabatur. Quam vilem sui existimationem et verbo
    declaravit et exemplo: sæpe enim e suburbana vinea revertens, et lignorum
    fascem proprio capiti impositum deferens, vel eisdem onustum agens per Urbem
    asellum, pauperibus subveniebat, in quos étiam largas eleemosynas erogabat:
    ægrotantesque in xenodochiis visitans, non corporali tantum cibo, sed
    salutaribus monitis recreabat. Corpus suum vigiliis, jejuniis, cilicio,
    ferreo cingulo, crebrisque flagellis in servitutem redigere jugiter
    satagebat. Cibum illi semel in die herbæ et legumina, aqua potum præbuit.
    Hos tamen corporis cruciatus aliquando confessarii mandato, a cujus ore
    nutuque pendebat, modice temperavit."
lectio6:
  - "Divina mysteria, præsertim vero Christi Domini passionem, tanto mentis
    ardore, tantaque lacrimarum vi contemplabatur, ut præ doloris magnitudine
    pene confici videretur. Sæpe étiam cum oraret, maxime sumpto sanctissimæ
    Eucharistiæ sacramento, spiritu in Deum elevata, ac cælestium contemplatione
    rapta, immobilis permanebat. Quapropter humani generis hostis variis eam
    contumeliis ac verberibus a proposito dimovere conabatur: quem tamen illa
    imperterrita semper elusit; Angeli præsertim præsidio, cujus familiari
    consuetudine gloriosum de eo triumphum reportavit. Gratia curationum et
    prophetiæ dono enituit, quo et futura prædixit, et cordium secreta
    penetravit. Non semel aquæ, vel per rivum decurrentes, vel e cælo labentes,
    intactam prorsus, dum Deo vacaret, reliquerunt. Modica panis fragmenta, quæ
    vix tribus sororibus reficiendis fuíssent satis, sic ejus precibus Dominus
    multiplicavit, ut quindecim inde exsaturatis, tantum superfuerit, ut
    canistrum impleverit: et aliquando earumdem sororum, extra Urbem mense
    Januario ligna parantium, sitim recentis uvæ racemis ex vitæ in arbore
    pendentibus mirabiliter obtentis, abunde expleverit. Denique meritis et
    miraculis clara, migravit ad Dominum, anno ætatis suæ quinquagesimo sexto.
    Quam Paulus quintus Pontifex Maximus in Sanctorum numerum retulit."
lectio94:
  - "Francísca, nóbilis matróna Romána, úndecim annos nata, virginitátem suam
    Deo consecráre et monastérium íngredi státuit; sed paréntum voluntáti
    obédiens, Lauréntio de Pontiánis, júveni díviti æque ac nóbili, nupsit. In
    matrimónio arctióris vitæ propósitum, quantum lícuit, semper retínuit,
    patiéntia in advérsis semper mirábilis. Ut vero matrónas Románas a pompis
    sǽculi et ornátus vanitáte revocáret, domum Oblatárum, sub régula sancti
    Benedícti congregatiónis Montis Olivéti, in Urbe instítuit; eóque, defúncto
    viro, cónvolans, supplíciter eárum número adscríbi postulávit. Voti compos
    facta, licet esset ómnium mater, título ancíllæ et vilíssimæ féminæ
    gloriabátur. Diáboli astus numquam quiescéntis semper elúsit et, sui Angeli
    præsídio, gloriósum de eo triúmphum rétulit. Méritis et miráculis insígnis,
    migrávit ad Dóminum, anno ætátis suæ quadragésimo sexto: quam Paulus quintus
    Póntifex máximus catálogo Sanctórum adscrípsit."
  - "&teDeum"
