evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joannes 3:1-15"
  - "In illo témpore: Erat homo ex pharisǽis, Nicodémus nómine, princeps
    Judæórum. Hic venit ad Jesum nocte et dixit ei: Rabbi, scimus, quia a Deo
    venísti magíster; nemo enim potest hæc signa fácere, quæ tu facis, nisi
    fúerit Deus cum eo. Respóndit Jesus et dixit ei: Amen, amen, dico tibi, nisi
    quis renátus fúerit dénuo, non potest vidére regnum Dei. Dicit ad eum
    Nicodémus: Quómodo potest homo nasci, cum sit senex? Numquid potest in
    ventrem matris suæ iteráto introíre et renásci? Respóndit Jesus: Amen, amen,
    dico tibi, nisi quis renátus fúerit ex aqua et Spíritu Sancto, non potest
    introíre in regnum Dei. Quod natum est ex carne, caro est: et quod natum est
    ex spíritu, spíritus est. Non miréris, quia dixi tibi: opórtet vos nasci
    dénuo. Spíritus, ubi vult, spirat, et vocem ejus audis, sed nescis, unde
    véniat aut quo vadat: sic est omnis, qui natus est ex spíritu. Respóndit
    Nicodémus et dixit ei: Quómodo possunt hæc fíeri? Respóndit Jesus et dixit
    ei: Tu es magíster in Israël, et hæc ignóras? Amen, amen, dico tibi, quia,
    quod scimus, lóquimur, et quod vídimus, testámur, et testimónium nostrum non
    accípitis. Si terréna dixi vobis et non créditis: quómodo, si díxero vobis
    cœléstia, credétis? Et nemo ascéndit in cœlum, nisi qui descéndit de cœlo,
    Fílius hóminis, qui est in cœlo. Et sicut Móyses exaltávit serpéntem in
    desérto: ita exaltári opórtet Fílium hóminis, ut omnis, qui credit in ipsum,
    non péreat, sed hábeat vitam ætérnam."
offertorium:
  - "!Ps 117:16; 117:17"
  - "Déxtera Dómini fecit virtútem, déxtera Dómini exaltávit me: non móriar, sed
    vivam et narrábo ópera Dómini, allelúja."
secreta:
  - "Sacrifícium, Dómine, quod tibi immolámus, placátus inténde: ut ab omni nos
    éruat bellórum nequítia, et per vexíllum sanctæ Crucis Fílii tui, ad
    conteréndas potestátis advérsæ insídias, nos in tuæ protectiónis securitáte
    constítuat."
  - $Per eundem
communio:
  - "!"
  - Per signum Crucis de inimícis nostris líbera nos, Deus noster, allelúja.
postcommunio:
  - "Repléti alimónia cœlésti et spiritáli póculo recreáti, quǽsumus, omnípotens
    Deus: ut ab hoste malígno deféndas, quos per lignum sanctæ Crucis Fílii tui,
    arma justítiæ pro salúte mundi, triumpháre jussísti."
  - $Per eundem
