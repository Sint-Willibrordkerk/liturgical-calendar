  - R. Tunc manifésta erunt abscóndita cordis nostri. (Allelúja, allelúja.)
lectio7:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 3:1-15"
  - "In illo témpore: Erat homo ex pharisǽis, Nicodémus nómine, princeps
    Judæórum. Hic venit ad Jesum nocte, et dixit ei: Rabbi, scimus quia a Deo
    venísti magíster. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tract. 11 in Joann., post init."
  - "Nicodémus ex his erat, qui credíderant in nómine Jesu, vidéntes signa et
    prodígia quæ faciébat. Supérius enim hoc dixit: Cum autem esset Jerosólymis
    in Pascha in die festo, multi credidérunt in nómine ejus. Quare credidérunt
    in nómine ejus? Séquitur, et dicit: Vidéntes signa ejus, quæ faciébat. Et de
    Nicodémo quid dicit? Erat princeps Judæórum, nómine Nicodémus. Hic venit ad
    eum nocte, et ait illi: Rabbi, scimus quia a Deo venísti magíster. Et iste
    ergo credíderat in nómine ejus. Et ipse unde credíderat? Séquitur: Nemo enim
    potest hæc signa fácere, quæ tu facis, nisi fúerit Deus cum eo."
responsory7:
  - "R. Dulce lignum, dulces clavos, dulce pondus sustínuit:"
  - "* Quæ sola digna fuit portáre prétium hujus sǽculi. (Allelúja.)"
  - V. Hoc signum Crucis erit in cælo cum Dóminus ad judicándum vénerit.
  - R. Quæ sola digna fuit portáre prétium hujus sǽculi. (Allelúja.)
lectio8:
  - "Si ergo Nicodémus de illis multis erat, qui credíderant in nómine ejus, jam
    in isto Nicodémo attendámus, quare Jesus non se credébat eis. Respóndit
    Jesus et dixit ei: Amen, amen dico tibi, nisi quis renátus fúerit dénuo, non
    potest vidére regnum Dei. Ipsis ergo se credit Jesus, qui nati fúerint
    dénuo. Ecce illi credíderant in eum, et Jesus non se credébat eis. Tales
    sunt omnes catechúmeni: ipsi jam credunt in nómine Christi, sed Jesus non se
    credit eis. Inténdat et intélligat cáritas vestra. Si dixérimus catechúmeno:
    Credis in Christum? respóndet, Credo, et signat se Cruce Christi: portat in
    fronte, et non erubéscit de Cruce Dómini sui. Ecce credit in nómine ejus.
    Interrogémus eum: Mandúcas carnem Fílii hóminis, et bibis sánguinem Fílii
    hóminis? nescit quid dícimus, quia Jesus non se crédidit ei."
responsory8:
  - "R. Sicut Móyses exaltávit serpéntem in desérto, ita exaltári opórtet Fílium
    hóminis:"
  - "* Ut omnis qui credit in ipsum, non péreat, sed hábeat vitam ætérnam.
    (Allelúja.)"
  - V. Non misit Deus Fílium suum in mundum ut júdicet mundum, sed ut salvétur
    mundus per ipsum.
  - R. Ut omnis qui credit in ipsum, non péreat, sed hábeat vitam ætérnam.
    (Allelúja.)
  - "&Gloria"
  - R. Ut omnis qui credit in ipsum, non péreat, sed hábeat vitam ætérnam.
