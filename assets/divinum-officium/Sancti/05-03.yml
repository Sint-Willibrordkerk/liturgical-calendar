lectio1:
  - De Epístola beáti Pauli Apóstoli ad Gálatas
  - "!Gal 3:10-14"
  - "10 Quicúmque ex opéribus legis sunt, sub maledícto sunt. Scriptum est enim:
    Maledíctus omnis qui non permánserit in ómnibus quæ scripta sunt in libro
    legis ut fáciat ea."
  - "11 Quóniam autem in lege nemo justificátur apud Deum, maniféstum est: quia
    justus ex fide vivit."
  - 12 Lex autem non est ex fide, sed, Qui fécerit ea, vivet in illis.
  - "13 Christus nos redémit de maledícto legis, factus pro nobis maledíctum:
    quia scriptum est: Maledíctus omnis qui pendet in ligno:"
  - 14 ut in géntibus benedíctio Ábrahæ fíeret in Christo Jesu, ut
    pollicitatiónem Spíritus accipiámus per fidem.
