lectio3:
  - De Epístola ad Colossénses
  - "!Col 2:9-15"
  - "9 In Christo inhábitat omnis plenitúdo divinitátis corporáliter:"
  - 10 et estis in illo repléti, qui est caput omnis principátus et potestátis;
  - 11 in quo et circumcísi estis circumcisióne non manu facta in exspoliatióne
    córporis carnis, sed in circumcisióne Christi;
  - 12 consepúlti ei in baptísmo, in quo et resurrexístis per fidem operatiónis
    Dei, qui suscitávit illum a mórtuis.
  - "13 Et vos, cum mórtui essétis in delíctis, et præpútio carnis vestræ,
    convivificávit cum illo, donans vobis ómnia delícta:"
  - "14 delens quod advérsus nos erat chirógraphum decréti, quod erat contrárium
    nobis, et ipsum tulit de médio, affígens illud cruci:"
  - 15 et expólians principátus, et potestátes tradúxit confidénter, palam
    triúmphans illos in semetípso.
responsory3:
  - R. Hæc est arbor digníssima, in paradísi médio situáta,
  - "* In qua salútis auctor própria morte mortem ómnium superávit. (Allelúja,
    allelúja.)"
  - V. Crux præcellénti decóre fúlgida, quam Hélena Constantíni mater
    concupiscénti ánimo requisívit.
  - R. In qua salútis auctor própria morte mortem ómnium superávit. (Allelúja,
    allelúja.)
  - "&Gloria"
  - R. In qua salútis auctor própria morte mortem ómnium superávit. (Allelúja,
    allelúja.)
lectio4:
  - Post insígnem victóriam, quam Constantínus imperátor, divínitus accépto
    signo Domínicæ Crucis, ex Maxéntio reportávit, Hélena Constantíni mater, in
    somnis admónita, conquiréndæ Crucis stúdio Jerosólymam venit; ubi marmóream
    Véneris státuam, in Crucis loco a Géntibus collocátam ad tolléndam Christi
    Dómini passiónis memóriam, post centum círciter octogínta annos, everténdam
    curávit. Quod item fecit ad præsépe Salvatóris et in loco resurrectiónis,
    inde Adónidis hinc Jovis subláto simulácro.
responsory4:
  - "R. Nos autem gloriári opórtet in Cruce Dómini nostri Jesu Christi, in quo
    est salus, vita, et resurréctio nostra:"
  - "* Per quem salváti et liberáti sumus. (Allelúja.)"
  - V. Tuam Crucem adorámus, Dómine, et recólimus tuam gloriósam passiónem.
  - R. Per quem salváti et liberáti sumus. (Allelúja.)
lectio5:
  - "Itaque loco Crucis purgáto, alte defóssæ tres cruces érutæ sunt,
    repertúsque seórsum ab illis Crucis Domínicæ títulus: qui cum ex tribus cui
    affíxus fuísset, non apparéret, eam dubitatiónem sústulit miráculum. Nam
    Macárius Jerosolymórum epíscopus, factis Deo précibus, síngulas cruces
    cuídam féminæ, gravi morbo laboránti, admóvit; cui cum réliquæ nihil
    profuíssent, adhíbita tértia Crux statim eam sanávit."
responsory5:
  - "R. Dum sacrum pignus cǽlitus exaltátur, Christi fides roborátur:"
  - "* Adsunt prodígia divína in virga Móysi prímitus figuráta. (Allelúja,
    allelúja.)"
  - V. Ad Crucis contáctum resúrgunt mórtui, et Dei magnália reserántur.
  - R. Adsunt prodígia divína in virga Móysi prímitus figuráta. (Allelúja,
    allelúja.)
lectio6:
  - Hélena, salutári Cruce invénta, magnificentíssimam ibi exstrúxit ecclésiam,
    in qua partem Crucis relíquit thecis argénteis inclúsam, partem Constantíno
    fílio détulit; quæ Romæ repósita fuit in ecclésia sanctæ Crucis in
    Jerúsalem, ædificáta in ædibus Sessoriánis. Clavos étiam áttulit fílio,
    quibus sanctíssimum Jesu Christi corpus fixum fúerat. Quo ex témpore
    Constantínus legem sancívit, ne crux ad supplícium cuíquam adhiberétur. Ita
    res, quæ ántea homínibus probro ac ludíbrio fúerat, veneratióni et glóriæ
    esse cœpit.
responsory6:
  - "R. Hoc signum Crucis erit in cælo, cum Dóminus ad judicándum vénerit:"
  - "* Tunc manifésta erunt abscóndita cordis nostri. (Allelúja, allelúja.)"
  - V. Cum séderit Fílius hóminis in sede majestátis suæ, et cœ́perit judicáre
    sǽculum per ignem.
  - R. Tunc manifésta erunt abscóndita cordis nostri. (Allelúja, allelúja.)
