oratio:
  - "Adésto, Dómine, supplicatiónibus nostris: et intercessióne beáti Lauréntii
    Mártyris tui, cujus prævénimus festivitátem; perpétuam nobis misericórdiam
    benígnus impénde."
  - $Per Dominum
lectio:
  - Léctio libri Sapiéntiæ
  - "!Eccli 51:1-8; 51:12"
  - "Confitébor tibi, Dómine, Rex, et collaudábo te Deum, Salvatórem meum.
    Confitébor nómini tuo: quóniam adjútor et protéctor factus es mihi, et
    liberásti corpus meum a perditióne, a láqueo linguæ iníquæ et a lábiis
    operántium mendácium, et in conspéctu astántium factus es mihi adjútor. Et
    liberásti me secúndum multitúdinem misericórdiæ nóminis tui a rugiéntibus,
    præparátis ad escam, de mánibus quæréntium ánimam meam, et de portis
    tribulatiónum, quæ circumdedérunt me: a pressúra flammæ, quæ circúmdedit me,
    et in médio ignis non sum æstuátus: de altitúdine ventris ínferi, et a
    lingua coinquináta, et a verbo mendácii, a rege iníquo, et a lingua injústa:
    laudábit usque ad mortem ánima mea Dóminum: quóniam éruis sustinéntes te, et
    líberas eos de mánibus géntium, Dómine, Deus noster."
graduale:
  - "!Ps 111:9; 111:2"
  - "Dispersit, dedit paupéribus: justítia ejus manet in sǽculum sǽculi."
  - "V. Potens in terra erit semen ejus: generátio rectórum benedicétur."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 16:24-27"
  - "In illo témpore: Dixit Jesus discípulis suis: Si quis vult post me veníre,
    ábneget semetípsum, et tollat crucem suam, et sequátur me. Qui enim volúerit
    ánimam suam salvam fácere, perdet eam: qui autem perdíderit ánimam suam
    propter me, invéniet eam. Quid enim prodest hómini, si mundum univérsum
    lucrétur, ánimæ vero suæ detriméntum patiátur? Aut quam dabit homo
    commutatiónem pro ánima sua? Fílius enim hóminis ventúrus est in glória
    Patris sui cum Angelis suis: et tunc reddet unicuíque secúndum ópera ejus."
offertorium:
  - "!Job 16:20"
  - "Orátio mea munda est: et ídeo peto, ut detur locus voci meæ in cœlo: quia
    ibi est judex meus, et cónscius meus in excélsis: ascéndat ad Dóminum
    deprecátio mea."
communio:
  - "!Matt 16:24"
  - Qui vult veníre post me, ábneget semetípsum, et tollat crucem suam, et
    sequátur me.
postcommunio:
  - "Da, quǽsumus, Dómine, Deus noster: ut, sicut beáti Lauréntii Mártyris tui
    commemoratióne, temporáli gratulámur offício; ita perpétuo lætémur aspéctu."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 16:24-27"
  - "In illo témpore: Dixit Jesus discípulis suis: Si quis vult post me veníre,
    ábneget semetípsum, et tollat crucem suam, et sequátur me. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 32 in Evangelia"
  - Quia Dóminus ac Redémptor noster novus homo veni in mundum, nova præcépta
    dedit mundo. Vitæ étenim nostræ véteri, in vítiis enutrítæ, contrarietátem
    oppósuit novitátis suæ. Quid enim vetus, quid carnális homo nóverat, nisi
    sua retinére, aliéna rápere, si posset; concupíscere, si non posset? Sed
    cæléstis médicus síngulis quibúsque vítiis obviántia ádhibet medicaménta.
    Nam, sicut arte medicínæ cálida frígidis, frígida cálidis curántur; ita
    Dóminus noster contrária oppósuit medicaménta peccátis, ut lúbricis
    continéntiam, tenácibus largitátem, iracúndis mansuetúdinem, elátis
    præcíperet humilitátem.
lectio2:
  - "Certe, cum se sequéntibus nova mandáta propóneret, dixit: Nisi quis
    renuntiáverit ómnibus quæ póssidet, non potest meus esse discípulus. Ac si
    apérte dicat: Qui per vitam véterem aliéna concupíscitis, per novæ
    conversatiónis stúdium et vestra largímini. Quid vero in hac lectióne dicat,
    audiámus: Qui vult post me veníre, ábneget semetípsum. Ibi dícitur ut
    abnegémus nostra: hic dícitur ut abnegémus nos. Et fortásse laboriósum non
    est hómini relínquere sua; sed valde laboriósum est relínquere semetípsum.
    Minus quippe est abnegáre quod habet; valde autem multum est abnegáre quod
    est."
lectio3:
  - "Ad se autem nobis veniéntibus Dóminus præcépit, ut renuntiémus nostris:
    quia, quicúmque ad fídei agónem venímus, luctámen contra malígnos spíritus
    súmimus. Nihil autem malígni spíritus in hoc mundo próprium póssident: nudi
    ergo cum nudis luctári debémus. Nam si vestítus quisque cum nudo luctátur,
    cítius ad terram deícitur, quia habet unde teneátur. Quid enim sunt terréna
    ómnia, nisi quædam córporis induménta? Qui ergo contra diábolum ad certámen
    próperat, vestiménta abíciat, ne succúmbat."
