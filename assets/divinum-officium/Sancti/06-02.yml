lectio93:
  - Petrus exorcísta, Diocletiáno imperatóre, Romæ a Seréno júdice propter
    christiánæ fídei confessiónem missus in cárcerem, Paulínam Artémii, qui
    cárceri præerat, filiam a dæmone agitátam liberávit. Quo facto et paréntes
    puéllæ cum tota família, et vicínos qui ad rei novitátem concúrrerant, Jesu
    Christo conciliátos ad Marcellínum presbyterum addúxit, a quo omnes
    baptizáti sunt. Quod ubi rescívit Serénus, Petrum et Marcellínum ad se
    vocátos aspérius objúrgat, et ad verbórum acerbitátem minas ac terróres
    adjúngit, nisi Christo renúntient. Cui cum Marcellínus christiána libertáte
    respondéret, pugnis contúsum, et a Petro sejúnctum, nudum inclúdit in
    cárcerem stratum vitri fragméntis, sine cibo ac sine lúmine. Petrum item
    constríngi ímperat arctíssimis vínculis. Sed cum utríque ex torméntis fides
    et ánimus crésceret, constánti confessióne, et abscísso cápite, illústre
    testimónium Jesu Christo dedérunt. Erásmus epíscopus, imperatóribus
    Diocletiáno et Maximiáno, in Campánia plumbátis et fústibus cæsus, resína
    quoque, súlphure, plumbo liquefácto, et fervénti pice, cera, oleóque
    perfúsus, inde tamen ínteger et inviolátus evásit. Quo miráculo multi se ad
    Christi fidem convertérunt. Verum is, íterum detrúsus in cárcerem,
    constríctus férreis gravissimísque vínculis, inde ab Angelo mirabíliter
    eréptus est. Deínde Fórmiis a Maximiáno váriis afféctus supplíciis,
    tunicáque ærea candénti indútus, illa étiam torménta, divína virtúte
    superávit. Dénique, plúrimis et in fide confirmátis, et ad fidem convérsis,
    insígnem martyrii palmam adéptus est.
  - "&teDeum"
