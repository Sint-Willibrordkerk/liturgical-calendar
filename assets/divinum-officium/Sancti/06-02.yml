secreta:
  - "Hæc hóstia, quǽsumus, Dómine, quam sanctórum Martyrum tuórum natalítia
    recenséntes offérimus: et víncula nostræ pravitátis absólvat, et tuæ nobis
    misericórdiæ dona concíliet."
  - $Per Dominum
communio:
  - "!Sap 3:1; 3:2; 3:3"
  - "Justórum ánimæ in manu Dei sunt, et non tanget illos torméntum malítiæ visi
    sunt óculis insipiéntium mori: illi autem sunt in pace."
postcommunio:
  - "Sacro múnere satiáti, súpplices te, Dómine, deprecámur: ut, quod débitæ
    servitútis celebrámus offício, salvatiónis tuæ sentiámus augméntum."
  - $Per Dominum
