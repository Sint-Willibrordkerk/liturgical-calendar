  - "Deus, qui præ ómnibus Sanctis tuis beátum Jóachim Genetrícis Fílii tui
    patrem esse voluísti: concéde, quǽsumus; ut, cujus festa venerámur, ejus
    quoque perpétuo patrocínia sentiámus."
