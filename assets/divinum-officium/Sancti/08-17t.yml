introitus:
  - "!Ps 16:3"
  - "v. Probásti, Dómine, cor meum, et visitásti nocte: igne me examinásti, et
    non est invénta in me iníquitas."
  - "!Ps 16:1"
  - "Exáudi, Dómine, justítiam meam: inténde deprecatiónem meam."
  - "&Gloria"
  - "v. Probásti, Dómine, cor meum, et visitásti nocte: igne me examinásti, et
    non est invénta in me iníquitas."
oratio:
  - "Excita, Dómine, in Ecclésia tua Spíritum, cui beátus Laurentius Levita
    servívit: ut, eódem nos repleti, studeamus amare quod amavit, et ópere
    exercere quod docuit."
  - $Per Dominum eiusdem
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Corínthios
  - "!2 Cor 9:6-10"
  - "Fratres: Qui parce séminat, parce et metet: et qui séminat in
    benedictiónibus, de benedictiónibus et metet. Unusquísque prout destinávit
    in corde suo, non ex tristítia aut ex necessitáte: hílarem enim datórem
    díligit Deus. Potens est autem Deus omnem grátiam abundáre fácere in vobis,
    ut, in ómnibus semper omnem sufficiéntiam habéntes, abundétis in omne opus
    bonum, sicut scriptum est: Dispérsit, dedit paupéribus: justítia ejus manet
    in sǽculum sǽculi. Qui autem adminístrat semen seminánti: et panem ad
    manducándum præstábit, et multiplicábit semen vestrum, et augébit increménta
    frugum justítiæ vestræ."
graduale:
  - "!Ps 8:6-7"
  - Glória et honóre coronásti eum, Dómine.
  - V. Et constituísti eum super ópera mánuum tuárum.
  - Allelúja, allelúja.
  - "V. Levíta Lauréntius bonum opus operátus est: qui per signum crucis cœcos
    illuminávit. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joann 12:24-26"
  - "In illo témpore: Dixit Jesus discípulis suis: Amen, amen, dico vobis, nisi
    granum fruménti cadens in terram, mórtuum fúerit, ipsum solum manet: si
    autem mórtuum fúerit, multum fructum affert. Qui amat ánimam suam, perdet
    eam: et qui odit ánimam suam in hoc mundo, in vitam ætérnam custódit eam. Si
    quis mihi mínistrat, me sequátur: et ubi sum ego, illic et miníster meus
    erit. Si quis mihi ministráverit, honorificábit eum Pater meus."
offertorium:
  - "@Commune/C5-1"
secreta:
  - "Sacrifícium nostrum tibi, Dómine, quǽsumus, beáti Lauréntii precátio sancta
    concíliet: ut, cujus honóre sollémniter exhíbetur, ejus méritis efficiátur
    accéptum."
  - $Per Dominum
communio:
  - "!Matt 16:24"
  - Qui vult veníre post me, ábneget semetípsum, et tollat crucem suam, et
    sequátur me.
postcommunio:
  - "Súpplices te rogámus, omnípotens Deus: ut, quos donis cœléstibus satiásti,
    intercedénte beáto Lauréntio Mártyre tuo, perpétua protectióne custódias."
  - $Per Dominum
