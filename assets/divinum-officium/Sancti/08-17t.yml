lectio4:
  - Ex Tractatu sancti Augustíni Epíscopi in Joánnem.
  - "!Tractatus 27. in fine."
  - "Certi sumus, fratres, quia omnes, qui sumus in corpore Domini, et manemus
    in illo, ut et ipse maneat in nobis, in hoc sæculo necesse habemus usque in
    finem inter malos vivere; non inter illos dico malos, qui blasphemant
    Christum; raro enim jam inveniuntur, qui lingua blasphemant, sed multi, qui
    vita. Necesse est ergo, ut inter illos usque in finem vivamus. Sed quid est
    quod ait, Qui manet in me, et ego in illo? Quid, nisi quod Martyres
    audiebant: Qui perseveraverit usque in finem, hic salvus erit?"
lectio5:
  - "Quomodo mansit in illo sanctus Laurentius, cujus hodie festum diem
    celebramus? Mansit usque ad tentationem, mansit usque ad tyrannicam
    interrogationem, mansit usque ad acerrimam comminationem, mansit usque ad
    peremptionem. Parum est: usque ad immanem excruciationem mansit. Non enim
    occisus est cito, sed cruciatus est in igne. Diu vivere permissus est: immo
    non diu vivere permissus est, sed tarde mori compulsus est. In illa ergo
    longa morte, in illis tormentis, quia bene manducaverat, et bene biberat,
    tamquam illa esca saginatus, et illo calice ebrius, tormenta non sensit."
lectio6:
  - "Dixerat autem illi Xystus Martyr sanctus, cujus diem quinto abhinc retro
    die celebravimus: Noli merere fili: (episcopus enim erat ille, iste
    diaconus) noli merere, inquit, sequeris me post triduum. Triduum autem dixit
    medium inter diem passionis sancti Xysti, et diem hodiernam passionis sancti
    Laurentii. Triduum est medium. O consolatio! Non ait, Noli merere fili,
    desinet persecutio, et securus eris: sed, Noli merere: quo ego præcedo, tu
    sequeris; nec consecutio tua differtur. Triduum medium erit, et mecum eris.
    Accepit oraculum, vicit diabolum, pervenit ad triumphum."
lectio7:
  - Léctio sancti Evangélii secúndum Joánnem.
  - "!Joannes 12:24-28"
  - "In illo témpore: Dixit Jesus discipulis suis: Amen, amen dico vobis, nisi
    granum frumenti cadens in terram, mortuum fuerit; ipsum solum manet. Et
    réliqua."
  - _
  - Homilia sancti Joannis Chrysostomi.
  - "!Homilia 66. in Joánnem."
  - "Dulcis præsens vita est, et multæ plena voluptatis, non tamen omnibus, sed
    iis tantum, qui illi sunt affixi. Quod si quis in cælum suspexerit, et quæ
    ibi præclara sunt, contemplatus fuerit, statim hanc contemnet, ac nullius
    pretii existimabit. Nam et corporum pulchritudo, quoad pulchrius non
    deprehenditur, in admiratione habetur: cum vero aliud præstantius
    apparuerit, illa prior despicitur. Quod si illam pulchritudinem étiam nos
    intueri voluerimus, et cælestis regni speciem considerare, confestim nos
    hujus sæculi vinculis dissolvemus."
lectio8:
  - "Vinculum namque est terrenarum rerum affectio: ad cujus dissolutionem ut
    nos induceret Christus, quid dicat, attende. Qui amat animam suam, perdet
    eam: et qui odit animam suam in hoc mundo, in vitam ætérnam custodit eam.
    Enigmati simile hoc dictum videtur: non tamen ita est, immo vero præcipuæ
    sapientiæ plenum. Et quomodo qui amat animam suam, perdet eam? Qui absurdis
    ejus cupiditatibus obtemperat, qui præter debitum ei indulget: quemadmodum e
    contrario, qui odit eam in hoc mundo, custodit eam: hoc est, qui non paret
    ei, cum noxia jubet."
lectio9:
  - "Et non dixit: Qui non paret, sed, Qui odit. Sicuti enim quos odio
    habemus,'ne vocem quidem audire, nec vultum eorum videre æquo animo patimur:
    ita et animæ, si quid præter Dei voluntatem nobis imperat, vehementer
    aversari oportet. Cum enim jam de morte ad eos verba facturus esset, de
    morte videlicet sua, et prævideret eorum tristitiam et exanimationem, per
    excessum locutus est, inquiens: Quid dico, si mortem meam generose non
    feretis? Nisi vos ipsi moriamini, nullum vos sequetur emolumentum."
  - "&teDeum"
