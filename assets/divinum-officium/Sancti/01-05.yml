oratio:
  - "Omnípotens sempitérne Deus, dírige actus nostros in beneplácito tuo: ut in
    nómine dilécti Fílii tui mereámur bonis opéribus abundáre:"
  - $Qui tecum
lectio:
  - Lectio Epístolæ beati Pauli Apóstoli ad Gálatas.
  - "!Gal 4:1-7"
  - "Fratres: Quanto témpore heres párvulus est, nihil differt a servo, cum sit
    dóminus ómnium: sed sub tutóribus et actóribus est usque ad præfinítum
    tempus a patre: ita et nos, cum essémus párvuli, sub eleméntis mundi erámus
    serviéntes. At ubi venit plenitúdo témporis, misit Deus Fílium suum, factum
    ex mulíere, factum sub lege, ut eos, qui sub lege erant, redímeret, ut
    adoptiónem filiórum reciperémus. Quóniam autem estis fílii, misit Deus
    Spíritum Fílii sui in corda vestra, clamántem: Abba, Pater. Itaque jam non
    est servus, sed fílius: quod si fílius, et heres per Deum."
graduale:
  - "!Ps 44:3; 44:2"
  - "Speciósus forma præ filiis hóminum: diffúsa est gratia in lábiis tuis."
  - "V. Eructávit cor meum verbum bonum, dico ego ópera mea Regi: lingua mea
    cálamus scribæ, velóciter scribéntis. Allelúja, allelúja."
  - "!Ps 92:1."
  - "Dóminus regnávit, decórem índuit: índuit Dóminus fortitúdinem, et præcínxit
    se virtúte. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 2:19-23"
  - "In illo témpore: Defúncto Heróde, ecce, Angelus Dómini appáruit in somnis
    Joseph in Ægýpto, dicens: Surge, et áccipe Púerum et Matrem ejus, et vade in
    terram Israël: defúncti sunt enim, qui quærébant ánimam Pueri. Qui
    consúrgens, accépit Púerum et Matrem ejus, et venit in terram Israël.
    Audiens autem, quod Archeláus regnáret in Judæa pro Heróde patre suo, tímuit
    illo ire: et, admonítus in somnis, secéssit in partes Galilææ. Et véniens
    habitávit in civitáte, quæ vocátur Názareth: ut adimplére tur quod dictum
    est per Prophétas: Quóniam Nazaræus vocábitur."
offertorium:
  - "!Ps 92:1-2"
  - "Deus firmávit orbem terræ, qui non commovébitur: paráta sedes tua, Deus, ex
    tunc, a sǽculo tu es."
secreta:
  - "Concéde, quǽsumus, omnípotens Deus: ut óculis tuæ majestátis munus oblátum,
    et grátiam nobis piæ devotiónis obtíneat, et efféctum beátæ perennitátis
    acquírat."
  - $Per Dominum
communio:
  - "!Matt 2:20"
  - "Tolle Púerum et Matrem ejus, et vade in terram Israël: defúncti sunt enim,
    qui quærébant ánimam Púeri."
postcommunio:
  - Per hujus, Dómine, operatiónem mystérii, et vítia nostra purgéntur, et justa
    desidéria compleántur.
  - $Per Dominum
