lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Philippénses
  - "!Philipp 3:7-12"
  - "Fratres: Quæ mihi fuérunt lucra, hæc arbitrátus sum propter Christum
    defriménta. Verúmtamen exístimo ómnia detriméntum esse propter eminéntem
    sciéntiam Jesu Christi, Dómini mei: propter quem ómnia detriméntum feci et
    árbitror ut stércora, ut Christum lucrifáciam et invéniar in illo, non
    habens meam justítiam, quæ ex lege est, sed illam, quæ ex fide est Christi
    Jesu: quæ ex Deo est justítia in fide, ad cognoscéndum illum, et virtútem
    resurrectiónis ejus, et societátem passiónum illíus: configurátus morti
    ejus: si quo modo occúrram ad resurrectiónem, quæ est ex mórtuis: non quod
    jam accéperim aut jam perféctus sim: sequor autem, si quo modo comprehéndam,
    in quo et comprehénsus sum a Christo Jesu."
graduale:
  - "!Ps 91:13; 91:14"
  - "Justus ut palma florébit: sicut cedrus Líbani multiplicábitur in domo
    Dómini."
  - "!Ps 91:3"
  - Annuntiándum mane misericórdiam tuam, et veritátem tuam per noctem.
  - Allelúja, allelúja.
  - "!Osee 14:6"
  - "Justus germinábit sicut lílium: et florébit in ætérnum ante Dóminum.
    Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 11:25-30"
  - "In illo témpore: Respóndens Jesus, dixit: Confíteor tibi, Pater, Dómine
    coeli et terræ, quia abscondísti hæc a sapiéntibus et prudéntibus, et
    revelásti ea párvulis. Ita, Pater: quóniam sic fuit plácitum ante te. Omnia
    mihi trádita sunt a Patre meo. Et nemo novit Fílium nisi Pater: neque Patrem
    quis novit nisi Fílius, et cui volúerit Fílius reveláre. Veníte ad me,
    omnes, qui laborátis et oneráti estis, et ego refíciam vos. Tóllite jugum
    meum super vos, et díscite a me, quia mitis sum et húmilis corde: et
    inveniétis réquiem animábus vestris. Jugum enim meum suáve est et onus meum
    leve."
