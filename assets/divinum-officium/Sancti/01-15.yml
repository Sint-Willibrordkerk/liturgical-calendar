lectio4:
  - "Paulus, eremitárum auctor et magister, apud inferiórem Thebáidem natus, cum
    quindecim esset annórum, orbátus paréntibus est. Qui postea declinandæ causa
    persecutiónis Decii et Valeriáni, et Deo liberius inserviéndi, in eremi
    spelúncam se cóntulit: ubi, palma ei victum et vestítum præbente, vixit ad
    centésimum et décimum tertium annum, quo témpore ab Antonio nonagenario Dei
    admónitu invísitur. Quibus inter se, cum ántea non nossent, proprio nómine
    consalutántibus, et multa de regno Dei colloquéntibus, corvus, qui ántea
    semper Paulo dimidiátum panem attulerat, integrum détulit."
lectio5:
  - Post corvi discessum, Eja, inquit Paulus, Dóminus nobis prandium misit, vere
    pius, vere miséricors. Sexagínta jam anni sunt, cum accipio quotídie dimidii
    panis fragméntum, nunc ad advéntum tuum milítibus suis Christus duplicávit
    annonam. Quare cum gratiárum actióne ad fontem capiéntes cibum, ubi
    tantisper recreáti sunt, íterum gratiis de more Deo actis, noctem in divinis
    laudibus consumpsérunt. Dilúculo Paulus de morte, quæ sibi instaret,
    ádmonens Antónium, hortátur, ut pallium, quod ab Athanasio acceperat, ad
    involvéndum suum corpus afferret. Quo ex itinere rédiens ille, vidit inter
    Angelórum choros, inter Prophetárum et Apostolórum cœtus Pauli ánimam in
    cælum ascendere.
lectio6:
  - "Cumque ad ejus cellam pervenísset, invénit genibus complicatis, erecta
    cervice, exténsisque in altum mánibus corpus exanime: quod pallio obvolvens,
    hymnosque et psalmos ex christiana traditióne decantans, cum sárculum, quo
    terram fóderet, non haberet, duo leones ex interiore erémo rápido cursu ad
    beáti senis corpus ferúntur; ut facile intelligerétur, eos, quo modo
    póterant, plorátum édere: qui certatim terram pédibus effodiéntes, fóveam,
    quæ hóminem commode cáperet, effecérunt. Qui cum abiísent, Antonius sanctum
    corpus in eum locum íntulit; et injecta humo, tumulum ex christiáno more
    compósuit: túnicam vero Pauli, quam in sportæ modum ex palmæ foliis ille
    sibi contexúerat, secum áuferens, eo vestítu diébus solemnibus Paschæ et
    Pentecostes, quoad vixit, usus est."
lectio94:
  - Paulus, eremitárum auctor et magíster, apud inferiórem Thebáidem natus,
    persecutióne Décii et Valeriáni sæviénte, in erémi spelúncam se cóntulit;
    ubi, palma ei victum et vestítum præbénte, sanctíssime vixit ad centésimum
    et décimum tértium annum, quo témpore ab António nonagenário invísitur. Hunc
    Paulus humaníssime excépit, mox, sanctis sermónibus in multam noctem
    prodúctis, admónuit de morte, quæ sibi instáret, simúlque hortátus est, ut
    pállium, quod ab Athanásio accéperat, ad involvéndum suum corpus afférret.
    Quod dum Antónius præstábat, rédiens ex itínere, vidit Pauli ánimam in cælum
    ascéndere; corpus vero in cella réperit, similitúdinem orántis reddens. Quod
    cum mæstíssimus, hymnis de more decantátis, pállio obvolvísset, nec, quo
    terram fóderet, habéret; duo leónes, ex interióre parte solitúdinis
    veniéntes, uníus hóminis capácem locum effodérunt. Tum Antónius humáto
    córpore ac túmulo compósito, ábiit, túnicam Pauli ex palmárum fóliis
    contéxtam secum déferens; quo vestítu diébus solemnióribus Paschæ et
    Pentecóstes, quoad vixit, usus est.
