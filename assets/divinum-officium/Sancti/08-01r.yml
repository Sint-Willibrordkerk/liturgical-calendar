  - Simplex
  - "1.1"
  - "@C3"
rule:
  - vide C3;
introitus:
  - "!Ps 33:18"
  - v. Clamavérunt justi, et Dóminus exaudívit eos; et ex ómnibus
    tribulatiónibus eórum liberávit eos.
  - "!Ps 33:2"
  - v. Benedícam Dóminum in omni témpore; semper laus ejus in ore meo.
  - "&Gloria"
  - v. Clamavérunt justi, et Dóminus exaudívit eos; et ex ómnibus
    tribulatiónibus eórum liberávit eos.
oratio:
  - "Fratérna nos, Dómine, Mártyrum tuórum coróna lætíficet: quæ et fídei nostræ
    præbeat increménta virtútum; et multíplici nos suffrágio consolétur."
  - $Per Dominum
lectio:
  - Lectio Epistolæ Sancti Pauli Apostoli ad Hebrǽos
  - "!Heb 11:33-39"
  - "Fratres: sancti per fidem vicérunt regna, operáti sunt justítiam, adépti
    sunt repromissiónes, obturavérunt ora leónum, extinxérunt ímpetum ignis,
    effugérunt áciem gládii, convaluérunt de infirmitáte, fortes facti sunt in
    bello, castra vertérunt exterórum: accepérunt mulíeres de resurrectióne
    mórtuos suos: álii autem disténti sunt non suscipiéntes redemptiónem ut
    meliórem invenírent resurrectiónem. Alii vero ludíbria, et vérbera expérti,
    ínsuper et víncula, et cárceres: lapidáti sunt, secti sunt, tentáti sunt, in
    occisióne gládii mórtui sunt, circuiérunt in melótis, in péllibus caprínis,
    egéntes, angustiáti, afflícti: quibus dignus non erat mundus: in
    solitudínibus errántes, in móntibus, in spelúncis, et in cavérnis terræ. Et
    hi omnes testimónio fídei probáti, invénti sunt in Christo Iesu, Dómino
    nostro."
graduale:
  - "@Sancti/06-26"
evangelium:
  - "@Commune/C3a-1"
offertorium:
  - "!Ps 149:5-6"
  - Exsultábunt sancti in glória; lætabúntur in cubílibus suis. Exaltatiónes Dei
    in gútture eórum. Allelúia.
secreta:
  - "Mystéria tua, Dómine, pro sanctórum Mártyrum tuórum honóre, devóta mente
    tractémus: quibus et præsídium nobis crescat et gáudium."
  - $Per Dominum
communio:
  - "!Luc 12:4"
  - "Dico autem vobis amícis meis: Ne terreámini ab his qui occídunt corpus."
postcommunio:
  - "Præsta, quǽsumus, omnípotens Deus: ut, quorum memóriam sacraménti
    participatióne recólimus, fidem quoque proficiéndo sectémur."
  - $Per Dominum
lectio93:
  - Sermo sancti Gregório Nazianzéni
  - "!Orátio 20 in Machabæos"
  - Quidnam Machabǽi? Horum enim nómine dies festus præsénti frequéntia
    celebrátur. Qui, etsi apud multos non sunt in honóre, quod illud certámen
    post Christum non suscepérunt; tamen digni sunt qui ab ómnibus honoréntur,
    quia pro pátriis légibus et institútis fortes constantésque se præbuérunt.
    Nam qui martýrium subiére ante Christi passiónem, quid factúri erant, si
    post Christum persecutiónem passi fuíssent, ejúsque mortem, nostræ salútis
    causa suscéptam, ad imitándum propósitam habuíssent? Quorum enim, nullo
    propósito exémplo, talis tántaque virtus fuit; an non ii, exémplum illud
    intuéntes, fórtius in certámen descendíssent? Quin étiam mýstica quædam et
    occúlta rátio, mihi quidem atque ómnibus Dei amatóribus valde probábilis
    est, néminem eórum qui ante Christi advéntum martýrio consummáti sunt, id
    sine fide in Christum cónsequi potuísse.
  - "&teDeum"
