lectio93:
  - Doróthea virgo, ex Cæsaréa Cappadociæ, propter Christi confessiónem ab
    Apricio præside comprehensa, Chrystæ et Callistæ soróribus, quæ a fide
    defécerant, tradita est, ut eam a propósito removérent. Sed contra factum
    est; nam eas Doróthea ad cultum christianæ religiónis redúxit, propter quam
    étiam martyrium suscepérunt. Quare Virgo equuleo diu torta et palmis cæsa,
    ad extremum cápitis damnata, duplicatam virginitátis et martyrii palmam
    accepit.
