oratio:
  - "Deus, qui multitúdinem populórum, beáti Bonifátii Mártyris tui atque
    Pontíficis zelo, ad agnitiónem tui nóminis vocáre dignátus es: concéde
    propítius; ut, cujus sollémnia cólimus, étiam patrocínia sentiámus."
  - $Per Dominum
lectio:
  - "@Sancti/02-12"
graduale:
  - "!1 Pet 4:13-14"
  - Communicántes Christi passiónibus gaudéte, ut in revelatióne glóriæ ejus
    gaudeátis exsultántes.
  - "V. Si exprobrámini in nómine Christi, beáti éritis: quóniam, quod est
    honóris, glóriæ et virtútis Dei, et qui est ejus Spíritus, super vos
    requiéscet. Allelúja, allelúja."
  - "!Is 66:12"
  - Declinábo super eum quasi flúvium pacis, et quasi torréntem inundántem
    glóriam. Allelúja.
gradualep:
  - Allelúja.
  - "!Is 66:10; 66:14"
  - Lætámini cum Jerúsalem, et exsultáte in ea, omnes, qui dilígitis Dóminum.
    Allelúja.
  - "V. Vidébitis, et gaudébit cor vestrum: cognoscétur manus Dómini servis
    ejus. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 5:1-12"
  - "In illo témpore: Videns Jesus turbas, ascéndit in montem, et cum sedísset,
    accessérunt ad eum discípuli ejus, et apériens os suum, docébat eos, dicens:
    Beáti páuperes spíritu: quóniam ipsórum est regnum cœlórum. Beáti mites:
    quóniam ipsi possidébunt terram. Beáti, qui lugent: quóniam ipsi
    consolabúntur. Beáti, qui esúriunt et sítiunt justítiam: quóniam ipsi
    saturabúntur. Beáti misericórdes: quóniam ipsi misericórdiam consequántur.
    Beáti mundo corde: quóniam ipsi Deum vidébunt. Beáti pacífici: quóniam fílii
    Dei vocabúntur. Beáti, qui persecutiónem patiúntur propter justítiam:
    quóniam ipsórum est regnum cœlórum. Beáti estis, cum maledíxerint vobis et
    persecúti vos fúerint, et díxerint omne malum advérsum vos, mentiéntes,
    propter me: gaudete et exsultáte, quóniam merces vestra copiósa est in
    cœlis."
offertorium:
  - "!Ps 15:7; 15:8"
  - "Benedícam Dóminum, qui tríbuit mihi intelléctum: providébam Deum in
    conspéctu meo semper, quóniam a dextris est mihi ne commóvear. (Allelúja.)"
secreta:
  - "Super has hóstias, Dómine, quǽsumus, benedíctio copiósa descéndat: quæ et
    sanctificatiónem nostram misericórditer operátur; et de sancti Bonifátii
    Mártyris tui atque Pontíficis fáciat sollemnitáte gaudére."
  - $Per Dominum
communio:
  - "!Apoc 3:21"
  - "Qui vícerit, dabo ei sedére mecum in throno meo: sicut et ego vici et sedi
    cum Patre meo in throno ejus. (Allelúja.)"
postcommunio:
  - "Sanctificáti, Dómine, salutári mystério: quǽsumus; ut nobis sancti
    Bonifátii Mártyris tui atque Pontíficis pia non desit orátio, cujus nos
    donásti patrocínio gubernári."
  - $Per Dominum
