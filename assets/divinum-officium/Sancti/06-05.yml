introitus:
  - "!Is 65:19; 65:23"
  - "v. Exsultábo in Jerúsalem et gaudébo in pópulo meo: et non audiétur in eo
    ultra vos fletus et vox clamóris. Elécti mei non laborábunt frustra neque
    generábunt in conturbatióne: quia semen benedictórum Dómini est, et nepótes
    eórum cum eis."
  - "!Ps 43:2"
  - "Deus, áuribus nostris audívimus: patres nostri narravérunt opus, quod
    operátus es in diébus eórum."
  - "&Gloria"
  - "v. Exsultábo in Jerúsalem et gaudébo in pópulo meo: et non audiétur in eo
