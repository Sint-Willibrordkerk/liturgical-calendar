lectio4:
  - Bonifátius, ántea Winfrídus appellátus, apud Anglos natus est exeúnte sæculo
    séptimo, et ab ipsa infántia mundum aversátus, vitam monásticam in votis
    hábuit. Cum ejus pater ánimum sæculi illécebris permutáre frustra tentásset,
    monastérium ingréditu, et sub beáti Wolphárdi disciplína ómnium virtútum ac
    scientiárum génere imbúitur. Annum agens trigésimum sacerdótio insignítur,
    ac verbi divíni prædicátor assíduus, magno animárum lucro hoc in múnere
    versátur. Attamen, regnum Christi adaugére desíderans, contínuo flebat
    ingéntem multitúdinem barbarórum, qui ignorántiæ ténebris immérsi dæmoni
    famulabántur. Qui quidem animárum zelus cum in dies inexstinguíbili ardóre
    accrésceret, divíno númine per lácrimas et oratiónes exploráto, facultátem a
    monastérii præpósito obtínuit ad Germánicas oras proficiscéndi.
lectio5:
  - Ex Anglia duóbus cum sóciis navem solvens, Dorestádium in Frísiæ óppidum
    venit. Cum autem bellum gravíssimum inter Frísonum regem Radbódum et Cárolum
    Martéllum exarsísset, sine fructu Evangélium prædicávit. Quaprópter in
    Angliam revérsus, ad suum redívit monastérium, cui invítus præfícitur. Post
    elápsum biénnium, ex consénsu epíscopi Vintoniénsis, munus abdicávit, et
    Romam proféctus est, ut apostólica auctoritáte ad Gentílium conversiónem
    delegarétur. Cum ad Urbem pervenísset, a Gregório secúndo benígne excípitur,
    pro Winfrído Bonifátius a Pontífice nominátur. In Germániam diréctus,
    Thuríngiæ Saxoniæque pópulis Christum annuntiávit. Cum intérea Radbódus,
    Frísiæ rex ac infestíssimus christiáni nóminis hostis, occubuísset,
    Bonifátius ad Frísones rédiit, ubi sancti Willibrórdi sócius per triénnium
    tanto cum fructu Evangélium prædicávit, ut, destrúctis idolórum simulácris,
    innúmeræ vero Deo ecclésiæ excitaréntur.
lectio6:
  - A sancto Willibrórdo ad episcopále munus expetítus, illud detrectávit ut
    prómpius infidélium salúti instáret. In Germániam proféctus, plura Hassórum
    míllia a dæmonis superstitióne avocávit. A Gregório Pontífice Romam
    evocátus, post insígnem fídei professiónem epíscopus consecrátur. Exínde ad
    Germános redux, Hássiam et Thuríngiam ab idololatríæ relíquiis pénitus
    expurgávit. Tanta propter mérita Bonifátius a Gregório tértio ad dignitátem
    archiepiscopálem evéhitur, et tértio Romam proféctus a summo Pontífice Sedis
    apostólicæ legátus constitúitur. Qua insignítus auctoritáte quátuor
    episcopátus instítuit, et várias synodos celebrávit, inter quas concílium
    Leptinénse memorábile est, apud Belgas in Cameracénsi diœcési celebrátum,
    quo quidem témpore ad fidem in Bélgio adaugéndam egrégie cóntulit. A
    Zacharía Papa creátus Mogúntius archiepíscopus, ipso Pontífice jubénte,
    Pipínum in regem Francórum unxit. Post mortem sancti Willibrórdi
    Ultrajecténsem ecclésiam gubernándum suscépit, primo per Eóbanum, deínde per
    seípsum, dum ab ecclésia Moguntína absolútus Ultrajécti resédit. Frisónibus
    ad idololatríam relápsis, Evangélium prædicáre rursus aggréditur, cumque
    offício pastoráli occuparétur, a bárbaris et ímpiis homínibus juxta Bornam
    flúvium cum Eóbano coëpíscopo multísque áliis cruénta cæde perémptus
    martyrii palma condecorátur. Corpus sancti Bonifátii Mogúntiam translátum,
    et, ut ipse vivens petíerat, in Fuldénsi monastério, quod exstrúxerat,
    recónditum fuit, ubi multis miráculis incláruit. Pius autem nonus Póntifex
    máximus, ejus Offícium et Missam ad univérsam Ecclésiam exténdit.
lectio94:
  - Bonifátius, ántea Winfrídus appellátus, apud Anglos natus est exeúnte sǽculo
    séptimo. Monastérium ingréssus et sacerdótio auctus, magno animárum lucro in
    prædicatóris múnere est versátus. Zelo augéndæ fídei accénsus, apud Frísones
    Evangélium prædicávit. In Angliam revérsus, cum per biénnium monastério
    sanctíssime præfuísset, superióris múnere abdicáto, Romam se cóntulit, ubi a
    Gregório secúndo Bonifátii nomen accépit, et in Germániam missus, Thuríngiæ
    Saxoniǽque pópulis Christum annuntiávit. Ad Frísones revérsus, cum sancto
    Willibrórdo, magno fructu Evangélium prædicávit. Mox Romam accersítus,
    episcopáli dignitáte insignítur, et in Germániam íterum proféctus, Hássiam
    et Thuríngiam ab idololatríæ relíquiis pénitus expurgávit. Sedis apostólicæ
    legátus creátus et Moguntínus archiepíscopus, plures eréxit et, per se vel
    per discípulos, administrávit ecclésias. Frisónibus demum ad idololatríam
    relápsis Evangélium prædicáre rursus aggréssus, cum Eóbano coëpíscopo
    multísque áliis, juxta Bornam flúvium cruénta cæde perémptus, martýrii
    palmam accépit. Ejus corpus in Fuldénsi monastério cónditum est.
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum.
  - "!Matt 5:1-12"
  - "In illo témpore: Videns Jesus turbas, ascéndit in montem, et cum sedísset,
    accessérunt ad eum discípuli ejus. Et réliqua."
  - _
  - Homilia sancti Augustíni Epíscopi.
  - "!Liber 1 de sermone Dómini in monte, cap. 2. et 3."
  - "Beáti mundo corde; quóniam ipsi Deum vidébunt. Quam ergo stulti sunt, qui
    Deum istis exterióribus óculis quærunt, cum corde videátur, sicut álibi
    scriptum est: Et in simplicitáte cordis quærite illum. Hoc est enim mundum
    cor, quod est simplex cor. Et quemádmodum lumen hoc vidéri non potest, nisi
    óculis mundis; ita nec Deus vidétur, nisi mundum sit illud quo vidéri
    potest. Beáti pacífici; quóniam ipsi fílii Dei vocabúntur. In pace perféctio
    est, ubi nihil repúgnat; et ídeo fílii Dei pacífici, quóniam nihil in his
    resístit Deo, et útique fílii similitúdinem patris habére debent."
lectio8:
  - Pacífici autem in semetípsis sunt, qui omnes ánimi sui motus componéntes, et
    subjiciéntes ratióni, id est menti et spirítui, carnalésque concupiscéntias
    habéntes edómitas, fiunt regnum Dei. In quo ita sunt ordináta ómnia, ut id
    quod est in hómine præcípuum et excéllens, hoc ímperet, céteris non
    reluctántibus, quæ sunt nobis bestiísque commúnia; atque idípsum quod
    excélluit in hómine, id est mens et rátio, subjiciátur potióri, quod est
    ipsa véritas, unigénitus Fílius Dei. Neque enim imperáre inferióribus
    potest, nisi superióri se ipse subjíciat. Et hæc est pax, quæ datur in terra
    homínibus bonæ voluntátis; hæc vita consummáti perfectíque sapiéntis.
lectio9:
  - "De hujúsmodi regno pacatíssimo et ordinatíssimo missus est foras princeps
    hujus sæculi, qui pervérsis inordinatísque dominátur. Hac pace intrínsecus
    constitúta atque firmáta, quascúmque persecutiónes ille, qui foras missus
    est, forínsecus concitáverit, auget glóriam, quæ secúndum Deum est; non
    áliquid in illo ædifício labefáctans, sed deficiéntibus máchinis suis
    innotéscere fáciens, quanta fírmitas intus exstrúcta sit. Ideo séquitur:
    Beáti, qui persecutiónem patiúntur propter justítiam; quóniam ipsórum est
    regnum cælórum."
  - "&teDeum"
