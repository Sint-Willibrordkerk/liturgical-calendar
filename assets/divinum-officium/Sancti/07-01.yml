lectio1:
  - De Epístola beáti Pauli Apóstoli ad Hebrǽos
  - "!Heb 9:11-15"
  - "11 Christus assístens póntifex futurórum bonórum, per ámplius et perféctius
    tabernáculum, non manufáctum, id est, non hujus creatiónis:"
  - 12 neque per sánguinem hircórum aut vitulórum, sed per próprium sánguinem
    introívit semel in Sancta, ætérna redemptióne invénta.
  - "13 Si enim sanguis hircórum et taurórum, et cinis vítulæ aspérsus
    inquinátos sanctíficat ad emundatiónem carnis:"
  - 14 quanto magis sanguis Christi, qui per Spíritum Sanctum semetípsum óbtulit
    immaculátum Deo, emundábit consciéntiam nostram ab opéribus mórtuis, ad
    serviéndum Deo vivénti?
  - "15 Et ídeo novi testaménti mediátor est: ut morte intercedénte, in
    redemptiónem eárum prævaricatiónum, quæ erant sub prióri testaménto,
    repromissiónem accípiant qui vocáti sunt ætérnæ hereditátis."
responsory1:
  - "R. Jesus, ut sanctificáret per suum sánguinem pópulum, extra portam passus
    est:"
  - "* Exeámus ígitur ad eum extra castra, impropérium ejus portántes."
  - V. Nondum enim usque ad sánguinem restitístis advérsus peccátum repugnántes.
  - R. Exeámus ígitur ad eum extra castra, impropérium ejus portántes.
lectio2:
  - "!Heb 9:16-22"
  - 16 Ubi enim testaméntum est, mors necésse est intercédat testatóris.
  - "17 Testaméntum enim in mórtuis confirmátum est: alióquin nondum valet, dum
    vivit qui testátus est."
  - 18 Unde nec primum quidem sine sánguine dedicátum est.
  - 19 Lecto enim omni mandáto legis a Móyse univérso pópulo, accípiens
    sánguinem vitulórum et hircórum cum aqua, et lana coccínea, et hyssópo,
    ipsum quoque librum, et omnem pópulum aspérsit,
  - "20 dicens: Hic sanguis testaménti, quod mandávit ad vos Deus."
  - 21 Etiam tabernáculum et ómnia vasa ministérii sánguine simíliter aspérsit.
  - "22 Et ómnia pene in sánguine secúndum legem mundántur: et sine sánguinis
    effusióne non fit remíssio."
responsory2:
  - "R. Móyses sumptum sánguinem respérsit in pópulum:"
  - "* Et ait: Hic est sanguis fœ́deris, quod pépigit Dóminus vobíscum."
  - V. Fide celebrávit Pascha et sánguinis effusióne, ne qui vastábat primitíva,
    tángeret eos.
  - "R. Et ait: Hic est sanguis fœ́deris, quod pépigit Dóminus vobíscum."
lectio3:
  - "!Heb 10:19-24"
  - 19 Habéntes ítaque, fratres, fidúciam in intróitu sanctórum in sánguine
    Christi,
  - 20 quam initiávit nobis viam novam, et vivéntem per velámen, id est, carnem
    suam,
  - "21 et sacerdótem magnum super domum Dei:"
  - 22 accedámus cum vero corde in plenitúdine fídei, aspérsi corda a
    consciéntia mala, et ablúti corpus aqua munda,
  - 23 teneámus spei nostræ confessiónem indeclinábilem (fidélis enim est qui
    repromísit),
  - 24 et considerémus ínvicem in provocatiónem caritátis, et bonórum óperum.
responsory3:
  - "R. Vos, qui aliquándo erátis longe, facti estis prope in sánguine Christi:"
  - "* Ipse enim est pax nostra, qui fecit útraque unum."
  - V. Complácuit per eum reconciliáre ómnia in ipsum, pacíficans per sánguinem
    crucis ejus, sive quæ in cælis sunt.
  - R. Ipse enim est pax nostra, qui fecit útraque unum.
  - "&Gloria"
  - R. Ipse enim est pax nostra, qui fecit útraque unum.
lectio4:
  - Sermo sancti Joánnis Chrysóstomi
  - "!Homilia ad Neophytos"
  - Vis sánguinis Christi audíre virtútem? Redeámus ad ejus exémplum, et priórem
    typum recordémur, et prístinam Scriptúram narrémus. In Ægýpto, nocte média,
    Ægýptiis Deus plagam décimam minabátur, ut eórum primogénita deperírent,
    quia primogénitum ejus pópulum detinébant. Sed, ne amáta plebs Judæórum una
    cum illis periclitarétur, quia unus locus continébat univérsos, remédium
    discretiónis invéntum est. Proínde exémplum mirábile, ut discas in veritáte
    virtútem. Ira divínæ indignatiónis operabátur, et domos síngulas mórtifer
    circuíbat. Quid ígitur Móyses? Occídite, inquit, agnum annículum, et
    sánguine ejus liníte jánuas. Quid ais, Móyses? Sanguis ovis rationálem
    hóminem liberáre consuévit? Valde, inquit; non eo quod sanguis est, sed quia
    Domínici sánguinis per eum demonstrátur exémplum.
responsory4:
  - R. In timóre incolátus vestri témpore conversámini
  - "* Sciéntes quod non corruptibílibus auro vel argénto redémpti estis."
  - V. Sed pretióso sánguine quasi agni immaculáti Christi.
  - R. Sciéntes quod non corruptibílibus auro vel argénto redémpti estis.
lectio5:
  - Nam, sicut regnántium státuæ, quæ sine causa sunt et sermóne, nonnúmquam ad
    se confugiéntibus homínibus, ánima et ratióne decorátis, subveníre
    consuevérunt, non quia sunt ære conféctæ, sed quia rétinent imáginem
    principálem; ita et sanguis ille, qui irrationális fuit, ánimas habéntes
    hómines liberávit, non quia sanguis fuit, sed quia hujus sánguinis
    ostendébat advéntum. Et tunc Angelus ille vastátor, cum linítos postes atque
    áditus pervidéret, transjécit gressus et non est ausus intráre. Nunc ergo si
    víderit inimícus, non póstibus impósitum sánguinem typi, sed fidélium ore
    lucéntem sánguinem veritátis Christi, templi póstibus dedicátum, multo magis
    se súbtrahet. Si enim Angelus cessit exémplo, quanto magis terrébitur
    inimícus, si ipsam perspéxerit veritátem? Vis et áliam hujus sánguinis
    scrutári virtútem? Volo. Unde primum occúrrit, inspícias, et de quo fonte
    manávit. De ipsa primum cruce procéssit; latus illud Domínicum inítium fuit.
    Latus miles apéruit, et templi sancti paríetem patefécit; et ego thesáurum
    præclárum invéni, et fulgéntes divítias me grátulor reperíre.
responsory5:
  - "R. Empti estis prétio magno:"
  - "* Glorificáte et portáte Deum in córpore vestro."
  - "V. Prétio empti estis: nolíte fíeri servi hóminum."
  - R. Glorificáte et portáte Deum in córpore vestro.
lectio6:
  - "Sic et de illo agno factum est: Judǽi ovem occidérunt, et ego fructum de
    sacraménto cognóvi. De látere sanguis et aqua. Nolo tam fácile, audítor,
    tránseas tanti secréta mystérii; restat enim mihi mýstica atque secretális
    orátio. Dixi baptísmatis sýmbolum et mysteriórum, aquam illam et sánguinem
    demonstráre. Ex his enim sancta fundáta est Ecclésia per lavácri
    regeneratiónem, et renovatiónem Spíritus Sancti. Per baptísma, inquam, et
    mystéria, quæ ex látere vidéntur esse proláta. Ex látere ígitur suo Christus
    ædificávit Ecclésiam, sicut de látere Adam ejus conjux Heva proláta est. Nam
    hac de causa Paulus quoque testátur dicens: De córpore ejus et de óssibus
    ejus sumus; latus vidélicet illud signíficans. Nam, sicut de illo látere
    Deus fecit féminam procreári, sic et de suo látere Christus aquam nobis et
    sánguinem dedit, unde repararétur Ecclésia. - Recurrénte autem anno ab
    humáni géneris redemptióne undevícies centenário, quem ad tam ineffábile
    benefícium recoléndum solémni præ ómnibus sacro Jubilǽo summus Póntifex Pius
    undécimus celebrátum vóluit; ut pretiósi sánguinis quo redémpti sumus, Agni
    Immaculáti Christi uberióres dimanárent in hómines fructus, ejúsque memória
    fidélibus, vivídius commendarétur, idem summus Póntifex Pretiosíssimi
    Sánguinis Dómini nostri Jesu Christi festum, quotánnis ab univérsa Ecclésia
    peragéndum, ad ritum dúplicem primæ classis evéxit."
responsory6:
  - "R. Comméndat caritátem suam Deus in nobis:"
  - "* Quóniam cum adhuc peccatóres essémus, secúndum tempus Christus pro nobis
    mórtuus est."
  - V. Multo ígitur magis nunc justificáti in sánguine ipsíus, salvi érimus ab
    ira per ipsum.
  - R. Quóniam cum adhuc peccatóres essémus, secúndum tempus Christus pro nobis
    mórtuus est.
  - "&Gloria"
  - R. Quóniam cum adhuc peccatóres essémus, secúndum tempus Christus pro nobis
    mórtuus est.
lectio7:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 19:30-35"
  - "In illo témpore: Cum accepísset Jesus acétum, dixit: Consummátum est. Et,
    inclináto cápite, trádidit spíritum. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tractatus 120 in Joannem"
  - "Vigilánti verbo Evangelísta usus est, ut non díceret: Latus ejus percússit,
    aut vulnerávit, aut quid áliud, sed Apéruit; ut illic quodámmodo vitæ óstium
    panderétur, unde sacraménta Ecclésiæ manavérunt, sine quibus ad vitam, quæ
    vera vita est, non intrátur. Ille sanguis qui fusus est, in remissiónem
    fusus est peccatórum. Aqua illa salutáre témperat póculum; hæc et lavácrum
    præstat et potum. Hoc prænuntiábat quod Noë in látere arcæ óstium fácere
    jussus est, quo intrárent animália quæ non erant dilúvio peritúra, quibus
    præfigurabátur Ecclésia. Propter hoc prima múlier facta est de látere viri
    dormiéntis, et appelláta est vita matérque vivórum. Magnum quippe
    significávit bonum, ante magnum prævaricatiónis malum. Hic secúndus Adam,
    inclináto cápite, in cruce dormívit, ut inde formarétur ei conjux, quæ de
    látere dormiéntis efflúxit. O mors, unde mórtui revivíscunt! Quid isto
    sánguine múndius? Quid vúlnere isto salúbrius?"
responsory7:
  - "R. Hic est, qui venit per aquam et sánguinem, Jesus Christus:"
  - "* Non in aqua solum, sed in aqua et sánguine."
  - V. In die illa erit fons patens dómui David et habitántibus Jerúsalem in
    ablutiónem peccatóris.
  - R. Non in aqua solum, sed in aqua et sánguine.
lectio8:
  - "!Enarrat. in Psalm. 95, n. 5"
  - Tenebántur hómines captívi sub diábolo, et dæmónibus serviébant; sed
    redémpti sunt a captivitáte. Véndere enim se potuérunt, sed redímere non
    potuérunt. Venit Redémptor, et dedit prétium; fudit sánguinem suum, et emit
    orbem terrárum. Quǽritis quid émerit? Vidéte quid déderit, et inveniétis
    quid émerit. Sanguis Christi prétium est. Tanti quid valet? quid, nisi totus
    orbis? quid, nisi omnes gentes? Valde ingráti sunt prétio suo, aut multum
    supérbi sunt, qui dicunt, aut illud tam parum esse ut solos Afros émerit,
    aut se tam magnos esse pro quibus solis illud sit datum. Non ergo exsúltent,
    non supérbiant. Pro toto dedit, quantum dedit.
responsory8:
  - R. Prædestinávit nos Deus in adoptiónem filiórum per Jesum Christum,
  - "* In quo habémus redemptiónem per sánguinem ejus."
  - V. Remissiónem peccatórum secúndum divítias grátiæ ejus, quæ superabundávit
    in nobis.
  - R. In quo habémus redemptiónem per sánguinem ejus.
  - "&Gloria"
  - R. In quo habémus redemptiónem per sánguinem ejus.
lectio9:
  - "!Sermo 31, alias 344"
  - "Hábuit ille sánguinem, unde nos redímeret; et ad hoc accépit sánguinem, ut
    esset quem pro nobis rediméndis effúnderet. Sanguis Dómini tui, si vis,
    datus est pro te; si nolúeris esse, non est datus pro te. Forte enim dicis:
    Hábuit sánguinem Deus meus, quo me redímeret, sed jam, cum passus est, totum
    dedit; quid illi remánsit, quod det et pro me? Hoc est magnum, quia semel
    dedit, et pro ómnibus dedit. Sanguis Christi volénti est salus, nolénti
    supplícium. Quid ergo dúbitas, qui mori non vis, a secúnda pótius morte
    liberári? Qua liberáris, si vis tóllere crucem tuam, et sequi Dóminum; quia
    ille tulit suam, et quæsívit servum."
  - "&teDeum"
