graduale:
  - "!1 Joann 5:6-8"
  - "Hic est, qui venit per aquam et sánguinem, Jesus Christus: non in aqua
    solum, sed in aqua et sánguine."
  - "V. Tres sunt, qui testimónium dant in cœlo: Pater, Verbum et Spíritus
    Sanctus; et hi tres unum sunt. Et tres sunt, qui testimónium dant in terra:
    Spíritus, aqua et sanguis: et hi tres unum sunt. Allelúja, allelúja."
  - "!1 Joann 5:9"
  - V. Si testimónium hóminum accípimus, testimónium Dei majus est. Allelúja.
gradualep:
  - Allelúja, allelúja
  - "!Apoc 5:9"
  - "Dignus es, Dómine, accípere librum, et aperíre signácula ejus: quóniam
    occísus es, et redemísti nos Deo in sánguine tuo."
  - "!Exod 12:13"
  - "Erit autem sanguis vobis in signum: et vidébo sánguinem, et transíbo vos:
    nec erit in vobis plaga dispérdens. Allelúja."
tractus:
  - "!Ephes 1:6-8"
  - Gratificávit nos Deus in dilécto Fílio suo, in quo habémus redemptiónem per
    sánguinem ejus.
  - V. Remissiónem peccatórum, secúndum divítias grátiæ ejus, quæ superabundávit
    in nobis.
  - "!Rom 3:24-25"
  - Justificáti gratis per grátiam ipsíus, per redemptiónem, quæ est in Christo
    Jesu.
  - V. Quem propósuit Deus propitiatiónem per fidem in sánguine ipsíus.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem.
  - "!Joann 19:30-35"
  - "In illo témpore: Cum accepísset Jesus acétum, dixit: Consummátum est. Et
    inclináto cápite trádidit spíritum. Judæi ergo - quóniam Parascéve erat -,
    ut non remanérent in cruce córpora sábbato - erat enim magnus dies ille
    sábbati -, rogavérunt Pilátum, ut frangeréntur eórum crura et tolleréntur.
    Venérunt ergo mílites: et primi quidem fregérunt crura et altérius, qui
    crucifíxus est cum eo. Ad Jesum autem cum venissent, ut vidérunt eum jam
    mórtuum, non fregérunt ejus crura, sed unus mílitum láncea latus ejus
    apéruit, et contínuo exívit sanguis et aqua. Et qui vidit, testimónium
    perhíbuit; et verum est testimónium ejus."
offertorium:
  - "!1 Cor 10:16"
  - Calix benedictiónis, cui benedícimus, nonne communicátio sánguinis Christi
    est? et panis, quem frángimus, nonne participátio córporis Dómini est?
secreta:
  - "Per hæc divína mystéria, ad novi, quǽsumus, Testaménti mediatórem Jesum
    accedámus: et super altária tua, Dómine virtútum, aspersiónem sánguinis
    mélius loquéntem, quam Abel, innovémus."
  - $Per eundem
