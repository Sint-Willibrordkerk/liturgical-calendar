oratio:
  - "Deus, qui nos beáti Geórgii Mártyris tui méritis et intercessióne
    lætíficas: concéde propítius; ut, qui tua per eum benefícia póscimus, dono
    tuæ grátiæ consequámur."
  - $Per Dominum
lectio:
  - "@Commune/C2a-1"
secreta:
  - "Múnera, Dómine, obláta sanctífica: et, intercedénte beáto Geórgio Mártyre
    tuo, nos per hæc a peccatórum nostrórum máculis emúnda."
  - $Per Dominum
postcommunio:
  - "Súpplices te rogámus, omnípotens Deus: ut, quos tuis réficis sacraméntis,
    intercedénte beáto Geórgio Mártyre tuo, tibi étiam plácitis móribus
    dignánter tríbuas deservíre."
  - $Per Dominum
