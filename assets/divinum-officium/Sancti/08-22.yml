ant-1:
  - Exsultávit cor meum * in Dómino, et exaltátum est cornu meum in Deo meo,
    quia lætáta sum in salutári tuo.
lectio4:
  - Sermo sancti Bernardíni Senénsis
  - "!Ex sermone 9 de visitatione"
  - "Quis mortálium, nisi divíno tutus oráculo, de vera Dei et hóminis Genetríce
    quidquam módicum, sive grande præsúmat incircumcísis, immo pollútis lábiis
    nomináre, quam Pater ante sǽcula Deus perpétuam prædestinávit in Vírginem,
    digníssimam Fílius elégit in Matrem, Spíritus Sanctus omnis grátiæ
    domicílium præparávit? Quibus verbis ego homúnculus sensus altíssimos
    virgínei Cordis, sanctíssimo ore prolátos, éfferam, quibus non súfficit
    lingua ómnium Angelórum? Dóminus enim ait: Bonus homo de bono thesáuro
    cordis profert bona; quod verbum potest étiam esse thesáurus. Quis inter
    puros hómines mélior homo potest excogitári, quam illa, quæ méruit éffici
    Mater Dei, quæ novem ménsibus in corde et in útero suo ipsum Deum hospitáta
    est? Quis thesáurus mélior, quam ipse divínus amor quo fornáceum cor
    Vírginis ardens erat?"
lectio5:
  - "De hoc ígitur Corde quasi de fornáce divíni ardóris Virgo beáta prótulit
    verba bona, id est, verba ardentíssimæ caritátis. Sicut enim a vase summo et
    óptimo vino pleno, non potest exíre nisi óptimum vinum; aut sicut a fornáce
    summi ardóris non egréditur nisi incéndium fervens; sic quippe a Christi
    Matre exíre non pótuit verbum, nisi summi summéque divíni amóris atque
    ardóris. Sapiéntis quoque dóminæ et matrónæ est pauca verba, sólida tamen
    atque sententiósa habére; proínde septem vícibus quasi septem verba tantum
    miræ senténtiæ et virtútis a Christi benedictíssima Matre legúntur dicta, ut
    mýstice ostendátur ipsam fuísse plenam grátia septifórmi. Cum Angelo bis
    tantúmmodo est locúta. Cum Elísabeth bis étiam. Cum Fílio étiam bis, semel
    in templo, secúndo in núptiis. Cum minístris semel. Et in his ómnibus semper
    valde parum locúta est; excépto quod in laude Dei et gratiárum actióne se
    ámplius dilatávit, scílicet, quum ait: Magníficat ánima mea Dóminum. Ubi non
    cum hómine, sed cum Deo locúta fuit. Hæc septem verba secúndum septem amóris
    procéssus et actus sub miro gradu et órdine sunt proláta; quasi sint septem
    flammæ fornácei Cordis ejus."
lectio6:
  - "!Ex ecclesiasticis documentis"
  - "Cultum litúrgicum, quo Cordi Immaculáto Vírginis Maríæ débitus tribúitur
    honor, cuíque plures viri sancti ac mulíeres viam parárunt, ipsa Apostólica
    Sedes primum approbávit ineúnte sǽculo undevicésimo, cum Pius Papa séptimus
    festum Puríssimi Cordis Maríæ Vírginis instítuit, ab ómnibus diœcésibus et
    religiósis famíliis, quæ id petiíssent, pie sanctéque agéndum: quod
    póstmodum Pius Papa nonus Offício ac Missa própria auxit. Ardens autem
    stúdium atque optátum, jam sǽculo décimo séptimo exórtum et in dies
    invaléscens, ut nempe ejúsmodi festum, majóri solemnitáte donátum, totíus
    Ecclésiæ commúne efficerétur, Summus Póntifex Pius duodécimus benígne
    excípiens anno millésimo nongentésimo quadragésimo secúndo, bello
    atrocíssimo per orbem fere totum ingravescénte, infínitas populórum ærúmnas
    míserans, pro sua in Matrem cæléstem pietáte ac fidúcia genus hóminum
    univérsum illíus Cordi benigníssimo obsecratióne solémni eníxe commendávit,
    atque in honórem ejúsdem Immaculáti Cordis festum cum Offício et Missa
    própriis in perpétuum ubíque celebrándum indíxit."
lectio7:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 19:25-27"
  - "In illo témpore: Stabant juxta crucem Jesu Mater ejus, et soror Matris ejus
    María Cléophæ, et María Magdaléne. Et réliqua."
  - _
  - Homilía sancti Robérti Bellarmíno Epíscopi
  - "!De septem verbis Christi in Cruce, cap. 12"
  - "Onus et jugum impósitum a Dómino sancto Joánni, ut Vírginis Matris curam
    géreret, vere fuit jugum suáve et onus leve. Quis enim non libentíssime
    cohabitáret Matri illi, quæ Verbum incarnátum in útero novem ménsibus
    portávit, et illi totos trigínta annos devotíssime dulcissiméque
    cohabitávit? Quis non invídeat dilécto Dómini, qui in abséntia Fílii Dei
    præséntiam obtínuit Matris Dei? Sed, nisi fallor, póssumus et nos a
    benignitáte Verbi nostri causa incarnáti et ex dilectióne nímia nostri causa
    crucifíxi, précibus impetráre, ut dicat et nobis: Ecce Mater tua; et Matri
    suæ de nobis dicat: Ecce fílius tuus."
lectio8:
  - "Non est avárus pius Dóminus gratiárum, dúmmodo ad thronum grátiæ ejus cum
    fide et fidúcia et non ficto corde, sed vero et sincéro accedámus. Qui nos
    coherédes esse vóluit regni Patris sui, non dedignábitur certe nos coherédes
    habére amóris Matris suæ. Sed nec ipsa Virgo benigníssima gravábitur
    multitúdine filiórum, cum sinum amplíssimum hábeat et valde cúpiat, nullum
    períre ex his, quos Fílius suus tam pretióso sánguine et tam pretiósa morte
    redémit. Adeámus ergo cum fidúcia ad thronum grátiæ Christi, et supplíciter
    nec sine lácrimis ab eo petámus, ut de unoquóque nostrum Matri suæ dicat:
    Ecce fílius tuus; et unicuíque nostrum de Matre sua dicat: Ecce Mater tua."
lectio9:
  - "Quam bene nobis erit sub præsídio tantæ Matris? Quis nos detráhere audébit
    de sinu ejus? Quæ nos tentátio superáre póterit, confidéntes in patrocínio
    Matris Dei et nostræ? neque nos primi érimus in tanti consecutióne
    benefícii. Multi nos præcessérunt; multi, inquam, ad singuláre et plane
    matérnum patrocínium tantæ Vírginis accessérunt, et nemo confúsus aut
    tristis dimíssus est, sed omnes hílares et gaudéntes, freti patrocínio tantæ
    Matris. De qua enim scriptum est: Ipsa cónteret caput tuum, in ea confídunt,
    se quoque fidénter ambulatúros super áspidem et basilíscum, et conculcatúros
    leónem et dracónem. Neque enim vidétur posse períre is, de quo dictum sit
    Vírgini a Christo: Ecce fílius tuus, dúmmodo et ipse non surda aure áudiat,
    quod ei Christus díxerit: Ecce Mater tua."
  - "&teDeum"
ant-2:
  - "O beáta Virgo * María: tu grátiæ Mater, tu spes mundi, exáudi nos fílios
    tuos clamántes ad te."
