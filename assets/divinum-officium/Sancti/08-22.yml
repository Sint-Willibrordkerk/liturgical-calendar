oratio:
  - "Omnípotens sempitérne Deus, qui in Corde beátæ Maríæ Vírginis dignum
    Spíritus Sancti habitáculum præparásti: concéde propítius; ut ejúsdem
    immaculáti Cordis festivitátem devóta mente recoléntes, secúndum cor tuum
    vívere valeámus."
  - $Per Dominum
lectio:
  - "@Sancti/07-16"
graduale:
  - "!Ps 12:6"
  - "Exsultábit cor meum in salutári tuo: cantábo Dómino, qui bona tríbuit mihi:
    et psallam nómini Dómini altíssimi."
  - "!Ps 44:18"
  - "Mémores erunt nóminis tui in omni generatióne et generatiónem: proptérea
    pópuli confitebúntur tibi in ætérnum. Allelúja, allelúja."
  - "! Luc 1:46; 1:47"
  - "Magníficat ánima mea Dóminum: et exsultávit spíritus meus in Deo salutári
    meo. Allelúja."
gradualep:
  - Allelúja, allelúja.
  - "!Luc 1:46-47"
  - "Magníficat ánima mea Dóminum: et exsultávit spíritus meus in Deo salutári
