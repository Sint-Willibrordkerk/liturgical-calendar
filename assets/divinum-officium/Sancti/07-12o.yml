officium:
  - Ss. Naboris et Felicis Martyrum
rank:
  - ""
  - Simplex
  - "1.1"
  - "@C3a-1"
rule:
  - vide C3a-1;
  - Gloria
oratio:
  - "Præsta, quǽsumus, Dómine: ut, sicut nos sanctórum Martyrum tuórum Nabóris
    et Felícis natalítia celebránda non desérunt; ita júgiter suffrágiis
    comitántur."
  - $Per Dominum
secreta:
  - "Múnera plebis tuæ, quǽsumus, Dómine, sanetórum Mártyrum tuórum Nabóris et
    Felícis fiant grata suffrágiis: et, quorum triúmphis tuo nómini offeruntur,
    ipsorum digna perficiantur et méritis."
  - $Per Dominum.
postcommunio:
  - "Natalítiis Sanctórum tuórum, quǽsumus, Dómine: ut, sacraménti múnere
    vegetáti, bonis, quibus per tuam grátiam nunc fovémur, perfruámur ætérnis."
  - $Per Dominum
rubrica-1570/lectio93:
  - "@Commune/C3:Lectio4:s/$/~/s"
  - "@Commune/C3:Lectio5"
