oratio:
  - "Deus, qui, miro ordine, Angelórum ministéria hominúmque dispénsas: concéde
    propítius; ut, a quibus tibi ministrántibus in cœlo semper assístitur, ab
    his in terra vita nostra muniátur."
  - $Per Dominum
lectio:
  - Léctio libri Apocalýpsis beáti Joánnis Apóstoli
  - "!Apoc 1:1-5"
  - "In diébus illis: Significávit Deus, quæ opórtet fíeri cito, mittens per
    Angelum suum servo suo Joánni, qui testimónium perhíbuit verbo Dei, et
    testimónium Jesu Christi, quæcúmque vidit. Beátus, qui legit et audit verba
    prophetíæ hujus: et servat ea, quæ in ea scripta sunt: tempus enim prope
    est. Joánnes septem ecclésiis, quæ sunt in Asia. Grátia vobis et pax ab eo,
    qui est et qui erat et qui ventúrus est: et a septem spirítibus, qui in
    conspéctu throni ejus sunt: et a Jesu Christo, qui est testis fidélis,
    primogénitus mortuórum et princeps regum terræ, qui diléxit nos et lavit nos
    a peccátis nostris in sánguine suo."
graduale:
  - Allelúja, allelúja.
  - "V. Sancte Míchæl Archángele, defénde nos in prœ́lio: ut non pereámus in
    treméndo judício. Allelúja."
  - V. Concússum est mare et contrémuit terra, ubi Archángelus Míchaël descéndit
    de cœlo. Allelúja.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 18:1-10"
  - "In illo témpore: Accessérunt discípuli ad Jesum, dicéntes: Quis, putas,
    major est in regno cœlórum? Et ádvocans Jesus párvulum, státuit eum in médio
    eórum et dixit: Amen, dico vobis, nisi convérsi fuéritis et efficiámini
    sicut párvuli, non intrábitis in regnum cœlórum. Quicúmque ergo humiliáverit
    se sicut párvulus iste, hic est major in regno cœlórum. Et qui suscéperit
    unum párvulum talem in nómine meo, me súscipit. Qui autem scandalizáverit
    unum de pusíllis istis, qui in me credunt, expédit ei, ut suspendátur mola
    asinária in collo ejus, et demergátur in profúndum maris. Væ mundo a
    scándalis! Necésse est enim, ut véniant scándala: verúmtamen væ hómini illi,
    per quem scándalum venit! Si autem manus tua vel pes tuus scandalízat te,
    abscíde eum et projíce abs te: bonum tibi est ad vitam ingrédi débilem vel
    claudum, quam duas manus vel duos pedes habéntem niitti in ignem ætérnum. Et
    si óculus tuus scandalízat te, érue eum et projice abs te: bonum tibi est
    cum uno óculo in vitam intráre, quam duos óculos habéntem mitti in gehénnam
    ignis. Vidéte, ne contemnátis unum ex his pusíllis: dico enim vobis, quia
    Angeli eórum in cœlis semper vident fáciem Patris mei, qui in cœlis est."
offertorium:
  - "!Apoc 8:3; 8:4"
  - "Stetit Angelus juxta aram templi, habens thuríbulum áureum in manu sua, et
    data sunt ei incénsa multa: et ascendit fumus arómatum in conspéctu Dei,
    allelúja."
secreta:
  - "Hóstias tibi, Dómine, laudis offérimus, supplíciter deprecántes: ut eásdem,
    angélico pro nobis interveniénte suffrágio, et placátus accípias, et ad
    salútem nostram proveníre concédas."
  - $Per Dominum.
communio:
  - "!Dan 5:58"
  - "Benedícite, omnes Angeli Dómini, Dóminum: hymnum dícite et superexaltáte
    eum in sǽcula, allelúja."
postcommunio:
  - "Beáti Archángeli tui Michaélis intercessióne suffúlti: súpplices te,
    Dómine, deprecámur; ut, quod ore proséquimur, contingámus et mente."
  - $Per Dominum
