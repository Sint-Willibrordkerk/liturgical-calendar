  - "Bénedic, ánima mea, Dómino: et ómnia, quæ intra me sunt, nómini sancto
    ejus."
  - "&Gloria"
  - "v. Benedícite Dóminum, omnes Angeli ejus: poténtes virtúte, qui tácitis
