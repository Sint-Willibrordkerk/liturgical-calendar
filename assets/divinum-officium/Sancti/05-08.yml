lectio1:
  - De Daniéle Prophéta
  - "!Dan 7:9-11"
  - 9 Aspiciébam donec throni pósiti sunt, et antíquus diérum sedit. Vestiméntum
    ejus cándidum quasi nix, et capílli cápitis ejus quasi lana munda, thronus
    ejus flammæ ignis, rotæ ejus ignis accénsus.
  - 10 Flúvius ígneus rapidúsque egrediebátur a fácie ejus; míllia míllium
    ministrábant ei, et décies míllies centéna míllia assistébant ei. Judícium
    sedit, et libri apérti sunt.
  - 11 Aspiciébam propter vocem sermónum grándium, quos cornu illud loquebátur;
    et vidi quóniam interfécta esset béstia, et perísset corpus ejus, et
    tráditum esset ad comburéndum igni.
responsory1:
  - "R. Factum est siléntium in cælo, dum commítteret bellum draco cum Michaéle
    Archángelo:"
  - "* Audíta est vox míllia míllium dicéntium: Salus, honor et virtus
    omnipoténti Deo. (Allelúja.)"
  - V. Míllia míllium ministrábant ei, et décies centéna míllia assistébant ei.
  - "R. Audíta est vox míllia míllium dicéntium: Salus, honor et virtus
    omnipoténti Deo. (Allelúja.)"
lectio2:
  - "!Dan 10:4-8"
  - 4 Die autem vigésima et quarta mensis primi, eram juxta flúvium magnum, qui
    est Tigris.
  - "5 Et levávi óculos meos, et vidi: et ecce vir unus vestítus líneis, et
    renes ejus accíncti auro obrýzo;"
  - 6 et corpus ejus quasi chrysólithus, et fácies ejus velut spécies fúlguris,
    et óculi ejus ut lampas ardens, et brácchia ejus, et quæ deórsum sunt usque
    ad pedes, quasi spécies æris candéntis; et vox sermónum ejus ut vox
    multitúdinis.
  - 7 Vidi autem ego Dániel solus visiónem; porro viri qui erant mecum non
    vidérunt; sed terror nímius írruit super eos, et fugérunt in abscónditum.
  - 8 Ego autem, relíctus solus, vidi visiónem grandem hanc, et non remánsit in
    me fortitúdo, sed et spécies mea immutáta est in me, et emárcui nec hábui
    quidquam vírium.
responsory2:
  - "R. Stetit Angelus juxta aram templi, habens thuríbulum áureum in manu sua,
    et data sunt ei incénsa multa:"
  - "* Et ascéndit fumus arómatum de manu Angeli in conspéctu Dómini.
    (Allelúja.)"
  - "V. In conspéctu Angelórum psallam tibi: adorábo ad templum sanctum tuum, et
    confitébor nómini tuo, Dómine."
  - R. Et ascéndit fumus arómatum de manu Angeli in conspéctu Dómini. (Allelúja.)
lectio3:
  - "!Dan 10:9-14"
  - "9 Et audívi vocem sermónum ejus: et áudiens jacébam consternátus super
    fáciem meam, et vultus meus hærébat terræ."
  - 10 Et ecce manus tétigit me, et eréxit me super génua mea et super artículos
    mánuum meárum.
  - "11 Et dixit ad me: Dániel, vir desideriórum, intéllege verba quæ ego loquor
    ad te, et sta in gradu tuo; nunc enim sum missus ad te. Cumque dixísset mihi
    sermónem istum, steti tremens."
  - "12 Et ait ad me: Noli metúere, Dániel; quia, ex die primo quo posuísti cor
    tuum ad intellegéndum, ut te afflígeres in conspéctu Dei tui, exaudíta sunt
    verba tua, et ego veni propter sermónes tuos."
  - 13 Princeps autem regni Persárum réstitit mihi vigínti et uno diébus; et
    ecce Míchaël, unus de princípibus primis, venit in adjutórium meum, et ego
    remánsi ibi juxta regem Persárum.
  - 14 Veni autem ut docérem te quæ ventúra sunt pópulo tuo in novíssimis
    diébus, quóniam adhuc vísio in dies.
responsory3:
  - "R. In conspéctu Angelórum psallam tibi, et adorábo ad templum sanctum tuum:"
  - "* Et confitébor nómini tuo, Dómine. (Allelúja.)"
  - "V. Super misericórdia tua et veritáte tua: quóniam magnificásti super nos
    nomen sanctum tuum."
  - R. Et confitébor nómini tuo, Dómine. (Allelúja.)
  - "&Gloria"
  - R. Et confitébor nómini tuo, Dómine. (Allelúja.)
lectio4:
  - Beátum Michaélem Archángelum sǽpius homínibus apparuísse, et sacrórum
    Librórum auctoritáte et véteri Sanctórum traditióne comprobátur. Quam ob rem
    multis in locis facti memória celebrátur. Eum, ut olim synagóga Judæórum,
    sic nunc custódem et patrónum Dei venerátur Ecclésia. Gelásio autem primo,
    Pontífice máximo, in Apúlia in vértice Gargáni montis, ad cujus radíces
    íncolunt Sipontíni, Archángeli Michaélis fuit illústris apparítio.
responsory4:
  - R. Hic est Míchaël Archángelus, princeps milítiæ Angelórum,
  - "* Cujus honor præstat benefícia populórum, et orátio perdúcit ad regna
    cælórum. (Allelúja.)"
  - V. Archángelus Míchaël præpósitus paradísi, quem honoríficant Angelórum
    cives.
  - R. Cujus honor præstat benefícia populórum, et orátio perdúcit ad regna
    cælórum. (Allelúja.)
lectio5:
  - Factum est enim, ut ex grégibus armentórum Gargáni cujúsdam taurus longe
    discéderet; quem diu conquisítum, in áditu spelúncæ hæréntem invenérunt. Cum
    vero quidam ex illis, ut taurum confígeret, sagíttam emisísset retórta
    sagítta in ipsum récidit sagittárium. Quæ res cum præséntes ac deínceps
    céteros tanto timóre affecísset, ut ad eam spelúncam própius accédere nemo
    audéret, Sipontíni epíscopum cónsulunt; qui, indícto trium diérum jejúnio et
    oratióne, rem a Deo respóndit quæri oportére.
responsory5:
  - R. Venit Míchaël Archángelus cum multitúdine Angelórum, cui trádidit Deus
    ánimas Sanctórum,
  - "* Ut perdúcat eas in paradísum exsultatiónis. (Allelúja.)"
  - V. Emítte, Dómine, Spíritum sanctum tuum de cælis, spíritum sapiéntiæ et
    intelléctus.
  - R. Ut perdúcat eas in paradísum exsultatiónis. (Allelúja.)
lectio6:
  - "Post tríduum Míchaël Archángelus epíscopum monet in sua tutéla esse eum
    locum, eóque indício demonstrásse, velle ibi cultum Deo in sui et Angelórum
    memóriam adhibéri. Quare epíscopus una cum cívibus ad eam spelúncam ire
    pergit. Quam cum in templi cujúsdam similitúdinem conformátam vidíssent,
    locum illum divínis offíciis celebráre cœpérunt:: qui multis póstea
    miráculis illustrátus est. Nec ita multo post Bonifátius Papa, Romæ in summo
    circo, sancti Michaélis ecclésiam dedicávit tértio Kaléndas Octóbris; quo
    die étiam ómnium Angelórum memóriam Ecclésia celébrat. Hodiérnus autem dies
    Archángeli Michaélis apparitióne consecrátus est."
responsory6:
  - "R. In témpore illo consúrget Míchaël, qui stat pro fíliis vestris:"
  - "* Et véniet tempus, quale non fuit, ex quo gentes esse cœpérunt, usque ad
    illud. (Allelúja.)"
  - V. In témpore illo salvábitur pópulus tuus omnis, qui invéntus fúerit
    scriptus in libro vitæ.
  - R. Et véniet tempus, quale non fuit, ex quo gentes esse cœpérunt, usque ad
    illud. (Allelúja.)
  - "&Gloria"
  - R. Et véniet tempus, quale non fuit, ex quo gentes esse cœpérunt, usque ad
    illud. (Allelúja.)
lectio94:
  - "@:Lectio4"
  - "@:Lectio6:s/.*(Nec ita)/$1/s"
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 18:1-10"
  - "In illo témpore: Accessérunt discípuli ad Jesum, dicéntes: Quis, putas,
    major est in regno cælórum? Et réliqua."
  - _
  - Homilía sancti Hilárii Epíscopi
  - "!Comment in Matth. can. 18"
  - "Nónnisi revérsos in natúram puerórum introíre regnum cælórum Dóminus docet:
    id est, per simplicitátem puerílem vítia córporum nostrórum animǽque
    revocánda. Púeros autem, credéntes omnes per audiéntiæ fidem nuncupávit. Hi
    enim patrem sequúntur, matrem amant, próximo velle malum nésciunt, curam
    opum négligunt; non insoléscunt, non odérunt, non mentiúntur, dictis
    credunt, et quod áudiunt, verum habent. Reverténdum ígitur est ad
    simplicitátem infántium; quia, in ea collocáti, spéciem humilitátis Domínicæ
    circumferémus."
responsory7:
  - R. In conspéctu géntium nolíte timére; vos enim in córdibus vestris adoráte
    et timéte Dóminum;
  - "* Angelus enim ejus vobíscum est. (Allelúja.)"
  - V. Stetit Angelus juxta aram templi, habens thuríbulum áureum in manu sua.
  - R. Angelus enim ejus vobíscum est. (Allelúja.)
lectio8:
  - Væ huic mundo ab scándalis. Humílitas passiónis scándalum mundo est. In hoc
    enim máxime ignorántia detinétur humána, quod sub deformitáte crucis, ætérnæ
    glóriæ Dóminum nóluit accípere. Et quid mundo tam periculósum, quam non
    recepísse Christum? Ideo vero necésse esse ait veníre scándala; quia, ad
    sacraméntum reddéndæ nobis æternitátis, omnis in eo passiónis humílitas
    esset explénda.
responsory8:
  - R. Míchaël Archángelus venit in adjutórium pópulo Dei,
  - "* Stetit in auxílium pro animábus justis. (Allelúja.)"
  - V. Stetit Angelus juxta aram templi, habens thuríbulum áureum in manu sua.
  - R. Stetit in auxílium pro animábus justis. (Allelúja.)
  - "&Gloria"
  - R. Stetit in auxílium pro animábus justis. (Allelúja.)
lectio9:
  - "Vidéte ne contemnátis unum de pusíllis istis, qui credunt in me. Aptíssimum
    vínculum mútui amóris impósuit, ad eos præcípue qui vere in Dómino
    credidíssent. Pusillórum enim Angeli quotídie Deum vident: quia Fílius
    hóminis venit salváre quæ pérdita sunt. Ergo et Fílius hóminis salvat, et
    Deum Angeli vident, et Angeli pusillórum præsunt fidélium oratiónibus.
    Præésse Angelos absolúta auctóritas est. Salvatórum ígitur per Christum
    oratiónes Angeli quotídie Deo ófferunt. Ergo periculóse ille contémnitur,
    cujus desidéria ac postulatiónes ad ætérnum et invisíbilem Deum, ambitióso
    Angelórum famulátu ac ministério, pervehúntur."
  - "&teDeum"
versum-0:
