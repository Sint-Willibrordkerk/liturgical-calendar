lectio4:
  - Linus Pontifex, Volaterris in Etruria natus, primus post Petrum gubernávit
    Ecclésiam. Cujus tanta fides et sanctitas fuit, ut non solum dæmones
    ejiceret, sed étiam mórtuos revocaret ad vitam. Scripsit res gestas beáti
    Petri, et ea maxime quæ ab illo acta sunt contra Simónem magum. Sancívit ne
    qua mulier, nisi velato cápite, in ecclésiam introíret. Huic Pontifici caput
    amputátum est ob constantiam fidei, jussu Saturnini ímpii et ingratíssimi
    consularis, cujus filiam a dæmonum vexatióne liberaverat. Sepultus est in
    Vaticano prope sepúlcrum Principis Apostolórum, nono Kalendas Octobris.
    Sedit annos undecim, menses duos, dies viginti tres, creatis, bis mense
    Decembri, epíscopis quindecim, presbyteris decem et octo.
lectio5:
  - De Expositióne sancti Ambrósii Epíscopi in Psalmum centésimum décimum
    octavum.
  - "!Sermone 21"
  - "Príncipes persecúti sunt me gratis: et a verbis tuis trepidávit cor meum.
    Bene hoc Martyr dicit, quod injúste persecutiónum torménta sustineat; qui
    nihil rapúerit, nullum violentus oppresserit, nullius sánguinem fuderit,
    nullius torum putaverit esse violándum; qui nihil légibus debeat, et
    gravióra latronum sustinere cogátur supplícia; qui loquátur juste, et non
    audiátur; qui loquátur plena salútis, et impugnétur, ut possit dicere: Cum
    loquébar illis, impugnábant me gratis. Gratis ígitur persecutiónem pátitur,
    qui impugnátur sine crimine; impugnátur ut noxius cum sit in tali
    confessióne laudábilis; impugnátur quasi veneficus, qui in nómine Dómini
    gloriátur, cum pietas virtútum ómnium fundaméntum sit."
lectio6:
  - "Vere frustra impugnátur, qui apud ímpios et infidos impietátis arcessitur,
    cum fidei sit magister. Verum, qui gratis impugnátur, fortis debet esse et
    constans; quómodo ergo subtexuit: Et a verbis tuis trepidávit cor meum?
    Trepidare infirmitátis est, timoris atque formidinis. Sed est étiam
    infirmitas ad salútem, est étiam timor sanctórum: Timéte Dóminum, omnes
    sancti ejus; et, Beátus vir, qui timet Dóminum. Qua ratióne beatus? Quia in
    mandatis ejus cupit nimis."
lectio94:
  - Linus Póntifex, Volatérris in Etrúria natus, primus post Petrum gubernávit
    Ecclésiam. Cujus tanta fides et sánctitas fuit, ut non solum dǽmones
    eíceret, sed étiam mórtuos revocáret ad vitam. Scripsit res gestas beáti
    Petri, et ea máxime quæ ab illo acta sunt contra Simónem magum. Sancívit ne
    qua múlier, nisi veláto cápite, in ecclésiam introíret. Huic Pontífici caput
    amputátum est ob constántiam fídei, jussu Saturníni ímpii et ingratíssimi
    consuláris, cujus fíliam a dǽmonum vexatióne liberáverat. Sepúltus est in
    Vaticáno prope sepúlcrum Príncipis Apostolórum, nono caléndas octóbris.
    Sedit annos úndecim, menses duos, dies vigínti tres, creátis, bis mense
    decémbri, epíscopis quíndecim, presbýteris decem et octo.
  - "&teDeum"
