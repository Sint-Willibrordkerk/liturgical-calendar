lectio4:
  - "Benedíctus, Núrsiæ nóbili génere ortus, Romæ liberálibus disciplínis
    erudítus, ut totum se Jesu Christo daret, ad eum locum, qui Sublácus
    dícitur, in altíssimam spelúncam penetrávit; in qua sic per triénnium
    delítuit, ut unus id sciret Románus mónachus, quo ad vitæ necessitátem
    minístro utebátur. Dum ígitur ei quodam die ardéntes ad libídinem faces a
    diábolo subjiceréntur, se in vépribus támdiu volutávit, dum, laceráto
    córpore, voluptátis sensus dolóre opprimerétur. Sed jam erumpénte ex illis
    látebris fama ejus sanctitátis, quidam mónachi se illi instituéndos
    tradidérunt: quorum vivéndi licéntia cum ejus objurgatiónes ferre non
    posset, venénum in potióne ei dare constítuunt. Verum, póculum ei
    præbéntibus, crucis signo vas confrégit, ac relícto monastério in
    solitúdinem se recépit."
lectio5:
  - Sed cum multi ad eum quotídie discípuli convenírent, duódecim monastéria
    ædificávit, éaque sanctíssimis légibus communívit. Póstea Cassínum migrávit,
    ubi simulácrum Apóllinis, qui adhuc ibi colebátur, commínuit, aram evértit
    et lucos succéndit; ibíque sancti Martíni sacéllum et sancti Joánnis
    ædículam exstrúxit, oppidános autem et íncolas christiánis præcéptis ímbuit.
    Quare augebátur in dies magis divína grátia Benedíctus, ut étiam prophético
    spíritu ventúra prædíceret. Quod ubi accépit Tótila Gothórum rex,
    exploratúrus, an res ita esset, spathárium suum régio ornátu et comitátu
    præmíttit, qui se regem simuláret. Quem ut ille vidit, Depóne, inquit, fili,
    depóne quod geris; nam tuum non est. Tótilæ vero prædíxit advéntum ejus in
    Urbem, maris transmissiónem, et post novem annos mortem.
lectio6:
  - "Qui áliquot ménsibus ántequam e vita migráret, præmónuit discípulos, quo
    die esset moritúrus; ac sepúlcrum, in quo suum corpus condi vellet, sex
    diébus ántequam eo inferrétur, aperíri jussit: sextóque die deférri vóluit
    in ecclésiam; ubi, sumpta Eucharístia, sublátis in cælum óculis orans, inter
    manus discipulórum efflávit ánimam: quam duo mónachi eúntem in cælum
    vidérunt, pállio ornátum pretiosíssimo, circum eam fulgéntibus lampádibus,
    et claríssima et gravíssima spécie virum, stantem supra caput ipsíus,
    dicéntem audiérunt: Hæc est via, qua diléctus Dómini Benedíctus in cælum
    ascéndit."
