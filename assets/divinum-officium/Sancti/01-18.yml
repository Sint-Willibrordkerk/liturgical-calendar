oratio:
  - "Deus, qui beáto Petro Apóstolo tuo, collátis clávibus regni cœléstis,
    ligándi atque solvéndi pontifícium tradidísti: concéde; ut, intercessiónis
    ejus auxílio, a peccatórum nostrórum néxibus liberémur:"
  - $Qui vivis
commemoratio-oratio:
  - "!Commemoratio S. Pauli"
  - "Deus, qui multitúdinem géntium beáti Pauli Apóstoli prædicatióne docuísti:
    da nobis, quǽsumus; ut, cujus commemoratiónem cólimus, ejus apud te
    patrocínia sentiámus."
  - $Per Dominum
lectio:
  - "@Commune/Coronatio"
graduale:
  - "@Commune/C4b"
gradualep:
  - "@Commune/Coronatio"
tractus:
  - "@Commune/Coronatio"
evangelium:
  - "@Commune/Coronatio"
offertorium:
  - "@Commune/Coronatio"
secreta:
  - "Ecclésiæ tuæ, quǽsumus, Dómine, preces et hóstias beáti Petri Apóstoli
    comméndet orátio: ut, quod pro illíus glória celebrámus, nobis prosit ad
    véniam."
  - $Per Dominum
commemoratio-secreta:
  - "!Pro S. Paulo"
  - "Apóstoli tui Pauli précibus, Dómine, plebis tuæ dona sanctífica: ut, quæ
    tibi tuo grata sunt institúto, gratióra fiant patrocínio supplicántis."
  - $Per Dominum
communio:
  - "@Commune/C4b"
postcommunio:
  - "Lætíficet nos, Dómine, munus oblátum: ut, sicut in Apóstolo tuo Petro te
    mirábilem prædicámus; sic per illum tuæ sumámus indulgéntiæ largitátem."
  - $Per Dominum
commemoratio-postcommunio:
  - "!Pro S. Paulo"
  - "Sanctificáti, Dómine, salutári mystério: quǽsumus; ut nobis ejus non desit
    orátio, cujus nos donásti patrocínio gubernari."
  - $Per Dominum
