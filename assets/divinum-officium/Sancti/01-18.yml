lectio8:
  - "Et dignum plane conféssio Petri præmium consecúta est, quia Dei Fílium in
    hómine vidísset. Beátus hic est, qui ultra humánum óculos intendísse et
    vidísse laudátus est: non id quod ex carne et sánguine erat cóntuens, sed
    Dei Fílium cæléstis Patris revelatióne conspíciens; dignúsque judicátus, qui
    quod in Christo Dei esset, primus agnósceret. O in nuncupatióne novi nóminis
    felix Ecclésiæ fundaméntum, dígnaque ædificatióne illíus petra, quæ inférnas
    leges, et tártari portas, et ómnia mortis claustra dissólveret! O beátus
    cæli jánitor, cujus arbítrio claves ætérni áditus tradúntur, cujus terréstre
    judícium præjudicáta auctóritas sit in cælo!"
