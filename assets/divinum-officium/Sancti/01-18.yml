lectio4:
  - Sermo sancti Leónis Papæ
  - "!Sermo 1 de Ss. Apost. Petro et Paulo, ante medium."
  - Cum duódecim Apóstoli, accépta per Spíritum Sanctum ómnium locutióne
    linguárum, imbuéndum Evangélio mundum, distribútis sibi terrárum pártibus,
    suscepíssent, beatíssimus Petrus, princeps apostólici órdinis, ad arcem
    Románi destinátur impérii, ut lux veritátis, quæ in ómnium géntium
    revelabátur salútem, efficácius se ab ipso cápite per totum mundi corpus
    effúnderet. Cujus autem natiónis hómines in hac tunc urbe non essent? aut
    quæ usquam gentes ignorárent quod Roma didicísset?
responsory4:
  - "@Sancti/02-22"
lectio5:
  - Hic conculcándæ philosophíæ opiniónes, hic dissolvéndæ erant terrénæ
    sapiéntiæ vanitátes, hic confutándi dǽmonum cultus, hic ómnium sacrilegiórum
    impíetas destruénda, ubi diligentíssima superstitióne habebátur colléctum
    quidquid usquam fúerat vanis erróribus institútum. Ad hanc ergo urbem tu,
    beatíssime Petre Apóstole, veníre non métuis, et, consórte glóriæ tuæ Paulo
    Apóstolo, aliárum adhuc ecclesiárum ordinatiónibus occupáto, silvam istam
    freméntium bestiárum, et turbullentíssimæ profunditátis océanum, constántior
    quam cum supra mare graderéris, ingréderis.
responsory5:
  - "@Sancti/02-22"
lectio6:
  - "Jam pópulos, qui ex circumcisióne credíderant, erudíeras: jam Antiochénam
    ecclésiam, ubi primum christiáni nóminis dignitas est orta, fundáveras: jam
    Pontum, Galátiam, Cappadóciam, Asiam atque Bithýniam légibus evangélicæ
    prædicatiónis impléveras; nec aut dúbius de provéctu óperis, aut de spátio
    tuæ ignárus ætátis, trophǽum crucis Christi Románis árcibus inferébas, quo
    te divínis præordinatiónibus anteíbant, et honor potestátis, et glória
    passiónis."
responsory6:
  - "@Sancti/02-22"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 16:13-19"
  - "In illo témpore: Venit Jesus in partes Cæsaréæ Philíppi, et interrogábat
    discipulos suos, dicens: Quem dicunt hómines esse Fílium hóminis? Et
    réliqua."
  - _
  - Homilía sancti Hilarii Epíscopi
  - "!Comment. in Matth. can. 16, post initium"
  - "Dóminus a discípulis requírit, quem se hómines esse dícerent; ut adjécit,
    hóminis fílium. Hæc enim confessiónis tenénda rátio est, ut sicut Dei
    Fílium, ita et fílium hóminis meminérimus: quia álterum sine áltero nihil
    spei tríbuit ad salútem. Editis ítaque, quæ diversæ de eo erant, hóminum
    opiniónibus, quid de se ipse séntiant quærit. Petrus respóndit: Tu es
    Christus Fílius Dei vivi. Sed Petrus conditiónes propositiónis expénderat.
    Dóminus enim díxerat: Quem me hómines esse dicunt, fílium hóminis? Et certe
    fílium hóminis contemplátio córporis præferébat. Sed addéndo, Quem me esse
    dicunt, significávit, præter id quod in se videbátur, esse áliud sentiéndum:
    erat enim hóminis fílius. Quod ígitur de se opinándi judícium desiderábat?
    Non illud arbitrámur, quod de se ipse conféssus est: sed occúltum erat de
    quo quærebátur, in quod se credéntium fides debébat exténdere."
