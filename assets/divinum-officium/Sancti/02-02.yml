evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 2:22-32"
  - "In illo témpore: Postquam impleti sunt dies purgatiónis Maríæ, secúndum
    legem Moysi, tulérunt Jesum in Jerúsalem, ut sísterent eum Dómino, sicut
    scriptum est in lege Dómini: Quia omne masculínum adapériens vulvam sanctum
    Dómino vocábitur. Et ut darent hóstiam, secúndum quod dictum est in lege
    Dómini, par túrturum aut duos pullos columbárum. Et ecce, homo erat in
    Jerúsalem, cui nomen Símeon, et homo iste justus et timorátus, exspéctans
    consolatiónem Israël, et Spíritus Sanctus erat in eo. Et respónsum accéperat
    a Spíritu Sancto, non visúrum se mortem, nisi prius vidéret Christum Dómini.
    Et venit in spíritu in templum. Et cum indúcerent púerum Jesum parentes
    ejus, ut fácerent secúndum consuetúdinem legis pro eo: et ipse accépit eum
    in ulnas suas, et benedíxit Deum, et dixit: Nunc dimíttis servum tuum,
    Dómine, secúndum verbum tuum in pace: Quia vidérunt óculi mei salutáre tuum:
    Quod parásti ante fáciem ómnium populórum: Lumen ad revelatiónem géntium et
    glóriam plebis tuæ Israël."
offertorium:
  - "@Commune/C6b"
secreta:
  - "Exáudi, Dómine, preces nostras: et, ut digna sint múnera, quæ óculis tuæ
    majestátis offérimus, subsídium nobis tuæ pietátis impénde."
  - $Per Dominum
communio:
  - "!Luc 2:26"
  - Respónsum accépit Símeon a Spíritu Sancto, non visúrum se mortem, nisi
    vidéret Christum Dómini.
postcommunio:
  - "Quǽsumus, Dómine, Deus noster: ut sacrosáncta mystéria, quæ pro
    reparatiónis nostræ munímine contulísti, intercedénte beáta María semper
    Vírgine, et præsens nobis remédium esse fácias et futúrum."
  - $Per Dominum
ant-vespera:
  - "@Sancti/01-01"
rubrica-cisterciensis/responsory-vespera-1:
  - Responsorium. Vidéte miráculum Matris Dómini, concépit virgo, virílis ignára
    consórtii, stat oneráta nóbili ónere María, et Matrem se læta cognóscit. *
    Quæ se nescit uxórem.
  - V. Virgo concépit, et post partum virgo permánsit.
  - R. Quæ se nescit uxórem.
versum-1:
  - V. Respónsum accépit Símeon a Spíritu Sancto.
  - R. Non visúrum se mortem, nisi vidéret Christum Dómini.
rubrica-cisterciensis/versum-1:
  - "@CommuneCist/C6:Versum 1"
ant-1:
  - "Senex * Púerum portábat, Puer autem senem regébat: quem virgo péperit, et
    post partum virgo permánsit: ipsum quem génuit, adorávit."
invit:
  - "Ecce venit ad templum sanctum suum Dominátor Dóminus: * Gaude et lætáre,
    Sion, occúrrens Deo tuo."
lectio1:
  - De libro Exodi
  - "!Exod 13:1-3; 13:11-13"
  - "1 Locútus est Dóminus ad Móysen, dicens:"
  - 2 Sanctífica mihi omne primogénitum quod áperit vulvam in fíliis Israël, tam
    de homínibus quam de juméntis; mea sunt enim ómnia.
  - "3 Et ait Móyses ad pópulum:"
  - 11 Cum introdúxerit te Dóminus in terram Chananǽi, sicut jurávit tibi et
    pátribus tuis, et déderit tibi eam;
  - 12 separábis omne quod áperit vulvam Dómino, et quod primitívum est in
    pecóribus tuis; quidquid habúeris masculíni sexus, consecrábis Dómino.
  - 13 Primogénitum ásini mutábis ove; quod, si non redémeris, interfícies. Omne
    autem primogénitum hóminis de fíliis tuis, prétio rédimes.
responsory1:
  - "R. Adórna thálamum tuum, Sion, et súscipe Regem Christum:"
  - "* Quem virgo concépit, virgo péperit, virgo post partum, quem génuit,
    adorávit."
  - V. Accípiens Símeon púerum in mánibus, grátias agens benedíxit Dóminum.
  - R. Quem virgo concépit, virgo péperit, virgo post partum, quem génuit,
    adorávit.
lectio2:
  - De libro Levítici
  - "!Lev 12:1-5"
  - "1 Locútus est Dóminus ad Móysen, dicens:"
  - "2 Lóquere fíliis Israël, et dices ad eos: Múlier, si suscépto sémine
    pepérerit másculum, immúnda erit septem diébus juxta dies separatiónis
    ménstruæ."
  - "3 Et die octávo circumcidétur infántulus:"
  - 4 ipsa vero trigínta tribus diébus manébit in sánguine purificatiónis suæ.
    Omne sanctum non tanget, nec ingrediétur in Sanctuárium donec impleántur
    dies purificatiónis suæ.
  - 5 Sin autem féminam pepérerit, immúnda erit duábus hebdomádibus juxta ritum
    fluxus ménstrui, et sexagínta sex diébus manébit in sánguine purificatiónis
    suæ.
responsory2:
  - R. Postquam impléti sunt dies purgatiónis Maríæ secúndum legem Móysi,
    tulérunt Jesum in Jerúsalem, ut sísterent eum Dómino,
  - "* Sicut scriptum est in lege Dómini: Quia omne masculínum adapériens
    vulvam, sanctum Dómino vocábitur."
  - V. Obtulérunt pro eo Dómino par túrturum aut duos pullos columbárum.
  - "R. Sicut scriptum est in lege Dómini: Quia omne masculínum adapériens
    vulvam, sanctum Dómino vocábitur."
lectio3:
  - "!Lev 12:6-8"
  - 6 Cumque expléti fúerint dies purificatiónis suæ, pro fílio, sive pro fília,
    déferet agnum annículum in holocáustum, et pullum colúmbæ sive túrturem pro
    peccáto, ad óstium tabernáculi testimónii, et tradet sacerdóti,
  - 7 qui ófferet illa coram Dómino; et orábit pro ea, et sic mundábitur a
    proflúvio sánguinis sui. Ista est lex pariéntis másculum aut féminam.
  - 8 Quod si non invénerit manus ejus, nec potúerit offérre agnum, sumet duos
    túrtures vel duos pullos columbárum, unum in holocáustum, et álterum pro
    peccáto; orabítque pro ea sacérdos, et sic mundábitur.
responsory3:
  - R. Obtulérunt pro eo Dómino par túrturum aut duos pullos columbárum.
  - "* Sicut scriptum est in lege Dómini."
  - V. Postquam autem impléti sunt dies purgatiónis Maríæ secúndum legem Móysi,
    tulérunt illum in Jerúsalem, ut sísterent eum Dómino.
  - R. Sicut scriptum est in lege Dómini.
  - "&Gloria"
  - R. Sicut scriptum est in lege Dómini.
lectio4:
  - Sermo sancti Augustíni Epíscopi
  - "!Sermo 13 de Tempore, post initium"
  - "Sic olim prædíctum est: Mater Sion dicit: Homo et homo factus est in ea; et
    ipse fundávit eam Altíssimus. O omnipoténtia nascéntis! o magnificéntia de
    cælo ad terram descendéntis! Adhuc in útero portabátur, et ex útero matris a
    Joánne Baptísta salutabátur. In templo præsentabátur, et a Simeóne sene
    famóso, annóso, probáto, coronáto agnoscebátur. Tunc cognóvit, tunc
    adorávit, tunc dixit: Nunc, Dómine, dimíttis servum tuum in pace: quia
    vidérunt óculi mei salutáre tuum."
responsory4:
  - R. Símeon justus et timorátus exspectábat redemptiónem Israël,
  - "* Et Spíritus Sanctus erat in eo."
  - V. Respónsum accépit Símeon a Spíritu Sancto, non visúrum se mortem, nisi
    vidéret Christum Dómini.
  - R. Et Spíritus Sanctus erat in eo.
lectio5:
  - Differebátur exíre de sǽculo, ut vidéret natum, per quem cónditum est
    sǽculum. Agnóvit Infántem senex, factus est in Púero puer. Innovátus in
    ætáte, qui plenus erat pietáte. Símeon senex ferébat Christum infántem,
    Christus regébat Simeónis senectútem. Dictum ei fúerat a Dómino, quod non
    gustáret mortem, nisi vidéret Christum Dómini natum. Natus est Christus, et
    implétum est desidérium senis in mundi ipsíus senectúte. Ipse ad senem
    hóminem venit, qui mundum inveterátum invénit.
responsory5:
  - "R. Respónsum accépit Símeon a Spíritu Sancto, non visúrum se mortem, nisi
    vidéret Christum Dómini:"
  - "* Et benedíxit Deum, et dixit: Nunc dimíttis servum tuum in pace, quia
    vidérunt óculi mei salutáre tuum, Dómine."
  - V. Cum indúcerent púerum Jesum paréntes ejus, ut fácerent secúndum
    consuetúdinem legis pro eo, ipse accépit eum in ulnas suas.
  - "R. Et benedíxit Deum, et dixit: Nunc dimíttis servum tuum in pace, quia
    vidérunt óculi mei salutáre tuum, Dómine."
lectio6:
  - "In isto quidem sǽculo diu esse nolébat, et Christum in hoc sǽculo vidére
    cupiébat, cantans cum prophéta et dicens: Osténde nobis, Dómine,
    misericórdiam tuam, et salutáre tuum da nobis. Dénique, ut novéritis ita
    esse istíus lætítiam, conclúsit dicens: Nunc dimíttis servum tuum in pace:
    quia vidérunt óculi mei salutáre tuum. Prophétæ cecinérunt Conditórem cæli
    et terræ in terra cum homínibus futúrum; Angelus nuntiávit Creatórem carnis
    et spíritus in carne ventúrum; salutávit Joánnes ex útero in útero
    Salvatórem; Símeon senex Deum agnóvit infántem."
responsory6:
  - "R. Cum indúcerent púerum Jesum paréntes ejus in templum, ut fácerent
    secúndum consuetúdinem legis pro eo, accépit eum Símeon in ulnas suas, et
    benedíxit Deum, dicens:"
  - "* Nunc dimíttis, Dómine, servum tuum in pace."
  - V. Suscípiens Símeon Púerum in mánibus, exclamávit, dicens.
  - R. Nunc dimíttis, Dómine, servum tuum in pace.
  - "&Gloria"
  - R. Nunc dimíttis, Dómine, servum tuum in pace.
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 2:22-32"
  - "In illo témpore: Postquam impléti sunt dies purgatiónis Maríæ secúndum
    legem Móysi, tulérunt Jesum in Jerúsalem, ut sísterent eum Dómino, sicut
    scriptum est in lege Dómini. Et réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Liber 2 Comment. in Lucæ cap. 2, post initium"
  - Et ecce homo erat in Jerúsalem, cui nomen Símeon, et homo iste justus et
    timorátus, exspéctans consolatiónem Israël. Non solum ab Angelis, et
    prophétis, et a pastóribus, sed étiam a senióribus et justis generátio
    Dómini accépit testimónium. Omnis ætas, et utérque sexus, eventorúmque
    mirácula fidem ástruunt. Virgo génerat, stérilis parit, mutus lóquitur,
    Elísabeth prophétat, Magus adórat, útero clausus exsúltat, vídua confitétur,
    justus exspéctat.
responsory7:
  - "R. Suscípiens Jesum in ulnas suas Símeon, exclamávit, et dixit:"
  - "* Tu es vere lumen ad illuminatiónem géntium, et glóriam plebis tuæ Israël."
  - V. Cum indúcerent púerum Jesum paréntes ejus, et ipse accépit eum in ulnas
    suas, et benedíxit Deum, et dixit.
  - R. Tu es vere lumen ad illuminatiónem géntium, et glóriam plebis tuæ Israël.
lectio8:
  - "Et bene justus, qui non suam, sed pópuli grátiam requirébat, cúpiens ipse
    corpóreæ vínculis fragilitátis exsólvi, sed exspéctans vidére promíssum:
    sciébat enim quia beáti óculi qui eum vidérent. Et ipse accépit eum in ulnas
    suas, et benedíxit Deum, et dixit: Nunc dimítte servum tuum, Dómine,
    secúndum verbum tuum in pace. Vide justum, velut corpóreæ cárcere molis
    inclúsum, velle dissólvi, ut incípiat esse cum Christo. Dissólvi enim, et
    cum Christo esse, multo mélius est."
responsory8:
  - "R. Senex Púerum portábat, Puer autem senem regébat:"
  - "* Quem virgo concépit, virgo péperit, virgo post partum, quem génuit,
    adorávit."
  - V. Accípiens Símeon Púerum in mánibus, grátias agens benedíxit Dóminum.
  - R. Quem virgo concépit, virgo péperit, virgo post partum, quem génuit,
    adorávit.
  - "&Gloria"
  - R. Quem virgo concépit, virgo péperit, virgo post partum, quem génuit,
    adorávit.
lectio9:
  - "Sed qui vult dimítti, véniat in templum, véniat in Jerúsalem, exspéctet
    Christum Dómini, accípiat in mánibus Verbum Dei, complectátur opéribus velut
    quibúsdam suæ fídei brácchiis: tunc dimittétur, ut non vídeat mortem, qui
    víderit Vitam. Vides úberem in omnes grátiam, Dómini generatióne diffúsam,
    et prophetíam incrédulis negátam esse, non justis. Ecce et Símeon prophétat,
    in ruínam et resurrectiónem plurimórum venísse Dóminum Jesum Christum, ut
    justórum iniquorúmque mérita discérnat; et pro nostrórum qualitáte factórum,
    judex verus et justus aut supplícia decérnat aut prǽmia."
  - "&teDeum"
ant-laudes:
  - "@:Ant Vespera 3:s/;;.*//g"
capitulum-laudes:
  - "!Mal 3:1"
  - v. Ecce ego mitto Angelum meum, et præparábit viam ante fáciem meam. Et
    statim véniet ad templum sanctum suum Dominátor, quem vos quǽritis, et
    Angelus Testaménti, quem vos vultis.
  - $Deo gratias
rubrica-cisterciensis/versum-2:
  - "@:Versum 1"
ant-2:
  - "Cum indúcerent * púerum Jesum paréntes ejus, accépit eum Símeon in ulnas
    suas, et benedíxit Deum, dicens: Nunc dimíttis servum tuum in pace."
lectio-prima:
  - "!Mal 3:4"
  - v. Et placébit Dómino sacrifícium Juda et Jerúsalem sicut dies sǽculi et
    sicut anni antíqui, dicit Dóminus omnípotens.
capitulum-sexta:
  - "!Mal 3:1-2"
  - "v. Ecce véniet, dicit Dóminus exercítuum: et quis póterit cogitáre diem
    advéntus ejus, et quis stabit ad vidéndum eum? Ipse enim quasi ignis
    conflans, et quasi herba fullónum."
  - $Deo gratias
