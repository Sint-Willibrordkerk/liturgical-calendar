introitus:
  - "@Tempora/Pent08-0"
oratio:
  - "Omnípotens sempitérne Deus, majestátem tuam súpplices exorámus: ut, sicut
    unigénitus Fílius tuus hodiérna die cum nostræ carnis substántia in templo
    est præsentátus; ita nos fácias purificátis tibi méntibus præsentári."
  - $Per eundem
lectio:
  - Léctio Malachíæ Prophétæ
  - "!Malach 3:1-4"
  - "Hæc dicit Dóminus Deus: Ecce, ego mitto Angelum meum, et præparábit viam
    ante fáciem meam. Et statim véniet ad templum suum Dominátor, quem vos
    quæritis, et Angelus testaménti, quem vos vultis. Ecce, venit, dicit Dóminus
    exercítuum: et quis póterit cogitáre diem advéntus ejus, et quis stabit ad
    vidéndum eum? Ipse enim quasi ignis conflans et quasi herba fullónum: et
    sedébit conflans et emúndans argéntum, et purgábit fílios Levi et colábit
    eos quasi aurum et quasi argéntum: et erunt Dómino offeréntes sacrifícia in
    justítia. Et placébit Dómino sacrifícium Juda et Jerúsalem, sicut dies
    sǽculi et sicut anni antíqui: dicit Dóminus omnípotens."
graduale:
  - "!Ps 47:10-11; 47:9"
  - "Suscépimus, Deus, misericórdiam tuam in médio templi tui: secúndum nomen
    tuum, Deus, ita et laus tua in fines terræ."
  - V. Sicut audívimus, ita et vídimus in civitáte Dei nostri, in monte sancto
    ejus.
  - Allelúja, allelúja.
  - "V. Senex Púerum portábat: Puer autem senem regébat. Allelúja."
