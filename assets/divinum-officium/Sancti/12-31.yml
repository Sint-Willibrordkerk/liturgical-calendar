lectio4:
  - Silvéster Románus, patre Rufíno, a prima ætáte óperam dedit Cyríno
    presbýtero; cujus doctrínam et mores egrégie imitátus est. Hic, sæviénte
    persecutióne, in Sorácte monte latitáverat; et trigésimum annum agens,
    présbyter sanctæ Románæ Ecclésiæ a Marcellíno Pontífice creátur. Quo in
    múnere cum omni laude cléricis áliis antecélleret, in Melchíadis póstea
    locum succéssit, imperatóre Constantíno, qui ántea pacem Ecclésiæ Christi
    lege pública déderat. Vix Ecclésiæ gubernácula tractánda suscéperat,
    Constantínum, jam Crucis signo cǽlitus illustrátum, et de hoste Maxéntio
    victórem, ad tuéndam propagandámque christiánam religiónem impénse fovit.
    Quem étiam, uti vetus Ecclésiæ Románæ refert tradítio, Apostolórum imágines
    recognóscere fecit, sacro baptísmate tinxit, et ab infidelitátis lepra
    mundávit.
lectio5:
  - "Itaque, auctóre Silvéstro, pius imperátor quam christifidélibus públice
    templa exstruéndi tribúerat facultátem, eam exémplo suo confirmávit. Multas
    enim eréxit Basílicas, scílicet Lateranénsem Christo Servatóri, Vaticánam
    sancto Petro, Ostiénsem sancto Paulo, sancto Lauréntio in Agro Veráno,
    sanctæ Cruci in Atrio Sessoriáno, sancto Petro et Marcellíno ac sanctæ
    Agnéti in viis Lavicána et Nomentána, et álias; quas sacris imagínibus
    spléndide exornávit, et, munéribus prædiísque attribútis, magnificentíssime
    locupletávit. Hoc Pontífice hábitum est Concílium Nicǽnum primum, ubi
    præsidéntibus ejus legátis, præsénteque Constantíno et trecéntis decem et
    octo epíscopis, sancta et cathólica fides explicáta est, Arío ejúsdem
    sectatóribus condemnátis; quod étiam Concílium, peténtibus Pátribus,
    confirmávit in sýnodo Romæ hábita, ubi íterum Aríus condemnátus est. Multa
    item decréta fecit Ecclésiæ Dei utília, quæ sub ejus nómine recenséntur: id
    est, ut a solo epíscopo chrisma conficerétur; ut présbyter chrísmate
    baptizáti summum liníret vérticem; ut diáconi dalmáticis in ecclésia, et
    palla linóstima ad lævam uteréntur; ut in líneo tantum velo sacrifícium
    altáris conficerétur."
lectio6:
  - Idem præscripsísse tráditur tempus ómnibus, qui ordínibus initiáti essent,
    exercéndi síngulos órdines in Ecclésia, ántequam quisque ad altiórem gradum
    ascénderet; ut láicus clérico non inférret crimen, ne cléricus apud profánum
    júdicem causam díceret. Sábbati et Domínici diéi nómine reténto, réliquos
    hebdómadæ dies feriárum nómine distínctos, ut jam ante in Ecclésia vocári
    cœperant, appellári vóluit, quo significarétur, quotídie cléricos, abjécta
    ceterárum rerum cura, uni Deo prorsus vacáre debére. Huic cælésti prudéntiæ,
    qua ecclésiam administrábat, insígnis vitæ sánctitas, et benígnitas in
    páuperes perpétuo respóndit. Quo in génere provídit, ut cléricis copiósis
    egéntes conjúngeret, et sacris virgínibus, quæ ad victum necessária essent,
    suppeditaréntur. Vixit in pontificátu annos vigínti unum, menses decem, diem
    unum. Sepúltus est in cœmeterio Priscíllæ, via Salária. Fecit ordinatiónes
    septem mense Decémbri, quibus creávit presbýteros quadragínta duos, diáconos
    vigínti quinque, epíscopos per divérsa loca sexagínta quinque.
lectio94:
  - Silvéster Románus, patre Rufíno, sæviénte persecutióne, in Sorácte monte
    latitáverat; et trigésimum annum agens, présbyter sanctæ Románæ Ecclésiæ est
    creátus. Melchíade Pontífice vita functo, in ejus locum succéssit,
    imperatóre Constantíno, qui ántea pacem Ecclésiæ Christi lege pública
    déderat. Quem Silvéster ad tuéndam propagandámque religiónem ita fovit, ut
    imperátor multas eréxerit basílicas, eásque municicentíssime locupletárit.
    Hoc Pontífice hábitum est concílim Nicænum primum, ab ipso Silvéstro
    confirmátum, quo Aríus condemnátus fuit. Vitæ sanctitáte et in páuperes
    benignitáte insígnis, óbiit in pace et sepúltus es in cœmetério Priscíllæ.
