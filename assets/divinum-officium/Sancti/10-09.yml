  - "&Gloria"
  - "v. In sermónibus Dómini ópera ejus: sol illúminans per ómnia respéxit, et
    glória Dómini plenum est opus ejus."
oratio:
  - "Deus, qui beátum Joánnem Confessórem tuum ad fidem in géntibus propagándam
    mirabíliter excitáre dignátus es, ac per eum in erudiéndis fidélibus novam
    in Ecclésia tua famíliam congregásti: da nobis fámulis tuis; ita ejus
    institútis profícere, ut prǽmia consequámur ætérna."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Corinthios
  - "!2 Cor 4:1-6, 15-18"
  - "Fratres: Habéntes administratiónem juxta quod misericórdiam consecúti
    sumus, non defícimus, sed abdicámus occúlta dedécoris, non ambulántes in
    astútia, neque adulterántes verbum Dei, sed in manifestatióne veritátis
    commendántes nosmetípsos ad omnem consciéntiam hóminum coram Deo. Quod si
    étiam opértum est Evangélium nostrum: in iis, qui péreunt, est opértum: in
    quibus Deus hujus sǽculi excæcávit mentes infidélium, ut non fúlgeat illis
    illuminátio Evangélii glóriæ Christi, qui est imágo Dei. Non enim
    nosmetípsos prædicámus, sed Jesum Christum Dóminum nostrum: nos autem servos
    vestros per Jesum: quóniam Deus, qui dixit de ténebris lucem splendéscere,
    ipse illúxit in córdibus nostris ad illuminatiónem sciéntiæ claritátis Dei,
    in fácie Christi Jesu. Omnia enim propter vos: ut grátia abúndans, per
    multos in gratiárum actione, abúndet in glóriam Dei. Propter quod non
    deficimus: sed licet is, qui foris est, noster homo corrumpátur: tamen is,
    qui intus est, renovatur de die in diem. Id enim, quod in præsenti est
    momentáneum et leve tribulatiónis nostræ, supra modum in sublimitáte ætérnum
    glóriæ pondus operátur in nobis, non contemplántibus nobis quæ vidéntur, sed
    quæ non vidéntur. Quæ enim vidéntur, temporália sunt: quæ autem non
    vidéntur, ætérna sunt."
graduale:
  - "!Ps 72:21; 68:10"
  - "Inflammátum est cor meum, et renes mei commutáti sunt: zelus domus tuæ
    comédit me."
  - "!Isa 49:2"
  - "Pósuit os meum quasi gládium acutum: in umbra manus suæ protéxit me, et
    pósuit me sicut sagíttam eléctam. Allelúja, allelúja."
  - "!Ps 70:7"
  - "Tamquam prodígium factus sum multis: et tu adjútor fortis, Allelúja."
gradualep:
