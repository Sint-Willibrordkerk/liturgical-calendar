    mihi, ut ímpleam verbum Dómini.
secreta:
  - "Súscipe, Dómine, oblatiónem mundam salutáris hóstiæ: et præsta; ut,
    intercedénte beáto Joánne Confessóre tuo, úbique géntium júgiter offerátur."
  - $Per Dominum
communio:
  - "!Phil 3:7"
  - Quæ mihi fuérunt lucra, hæc arbitrátus sum propter Christum detriménta.
postcommunio:
  - "Pretiósi córporis, et sánguinis tui sacris refécti mystériis, Dómine,
    adprecámur: ut beáti Joánnis Confessóris tui exémplo, studeámus confitéri
    quod crédidit, et ópere exercére quod dócuit:"
  - $Qui vivis
lectio4:
  - Joánnes Leonardi, in oppido Décimi, non longe a Lucénsi urbe, piis et
    honestis ortus paréntibus, jam inde a prima ætate, solitúdinis et
    precatiónis amóre, grave quiddam ac matúrum præ se tulit. Annos natus
    viginti sex a Deo vocátus ad ecclesiásticæ milítiæ nomen dandum, sæcularibus
    curis íllico nuntium remisit. Ac primo inter púeros latinæ linguæ rudimentis
    instructus, deínde in litteris et philosophicis ac theologicis disciplinis
    adeo profecit, ut vix acto quadriennio ad sacerdotium ex obediéntia promotus
    fúerit. Mox aliquot nactus bonæ índolis nóbiles júvenes, cum eos ad virtútis
    perfectiónem sedulo exercuísset, insequénti anno congregatiónem instituit
    clericórum regulárium, quam a Matre Dei, ob incensum erga ipsam suæ
    devotiónis afféctum, nuncupávit. Horum cura et zelo tanta peracta est
    animórum commutátio, ut cum in Lucénsi republica, hæreticórum præsertim
    perfidiosis artibus, ardérent civium odia, profligatique essent mores, brevi
    témpore primæva Christianórum pietas ibidem revixisse viderétur.
lectio5:
  - Tam salutárium óperum causa incídit Joánnes in acerrimas insectatiónes
    hóminum nequam, qui recens coactam familiam pérdere omni ope conáti
    sunt.  Sed vir Dei, æquo animo libenter ómnia ferens, impetráta a Summo
    Pontifice Gregório décimo tertio suæ congregatiónis confirmatióne,
    apostolici sui labóris fructus constanter servávit.  In arduis negotiis
    componéndis multi epíscopi eo consiliario et adjutore usi sunt, et vel ipse
    Romanus Pontifex eum delegávit ad intricáta litigia dirimenda, et ad
    religiosas familias reformandas.  Sancto Josepho Calasanctio, ejusque pene
    collapsæ societati, præsto fuit.  Haud levem quoque impéndit operam negotiis
    nosocomíi Sancti Spíritus in Saxia, et moniálibus oblátis sanctæ Franciscæ
    Romanæ excolendis.
lectio6:
  - Gráviter dolens, gentes adeo plurimas remotis in regiónibus luce Evangélii
    carére, inflammabátur desidério migrándi in illas oras ad lumen veræ
    religiónis effundéndum.  At cum intellixísset a sancto Philippo Nerio, a quo
    verus reformator dicebátur, se suamque congregatiónem ad instituéndos Italiæ
    pópulos destinari, divinæ acquiévit voluntáti ; minime tamen abstinuit quin,
    si aliquam infidelibus opem afferre posset, experirétur.  Hinc ínitis
    consíliis cum piíssimo præsule Vives, cœtum instituit presbyterórum, quibus
    propositum esset idoneos informare adolescéntes, in díssitas regiónes
    subinde mittendos ad fidem propagandam.  Quare mérito véluti auctor censétur
    præclaríssimi illíus instituti, quod Summórum Pontificum ópera amplificátum,
    proferendæ per univérsum orbem catholicæ fidei mirabíliter inservit.  Plura
    ópera de re sacra et morali conscripsit, cuívis hóminum conditióni
    accommodatíssima.  Denique a sacro ministerio numquam deficiens, in cínere
    et cilício ad Dóminum migrávit Romæ, die nona Octobris, anno millesimo
    sexcentésimo nono, ætátis sexagesimo sexto.  Quem sanctitátis et miraculis
    illustrem Pius nonus Pontifex Maximus Beatórum fastis accensuit.  Pius vero
    undecimus, anno millesimo nongentésimo trigesimo octavo, die solemni Paschæ,
    inter Sanctos adscripsit.
lectio94:
  - Joánnes Leonárdi non longe a Lucénsi urbe ortus, a prima ætáte grave quiddam
    ac matúrum præ se tulit. Annos natus vigínti sex a Deo vocátus ad
    ecclesiásticæ milítiæ nomen dandum, primum inter púeros latínæ linguæ
    rudiméntis instrúctus, in lítteris et philosóphicis ac theológicis
    disciplínis ádeo profécit, ut vix acto quadriénnio ad sacerdótium ex
    obediéntia promótus fúerit. Congregatiónem instítuit clericórum regulárium a
    Matre Dei, quorum cura et zelo in Lucénsi república magna animórum
    commutátio perácta est. Hinc in acérrimas hóminum nequam insectatiónes
    incídit, sed, æquo ánimo ómnia libénter ferens, a Gregório décimo tértio suæ
    congregatiónis confirmatiónem impetrávit. Gráviter dolens gentes plúrimas
    remótis in regiónibus luce Evangélica carére consíliis ínitis cum piíssimo
    prǽsule Vives, cœtum instítuit presbyterórum, quibus propósitum esset
    idóneos informáre adolescéntes, in díssitas regiónes subínde mitténdos ad
    fidem propagándam. A sacro ministério nunquam defíciens, in cínere et
    cilício ad Dóminum migrávit Romæ, die nona octóbris, anno millésimo
    sexcentésimo nono, et a Pio undécimo Sanctórum fastis adscríptus est.
  - "&teDeum"
