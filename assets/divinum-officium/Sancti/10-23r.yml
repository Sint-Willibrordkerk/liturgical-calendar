lectio94:
  - Antónius María Claret, Salléntii in Hispánia, piis honestísque paréntibus
    natus, adoléscens textóriam artem exércuit, sed dein, sacerdótio auctus,
    primum parœciále ministérium excóluit, póstea vero Romam venit ut a
    Propagándæ Fídei Congregatióne ad éxteras missiónes mitterétur. Sed, Deo
    disponénte, Hispániam revérsus, missionárius apostólicus Cataláuniam, et
    Fortunátas Insulas peragrávit. Bonórum librórum scriptor fecúndus,
    Congregatiónem quoque Filiórum Immaculáti Cordis Maríæ fundávit.
    Archiepiscopáli sedi Sancti Jacóbi in Cuba præféctus, zelántis Pastóris
    virtútibus mire effúlsit; seminárium restítuit, doctrínam et disciplínam
    clericórum promóvit, ópera sociália cóndidit, pro christiána filiárum
    institutióne Soróres Docéntes a María Immaculáta instítuit. Matríti demum
    accersítus, ut Hispaniárum Regínæ a confessiónibus et in gravíssimis
    ecclesiásticis negótiis a consíliis esset, austeritátis omniúmque virtútum
    exímium prǽbuit exémplar. In Vaticáno Concílio Románi Pontíficis
    infallibilitátem strénue deféndit. Devotiónem erga Sanctíssimum Sacraméntum
    et Cor Maríæ Immaculátum ejúsque Rosárium mirífice propagávit. Tandem, apud
    Fontem Frígidum, in Gállia, exsul móritur, anno millésimo octingentésimo
    septuagésimo. Quem, miráculis clarum, Pius Papa undécimus Beatórum, Pius
    vero duodécimus Sanctórum fastis adscrípsit.
  - "&teDeum"
