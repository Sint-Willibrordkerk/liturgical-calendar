oratio:
  - "Deus, qui beátum Antónium Maríam Confessórem tuum atque Pontíficem,
    apostólicis virtútibus sublimásti, et per eum novas in Ecclésia clericórum
    ac vírginum famílias collegísti: concéde, quǽsumus; ut, eius dirigéntibus
    mónitis ac suffragántibus méritis, animárum salútem quǽrere iúgiter
    studeámus."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Hebrǽos
  - "!Heb 7:23-27."
  - "Fratres : Plures facti sunt sacerdótes, idcírco quod morte prohiberéntur
    permanére : Iesus autem, eo quod máneat in ætérnum, sempitérnum habet
    sacerdótium. Unde et salváre in perpétuum potest accedéntes per semetípsum
    ad Deum : semper vivens ad interpellándum pro nobis. Talis enim decébat, ut
    nobis esset póntifex, sanctus, ínnocens, impollútus, segregátus a
    peccatóribus, et excélsior cælis factus : qui non habet necessitátem
    cotídie, quemádmodum sacerdótes, prius pro suis delíctis hóstias offérre,
    deínde pro pópuli : hoc enim fecit semel, seípsum offeréndo, Jesus Christus,
    Dóminus noster."
graduale:
  - "!Ps 131:16-17"
  - V. Sacerdótes ejus índuam salutári, et sancti ejus exsultatióne exsultábunt.
  - V. Illuc prodúcam cornu David; parávi lucérnam christo meo. Allelúia,
    allelúia.
  - "!Ps 109:4"
  - "V. Jurávit Dóminus, et non pœnitébit eum: Tu es sacérdos in ætérnum
    secúndum órdinem Melchísedech. Allelúia."
evangelium:
  - Lectio sancti Evangelii secundum Matthǽum
  - "!Matt 24:42-47."
  - "In illo témpore: Dixit Jesus discípulis suis: Vigiláte ergo, quia nescítis
    qua hora Dóminus vester ventúrus sit. Illud autem scitóte, quóniam si sciret
    paterfamílias qua hora fur ventúrus esset, vigiláret útique, et non síneret
    pérfodi domum suam. Ideo et vos estóte paráti: quia qua nescítis hora Fílius
    hóminis ventúrus est. Quis, putas, est fidélis servus, et prudens, quem
    constítuit dóminus suus super famíliam suam ut det illis cibum in témpore?
    Beátus ille servus, quem cum vénerit dóminus ejus, invénerit sic faciéntem.
    Amen dico vobis, quóniam super ómnia bona sua constítuet eum."
