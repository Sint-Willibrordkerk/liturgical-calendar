introitus:
  - "!Is 59:21; 56:7"
  - "v. Dicit Dóminus: Sermónes mei, quos dedi in os tuum, non defícient de ore
    tuo: et múnera tua accépta erunt super altáre meum."
  - "!Ps 111:1"
  - "Beátus vir, qui timet Dóminum: in mandátis ejus cupit nimis."
  - "&Gloria"
  - "v. Dicit Dóminus: Sermónes mei, quos dedi in os tuum, non defícient de ore
    tuo: et múnera tua accépta erunt super altáre meum."
oratio:
  - "Deus, qui nos ánnua beáti Cleméntis Mártyris tui atque Pontíficis
    sollemnitáte lætíficas: concéde propítius; ut, cujus natalítia cólimus,
    virtútem quoque passiónis imitémur."
  - $Per Dominum
communi-summorum-pontificum/oratio: []
lectio:
  - "@Tempora/Pent23-0"
secreta:
  - "Múnera tibi, Dómine, obláta sanctífica: et, intercedénte beáto Cleménte
    Mártyre tuo atque Pontífice, per hæc nos a peccatórum nostrórum máculis
    emúnda."
  - $Per Dominum
communi-summorum-pontificum/secreta: []
postcommunio:
  - "Córporis sacri et pretiósi Sánguinis repléti libámine, quǽsumus, Dómine,
    Deus noster: ut, quod pia devotióne gérimus; intercedénte beáto Cleménte
    Mártyre tuo atque Pontífice, certa redemptióne capiámus."
  - $Per Dominum
communi-summorum-pontificum/postcommunio: []
