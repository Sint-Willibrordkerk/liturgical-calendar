  - R. Iter præbens pópulo terræ, ut enárrent mirabília tua.
  - "&Gloria"
  - R. Iter præbens pópulo terræ, ut enárrent mirabília tua.
lectio4:
  - "Clemens, Románus, Faustíni fílius, de regióne Cǽlii montis, discípulus
    beáti Petri, cujus méminit Paulus scribens ad Philippénses: Etiam rogo et
    te, germáne compar, ádjuva illas quæ mecum laboravérunt in Evangélio, cum
    Cleménte et céteris adjutóribus meis, quorum nómina sunt in libro vitæ. Hic
    septem Urbis regiónes divísit septem notáriis, síngulas síngulis attríbuens,
    qui passiónes Mártyrum et res ab eis gestas, diligentíssime conquisítas,
    lítteris mandárent. Multa scripsit et ipse accuráte et salutáriter, quibus
    christiánam religiónem illustrávit."
rubrica-divino-aut-rubrica-1955/responsory4:
  - "@:Responsory1o"
lectio5:
  - Cum autem doctrína ac vitæ sanctitáte multos ad Christi fidem convérteret, a
    Trajáno imperatóre relegátus est trans mare Pónticum in solitúdine urbis
    Chersónæ; in qua duo míllia Christianórum réperit, qui ab eódem Trajáno
    condemnáti fúerant. Qui cum in eruéndis et secándis marmóribus aquæ penúria
    laborárent, Clemens, facta oratióne, in vicínum collem ascéndit, in cujus
    jugo vidit Agnum déxtero pede fontem aquæ dulcis, qui inde scatébat,
    attingéntem; ubi omnes sitim explevérunt. Eóque miráculo multi infidéles, ad
    Christi fidem convérsi, Cleméntis étiam sanctitátem venerári cœpérunt.
rubrica-divino-aut-rubrica-1955/responsory5:
  - "@:Responsory2o"
lectio6:
  - Quibus concitátus Trajánus, misit illuc qui Cleméntem, alligáta ad ejus
    collum ánchora, in profúndum dejícerent. Quod cum factum esset, Christiánis
    ad littus orántibus, mare ad tria milliária recéssit; eóque illi accedéntes,
    ædículam marmóream in templi formam et intus arcam lapídeam, ubi Mártyris
    corpus cónditum est. Ecclésia étiam in eo ínsulæ loco unde divínitus fons
    manárat, ejúsdem nómine dedicáta est. Vixit in pontificátu annos novem,
    menses sex, dies sex. Fecit ordinatiónes duas mense Decémbri, quibus creávit
    presbýteros decem, diáconos duos, epíscopos per divérsa loca quíndecim.
rubrica-divino-aut-rubrica-1955/responsory6:
  - "@:Responsory3o"
lectio94:
  - Clemens, Románus, discípulus beáti Petri, septem Urbis regiónes divísit
    septem notáriis, síngulas síngulis attríbuens, qui passiónes Mártyrum et res
    ab eis gestas, diligentíssime conquisítas, lítteris mandárent. Multa
    scripsit et ipse accuráte et salutáriter, quibus christiánam religiónem
    illustrávit. Cum autem doctrína ac vitæ sanctitáte multos ad Christi fidem
    convérteret, a Trajáno imperatóre relegátus est trans mare Pónticum in
    solitúdine urbis Chersónæ, in qua duo míllia Christianórum réperit, qui ab
    eódem Trajáno condemnáti fúerant. Cum multos ibi infidéles, ad Christi fidem
    convertísset, jussu ejúsdem imperatóris alligáta ad ejus collum ánchora, in
    mare præcipitátus, martýrio coronátus est. Ejus corpus, Nicoláo primo
    Pontífice Romam translátum, in ecclésia, quæ ejus nómine ántea fúerat
    dicáta, honorífice recónditum est.
  - "&teDeum"
rubrica-tridentina/lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 24:42-45"
  - "In illo témpore: Dixit Jesus discípulis suis: Vigiláte, quia nescítis qua
    hora Dóminus vester ventúrus sit. Et réliqua."
  - _
  - Homilía sancti Hilárii Epíscopi
  - "!Comment. in Matth. Can 26"
  - "Ut ignorántiam illam diéi ómnibus táciti, non sine útilis siléntii ratióne
    esse scirémus, vigiláre nos Dóminus propter advéntum furis admónuit, et
    oratiónum assiduitáte deténtos ómnibus præceptórum suórum opéribus inhærére.
    Furem enim esse osténdit zábulum, ad detrahénda ex nobis spólia pervígilem,
    et córporum nostrórum dómibus insidiántem: ut ea incuriósis nobis, et somno
    déditis, consiliórum suórum atque illecebrárum jáculis perfódiat. Parátos
    ígitur esse nos cónvenit: quia diéi ignorátio inténtam sollicitúdinem
    suspénsæ exspectatiónis exágitet."
rubrica-tridentina/lectio8:
  - "!Can 27"
  - "Quisnam est fidélis servus et prudens, quem constítuit Dóminus super
    famíliam suam? Quamquam in commúne nos ad indeféssam vigilántiæ curam
    adhortétur: speciálem tamen pópuli princípibus, id est, epíscopis, in
    exspectatióne adventúque suo sollicitúdinem mandat. Hunc enim servum fidélem
    atque prudéntem, præpósitum famíliæ signíficat, cómmoda atque utilitátes
    commíssi sibi pópuli curántem. Qui si dicto áudiens, et præcéptis obédiens
    erit, id est, si doctrínæ opportunitáte et veritáte infírma confírmet,
    disrúpta consólidet, depraváta convértat, et verbum vitæ in æternitátis
    cibum aléndæ famíliæ dispéndat, atque hæc agens, hisque ímmorans
    deprehendátur: glóriam a Dómino tamquam dispensátor fidélis et víllicus
    útilis consequétur, et super ómnia bona constituétur; id est, in Dei glória
    collocábitur, quia nihil sit ultra, quod mélius sit."
