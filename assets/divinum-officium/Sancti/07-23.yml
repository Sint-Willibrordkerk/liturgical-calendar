  - "1"
  - "@C2-1"
lectio4:
  - Apollináris cum Príncipe Apostolórum Antiochía Romam venit; a quo, ordinátus
    epíscopus, Ravennam ad Christi Dómini Evangélium prædicándum mittitur; ubi,
    cum ad Christi fidem plurimos convérteret, captus ab idolórum sacerdótibus
    gráviter cæsus est. Cumque ipso orante Bonifatius nobilis vir, qui diu mutus
    fuerat, loquerétur, ejusque fília immundo spíritu liberáta esset; íterum est
    in illum commóta seditio. Itaque virgis cæsus, ardéntes carbónes nudis
    pédibus prémere cogitur; quem cum subjéctus ignis nihil læderet, ejícitur
    extra urbem.
lectio5:
  - "Is vero latens aliquámdiu cum quibusdam Christiánis, inde profectus est in
    Æmiliam, ubi Rufini patricii filiam mortuam ad vitam revocávit; ut proptérea
    tota Rufini família in Jesum Christum crederet. Quare veheménter incénsus
    præfectus accersit Apollinarem, et cum eo gravius agit, ut finem fáciat
    disseminándi in urbe Christi fidem. Cujus cum Apollináris jussa neglígeret,
    equuleo cruciátur; in cujus plagas aqua fervens infúnditur, saxoque os
    túnditur: mox férreis vinculis constrictus includitur in carcere. Quarto die
    impositus in navem, mittitur in exsílium; ac facto naufragio venit in
    Mysiam, inde ad ripam Danubii, póstea in Thraciam."
lectio6:
  - "Cum autem in Serápidis templo dæmon se responsa datúrum negaret, dum ibidem
    Petri Apóstoli discipulus morarétur; diu conquisítus, invéntus est
    Apollináris: qui íterum jubétur navigare. Ita reversus Ravennam, ab iisdem
    illis idolórum sacerdótibus accusatus, centurióni custodiendus tráditur;
    qui, cum occulte Christum cóleret, noctu Apollinarem dimísit. Re cógnita,
    satéllites eum persequúntur, et plagis in itinere confectum, quod mortuum
    crederent, relinquunt. Quem cum inde Christiáni sustulissent, septimo die
    exhortans illos ad fidei constantiam, martyrii glória clarus migrávit e
    vita. Cujus corpus prope murum urbis sepúltum est."
lectio94:
  - Apollináris cum Príncipe Apostolórum Antiochía Romam venit; a quo, ordinátus
    epíscopus, Ravénnam ad Christi Dómini Evangélium prædicándum míttitur; ubi,
    cum ad Christi fidem plúrimos convérteret, captus ab idolórum sacerdótibus,
    gráviter cæsus est. Cumque ipso oránte Bonifátius nóbilis vir, qui diu mutus
    fúerat, loquerétur, ejúsque fília immúndo spíritu liberáta esset, íterum est
    in illum commóta sedítio. Quare divérsas et multíplices pœnas perpéssus est.
    Póstea per Æmíliam Evangélium prǽdicans, plúrimos ab idolórum cultu
    revocávit. Ravénnam revérsus, exhórtans Christiános ad fídei constántiam,
    gloriósum martýrium consummávit. Ejus corpus prope murum urbis sepúltum est.
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Lucam.
  - "!Luc 22:24-30"
  - "In illo témpore: Facta est contentio inter discipulos, quis eórum viderétur
    esse major. Et réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi.
  - "!Liber 10 in Lucæ, cap. 22, post initium."
  - "Regnum Dei non est de hoc mundo. Non ergo æqualitátis hómini ad Deum, sed
    similitúdinis æmulátio est. Solus enim Christus est plena imago Dei, propter
    expressam in se Paternæ claritúdinis unitátem. Justus autem homo ad imáginem
    Dei est, si propter imitandam divinæ conversatiónis similitúdinem mundum
    hunc Dei cognitióne contemnat, voluptatesque terrenas verbi perceptióne
    despíciat, quo álimur in vitam: unde et corpus Christi édimus, ut vitæ
    ætérnæ possímus esse participes."
lectio8:
  - Non enim victus et potus nobis præmii loco spondétur et honoris, sed
    communicátio gratiæ cæléstis et vitæ. Neque duodecim throni tamquam áliqua
    corporalis sunt receptácula sessiónis. Sed, quia sicut secúndum divinam
    similitúdinem júdicat Christus cognitióne cordium, non interrogatióne
    factórum, virtútem remúnerans, impietatémque condemnans; ita et Apóstoli in
    judícium spiritale formántur remuneratióne fidei et exsecratióne perfidiæ,
    virtúte errórem redarguéntes, sacrílegos ódio persequéntes.
lectio9:
  - "Convertámur ígitur, et caveámus, ne in perditiónem aliqua inter nos de
    prælatióne possit esse contentio. Si enim contendébant Apóstoli, non
    excusatióni obténditur, sed cautióni propónitur. Si Petrus aliquándo
    convértitur, qui ad primam Dómini secutus est vocem; quis potest dicere,
    cito se esse conversum? Cave ergo jactantiam, cave sæculum. Ille enim
    confírmare jubétur fratres suos, qui dixit: Omnia dimísimus, et secúti sumus
    te."
  - "&teDeum"
