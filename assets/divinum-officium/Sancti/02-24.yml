name:
  - Matthíam
introitus:
  - "!Ps 138:17"
  - "v. Mihi autem nimis honoráti sunt amíci tui, Deus: nimis confortátus est
    principátus eórum."
  - "!Ps 138:1-2."
  - "Dómine, probásti me et cognovísti me: tu cognovísti sessiónem meam et
    resurrectiónem meam."
  - "&Gloria"
  - "v. Mihi autem nimis honoráti sunt amíci tui, Deus: nimis confortátus est
    principátus eórum."
oratio:
  - "Deus, qui beatum Matthiam Apostolorum tuorum collegio sociasti: tribue,
    quæsumus; ut, eius interventione, tuæ circa nos pietatis semper viscera
    sentiamus."
  - $Per Dominum
lectio:
  - Léctio Actuum Apostolórum
  - "!Act 1, 15-26."
  - "In diébus illis exsúrgens Petrus in médio fratrum, dixit - erat autem turba
    hóminum simul, fere centum vigínti -: Viri fratres, opórtet impléri
    Scriptúram, quam prædíxit Spíritus Sanctus per os David de Juda, qui fuit
    dux eórum, qui comprehendérunt Jesum: qui connumerátus erat in nobis, et
    sortítus est sortem ministérii hujus. Et hic quidem possédit agrum de
    mercéde iniquitátis, et suspénsus crépuit médius: et diffúsa sunt ómnia
    víscera ejus. Et notum factum est ómnibus habitántibus Jerúsalem, ita ut
    appellarétur ager ille, lingua eórum, Hacéldama, hoc est ager sánguinis.
    Scriptum est enim in libro Psalmórum: Fiat commorátio eórum desérta, et non
    sit, qui inhábitet in ea: et episcopátum ejus accípiat alter. Opórtet ergo
    ex his viris, qui nobíscum sunt congregáti in omni témpore, quo intrávit et
    exívit inter nos Dóminus Jesus, incípiens a baptísmate Joánnis usque in
    diem, qua assúmptus est a nobis, testem resurrectiónis ejus nobíscum fíeri
    unum ex istis. Et statuérunt duos, Joseph qui vocabátur Bársabas, qui
    cognominátus est Justus, et Matthíam. Et orántes dixérunt: Tu, Dómine, qui
    corda nosti ómnium, osténde, quem elégeris ex his duóbus unum, accípere
    locum ministérii hujus et apostolátus, de quo prævaricátus est Judas, ut
    abíret in locum suum. Et dedérunt sortes eis, et cécidit sors super
    Matthíam, et annumerátus est cum úndecim Apóstolis."
graduale:
  - "!Ps 138:17-18"
  - "Nimis honoráti sunt amíci tui, Deus: nimis confortátus est principatus
    eórum."
  - V. Dinumerábo eos, et super arénam multiplicabúntur.
tractus:
  - "!Ps 138:17-18"
  - "Nimis honoráti sunt amíci tui, Deus: nimis confortátus est principatus
    eórum."
  - V. Dinumerábo eos, et super arénam multiplicabúntur.
  - _
  - "!Tractus"
  - "!Ps 20:3-4"
  - "Desidérium ánimæ ejus tribuísti ei: et voluntáte labiórum ejus non
    fraudásti eum."
  - V. Quóniam prævenísti eum in benedictiónibus dulcédinis.
  - V. Posuísti in cápite ejus corónam de lápide pretióso.
evangelium:
  - "@Sancti/01-15"
offertorium:
  - "!Ps 44:17-18"
  - "Constítues eos príncipes super omnem terram: mémores erunt nóminis tui,
    Dómine, in omni progénie et generatióne."
secreta:
  - "Hóstias tibi, Dómine, quas nómini tuo sacrándas offérimus, sancti Matthíæ
    Apóstoli tui prosequátur orátio: per quam nos expiári fácias et deféndi."
  - $Per Dominum
communio:
  - "!Matt 19:28"
  - Vos, qui secúti estis me, sedébitis super sedes, judicántes duódecim tribus
    Israël.
postcommunio:
  - "Præsta, quǽsumus, omnípotens Deus: ut per hæc sancta, quæ súmpsimus,
    interveniénte beáto Matthía Apóstolo tuo, véniam consequámur et pacem."
  - $Per Dominum
