lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 11:25-30"
  - "In illo témpore: Respóndens Jesus dixit: Confíteor tibi, Pater, Dómine cæli
    et terræ, quia abscondísti hæc a sapiéntibus et prudéntibus, et revelásti ea
    párvulis. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Sermo 10 de verbis Domini"
  - Veníte ad me, omnes qui laborátis. Quare enim omnes laborámus, nisi quia
    sumus hómines mortáles, frágiles, infírmi, lútea vasa portántes, quæ fáciunt
    ínvicem angústias? Sed, si angustiántur vasa carnis, dilaténtur spátia
    caritátis. Quid ergo dicit, Veníte ad me, omnes qui laborátis, nisi ut non
    laborétis? Dénique promíssio ejus in promptu est; quóniam laborántes
    vocávit, quærent forte, qua mercéde vocáti sunt. Et ego vos, inquit,
    refíciam. Tóllite jugum meum super vos, et díscite a me, non mundum
    fabricáre, non cuncta visibília et invisibília creáre, non in ipso mundo
    mirabília fácere et mórtuos suscitáre; sed, Quóniam mitis sum et húmilis
    corde.
lectio8:
  - Magnus esse vis? a mínimo íncipe. Cógitas magnam fábricam constrúere
    celsitúdinis? de fundaménto prius cógita humilitátis. Et quantam quisque
    vult et dispónit superimpónere molem ædifícii, quanto erit majus ædifícium,
    tanto áltius fodit fundaméntum. Et fábrica quidem cum constrúitur, in
    supérna consúrgit; qui autem fodit fundaméntum, ad ima deprímitur. Ergo et
    fábrica ante celsitúdinem humiliátur, et fastígium post humiliatiónem
    erígitur.
lectio9:
  - Quod est fastígium construéndæ fábricæ, quam molímur? quo perventúrum est
    cacúmen ædifícii? Cito dico, usque ad conspéctum Dei. Vidétis quam excélsum
    est, quanta res est conspícere Deum. Qui desíderat, et quod dico et quod
    audit intéllegit. Promíttitur nobis conspéctus Dei, veri Dei, summi Dei. Hoc
    enim bonum est, vidéntem vidére. Nam, qui colunt falsos deos, fácile illos
    vident; sed eos vident, qui óculos habent et non vident. Nobis autem
    promíttitur vísio Dei vivéntis et vidéntis.
  - "&teDeum"
