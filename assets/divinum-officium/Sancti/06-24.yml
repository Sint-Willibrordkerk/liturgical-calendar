secreta:
  - "Tua, Dómine, munéribus altária cumulámus: illíus nativitátem honóre débito
    celebrántes, qui Salvatórem mundi et cécinit ad futúrum et adésse
    monstravit, Dóminum nostrum Jesum Christum, Fílium tuum:"
  - $Qui tecum
communio:
  - "!Luc 1:76"
  - "Tu, puer, Propheta Altíssimi vocaberis: præíbis enim ante fáciem Dómini
    paráre vias ejus."
postcommunio:
  - "Sumat Ecclésia tua, Deus, beáti Joánnis Baptístæ generatióne lætítiam: per
    quem suæ regeneratiónis cognóvit auctórem, Dóminum nostrum Jesum Christum,
    Fílium tuum:"
  - $Qui tecum
