evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 1:57-68"
  - "Elísabeth implétum est tempus pariéndi, et péperit fílium. Et audiérunt
    vicíni et cognáti ejus, quia magnificávit Dóminus misericórdiam suam cum
    illa, et congratulabántur ei. Et factum est in die octávo, venérunt
    circumcídere púerum, et vocábant eum nómine patris sui Zacharíam. Et
    respóndens mater ejus, dixit: Nequáquam, sed vocábitur Joánnes. Et dixérunt
    ad illam: Quia nemo est in cognatióne tua, qui vocétur hoc nómine. Innuébant
    autem patri ejus, quem vellet vocári eum. Et póstulans pugillárem, scripsit,
    dicens: Joánnes est nomen ejus. Et miráti sunt univérsi. Apértum est autem
    illico os ejus et lingua ejus, et loquebátur benedícens Deum. Et factus est
    timor super omnes vicínos eórum: et super ómnia montána Judææ divulgabántur
    ómnia verba hæc: et posuérunt omnes, qui audíerant in corde suo, dicéntes:
    Quis, putas, puer iste erit? Etenim manus Dómini erat cum illo. Et
    Zacharías, pater ejus, repletus est Spíritu Sancto, et prophetávit, dicens:
    Benedíctus Dóminus, Deus Israël, quia visitávit et fecit redemptiónem plebis
    suæ."
