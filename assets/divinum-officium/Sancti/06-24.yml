lectio1:
  - Incipit liber Jeremíæ Prophétæ
  - "!Jer 1:1-5"
  - 1 Verba Jeremíæ fílii Helcíæ, de sacerdótibus, qui fuérunt in Anathoth, in
    terra Bénjamin.
  - 2 Quod factum est verbum Dómini ad eum in diébus Josíæ fílii Amon regis
    Juda, in tertiodécimo anno regni ejus.
  - 3 Et factum est in diébus Jóakim fílii Josíæ regis Juda, usque ad
    consummatiónem undécimi anni Sedecíæ fílii Josíæ regis Juda, usque ad
    transmigratiónem Jerúsalem, in mense quinto.
  - "4 Et factum est verbum Dómini ad me, dicens:"
  - "5 Priúsquam te formárem in útero, novi te: et ántequam exíres de vulva,
    sanctificávi te, et prophétam in géntibus dedi te."
responsory1:
  - "R. Fuit homo missus a Deo, cui nomen erat Joánnes:"
  - "* Hic venit in testimónium, ut testimónium perhibéret de lúmine, et paráret
    Dómino plebem perféctam."
  - V. Erat Joánnes in desérto prǽdicans baptísmum pœniténtiæ.
  - R. Hic venit in testimónium, ut testimónium perhibéret de lúmine, et paráret
    Dómino plebem perféctam.
lectio2:
  - "!Jer 1:6-10"
  - "6 Et dixi, A a a, Dómine Deus: ecce néscio loqui, quia puer ego sum."
  - "7 Et dixit Dóminus ad me: Noli dícere, Puer sum: quóniam ad ómnia, quæ
    mittam te, ibis: et univérsa, quæcúmque mandávero tibi, loquéris."
  - "8 Ne tímeas a fácie eórum: quia tecum ego sum, ut éruam te, dicit Dóminus."
  - "9 Et misit Dóminus manum suam, et tétigit os meum: et dixit Dóminus ad me:
    Ecce dedi verba mea in ore tuo:"
  - 10 ecce constítui te hódie super gentes, et super regna, ut evéllas, et
    déstruas, et dispérdas, et díssipes, et ædífices, et plantes.
responsory2:
  - "R. Elísabeth Zacharíæ magnum virum génuit, Joánnem Baptístam, præcursórem
    Dómini:"
  - "* Qui viam Dómino præparávit in erémo."
  - V. Fuit homo missus a Deo, cui nomen erat Joánnes.
  - R. Qui viam Dómino præparávit in erémo.
lectio3:
  - "!Jer 1:17-19"
  - "17 Tu ergo accínge lumbos tuos, et surge, et lóquere ad eos ómnia quæ ego
    præcípio tibi. Ne formídes a fácie eórum: nec enim timére te fáciam vultum
    eórum."
  - 18 Ego quippe dedi te hódie in civitátem munítam, et in colúmnam férream, et
    in murum ǽreum, super omnem terram, régibus Juda, princípibus ejus, et
    sacerdótibus, et pópulo terræ.
  - "19 Et bellábunt advérsum te, et non prævalébunt: quia ego tecum sum, ait
    Dóminus, ut líberem te."
responsory3:
  - "R. Priúsquam te formárem in útero, novi te: et ántequam exíres de ventre,
    sanctificávi te,"
  - "* Et prophétam in géntibus dedi te."
  - V. Vir diléctus a Deo, et homínibus honorátus est.
  - R. Et prophétam in géntibus dedi te.
  - "&Gloria"
  - R. Et prophétam in géntibus dedi te.
lectio4:
  - Sermo sancti Augustíni Epíscopi
  - "!Sermo 20 de Sanctis"
  - "Post illum sacrosánctum Dómini natális diem, nullíus hóminum nativitátem
    légimus celebrári, nisi solíus beáti Joánnis Baptístæ. In áliis Sanctis et
    eléctis Dei nóvimus illum diem coli, quo illos, post consummatiónem labórum
    et devíctum triumphatúmque mundum, in perpétuas æternitátes præsens hæc vita
    partúriit. In áliis consummáta últimi diéi mérita celebrántur: in hoc étiam
    prima dies, et ipsa étiam hóminis inítia consecrántur; pro hac absque dúbio
    causa, quia per hunc Dóminus advéntum suum, ne súbito hómines insperátum non
    agnóscerent, vóluit esse testátum. Joánnes autem figúra fuit véteris
    Testaménti, et in se formam prǽtulit legis; et ídeo Joánnes prænuntiávit
    Salvatórem, sicut lex grátiam præcucúrrit."
responsory4:
  - "R. Descéndit Angelus Dómini ad Zacharíam dicens: Accipe púerum in senectúte
    tua:"
  - "* Et habébit nomen Joánnes Baptísta."
  - "V. Iste puer magnus coram Dómino: nam et manus ejus cum ipso est."
  - R. Et habébit nomen Joánnes Baptísta.
lectio5:
  - Quod autem nondum natus de secréto matérni úteri prophetávit, et expers
    lucis jam testis est veritátis; hoc est intellegéndum, quod latens sub
    velámine et carne lítteræ, et Redemptórem mundo spíritu prædicávit, et nobis
    Dóminum nostrum de quodam legis útero proclamávit. Ergo quia Judǽi
    erravérunt a ventre, id est, a lege quæ a Christo grávida erat, erravérunt a
    ventre, locúti sunt falsa; ídeo hic venit in testimónium, ut testimónium
    perhibéret de lúmine.
responsory5:
  - "R. Hic est præcúrsor diléctus, et lucérna lucens ante Dóminum:"
  - "* Ipse est enim Joánnes, qui viam Dómino præparávit in erémo; sed et Agnum
    Dei demonstrávit, et illuminávit mentes hóminum."
  - V. Ipse præíbit ante illum in spíritu et virtúte Elíæ.
  - R. Ipse est enim Joánnes, qui viam Dómino præparávit in erémo; sed et Agnum
    Dei demonstrávit, et illuminávit mentes hóminum.
lectio6:
  - "Quod autem Joánnes in cárcere constitútus ad Christum discípulos suos
    órdinat; lex ad Evangélium transmíttit. Quæ lex juxta typum Joánnis, quasi
    ignorántiæ clausa cárcere, in obscúro et in occúlto jacébat, et Judáica
    cæcitáte sensus intra lítteram tenebátur inclúsus. De hoc beátus Evangelísta
    prolóquitur: Ille erat lucérna ardens, id est, Spíritus Sancti igne
    succénsus, ut mundo ignorántiæ nocte possésso lumen salútis osténderet, et
    quasi inter densíssimas delictórum ténebras splendidíssimus justítiæ solem
    lucis suæ rádio demonstráret, et de seípso dicens: Ego vox clamántis in
    desérto."
responsory6:
  - "R. Innuébant patri ejus quem vellet vocári eum: et póstulans pugillárem,
    scripsit dicens:"
  - "* Joánnes est nomen ejus."
  - V. Apértum est os Zacharíæ, et prophetávit dicens.
  - R. Joánnes est nomen ejus.
  - "&Gloria"
  - R. Joánnes est nomen ejus.
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 1:57-69"
  - Elísabeth implétum est tempus pariéndi, et péperit fílium. Et audiérunt
    vicíni et cognáti ejus quia magnificávit Dóminus misericórdiam suam cum
    illa, et congratulabántur ei. Et réliqua.
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Liber 2 Comm. in Lucæ cap. 1, ante finem"
  - Péperit fílium Elísabeth, et congratulabántur vicíni. Habet Sanctórum edítio
    lætítiam plurimórum, quia commúne est bonum; justítia enim commúnis est
    virtus. Et ídeo in ortu justi futúræ vitæ insígne præmíttitur, et grátia
    secutúræ virtútis exsultatióne vicinórum præfiguránte signátur. Pulchre
    autem tempus, quo fuit in útero Prophéta, descríbitur, ne Maríæ præséntia
    taceátur; sed tempus silétur infántiæ, eo quia infántiæ impediménta
    nescívit. Et ídeo in Evangélio nihil super eo légimus, nisi ortum ejus, et
    oráculum, exsultatiónem in útero, vocem in desérto.
responsory7:
  - "R. Præcúrsor Dómini venit, de quo ipse testátur:"
  - "* Nullus major inter natos mulíerum Joánne Baptísta."
  - V. Hic est enim prophéta, et plus quam prophéta, de quo Salvátor ait.
  - R. Nullus major inter natos mulíerum Joánne Baptísta.
lectio8:
  - Neque enim ullam infántiæ sensit ætátem, qui supra natúram, supra ætátem in
    útero pósitus matris, a mensúra cœpit ætátis plenitúdinis Christi. Mire
    sanctus Evangelísta præmitténdum putávit, quod plúrimi infántem patris
    nómine Zacharíam appellándum putáverint; ut advértas matri non nomen
    alicújus displicuísse degéneris, sed id Sancto infúsum Spíritu, quod ab
    Angelo ante Zacharíæ fúerat prænuntiátum. Et quidem ille mutus intimáre
    vocábulum fílii nequívit uxóri; sed per prophetíam Elísabeth dídicit, quod
    non didícerat a maríto.
responsory8:
  - "R. Gábriel Angelus appáruit Zacharíæ dicens: Nascétur tibi fílius, nomen
    ejus Joánnes vocábitur:"
  - "* Et multi in nativitáte ejus gaudébunt."
  - V. Erit enim magnus coram Dómino, vinum et síceram non bibet.
  - R. Et multi in nativitáte ejus gaudébunt.
  - "&Gloria"
  - R. Et multi in nativitáte ejus gaudébunt.
lectio9:
  - Joánnes est, inquit, nomen ejus; hoc est, non nos ei nomen impónimus, qui
    jam a Deo nomen accépit. Habet vocábulum suum, quod agnóvimus, non quod
    elégimus. Habent hoc mérita Sanctórum, ut a Deo nomen accípiant. Sic Jacob
    Israël dícitur, quia Deum vidit. Sic Dóminus noster Jesus nominátus est,
    ántequam natus; cui non Angelus, sed Pater nomen impósuit. Vides Angelos quæ
    audíerint, non quæ usurpáverint, nuntiáre. Nec miréris, si nomen múlier,
    quod non audívit, asséruit; quando Spíritus ei Sanctus, qui Angelo
    mandáverat, revelávit.
  - "&teDeum"
