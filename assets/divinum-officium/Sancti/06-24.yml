introitus:
  - "!Isa 49:1; 49:2"
  - "v. De ventre matris meæ vocávit me Dóminus in nómine meo: et pósuit os meum
    ut gládium acútum: sub teguménto manus suæ protéxit me, et pósuit me quasi
    sagíttam eléctam."
  - "!Ps 91:2"
  - "Bonum est confitéri Dómino: et psállere nómini tuo, Altíssime."
  - "&Gloria"
  - "v. De ventre matris meæ vocávit me Dóminus in nómine meo: et pósuit os meum
    ut gládium acútum: sub teguménto manus suæ protéxit me, et pósuit me quasi
    sagíttam eléctam."
oratio:
  - "Deus, qui præséntem diem honorábilem nobis in beáti Joánnis nativitáte
    fecísti: da pópulis tuis spirituálium grátiam gaudiórum; et ómnium fidélium
    mentes dirige in viam salútis ætérnæ."
  - $Per Dominum
lectio:
  - Léctio Isaíæ Prophétæ
  - "!Isa 49:1-3; 49:5-7"
  - "Audíte, ínsulæ, et atténdite, pópuli, de longe: Dóminus ab útero vocavit
    me, de ventre matris meæ recordátus est nóminis mei. Et pósuit os meum quasi
    gládium acútum: in umbra manus suæ protéxit me, et pósuit me sicut sagíttam
    eléctam: in pháretra sua abscóndit me. Et dixit mihi: Servus meus es tu,
    Israël, quia in te gloriábor. Et nunc dicit Dóminus, formans me ex útero
    servum sibi: Ecce, dedi te in lucem géntium, ut sis salus mea usque ad
    extrémum terræ. Reges vidébunt, et consúrgent príncipes, et adorábunt
    propter Dominum et sanctum Israël, qui elégit te."
graduale:
