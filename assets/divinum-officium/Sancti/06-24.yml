  - V. Misit Dóminus manum suam, et tétigit os meum, et dixit mihi.
  - Allelúja, allelúja.
  - "!Luc 1:76"
  - "Tu, puer, Prophéta Altíssimi vocáberis: præíbis ante Dóminum paráre vias
    ejus. Allelúja."
