    Salvátor ait: Inter natos mulíerum non surréxit major Joánne Baptísta."
rubrica-cisterciensis/ant-3:
  - "Et posuérunt * omnes qui audiérunt in corde suo, dicéntes: Quis, putas,
    puer iste erit? Etenim manus Dómini erat cum illo. Et Zacharías pater ejus
    replétus est Spíritu sancto; et prophetávit, dicens: Benedíctus Deus Israël,
    quia visitávis, et fecit redemptiónem plebis suæ."
