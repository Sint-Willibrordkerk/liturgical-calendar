lectio93:
  - "Gervasius et Protasius, Vitalis et Valériæ fílii, quorum pater Ravennæ,
    mater Mediolani pro Christi Dómini fide martyrium subiérunt, distributo
    paupéribus patrimonio, domesticos servos libertáte donarunt. Quo facto
    Gentílium sacerdótes immane in illos conceptum ódium habebant. Quare, cum
    Astasius comes in bellum proficisci vellet, hanc occasiónem perdéndi pios
    fratres se nactos esse putavérunt. Itaque Astasio persuadent se a diis
    admonitos esse, nullo modo eum in bello victórem futurum, nisi Gervasio et
    Protasio coactis Christum negare, eosdem ad sacra diis facienda compélleret.
    Quod cum illi detestaréntur, Astasius imperávit Gervasium tamdiu cædi, dum
    inter verbera exspiraret; Protasium fustibus contusum secúri pércuti jubet.
    Quorum córpora Philippus Christi servus clam sústulit et in suis ædibus
    sepelívit: quæ póstea sanctus Ambrosius, Dei mónitu invénta, in loco sacro
    et insígni collocanda curávit. Passi sunt Mediolani décimo tertio Kalendas
    Julii."
  - "&teDeum"
