lectio1:
  - "!Cant 5:8-12"
  - 8 Adjuro vos, filiæ Jerúsalem, si inveneritis dilectum meum, ut nuntietis ei
    quia amóre langueo.
  - 9 (Chorus) Qualis est dilectus tuus ex dilecto, o pulcherrima mulierum?
    qualis est dilectus tuus ex dilecto, quia sic adjurasti nos?
  - 10 (Sponsa) Dilectus meus candidus et rubicundus; electus ex millibus.
  - 11 Caput ejus aurum optimum; comæ ejus sicut elatæ palmarum, nigræ quasi
    corvus.
  - 12 Oculi ejus sicut columbæ super rivulos aquarum, quæ lacte sunt lotæ, et
    resident juxta fluenta plenissima.
responsory1:
  - "@Sancti/08-15:Responsory1"
lectio2:
  - "!Cant 6:1-5"
  - 1 (Sponsa) Dilectus meus descendit in hortum suum ad areolam aromatum, ut
    pascatur in hortis, et lilia colligat.
  - 2 Ego dilecto meo, et dilectus meus mihi, qui pascitur inter lilia.
  - 3 (Sponsus) Pulchra es, amica mea; suavis, et decora sicut Jerúsalem;
    terribilis ut castrorum acies ordinata.
  - 4 Averte oculos tuos a me, quia ipsi me avolare fecerunt. Capilli tui sicut
    grex caprarum quæ apparuerunt de Galaad.
  - "5 Dentes tui sicut grex ovium quæ ascenderunt de lavacro: omnes gemellis
    fœtibus, et sterilis non est in eis."
responsory2:
  - "@Sancti/08-15:Responsory2"
lectio3:
  - "!Cant 6:8-12"
  - 8 Una est columba mea, perfecta mea, una est matris suæ, electa genetrici
    suæ. Viderunt eam filiæ, et beatissimam prædicaverunt; reginæ et concubinæ,
    et laudaverunt eam.
  - 9 Quæ est ista quæ progreditur quasi aurora consurgens, pulchra ut luna,
    electa ut sol, terribilis ut castrorum acies ordinata?
  - 10 (Sponsa) Descendi in hortum nucum, ut viderem poma convallium, et
    inspicerem si floruisset vinea, et germinassent mala punica.
  - "11 Nescivi: anima mea conturbavit me, propter quadrigas Aminadab."
  - 12 (Chorus) Revertere, revertere, Sulamitis! revertere, revertere ut
    intueamur te.
responsory3:
  - "@Sancti/08-15:Responsory3"
lectio4:
  - Sermo sancti Bernardi Abbatis
  - "!Serm. 1. de Assumpt. B. M. V."
  - Ergo hodie gloriosa cælos ascendens, supernorum gaudia civium copiosis sine
    dubio cumulavit augmentis. Hæc est enim cujus salutati(5nis vox et ipsos
    exsultare facit in gaudio, quos materna adhuc viscera claudunt. Quod si
    parvuli necdum nati anima liquefacta est, ut Maria locuta est, quid putamus
    quænam illa fuerit cælestium exsultatio, étiam et vocem audire, et videre
    faciem, et beata ejus frui præsentia meruerunt.
rubrica-1570/lectio4:
  - "@Sancti/08-18bmv:Lectio4t"
responsory4:
  - "@Sancti/08-15:Responsory4"
lectio5:
  - "Sed et illud quis cogitare sufficiat, quam gloriosa hodie mundi Regina
    processerit: et quanto devotionis aflFectu tota in ejus occursum cælestium
    legionum prodierit multitudo: quibus ad thronum gloriæ canticis sit deducta:
    quam placido vultu, quam serena facie, quam divinis amplexibus suscepta a
    Filio, et super omnem exaltata creaturam, cum eo honore, quo tanta Mater
    digna fuit; cum ea gloria quæ tantum decuit Filium?"
rubrica-1570/lectio5:
  - "@Sancti/08-18bmv:Lectio5t"
responsory5:
  - "@Sancti/08-15:Responsory5"
lectio6:
  - "Felicia prorsus oscula labiis impressa lactentis, cui virgineo mater
    applaudebat in gremio. Verum numquid non feliciora censebimus, quæ ab ore
    sedentis in dextera Patris hodie in beata salutatione suscepit, cum
    ascenderet ad thronum gloriæ, epithalamium canens, et dicens: Osculetur me
    osculo oris sui? Christi generationem et Mariæ assumptionem quis enarrabit?
    Quantum enim gratiæ in terris adepta est præ ceteris, tantum et in cælis
    obtinet gloriæ singularis."
rubrica-1570/lectio6:
  - "@Sancti/08-18bmv:Lectio6t"
responsory6:
  - "@Sancti/08-15:Responsory6"
lectio7:
  - Léctio sancti Evangélii secúndum Lucam.
  - "!Luc 10:38-42"
  - "In illo témpore: Intravit Jesus in quoddam castellum: et mulier quædam,
    Martha nomine, excopit illum in domum suam. Et réliqua."
  - _
  - De Homilia sancti Augustíni Epíscopi.
  - "!Ex Serm. 27. de Verbis Dom."
  - "Transit labor multitudinis, et remanet caritas unitatis. Ergo quod elegit
    Maria, non auferetur ab ea: a te autem Martha, quod elegisti; utique hoc
    sequitur, utique hoc subintelhgitur; a te, quod elegisti, auferetur: sed
    bono tuo auferetur, ut, quod melius est, detur. Auferetur enim a te labor,
    ut requies detur. Tu navigas, illa jam in portu est"
responsory7:
  - "@Sancti/08-15:Responsory7"
lectio8:
  - "Videtis ergo, carissimi, et quantum arbitror, jam intelligitis in his
    duabus mulieribus, quæ ambse fuerunt Domino gratæ, ambæ amabiles, ambæ
    discipulæ: videtis ergo, et magnum aliquid intelligitis, quicumque
    intelligitis, quod audire et scire debetis étiam qui non intelligitis, in
    his duabus mulieribus duas vitas esse figuratas, præsentem et futuram,
    laboriosam et quietam, ærumnosam et beatam, temporalem et ætérnam."
responsory8:
  - "@Sancti/08-15:Responsory8"
lectio9:
  - "Duæ sunt vitæ: de illis vos copiosius cogitate. Quid habeat hæc vita, non
    dico mala, non iniqua, non nefaria, non luxuriosa, non impia; sed laboriosa,
    et ærumnis plena, timoribus castigata, tentationibus sollicita: hanc ipsam
    innocentem vitam dico, qualem decebat habere Martham. Hanc ergo, quantum
    potestis, inspicite: et de hac, ut dixi, copiosius quam loquimur, cogitate.
    Vita vero iniqua deerat ab illa domo, nec cum Martha erat, nec cum Maria: et
    si aliquando fuit, Domino intrante fugit."
  - "&teDeum"
