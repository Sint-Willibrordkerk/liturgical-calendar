oratio:
  - "Deus, qui beátum Nicoláum Pontíficem innúmeris decorásti miráculis: tríbue,
    quǽsumus; ut ejus méritis et précibus a gehénnæ incéndiis liberémur."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Hebrǽos
  - "!Hebr 13:7-17"
  - "Fratres: Mementóte præpositórum vestrórum, qui vobis locúti sunt verbum
    Dei: quorum intuéntes éxitum conversatiónis, imitámini fidem. Jesus Christus
    heri et hódie: ipse et in sǽcula. Doctrínis váriis et peregrínis nolíte
    abdúci. Optimum est enim grátia stabilíre cor, non escis, quæ non profuérunt
    ambulántibus in eis. Habémus altáre, de quo édere non habent potestátem, qui
    tabernáculo deserviunt. Quorum enim animálium infértur sanguis pro peccáto
    in Sancta per pontíficem, horum córpora cremántur extra castra. Propter quod
    et Jesus, ut sanctificáret per suum sánguinem pópulum, extra portam passus
    est. Exeámus ígitur ad eum extra castra, impropérium ejus portántes. Non
    enim habémus hic manéntem civitátem, sed futúram inquírimus. Per ipsum ergo
    offerámus hóstiam laudis semper Deo, id est fructum labiórum confiténtium
    nómini ejus. Beneficéntiæ autem et communiónis nolíte oblivísci: tálibus
    enim hóstiis promerétur Deus. Obœdíte præpósitis vestris et subjacéte eis.
    Ipsi enim pervígilant, quasi ratiónem pro animábus vestris redditúri."
graduale:
  - "!Ps 88:21-23"
  - "Invéni David servum meum, óleo sancto meo unxi eum: manus enim mea
    auxiliábitur ei, et bráchium meum confortábit eum."
  - V. Nihil profíciet inimícus in eo, et fílius iniquitátis non nocébit ei.
  - Allelúja, allelúja.
  - "!Ps 91:13"
  - "Justus ut palma florébit: sicut cedrus Líbani multiplicábitur. Allelúja."
