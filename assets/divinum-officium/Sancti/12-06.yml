secreta:
  - "Sanctífica, quǽsumus, Dómine Deus, hæc múnera, quæ in sollemnitáte sancti
    Antístitis tui Nicolái offérimus: ut per ea vita nostra inter advérsa et
    próspera úbique dirigátur."
  - $Per Dominum
communio:
  - "@Commune/C2"
postcommunio:
  - Sacrifícia, quæ súmpsimus, Dómine, pro sollemnitáte sancti Pontíficis tui
    Nicolái, sempitérna nos protectióne consérvent.
  - $Per Dominum
lectio4:
  - "Nicoláum, illustri loco Pátaræ in Lycia natum, paréntes a Deo precibus
    impetrarunt. Cujus viri sanctitas quanta futura esset, jam ab incunábulis
    appáruit. Nam infans, cum réliquos dies lac nutrícis frequens súgeret,
    quarta et sexta feria semel dumtaxat, idque vesperi sugebat: quam jejunii
    consuetúdine in réliqua vita semper ténuit. Adoléscens paréntibus orbatus,
    facultates suas paupéribus distríbuit. Cujus illud insigne est christianæ
    benignitátis exemplum, quod cum ejus civis egens tres filias jam nubiles in
    matrimonio collocare non posset, earumque pudicítiam prostitúere cogitaret;
    re cognita, Nicolaus noctu per fenestram tantum pecuniæ in ejus domum
    injecit, quantum uníus vírginis doti satis esset: quod cum íterum et tertio
    fecísset, tres illæ vírgines honestis viris in matrimónium datæ sunt."
lectio5:
  - Cum vero se totum Deo dedísset, in Palæstinam profectus est, ut loca sancta
    viseret, et præsens venerarétur. Qua in peregrinatióne navem conscéndens
    sereno cælo et tranquillo mari, horribilem nautis tempestátem prædixit;
    moxque ortam, cum essent omnes in summo periculo, orans mirabíliter sedávit.
    Unde cum domum reversus singuláris sanctitátis ómnibus documénta præberet,
    Dei admónitu Myram, quæ Lyciæ metropolis erat, venit; quo témpore ejus urbis
    episcopo mortuo, provinciales epíscopi de successore deligéndo consultábant.
    Itaque in ea deliberatióne divinitus admoniti sunt, ut eam eligerent, qui
    postridie mane primus in ecclésiam ingrederétur, Nicolaus nómine. Qua
    observatióne adhibita, in ecclésiæ janua deprehénsus est Nicoláus, et summo
    ómnium consénsu Myræ epíscopus creatur. In episcopatu castitátem, quam
    semper colúerat, gravitátem, oratiónis assiduitátem, vigílias abstinéntiam,
    liberalitátem et hospitalitátem, in adhortando mansuetúdinem, in
    reprehendéndo severitátem perpetuo adhibuit.
lectio6:
  - Viduis et orphanis pecúnia, consílio, ópera non defuit; oppressos adeo
    sublevávit, ut étiam tres tribunos, per calumniam a Constantino Augusto
    condemnatos, qui se propter famam ejus miraculórum oratiónibus longíssime
    absenti commendarant, adhuc vivens, cum imperatóri, mináciter eum terrens,
    apparuísset, liberaverit. Cum vero contra edictum Diocletiáni et Maximiáni
    christianæ fidei veritátem Myræ prædicaret, ab imperatórum satellítibus
    comprehénsus, et longíssime abductus, in carcerem conjéctus est; ubi fuit
    usque ad Constantinum imperatórem, cujus jussu ex custódia ereptus, Myram
    rediit. Mox ad Nicænum concílium se cóntulit; ubi cum trecentis illis decem
    et octo Pátribus Arianam hæresim condemnávit. Inde reversus ad episcopátum,
    non ita multo post, instante morte, suspíciens in cælum, cum Angelos sibi
    occurréntes intuerétur, illo Psalmo pronuntiato, In te Dómine, sperávi;
    usque ad eum locum, In manus tuas comméndo spíritum meum; in cælestem
    pátriam migrávit. Ejus corpus Bárium in Apulia translátum, ibidem summa
    celebritate ac veneratióne cólitur.
lectio94:
  - Nicoláus, illústri loco Pátaræ in Lýcia natus, quarta et sexta féria ab
    infántia jejunávit; quam quidem consuetúdinem réliqua vita semper ténuit.
    Adoléscens paréntibus orbátus, facultátes suas paupéribus distríbuit. Cujus
    illud insígne est caritátis exémplum, quod tribus puéllis periclitántibus,
    congruénti pecúniæ vi in dotem constitúta, succúrrerit. In Palæstínam
    peregrinátus, Dei admónitu Myram, Lýciæ metrópolim, venit; ubi a
    provinciálibus epíscopis, Myrénsi epíscopo vita functo, præter ómnium
    opiniónem, miro consénsu, sufféctus est. Eo in múnere ómnium virtútum se
    exémplar prǽbuit. Cum autem contra Diocletiáni et Maximiáni edíctum
    christiánæ fídei veritátem prædicáret, in cárcerem conjéctus est, ubi fuit
    usque ad Constantínum imperatórem. Nicǽno Concílio intérfuit, in quo Ariána
    hǽresis damnáta est. Ad suos revérsus, Myræ sanctíssime óbiit. Ejus corpus
    Bárium in Apúlia translátum, ibídem summa celebritáte cólitur.
  - "&teDeum"
