oratio:
  - "Esto, Dómine, plebi tuæ sanctificátor et custos: ut, Apóstoli tui Jacóbi
    muníta præsídiis, et conversatióne tibi pláceat, et secúra mente desérviat."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Corínthios
  - "!1 Cor 4:9-15"
  - "Fratres: Puto, quod Deus nos Apóstolos novíssimos osténdit, tamquam morti
    destinátos: quia spectáculum facti sumus mundo et Angelis et homínibus. Nos
    stulti propter Christum, vos autem prudéntes in Christo: nos infírmi, vos
    autem fortes: vos nóbiles, nos autem ignóbiles. Usque in hanc horam et
    esurímus, et sitímus, et nudi sumus, et cólaphis cædimur, et instábiles
    sumus, et laborámus operántes mánibus nostris: maledícimur, et benedícimus:
    persecutiónem pátimur, et sustinémus: blasphemámur, et obsecrámus: tamquam
    purgaménta hujus mundi facti sumus, ómnium peripséma usque adhuc. Non ut
    confúndam vos, hæc scribo, sed ut fílios meos caríssimos móneo. Nam si decem
    mília pædagogórum habeátis in Christo: sed non multos patres. Nam in Christo
    Jesu per Evangélium ego vos génui."
graduale:
  - "!Ps 44:17; 44:18"
  - "Constítues eos príncipes super omnem terram: mémores erunt nóminis tui,
    Dómine."
  - "V. Pro pátribus tuis nati sunt tibi fílii: proptérea pópuli confitebúntur
    tibi."
  - Allelúja, allelúja.
  - "!Joannes 15:16"
  - Ego vos elegi de mundo, ut eátis, et fructum afferátis, et fructus vester
    máneat. Allelúja.
evangelium:
  - "@Sancti/05-06"
offertorium:
  - "@Sancti/07-04oct"
secreta:
  - "Oblatiónes pópuli tui, quǽsumus, Dómine, beáti Jacóbi Apóstoli pássio beáta
    concíliet: et, quæ nostris non aptæ sunt méritis, fiant tibi plácitæ ejus
    deprecatióne."
  - $Per Dominum
communio:
  - "@Sancti/02-24"
postcommunio:
  - "Beáti Apóstoli tui Jacóbi, quǽsumus, Dómine, intercessióne nos ádjuva: pro
    cujus festivitáte percépimus tua sancta lætántes."
  - $Per Dominum
