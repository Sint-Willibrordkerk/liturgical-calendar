lectio4:
  - Jacóbus, Zebedǽi fílius, Joánnis Apóstoli germánus frater, Galilǽus, inter
    primos Apóstolos vocátus cum fratre, relíctis patre ac rétibus, secútus est
    Dóminum, et ambo ab ipso Jesu Boanérges, id est, tonítrui fílii sunt
    appelláti. Is unus fuit ex tribus Apóstolis, quos Salvátor máxime diléxit,
    et testes esse vóluit suæ transfiguratiónis, et interésse miráculo cum
    archisynagógi fíliam a mórtuis excitávit, et adésse cum secéssit in montem
    Olivéti, Patrem oratúrus, ántequam a Judǽis comprehenderétur.
lectio5:
  - Post Jesu Christi ascénsum in cælum, in Judǽa et Samaría ejus divinitátem
    prǽdicans, plúrimos ad christiánam fidem perdúxit. Mox in Hispániam
    proféctus, ibi áliquos ad Christum convértit; ex quorum número septem póstea
    epíscopi a beáto Petro ordináti in Hispániam primi dirécti sunt. Deínde
    Jerosólymam revérsus, cum inter álios Hermógenem magum fídei veritáte
    imbuísset, Heródes Agríppa Cláudio imperatóre ad regnum elátus ut a Judǽis
    grátiam iníret, Jacóbum líbere Jesum Christum Deum confiténtem cápitis
    condemnávit. Quem cum is, qui eum dúxerat ad tribúnal, fórtiter martýrium
    subeúntem vidísset, statim se et ipse Christiánum esse proféssus est.
lectio6:
  - Ad supplícium cum raperéntur, pétiit ille a Jacóbo véniam; quem Jacóbus
    osculátus, Pax, inquit, tibi sit. Itaque utérque est secúri percússus, cum
    paulo ante Jacóbus paralýticum sanásset. Corpus ejus póstea Compostéllam
    translátum est, ubi summa celebritáte cólitur, conveniéntibus eo religiónis
    et voti causa ex toto terrárum orbe peregrínis. Memória ipsíus natális
    hodiérno die, qui translatiónis dies est, ab Ecclésia celebrátur, cum ipse
    circa festum Paschæ, primus Apostolórum Jerosólymis profúso sánguine
    testimónium Jesu Christo déderit.
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 20:20-23"
  - "In illo témpore: Accéssit ad Jesum mater filiórum Zebedǽi cum fíliis suis,
    adórans et petens áliquid ab eo. Et réliqua."
  - _
  - Homilía sancti Joánnis Chrysóstomi
  - "!Homilia 66 in Matthæum"
  - "Non turbétur quisquam, si ádeo imperféctos dícimus Apóstolos fuísse; nondum
    enim mystérium crucis erat consummátum, nondum grátia Spíritus in corda
    ipsórum infúsa. Quod si virtútem ipsórum díscere cupis, quales post datam
    grátiam Spíritus fúerint, consídera, et vidébis omnem ab illis pervérsam
    affectiónem fuísse superátam. Hac enim de causa eórum modo imperféctio
    revelátur, ut apérte percípere possis quales súbito per grátiam effécti
    fuérunt. Quod ígitur nihil spiritále petébant nec de cælésti regno quidquam
    cogitábant, perspícuum est. Sed tamen inspiciámus étiam quómodo accédant et
    quid dicant. Vólumus, ínquiunt, ut, quodcúmque petiérimus, fácias nobis. Ad
    quod Christus, Quid vultis? respóndit: non ignórans certe, sed ut eos
    respondére cogat et ulcus détegat, et ita medicaméntum appónat."
lectio8:
  - "Illi vero, cum erubéscerent et verecúndia prohiberéntur, quóniam humáno
    afféctu eo devénerant, seórsum ab áliis discípulis Christum accipiéntes,
    interrogavérunt. Progréssi sunt enim, inquit, ne illis manifésti fíerent; et
    ita demum ea quæ volébant, dixérunt. Volébant autem, ut ego conício, quóniam
    super duódecim sedes sessúros discípulos audiérunt, primátum hujus conséssus
    impetráre: et præpóni quidem se céteris sciébant; Petrum vero sibi præférri
    formidántes, dícere ausi sunt: Dic ut unus a dextris, alter a sinístris
    sédeat. Et urgent dicéntes: Dic. Quid ígitur ipse? Ut significáret eos nihil
    pétere spiritále, sed nec scire quidem quid póstulent, non enim pétere
    audérent, si scirent. Nescítis, ait, quid petátis: nescítis quam magnum hoc
    sit, quam mirábile ac ipsas superióres excédens virtútes."
lectio9:
  - "Et adjécit: Potéstis bíbere cálicem, quem ego bibitúrus sum; et baptísmo,
    quo ego baptízor, baptizári? Perpéndis quómodo statim ab hac opinióne ipsos
    remóvit, contrária eis dísserens. Nam vos, inquit, de honóribus et de
    corónis mecum ágitis; ego vero de luctámine atque sudóre díssero. Non
    præmiórum hoc tempus est, nec illa glória mea modo apparébit; sed cædis ac
    periculórum tempus præsens est. Pérspice autem quáliter ipso interrogatiónis
    modo et hortátur et állicit. Non enim dixit: Potestísne cædem subíre,
    potestísne vestrum effúndere sánguinem? Sed, Quonam pacto potéstis bíbere
    cálicem? Deínde allíciens, inquit, Quem ego bibitúrus sum; ut ipsa cum eo
    communicatióne labórum promptióres redderéntur."
  - "&teDeum"
