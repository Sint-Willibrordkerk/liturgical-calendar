rubrica-cisterciensis/ant-1:
  - O quam * gloriósum est regnum, in quo cum Christo gaudent Innocéntes, amícti
    stolis albis sequúntur Agnum quocúmque íerit.
rubrica-tridentina/responsory1:
  - "R. Centum quadragínta quátuor míllia, qui empti sunt de terra, hi sunt qui
    cum muliéribus non sunt coinquináti:"
  - "* Vírgines enim permansérunt, ídeo regnant cum Deo, et Agnus Dei cum illis."
  - V. Isti sunt qui venérunt ex magna tribulatióne, et lavérunt stolas suas in
    sánguine Agni.
  - R. Vírgines enim permansérunt, ídeo regnant cum Deo, et Agnus Dei cum illis.
rubrica-tridentina/responsory2:
  - "R. Sub altáre Dei audívi voces occisórum dicéntium:"
  - "* Quare non deféndis sánguinem nostrum? Et accepérunt divínum respónsum:
    Adhuc sustinéte módicum tempus, donec impleátur númerus fratrum vestrórum."
  - V. Vidi sub altáre Dei ánimas interfectórum propter verbum Dei, et propter
    testimónium quod habébant, et clamábant voce magna, dicéntes.
  - "R. Quare non deféndis sánguinem nostrum? Et accepérunt divínum respónsum:
    Adhuc sustinéte módicum tempus, donec impleátur númerus fratrum vestrórum."
rubrica-tridentina/responsory3:
  - R. Adoravérunt vivéntem in sǽcula sæculórum,
  - "* Mitténtes corónas suas ante thronum Dómini Dei sui."
  - "V. Et cecidérunt in conspéctu throni in fácies suas: et benedixérunt
    vivéntem in sǽcula sæculórum."
  - R. Mitténtes corónas suas ante thronum Dómini Dei sui.
  - "&Gloria"
  - R. Mitténtes corónas suas ante thronum Dómini Dei sui.
lectio4:
  - Sermo sancti Augustíni Epíscopi
  - "!Sermo 1 de Innocentibus"
  - "Nascénte Dómino, luctus cœpit, non cælo, sed mundo: indícitur mátribus
    lamentátio, Angelis exsultátio, infántibus transmigrátio. Deus est, qui
    natus est: Innocéntes illi debéntur víctima, qui venit damnáre mundi
    malítiam. Agnélli debent immolári, quia Agnus futúrus est crucifígi, qui
    tollit peccáta mundi. Sed oves úlulant matres, quia agnos perdunt sine voce
    balántes. Grande martýrium, crudéle spectáculum! Exímitur machæra, et nulla
    intérvenit causa: sola stridet invídia, cum qui natus est, nulli fáciat
    violéntiam. Sed oves cérnimus matres: quæ super agnos lugent: Vox in Rama
    audíta est, plorátus et ululátus magnus. Pígnora sunt, non crédita, sed
    creáta; non depósita, sed expósita."
lectio5:
  - "Testis est ipsa natura, quæ pugnábat in Mártyres, cum tyránnus jactáret
    infántes. Mater crines cápitis dissipábat, quæ ornaméntum cápitis amittébat.
    Quantis modis infántem volébat abscóndere, et ipse se infántulus publicábat!
    Nesciébat tacére, quia necdum didícerat formidáre. Pugnábat mater, et
    cárnifex: ille trahébat, illa tenébat. Ad carníficem mater clamábat: Quid
    séparas a me, quem génui ex me? Uterus génuit, non mansit ille, cum vixit,
    úbera mea frustra lacte contórquens. Caute portávi, quem a te vídeo manu
    crudéli jactári. Modo eum effudérunt víscera mea, et tu elídis ad terram."
lectio6:
  - "Alia acclamábat mater, cum exáctor latro non compélleret simul occídi cum
    párvulo matrem: Ut quid me dimíttis inánem? Si culpa est, mea est: si non
    est crimen, junge mortem, et líbera matrem. Alia dicébat: Quid quǽritis?
    Unum quǽritis, et multos occíditis, et ad unum, qui unus est, attíngere non
    potéstis. Alia contra clamábat: Veni jam, veni Salvátor mundi, quámdiu
    quæréris? Nullum times: vídeat te miles, et nostros non occídat infántes.
    Miscebátur lamentátio matrum, et ad cælum transíbat oblátio parvulórum."
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 2:13-18"
  - "In illo témpore: Angelus Dómini appáruit in somnis Joseph, dicens: Surge,
    et áccipe púerum, et matrem ejus, et fuge in Ægýptum: et esto ibi usque dum
    dicam tibi. Et réliqua."
  - _
  - Homilía sancti Joánnis Chrysóstomi
  - "!Ex Hom. 8 in Matth., ante med."
  - "Quæ cum audísset Joseph, nequáquam passus est scándalum, neque dixit:
    Incérta ista res est, ac prorsus ambígua. Tu paulo ante dicébas, quia
    salvábit populum suum, et nunc seípsum quidem non potest de perículis
    liberáre: sed fuga nobis est necessária, et peregrinátio, ac transmigrátio
    longínqua. Contrária omníno sunt facta promíssis. Sed horum nihil prorsus
    oppónit: vir enim erat fidélis: neque reversiónis tempus curióse inquírit,
    quod útique ab Angelo non signáte fúerat expréssum: sed: Esto ibi, inquit,
    úsquequo dicam tibi."
lectio8:
  - "Verum ille nec per ista quidem factus est ségnior, sed obedívit libénter,
    et crédidit, omnes prorsus tribulatiónes cum gáudio sustinéndo. Enim vero
    miséricors Deus mœstis rebus quædam étiam jucúnda permíscuit. Quod certe in
    sanctis ómnibus facit, quos neque tribulatiónes, neque jucunditátes sinit
    habére contínuas: sed tum de advérsis, tum ex prósperis justórum vitam quasi
    admirábili varietáte contéxit. Quod hic quoque eum fecísse consídera."
lectio9:
  - "Vidéndo quippe sanctus Joseph grávidam Vírginem, in conturbatiónem íncidit
    máximam: sed ádfuit repénte Angelus, timórem prorsus exstínguens. Deínde
    videns púerum natum, máxima exsultatióne replétus est: sed rursus huic étiam
    gáudio perículum grande succéssit, cum tota útique cívitas turbarétur, ipse
    rex fúreret, et ad necem púerum quǽreret. Sed et hunc mœrórem alia rursus
    lætítia subsecúta est, apparítio vidélicet stellæ, et adorátio Magórum. Post
    hanc quoque jucunditátem íterum perículum, iterúmque formído. Quærit,
    inquit, Heródes ánimam púeri, et fúgere necésse est, et in longínqua
    transíre."
  - "&teDeum"
