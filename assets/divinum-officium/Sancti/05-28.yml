oratio:
  - "Deus, qui Anglórum gentes, prædicatióne et miráculis beáti Augustíni
    Confessóris tui atque Pontíficis, veræ fídei luce illustráre dignátus es:
    concéde; ut, ipso interveniénte, errántium corda ad veritátis tuæ rédeant
    unitátem, et nos in tua simus voluntáte concórdes."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Thessalonicénses
  - "!1 Thess 2:2-9"
  - "Fratres: Fidúciam habúimus in Deo nostro loqui ad vos Evangélium Dei in
    multa sollicitúdine. Exhortátio enim nostra non de erróre neque de
    immundítia neque in dolo, sed sicut probáti sumus a Deo, ut crederétur nobis
    Evangélium: ita lóquimur, non quasi homínibus placéntes, sed Deo, qui probat
    corda nostra. Neque enim aliquándo fuimus in sermóne adulatiónis, sicut
    scitis: neque in occasióne avarítiæ: Deus testis est: nec quæréntes ab
    homínibus glóriam, neque a vobis neque ab áliis; cum possémus vobis óneri
    esse ut Christi Apóstoli: sed facti sumus párvuli in médio vestrum, tamquam
    si nutrix fóveat fílios suos. Ita desiderántes vos, cúpide volebámus trádere
    vobis non solum Evangélium Dei, sed étiam ánimas nostras: quóniam caríssimi
    nobis facti estis. Mémores enim estis, fratres, labóris nostri et
    fatigatiónis: nocte ac die operántes, ne quem vestrum gravarémus,
    prædicávimus in vobis Evangélium Dei."
graduale:
  - "@Commune/C4-1"
gradualep:
  - "@Commune/C4-1"
evangelium:
  - "@Sancti/02-06"
offertorium:
  - "@Commune/C2"
secreta:
  - "Sacrifícium tibi offérimus, Dómine, in sollemnitáte beáti Augustíni
    Pontíficis et Confessóris tui, humíliter deprecántes: ut oves, quæ
    periérunt, ad unum ovile revérsæ, hoc salutári pábulo nutriántur."
  - $Per Dominum
communio:
  - "@Commune/C4-1"
postcommunio:
  - "Hóstia salutári refécti: te, Dómine, súpplices exorámus; ut eadem, beáti
    Augustíni interveniénte suffrágio, in omni loco nómini tuo júgiter
    immolétur."
  - $Per Dominum
rubrica-monastica/officium:
  - S. Augustini Episcopi et Confessoris, O. N.
lectio4:
  - Augustinus Romæ in Lateranensi cœnobio monachus, a Gregorio Magno cum secus
    monachis fere quadraginta in Angliam missus est anno quingentesimo
    nonagesimo septimo, ut gentes illas ad Christum converteret. Erat eo tempore
    rex Ethelbertus in Cantio potentissimus, qui audita adventus Augustíni
    causa, eum cum sociis Cantuariam, sui regni metropolim, invitavit; ibique
    manendi et Christum prædicandi facultatem eidem liberaliter concessit. Quare
    sanctus vir prope Cantuariam oratorium exstruxit, ubi ipse aliquamdiu
    consedit, atque apostolicam vivendi rationem cum suis æmulatus est.
lectio5:
  - Cælestis doctrina prædicatione plurimis firmata miraculis, ac vitai exemplo
    sic insulanos illos demulsit, ut eorum plerosque ad christianam fidem
    perduxerit, ac demum regem ipsum, quem cum innumero suorum comitatu sacro
    fonte lustravit, summa cum lætitia Berthæ regiæ uxoris, quæ christiana erat.
    Olim in Natali Domini, cum decem millibus et amplius baptismum in alveo
    fluminis Eboraci contulisset, quotquot ex iis morbo aliquo affecti erant,
    cum animæ salute, corporis quoque sanitatem recepisse memoriæ proditum est.
    Jussu Gregorii ordinatus episcopus, sedem Cantuariæ instituit in ecclesia
    Salvatoris a se erecta, in qua monachos operis sui subsidiarios collocavit;
    et sancti Petri monasterium, quod postea et a suo nomine dictum est, in
    suburbanis construxit. Idem Gregorius usum pallii cum facultate
    ecclesiasticæ hierarchiæ in Anglia instituendas ei concessit, quo novam
    étiam operariorum manum misit, nempe Mellitum, Justum, Paulinum, et
    Rufinianum.
lectio6:
  - Dispositis ejus ecclesiæ rebus, synodum habuit Augustinus cum episcopis
    atque doctoribus veterum Britonum, qui in Paschæ celebratione aliusque
    ritibus ab Ecclesia Romana jamdudum dissidebant. Sed cum eos neque
    Apostolicæ Sedis auctoritate, neque miraculis movere posset ut dissidio
    cessarent, prophetico spiritu eis excidium prænuntiavit. Denique maximis pro
    Christo exantlutis laboribus, miraculis clarus, cum Mellitum Londinensi
    ecclesiæ præfecisset, Justum Roffensi, suæ Laurentium, in cælum migravit
    septimo Kalendas Junias, Ethelberto regnante, ac sepultus est in monasterio
    sancti Petri, quod exinde Cantuariensium Antistitum et aliquot regum
    conditorium fuit. Ejus cultum ferventi studio prosecutæ sunt Anglorum
    gentes, ac Leo decimus tertius Pontifex Maximus ejus Oificium et Missam ad
    universam extendit Ecclesiam.
lectio94:
  - Augustínus, Romæ in Lateranénsi cœnóbio mónachus, a Gregório Magno cum
    sóciis mónachis fere quadragínta in Angliam missus est, anno quingentésimo
    nonagésimo séptimo. A rege Ethelbérto Cantuáriam, ejus regni metrópolim,
    invitátus cum sóciis, prope eam oratórium exstrúxit. Cæléstis doctrínæ
    prædicatióne plerósque insulános ac regem ipsum ad christiánam fidem
    perdúxit, summa cum lætítia Berthæ, régiæ uxóris, quæ Christiána erat. Jussu
    Gregórii ordinátus epíscopus, Sedem Cantuariénsem instítuit, et ab eódem
    Pontífice usum pállii cum facultáte hierarchíæ in Anglia instituéndæ
    obtínuit. Máximis demum pro Christo exantlátis labóribus, cum Mellítum
    Londinénsi ecclésiæ præfecísset, Justum Roffénsi, suæ Lauréntium, in cælum
    migrávit séptimo kaléndas júnias, et sepúltus est in monastério sancti
    Petri, quod exínde Cantuariénsium antístitum et áliquot regum conditórium
    fuit.
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Lucam.
  - "!Luc 10:1-9"
  - "In illo témpore: Designavit Dominus et alios septuaginta duos: et misit
    illos binos ante faciem suam, in omnem civitatem et locum, quo erat ipse
    venturus. Et reliqua."
  - _
  - Homilia sancti Gregorii Papæ.
  - "!Homilia 17. in Evang."
  - "Dominus et Salvator noster, fratres carissimi, aliquando nos sermonibus,
    aliquando vero operibus admonet. Ipsa etenim facta ejus præcepta sunt: quia
    dum aliquid tacitus facit, quid agere debeamus innotescit. Ecce enim binos
    in prædicationem discipulos mittit: quia duo sunt præcepta caritatis, Dei
    videlicet amor, et proximi: et minus quam inter duos caritas haberi non
    potest. Nemo enim proprie ad semetipsum habere caritatem dicitur: sed
    dilectio in alterum tendit, ut caritas esse possit."
lectio8:
  - "Ecce enim binos ad prædicandum discipulos Dominus mittit: quatenus hoc
    nobis tacitus innuat, quia qui caritatem erga alterum non habet,
    prædicationis officium suscipere nullatenus debet. Bene autem dicitur, quia
    misit eos ante faciem suam in omnem civitatem et locum, quo erat ipse
    venturus. Prædicatores enim suos Dominus sequitur: quia prædicatio prævenit,
    et tunc ad mentis nostræ habitaculum Dominus venit, quando verba
    exhortationis præcurrunt: atque per hoc veritas in mente suscipitur."
lectio9:
  - "Hinc namque eisdem prædicatoribus Isaias dicit: Parate viam Domini, rectas
    facite semitas Dei nostri. Hinc filiis Psalmista ait: Iter facite ei, qui
    ascendit super occasum. Super occasum namque Dominus ascendit: quia unde in
    passione occubuit, inde majorem suam gloriam resurgendo manifestavit. Super
    occasum videlicet ascendit; quia mortem quam pertulit, resurgendo calcavit.
    Ei ergo qui ascendit super occasum, iter facimus, cum nos ejus gloriam
    vestris mentibus prædicamus, ut eas et ipse post veniens, per amoris sui
    præsentiam illustret."
  - "&teDeum"
