responsory1:
  - "R. Sapiéntia quæ attíngit a fine usque ad finem fórtiter, et dispónit ómnia
    suáviter, ædificávit sibi domum:"
  - "* Ecce tabernáculum Dei cum homínibus."
  - V. Vidi sanctam civitátem Jerúsalem novam, parátam sicut sponsam ornátam
    viro suo.
  - R. Ecce tabernáculum Dei cum homínibus.
lectio2:
  - "!Prov 8:18-25"
  - 18 Mecum sunt divítiæ et glória, opes supérbæ et justítia.
  - 19 Mélior est enim fructus meus auro et lápide pretióso, et genímina mea
    argénto elécto.
  - 20 In viis justítiæ ámbulo, in médio semitárum judícii,
  - 21 ut ditem diligéntes me et thesáuros eórum répleam.
  - 22 Dóminus possidébit me in inítio viárum suárum, ántequam quidquam fáceret
    a princípio.
  - 23 Ab ætérno ordináta sum et ex antíquis, ántequam terra fíeret.
  - 24 Nondum erant abýssi, et ego jam concépta eram; necdum fontes aquárum
    erúperant,
  - 25 necdum montes gravi mole constíterant; ante colles ego parturiébar.
responsory2:
  - R. Quasi arcus refúlgens inter nébulas, et quasi flos rosárum in diébus
    vernis, et quasi lília in tránsitu aquæ,
  - "* Sic fulget Virgo immaculáta."
  - V. Arcum meum ponam in núbibus, et erit signum fœ́deris mei vobíscum.
  - R. Sic fulget Virgo immaculáta.
lectio3:
  - "!Prov 8:34-36; 9:1-5"
  - 34 Beátus homo qui audit me, et qui vígilat ad fores meas cotídie, et
    obsérvat ad postes óstii mei.
  - 35 Qui me invénerit, invéniet vitam, et háuriet salútem a Dómino;
  - 36 qui autem in me peccáverit, lædet ánimam suam. Omnes, qui me odérunt,
    díligunt mortem.
  - 1 Sapiéntia ædificávit sibi domum, excídit colúmnas septem.
  - 2 Immolávit víctimas suas, míscuit vinum et propósuit mensam suam.
  - "3 Misit ancíllas suas ut vocárent ad arcem et ad mœ́nia civitátis:"
  - "4 Si quis est párvulus, véniat ad me. Et insipiéntibus locúta est:"
  - 5 Veníte, comédite panem meum, et bíbite vinum quod míscui vobis.
