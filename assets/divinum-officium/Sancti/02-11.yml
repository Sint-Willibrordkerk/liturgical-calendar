  - R. Corónam de lápide pretióso.
  - "&Gloria"
  - R. Corónam de lápide pretióso.
lectio94:
  - Anno quarto a dogmática definitióne de immaculáto beátæ Vírginis Concéptu,
    ad Gavi flúminis oram prope óppidum Lourdes diœcésis Tarbiénsis in Gállia,
    cum puélla quædam, nómine Bernadétte, in rupis sinu plúries se immaculátam
    Dei Genetrícem conspexísse asséreret, tot et tanta mirabília facta sunt, ut
    dígitum Dei ibi esse prudens quisque et pius Christifidélis fácile
    intellégeret. Quæ inter illud est célebre quod ægri hauriéntes aquam e fonte
    in specu tunc primo mirabíliter scaténte, sæpe sǽpius sanitátem recípiant.
    Percrebrescénte ítaque fama beneficiórum quæ in sacro specu recepísse
    fidéles dicebántur, et aucto in dies hóminum concúrsu, Tarbiénsis epíscopus,
    post jurídicam factórum inquisitiónem, cultum ejúsdem Vírginis immaculátæ in
    eódem specu permísit. Mox ædificáto templo, innúmeræ fidélium turbæ quovis
    anno illuc advéniunt, noménque Deíparæ immaculátæ ubíque terrárum in dies
    inclaréscit; eo magis, quod síngulis annis, duránte processióne sanctíssimi
    Sacraménti, infírmis úndique eo delátis, nonnúlli, sanatiónem a Dómino per
    intercessiónem immaculátæ Matris peténtes, íllico convaléscunt. Quibus jure
    commótus summus Póntifex Pius décimus, festum, a Leóne décimo tértio
    alíquibus locis concéssum ad univérsam exténdit Ecclésiam.
  - "&teDeum"
