  - "&Gloria"
  - R. Osténde mihi fáciem tuam, sonet vox tua in áuribus meis.
lectio4:
  - "Anno quarto a dogmática definitióne de immaculáto beátæ Vírginis Concéptu,
    ad Gavi flúminis oram prope óppidum Lourdes diœcésis Tarbiénsis in Gállia,
    ipsa Virgo in rupis sinu super specum Massabiélle puéllæ cuidam, vernácula
    lingua Bernadétte nuncupátæ, paupérrimæ quidem sed ingénuæ ac piæ, plúries
    se conspiciéndam óbtulit. Immaculáta Virgo juveníli ac benígno videbátur
    aspéctu, nívea veste niveóque pállio contécta, ac zona cærúlea succíncta;
    nudos pedes áurea rosa ornábat. Primo apparitiónis die, qui fuit undécimus
    Februárii anno millésimo octingentésimo quinquagésimo octávo, puéllam signum
    crucis rite piéque faciéndum edócuit, atque ad sacri rosárii recitatiónem,
    exémplo suo, corónam, quæ prius ex brácchio demíssa pendébat, manu
    advólvens, excitávit: quod in céteris étiam apparitiónibus prǽstitit. Altero
    autem apparitiónis die, puélla in simplicitáte cordis sui, diabólicam
    fraudem timens, lustrálem aquam in Vírginem effúdit; sed beáta Virgo,
    léniter arrídens, benigniórem illi vultum osténdit. Cum vero tértio
    apparuísset, puéllam ad specum per quíndecim dies invitávit. Exínde eam
    sǽpius est allocúta, ac pro peccatóribus oráre, terram deosculári,
    pœnitentiámque ágere est hortáta; deínde imperávit, ut sacerdótibus
    edíceret, ædificándum ibi esse sacéllum, solemnísque supplicatiónibus more
    illo accedéndum. Mandávit ínsuper ut e fonte, qui sub aréna adhuc latébat
    sed mox erat eruptúrus, aquam bíberet, eáque se abstérgeret. Dénique die
    festo Annuntiatiónis, percontánti eníxe puéllæ illíus nomen, cujus aspéctu
    tóties dignáta fúerat, Virgo, admótis péctori mánibus elatísque in cælum
    óculis, respóndit: Immaculáta Concéptio ego sum."
responsory4:
  - R. Quæ est ista, quæ progréditur quasi auróra consúrgens,
  - "* Pulchra ut luna, elécta ut sol?"
  - V. Ipsa est colúmba mea, perfécta mea, immaculáta mea.
  - R. Pulchra ut luna, elécta ut sol.
lectio5:
  - "Percrebrescénte fama beneficiórum, quæ in sacro specu recepísse fidéles
    dicebántur, augebátur in dies hóminum concúrsus, quos loci relígio ad specum
    advocábat. Itaque prodigiórum fama puellǽque candóre mortus Tarbiénsis
    epíscopus, quarto ab enarrátis anno, post jurídiam factórum inquisitiónem,
    supernaturáles esse apparitiónis notas sua senténtia probávit, cultúmque
    Vírginis immaculátæ in eódem specu permísit. Mox ædificátum sacéllum: ex
    illa die pene innúmeræ fidélium turbæ, voti ac supplicatiónis causa, ex
    Gállia, Bélgio, Itália, Hispánia ceterísque Európæ provínciis necnon ex
    longínquis Américæ regiónibus quovis anno illuc advéniunt, noménque
    Immaculátæ de Lourdes ubíque terrárum inclaréscit. Fontis aqua, in cunctas
    orbis partes deláta, ægris sanitátem restítuit. Orbis vero cathólicus
    tantórum memor benefactórum, ædes sacras mirábili ópere ibi exstrúxit.
    Vexílla innúmera, acceptórum beneficiórum véluti sede immaculáta Virgo
    júgiter cólitur: intérdiu quidem précibus, religióso cantu solemnibúsque
    áliis cæremóniis; noctu vero sacris illis supplicatiónibus, quibus infinítæ
    propémodum peregrinántium turbæ céreis facibúsque accénsis procédunt et
    laudes beátæ Vírginis cóncinunt."
responsory5:
  - "R. Erit in novíssimis diébus mons præparátus Vírgini Maríæ in vértice
    móntium, et elevábitur super cælos, et ibunt pópuli multi et dicent:"
  - "* Veníte et ascendámus ad montem."
  - V. Sicut lætántium ómnium habitátio est in te.
  - R. Veníte et ascendámus ad montem.
lectio6:
  - Peregrinatiónes hujúsmodi fidem, frigescénte sǽculo, excitásse, ánimum ad
    christiánam legem profiténdam addidísse, cultúmque Vírginis immaculátæ mirum
    in modum auxísse, ómnibus compértum est. In qua mirábili fídei professióne
    christiánus pópulus sacerdótes véluti duces habet, qui illuc suas plebes
    addúcunt. Ipse étiam Sacrórum antístites sanctum locum frequénter ádeunt,
    peregrinatiónibus præsunt, solemnioribúsque festis intérsunt. Nec ádeo rarum
    est ipsos Románæ Ecclésiæ purpurátos patres húmili peregrinórum more
    accedéntes conspícere. Ipsi quoque Románi Pontífices, pro sua erga
    Immaculátam de Lourdes pietáte, sacram ædem donis nobilíssimis cumulárunt.
    Pius nonus, sacris indulgéntiis, archiconfraternitátis privilégio ac minóris
    Basílicæ título ipsam insignívit; ac Deíparæ imáginem íbidem cultam, solémni
    ritu per legátum suum apostólicum in Gállia, diadémate distínctam vóluit.
    Leo vero décimus tértius innúmera étiam cóntulit benefícia, indulgéntias ad
    modum jubilǽi vigésimo quinto Apparitiónis anno verténte concéssit,
    peregrinatiónes sua auctoritáte verbóque provéxit, ac solémnem Ecclésiæ sub
    título Rosárii dedicatiónem suo nómine péragi curávit. Quorum beneficiórum
    amplitúdinem cumulávit, cum, plúrium episcopórum rogátu, solémne festum sub
    título Apparitiónis beátæ Maríæ Vírginis immaculátæ, próprio Offício et
    própria Missa celebrándum benígne concéssit. Tandem Pius décimus Póntifex
    máximus pro sua erga Deíparam pietáte, ac plurimórum votis ánnuens Sacrórum
    antístitum, idem festum ad Ecclésiam univérsam exténdit.
responsory6:
  - R. Prævenísti eam, Dómine, in benedictiónibus dulcédinis, posuísti in cápite
    ejus
  - "* Corónam de lápide pretióso."
  - V. Magna est glória ejus in salutári tuo, glóriam et magnum decórem impónes
