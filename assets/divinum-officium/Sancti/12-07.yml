lectio4:
  - "Ambrosius epíscopus Mediolanénsis, Ambrósii civis Romani fílius, patre
    Galliæ præfecto natus est. In hujus infántis ore examen apum consedisse
    dícitur: quæ res divinam viri eloquéntiam præmonstrábat. Romæ liberálibus
    disciplinis eruditus est. Post a Probo præfecto Liguriæ et Æmíliæ
    præpositus: unde póstea, ejusdem Probi jussu, cum potestate Mediolanum
    venit; ubi, mortuo Auxentio Ariáno episcopo, pópulus de successore deligéndo
    dissidebat. Quare Ambrosius, pro officii sui munere ecclésiam ingréssus, ut
    commótam seditiónem sedaret, cum multa de quiete et tranquillitate
    reipublicæ præcláre dixísset, derepénte púero Ambrosium episcopum
    exclamante, univérsi pópuli vox erupit, Ambrosium episcopum depóscentis."
lectio5:
  - "Recusante illo et eórum precibus resistente, ardens pópuli studium ad
    Valentinianum imperatórem delátum est; cui gratíssimum fuit, a se deléctos
    judices ad sacerdotium postulari. Fuit id étiam Probo præfecto jucúndum, qui
    Ambrosio proficiscénti quasi divinans dixerat: Vade, age, non ut judex, sed
    ut epíscopus. Itaque cum ad pópuli desidérium imperatóris volúntas
    accederet, Ambrosius baptizátus (erat enim catechúmenus) sacrisque
    initiatus, ac servátis ómnibus ex instituto Ecclésiæ ordinum gradibus,
    octavo die, qui fuit septimo Idus Decembris, episcopale onus suscépit.
    Factus epíscopus, catholicam fidem et disciplínam ecclesiásticam acerrime
    deféndit; multosque Ariános, et alios hæreticos ad fidei veritátem
    convértit, in quibus claríssimum Ecclésiæ lumen sanctum Augustinum Jesu
    Christo péperit."
lectio6:
  - "Gratiáno imperatóre occiso, ad Maximum ejus interfectórem legátus íterum
    profectus est; eoque pœniténtiam ágere recusante, se ab ejus communióne
    semovit. Theodosium imperatórem, propter cædem Thessalonícæ factam, ingressu
    ecclésiæ prohibuit. Cui, cum ille David quoque regem adulterum et homicidam
    fuísse dixísset, respóndit Ambrosius: Qui secutus es errántem, séquere
    pœniténtem. Quare Theodosius sibi ab eo impositam publicam pœniténtiam
    humíliter egit. Ergo sanctus epíscopus pro Ecclésia Dei maximis labóribus
    curisque perfunctus, multis libris étiam egregie conscripsit, antequam in
    morbum incideret, mortis suæ diem prædixit. Ad quem ægrotum Honorátus
    Vercellénsis epíscopus, Dei voce ter admónitus, accurrit, eique sanctum
    Dómini corpus præbuit: quo ille sumpto, conformátis in crucis similitúdinem
    mánibus, orans, ánimam Deo réddidit pridie Nonas Aprilis, anno post Christum
    natum trecentésimo nonagesimo septimo."
lectio94:
  - Ambrósius epíscopus Mediolanénsis, Ambrósii civis Románi fílius, in Urbe
    liberálibus disciplínis erudítus est. A Probo præfécto, Ligúriæ et Æmíliæ
    præpósitus, ejúsdem jussu, cum potestáte Mediolánum venit; ubi, mórtuo
    Auxéntio Ariáno epíscopo, pópulus de successóre deligéndo dissidébat. Quare
    Ambrósius, pro offícii sui múnere ecclésiam ingréssus, ut commótam
    seditiónem sedáret, cum multa de quiéte et tranquillitáte reipúblicæ
    præcláre dixísset, derepénte púero Ambrósium epíscopum exclamánte, univérsi
    pópuli vox erúpit, Ambrósium epíscopum deposcéntis. Quare baptizátus (erat
    enim catechúmenus), sacris initiátus, omnibúsque órdinum grádibus de more
    Ecclésiæ suscéptis, episcopáli dignitáte auctus est. Quo in múnere
    cathólicam veritátem et disciplínam ecclesiásticam tum verbo tum scriptis
    ácriter deféndit, multósque Ariános, et álios hæréticos ad fidem convértit,
    e quibus sanctum Augustínum Jesu Christo péperit. Tot pro Ecclésia Dei
    labóribus curísque perfúnctus, óbiit prídie nonas aprílis, anno trecentésimo
    nonagésimo séptimo.
