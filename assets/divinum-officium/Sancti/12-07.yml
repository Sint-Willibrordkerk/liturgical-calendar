  - "!Commemoratio Vigiliæ Immaculatæ Conceptionis"
  - "Deus, qui Unigéniti tui Matrem ab origináli culpa in sua Conceptióne
    mirabíliter præservásti: da, quǽsumus; ut sua nos intercessióne munítos,
    corde mundos fácias suæ interésse festivitáti:"
