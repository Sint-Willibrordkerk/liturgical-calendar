postcommunio:
  - "Sacraménta salútis nostræ suscipiéntes, concéde, quǽsumus, omnípotens Deus:
    ut beáti Ambrósii Confessóris tui atque Pontíficis nos ubíque orátio
    ádjuvet; in cujus veneratióne hæc tuæ obtúlimus majestáti."
  - $Per Dominum
commemoratio-postcommunio:
  - "!Commemoratio Vigiliæ Immaculatæ Conceptionis"
  - "Concéde, miséricors Deus, fragilitáti nostræ præsídium: ut, qui immaculátæ
    Conceptiónis Genetrícis unigéniti Fílii tui festivitátem prævenímus;
    intercessiónis ejus auxílio a nostris iniquitátibus resurgámus."
  - $Per eúndem
