  - Ecce sacérdos magnus, qui in diébus suis plácuit Deo.
  - "!Eccli 44:20"
  - Non est inventus símilis illi, qui conserváret legem Excélsi. Allelúja,
    allelúja.
  - "!Ps 109:4"
  - "Jurávit Dóminus, et non pænitébit eum: Tu es sacérdos in ætérnum, secúndum
