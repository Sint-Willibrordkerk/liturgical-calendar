secreta:
  - Omnípotens sempitérne Deus, múnera tuæ majestáti obláta, per intercessiónem
    beáti Ambrósii Confessóris tui atque Pontíficis, ad perpétuam nobis fac
    proveníre salútem.
  - $Per Dominum
commemoratio-secreta:
  - "!Commemoratio Vigiliæ Immaculatæ Conceptionis"
  - "Múnera nostra, Dómine, apud tuam cleméntiam immaculátæ Dei Genetrícis
    commendet orátio: quam ab omni origináli labe præservásti; ut dignum Fílii
    tui habitáculum effici mererétur:"
  - $Qui tecum
