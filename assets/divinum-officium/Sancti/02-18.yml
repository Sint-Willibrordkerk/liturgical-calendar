lectio93:
  - "Simeon, fílius Cléophæ, post Jacobum próximus Jerosolymis ordinátus
    epíscopus, Trajano imperatóre apud Atticum consularem est accusatus, quod
    christianus esset et Christi propinquus. Comprehendebántur enim omnes eo
    témpore, quicúmque ex genere David orti essent. Quare multis cruciátus
    tormentis eodem passiónis genere, quod Salvátor noster subíerat, affícitur:
    mirántibus ómnibus, quod homo ætate confectus (erat enim centum et viginti
    annórum) acerbíssimos crucis dolóres fortiter constanterque paterétur."
  - "&teDeum"
