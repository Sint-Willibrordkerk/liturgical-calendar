officium:
  - S. Priscæ Virginis et Martyris
rank:
  - ""
  - Simplex
  - "1.1"
  - "@C6-1"
rule:
  - vide C6-1;
oratio:
  - "Da, quǽsumus, omnípotens Deus: ut, qui beátæ Priscæ Vírginis et Mártyris
    tuæ natalítia cólimus; et ánnua sollemnitáte lætémur, et tantæ fídei
    proficiámus exémplo."
  - $Per Dominum
secreta:
  - Hæc hóstia, quǽsumus, Dómine, quam Sanctórum tuórum natalítia recenséntes
    offérimus, et víncula nostræ pravitátis absólvat, et tuæ nobis misericórdiæ
    dona concíliet.
  - $Per Dominum
postcommunio:
  - "Quǽsumus, Dómine, salutáribus repléti mystériis: ut, cujus sollémnia
    celebrámus, ejus oratiónibus adjuvémur."
  - $Per Dominum
lectio93:
  - "Prisca, nobilis virgo Romana, trédecim annos nata, Cláudio imperatóre,
    christianæ fidei accusata, ejusdem jussu ducta ad Apóllinis templum, ut
    idolis immolaret, cum rem detestarétur, cólaphis cæsa, in carcerem traditur:
    atque inde emissa, cum in fidei constántia perseveraret, affecta verbéribus,
    ferventíque ádipe delibuta, rursus in carcerem includitur. Post triduum in
    amphitheatrum producta, leoni objícitur; qui suæ feritátis oblítus,
    humíliter se ad ejus pedes abjecit. Quæ póstea in ergastulo triduum inedia
    afflicta, in equuleo suspénditur, et ungulis férreis excarnificáta in rogum
    injícitur, unde étiam mirabíliter evasit incólumis. Dénique extra Urbem
    cápite abscisso, virginitátis palmam martyrii coróna cumulávit. Cujus corpus
    via Ostiénsi, décimo ab Urbe milliario, a Christiánis décimo quinto Kalendas
    Februarii sepelítur."
  - "&teDeum"
