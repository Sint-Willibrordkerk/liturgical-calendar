lectio:
  - Léctio Actuum Apostolórum
  - "!Act 9:1-22"
  - "In diébus illis: Saulus adhuc spirans minárum et cædis in discípulos
    Dómini, accés sit ad príncipem sacerdótum, et pétiit ab eo epístolas in
    Damáscum ad synagógas: ut, si quos invenísset hujus viæ viros ac mulíeres,
    vinctos perdúceret in Jerúsalem. Et cum iter fáceret, cóntigit, ut
    appropinquáret Damásco: et súbito circumfúlsit eum lux de cœlo. Et cadens in
    terram, audívit vocem dicéntem sibi: Saule, Saule, quid me perséqueris? Qui
    dixit: Quis es, Dómine? Et ille: Ego sum Jesus, quem tu perséqueris: durum
    est tibi contra stímulum calcitráre. Et tremens ac stupens, dixit: Dómine,
    quid me vis fácere? Et Dóminus ad eum: Surge et ingrédere civitátem, et ibi
    dicétur tibi, quid te opórteat fácere. Viri autem illi, qui comitabántur cum
    eo, stabant stupefácti, audiéntes quidem vocem, néminem autem vidéntes.
    Surréxit autem Saulus de terra, apertísque óculis nihil vidébat. Ad manus
    autem illum trahéntes, introduxérunt Damáscum. Et erat ibi tribus diébus non
    videns, et non manducávit neque bibit. Erat autem quidam discípulus Damásci,
    nómine Ananías: et dixit ad illum in visu Dóminus: Ananía. At ille ait: Ecce
    ego, Dómine. Et Dóminus ad eum: Surge et vade in vicum, qui vocátur Rectus:
    et quære in domo Judæ Saulum nómine Tarsénsem: ecce enim orat. Et vidit
    virum, Ananíam nómine, intrœúntem et imponéntem sibi manus, ut visum
    recipiat. Respóndit autem Ananías: Dómine, audívi a multis de viro hoc,
    quanta mala fécerit sanctis tuis in Jerúsalem: et hic habet potestátem a
    princípibus sacerdótum alligándi omnes, qui ínvocant nomen tuum. Dixit autem
    ad eum Dóminus: Vade, quóniam vas electiónis est mihi iste, ut portet nomen
    meum coram géntibus et régibus et fíliis Israël. Ego enim osténdam illi,
    quanta opórteat eum pro nómine meo pati. Et ábiit Ananías et introívit in
    domum: et impónens ei manus, dixit: Saule frater, Dóminus misit me Jesus,
    qui appáruit tibi in via, qua veniébas, ut vídeas et impleáris Spíritu
    Sancto. Ei conféstim cecidérunt ab óculis ejus tamquam squamæ, et visum
    recépit: et surgens baptizátus est. Et cum accepísset cibum, confortátus
    est. Fuit autem cum discípulis, qui erant Damásci, per dies áliquot. Et
    contínuo in synagógis prædicábat Jesum, quóniam hic est Fílius Dei.
    Stupébant autem omnes, qui audiébant, et dicébant: Nonne hic est, qui
    expugnábat in Jerúsalem eos, qui invocábant nomen istud: et huc ad hoc
    venit, ut vinctos illos dúcere ad príncipes sacerdótum?  Saulus autem multo
    magis convalescébat, et confundébat Judæos, qui habitábant Damásci,
    affírmans, quóniam hic est Christus."
graduale:
