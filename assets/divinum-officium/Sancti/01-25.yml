  - "Qui operátus est Petro in apostolátum, operátus est ei mihi inter gentes:
    et cognovérunt grátiam Dei, quæ data est mihi."
  - "V. Grátia Dei in me vácua non fuit: sed grátia ejus semper in me manet."
  - Allelúja, allelúja.
  - V. Magnus sanctus Paulus, vas electiónis, vere digne est glorificándus, qui
    et méruit thronum duodécimum possídere. Allelúja.
