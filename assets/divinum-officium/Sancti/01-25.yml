lectio4:
  - Sermo sancti Augustíni Epíscopi
  - "!Sermo 14 de Sanctis"
  - "Hódie de Actibus Apostolórum léctio hæc pronuntiáta est, ubi Paulus
    Apóstolus, ex persecutóre Christianórum, annuntiátor factus est Christi.
    Prostrávit enim Christus persecutórem, ut fáceret Ecclésiæ doctórem:
    percútiens eum, et sanans; occídens, et vivíficans: occísus agnus a lupis,
    et fáciens agnos de lupis. Ita enim in præclára prophetía cum Jacob
    Patriárcha benedíceret fíliis suis (præséntes tangens, futúra prospíciens)
    prædíctum erat quod in Paulo cóntigit. Erat autem Paulus, sicut ipse
    testátur, de tribu Bénjamin. Cum autem Jacob, benedícens fílios suos,
    venísset ad benedicéndum Bénjamin, ait de illo: Bénjamin lupus rapax."
lectio5:
  - "Quid ergo? lupus rapax semper? Absit; sed qui mane rapit prædam, ad
    vésperam dívidit escas. Hoc in Apóstolo Paulo implétum est, quia et de illo
    dictum erat. Jam, si placet, audiámus illum mane rapiéntem, ad vésperam
    escas dividéntem. Mane et véspere pósita sunt pro eo, ac si dicerétur, prius
    et póstea. Sic ergo accipiámus: Prius rápiet, póstea dívidet escas.
    Atténdite raptórem: Saulus, inquit, accéptis epístolis a princípibus
    sacerdótum, ibat, ut ubicúmque inveníret Christiános, ad sacerdótes
    attráheret et addúceret, útique puniéndos."
lectio6:
  - "Ibat spirans et anhélans cædes: hoc est, mane rápiens. Nam et quando
    lapidátus est Stéphanus primus Martyr pro nómine Christi, evidéntius áderat
    et Saulus; et sic áderat lapidántibus, ut non ei suffíceret, si tantum suis
    mánibus lapidáret. Ut enim esset in ómnium lapidántium mánibus, ipse ómnium
    vestiménta servábat; magis sǽviens omnes adjuvándo, quam suis mánibus
    lapidándo. Audívimus, mane rápiet: videámus ad vésperam quáliter dívidat
    escas. Voce Christi prostrátus de cælo, et accípiens désuper interdíctum jam
    sæviéndi, cécidit in fáciem suam, prius prosternéndus, póstea erigéndus;
    prius percutiéndus, póstea sanándus."
