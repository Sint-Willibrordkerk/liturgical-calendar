lectio4:
  - Ex Libro sancti Augustíni Epíscopi de cura pro mórtuis gerénda
  - "!Cap 2 et 3"
  - Curátio fúneris, condítio sepultúræ, pompa exsequiárum magis sunt vivórum
    solácia quam subsídia mortuórum. Nec ídeo tamen contemnénda et abiciénda
    sunt córpora defunctórum, maximéque justórum ac fidélium, quibus tamquam
    órganis et vasis ad ómnia bona ópera sancte usus est spíritus. Si enim
    patérna vestis et ánulus, ac si quid hujúsmodi, tanto cárius est pósteris,
    quanto erga paréntes major afféctus; nullo modo ipsa spernénda sunt córpora,
    quæ útique multo familiárius atque conjúnctius quam quǽlibet induménta
    gestámus. Hæc enim non ad ornaméntum vel adjutórium, quod adhibétur
    extrínsecus, sed ad ipsam natúram hóminis pértinent. Unde et antiquórum
    justórum fúnera officiósa pietáte curáta sunt, et exséquiæ celebrátæ, et
    sepultúra provísa; ipsíque, cum víverent, de sepeliéndis vel étiam
    transferéndis suis corpóribus fíliis mandavérunt.
lectio5:
  - "!Cap. 4"
  - "Recordántis et precántis afféctus cum defúnctis a fidélibus caríssimis
    exhibétur, eum prodésse non dúbium est iis, qui cum in córpore víverent,
    tália sibi post hanc vitam prodésse meruérunt. Verum, etsi áliqua necéssitas
    vel humári córpora, vel in sacris locis humári nulla data facultáte
    permíttat, non sunt prætermitténdæ supplicatiónes pro spirítibus mortuórum:
    quas faciéndas pro ómnibus in christiána et cathólica societáte defúnctis,
    étiam tácitis eórum nomínibus, sub generáli commemoratióne suscépit
    Ecclésia; ut quibus ad ista desunt paréntes, aut fílii, aut quicúmque
    cognáti vel amíci, ab una eis exhibeántur pia matre commúni. Si autem
    deéssent istæ supplicatiónes, quæ fiunt recta fide ac pietáte pro mórtuis,
    puto quod nihil prodésset spirítibus eórum, quámlibet in locis sanctis
    exánima córpora poneréntur."
lectio6:
  - "!Cap. 18"
  - "Quæ cum ita sint, non existimémus ad mórtuos, pro quibus curam gérimus,
    perveníre, nisi quod pro eis sive altáris, sive oratiónum, sive
    eleemosynárum sacrifíciis solémniter supplicámus: quamvis non pro quibus
    fiunt, ómnibus prosint; sed iis tantum pro quibus, dum vivunt, comparátur,
    ut prosint. Sed quia non discérnimus qui sunt, opórtet ea pro regenerátis
    ómnibus fácere, ut nullus eórum prætermittátur, ad quos hæc benefícia
    possint et débeant perveníre. Mélius enim supérerunt ista eis, quibus nec
    obsunt nec prosunt; quam eis déerunt, quibus prosunt. Diligéntius tamen
    facit hæc quisque pro necessáriis suis, quo pro illo fiat simíliter a suis.
    Córpori autem humándo quidquid impénditur, non est præsídium salútis, sed
    humanitátis offícium, secúndum afféctum quo nemo unquam carnem suam ódio
    habet. Unde opórtet ut quam potest pro carne próximi curam gerat, cum ille
    inde recésserit, qui gerébat. Et si hæc fáciunt, qui carnis resurrectiónem
    non credunt, quanto magis debent fácere qui credunt; ut córpori mórtuo, sed
    tamen resurrectúro et in æternitáte mansúro, impénsum ejúsmodi offícium sit
    étiam quodámmodo ejúsdem fídei testimónium!"
lectio7:
  - De Epístola prima beáti Pauli Apóstoli ad Corínthios
  - "!1 Cor 15:12-22"
  - 12 Si Christus prædicátur quod resurréxit a mórtuis, quómodo quidam dicunt
    in vobis, quóniam resurréctio mortuórum non est?
  - "13 Si autem resurréctio mortuórum non est: neque Christus resurréxit."
  - "14 Si autem Christus non resurréxit, inánis est ergo prædicátio nostra,
    inánis est et fides vestra:"
  - "15 invenímur autem et falsi testes Dei: quóniam testimónium díximus
    advérsus Deum quod suscitáverit Christum, quem non suscitávit, si mórtui non
    resúrgunt."
  - 16 Nam si mórtui non resúrgunt, neque Christus resurréxit.
  - "17 Quod si Christus non resurréxit, vana est fides vestra: adhuc enim estis
    in peccátis vestris."
  - 18 Ergo et qui dormiérunt in Christo, periérunt.
  - 19 Si in hac vita tantum in Christo sperántes sumus, miserabilióres sumus
    ómnibus homínibus.
  - 20 Nunc autem Christus resurréxit a mórtuis primítiæ dormiéntium,
  - 21 quóniam quidem per hóminem mors, et per hóminem resurréctio mortuórum.
  - 22 Et sicut in Adam omnes moriúntur, ita et in Christo omnes vivificabúntur.
lectio8:
  - "!1 Cor 15:35-44"
  - "35 Sed dicet áliquis: Quómodo resúrgunt mórtui? qualíve córpore vénient?"
  - "36 Insípiens, tu quod séminas non vivificátur, nisi prius moriátur:"
  - 37 et quod séminas, non corpus, quod futúrum est, séminas, sed nudum granum,
    ut puta trítici, aut alicújus ceterórum.
  - 38 Deus autem dat illi corpus sicut vult, et unicuíque séminum próprium
    corpus.
  - "39 Non omnis caro, éadem caro: sed ália quidem hóminum, ália vero pécorum,
    ália vólucrum, ália autem píscium."
  - "40 Et córpora cæléstia, et córpora terréstria: sed ália quidem cæléstium
    glória, ália autem terréstrium."
  - "41 Alia cláritas solis, ália cláritas lunæ, et ália cláritas stellárum;
    stella enim a stella differt in claritáte:"
  - 42 sic et resurréctio mortuórum. Seminátur in corruptióne, surget in
    incorruptióne.
  - "43 Seminátur in ignobilitáte, surget in glória: seminátur in infirmitáte,
    surget in virtúte:"
  - 44 seminátur corpus animále, surget corpus spiritále.
lectio9:
  - "!1 Cor 15:51-58"
  - "51 Ecce mystérium vobis dico: Omnes quidem resurgémus, sed non omnes
    immutábimur."
  - "52 In moménto, in ictu óculi, in novíssima tuba: canet enim tuba, et mórtui
    resúrgent incorrúpti: et nos immutábimur."
  - "53 Opórtet enim corruptíbile hoc indúere incorruptiónem: et mortále hoc
    indúere immortalitátem."
  - "54 Cum autem mortále hoc indúerit immortalitátem, tunc fiet sermo, qui
    scriptus est: Absórpta est mors in victória."
  - 55 Ubi est mors victória tua? ubi est mors stímulus tuus?
  - "56 Stímulus autem mortis peccátum est: virtus vero peccáti lex."
  - 57 Deo autem grátias, qui dedit nobis victóriam per Dóminum nostrum Jesum
    Christum.
  - "58 Itaque fratres mei dilécti, stábiles estóte, et immóbiles: abundántes in
    ópere Dómini semper, sciéntes quod labor vester non est inánis in Dómino."
