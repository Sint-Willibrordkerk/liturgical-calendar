officium:
  - Ss. Quatuor Coronatorum Martyrum
rank:
  - ""
  - Simplex
  - "1.1"
  - "@C3"
rule:
  - vide C3;
oratio:
  - "Præsta, quǽsumus, omnípotens Deus: ut, qui gloriósos Mártyres fortes in sua
    confessióne cognóvimus, pios apud te in nostra intercessióne sentiámus."
  - $Per Dominum
lectio:
  - "@Sancti/01-20"
graduale:
  - "!Exod 15:11"
  - "Gloriósus Deus in Sanctis suis: mirábilis in majestáte, fáciens prodígia."
  - "!Exod 15:6"
  - "Déxtera tua, Dómine, glorificáta est in virtúte: déxtera manus tua
    confrégit inimícos. Allelúja, allelúja."
  - "!Ps 44:14."
  - Córpora Sanctórum in pace sepúlta sunt, et nómina eórum vivent in
    generatiónem et generatiónem. Allelúja.
evangelium:
  - "@Sancti/06-05"
offertorium:
  - "@Commune/C3"
secreta:
  - "Benedíctio tua, Dómine, larga descéndat: quæ et múnera nostra,
    deprecántibus sanctis Martýribus tuis, tibi reddat accépta, et nobis
    sacraméntum redemptiónis effíciat."
  - $Per Dominum
communio:
  - "@Commune/C3"
postcommunio:
  - "Cœléstibus refécti sacraméntis et gáudiis: súpplices te, Dómine,
    deprecámur; ut, quorum gloriámur triúmphis, protegámur auxíliis."
  - $Per Dominum
rubrica-cisterciensis/rank:
  - ""
  - Commemoratio
  - "1"
  - "@C3"
lectio93:
  - Sevérus, Severiánus, Carpóphorus et Victorínus fratres, in persecutióne
    Diocletiáni, deórum cultum líbere detestántes, plumbátis cæsi, in verbéribus
    vitam pro Christi nómine profudérunt. Quorum corpora, cánibus objecta, cum
    ab illis intacta diu fuíssent, subláta a Christiánis, via Lavicana tertio ab
    Urbe lápide, in arenaria sepeliúntur, propre sepúlcrum sanctórum Mártyrum
    Claudii, Nicóstrati, Symphoriáni, Castórii et Simplícii, qui eodem
    imperatóre passi erant; quod, cum essent summi sculptores, nullo modo adduci
    potúerant ut idolórum statuas fácerent, et, ad solis simulacrum ducti, ut
    illud veneraréntur, numquam commissuros se dixérunt ut adorarent ópera
    mánuum hóminum. Quámobrem in carcerem conjecti, cum ibi multos dies in eodem
    proposito perstitissent, primum scorpiónibus cæsi, deínde, vivi plumbeis
    lóculis inclusi, in flumen dejiciúntur. Exstat in Urbe ecclésia sub nómine
    sanctórum Quatuor Coronatórum, quorum diu ignota nómina, divinitus póstea
    patefácta sunt; ubi non solum illórum quatuor, sed étiam horum quinque
    Mártyrum córpora honorifice sepúlta sunt, et eórum festívitas sexto Idus
    Novembris celebrátur.
  - "&teDeum"
