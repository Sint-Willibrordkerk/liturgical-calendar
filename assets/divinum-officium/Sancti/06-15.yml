officium:
  - Ss. Viti, Modesti atque Crescentiæ Martyrum
rank:
  - ""
  - Simplex
  - "1.1"
  - "@C3"
rule:
  - vide C3;
  - Evangelium non appropriatum
  - Gloria
introitus:
  - "!Ps 33:20-21"
  - "v. Multæ tribulatiónes justórum, et de his ómnibus liberávit eos Dóminus:
    Dóminus custódit ómnia ossa eórum: unum ex his non conterétur."
  - "!Ps 33:2"
  - "Benedícam Dóminum in omni témpore: semper laus ejus in ore meo."
  - "&Gloria"
  - "v. Multæ tribulatiónes justórum, et de his ómnibus liberávit eos Dóminus:
    Dóminus custódit ómnia ossa eórum: unum ex his non conterétur."
oratio:
  - "Da Ecclésiæ tuæ, quǽsumus, Dómine, sanctis Martýribus tuis Vito, Modésto
    atque Crescéntia intercedéntibus, supérbe non sápere, sed tibi plácita
    humilitáte profícere: ut, prava despíciens, quæcúmque recta sunt, libera
    exérceat caritáte."
  - $Per Dominum
lectio:
  - "@Commune/C3"
graduale:
  - "!Ps 149:5; 149:1"
  - "Exsultábunt Sancti in glória: lætabúntur in cubílibus suis."
  - "V. Cantáte Dómino cánticum novum: laus ejus in ecclésia sanctórum."
  - Allelúja, allelúja.
  - "!Ps 144:10-11"
  - "Sancti tui, Dómine, benedícent te: glóriam regni tui dicent. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 10:16-20"
  - "In illo témpore: Dixit Jesus discípulis suis: Qui vos audit, me audit: et
    qui vos spernit, me spernit. Qui autem me spernit, spernit eum, qui misit
    me. Revérsi sunt autem septuagínta duo cum gáudio, dicéntes: Dómine, étiam
    dæmónia subjiciúntur nobis in nómine tuo. Et ait illis: Vidébam sátanam
    sicut fulgur de cœlo cadéntem. Ecce, dedi vobis potestátem calcandi supra
    serpéntes et scorpiónes, et super omnem virtútem inimíci: et nihil vobis
    nocébit. Verúmtamen in hoc nolíte gaudére, quia spíritus vobis subjiciúntur:
    gaudéte autem, quod nómina vestra scripta sunt in cœlis."
offertorium:
  - "@Commune/C3"
secreta:
  - "Sicut glóriam divínæ poténtiæ múnera pro Sanctis obláta testántur: sic
    nobis efféctum, Dómine, tuæ salvatiónis impéndant."
  - $Per Dominum
communio:
  - "!Sap 3:1-2; 3:3"
  - "Justórum ánimæ in manu Dei sunt, et non tanget illos torméntum malítiæ:
    visi sunt óculis insipiéntium mori: illi autem sunt in pace."
postcommunio:
  - "Repléti, Dómine, benedictióne sollémni: quǽsumus; ut, per intercessiónem
    sanctórum Mártyrum tuórum Viti, Modésti et Crescéntiæ, medicína sacraménti
    et corpóribus nostris prosit et méntibus."
  - $Per Dominum
lectio93:
  - "Vitus admodum puer inscio patre baptizatus est: quod cum ille rescivisset,
    nihil prætermisit, quo filium a christiana religione removeret. Qua in
    voluntate permanentem, Valeriano judici verberibus castigandum tradidit. Sed
    nihilominus in sententia persistens, patri redditus est. Sed dum eum pater
    gravius punire cogitat, Vitus Angeli monitu, comitibus Modesto et
    Crescentia, ejus educatoribus, migrat in alienas terras: ibique eam
    sanctitatis laudem adeptus est, ut ejus fama ad Diocletianum perlata, ipsum
    imperator accerseret, ut filium suum a dæmone vexatum liberaret: Quo
    liberato, cum ei amplissimis præmiis ingratus imperator, ut deos coleret,
    persuadere non potuisset, una cum Modesto et Crescentia vinculis constrictum
    mittit in carcerem. Quos ubi constantiores esse comperit, demitti jubet in
    ingens vas liquato plumbo, ferventi resina ac pice plenum: in quo cum trium
    Hebræorum puerorum more divinos hymnos canerent, inde erepti leoni
    objiciuntur: qui prostérnens se, eorum pedes lambebat. Quare inflammatus ira
    imperator, quod multitudinem videbat miraculo commoveri, eos in catasta
    sterni jubet et ita cædi eorum membra, atque ossa divelli. Quo tempore
    tonitrua, fulgura, magnique terræmotus fuere, quibus templa deorum
    corruerunt, et multi oppressi sunt. Eorum reliquias Florentia nobilis
    femina, unguentis conditas, honorifice sepelivit."
  - "&teDeum"
