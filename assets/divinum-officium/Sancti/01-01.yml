responsory1:
  - "R. Ecce Agnus Dei, ecce qui tollit peccáta mundi: ecce de quo dicébam
    vobis: Qui post me venit, ante me factus est:"
  - "* Cujus non sum dignus corrígiam calceaménti sólvere."
  - "V. Qui de terra est, de terra lóquitur: qui de cælo venit, super omnes est."
  - R. Cujus non sum dignus corrígiam calceaménti sólvere.
responsory2:
  - "R. Dies sanctificátus illúxit nobis: veníte, gentes, et adoráte Dóminum:"
  - "* Quia hódie descéndit lux magna in terris."
  - V. Hæc dies quam fecit Dóminus, exsultémus et lætémur in ea.
  - R. Quia hódie descéndit lux magna in terris.
responsory3:
  - "R. Benedíctus qui venit in nómine Dómini, Deus Dóminus, et illúxit nobis:"
  - "* Allelúja, allelúja."
  - V. Hæc dies quam fecit Dóminus, exsultémus et lætémur in ea.
  - R. Allelúja, allelúja.
  - "&Gloria"
  - R. Allelúja, allelúja.
lectio4:
  - Sermo sancti Leónis Papæ
  - "!Sermo 7 de Nativitate Domini"
  - Festivitátis hodiérnæ, dilectíssimi, verus venerátor est, et pius cultor,
    qui nec de Incarnatióne Dómini áliquid falsum, nec de Deitáte áliquid sentit
    indígnum. Paris enim perículi malum est, si illi aut natúræ nostræ véritas,
    aut Patérnæ glóriæ negátur æquálitas. Cum ergo ad intellegéndum sacraméntum
    nativitátis Christi, qua de Matre vírgine est ortus, accédimus, abigátur
    procul terrenárum calígo ratiónum, et ab illuminátæ fídei óculo mundánæ
    sapiéntiæ fumus abscédat.
responsory4:
  - "R. Congratulámini mihi, omnes qui dilígitis Dóminum:"
  - "* Quia, cum essem párvula, plácui Altíssimo, et de meis viscéribus génui
    Deum et hóminem."
  - V. Beátam me dicent omnes generatiónes, quia ancíllam húmilem respéxit Deus.
  - R. Quia, cum essem párvula, plácui Altíssimo, et de meis viscéribus génui
    Deum et hóminem.
lectio5:
  - "Divína est enim auctóritas, cui crédimus: divína est doctrína, quam
    séquimur. Quóniam sive legis testificatióni, sive oráculis prophetárum, sive
    evangélicæ tubæ interiórem admoveámus audítum; verum est, quod Joánnes
    plenus Spíritu Sancto intónuit: In princípio erat Verbum, et Verbum erat
    apud Deum, et Deus erat Verbum. Hoc erat in princípio apud Deum. Omnia per
    ipsum facta sunt, et sine ipso factum est nihil. Et simíliter verum est,
    quod idem prædicátor adjécit: Verbum caro factum est et habitávit in nobis:
    et vídimus glóriam ejus, glóriam quasi Unigéniti a Patre."
responsory5:
  - "R. Confirmátum est cor Vírginis, in quo divína mystéria, Angelo nuntiánte,
    concépit: tunc speciósum forma præ fíliis hóminum castis suscépit
    viscéribus:"
  - "* Et benedícta in ætérnum, Deum nobis prótulit et hóminem."
  - "V. Domus pudíci péctoris templum repénte fit Dei: intácta nésciens virum,
    verbo concépit Fílium."
  - R. Et benedícta in ætérnum, Deum nobis prótulit et hóminem.
lectio6:
  - "In utráque ergo natúra idem est Dei Fílius, nostra suscípiens, et própria
    non amíttens: in hómine hóminem rénovans, in se incommutábilis persevérans.
    Déitas enim, quæ illi cum Patre commúnis est, nullum detriméntum
    omnipoténtiæ súbiit, nec Dei formam servi forma violávit: quia summa et
    sempitérna esséntia, quæ se ad humáni géneris inclinávit salútem, nos quidem
    in suam glóriam tránstulit, sed quod erat, esse non déstitit. Unde cum
    Unigénitus Dei minórem se Patre confitétur, cui se dicit æquálem, veritátem
    in se formæ utriúsque demónstrat: ut et humánam probet imparílitas, et
    divínam decláret æquálitas."
responsory6:
  - "R. Benedícta et venerábilis es, Virgo María, quæ sine tactu pudóris invénta
    es mater Salvatóris:"
  - "* Jacébat in præsépio, et fulgébat in cælo."
  - "V. Dómine, audívi audítum tuum, et tímui: considerávi ópera tua, et expávi:
    in médio duórum animálium."
  - R. Jacébat in præsépio, et fulgébat in cælo.
  - "&Gloria"
  - R. Jacébat in præsépio, et fulgébat in cælo.
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 2:21"
  - "In illo témpore: Postquam consummáti sunt dies octo, ut circumciderétur
    Puer: vocátum est nomen ejus Jesus. Et réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Liber 2 in cap. 2 Lucæ, circa medium"
  - "Circumcíditur ítaque Puer. Quis est iste puer, nisi ille, de quo dictum
    est: Puer natus est nobis, Fílius datus est nobis? Factus est enim sub lege,
    ut eos, qui sub lege essent, lucrifáceret. Ut sísterent eum Dómino. Quid sit
    autem in Jerúsalem sisti Dómino, dícerem, nisi in Isaíæ comméntis ante
    dixíssem. Circumcísus enim vítiis, Domínico dignus judicátur obtútu; quia,
    Oculi Dómini super justos. Vides omnem legis véteris sériem fuísse typum
    futúri: nam et circumcísio purgatiónem signíficat delictórum."
responsory7:
  - "R. Sancta et immaculáta virgínitas, quibus te láudibus éfferam, néscio:"
  - "* Quia quem cæli cápere non póterant, tuo grémio contulísti."
  - V. Benedícta tu in muliéribus, et benedíctus fructus ventris tui.
  - R. Quia quem cæli cápere non póterant, tuo grémio contulísti.
  - "&Gloria"
  - R. Quia quem cæli cápere non póterant, tuo grémio contulísti.
lectio8:
  - "Sed quóniam prona quadam cupiditáte peccándi, humánæ carnis et mentis
    fragílitas inextricabílibus vítiis implicátur, eo per octávum circumcisiónis
    diem culpæ totíus futúra purgátio, resurrectiónis præfigurabátur ætáte. Hoc
    est enim illud: Quia omne masculínum adapériens vulvam, sanctum Dómino
    vocábitur. Verbis enim legis promittebátur Vírginis partus. Et vere sanctus,
    quia immaculátus. Dénique ipsum esse, qui lege signétur, in eúndem modum ab
    Angelo repetíta verba declárant: Quod nascétur, inquit, Sanctum, vocábitur
    Fílius Dei."
responsory8:
  - "R. Nésciens Mater Virgo virum, péperit sine dolóre:"
  - "* Salvatórem sæculórum, ipsum Regem Angelórum, sola Virgo lactábat úbere de
    cælo pleno."
  - "V. Domus pudíci péctoris templum repénte fit Dei: intácta nésciens virum,
    verbo concépit Fílium."
  - R. Salvatórem sæculórum, ipsum Regem Angelórum, sola Virgo lactábat úbere de
    cælo pleno.
  - "&Gloria"
  - R. Salvatórem sæculórum, ipsum Regem Angelórum, sola Virgo lactábat úbere de
    cælo pleno.
lectio9:
  - "Solus enim per ómnia ex natis de fémina sanctus Dóminus Jesus, qui terrénæ
    contágia corruptélæ, immaculáti partus novitáte non sénserit, et cælésti
    majestáte depúlerit. Nam si lítteram sequámur: quómodo sanctus omnis
    másculus, cum multos sceleratíssimos fuísse non láteat? Numquid sanctus
    Achab? numquid sancti pseudoprophétæ, quos ad Elíæ preces ultor cæléstis
    injúriæ ignis absúmpsit? Sed ille sanctus, quem in figúra futúri mystérii
    pia legis divínæ præscrípta signábant; eo quod solus sanctæ Ecclésiæ
    vírginis ad generándos pópulos Dei, immaculátæ fecunditátis aperíret
    genitále secrétum."
  - "&teDeum"
