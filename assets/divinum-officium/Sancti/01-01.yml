introitus:
  - "!Isa 9:6"
  - "v. Puer natus est nobis, et fílius datus est nobis: cujus impérium super
    húmerum ejus: et vocábitur nomen ejus magni consílii Angelus."
  - "!Ps 97:1"
  - Cantáte Dómino cánticum novum, quia mirabília fecit.
  - "&Gloria"
  - "v. Puer natus est nobis, et fílius datus est nobis: cujus impérium super
    húmerum ejus: et vocábitur nomen ejus magni consílii Angelus."
oratio:
  - "Deus, qui salútis ætérnæ, beátæ Maríæ virginitáte fecúnda, humáno generi
    præmia præstitísti: tríbue, quǽsumus; ut ipsam pro nobis intercédere
    sentiámus, per quam merúimus auctórem vitæ suscípere, Dóminum nostrum Jesum
    Christum, Fílium tuum:"
  - $Qui tecum
rubrica-tridentina/commemoratio-oratio:
  - "!Pro S. Stephano Protomartyre"
  - "Da nobis, quǽsumus, Dómine, imitári quod cólimus: ut discámus et inimícos
    dilígere; quia ejus inventiónem celebrámus, qui novit étiam pro
    persecutóribus exoráre Dóminum nostrum Jesum Christum, Fílium tuum:"
  - $Qui tecum
  - "!Pro S. Joanne Evangelista"
  - "Ecclésiam tuam, Dómine, benígnus illústra: ut, beáti Joánnis Apóstoli tui
    et Evangelístæ illumináta doctrínis, ad dona pervéniat sempitérna."
  - $Per Dominum
  - "!Pro Ss. Innocentibus"
  - "Deus, cujus hodiérna die præcónium Innocéntes Mártyres non loquéndo, sed
    moriéndo conféssi sunt: ómnia in nobis vitiórum mala mortífica; ut fidem
    tuam, quam lingua nostra lóquitur, étiam móribus vita fateátur."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beati Pauli Apóstoli ad Titum
  - "!Tit 2:11-15"
  - "Caríssime: Appáruit grátia Dei Salvatóris nostri ómnibus homínibus,
    erúdiens nos, ut, abnegántes impietátem et sæculária desidéria, sóbrie et
    juste et pie vivámus in hoc sǽculo, exspectántes beátam spem et advéntum
    glóriæ magni Dei et Salvatóris nostri Jesu Christi: qui dedit semetípsum pro
    nobis: ut nos redímeret ab omni iniquitáte, et mundáret sibi pópulum
    acceptábilem, sectatórem bonórum óperum. Hæc lóquere et exhortáre: in
    Christo Jesu, Dómino nostro."
graduale:
  - "!Ps 97:3-4; 97:2"
  - "Vidérunt omnes fines terræ salutare Dei nostri: jubiláte Deo, omnis terra."
  - "V. Notum fecit Dominus salutare suum: ante conspéctum géntium revelávit
    justitiam suam."
  - Allelúja, allelúja.
  - "!Heb 1:1-2"
  - Multifárie olim Deus loquens pátribus in Prophétis, novíssime diébus istis
    locútus est nobis in Fílio. Allelúja.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 2:21"
  - "In illo témpore: Postquam consummáti sunt dies octo, ut circumciderétur
    Puer: vocátum est nomen ejus Jesus, quod vocátum est ab Angelo, priúsquam in
    útero conciperétur."
offertorium:
  - "!Ps 88:12; 88:15"
  - "Tui sunt cœli et tua est terra: orbem terrárum et plenitúdinem ejus tu
    fundásti: justítia et judícium præparátio sedis tuæ."
secreta:
  - "Munéribus nostris, quǽsumus, Dómine, precibúsque suscéptis: et cœléstibus
    nos munda mystériis, et cleménter exáudi."
  - $Per Dominum
rubrica-tridentina/commemoratio-secreta:
  - "!Pro S. Stephano Protomartyre"
  - "Súscipe, Dómine, múnera pro tuórum commemoratióne Sanctórum: ut, sicut
    illos pássio gloriósos effécit; ita nos devótio reddat innócuos."
  - $Per Dominum
  - "!Pro S. Joanne Evangelista"
  - Súscipe, Dómine, múnera, quæ in ejus tibi sollemnitáte deférimus, cujus nos
    confídimus patrocínio liberári.
  - $Per Dominum
  - "!Pro Ss. Innocentibus"
  - "Sanctórum tuórum, Dómine, nobis pia non desit orátio: quæ et múnera nostra
    concíliet, et tuam nobis indulgéntiam semper obtíneat."
  - $Per Dominum
communio:
  - "!Ps 97:3"
  - Vidérunt omnes fines terræ salutáre Dei nostri.
postcommunio:
  - "Hæc nos commúnio, Dómine, purget a crímine: et, intercedénte beáta Vírgine
    Dei Genetríce María, cœléstis remédii fáciat esse consórtes."
  - $Per eundem
rubrica-tridentina/commemoratio-postcommunio:
  - "!Pro S. Stephano protomartire"
  - "Auxiliéntur nobis, Dómine, sumpta mystéria: et, intercedénte beáto Stéphano
    Mártyre tuo, sempitérna protectióne confírment."
  - $Per Dominum
  - "!Pro S. Joanne Evangelista"
  - "Refécti cibo potúque cœlésti, Deus noster, te súpplices exorámus: ut, in
    cujus hæc commemoratióne percépimus, ejus muniámur et précibus."
  - $Per Dominum
  - "!Pro Ss. Innocentibus"
  - "Votíva, Dómine, dona percépimus: quæ Sanctórum nobis précibus, et
    præséntis, quǽsumus, vitæ páriter et ætérnæ tríbue conférre subsídium."
  - $Per Dominum
