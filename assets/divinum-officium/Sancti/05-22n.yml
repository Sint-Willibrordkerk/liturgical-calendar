  - Duplex optional
  - "2"
  - "@C7a"
rule:
  - vide C7a;
  - Gloria
oratio:
  - "Deus, qui sanctæ Ritæ tantam grátiam conférre dignátus es, ut inimícos
    dilígeret et in corde ac fronte caritátis et passiónis tuæ signa portáret:
    da nobis, quǽsumus, ejus intercessióne et méritis; inimícis nostris sic
    párcere et passiónis tuæ dolóres contemplári, ut promíssa mítibus ac
    lugéntibus prǽmia consequámur:"
  - $Qui vivis
