introitus:
  - "!Ps 76:19"
  - "v. Illuxérunt coruscatiónes tuæ orbi terræ: commóta est et contrémuit
    terra."
  - "!Ps 83:2-3"
  - Quam dilécta tabernácula tua, Dómine virtútum! Concupíscit, et déficit ánima
    mea in átria Dómini.
  - "&Gloria"
  - "v. Illuxérunt coruscatiónes tuæ orbi terræ: commóta est et contrémuit
