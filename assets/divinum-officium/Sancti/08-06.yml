nocturn-1-versum:
  - "@:Versum 1"
nocturn-2-versum:
  - V. Glória et honóre coronásti eum, Dómine.
  - R. Et constituísti eum super ópera mánuum tuárum.
nocturn-3-versum:
  - V. Magna est glória ejus in salutári tuo.
  - R. Glóriam et magnum decórem impónes super eum.
lectio1:
  - De Epístola secúnda beáti Petri Apóstoli
  - "!2 Pet 1:10-14"
  - "10 Fratres: Magis satágite, ut per bona ópera certam vestram vocatiónem et
    electiónem faciátis: hæc enim faciéntes, non peccábitis aliquándo."
  - 11 Sic enim abundánter ministrábitur vobis intróitus in ætérnum regnum
    Dómini nostri, et Salvatóris Jesu Christi.
  - "12 Propter quod incípiam vos semper commonére de his: et quidem sciéntes et
    confirmátos vos in præsénti veritáte."
  - "13 Justum autem árbitror, quámdiu sum in hoc tabernáculo, suscitáre vos in
    commonitióne:"
  - 14 certus quod velox est deposítio tabernáculi mei secúndum quod et Dóminus
    noster Jesus Christus significávit mihi.
responsory1:
  - R. Surge, illumináre, Jerúsalem, quia venit lumen tuum,
  - "* Et glória Dómini super te orta est."
  - V. Et ambulábunt gentes in lúmine tuo, et reges in splendóre ortus tui.
  - R. Et glória Dómini super te orta est.
lectio2:
  - "!2 Pet 1:15-17"
  - 15 Dabo autem óperam et frequénter habére vos post óbitum meum, ut horum
    memóriam faciátis.
  - 16 Non enim doctas fábulas secúti notam fécimus vobis Dómini nostri Jesu
    Christi virtútem et præséntiam, sed speculatóres facti illíus magnitúdinis.
  - "17 Accípiens enim a Deo Patre honórem et glóriam, voce delápsa ad eum
    hujuscémodi a magnífica glória: Hic est Fílius meus diléctus, in quo mihi
    complácui; ipsum audíte."
responsory2:
  - "R. In splendénte nube Spíritus Sanctus visus est, Patérna vox audíta est:"
  - "* Hic est Fílius meus diléctus, in quo mihi bene complácui; ipsum audíte."
  - V. Appáruit nubes obúmbrans, et vox Patris intónuit.
  - R. Hic est Fílius meus diléctus, in quo mihi bene complácui; ipsum audíte.
lectio3:
  - "!2 Pet 1:18-21"
  - 18 Et hanc vocem nos audívimus de cælo allátam, cum essémus cum ipso in
    monte sancto.
  - 19 Et habémus firmiórem prophéticum sermónem, cui bene fácitis attendéntes
    quasi lucérnæ lucénti in caliginóso loco, donec dies elucéscat et lúcifer
    oriátur in córdibus vestris,
  - 20 hoc primum intellegéntes quod omnis prophetía Scriptúræ própria
    interpretatióne non fit.
  - 21 Non enim voluntáte humána alláta est aliquándo prophetía; sed Spíritu
    Sancto inspiráti locúti sunt sancti Dei hómines.
responsory3:
  - R. Vidéte qualem caritátem dedit nobis Deus Pater,
  - "* Ut fílii Dei nominémur et simus."
  - V. Scimus quóniam, cum apparúerit, símiles ei érimus, quóniam vidébimus eum
    sícuti est.
  - R. Ut fílii Dei nominémur et simus.
  - "&Gloria"
  - R. Ut fílii Dei nominémur et simus.
lectio4:
  - Sermo sancti Leónis Papæ
  - "!Sermo de Transfiguratione, ante medium"
  - Aperit Dóminus coram eléctis téstibus glóriam suam, et commúnem illam cum
    céteris córporis formam tanto splendóre claríficat, ut et fácies ejus solis
    fulgóri símilis, et vestítus candóri nívium esset æquális. In qua
    transfiguratióne illud quidem principáliter agebátur, ut de córdibus
    discipulórum crucis scándalum tollerétur; nec conturbáret eórum fidem
    voluntáriæ humílitas passiónis, quibus reveláta esset abscónditæ excelléntia
    dignitátis. Sed non minóre providéntia spes sanctæ Ecclésiæ fundabátur, ut
    totum Christi corpus agnósceret quali esset commutatióne donándum, ut ejus
    sibi honóris consórtium membra promítterent, qui in cápite præfulsísset.
responsory4:
  - "R. Inebriáti sunt ab ubertáte domus tuæ:"
  - "* Et torrénte voluptátis tuæ potásti eos."
  - V. Quóniam apud te est fons vitæ, et in lúmine tuo vidébimus lumen.
  - R. Et torrénte voluptátis tuæ potásti eos.
lectio5:
  - "Confirmándis vero Apóstolis et ad omnem sciéntiam provehéndis, ália quoque
    in illo miráculo accéssit instrúctio. Móyses enim et Elías, lex scílicet et
    prophétæ apparuérunt cum Dómino loquéntes; ut veríssime in illa quinque
    virórum præséntia complerétur quod dictum est: in duóbus vel tribus téstibus
    stat omne verbum. Quid hoc stabílius, quid fírmius verbo, in cujus
    prædicatióne véteris et novi Testaménti cóncinit tuba, et cum evangélica
    doctrína, antiquárum protestatiónum instruménta concúrrunt? Astipulántur
    enim sibi ínvicem utriúsque Fœ́deris páginæ; et, quem sub velámine
    mysteriórum præcedéntia signa promíserant, maniféstum atque perspícuum
    præséntis glóriæ splendor osténdit."
responsory5:
  - "R. Præcéptor, bonum est nos hic esse:"
  - "* Faciámus hic tria tabernácula; tibi unum, Móysi unum et Elíæ unum."
  - V. Non enim sciébat quid díceret.
  - R. Faciámus hic tria tabernácula; tibi unum, Móysi unum et Elíæ unum.
lectio6:
  - "His ergo sacramentórum revelatiónibus Petrus Apóstolus incitátus, mundána
    spernens et terréna fastídiens, in æternórum desidérium quodam mentis
    rapiebátur excéssu; et, gáudio totíus visiónis implétus, ibi cum Jesu
    optábat habitáre, ubi manifésta ejus glória lætabátur. Unde et ait: Dómine,
    bonum est nos hic esse: si vis, faciámus hic tria tabernácula; tibi unum,
    Móysi unum et Elíæ unum. Sed huic suggestióni Dóminus non respóndit,
    signíficans, non quidem ímprobum, sed inordinátum esse quod cúperet; cum
    salvári mundus, nisi Christi morte, non posset, et exémplo Dómini in hoc
    vocarétur credéntium fides, ut licet non oportéret de beatitúdinis
    promissiónibus dubitári, intellegerémus tamen inter tentatiónes hujus vitæ
    prius nobis tolerántiam postulándam esse, quam glóriam."
responsory6:
  - "R. Si ministrátio mortis, lítteris deformáta in lapídibus, fuit in glória,
    ita ut non possent inténdere fílii Israël in fáciem Móysi propter glóriam
    vultus ejus, quæ evacuátur:"
  - "* Multo magis ministrátio spíritus, quæ manet, erit in glória."
  - V. Amplióris enim glóriæ Christus præ Móyse dignus est hábitus, quanto
    ampliórem honórem habet domo, qui fabricávit eam.
  - R. Multo magis ministrátio spíritus, quæ manet, erit in glória.
  - "&Gloria"
  - R. Multo magis ministrátio spíritus, quæ manet, erit in glória.
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 17:1-9"
  - "In illo témpore: Assúmpsit Jesus Petrum, et Jacóbum, et Joánnem fratrem
    ejus, et duxit illos in montem excélsum seórsum: et transfigurátus est ante
    eos. Et réliqua."
  - _
  - Homilía sancti Joánnis Chrysóstomi
  - "!Homilia 57 in Matth., in init."
  - "Quóniam multa de perículis, multa de passióne sua, multa de morte et de
    cæde discipulórum locútus est Dóminus, et áspera complúra atque árdua eis
    injúnxit; et illa quidem in præsénti vita, et jam imminébant; bona vero in
    spe et exspectatióne erant: ut puta, quia servárent ánimam suam, si
    pérderent eam; quia in glória Patris sui ventúrus sit, et prǽmia redditúrus:
    ut visu étiam certióres fáceret, et osténderet quidnam sit illa glória, cum
    qua ventúrus est, quantum cápere póterant in hac præsénti vita, illis
    osténdit eámque détegit, ne aut sua aut Dómini morte dóleant, et máxime
    Petrus."
responsory7:
  - R. Vocávit nos Deus vocatióne sua sancta, secúndum grátiam suam, quæ
    manifestáta est nunc;
  - "* Per illuminatiónem Salvatóris nostri Jesu Christi."
  - V. Qui destrúxit mortem, illuminávit autem vitam in incorruptiónem.
  - R. Per illuminatiónem Salvatóris nostri Jesu Christi.
lectio8:
  - "Et vide quid agit, cum de regno et de gehénna disserúerit. Nam in eo quod
    dixit: Qui ínvenit ánimam suam, perdet eam; et quicúmque perdet eam grátia
    mei, invéniet ipsam; et in eo quod ait: Reddet unicuíque secúndum ópera sua;
    et regnum et gehénnam designávit. Cum ígitur de utrísque disserúerit, regnum
    quidem ut óculis cernátur, concédit, gehénnam autem mínime; quóniam
    rudióribus atque ineptióribus illud necessárium fuísset, sed, cum illi probi
    essent ac perspicáces, satis fuit eos a melióribus confirmári. Hoc étiam
    multo magis ipsum decébat. Non tamen omníno illud prætermísit, sed et
    aliquándo atrocitátem gehénnæ quasi ante óculos propónit, véluti cum Lázari
    imáginem descrípsit, et ejus méminit qui denários centum repétiit."
responsory8:
  - R. Deus, qui fecit de ténebris lumen splendéscere, illúxit in córdibus
    nostris
  - "* Ad illuminatiónem sciéntiæ claritátis Dei, in fácie Jesu Christi."
  - V. Exórtum est in ténebris lumen rectis corde, miséricors et miserátor, et
    justus.
  - R. Ad illuminatiónem sciéntiæ claritátis Dei, in fácie Jesu Christi.
  - "&Gloria"
  - R. Ad illuminatiónem sciéntiæ claritátis Dei, in fácie Jesu Christi.
lectio9:
  - Tu vero Matthǽi philosophíam consídera, qui non celávit nómina eórum qui
    præpósiti fúerant. Quod et Joánnes sǽpius facit, cum exímias Petri laudes
    veríssime ac diligentíssime descríbat. Nullum enim in hoc Apostolórum
    consórtio livor aut inánis glória locum habébat. Primos ígitur Apostolórum
    seórsum assúmpsit. Quam ob rem eos solos accépit? Quia excellentióres
    céteris vidélicet erant. Cur autem non íllico, sed post sex dies hoc fecit?
    Ne céteri scílicet discípuli seu hómines moveréntur; qua de re nec eos
    nominávit, quos acceptúrus erat.
  - "&teDeum"
versum-0:
