oratio:
  - "Deus, qui fídei sacraménta in Unigéniti tui gloriósa Transfiguratióne
    patrum testimónio roborásti, et adoptiónem filiórum perféctam, voce delápsa
    in nube lúcida, mirabíliter præsignásti: concéde propítius; ut ipsíus Regis
    glóriæ nos coherédes effícias, et ejúsdem glóriæ tríbuas esse consórtes."
  - $Per eundem
lectio:
  - Léctio Epístolæ beáti Petri Apóstoli
  - "!2 Petri 1:16-19"
  - "Caríssimi: Non doctas fábulas secúti notam fecimus vobis Dómini nostri Jesu
    Christi virtútem et præséntiam: sed speculatores facti illíus magnitudinis.
    Accipiens enim a Deo Patre honórem et glóriam, voce delapsa ad eum
    hujuscemodi a magnifica glória: Hic est Fílius meus diléctus, in quo mihi
    complacui, ipsum audíte. Et hanc vocem nos audivimus de cœlo allatam, cum
    essemus cum ipso in monte sancto. Et habémus firmiórem propheticum sermónem:
    cui bene facitis attendentes, quasi lucérnæ lucénti in caliginóso loco,
    donec dies elucescat et lucifer oriátur in córdibus vestris."
graduale:
  - "!Ps 44:3; 44:2"
  - "Speciosus forma præ fíliis hóminum: diffúsa est grátia in lábiis tuis."
  - "V. Eructávit cor meum verbum bonum: dico ego ópera mea Regi."
  - Allelúja, allelúja.
  - "!Eccli 7:26"
  - Candor est lucis ætérnæ, spéculum sine mácula, et imágo bonitátis illíus.
    Allelúja.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 17:1-9"
  - "In illo témpore: Assúmpsit Jesus Petrum, et Jacóbum, et Joánnem fratrem
    ejus, et duxit illos in montem excélsum seórsum: et transfigurátus est ante
    eos. Et resplénduit fácies ejus sicut sol: vestiménta autem ejus facta sunt
    alba sicut nix. Et ecce, apparuérunt illis Moyses et Elías cum eo loquéntes.
    Respóndens autem Petrus, dixit ad Jesum: Dómine, bonum est nos hic esse: si
    vis, faciámus hic tria tabernácula, tibi unum, Móysi unum et Elíæ unum.
    Adhuc eo loquénte, ecce, nubes lúcida obumbrávit eos. Et ecce vox de nube,
    dicens: Hic est Fílius meus diléctus, in quo mihi bene complácui: ipsum
    audíte. Et audiéntes discípuli, cecidérunt in fáciem suam, et timuérunt
    valde. Et accéssit Jesus, et tétigit eos, dixítque eis: Surgite, et nolíte
    timére. Levántes autem óculos suos, néminem vidérunt nisi solum Jesum. Et
    descendéntibus illis de monte, præcépit eis Jesus, dicens: Némini dixéritis
    visiónem, donec Fílius hóminis a mórtuis resúrgat."
offertorium:
  - "!Ps 111:3"
  - "Glória et divítiæ in domo ejus: et justítia ejus manet in sǽculum sǽculi,
    allelúja."
secreta:
  - "Obláta, quǽsumus, Dómine, múnera gloriósa Unigéniti tui Transfiguratióne
    sanctífica: nosque a peccatórum máculis, splendóribus ipsíus illustratiónis
    emúnda."
  - $Per eundem
communio:
  - "!Matt 17:9"
  - Visiónem, quam vidístis, némini dixéritis, donec a mórtuis resúrgat Fílius
    hóminis.
postcommunio:
  - "Præsta, quǽsumus, omnípotens Deus: ut sacrosáncta Fílii tui
    Transfiguratiónis mystéria, quæ sollemni celebrámus offício, purificáta
    mentis intellegéntia consequámur."
  - $Per eundem
