oratio:
  - "Deus, cujus Unigénitus per vitam, mortem et resurrectiónem suam nobis
    salútis ætérnæ præmia comparávit: concéde, quǽsumus; ut, hæc mystéria
    sacratíssimo beátæ Maríæ Vírginis Rosário recoléntes, et imitémur, quod
    cóntinent, et quod promíttunt, assequámur."
  - $Per eundem
lectio:
  - Léctio libri Sapiéntiæ
  - "!Prov 8:22-24; 8:32-35"
  - "Dóminus possédit me in inítio viárum suárum, ántequam quidquam fáceret a
    princípio. Ab ætérno ordináta sum et ex antíquis, ántequam terra fíeret.
    Nondum erant abýssi, et ego jam concépta eram. Nunc ergo, fílii, audíte me:
    Beáti, qui custódiunt vias meas. Audíte disciplínam, et estóte sapiéntes, et
    nolíte abjícere eam. Beátus homo, qui audit me et qui vígilat ad fores meas
    cotídie, et obsérvat ad postes óstii mei. Qui me invénerit, invéniet vitam
    et háuriet salútem a Dómino."
graduale:
  - "!Ps 44:5; 44:11; 44:12"
  - Propter veritátem et mansuetúdinem et justítiam, et dedúcet te mirabíliter
    déxtera tua.
  - "V. Audi, fília, et vide, et inclína aurem tuam: quia concupívit Rex spéciem
    tuam."
  - Allelúja, allelúja.
  - V. Sollémnitas gloriósæ Vírginis Maríæ ex sémine Abrahæ, ortæ de tribu Juda,
    clara ex stirpe David. Allelúja.
evangelium:
