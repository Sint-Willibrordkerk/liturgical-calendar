offertorium:
  - "!Eccli 24:25; Eccli 39:17"
  - "In me grátia omnis viæ et veritátis, in me omnis spes vitæ et virtútis: ego
    quasi rosa plantáta super rivos aquárum fructificávi."
secreta:
  - "Fac nos, quǽsumus, Dómine, his munéribus offeréndis conveniénter aptári: et
    per sacratíssimi Rosárii mystéria sic vitam, passiónem et glóriam Unigéniti
    tui recólere; ut ejus digni promissiónibus efficiámur:"
  - $Qui tecum
communio:
  - "!Eccli 39:19"
  - Floréte, flores, quasi lílium, et date odórem, et frondéte in grátiam,
    collaudáte cánticum, et benedícite Dóminum in opéribus suis.
postcommunio:
  - "Sacratíssimæ Genetrícis tuæ, cujus Rosárium celebrámus, quǽsumus, Dómine,
    précibus adjuvémur: ut et mysteriórum, quæ cólimus, virtus percipiátur; et
    sacramentórum, quæ súmpsimus, obtineátur efféctus:"
  - $Qui vivis
