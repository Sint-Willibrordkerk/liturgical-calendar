lectio1:
  - De Libro Ecclesiástici
  - "!Sir 24:11-16"
  - 11 In ómnibus réquiem quæsívi, et in hereditáte Dómini morábor.
  - "12 Tunc præcépit, et dixit mihi Creátor ómnium: et, qui creávit me,
    requiévit in tabernáculo meo,"
  - "13 et dixit mihi: In Jacob inhábita, et in Israël hereditáre, et in eléctis
    meis mitte radíces."
  - 14 Ab inítio et ante sǽcula creáta sum, et usque ad futúrum sǽculum non
    désinam, et in habitatióne sancta coram ipso ministrávi.
  - 15 Et sic in Sion firmáta sum, et in civitáte sanctificáta simíliter
    requiévi, et in Jerúsalem potéstas mea.
  - 16 Et radicávi in pópulo honorificáto, et in parte Dei mei heréditas illíus,
    et in plenitúdine sanctórum deténtio mea.
responsory1:
  - "R. Súmite psaltérium jucúndum in insígni die solemnitátis vestræ:"
  - "* Et exsultáte Vírgini adjutríci nostræ."
  - "V. Cantáte ei cánticum novum: annuntiáte inter gentes glóriam ejus."
  - R. Et exsultáte Vírgini adjutríci nostræ.
lectio2:
  - "!Sir 24:17-22"
  - "17 Quasi cedrus exaltáta sum in Líbano, et quasi cypréssus in monte Sion:"
  - "18 quasi palma exaltáta sum in Cades, et quasi plantátio rosæ in Jericho:"
  - 19 quasi olíva speciósa in campis, et quasi plátanus exaltáta sum juxta
    aquam in platéis.
  - "20 Sicut cinnamómum et bálsamum aromatízans odórem dedi: quasi myrrha
    elécta, dedi suavitátem odóris;"
  - 21 et quasi storax, et gálbanus, et úngula, et gutta, et quasi Líbanus non
    incísus vaporávi habitatiónem meam, et quasi bálsamum non mixtum odor meus.
  - 22 Ego quasi terebínthus exténdi ramos meos, et rami mei honóris et grátiæ.
responsory2:
  - R. Vidi speciósam ascendéntem désuper rivos aquárum; cujus inæstimábilis
    odor erat nimis;
  - "* Et sicut dies verni circúmdabant eam flores rosárum et lília convállium."
  - V. Astitit Regína a dextris tuis in vestítu deauráto, circúmdata varietáte.
  - R. Et sicut dies verni circúmdabant eam flores rosárum et lília convállium.
lectio3:
  - "!Sir 24:24-31"
  - 24 Ego mater pulchræ dilectiónis, et timóris, et agnitiónis, et sanctæ spei.
  - 25 In me grátia omnis viæ et veritátis, in me omnis spes vitæ et virtútis.
  - 26 Transíte ad me, omnes qui concupíscitis me, et a generatiónibus meis
    implémini;
  - 27 spíritus enim meus super mel dulcis, et heréditas mea super mel et favum.
  - 28 Memória mea in generatiónes sæculórum.
  - 29 Qui edunt me, adhuc esúrient, et qui bíbunt me, adhuc sítient.
  - 30 Qui audit me non confundétur, et qui operántur in me non peccábunt.
  - 31 Qui elúcidant me, vitam ætérnam habébunt.
responsory3:
  - R. Quæ est ista quæ procéssit sicut sol, et formósa tamquam Jerúsalem?
    Vidérunt eam fíliæ Sion, et beátam dixérunt,
  - "* Et regínæ laudavérunt eam."
  - V. Et sicut dies verni circúmdabant eam flores rosárum et lília convállium.
  - R. Et regínæ laudavérunt eam.
  - "&Gloria"
  - R. Et regínæ laudavérunt eam.
lectio4:
  - Cum Albigénsium hǽresis per Tolosátium regiónem ímpie grassarétur, atque
    áltius in dies radíces ágeret, sanctus Domínicus, qui nuper Prædicatórum
    órdinis fundaménta jécerat, ad eam convelléndam totus incúbuit. Id ut
    præstáret valídius, auxílium beátæ Vírginis, cujus dígnitas illis erróribus
    impudentíssime petebátur, cuíque datum est cunctas hǽreses interímere in
    univérso mundo, eníxis précibus implorávit. A qua (ut memóriæ próditum est)
    cum mónitus esset ut Rosárium pópulis prædicáret, velut singuláre advérsus
    hǽreses ac vítia præsídium; mirum est quanto mentis fervóre et quam felíci
    succéssu injúnctum sibi munus sit exsecútus. Est autem Rosárium certa
    precándi fórmula, qua quíndecim angelicárum salutatiónum décades, oratióne
    Domínica interjécta, distínguimus, et ad eárum síngulas tótidem nostræ
    reparatiónis mystéria, pia meditatióne recólimus. Ex eo ergo témpore pius
    hic orándi modus mirabíliter per sanctum Domínicum promulgári augeríque
    cœpit. Quem ejúsdem institutórem auctorémque fuísse, summi Pontífices
    apostólicis lítteris passim affirmárunt.
responsory4:
  - "R. Tu glória Jerúsalem, tu lætítia Israël, tu honorificéntia pópuli nostri,
    fecísti viríliter:"
  - "* Quia cunctas hǽreses sola interemísti."
  - V. Pulchra es et decóra, terríbilis ut castrórum ácies ordináta.
  - R. Quia cunctas hǽreses sola interemísti.
lectio5:
  - Innumerábiles porro fructus ex hac tam salutári institutióne in christiánam
    rempúblicam dimanárunt. Inter quos victória illa mérito numerátur, quam
    sanctíssimus Póntifex Pius quintus et ab eo inflammáti christiáni príncipes
    apud Echínadas ínsulas de Turcárum tyránno potentíssimo reportárunt. Nam,
    cum illa ipsa die ea victória reláta sit, qua die sacratíssimi Rosárii
    sodalitátes per univérsum orbem consuétas supplicatiónes perágerent
    statutásque preces de more fúnderent, iis précibus haud immérito refértur
    accépta. Quod quidem cum étiam Gregórius tértius décimus testátus esset; ut
    pro tam singulári benefício beátæ Vírgini sub appellatióne Rosárii perénnes
    grátiæ ubíque terrárum haberéntur, in ecclésiis ómnibus, in quibus altáre
    Rosárii foret, Offícium, ritu dúplici majóri, perpétuo de eo celebrándum
    indíxit; aliíque Pontífices Rosárium recitántibus ejusdémque Rosárii
    sodalitátibus indulgéntias pene innúmeras concessére.
responsory5:
  - "R. Déxtera tua magnificáta est in fortitúdine, déxtera tua confrégit
    inimícos:"
  - "* Submérsi sunt in aquis veheméntibus, et opéruit eos mare."
  - V. Benedíxit te Dóminus in virtúte sua, quia per te ad níhilum redégit
    inimícos nostros.
  - R. Submérsi sunt in aquis veheméntibus, et opéruit eos mare.
lectio6:
  - Clemens vero undécimus, ánimo réputans insígnem páriter victóriam, anno
    millésimo septingentésimo décimo sexto in Hungáriæ regno a Cárolo sexto in
    imperatórem Romanórum elécto de innúmeris Turcárum cópiis relátam, eo die
    contigísse quo festum Dedicatiónis sanctæ Maríæ ad Nives celebrarétur, atque
    eódem ferme témpore quo sacratíssimi Rosárii confrátres públicam solemnémque
    supplicatiónem in alma Urbe, ingénti pópuli concúrsu magnáque religióne,
    peragéntes, férvidas ad Deum preces pro Turcárum depressióne fúnderent ac
    poténtem opem Deíparæ Vírginis in auxílium Christianórum humíliter
    implorárent; eam ob rem, victóriam illam, nec non liberátam paulo post
    eorúndem Turcárum obsidióne Corcyrénsem ínsulam, ejúsdem beátæ Vírginis
    patrocínio pie cénsuit adscribéndam. Quam ob rem ut hujus quoque tam
    insígnis benefícii perénnis semper et memória exstáret et grátia,
    sacratíssimi Rosárii festum eódem ritu celebrándum ad Ecclésiam univérsam
    exténdit. Hæc ómnia Benedíctus décimus tértius in Breviário Románo appóni
    jussit. Leo autem tértius décimus in turbulentíssimis Ecclésiæ tempóribus,
    diúque preméntium malórum sæva tempestáte, cunctos in orbe fidéles, iterátis
    apostólicis lítteris ad Mariális Rosárii, præsértim per octóbrem mensem,
    frequéntiam veheménter incéndit, aucto quoque ánnui festi solemnitátis ritu,
    additáque litaníis Lauretánis Regínæ sacratíssimi Rosárii invocatióne, et
    Offício de eádem solemnitáte próprio Ecclésiæ univérsæ concésso.
    Sanctíssimam ergo Dei Genetrícem cultu hoc eídem gratíssimo júgiter
    venerémur; ut, quæ tóties Christi fidélibus, Rosárii précibus exoráta,
    terrénos hostes profligáre dedit ac pérdere, inférnos páriter superáre
    concédat.
responsory6:
  - "R. Signum magnum appáruit in cælo: Múlier amícta sole, et luna sub pédibus
    ejus,"
  - "* Et in cápite ejus coróna stellárum duódecim."
  - V. Dábitur cápiti tuo augméntum gratiárum et coróna ínclita próteget te.
  - R. Et in cápite ejus coróna stellárum duódecim.
  - "&Gloria"
  - R. Et in cápite ejus coróna stellárum duódecim.
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 1:26-38"
  - "In illo témpore: Missus est Angelus Gábriel a Deo in civitátem Galilǽæ, cui
    nomen Názareth, ad Vírginem desponsátam viro, cui nomen erat Joseph, de domo
    David, et nomen Vírginis María. Et réliqua."
  - _
  - Homilía sancti Bernárdi Abbátis
  - "!Sermo de S. Maria"
  - Ad commendatiónem grátiæ suæ et ad destructiónem humánæ sapiéntiæ, Deus de
    fémina sed vírgine dignátus est carnem assúmere, ut símilem símili rédderet,
    contrárium contrário curáret, pestíferam spinam evélleret, peccáti
    chirógraphum potentíssime deléret. Heva spina fuit; María rosa éxstitit.
    Heva spina, vulnerándo; María rosa, ómnium afféctus mulcéndo. Heva spina,
    infígens ómnibus mortem; María rosa, reddens salutíferam ómnibus sortem.
    María rosa fuit cándida per virginitátem, rubicúnda per caritátem; cándida
    carne, rubicúnda mente; cándida virtútem sectándo, rubicúnda vítia calcándo;
    cándida afféctum purificándo, rubicúnda carnem mortificándo; cándida Deum
    diligéndo, rubicúnda próximo compatiéndo.
responsory7:
  - R. Ego quasi vitis fructificávi suavitátem odóris,
  - "* Et flores mei fructus honóris et honestátis."
  - V. Ego mater pulchræ dilectiónis, et timóris, et agnitiónis, et sanctæ spei.
  - R. Et flores mei fructus honóris et honestátis.
lectio8_1:
  - "!Sermo de Aquæductu"
  - Verbum caro factum est, et hábitat jam in nobis. Hábitat in memória nostra,
    hábitat in cogitatióne, quia usque ad ipsam descéndit imaginatiónem. Quonam
    modo, inquis? Nimírum jacens in præsépio, in virgináli grémio cubans, in
    monte prǽdicans, in oratióne pernóctans, in cruce pendens, in morte pallens,
    liber inter mórtuos et in inférno ímperans, seu étiam tértia die resúrgens,
    et Apóstolis loca clavórum, victóriæ signa, demónstrans, novíssime coram eis
    cæli secréta conscéndens. Quid horum non vere, non pie, non sancte
    cogitátur?
lectio8_2:
  - Quidquid horum cógito, Deum cógito; et per ómnia est Deus meus. Hæc ego
    meditári dixi sapiéntiam, et prudéntiam judicávi eructáre memóriam
    suavitátis; quóniam in hujuscémodi núcleis virga sacerdotális copiósa
    prodúxit, quam, in supérnis háuriens, ubérius nobis María refúdit. In
    supérnis plane et ultra Angelos, quæ Verbum ex ipso Patris corde suscépit.
