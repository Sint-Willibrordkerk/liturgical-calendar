oratio:
  - "Deus, qui cónspicis, quia ex nulla nostra virtúte subsístimus: concéde
    propítius; ut, intercessióne beáti Martíni Confessóris tui atque Pontíficis,
    contra ómnia advérsa muniámur."
  - $Per Dominum
lectio:
  - "@Commune/C4"
graduale:
  - "!Eccli 44:16"
  - Ecce sacérdos magnus, qui in diébus suis plácuit Deo.
  - "!Eccli 44:20"
  - Non est invéntus símilis illi, qui conserváret legem Excelsi.
  - Allelúja, allelúja.
  - "V. Beátus vir, sanctus Martínus, urbis Turónis Epíscopus, requiévit: quem
    suscéperunt Angeli atque Archángeli, Throni, Dominatiónes et Virtútes.
    Allelúja."
gradualep:
  - Allelúja, allelúja.
  - "V. Beátus vir, sanctus Martinus, urbis Turónis Epíscopus, requiévit: quem
    suscéperunt Angeli atque Archángeli, Throni, Dominatiónes et Virtútes.
    Allelúja."
  - V. Hic est sacérdos, quem coronávit Dóminus. Allelúja.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 11:33-36"
  - "In illo témpore: Dixit Jesus discípulis suis: Nemo lucérnam accéndit, et in
    abscóndito ponit, neque sub módio: sed supra candelábrum, ut, qui
    ingrediúntur, lumen vídeant. Lucérna córporis tui est óculus tuus. Si óculus
    tuus fúerit simplex, totum corpus tuum lúcidum erit: si autem nequam fúerit,
    étiam corpus tuum tenebrósum erit. Vide ergo, ne lumen, quod in te est,
    ténebræ sint. Si ergo corpus tuum totum lúcidum fúerit, non habens áliquam
    partem tenebrárum, erit lúcidum totum, et sicut lucérna fulgóris illuminábit
    te."
offertorium:
  - "@Commune/C2"
secreta:
  - "Sanctífica, quǽsumus, Dómine Deus, hæc múnera, quæ in sollemnitáte sancti
    Antístitis tui Martíni offérimus: ut per ea vita nostra inter advérsa et
    próspera ubíque dirigátur."
  - $Per Dominum
communio:
  - "@Commune/C4-1"
postcommunio:
  - "Præsta, quǽsumus, Dómine, Deus noster: ut, quorum festivitáte votíva sunt
    sacraménta, eórum intercessióne salutária nobis reddántur."
  - $Per Dominum
