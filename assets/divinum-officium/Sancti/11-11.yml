rubrica-cisterciensis/ant-2:
  - O quantus luctus ómnium! * quanta præcípue laménta Monachórum, et Vírginum!
    quia et pium est gaudére Martíno et pium est flere Martínum.
ant-vespera-3:
  - "@:Ant Laudes"
ant-3:
  - O beátum Pontíficem, * qui totis viscéribus diligébat Christum Regem, et non
    formidábat impérii principátum! o sanctíssima ánima, quam etsi gládius
    persecutóris non ábstulit, palmam tamen martýrii non amísit!
