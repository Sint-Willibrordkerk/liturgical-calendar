rubrica-cisterciensis/ant-vespera:
  - "@:Ant Laudes"
ant-1:
  - "O beátum virum, * cujus ánima paradísum póssidet! Unde exsúltant Ángeli,
    lætántur Archángeli, chorus Sanctórum proclámat, turba Vírginum invítat:
    Mane nobíscum in ætérnum."
invit:
  - Laudémus Deum nostrum * In confessióne beáti Martíni.
ant-matutinum:
  - Martínus, * adhuc catechúmenus, hac me veste contéxit.;;1
  - Sanctæ Trinitátis * fidem Martínus conféssus est, et baptísmi grátiam
    percépit.;;2
  - Ego signo crucis, * non clípeo protéctus, aut gálea, hóstium cúneos
    penetrábo secúrus.;;3
  - Confído in Dómino * quod fília mea, précibus tuis, reddénda sit sanitáti.;;4
  - Tetrádius, * cógnita Dei virtúte, ad baptísmi grátiam pervénit.;;5
  - O ineffábilem virum, * per quem nobis tanta mirácula corúscant!;;8
  - Dóminus Jesus Christus, * non purpurátum aut diadémate reniténtem, se
    ventúrum esse prædíxit.;;10
  - Sacérdos Dei, Martíne, * apérti sunt tibi cæli et regnum Patris mei.;;14
  - Sacérdos Dei, Martíne, * pastor egrégie, ora pro nobis Deum.;;20
lectio1:
  - "@Commune/C4:Lectio1"
responsory1:
  - R. Hic est Martínus, eléctus Dei Póntifex, cui Dóminus post Apóstolos tantam
    grátiam conférre dignátus est,
  - "* Ut in virtúte Trinitátis Deíficæ mererétur fíeri trium mortuórum
    suscitátor magníficus."
  - V. Sanctæ Trinitátis fidem Martínus conféssus est.
  - R. Ut in virtúte Trinitátis Deíficæ mererétur fíeri trium mortuórum
    suscitátor magníficus.
lectio2:
  - "@Commune/C4:Lectio2"
responsory2:
  - "R. Dómine, si adhuc pópulo tuo sum necessárius, non recúso subíre propter
    eos labórem:"
  - "* Fiat volúntas tua."
  - V. Oculis ac mánibus in cælum semper inténtus, invíctum ab oratióne spíritum
    non relaxábat.
  - R. Fiat volúntas tua.
lectio3:
  - "@Commune/C4:Lectio3"
responsory3:
  - R. O beátum virum Martínum antístitem,
  - "* Qui nec mori tímuit, nec vívere recusávit!"
  - "V. Dómine, si adhuc pópulo tuo sum necessárius, non recúso labórem: fiat
    volúntas tua."
  - R. Qui nec mori tímuit, nec vívere recusávit!
  - "&Gloria"
  - R. Qui nec mori tímuit, nec vívere recusávit!
lectio4:
  - "Martínus, Sabáriæ in Pannónia natus, cum décimum attigísset annum, invítis
    paréntibus ad ecclésiam confúgiens, in catechumenórum númerum adscríbi
    vóluit. Quíndecim annos natus in milítiam proféctus, primum in Constántii,
    deínde Juliáni exércitu militávit. Qui, cum nihil habéret præter arma et
    vestiméntum quo tegebátur, Ambiáni, páuperi ac nudo, ab eo peténti ut
    Christi nómine sibi eleemósynam tribúeret, partem chlámydis dedit. Cui
    sequénti nocte Christus, dimidiáta illa veste indútus, appáruit, hanc
    mittens vocem: Martínus catechúmenus hac me veste contéxit."
responsory4:
  - R. Oculis ac mánibus in cælum semper inténtus,
  - "* Invíctum ab oratióne spíritum non relaxábat."
  - V. Dum sacraménta offérret beátus Martínus, globus ígneus appáruit super
    caput ejus.
  - R. Invíctum ab oratióne spíritum non relaxábat.
lectio5:
  - "Decem et octo annos cum habéret, baptizátus est. Quare, relícta militári
    vita, ad Hilárium Pictaviénsem epíscopum se cóntulit, a quo in acolythórum
    númerum redáctus est. Post, factus epíscopus Turonénsis, monastérium
    ædificávit, ubi cum octogínta mónachis sanctíssime aliquámdiu vixit. Qui,
    cum póstea ad Candacénsem vicum suæ diœcésis in gravem febrim incidísset,
    assídua Deum oratióne precabátur, ut se ex illo mortáli cárcere liberáret.
    Quem audiéntes discípuli, sic rogábant: Cur nos, pater déseris? cui nos
    míseros derelínquis? Quorum voce commótus Martínus, ita Deum orábat: Dómine,
    si adhuc pópulo tuo sum necessárius, non recúso labórem."
responsory5:
  - R. Beátus Martínus óbitum suum longe ante præscívit, dixítque frátribus,
  - "* Dissolutiónem sui córporis imminére, quia judicábat se jam resólvi."
  - V. Víribus córporis cœpit repénte destítui, convocatísque discípulis dixit.
  - R. Dissolutiónem sui córporis imminére, quia judicábat se jam resólvi.
lectio6:
  - Sed, cum eum in illa veheménti febre supínum orántem vidérent discípuli,
    supplíciter ab eo petiérunt, ut, convérso córpore, tantísper, dum remítteret
    morbi vis, pronus conquiésceret. Quibus Martínus, Sínite me, inquit, cælum
    pótius quam terram aspícere, ut, suo jam itínere itúrus ad Dóminum, spíritus
    dirigátur. Instánte jam morte, viso humáni géneris hoste, Quid, inquit,
    astas, cruénta béstia? nihil in me funéste repéries. Ea in voce, unum et
    octogínta annos natus, ánimam Deo réddidit; quam Angelórum chorus excépit,
    eósque divínas canéntes laudes multi, in primísque sanctus Severínus
    Coloniénsis epíscopus, audiérunt.
responsory6:
  - "R. Dixérunt discípuli ad beátum Martínum: Cur nos, pater, déseris, aut cui
    nos desolátos relínquis?"
  - "* Invádent enim gregem tuum lupi rapáces."
  - "V. Scimus quidem desideráre te Christum, sed salva sunt tibi tua prǽmia:
    nostri pótius miserére, quos déseris."
  - R. Invádent enim gregem tuum lupi rapáces.
  - "&Gloria"
  - R. Invádent enim gregem tuum lupi rapáces.
lectio94:
  - "Martínus, Sabáriæ in Pannónia natus, cum décimum attigísset annum, invítis
    paréntibus ad ecclésiam confúgiens, in catechumenórum númerum adscríbi
    vóluit. Aduléscens quíndecim annórum in milítiam proféctus, primum in
    Constántii, deínde Juliáni exércitu militávit. Decem et octo annos natus,
    cum Ambiáni partem clámydis cuídam páuperi donásset, mira exínde Jesu
    Christi apparitióne recreátus, álacri ánimo baptísmum suscépit; tum, relícta
    militári vita, ab Hilário Pictaviénsi epíscopo in acolythórum númerum est
    recéptus. Póstea factus epíscopus Turonénsis, monastérium ædificávit, ubi
    cum octogínta mónachis sanctíssime aliquámdiu vixit. Qui, cum ad Candacénsem
    vicum suæ diœcésis in gravem febrim incidísset, suórum miserátus
    discipulórum, sic Deum rogábat: Dómine, si adhuc pópulo tuo sum necessárius,
    non recúso labórem. Mox instánte jam morte, viso humáni géneris hoste, Quid,
    inquit, astas, cruénta béstia? nihil in me funéste repéries. Ea in voce,
    unum et octogínta annos natus, multis miráculis gloriósus, ánimam Deo
    réddidit."
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 11:33-36"
  - "In illo témpore: Dixit Jesus discípulis suis: Nemo lucérnam accéndit et in
    abscóndito ponit neque sub módio, sed supra candelábrum, ut qui
    ingrediúntur, lumen vídeant. Et réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Liber 7 Comment. in Luc. cap. 11, post initium"
  - "Quia in superióribus Ecclésiam Synagógæ prǽtulit, hortátur nos ut fidem
    pótius nostram ad Ecclésiam transferámus. Lucérna enim fides est, juxta quod
    scriptum est: Lucérna pédibus meis verbum tuum, Dómine. Verbum enim Dei
    fides nostra est; Verbum Dei lux est; Lucérna est fides: Erat Lux vera, quæ
    illúminat omnem hóminem veniéntem in hunc mundum. Lucérna autem lucére non
    potest, nisi aliúnde lumen accéperit."
responsory7:
  - R. O beátum virum, in cujus tránsitu Sanctórum canit númerus, Angelórum
    exsúltat chorus,
  - "* Omniúmque cæléstium Virtútum occúrrit psalléntium exércitus!"
  - V. Ecclésia virtúte roborátur, sacerdótes Dei revelatióne glorificántur,
    quem Michaël assúmpsit cum Ángelis.
  - R. Omniúmque cæléstium Virtútum occúrrit psalléntium exércitus!
lectio8:
  - Hæc est Lucérna quæ accénditur, virtus scílicet nostræ mentis et sensus, ut
    drachma illa possit, quæ períerat, reperíri. Nemo ergo fidem sub lege
    constítuat; lex enim intra mensúram est, ultra mensúram grátia; lex
    obúmbrat, grátia claríficat. Et ídeo nemo fidem suam intra mensúram legis
    inclúdat, sed ad Ecclésiam cónferat, in qua septifórmis Spíritus relúcet
    grátia, quam Princeps ille sacerdótum fulgóre supérnæ divinitátis illúminat,
    ne eam legis umbra restínguat. Dénique lucérna illa, quam matutínis
    vespertinísque tempóribus, ritu véteri Judæórum, princeps sacerdótum solébat
    accéndere, velut sub módio sita legis, evánuit; et cívitas illa Jerúsalem
    quæ in terris est, quæ occídit prophétas, quasi in conválle fletus pósita
    delitéscit. Illa autem Jerúsalem quæ in cælo est, in qua mílitat fides
    nostra, in illo altíssimo ómnium locáta monte, hoc est Christo, non potest
    ténebris et ruínis hujus mundi abscóndi; sed fulgens candóre Solis ætérni,
    luce nos grátiæ spiritális illúminat.
responsory8:
  - "R. Martínus Ábrahæ sinu lætus excípitur: Martínus, hic pauper et módicus,"
  - "* Cælum dives ingréditur, hymnis cæléstibus honorátur."
  - "V. Martínus epíscopus migrávit a sǽculo: vivit in Christo gemma sacerdótum."
  - R. Cælum dives ingréditur, hymnis cæléstibus honorátur.
  - "&Gloria"
  - R. Cælum dives ingréditur, hymnis cæléstibus honorátur.
