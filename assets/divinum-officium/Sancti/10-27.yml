officium:
  - In Vigilia Ss. Simonis et Judæ Ap.
rank:
  - ""
  - Vigilia
  - "1.5"
  - "@C1v"
introitus:
  - "@Commune/C3"
oratio:
  - "Concede, quǽsumus, omnípotens Deus: ut, sicut Apostolórum tuórum Simónis et
    Judæ gloriósa natalícia prævenimus; sic ad tua benefícia promerenda,
    majestátem tuam pro nobis ipsi præveniant."
  - $Per Dominum
lectio:
  - "@Commune/C5-1"
graduale:
  - "!Ps 78:10; 78:2"
  - Vindíca, Dómine, sánguinem Sanctórum tuórum, qui effúsus est.
  - "V. Posuérunt mortália servórum tuórum, Dómine, escas volatílibus cœli:
    carnes Sanctórum tuórum béstiis terræ."
evangelium:
  - "@Commune/C2ap"
offertorium:
  - "@Commune/C3a"
secreta:
  - "Munéribus nostris, Dómine, sanctórum Apostolórum tuórum Simónis et Judæ
    festa præcédimus: te supplíciter deprecántes; ut, quæ consciéntiæ nostræ
    præpediúntur obstáculis, illórum méritis grata reddántur."
  - $Per Dominum
communio:
  - "@Sancti/06-12o"
postcommunio:
  - "Sumpto, Dómine, sacraménto, supplíciter deprecámur: ut, intercedéntibus
    beátis Apóstolis tuis Simóne et Juda, quod temporáliter gérimus, ad vitam
    capiámus ætérnam."
  - $Per Dominum
rule:
  - ex C1v;
  - Responsory Feria
  - Preces feriales
  - Versum Feria
  - no Te Deum
  - Laudes 2
  - no Gloria
  - Suffragium=Maria3;Papa;Ecclesia;;
lectio1:
