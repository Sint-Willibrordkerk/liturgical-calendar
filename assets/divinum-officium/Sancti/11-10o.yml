lectio93:
  - Tryphon, Decio imperatóre, cum Jesu Christi fidem prædicans, omnes ad ejus
    cultum perducere conarétur, a Decii satellítibus comprehénsus, primum
    equuleo torquétur et ungulis férreis excarnificátur; deínde, sublimibus
    pédibus candéntibus clavis confíxus, fustibus cæditur, et, admotis facibus
    ardéntibus, aduritur. Quæ cum ómnia fortiter ferentem vidísset Respicius
    tribunus, ad Christi Dómini fidem convérsus, statim se christianum esse
    palam proféssus est. Qui, varie cruciatus, una cum Tryphone rapitur ad Jovis
    simulacrum; quæ statua, Tryphone orante, cóncidit. Quare plumbátis
    crudelíssime contúsi, nobilíssimum martyrium consecúti sunt quarto Idus
    Novembris. Eodem die virgo quædam, cui nomen Nympha, cum Jesum Christum
    verum esse Deum clara voce testarétur, martyrii palmam ad virginitátis
    corónam adjunxit.
  - "&teDeum"
