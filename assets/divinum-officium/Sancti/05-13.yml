graduale:
  - "!Eccli 44:16"
  - Ecce sacérdos magnus, qui in diébus suis plácuit Deo.
  - "!Eccli 44:20"
  - Non est invéntus símilis illi, qui conserváret legem Excélsi. Allelúja,
    allelúja.
  - V. Qui ad justítiam erúdiunt multos quasi stellæ in perpétuas æternitátes.
    Allelúja.
gradualep:
  - Allelúja, allelúja.
  - V. Qui docti fúerint fulgébunt quasi splendor firmaménti. Allelúja.
  - V. Qui ad justítiam erúdiunt multos quasi stellæ in perpétuas æternitátes.
    Allelúja.
tractus:
  - "!Ps 91:2; 91:3; 91:5"
  - "Bonum est confitéri Dómino: et psállere nómini tuo, Altíssime."
  - V. Ad annuntiándum mane misericórdiam tuam, et veritátem tuam per noctem.
  - V. Quia delectásti me, Dómine, in factúra tua, et in opéribus mánuum tuárum
    exsultábo.
offertorium:
  - "!Ps 72:28"
  - "Mihi autem adhærére Deo bonum est, pónere in Dómino Deo spem meam: ut
    annúntiem omnes prædicatiónes tuas in portis fíliæ Sion, allelúja."
secreta:
  - "Hóstias tibi, Dómine, in odórem suavitátis offérimus: et præsta; ut, beáti
    Robérti mónitis et exémplis edócti, per sémitam mandatórum tuórum dilatáto
    corde currámus."
  - $Per Dominum.
communio:
  - "!Matt 5:14; 5:16"
  - "Vos estis lux mundi: sic lúceat lux vestra coram homínibus, ut vídeant
    ópera vestra bona, et gloríficent Patrem vestrum qui in cœlis est,
    allelúja."
postcommunio:
  - "Sacraménta, quæ súmpsimus, Dómine Deus noster, in nobis fóveant caritátis
    ardórem: quo beátus Robértus veheménter accénsus, pro Ecclésia tua se
    júgiter impendébat."
  - $Per Dominum
