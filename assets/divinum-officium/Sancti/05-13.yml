lectio4:
  - Robertus, Politianus, e patrícia Bellarminórum gente, matrem pientíssimam
    hábuit Cynthiam Cervini, Marcelli Papæ secúndi sorórem. Eximia pietáte et
    castíssimis móribus quamprimum enituit, id unum exoptans, ut Deo soli
    placeret et ánimas Christo lucrifáceret. Patrium Societátis Jesu collegium
    summa cum ingenii et modestiæ laude frequentávit; ac duodeviginti annos
    natus, Romæ eamdem Societátem ingréssus, religiosárum virtútum ómnibus
    exemplo fuit. Emenso in Romano Collegio philosophíæ curriculo, missus est
    primum Floréntiam, tum Montem Regalem; deínde Patavium ad sacram theologíam
    addiscéndam, ac póstea Lovanium, ubi concionatoris munere, nondum sacerdos,
    mirifice functus est. Lovanii præterea, sacerdotio auctus, theologíam ita
    docuit, ut plurimos hæreticos ad Ecclésiæ unitátem reduxerit, ac theologus
    per Europam claríssimus haberétur, eumque Sanctus Cárolus Mediolanénsis
    epíscopus aliique veheménter sibi expéterent.
lectio5:
  - "Romam ex desidério Gregórii Papæ décimi tertii revocatus, theologicam
    controversiárum disciplínam trádidit in Collegio Romano: ibique vitæ
    spiritualis magister constitútus, angelicum juvenem Aloísium per sanctitátis
    sémitas moderátus est. Ipse Collegium Romanum ac deínde Neapolitanam
    Societátis Jesu Provinciam ad Sancti Ignatii mentem gubernávit. In Urbem
    íterum accersítus, a Cleménte octavo ad summa Ecclésiæ negotia, máximo cum
    christianæ rei emolumento, est adhibitus: tum invitus et frustra reluctans,
    in Cardinalium númerum cooptátus quia, ut palam asseruit ipse Pontifex, tunc
    non habebat parem Ecclésia Dei quod ad doctrinam. Ab eodem Pontifice
    consecrátus Epíscopus, Capuanam Archidiœcésim triennium sanctíssime
    administrávit: quo munere deposito, Romæ ad mortem usque degit, integerrimus
    ac fidelíssimus Summi Pontificis consiliarius. Multa præcláre scripsit,
    illud meritum adeptus in primis quod, sanctum Thomam ducem et magistrum
    secutus, de suórum necessitate témporum próvide cónscius, invicto doctrinæ
    róbore et amplíssima testimoniórum copia e Sacris Litteris et e Sanctórum
    Patrum ditíssimo fonte apte deprompta novos erróres debellávit, traditiónis
    catholicæ et Romani Pontificátus jurium strenuus præprimis adsertor.
    Complúribus étiam ad pietátem fovéndam libellis exstat insígnis ac præsertim
    aureo catechismo, quem licet aliis gravíssimis negotiis distentus, tum Capuæ
    tum Romæ púeros ac rudes docére non prætermittebat. Robertum æquævus
    Cardinalis a Deo missum judicávit, qui catholicos erudíret, pios cóleret,
    hæreticos profligaret; Sanctus Franciscus Salesius doctrinæ fontem hábuit;
    Summus Pontifex Benedíctus décimus quartus hæreticórum malleum dixit, ac
    Benedíctus décimus quintus catholicam religiónem propagántibus et tuéntibus
    exemplar indicávit."
lectio6:
  - "Vitæ religiosæ studiosíssimus, eam, inter purpuratos Patres adlectus, in
    exemplum servávit. Opes ultra necessarias nóluit; módico famulatu, ténui
    cultu habituque contentus: suórum non studuit opuléntiæ, ac vix adduci
    pótuit ut inópiam idéntidem levaret. De se humillime sensit, et mira fuit
    animi simplicitate. Deíparam diléxit unice: plures horas quotídie oratióni
    tribuebat. Parcíssime víctitans, ter in hebdomada jejunábat: in se
    constanter austérus, caritate in próximum flagrávit, vocátus sæpenúmero
    Pater páuperum. E baptismate innocéntiam ne vel levi quidem culpa macularet
    strenue contendit. Prope octogenarius, ad Sancti Andréæ in Colle Quirinali,
    extremem in morbum íncidit, quem sólito virtútum fulgóre illustrávit.
    Moribundo Gregórius Papa décimus quintus et plures Cardinales adstitérunt,
    tantum Ecclésiæ cólumen éripi complorantes. Die sacrórum Stígmatum sancti
    Francisci, quorum memóriæ ubíque celebrandæ auctor fuerat, obdormívit in
    Dómino, anno millesimo sexcentésimo vigesimo primo. Mortuo tota cívitas
    parentávit, Sanctum uno ore conclámans. Eum vero Pius undecimus, Pontifex
    maximus, Beatórum primum ac deínde Sanctórum número adscripsit, et paulo
    post, ex Sacrórum Rituum Congregatiónis consulto, universalis Ecclésiæ
    Doctórem declarávit. Ejus corpus Romæ in templo Sancti Ignatii, apud
    sepúlcrum Sancti Aloísii, ut ipse optarat, pia veneratióne cólitur."
lectio94:
  - Robértus, Politiánus, e patrícia Bellarminórum gente, matrem pientíssimam
    hábuit Cýnthiam Cervíni, Marcélli Papæ secúndi sorórem. Exímia pietáte et
    castíssimis móribus ornátus, duodevigínti annórum adoléscens Societátem Jesu
    Romæ ingréssus est, in eáque, ad mortem usque religiosárum virtútum ómnibus
    exémplo fuit. Post philosophíæ currículum Floréntiam primum missus, tum
    Montem Regálem, Patávium et Lovánium, magístri et concionatóris múnere,
    nondum sacérdos, mirífice functus est. Lovánii prætérea, sacerdótio auctus,
    theologíam ita dócuit, ut theólogus per Európam claríssimus jam tum
    haberétur. Romam revocátus, theológicam controversiárum disciplínam in
    Collégio Románo trádidit, ubi étiam, vitæ spirituális magíster constitútus,
    angélicum júvenem Aloísium per sanctitátis sémitas moderátus est. A Cleménte
    Papa octávo, frustra relúctans, in Patrum Cardinálium númerum cooptátus, et
    paulo post consecrátus Epíscopus, Capuánam Archidiœcésim triénnium
    sanctíssime rexit; quo múnere depósito, integérrimus ac fidelíssimus Summi
    Pontíficis consiliárius in Urbe degit, usque dum, prope octogenárius, die
    décima séptima Septémbris, anno millésimo sexcentésimo vigésimo primo pie in
    Dómino quiévit. Præter Controversiárum volúmina multa ália præcláre
    scripsit, inter quæ áureus catechésis libéllus exstat insígnis. Fortíssimum
    hunc cathólicæ veritátis propugnatórem Pius undécimus Póntifex Máximus in
    Sanctórum númerum rétulit atque universális Ecclésiæ Doctórem declarávit.
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 5:13-19"
  - "In illo témpore: Dixit Jesus discípulis suis: Vos estis sal terræ. Quod si
    sal evanúerit, in quo saliétur? Et réliqua."
  - _
  - Homilía sancti Roberti Bellarmino Epíscopi
  - "!Concio 9, de probitate Doctórum Ecclésiæ; ab initio"
  - Quemádmodum in Deo, quem unum in Trinitáte et Trinum in unitate veneramur,
    tria quædam singuláriter eminent, poténtia, sapiéntia, bonitas; ita quoque,
    auditores, singulares amicos et fílios suos, Patres ac Doctores nostros,
    Deus, ut sibi quam simillimos et géntibus ómnibus suspiciéndos atque
    admirábiles redderet, potentíssimos, sapientíssimos, optimos sanctissimósque
    esse vóluit. Primum ea poténtia eos armávit, qua multa præter sólitum cursum
    ordinemque natúræ in elementis, in arbóribus, in brutis animántibus, in
    ipsis homínibus plane admirabília et singularia fácerent. Deínde sapiéntia
    ita mentes eórum instruxit, ut non solum præséntia et prætérita cernerent,
    sed étiam futura multo ante prævidérent atque prædícerent. Postremo
    dilatávit corda eórum summa atque ardentíssima caritate, tum ut ipsi magno
    animo opus aggrederéntur, tum ut ii qui converténdi per eos erant, non solum
    verbis et miraculis, sed étiam exemplis et vitæ probitate moverentur.
lectio8:
  - Prædicatores ígitur nostræ legis, tam ii qui primi ad nos fidem detulérunt
    et Evangélium, quam ii quos deínde singulis sæculis Deus excitávit ad fidem
    eamdem confírmandam vel propagandam, quales fúerint, quam pii, quam justi,
    quam religiosi totus mundus novit. Aspicite primum Apóstolos. Quid sublimius
    atque excellentius móribus Apostolicis? Aspicite deínde sanctos illos
    hómines, quos Patres et Doctores vocamus, lúmina illa claríssima, quæ Deus
    in firmaménto Ecclésiæ lucére vóluit, ut iis omnes hæreticórum ténebræ,
    dissiparéntur, ut Irenæum, Cyprianum, Hilárium, Athanasium, Basilíum, duos
    Gregórios, Ambrósium, Hierónymum, Augustínum, Chrysóstomum, Cyríllum. Vita
    et mores eórum nonne in iis monuméntis, quæ nobis reliquérunt, quasi in
    speculis quibusdam elucent? Nam ex abundántia cordis os lóquitur.
lectio9:
  - "Quanta, óbsecro, apparet in libris Sanctórum Patrum cum summa eruditióne
    conjuncta humilitas? Quanta sobrietas? Nihil ibi obscenum, nihil turpe,
    nihil súbdolum, nihil arrogans, nihil inflátum. Quam multis modis Spíritus
    Sanctus, qui eórum péctora inhabitabat, in páginis eórum se prodit? Quis
    legere potest atténte Cyprianum, qui non statim ardeat amóre martyrii? Quis
    in Augustino diligenter versátus est, qui non profundíssimam didicerit
    humilitátem? Quis Hieronymum sæpe evolvit, qui non virginitátem et jejunium
    adamare incipiat? Spirant scripta Sanctórum religiónem, castitátem,
    integritátem, caritátem. Isti sunt ígitur epíscopi et pastores (ut verbis
    utar divi Augustíni) docti, graves, sancti, veritátis acerrimi defensores,
    qui catholicam fidem in lacte suxérunt, in cibo sumpsérunt: cujus lac et
    cibum parvis magnisque ministravérunt. Tálibus post Apóstolos sancta
    Ecclésia plantatóribus, rigatóribus, ædificatóribus, pastóribus,
    nutritóribus crevit."
  - "&teDeum"
