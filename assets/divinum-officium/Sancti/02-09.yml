oratio:
  - "Deus, qui beátum Cyríllum Confessórem tuum atque Pontíficem divínæ
    maternitátis beatíssimæ Vírginis Maríæ assertórem invíctum effecísti:
    concéde, ipso intercedénte; ut, qui vere eam Genetrícem Dei crédimus,
    matérna eíusdem protectióne salvémur."
  - $Per eundem
secreta:
  - "Múnera nostra, omnípotens Deus, benígnus réspice: et, intercedénte beáto
    Cyríllo, præsta; ut unigénitum tuum Jesum Christum, Dóminum nostrum in tua
    tecum glória coætérnum, in córdibus nostris digne suscípere mereámur:"
  - $Qui tecum
postcommunio:
  - "Divínis, Dómine, refécti mystériis, te súpplices deprecámur: ut, exémplis
    et méritis beáti Cyrílli Pontíficis adjúti, sanctíssimæ Genetríci Unigéniti
    tui digne famulári valeámus:"
  - $Qui tecum
