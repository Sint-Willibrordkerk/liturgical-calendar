lectio4:
  - "Cyríllus Alexandrínus, cujus præcónia non uníus tantum vel altérius sunt
    comprobáta testimónio, sed étiam œcumenicórum conciliórum Ephesíni et
    Chalcedonénsis actis celebráta, claris ortus paréntibus, ac Theóphili
    epíscopi Alexandríni nepos, adhuc adoléscens præcelléntis ingénii clara
    specímina dedit. Lítteris ac sciéntiis egrégie imbútus, ad Joánnem
    epíscopum, Jerosolymitánum se cóntulit, ut in Christiána fide perficerétur.
    Alexandríam deínde cum rediísset, Theóphilo vita functo, ad illíus sedem
    evéctus est: quo in múnere ita óptimi pastóris formam ab Apóstolo definítam
    constánter præ se tulit, ut sanctíssimi præsulis glóriam mérito sit
    adéptus."
lectio5:
  - Salútis animárum zelo incénsus curas omnes inténdit, ut sibi commíssum
    gregem in fídei et morum integritáte serváret, atque a venenátis infidélium
    et hæreticórum páscuis defénderet. Hinc tum Nováti ásseclas e civitáte
    expélli, tum Judæos, qui furóre acti in cædem Christianórum conspiráverant,
    juxta leges puníri satégit. Singuláre vero Cyrílli pro cathólicæ fídei
    incolumitáte enítuit stúdium contra Nestórium Constantinopolitánum
    epíscopum, asseréntem Jesum Christum ex María Vírgine hóminem tantum et non
    Deum natum, eíque divinitátem pro méritis esse collátam; cujus emendatiónem
    cum frustra tentásset, eum sancto Cælestíno Pontífici máximo denuntiávit.
lectio6:
  - Cælestíni delegáta auctoritáte, concílio Ephesíno præfuit, in quo hæresis
    Nestoriána pénitus proscrípta est, damnátus Nestórius et a sua Sede
    dejéctus, ac dogma cathólicum de una in Christo eáque divína persóna, et
    divína gloriósæ Vírginis Maríæ maternitáte assértum; plaudénte pópulo
    univérso, qui incredíbili gáudio géstiens, collucéntibus fácibus domum
    dedúxit epíscopus. Sed hac de causa Cyríllus calúmniis, injúriis et
    persecutiónibus, plúrimis a Nestório ejúsque fautóribus impetítus fuit; quas
    ipse patientíssime tulit, ita ut, de sola fide sollícitus, quidquid advérsus
    eum effutiébant ac moliebántur hærétici, pro níhilo habéret. Tandem pro
    Ecclésia Dei máximis perfúnctus labóribus, plurimísque scriptis éditis tum
    ad éthnicos et hæréticos confutándos, tum ad sacras Scriptúras et cathólica
    explanánda dógmata, sancto fine quiévit anno quadringentésimo quadragésimo
    quarto, episcopátus trigésimo secúndo. Leo décimus tértius Póntifex máximus
    Offícium et Missam præclaríssimi hujus fídei cathólicæ propugnatóris et
    Orientális ecclésiæ lúminis, ad Ecclésiam univérsam exténdit.
lectio94:
  - Cyríllus Alexandrínus, Theóphili epíscopi Alexandríni nepos, étiam
    adoléscens præcelléntis ingénii specímina dedit. Theóphilo vita functo, ad
    illíus sedem evéctus, et factus forma gregis ex ánimo, óptimi pastóris
    glóriam adéptus est. Singuláre ejus pro cathólicæ fídei incolumitáte stúdium
    enítuit contra Nestórium Constantinopolitánum epíscopum, asseréntem Jesum
    Christum ex María Vírgine hóminem tantum et non Deum natum, eíque
    divinitátem pro méritis esse collátam; cujus emendatiónem cum frustra
    tentásset, eum sancto Cælestíno Papæ denuntiávit. Hujus Pontíficis delegáta
    auctoritáte, nonnúllis sessiónibus prǽfuit Concílii Ephesíni, in quo hǽresis
    Nestoriána pénitus proscrípta est, damnátus Nestórius et a sua Sede
    dejéctus, ac dogma cathólicum de una in Christo eáque divína persóna, et
    divína gloriósæ Vírginis Maríæ maternitáte assértum. De sola fide
    sollícitus, et proptérea plura perpéssus, máximis pro Ecclésia Dei
    perfúnctus labóribus, plurimísque scriptis éditis, sancto fine quiévit, anno
    quadringentésimo quadragésimo quarto, episcopátus trigésimo secúndo.
  - "&teDeum"
