oratio:
  - "Omnípotens et miséricors Deus, qui univérsum mundum lúmine veritátis
    illústras, et per gloriósos Mártyres Matthíam, Cárolum et Sócios fídei
    prodígia in Africæ regiónibus renováre dignátus es: largíre supplícibus
    tuis; ut, ipsis intercedéntibus, in nobis grátiæ tuæ dona custódias, et
    inter gentes omnes mérito et número pópulus tibi sérviens augeátur."
  - $Per Dominum
