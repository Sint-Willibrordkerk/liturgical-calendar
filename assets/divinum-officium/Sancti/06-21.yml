evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 22:29-40"
  - "In illo témpore: Respóndens Jesus, ait sadducæis: Errátis, nesciéntes
    Scriptúras neque virtútem Dei. In resurrectióne enim neque nubent neque
    nubéntur: sed erunt sicut Angeli Dei in cœlo. De resurrectióne autem
    mortuórum non legístis, quod dictum est a Deo dicénte vobis: Ego sum Deus
    Abraham et Deus Isaac et Deus Jacob? Non est Deus mortuórum, sed vivéntium.
    Et audiéntes turbæ, mirabántur in doctrína ejus. Pharisæi autem audiéntes,
    quod siléntium imposuísset sadducæis, convenérunt in unum: et interrogávit
    eum unus ex eis legis doctor, tentans eum: Magíster, quod est mandátum
    magnum in lege? Ait illi Jesus: Díliges Dóminum, Deum tuum, ex toto corde
    tuo, et in tota ánima tua, et in tota mente tua. Hoc est máximum et primum
    mandátum. Secúndum autem símile est huic: Díliges próximum tuum, sicut
    teípsum. In his duóbus mandátis univérsa lex pendet et Prophétæ."
offertorium:
  - "!Ps 23:3-4"
  - Quis ascéndet in montem Dómini, aut quis stabit in loco sancto ejus?
    Innocens mánibus, et mundo corde.
secreta:
  - "Cœlésti convívio fac nos, Dómine, nuptiáli veste indútos accúmbere: quam
    beáti Aloísii pia præparátio et juges lácrimæ inæstimabílibus ornábant
    margarítis."
  - $Per Dominum
communio:
  - "!Ps 77:24-25"
  - "Panem cœli dedit eis: panem Angelórum manducávit homo."
postcommunio:
  - "Angelórum esca nutrítos, angélicis étiam, Dómine, da móribus vívere: et
    ejus, quem hódie cólimus, exémplo in gratiárum semper actióne manére."
  - $Per Dominum
