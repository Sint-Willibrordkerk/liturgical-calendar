oratio:
  - "Cœléstium donórum distribútor, Deus, qui in angélico júvene Aloísio miram
    vitæ innocéntiam pari cum pœniténtia sociásti: ejus méritis et précibus
    concéde; ut, innocéntem non secúti, pœniténtem imitémur."
  - $Per Dominum
graduale:
  - "!Ps 70:5-6"
  - "Dómine, spes mea a juventúte mea: in te confirmátus sum ex útero: de ventre
    matris meæ tu es protéctor meus."
  - "!Ps 40:13"
  - "Me autem propter innocéntiam suscepísti: et confirmásti me in conspéctu tuo
    in ætérnum."
  - Allelúja, allelúja.
  - "!Ps 64:5"
  - "Beátus, quem elegísti et assumpsísti: inhabitábit in átriis tuis. Allelúja."
