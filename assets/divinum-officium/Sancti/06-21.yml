lectio4:
  - "Aloisius, Ferdinandi Gonzagæ Castellionis Stiverorum marchionis filius,
    festinato propter vitæ periculum baptismo, prius cælo quam terris nasci
    visus, primam illam gratiam tam constanter retinuit, ut in ea confirmatus
    crederetur. A primo rationis usu, quo se Deo statim obtulit, vitam duxit
    quotidie sanctiorem. Novennis Florentiæ ante aram beatæ Virginis, quam
    parentis loco semper habuit, perpetuam virginitatem vovit: eamque, insigni
    Dei beneficio, nulla mentis aut corporis pugna tentatam servavit. Reliquas
    animi perturbationes cœpit ætate illa tam fortiter comprimere, ut ne primo
    quidem earum motu deínde incitaretur. Sensus etiam, oculos præcipue, ita
    cohibuit, ut non modo illos numquam in faciem intenderit Mariæ Austriacæ,
    quam plures annos inter honorarios Hispaniarum principis ephebos fere
    quotidie salutavit; sed a matris étiam vultu contineret: homo propterea sine
    carne, aut angelus in carne merito appellatus."
lectio5:
  - "Adjecit sensuum custodiæ corporis cruciatum. Tria singulis hebdomadis
    jejunia, eaque plerumque modico pane et aqua tolerabat, quamquam perpetuum
    fuísse per id tempus ipsius jejunium videri potest, cum ejus prandia ferme
    vix unciam æquarent. Sæpe étiam ter in die se funibus aut catenis
    cruentabat: flagella quandoque canum loris, cilicia equorum calcaribus
    supplevit. Mollem lectulum clam injectis asserum fragmentis asperabat, eo
    étiam ut citius ad orandum excitaretur, magnam quippe noctis partem, summa
    étiam hieme, solo tectus indusio, positis humi genibus, vel præ languore
    jacens ac pronus, in cælestium contemplatione traducebat. Interdiu quoque
    tres, quatuor, quinque horas in ea perstabat immotus, donec unam saltem
    animo nusquam distracto percurrisset. Cujus constantiæ præmium fuit
    stabilitas mentis inter orandum alio non vagantis, immo perpetua velut
    extasi in Deo defixæ. Ei demum ut unice adhæreret, victo post triennale
    acerrimum certamen patre, et aviti principatus jure in fratrem translato,
    societati Jesu, ad quam cælesti voce Matriti fuerat accitus, Romæ se
    adjunxit."
lectio6:
  - In tirocinio ipso virtutum omnium magister haberi cœpit, Exactissima in eo
    erat legum étiam minimarum custodia, mundi contemptus singularis implacabile
    odium sui Dei vero amor tam ardens, ut corpus étiam sensim absumeret, Jussus
    propterea mentem a divinis rebus tantisper avertere, occurrentem sibi ubique
    Deum irrito conatu fugiebat. Mira étiam proximos caritate amplexus, in
    publicis, quibus alacriter ministrabat, nosocomiis, contagiosam luem traxit,
    Qua lente consumptus, die quem prædixerat, undecimo Kalendas Julii, ætatis
    anno quarto et vigesimo jam inchoato, cum antea flagellis cædi, atque humi
    stratus mori postulasset, migravit in cælum, Ibi eum sancta Maria Magdalena
    de Pazzis tanta frui gloria, Deo monstrante, vidit, quantam vix esse in cælo
    credidisset; ipsumque sanctimonia insignem, et caritate Martyrem incognitum
    fuísse prædicavit, Multis étiam magnisque claruit miraculis, Quibus rite
    probatis, Benedictus decimus tertius Sanctorum fastis angelicum juvenum
    adscripsit, atque innocentiæ et castitatis exemplar simul et patronum
    studiosæ præsertim juventuti dedit.
lectio94:
  - Aloísius, Ferdinándi Gonzágæ Castelliónis Stiverórum marchiónis fílius,
    festináto propter vitæ perículum baptísmo, prius cælo quam terris nasci
    visus, primam illam grátiam tam constánter retínuit, ut in ea confirmátus
    crederétur. Novénnis Floréntiæ ante aram beátæ Vírginis, quam paréntis loco
    semper hábuit, perpétuam virginitátem vovit; eámque, insígni Dei benefício,
    nulla mentis aut córporis pugna tentátam servávit, homo proptérea sine
    carne, aut ángelus in carne mérito appellátus. Avíti principátus jure in
    fratrem transmísso, societáti Jesu Romæ se adjúnxit. In tirocínio ipso
    ómnium virtútum magíster habéri cœpit. In eo Dei amor erat tam ardens, ut
    corpus étiam sensim absúmeret. Mira étiam próximos caritáte ampléxus, in
    públicis, quibus alácriter ministrábat, nosocomíis contagiósam luem traxit.
    Qua lente consúmptus, undécimo kaléndas júlii, ætátis anno quarto et
    vigésimo jam inchoáto, migrávit in cælum. Quem Benedíctus décimus tértius
    inter Sanctos rétulit, atque innocéntiæ et castitátis exémplar simul et
    patrónum studiósæ præsértim juventúti dedit.
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 22:29-40"
  - "In illo témpore: Respondens Jesus ait Sadducæis: Erratis nescientes
    Scripturas, neque virtutem Dei. In resurrectione enim neque nubent, neque
    nubentur: sed erunt sicut Angeli Dei in cælo. Et réliqua."
  - _
  - Homilia sancti Joannis Chrysostomi
  - "!Liber de Virginitate"
  - "Virginitas est bona: id ego quoque fateor. Atqui nuptiis étiam melior et
    istud tibi assentior: ac si libet, illud adjungam, tanto nuptiis eam
    præstare, quanto cælum terræ, quanto hominibus Angeli antecellunt: ac, si
    quid præterea addendum est, étiam magis. Nam si neque nubunt Angeli, neque
    uxorem ducunt, non étiam carne et sanguine coagmentati sunt: in terris
    præterea non commorantur, non cupiditatum aut libidinum perturbationibus
    sunt obnoxii; non cibi indigent, aut potus; non sunt ejusmodi, ut eos dulcis
    sonus, aut cantus mollis, aut præclara species possit allicere; nulla
    denique ejus generis illecebra capiuntur."
lectio8:
  - "At humánum genus cum natura beatis illis mentibus inferius sit, omni vi
    studioque contendit, ut, quoad ejus fieri potest, illas assequatur. Quomodo?
    Non nubunt Angeli: at neque étiam virgo. Assistentes illi semper ad Deum,
    eidem inserviunt; et istud ipsum virgo. Quod si virgines, quamdiu corporis
    onere deprimuntur, quemadmodum Angeli in cælum nequeunt ascendere, illud eo
    vel maximo solatio compensant, quod modo spiritu et corpore sancti sint,
    cæli Regem recipiunt. Videsne virginitatis præstantiam? quomodo terrarum
    incolas sic afficiat, ut qui corpore vestiti sunt, eos incorporeis mentibus
    exæquet?"
lectio9:
  - "Qua enim, quæso, re differebant ab Angelis Elias, Eliseus, Joannes, veri hi
    virginitatis amatores? Nulla, nisi quod mortali natura constabant. Nam
    cetera si quis diligenter inquirat, hi nihilo minus affecti reperientur,
    quam beatæ illæ mentes: et idipsum quo inferiore conditione videntur esse,
    in magna est eorum laude ponendum. Ut enim terrarum incolæ, et ii qui essent
    mortali natura, possent ad illam virtutem vi et contentione pervenire; vide
    quanta eos fortitudine, quanta vitæ ratione præditos fuísse oporteat."
  - "&teDeum"
