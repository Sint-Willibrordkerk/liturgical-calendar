lectio4:
  - Sermo venerabilis Bedæ presbyteri
  - "!In Luc. Evang. Cap. I"
  - Accepto virginis consensu, mox angelus cælestia repetit, illa petit montana,
    festinat invisere Elisabeth, non quasi incredula de oraculo, vel dubia de
    exemplo, sed ut læta de voto, religiosa pro officio, typicum pariter
    exemplum tribuens, quod omnis anima, quæ Verbum Dei mente conceperit,
    virtutum statim celsa cacumina gressu conscendat amoris, quatenus civitatem
    Juda, id est confessionis, et laudis arcem penetrare, et usque ad
    perfectionem fidei, spei, et caritatis, quasi tribus in ea mensibus valeat
    commorari.
responsory4:
  - "@Sancti/09-08::s/nata est/visitávit Elízabeth/ s/Natívitas/Visitatio/g"
lectio5:
  - "Disce virgo humilitatem Mariæ, ut et corpore casta, et pectore possis esse
    devota. Visitat junior seniorem, salutat virgo uxorem. Decet enim, ut quo
    castior virgo, eo sit humilior, et senioribus deferens, habitum castitatis
    præconio commendet humilitatis. Aliter Maria ad Elisabeth, Dominus venit ad
    Joánnem, hæc ut Spiritu Sancto repleatur, illius ut baptisma consacretur:
    majorumque humiliatio minorum est utique exaltatio."
responsory5:
  - "@Sancti/09-08::s/Nativitátem/visitatiónem/"
lectio6:
  - Vocem prior Elisabeth audivit, sed Joannes prior gratiam sensit. Illa naturæ
    ordine audivit, iste exaltavit ratione mysterii. Illa Mariæ, iste Domini
    sensit adventum. Istæ gratiam loquuntur, illi intus operantur, pietatisque
    mysterium maternis adoriuntur profectibus, duplicique miraculo prophetant
    matres spiritu paruulorum. Exultavit infans, et repleta mater est; non prius
    mater repleta quam filius, sed cum filius esset repletus Spiritu Sancto,
    replevit et matrem.
