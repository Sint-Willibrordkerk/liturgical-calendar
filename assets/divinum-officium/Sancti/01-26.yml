lectio4:
  - Ex libro sancti Hierónymi Presbýteri de Scriptóribus ecclesiásticis
  - "!Cap. 17"
  - "Polycárpus, Joánnis Apóstoli discípulus et ab eo Smyrnæ epíscopus
    ordinátus, totíus Asiæ princeps fuit, quippe qui nonnúllos Apostolórum et
    eórum qui víderant Dóminum, magístros habúerit et víderit. Hic propter
    quasdam super die Paschæ quæstiónes, sub imperatóre Antoníno Pio, Ecclésiam
    in Urbe regénte Anicéto, Romam venit; ubi plúrimos credéntium, Marciónis et
    Valentíni persuasióne decéptos, redúxit ad fidem. Cumque ei fortúito óbviam
    fuísset Márcion et díceret: Cognóscis nos? respóndit: Cognósco primogénitum
    diáboli. Póstea vero, regnánte Marco Antoníno et Lúcio Aurélio Cómmodo,
    quarta post Nerónem persecutióne, Smyrnæ, sedénte procónsule et univérso
    pópulo in amphitheátro advérsus eum personánte, igni tráditus est. Scripsit
    ad Philippénses valde útilem epístolam, quæ usque hódie in Asiæ convéntu
    légitur."
