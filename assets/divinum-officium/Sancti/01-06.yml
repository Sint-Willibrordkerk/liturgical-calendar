oratio:
  - "Deus, qui hodiérna die Unigénitum tuum géntibus stella duce revelásti:
    concéde propítius; ut, qui jam te ex fide cognóvimus, usque ad contemplándam
    spéciem tuæ celsitúdinis perducámur."
  - $Per eundem
lectio:
  - Léctio Isaíæ Prophétæ
  - "!Is 60:1-6"
  - "Surge, illumináre, Jerúsalem: quia venit lumen tuum, et glória Dómini super
    te orta est. Quia ecce, ténebræ opérient terram et caligo pópulos: super te
    autem oriétur Dóminus, et glória ejus in te vidébitur. Et ambulábunt gentes
    in lúmine tuo, et reges in splendóre ortus tui. Leva in circúitu óculos
    tuos, et vide: omnes isti congregáti sunt, venérunt tibi: fílii tui de longe
    vénient, et fíliæ tuæ de látere surgent. Tunc vidébis et áfflues, mirábitur
    et dilatábitur cor tuum, quando convérsa fúerit ad te multitúdo maris,
    fortitúdo géntium vénerit tibi. Inundátio camelórum opériet te, dromedárii
    Mádian et Epha: omnes de Saba vénient, aurum et thus deferéntes, et laudem
    Dómino annuntiántes."
