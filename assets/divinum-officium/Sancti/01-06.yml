evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 2:1-12"
  - "Cum natus esset Jesus in Béthlehem Juda in diébus Heródis regis, ecce, Magi
    ab Oriénte venerunt Jerosólymam, dicéntes: Ubi est, qui natus est rex
    Judæórum? Vidimus enim stellam ejus in Oriénte, et vénimus adoráre eum.
    Audiens autem Heródes rex, turbatus est, et omnis Jerosólyma cum illo. Et
    cóngregans omnes principes sacerdotum et scribas pópuli, sciscitabátur ab
    eis, ubi Christus nasceretur. At illi dixérunt ei: In Béthlehem Judæ: sic
    enim scriptum est per Prophétam: Et tu, Béthlehem terra Juda, nequaquam
    mínima es in princípibus Juda; ex te enim éxiet dux, qui regat pópulum meum
    Israël. Tunc Heródes, clam vocátis Magis, diligénter dídicit ab eis tempus
    stellæ, quæ appáruit eis: et mittens illos in Béthlehem, dixit: Ite, et
    interrogáte diligénter de púero: et cum invenéritis, renuntiáte mihi, ut et
    ego véniens adórem eum. Qui cum audíssent regem, abiérunt. Et ecce, stella,
    quam víderant in Oriénte, antecedébat eos, usque dum véniens staret supra,
    ubi erat Puer. Vidéntes autem stellam, gavísi sunt gáudio magno valde. Et
    intrántes domum, invenérunt Púerum cum María Matre ejus, (hic genuflectitur)
    et procidéntes adoravérunt eum. Et, apértis thesáuris suis, obtulérunt ei
    múnera, aurum, thus et myrrham. Et respónso accépto in somnis, ne redírent
    ad Heródem, per aliam viam revérsi sunt in regiónem suam."
offertorium:
  - "!Ps 71:10-11"
  - "Reges Tharsis, et ínsulæ múnera ófferent: reges Arabum et Saba dona
    addúcent: et adorábunt eum omnes reges terræ, omnes gentes sérvient ei."
secreta:
  - "Ecclésiæ tuæ, quǽsumus, Dómine, dona propítius intuere: quibus non jam
    aurum, thus et myrrha profertur; sed quod eisdem munéribus declarátur,
    immolátur et súmitur, Jesus Christus, fílius tuus, Dóminus noster:"
  - $Qui tecum
