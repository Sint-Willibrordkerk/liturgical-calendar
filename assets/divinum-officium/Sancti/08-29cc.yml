lectio93:
  - "Sabina, mulier Romana, Valentini viri claríssimi uxor, a Seráphia vírgine
    christianæ fidei præceptis instituta, post sanctæ Vírginis martyrium,
    collectas ejus relíquias piis exsequiis sepelívit. Quæ propter eam causam
    paulo post, Hadriáno imperatóre, comprehensa, Elpidio júdici sistitur. Cui
    is: Tu ne illa Sabina et génere et matrimonio nobilíssima? At illa, Sum,
    inquit: sed Dómino meo Jesu Christo grátias ago, qui me, intercessióne
    Seráphiæ famulæ suæ, e dæmonum potestate liberávit. Quam varie tentatam ut
    propositum mutaret, cum a fidei constántia movére non posset, præfectus,
    pronuntiáta senténtia quod deos contemneret, cápitis damnávit. Ejus corpus a
    Christiánis in eodem sepúlcro cónditum est, in quo ipsa magistram fidei suæ
    Seráphiam posúerat."
