secreta:
  - "Præsens oblátio fiat, Dómine, pópulo tuo salutáris: pro quo dignátus es
    Patri tuo te vivéntem hóstiam immoláre:"
  - v. Qui cum eódem Deo Patre et Spíritu Sancto vivis et regnas Deus, per ómnia
    sǽcula sæculórum.
postcommunio_:
  - "Divínis, Dómine, munéribus satiáti: quǽsumus; ut, beáti Antónii Confessóris
    tui atque Doctóris méritis et intercessióne, salutáris sacrifícii sentiámus
    efféctum."
  - $Per Dominum
