comment:
  - Pio PP. XII, anno 1946, Doctor Ecclesiæ declaratus est
oratio_:
  - "Ecclésiam tuam, Deus, beáti Antónii Confessóris tui atque Doctóris
    sollémnitas votiva lætíficet: ut spirituálibus semper muniátur auxíliis et
    gáudiis pérfrui mereátur ætérnis."
  - $Per Dominum
