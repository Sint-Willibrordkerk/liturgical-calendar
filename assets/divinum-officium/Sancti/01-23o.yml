lectio93:
  - Emerentiána virgo Romana, collactanea beátæ Agnetis, adhuc catechumena, fide
    et caritate flagrans, furéntes in Christiános idolórum cultores cum
    vehementius accusaret, a concitáta multitúdine lapidibus óbruta est. Quæ in
    cruciátibus orans ad sepúlcrum sanctæ Agnetis, proprio sánguine, quem pro
    Christo constanter effudit, baptizata, ánimam Deo réddidit.
  - "&teDeum"
