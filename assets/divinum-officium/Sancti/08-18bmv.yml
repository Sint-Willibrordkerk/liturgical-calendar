lectio1:
  - De Canticis canticorum
  - "!Cant 4:1-4"
  - 1 (Sponsus) Quam pulchra es, amica mea ! quam pulchra es ! Oculi tui
    columbarum, absque eo quod intrinsecus latet. Capilli tui sicut greges
    caprarum quæ ascenderunt de monte Galaad.
  - 2 Dentes tui sicut greges tonsarum quæ ascenderunt de lavacro; omnes
    gemellis fœtibus, et sterilis non est inter eas.
  - 3 Sicut vitta coccinea labia tua, et eloquium tuum dulce. Sicut fragmen mali
    punici, ita genæ tuæ, absque eo quod intrinsecus latet.
  - 4 Sicut turris David collum tuum, quæ ædificata est cum propugnaculis; mille
    clypei pendent ex ea, omnis armatura fortium.
  - null
