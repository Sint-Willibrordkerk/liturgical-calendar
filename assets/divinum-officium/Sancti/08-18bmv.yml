oratio:
  - "Famulórum tuórum, quǽsumus, Dómine, delíctis ignósce: ut, qui tibi placére
    de áctibus nostris non valémus; Genetrícis Fílii tui, Dómini nostri,
    intercessióne salvémur:"
  - $Qui tecum
secreta:
  - "Subvéniat, Dómine, plebi tuæ Dei Genetrícis orátio: quam etsi pro
    conditióne carnis migrásse cognóscimus, in cœlésti glória apud te pro nobis
    intercédere sentiámus."
  - $Per eundem
postcommunio:
  - "Mensæ cœléstis partícipes effécti, implorámus cleméntiam tuam, Dómine, Deus
    noster: ut, qui Assumptiónem Dei Genetrícis cólimus, a cunctis malis
    imminéntibus, ejus intercessióne, liberémur."
  - $Per eundem
