lectio6o:
  - "Quid quæritis in sepulcro eam, quæ ad cælestia translata est tabernacula?
    cur a me custodiæ rationem exposcitis? Non possum ego divinis jussis
    resistere. Sacrosanctum corpus mihi quoque sanctitatem impertivit quod me
    pretiosissimi unguenti fragrantia replevit, et divinum templum effecit
    relictis sindonibus, abiit raptum sublime, comitantibus angelis,
    archangelis, et omnibus cælestibus potentiis. Nunc me circumdant angeli;
    nunc divina in me habitat gratia. Ergo evasi officina medicinæ ægrotantibus.
    Ego sum fons perennis curationum: Ego remedium aduersus dæmones: Ego civitas
    refugii omnibus ad me confugientibus."
lectio6r:
  - Idcirco augusta Dei Mater, Jesu Christo, inde ab omni æternitate, « uno
    eodemque decreto » prædestinationis, arcano modo conjuncta, immaculata in
    suo conceptu, in divina maternitate sua integerrima virgo, generosa Divini
    Redemptoris socia, qui plenum de peccato ejusque consectariis deportavit
    triumphum, id tandem assecuta est, quasi supremam suorum privilegiorum
    coronam, ut a sepulcri corruptione servaretur immunis, utque, quemadmodum
    jam Filius suus, devicta morte, corpore et anima ad supernam cæli gloriam
    eveheretur, ubi Regina refulgéret ad ejusdem sui Filii dexteram, immortalis
    sæculorum Regis.
lectio6t:
  - "Aderant tunc cum Apóstolis sanctíssimus Timotheus, primus epíscopus
    Ephesiórum, et Dionysius Areopagíta, sicut ipse testátur in iis, quæ de
    beáto Hierótheo, qui ipse quoque tunc áderat, scripsit ad prædíctum
    Timótheum, sic dicens: Nam étiam apud ipsos a Deo afflátos Sacrórum
    antístites, quando nos quoque, ut nosti, et multi ex sanctis nostris
    frátribus, ad contuéndum corpus, quod Vitæ princípium dedit, et Deum
    suscépit, convenissémus (áderat autem et Dómini frater Jacóbus, et Petrus,
    supréma et antiquíssima theologórum súmmitas): et viso sacro córpore,
    plácuit ómnibus, prout quisque póterat, hymnis celebráre infínitam bonitátem
    divínæ poténtiæ."
responsory6:
  - "@Sancti/08-15:Responsory6"
rubrica-1954/lectio7:
  - Lectio sancti Evangelii secundum Lucam
  - "!Luc 1:41-50"
  - "In illo tempore: Repleta est Spiritu Sancto Elisabeth et exclamavit voce
    magna, et dixit: Benedicta tu inter mulíeres. Et réliqua."
  - _
  - Homilia sancti Petri Damiani Episcopi
  - "!In Nativitate B. M. V."
  - "Virgo Dei Genitrix, cujus pulchritudinem sol et luna mirantur, súbveni,
    dómina, clamantibus ad te jugiter: Revértere, revértere Sunamítis,
    revértere, revértere, ut intueamur te. Tu benedicta, et super benedicta,
    revértere per potentiam.  Fecit in te magna qui potens est, et data est tibi
    omnis potestas in cælo et in terra.  Nihil tibi impossibile, cui possibile
    est desperatos in spem beatitudinis relevare.  Quomodo enim illa potestas
    tuæ potentiæ poterit obviare, quæ de carne tua carnis suscepit
    originem?  Accedis enim ante illud aureum humanæ, reconciliationis altare,
    non solum rogans, sed imperans, dómina, non ancilla.  Moveat te natura,
    potentia moveat, quia quanto potentior, tanto misericordior esse
    debebis.  Potestati enim cedit ad gloriam, injurias ulcisci nolle cum
    possit.  Revértere per amórem.  Scio, dómina, quia benignissima es, et amas
    nos amóre invincibili, quos in te et per te Filius tuus et Deus tuus summa
    dilectione dilexit.  Quis scit quoties refrigeras iram Judicis, cum justitiæ
    virtus a præsentia deitatis egréditur?"
rubrica-tridentina-aut-rubrica-193/lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 10:38-42"
  - "In illo témpore: Intravit Jesus in quoddam castellum: et mulier quædam,
    Martha nomine, excepit illum in domum suam. Et réliqua."
  - _
  - De Homilia sancti Augustíni Epíscopi
  - "!Ex Serm. 27 de Verbis Dom., paulo ante medium"
  - Bene Martha circa corporalem Domini, quid dicam, necessitatem, an
    voluntatem? ministrebat carni mortali. Sed quis erat in carne mortali? In
    principio erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum. Ecce
    quod Maria audiebat. Verbum caro factum est, et habitavit in nobis. Ecce
    Martha cui ministrabat. Ergo Maria meliorem partem elegit, quæ non auferetur
    ab ea. Hoc enim elegit, quod semper manebit, ideo non auferetur ab ea.
responsory7:
  - "@Sancti/08-15:Responsory7"
rubrica-1954/lectio8:
  - Revértere per singularitatem. In manibus tuis sunt thesauri miserationum
    Domini, et sola electa es, cui gratia tanta conceditur. Absit ut cesset
    manus tua, cum occasionem quæras salvandi miseros et misericordiam
    effundendi! neque enim tua gloria minúitur, sed augetur, cum pœnitentes ad
    veniam, justificati ad gloriam assumuntur. Revértere ergo, Sunamítis, id est
    despecta, cujus animam pertransivit gladius quæ fabri uxor appellata
    fuisti.  Ad quid?  Ut intueamur te. Summa gloria est post Deum te vidére,
    adhærére tibi, et in tuæ protectionis munimine demorari. Audi nos. Nam et
    Filius nihil negans honorat te, qui est Deus benedictus in sæcula sæculorum.
    Amen.
rubrica-tridentina-aut-rubrica-193/lectio8:
  - "Circa unum Maria se voluit occupari. Jam tenebat: Mihi autem adhærere Deo
    bonum est. Sedebat ad pedes capitis nostri. Quanto humilius sedebat, tanto
    amplius capiebat. Confluit enim aqua ad humilitatem convallis, denotat de
    tumoribus collis. Non ergo Dominus opus reprehendit, sed munus distinxit.
    Circa multa es occupata: porro unum est necessarium. Jam hoc sibi Maria
    elegit."
responsory8:
  - "@Sancti/08-15:Responsory8"
