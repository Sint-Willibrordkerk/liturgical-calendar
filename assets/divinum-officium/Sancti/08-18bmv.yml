lectio4o:
  - Sermo sancti Joannis Damasceni
  - "!Orat. 2 de drom. Deiparæ"
  - "Jubilemus in arca Domini Dei toto animo, et muri cadent Hiericontini,
    contrariarum, inquam potestatum infestæ munitiones. Cum David exsultemus
    spiritu. Arca enim Domini hodie requievit. Clamemus cum Gabriele, qui primum
    locum obtinet inter angelos: Ave gratia plena: dominus tecum. Ave gaudii
    pelagus inexhaustum. Ave unicum molestiarum levamen. Aue omnium cordis
    dolorum medicamentum. Ave sancta virgo per quam mors quidem fuit expulsa,
    vita autem introducta."
lectio4r:
  - Ex Constitutione Apostolica Pii Papæ duodecimi
  - _
  - Sanctorum Patrum ac theologorum argumenta considerationesque Sacris
    Litteris, tamquam ultimo fundamento, nituntur; quæ quidem almam Dei Matrem
    nobis véluti ante oculos  proponunt divino Filio suo conjunctissimam,
    ejusque semper participantem sortem.  Quamóbrem quasi impossibile videtur
    eam cérnere, quæ Christum concepit, péperit, suo lacte aluit, eumque inter
    ulnas habuit pectorique obstrinxit suo, ab eodem post terrestrem hanc vitam,
    etsi non anima, corpore tamen separatam.  Cum Redemptor noster Mariæ Filius
    sit, haud poterat profecto, útpote divinæ legis observator perfectissimus,
    præter Æternum Patrem, Matrem quoque suam dilectissimam non honorare. Atqui,
    cum eam posset tam magno honore exornare, ut eam a sepulcri corruptione
    servaret incólumem, id reapse fecisse credendum est.
lectio4t:
  - De Sermone sancti Joannis Damasceni
  - "!Orat. 2 de Dormitione Deiparæ, sub finem"
  - Ex antíqua accépimus traditióne, quod témpore gloriósæ dormitiónis beátæ
    Virginis, univérsi quidem sancti Apóstoli, qui orbem terræ ad salútem
    Géntium peragrábant, moménto témporis in sublíme eláti, convenérunt
    Jerosólymis. Cumque illic essent, eis vísio appáruit angélica, et audíta est
    psalmodía cæléstium Potestátum; et sic cum divína glória in manus Dei
    sanctam trádidit ánimam. Ejus autem corpus, quod Deum ineffábili quadam
    ratióne suscépit, cum angélica et apostólica hymnodía elátum, in lóculo fuit
    depósitum Gethsemane; quo in loco Angelórum cantus mansit tres dies
    contínuos.
