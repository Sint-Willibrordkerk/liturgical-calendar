lectio5o:
  - Tu vero o sacrorum sepulcrorum sacratissimum, post domini quidem sepulcrum,
    quod uitæ dedit principium, quod fuit fons resurrectionis, (tecum enim
    loquar tamquam cum animato) ubinam est aurum illud purum, quod manus
    apostolorum in te condiderunt! Ubi divitiæ, quæ consumi nequeunt! Ubi novum
    uolumen, in quo ineffabiliter deus uerbum sine manu inscriptum fuit! Ubi
    abyssus gratiæ? Ubi pelagus curationum? Ubi est desiderabile illud deiparæ
    uirginis corpus?
lectio5r:
  - "Maxime autem illud memorandum est, inde a sæculo secundo, Mariam Virginem a
    sanctis Patribus véluti noavm Hevam proponi novo Adæ, etsi subjectam,
    arctissime conjunctam in certamine illo adversus inferorum hostem, quod
    quemadmodum in protoevangelio præsignificatur, ad plenissimam deventurum
    erat victoriam de peccato ac de morte, quæ semper in gentium Apostoli
    scriptis inter se copulantur.  Quamóbrem, sicut gloriosa Christi anástasis
    essentialis pars fuit ac postremum hujus victoriæ tropæum, ita Beatæ
    Virginis commune cum Filio suo certamen virginei corporis « glorificatione »
    concludendum erat; ut enim idem Apostolus ait, « cum ... mortale hoc
    induerit immortalitatem, tunc fiet sermo, qui scriptus est: absorpta est
    mors in victoria. »"
lectio5t:
  - Post tres autem dies angélico cantu cessante, qui áderant Apóstoli (cum unus
    Thomas, qui abfúerat, post tértium diem venísset, et, quod Deum suscéperat,
    corpus adoráre voluísset), túmulum aperuérunt; sed omni ex parte sacrum ejus
    corpus nequáquam inveníre potuérunt. Cum ea autem tantum inveníssent, in
    quibus fúerat compósitum, et ineffabili, qui ex iis proficiscebátur, essent
    odóre repléti, lóculum clausérunt. Ejus mystérii obstupefácti miráculo, hoc
    solum cogitáre potuerunt, quod, cui plácuit ex María Vírgine carnem súmere,
    et hóminem fíeri et nasci, cum esset Deus Verbum, et Dóminus glóriæ, quique
    post partum incorrúptam servávit ejus virginitátem; eídem étiam plácuit, et
    ipsíus, postquam migrávit, immaculátum corpus, incorrúptum servátum,
    translatióne honoráre ante commúnem et universálem resurrectiónem.
