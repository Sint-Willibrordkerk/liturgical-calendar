offertorium:
  - "!Job 29:14-16"
  - "Justítia indútus sum, et vestívi me, sicut vestiménto et diadémate, judício
    meo. Oculus fui cæco et pes claudo: pater eram páuperum."
secreta:
  - "Has, quǽsumus, Dómine, hóstias sancti Joánnis Confessóris tui méritis
    benígnus assúme: et præsta; ut, te super ómnia et omnes propter te
    diligéntes, corde tibi et ópere placeámus."
  - $Per Dominum
communio:
  - "!Luc 6:38"
  - "Date, et dábitur vobis: mensúram bonam et confértam et coagitátam et
    supereffluéntem dabunt in sinum vestrum."
postcommunio:
  - "Pretiósi Córporis et Sánguinis tui, Dómine, pasti delíciis, tuam súpplices
    deprecámur clementiam: ut, sancti Joánnis Confessóris tui méritis et
    exémplis, ejúsdem caritátis imitatóres effécti, consórtes simus et glóriæ:"
  - $Qui vivis
