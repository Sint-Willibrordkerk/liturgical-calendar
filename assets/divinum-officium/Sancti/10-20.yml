introitus:
  - "!Eccli 18:12-13"
  - "v. Miserátio hóminis circa próximum: misericórdia autem Dei super omnem
    carnem. Qui misericórdiam habet, docet et érudit quasi pastor gregem suum."
  - "!Ps 1:1"
  - Beátus vir, qui non ábiit in consílio impiórum, et in via peccatórum non
    stetit, et in cáthedra pestiléntiæ non sedit.
  - "&Gloria"
  - "v. Miserátio hóminis circa próximum: misericórdia autem Dei super omnem
    carnem. Qui misericórdiam habet, docet et érudit quasi pastor gregem suum."
oratio:
  - "Da, quǽsumus, omnípotens Deus: ut, sancti Joánnis Confessóris exémplo in
    sciéntia Sanctórum proficiéntes atque áliis misericórdiam exhibéntes; ejus
    méritis, indulgéntiam apud te consequámur."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Jacóbi Apóstoli
  - "!Jac 2:12-17"
  - "Carissimi: Sic loquímini, et sic fácite sicut per legem libertátis
    incipiéntes judicári. Judícium enim sine misericórdia illi, qui non fecit
    misericórdiam: superexáltat autem misericórdia judícium. Quid próderit,
    fratres mei, si fidem quis dicat se habére, ópera autem non hábeat? Numquid
    poterit fides salváre eum? Si autem frater et soror nudi sint, et indígeant
    victu quotidiáno, dicat autem áliquis ex vobis illis: Ite in pace,
    calefacímini et saturámini: non dedéritis autem eis, quæ necessária sunt
    córpori, quid próderit? Sic et fides, si non hábeat ópera, mórtua est in
    semetípsa."
graduale:
  - "!Ps 106:8-9"
  - "Confiteántur Dómino misericórdiæ ejus: et mirabília ejus fíliis hóminum."
  - "V. Quia satiávit ánimam inánem: et ánimam esuriéntem satiavit bonis.
    Allelúja, allelúja."
  - "!Ps 31:20"
  - "Manum suam apéruit ínopi: et palmas suas exténdit ad páuperem. Allelúja."
gradualep:
