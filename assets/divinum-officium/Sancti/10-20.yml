lectio4:
  - Joánnes, in oppido Kenty Cracoviénsis diœcesis, a quo Cantii cognomen duxit,
    Stanislao et Anna piis et honestis paréntibus natus, morum suavitáte,
    innocéntia, gravitáte, ab ipsa infántia spem fecit maximæ virtútis. In
    universitáte Cracoviénsi philosophíæ ac theologíæ primum auditor, tum, per
    omnes academíæ gradus ascendendo, professor ac doctor, sacra, quam annis
    multis trádidit, doctrina mentes audiéntium non illustrábat modo, sed et ad
    omnem pietátem inflammabat, simul docens scilicet et fáciens. Sacerdos
    factus, nihil de litterárum studio remíttens, studium auxit christianæ
    perfectiónis. Utque passim offéndi Deum maxime dolebat, sic eum sibi et
    pópulo placare, oblato quotídie non sine multis lácrimis incruento
    sacrifício, satagebat. Ilkusiensem parochiam annis aliquot egregie
    administrávit; sed animárum periculo commótus, póstea dimísit, ac,
    postulante academía, ad prístinum docéndi offícium rediit.
lectio5:
  - Quotidie témporis ab studio supérerat, partim salúti proximórum sacris
    præsertim conciónibus curandæ, partim oratióni dabat, in qua cæléstibus
    quandoque visiónibus et colloquiis dignátus fertur. Christi vero passióne
    sic afficiebátur, ut in ea contemplanda totas intérdum noctes dúceret
    insomnes, ejusque causa mélius recolendæ Jerosolymam peregrinátus sit; ubi,
    et martyrii desidério flagrans, Turcis ipsis Christum crucifixum prædicáre
    non dubitávit. Quater étiam ad Apostolórum limina, pedes atque viaria
    onustus sárcina, Romam venit, tum ut Sedem apostolicam, cui maxime addictus
    fuit, honoraret, tum ut sui (sic enim ajebat) purgatorii pœnas expósita
    illic quotídie peccatórum venia redímeret. Quo in itinere a latrónibus olim
    spoliátus et num quid haberet præterea interrogátus, cum negasset, aureos
    deínde aliquot suo insutos pallio recordatus, fugiéntibus hos étiam clamans
    óbtulit latrónibus; qui, viri sancti candórem simul et largitátem admirati,
    étiam ablatos ultro reddidére. Alienæ famæ ne quis detraheret, descriptis,
    beáti Augustíni exemplo, in pariete versiculis, se atque alios perpetuo
    vóluit admónitos. Famélicos de suo étiam obsonio satiábat; nudos autem non
    emptis modo sed detractis quoque sibi vestibus et calceis operiebat, demisso
    ipse interim usque ad terram pallio, ne domum núdipes redire viderétur.
lectio6:
  - Brevis illi somnus, atque humi; vestis, quæ nuditátem, cibus, qui mortem
    dumtaxat, arcéret. Virginalem pudicítiam, velut lílium inter spinas, áspero
    cilício, flagellis atque jejuniis custodívit. Quin et per annos ante óbitum
    trigínta circiter et quinque, ab esu carnium perpetuo abstinuit. Tandem
    diérum juxta ac meritórum plenus, cum vicinæ, quam præsensit, morti se diu
    diligenterque præparasset, ne qua re ámplius tenerétur, si quid domi
    supérerat, id omnino paupéribus distríbuit. Tum Ecclésiæ sacramentis rite
    munítus, dissolvi jam cupiens et esse cum Christo, pridie Nativitátis ejus,
    in cælum evolávit, miraculis ante et post mortem clarus. Mortuus ad próximam
    academíæ ecclésiam sanctæ Annæ delátus est, ibique honorifice sepúltus.
    Auctáque in dies pópuli veneratióne ac frequéntia, inter primarios Poloniæ
    ac Lithuaniæ patronos religiosíssime cólitur. Novisque coruscans miraculis,
    a Cleménte décimo tertio Pontifice máximo, décimo septimo Kalendas Augusti,
    anno millesimo septingentésimo sexagesimo septimo, solemni ritu, Sanctórum
    fastis adscriptus est.
lectio94:
  - Joánnes, in óppido Kenty Cracoviénsis diœcésis, a quo Cántii cognómen duxit,
    Stanisláo et Anna piis et honéstis paréntibus natus, morum suavitáte et
    innocéntia, ab ipsa infántia spem fecit máximæ virtútis. Sacérdos factus,
    stúdium auxit christiánæ perfectiónis. Ilkusiénsem paróchiam annis áliquot
    egrégie administrávit. Quidquid témporis a stúdio supérerat, partim salúti
    proximórum sacris præsértim conciónibus curándæ, partim oratióni dabat.
    Quater ad Apostolórum límina, pedes et viária onústus sárcina, venit, tum ut
    Sedem apostólicam honoráret, tum, ut sui (sic enim ajébat) purgatórii pœnas
    expósita illic cotídie peccatórum vénia redímeret. Virginálem pudicítiam
    vigilantíssime custodívit, et ante óbitum per annos trigínta círciter et
    quinque ab esu cárnium abstínuit. Prídie Nativitátis Christi volávit in
    cælum. A Cleménte Papa décimo tértio fastis Sanctórum adscríptus, inter
    primários Polóniæ ac Lithuániæ patrónos cólitur.
  - "&teDeum"
