lectio93:
  - "Praxédes, virgo Romana, Pudentiánæ vírginis soror, Marco Antonino
    imperatóre Christiános persequente, eos facultátibus, opera, consolatióne,
    et omni caritátis officio prosequebátur. Nam alios domi occultábat; alios ad
    fidei constantiam hortabátur: aliórum córpora sepeliebat; iis, qui in
    carcere inclusi erant, qui in ergástulis exercebántur, nulla re déerat. Quæ,
    cum tantam Christianórum stragem jam ferre non posset, Deum precáta est, ut,
    si mori expediret, se e tantis malis eríperet. Itaque duodecimo Kalendas
    Augusti ad pietátis præmia vocátur in cælum. Cujus corpus a Pastore
    presbytero in patris et sororis Pudentiánæ sepúlcrum illátum est, quod erat
    in cœmeterio Priscillæ, via Salaria."
  - "&teDeum"
