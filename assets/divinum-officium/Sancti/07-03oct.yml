lectio4:
  - De Sermone sancti Leonis Papæ.
  - "!Ex Serm. 82. in natali Ss. Apost. Petri et Pauli, in fine."
  - "Pretiosa est in conspectu Domini mors sanctorum ejus: nec ullo crudelitatis
    genere destrui potest sacramento crucis Christi fundata religio. Non
    minuitur persecutionibus Ecclesia, sed augetur: et semper Dominicus ager
    segete ditiori vestitur, dum grana, quæ singula cadunt, multiplicata
    nascuntur. Unde duo ista præclara divini seminis germina in quantam sobolem
    germinarint, beatorum millia Mártyrum protestantur, qui apostolicorum æmuli
    triumphorum, Urbem nostram purpuratis et longe lateque rutilantibus populis
    ambierunt, et quasi ex multarum honore gemmarum conserto uno diademate
    coronarunt."
lectio5:
  - "De quorum præsidio, dilectissimi, divinitus nobis ad exemplum patientiæ, et
    confirmationem fidei præparato, universaliter quidem in omnium Sanctorum
    commemoratione lætandum est: sed in horum excellentia Patrum merito est
    excellentius gloriandum, quos gratia Dei in tantum apicem inter omnia
    Ecclesiæ membra provexit, ut eos in corpore, cui caput est Christus, quasi
    geminum constitueret lumen oculorum. De quorum meritis atque virtutibus, quæ
    omnem loquendi superant facultatem, nihil diversum, nihil debemus sentire
    discretum: quia illos et electio pares, et labor similes, et finis fecit
    æquales."
lectio6:
  - "Sicut autem et nos experti sumus, et nostri probavere majores, credimus
    atque confidimus, inter omnes labores istius vitæ ad obtinendam
    misericordiam Dei semper nos specialium patronorum orationibus adjuvandos:
    ut quantum propriis peccatis deprimimur, tantum apostolicis meritis
    erigamur: Per Dominum nostrum Jesum Christum, cui est cum Patre et sancto
    Spiritu eadem potestas, una divinitas, in sæcula sæculorum. Amen."
