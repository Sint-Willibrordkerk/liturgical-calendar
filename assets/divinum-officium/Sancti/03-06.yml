lectio4:
  - Perpetua et Felicitas, in persecutione Severi imperatoris, in Africa, una
    cum Revocato, Saturnino et Secundulo comprehensæ sunt et in tenebricosum
    carcerem detrusæ; quibus ultra adjunctus est Satyrus. Erant adhuc
    catechumenæ, sed paulo post baptizatæ sunt. Paucis diebus interjectis, e
    carcere ad forum deductæ cum sociis, post gloriosam confessionem, ab
    Hilarione procuratore damnantur ad bestias. Inde hilares descendunt ad
    carcerem, ubi variis visionibus recreantur et ad martyrii palmam
    accenduntur. Perpetuam, nec patris senio confecti iteratæ preces et lacrimæ,
    nec erga filium infantem pendentem ad ubera maternus amor, nec supplicii
    atrocitas, a Christi fide dimovere umquam potuerunt
lectio5:
  - "Felicitas vero instante spectaculo die, cum octo jam menses prægnans esset,
    in magno erat luctu, ne differretur; leges quippe vetabant prægnantes
    supplicio affici. At precibus commartyrum accelerato partu, enixa est
    filiam. Cumque in partu laborans doleret, ait illi quidam de custodibus: Quæ
    sic modo doles, quid facies objecta bestiis? Cui illa: Modo ego patior;
    illic autem alius erit in me, qui patietur pro me, quia et ego pro illo
    passura sum."
lectio6:
  - In amphitheatrum, toto inspectante populo, producuntur tandem generosæ
    mulieres, Nonis Martii, ac primum flagellis cæduntur. Tunc a ferocissima
    vacca aliquamdiu jactatæ, plagis concisæ et in terram elisæ sunt. Demum cum
    sociis, qui a variis bestiis vexati fuerant, gladiorum ictibus conficiuntur.
    Harum sanctarum Mártyrum festum Pius decimus Pontifex maximus ad ritum
    duplicem pro universa Ecclesia evexit ac diei sextæ Martii adsignari
    mandavit.
lectio94:
  - "Perpétua et Felícitas, in persecutióne Sevéri imperatóris, in Africa, una
    cum Revocáto, Saturníno et Secúndolo comprehénsæ sunt et in tenebricósum
    cárcerem detrúsæ, quibus ultra adjúnctus est Sátyrus. Ibi, cum adhuc
    catechúmenæ essent, baptizátæ sunt. Tum ad béstias damnántur; cumque a
    Felicitáte, in partus labóribus dolénti, quǽreret quidam e custódibus, quid
    in amphitheátro esset factúra, illa respóndit: Modo ego pátior; illic autem
    álius erit in me, qui patiétur pro me, quia et ego pro illo passúra sum.
    Itaque in amphitheátrum, toto inspectánte pópulo, prodúctæ, primum flagéllis
    cædúntur; tum a ferocíssima vacca aliquámdiu jactátæ, plagis concísæ et in
    terram elísæ sunt; demum cum sóciis, qui a váriis béstiis vexáti fúerant,
    die séptima Mártii, gladiórum íctibus conficiúntur."
  - "&teDeum"
