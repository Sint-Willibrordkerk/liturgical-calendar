lectio4:
  - Eustachius, qui et Placidus, genere, opibus et militari glória inter Romanos
    insígnis, sub Trajano imperatóre magistri militum titulum meruit.  Cum vero
    sese aliquándo in venatióne exercéret ac fugiéntem miræ magnitúdinis cervum
    insequerétur, vidit repénte inter consistentis feræ córnua excélsam atque
    fulgentem Christi Dómini e cruce pendentis imáginem.  Cujus voce ad
    immortalis vitæ prædam invitatus, una cum uxore Theopista ac duobus párvulis
    fíliis Agapito et Theopisto, christianæ milítiæ nomen dedit.
lectio5:
  - Mox ad visiónis prístinæ locum, sicut ei Dóminus præceperat, regréssus,
    illum prænuntiántem audívit quanta sibi deinceps, pro ejus gloria,
    perferenda essent.  Quocirca incredibiles calamitátes mira patiéntia
    perpéssus, brevi in summam egestátem redáctus est.  Cumque clam se subducere
    cogerétur, in itinere cónjugem primum, deínde étiam líberos sibi
    miserabíliter ereptos ingemuit.  Tantis obvolutus ærumnis, in regióne
    longinqua villicum agens longo témpore delituit, donec, cælésti voce
    recreátus ac nova occasióne a Trajano conquisítus, íterum bello præfícitur.
lectio6:
  - Illa in expeditióne, liberis simul cum uxore insperato receptis, victor
    Urbem ingénti ómnium gratulatióne ingréditur.  Sed paulo post inánibus diis
    pro parta victoria sacrificáre jussus, constantíssime rénuit.  Cumque variis
    artibus ad Christi fidem ejurandam frustra tentarétur, una cum uxore et
    liberis, leónibus objícitur.  Horum mansuetúdine concitátus imperátor, æneum
    in taurum subjectis flammis candéntem eos immítti jubet, ubi divinis in
    laudibus consummato martyrio, duodecimo Kalendas Octobris ad sempitérnam
    felicitátem convolárunt.  Quorum illæsa córpora, religióse a fidélibus
    sepúlta, póstmodum ad ecclésiam eórum nómine erectam honorofice transláta
    sunt.
