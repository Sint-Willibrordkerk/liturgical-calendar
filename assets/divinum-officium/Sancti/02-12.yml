oratio:
  - "Dómine Jesu Christe, qui, ad recoléndam memóriam dolórum sanctíssimæ
    Genetrícis tuæ, per septem beátos Patres nova Servorum ejus família
    Ecclésiam tuam fœcundásti: concéde propítius; ita nos eórum consociári
    flétibus, ut perfruámur et gáudiis:"
  - $Qui vivis
lectio:
  - Léctio libri Sapiéntiæ
  - "!Eccli 44:1-15"
  - "Laudémus viros gloriósos et paréntes nostros in generatióne sua. Multam
    glóriam fecit Dóminus magnificéntia sua a sǽculo. Dominántes in potestátibus
    suis, hómines magni virtúte et prudéntia sua præditi, nuntiántes in
    prophétis dignitátem prophetárum, et imperántes in præsénti pópulo, et
    virtúte prudéntiæ pópulis sanctíssima verba. In perítia sua requiréntes
    modos músicos, et narrántes cármina scripturárum. Hómines dívites in
    virtúte, pulchritúdinis stúdium habéntes: pacificántes in dómibus suis.
    Omnes isti in generatiónibus gentis suæ glóriam adépti sunt, et in diébus
    suis habéntur in láudibus. Qui de illis nati sunt, reliquérunt nomen
    narrándi laudes eórum. Et sunt, quorum non est memória: periérunt, quasi qui
    non fúerint: et nati sunt, quasi non nati, et fílii ipsórum cum ipsis. Sed
    illi viri misericórdiæ sunt, quorum pietátes non defuérunt: cum sémine eórum
    pérmanent bona, heréditas sancta nepótes eórum, et in testaméntis stetit
    semen eórum: et fílii eórum propter illos usque in ætérnum manent: semen
    eórum et glória eórum non derelinquétur. Córpora ipsórum in pace sepúlta
    sunt, et nomen eórum vivit in generatiónem et generatiónem. Sapiéntiam
    ipsórum narrent pópuli, et laudem eórum núntiet Ecclésia."
