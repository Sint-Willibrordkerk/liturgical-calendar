lectio4:
  - Sǽculo tértio décimo cum Frideríci secúndi diro schísmate cruentísque
    factiónibus cultióres Itáliæ pópuli scinderéntur, próvidens Dei
    misericórdia, præter álios sanctitáte illústres, septem e Florentína
    nobilitáte viros suscitávit, qui in caritáte conjúncti, præclárum fratérnæ
    dilectiónis præbérent exémplum. Hi, nimírum Bonfílius Monáldius, Bonajúncta
    Manéttus, Manéttus Antellénsis, Amidéus de Amidéis, Ugúccio Ugucciónum,
    Sostenéus de Sostenéis et Aléxius Falconérius, cum, anno trigésimo tértio
    ejus sǽculi, die sacra Vírgini cælo recéptæ, in quodam piórum hóminum
    convéntu, Laudántium nuncupáto, fervéntius orárent; ab eádem Deípara
    síngulis apparénte sunt admóniti, ut sánctius perfectiúsque vitæ genus
    amplecteréntur. Re ítaque prius cum Florentíno prǽsule colláta, hi septem
    viri, géneris nobilitáte divitiísque posthábitis, sub vilíssimis detritísque
    véstibus cilício indúti, octáva die Septémbris in rurálem quamdam ædículam
    secessére, ut ea die primórdia vitæ sanctióris auspicaréntur, qua ipsa Dei
    Génetrix mortálibus orta sanctíssimam vitam incéperat.
lectio5:
  - "Hoc vitæ institútum quam sibi foret accéptum Deus miráculo osténdit. Nam
    cum paulo deínceps hi septem viri per Florentínam urbem ostiátim eleemósynam
    emendicárent, áccidit, ut repénte infántium voce, quos inter fuit sanctus
    Philíppus Benítius quintum ætátis mensem vix ingréssus, beátæ Maríæ Servi
    acclamaréntur: quo deínde nómine semper appelláti sunt. Quare, vitándi
    pópuli occúrsus ac solitúdinis amóre ducti, in Senárii montis recéssu omnes
    convenére, ibíque cæléste quoddam vitæ genus aggréssi sunt. Victitábant enim
    in spelúncis, sola aqua herbísque conténti; vigíliis aliísque asperitátibus
    corpus atterébant, Christi passiónem ac mæstíssimæ ejúsdem Genitrícis
    dolóres assídue meditántes. Quod cum olim sacra Parascéves die impénsius
    exsequeréntur, ipsa beáta Virgo illis iteráto appárens, lúgubrem vestem,
    quam indúerent, osténdit; sibíque acceptíssimum fore significávit, ut novum
    in Ecclésia regulárem órdinem excitárent, qui jugem recóleret ac promovéret
    memóriam dolórum, quos ipsa pértulit sub cruce Dómini. Hæc sanctus Petrus,
    ínclytus órdinis Prædicatórum Martyr, ex familiári cum sanctis illis viris
    consuetúdine ac peculiári étiam Deíparæ visióne cum didicísset; iis auctor
    fuit, ut órdinem regulárem sub appellatióne Servórum beátæ Vírginis
    institúerent: qui póstea ab Innocéntio quarto Pontífice máximo approbátus
    fuit."
lectio6:
  - Porro sancti illi viri, cum plures sibi sócios adjunxíssent, Itáliæ
    civitátes atque óppida, præsértim Etrúriæ excúrrere cœpérunt, prædicántes
    ubíque Christum crucifíxum, civíles discórdias compescéntes et innúmeros
    fere dévios ad virtútis sémitam revocántes. Neque Itáliam modo, sed et
    Gálliam, Germániam ac Polóniam suis evangélicis labóribus excoluérunt.
    Dénique cum bonum Christi odórem longe latéque diffudíssent, portentórum
    quoque glória illústres, migrárunt ad Dóminum. Sed quos unus veræ
    fraternitátis ac religiónis amor in vita sociáverat, unum páriter demórtuos
    contéxit sepúlcrum, únaque pópuli venerátio prosecúta est. Quaprópter
    Clemens undécimus et Benedíctus décimus tértius Pontífices máximi delátum
    iísdem a plúribus sǽculis indivíduum cultum confírmarunt; ac Leo décimus
    tértius, approbátis ántea miráculis, post indúltam veneratiónem ad
    collectívam eorúmdem invocatiónem a Deo patrátis, eósdem anno quinquagésimo
    sacerdótii sui Sanctórum honóribus cumulávit, eorúmque memóriam Offício et
    Missa in univérsa Ecclésia quotánnis recoléndam instítuit.
lectio94:
  - Sǽculo tértio décimo, septem e Florentína nobilitáte viri, nimírum Bonfílius
    Monáldius, Bonajúncta Manéttus, Manéttus Antellénsis, Amidéus de Amidéis,
    Ugúccio Ugucciónum, Sostenéus de Sostenéis et Aléxius Falconérius, in
    rurálem quamdam ædículam secessére, Christi passiónem ac mæstíssimæ ejúsdem
    Matris dolóres assídue recoléntes. Illis beáta Virgo, sacra Parascéves die
    appárens lúgubrem vestem, quam indúerent, osténdit, sibíque acceptíssimum
    fore significávit, ut novum regulárem órdinem excitárent, qui jugem
    recóleret ac promovéret memóriam dolórum, quos ipsa pértulit sub Cruce
    Dómini. Tunc sancti illi viri, beáto Petro, órdinis Prædicatórum Mártyre,
    adjutóre, órdinem Servórum beátæ Vírginis instituérunt, et cum sóciis
    civitátes et óppida excúrrere cœpérunt, ubíque Christum crucifíxum verbo et
    exémplo prædicántes. Quos vero unus veræ fraternitátis amor in vita
    sociáverat, unum páriter demórtuos contéxit sepúlcrum, únaque pópuli
    venerátio prosecúta est. Quare Clemens undécimus et Benedíctus décimus
    tértius delátum iísdem indivíduum cultum confirmavérunt; Leo autem décimus
    tértius eos albo Sanctórum accénsuit.
