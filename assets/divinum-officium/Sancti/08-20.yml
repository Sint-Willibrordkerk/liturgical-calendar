lectio94:
  - Bernárdus, Fontánis in Burgúndia honésto loco natus, usque a puerítia
    castitátem diligentíssime cóluit. Ætáte duórum et vigínti annórum,
    monastérium Cisterciénse, unde hujus nóminis ordo incépit, ingréssus,
    fratres quoque suos aliósque multos addúxit ad eándem religiónem
    suscipiéndam. In vigíliis et oratiónibus mirífice se exercébat. Elucébat in
    eo humílitas, misericórdia, benígnitas, prudéntia, et assíduum cæléstia
    meditándi stúdium. Factus abbas Claravallénsis, multis in locis ædificávit
    monastéria, ubi præclára ejus institútio ac disciplína diu víguit. Multa
    prætérea scripsit, in quibus appáret, eum doctrína pótius divínitus trádita
    quam labóre comparáta instrúctum fuísse. Exorátus a magnis princípibus de
    eórum componéndis controvérsiis et de ecclesiásticis rebus constituéndis,
    sǽpius in Itáliam venit. Innocéntium secúndum Pontíficem máximum in
    confutándo schísmate Petri Leónis egrégie adjúvit. Tres et sexagínta annos
    natus, óptime de Ecclésia méritus, obdormívit in Dómino.
  - "&teDeum"
