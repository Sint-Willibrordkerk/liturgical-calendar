lectio93:
  - Felix Románus, patre Constántio, Aureliáno imperatóre præfuit Ecclesiæ.
    Constítuit ut Missa supra memórias et sepúlcra Mártyrum celebrarétur. Qui
    cum mense Decémbri habuísset ordinatiónes duas, et creásset presbýteros
    novem, diáconos quinque, epíscopos per divérsa loca quinque, martyrio
    coronátus, via Aurelia sepelítur in basílica quam a se ædificátam dedicárat.
    Vixit in pontificátu annos duos, menses quátuor, dies vigínti novem.
  - "&teDeum"
