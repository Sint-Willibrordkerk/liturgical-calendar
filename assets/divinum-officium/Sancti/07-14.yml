lectio94:
  - Bonaventúra, Balneorégii in Etrúria natus adoléscens religiónem sancti
    Francísci Assisiénsis suscépit; in qua stúdio litterárum déditus, Alexándro
    de Ales præceptóre tantum profécit, ut séptimo post anno Parísiis libros
    Sententiárum públice summa cum laude sit interpretátus. Vir summæ
    mansuetúdinis ac humilitátis, erga Christi Dómini passiónem piíssime
    afféctus, vix quinque et trigínta annos natus, creátus est totíus órdinis
    miníster generális. Quod munus prudénter administrándo, præcláram est laudem
    consecútus non solum doctrínæ et sanctimóniæ, sed étiam ingénii et
    dexteritátis. Qua fama ductus Gregórius Papa décimus cardinálem ipsum et
    epíscopum Albanénsem creávit. Multa ópera doctíssime conscrípsit, in primis
    Commentária in quátuor libros Sententiárum. Obiit Lugdúni, duránte concílio,
    ætátis suæ anno quinquagésimo tértio, et a Xysto quarto inter Sanctos
    relátus est. Xystus vero quintus Doctóris Seráphici nómini eum insignívit.
