  - "Timéte Dóminum, omnes sancti ejus: quóniam nihil deest timéntibus eum. v.
    Inquiréntes autem Dóminum, non defícient omni bono."
  - Allelúja, allelúja.
  - "!Sap 3:7"
  - Fulgébunt justi, et tamquam scintíllæ in arundinéto current in ætérnum.
    Allelúja.
gradualep:
  - Allelúja, allelúja.
  - "!Sap 3:7"
  - Fulgébunt justi, et tamquam scintíllæ in arundinéto discúrrent in ætérnum.
  - "!Ps 88:6."
  - "V. Confitebúntur cœli mirabília tua, Dómine: étenim veritátem tuam in
    ecclésia sanctórum. Allelúja."
tractus:
  - "!Ps 125:5-6"
  - Qui séminant in lácrimis, in gáudio metent.
  - V. Eúntes ibant et flebant, mitténtes sémina sua.
  - V. Veniéntes autem vénient cum exsultatióne, portántes manípulos suos.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Marcum
  - "!Marc 16:15-18"
  - "In illo témpore: Dixit Jesus discípulis suis: Eúntes in mundum univérsum,
    prædicáte Evangélium omni creatúræ. Qui credíderit, et baptizátus fúerit,
    salvus erit: qui vero non credíderit, condemnábitur. Signa autem eos, qui
    credíderint, hæc sequéntur: In nómine meo dæmónia ejícient: linguis
    loquéntur novis: serpéntes tollent: et si mortíferum quid bíberint, non eis
    nocébit: super ægros manus impónent, et bene habébunt."
offertorium:
  - "!Ps 31:11"
  - "Lætámini in Dómino et exsultáte, justi: et gloriámini, omnes recti corde."
secreta:
  - "Accépta sit in conspéctu tuo, Dómine, nostra devótio: et eórum nobis fiat
    supplicatióne salutáris, pro quorum sollemnitáte defértur."
  - $Per Dominum
communio:
  - "!Marc 16:17; 16:18"
  - "Signa autem eos, qui in me credunt, hæc sequéntur: dæmónia ejícient: super
    ægros manus impónent, et bene habébunt."
postcommunio:
  - "Refécti participatióne múneris sacri, quǽsumus, Dómine, Deus noster: ut,
    cujus exséquimur cultum, intercedéntibus sanctis Martýribus tuis Cyríaco,
    Largo et Smarágdo, sentiámus efféctum."
  - $Per Dominum
