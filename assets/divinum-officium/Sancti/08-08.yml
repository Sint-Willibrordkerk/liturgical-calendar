introitus:
  - "!Ps 33:10-11"
  - "v. Timéte Dóminum, omnes sancti ejus, quóniam nihil deest timéntibus eum:
    dívites eguérunt et esuriérunt: inquiréntes autem Dóminum non defícient omni
    bono."
  - "!Ps 33:2"
  - "Benedícam Dóminum in omni témpore: semper laus ejus in ore meo."
  - "&Gloria"
  - "v. Timéte Dóminum, omnes sancti ejus, quóniam nihil deest timéntibus eum:
    dívites eguérunt et esuriérunt: inquiréntes autem Dóminum non defícient omni
    bono."
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Thessalonicénses
  - "!1 Thess 2:13-16"
  - "Fratres: Grátias ágimus Deo sine intermissióne: quóniam, cum accepissétis a
    nobis verbum audítus Dei, accepístis illud, non ut verbum hóminum, sed -
    sicut est vere - verbum Dei, qui operátur in vobis, qui credidístis. Vos
    enim imitatóres facti estis, fratres, ecclesiárum Dei, quæ sunt in Judæa in
    Christo Jesu: quia éadem passi estis et vos a contribúlibus vestris, sicut
    et ipsi a Judæis: qui et Dóminum occidérunt Jesum et Prophétas: et nos
    persecúti sunt, et Deo non placent, et ómnibus homínibus adversántur,
    prohibéntes nos géntibus loqui, ut salvæ fiant, ut ímpleant peccáta sua
    semper: pervénit enim ira Dei super illos usque in finem."
graduale:
