oratio:
  - "Adésto, Dómine, supplicatiónibus nostris: ut, qui ex iniquitáte nostra reos
    nos esse cognóscimus, beatórum Mártyrum tuórum Vincéntii et Anastásii
    intercessióne liberémur."
  - $Per Dominum
secreta:
  - "@Commune/C3a"
postcommunio:
  - "Quǽsumus, omnípotens Deus: ut, qui cœléstia aliménta percépimus,
    intercedéntibus beátis Martýribus tuis Vincéntio et Anastásio, per hæc
    contra ómnia advérsa muniámur."
  - $Per Dominum
