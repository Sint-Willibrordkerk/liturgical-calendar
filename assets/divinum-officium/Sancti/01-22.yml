lectio4:
  - Vincentius, Oscæ in Hispánia citeriore natus, a prima ætate stúdiis déditus,
    sacras litteras a Valerio Cæsaraugustano episcopo didicit; cujus étiam
    partes suscépit prædicándi Evangélium, quod epíscopus, propter linguæ
    impediméntum, prædicatiónis officio fungi non poterat. Ea re ad Dacianum,
    provinciæ a Diocletiáno et Maximiáno præpositum, delata, Vincentius
    Cæsaraugustæ comprehénditur, et vinctus ad Dacianum Valéntiam adducitur. Ubi
    verbéribus et equuleo tortus, multis præséntibus, cum nulla aut tormentórum
    vi, aut acerbitate vel lenitate verbórum a proposito deterreri posset; in
    cratícula impositus, prunis ardéntibus suppositis, ac férreis unguibus
    excarnificatus, candentibúsque láminis exustus, íterum ducitur in carcerem
    stratum testáceis fragmentis, ut ejus nudum corpus, somno oppressum, a
    subjectis étiam testárum aculeis torquerétur.
lectio5:
  - "Verum, illo in tenebricosa incluso custódia, claríssimus splendor obortus
    totum carcerem illustrávit; quæ lux cum summa admiratióne omnes, qui
    aderant, affecísset, res a custode carceris ad Dacianum defertur. Qui
    eductum in molli cúlcitra collocat; et quem cruciátibus in suam senténtiam
    trahere non poterat, deliciis perducere conátur. Sed invictus Vincentii
    animus, Jesu Christi fide speque munítus, vicit ómnia; et ignis, ferri,
    tortórum immanitate superata, victor ad cælestem martyrii corónam advolávit,
    undecimo Kalendas Februarii. Cujus corpus, cum projectum esset inhumátum,
    corvus et a volucribus et a lupo únguibus, rostro, alis mirabíliter
    defendit. Qua re cógnita, Dacianus illud in altum mare demergi jubet: sed
    inde étiam divinitus ejectum ad littus, Christiáni sepeliunt."
lectio6:
  - Anastasius Persa, monachus, Heraclío imperatóre, cum sanctam Jerosolymórum
    terram visitasset, ad Cæsaréam Palæstinæ pro Christi religióne víncula et
    verbera constanter perpéssus est. Mox a Persis ob eamdem causam variis
    cruciátibus afféctus, a rege Chósroa una cum septuagínta aliis Christiánis
    secúri percútitur. Cujus relíquiæ primum Jerosolymam ad monastérium, in quo
    monasticam vitam proféssus erat, deínde Romam delátæ, collocátæ sunt in
    monasterio ad Aquas Sálvias.
lectio94:
  - Vincéntius, Oscæ in Hispánia citerióre natus, a prima ætáte stúdiis déditus,
    sacras lítteras a Valério Cæsaraugustáno epíscopo dídicit; cujus étiam
    partes suscépit prædicándi Evangélium, quod epíscopus, propter linguæ
    impediméntum, prædicatiónis offício fungi non póterat. Ea re ad Daciánum
    impiíssimum prǽsidem deláta, Vincéntius ab eódem Valéntiam addúcitur; et
    cárceres, famem, equúleum alíaque tormentórum génera perpéssus, ad martýrii
    corónam advolávit undécimo caléndas februárii. Anastásius Persa, mónachus,
    Heraclío imperatóre, cum sanctam Jerosolymórum terram visitásset, ad
    Cæsaréam Palæstínæ pro Christi religióne víncula et vérbera constánter
    perpéssus est. Mox a Persis ob eándem causam váriis cruciátibus afféctus, a
    rege Chósroa una cum septuagínta áliis Christiánis secúri percútitur. Cujus
    relíquiæ primum Jerosólymam, deínde Romam delátæ, collocátæ sunt in
    monastério ad Aquas Sálvias.
  - "&teDeum"
