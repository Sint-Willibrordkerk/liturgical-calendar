lectio4:
  - Ex libro sancti Joánnis Damascéni de fide orthodóxa
  - "!Liber 4, Cap. 15"
  - Jóachim lectíssimam illam ac summis láudibus dignam mulíerem Annam
    matrimónio sibi copulávit. Verum, quemádmodum prisca illa Anna, cum
    sterilitátis morbo laboráret, per oratiónem ac promissiónem, Samuélem
    procreávit; eódem modo hæc étiam, per obsecratiónem et promissiónem, Dei
    Genetrícem a Deo accépit, ut ne hic quoque cuíquam ex illústribus matrónis
    céderet. Itaque grátia (nam hoc sonat Annæ vocábulum) Dóminam parit (id enim
    Maríæ nómine significátur). Vere étenim rerum ómnium conditárum Dómina facta
    est, cum Creatóris Mater éxstitit. In lucem autem éditur in domo probáticæ
    Jóachim, atque ad templum addúcitur. Ac deínde, in domo Dei plantáta atque
    per Spíritum sagináta, instar olívæ frugíferæ virtútum ómnium domicílium
    effícitur; ut quæ vidélicet ab omni hujúsce vitæ et carnis concupiscéntia
    mentem abstraxísset, atque ita vírginem una cum córpore ánimam conservásset,
    ut eam decébat, quæ Deum sinu suo exceptúra erat.
lectio5:
  - Ex libro sancti Ambrósii Epíscopi de Virgínibus
  - "!Liber 2, post initium."
  - "Talis fuit Maria, ut ejus uníus vita ómnium sit disciplína. Si ígitur
    auctor non dísplicet, opus probémus; ut, quæcúmque sibi ejus exoptat
    præmium, imitétur exemplum. Quantæ in una vírgine spécies virtútum émicant!
    Secretum verecúndiæ, vexíllum fidei, devotiónis obsequium; virgo intra
    domum, comes ad ministérium, mater ad templum. O quantis illa virgínibus
    occurret! quantas complexa, ad Dóminum trahet, dicens: Hæc torum fílii mei,
    hæc thálamos nuptiales immaculáto servávit pudóre!"
lectio6:
  - "Quid ergo éxsequar cibórum parsimóniam, officiórum redundantiam: álterum
    ultra natúram superfuísse, álterum pene ipsi natúræ defuísse? Illic nulla
    intermissa témpora, hic congeminatos jejúnio dies. Et, si quando reficiéndi
    successísset volúntas, cibus plerumque obvius, qui mortem arcéret, non
    delicias ministraret. Dormire non prius cupiditas quam necessitas fuit; et
    tamen, cum quiésceret corpus, vigilaret animus, qui frequenter in somnis aut
    lecta répetit, aut somno interrupta continuat, aut dispósita gerit, aut
    gerenda prænuntiat."
