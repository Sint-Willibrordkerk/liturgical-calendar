lectio4:
  - Gertrúdis, Islébii in Saxónia nobili genere nata, quinquénnis in monastério
    Rodardénsi, ordinis sancti Benedicti, virginitátem suam ac seipsam Jesu
    Christo óbtulit. Quo ex témpore a mundanis rebus prorsus aliena, virtútique
    sedulo intenta, cæléstis vitæ genus instituit. Ad humaniórum litterárum
    notítiam, rerum divinárum cognitiónem adjunxit; quarum meditatióne
    vehementius ad virtútem incensa, brevi christianam perfectiónem adepta est.
    De Christo ejusque vitæ mystériis sæpenúmero pio cum animi sensu loquebátur,
    unamque Dei glóriam cogitans, ad illam vota sua ómnia et actiónes referebat.
    Quamvis autem multis exímiis natúræ et gratiæ donis a Deo aucta esset, ita
    tamen sibi ipsa vilescebat, ut, inter præcipua divinæ bonitátis miracula,
    hoc item memoráret, quod se indigníssimam misericorditer sustinéret.
lectio5:
  - Trigesimum ætátis annum agens, primum Rodardénsis monasterii, ubi religiosam
    vitam est professa, deínde Elpediáni præses electa, quadragínta annórum
    spátio, ea caritate, prudéntia, et regularis disciplinæ studio munus obívit,
    ut cœnobium religiosæ perfectiónis domicílium viderétur. Utrobíque vero,
    licet esset ómnium mater et magistra, ómnium tamen minima haberi volebat, ac
    demissióne pari ministram se exhibebat. Quo liberius Deo vacaret, vigiliis,
    abstinéntia aliisque cruciátibus corpus afflixit; semperque sui símilis,
    morum innocéntiam, mansuetúdinem ac patiéntiam prætulit singularem.
    Proximórum salúti omni ope studuit, piæque curæ copiósum fructum rétulit.
    Divini amoris vi frequéntes patiebátur éxstases, altissimǽque
    contemplatiónis et divinæ uniónis donum obtinuit.
lectio6:
  - Ut meritum acceptíssimæ sibi sponsæ Christus osténderet, in corde Gertrudis
    jucundam sibi esse mansiónem testátus est. Deiparam Vírginem, véluti matrem
    et curatricem a Jesu acceptam, pietáte præcipua prosequebátur, ab eáque
    multa accépit beneficia. Erga diviníssimum Eucharistiæ sacraméntum et
    passiónem Dómini tanto amóre cum grati animi sensu afficiebátur, ut intérdum
    ubéribus lácrimis perfunderétur. Justórum ánimas, piacularibus flammis
    addictas, quotidiánis subsidiis et precibus juvábat. Multa ad confovéndam
    pietátem scripsit. Divinárum étiam revelatiónum et prophetíæ dono cláruit.
    Dénique, flagrantíssimo Dei amóre potius quam morbo languéscens, anno Dómini
    millesimo ducentésimo nonagesimo secundo vita decessit. Miraculis vivens et
    post mortem a Deo illustráta est.
lectio94:
  - Gertrúdis, Islébii in Saxónia nata, quinquénnis in monastério Rodardénsi,
    órdinis sancti Benedícti, virginitátem suam ac seípsam Jesu Christo óbtulit.
    Sanctam Mechtíldem magístram hábuit, qua duce ad altíssima contemplatiónis
    dona pervénit. Erga diviníssimum Eucharístiæ sacraméntum et passiónem Dómini
    tanta caritáte æstuábat, ut, ea recógitans, ubéribus lácrimis perfunderétur.
    Multa ad confovéndam pietátem scripsit. Divinárum étiam revelatiónum et
    prophetíæ dono cláruit. Dénique, flagrantíssimo Dei amóre pótius quam morbo
    languéscens, vita decéssit, miráculis vivens et post mortem illústris.
  - "&teDeum"
