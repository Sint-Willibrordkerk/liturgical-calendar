lectio1:
  - "!Isa 9:1-6"
  - "1 Primo témpore alleviáta est terra Zábulon, et terra Néphthali: et
    novíssimo aggraváta est via maris trans Jordánem Galilǽæ géntium."
  - "2 Pópulus qui ambulábat in ténebris, vidit lucem magnam: habitántibus in
    regióne umbræ mortis, lux orta est eis."
  - 3 Multiplicásti gentem, et non magnificásti lætítiam. Lætabúntur coram te,
    sicut qui lætántur in messe, sicut exsúltant victóres, capta præda, quando
    dívidunt spólia.
  - 4 Jugum enim óneris ejus, et virgam húmeri ejus, et sceptrum exactóris ejus
    superásti sicut in die Mádian.
  - 5 Quia omnis violénta prædátio cum tumúltu, et vestiméntum mistum sánguine,
    erit in combustiónem, et cibus ignis.
  - "6 Párvulus enim natus est nobis, et fílius datus est nobis, et factus est
    principátus super húmerum ejus: et vocábitur nomen ejus, Admirábilis,
    Consiliárius, Deus, Fortis, Pater futúri sǽculi, Princeps pacis."
responsory1:
  - "R. Hódie nobis cælórum Rex de Vírgine nasci dignátus est, ut hóminem
    pérditum ad cæléstia regna revocáret:"
  - "* Gaudet exércitus Angelórum: quia salus ætérna humáno géneri appáruit."
  - V. Glória in excélsis Deo, et in terra pax homínibus bonæ voluntátis.
  - "R. Gaudet exércitus Angelórum: quia salus ætérna humáno géneri appáruit."
  - V. Glória Patri, et Fílio, et Spirítui Sancto.
  - "R. Hódie nobis cælórum Rex de Vírgine nasci dignátus est, ut hóminem
    pérditum ad cæléstia regna revocáret: * Gaudet exércitus Angelórum: quia
    salus ætérna humáno géneri appáruit."
lectio2:
  - "!Isa 40:1-8"
  - 1 Consolámini, consolámini, pópule meus, dicit Deus vester.
  - "2 Loquímini ad cor Jerúsalem, et advocáte eam: quóniam compléta est malítia
    ejus, dimíssa est iníquitas illíus: suscépit de manu Dómini duplícia pro
    ómnibus peccátis suis."
  - "3 Vox clamántis in desérto: Paráte viam Dómini, rectas fácite in solitúdine
    sémitas Dei nostri."
  - "4 Omnis vallis exaltábitur, et omnis mons et collis humiliábitur: et erunt
    prava in dirécta, et áspera in vias planas."
  - "5 Et revelábitur glória Dómini: et vidébit omnis caro páriter quod os
    Dómini locútum est."
  - "6 Vox dicéntis: Clama. Et dixi: Quid clamábo? Omnis caro fœnum, et omnis
    glória ejus quasi flos agri."
  - "7 Exsiccátum est fœnum, et cécidit flos: quia spíritus Dómini sufflávit in
    eo. Vere fœnum est pópulus:"
  - "8 exsiccátum est fœnum, et cécidit flos: Verbum autem Dómini nostri manet
    in ætérnum."
responsory2:
  - "R. Hódie nobis de cælo pax vera descéndit:"
  - "* Hódie per totum mundum mellíflui facti sunt cæli."
  - V. Hódie illúxit nobis dies redemptiónis novæ, reparatiónis antíquæ,
    felicitátis ætérnæ.
  - R. Hódie per totum mundum mellíflui facti sunt cæli.
lectio3:
  - "!Isa 52:1-6"
  - "1 Consúrge, consúrge, indúere fortitúdine tua, Sion, indúere vestiméntis
    glóriæ tuæ, Jerúsalem, cívitas sancti: quia non adíciet ultra ut pertránseat
    per te incircumcísus, et immúndus."
  - "2 Excútere de púlvere, consúrge, sede, Jerúsalem: solve víncula colli tui,
    captíva fília Sion."
  - "3 Quia hæc dicit Dóminus: Gratis venumdáti estis, et sine argénto
    redimémini."
  - "4 Quia hæc dicit Dóminus Deus: In Ægýptum descéndit pópulus meus in
    princípio, ut colónus esset ibi: et Assur absque ulla causa calumniátus est
    eum."
  - "5 Et nunc quid mihi est hic, dicit Dóminus, quóniam ablátus est pópulus
    meus gratis? Dominatóres ejus iníque agunt, dicit Dóminus: et júgiter tota
    die nomen meum blasphemátur."
  - "6 Propter hoc sciet pópulus meus nomen meum, in die illa: quia ego ipse qui
    loquébar, ecce adsum."
responsory3:
  - R. Quem vidístis, pastóres? dícite, annuntiáte nobis, in terris quis
    appáruit?
  - "* Natum vídimus, et choros Angelórum collaudántes Dóminum."
  - V. Dícite, quidnam vidístis? et annuntiáte Christi nativitátem.
  - R. Natum vídimus, et choros Angelórum collaudántes Dóminum.
  - "&Gloria"
  - R. Natum vídimus, et choros Angelórum collaudántes Dóminum.
lectio4:
  - Sermo sancti Leónis Papæ
  - "!Sermo 1 de Nativitate Domini"
  - "Salvátor noster, dilectíssimi, hódie natus est: gaudeámus. Neque enim fas
    est locum esse tristítiæ, ubi natális est vitæ: quæ, consúmpto mortalitátis
    timóre, nobis íngerit de promíssa æternitáte lætítiam. Nemo ab hujus
    alacritátis participatióne secérnitur. Una cunctis lætítiæ commúnis est
    rátio: quia Dóminus noster, peccáti mortísque destrúctor, sicut nullum a
    reátu líberum réperit, ita liberándis ómnibus venit. Exsúltet sanctus, quia
    appropínquat ad palmam: gáudeat peccátor, quia invitátur ad véniam: animétur
    gentílis, quia vocátur ad vitam. Dei namque Fílius secúndum plenitúdinem
    témporis, quam divíni consílii inscrutábilis altitúdo dispósuit,
    reconciliándam auctóri suo natúram géneris assúmpsit humáni, ut invéntor
    mortis diábolus, per ipsam, quam vícerat, vincerétur."
responsory4:
  - "R. O magnum mystérium, et admirábile sacraméntum, ut animália vidérent
    Dóminum natum, jacéntem in præsépio:"
  - "* Beáta Virgo, cujus víscera meruérunt portáre Dóminum Christum."
  - "V. Ave, María, grátia plena: Dóminus tecum."
  - R. Beáta Virgo, cujus víscera meruérunt portáre Dóminum Christum.
lectio5:
  - "In quo conflíctu pro nobis ínito, magno et mirábili æquitátis jure certátum
    est, dum omnípotens Dóminus cum sævíssimo hoste non in sua majestáte, sed in
    nostra congréditur humilitáte: obíciens ei eándem formam, eandémque natúram,
    mortalitátis quidem nostræ partícipem, sed peccáti totíus expértem. Aliénum
    quippe ab hac nativitáte est, quod de ómnibus légitur: Nemo mundus a sorde,
    nec infans, cujus est uníus diéi vita super terram. Nihil ergo in istam
    singulárem nativitátem de carnis concupiscéntia transívit, nihil de peccáti
    lege manávit. Virgo régia Davídicæ stirpis elígitur, quæ sacro gravidánda
    fœtu, divínam humanámque prolem prius concíperet mente, quam córpore. Et ne
    supérni ignára consílii ad inusitátos pavéret affátus, quod in ea operándum
    erat a Spíritu Sancto, collóquio discit angélico: nec damnum credit pudóris,
    Dei Génetrix mox futúra."
responsory5:
  - "R. Beáta Dei Génetrix María, cujus víscera intácta pérmanent:"
  - "* Hódie génuit Salvatórem sǽculi."
  - "V. Beáta, quæ crédidit: quóniam perfécta sunt ómnia, quæ dicta sunt ei a
    Dómino."
  - R. Hódie génuit Salvatórem sǽculi.
lectio6:
  - "Agámus ergo, dilectíssimi, grátias Deo Patri, per Fílium ejus in Spíritu
    Sancto: qui propter multam caritátem suam, qua diléxit nos, misértus est
    nostri: et cum essémus mórtui peccátis, convivificávit nos Christo, ut
    essémus in ipso nova creatúra, novúmque figméntum. Deponámus ergo véterem
    hóminem cum áctibus suis: et adépti participatiónem generatiónis Christi,
    carnis renuntiémus opéribus. Agnósce, o Christiáne, dignitátem tuam: et
    divínæ consors factus natúræ, noli in véterem vilitátem degéneri
    conversatióne redíre. Meménto, cujus cápitis et cujus córporis sis membrum.
    Reminíscere, quia érutus de potestáte tenebrárum, translátus es in Dei lumen
    et regnum."
responsory6:
  - "R. Sancta et immaculáta virgínitas, quibus te láudibus éfferam, néscio:"
  - "* Quia quem cæli cápere non póterant, tuo grémio contulísti."
  - V. Benedícta tu in muliéribus, et benedíctus fructus ventris tui.
  - R. Quia quem cæli cápere non póterant, tuo grémio contulísti.
  - "&Gloria"
  - R. Quia quem cæli cápere non póterant, tuo grémio contulísti.
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 2:1-14"
  - "In illo témpore: Exiit edíctum a Cǽsare Augústo, ut describerétur univérsus
    orbis. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 8 in Evangelia"
  - "Quia, largiénte Dómino, Missárum solémnia ter hódie celebratúri sumus,
    loqui diu de evangélica lectióne non póssumus: sed nos áliquid vel bréviter
    dícere, Redemptóris nostri Natívitas ipsa compéllit. Quid est enim, quod
    nascitúro Dómino mundus descríbitur, nisi hoc, quod apérte monstrátur, quia
    ille apparébat in carne, qui eléctos suos adscríberet in æternitáte? Quo
    contra de réprobis per prophétam dícitur: Deleántur de libro vivéntium, et
    cum justis non scribántur. Qui bene étiam in Béthlehem náscitur: Béthlehem
    quippe domus panis interpretátur. Ipse namque est, qui ait: Ego sum panis
    vivus, qui de cælo descéndi. Locus ergo, in quo Dóminus náscitur, domus
    panis ántea vocátus est; quia futúrum profécto erat, ut ille ibi per
    matériam carnis apparéret, qui electórum mentes intérna satietáte refíceret.
    Qui non in paréntum domo, sed in via náscitur: ut profécto osténderet, quia
    per humanitátem suam, quam assúmpserat, quasi in aliéno nascebátur."
responsory7:
  - "R. Beáta víscera Maríæ Vírginis, quæ portavérunt ætérni Patris Fílium: et
    beáta úbera, quæ lactavérunt Christum Dóminum:"
  - "* Qui hódie pro salúte mundi de Vírgine nasci dignátus est."
  - "V. Dies sanctificátus illúxit nobis: veníte, gentes, et adoráte Dóminum."
  - R. Qui hódie pro salúte mundi de Vírgine nasci dignátus est.
lectio8:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 2:15-20"
  - "In illo témpore: Pastóres loquebántur ad ínvicem: Transeámus usque
    Béthlehem, et videámus hoc verbum, quod factum est, quod Dóminus osténdit
    nobis. Et réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Lib. 2 in cap. 2. Lucæ, circa medium"
  - "Vidéte Ecclésiæ surgéntis exórdium: Christus náscitur, et pastóres vigiláre
    cœpérunt; qui géntium greges, pécudum modo ante vivéntes, in caulam Dómini
    congregárent, ne quos spiritálium bestiárum per offúsas nóctium ténebras
    pateréntur incúrsus. Et bene pastóres vígilant, quos bonus pastor infórmat.
    Grex ígitur pópulus, nox sǽculum, pastóres sunt sacerdótes. Aut fortásse
    étiam ille sit pastor, cui dícitur: Esto vígilans, et confírma. Quia non
    solum epíscopos ad tuéndum gregem Dóminus ordinávit, sed étiam Angelos
    destinávit."
responsory8:
  - "R. Verbum caro factum est, et habitávit in nobis:"
  - "* Et vídimus glóriam ejus, glóriam quasi Unigéniti a Patre, plenum grátiæ
    et veritátis."
  - V. Omnia per ipsum facta sunt, et sine ipso factum est nihil.
  - R. Et vídimus glóriam ejus, glóriam quasi Unigéniti a Patre, plenum grátiæ
    et veritátis.
  - "&Gloria"
  - R. Et vídimus glóriam ejus, glóriam quasi Unigéniti a Patre, plenum grátiæ
    et veritátis.
lectio9:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 1:1-14"
  - In princípio erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum. Et
    réliqua.
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tract. 1 in Joann., circa médium"
  - "Ne vile áliquid putáres quale consuevísti cogitáre, cum verba humána
    soléres audíre, audi quid cógites: Deus erat Verbum. Exeat nunc néscio quis
    infidélis Ariánus, et dicat quia Verbum Dei factum est. Quómodo potest
    fíeri, ut Verbum Dei factum sit, quando Deus per Verbum fecit ómnia? Si et
    Verbum Dei ipsum factum est: per quod áliud verbum factum est? Si hoc dicis,
    quia hoc est verbum Verbi, per quod factum est illud; ipsum dico ego únicum
    Fílium Dei. Si autem non dicis verbum Verbi, concéde non factum, per quod
    facta sunt ómnia. Non enim per seípsum fíeri pótuit, per quod facta sunt
    ómnia. Crede ergo Evangelístæ."
  - "&teDeum"
ant-laudes_:
  - Quem vidístis, * pastóres? dícite, annuntiáte nobis, in terris quis
    appáruit? Natum vídimus, et choros Angelórum collaudántes Dóminum, allelúja,
    allelúja.
  - "Génuit puérpera * Regem, cui nomen ætérnum, et gáudia matris habens cum
    virginitátis honóre: nec primam símilem visa est, nec habére sequéntem,
    allelúja."
  - "Angelus ad pastóres * ait: Annúntio vobis gáudium magnum: quia natus est
    vobis hódie Salvátor mundi, allelúja."
  - "Facta est cum Angelo * multitúdo cæléstis exércitus laudántium Deum, et
    dicéntium: Glória in excélsis Deo, et in terra pax homínibus bonæ
    voluntátis, allelúja."
  - "Párvulus fílius * hódie natus est nobis: et vocábitur Deus, Fortis,
    allelúja, allelúja."
ant-laudesc:
  - "Génuit puérpera * Regem, cui nomen ætérnum, et gáudia matris habens cum
    virginitátis honóre: nec primam símilem visa est, nec habére sequéntem,
    allelúja."
  - "Lux orta est * super nos: quia hódie natus est Salvátor, allelúia."
  - "Virgo hódie fidélis, * etsi Verbum génuit incarnátum, Virgo mansit et post
    partum, quam laudántes omnes dícimus: Benedícta tu in muliéribus."
  - "Gaudeámus omnes fidéles, * Salvátor noster natus est in mundo: hódie
    procéssit proles magnífici gérminis, et persevérat pudor virginitátis."
  - "Hódie * intácta Virgo Deum nobis génuit téneris indútum membris, quem
    lactáre méruit: omnes ipsum adorémus, qui venit salváre nos."
