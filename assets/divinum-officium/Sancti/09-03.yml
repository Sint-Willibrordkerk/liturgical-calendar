lectio4:
  - Pius Papa décimus, cui nomen ántea Joséphus Sarto, in Venetórum pago natus
    est, quem Riése vocant, paréntibus quidem humílibus, sed probitáte ac
    pietáte conspícuus. Inter Seminárii Patavíni alúmnos adscríptus, ita pietáte
    ac doctrína profécit, ut condiscípulis exémplo, moderatóribus admiratióni
    esset. Sacerdótio initiátus, in óppido Tómbolo primum, qua vicárius
    cooperátor, dein Salatiáni qua párochus, per plures annos adlaborávit;
    quibus in obeúndis munéribus, tanta caritátis effusióne, tanto sacerdotáli
    zelo et sanctitáte vitæ excélluit, ut Epíscopus Tarvisínus inter canónicos
    cathedrális ecclésiæ eum cooptáret, eúmque Cúriæ episcopális cancellárium
    simúlque Seminárii diœcesáni spirituálem moderatórem renuntiáret. Hæc
    offícia tam egrégie persecútus, a Leóne tértio décimo, cui erat
    probatíssimus, Mantuánæ ecclésiæ Antístes fuit renuntiátus.
lectio5:
  - Boni pastóris nullam partem déserens, eo máxime conténdit, ut juvéntus in
    sortem Dómini vocáta rite ad sacra instituerétur, piæ consociatiónes novis
    augéscerent increméntis, rítibus divíni cultus plus decóris ac pietátis
    accéderet. Præcépta quibus cívitas christiána nítitur, áltius proclamáre non
    désiit, et qui vitam ínopem ipse ducébat, paupéribus numquam omísit afférre
    levámen. Tot ígitur suffragántibus méritis, inter purpurátos Patres adléctus
    et Venetiárum Patriárcha creátus est. Dénique post Leónis décimi tértii
    óbitum, cum Patrum Cardinálium suffrágia in eum coaléscerent, cumque ipse
    supplicatiónibus et lácrimis tantum munus a se avértere frustra conátus
    esset, suasiónibus tandem cedens, « accépto in crucem », inquit, et Summi
    Pontificátus ápicem ut crucem a Deo sibi oblátam, demísso sed forti ánimo
    suscépit.
lectio6:
  - "In Petri cáthedra constitútus, nihil de prístina vitæ ratióne remísit.
    Humilitáte præsértim, simplicitáte ac paupertáte refúlsit, ita ut in suo
    testaménto scríbere potúerit: « Pauper natus sum, pauper vixi, pauper mori
    cúpio ». Humílitas vero ánimi fortitúdinem in eo alébat, cum de Dei glória,
    Ecclésiæ libertáte, animarúmque salúte agerétur. Vir acérrimi ingénii et
    propósiti tenax, inter vicésimi ineúntis sæculi procéllas, Ecclésiam
    fírmiter rexit, et præclaríssimis ornávit institútis. Músicam sacram ad
    prístinum splendórem ac dignitátem revocávit; sacrórum Bibliórum stúdiis
    príncipem sedem Romæ constítuit; Románam Cúriam sapiénter reformávit; leges
    de fidélibus per catechísmum instituéndis restítuit; Eucharísticæ mensæ
    crebriórem, imo et cotidiánam consuetúdinem indúxit, ejúsque accéssum púeris
    quoque a primo ratiónis usu apéruit; actiónis cathólicæ increménta sédulo
    promóvit; sólidæ cleri institutióni provídit, ádditis quoque semináriis per
    regiónes dispósitis; sacerdótes omnes ad interiórem vitam coléndam alléxit;
    leges Ecclésiæ in unum corpus redégit; erróres perniciosíssimos, modernísmi
    appellatióne comprehénsos, damnávit atque evéllit; civíle vétitum, quod
    dicunt, in Pontíficis Máximi electióne rejécit. Tandem labóribus fractus ac
    mæróre conféctus ob bellum Europæum tunc exórtum, die vicésima mensis
    Augústi anni millésimi nongentésimi décimi quarti, ad cæléste præmium
    evolávit. Eum ubíque terrárum sanctitátis fama clarum miraculísque
    fulgéntem, Pius Papa duodécimus, cuncto plaudénte orbe, in Sanctórum númerum
    rétulit."
lectio94:
  - Pius Papa décimus, cui nomen ántea Joséphus Sarto, in Venetórum pago, quem
    Riése vocant, natus est. Inter Seminárii Patavíni alúmnos adscríptus ac
    sacerdótio auctus, in óppido Tómbolo primum qua vicárius cooperátor, dein
    Salatiáni qua párochus, et Tarvísii qua canónicus et Cúriæ episcopális
    cancellárius, simúlque tanta excélluit, ut eum Leo décimus tértius ecclésiæ
    Mantuánæ præfécerit. Boni pastóris nullam partem déserens, juventúti in
    sortem Dómini vocátæ rite instituéndæ máxime adlaborávit; divíni cultus
    decórem et piárum consociatiónum increménta promóvit; páuperum inópiæ effúsa
    caritáte prospéxit. Tot suffragántibus méritis, inter purpurátos Patres
    adléctus et Venetiárum Patriárcha creátus est. Post Leónis décimi tértii
    óbitum, cum Patrum Cardinálium suffrágia in eum coaléscerent, frustra
    relúctans, Summum Pontificátum ut crucem suscépit. In Petri cáthedra
    constitútus, nihil de prístina vitæ ratióne remísit. Humilitáte præsértim,
    simplicitáte ac paupertáte refúlsit. Ecclésiam fírmiter rexit et
    præclaríssimis ornávit institútis. Fídei vigilantíssimus custos,
    modernísmum, ómnium hǽresum summam, damnávit ac protrívit; ecclesiásticæ
    libertátis vindex acérrimus, iis qui eam labefactáre conabántur, fórtiter
    óbstitit; sólidæ cleri institutióni provídit; leges Ecclésiæ in unum corpus
    redégit; cultum erga Eucharístiam et crebriórem ejúsdem usum máxime
    provéxit. Labóribus fractus ac mæróre conféctus ob bellum Europǽum tunc
    exórtum, die vicésima mensis augústi anni millésimi nongentésimi décimi
    quarti, ad cæléstem pátriam evolávit. Eum Pius duodécimus in Sanctórum
    númerum rétulit.
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 21:15-17"
  - "In illo témpore: Dixit Jesus Simóni Petro: Simon Joánnis, díligis me plus
    his? Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tractatus 123 in Joánnem. in medio"
  - "Rédditur negatióni trinæ trina conféssio, ne minus amóri lingua sérviat,
    quam timóri: et plus vocis elicuísse videátur mors ímminens, quam vita
    præsens. Sit amóris offícium páscere Domínicum gregem, si fuit timóris
    indícium negáre pastórem. Qui hoc ánimo pascunt oves Christi, ut suas velint
    esse, non Christi, se convincúntur amáre, non Christum: vel gloriándi vel
    dominándi, vel acquiréndi cupiditáte; non obediéndi, et subveniéndi, et Deo
    placéndi caritáte."
lectio8:
  - Contra hos ergo vígilat tótidem inculcáta ista vox Christi, quos Apóstolos
    gemit sua quærere, non quæ Jesu Christi. Nam quid est áliud, si díligis me,
    pasce oves meas; quam si dicerétur, si me díligis, non te páscere cógita?
    Sed oves meas, et sicut meas pasce, non sicut tuas; glóriam meam in eis
    quære, non tuam; domínium meum, non tuum; lucra mea, non tua; ne sis in
    eórum societáte qui pértinent ad témpora periculósa, seípsos amántes, et
    cétera quæ huic malórum inítio connectúntur.
lectio9:
  - "Mérito dícitur Petro: díligis me, et respóndet, amo te, eíque refértur,
    pasce agnos meos, et hoc íterum, hoc tértio. Ubi étiam demonstrátur unum
    atque idem esse amórem et dilectiónem; nam étiam Dóminus novíssime non ait,
    díligis me, sed amas me. Non ergo nos, sed ipsum amémus, et in pascéndis
    óvibus ejus ea quæ sunt ejus, non ea quæ sunt nostra, quærámus. Néscio enim
    quo inexplicábili modo, quisquis seípsum, non Deum amat, non se amat: et
    quisquis Deum, non seípsum, amat, ipse se amat. Qui enim non potest vívere
    de se, móritur útique amándo se: non ergo se amat, qui ne vivat se amat."
  - "&teDeum"
