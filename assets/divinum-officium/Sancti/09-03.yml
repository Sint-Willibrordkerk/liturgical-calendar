evangelium:
  - Sequéntia Sancti evangélii secúndum Joánnem
  - "!Joannes 21:15-17"
  - "v. In illo témpore, dicit Jesus Simóni Petro: Simon Joánnis, díligis me
    plus his? Dicit ei: Etiam Dómine, tu scis quia amo te. Dicit ei: Pasce agnos
    meos. Dicit ei íterum: Simon Joánnis, díligis me? Ait illi: Etiam Dómine, tu
    scis quia amo te. Dicit ei: Pasce agnos meos. Dicit ei tértio: Simon
    Joánnis, amas me? Contristátus est Petrus, quia dixit ei tértio: Amas me? et
    dixit ei: Dómine, tu ómnia nosti, tu scis quia amo te. Dixit ei: Pasce oves
    meas."
offertorium:
  - "!Ps 33:12"
  - "v. Veníte, fílii; audíte me: timórem Dómini docébo vos."
secreta:
  - Oblatiónibus nostris, quǽsumus, Dómine, benígne suscéptis, da nobis, ut hæc
    divína mystéria, sancto Pio Summo Pontífice intercedénte, sincéris tractémus
    obséquiis et fidéli mente sumámus.
  - $Per Dominum
communio:
  - "!Joannes 6:56-57"
  - "Caro enim mea vere est cibus: et sanguis meus, vere est potus; qui mandúcat
    meam carnem et bibit meum sánguinem, in me manet, et ego in illo."
postcommunio:
  - "Mensæ cæléstis virtúte refécti, quǽsumus, Dómine Deus noster: ut,
    interveniénte sancto Pio Summo Pontífice; fortes efficiámur in fide, et in
    tua simus caritáte concórdes."
  - $Per Dominum
