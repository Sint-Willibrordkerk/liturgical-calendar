oratio:
  - "Deus, qui ad tuéndam cathólicam fidem, et univérsa in Christo instauránda
    sanctum Pium, Summum Pontíficem, cælésti sapiéntia et apostólica fortitúdine
    replevísti: concéde propítius; ut, ejus institúta et exémpla sectántes,
    præmia consequámur ætérna."
  - $Per eundem
lectio:
  - Lectio prima Sancti Pauli apóstoli ad Thessalonicénses
  - "!1 Thess 2:2-8"
  - "v. Fratres: Fidúciam habúimus in Deo nostro, loqui ad vos Evangélium Dei in
    multa sollicitúdine. Exhortátio enim nostra non de erróre, neque de
    immundítia, neque in dolo, sed sicut probáti sumus a Deo ut crederétur nobis
    Evangélium: ita lóquimur non quasi homínibus placéntes, sed Deo, qui probat
    corda nostra. Neque enim aliquándo fúimus in sermóne adulatiónis, sicut
    scitis: neque in occasióne avarítiæ: Deus testis est: nec quæréntes ab
    homínibus glóriam, neque a vobis, neque ab áliis. Cum possémus vobis óneri
    esse ut Christi apóstoli: sed facti sumus párvuli in médio vestrum, tamquam
    si nutrix fóveat fílios suos. Ita desiderántes vos, cúpide volebámus trádere
    vobis non solum Evangélium Dei, sed étiam ánimas nostras: quóniam caríssimi
    nobis facti estis."
graduale:
  - "!Ps 39:10-11"
  - "v. Annuntiávi justítiam tuam in cœtu magno; ecce lábia mea non cohíbui:
    Dómine, tu nosti."
  - V. Justítiam tuam non abscóndi in corde meo; fidelitátem tuam et auxílium
    tuum narrávi. Allelúia, allelúia.
  - "!Ps 22:5-6"
  - Paras mihi mensam, inúngis óleo caput meum, calix meus ubérrimus est.
    Allelúia.
