lectio93:
  - "Urbanus Romanus, Alexandro Sevéro imperatóre, doctrina et vitæ sanctitáte
    multos ad Christi fidem convértit; in illis Valerianum, beátæ Cæcíliæ
    sponsum, et Tiburtium, Valeriáni fratrem, qui póstea martyrium forti animo
    subiérunt. Hic de bonis Ecclésiæ attributis scripsit his verbis: Ipsæ res
    fidelium, quæ Dómino offerúntur, non debent in alios usus quam
    ecclesiásticos et christianórum fratrum, vel indigéntium, converti; quia
    vota sunt fidelium, et pretia peccatórum, ac patrimónia páuperum. Sedit
    annos sex, menses septem, dies quatuor: ac martyrio coronátus, sepúltus est
    in cœmeterio Prætextati, octavo Kalendas Junii. Ordinatiónibus quinque
    habitis mense Decembri, creávit presbyteros novem, diaconos quinque,
    episcopos per diversa loca octo."
  - "&teDeum"
