  - Simplex
  - "1.1"
  - "@C3a"
rule:
  - vide C3a;
oratio:
  - "Da, quǽsumus, omnípotens Deus: ut, qui beatórum Mártyrum tuórum Gordiáni et
    Epímachi solémnia cólimus, eórum apud te intercessiónibus adjuvémur."
  - $Per Dominum
lectio:
  - Léctio libri Apocalýpsis beáti Joánnis Apóstoli
  - "!Apoc 19:1-9."
  - "In diébus illis: Post hæc ego Joánnes audívi quasi vocem turbárum multárum
    in cœlo, dicéntium: Allelúja: salus et glória et virtus Deo nostro est: quia
    vera et justa judícia sunt ejus, qui judicávit de meretríce magna, quæ
    corrúpit terram in prostitutióne sua, et vindicávit sánguinem servórum
    suórum de mánibus ejus. Et íterum dixérunt: Allelúja. Et fumus ejus ascéndit
    in sǽcula sæculórum. Et cecidérunt senióres vigínti quátuor et quátuor
    animália, et adoravérunt Deum sedéntem super thronum, dicéntes: Amen,
    Allelúja, tit vox de throno exívit, dicens: Laudem dícite Deo nostro, omnes
    servi ejus; et, qui timétis eum, pusílli et magni. Et audívi quasi vocem
    turbæ magnæ, et sicut vocem aquárum multárum, et sicut vocem tonitruórum
    magnórum, dicentium: Alleiúja: quóniam regnávit Dóminus, Deus noster
    omnípotens. Gaudeámus et exsultémus et demus glóriam ei: quia venérunt
    núptiæ Agni et uxor ejus præparávit se. Et datum est illi, ut coopériat se
    býssina splendénti et cándido. Býssinum enim justificatiónes sunt Sanctórum.
    Et dixit mihi: Scribe: Beáti, qui ad cœnam nuptiárum Agni vocáti sunt."
secreta:
  - "Hóstias tibi, Dómine, beatórum Martyrum tuórum Gordiáni et Epímachi dicátas
    méritis, benígnus assúme: et ad perpétuum nobis tríbue proveníre subsídium."
  - $Per Dominum
postcommunio:
  - "Quǽsumus, omnípotens Deus: ut, qui cœléstia aliménta percépimus,
    intercedéntibus sanctis Martýribus tuis Gordiáno et Epímacho, per hæc contra
    ómnia advérsa muniámur."
  - $Per Dominum.
lectio93:
  - "Gordianus judex, cum ad eum Januarius presbyter, ut condemnaretur, sub
    Juliano Apostata ductus esset, ab eodem in christiana fide instructus, cum
    uxore et quinquaginta tribus aliis ex eadem famiha Romæ baptizatur. Quare
    præfectus, relegdto Januario, Gordianum a Clementiano vicario includi jubet
    in carcerem: qui postea eumdem Gordianum vinctum catenis ad se accersitum,
    cum a fidei proposito deterrere non posset, plumbatis diu cæsum, capite
    plecti imperat. Cujus corpus ante Apollinis templum canibus objectum, noctu
    a Christianis via Latina sepelitur in eadem crypta, in quam reliquiæ beati
    Epimachi Martyris translatæ fuerant ab Alexandria: ubi is diu propter
    Christi confessionem constrictus in carcere, postremo combustus, martyrio
    coronatus est."
  - "&teDeum"
