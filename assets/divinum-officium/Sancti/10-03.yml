oratio:
  - "Dómine, qui dixísti: Nisi efficiámini sicut párvuli, non intrábitis in
    regnum cœlórum: da nobis, quǽsumus: ita sanctæ Teresiæ Vírginis in
    humilitáte et simplicitáte cordis vestígia sectári, ut præmia consequámur
    ætérna."
  - $Qui vivis
lectio:
  - Léctio Isaíæ Prophétæ
  - "!Is 66:12-14"
  - "Hæc dicit Dóminus: Ecce, ego declinábo super eam quasi flúvium pacis, et
    quasi torréntem inundántem glóriam géntium, quam sugétis: ad úbera
    portabímini, et super génua blandiéntur vobis. Quómodo si cui mater
    blandiátur, ita ego consolábor vos, et in Jerúsalem consolabímini.
    Vidébitis, et gaudébit cor vestrum, et ossa vestra quasi herba germinábunt,
    et cognoscétur manus Dómini servis ejus."
graduale:
  - "!Matt 11:25"
  - Confíteor tibi, Pater, Dómine cœli et terræ, quia abscondísti hæc a
    sapiéntibus, et prudéntibus, et revelásti ea párvulis.
  - "!Ps 70:5"
  - Dómine, spes mea a juventúte mea.
  - Allelúja, allelúja.
  - "!Ps 39:17-19"
  - "Quasi rosa plantáta super rivos aquárum fructificate: quasi Libanus odórem
    suavitátis habete: florete, flores, quasi lílium, et date odórem, et
    frondete in grátiam, et collaudate cánticum, et benedicite Dóminum in
    opéribus suis. Allelúja."
gradualep:
  - Allelúja, allelúja.
