tractus:
  - "!Cant 2:11-12"
  - Jam hiems tránsiit, imber ábiit, et recéssit.
  - "V. Flores apparuérunt in terra nostra, tempus putatiónis advénit: vox
    túrturis audíta est in terra nostra."
  - "!Jer 31:3"
  - "In caritáte perpétua diléxi te: ídeo attráxi te, míserans tui."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 18:1-4"
  - "In illo témpore: Accessérunt discípuli ad Jesum, dicéntes: Quis, putas,
    major est in regno cœlórum? Et advocans Jesus párvulum, státuit eum in médio
    eórum, et dixit; Amen, dico vobis, nisi convérsi fuéritis, et efficiámini
    sicut párvuli, non intrábitis in regnum cœlorum. Quicúmque ergo humiliáverit
    se sicut párvulus iste, hic est major in regno cœlórum."
offertorium:
  - "!Luc 1:46-49"
  - "Magníficat ánima mea Dóminum: et exsultávit spíritus meus in Deo salutári
    meo: quia respéxit humilitátem ancíllæ suæ: fecit mihi magna qui potens
    est."
secreta:
  - "Sacrifícium nostrum tibi, Dómine, quǽsumus, sanctæ Terésiæ Vírginis tuæ
    precátio sancta concíliet: ut, in cujus honóre sollémniter exhibétur, ejus
    méritis efficiátur accéptum."
  - $Per Dominum
communio:
  - "!Deut 32:10-12"
  - "Circumdúxit eam, et dócuit: et custodívit quasi pupíllam óculi sui. Sicut
    aquila expándit alas suas, et assúmpsit eam, atque portávit in húmeris suis.
    Dóminus solus dux ejus fuit."
postcommunio:
  - "Illo nos, Dómine amóris igne cœléste mystérium inflámmet: quo sancta
    Teresia Virgo tua se tibi pro homínibus caritátis víctimam devóvit."
  - $Per Dominum
lectio4:
  - "Terésia a Jesu Infante, Alensonii in Gállia, honestis paréntibus, singulari
    et assidua erga Deum pietáte conspicuis, orta est. Inde a prima ætate,
    divino Spíritu prævénta, religiosam vitam ágere cupiebat. Serio autem
    promisit, se nihil Deo denegatúram, quod ipse ab ea petere viderétur: quam
    promissiónem fideliter usque ad mortem servare satégit. Quinto ætátis anno,
    matre amissa, Dei providéntiæ se totam commisit sub vigilanti custódia
    amantíssimi patris, sororúmque natu majórum: quibus magistris, Teresia ad
    curréndam perfectiónis viam ut gigas exsultávit. Novennis virgínibus ex
    Ordine sancti Benedicti Lexoviis excolenda traditur, ibique in rerum
    divinárum cognitióne excellere visa est. Décimo ætátis anno, arcanus et
    gravis morbus eam diu cruciávit, a quo prout ipsa enárrat, ope Beatíssimæ
    Vírginis, quæ eídem subrídens appáruit, et quam, sub titulo Dominæ nostræ a
    Victoria, per novendialia invocare studuit, divinitus fuit liberata. Tunc,
    angelico fervore repléta, ad sacrum convivium, in quo Christus sumitur, se
    diligentíssime præparáre curávit."
lectio5:
  - "Ut prímitus eucharistico pane fuit refecta, insatiábilem cæléstis hujus
    cibi famem haurire visa est: unde velut inspirata, Jesum rogabat, ut omnem
    mundanam consolatiónem in amaritúdinem sibi verteret. Inde tenerrimo in
    Christum Dóminum et in Ecclésiam amóre exæstuans, nihil antiquius hábuit,
    quam Carmelitárum Excalceatórum Ordinem íngredi, ut sui abnegatióne, suisque
    sacrifíciis, sacerdótibus, missionariis, totique Ecclésiæ opem afferret, et
    innumeras ánimas Jesu Christo lucrifáceret: quod jam morti próxima, apud
    Deum se factúram pollícita est. Propter ætátis defectum, multas ad
    religiosam vitam amplecténdam nacta est difficultates, quibus tamen
    incredibili animi fortitúdine superatis, quindecim annos nata, Lexoviensem
    Carmelum feliciter ingressa est. Ibi mirábiles Deus in Teresiæ corde
    ascensiónes dispósuit, quæ, Maríæ Vírginis vitam abscónditam imitata, quasi
    hortus irriguus, flores ómnium virtútum germinávit, præcipue vero exímiæ in
    Deum et in próximum caritátis."
lectio6:
  - "Quo magis Altíssimo placéret, quum in Sacris Scripturis mónitum illud
    legísset: Si quis est párvulus véniat ad me; párvula in spíritu esse vóluit,
    et inde filiali fiducia Deo, tamquam Patri amantíssimo, se perpetuo
    trádidit. Hanc, spiritualis infantiæ viam, secúndum Evangélii doctrinam,
    alios docuit, speciatim novítias, quas ex obediéntia ad religiosárum
    virtútum studium informandas suscépit, atque ita apostolico zelo repléta,
    mundo, supérbia inflato et vanitátes diligenti, evangelicæ simplicitátis
    iter patefécit. Sponsus autem Jesus eam patiéndi desidério, tam in anima,
    quam in corpore, pénitus inflammávit. Insuper Dei caritátem undequáque
    neglectam animadvertens, summo dolóre affecta, duobus ante óbitum annis, Dei
    miserentis amori se víctimam óbtulit. Tunc, ut ipsa refert, cæléstis ignis
    flamma vulneráta est: unde caritate consumpta, in écstasim rapta,
    ferventíssime ingéminans: Deus meus, te diligo; viginti quatuor annos nata,
    die trigesima Septembris, anno millesimo octingentésimo nonagesimo septimo,
    ad Sponsum evolávit. Quod autem móriens promiserat, se perennem rosárum
    plúviam in terram demissuram, hoc in cælum recepta, innumeris miraculis
    reapse adimplévit et in dies adimplet. Quam Pius undecimus, Pontifex
    maximus, Beátis Virgínibus adscriptam, et biennio post, jubilæo máximo
    recurrente, inter Sanctas relatam, peculiarem ómnium Missiónum Patronam
    constítuit ac declarávit."
lectio94:
  - "Terésia a Jesu Infánte, Alensónii in Gállia, ex honéstis piísque paréntibus
    orta est. Quinto ætátis anno, matre amíssa, Dei providéntiæ se totam
    commísit sub vigilántia amantíssimi patris et sorórum natu majórum: quibus
    magístris, ad curréndam perfectiónis viam ut gigas exsultávit. Novénnis
    virgínibus ex órdine sancti Benedícti Lexóviis excolénda tráditur. Décimo
    ætátis anno, arcáno et gravi morbo diu cruciáta, ope Dóminæ nostræ a
    Victória, divínitus fuit liberáta. Angélico fervóre repléta, ad sacrum
    convívium prímitus accédens, insatiábilem hujus cibi famem hauríre visa est.
    Carmelitárum excalciatórum órdinem íngredi cúpiens, ob ætátis deféctum,
    multas ad religiósam vitam amplecténdam nacta est difficultátes, quibus
    fórtiter superátis, Lexoviénsem Carmélum, quíndecim annos nata, felíciter
    ingréssa est. Ibíque erga Deum et próximum exímia caritáte flagrávit.
    Spirituálem infántiæ viam, secúndum Evangélii doctrínam, secúta, álios,
    speciátim novítias, eándem edócuit. Patiéndi desidério inflammáta, duóbus
    ante óbitum annis Dei miseréntis amóri se víctimam óbtulit. Vigínti quátuor
    annos nata, die trigésima septémbris, anno millésimo octingentésimo
    nonagésimo séptimo, ad Sponsum evolávit. Quam Pius undécimus, Póntifex
    máximus, Beátis Virgínibus adscríptam, et biénnio post, jubilǽo máximo
    recurrénte, solémniter inter Sanctas relátam, peculiárem ómnium Missiónum
    Patrónam constítuit atque declarávit."
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 18:1-4"
  - "In illo témpore accessérunt discípuli ad Jesum, dicéntes: Quis, putas,
    major est in regno cælórum? Et réliqua."
  - _
  - Homilía sancti Leónis Papæ
  - "!Sermo 37, in Epiph. solemn. 7, cap. 3-4"
  - "Tota, dilectíssimi, christianæ sapiéntiæ disciplína, non in abundántia
    verbi, non in astutia disputándi, neque in appetitu laudis et glóriæ, sed in
    vera et voluntária humilitate consistit, quam Dóminus Jesus Christus ab
    útero Matris usque ad supplícium Crucis pro omni fortitúdine et elégit et
    docuit. Nam, cum discípuli ejus inter se, ut ait Evangelista, disquírerent
    quis eórum major esset in regno cælórum, vocávit párvulum, et státuit eum in
    médio eórum, et dixit: Amen, dico vobis, nisi convérsi fuéritis et
    efficiámini sicut párvuli, non intrabitis in regnum cælórum. Quicúmque ergo
    humiliaverit se sicut puer iste, hic major erit in regno cælórum. Amat
    Christus infantiam, quam primum et animo suscépit et corpore. Amat Christus
    infantiam, humilitátis magistram, innocéntiæ regulam, mansuetúdinis formam.
    Amat Christus infantiam, ad quam majórum dirigit mores, ad quam senum
    redúcit ætates; et eos ad suum inclínat exemplum, quos ad regnum sublimat
    ætérnum."
lectio8:
  - "Ut autem plene valeámus agnóscere quómodo apprehéndi possit tam mira
    conversio et in puerílem gradum qua nobis mutatióne redeundum sit, doceat
    nos beátus Paulus et dicat: Nolíte púeri effici sensibus, sed malítia
    párvuli estote. Non ergo ad lúdicra infantiæ et imperfécta nobis primordia
    reverténdum est, sed aliquid, quod étiam graves annos déceat, inde suméndum,
    ut velox sit commótium tránsitus, citus ad pacem recursus: nulla sit memória
    offensiónis, nulla cupiditas dignitátis; amor sociæ communiónis, æqualitas
    naturalis. Magnum enim bonum est nocére non nosse et maligna non sápere;
    quia inférre ac referre injúriam, mundi hujus prudéntia est; némini autem
    malum pro malo reddere, christianæ est æquanimitátis infantia."
lectio9:
  - "Ad hanc vos, dilectíssimi, similtúdinem parvulórum mystérium hodiérnæ
    festivitátis invitat; et hanc vobis humilitátis formam adorátus a Magis puer
    Salvátor insinuat: qui, ut imitatóribus suis quid glóriæ paráret,
    osténderet, ortus sui témpore éditos martyrio consecrávit; ut in Bethlehem,
    ubi Christus natus est, geniti, per communiónem ætátis consortes fíerent
    passiónis. Amétur ígitur humilitas, et omnis a fidelibus vitétur elátio.
    Alter álterum sibi præferat, et nemo quod suum est quærat, sed quod
    alterius; ut, cum in ómnibus abundaverit afféctus benevoléntiæ, in nullo
    virus inveniátur invidiæ: quóniam qui se exáltat humiliábitur, et qui se
    humíliat exaltábitur, eodem ipso testante Jesu Christo Dómino nostro, qui
    cum Patre et Spíritu Sancto vivit et regnat Deus in sǽcula sæculórum. Amen."
  - "&teDeum"
