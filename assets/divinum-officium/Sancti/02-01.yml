lectio:
  - Léctio Epistolæ beáti Pauli Apóstoli ad Romános
  - "!Rom 8:35-39"
  - "Fratres: Quis nos separábit a caritáte Christi: tribulátio, an angustia, an
    fames, an núditas, an perículum, an persecútio, an gládius? sicut scriptum
    est: Quia propter te mortificámur tota die: æstimáti sumus sicut oves
    occisiónis. Sed in his ómnibus superámus propter eum, qui diléxit nos.
    Certus sum enim, quia neque mors, neque vita, neque ángeli, neque
    principátus, neque virtútes, neque instántia, neque futúra, neque fortitúdo,
    neque altitúdo, neque profúndum, neque creatúra alia poterit nos separáre a
    caritáte Dei, quæ est in Christo Jesu, Dómino nostro."
