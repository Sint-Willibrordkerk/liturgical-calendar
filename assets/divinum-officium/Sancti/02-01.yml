lectio4:
  - Ex libro sancti Hierónymi Presbýteri de Scriptóribus ecclesiásticis
  - "!Cap. 16"
  - Ignatius, Antiochenæ ecclésiæ tertius post Petrum Apostolum epíscopus,
    commovénte persecutiónem Trajano, damnatus ad bestias, Romam vinctus
    mittitur. Cumque navigans Smyrnam venísset, ubi Polycarpus, auditor Joánnis,
    epíscopus erat, scripsit unam epistolam ad Ephesios, álteram ad Magnesiános,
    tertiam ad Trallenses, quartam ad Romanos. Et inde egrédiens scripsit ad
    Philadelphios, et ad Smyrnæos, et propriam ad Polycarpum, commendans illi
    Antiochensem ecclésiam; in qua et de Evangelio, quod nuper a me translátum
    est, super persona Christi ponit testimónium.
lectio5:
  - "Dignum autem vidétur, quia tanti viri fécimus mentiónem, et de epistola
    ejus, quam ad Romanos scribit, pauca pónere: De Syria usque ad Romam pugno
    ad bestias in mari et in terra, nocte dieque ligátus cum decem leopardis,
    hoc est milítibus, qui me custódiunt; quibus et cum beneféceris, pejores
    fiunt. Iniquitas autem eórum mea doctrina est; sed non idcirco justificátus
    sum. Utinam fruar bestiis, quæ mihi sunt præparátæ; quas et oro mihi velóces
    esse ad intéritum et ad supplicia, et állici ad comedéndum me, ne, sicut et
    aliórum Mártyrum, non áudiant corpus attingere. Quod si veníre nolúerint,
    ego vim fáciam, ego me urgebo, ut dévorer. Ignóscite mihi, filíoli; quid
    mihi prosit, ego scio."
lectio6:
  - "Nunc incipio Christi esse discipulus, nihil de his quæ vidéntur,
    desiderans, ut Jesum Christum invéniam. Ignis, crux, béstiæ, confractio
    ossium, membrórum divísio, et totius corporis contritio, et tota torménta
    diaboli in me veniant; tantum ut Christo fruar. Cumque jam damnatus esset ad
    bestias, et ardore patiéndi rugiéntes audíret leones, ait: Fruméntum Christi
    sum; déntibus bestiárum molar, ut panis mundus invéniar. Passus est anno
    undecimo Trajani. Relíquiæ corporis ejus Antiochíæ jacent extra portam
    Daphníticam, in cœmeterio."
lectio94:
  - "Ignátius, Antiochíæ post Petrum secúnda successióne episcopátum sortítus
    est, et Trajáni témpore accusátus, quod Christiánus esset, ad béstias
    damnátur Romam mitténdus. Quo cum a Sýria vinctus deportátur, omnes Asiæ
    civitátes, ad quas appulísset, evangélicis cohortatiónibus epístolis
    erúdiens. In quarum una, quam Smyrnæ, dum apud Polycárpum diversarétur, ad
    Romános scripsit, inter cétera hæc de sua damnatióne refert: O salutáres
    béstias, quæ præparántur mihi! Quando vénient? Quando emitténtur? Quando eis
    frui licébit cárnibus meis? Quas et ego opto acrióres parári, ne forte, ut
    in nonnúllis fecérunt, tímeant contíngere corpus meum. Nunc incípio
    discípulus esse Christi. Ignes, cruces, béstiæ, discerptiónes membrórum, ac
    totíus córporis pœnæ, et ómnia supplícia diáboli arte quæsíta cumuléntur,
    dúmmodo Jesum Christum mérear adipísci. Romam ígitur perdúctus, cum
    rugiéntes audíret leónes, ardóre martýrii incénsus, in hæc verba prorúpit:
    Fruméntum Christi sum; déntibus bestiárum molar, ut panis mundus invéniar.
    Passus est undécimo anno Trajáni."
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 12:24-26"
  - "In illo témpore: Dixit Jesus discípulis suis: Amen, amen dico vobis, nisi
    granum fruménti cadens in terram, mortuum fúerit, ipsum solum manet. Et
    réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tract. 51 in Joánn., sub med."
  - "Ipse Dóminus Jesus erat granum mortificándum et multiplicándum;
    mortificándum infidelitate Judæórum, multiplicándum fide populórum. Jam vero
    exhortans ad passiónis suæ sectanda vestígia, Qui amat, inquit, ánimam suam,
    perdet eam. Quod duobus modis intelligi potest. Qui amat, perdet; id est, si
    amas, perdes. Si cupis vitam tenére in Christo, noli mortem timére pro
    Christo. Item alio modo: Qui amat ánimam suam, perdet eam; noli amare, ne
    perdas; noli amare in hac vita, ne perdas in æterna vita."
lectio8:
  - "Hoc autem, quod posterius dixi, magis habére vidétur evangélicus sensus;
    séquitur enim: Et qui odit ánimam suam in hoc mundo, in vitam ætérnam
    custódit eam. Ergo, quod supra dictum est, Qui amat, subintellígitur in hoc
    mundo, ipse útique perdet; qui autem odit, útique in hoc mundo, in vitam
    ætérnam ipse custódit eam. Magna et mira senténtia, quemádmodum sit hóminis
    in ánimam suam amor ut pereat, ódium ne pereat. Si male amáveris, tunc
    odísti; si bene óderis, tunc amásti. Felices, qui odérunt custodiéndo, ne
    perdant amándo."
lectio9:
  - "Sed vide ne tibi subrépat ut teípsum velis interímere, sic intelligendo,
    quod debes odisse in hoc mundo ánimam tuam. Hinc enim quidam malígni atque
    perversi hómines, et in seipsis crudeliores et sceleratiores homicídæ
    flammis se donant, aquis se præfócant, præcipítio se collídunt et pereunt.
    Hoc Christus non docuit; immo étiam diabolo præcipitium suggerénti
    respóndit: Redi retro, sátana: scriptum est, Non tentábis Dóminum, Deum
    tuum. Petro autem dixit, signíficans qua morte clarificatúrus erat Deum: cum
    esses júnior, cingébas te, et ambulabas quo volébas; cum autem senúeris,
    alter te cinget et feret quo tu non vis. Ubi satis expressit, non a seipso,
    sed ab alio debére occídi, qui vestígia sequitur Christi."
  - "&teDeum"
