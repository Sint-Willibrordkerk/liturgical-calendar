ant-vespera:
  - Heródes rex * appósuit ut apprehénderet et Petrum; quem, cum apprehendísset,
    misit in cárcerem, volens post Pascha prodúcere eum pópulo.
  - Petrus quidem * servabátur in cárcere; orátio autem fiébat sine
    intermissióne ab Ecclésia ad Deum pro eo.
  - "Dixit Angelus * ad Petrum: Circúmda tibi vestiméntum tuum, et séquere me."
  - Misit Dóminus * Angelum suum, et liberávit me de manu Heródis, allelúja.
  - Tu es Petrus, * et super hanc petram ædificábo Ecclésiam meam.;;116
hymnus-vespera:
  - v. Miris modis repénte liber, férrea,
  - "Christo jubénte, vincla Petrus éxuit:"
  - Ovílis ille Pastor et Rector gregis,
  - Vitæ reclúdit páscua et fontes sacros,
  - Ovésque servat créditas, arcet lupos.
  - _
  - Patri perénne sit per ævum glória;
  - Tibíque laudes concinámus ínclytas,
  - Ætérne Nate; sit, supérne Spíritus,
  - "Honor tibi decúsque: sancta júgiter"
  - Laudétur omne Trínitas per sǽculum.
  - Amen.
hymnusm-vespera:
  - v. Petrus beátus catenárum láqueos,
  - "Christo jubénte, rupit mirabíliter:"
  - Custos ovílis et Doctor Ecclésiæ,
  - Pastórque gregis, conservátor óvium,
  - Arcet lupórum truculéntam rábiem.
  - _
  - Glória Patri per imménsa sǽcula,
  - Sit tibi Nate decus et impérium,
  - "Honor, potéstas, Sanctóque Spirítui:"
  - Sit Trinitáti salus indivídua,
  - Per infiníta sæculórum sǽcula. Amen.
