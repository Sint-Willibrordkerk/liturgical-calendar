lectio1:
  - De Actibus Apostolórum
  - "!Act 12:1-5"
  - 1 Misit Heródes rex manus ut afflígeret quosdam de Ecclésia.
  - 2 Occídit autem Jacóbum, fratrem Joánnis, gládio.
  - 3 Videns autem quia placéret Judǽis, appósuit ut apprehénderet et Petrum.
    Erant autem dies azymórum.
  - 4 Quem, cum apprehendísset, misit in cárcerem, tradens quátuor
    quaterniónibus mílitum custodiéndum, volens post Pascha prodúcere eum
    pópulo.
  - 5 Et Petrus quidem servabátur in cárcere; orátio autem fiébat sine
    intermissióne ab Ecclésia ad Deum pro eo.
responsory1:
  - "@Sancti/02-22"
lectio2:
  - "!Act 12:6-8"
  - 6 Cum autem productúrus eum esset Heródes, in ipsa nocte erat Petrus
    dórmiens inter duos mílites vinctus caténis duábus, et custódes ante óstium
    custodiébant cárcerem.
  - "7 Et ecce Angelus Dómini ástitit, et lumen refúlsit in habitáculo,
    percussóque látere Petri, excitávit eum, dicens: Surge velóciter. Et
    cecidérunt caténæ de mánibus ejus."
  - "8 Dixit autem Angelus ad eum: Præcíngere, et cálcea te cáligas tuas. Et
    fecit sic. Et dixit illi: Circúmda tibi vestiméntum tuum, et séquere me."
responsory2:
  - "@Sancti/02-22"
lectio3:
  - "!Act 12:9-11"
  - 9 Et éxiens sequebátur eum, et nesciébat quia verum est quod fiébat per
    Angelum; existimábat autem se visum vidére.
  - 10 Transeúntes autem primam et secúndam custódiam venérunt ad portam
    férream, quæ ducit ad civitátem, quæ ultro apérta est eis; et exeúntes
    processérunt vicum unum, et contínuo discéssit Angelus ab eo.
  - "11 Et Petrus ad se revérsus, dixit: Nunc scio vere quia misit Dóminus
    Angelum suum, et erípuit me de manu Heródis et de omni exspectatióne plebis
    Judæórum."
responsory3:
  - "@Sancti/02-22"
lectio4:
  - Theodósio junióre imperánte, cum Eudócia ejus uxor Jerosólymam solvéndi voti
    causa venísset, ibi multis est affécta munéribus. Præ céteris insígne donum
    accépit férreæ caténæ, auro gemmísque ornátæ, quam illam esse affirmábant,
    qua Petrus Apóstolus ab Heróde vinctus fúerat. Eudócia, caténam pie
    veneráta, eam póstea Romam ad fíliam Eudóxiam misit; quæ illam Pontífici
    máximo détulit. Isque vicíssim illi monstrávit álteram caténam, qua, Neróne
    imperatóre, idem Apóstolus constríctus fúerat.
responsory4:
  - "@Sancti/06-29"
lectio5:
  - Cum ígitur Póntifex Románam caténam cum ea, quæ Jerosólymis alláta fúerat,
    contulísset, factum est ut illæ inter se sic connecteréntur, ut non duæ, sed
    una caténa ab eódem artífice confécta esse viderétur. Quo miráculo tantus
    honor sacris illis vínculis habéri cœpit, ut proptérea hoc nómine sancti
    Petri ad víncula ecclésia, título Eudóxiæ, dedicáta sit in Exquíliis,
    ejúsque memóriæ dies festus institútus Kaléndis Augústi.
responsory5:
  - "@Sancti/06-29"
lectio6:
  - Quo ex témpore honos, qui eo die profánis Gentílium celebritátibus tríbui
    sólitus erat, Petri vínculis habéri cœpit, quæ tacta ægros sanábant et
    dǽmones ejiciébant. Quo in génere, anno salútis humánæ nongentésimo
    sexagésimo nono áccidit, ut quidam comes, Ottónis imperatóris familiáris,
    occupátus ab immúndo spíritu, seípsum déntibus dilaniáret. Quare is jussu
    imperatóris ad Joánnem Pontíficem dúcitur, qui ut sacra caténa cómitis
    collum áttigit, erúmpens nefárius spíritus hóminem líberum relíquit; ac
    deínceps in Urbe sanctórum vinculórum relígio propagáta est.
responsory6:
  - "@Sancti/02-22:Responsory4"
  - "&Gloria"
  - R. Et ídeo tibi tráditæ sunt claves regni cælórum.
lectio94:
  - Theodósio junióre imperánte, Eudócia ejus uxor Jerosólymæ insígne præ
    céteris donum accépit férreæ caténæ, quam illam esse affirmábant, qua Petrus
    Apóstolus ab Heróde vinctus fúerat. Eudócia caténam pie veneráta, Romam ad
    fíliam Eudóxiam misit, ubi a summo Pontífice compósita cum ea, qua Neróne
    imperatóre idem beátus Apóstolus constríctus fúerat, ambæ inter se sic
    connéxæ sunt, ut non duæ, sed una caténa ab uno artífice confécta esse
    viderétur. Hinc, cum et ægrotórum salus et obsessórum liberátio, sacro horum
    vinculórum contáctu, sæpe obtinerétur, tantus honor sacris illis vínculis
    habéri cœpit, ut proptérea hoc nómine sancti Petri ad víncula ecclésia,
    título Eudóxiæ, dedicáta sit in Exquíliis, ejúsque memóriæ dies festus,
    profánis Gentílium solemnitátibus abólitis, institútus fúerit Kaléndis
    Augústi.
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 16:13-19"
  - "In illo témpore: Venit Jesus in partes Cæsaréæ Philíppi, et interrogábat
    discípulos suos, dicens: Quem dicunt hómines esse Fílium hóminis? Et
    réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Ex serm. 29 de Sanctis, in medio"
  - "Solus Petrus inter Apóstolos méruit audíre: Amen dico tibi, quia tu es
    Petrus, et super hanc petram ædificábo Ecclésiam meam; dignus certe, qui
    ædificándis in domo Dei pópulis lapis esset ad fundaméntum, colúmna ad
    sustentáculum, clavis ad regnum. De hoc ait sermo divínus: Et ponébant,
    inquit, infírmos suos, ut umbra saltem transeúntis Petri obumbráret eos. Si
    tunc opem ferre póterat umbra córporis, quanto magis nunc plenitúdo
    virtútis? si tunc supplicántibus próderat aura quædam pertranseúntis, quanto
    magis grátia nunc permanéntis? Mérito per omnes Christi ecclésias auro
    pretiósius habétur ferrum illud pœnálium vinculórum."
responsory7:
  - "@Sancti/02-22:Responsory5"
lectio8:
  - Si tam medicábilis fuit obumbrátio visitántis, quanto magis caténa
    vinciéntis? Si inánis quædam spécies vácuæ imáginis habére pótuit in se vim
    salútis, quanto plus de córpore meruérunt attráhere salubritátis, férreo
    póndere sacris impréssa membris, víncula passiónis? Si ad præsídia
    supplicántium tam potens fuit ante martýrium, quanto magis éfficax post
    triúmphum? Felíces illi nexus, qui, de mánicis et compédibus in corónam
    mutándi, Apóstolum contingéntes, Mártyrem reddidérunt! Felícia víncula, quæ
    reum suum usque ad Christi crucem, non tam condemnatúra quam consecratúra,
    misérunt!
responsory8:
  - "@Sancti/02-22:Responsory7"
  - "&Gloria"
  - R. Et ego dico tibi, quia tu es Petrus, et super hanc petram ædificábo
    Ecclésiam meam.
