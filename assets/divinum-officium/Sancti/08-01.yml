introitus:
  - "@Sancti/06-29"
oratio:
  - "Deus, qui beátum Petrum Apóstolum, a vínculis absolútum, illǽsum abíre
    fecísti: nostrórum, quǽsumus, absólve víncula peccatórum; et ómnia mala a
    nobis propitiátus exclúde."
  - $Per Dominum
commemoratio-oratio:
  - "!Commemoratio S. Pauli"
  - "Deus, qui multitúdinem géntium beáti Pauli Apóstoli prædicatióne docuísti:
    da nobis, quǽsumus; ut, cujus commemoratiónem cólimus, ejus apud te
    patrocínia sentiámus."
  - $Per Dominum
lectio:
  - "@Sancti/06-29"
graduale:
  - "!Ps 44:17-18"
  - "Constítues eos príncipes super omnem terram: mémores erunt nóminis tui,
    Dómine."
  - "V. Pro pátribus tuis nati sunt tibi fílii: proptérea pópuli confitebúntur
    tibi. Allelúja, allelúja."
  - "V. Solve, jubénte Deo, terrárum, Petre, caténas: qui facis, ut páteant
    cœléstia regna beátis. Allelúja."
evangelium:
  - "@Commune/C4b"
offertorium:
  - "@Sancti/02-24"
secreta:
  - Oblátum tibi, Dómine, sacrifícium, intercedénte beáto Petro Apostolo tuo,
    vivíficet nos semper et múniat.
  - $Per Dominum
commemoratio-secreta:
  - "!Commemoratio S. Pauli"
  - "Apóstoli tui Pauli précibus, Dómine, plebis tuæ dona sanctífica: ut, quæ
    tibi tuo grata sunt institúto, gratióra fiant patrocínio supplicántis."
  - $Per Dominum
communio:
  - "@Commune/C4b"
postcommunio:
  - "Córporis sacri et pretiósi sánguinis repléti libámine, quǽsumus, Dómine,
    Deus noster: ut, quod pia devotióne gérimus, certa redemptióne capiámus."
  - $Per eundem
commemoratio-postcommunio:
  - "!Commemoratio S. Pauli"
  - "Percéptis, Dómine, sacramentis, beáto Paulo Apostolo tuo interveniénte,
    deprecámur: ut, quæ pro illíus celebráta sunt glória, nobis profíciant ad
    medélam."
  - $Per Dominum
