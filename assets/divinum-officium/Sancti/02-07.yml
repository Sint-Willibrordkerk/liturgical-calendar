lectio4:
  - "Romualdus, Ravennæ, Sergio patre, nobili genere natus, adoléscens in
    propinquum monastérium Classense pœniténtiæ causa secessit: ubi religiosi
    hóminis sermóne ad pietátis studium vehementius incénsus, viso étiam semel
    et íterum per noctem in ecclésia beato Apollinari, quod Dei servus illi
    futurum promíserat, mónachus effícitur. Mox ad Marinum, vitæ sanctitáte ac
    severiore disciplína in fínibus Venetórum eo témpore célebrem, se cóntulit,
    ut ad arctam et sublimem perfectiónis viam eo magistro ac duce uterétur."
lectio5:
  - "Multis sátanæ insídiis et hóminum invidia oppugnatus, tanto humílior se
    assidue jejuniis et oratiónibus exercebat, et rerum cæléstium meditatióne,
    vim lacrimárum profúndens, fruebátur: vultu tamen adeo læto semper erat, ut
    intuéntes exhilararet. Magno apud príncipes et reges in honóre fuit;
    multique ejus consílio, mundi illécebris abjectis, solitúdinem petiérunt.
    Martyrii quoque cupiditate flagrávit, cujus causa dum in Pannóniam
    proficíscitur, morbo, quo afflictabátur cum progrederétur, levabátur cum
    recederet, reverti cogitur."
lectio6:
  - In vita et post mortem miraculis clarus, spíritu étiam prophetíæ non cáruit.
    Scalam a terra cælum pertingentem, in similitúdinem Jacob Patriárchæ, per
    quam hómines in veste cándida ascendébant et descendébant, per visum
    conspéxit; eoque Camaldulenses mónachos, quorum institúti auctor fuit,
    designari mirabíliter agnovit. Denique cum annos centum et viginti ágeret,
    et centum ipsos in summa vitæ asperitáte Deo servísset, ad eum migrávit,
    anno salútis millesimo vigesimo septimo. Ejus corpus quinquennio postquam
    sepúltum fuerat, íntegrum repertum, Fabriáni in ecclésia sui ordinis
    honorifice cónditum est.
lectio94:
  - Romuáldus, Ravénnæ, Sérgio patre, nóbili génere natus, adoléscens in
    propínquum monastérium Classénse pœniténtiæ causa secéssit; ubi ad pietátis
    stúdium veheméntius incénsus et beáti Apollináris apparitióne recreátus,
    mónachus effícitur. Jejúniis et oratiónibus assídue se exércuit, vultu tamen
    ádeo lætus, ut intuéntes exhilaráret. Martýrii cupiditáte flagrans, dum in
    Pannóniam proficíscitur, morbo corréptus, revérti cógitur. Institúti
    monachórum Camaldulénsium auctor fuit, quos tamquam ángelos scalam cælum
    pertingéntem ascéndere per visum conspéxit. Dénique cum annos centum et
    vigínti ágeret, et centum ipsos in summa vitæ asperitáte Deo servísset, ad
    eum migrávit, anno salútis millésimo vigésimo séptimo, et Fabriáni in
    ecclésia sui órdinis honorífice cónditus est.
  - "&teDeum"
