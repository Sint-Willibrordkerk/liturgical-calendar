lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Corínthios.
  - "!2 Cor 4:5-14."
  - "Fratres: Non nosmetípsos prædicámus, sed Jesum Christum, Dóminum nostrum:
    nos autem servos vestros per Jesum: quóniam Deus, qui dixit de ténebris
    lucem splendéscere, ipse illúxit in córdibus nostris ad illuminatiónem
    sciéntiæ claritátis Dei, in fácie Christi Jesu. Habémus autem thesáurum
    istum in vasis fictílibus: ut sublímitas sit virtútis Dei, et non ex nobis.
    In ómnibus tribulatiónem pátimur, sed non angustiámur: aporiámur, sed non
    destitúimur: persecutiónem pátimur, sed non derelínquimur: dejícimur, sed
    non perímus: semper mortificatiónem Jesu in córpore nostro circumferéntes,
    ut et vita Jesu manifestétur in corpóribus nostris. Semper enim nos, qui
    vívimus, in mortem trádimur propter Jesum: ut et vita Jesu manifestétur in
    carne nostra mortáli. Ergo mors in nobis operátur, vita autem in vobis.
    Habéntes autem eúndem spíritum fídei, sicut scriptum est: Crédidi, propter
    quod locútus sum: et nos crédimus, propter quod et lóquimur: sciéntes,
    quóniam qui suscitávit Jesum, et nos cum Jesu suscitábit et constítuet
    vobíscum."
