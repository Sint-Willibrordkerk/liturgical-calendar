lectio4:
  - "Athanasius Alexandrinus, catholicæ religiónis propugnator acerrimus, ab
    Alexandro episcopo Alexandrino diaconus factus est, in cujus locum
    successit. Quem étiam antea secutus fuerat ad Nicænum Concílium; ubi cum
    Aríi impietátem repressísset, tantum ódium Arianórum suscépit, ut ex eo
    témpore ei insidias moliri numquam destiterint. Nam coacto ad Tyrum concílio
    magna ex parte Arianórum episcopórum, subornarunt muliérculam, quæ accusaret
    Athansium, quod hospítio acceptus sibi stuprum per vim intulísset.
    Introductus ígitur est Athanasius, et una cum eo Timótheus presbyter; qui
    simulans se esse Athanasium, Ego ne, inquit, mulier, apud te sum diversatus?
    ego te violávi? Cui illa petulanter: Tu mihi vim attulísti; idque
    jurejurando affirmans, judicum fidem obtestabátur, ut tantum flagitium
    vindicárent. Qua cógnita fraude, rejecta est mulíeris impudéntia."
lectio5:
  - Arsénium quoque episcopum ab Athanasio interfectum Ariáni pervulgarunt; quem
    dum occulte détinent, manum mórtui déferunt in judícium, ab Athanasio ad
    usum mágicæ artis Arsenio amputatam criminantes. At Arsenius noctu
    aufúgiens, cum se in conspectu totius concilii statuísset, Athanasii
    inimicórum impudentíssimum scelus apéruit. Quod illi nihilóminus mágicis
    artibus Athanasii tribuéntes, vitæ ejus insidiari non desistebant. Quam ob
    rem in exsílium actus, in Gállia apud Tréviros exsulávit. Gravibus deinceps
    ac diuturnis sub Constantio imperatóre, Arianórum fautore, tempestátibus
    jactátus et incredibiles calamitátes perpéssus, magnam orbis terræ partem
    peragrávit; ac sæpe e sua ecclésia ejéctus, sæpe étiam in eamdem et Julii,
    Romani Pontificis, auctoritate, et Constántis imperatóris, Constantii
    fratris, patrocinio, decretis quoque concilii Sardicénsis ac Jerosolymitani,
    restitútus est, Ariánis interea illi semper infestis; quorum pertinacem
    iram, et summum vitæ discrimen fúgiens, in sicca cisterna quinque annis se
    ábdidit, ejus rei tantum conscio quodam Athanasii amico, qui eum clam
    sustentabat.
lectio6:
  - "Constantio mortuo, cum Julianus Apóstata, qui ei in imperio successit,
    éxsules episcopos ad suas ecclésias redire permisísset, Athanasius
    Alexandríam reversus, summo honóre exceptus est. Sed non multo post, iísdem
    Ariánis impelléntibus, a Juliáno exagitatus, rursus discedere cogitur.
    Cumque ab ejus satellítibus ad necem conquirerétur, qua fugiebat navícula
    conversa in contrariam flúminis partem, iis qui se insequebántur, ex
    industria occurrit; et quæréntibus quantum inde abesset Athanasius,
    respóndit eum non longe abesse: ítaque illos contrárium tenéntes cursum
    effugit, atque Alexandríam rédiens, ibidem usque ad Juliáni óbitum occultus
    permansit. Qui paulo post, Alexandríæ alia exorta tempestáte, quatuor menses
    in paterno sepúlcro delituit. Ac denique ex tot tantisque periculis
    divinitus ereptus, Alexandríæ mórtuus est in suo léctulo, sub Valénte: cujus
    vita et mors magnis nobilitáta est miraculis. Multa pie et ad illustrándum
    catholicam fidem præcláre scripsit, sexque et quadragínta annos in summa
    témporum varietáte Alexandrinam ecclésiam sanctíssime gubernávit."
lectio94:
  - Athanásius, epíscopus Alexandrínus, cathólicæ religiónis propugnátor
    acérrimus, cum, adhuc diáconus, in Concílio Nicǽno Aríi impietátem
    repressísset, tantum ódium Arianórum suscépit, ut ex eo témpore ei insídias
    molíri nunquam destíterint. In exsílium actus, in Gállia apud Tréviros
    exsulávit. Incredíbiles dein calamitátes perpéssus, magnam orbis partem
    peragrávit; ac sæpe e sua ecclésia ejéctus, sæpe étiam in eándem, Júlii,
    Románi Pontificis, auctoritáte atque decrétis concílii Sardicénsis ac
    Jerosolymitáni, restitútus est, Ariánis intérea illi semper inféstis.
    Dénique ex tot tantísque perículis divínitus eréptus, Alexandríæ mórtuus est
    sub Valénte. Ejus vita et mors magnis nobilitáta est miráculis. Multa pie et
    ad illustrándam cathólicam fidem præcláre scripsit, sexque et quadragínta
    annos in summa témporum varietáte Alexandrínam ecclésiam sanctíssime
    gubernávit.
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum.
  - "!Matt 10:23-28"
  - "In illo témpore: Dixit Jesus discípulis suis:  Cum persequétur vos in
    civitáte ista, fugite in aliam. Et réliqua."
  - _
  - Homilía sancti Athanasii Epíscopi.
  - "!In Apologia de fuga sua, ante medium"
  - "In lege præcéptum erat ut constitueréntur civitátes refugiórum, ut, qui
    quomodocúmque ad necem quæreréntur, servari possent. In consummatióne porro
    sæculórum cum advenísset illud ipsum Verbum Patris, quod Móysi antea locútum
    fuerat, rursus hoc præcéptum dedit, Cum vos, inquiens, persecúti fúerint in
    civitáte ista, fugite in aliam. Pauloque post súbjicit: Cum vidéritis illam
    abominatiónem desolatiónis, quæ dicta est per Danielem prophétam,
    consistentem in loco sancto (qui legit, intélligat), tunc qui in Judǽa sunt,
    fúgiant ad montes; et qui in tecto est, ne descendat tollere aliquid de domo
    sua; et qui in agro est, non revertátur tollere túnicam suam."
lectio8:
  - "Hæc cum scirent Sancti, ejusmodi tenuérunt suæ conversatiónis institutum.
    Quæ enim nunc præcepit Dóminus, éadem quoque ante suum in carne advéntum
    locútus est in Sanctis; et hoc institutum hómines ad perfectiónem ducit. Nam
    quod Deus jusserit, id omnino faciéndum est. Ideoque et ipsum Verbum propter
    nos homo factum, non indignum putávit, cum quærerétur, quemádmodum et nos,
    abscóndere se; et cum persecutiónem paterétur, fugere, et insidias
    declináre: cum autem a se definitum tempus ipse adduxísset, in quo
    corporáliter pro ómnibus pati volebat, ultro seípsum trádidit
    insidiántibus."
lectio9:
  - "At vero sancti hómines cum hanc quoque formam a Salvatore didicissent, (ab
    ipso enim et antea et semper omnes docebántur) advérsus persecutores ut
    legitime certarent, fugiébant, et ab illis quæsíti se abscóndebant. Cum enim
    præstitúti sibi a divina providéntia témporis finem ignorarent, nolébant
    insidiántibus se témere trádere: sed contra, cum scirent quod scriptum est,
    in mánibus Dei esse hóminum sortes, et Dóminum mortificáre et vivificáre;
    potius in finem usque perseverábant, circumeuntes, ut ait Apóstolus, in
    melótis et pellibus caprínis, egéntes, angustiati, in solitudínibus
    errántes, et in speluncis et cavernis terræ laténtes, quoad vel definitum
    mortis tempus veníret, vel qui tempus ipsum definíerat, Deus cum eis
    loquerétur, et insidiántes cohibéret, aut certe persecutóribus eos traderet,
    utcúmque illi placuísset."
  - "&teDeum"
