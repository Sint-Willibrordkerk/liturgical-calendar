evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum.
  - "!Matt 10:23-28"
  - "In illo témpore: Dixit Jesus discípulis suis: Cum persequéntur vos in
    civitáte ista, fúgite in áliam. Amen dico vobis, non consummábitis civitátes
    Israël, donec véniat Fílius hóminis. Non est discípulus super magistrum, nec
    servus super dóminum suum. Súfficit discípulo, ut sit sicut magister ejus:
    et servo, sicut dóminus ejus. Si patremfamílias Beélzebub vocavérunt: quanto
    magis domésticos ejus? Ne ergo timuéritis eos. Nihil enim est opértum, quod
    non revelábitur: et occúltum, quod non sciétur. Quod dico vobis in ténebris,
    dícite in lúmine: et, quod in aure audítis, prædicáte super tecta. Et nolíte
    timére eos, qui occídunt corpus, ánimam autem non possunt occídere: sed
    pótius timéte eum, qui potest et ánimam et corpus pérdere in gehénnam."
