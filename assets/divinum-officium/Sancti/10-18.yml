lectio4:
  - Ex libro sancti Hierónymi Presbýteri de Scriptóribus Ecclesiásticis
  - "!Cap. 7"
  - "Lucas médicus Antiochénsis ut ejus scripta índicant, Græci sermónis non
    ignárus, fuit sectátor Apóstoli Pauli, et omnis peregrinatiónis ejus comes.
    Scripsit Evangélium, de quo idem Paulus: Mísimus, inquit, cum illo fratrem,
    cujus laus est in Evangélio per omnes ecclésias. Et ad Colossénses: Salútat
    vos Lucas, médicus caríssimus. Et ad Timótheum: Lucas est mecum solus. Aliud
    quoque édidit volúmen egrégium, quod título, Acta Apostolórum, prænotátur:
    cujus história usque ad biénnium Romæ commorántis Pauli pervénit, id est,
    usque ad quartum Nerónis annum. Ex quo intellégimus in eádem urbe librum
    esse compósitum."
lectio5:
  - Igitur períodos Pauli et Theclæ, et totam baptizáti Leónis fábulam, inter
    apócryphas scriptúras computámus. Quale enim est, ut indivíduus comes
    Apóstoli, inter céteras ejus res, hoc solum ignoráverit? Sed et
    Tertulliánus, vicínus eórum témporum, refert presbýterum quemdam in Asia,
    amatórem Apóstoli Pauli, convíctum a Joánne quod auctor esset libri, et
    conféssum se hoc Pauli amóre fecísse, et ob id loco excidísse. Quidam
    suspicántur, quotiescúmque in epístolis suis Paulus dicit, Juxta Evangélium
    meum, de Lucæ significáre volúmine.
lectio6:
  - "Lucam autem, non solum ab Apóstolo Paulo didicísse Evangélium, qui cum
    Dómino in carne non fúerat, sed et a céteris Apóstolis; quod ipse quoque in
    princípio sui volúminis declárat, dicens: Sicut tradidérunt nobis, qui a
    princípio ipsi vidérunt et minístri fuérunt sermónis. Igitur Evangélium,
    sicut audíerat, scripsit; Acta vero Apostolórum, sicut víderat ipse,
    compósuit. Vixit octogínta et quátuor annos, uxórem non habens. Sepultus est
    Constantinópoli, ad quam urbem, vigésimo Constantíni anno, ossa ejus cum
    relíquiis Andréæ Apóstoli transláta sunt de Achája."
