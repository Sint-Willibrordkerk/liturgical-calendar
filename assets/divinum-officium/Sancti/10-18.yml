oratio:
  - "Intervéniat pro nobis, quǽsumus, Dómine, sanctus tuus Lucas Evangélista:
    qui crucis mortificatiónem júgiter in suo córpore, pro tui nóminis honóre,
    portávit."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Corínthios
  - "!2 Cor 8:16-24."
  - "Fratres: Grátias ago Deo, qui dedit eandem sollicitúdinem pro vobis in
    corde Titi, quóniam exhortatiónem quidem suscépit: sed cum sollicítior
    esset, sua voluntáte proféctus est ad vos. Mísimus étiam cum illo fratrem,
    cujus laus est in Evangélio per omnes ecclésias: non solum autem, sed et
    ordinátus est ab ecclésiis comes peregrinatiónis nostræ in hanc grátiam, quæ
    ministrátur a nobis ad Dómini glóriam et destinátam voluntátem nostram:
    devitántes hoc, ne quis nos vitúperet in hac plenitúdine, quæ ministrátur a
    nobis. Providémus enim bona non solum coram Deo, sed étiam coram homínibus.
    Mísimus autem cum illis et fratrem nostrum, quem probávimus in multis sæpe
    sollícitum esse: nunc autem multo sollicitiórem, confidéntia multa in vos,
    sive pro Tito, qui est sócius meus, et in vos adjútor, sive fratres nostri,
    Apóstoli ecclesiárum, glória Christi. Ostensiónem ergo, quæ est caritátis
    vestræ, et nostræ glóriæ pro vobis, in illos osténdite in fáciem
    ecclesiárum."
graduale:
  - "!Ps 18:5; 18:2"
  - "In omnem terram exívit sonus eórum: et in fines orbis terræ verba eórum."
  - "V. Cœli enárrant glóriam Dei: et ópera mánuum ejus annúntiat firmaméntum.
    Allelúja, allelúja."
  - "!Joann 15:16"
  - "Ego vos elégi de mundo, ut eátis et fructum afferátis: et fructus vester
    máneat. Allelúja."
evangelium:
  - "@Sancti/02-06"
offertorium:
  - "@Sancti/01-25"
secreta:
  - "Donis cœléstibus da nobis, quǽsumus, Dómine, líbera tibi mente servíre: ut
    múnera quæ deférimus, interveniénte beáto Evangelísta tuo Luca, et medélam
    nobis operéntur et glóriam."
  - $Per Dominum
communio:
  - "@Sancti/02-24"
postcommunio:
  - "Præsta, quǽsumus, omnípotens Deus: ut, quod de sancto altári tuo accépimus,
    précibus beáti Evangelístæ tui Lucæ, sanctíficet ánimas nostras, per quod
    tuti esse possímus."
  - $Per Dominum
