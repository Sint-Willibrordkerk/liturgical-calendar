  - "@Sancti/12-26"
lectio:
  - Léctio libri Apocalýpsis beáti Joánnis Apóstoli
  - "!Apoc 14:1-5"
  - "In diébus illis: Vidi supra montem Sion Agnum stantem, et cum eo centum
    quadragínta quatuor mília, habéntes nomen ejus, et nomen Patris ejus
    scriptum in fróntibus suis. Et audívi vocem de cœlo, tamquam vocem aquárum
    multárum, et tamquam vocem tonítrui magni: et vocem, quam audívi, sicut
    citharœdórum citharizántium in cítharis suis. Et cantábant quasi cánticum
    novum ante sedem, et ante quátuor animália, et senióres: et nemo póterat
    dícere cánticum, nisi illa centum quadragínta quátuor mília, qui empti sunt
    de terra. Hi sunt, qui cum muliéribus non sunt coinquináti: vírgines enim
    sunt. Hi sequúntur Agnum, quocúmque íerit. Hi empti sunt ex homínibus
    primítiæ Deo, et Agno: et in ore eórum non est invéntum mendácium: sine
    mácula enim sunt ante thronum Dei."
graduale:
  - "!Ps 123:7-8"
  - Anima nostra, sicut passer, erépta est de láqueo venántium.
  - "V. Láqueus contrítus est, et nos liberáti sumus: adjutórium nostrum in
    nómine Dómini, qui fecit cœlum et terram."
  - Allelúja, allelúja.
  - "!Ps 112:1"
  - Laudáte, púeri, Dóminum, laudáte nomen Dómini. Allelúja.
gradualep:
  - Allelúja, allelúja.
  - "!Ps 112:1"
