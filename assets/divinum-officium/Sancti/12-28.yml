  - V.Víndica, Dómine, sánguinem
  - Sanctórum tuórum, qui effúsus est super terram.
evangelium:
  - Sequéntia ++ sancti Evangélii secundum Matthǽum
  - "!Matt 2:13-18"
  - "In illo témpore: Angelus Dómini appáruit in somnis Joseph, dicens: Surge,
    et áccipe Púerum et Matrem ejus, et fuge in Ægýptum, et esto ibi, usque dum
    dicam tibi. Futúrum est enim, ut Heródes quærat Púerum ad perdéndum eum. Qui
    consúrgens accépit Púerum et Matrem ejus nocte, et secéssit in Ægýptum: et
    erat ibi usque ad óbitum Heródis: ut adimplerétur quod dictum est a Dómino
    per Prophétam dicéntem: Ex Ægýpto vocávi Fílium meum. Tunc Heródes videns,
    quóniam illúsus esset a Magis, irátus est valde, et mittens occídit omnes
    púeros, qui erant in Béthlehem et in ómnibus fínibus ejus, a bimátu et
    infra, secúndum tempus, quod exquisíerat a Magis. Tunc adimplétum est, quod
    dictum est per Jeremíam Prophetam dicéntem: Vox in Rama audíta est, plorátus
    et ululátus multus: Rachel plorans fílios suos, et nóluit consolári, quia
    non sunt."
offertorium:
  - "@Sancti/06-18t"
secreta:
  - "Sanctórum tuórum, Dómine, nobis pia non desit orátio: quæ et múnera nostra
    concíliet, et tuam nobis indulgéntiam semper obtíneat."
  - $Per Dominum
