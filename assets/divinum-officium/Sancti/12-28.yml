lectio1:
  - De Jeremía Prophéta
  - "!Jer 31:15-17"
  - "15 Hæc dicit Dóminus: Vox in excélso audíta est lamentatiónis, luctus, et
    fletus Rachel plorántis fílios suos, et noléntis consolári super eis, quia
    non sunt."
  - "16 Hæc dicit Dóminus: Quiéscat vox tua a plorátu, et óculi tui a lácrimis:
    quia est merces óperi tuo, ait Dóminus: et reverténtur de terra inimíci."
  - "17 Et est spes novíssimis tuis, ait Dóminus: et reverténtur fílii ad
    términos suos."
responsory1:
  - "R. Centum quadragínta quátuor míllia, qui empti sunt de terra, hi sunt qui
    cum muliéribus non sunt coinquináti:"
  - "* Vírgines enim permansérunt, ídeo regnant cum Deo, et Agnus Dei cum illis."
  - V. Isti sunt qui venérunt ex magna tribulatióne, et lavérunt stolas suas in
    sánguine Agni.
  - R. Vírgines enim permansérunt, ídeo regnant cum Deo, et Agnus Dei cum illis.
lectio2:
  - "!Jer 31:18-20"
  - "18 Audiens audívi Ephraim transmigrántem: Castigásti me, et erudítus sum,
    quasi juvénculus indómitus: convérte me, et convértar: quia tu Dóminus Deus
    meus."
  - "19 Postquam enim convertísti me, egi pœniténtiam: et postquam ostendísti
    mihi, percússi femur meum. Confúsus sum, et erúbui: quóniam sustínui
    oppróbrium adolescéntiæ meæ."
  - "20 Si fílius honorábilis mihi Ephraim, si puer delicátus: quia ex quo
    locútus sum de eo, adhuc recordábor ejus."
responsory2:
  - "R. Sub altáre Dei audívi voces occisórum dicéntium:"
  - "* Quare non deféndis sánguinem nostrum? Et accepérunt divínum respónsum:
    Adhuc sustinéte módicum tempus, donec impleátur númerus fratrum vestrórum."
  - V. Vidi sub altáre Dei ánimas interfectórum propter verbum Dei, et propter
    testimónium quod habébant, et clamábant voce magna, dicéntes.
  - "R. Quare non deféndis sánguinem nostrum? Et accepérunt divínum respónsum:
    Adhuc sustinéte módicum tempus, donec impleátur númerus fratrum vestrórum."
lectio3:
  - "!Jer 31:21-23"
  - "21 Státue tibi spéculam, pone tibi amaritúdines: dírige cor tuum in viam
    rectam, in qua ambulásti: revértere, virgo Israël, revértere ad civitátes
    tuas istas."
  - "22 Usquequo delíciis dissólveris, fília vaga? quia creávit Dóminus novum
    super terram: Fémina circúmdabit virum."
  - "23 Hæc dicit Dóminus exercítuum Deus Israël: Adhuc dicent verbum istud in
    terra Juda, et in úrbibus ejus, cum convértero captivitátem eórum: Benedícat
    tibi Dóminus, pulchritúdo justítiæ, mons sanctus."
responsory3:
  - R. Adoravérunt vivéntem in sǽcula sæculórum,
  - "* Mitténtes corónas suas ante thronum Dómini Dei sui."
  - "V. Et cecidérunt in conspéctu throni in fácies suas: et benedixérunt
    vivéntem in sǽcula sæculórum."
  - R. Mitténtes corónas suas ante thronum Dómini Dei sui.
  - "&Gloria"
  - R. Mitténtes corónas suas ante thronum Dómini Dei sui.
lectio4:
  - Sermo sancti Augustíni Epíscopi
  - "!Sermo 10 de Sanctis"
  - Hódie, fratres caríssimi, natálem illórum infántium cólimus, quos ab Heróde
    crudelíssimo rege interféctos esse, Evangélii textus elóquitur. Et ídeo cum
    summa exsultatióne gáudeat terra, cæléstium mílitum et tantárum parens
    fecúnda virtútum. Ecce profánus hostis nunquam beátis párvulis tantum
    prodésse potuísset obséquio, quantum prófuit ódio. Nam, sicut sacratíssimum
    præséntis diéi festum maniféstat, quantum in beátos párvulos iníquitas
    abundávit, tantum in eis grátia benedictiónis refúdit.
responsory4:
  - "R. Effudérunt sánguinem Sanctórum velut aquam in circúitu Jerúsalem:"
  - "* Et non erat qui sepelíret."
  - V. Posuérunt mortália servórum tuórum escas volatílibus cæli, carnes
    sanctórum tuórum béstiis terræ.
  - R. Et non erat qui sepelíret.
lectio5:
  - "Beáta es, o Béthlehem terra Juda, quæ Heródis regis immanitátem in puerórum
    exstinctióne perpéssa es: quæ sub uno témpore candidátam plebem imbéllis
    infántiæ Deo offérre meruísti. Digne tamen natálem illórum cólimus, quos
    beátius ætérnæ vitæ mundus édidit, quam quos maternórum víscerum partus
    effúdit. Síquidem ante vitæ perpétuæ adépti sunt dignitátem, quam usúram
    præséntis accéperint."
responsory5:
  - "R. Isti sunt Sancti, qui passi sunt propter te, Dómine: víndica eos,"
  - "* Quia clamant ad te cotídie."
  - V. Víndica, Dómine, sánguinem Sanctórum tuórum, qui effúsus est.
  - R. Quia clamant ad te cotídie.
lectio6:
  - Aliórum quidem pretiósa mors Mártyrum laudem in confessióne proméruit, horum
    in consummatióne complácuit; quia incipiéntis vitæ primórdiis, ipse eis
    occásus inítium glóriæ dedit, qui præséntis términum impósuit. Quos Heródis
    impíetas lactántes matrum ubéribus abstráxit; qui jure dicúntur Mártyrum
    flores, quos in médio frígore infidelitátis exórtos, velut primas erumpéntes
    Ecclésiæ gemmas, quædam persecutiónis pruína decóxit.
responsory6:
  - "R. Isti sunt, qui non inquinavérunt vestiménta sua:"
  - "* Ambulábunt mecum in albis, quia digni sunt."
  - "V. Hi sunt, qui cum muliéribus non sunt coinquináti: vírgines enim sunt."
  - R. Ambulábunt mecum in albis, quia digni sunt.
  - "&Gloria"
  - R. Ambulábunt mecum in albis, quia digni sunt.
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 2:13-18"
  - "In illo témpore: Angelus Dómini appáruit in somnis Joseph, dicens: Surge,
    et áccipe Púerum et Matrem ejus, et fuge in Ægýptum, et esto ibi usque dum
    dicam tibi. Et réliqua."
  - _
  - Homilía sancti Hierónymi Presbýteri
  - "!Lib. 1 Comm. in c. 2 Matth. et apud Gloss. ord."
  - "Quando tulit Púerum et Matrem ejus, ut in Ægýptum tránseat, nocte tulit, et
    in ténebris: quia noctem ignorántiæ his, a quibus ipse recéssit, relíquit
    incrédulis. Quando vero revértitur in Judǽam, nec nox, nec ténebræ ponúntur
    in Evangélio: quia in fine mundi Judǽi fidem, tamquam Christum ab Ægýpto
    reverténtem suscipiéntes, illuminabúntur."
responsory7:
  - "R. Cantábant Sancti cánticum novum ante sedem Dei et Agni:"
  - "* Et resonábat terra in voces eórum."
  - V. Hi empti sunt ex homínibus primítiæ Deo et Agno, et in ore ipsórum non
    est invéntum mendácium.
  - R. Et resonábat terra in voces eórum.
lectio8:
  - "Ut adimplerétur quod dictum est a Dómino per prophétam dicéntem: Ex Ægýpto
    vocávi Fílium meum. Respóndeant, qui Hebræórum volúminum dénegant veritátem,
    ubi hoc in Septuagínta legátur interprétibus. Quod cum non invénerint, nos
    eis dicémus, in Osée prophéta scriptum, sicut et exemplária probáre possunt,
    quæ nuper edídimus."
responsory8:
  - "R. Vidi sub altáre Dei ánimas interfectórum propter verbum Dei quod
    habébant, et clara voce dicébant:"
  - "* Víndica, Dómine, sánguinem Sanctórum tuórum, qui effúsus est."
  - V. Sub throno Dei omnes Sancti clamant.
  - R. Víndica, Dómine, sánguinem Sanctórum tuórum, qui effúsus est.
lectio9:
  - "Tunc adimplétum est, quod dictum est per Jeremíam prophétam dicéntem: Vox
    in Rama audíta est, plorátus et ululátus multus, Rachel plorans fílios suos.
    De Rachel natus est Bénjamin, in cujus tribu non est Béthlehem. Quǽritur
    ergo, quómodo Rachel fílios Judæ, id est Béthlehem, quasi suos ploret.
    Respondébimus bréviter, quia sepúlta sit juxta Béthlehem in Ephrata; et ex
    matérno corpúsculi hospítio matris nomen accéperit; sive quóniam Juda et
    Bénjamin duæ tribus junctæ erant, et Heródes præcéperat non solum in
    Béthlehem intérfici púeros, sed et in ómnibus fínibus ejus."
responsory9:
  - "R. Isti, qui amícti sunt stolis albis, qui sunt, et unde venérunt? Et dixit
    mihi:"
  - "* Hi sunt, qui venérunt de tribulatióne magna, et lavérunt stolas suas, et
    dealbavérunt eas in sánguine Agni."
  - V. Vidi sub altáre Dei ánimas interfectórum propter verbum Dei, et propter
    testimónium quod habébant.
  - R. Hi sunt, qui venérunt de tribulatióne magna, et lavérunt stolas suas, et
    dealbavérunt eas in sánguine Agni.
  - "&Gloria"
  - R. Hi sunt, qui venérunt de tribulatióne magna, et lavérunt stolas suas, et
    dealbavérunt eas in sánguine Agni.
