officium:
  - Ss. Tiburtii, Valeriani, et Maximi Martyrum
rank:
  - ""
  - Simplex
  - "1.1"
  - "@C3a"
rule:
  - vide C3a;
oratio:
  - "Præsta, quǽsumus, omnípotens Deus: ut, qui sanctórum Mártyrum tuórum
    Tibúrtii, Valeriáni et Máximi sollémnia cólimus; eórum étiam virtútes
    imitémur."
  - $Per Dominum
lectio:
  - "@Commune/C2p"
evangelium:
  - "@Commune/C2p"
secreta:
  - "Hæc hóstia, quǽsumus, Dómine, quam sanctórum Mártyrum tuórum natalítia
    recenséntes offérimus: et víncula nostræ pravitátis absólvat, et tuæ nobis
    misericórdiæ dona concíliet."
  - $Per Dominum.
postcommunio:
  - "Sacro múnere satiáti, súpplices te, Dómine, deprecámur: ut, quod débitæ
    servitútis celebrámus offício, salvatiónis tuæ sentiámus augméntum."
  - $Per Dominum
