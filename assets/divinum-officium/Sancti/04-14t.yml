lectio93:
  - "Valerianus Romanus nobili genere ortus, Alexandro Sevéro imperatóre,
    hortatu beátæ Cæcíliæ Vírginis, quam sibi pari nobilitate uxórem
    desponderat, una cum Tiburtio fratre a sancto Urbano Papa baptizátur. Quos
    ubi præfectus Urbis Almachius Christiános esse cognóvit, et patrimonio
    paupéribus distributo, Christianórum córpora sepelire; accersítos gráviter
    reprehéndit: atque ubi Christum Deum constanter confiténtes, deos autem
    dæmoniórum inánia simulácra prædicántes videt, virgis cædi jubet. Sed cum
    verbéribus cogi non possent, ut Jovis simulacrum veneraréntur, immo fortes
    in fídei veritáte permanérent, ad quartum ab Urbe lápidem secúri feriúntur.
    Quorum virtútem admirátus Maximus præfecti cubicularius, qui eos ad
    supplícium perduxerat, Christiánum se esse proféssus est, cum multis
    præterea præfecti minístris: qui paulo post plumbátis contusi, omnes ex
    diaboli minístris, Christi Dómini Mártyres evasérunt."
