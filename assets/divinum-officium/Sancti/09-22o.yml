officium:
  - Ss. Mauritii et Sociorum Martyrum
rank:
  - ""
  - Simplex
  - "1.1"
  - "@C3"
rule:
  - vide C3;
  - Gloria
oratio:
  - "Annue, quǽsumus, omnípotens Deus: ut sanctórum Martyrum tuórum Maurítii et
    Sociórum ejus nos lætíficet festíva sollémnitas; ut, quorum suffrágiis
    nítimur, eórum natalítiis gloriémur."
  - $Per Dominum
lectio:
  - Léctio libri Apocalýpsis beáti Joánnis Apóstoli
  - "!Apoc 7:13-17"
  - "In diébus illis: Respóndit unus de senióribus, et dixit mihi: Hi, qui
    amícti sunt stolis albis, qui sunt? et unde venérunt? Et dixi illi: Dómine
    mi, tu scis. Et dixit mihi: Hi sunt, qui venérunt de tribulatióne magna, et
    lavérunt stolas suas, et dealbavérunt eas in sánguine Agni. Ideo sunt ante
    thronum Dei, et sérviunt ei die ac nocte in templo ejus: et qui sedet in
    throno, habitábit super illos: non esúrient neque sítient ámplius, nec cadet
    super illos sol neque ullus æstus: quóniam Agnus, qui in médio throni est,
    reget illos et dedúcet eos ad vitæ fontes aquárum: et abstérget Deus omnem
    lácrimam ab óculis eórum."
secreta:
  - "Réspice, quǽsumus, Dómine, múnera, quæ in sanctórum Mártyrum tuórum
    Maurítii et Sociórum ejus commemoratióne deférimus: et præsta; ut, quorum
    honóre sunt grata, eórum nobis fiant intercessióne perpétua."
  - $Per Dominum
communio:
  - "@Commune/C4b"
postcommunio:
  - "Cœléstibus refécti sacraméntis et gáudiis: súpplices te rogámus, Dómine;
    ut, quorum gloriámur triúmphis, protegámur auxíliis."
  - $Per Dominum
lectio93:
  - "Cum Maximiánus imperátor, ducto in Gálliam exercitu, in fínibus Sedunórum
    sacrifícii causa constitísset, Thebæórum legio, ne se impiórum sacrórum
    societáte contamináret, a réliquis cópiis discéssit. Quare imperátor misit
    ad eos mílites, qui suo nómine nuntiárent ut, si salvi esse vellent, in
    castra ad sacrifícia redírent: qui se christiána religióne impedíri
    respondérunt. Quorum respónsum ille indigníssime ferens, majori iracúndia
    quam antea exársit. Itaque, immíssa parte exércitus in Thebǽos, décimum
    quemque eórum primum occídi jussit; quod martýrium sua sponte, maximéque
    hortatóre Maurítio, ferre maluérunt quam imperáta fácere nefárii
    imperatóris. Ac deínde réliquos omnes, constantíssime Christum prædicántes,
    décimo Kaléndas Octóbris ab univérso exércitu trucidári ímperat."
  - "&teDeum"
