officium:
  - Ss. Tiburtii et Susannæ Virginis, Martyrum
rank:
  - ""
  - Simplex
  - "1.1"
  - "@C3a-1"
rule:
  - vide C3;
  - Quorum Festum
  - Gloria
oratio:
  - "Sanctórum Martyrum tuórum Tiburtii et Susánnæ nos, Dómine, fóveant
    continuáta præsídia: quia non désinis propítius intuéri; quos tálibus
    auxíliis concésseris adjuvári."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Hebrǽos
  - "!Hebr 11:33-39"
  - "Fratres: Sancti per fidem vicérunt regna, operáti sunt justítiam, adépti
    sunt repromissiónes, obturavérunt ora leónum, exstinxérunt ímpetum ignis,
    effugérunt áciem gládii, convaluérunt de infirmitáte, fortes facti sunt in
    bello, castra vertérunt exterórum: accepérunt mulíeres de resurrectióne
    mórtuos suos: álii autem distenti sunt, non suscipiéntes redemptiónem, ut
    meliórem invenírent resurrectiónem: álii vero ludíbria et vérbera expérti,
    ínsuper et víncula et cárceres: lapidáti sunt, secti sunt, tentáti sunt, in
    occisióne gládii mórtui sunt: circuiérunt in melótis, in péllibus caprínis,
    egéntes, angustiáti, afflícti: quibus dignus non erat mundus: in
    solitudínibus errántes, in móntibus et spelúncis et in cavérnis terræ. Et hi
    omnes testimónio fídei probáti, invénti sunt in Christo Jesu, Dómino
    nostro."
secreta:
  - "Adésto, Dómine, précibus pópuli tui, adésto munéribus: ut, quæ sacris sunt
    obláta mystériis, tuórum tibi pláceant intercessióne Sanctórum."
  - $Per Dominum
postcommunio:
  - "Súmpsimus, Dómine, pignus redemptiónis ætérnæ: quod sit nobis, quǽsumus,
    interveniéntibus sanctis Martýribus tuis, vitæ præséntis auxílium páriter et
    futúræ."
  - $Per Dominum
lectio93:
  - Tiburtius, Chromátii præfecti Urbis fílius, sancti Sebastiáni ópera
    Christianus, cum ob eam causam ad Fabianum judicem adductus esset múltaque
    apud illum de Christi fide prædicáret, excandéscens judex paviméntum
    candéntibus carbónibus sterni jubet. Mox, Tiburti, inquit, vel diis nostris
    sacrífices oportet, vel per istos carbónes nudis pédibus tibi incedéndum
    est. At ille, crucis signo se muniens fidentérque ámbulans in pruna, Disce,
    inquit, ex hoc solum esse Deum, quem Christiáni colunt; prunæ enim mihi
    flores vidéntur. Quod cum magicis artibus tribuerétur, extra Urbem ductus
    Tiburtius, ac via Lavicana tertio ab Urbe lápide gládio percússus, ibi a
    Christiánis sepelítur. Quo die Susanna virgo nobilíssima, quod Galerii
    Maximiáni, fílii Diocletiáni imperatóris, conjúgium recusaret, ut quæ
    virginitátem Deo vóverat; post multa tormentórum genera, quibus varie
    tentátum est sanctum Vírginis propositum, domi suæ, jussu imperatóris,
    gládio percússa, ad duplex virginitátis et martyrii præmium migrávit in
    cælum.
  - "&teDeum"
