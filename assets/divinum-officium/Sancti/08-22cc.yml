oratio:
  - "Auxílium tuum nobis, Dómine, quǽsumus, placátus impende: et,
    intercedéntibus beátis Martýribus tuis Timótheo, Hippolýto et Symphoriáno,
    déxteram super nos tuæ propitiatiónis exténde."
  - $Per Dominum
secreta:
  - "@Commune/C6a"
postcommunio:
  - "Divíni múneris largitáte satiáti, quǽsumus, Dómine, Deus noster: ut,
    intercedéntibus sanctis Martýribus tuis Timótheo, Hippolýto et Symphoriáno,
    in ejus semper participatióne vivámus."
  - $Per Dominum
