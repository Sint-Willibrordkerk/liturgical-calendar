  - ""
  - Commemoratio et M.
  - "1"
  - "@C3a"
lectio4:
  - Cosmas et Damiánus, fratres Arabes, in Ægéa urbe nati, nóbiles médici,
    imperatóribus Diocletiáno et Maximiáno, non magis medicínæ sciéntia quam
    Christi virtúte, morbis étiam insanabílibus medebántur. Quorum religiónem
    cum Lysias præféctus cognovísset, addúci eos ad se jubet, ac de vivéndi
    institúto et de fídei professióne interrogátos, cum se et Christiános esse,
    et christiánam fidem esse ad salútem necessáriam, líbere prædicárent, deos
    venerári ímperat; et, si id recúsent, minátur cruciátus et necem
    acerbíssimam.
lectio5:
  - "Verum, ut se frustra hæc illis propónere intélligit: Colligáte, inquit,
    manus et pedes istórum, eósque exquisítis torquéte supplíciis. Quibus jussa
    exsequéntibus, nihilóminus Cosmas et Damiánus in senténtia persistébant.
    Quare, ut erant vincti, in profúndum mare jaciúntur. Unde cum salvi ac
    solúti essent egréssi, mágicis ártibus præféctus factum assígnans, in
    cárcerem tradit, ac postrídie edúctos in ardéntem rogum ínjici jubet; ubi,
    cum ab ipsis flamma refúgeret, várie et crudéliter tortos secúri pércuti
    vóluit. Itaque, in Jesu Christi confessióne, martýrii palmam accepérunt."
lectio6:
  - "@Commune/C3:Lectio4"
lectio94:
  - "Cosmas et Damiánus, fratres Arabes, in Ægéa urbe nati, nóbiles médici,
    imperatóribus Diocletiáno et Maximiáno, non magis medicínæ sciéntia quam
    Christi virtúte, morbis étiam insanabílibus medebántur. Quorum religiónem
    cum Lýsias præféctus cognovísset, addúci eos ad se jubet, ac de vivéndi
    institúto et de fídei professióne interrogátos, cum se et Christiános esse,
    et christiánam fidem esse ad salútem necessáriam, líbere prædicárent, deos
    venerári ímperat; et, si id recúsent, minátur cruciátus et necem
    acerbíssimam. Verum, ut se frustra hæc illis propónere intéllegit:
    Colligáte, inquit, manus et pedes istórum, eósque exquisítis torquéte
    supplíciis. Quibus jussa exsequéntibus, nihilóminus Cosmas et Damiánus in
    senténtia persistébant. Quare, ut erant vincti, in profúndum mare jaciúntur.
    Unde cum salvi ac solúti essent egréssi, mágicis ártibus præféctus factum
    assígnans, in cárcerem tradit, ac postrídie edúctos in ardéntem rogum ínici
    jubet; ubi, cum ab ipsis flamma refúgeret, várie et crudéliter tortos secúri
    pércuti vóluit. Itaque, in Jesu Christi confessióne, martýrii palmam
    accepérunt."
  - "&teDeum"
