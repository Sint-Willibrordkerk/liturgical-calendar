  - "@Sancti/01-06"
graduale:
  - "@Sancti/01-06"
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joann 1:29-34"
  - "In illo témpore: Vidit Joánnes Jesum veniéntem ad se, et ait: Ecce Agnus
    Dei, ecce, qui tollit peccátum mundi. Hic est, de quo dixi: Post me venit
    vir, qui ante me factus est: quia prior me erat. Et ego nesciébam eum, sed
    ut manifestétur in Israël, proptérea veni ego in aqua baptízans. Et
    testimónium perhíbuit Joánnes, dicens: Quia vidi Spíritum descendéntem quasi
    colúmbam de coelo, et mansit super eum. Et ego nesciébam eum: sed qui misit
    me baptizáre in aqua, ille mihi dixit: Super quem víderis Spíritum
    descendéntem, et manéntem super eum, hic est, qui baptízat in Spíritu
    Sancto. Et ego vidi: et testimónium perhíbui, quia hic est Fílius Dei."
offertorium:
  - "@Sancti/01-06"
secreta:
  - "Hóstias tibi, Dómine, pro nati Fílii tui apparitióne deférimus, supplíciter
    exorántes: ut, sicut ipse nostrórum auctor est múnerum, ita sit ipse
    miséricors et suscéptor, Jesus Christus, Dóminus noster:"
  - $Qui tecum.
communio:
  - "@Sancti/01-06"
postcommunio:
  - "Cœlésti lúmine, quǽsumus, Dómine, semper et ubíque nos præveni: ut
    mystérium, cujus nos partícipes esse voluísti, et puro cernámus intúitu, et
    digno percipiámus affectu."
  - $Per Dominum
