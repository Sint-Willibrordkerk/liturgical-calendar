rubrica-cisterciensis-aut-rubrica-praedicatorum/ant-1:
  - "Baptízat * miles Regem, servus Dóminum suum, Joánnes Salvatórem: aqua
    Jordánis stúpuit: colúmba protestátur: Patérna vox audíta est: Hic est
    Fílius meus."
