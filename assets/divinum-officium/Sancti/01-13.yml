lectio4:
  - Sermo sancti Gregórii Nazianzéni
  - "!Oratio in sancta Lumina"
  - "Non possum cohibére lætítiæ voluptátem, sed mente extóllor, et affícior: et
    própriæ pusillitátis oblítus, offícium magni Joánnis, immo pótius famulátum
    subíre conténdo, ac géstio: et licet non sim præcúrsor, de erémo tamen
    vénio. Christus ergo illuminátur, immo pótius fulgóre suo nos illúminat:
    Christus baptizátur, simul et nos descendámus, ut cum ipso páriter
    ascendámus."
lectio5:
  - "Joánnes baptízat, et accédit Jesus, sanctíficans quidem et ipsum, qui
    baptízat, præcípue tamen ut et véterem Adam sepéliat in aquis, et ante
    ómnia, ut per hæc sanctificéntur aquæ Jordánis: ut sicut erat spíritus et
    caro, ita et his, qui baptizándi erant, in spíritu et aqua sanctificatiónis
    succéssio traderétur. Non súscipit Baptísta, conténdit Jesus. Ego, inquit,
    opus hábeo a te baptizári. Lucérna dicit ad Solem, et vox lóquitur ad
    Verbum."
lectio6:
  - "Ascéndit Jesus de aqua, secum quodámmodo demérsum edúcens et élevans
    mundum: et vidit non dívidi cælum, sed aperíri, quod sibi ac nobis post se
    aliquándo Adam ille conclúserat; sicut et ígneo gládio paradísus fúerat
    conclúsus. Spíritus Sanctus testimónium pérhibet: simília namque sibi ipsa
    concúrrunt. De cælo testimónium defértur: inde enim erat ille, cui
    testimónium perhibétur."
lectio7:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 1:29-34"
  - "In illo témpore: Vidit Joánnes Jesum veniéntem ad se, et ait: Ecce Agnus
    Dei, ecce qui tollit peccátum mundi. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tract. 6 in Joann., ante med."
  - "Antequam veníret Dóminus ut baptizarétur a Joánne in Jordáne, nóverat eum
    illis vócibus, ubi ait: Tu ad me venis baptizári? ego a te débeo baptizári.
    Sed ecce Dóminum nóverat, nóverat Fílium Dei. Unde probámus quod jam
    nóverat, quia ipse baptizáret in Spíritu Sancto? Antequam veníret ad
    flúvium, cum multi ad Joánnem cúrrerent baptizári, ait illis: Ego quidem
    baptízo vos in aqua: qui autem post me venit, major me est: cujus non sum
    dignus corrígiam calceaménti sólvere: ipse vos baptizábit in Spíritu Sancto,
    et igni. Jam et hoc nóverat."
lectio8:
  - "Quid ergo per colúmbam dídicit, ne mendax póstea inveniátur, (quod avértat
    a nobis Deus opinári) nisi quamdam proprietátem in Christo talem futúram, ut
    quamvis multi minístri baptizatúri essent, sive justi, sive injústi, non
    tribuerétur sánctitas baptísmi nisi illi, super quem descéndit colúmba, de
    quo dictum est: Hic est qui baptízat in Spíritu Sancto? Petrus baptízet, hic
    est qui baptízat: Paulus baptízet, hic est qui baptízat: Judas baptízet, hic
    est qui baptízat. Nam si pro diversitáte meritórum baptísma sanctum est:
    quia divérsa sunt mérita, divérsa erunt baptísmata: et tanto quisque áliquid
    mélius putátur accípere, quanto a melióre vidétur accepísse."
lectio9:
  - "Ipsi sancti, (intellégite, fratres) boni pertinéntes ad colúmbam,
    pertinéntes ad sortem civitátis illíus Jerúsalem, ipsi boni in Ecclésia, de
    quibus dicit Apóstolus: Novit Dóminus qui sunt ejus; diversárum gratiárum
    sunt, non omnes pária mérita habent. Sunt álii áliis sanctióres, sunt álii
    áliis melióres. Quare ergo si unus ab illo, verbi grátia, justo, sancto
    baptizétur, álius ab álio inferióris mériti apud Deum, inferióris gradus,
    inferióris continéntiæ, inferióris vitæ; unum tamen et par et æquále est
    quod accepérunt, nisi quia hic est, qui baptízat?"
  - "&teDeum"
