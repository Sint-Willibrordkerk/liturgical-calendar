lectio93:
  - Evarístus, Græcus, ex Judæo patre, Trajano imperatóre, pontificátum gessit.
    Qui ecclesiárum titulos urbis Romæ presbyteris divísit, et ordinávit ut
    septem diáconi episcopum custodírent dum evangelicæ prædicatiónis officio
    fungerétur. Idem constítuit, ex traditióne apostolica, ut matrimónium
    publice celebrétur et sacerdotis benedíctio adhibeátur. Præfuit Ecclésiæ
    annos novem, menses tres, presbyteris decem et septem, diáconis duobus,
    epíscopis quindecim, quater mense Decembri, ordinatis. Martyrio coronátus,
    prope sepúlcrum Principis Apostolórum in Vaticano sepúltus est septimo
    Kalendas Novembris.
  - "&teDeum"
