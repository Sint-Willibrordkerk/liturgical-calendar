lectio93:
  - Agapitus Prænestínus, quindecim annos natus, Aureliáno imperatóre, martyrii
    cupidíssimus, cum propter constantiam religiónis, imperatóris jussu, primum
    nervis diutíssime cæsus, deínde in tetrum carcerem conjéctus esset, ut nihil
    omnino per quatuor dies gustaret, e custódia est edúctus. Et, ardéntibus
    carbónibus capiti ejus impositis, Deo agens grátias, íterum afféctus
    verbéribus, nudus ita pédibus suspénsus est, ut ingens fumus e subjecto igne
    os ejus obrúeret. Tum fervens aqua in ejus ventrem effúsa est, maxillǽque
    confractæ. Quo témpore judex, e tribunali lapsus, paulo post mórtuus est. Ea
    re incénso imperatóre, sanctum juvenem jubénte feris óbjici, cum illæ non
    audérent attingere, Præneste gládio percússus est.
  - "&teDeum"
