offertorium:
  - "!Ephes 5:2"
  - Ambuláte in dilectióne, sicut et Christus diléxit nos, et trádidit
    semetípsum pro nobis oblatiónem et hóstiam Deo in odórem suavitátis,
    allelúja.
secreta:
  - "Cœléstem nobis, Dómine, prǽbeant mystéria hæc passiónis et mortis tuæ
    fervórem: quo sanctus Paulus, ea offeréndo, corpus suum hóstiam vivéntem,
    sanctam tibíque placéntem exhíbuit:"
  - $Qui vivis
communio:
  - "!1 Pet 4:13"
  - Communicántes Christi passiónibus gaudéte, ut in revelatióne glóriæ ejus
    gaudeátis exsultántes. Allelúja.
postcommunio:
  - "Súmpsimus, Dómine, divínum sacraméntum, imménsæ caritátis tuæ memoriále
    perpétuum: tríbue, quǽsumus; ut, sancti Pauli méritis et imitatióne, aquam
    de fóntibus tuis hauriámus in vitam ætérnam saliéntem, et tuam sacratíssimam
    passiónem córdibus nostris impréssam móribus et vita teneámus:"
  - $Qui vivis
lectio4:
  - Paulus a Cruce, Uvádæ in Liguria natus, sed a Castellátio prope Alexandríam
    Statiellórum nobili genere oriundus, qua futurus esset sanctitáte clarus,
    innotuit miro splendore, qui noctu implévit pariéntis matris cubiculum, et
    insígni augustæ cæli Reginæ beneficio, quæ púerum in flumen delapsum a certo
    naufragio illæsum erípuit. A primo ratiónis usu Jesu Christi crucifixi amóre
    flagrans, ejus contemplatióni prolixius vacare cœpit, et carnem
    innocentíssimam vigiliis, flagellis, jejuniis, potu in sexta feria ex acéto
    cum felle mixto, ac dura quavis castigatióne contérere. Martyrii desidério
    incénsus, exercitui se adjunxit, qui Venetiis, ad bellum Turcis inferéndum,
    comparabátur; cógnita vero inter orándum Dei voluntáte, arma ultro réddidit,
    præstantiori milítiæ operam datúrus, quæ Ecclésiæ præsidio esse æternámque
    hóminum salútem procurare totis viribus niterétur. Reversus in pátriam,
    honestíssimis nuptiis sibique deláta patrui hereditáte recusatis, arctiórem
    inire crucis sémitam ac rudi túnica a suo episcopo indui vóluit. Tum ejus
    jussu, ob eminentem vitæ sanctimóniam et rerum divinárum sciéntiam, nondum
    clericus, Dominicum agrum, máximo cum animárum fructu, divini verbi
    prædicatióne excoluit.
lectio5:
  - Romam profectus, theologicis disciplinis rite imbutus, a summo Pontifice
    Benedicto décimo tertio ex obediéntia sacerdotio auctus est. Facta sibi ab
    eodem potestate aggregándi socios, in solitúdinem recéssit Argentarii
    montis, quo eum beáta Virgo jamprídem invitaverat, veste illi simul ostensa
    atri coloris, passiónis Fílii sui insígnibus, decorata, ibique fundaménta
    jecit novæ congregatiónis. Quæ brevi, plurimis ab eo tolerátis labóribus,
    præcláris aucta viris, cum Dei benedictióne valde succrevit; a Sede
    apostolica non semel confirmáta, una cum regulis, quas orando ipse a Deo
    acceperat, et quarto addito voto, pergratam Dominicæ passiónis memóriam
    promovendi. Sacras vírgines quoque instituit, quæ excéssum caritátis divini
    Sponsi sedulo meditaréntur. Hæc inter, animárum inexhausta aviditate ab
    Evangélii prædicatióne numquam deficiens, hómines pene innumeros, étiam
    perditíssimos aut in hæresim lapsos, in salútis trámitem adduxit. Præsertim
    Christi enárranda passióne, mirífica ejus oratiónis vis erat, qua una cum
    astántibus in fletum effúsus, quælibet obduráta corda ad pœniténtiam
    scindebat.
lectio6:
  - "Tanta in ejus péctore alebátur divinæ caritátis flamma, ut indusium quod
    erat cordi propius, sæpe véluti igne adustum, et binæ cóstulæ elátæ
    apparúerint. Sacrum præsertim fáciens non poterat a lácrimis temperare:
    frequénti quoque éxtasi cum mira intérdum corporis elevatióne frui, vultúque
    superna luce radiante conspiciebátur. Quandoque, dum concionarétur, cæléstis
    vox verba ei suggerentis audíta fuit, aut sermo ejus ad plura míllia passuum
    intónuit. Prophetíæ et linguárum dono, cordium scrutatióne, potestate in
    dæmones, in morbos, in eleménta enituit. Cumque ipsis summis Pontificibus
    carus ac venerandus esset, servum inutilem, peccatórem nequíssimum, a
    dæmóniis quoque conculcándum se judicábat. Tandem, asperrimi vitæ generis ad
    longam usque senectútem tenacíssimus, anno millesimo septingentésimo
    septuagesimo quinto, cum præclára mónita, véluti sui spíritus transmissa
    hereditáte, alumnis tradidísset, Ecclésiæ sacramentis ac cælésti visióne
    recreatus, Romæ, qua prædixerat die, migrávit in cælum. Eum Pius nonus
    Pontifex maximus in Beatórum, novisque deínde fulgentem signis, in Sanctórum
    númerum retulit."
lectio94:
  - Paulus a Cruce, Uvádæ in Ligúria natus, a primo ratiónis usu, Jesu Christi
    crucifíxi amóre flagrávit. Martýrii desidério incénsus, exercítui se
    adjúnxit, qui Venétiis ad bellum Turcis inferéndum comparabátur. Cógnita
    vero Dei voluntáte, honestíssimis núptiis sibíque deláta pátrui hereditáte
    recusátis, rudi túnica a suo epíscopo indútus, nondum cléricus, Domínicum
    agrum divíni verbi prædicatióne excóluit. Romæ a Summo Pontífice Benedícto
    décimo tértio ex obediéntia sacerdótio auctus, in solitúdinem recéssit
    Argentárii montis, quo eum beáta Virgo jamprídem invitáverat, veste illi
    simul osténsa atri colóris passiónis Fílii sui insígnibus decoráta, ibíque
    fundaménta jecit novæ congregatiónis, cujus sodáles voto adstringeréntur
    Domínicæ passiónis memóriam promovéndi. Sacras Vírgines quoque instítuit,
    quæ Dómini passiónem sédulo meditaréntur. Prædicatióne, virtútibus et
    divínis charismátibus clarus, Romæ obdormívit in Dómino, anno millésimo
    septingentésimo septuagésimo quinto. Eum Pius nonus Póntifex máximus in
    Beatórum, dein in Sanctórum númerum rétulit.
