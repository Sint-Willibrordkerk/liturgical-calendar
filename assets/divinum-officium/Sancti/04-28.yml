oratio:
  - "Dómine Jesu Christe, qui, ad mystérium Crucis prædicándum, sanctum Paulum
    singulári caritáte donásti, et per eum novam in Ecclésia famíliam floréscere
    voluísti: ipsíus nobis intercessióne concéde; ut, passiónem tuam júgiter
    recoléntes in terris, ejúsdem fructum cónsequi mereámur in cœlis:"
  - $Qui vivis
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Corinthios
  - "!1 Cor 1:17-25."
  - "Fratres: Non misit me Christus baptizáre, sed evangelizáre: non in
    sapiéntia verbi, ut non evacuétur Crux Christi. Verbum enim Crucis
    pereúntibus quidem stultítia est: iis autem, qui salvi fiunt, id est nobis,
    Dei virtus est. Scriptum est enim: Perdam sapiéntiam sapiéntium et
    prudéntiam prudéntium reprobábo. Ubi sápiens? ubi scriba? ubi conquisítor
    hujus sǽculi? Nonne stultam fecit Deus sapiéntiam hujus mundi? Nam quia in
    Dei sapiéntia non cognóvit mundus per sapiéntiam Deum: plácuit Deo per
    stultítiam prædicatiónis salvos fácere credéntes. Quóniam et Judǽi signa
    petunt et Græci sapiéntiam quærunt: nos autem prædicámus Christum
    crucifíxum: Judǽis quidem scándalum, géntibus autem stultítiam, ipsis autem
    vocátis Judǽis atque Græcis Christum Dei virtútem et Dei sapiéntiam: quia,
    quod stultum est Dei, sapiéntius est homínibus: et, quod infírmum est Dei,
    fórtius est homínibus."
graduale:
  - Allelúja, allelúja.
  - "!2 Cor 5:15"
  - "Pro ómnibus mórtuus est Christus: ut, et qui vivunt, jam non sibi vivant,
    sed ei, qui pro ipsis mórtuus est, et resurréxit. Allelúja."
  - "!Rom 8:17"
  - "Si fílii, et herédes: herédes quidem Dei, coherédes autem Christi: si tamen
    compátimur, ut et conglorificémur. Allelúja."
graduale1:
  - "!Gal 6:14"
  - "v. Mihi autem absit gloriári, nisi in Cruce Dómini nostri Jesu Christi: per
    quem mihi mundus crucifíxus est, et ego mundo."
  - "!1 Cor 2:2"
  - Non judicávi me scire áliquid inter vos, nisi Jesum Christum, et hunc
    crucifíxum. Allelúja, allelúja.
  - "!1 Pet 2:21."
  - Christus passus est pro nobis, vobis relínquens exémplum, ut sequámini
    vestígia ejus. Allelúja.
tractus:
  - "!1 Pet 4:1"
  - "Christo ígitur passo in carne, et vos eádem cogitatióne armámini: quia, qui
    passus est in carne, désiit a peccátis."
  - "!2 Cor 4:10"
  - Semper mortificatiónem Jesu in córpore nostro circumferéntes, ut et vita
    Jesu manifestétur in corpóribus nostris.
  - "!Heb 12:2"
  - Aspiciéntes in auctórem fídei et consummatórem Jesum, qui propósito sibi
    gáudio sustínuit Crucem, confusióne contémpta, atque in déxtera sedis Dei
    sedet.
