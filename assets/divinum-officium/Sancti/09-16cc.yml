officium:
  - Ss. Euphemiæ, Luciæ et Geminiani Martyrum
rank:
  - ""
  - Simplex
  - "1.1"
  - "@C3"
rule:
  - vide C3;
oratio:
  - "Præsta, Dómine, précibus nostris cum exsultatióne provéntum: ut sanctórum
    Mártyrum Euphémiæ, Lúciæ et Geminiáni, quorum diem passiónis ánnua devotióne
    recólimus, étiam fídei constántiam subsequámur."
  - $Per Dominum
secreta:
  - "Vota pópuli tui, quǽsumus, Dómine, propítius inténde: et, quorum nos
    tríbuis sollémnia celebráre, fac gaudére suffrágiis."
  - $Per Dominum
postcommunio:
  - "Exáudi, Dómine, preces nostras: et sanctórum Mártyrum tuórum Euphémiæ,
    Lúciæ et Geminiáni, quorum festa sollémniter celebrámus, contínuis foveámur
    auxíliis."
  - $Per Dominum
