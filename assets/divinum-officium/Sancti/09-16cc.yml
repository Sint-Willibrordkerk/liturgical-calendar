lectio93:
  - Euphemia, Lúcia et Geminianus, in persecutióne Diocletiáni, non eodem loco,
    sed eodem die, martyrio coronáti sunt. Euphemia Virgo apud Chalcédonem,
    Prisco proconsule, varia tormentórum genera, virgárum, equulei, rotárum,
    ignis constanter passa; demum béstiis objecta, una ex iis morsum sancto
    corpori infigente, ceteris pedes ejus lambéntibus, immaculátum spíritum Deo
    réddidit. Lúcia, vidua Romana, a fílio Eutropio quod Christum multos annos
    coluísset accusata, in ollam pice ac plumbo ferventuem dimittitur; unde
    incólumis evadens, cum ferro plumboque oneráta per Urbem ducerétur,
    Geminianum, nóbilem virum, constántia fidei et martyrii ad Christum
    convértit. Quem étiam cum multis aliis ad fidem perductis, varie tortum,
    gloriosi martyrii, abscisso cápite, socium hábuit. Quorum córpora Maxima,
    mulier christiana, honorifice sepelívit.
