introitus:
  - "!Ps 63:3"
  - "v. Protexísti me, Deus, a convéntu malignántium, allelúja: a multitúdine
    operántium iniquitátem, allelúja, allelúja."
  - "!Ps 63:2"
  - "Exáudi, Deus, oratiónem meam cum déprecor: a timore inimíci éripe ánimam
    meam."
  - "&Gloria"
  - "v. Protexísti me, Deus, a convéntu malignántium, allelúja: a multitúdine
    operántium iniquitátem, allelúja, allelúja."
oratio:
  - "Deus, qui beátum Marcum Evangelístam tuum evangélicæ prædicatiónis grátia
    sublimásti: tríbue, quǽsumus; ejus nos semper et eruditióne profícere et
    oratióne deféndi."
  - $Per Dominum
commemoratio-oratio:
  - "!Pro rogationibus"
  - "Præsta, quǽsumus, omnípotens Deus: ut, qui in afflictióne nostra de tua
    pietáte confídimus; contra advérsa ómnia, tua semper protectióne muniámur."
  - $Per Dominum
lectio:
  - Léctio Ezechiélis Prophétæ
  - "!Ezech 1:10-14"
  - "Similitúdo vultus quátuor animálium: fácies hóminis, et fácies leónis a
    dextris ipsórum quatuor: fácies autem bovis a sinístris ipsórum quátuor, et
    fácies áquilæ désuper ipsórum quátuor. Fácies eórum et pennæ eórum exténtæ
    désuper: duæ pennæ singulórum jungebántur et duæ tegébant córpora eórum: et
    unumquódque eórum coram fácie sua ambulábat: ubi erat ímpetus spíritus,
    illuc gradiebántur, nec revertebántur cum ambulárent. Et similitúdo
    animálium, aspéctus eórum quasi carbónum ignis ardéntium et quasi aspéctus
    lampadárum. Hæc erat visio discúrrens in médio animálium, splendor ignis, et
    de igne fulgur egrédiens. Et animália ibant et revertebántur in
    similitúdinem fúlguris coruscántis."
graduale:
  - Allelúja, allelúja.
  - "!Ps 88:6"
  - "v. Confitebúntur cœli mirabília tua, Dómine: étenim veritátem tuam in
    ecclésia sanctórum. Allelúja."
  - "!Ps 20:4."
  - Posuísti, Dómine, super caput ejus corónam de lápide pretióso. Allelúja.
evangelium:
  - "@Sancti/02-06"
offertorium:
  - "!Ps 88:6"
  - "Confitebúntur cœli mirabília tua, Dómine: et veritátem tuam in ecclésia
    sanctórum, allelúja, allelúja."
secreta:
  - "Beáti Marci Evangelístæ tui sollemnitáte tibi múnera deferéntes, quǽsumus,
    Dómine: ut, sicut illum prædicátio evangélica fecit gloriósum: ita nos ejus
    intercéssio et verbo et ópere tibi reddat accéptos."
  - $Per Dominum
commemoratio-secreta:
  - "!Pro rogationibus"
  - Hæc múnera, quǽsumus, Dómine, et víncula nostræ pravitátis absólvant, et tuæ
    nobis misericórdiæ dona concílient.
  - $Per Dominum.
communio:
  - "@Commune/C2p:Communio"
postcommunio:
  - "Tríbuant nobis, quǽsumus, Dómine, contínuum tua sancta præsídium: quo,
    beáti Marci evangelístæ tui précibus, nos ab ómnibus semper tueántur
    advérsis."
  - $Per Dominum
commemoratio-postcommunio:
  - "!Pro rogationibus"
  - "Vota nostra, quǽsumus, Dómine, pio favóre proséquere: ut, dum dona tua in
    tribulatióne percípimus, de consolatióne nostra in tuo amóre crescámus."
  - $Per Dominum
lectio4:
  - Ex libro sancti Hierónymi Presbýteri de Scriptóribus ecclesiásticis
  - _
  - Marcus, discípulus et intérpres Petri, juxta quod Petrum referéntem
    audíerat, rogátus Romæ a frátribus, breve scripsit Evangélium. Quod cum
    Petrus audísset, et probávit, et Ecclésiæ legéndum sua auctoritáte dedit.
    Assúmpto ítaque Evangélio quod ipse confécerat, perréxit in Ægýptum, et
    primus Alexandríæ Christum annúntians, constítuit ecclésiam tanta doctrína
    et vitæ continéntia, ut omnes sectatóres Christi ad exémplum sui cógeret.
lectio5:
  - "Dénique Philo, disertíssimus Judæórum, videns Alexandríæ primam ecclésiam
    adhuc judaizántem, quasi in laudem gentis suæ, librum super eórum
    conversatióne scripsit. Et quómodo Lucas narrat Jerosólymæ credéntes ómnia
    habuísse commúnia: sic et ille, quod Alexandríæ sub Marco fíeri doctóre
    cernébat, memóriæ trádidit. Mórtuus est autem octávo Nerónis anno, et
    sepúltus Alexandríæ, succedénte sibi Aniáno."
lectio6:
  - "@Commune/C1a:Lectio4"
