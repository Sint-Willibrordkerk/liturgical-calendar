officium:
  - Ss. Basilidis, Cyrini, Naboris and Nazarii Martyrum
rank:
  - ""
  - Simplex
  - "1.1"
  - "@C3"
rule:
  - vide C3;
  - Gloria
oratio:
  - "Sanctórum Mártyrum tuórum Basílidis, Cyríni, Nabóris atque Nazárii,
    quǽsumus, Dómine, natalítia nobis votíva respléndeant: et, quod illis
    cóntulit excelléntia sempitérna, frúctibus nostræ devotiónis accréscat."
  - $Per Dominum
lectio:
  - "@Commune/C3a-1"
graduale:
  - "!Ps 78:10; 78:2"
  - Víndica, Dómine, sánguinem Sanctórum tuórum, qui effúsus est.
  - "V. Posuérunt mortália servórum tuórum escas volatílibus cœli: carnes
    Sanctórum tuórum béstiis terræ."
  - Allelúja, allelúja.
  - "!Ps 44:14"
  - "Córpora Sanctórum in pace sepúlta sunt: et nómina eórum vivent in
    generatiónem et generatiónem. Allelúja."
evangelium:
  - "@Sancti/01-19"
offertorium:
  - "@Commune/C3a"
secreta:
  - "Pro sanctórum tuórum Basílidis, Cyríni, Nabóris atque Nazárii sánguine
    venerándo, hóstias tibi. Dómine, sollémniter immolámus, tua mirabília
    pertractántes: per quem talis est perfécta victória."
  - $Per Dominum
communio:
  - "!Ps 78:2; 78:11"
  - "Posuérunt mortália servórum tuórum, Dómine, escas volatílibus cœli, carnes
    Sanctórum tuórum béstiis terræ: secúndum magnitúdinem bráchii tui pósside
    fílios morte punitórum."
postcommunio:
  - "Semper, Dómine, sanctórum Mártyrum tuórum Basílidis, Cyríni, Nabóris atque
    Nazárii sollémnia celebrántes: præsta, quǽsumus; ut eórum patrocínia júgiter
    sentiámus."
  - $Per Dominum
lectio93:
  - "Basilides, Cyrinus, Nabor et Nazarius, Romani milites, nobiles genere, et
    virtute illustres, christiana religione suscepta, cum Christum Dei Filium,
    Diocletiano imperatore, prædicarent, ab Aurelio præfecto Urbis comprehensi,
    et ut diis sacra facerent admoniti, ejus jussa contemnentes, missi sunt in
    carcerem. Quibus orantibus, cum subito clarissima lux oborta omnium oculis,
    qui ibidem essent, carcerem collustrasset: illo cælesti splendore commotus
    Marcellus custodiæ præpositus, multique alii, Christo Domino crediderunt.
    Verum postea e carcere emissi, ab imperatore Maximiano, cum ejus étiam
    neglecto imperio, unum Christum Deum et Dominum in ore haberent,
    scorpionibus cruciati iterum conjiciuntur in vincula: unde septimo die
    educti, et ante pedes imperatoris constituti, perstiterunt in irrisione
    inanium deorum, Jesum Christum Deum constantissime confitentes. Quam ob rem
    damnati, securi feriuntur. Quorum corpora feris objecta, nec ab illis tacta
    a Christianis honorifice sepulta sunt."
  - "&teDeum"
