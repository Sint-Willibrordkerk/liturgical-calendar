ant-1:
  - "Interrogábat * Magos Heródes: Quod signum vidístis super natum Regem?
    Stellam vídimus fulgéntem, cujus splendor illúminat mundum."
responsory1:
  - "R. Tria sunt múnera pretiósa, quæ obtulérunt Magi Dómino in die ista, et
    habent in se divína mystéria:"
  - "* In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum
    consídera: et in myrrha, Domínicam sepultúram."
  - V. Salútis nostræ auctórem Magi veneráti sunt in cunábulis, et de thesáuris
    suis mýsticas ei múnerum spécies obtulérunt.
  - "R. In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum
    consídera: et in myrrha, Domínicam sepultúram."
rubrica-praedicatorum/responsory1:
  - "R. Hódie in Jordáne baptizáto Dómino apérti sunt cæli, et sicut colúmba
    super eum Spíritus mansit, et vox Patris intónuit:"
  - "* Hic est Fílius meus diléctus, in quo mihi bene complácui."
  - V. Descéndit Spíritus Sanctus corporáli spécie sicut colúmba in ipsum, et
    vox de cælo facta est.
  - R. Hic est Fílius meus diléctus, in quo mihi bene complácui.
responsory2:
  - "R. In colúmbæ spécie Spíritus Sanctus visus est, Patérna vox audíta est:"
  - "* Hic est Fílius meus diléctus, in quo mihi bene complácui."
  - V. Cæli apérti sunt super eum, et vox Patris intónuit.
  - R. Hic est Fílius meus diléctus, in quo mihi bene complácui.
responsory3:
  - "R. Reges Tharsis et ínsulæ múnera ófferent:"
  - "* Reges Arabum et Saba dona Dómino Deo addúcent."
  - V. Omnes de Saba vénient, aurum et thus deferéntes.
  - R. Reges Arabum et Saba dona Dómino Deo addúcent.
  - "&Gloria"
  - R. Reges Arabum et Saba dona Dómino Deo addúcent.
lectio4:
  - Sermo sancti Máximi Epíscopi
  - "!Homilia 1 de Epiphania"
  - "In hac, dilectíssimi, celebritate, sicut relatu paternæ traditiónis
    instrúimur, multíplici nobis est festivitate lætándum. Ferunt enim, hódie
    Christum Dóminum nostrum vel stella duce a Géntibus adorátum: vel invitátum
    ad nuptias, aquas in vina vertisse; vel suscepto a Joánne baptismate,
    consecrasse fluénta Jordánis, suumque simul purificasse Baptistam."
lectio5:
  - "Sed quid potíssimum præsénti hoc factum sit die, nóverit ipse qui fecit:
    nos tamen crédere, nec dubitare debemus, quidquid illud est, factum esse pro
    nobis. Nam quod eum fulgentioris stellæ radiis incitáti adoravére Chaldæi,
    Deum verum Géntibus spes data est adorandi. Quod aquæ novo sunt ordine in
    vina mutátæ, novi nobis póculi prælibátum est sacraméntum. Quod autem
    baptizátus est Agnus Dei, regenerántis baptismi salutáre nobis munus est
    dedicátum."
lectio6:
  - Oportet ítaque nos, fratres, ad honórem Salvatoris nostri, cujus nativitátem
    débita nuper cum exsultatióne transégimus, omni cum devotióne étiam hunc
    virtútum ejus celebrare natalem. Et quam recte tria hæc nobis uno acta in
    die mysteria prædicántur, qui ineffábilis Trinitátis arcanum uno Dei sub
    nómine confitemur! Per hæc ergo miracula Christus Dóminus Redémptor noster
    óculis se vóluit revelare mortalium, quátenus invisibilis ejus divinitas,
    quæ latebat in hómine, in opere non latéret.
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 2:1-12"
  - "Cum natus esset Jesus in Bethlehem Juda in diébus Herodis regis, ecce Magi
    ab Oriénte venérunt Jerosolymam, dicéntes: Ubi est qui natus est Rex
    Judæórum? Et réliqua."
  - _
  - Homilía sancti Hierónymi Presbýteri
  - "!Liber 1 Comment. in cap. 2. Matth."
  - Vídimus enim stellam ejus in Oriénte. Ad confusiónem Judæórum, ut
    nativitátem Christi a Géntibus díscerent, óritur in Oriénte stella; quam
    futuram, Bálaam, cujus successores erant, vaticinio nóverant. Lege Numerórum
    librum. Deferúntur autem Magi stellæ indicio in Judǽam, ut sacerdótes a
    Magis interrogati, ubi Christus nascerétur, inexcusábiles fíerent de adventu
    ejus.
lectio8:
  - "At illi dixérunt ei: In Bethlehem Judææ. Librariórum hic error est. Putámus
    enim ab Evangelista primum éditum, sicut in ipso Hebráico légimus, Judæ, non
    Judææ. Quæ est enim aliárum géntium Bethlehem, ut ad distinctiónem ejus, hic
    Judææ ponerétur? Judæ autem idcirco scribitur, quia est et alia Bethlehem in
    Galilæa. Lege librum Jesu fílii Nave. Dénique et in ipso testimonio, quod de
    Michææ prophetía sumptum est, ita habétur: Et tu Bethlehem terra Juda."
lectio9:
  - "Et, apertis thesáuris suis, obtulérunt ei múnera, aurum, thus et myrrham.
    Pulcherrime munerum sacraménta Juvencus Presbyter uno versículo
    comprehéndit: Thus, aurum, myrrham, Regíque, hominíque, Deóque dona ferunt.
    Et responso accepto in somnis, ne redirent ad Herodem, per aliam viam
    reversi sunt in regiónem suam. Qui múnera obtulerant Dómino, consequenter
    responsum accipiunt, non per Angelum, sed per ipsum Dóminum: ut meritórum
    Joseph privilegium demonstrarétur. Revertúntur autem per aliam viam: quia
    infidelitáti miscéndi non erant Judæórum."
  - "&teDeum"
ant-2:
  - Omnes natiónes * vénient a longe, portántes múnera sua, allelúja.
ant-3:
