introitus:
  - "@Sancti/02-24"
oratio:
  - "Omnípotens sempitérne Deus, qui hujus diei venerándam sanctámque lætítiam
    in beáti Apóstoli tui Bartholomǽi festivitáte tribuísti: da Ecclésiæ tuæ,
    quǽsumus; et amáre quod crédidit, et prædicáre quod dócuit."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Corínthios
  - "!1 Cor 12:27-31"
  - "Fratres: Vos estis corpus Christi et membra de membro. Et quosdam quidem
    pósuit Deus in Ecclésia primum apóstolos, secúndo prophetas, tertio
    doctores, deinde virtútes, exinde grátias curationum, opitulatiónes,
    gubernatiónes, genera linguarum, interpretatiónes sermonum. Numquid omnes
    apóstoli? numquid omnes prophétæ? numquid omnes doctóres? numquid omnes
    virtútes? numquid omnes grátiam habent curationum? numquid omnes linguis
    loquúntur? numquid omnes interpretántur? Æmulámini autem charísmata
    melióra."
graduale:
  - "!Ps 44:17; 44:18"
  - "Constítues eos príncipes super omnem terram: mémores erunt nóminis tui,
    Dómine."
  - "V. Pro patribus tuis nati sunt tibi fílii: proptérea pópuli confitebúntur
    tibi."
  - Allelúja, allelúja.
  - V. Te gloriósus Apostolórum chorus laudat, Dómine. Allelúja.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 6:12-19"
  - "In illo témpore: Exiit Jesus in montem oráre, et erat pernóctans in
    oratióne Dei. Et cum dies factus esset, vocavit discípulos suos, et elégit
    duódecim ex ipsis - quos et Apóstolos nominávit -: Simónem, quem
    cognominávit Petrum, et Andream fratrem ejus, Jacóbum et Joánnem, Philíppum
    et Bartholomæum, Matthǽum et Thomam, Jacóbum Alphæi et Simónem, qui vocátur
    Zelótes, et Judam Jacóbi, et Judam Iscariótem, qui fuit próditor. Et
    descéndens cum illis, stetit in loco campéstri, et turba discipulórum ejus,
    et multitúdo copiósa plebis ab omni Judæa, et Jerúsalem, et marítima, et
    Tyri, et Sidónis, qui vénerant, ut audírent eum et sanaréntur a languóribus
    suis. Et, qui vexabántur a spirítibus immúndis, curabántur. Et omnis turba
    quærébat eum tángere: quia virtus de illo exíbat, et sanábat omnes."
offertorium:
  - "@Sancti/01-25"
secreta:
  - "Beáti Apóstoli tui Bartholomǽi sollémnia recenséntes, quǽsumus, Dómine: ut
    ejus auxílio tua benefícia capiámus, pro quo tibi laudis hóstias immolámus."
  - $Per Dominum
communio:
  - "@Sancti/02-24"
postcommunio:
  - "Sumptum, Dómine, pignus redemptiónis ætérnæ: sit nobis, quǽsumus;
    interveniénte beáto Bartholomǽo Apóstolo tuo, vitæ præséntis auxílium
    páriter et futúræ."
  - $Per Dominum
