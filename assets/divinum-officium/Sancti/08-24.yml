lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 6:12-19"
  - "In illo témpore: Exiit Jesus in montem oráre et erat pernóctans in oratióne
    Dei. Et, cum dies factus esset, vocávit discípulos suos. Et réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Lib. 5 Comment. in Luc. cap. 6, post initium"
  - "Omnes magni, omnes sublímes montem ascéndunt. Non enim cuicúmque prophéta
    dicit: Ascénde in montem excélsum, qui evangelízas Sion: exálta in virtúte
    vocem tuam, qui evangelízas Jerúsalem. Non vestígiis corporálibus, sed
    factis sublimióribus in hunc montem ascénde, et séquere Christum, ut ipse
    esse mons possis: Montes enim in circúitu ejus. Quare in Evangélio invénies
    solos cum Dómino montem ascendísse discípulos. Orat ergo Dóminus, non ut pro
    se óbsecret, sed ut pro me ímpetret. Nam, etsi ómnia posúerit Pater in
    potestáte Fílii; Fílius tamen, ut hóminis formam impléret, obsecrándum
    Patrem putat esse pro nobis, quia advocátus est noster."
lectio8:
  - Et erat, inquit, pernóctans in oratióne Dei. Spécies tibi, Christiáne,
    datur, forma præscríbitur, quam débeas æmulári. Quid enim te pro salúte tua
    fácere opórtet, quando pro te Christus in oratióne pernóctat? Quid te fácere
    cónvenit, cum vis áliquod pietátis offícium adoríri, quando Christus,
    missúrus Apóstolos, orávit prius, et solus orávit? Nec usquam álibi, si non
    fallor, orásse cum Apóstolis reperítur; ubíque solus óbsecrat. Dei enim
    consílium humána vota non cápiunt, nec quisquam interiórum potest esse
    párticeps Christi.
lectio9:
  - "Vocávit, inquit, discípulos suos, et elégit duódecim ex ipsis; quos ad
    propagándum auxílium salútis humánæ per terrárum orbem satóres fídei
    destináret. Simul advérte cæléste consílium: non sapiéntes áliquos, non
    dívites, non nóbiles, sed piscatóres et publicános, quos dirígeret, elégit;
    ne traduxísse prudéntia, ne redemísse divítiis, ne poténtiæ nobilitatísque
    auctoritáte traxísse áliquos ad suam grátiam viderétur; ut veritátis rátio,
    non disputatiónis grátia prævaléret."
  - "&teDeum"
