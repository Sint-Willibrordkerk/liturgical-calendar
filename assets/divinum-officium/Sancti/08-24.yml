lectio4:
  - Bartholomǽus Apóstolus, Galilǽus, cum in Indiam citeriórem, quæ ei in orbis
    terrárum sortitióne ad prædicándum Jesu Christi Evangélium obvénerat,
    progréssus esset, advéntum Dómini Jesu juxta sancti Matthǽi Evangélium illis
    géntibus prædicávit. Sed, cum in ea província plúrimos ad Jesum Christum
    convertísset, multos labóres calamitatésque perpéssus, venit in majórem
    Arméniam.
lectio5:
  - Ibi Polýmium regem et cónjugem ejus ac prætérea duódecim civitátes ad
    christiánam fidem perdúxit. Quæ res in eum magnam invídiam concitávit illíus
    gentis sacerdótum. Nam usque ádeo Astýagem, Polýmii regis fratrem, in
    Apóstolum incendérunt, ut is vivo Bartholomǽo pellem crudéliter détrahi
    jússerit ac caput abscíndi; quo in martýrio ánimam Deo réddidit.
lectio6_:
  - Ejus corpus Albáni, quæ est urbs majóris Arméniæ, ubi is passus fúerat,
    sepúltus est. Quod póstea ad Líparam ínsulam delátum, inde Benevéntum
    translátum est. Postrémo Romam ab Ottóne tértio imperatóre portátum, in
    Tíberis ínsula, in ecclésia ejus nómine Deo dicáta, collocátum fuit.
lectio6_t:
  - Agitur autem Romæ dies festus octavo Kalendas Septembris, et per octo
    consequentes dies illa basilica magna populi frequentia celebratur.
