oratio:
  - "Deus, qui per sanctum Joséphum Confessórem tuum, ad erudiéndam spíritu
    intellegéntiæ ac pietátis juventútem, novum Ecclésiæ tuæ subsídium providére
    dignátus es: præsta, quǽsumus; nos, ejus exémplo et intercessióne, ita
    fácere et docére, ut præmia consequámur ætérna."
  - $Per Dominum
