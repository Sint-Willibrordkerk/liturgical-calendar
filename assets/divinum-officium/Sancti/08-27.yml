lectio4:
  - Josephus Calasanctius a Matre Dei, Petraltæ in Aragonia nobili genere natus,
    a teneris annis futuræ in pueros caritatis et eorum institutionis indicia
    præbuit. Nam adhuc parvulus eos ad se convocatos in mysteriis fidei et
    sacris precibus erudiebat. Humanis divinisque litteris egregie doctus cum
    studiis theologicis Valentiæ operam daret, nobilis potentisque feminæ
    illecebris fortiter superatis, virginitatem, quam Deo voverat, inoffensam
    insigni victoria servavit. Sacerdos ex voto factus, a compluribus episcopis
    in Castellæ Novæ, Aragoniæ et Catalauniæ regnis in partem laboris ascitus,
    exspectationem omnium vicit, pravis ubique moribus emendatis, ecclesiastica
    disciplina restituta, inimicitiis cruentisque factionibus mirifice
    exstinctis. At cælesti visione et Dei voce frequenter admonitus, Romam
    profectus est.
lectio5:
  - "In Urbe summa vitæ asperitate, vigiliis et jejuniis corpus affligens, in
    orationibus et cælestium rerum contemplatione dies noctesque versabatur,
    septem ejusdem Urbis ecclesias singulis fere noctibus obire solitus: quem
    inde morem complures annos servavit. Dato piis sodalitatibus nomine, mirum
    quanto ardore pauperes, infirmos potissimum, aut carceribus detentos
    eleemosynis omnique pietatis officio sublevaret. Lue Urbem depopulante, una
    cum sancto Camillo, tanto fuit actus impetu caritatis, ut præter subsidia
    ægrotis pauperibus large collata, ipsa étiam defunctorum cadavera suis
    humeris tumulanda transferret. Verum cum divinitus accepisset, se ad
    informandos intelligentiæ ac pietatis spiritu adolescentulos præcipue
    pauperes, destinari, ordinem Clericorum regularium pauperum Matris Dei
    scholarum piarum fundavit, qui peculiarem curam circa puerorum eruditionem
    ex proprio instituto profiterentur: ipsumque ordinem a Clemente octavo, a
    Paulo quinto aliusque summis Pontificibus magnopere probatum, brevi tempore
    per plurimas Europæ provincias et regna mirabiliter propagavit. In hoc autem
    tot labores perpessus est, ac tot ærumnas invicto animo toleravit, ut omnium
    voce miraculum fortitudinis, et sancti Jobi exemplum diceretur."
lectio6:
  - "Quamvis ordini universo præesset, totisque viribus ad animarum salutem
    incumberet, numquam tamen intermisit pueros, præsertim pauperiores, erudire,
    quorum scholas verrere, eosque domum comitari consuevit. In eo summæ
    patientiæ et humilitatis munere, valetudine étiam infirma, duos et
    quinquaginta annos perseveravit: dignus propterea, quem crebris Deus
    miraculis coram discipulis illustraret, et cui beatissima Virgo cum puero
    Jesu, illis orantibus benedicente, appareret. Amplissimis interim
    dignitatibus repudiatis prophetia, abdita cordium et absentia cognoscendi
    donis et miraculis clarus, Deiparæ Virginis, quam singulari pietate et ipse
    ab infantia coluit, et suis maxime commendavit, aliorumque cælitum frequenti
    apparitione dignatus, cum obitus sui diem, et ordinis tunc prope eversi
    restitutionem atque incrementum prænuntiasset, secundum et nonagesimum annum
    agens, Romæ obdormivit in Domino, octavo Kalendas Septembris, anno millesimo
    sexcentesimo quadragesimo octavo. Ejus cor et lingua post sæculum integra et
    incorrupta reperta sunt. Ipse vero multis post obitum quoque signis a Deo
    illustratus, primum a Benedicto decimo quarto beatorum cultu decoratus fuit,
    ac deínde a Clemente decimo tertio inter sanctos solemniter est relatus."
lectio94:
  - Joséphus Calasánctius, Petráltæ in Aragónia natus, adhuc párvulus æquáles ad
    se convocátos mystériis fídei et sacris précibus erudiébat. Sacérdos ex voto
    factus, summa vitæ asperitáte, vigíliis et jejúniis corpus afflígens, in
    oratióne et rerum cæléstium contemplatióne dies noctésque versabátur. Cum
    divínitus accepísset, se ad informándos intellegéntiæ ac pietátis spíritu
    adolescéntes præcípue páuperes, destinári; órdinem Clericórum regulárium
    páuperum Matris Dei scholárum piárum fundávit, qui peculiárem curam de
    púeris erudiéndis ex próprio institúto profiteréntur. Innúmeris proptérea
    labóribus atque ærúmnis invícto ánimo tolerátis, secúndum et nonagésimum
    annum agens, óbiit in Dómino, octávo kaléndas septémbris, anno millésimo
    sexcentésimo quadragésimo octávo.
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum.
  - "!Matt 18:1-5"
  - "In illo témpore: Accesserunt discipuli ad Jesum, dicentes: Quis, putas,
    major est in regno cælorum? Et réliqua."
  - _
  - Homilia sancti Joannis Chrysostomi.
  - "!In cap. 18. Matth. Hom. 60."
  - Videte ne aliquem istorum contempseritis parvulorum, quia eorum Angeli
    Patris mei faciem semper aspiciunt, et quia ego propter eos veni, et hæc
    Patris mei voluntas est. Ad tuendos conservandosque pusilios diligentiores
    nos reddit. Perspicis quam ingentia in tutelam tenujum mœnia erexerit, et
    quantum studium curamque habeat, ne perdantur tum quia supremas
    despicientibus eos pœnas statuit, tum quia summam pollicetur mercedem his,
    qui curam eorum suscipiunt; idque tam suo, quam Patris exemplo corroborat.
lectio8:
  - "Dominum igitur étiam nos imitemur, et nihil pro fratribus omittamus, étiam
    eorum quæ humilia viliaque nimium videntur; sed si administratione nostra
    étiam opus fuerit, quamvis tenuis atque abjectus quidem, cui administrandum
    sit, fuerit, quamvis ardua nobis res atque laboris plena esse videatur,
    omnia hæc pro fratris salute tolerabiliora facilioraque, oro, videantur:
    tanto enim studio tantaque cura Deus dignam esse animam ostendit, ut neque
    Filio suo pepercerit."
lectio9:
  - Si non est nobis satis ad salutem, quod virtuose ipsi vivamus, sed oportet
    aliorum salutem re ipsa desiderare; cum neque nos recte vivamus, neque alios
    hortemur, quid respondebimus? Quæ nobis spes salutis reliqua erit? Quid
    majus, quam animis moderari, quam adolescentulorum fingere mores? Omni certe
    pictore, omni certe statuario, ceterisque hujusmodi omnibus excellentiorem
    hunc duco, qui juvenum animos fingere non ignoret.
  - "&teDeum"
