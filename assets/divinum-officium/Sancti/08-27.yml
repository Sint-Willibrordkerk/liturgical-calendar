graduale:
  - "!Ps 36:30-31"
  - Os justi meditábitur sapiéntiam, et lingua ejus loquétur judícium.
  - "V. Lex Dei ejus in corde ipsíus: et non supplantabúntur gressus ejus."
  - Allelúja, allelúja.
  - "!Jac 1:12."
  - "Beátus vir, qui suffert tentatiónem: quóniam, cum probátus fúerit, accípiet
    corónam vitæ. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 18:1-5"
  - "In illo témpore: Accessérunt discípuli ad Jesum, dicéntes: Quis, putas,
    major est in regno cœlorum? Et ádvocans Jesus parvulum, státuit eum in médio
    eórum et dixit: Amen, dico vobis, nisi convérsi fuéritis et efficiámini
    sicut párvuli, non intrabitis in regnum cœlórum. Quicúmque ergo humiliáverit
    se sicut párvulus iste, hic est major in regno cœlorum. Et qui suscéperit
    unum párvulum talem in nómine meo, me súscipit."
offertorium:
  - "!Ps 9:17"
  - "Desidérium páuperum exaudívit Dóminus: præparatiónem cordis eórum audívit
    auris tua."
secreta:
  - "Altáre tuum, Dómine, munéribus cumulamus oblatis: ut ejus nobis fiant
    supplicatione propitia, cujus nos donasti patrocínio adjuvári."
  - $Per Dominum
communio:
  - "!Marc 10:14"
  - "Sínite párvulos veníre ad me, et ne prohibuéritis eos: tálium est enim
    regnum Dei."
postcommunio:
  - "Sanctificáti, Dómine, salutári mystério: quǽsumus; ut, intercedénte sancto
    Josépho Confessóre tuo, ad majus semper proficiámus pietátis increméntum."
  - $Per Dominum
