lectio6beginning:
  - "Magna deínceps tranquillitáte Pictavórum ecclésiam administrávit:
    Galliámque univérsam addúxit, ut Arianórum impietátem condemnáret. Multos
    libros scripsit mira eruditióne; quos omnes sanctus Hierónymus ad Lætam,
    sine ulla erróris suspicióne legi posse testátur illis verbis: Hilárii
    libros inoffénso decúrrat pede. Migrávit in cælum Idibus Januárii,
    Valentiniáno et Valénte imperatóribus, anno post Christum natum trecentésimo
    sexagésimo nono."
lectio6recentaddition:
  - Eum a multis Pátribus et concíliis insígnem Ecclésiæ Doctórem nuncupátum,
    atque uti talem in áliquot diœcésibus cultum, tandem instánte sýnodo
    Burdigalénsi Pius nonus Póntifex máximus, ex sacrórum Rítuum Congregatiónis
    consúlto, universális Ecclésiæ Doctórem declarávit et confirmávit, ac ipsíus
    festo die Missam et Offícium de Doctóribus ab ómnibus recitári jussit.
lectio94:
  - "Hilárius, in Aquitánia nóbili génere natus, doctrína et eloquéntia
    excélluit. Pictavórum epíscopus creátus, tale munus sic gessit, ut a
    fidélibus summam laudem consequerétur. Ob cathólicam fidem, quam strénue
    propugnávit, quadriénnio apud Phrýgiam relegátus, inter ália mirácula,
    mórtuum suscitávit. Duódecim libros scripsit de Trinitáte contra Ariános, et
    Gálliam univérsam addúxit, ut Arianórum impietátem condemnáret. Multos
    libros scripsit mira eruditióne; quos omnes sanctus Hierónymus ad Lætam sine
    ulla erróris suspicióne legi posse testátur illis verbis: Hilárii libros
    inoffénso decúrrat pede. Migrávit in cælum idibus januárii, anno
    trecentésimo sexagésimo nono. Eum Pius nonus Póntifex máximus, instánte
    sýnodo Burdigalénsi, Doctórem universális Ecclésiæ declarávit et
    confirmávit."
