lectio4:
  - "Hilárius, in Aquitánia nóbili génere natus, doctrína et eloquéntia
    excélluit. Qui primum in matrimónio quasi mónachi vitam egit: deínde propter
    singuláres virtútes Pictavórum epíscopus creátur: quod munus episcopále sic
    gessit, ut a fidélibus summam laudem consequerétur. Quo témpore, cum
    terróribus, bonórum spoliatióne, exsílio, et omni crudelitáte Constántius
    imperátor Cathólicos vexáret, nisi ad Ariánas partes transírent; Hilárius
    tamquam firmíssimum murum se Ariánis oppónens, illórum furórem in se
    concitávit. Itaque multis petítus insídiis, tandem dolo Saturníni
    Arelaténsis epíscopi, de sýnodo Biterrénsi in Phrýgiam relegátus est: ubi et
    mórtuum suscitávit, et libros duódecim scripsit de Trinitáte contra
    Ariános."
lectio5:
  - "Quadriénnio post coácto concílio ad Seléuciam, Isáuriæ urbem, Hilárius
    adésse compúlsus est: ac deínde Constantinópolim proféctus, ubi extrémum
    fídei perículum animadvértit, tribus libéllis públice datis, audiéntiam
    imperatóris popóscit, ut de fide cum adversáriis coram disputáret. Verum cum
    Ursácius et Valens Ariáni epíscopi, quos Hilárius scriptis confutárat,
    præséntis eruditiónem pertiméscerent, Constántio persuasérunt, ut spécie
    honóris eum in suum episcopátum restitúeret. Tunc Hilárium e prǽlio
    hæreticórum reverténtem, ut inquit sanctus Hierónymus, Galliárum ecclésia
    cómplexa est: quem ad episcopátum secútus est Martínus, qui póstea Turonénsi
    prǽfuit ecclésiæ; tantúmque illo doctóre profécit, quantum ejus póstea
    sánctitas declarávit."
