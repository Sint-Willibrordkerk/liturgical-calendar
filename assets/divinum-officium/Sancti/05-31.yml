lectio4:
  - Sermo sancti Petri Canísii Presbýteri
  - "!De Maria Deipara Virgine incomparabili, lib. 15, c. 13"
  - Cur beatíssimam Vírginem Maríam Regínæ nómine, Damascénum, Athanásium
    aliósque secúti, non compellémus, cujus et pater David rex ínclitus, et
    fílius Rex regum Dominúsque dominántium sine fine ímperans, laudem in
    Scriptúris præstantíssimam tenent? Regína est ínsuper, si cum illis
    conferátur, quibus, véluti régibus, cæléste regnum cum Christo, Rege summo,
    cóntigit, útpote illíus coherédibus, et in eódem véluti throno, ut Scriptúra
    lóquitur, cum illo collocátis. Regína est étiam nulli electórum secúnda, sed
    simul Angelis et homínibus tanto præláta dígnius, quo nihil illa sublímius
    ac sánctius esse potest, quæ sola cum Deo Patre Fílium habet commúnem, et
    quæ supra se Deum et Christum tantum, infra se vero réliqua videt ómnia.
responsory4:
  - "R. Súscipe verbum, Virgo María, quod tibi a Dómino transmíssum est:"
  - "* Ecce concípies et páries Deum páriter et hóminem. (Allelúja.)"
  - V. Et Regína vocáberis super omnes gentes.
  - R. Ecce concípies et páries Deum páriter et hóminem. (Allelúja.)
lectio5:
  - "Magnus Athanásius perspícue dixit: Maríam non modo Deíparam, sed étiam
    Regínam et Dóminam próprie veréque censéri, quandóquidem Christus ex ipsa
    matre Vírgine natus, Deus et Dominus idémque Rex máneat. De hac ígitur
    Regína dictum illud Psalmógraphi interpretátur: Adstitit Regína a dextris
    tuis in vestítu deauráto. Non ergo solum cæli, sed et cælórum Regína recte
    dicitur María, útpote mater Regis Angelórum, Regísque cælórum et amíca et
    sponsa. A te vero, augustíssima Regína, eadémque fidíssima Mater María, quam
    sine fructu pie nullus implórat, et cui mortáles omnes beneficiórum memória
    sempitérna devíncti sunt, étiam atque étiam reverénter oro et óbsecro, ut
    hoc qualecúmque observántiæ erga te meæ testimónium ratum et gratum habére
    velis, utque obláti múneris exiguitátem studiósa offeréntis voluntáte metíri
    ac tuo præpoténti Fílio comprobáre dignéris."
responsory5:
  - R. Ecce pósitus est hic in ruínam et resurrectiónem multórum,
  - "* Et tuam ipsíus ánimam pertransíbit gládius. (Allelúja.)"
  - V. Ave, Christi Mater, passiónis sócia, totíus mundi Regína.
  - R. Et tuam ipsíus ánimam pertransíbit gládius. (Allelúja.)
lectio6:
  - Ex Lítteris Encýclicis Pii Papæ duodécimi
  - "!Encyclica « Ad cæli Regínam », diei 11 Octobris 1954"
  - "E Christiánæ vetustátis monuméntis, e litúrgicis précibus, ex índito
    christiáno pópulo religiónis sensu, ex opéribus arte conféctis, úndique
    collégimus voces quæ ásserunt Deíparam Vírginem regáli dignitáte præstáre;
    ratiónes étiam, quas sancta theología ex divínæ fídei thesáuro deducéndo
    ástruit, eándem veritátem prorsus confirmáre argúimus. Tot ex allátis
    testimóniis quasi latíssime résonans concéntus effícitur, qui extóllit régii
    honóris præcélsum fastígium Dei hominúmque Matris, cui cuncta creáta
    subsunt, quæ est: « exaltáta super choros Angelórum ad cæléstia regna ». Cum
    vero, matúro ponderatóque consílio, persuásum Nobis habeámus magna oritúra
    esse Ecclésiæ emoluménta, si quasi in suo candelábro rutilántior lucérna
    pósita, illa sólide probáta véritas maniféstior ómnibus refúlgeat,
    Apostólica Nostra Potestáte decérnimus et institúimus festum Maríæ Regínæ,
    quod toto terrárum orbe quotánnis die trigésimo primo mensis maji est
    celebrándum."
responsory6:
