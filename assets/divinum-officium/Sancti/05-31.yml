lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 1:26-33"
  - "In illo témpore: Missus est Angelus Gábriel a Deo in civitátem Galilǽæ, cui
    nomen Názareth, ad Vírginem desponsátam viro, cui nomen erat Joseph de domo
    David, et nomen Vírginis María. Et réliqua."
  - _
  - Homilía sancti Bonaventúræ Epíscopi
  - "!Sermo de regia dignitate Beatæ Mariæ Virginis"
  - "Beáta María Virgo, summi Regis mater est per generósam conceptiónem,
    secúndum quod dícitur in verbo sibi dicto ab Angelo: Ecce inquit, concípies
    et páries fílium; et póstea: Dabit ei Dóminus sedem David patris ejus, et
    regnábit in domo Jacob in ætérnum, et regni ejus non erit finis. Ac si
    apérte dicat: Concípies et páries fílium Regem, in regáli sólio æternáliter
    residéntem, ac per hoc tamquam Mater Regis regnábis, et ut Regína in regáli
    sólio residébis. Si enim decet filium honórem matri dare, decet ut ei
    commúnicet thronum regálem; unde Virgo María, quia concépit eum, qui habet
    in fémore scriptum: Rex regum et Dóminus dominántium, statim ex quo concépit
    Fílium Dei, Regína fuit, non solum terræ, sed étiam cæli, quod designátum
    est in Apocalýpsi ubi dícitur: Signum magnum appáruit in cælo: múlier amícta
    sole, et luna sub pédibus ejus, et in cápite ejus coróna stellárum
    duódecim."
responsory7:
  - R. Ecce Virgo concípiet et páriet Fílium,
  - "* Et vocábitur nomen ejus Admirábilis, Deus, Fortis. (Allelúja.)"
  - V. Super sólium David et super regnum ejus sedébit in ætérnum.
  - R. Et vocábitur nomen ejus Admirábilis, Deus, Fortis. (Allelúja.)
lectio8:
  - "María Regína est præclaríssima quantum ad glóriam, quod bene desígnat
    Prophéta in psalmo qui speciáliter est de Christo et Vírgine María, ubi
    primo dícitur de Christo: Sedes tua, Deus, in sǽculum sǽculi, et paulo post
    de Vírgine: Adstitit regína a dextris tuis, hoc est in potióribus bonis,
    quod quidem dictum est quantum ad glóriam mentis. Séquitur: In vestítu
    deauráto, in quo exprímitur vestítus gloriósæ immortalitátis, quem décuit
    habére Vírginem in sua Assumptióne. Absit enim ut vestiméntum illud quo
    opértus est Christus, quod étiam fuit perfécte sanctificátum in terra per
    Verbum incarnátum, fiat cibus vérmium. Sicut décuit Christum dare grátiam
    Matri suæ pleníssimam in sua Conceptióne, sic décuit tribúere pleníssimam
    glóriam in ipsíus Matris Assumptióne. Et ídeo tenéndum est quod Virgo,
    gloriósa in ánima et córpore, sédeat juxta Fílium."
responsory8:
  - R. Exaltáta es, sancta Dei Génetrix,
  - "* Super choros Angelórum ad cæléstia regna. (Allelúja.)"
  - V. Intercéde pro nobis ad Dóminum Jesum Christum.
  - R. Super choros Angelórum ad cæléstia regna. (Allelúja.)
  - "&Gloria"
  - R. Super choros Angelórum ad cæléstia regna. (Allelúja.)
lectio9:
  - "María Regína est et dispensátrix grátiæ, quod designátum fuit in libro
    Esther, ubi dícitur: Parvus fons qui crevit in flúvium, et in lucem et solem
    convérsus est. Virgo Maria sub figura Esther comparátur diffusióni fontis et
    lúminis, propter diffusiónem grátiæ quantum ad dúplicem usum, actiónis licet
    et contemplatiónis. Grátia enim Dei, quæ est medicatíva géneris humáni, per
    ipsam ad nos descéndit quasi per aquædúctum, quia ad ipsam Vírginem pértinet
    dispensátio grátiæ non per modum princípii, sed per modum mériti. Mérito
    ígitur Virgo María est excellentíssima Regína in comparatiónem ad plebem,
    cum ímpetrat véniam, súperat pugnam, et distríbuit grátiam, et consequénter
    perdúcit ad glóriam."
  - "&teDeum"
