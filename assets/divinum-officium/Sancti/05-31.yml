introitus1:
  - "@Commune/C10:Introitus"
oratio:
  - "Concéde nobis, quǽsumus, Dómine: ut, qui solemnitátem beátæ Maríæ Vírginis
    Regínæ nostræ celebrámus; eius muníti præsídio, pacem in præsénti et glóriam
    in futúro cónsequi mereámur."
  - $Per Dominum
lectio:
  - Lectio libri Sapientiæ
  - "!Eccli 24:5, 7, 9-11, 30-31"
  - Ego ex ore Altíssimi prodívi, primogénita ante omnem creatúram; ego in
    altíssimis habitávi, et thronus meus in colúmna nubis. In omni terra steti;
    et in omni pópulo, et in omni gente primátum hábui, et ómnium excelléntium
    et humílium corda virtúte calcávi. Qui audit me, non confundétur, et qui
    operántur in me, non peccábunt; qui elúcidant me, vitam ætérnam habébunt.
graduale:
  - "!Apo 19:16"
  - "Ipse habet in vestiménto et in fémore suo scriptum: Rex regum et Dóminus
    dominántium."
  - "!Ps 44:10"
  - Regína adstat ad déxteram eius, ornáta auro ex Ophir. Allelúia, allelúia.
  - V. Salve, Regína misericórdiæ, tu nos ab hoste prótege, et mortis hora
    súscipe. Allelúia.
gradualep:
  - Alleluia, alleluia.
  - V. Beáta es, Virgo María, quæ sub Cruce Dómini sustinuísti. Allelúia.
  - V. Nunc cum eo regnas in ætérnum. Allelúia.
tractus:
  - Gaude, María Virgo, cunctas hǽreses sola interemísti.
  - V. Quæ Gabriélis Archángeli dictis credidísti.
  - "V. Dum Virgo Deum et hóminem genuísti: et post partum, Virgo, invioláta
    permansísti."
  - V. Dei Génetrix, intercéde pro nobis.
evangelium:
  - Sequentia sancti Evangelii secundum Lucam.
  - "!Luc 1:26-33"
  - "In illo témpore: Missus est Angelus Gábriel a Deo in civitátem Galilǽæ, cui
    nomen Názareth, ad Vírginem desponsátam viro, cui nomen erat Ioseph, de domo
    David, et nomen Vírginis María. Et ingréssus Angelus ad eam, dixit: Ave,
    grátia plena: Dóminus tecum: benedícta tu in muliéribus. Quæ cum audísset,
    turbáta est in sermóne eius: et cogitábat, qualis esset ista salutátio. Et
    ait Angelus ei: Ne tímeas, María, invenísti enim grátiam apud Deum: ecce
    concípies in útero, et páries fílium, et vocábis nomen eius Iesum. Hic erit
    magnus, et Fílius Altíssimi vocábitur, et dabit illi Dóminus Deus sedem
    David patris eius: et regnábit in domo Iacob in ætérnum, et regni eius non
    erit finis."
offertorium:
  - Regáli ex progénie María exórta refúlget; cuius præscibus nos adiuvári,
    mente et spíritu devotíssime póscimus. (Allelúia.)
secreta:
  - Accipe, quǽsumus, Dómine, múnera lætántis Ecclésiæ, et, beátæ Vírginis Maríæ
    Regínæ suffragántibus méritis, ad nostræ salútis auxílium proveníre concéde.
  - $Per Dominum
communio:
  - "@Sancti/07-16"
postcommunio:
  - "Celebrátis solémniis, Dómine, quæ pro sanctæ Maríæ Regínæ nostræ
    festivitáte (memória) perégimus: eius, quǽsumus, nobis intercessióne fiant
    salutária; in cuius honóre sunt exsultánter impléta."
  - $Per Dominum
