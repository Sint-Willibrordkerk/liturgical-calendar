lectio2:
  - "Paulínus Nolæ epíscopus, erudítus stúdiis humanitátis, doctus étiam divínis
    lítteris, multa elegánter et ornáte scripsit vérsibus et solúta oratióne.
    Hujus viri cáritas præcípue celebrátur, quod, vastáta a Gothis Campánia,
    omnem facultátem, ne relíctis quidem sibi rebus ad vitam necessáriis, in
    aléndos páuperes et captivos rediméndos contúlerit. Quo témpore, ut scribit
    sanctus Augustínus, ex opulentíssimo dívite voluntáte paupérrimus, et
    copiosíssime sanctus, captus a bárbaris sic Deum precabátur: Dómine, ne
    excrúcier propter aurum, et argéntum: ubi enim sint ómnia mea, tu scis.
    Póstea vero Wándalis eásdem regiónes infestántibus, cum ab eo pósceret
    vídua, ut fílium sibi redímeret, consúmptis rebus ómnibus in offício
    pietátis, seípsum pro illo in servitútem trádidit."
lectio3:
  - "Ígitur in Africam proféctus, dómino sui, qui regis erat gener, hortum
    coléndum suscépit. Verum cum prophetíæ dono regis mortem ipsi dómino
    prædixísset, et rex in somnis Paulínum sedéntem médium inter duos júdices,
    sibíque de mánibus eripiéntem flagéllum vidísset: tantus vir cógnitus
    honorificentíssime dimíssus est, condonátus ei ómnibus suis cívibus, qui
    captívi fúerant. Nolam revérsus ad episcopále offícium, cum verbo et exémplo
    omnes ad pietátem christiánam inflammáret, láterum dolóre corréptus est,
    cubículum in quo jacébat, terræmótu contrémuit, ac paulo post ánimam Deo
    réddidit."
  - "&teDeum"
