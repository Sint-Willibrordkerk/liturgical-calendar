oratio:
  - "Rerum cónditor Deus, qui legem labóris humáno géneri statuísti: concéde
    propítius; ut, sancti Joseph exémplo et patrocínio, ópera perficiámus quæ
    præcipis, et præmia consequámur quæ promíttis."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Colossénses.
  - "!Col. 3:14-15, 17, 23-24"
  - "Fratres: Caritátem habéte, quod est vínculum perfectiónis, et pax Christi
    exsúltet in córdibus vestris, in qua et vocáti estis in uno córpore, et
    grati estóte. Omne quodcúmque fácitis in verbo aut in ópere, ómnia in nómine
    Dómini Jesu Christi, grátias agéntes Deo et Patri per ipsum. Quodcúmque
    fácitis, ex ánimo operámini sicut Dómino, et non homínibus, sciéntes quod a
    Dómino accipiétis retributiónem hereditátis. Dómino Christo servíte."
graduale:
  - Allelúja, allelúja.
  - V. De quacúmque tribulatióne clamáverint ad me, exáudiam eos, et ero
    protéctor eórum semper. Allelúja.
  - "V. Fac nos innócuam, Joseph, decúrrere vitam: sitque tuo semper tuta
    patrocínio. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 13:54-58"
  - "In illo témpore: Véniens Jesus in pátriam suam, docébat eos in synagógis
    eórum, ita ut miraréntur et dícerent: Unde huic sapiéntia hæc et virtútes?
    Nonne hic est fabri fílius? Nonne mater ejus dícitur María, et fratres ejus
    Jacóbus et Joseph et Simon et Judas? Et soróres ejus nonne omnes apud nos
    sunt? Unde ergo huic ómnia ista? Et scandalizabántur in eo. Jesus autem
    dixit eis: Non est prophéta sine honóre nisi in pátria sua et in domo sua.
    Et non fecit ibi virtútes multas propter incredulitátem illórum."
offertorium:
  - "!Ps 89:17"
  - Bónitas Dómini Dei nostri sit super nos, et opus mánuum nostrárum secúnda
    nobis, et opus mánuum nostrárum secúnda, allelúja.
secreta:
  - Quas tibi, Dómine, de opéribus mánuum nostrárum offérimus hóstias, sancti
    Joseph interpósito suffrágio, pignus fácias nobis unitátis et pacis.
  - $Per Dominum
communio:
  - "!Matt 13:54-55"
  - Unde huic sapiéntia hæc et virtútes? Nonne hic est fabri fílius? Nonne mater
    ejus dícitur María? Allelúja.
postcommunio:
  - Hæc sancta quæ súmpsimus, Dómine, per intercessiónem beáti Joseph; et
    operatiónem nostram cómpleant, et prǽmia confírment.
  - $Per Dominum
