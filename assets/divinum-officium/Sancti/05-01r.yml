lectio1:
  - De libro Génesis
  - "!Gen 1:27-28,31; 2:1-3"
  - "27 In princípio creávit Deus hóminem ad imáginem suam; ad imáginem Dei
    creávit illum: másculum et féminam creávit eos."
  - "28 Benedixítque illis Deus, et ait: « Créscite et multiplicámini, et
    repléte terram, et subícite eam. »"
  - 31 Vidítque Deus cuncta quæ fécerat, et erant valde bona. Et factum est
    véspere et mane, dies sextus.
  - 1 Igitur perfécti sunt cæli et terra, et omnis ornátus eórum.
  - "2 Complevítque Deus die séptimo opus suum quod fécerat: et requiévit die
    séptimo ab univérso ópere quod patrárat."
  - 3 Et benedíxit diéi séptimo, et sanctificávit illum, quia in ipso cessáverat
    ab omni ópere suo, quod creávit Deus ut fáceret.
responsory1:
  - "R. Sex diébus operáberis et fácies ómnia ópera tua, séptimo autem die
    sábbatum Dómini Dei tui est:"
  - "* Non fácies omne opus in eo, allelúja."
  - V. Sex enim diébus fecit Dóminus cælum et terram, et requiévit in die
    séptimo.
  - R. Non fácies omne opus in eo, allelúja.
lectio2:
  - "!Gen 2:7-9,15"
  - 7 Formávit ígitur Dóminus Deus hóminem de limo terræ, et inspirávit in
    fáciem ejus spiráculum vitæ, et factus est homo in ánimam vivéntem.
  - 8 Plantáverat autem Dóminus Deus paradísum voluptátis a princípio, in quo
    pósuit hóminem quem formáverat.
  - 9 Produxítque Dóminus Deus de humo omne lignum pulchrum visu, et ad
    vescéndum suáve; lignum étiam vitæ in medio paradísi lignúmque sciéntiæ boni
    et mali.
  - 15 Tulit ergo Dóminus Deus hóminem, et pósuit eum in paradíso voluptátis ut
    operarétur et custodíret illum.
responsory2:
  - R. Pósuit Dóminus Deus hóminem, quem formáverat, in paradísum voluptátis,
  - "* Ut operarétur illum, allelúja."
  - V. Hæc erat condício hóminis ab inítio.
  - R. Ut operarétur illum, allelúja.
lectio3:
  - "!Gen 3:17-19,23-24"
  - "17 Dixit Dóminus Deus Adæ: Quia audísti vocem uxóris tuæ, et comedísti de
    ligno, ex quo præcéperam tibi ne coméderes, maledícta terra in ópere tuo: in
    labóribus cómedes ex ea cunctis diébus vitæ tuæ."
  - 18 Spinas et tríbulos germinábit tibi, et cómedes herbam terræ.
  - "19 In sudóre vultus tui vescéris pane, donec revertáris in terram de qua
    sumptus es: quia pulvis es, et in púlverem revertéris."
  - 23 Et emísit eum Dóminus Deus de paradíso voluptátis, ut operarétur terram
    de qua sumptus est.
  - "24 Ejecítque Adam: et collocávit ante paradísum voluptátis chérubim, et
    flámmeum gládium, atque versátilem, ad custodiéndam viam ligni vitæ."
responsory3:
  - R. Post peccátum ejécit Deus hóminem de paradíso voluptátis,
  - "* Ut in labóribus operarétur terram, allelúja."
  - V. Et in sudóre vultus tui, dixit Deus, vescéris pane.
  - R. Ut in labóribus operarétur terram, allelúja.
  - "&Gloria"
  - R. Ut in labóribus operarétur terram, allelúja.
lectio4:
  - "!Ex Actis Pii Papæ XII"
  - Ecclésia, providentíssima ómnium Mater, máximas impéndit curas ad opífices
    tutándos ac levándos, eorúndem consociatiónes instítuens iísque favens, quas
    Pius duodécimus, Póntifex Máximus, jamprídem validíssimo sancti Joseph
    patrocínio concréditas esse vóluit. Etenim sanctus Joseph, cum putatívus
    esset pater Christi, qui faber et fabri fílius appellári dignátus est,
    propter necessitúdinem qua junctus erat cum Jesu, abúnde spíritum illum
    hausit unde labor nobilitátur atque evéhitur. Consímili modo hujuscémodi
    opíficum consociatiónes adníti debent, ut Christus sit semper in ipsis
    præsens, in eórum membris horúmque famíliis, in omni dénique cœtu operário;
    síquidem præcípuus harum consociatiónum finis est, ut christiánam vitam in
    suis membris servent atque alant, Deíque regnum látius propágent, præsértim
    inter ejúsdem officínæ contubernáles.
responsory4:
  - R. Non fácies calúmniam próximo tuo, nec vi ópprimes eum;
  - "* Non morábitur opus mercenárii tui apud te usque mane, allelúja."
  - V. Dignus est enim operárius mercéde sua.
  - R. Non morábitur opus mercenárii tui apud te usque mane, allelúja.
lectio5:
  - De hac autem Ecclésiæ sollicitúdine erga cœtum operárium novum idem Póntifex
    prǽbuit arguméntum, cum occasiónem nactus opíficum convéntus caléndis majis
    anni millésimi nongentésimi quinquagésimi quinti Romæ celebráti, ingéntem
    multitúdinem in foro ad sancti Petri Basílicam coadunátam álloquens,
    opíficum institutiónem summópere commendávit. Hæc enim nostris tempóribus
    potióres sibi víndicat partes, ut opífices, christiána doctrína rite imbúti,
    grassántes circa societátis constitutiónem remque œconómicam erróres
    devítent, et morálem órdinem a Deo præstitútum, quem Ecclésia pandit atque
    interpretátur, de opíficum júribus atque offíciis, probe noscant, reíque
    geréndæ partícipes effécti, ejúsdem procuratióni efficáciter adlabórent.
    Christus enim primus in orbe promulgávit atque Ecclésiæ trádidit princípia,
    quæ ad has diriméndas quæstiónes immutabília ac validíssima perstant.
responsory5:
  - "R. Dedísti mihi protectiónem salútis tuæ et déxtera tua suscépit me:"
  - "* Protéctor meus et suscéptor meus, allelúja."
  - V. Ego protéctor tuus sum et merces tua magna nimis.
  - R. Protéctor meus et suscéptor meus, allelúja.
lectio6:
  - Quo autem humáni labóris dígnitas, et princípia quæ eándem effíciunt, áltius
    insidérent ánimis, Pius duodécimus festum sancti Joseph opíficis instítuit,
    qui omni cœ́tui operário exémplo sit ac præsídio. Ab hoc enim exémplo, qui
    operósas exércent artes díscere debent qua ratióne et quo spíritu sua múnia
    éxpleant, ut páriter primo Dei obsequéntes præcépto, terram subíciant atque
    œconómicæ prosperitáti cónsulant, ac simul ætérnæ vitæ prǽmia consequántur.
    Neque déerit próvidus Nazarethánæ Famíliæ custos sibi arte ac labóre
    cómpares suo munímine tégere eorundémque cǽlitus fortunáre domos. Aptíssime
    Summus Póntifex hoc festum celebrári jussit caléndis majis, quem diem
    operárii cœtus sibi ascivérunt; hinc enim spes affúlget fore, ut dies hic,
    sancto Joseph opífici dicátus, deínceps non ódia exácuat ac júrgia accéndat,
    sed síngulis recúrrens annis, omnes invítet ad ea magis magísque
    perficiénda, quæ cívium paci adhuc desunt, immo étiam reipúblicæ moderatóres
    exstímulet ad ea solérter absolvénda quæ consortiónis humánæ rectus
    expóstulat ordo.
responsory6:
  - R. Miser sum ego et pauper;
  - "* Dóminus sollícitus est mei, allelúja."
  - V. Labórem mánuum tuárum manducábis et bene tibi erit, allelúja.
  - R. Dóminus sollícitus est mei, allelúja.
  - "&Gloria"
  - R. Dóminus sollícitus est mei, allelúja.
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 13:54-58"
  - "In illo témpore: Véniens Jesus in pátriam suam, docébat eos in synagógis
    eórum, ita ut miraréntur et dícerent: « Unde huic sapiéntia hæc et virtútes?
    Nonne hic est fabri fílius? » Et réliqua."
  - _
  - Homilía sancti Albérti Magni Epíscopi
  - "!In Evangelium Lucæ, cap. 4"
  - "Die sábbati intrávit in synagógam, quo omnes intentióne audiéndi
    convéniunt. Et ómnium in synagóga óculi erant intendéntes in eum. Hoc tamen
    quidam devotióne, quidam curiositáte, et quidam observántes eum fecérunt, ut
    cáperent eum in sermóne. Et dicébant scribæ et pharisǽi ad pópulum, qui jam
    fidem et devotiónem concéperat: « Nonne hic est fílius Joseph? »
    Despectiónis nota est demonstrátio ejus quem nomináre non sunt dignáti.
    Fílius Joseph: minus hic dicit evangelísta quod tam a Matthǽo quam a Marco
    plénius scíverat esse pósitum: « Nonne hic est fabri fílius? Nonne hic est
    faber, fílius Maríæ? » Hæc ómnia despectíve dicta sunt."
responsory7:
  - R. Jesus erat incípiens quasi annórum trigínta,
  - "* Qui putabátur fílius Joseph, allelúja."
  - V. Faber autem erat Joseph, sponsus Vírginis Maríæ, de qua natus est
    Christus.
  - R. Qui putabátur fílius Joseph, allelúja.
lectio8:
  - "Faber lignárius dícitur fuísse Joseph, arte et usu mánuum victum quærens,
    et non in ótio et delíciis panem mandúcans, sicut scribæ et pharisǽi
    fecérunt. María étiam colo et consílio mánuum victum quærébat. Et est
    sensus: Hic despéctæ et paupérrimæ nativitátis, non potest esse Christus
    Dóminus, quem unxit Deus. Et ídeo sibi non est credéndum tam rusticáno et
    tam vili."
responsory8:
  - R. Unde huic sapiéntia hæc et virtútes?
  - "* Nonne hic est fabri fílius? Allelúja."
  - V. Ita dicébant in civitáte Názareth.
  - R. Nonne hic est fabri fílius? Allelúja.
  - "&Gloria"
  - R. Nonne hic est fabri fílius? Allelúja.
lectio9:
  - "Faber tamen erat Dóminus: quia prophéta dixit de ipso: « Tu fabricátus es
    auróram et solem. » Símilis modus despectívus est in libro Regum, ubi Saul
    promóto in regnum suum dixérunt: « Quænam res áccidit fílio Cis? Num et Saul
    inter prophétas est? » Parva ergo locútio magnum impórtat despéctum. Dóminus
    autem dixit: « Amen dico vobis, quia nemo prophéta accéptus est in pátria
    sua. » Se autem prophétam hic dicit Dóminus. Ipse enim, cui ómnia per
    divinitátem nota sunt, nullam pénitus récipit inspiratiónis revelatiónem.
    Pátriam autem suam vocat hic stricte locum conceptiónis et nutritiónis. Suis
    autem convicáneis, qui invídia incitabántur ad ipsum, non fuit accéptus."
  - "&teDeum"
