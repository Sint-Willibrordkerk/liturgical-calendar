lectio93:
  - Mennas Ægýptius, christiánus miles, in persecutióne Diocletiáni et Maximiáni
    imperatórum, cum pœniténtiæ causa in solitúdinem secessísset, natáli die
    imperatórum, quo pópulus célebri spectáculo tenebátur, in theátrum
    prosíliens, líbera voce Gentílium superstitiónem insectabátur. Quam ob rem
    comprehénsus, et, Pyrrho prǽside, in metrópoli Cottiénsium Phrýgiæ vinctus,
    loris crudéliter cœditur. Deínde, equúleo tortus, lampádibus ardéntibus ad
    corpus admótis plagísque cilício confricátis, tum per tríbulos et virgas
    férreas mánibus ac pédibus colligátis tractus, plumbátis étiam contúsus,
    demum gládio interfícitur in ignémque conjícitur. Corpus, inde a Christiánis
    eréptum, sepúltum est ac póstea Constantinópolim translátum.
