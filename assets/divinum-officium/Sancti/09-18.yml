lectio1:
  - De Epistola secunda beáti Pauli Apóstoli ad Corinthios
  - "!2 Cor 4:6-11"
  - 6 Deus, qui dixit de ténebris lucem splendéscere, ipse illuxit in córdibus
    nostris ad illuminatiónem sciéntiæ claritátis Dei in fácie Christi Jesu.
  - 7 Habémus autem thesáurum istum in vasis fictílibus, ut sublimitas sit
    virtútis Dei et non ex nobis.
  - 8 In ómnibus tribulatiónem patimur, sed non angustiámur; aporiamur, sed non
    destitúimur;
  - 9 persecutiónem patimur, sed non derelínquimur; dejícimur, sed non perímus;
  - 10 semper mortificatiónem Jesu in corpore nostro circumferéntes, ut et vita
    Jesu manisfestétur in corpóribus nostris.
  - 11 Semper enim nos, qui vívimus, in mortem trádimur propter Jesum, ut et
    vita Jesu manifestétur in carne nostra mortali.
lectio2:
  - "!2 Cor 5:1-8"
  - 1 Scimus enim quóniam si terrestris domus nostra hujus habitatiónis
    dissolvátur, quod ædificatiónem ex Deo habemus, domum non manufactam,
    ætérnam in cælis.
  - "2 Nam et in hoc ingemíscimus, habitatiónem nostram, quæ de cælo est,
    superíndui cupiéntes:"
  - 3 si tamen vestiti, non nudi inveniámur.
  - "4 Nam et qui sumus in hoc tabernáculo, ingemíscimus graváti: eo quod
    nólumus exspoliári, sed supervestiri, ut absorbeátur quod mortale est, a
    vita."
  - 5 Qui autem efficit nos in hoc ipsum, Deus, qui dedit nobis pignus spíritus.
  - "6 Audéntes ígitur semper, sciéntes quóniam dum sumus in corpore,
    peregrinámur a Dómino:"
  - 7 (per fidem enim ambulámus et non per spéciem)
  - 8 audémus autem, et bonam voluntátem habémus magis peregrinari a corpore, et
    præséntes esse ad Dóminum.
lectio3:
  - "!2 Cor 12:1-9"
  - 1 Si gloriari oportet (non éxpedit quidem) véniam autem ad visiónes, et
    revelatiónes Dómini.
  - 2 Scio hóminem in Christo ante annos quatuordecim (sive in corpore nescio,
    sive extra corpus nescio, Deus scit:) raptum hujusmodi usque ad tertium
    cælum.
  - 3 Et scio hujusmodi hóminem, (sive in corpore, sive extra corpus, nescio,
    Deus scit:)
  - "4 quóniam raptus est in paradisum: et audívit arcana verba, quæ non licet
    hómini loqui."
  - "5 Pro hujusmodi gloriábor: pro me autem nihil gloriábor nisi in
    infirmitátibus meis."
  - "6 Nam, et si volúero gloriari, non ero insípiens: veritátem enim dicam:
    parco autem, ne quis me exsistimet supra id, quod videt in me, aut aliquid
    audit ex me."
  - 7 Et ne magnitúdo revelatiónum extollat me, datus est mihi stímulus carnis
    meæ angelus sátanæ, qui me colaphízet.
  - "8 Propter quod ter Dóminum rogávi, ut discederet a me:"
  - "9 et dixit mihi: Sufficit tibi grátia mea: nam virtus in infirmitáte
    perfícitur. Libenter ígitur gloriábor in infirmitátibus meis, ut inhábitet
    in me virtus Christi."
lectio4:
  - Josephus a Cupertino, oppido in Salentinis diœcesis Neritonénsis, anno
    reparátæ salútis millesimo sexcentésimo tertio, piis ibidem paréntibus
    ortus, Deique amóre præventus, puerítiam atque adolescéntiam summa cum
    simplicitate morúmque innocéntia molestoque morbo, patientíssime tolerato,
    Deiparæ Vírginis ope liberatus, se totum pietátis opéribus ac excoléndis
    virtútibus dedit; utque Deo ad majora vocanti se intimius conjungeret,
    ordini seraphico nomen dare constítuit. Post varios eventus voti tandem
    compos factus, apud Minores Conventuales in cœnobio Cryptulæ, inter laicos
    primum ob litterárum imperítiam, deínde inter clericos divina dispositióne
    connumerátus est. Sacerdotio post solemnia vota initiatus, perfectius sibi
    vitæ institutum propósuit. Quam ob rem, mundanis quibuscúmque afféctibus
    terrenisque rebus pene ad vitam necessariis illico a se abdicatis, ciliciis,
    flagellis, catenis, omni demum asperitátum ac pœnárum genere corpus
    afflixit; spíritum vero sanctæ oratiónis altissimǽque contemplatiónis
    assiduitate dulciter enutrívit. Hinc factum est, ut caritas Dei, quæ jam
    erat in ejus corde a prima ætate diffúsa, miro planeque singulari modo in
    dies coruscáverit.
lectio5:
  - Eluxit præcipue ardentíssima ejus caritas in extasibus ad Deum suavíssimis
    stupendisque raptibus, quibus frequenter afficiebátur. Mirum autem, quod,
    alienato a sensibus animo, statim ab éxtasi eum revocábat sola obediéntia.
    Hanc quippe virtútem exímio studio prosequebátur, dicere sólitus, se ab ea
    véluti cæcum circumduci, et mori potius velle, quam non obedire. Paupertátem
    vero seraphici Patriárchæ ita æmulátus est, ut, morti próximus, prælato suo
    assérere vere potúerit se nihil habere, quod more religiosórum resignaret.
    Itaque, mundo sibique mórtuus, vitam Jesu manifestábat in carne sua, quæ dum
    in aliquibus ex turpitúdine obscœnum flagitium sentiebat, prodigiósum de se
    efflábat odórem, indícium nitidíssimæ illíus puritátis, quam, immundo
    spíritu vehementíssimis tentatiónibus frustra obnubilare diu conante,
    servávit illæsam, tum arcta sensuum custódia, tum jugi corporis maceratióne,
    tum denique speciali protectióne puríssimæ Vírginis Maríæ, quam matrem suam
    appellare consuevit, ac véluti matrem dulcíssimam íntimo cordis afféctu
    venerabátur, eamque ab aliis venerari exoptabat, ut cum ejusdem patrocinio,
    sicut ipse ajebat, ómnia bona consequerentur.
lectio6:
  - Hæc beáti Josephi sollicitúdo a sua erga próximos caritate prodíbat; tanto
    enim animárum zelo exardebat, ut ómnium salútem modis ómnibus instantíssime
    procuraret. Exténdens páriter caritátem suam in próximum, sive páuperem,
    sive infirmum, sive quacúmque alia tribulatióne vexátum, quantum in ipso
    erat, illum recreábat. Nec aliéni erant ab ejus caritate, qui
    objurgatiónibus, probris omnisque generis injuriis ipsum appéterent; nam
    eadem patiéntia, mansuetúdine, vultusque hilaritate talia excipiebat, qua
    tot inter ac tantas vicissitúdines replenduit, dum vel moderatórum ordinis
    vel sacræ Inquisitiónis jussu hac illac errare versaríque coactus est.
    Quamquam vero pópuli non solum, sed viri príncipes exímiam ejus sanctitátem
    et superna charísmata admiraréntur, ea nihilóminus erat humilitate, ut,
    magnum se peccatórem réputans, Deum enixe deprecarétur; ut sua ab eo
    illustria dona removéret, hómines vero exoraret ut in eum locum mortuum ejus
    corpus injícerent, ubi memória sui esset prorsus oblitterata. At Deus, qui
    ponit húmiles in sublíme quique servum suum, dum viveret, cælésti sapiéntia,
    prophetía, cordium perscrutatióne, curatiónum grátia ceterisque donis
    cumulatíssime exornaverat, ejus quoque mortem iis, quibus ipse antea
    prædixerat, loco ac témpore, anno ætátis suæ sexagesimo primo, Auxími in
    Piceno pretiósam réddidit sepulcrúmque gloriosum. Illum denique, étiam post
    óbitum miraculis coruscántem, Benedíctus quartus décimus Beatórum, Clemens
    tertius décimus Sanctórum fastis adscripsit. Ejus autem Offícium et Missam
    Clemens quartus décimus, ejusdem ordinis, ad universam Ecclésiam extendit.
lectio94:
  - Joséphus a Cupertíno, piis paréntibus ortus, adoléscens castis móribus
    insígnis, apud Minóres Conventuáles in cœnóbio Crýptulæ inter láicos primum,
    ob litterárum imperítiam, deínde inter cléricos divína dispositióne
    connumerátus est. Sacerdótio initiátus, cilíciis, flagéllis omníque
    asperitátum génere corpus afflíxit; spíritum vero sanctæ oratiónis assíduo
    pábulo enutrívit, quo factum est, ut ad altíssimæ contemplatiónis gradum a
    Deo vocátus sit. Obediéntia et paupertáte insígnis, castitátem summópere
    cóluit, eámque, magnis tentatiónibus devíctis, servávit illǽsam. Mira
    dilectióne Vírginem Maríam prosecútus est, et magna caritáte in páuperes
    resplénduit. Tanta erat humilitáte, ut, magnum peccatórem se réputans, Deum
    eníxe deprecarétur, ut sua ab eo illústria dona removéret. Ordinis
    moderatórum vel sacræ Inquisitiónis jussu multas peragrávit regiónes; demum,
    Auxími in Picéno, anno ætátis suæ sexagésimo primo, ad cælum evolávit.
  - "&teDeum"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 22:1-14"
  - "In illo témpore: Loquebátur Jesus princípibus sacerdotum et pharisæis in
    parábolis dicens: Simile factum est regnum cælórum hómini regi, qui fecit
    nuptias fílio suo. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Liber 2 Homiliar. Hom. 38, circa medium"
  - "Quia jam, largiénte Dómino, nuptiárum domum, id est, sanctam Ecclésiam
    intrastis, solerter, fratres, aspicite, ne aliquid de mentis vestræ habitu
    rex ingrédiens reprehéndat. Cum magno enim cordis timóre pensándum est quod
    prótinus subditur: Intrávit autem rex, ut vidéret discumbéntes, et vidit ibi
    hóminem non vestítum veste nuptiali. Quid, fratres caríssimi, éxprimi per
    nuptialem vestem putamus? Si enim vestem nuptialem baptisma vel fidem
    dicimus, quis sine baptismate et fide has nuptias intrávit? Eo enim ipso
    foris est, qui necdum credidit. Quid ergo debémus intellígere per nuptialem
    vestem, nisi caritátem? Intrat enim ad nuptias, sed cum nuptiali veste non
    intrat, qui, in sancta Ecclésia assistens, fidem habet, sed caritátem non
    habet. Recte enim caritas, nuptialis vestis vocátur, quia hanc in se
    conditor noster hábuit, dum ad sociandæ sibi Ecclésiæ nuptias venit."
lectio8:
  - "Sola quippe dilectióne Dei actum est, ut ejus Unigénitus mentes sibi
    electórum hóminum uníret. Unde et Joánnes dicit: Sic enim diléxit Deus
    mundum, ut Fílium suum unigénitum daret pro nobis. Qui ergo per caritátem
    venit ad hómines, eamdem caritátem innotuit vestem esse nuptialem. Omnis
    ergo vestrum, qui in Ecclésia positus Deo credidit, jam ad nuptias intrávit;
    sed cum nuptiali veste non venit, si caritátis grátiam non custódit. Et
    certe, fratres, si quis ad carnales nuptias esset invitatus, vestem mutaret,
    congaudere se sponso et sponsæ ex ipso sui habitus decore osténderet, inter
    gaudéntes et festa celebrántes despectis vestibus apparére erubésceret. Nos
    ad Dei nuptias venímus, et cordis vestem mutare dissimulamus. Congaudent
    Angeli, cum ad cælum assumúntur electi. Qua ergo mente hæc spiritualia festa
    conspícimus, qui nuptialem vestem, id est, caritátem, quæ sola nos speciósos
    éxhibet, non habemus?"
lectio9:
  - "Sciéndum vero est quia, sicut in duobus lignis, superiore vidélicet et
    inferióre, vestis téxitur: ita in duobus præceptis caritas habétur, in
    dilectióne scilicet Dei et próximi. Scriptum quippe est: Diliges Dóminum
    Deum tuum ex toto corde tuo et ex tota ánima tua, et próximum tuum sicut
    teípsum. Qua in re notándum est, quia in dilectióne próximi mensúra amoris
    pónitur, cum dícitur: Diliges próximum tuum sicut teípsum. Dei autem
    diléctio nulla mensúra constringitur, cum dícitur: Diliges Dóminum Deum tuum
    ex toto corde tuo, ex tota ánima tua, ex tota virtúte tua. Non enim jubétur
    quisque quantum diligat, sed ex quanto, cum dícitur, Ex toto; quia ille
    veraciter Deum díligit, qui sibi de se nihil relinquit. Duo ergo necesse est
    ut caritátis præcepta custódiat, quisquis habere in nuptiis vestem nuptialem
    curat."
  - "&teDeum"
