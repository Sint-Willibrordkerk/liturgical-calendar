name:
  - Valentini
oratio:
  - "Præsta, quǽsumus, omnípotens Deus: ut, qui beáti Valentíni Mártyris tui
    natalítia cólimus, a cunctis malis imminéntibus, ejus intercessióne,
    liberémur."
  - $Per Dominum
secreta:
  - "Súscipe, quǽsumus, Dómine, múnera dignánter obláta: et, beáti Valentini
    Mártyris tui suffragántibus méritis, ad nostræ salútis auxílium proveníre
    concéde."
  - $Per Dominum
postcommunio:
  - "Sit nobis, Dómine, reparátio mentis et córporis cœléste mystérium: ut,
    cujus exséquimur actiónem, intercedénte beáto Valentíno Mártyre tuo,
    sentiámus efféctum."
  - $Per Dominum
lectio93:
