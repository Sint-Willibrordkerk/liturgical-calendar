lectio93:
  - Pudentiana virgo, Pudentis Romani filia, parentibus orbata, cum admirabili
    pietate christianam religionem coleret, una cum sorore Praxede pecuniam ex
    vendito patrimonio redactam pauperibus distribuit, seque jejuniis et
    orationibus dedit. Cujus étiam opera, tota ejus familia, in qua erant
    nonaginta sex homines, a Pio Pontifice baptizata est. Quod autem ab Antonino
    imperatore sancitum erat, ne Christiani publice sacrificia facerent, Pius
    Pontifex in sedibus Pudentianæ cum Christianis sacra celebrabat. Quibus illa
    benigne acceptis, quæ ad vitam necessaria essent, suppeditabat Itaque in his
    christianæ pietatis officiis migravit e vita, et in sepulcro patris ad
    cemeterium Priscillæ via Salaria sepulta est, decimo quarto Kalendas Junii.
  - "&teDeum"
