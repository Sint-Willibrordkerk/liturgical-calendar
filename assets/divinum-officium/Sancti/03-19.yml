  - "@Sancti/12-24:Lectio1"
responsory7:
  - "R. Dicit Mater Jesu ad illum: Fili, quid fecísti nobis sic?"
  - "* Ecce pater tuus et ego doléntes quærebámus te."
  - "V. Et ait ad illos: Quid est, quod me quærebátis? nesciebátis, quia in his
    quæ Patris mei sunt, opórtet me esse?"
  - R. Ecce pater tuus et ego doléntes quærebámus te.
