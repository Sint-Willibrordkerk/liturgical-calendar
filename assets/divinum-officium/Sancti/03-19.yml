  - R. Pro salúte enim vestra misit me Deus ante vos in Ægýptum.
lectio4:
  - Sermo sancti Bernárdi Abbátis
  - "!Homil. 2 super Missus est, prope finem"
  - Quis et qualis homo fúerit beátus Joseph, cónice ex appellatióne, qua, licet
    dispensatória, méruit honorári ádeo, ut pater Dei et dictus et créditus sit;
    cónice et ex próprio vocábulo, quod augméntum non dúbitas interpretári.
    Simul et meménto magni illíus quondam Patriárchæ vénditi in Ægýpto; et scito
    ipsíus istum non solum vocábulum fuísse sortítum, sed et castimóniam
    adéptum, innocéntiam assecútum et grátiam.
responsory4:
  - "R. Ascéndit Joseph a Galilǽa de civitáte Názareth in Judǽam, in civitátem
    David, quæ vocátur Béthlehem:"
  - "* Eo quod esset de domo et família David."
  - V. Ut profiterétur cum María desponsáta sibi uxóre.
  - R. Eo quod esset de domo et família David.
lectio5:
  - "Síquidem ille Joseph, fratérna ex invídia vénditus et ductus in Ægýptum,
    Christi venditiónem præfigurávit: iste Joseph, Herodiánam invídiam fúgiens,
    Christum in Ægýptum portávit. Ille dómino suo fidem servans, dóminæ nóluit
    commiscéri: iste Dóminam suam, Dómini sui matrem, vírginem agnóscens et ipse
    cóntinens, fidéliter custodívit. Illi data est intellegéntia in mystériis
    somniórum: isti datum est cónscium fíeri atque partícipem cæléstium
    sacramentórum."
responsory5:
  - R. Surge, et áccipe Púerum et Matrem ejus, et fuge in Ægýptum;
  - "* Et esto ibi, usque dum dicam tibi."
  - "V. Ut adimplerétur quod dictum est a Dómino per prophétam dicéntem: Ex
    Ægýpto vocávi Fílium meum."
  - R. Et esto ibi, usque dum dicam tibi.
lectio6:
  - "Ille fruménta servávit non sibi, sed omni pópulo: iste Panem vivum e cælo
    servándum accépit tam sibi quam toti mundo. Non est dúbium, quin bonus et
    fidélis homo fúerit iste Joseph, cui Mater desponsáta est Salvatóris.
    Fidélis, inquam, servus, et prudens, quem constítuit Dóminus suæ Matris
    solátium, suæ carnis nutrítium, solum dénique in terris magni consílii
    coadjutórem fidelíssimum."
responsory6:
  - R. Cum indúcerent púerum Jesum paréntes ejus, ut fácerent secúndum
    consuetúdinem legis pro eo,
  - "* Accépit eum Símeon in ulnas suas, et benedíxit Deum."
  - V. Et erat Pater ejus et Mater mirántes super his, quæ dicebántur de illo.
  - R. Accépit eum Símeon in ulnas suas, et benedíxit Deum.
  - "&Gloria"
  - R. Accépit eum Símeon in ulnas suas, et benedíxit Deum.
