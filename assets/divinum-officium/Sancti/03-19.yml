graduale:
  - "!Ps 20:4-5"
  - "Dómine, prævenísti eum in benedictiónibus dulcédinis: posuísti in cápite
    ejus corónam de lápide pretióso."
  - V. Vitam pétiit a te, et tribuísti ei longitúdinem diérum in sǽculum sǽculi.
  - _
  - "!Tractus"
  - "!Ps 111:1-3"
  - "Beátus vir, qui timet Dóminum: in mandátis ejus cupit nimis."
  - "V. Potens in terra erit semen ejus: generátio rectórum benedicétur."
  - "V. Glória et divítiæ in domo ejus: et justítia ejus manet in sǽculum
    sǽculi."
