rubrica-cisterciensis/responsory-vespera-1:
  - "Responsorium. Fecit me Dóminus quasi patrem regis, et Dóminum univérsæ
    domus ejus: nolíte pavére: * Pro salúte enim vestra misit me Deus ante vos
    in Ægyptum. Allelúia."
  - V. Veníte ad me, et ego dabo vobis ómnia bona Ægypti, et comedétis medúllam
    terræ.
  - R. Pro salúte enim vestra misit me Deus ante vos in Ægyptum. Allelúia.
