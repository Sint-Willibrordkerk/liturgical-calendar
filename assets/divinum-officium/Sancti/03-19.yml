lectio1:
  - De libro Génesis
  - "!Gen 39:1-5"
  - 1 Joseph ígitur ductus est in Ægýptum, emítque eum Putíphar eunúchus
    Pharaónis, princeps exércitus, vir Ægýptius, de manu Ismaelitárum, a quibus
    perdúctus erat.
  - "2 Fuítque Dóminus cum eo, et erat vir in cunctis próspere agens:
    habitavítque in domo dómini sui,"
  - 3 qui óptime nóverat Dóminum esse cum eo, et ómnia, quæ gerébat, ab eo
    dírigi in manu illíus.
  - "4 Invenítque Joseph grátiam coram dómino suo, et ministrábat ei: a quo
    præpósitus ómnibus gubernábat créditam sibi domum, et univérsa quæ ei
    trádita fúerant:"
  - 5 benedixítque Dóminus dómui Ægýptii propter Joseph.
responsory1:
  - "R. Fuit Dóminus cum Joseph, et dedit ei grátiam in conspéctu príncipis
    cárceris:"
  - "* Qui trádidit in manu illíus univérsos vinctos."
  - "V. Quidquid fiébat, sub ipso erat: Dóminus enim erat cum illo, et ómnia
    ópera ejus dirigébat."
  - R. Qui trádidit in manu illíus univérsos vinctos.
lectio2:
  - "!Gen 41:37-40"
  - "37 Plácuit Pharaóni consílium et cunctis minístris ejus:"
  - "38 locutúsque est ad eos: Num inveníre potérimus talem virum, qui spíritu
    Dei plenus sit?"
  - "39 Dixit ergo ad Joseph: Quia osténdit tibi Deus ómnia quæ locútus es,
    numquid sapientiórem et consímilem tui inveníre pótero?"
  - "40 Tu eris super domum meam, et ad tui oris impérium cunctus pópulus
    obédiet: uno tantum regni sólio te præcédam."
responsory2:
  - "R. Esuriénte terra Ægýpti, clamávit pópulus ad regem, aliménta petens.
    Quibus ille respóndit:"
  - "* Ite ad Joseph, et quidquid vobis díxerit, fácite."
  - V. Crescébat cotídie fames in omni terra, aperuítque Joseph univérsa hórrea,
    et vendébat Ægýptiis.
  - R. Ite ad Joseph, et quidquid vobis díxerit, fácite.
lectio3:
  - "!Gen 41:41-44"
  - "41 Dixítque rursus Phárao ad Joseph: Ecce, constítui te super univérsam
    terram Ægýpti."
  - "42 Tulítque ánnulum de manu sua, et dedit eum in manu ejus: vestivítque eum
    stola býssina, et collo torquem áuream circumpósuit."
  - 43 Fecítque eum ascéndere super currum suum secúndum, clamánte præcóne, ut
    omnes coram eo genu flécterent, et præpósitum esse scirent univérsæ terræ
    Ægýpti.
  - "44 Dixit quoque rex ad Joseph: Ego sum Phárao: absque tuo império non
    movébit quisquam manum aut pedem in omni terra Ægýpti."
responsory3:
  - "R. Fecit me Dóminus quasi patrem regis, et dóminum univérsæ domus ejus:
