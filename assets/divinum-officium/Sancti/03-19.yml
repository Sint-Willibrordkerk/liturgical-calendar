oratio:
  - "Sanctíssimæ Genetrícis tuæ Sponsi, quǽsumus, Dómine, méritis adjuvémur: ut,
    quod possibílitas nostra non óbtinet, ejus nobis intercessióne donétur:"
  - $Qui vivis
