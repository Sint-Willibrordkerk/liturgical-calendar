  - "Justus germinábit sicut lílium: et florébit in ætérnum ante Dóminum.
    Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 1:18-21"
  - "Cum esset desponsáta Mater Jesu María Joseph, ántequam convenírent, invénta
    est in útero habens de Spíritu Sancto. Joseph autem, vir ejus, cum esset
    justus et nollet eam tradúcere, vóluit occúlte dimíttere eam. Hæc autem eo
    cogitánte, ecce, Angelus Dómini appáruit in somnis ei, dicens: Joseph, fili
    David, noli timére accípere Maríam cónjugem tuam: quod enim in ea natum est,
    de Spíritu Sancto est. Páriet autem fílium, et vocábis nomen ejus Jesum:
    ipse enim salvum fáciet pópulum suum a peccátis eórum."
offertorium:
  - "@Commune/C2"
secreta:
  - "Débitum tibi, Dómine, nostræ réddimus servitútis, supplíciter exorántes:
    ut, suffrágiis beáti Joseph, Sponsi Genetrícis Fílii tui Jesu Christi,
    Dómini nostri, in nobis tua múnera tueáris, ob cujus venerándam festivitátem
    laudis tibi hóstias immolámus."
  - $Per eundem
communio:
  - "!Matt 1:20"
  - "Joseph, fili David, noli timére accípere Maríam cónjugem tuam: quod enim in
    ea natum est, de Spíritu Sancto est. (Allelúja.)"
postcommunio:
  - "Adésto nobis, quǽsumus, miséricors Deus: et, intercedénte pro nobis beáto
    Joseph Confessóre, tua circa nos propitiátus dona custódi."
  - $Per Dominum
