oratio:
  - "Sanctórum tuórum nos, Dómine, Nazárii, Celsi, Victóris et Innocéntii
    conféssio beáta commúniat: et fragilitáti nostræ subsídium dignánter
    exóret."
  - $Per Dominum
lectio:
  - Léctio libri Sapiéntiæ
  - "!Sap 10:17-20"
  - "Réddidit Deus justis mercédem labórum suorum, et deduxit illos in via
    mirábili: et fuit illis in velaménto diei et in luce stellárum per noctem:
    tránstulit illos per Mare Rubrum, et transvéxit illos per aquam nímiam.
    Inimícos autem illórum demérsit in mare, et ab altitúdine inferórum edúxit
    illos. Ideo justi tulérunt spolia impiórum, et decantavérunt, Dómine, nomen
    sanctum tuum, et victrícem manum tuam laudavérunt páriter, Dómine, Deus
    noster."
graduale:
  - "!Exodi 15:11"
  - "Gloriósus Deus in Sanctis suis: mirábilis in majestáte, fáciens prodígia."
  - "!Exodi 15:6"
  - "V. Déxtera tua, Dómine, glorificáta est in virtúte: déxtera manus tua
    confrégit inimícos."
  - Allelúja, allelúja.
  - "!Sir 44:14"
  - V. Córpora Sanctórum in pace sepúlta sunt, et nómina eórum vivent in
    generatiónem et generatiónem. Allelúja.
offertorium:
  - "@Commune/C3"
secreta:
  - "Concéde nobis, omnípotens Deus: ut his munéribus, quæ in sanctórum tuórum
    Nazarii, Celsi, Victóris et Innocéntii honóre deférimus, et te placémus
    exhíbitis, et nos vivificémur accéptis."
  - $Per Dominum
communio:
  - "@Commune/C3"
postcommunio:
  - "Sanctórum Nazárii, Celsi, Victóris et Innocéntii, Dómine, intercessióne
    placátus: præsta, quǽsumus; ut, quod temporáli celebrámus actióne, perpétua
    salvatióne capiámus."
  - $Per Dominum
