lectio4:
  - "Nazarius, a beato Lino papa baptizatus, cum in Gálliam profectus esset, ibi
    Celsum púerum, a se christiánis præceptis prius instructum, baptizávit. Qui
    una Trévirim euntes, Nerónis persecutióne, in mare uterque dejícitur, unde
    mirabíliter evasérunt. Postea Mediolanum veniéntes, cum ibi Christi fidem
    disseminárent, ab Anolino præfecto, constantíssime Christum Deum
    confiténtes, cápite plectúntur: quorum córpora extra portam Romanam sepúlta
    sunt. Quæ cum diu latuíssent, Dei mónitu a beato Ambrosio conspersa recénti
    sánguine sunt invénta, tamquam si paulo ante martyrium passi essent; unde,
    in urbem translata, honorifico sepúlcro contecta sunt."
lectio5:
  - "Victor in Africa natus, Sevéro imperatóre rexit Ecclésiam. Confirmávit
    decretum Pii primi, ut sacrum Pascha die Dominico celebrarétur: qui ritus ut
    póstea in mores inducerétur, habita sunt multis in locis concília; et in
    Nicæna dénique prima synodo sancítum est, ut Paschæ dies festus post quartam
    décimam lunam agerétur, ne Christiáni Judæos imitari videréntur. Státuit ut
    quavis aqua, modo naturali, si necessitas cógeret, quicúmque baptizari
    posset. Theódotum Coriárium Byzantinum, docéntem Christum tantummodo hóminem
    fuísse, ejécit ex Ecclésia. Scripsit de quæstióne Paschæ et alia quædam
    opúscula. Creávit duabus ordinatiónibus, mense Decembri, presbyteros
    quatuor, diaconos septem, episcopos per diversa loca duodecim. Martyrio
    coronátus, sepelítur in Vaticano, quinto Kalendas Augusti. Sedit annos
    novem, mensem unum, dies viginti octo."
lectio6:
  - "Innocentius Albanénsis, sancti Hierónymi et Augustíni ætate flóruit. De quo
    ille ad Demetríadem vírginem: Sancti Innocentii, qui apostolicæ cathedræ et
    beátæ memóriæ Anastasii successor et fílius est, teneas fidem nec
    peregrinam, quamvis tibi prudens callídaque videaris, doctrinam recipias.
    Eum, tamquam justum Lot subtractum Dei providéntia, ad Ravennam servátum
    fuísse, scribit Orósius, ne Romani pópuli vidéret excidium. Is, Pelagio et
    Cælestio damnatis, contra eórum hæresim decretum fecit, ut párvuli, ex
    christiana étiam mulíere nati, per baptismum renasci debérent; ut in eis
    regeneratióne mundétur, quod generatióne contraxérunt. Probávit etiam, ut
    Sábbato, ob memóriam Christi Dómini sepultúræ jejunium servarétur. Sedit
    annos quíndecim, mensem unum, dies decem. Quatuor ordinatiónibus, mense
    Decembri, creávit presbyteros trigínta, diaconos quíndecim, episcopos per
    diversa loca quinquagínta quatuor. Sepultus est in cœmeterio ad Ursum
    pileátum."
lectio94:
  - Nazárius, a beáto Lino Papa baptizátus, cum in Gálliam proféctus esset, ibi
    Celsum púerum, a se christiánis præcéptis prius instrúctum, baptizávit.
    Póstea Mediolánum ambo veniéntes, cum ibi Christi fidem disseminárent, ab
    Anolíno præfécto, constantíssime Christum Deum confiténtes, cápite
    plectúntur; quorum córpora a beáto Ambrósio invénta sunt. In eúndem diem
    íncidit memória sancti Victóris Papæ, qui Sevéro imperatóre rexit Ecclésiam,
    Theódotum Coriárium confutávit, scripsítque de quæstióne Paschæ. Martýrio
    coronátus, sepúltus est in Vaticáno quinto Caléndas Augústi. Eódem étiam die
    recólitur sanctus Innocéntius Papa, qui, Pelágio et Cæléstio damnátis,
    contra eórum hǽresim decrétum fecit. Cujus corpus sepúltum est in cœmetério
    ad Ursum pileátum.
  - "&teDeum"
