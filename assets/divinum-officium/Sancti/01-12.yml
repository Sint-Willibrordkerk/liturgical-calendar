lectio4:
  - Sermo sancti Leónis Papæ
  - "!Sermo 4 de Epiphania"
  - Justum et rationábile, dilectíssimi, veræ pietátis obséquium est in diébus,
    qui divínæ misericórdiæ ópera protestántur, toto corde gaudére, et
    honorífice ea, quæ ad salútem nostram gesta sunt, celebráre, vocánte nos ad
    hanc devotiónem ipsa recurréntium témporum lege, quæ nobis post diem, in quo
    coætérnus Patri Fílius Dei natus ex Vírgine est, brevi intervállo Epiphaníæ
    íntulit festum, ex apparitióne Dómini consecrátum.
lectio5:
  - "In quo fídei nostræ magnum præsídium providéntia divína constítuit: ut, dum
    solémni veneratióne recólitur adoráta in exórdiis suis Salvatóris infántia,
    per ipsa originália documénta probarétur veri hóminis in ipso orta natúra.
    Hoc enim est quod justíficat ímpios, hoc est quod ex peccatóribus facit
    sanctos, si in uno eodémque Dómino nostro Jesu Christo et vera Déitas, et
    vera credátur humánitas: Déitas, qua ante ómnia sæcula in forma Dei æquális
    est Patri: humánitas, qua novíssimis diébus in forma servi unítus est
    hómini."
lectio6:
  - Ad roborándam ergo hanc fidem, quæ contra omnes præmuniebátur erróres, ex
    magna gestum est divíni pietáte consílii ut gens in longínqua Orientális
    plagæ regióne consístens, quæ spectandórum síderum arte pollébat, signum
    nati púeri, qui supra omnem Israël esset regnatúrus, accíperet. Nova étenim
    cláritas apud Magos stellæ illustrióris appáruit, et intuéntium ánimos ita
    admiratióne sui splendóris implévit, ut nequáquam sibi créderent
    negligéndum, quod tanto nuntiabátur indício.
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 2:1-12"
  - "Cum natus esset Jesus in Béthlehem Juda in diébus Heródis regis, ecce Magi
    ab Oriénte venérunt Jerosólymam, dicéntes: Ubi est qui natus est Rex
    Judæórum? Et réliqua."
  - _
  - De Homilía sancti Joánnis Chrysóstomi
  - "!Homilia 8, in Matth. n. 1"
  - "Magi, intrántes domum, vidérunt púerum cum María, matre ejus. Et
    procidéntes adoravérunt eum; et, apértis thesáuris, obtulérunt ei múnera,
    aurum, thus et myrrham. Verum quid illos ad púerum adorándum indúxit? Neque
    enim Virgo insígne quídpiam præ se ferébat, neque domus magnífica erat,
    neque istic áliquid áliud erat quod posset illos vel percéllere vel
    allícere. Illi vero non modo adórant, sed, apértis thesáuris suis, múnera
    ófferunt, múnera, inquam, non quasi hómini, sed quasi Deo. Thus enim et
    myrrha máxime Dei symbolum erat. Quid ígitur hoc illis suásit? Idípsum quod
    excitávit illos, ut, relícta domo, tantum iter suscíperent: nimírum stella
    et illustrátio mentis a Deo ipsis índita, quæ paulátim illos ad perfectiórem
    notítiam dedúxit."
lectio8:
  - Nisi enim res ita se habéret, cum ómnia quæ istic videbántur, vília essent,
    non ei tantum exhibuíssent honórem. Ideo autem nihil eórum, quæ sub sensum
    cadunt, ibi magnum erat, sed præsépe, tugúrium, mater inops; ut nudam
    Magórum philosophíam perspícias, atque discas, eos non ut hóminem purum, sed
    ut Deum, et ipsum benéficum, adivísse. Quaprópter nullo eórum quæ
    extrínsecus videbántur, offénsi sunt, sed adorárunt; et dona obtulérunt, quæ
    dona multum a Judáica crassítie differébant. Neque enim oves et vítulos
    immolárunt, sed quæ ecclesiásticæ philosophíæ vicína erant; síquidem
    sciéntiam, obediéntiam et dilectiónem ipsi offerébant.
lectio9:
  - "Et, respónso accépto in somnis, ne redírent ad Heródem, per áliam viam
    revérsi sunt in regiónem suam. Hic mihi vide fidem ipsórum, quómodo non
    offendántur, sed sint quiéti et obtemperántes, neque turbéntur, neque tália
    mútuo loquántur: Sane, si magnus hic puer est, et si quam habet poténtiam,
    quid opus fuga et occúlto discéssu? cur vero nos, qui palam et cum fidúcia
    accéssimus ad pópulum tantum, et coram furénte rege stétimus, quasi
    fugitívos ex civitáte dimíttit Angelus? At nihil tale vel dixérunt vel
    cogitárunt. Illud enim máxime ad fidem pértinet, ut nulla mandatórum
    exquirátur rátio, sed jussis tantum obediátur."
  - "&teDeum"
