lectio4:
  - Dominicus, Calarógæ in Hispánia ex nobili Gusmanórum família natus, Paléntiæ
    liberálibus disciplinis et theologíæ operam dedit; quo in studio cum
    plurimum profecísset, prius Oxoménsis ecclésiæ canonicus regularis, deínde
    ordinis fratrum Prædicatórum auctor fuit. Hujus mater grávida sibi visa est,
    in quiete, continére in alvo cátulum ore præferentem facem, qua, éditus in
    lucem, orbem terrárum incenderet. Quo somnio significabátur fore ut,
    splendore sanctitátis ac doctrinæ, gentes ad christianam pietátem
    inflammaréntur. Veritátem éxitus comprobávit; id enim et præstitit per se,
    et per sui ordinis socios deinceps est consecutus.
lectio5:
  - Hujus autem ingenium ac virtus maxime enituit in everténdis hæreticis, qui
    perniciosis erróribus Tolosátes pervertere conabántur; quo in negótio septem
    consumpsit annos. Postea Romam venit ad Lateranense concílium cum episcopo
    Tolosano, ut ordo, quem institúerat, ab Innocentio tertio confirmarétur. Quæ
    res dum in deliberatióne versatur. Dominicus hortatu Pontificis ad suos
    revértitur, ut sibi regulam delígeret. Romam rédiens, ab Honorio tertio, qui
    próximus Innocentio successerat, confirmatiónem ordinis Prædicatórum
    ímpetrat. Romæ autem duo instituit monasteria, álterum virórum, mulíerum
    álterum. Tres étiam mórtuos ad vitam revocávit, múltaque alia edidit
    miracula, quibus ordo Prædicatórum mirifice propagari cœpit.
lectio6:
  - Verum, cum ejus ópera ubíque terrárum monasteria jam ædificaréntur,
    innumerabilésque hómines religiosam ac piam vitam institúerent, Bononiæ anno
    Christi ducentésimo vigesimo primo supra millesimum in febrem incidit. Ex
    qua cum se moriturum intellígeret, convocátis frátribus et alumnis suæ
    disciplinæ, eos ad innocéntiam et integritátem cohortátus est. Postremo
    caritátem, humilitátem, paupertátem, tamquam certum patrimónium eis
    testaménto relíquit; fratribúsque orántibus, in illis verbis, Subveníte,
    Sancti Dei, occúrrite, Angeli, obdormívit in Dómino, octavo Idus Augusti.
    Quem póstea Gregórius nonus Pontifex rétulit in Sanctórum númerum.
lectio94:
  - "Domínicus, Calarógæ in Hispánia ex nóbili Gusmanórum família natus, et
    Paléntiæ liberálibus disciplínis et theología erudítus, prius Oxoménsis
    ecclésiæ canónicus factus, dein órdinis Prædicatórum auctor fuit. Ejus
    ingénium et virtus máxime enituérunt in converténdis hæréticis, qui
    Tolosátes pervértere conabántur. Romam véniens, ab Innocéntio tértio
    Pontífice máximo sui órdinis approbatiónem confirmationémque pétiit, quam ab
    ejus successóre Honório tértio impetrávit. Cum vero ejus ópera innumerábiles
    hómines religiósam ac piam vitam institúerent, Bonóniæ, anno ducentésimo
    vigésimo primo supra millésimum, alúmnis caritátem, humilitátem et
    paupertátem tamquam certum patrimónium relínquens, in illis verbis:
    Subveníte, Sancti Dei, occúrrite, Angeli, obdormívit in Dómino, octávo idus
    augústi. Eum Gregórius Papa nonus in Sanctórum númerum rétulit."
  - "&teDeum"
