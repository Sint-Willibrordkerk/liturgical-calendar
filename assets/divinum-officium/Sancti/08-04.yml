oratio:
  - "Deus, qui Ecclésiam tuam beáti Domínici Confessóris tui illumináre dignátus
    es méritis et doctrínis: concéde; ut ejus intercessióne temporalibus non
    destituátur auxíliis, et spirituálibus semper profíciat increméntis."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Timótheum
  - "!2 Tim 4:1-8."
  - "Caríssime: Testíficor coram Deo, et Jesu Christo, qui judicatúrus est vivos
    et mórtuos, per advéntum ipsíus et regnum ejus: prædica verbum, insta
    opportúne, importúne: árgue, óbsecra, íncrepa in omni patiéntia, et
    doctrína. Erit enim tempus, cum sanam doctrínam non sustinébunt, sed ad sua
    desidéria coacervábunt sibi magístros, pruriéntes áuribus, et a veritáte
    quidem audítum avértent, ad fábulas autem converténtur. Tu vero vígila, in
    ómnibus labóra, opus fac Evangelístæ, ministérium tuum ímple. Sóbrius esto.
    Ego enim jam délibor, et tempus resolutiónis meæ instat. Bonum certámen
    certávi, cursum consummávi, fidem servávi. In réliquo repósita est mihi
    coróna justítiæ, quam reddet mihi Dóminus in illa die, justus judex: non
    solum autem mihi, sed et iis, qui díligunt advéntum ejus."
graduale:
  - "!Ps 91:13; 91:14"
  - "Justus ut palma florébit: sicut cedrus Líbani multiplicábitur in domo
    Dómini."
  - "!Ps 91:3"
  - Ad annuntiándum mane misericórdiam tuam, et veritátem tuam per noctem.
    Allelúja, allelúja.
  - "!Osee 14:6"
  - "Justus germinábit sicut lílium: et florébit in ætérnum ante Dóminum.
    Allelúja."
offertorium:
  - "@Commune/C2"
secreta:
  - "Múnera tibi, Dómine, dicáta sanctífica: ut, méritis beáti Domínici
    Confessóris tui, nobis profíciant ad medélam."
  - $Per Dominum
communio:
  - "@Commune/C4"
postcommunio:
  - "Concéde, quǽsumus, omnípotens Deus: ut, qui peccatórum nostrórum póndere
    prémimur, beáti Domínici Confessóris tui patrocínio sublevémur."
  - $Per Dominum
