evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 19:12-26"
  - "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Homo quidam
    nóbilis ábiit in regionem longínquam accípere sibi regnum, et revérti.
    Vocátis autem decem servis suis, dedit eis decem mnas, et ait ad illos:
    Negotiámini, dum vénio. Cives autem ejus óderant eum: et misérunt legatiónem
    post illum, dicéntes: Nólumus hunc regnáre super nos. Et factum est, ut
    redíret accépto regno: et jussit vocári servos, quibus dedit pecúniam, ut
    sciret, quantum quisque negotiátus esset. Venit autem primus, dicens:
    Dómine, mna tua decem mnas acquisívit. Et ait illi: Euge, bone serve, quia
    in módico fuísti fidélis, eris potestátem habens super decem civitátes. Et
    alter venit, dicens: Dómine, mna tua fecit quinque mnas. Et huic ait: Et tu
    esto super quinque civitátes. Et alter venit, dicens: Dómine, ecce mna tua,
    quam hábui repósitam in sudário: tímui enim te, quia homo austérus es:
    tollis, quod non posuísti, et metis, quod non seminásti. Dicit ei: De ore
    tuo te júdico, serve nequam. Sciébas, quod ego homo austérus sum, tollens,
    quod non pósui, et metens, quod non seminávi: et quare non dedísti pecúniam
    meam ad mensam, ut ego véniens cum usúris útique exegíssem illam? Et
    astántibus dixit: Auferte ab illo mnam et date illi, qui decem mnas habet.
    Et dixérunt ei: Dómine, habet decem mnas. Dico autem vobis: Quia omni
    habénti dábitur, et abundábit: ab eo autem, qui non habet, et, quod habet,
    auferétur ab eo."
offertorium:
  - "@Commune/C2"
secreta:
  - "Præsta, quǽsumus, omnípotens Deus: ut, sicut beátus Ludovícus Conféssor
    tuus, spretis mundi oblectaméntis, soli Regi Christo placére stúduit; ita
    ejus orátio nos tibi reddat accéptos."
  - $Per eundem
communio:
  - "@Commune/C4-1"
postcommunio:
  - "Deus, qui beátum Confessórem tuum Ludovícum mirificásti in terris, et
    gloriósum in cœlis fecísti: eúndem, quǽsumus, Ecclésiæ tuæ constítue
    defensórem."
  - $Per Dominum
rubrica-cisterciensis/officium:
  - S. Ludovici, Regis Francorum et Confessoris
lectio4:
  - "Ludovicus nonus Galliæ rex, duodecim annos natus, patre amisso, et in
    Blanchæ matris sanctissima disciplina educatus, cum jam vigesimum annum in
    regno ageret, in morbum incidit: quo tempore cogitavit de recuperanda
    possessione Jerosolymorum. Quamobrem ubi convaluisset, vexillum ab episcopo
    Parisiensi accepit: deínde mare cum ingenti exercitu trajiciens, primo
    prælio Saracenos fugavit. Sed cum ex pestilentia magna militum multitudo
    periisset, victus ipse captusque est."
lectio5:
  - "Rebus postea cum Saracenis compositis, liber rex exercitusque dimittitur.
    Quinque annis in Oriente commoratus, plurimos Christianos a barbarorum
    servitute redemit, multos étiam infideles ad Christi fidem convertit:
    præterea aliquot Christianorum urbes refecit suis sumptibus. Interim mater
    ejus migrat e vita: quare domum redire cogitur, ubi totum se dedit pietatis
    officiis."
lectio6:
  - "Multa ædificavit monasteria, et pauperum hospitia: beneficentia egentes
    sublevabat: frequens visebat ægrotos, quibus ipse non solum suis sumptibus
    omnia suppeditabat, sed etiam, quæ opus erant, manibus ministrabat. Vestitu
    vulgari utebatur, cilicio ac jejunio corpus assidue affligebat. Sed cum
    iterum transmisisset, bellum Saracenis illaturus, jamque castra in eorum
    conspectu posuisset, pestilentia decessit in illa oratione: Introibo in
    domum tuam; adorabo ad templum sanctum tuum, et confitebor nomini tuo. Ejus
    corpus postea Lutétiam Parisiorum translatum est, quod in celebri sancti
    Dionysii templo asservatur et colitur; caput vero in sacra æde sanctæ
    Capellæ. Ipse clarus miraculis a Bonifacio Papa octavo in sanctorum numerum
    est relatus."
lectio94:
  - "Ludovícus nonus, Gálliæ rex, in Blanchæ matris sanctíssima disciplína
    educátus, pro recuperánda possessióne Jerosolymórum mare cum ingénti
    exércitu traíciens, primo prǽlio Saracénos fugávit. Sed cum magna mílitum
    multitúdo ex pestiléntia perísset, victus ipse captúsque est. Rebus
    compósitis, liber dimíttitur. Plúrimos in Oriénte Christiános a barbarórum
    servitúte redémit, multos étiam infidéles ad Christi fidem convértit. In
    Gálliam revérsus, multa ædificávit monastéria et páuperum hospítia;
    beneficéntia egéntes sublevábat, frequens visébat ægrótos, eísque
    ministrábat; vestítu vulgári utebátur, cilício ac jejúnio corpus assídue
    affligébat. Cum íterum transmisísset, bellum Saracénis illatúrus, jamque
    castra in eórum conspéctu posuísset, pestiléntia decéssit in illa oratióne:
    Introíbo in domum tuam, adorábo ad templum sanctum tuum, et confitébor
    nómini tuo."
  - "&teDeum"
