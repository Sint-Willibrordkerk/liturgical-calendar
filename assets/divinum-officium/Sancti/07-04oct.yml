lectio4:
  - De Expositióne sancti Joánnis Chrysóstomi in Epístolam ad Romános
  - "!Sermo 32 in morali exhortat"
  - Cum Paulus Apóstolus grátiam Dómini nostri Jesu Christi, matrem ómnium
    bonórum, nobis precétur; réliquum est, ut nos tali patrocinio dignos
    exhibeamus, ut non hic solum vocem Pauli audiámus, sed et postquam illuc
    migravérimus, athletam Christi vidére mereamur. Immo, si hic audivérimus, et
    illic ipsum omnino vidébimus, licet non e propinquo stantes; vidébimus tamen
    prope regalem thronum splendentem, ubi Chérubim Deum glorificant, ubi
    Séraphim volant. Illic Paulum vidébimus cum Petro Sanctórum chori príncipem
    ac ducem, et ejus germana caritate fruemur.
lectio5:
  - Si enim, cum hic esset, usque adeo diligebat hómines, ut, cum dissolvi et
    cum Christo esse cúperet, elegerit tamen hic esse; multo magis illic
    ferventiórem caritátem osténdet. Ego et Romam proptérea diligo, tametsi
    aliunde illam laudare queam, nempe a magnitúdine, ab antiquitáte, a
    pulchritúdine, a multitúdine, ab imperio, a divítiis, et a rebus in bello
    fortiter gestis. Sed, his ómnibus omissis, ob id illam beátam prædico, quod
    erga illos Paulus, dum viveret, adeo fuit benévolus, adeo illos amávit, et
    coram disseruit, et postremo vitam apud eos finívit. Cujus sanctum corpus
    ipsi póssident. Et proptérea cívitas illa hinc facta est insígnis magis quam
    ab aliis rebus ómnibus; et tamquam corpus magnum ac validum duos habet
    óculos fulgéntes, Sanctórum videlicet horum corpora.
lectio6:
  - Non ita cælum splendéscit quando radios sol demittit, quemádmodum Romanórum
    urbs duos istos fulgóres ubíque terrárum emíttens. Hinc rapiétur Paulus,
    hinc Petrus. Considerate et horrete, quale spectaculum visura sit Roma;
    Paulum videlicet, repénte ex theca illa cum Petro resurgéntem, in occúrsum
    Dómini sursum ferri. Qualem rosam Christo mittet Roma! quálibus corónis
    duabus ornátur urbs ista! quálibus catenis áureis cincta est! quales habet
    fontes! Proptérea admiror hanc urbem, non propter colúmnas, neque propter
    aliam quamcúmque rerum spéciem, sed propter colúmnas illas Ecclésiæ. Quis
    mihi nunc dabit circumvolvi corpori Pauli, affigi sepúlcro, vidére púlverem
    corporis illíus, quæ adhuc in Christo déerant adimplentis, stígmata illíus
    gestántis, prædicatiónem Evangélii ubíque seminantis?
