    malígno deféndas, et Ecclésiam tuam perpétua pace custódias."
  - $Per Dominum
lectio4:
  - Joannes, Capistrani in Pelignis ortus et Perusium studiorum causa missus, in
    christianis et liberalibus disciplinis adeo profecit, ut ob egregiam juris
    scientiam aliquot civitatibus a Neapolis rege Ladislao præfectus fuerit. Dum
    autem earum rempublicam sanctissime gerens perturbatis rebus tranquillitatem
    revocare studet capitur ipse et in vincula conjicitur; quibus mirabiliter
    ereptus, Francisci Assisiensis regulam inter fratres Minores profitetur. Ad
    divinarum litterarum studium progressus præceptorem nactus est sanctum
    Bernardinum Senensem, cujus et virtutis exempla, in cultu potissimum
    sanctissimi nominis Jesu ac Deiparæ propagando, egregie est imitatus.
    Aquilanum episcopatum recusavit, et severiore disciplina atque scriptis quæ
    plurima edidit ad mores reformandos, maxime enituit.
lectio5:
  - Prædicationi verbi Dei sedulo incumbens, Italiam fere universam lustravit;
    quo in munere et virtute sermonis et miraculorum frequentia innumeras prope
    animas in viam salutis reduxit. Eum Martinus quintus ad exstinguendam
    Fraticellorum sectam inquisitorem instituit. A Nicolao quinto contra Judæos
    et Saracenos generalis inquisitor in Italia constitutus, plurimos ad Christi
    fidem convertit. In Oriente multa optime constituit, et in concilio
    Florentino, ubi veluti sol quidam fulsit, Armenos Ecclesiæ catholicæ
    restituit. Idem Pontifex, postulante Friderico tertio imperatore, illum
    apostolicæ Sedis nuntium in Germaniam legavit, ut hæreticos ad catholicam
    fidem et principum animos ad concordiam revocaret. In Germania aliisque
    provinciis Dei gloriam sexennali ministerio mirifice auxit, Hussitis,
    Adamitis, Thaboritis, Hebræisque innumeris doctrinæ veritate ac miraculorum
    luce ad Ecclesiæ sinum traductis.
lectio6:
  - "Cum Callistus tertius, ipso potissimum deprecante, cruce signatos mittere
    decrevisset, Joannes per Pannoniam aliasque provincias volitavit, qua verbo,
    qua litteris principum animos ita ad bellum accendit, ut brevi millia
    Christianorum septuaginta conscripta sint. Ejus consilio et virtute
    potissimum Taurunensis victoria relata est, centum ac viginti Turcarum
    millibus partim cæsis, partim fugatis. Cujus victoriæ cum Romam nuntius
    venisset octavo Idus Augusti, idem Callistus ejus diei memoriæ solemnia
    Transfigurationis Christi Domini perpetuo consecravit. Lethali morbo ægrotum
    et Villacum delatum viri principes plures visitarunt; quos ipse ad tuendam
    religionem hortatus, animam Deo sancte reddidit anno salutis millesimo
    quadringentesimo quinquagesimo sexto. Ejus gloriam post mortem Deus multis
    miraculis confirmavit: quibus rite probatis, Alexander octavus anno
    millesimo sexcentesimo nonagesimo Joánnem in Sanctorum numerum retulit;
    ejusque Officium ac Missam Leo decimus tertius, altero ab ejus canonizatione
    sæculo, ad universam extendit Ecclesiam."
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 9:1-6"
  - "In illo témpore: Convocatis Jesus duodecim Apostolis, dedit illis virtutem
    et potestatem super omnia dæmonia, et ut languores curarent. Et réliqua."
  - _
  - Homilia sancti Bonaventuræ Epíscopi
  - "!Expositio in cap. 9 Lucæ"
  - "Apostoli ideo nominati sunt, ut eorum commendaretur auctoritas. Apostolus
    enim missus interpretatur: missi autem fuerunt ad prædicandum, secundum
    illud: Non misit me Christus baptizare, sed evangelizare. Fuerunt ad
    prædicandum missi, non rem parvam, sed magnam scilicet regnum Dei, per quod
    potest intelligi doctrina veritatis, juxta illud: Auferetur a vobis regnum
    Dei, et dabitur genti facienti fructus ejus. Potest étiam dici gratia
    Spiritus Sancti, secundum illud: Non est regnum Dei esca et potus, sed
    justitia et pax, et gaudium in Spiritu Sancto; et infra: Ecce regnum Dei
    intra vos est. Potest étiam dici gloria æterna, juxta illud: Amen dico
    vobis, nisi quis renatus fuerit ex aqua et Spiritu Sancto, non potest
    introire in regnum Dei."
lectio8:
  - "Omnibus his modis Apostoli sunt missi prædicare regnum Dei, scilicet veram
    doctrinam, divinam gratiam, et ætérnam gloriam. Et quia propter auctoritatem
    prædicationis concesserat potestatem curationis, ideo subdit: Et sanare
    infirmos; scilicet misit ad confirmationem veritatis prædicatæ secundum
    illud: Illi autem profecti, prædicaverunt ubique, Domino cooperante et
    sermonem confirmante sequentibus signis. Unde signum missionis spiritualis
    ad prædicandum est sanatio audientium a morbis vitiorum."
lectio9:
  - "Tria autem sunt signa evidentia, quibus probatur utrum prædicator a Domino
    sit missus ad Evangelium prædicandum. Primum est auctoritas mittentis,
    cujusmodi est pontificis, et Maxime Pontificis summi, qui est loco Petri,
    immo Jesu Christi; unde qui ab eo mittitur, a Christo mittitur. Secundum est
    zelus animarum in persona quæ mittitur, quando scilicet principaliter
    quæsierit Dei honorem et animarum salutem. Tertium est fructificatio et
    conversio auditorum. Per primum sunt nuntii Patris, per secundum Filii, per
    tertium Spiritus Sancti. De primo: pro patribus tuis nati sunt tibi filii.
    De secundo: Non enim nosmetipsos prædicamus, sed Jesus Christum Dominum
    nostrum. De tertio: Posui vos ut eatis, et fructum afferatis, et fructus
    vester maneat. Et qui sic mittitur, potest dicere illud: Spiritus Domini
    super me, eo quod unxerit me."
  - "&teDeum"
