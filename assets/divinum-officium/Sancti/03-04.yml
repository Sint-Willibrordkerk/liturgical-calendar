oratio:
  - "Deus, qui inter regáles delícias et mundi illécebras sanctum Casimírum
    virtúte constántiæ roborásti: quǽsumus; ut ejus intercessióne fidéles tui
    terréna despíciant, et ad cœléstia semper aspírent."
  - $Per Dominum
