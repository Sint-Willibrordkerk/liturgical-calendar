  - scriptura1960
lectio4:
  - Casimírus, patre Casimiro, matre Elisabetha Austriaca, Poloniæ regibus
    ortus, a  pueritia sub optimis magistris, pietate et bonis artibus
    instructus, juveniles artus aspero domabat cilicio, et assiduis extenuabat
    jejuniis. Regii spreta lecti mollitie, dura cubabat humo, et clam intempesta
    nocte, præ foribus templorum pronus in terra divinam exorabat clementiam. In
    Christi contemplanda passione assiduus, Missarum solemniis adeo erecta in
    Deum mente solebat adesse, ut extra se rapi videretur.
lectio5:
  - "Catholicam promovere fidem summopere studuit, et Ruthenorum schisma
    abolere: quapropter Casimírum patrem induxit, ut legem ferret, ne
    schismatici nova templa  construerent, nec vetera collabentia restaurarent.
    Erga pauperes et calamitatibus oppressos beneficus et misericors, patris et
    defensoris egenorum nomen obtinuit. Virginitatem, quam ab incunabulis
    servavit illæsam, sub extremo  vitæ termino fortiter asseruit, dum gravi
    pressus infirmitate, mori potius quam castitatis jacturam ex medicorum
    consilio subire, constanter decrevit."
lectio6:
  - Consummatus in brevi, virtutibus et meritis plenus, prænuntiato mortis die,
    inter sacerdotum et religiosorum choros' spiritum Deo reddidit, anno ætatis
    vigesimo quinto. Corpus Vilnam delatum multis claret miraculis. Etenim
    præterquam quod puella defuncta vitam, cæci visum, claudi gressum, et varii
    infirmi sanitatem ad ejus sepulchrum recuperarunt; Lithuanis exiguo numero
    ad potentissimi hostis insperatam irruptionem trepidantibus in aëre
    apparens, insignem tribuit victoriam. Quibus permotus Leo decimus eumdem
    Sanctorum catalogo adscripsit.
lectio94:
  - Casimírus, Polóniæ regis fílius, a puerítia pietáte et bonis ártibus
    instrúctus, juveníles artus áspero domábat cilício, et assíduis extenuábat
    jejúniis. In Christi contemplánda passióne assíduus, oratiónis spiritum non
    relaxábat. Cathólicam fidem promovére, et Ruthenórum schisma abolére
    summópere stúduit. Erga páuperes et calamitátibus oppréssos benéficus et
    miséricors, patris et defensóris egenórum nomen obtínuit. Virginitátem usque
    ad extrémum vitæ términum constánter servávit illǽsam. Consummátus in brevi,
    virtútibus et méritis plenus, prænuntiáto mortis die, spíritum Deo réddidit,
    anno ætátis vigésimo quinto. Eum, miráculis clarum, Leo décimus in Sanctórum
    númerum réttulit.
  - "&teDeum"
