lectio93:
  - Zephyrinus Romanus Severo imperatore ad regendam Ecclesiam assumptus,
    sancivit, ut qui ordinandi essent, opportuno tempore et multis præsentibus
    clericis et laicis, de more sacris initiarentur; doctique ac spectatæ vitæ
    homines ad id officii munus deligerentur. Decrevit præterea, ut rem divinam
    facienti episcopo sacerdotes omnes astarent. Idem instituit ut patriarcha,
    primas, metropolitanus adversus episcopum non ferant sententiam, nisi
    apostolica auctoritate fulti. Vixit in pontificatu annos decem et octo, dies
    decem et octo. Habuit ordinationes quatuor mense Decembri, quibus creavit
    presbyteros tredecim, diaconos septem, episcopos per diversa loca tredecim.
    Antonino imperatore martyrio coronatus est, et sepultus via Appia prope
    cemeterium Callisti, septimo Kalendas Septembris.
  - "&teDeum"
