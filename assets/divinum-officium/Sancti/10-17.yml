oratio:
  - "Dómine Jesu Christe, qui investigábiles divítias Cordis tui beátæ Margarítæ
    Maríæ Vírgini mirabíliter revelásti: da nobis ejus méritis et imitatióne;
    ut, te in ómnibus et super ómnia diligéntes, jugem in eódem Corde tuo
    mansiónem habére mereámur:"
  - $Qui vivis
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Ephésios.
  - "!Ephes 3:8-9; 14-19."
  - "Fratres: Mihi ómnium sanctórum mínimo data est grátia hæc, in géntibus
    evangelizáre investigábiles divítias Christi, et illumináre omnes, quæ sit
    dispensátio sacraménti abscónditi a sǽculis in Deo, qui ómnia creávit. Hujus
    rei grátia flecto génua mea ad Patrem Dómini nostri Jesu Christi, ex quo
    omnis patérnitas in cælis et in terra nominátur, ut det vobis secúndum
    divítias glóriæ suæ, virtúte corroborári per Spíritum ejus in interiórem
    hóminem: Christum habitáre per fidem in córdibus vestris: in caritáte
    radicáti et fundáti, ut póssitis comprehéndere cum ómnibus sanctis, quæ sit
    latitúdo et longitúdo et sublímitas et profúndum: scire étiam supereminéntem
    sciéntiæ caritátem Christi, ut impleámini in omnem plenitúdinem Dei."
