officium:
  - Commune Unius Martyris Commemorati
versum-1:
  - V. Glória et honóre coronásti eum, Dómine.
  - R. Et constituísti eum super ópera mánuum tuárum.
ant-1:
  - Qui vult veníre post me, * ábneget semetípsum, et tollat crucem suam, et
    sequátur me.
versum-2:
  - "@CommuneCist/C2:Nocturn 1 Versum"
ant-2:
  - Hic est vere Martyr, * qui pro Christi nómine sánguinem suum fudit, qui
    minas júdicum non tímuit, nec terrénæ dignitátis glóriam quæsívit, sed ad
    coeléstia regna felíciter pervénit.
versum-3:
  - "@CommuneCist/C2:Nocturn 1 Versum"
