    canébant tubis ante eos, cunctúsque Israël stabat."
  - "7 Sanctificávit quoque Sálomon médium átrii ante templum Dómini: obtúlerat
    enim ibi holocáusta, et ádipes pacificórum: quia altáre ǽneum, quod fécerat,
    non póterat sustinére holocáusta et sacrifícia et ádipes."
  - 8 Fecit ergo Sálomon solemnitátem in témpore illo septem diébus, et omnis
    Israël cum eo, ecclésia magna valde ab intróitu Emath usque ad Torréntem
    Ægýpti.
  - 9 Fecítque die octávo colléctam, eo quod dedicásset altáre septem diébus, et
    solemnitátem celebrásset diébus septem.
