lectio1:
  - De libro secundo Paralipómenon
  - "!2 Chr 7:1-5"
  - "1 Cum complésset Sálomon fundens preces, ignis descéndit de cælo et
    devorávit holocáusta et víctimas: et majéstas Dómini implévit domum."
  - 2 Nec póterant sacerdótes íngredi templum Dómini, eo quod implésset majéstas
    Dómini, templum Dómini.
  - "3 Sed et omnes fílii Israël vidébant descendéntem ignem, et glóriam Dómini
    super domum: et corruéntes proni in terram super paviméntum stratum lápide,
    adoravérunt et laudavérunt Dóminum: Quóniam bonus, quóniam in sǽculum
    misericórdia ejus."
  - 4 Rex autem et omnis pópulus immolábant víctimas coram Dómino.
  - "5 Mactávit ígitur rex Sálomon hóstias, boum vigínti duo míllia, aríetum
    centum vigínti míllia: et dedicávit domum Dei rex et univérsus pópulus."
responsory1:
  - "R. Ornavérunt fáciem templi corónis áureis, et dedicavérunt altáre Dómino:"
  - "* Et facta est lætítia magna in pópulo."
  - V. In hymnis et confessiónibus benedicébant Dóminum.
  - R. Et facta est lætítia magna in pópulo.
