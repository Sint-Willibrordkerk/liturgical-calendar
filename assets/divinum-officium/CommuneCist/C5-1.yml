  ant-vespera:
    - Collaudábunt multi * sapiéntiam ejus, et usque in sæculum non delébitur.
    - Cognóvit eum Dóminus * in benedictiónibus suis, et invénit grátiam coram
      óculis Dómini.
    - "Justum dedúxit Dóminus * per vias rectas, et osténdit illi regnum Dei, et
      dedit illi sciéntiam Sanctórum: honestávit illum in labóribus, et
      complévit labóres illíus."
    - Justus * cor suum tradet ad vigilándum dilúculo ad Dóminum, qui fecit
      illum, et in conspéctu Altíssimi deprecábitur.
    - Serve bone, * et fidélis, quia super pauca fuísti fidélis, supra multa te
      constítuam, intra in gáudium Dómini tui.
