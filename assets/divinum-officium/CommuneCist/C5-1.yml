oratio:
  - "Adésto, Dómine, supplicatiónibus nostris, quas in beáti N. Confessóris tui
    sollemnitáte deférimus: ut, qui nostræ justítiæ fidúciam non habémus, ejus,
    qui tibi plácuit, précibus adjuvémur."
  - $Per Dominum
