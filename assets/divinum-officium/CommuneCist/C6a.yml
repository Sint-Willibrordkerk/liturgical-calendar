  lectio12:
    - In quinque autem córporis sénsibus unusquísque subsístit;  geminátus autem
      quinárius denárium pérficit. Et, quia ex utróque sexu fidélium multitúdo
      collígitur, sancta Ecclésia decem virgínibus símilis esse denuntiátur. In
      qua quia mali cum bonis et réprobi cum eléctis admíxti sunt, recte símilis
      virgínibus prudéntibus et fátuis esse perhibétur. Sunt namque pleríque
      continéntes, qui ab appetítu se exterióri custódiunt et spe ad interióra
      rapiúntur, carnem mácerant, et toto desidério ad supérnam pátriam
      anhélant, ætérna prǽmia éxpetunt, pro labóribus suis recípere laudes
      humánas nolunt. Hi nimírum glóriam suam non in ore hóminum ponunt, sed
      intra consciéntiam cóntegunt. Et sunt pleríque, qui corpus per
      abstinéntiam afflígunt, sed de ipsa sua abstinéntia humános favóres
      éxpetunt.
    - "&teDeum"
  responsory12:
    - "R. Audi, fília, et vide, et inclína aurem tuam, et oblivíscere pópulum
      tuum, et domum Patris tui, et concupíscet Rex spéciem tuam:"
