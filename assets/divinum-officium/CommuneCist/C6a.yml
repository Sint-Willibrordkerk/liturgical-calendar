  lectio7-in-2-loco:
    - "Neque enim inánis hæc cáutio est, et vana formído, quæ ad salútis viam
      cónsulit, quæ domínica et vitália præcépta custódit, ut quæ se Christo
      dicáverint, et a carnáli concupiscéntia recedéntes tam carne, quam mente
      se Deo vóverint, consúmment opus suum magno prǽmio destinátum, nec ornári
      jam, aut placére cuíquam, nisi Dómino suo, stúdeant, a quo et mercédem
      virginitátis expéctant, dicénte ipso: Non omnes cápiunt verbum, sed illi
      quibus datum est. Sunt enim spadónes, qui ex útero matris sic nati sunt:
      et sunt spadónes, qui coácti sunt ab homínibus; et sunt spadónes, qui
      seípsos castravérunt propter regnum cœlórum."
