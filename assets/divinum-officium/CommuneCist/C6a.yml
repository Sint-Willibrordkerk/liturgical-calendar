    lectio9-in-4-loco:
      - Léctio sancti Evangélii secúndum Matthǽum
      - "!Matt 25:1-13"
      - "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Simile
        erit regnum cælórum decem virgínibus, quæ, accipiéntes lámpades suas,
        exiérunt obviam sponso et sponsæ. Et réliqua."
      - _
      - Homilía sancti Augustíni Epíscopi
      - "!Sermo 93 de verbis Domini, cap. II-IV"
      - "Intelligámus, caríssimi, ad omnes nos, id est, ad univérsam omníno
        Ecclésiam, istam pertinére parábolam, non ad solos præpósitos, nec ad
        solas plebes: sed prorsus ad omnes. Istæ quinque et quinque vírgines,
        omnes omníno sunt ánimæ Christianórum. Sed, ut dicámus vobis, quod Deo
        inspiránte sentímus, non qualescúmque ánimæ; sed tales animæ, quæ habent
        Cathólicam fidem, et habére vidéntur bona ópera in Ecclésia Dei: et
        tamen ex ipsis quinque sunt prudéntes, et quinque fátuæ."
    lectio10-in-4-loco:
      - "Quare ergo appellátæ sunt quinque; et quare vírgines, prius videámus.
        Omnis ánima in córpore ídeo quinário número censétur, quia quinque
        sénsibus útitur. Qui ergo se ábstinet ab illícito visu, ab illícito
        audítu, ab illícito odorátu, ab illícito gustátu, ab illícito tactu,
        propter ipsam integritátem, vírginis nomen accépit. Sed si bonum est,
        abstinére ab illícitis sentiéndi mótibus, et ídeo unaquæque ánima
        Christiána vírginis nomen accépit: quare quinque admittúntur, et quinque
        repellúntur?"
    lectio11-in-4-loco:
      - "Et vírgines sunt, et repellúntur. Parum est quia vírgines sunt: et
        lámpades habent. Vírgines, propter abstinéntiam ab sensibus; lámpades
        habent, propter ópera bona. De quibus opéribus Dóminus dicit: Lúceant
        ópera vestra coram homínibus. Item discípulis dicit: Sint lumbi vestri
        accíncti, et lucérnæ ardéntes. In lumbis accínctis, virgínitas; in
        lucérnis ardéntibus, ópera bona. Si ergo ab illícitis abstinéntia bona
        est; unde virgínitas nomen accépit, et ópera bona laudabília sunt, quæ
        significántur lampádibus: quare quinque admittúntur, et quinque
        repellúntur?"
    lectio12-in-4-loco:
      - "Alias dixit prudéntes, alias stultas. Unde intuémur? unde discérnimus?
        De óleo. Aliquid magnum signíficat óleum, et valde magnum. Putas, num
        cáritas est? Quæréndo dícimus, non senténtiam præcipitámus. Unde mihi
        videátur óleum caritátem significáre, dicam vobis. Apóstolus dicit:
        Adhuc supereminentiórem vobis viam demónstro. Si linquis hóminum loquar
        et Angelórum, caritátem autem non hábeam, factus sum æraméntum sonans,
        aut cýmbalum tínniens. Ipsa est superéminens via: id est cáritas, quæ
        mérito óleo significátur. Omnibus enim humóribus óleum superéminet."
    lectio9-in-5-loco:
      - Léctio sancti Evangélii secúndum Matthǽum
      - "!Matt 25:1-13"
      - "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Simile
        erit regnum cælórum decem virgínibus, quæ, accipiéntes lámpades suas,
        exiérunt obviam sponso et sponsæ. Et réliqua."
      - _
      - Homilía sancti Augustíni Epíscopi
      - "!Sermo 93 de verbis Domini, cap. VI-VIII et X"
      - "Disceptémus, fratres, de quinque virgínibus prudéntibus et quinque
        fátuis. Voluérunt ire óbviam sponso, corde ire, exspectáre ejus
        advéntum. Sed ille tardábat. Dum tardat ille, dormiérunt omnes. Quid est
        somnus iste? Ne forte tardánte sponso, quóniam abúndat iníquitas,
        refrigéscit cáritas multórum, subjécit et ait: Qui autem perseveráverit
        usque in finem, hic salvus erit. Non ergo eis obrépsit frigus caritátis,
        non in eis refríguit cáritas; sed fervet usque in finem. Est álius
        somnus, quem nemo evádit. Non recordámini Apóstolum dicéntem: De
        dormiéntibus autem nolo vos ignoráre, fratres: id est, de his qui mórtui
        sunt? fátua sit virgo, prudens sit virgo, somnum mortis omnes patiúntur.
        Ad novíssimam tubam surgent omnes."
    lectio10-in-5-loco:
      - "Prudéntes autem illæ tulérunt óleum secum in vasis suis: stultæ vero
        illæ non tulérunt óleum secum.  Ibi óleum, magnum óleum. De dono Dei est
        hoc óleum. Tu ergo tecum porta, intus porta, ubi videt Deus, ibi porta
        testimónium consciéntiæ tuæ. Qui autem ámbulat ad testimónium aliénum,
        óleum non portat secum. Inténdat ítaque Cáritas vestra. Sapiéntium
        lámpades ardébant de óleo intérno, de consciéntiæ securitáte, de
        interióre glória, de íntima caritáte. Ardébant tamen et illárum
        fatuárum. Quare tunc ardébant? Quia non déerant laudes hóminum."
    lectio11-in-5-loco:
      - "Postea vero, quam surrexérunt, id est, in resurrectióne a mórtuis,
        cœpérunt aptáre lámpades suas, id est, paráre Deo óperum suórum réddere
        ratiónem. Et quia tunc nemo est qui laudet, omnis homo causæ suæ vacat;
        non erant, qui óleum vénderent, cœpérunt defícere lámpades. Clausum est
        óstium. Et quid illis dictum est? Non novi vos. Non illas novit, qui
        ómnia novit? Quid ergo est: Non novi vos? Improbo vos, réprobo vos. In
        arte mea non vos agnósco; ars mea nescit vítia, et júdicat vítia; nescit
        faciéndo, júdicat arguéndo: sic ergo non novi vos. Iérunt, intravérunt
        quinque prudéntes."
    lectio12-in-5-loco:
      - "Sint in vobis quinque prudéntes ad istam prudéntiam quinárii númeri
        pertinéntes. Véniet enim hora, et quando nescímus, véniet. Sic clausit
        Evangélium: Vigiláte, quia nescítis diem neque horam. Corde vígila, fide
        vígila, spe vígila, caritáte vígila, opéribus vígila: et quando córpore
        dormíveris, véniet tempus ut surgas. Cum autem surréxeris, præpara
        lámpades. Tunc non exstinguántur, tunc interióre consciéntiæ óleo
        vegeténtur: tunc sponsus ille incorpóreis néxibus amplectátur, tunc te
        introdúcat in domum, ubi numquam dórmias, ubi nunquam possit tua lampas
        exstíngui. Hódie vero laborámus, et lámpades nostræ inter ventos sæculi
        hujus tentationésque flúctuant; sed árdeat in róbore flamma nostra, ut
        ventus tentatiónis áugeat ignem pótius, quam exstínguat."
    lectio9-in-6-loco:
      - Léctio sancti Evangélii secúndum Matthæum.
      - "!Lk 25:1-13"
      - "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Simile
        erit regnum coelórum decem virgínibus, quæ, accipiéntes lampades suas,
        exiérunt obviam sponso et sponsæ. Et réliqua."
      - _
      - Homilía sancti Joánnis Chrysóstomi.
      - "!Homilía 79. in Matth."
      - "Magna quædam de virginitáte disserúerat dicens: Sunt eunuchi, qui
        seipsos castravérunt propter regnum coelórum; et, Qui potest cápere,
        cápiat. Nec ignorábat, de virginitáte magnam esse vulgo existimatiónem,
        quippe cum sit ea res natúra sublímis: quod inde patet, quia neque in
        véteri Testaménto a priscis illis sanctísque viris culta fuit, et in
        novo nulla legis necessitáte jubétur. Non enim id imperávit, sed
        fidélium voluntáti permísit."
    lectio10-in-6-loco:
      - Quóniam ígitur et magna res erat, ac de ea apud multos magna erat
        existimátio, ne quis, ea perfécta, se totum perfécisse putáret ac cetera
        negligeret, hanc parábolam pósuit; ut osténderet, virginitátem, quamvis
        cetera hábeat, si misericórdiæ bonis carúerit, cum fornicatóribus éjici.
        Ac mérito quidem inhumánum ac misericórdia caréntem cum illis cóllocat;
        fornicátor enim córporum, istæ vero pecuniárum cupiditáte vincúntur.
    lectio11-in-6-loco:
      - Non est autem córporum et pecúniæ par cupíditas; sed ácrior multo atque
        veheméntior illa córporum est. Quanto ígitur cum imbecillióre luctántur,
        tanto minus vénia dignæ sunt, si vincántur. Idcírco etiam fátuas
        appellávit; quóniam, majóri certámine superáto, in facíliore totum
        perdidérunt.
    lectio12-in-6-loco:
      - "Lámpades autem hoc loco illud ipsum virginitátis domum appéllat et
        sanctimóniæ puritátem; óleum vero benignitátem, eleemósynam, impénsum
        indigéntibus auxílium. Tardánte autem sponso dormitavérunt omnes, et
        dormiérunt. Non parvum témporis rursus spátium interjéctum osténdit, ut
        discípulos, regnum ipsíus mox futúrum exspectántes, ab ea opinióne
        dedúceret; id enim illi sperábant: quaprópter crebro ab hujúsmodi eos
        spe révocat."
