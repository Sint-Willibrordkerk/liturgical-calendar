  lectio5-in-2-loco:
    - Ex libro S. Cypriáni, Epíscopi et Mártyris, de disciplína et hábitu
      Vírginum
    - "!Lib. de hab. Virg. n. 3-5"
    - "Nunc nobis ad vírgines sermo est, quarum quo sublímior glória est, major
      et cura est. Flos est ille ecclesiástici gérminis, decus atque ornaméntum
      grátiæ spiritális, læta índoles, laudis et honóris opus íntegrum atque
      incorrúptum, Dei imágo respóndens ad sanctimóniam Dómini, illústrior
      pórtio gregis Christi. Gaudet per illas atque in illis lárgiter floret
      Ecclésiæ matris gloriósa fœcúnditas: quantóque plus copiósa virgínitas
      número suo addit, tanto plus gáudium matris augéscit. Ad has lóquimur, has
      adhortámur affectióne pótius quam potestáte: non quod, extrémi et mínimi
      et humilitátis nostræ ádmodum cónscii, áliquid ad censúram licéntiæ
      vindicémus; sed quod ad sollicitúdinem magis cauti, plus de diáboli
      infestatióne timeámus."
  lectio6-in-2-loco:
