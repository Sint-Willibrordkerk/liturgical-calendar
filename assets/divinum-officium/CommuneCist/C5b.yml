      relínquere, rapiénti non resístere, percutiénti álteram maxíllam præbére?"
  lectio10-in-2-loco:
    - "Véndite quæ possidétis, et date eleemósynam. Nolíte, inquit, timére, ne
      propter regnum Dei militántibus, hujus vitæ necessária desint: quin étiam
      posséssa propter eleemósynam véndite. Quod tunc digne fit, quando quis
      semel pro Dómino suis ómnibus spretis, nihilóminus post hæc labóre mánuum,
      unde et victum transígere, et eleemósynam dare queat, operátur. Unde
      gloriátur Apóstolus, dicens: Argéntum, et aurum, aut vestem nullíus
      concupívi: ipsi scitis, quóniam ad ea quæ mihi opus erant, et his qui
      mecum sunt, ministravérunt manus istæ. Ómnia osténdi vobis, quóniam sic
      laborántes opórtet suscípere infírmos."
  lectio11-in-2-loco:
    - "Véndite quæ possidétis, et date eleemósynam. Nolíte, inquit, timére, ne
