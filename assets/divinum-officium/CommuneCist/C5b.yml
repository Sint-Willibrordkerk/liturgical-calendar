lectio9:
  - Léctio sancti Evangélii secúndum Matthǽum.
  - "!Matt 19:27-29"
  - "In illo témpore: Dixit Petrus ad Jesum: Ecce nos relíquimus ómnia, et
    secúti sumus te: quid ergo erit nobis? Et réliqua."
  - _
  - Homilía sancti Hierónymi Presbýteri.
  - "!Lib. 3. in Matth. cap. 19."
  - "Grandis fidúcia! Petrus piscátor erat, dives non fúerat, cibos manu et arte
    quærébat: et tamen lóquitur confidénter: Relíquimus ómnia. Et quia non
    súfficit tantum relínquere, jungit quod perféctum est: Et secúti sumus te.
    Fécimus quod jussísti: quid ígitur nobis dabis prǽmii? Jesus autem dixit
    illis: Amen dico vobis, quod vos qui secúti estis me, in regeneratióne, cum
    séderit Fílius hóminis in sede majestátis suæ, sedébitis et vos super sedes
    duódecim, judicántes duódecim tribus Ísraël. Non dixit: Qui reliquístis
    ómnia; hoc enim et Crates fecit philósophus, et multi álii divítias
    contempsérunt: sed, Qui secúti estis me: quod próprie Apostolórum est, atque
    credéntium."
lectio10:
  - Léctio sancti Evangélii secúndum Matthǽum.
  - "!Matt 19:27-29"
  - "In illo témpore: Dixit Petrus ad Jesum: Ecce nos relíquimus ómnia, et
    secúti sumus te: quid ergo erit nobis? Et réliqua."
  - _
  - Homilía sancti Hierónymi Presbýteri.
  - "!Lib. 3. in Matth. cap. 19."
  - "Grandis fidúcia! Petrus piscátor erat, dives non fúerat, cibos manu et arte
    quærébat: et tamen lóquitur confidénter: Relíquimus ómnia. Et quia non
    súfficit tantum relínquere, jungit quod perféctum est: Et secúti sumus te.
    Fécimus quod jussísti: quid ígitur nobis dabis prǽmii? Jesus autem dixit
    illis: Amen dico vobis, quod vos qui secúti estis me, in regeneratióne, cum
    séderit Fílius hóminis in sede majestátis suæ, sedébitis et vos super sedes
    duódecim, judicántes duódecim tribus Ísraël. Non dixit: Qui reliquístis
    ómnia; hoc enim et Crates fecit philósophus, et multi álii divítias
    contempsérunt: sed, Qui secúti estis me: quod próprie Apostolórum est, atque
    credéntium."
lectio11:
  - "In regeneratióne, cum séderit Fílius hóminis in sede majestátis suæ (quando
    et mórtui de corruptióne resúrgent incorrúpti) sedébitis et vos in sóliis
    judicántium, condemnántes duódecim tribus Ísraël: quia vobis credéntibus,
    illi crédere noluérunt. Et omnis qui relíquerit domum, vel fratres, aut
    soróres, aut patrem, aut matrem, aut uxórem, aut fílios, aut agros propter
    nomen meum, céntuplum accípiet, et vitam ætérnam possidébit. Locus iste cum
    illa senténtia cóngruit, in qua Salvátor lóquitur: Non veni pacem míttere,
    sed gládium. Veni enim separáre hóminem a patre suo, et matrem a fília, et
    nurum a socru: et inimíci hóminis doméstici ejus. Qui ergo propter fidem
    Christi, et prædicatiónem Evangélii, omnes afféctus contémpserint, atque
    divítias et sǽculi voluptátes: isti céntuplum recípient, et vitam ætérnam
    possidébunt."
