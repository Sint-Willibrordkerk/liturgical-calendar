  rule:
    - Antiphonas horas
  ant-vespera:
    - Collaudábunt multi * sapiéntiam ejus, et usque in sæculum non delébitur.
    - Cognóvit eum Dóminus * in benedictiónibus suis, et invénit grátiam coram
      óculis Dómini.
    - "Justum dedúxit Dóminus * per vias rectas, et osténdit illi regnum Dei, et
      dedit illi sciéntiam Sanctórum: honestávit illum in labóribus, et
      complévit labóres illíus."
    - Justus * cor suum tradet ad vigilándum dilúculo ad Dóminum, qui fecit
      illum, et in conspéctu Altíssimi deprecábitur.
    - Serve bone, * et fidélis, quia super pauca fuísti fidélis, supra multa te
      constítuam, intra in gáudium Dómini tui.
  tempore-paschali/ant-vespera:
    - Allelúia, * allelúia, allelúia.
  versum-1:
    - V. Amávit eum Dóminus, et ornávit eum.
    - R. Stolam glóriæ índuit eum.
  ant-1:
    - Iste cognóvit * justítiam, et vidit mirabília magna, et exorávit
      Altíssimum, et invéntus est in número Sanctórum.
  tempore-paschali/ant-1:
    - Beátus vir, * qui métuit Dóminum, allelúia, in mandátis ejus cupit nimis,
      allelúia.
  tempore-paschali/invit:
    - Allelúia, allelúia, * Allelúia.
  ant-matutinum:
    - Beátus vir, * qui in lege Dómini meditátur, volúntas ejus pérmanet die ac
      nocte; et ómnia quæcúmque fáciet, semper prosperabúntur.;;1
    - Beátus * iste Sanctus, qui confísus est in Dómino, prædicávit præcéptum
      Dómini, constitútus est in monte sancto ejus.;;2
    - "Invocántem * exaudívit Dóminus sanctum suum: Dóminus exaudívit eum, et
      constítuit eum in pace.;;4"
    - Scuto bonæ voluntátis * tuæ coronásti eum Dómine.;;5
    - Dómine, * Dóminus noster, quam admirábile est nomen tuum in univérsa
      terra! quia glória et honóre coronásti Sanctum tuum, et constituísti eum
      super ópera mánuum tuárum.;;8
    - "Justus Dóminus, * et justítiam diléxit: æquitátem vidit vultus ejus.;;10"
    - "Dómine, * iste Sanctus habitábit in tabernáculo tuo: operátus est
      justítiam tuam, requiéscet in monte sancto tuo.;;14"
    - "Vitam * pétiit a te, et tribuísti ei, Dómine: glóriam et magnum decérem
      imposuísti super eum, posuísti in cápite ejus corónam de lápide
      pretióso.;;20"
    - "Hic accípiet * benedictiónem a Dómino, et misericórdiam a Deo salutári
      suo: quia hæc est generátio quæréntium Dóminum.;;23"
    - Lætábitur justus * in Dómino et sperábit in eo, et laudabúntur omnes recti
      corde;;63
    - Beátus * quem elegísti Dómine, habitábit in átriis tuis;;64
    - "Justus ut palma * florébit: sicut cedrus Líbani multiplicábitur;;91"
    - Nisi granum fruménti * cadens in terram, mórtuum fúerit; ipsum solum
      manet.;;256;257;258
    - "Amávit eum Dóminus, * et ornávit eum: stolam glóriæ índuit eum, et ad
      portas paradísi coronávit eum.;;256;257;258"
  nocturn-1-versum:
    - V. Os justi meditábitur sapiéntiam.
    - R. Et lingua ejus loquétur judícium.
  nocturn-2-versum:
    - V. Lex Dei ejus in corde ipsíus.
    - R. Et non supplantabúntur gressus ejus.
  nocturn-3-versum:
    - V. Justus ut palma florébit.
    - R. Sicut cedrus Líbani multiplicábitur.
  lectio1:
    - De libro Sapiéntiæ
    - "!Sap 4:7-14"
    - 7 Justus si morte præoccupátus fúerit, in refrigério erit;
    - "8 Senéctus enim venerábilis est non diutúrna, neque annórum número
      computáta: cani autem sunt sensus hóminis,"
    - 9 et ætas senectútis vita immaculáta.
    - 10 Placens Deo factus est diléctus, et vivens inter peccatóres translátus
      est.
    - 11 Raptus est, ne malítia mutáret intelléctum ejus, aut ne fíctio
      decíperet ánimam illíus.
    - 12 Fascinátio enim nugacitátis obscúrat bona, et inconstántia
      concupiscéntiæ transvértit sensum sine malítia.
    - 13 Consummátus in brevi, explévit témpora multa;
    - "14 plácita enim erat Deo ánima illíus: propter hoc properávit edúcere
      illum de médio iniquitátum."
