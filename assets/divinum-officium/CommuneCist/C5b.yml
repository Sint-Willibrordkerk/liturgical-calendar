  lectio1s2:
    - "!Sir 34:14-20"
    - 14 Spíritus timéntium Deum quǽritur, et in respéctu illíus benedicétur.
    - 15 Spes enim illórum in salvántem illos, et óculi Dei in diligéntes se.
    - "16 Qui timet Dóminum nihil trepidábit: et non pavébit, quóniam ipse est
      spes ejus."
    - 17 Timéntis Dóminum, beáta est ánima ejus.
    - 18 Ad quem réspicit, et quis est fortitúdo ejus?
    - "19 Óculi Dómini super timéntes eum: protéctor poténtiæ, firmaméntum
      virtútis, tégimen ardóris, et umbráculum meridiáni:"
    - "20 deprecátio offensiónis, et adjutórium casus: exáltans ánimam, et
      illúminans óculos, dans sanitátem, et vitam, et benedictiónem."
