  responsory4:
    - "R. Hic est vir, qui non est derelíctus a Deo in die certáminis sui, et
      ipse conculcávit caput serpéntis antíqui:"
    - "* Modo coronátus est, quia fidéliter vixit in mandátis Dómini."
    - V. Quis est hic, et laudábimus eum? fecit enim mirabília in vita sua.
    - R. Modo coronátus est, quia fidéliter vixit in mandátis Dómini.
    - "&Gloria"
    - R. Modo coronátus est, quia fidéliter vixit in mandátis Dómini.
