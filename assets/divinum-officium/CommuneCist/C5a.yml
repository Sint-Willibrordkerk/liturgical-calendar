  lectio12-in-3-loco:
    - Quod est fastígium construéndæ fábricæ, quam molímur? quo perventúrum est
      cacúmen ædifícii? Cito dico, usque ad conspéctum Dei. Vidétis quam
      excélsum est, quanta res est conspícere Deum. Qui desíderat, et quod dico
      et quod audit intéllegit. Promíttitur nobis conspéctus Dei, veri Dei,
      summi Dei. Hoc enim bonum est, vidéntem vidére. Nam, qui colunt falsos
      deos, fácile illos vident; sed eos vident, qui óculos habent et non
      vident. Nobis autem promíttitur vísio Dei vivéntis et vidéntis.
    - "&teDeum"
