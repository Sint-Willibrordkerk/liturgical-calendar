  lectio6-in-2-loco:
    - Ex libro Moralium sancti Gregorii Papæ.
    - "!Lib. 10. cap. 16. in cap. 12. Job."
    - "Deridétur justi simplícitas. Hujus mundi sapiéntia est, cor
      machinatiónibus tégere, sensum verbis veláre: quæ falsa sunt, vera
      osténdere; quæ vera sunt, falsa demonstráre. Hæc nimírum prudéntia usu a
      juvénibus scitur hæc a púeris prétio díscitur; hanc qui sciunt, céteros
      despiciéndo supérbiunt: hanc qui nésciunt, subjécti et tímidi in áliis
      mirántur: quia ab eis hæc éadem duplicitátis iníquitas nómine palliáta
      dilígitur, dum mentis pervérsitas urbánitas vocátur. Hæc sibi
      obsequéntibus præcipit honórum cúlmina quærere, adépta temporális glóriæ
      vanitáte gaudére, irrogáta ab áliis mala multiplícius réddere: cum vires
      súppetunt, nullis resisténtibus cédere: cum virtútis possibílitas deest,
      quidquid explére per malítiam non valent, hoc in pacífica bonitáte
      simuláre."
  lectio7-in-2-loco:
    - "At contra, sapiéntia justórum est: nil per ostensiónem fíngere, sensum
      verbis aperíre, vera ut sunt dilígere, falsa devitáre; bona gratis
      exhibére, mala libéntius toleráre quam fácere; nullam injúriæ ultiónem
      quærere, pro veritáte contuméliam lucrum putáre. Sed hæc justórum
      simplícitas deridétur; quia ab hujus mundi sapiéntibus puritátis virtus
      fatúitas créditur. Omne enim quod innocénter ágitur, ab eis proculdúbio
      stultum putátur; et quidquid in ópere véritas ápprobat, carnáli sapiéntiæ
      fátuum sonat. Quid namque stúltius vidétur mundo, quam mentem verbis
      osténdere, nil cállida machinatióne simuláre, nullas injúriis contumélias
      réddere, pro maledicéntibus oráre, paupertátem quærere, posséssa
      relínquere, rapiénti non resístere, percutiénti álteram maxíllam præbére?"
  lectio8-in-2-loco:
    - "At contra, sapiéntia justórum est: nil per ostensiónem fíngere, sensum
      verbis aperíre, vera ut sunt dilígere, falsa devitáre; bona gratis
