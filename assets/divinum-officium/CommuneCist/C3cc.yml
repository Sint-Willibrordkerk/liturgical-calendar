officium:
  - Commune Plurium Martyrum Commemoratum
versum-1:
  - V. Exsúltent justi in conspéctu Dei.
  - R. Et delecténtur in lætítia.
ant-1:
  - "Fulgébunt justi: * et tamquam scintíllæ in arundinéto discúrrent.
    Judicábunt natiónes, et regnábunt in ætérnum."
versum-2:
  - "@CommuneCist/C3:Nocturn 1 Versum"
ant-2:
  - "Tradidérunt * córpora sua ad supplícia: ídeo coronántur, et accípiunt
    palmas."
versum-3:
  - "@CommuneCist/C3:Nocturn 1 Versum"
