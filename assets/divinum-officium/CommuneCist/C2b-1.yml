    versum-1:
      - V. Justus germinábit sicut lílium.
      - R. Et florébit in ætérnum ante Dóminum.
    ant-1:
      - "Beátus vir, * qui suffert tentatiónem: quia cum probátus fúerit,
        accípiet corónam vitæ, quam repromísit Deus his, qui díligunt eum."
    invit:
      - "Regem sempitérnum veníte adorémus: * Qui Mártyrem suum coronávit N.."
    ant-matutinum:
      - Beátus vir, * qui in lege Dómini meditátur, volúntas ejus pérmanet die
        ac nocte; et ómnia quæcúmque fáciet, semper prosperabúntur.;;1
      - Beátus * iste Sanctus, qui confísus est in Dómino, prædicávit præcéptum
        Dómini, constitútus est in monte sancto ejus.;;2
      - "Invocántem * exaudívit Dóminus sanctum suum: Dóminus exaudívit eum, et
        constítuit eum in pace.;;4"
      - Scuto bonæ voluntátis * tuæ coronásti eum Dómine.;;5
      - Dómine, * Dóminus noster, quam admirábile est nomen tuum in univérsa
        terra! quia glória et honóre coronásti Sanctum tuum, et constituísti eum
        super ópera mánuum tuárum.;;8
      - "Justus Dóminus, * et justítiam diléxit: æquitátem vidit vultus
        ejus.;;10"
      - "Dómine, * iste Sanctus habitábit in tabernáculo tuo: operátus est
        justítiam tuam, requiéscet in monte sancto tuo.;;14"
      - "Vitam * pétiit a te, et tribuísti ei, Dómine: glóriam et magnum decérem
        imposuísti super eum, posuísti in cápite ejus corónam de lápide
        pretióso.;;20"
      - "Hic accípiet * benedictiónem a Dómino, et misericórdiam a Deo salutári
        suo: quia hæc est generátio quæréntium Dóminum.;;23"
      - Lætábitur justus * in Dómino et sperábit in eo, et laudabúntur omnes
        recti corde;;63
      - Beátus * quem elegísti Dómine, habitábit in átriis tuis;;64
      - "Justus ut palma * florébit: sicut cedrus Líbani multiplicábitur;;91"
      - Nisi granum fruménti * cadens in terram, mórtuum fúerit; ipsum solum
        manet.;;256;257;258
