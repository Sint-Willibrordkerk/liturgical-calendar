    lectio9-in-5-loco:
      - Léctio sancti Evangélii secúndum Joánnem.
      - Jan 12.
      - "In illo témpore: Dixit Jesus discípulis suis: Amen, amen dico vobis,
        nisi granum fruménti cadens in terram, mórtuum fúerit; ipsum solum
        manet. Et réliqua."
      - _
      - Homilía sancti Joánnis Chrysóstomi.
      - Homil. 66. in Joannem.
      - "Dulcis præsens vita est, et multæ plena voluptátis, non tamen ómnibus,
        sed iis tantum qui illi sunt affíxi. Quod si quis in cœlum suspéxerit‚
        et quæ ibi præclára sunt, contemplátus fúerit, statim hanc contémnet, ac
        nullíus prétii existimábit. Nam et córporum pulchritúdo quoad púlchrius
        non deprehénditur‚ in admiratióne habétur: cum vero áliud præstántius
        apparúerit, illa prior despícitur."
    lectio10-in-5-loco:
      - "Quod si illam pulchritúdinem étiam nos intuéri voluérimus, et cœléstis
        regni spéciem consideráre, conféstim nos hujus sæculi vínculis
        dissolvémus. Vinculum namque est terrenárum rerum afféctio: ad cujus
        dissolutiónem ut nos indúceret Christus, quid dicat, atténde. Qui amat
        ánimam suam, perdet eam: et qui odit ánimam suam in hoc mundo‚ in vitam
        ætérnam custódit eam."
    lectio11-in-5-loco:
      - "Ænígmati símile hoc dictum vidétur: non tamen ita est, imo vero
        præcípuæ sapiéntiæ plenum. Et quómodo qui amat ánimam suam, perdet eam?
        Qui absúrdis ejus cupiditátibus obtémperat, qui præter débitum ei
        indúlget; quemádmodum e contrário, qui odit eam in hoc mundo, custódit
        eam: hoc est, qui non paret ei, cum nóxia jubet."
    lectio12-in-5-loco:
      - "Et non dixit, qui non paret sed, qui odit. Sícuti enim quos ódio
        habémus, ne vocem quidem audíre, nec vultum eórum vidére æquo ánimo
        pátimur: ita et ánimæ, si quid præter Dei voluntátem nobis ímperat,
        veheménter aversári opórtet. Cum enim jam de morte ad eos verba factúrus
        esset, de morte vidélicet sua, et prævidéret eórum tristítiam et
        exanimatiónem, per excéssum locútus est, ínquiens: Quid dico, si mortem
        meam generóse non ferétis? nisi vos ipsi moriámini, nullum vos sequétur
        emoluméntum."
    evangelium-in-5-loco:
      - Sequéntia ++ sancti Evangélii secúndum Joánnem.
      - "!Jn 12, 24-26"
      - "In illo témpore: Dixit Jesus discípulis suis: Amen, amen dico vobis,
        nisi granum fruménti cadens in terram, mórtuum fúerit; ipsum solum
        manet. Si autem mórtuum fúerit, multum fructum affert. Qui amat ánimam
        suam, perdet eam: et qui odit ánimam suam in hoc mundo, in vitam ætérnam
        custódit eam. Si quis mihi minístrat, me sequátur: et ubi sum ego, illic
        et miníster meus erit. Si quis mihi ministráverit, honorificábit eum
        Pater meus."
  oratio:
    - "Deus, qui nos beáti N. Mártyris tui atque Pontíficis ánnua solemnitáte
      lætíficas: concéde propítius; ut, cujus natalítia cólimus, de ejúsdem
      étiam protectióne gaudeámus."
    - $Per Dominum
