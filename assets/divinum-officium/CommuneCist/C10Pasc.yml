    lectio-m011:
      - Ex Epístola sancti Ambrósii Epíscopi ad Sirícium Papam
      - "!Ep 42,.n. 4-5"
      - "De via perversitátis prodúntur dícere: Virgo concépit, sed non virgo
        generávit. Pótuit ergo virgo concípere, non pótuit virgo generáre, cum
        semper concéptus præcédat, partus sequátur? Sed, si doctrónis non
        créditur sacerdótum, credátur oráculis Christi; credátur mónitis
        Angelórum dicéntium: Quia non est impossíbile Deo omne verbum; credátur
        Symbólo Apostolórum, quod Ecclésia Romána intemerátum semper custódit et
        servant. Audívit María vocem Angeli, et, quæ ante díxerat: Quómodo fiet
        istud; non de fide generatiónis intérrogans, respóndit póstea: Ecce
        ancílla Dómini, contíngat mihi secúndum verbum tuum."
    lectio-m012:
      - Sermo sancti Leónis, Papæ
      - "!Sermo 22, de Nativ. Dom. 2"
      - Ingréditur hæc mundi ínfima Jesus Christus Fílius Dei, de cælésti sede
        descéndens, et a patérna glória non recédens, novo órdine, nova
        nativitáte generátus. Novo órdine, quia, invisíbilis in suis, visíbilis
        factus est in nostris; incomprehensíbilis, vóluit comprehéndi; ante
        témpora manens, esse cœpit ex témpore. Nova autem nativitáte génitus
        est, concéptus a Vírgine, natus ex Vírgine, sine patérnæ carnis
        concupiscéntia, sine matérnæ integritátis injúria, quia futúrum hòminum
        Salvatórem talis ortus decébat, qui et in se habéret humánæ substántiæ
        natúram, et humánæ carnis inquinaménta nescíret.
    lectio-m013:
      - Sermo sancti Leónis, Papæ
      - "!Sermo 22, de Nativ. Dom. 2"
      - "Salvatóris orígo dissímilis, sed natúra consímilis est: humáno usu et
        consuetúdine caret; sed divína potestáte subníxum est, quod Virgo
        concéperit, quod Virgo pepérerit, quod Virgo permánserit. Opórtuit enim
        ut primam Genetrícis virginitátem nascéntis incorrúptio custodíret, et
        complácitum sibi claustrum pudóris, et sanctátis hospítium divíni
        Spíritus virtus infúsa serváret, qui statúerat deiécta erígere,
        confrácta solidáre, et superándis carnis illécebris multiplicátam
        pudicítiæ donáre virtútem; ut virgínitas, quæ in áliis non póterat salva
        esse generándo, fíeret et in ália imitábilis renascéndo."
    lectio-m014:
      - Sermo sancti Leónis, Papæ
      - "!Sermo 22, de Nativ. Dom. 2"
      - "Hoc ipsum, quod Christus nasci éligit ex Vírgine nonne appáret
        altíssime fuísse ratiónis? Ut scílicet natam humáno géneri salútem
        diábolus ignoráret, et spiritáli latent concéptu, quem non álium
        vidéret, quam álios, non áliter créderet natum esse, quam céteros. Quod
        ut fíeret, concéptus est Christus ex Vírgine, quam Spíritus Sanctus
        fecundávit: et cum in ómnibus mátribus non fiat sine peccáti sorde
        concéptio, hæc inde purgatiónem traxit, unde concépit."
    lectio-m021:
      - Sermo sancti Augustíni Epíscopi
      - "!Sermo 194, n. 3-4, Appd.; inter supposit."
      - "Exsúltat María, et matrem se læta mirátur, et de Spíritu Sancto se
        peperísse gaudet: nec quia péperit innúpta, terrétur; sed quia genúerit,
        cum exsultatióne mirátur. O fémina super féminas benedícta, quæ virum
        omníno non novit, et virum suo útero circúmdedit! Circúmdat virum María
        Angelo fidem dando; quia Eva pérdidit virum serpénti consentiéndo. O
        felix obediéntia! o insígnis grátia! quæ dum fidem humíliter dedit, cæli
        in se opíficem corporávit! Hinc proméruit glóriam, quam ipsa póstmodum
        plausit: Ecce, ait, ex hoc beátam me dicent omnes generatiónes."
    lectio-m022:
      - Sermo sancti Bedæ Venerábilis Presbýteri
      - "!In Homiliary Hiem de Temp. dom. I post Epiph."
      - "Mater Jesu, inquit Evangelísta, conservábat ómnia verba hæc in corde
        suo. Imitémur et nos, fratres mei, piam Dómini Matrem, ipsi quoque ómnia
        verba et facta Dómini ac Salvatóris nostri fixo in corde conservándo.
        Horum Dómini verbórum et actórum meditatióne diúrna et noctúrna
        importúnos inánium nocentiúmque cogitatiónum repellámus incúrsus: horum
        crebra collatióne et nos et próximos nostros a fábulis supervácuis et
        male dulcorátis detractiónum collóquiis castigáre, atque ad divínæ
        frequéntiam laudis accédere curémus. Discámus ergo sanctæ Vírginis in
        ómnibus castitátem, quæ non minus ore pudíca, quam córpore, arguménta
        fidei conservábat in corde."
    lectio-m023:
      - Ex libro Epiphánii Epíscopi advérsos hǽreses
      - "!Lib. 3, 78 post medium"
      - "Heva mortis causa facta est homínibus: per ipsam enim mors ingréssa est
        in mundum: María vero causa vitæ, per quam génita est nobis vita, et per
        hanc Fílius Dei advénit in mundum: et ubi abundávit peccátum, ibi
        superabundávit et grátia: et unde illáta est mors, illinc procéssit et
        vita, ut vita pro morte fíeret: et qui per mulíerem nobis vita factus
        est, mortem ex mulíere indúctam exclúderet. Et quóniam illic Heva, cum
        adhuc esset virgo, per inobediéntiam transgréssa est: e contrário per
        Vírginem obediéntia grátiæ facta est, annuntiáto advéntu in carne de
        cælo, et vita ætérna."
    lectio-m024:
      - Sermo sancti Bernárdi Abbátis
      - "!De laudibus Virg. Matris Homil. 2, n. 3"
      - "Lætáre pater Adam, sed magis tu, o Heva, mater, exsúlta; ambo, inquam
        consolámini super fília, et tali fília. Instat namque tempus, quam jam
        tollátur oppróbrium, nec hábeat vir qui causétur advérsus féminam: qui
        útique, dum se imprudénter exsuráre conarétur, crudéliter illam accusáre
        non cunctátus est, dicens: Múlier quam dedísti mihi, dedit mihi de
        ligno, et comédi. Proptérea curre, Heva, ad Maríam; curre, mater, ad
        fíliam; fília pro matre respóndeat; ipsa pro matre satisfáciat: quia
        ecce si vir cécedit per féminam, jam non erígitur nisi per féminam."
    lectio-m031:
      - Ex libro sancti Irenǽi Epíscopi et Mártyris advérsus hǽreses
      - "!Lib. 5, cap. 19"
      - In sua própria veniénte Dómino, et sua própria eum bajulánte condicióne,
        quæ bajulánte ab ipso, et recapitulatiónem ejus, quæ in ligno fuit
        inobediéntiæ, per eam quæ in ligno est obediéntiam faciénte, et
        seductióne illa solúta, qua sedúcta est male illa, quæ jam viro
        destináta erat virgo Heva, per veritátem evangelizáta est bene ab Angelo
        jam sub viro Virgo María. Quemádmodum enim illa per angélicum sermónem
        sedúcta est, ut effúgeret Deum, prævaricáta verbum ejus ita et hæc per
        angélicum sermónem evangelizáta est, ut portáret Deum, obédiens ejus
        verbo. Et sicut illa sedúcta est, ut effúgeret Deum; sic hæc suása est
        obedíre Deo, ut vírginis Hevæ Virgo Maria fíeret advocáta. Et
        quemádmodum adstríctum est morte genus humánum per vírginem, solvátur
        per Vírginem; æqua lance dispósita virginális inobediéntia, per
        virginálem obediéntiam.
    lectio-m042:
      - Sermo sancti Germáni Epíscopi
      - "!In Dormit. B. Mariæ, homilia 2"
      - "Tutéla tua immortális est, María; et intercéssio, vita; et protéctio
        perpétua. Nisi enim, tu præíres, nemo spiritális eváderet; nemo in
        Spíritu Deum adoráret. Tunc enim spiritális factus est homo, cum tu,
        Deípara Spíritus Sancti habitáculum effécta es: nemo Dei cognitióne
        replétus est nisi per te, o sanctíssima. Nemo salvus nisi per te, o
        Deípara; nemo periculórum expers nisi per te, Virgo parens; nemo
        redémptus nisi per te Dei Mater; nemo domum per misericórdiam
        consecútus, nisi per te, o digna, quæ Deum cáperes. Quis enim tantópere
        peccatóres deféndit? Tu autem, quæ matérna auctoritáte in Deum pólleas,
        étiam iis qui enórmiter peccant, exímian remissiónis gratiam concílias.
        Non enim potes non exaudíri, cum Deus, ut veræ ac intemerátæ Matri suæ,
        quoad ómnia, et per ómnia, et in ómnibus, morem gerat. Hinc mérito,
        afflíctus quisque ad te cónfugit; infírmus tibi adhaéret; bello petítus
        te hóstibus oppónit."
    lectio-m043:
      - De Expositióne sancti Hierónymi Presbýteri in Ezechiélem Prophétam
      - "!Lib.13, cap. 44, v. 1"
      - "Porta hæc clausa erit, et non aperiétur. Pulchre quidam portam clausam,
        per quam solus Dóminus Deus Israël ingréditur, et dux cui porta clausa
        est, Maríam Vírginem intélligunt, quæ et ante partum et post partum
        virgo permánsit. Etenim témpore, quo Angelus loquebátur: Spíritus
        Sanctus véniet super te, et virtus Altíssimi obumbrábit te: quod autem
        nascétur ex te Sanctum, vocábitur Fílius Dei; et quando natus est, virgo
        permánsit ætérna; ad confundéndos eos, qui arbitrántur eam post
        nativitátem Salvatóris habuísse de Joseph fílios, ex occasióne fratrum
        ejus, qui vocántur in Evangélio."
    lectio-m044:
      - Sermo sancti Bernárdi Abbátis
      - "!Sermo in dom. infra oct. Assumpt., n. 2-3"
      - "Quid ad Maríam accédere trépidet humána fragílitas? Nihil austérum in
        ea, nihil terríbile; tota suávis est. Revólve diligéntius evangélicæ
        históriæ sériem univérsam: et si quid forte increpatórium, si quid
        durum, si quod dénique signum vel ténuis indignatiónis occúrrerit in
        María, de cétero suspéctam hábeas, et accédere vereáris. Quod si, ut
        vere sunt, plena magis ómnia pietátis et grátiæ, plena mansuetúdinis et
        misericórdiæ, quæ ad eam pértinent, invéneris, age grátias ei, qui talem
        tibi mediatrícem benigníssima miseratione provídit, in qua nihil possit
        esse suspéctum. Dénique ómnibus ómnia facta est, sapiéntibus et
        insipiéntibus copiosíssima caritáte debitrícem se fecit. Omnibus
        misericórdiæ sinum ejus áperit, ut de plenitúdine ejus accípiant
        univérsi, captívus redemptiónem, æger curatiónem, tristis consolatiónem,
        peccátor véniam, justus grátiam, Angelus lætítiam. Ipsa prætérita non
        díscutit mérita, sed ómnibus sese exorábilem, ómnibus clementíssimam
        præbet, ómnium dénique necessitátes amplíssimo quodam miserátur
        afféctu."
    lectio-m051:
      - "@Commune/C10:Lectio M02:s/.&teDeum//s"
    lectio-m052:
      - Ex Tractátu S. Augustini Epíscopi de Sýmbolo ad Catechúmenos
      - "!Sermo 3, c. 4 in fine Inter supposit."
      - "Per féminam mors, per féminam vita: per Hevam intéritus, per Mariam
        salus. Illa, corrúpta, secúta est seductórem: hæc, íntegra, péperit
        Salvatórem. Illa póculum a serpénte propinátum libénter accépit et viro
        trádidit, ex quo simul mereréntur occídi: hæc, grátia cælésti désuper
        infúsa, vitam prótulit, per quam caro mortua possit resuscitári. Quis
        est qui hæc operátus est, nisi Vírginis Fílius et vírginum Sponsus, qui
        áttulit Matri fecunditátem, sed non ábstulit integritátem?"
    lectio-m053:
      - Sermo sancti Cyrílli Epíscopi Alexandríni
      - "!Hom. contra Nestorium"
      - "Sit tibi, sancta Dei Mater, laus. Mater et Virgo, inter mulíeres; ejus
        parens, qui benedíctus venit in nómine Dómini. Per te Trínitas
        sanctificátur: per te Crux pretiósa celebrátur et adorátur in toto orbe
        terrárum. Per te exsúltat cælum, lætántur Angeli et Archángeli, fugántur
        dǽmones, et homo ipse ad cælum revocátur. Per te omnis creatúra idolórum
        erróre deténta, convérsa est ad agnitiónem veritátis, et fidéles hómines
        ad sanctum Baptísma pervenérunt, atque in toto orbe terrárum constrúctæ
        sunt ecclésiæ. Te adiutríce, gentes véniunt ad pæniténtiam. Per te
        unigénitus Dei Fílius, vera illa lux, effúlsit sedéntibus in ténebris et
        umbra mortis."
    lectio-m054:
      - Sermo sancti Bernárdi Abbátis
      - "!De laudibus Virginis Matris Hom. 1, n. 7-8"
      - Miráre ergo utrúmlibet, et élige quid ámplius miréris, sive Fílii
        benigníssimam dignatiónem, sive Matris excellentíssimam dignitátem.
        Utrínque stupor, utrínque miráculum. Et quod Deus féminæ obtémperet,
        humílitas absque exémplo; et quod Deo fémina principétur, sublímitas
        sine sócio. In láudibus vírginum singuláriter cánitur quod sequúntur
        Agnum quocúmque íerit. Quibus ergo láudibus júdicas dignam, quæ étiam
        præit? Disce, homo, obedíre; disce, terra, subdi; disce, pulvis,
        obtemperáre. De auctóre tuo loquens Evangelísta. Et erat, inquit,
        súbditus illis; haud dubium quin Maríæ et Joseph. Erubésce, supérbe
        cinis! Deus se humíliat, et tu te exáltas? Deus se homínibus subdit, et
        tu, dominári géstiens homínibus, tuo te præpónis auctóri?
    lectio-m061:
      - Sermo sancti Bernárdi Abbáti
      - "!Sermo in dom. infra oct. Assumpt., n. 1"
      - Veheménter quidem nobis, dilectíssimi, vir unus et múlier una nocuére;
        sed, grátias Deo, per unum nihilóminus virum et mulíerum unam ómnia
        restaurántur, nec sine magno fǽnore gratiárum. Neque enim sicut
        delíctum, ita et donum; sed excédit damni æstimatiónem benefícii
        magnitúdo. Sic nimírum prudentíssimus et clementíssimus ártifex, quod
        quassátum fúerat, non confrégit, sed utílius omníno refécit, ut
        vidélicet nobis novum formáret Adam ex véteri, Hevam transfúnderet in
        Maríam.
    lectio-m062:
      - Sermo sancti Bernárdi Abbátis
      - "!De laudibus Virginis Matris Hom. 1, n. 9"
      - "Felix María, cui nec humílitas défuit, nec virgínitas! Et quidem
        singuláris virgínitas, quam non temerávit, sed honorávit fecúnditas. Et
        nihilóminus speciális humílitas, quam non ábstulit, sed éxtulit fecúnda
        virgínitas: et incomparábilis prorsus fecúnditas, quam virgínitas simul
        comitátur et humílitas. Quid horum non mirábile? quid non incomparábile?
        quid non singuláre? Mirum vero, si non hǽsitas, in horum ponderatióne,
        quid tua júdices dignius admiratióne, utrum vidélicet pótius stupénda
        sit fecúnditas in Vírgine, an in Matre intégritas: sublímitas in prole,
        an cum tanta sublimitáte humílitas: nisi quod indubitánter horum
        síngulis præferénda sunt simul cuncta, et incomparabíliter excelléntius
        est atque felícius ómnia percepísse, quam áliqua. Et quid mirum, si
        Deus, qui mirábilis cérnitur, et légitur in Sanctis suis, mirabiliórem
        se exhíbuit in Matre sua? Venerámini ergo, cónjuges, in carne
        corruptíbili carnis integritátem: vos sacræ vírgines in Vírgine
        fecunditátem. Imitámini, omnes hómines, Dei Matris humilitátem."
    lectio-m063:
      - Sermo sancti Augustíni Epíscopi
      - "!Serm. 18 de Sanctis, n. 5"
      - "O beáta María, quis tibi digne váleat jura gratiárum ac laudum præcónia
        repéndere, quæ singulári tuo assénsu mundo succurrísti pérdito? Quas
        tibi laudes fragílitas humáni géneris persólvat, quæ solo tuo commércio
        recuperándi áditum invénit? Accipe ítaque quascúmque exíles, quascúmque
        méritis tuis ímpares gratiárum actiónes: et cum suscéperis vota, culpas
        nostras orándo excúsa. Admítte nostras preces intra sacrárium
        exauditiónis et repórta nobis antídotum reconciliatiónis."
    lectio-m064:
      - Sermo sancti Augustíni Epíscopi
      - "!Serm. 18 de Sanctis, n. 5"
      - "Sit per te excusábile quod per te ingérimus; fiat impetrábile quod fida
        mente póscimus. Accípe quod offérimus, redóna quod rogámus, excúsa quod
        timémus, quia tu es spes única peccatórum. Per te sperámus véniam
        delictórum et in te, beatíssima, nostrórum est expectátio præmiórum.
        Sancta María, succúrre míseris; juva pusillánimes; réfove flébiles; ora
        pro pópulo; intérveni pro clero; intercéde pro devóto femíneo sexu:
        séntiant omnes tuum juvámen, quicúmque célebrant tuam sanctam
        commemoratiónem."
    lectio-m071:
      - "@Commune/C10:Lectio M07:s/.&teDeum//s"
    lectio-m072:
      - Ex libro sancti Ambrósii Epíscopi de Virgínibus
      - "!Lib 2, cap 2, n. 6-7"
      - "Sit vobis tamquam in imágine descrípta virgínitas vitáque beátæ: Maríæ,
        de qua, velut in spéculo, refúlget spécies castitátis et forma virtútis.
        Hinc sumátis licet exémpla vivéndi, ubi tamquam in exemplári, magistéria
        expréssa probitátis, quid corrígere, quid effúgere, quid tenére
        debeátis, osténdunt. Primus discéndi ardor nobílitas est magístri. Quid
        nobílius Dei Matre? Quid splendídius ea, quam splendor elégit? Quid
        cástius ea, qua: corpus sine córporis contagióne generávit? Nam de
        céteris ejus virtútibus quid loquar? Virgo erat non solum córpore, sed
        etiam mente, qua: nullo doli ámbitu sincérum adulteráret afféctum."
    lectio-m073:
      - Sermo sancti Bedæ Venerábilis Presbýteri
      - "!In festo Visit. B.M.V., Hom. 2"
      - Magníficat ánima mea Dóminum; et exultávit spíritus meus in Deo salutári
        meo. Quæ cum ómnibus perféctis verba recte convéniant, máxime tamen ea
        beátam Dei Genitrícem proférre decébat, quæ mériti privilégio singuláris
        spirituáli ipsíus dilectióne flagrábat, cujus corporáli conceptióne
        gaudébat. Quæ jure in Jesu, id est, in salutári suo speciáli præ céteris
        sanctis gáudio pótuit exultáre, quia quem perpétuum salútis auctórem
        nóverat, hunc ipsum temporáli ortu de carne sua nascitúrum esse sciébat
        quátenus in una eadémque persóna veráciter suus et filius esset et
        Dóminus.
    lectio-m074:
      - Sermo sancti Bedæ Venerábilis Presbýteri
      - "!In festo Visit. B.M.V., Hom. 2"
      - "Quam vília de seípsa sénserit édocet, et quod omne quidquid boni mériti
        hábuit, hoc supérna grátia largiénte percéperit, dicens: Quia respéxit
        humilitátem ancíllæ suæ: ecce enim ex hoc beátam me dicent omnes
        generatiónes. Húmilem quippe Christi ancíllam suo judício se fuisse
        demónstrat, sed respéctu se grátiæ celéstis repénte sublimátam
        pronúntiat, atque in tantum glorificátam, ut sua beatitúdo præcípua
        mérito cunctárum géntium voce mirétur. Addidit étiam adhuc divínæ
        pietátis múnera, quæ mirabíliter accépit, digna gratiárum actióne
        colláudans. Quia fecit mihi magna qui potens est, et sanctum nomen ejus.
        Nihil ergo suis méritis tríbuit, quæ totam magnitúdinem ad illíus donum
        refert, qui essentiáliter potens et magnus exístens, fidéles suos de
        parvis atque infírmis fortes fácere consuévit, et magnos."
    lectio-m081:
      - "@Commune/C10:Lectio M08:s/.&teDeum//s"
    lectio-m082:
      - "@Sancti/08-22t:Lectio4"
    lectio-m083:
      - Sermo sancti Bernárdi Abbátis
      - "!Sermo 4 de Assumpionis n. 1"
      - "Tempus loquéndi est omni carni, cum assúmitur incarnáti Verbi Mater in
        cælum, nec cessáre debet a láudibus humána mortálitas, cum hóminis sola
        natúra supra immortáles spíritus exaltátur in Vírgine. Sed de ejus
        glória nec silére devótio pátitur, nec dignum áliquid stérilis concípere
        cogitátio, aut inerrudíta potest locútio parturíre. Hinc est, quod et
        ipsi cæléstis cúriæ príncipes in consideratióne tantæ novitátis clamant
        non sine admiratióne: Quæ est ista, quæ ascéndit de desérto delíciis
        áffluens? Quidni delícias díxerim, virginitátis decus cum múnere
        fecunditátis, humilitátis insígne distillántem caritátis favum,
        misericórdiæ víscera, plentitúdinem grátiæ, prærogatívam glóriæ
        singuláris?"
    lectio-m084:
      - Sermo sancti Bernárdi Abbátis
      - "!Sermo 4 de Assumpionis"
      - "Ascéndens de desérto Regína mundi, étiam Angelis sanctis, ut canit
        Ecclésia, speciósa facta est, et suávis in delíciis suis. Désinant tamen
        desérti hujus mirári delícias, quia Dóminus dedit benignitátem, et terra
        nostra dedit fructum suum. Quid mirántur, de terra desérta Maríam
        ascéndere delíciis affluéntem? Miréntur pótius páuperem Christum de
        cæléstis regni plenditúdine descendéntem; longe enim amplióri miráculo
        dignum vidétur, Dei Fílium paulo minus ab Angelis minorári, quam Dei
        Matrem super Angelos exaltári. Illíus síquidem exinanítio, facta est
        replétio nostra: illíus misériæ, mundi delíciæ sunt. Dénique, cum dives
        esset, propter nos pauper factus est, ut nos ejus inópia ditarémur."
    lectio-m091:
      - "@Commune/C10:Lectio M09:s/.&teDeum//s"
    lectio-m092:
      - Sermo sancti Petri Chrysólogi
      - "!De Annuntiat., Sermo 142"
      - "Beáta María Virgo, inter hómines audíre sola méruit præ ómnibus:
        invenísti grátiam. Quantam? Quantam díxerat: plenam. Et vere plenam, quæ
        largo imbre totam fúnderet et infúnderet creatúram: invenísti enim
        grátiam apud Deum. Hæc cum dicit, et ipse Angelus mirátur, aut féminam
        tantum, aut omnes hómines vitam meruísse per féminam: stupet Angelus,
        totum Deum veníre intra virginális úteri angústias, cui tota simul
        angústa est creatúra. Hinc est, quod remorátur Angelus, hinc est, quod
        vírginem vocat de mérito, de grátia compéllat, vix causam prodit
        audiénti, sane ut sensum promóveat, vix longa trepidatióne compónit."
    lectio-m093:
      - Sermo sancti Bernárdi Abbátis
      - "!Sermo in dom. infra oct. Assumpt., n. 13"
      - "Cum in sua æstimatióne tam húmilis esset María, nihilóminus et in
        promissiónis credulitáte magnánimis, ut quæ nihil áliud quam exíguam
        sese reputábat ancíllam, ad incomprehensíbile hoc mystérium nullátenus
        se dubitáret eléctam, et veram Dei et hóminis Genetrícem créderet mox
        futúram. Agit hoc nimírum in córdibus electórum grátiæ prærogatíva
        divínæ, ut eos nec humílitas pusillánimes fáciat, nec magnanímitas
        arrogántes: magis autem cooperéntur sibi, ut non solum nulla ex
        magnanimitáte subíntret elátio, sed hinc máxime provehátur humílitas: ut
        inveniántur eo ámplius timoráti, et largitóri múnerum non ingráte, ac
        vicíssim ex occasióne humilitátis pusillanímitas nulla subrépat; sed quo
        minus de sua quisque vel in mínimis præsúmere consuévit, eo ámplius
        étiam in magnis quibúsque de divína virtúte confídant."
    lectio-m094:
      - Sermo sancti Bernárdi Abbátis
      - "!Sermo in dom. infra oct. Assumpt., n. 11-12"
      - Obsecro vos, filíoli, æmulámini mansuetúdinem, si Maríam dilígitis; si
        conténditis ei placére, æmulámini modéstiam ejus. Nihil enim tam idóneum
        hómini, nihil tam cóngruum christiáno, maximésque mónachum nihil adeo
        decet. Et quidem manifésta satis in Vírgine ex hac ipsa manuetúdine
        virtus humilitátis elúcet. Nimírum collactáneæ sunt humílitas et
        manuetúdo. Sicut enim mater præsumptiónis elátio, sic manuetúdo vera
        nonnísi ex vera humilitáte procédit.
    lectio-m101:
      - "@Commune/C10:Lectio M10:s/.&teDeum//s"
    lectio-m102:
      - Sermo sancti Bernárdi Abbátis
      - "!De laudibus Virginis Matris Hom. 2, n. 4-5"
      - "Cui serváta est victória, nisi Maríæ? Ipsa procul dúbio caput contrívit
        venenátum, quæ omnímodam malígni suggestiónem tam de carnis illécebra,
        quam de mentis supérbia dedúxit ad níhilum. Quam vero áliam Sálomon
        requirébat, cum dicébat: Mulíerem fortem quis invéniet? Nóverat quippe
        vir sápiens hujus sexus infirmitátem, frágile corpus, lúbricam mentem.
        Quia tamen et Deum légerat promisísse, et ita vidébat congrúere, ut qui
        vícerat per féminam, vincerétur per ipsam, veheménter admírans ajébat:
        Mulíerem fortem quis invéniet? Quod est dícere: Si ita de manu féminæ
        pendet et nostra ómnium salus, et innocéntiæ restitútio, et de hoste
        victória; fortis omníno necésse est ut provideátur, quæ ad tantum opus
        possit esse idónea."
    lectio-m103:
      - Sermo sancti Bernárdi Abbátis
      - "!In Nativ. B.M.V., n. 7-8"
      - "Totis ergo medúllis córdium, totis præcordiórum afféctibus, et votis
        ómnibus Maríam hanc venerémur; quia sic est volúntas ejus, qui totum nos
        habére vóluit per Maríam. Hæc, inquam, volúntas ejus est, sed pro nobis.
        Filíoli, hæc peccatórum scala, hæc mea máxima fidúcia est, hæc tota
        rátio spei meæ. Quid enim? Potéstne Fílius aut repéllere, aut sustinére
        repúlsam? Non audíre, aut non audíri Fílius potest? Neutrum plane.
        Invenísti, ait Angelus, grátiam apud Deum. Felíciter. Semper hæc
        invéniet grátiam, et sola est grátia qua egémus; nimírum sola est
        grátia, qua salvámur. Quid nos ália concupíscimus, fratres? Quærámus
        grátiam, et per Maríam quærámus, quia quod quærit, ínvenit, et frustrári
        non potest. Quærámus grátiam, sed grátiam apud Deum: nam apud hómines
        grátia fallax. Quærant álii méritum, nos inveníre grátiam studeámus.
        Quid enim? Num grátiæ est quod hic sumus? Profécto misericórdiæ Dómini
        est, quod non sumus consúmpti nos."
    lectio-m104:
      - Sermo sancti Bernárdi Abbátis
      - "!De laudibus Virginis Matris Hom. 2, n. 3"
      - "Quid dicébas, o Adam? Múlier quam dedísti mihi, dedit mihi de ligno, et
        comédi. Verba malítiæ sunt hæc, quibus magis áugeas quam déleas culpam.
        Verúmtamen Sapiéntia vicit malítiam. Rédditur nempe fémina pro fémina,
        prudens pro fátua, húmilis pro supérba; quæ pro lingo mortis gustum tibi
        pórrigat vitæ, et pro venenóso cibo illo amaritúdinis, dulcédinem páriat
        fructus ætérni. Muta ergo iníque excusatiónis verbum in vocem gratiárum
        actiónis, et dic: Dómine, múlier quam dedísti mihi, dedit me de ligno
        vitæ, et comédi; et dulce factum est super mel ori meo, quia in ipso
        vivificásti me. Ecce enim ad hoc missus est Angelus ad Vírginem. O
        admirándam et omni honóre digníssimam Vírginem! O féminam venerándam,
        super omnes féminas admirábilem, paréntum reparatrícem, posterórum
        vivificatrícem!"
    lectio-m111:
      - "@Commune/C10:Lectio M11:s/.&teDeum//s"
    lectio-m112:
      - Sermo sancti Sophrónii Epíscopi
      - "!Homilia in Deiparæ Annunt."
      - Quisnam tuum éloqui splendórem póterit? Quisnam porténtum, quod ipsa es,
        enarráre verbis áudeat? Quisnam magnificéntiam tuam effári se posse
        confídet? Tu hóminum exornásti natúram; tu Angelórum órdines superásti;
        tu fulgóres Archangelórum obtenebrásti; dénique omnem creatúram longe
        transgréssa es; quippe quæ præ omni creatúra enituísti puritáte; et
        ómnium creaturárum Conditórem in te excepísti; ipsúmque et sinu tuo
        gestásti, et genuísti; et sola ex ómnibus creatúris Dei Mater effécta
        es.
    lectio-m113:
      - Sermo sancti Sophrónii Epíscopi
      - "!Homilia in Deiparæ Annunt."
      - "@Sancti/12-14bmv:Lectio9:s/Et mérito quidem; nemo enim sicut tu,/v.
        Nemo enim sicut tu, María,/ s/Et proptérea .*//s"
    lectio-m114:
      - "@Commune/C10:Lectio M12:s/.&teDeum//s"
    lectio-m121:
      - Sermo sancti Bernárdi Abbátis
      - "!De laudibus Virginis Matris Hom. 2, n. 4"
      - "Missus est Angelus ad Vírginem; vírginem carne, vírginem mente,
        vírginem professióne, vírginem dénique, qualem descríbit Apóstolus,
        mente et córpore sanctam; nec nóviter, nec fortuíto invéntam, sed a
        sǽculo eléctam, ab Altíssimo præcógnitam, et sibi præparátam, ab Angelis
        servátam, a Pátribus præsignátam, a Prophétis promíssam. Ut pauca loquar
        de plúribus, quam tibi áliam prædixísse Deus vidétur, quando ad
        serpéntem ait: Inimicítias ponam inter te et mulíerem? Et si adhuc
        dúbitas an de María díxerit, audi quod séquitur: Ipsa cónteret caput
        tuum. Cui hæc serváta victória est, nisi Maríæ?"
