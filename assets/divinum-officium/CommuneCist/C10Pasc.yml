  lectio1:
    - De Cánticis canticórum
    - "!Cant 2:1-7"
    - 1 Ego flos campi et lílium convállium.
    - 2 Sicut lílium inter spinas, sic amíca mea inter fílias.
    - 3 Sicut malus inter ligna silvárum, sic diléctus meus inter fílios. Sub
      umbra illíus quem desideráveram sedi, et fructus ejus dulcis gútturi meo.
    - 4 Introdúxit me in cellam vináriam, ordinávit in me caritátem.
    - 5 Fulcíte me flóribus, stipáte me malis, quia amóre lángueo.
    - 6 Læva ejus sub cápite meo, et déxtera illíus amplexábitur me.
    - 7 Adjúro vos, fíliæ Jerúsalem, per cápreas cervósque campórum, ne
      suscitétis neque evigiláre faciátis diléctam, quoadúsque ipsa velit.
  lectio2:
    - Sermo sancti Bernárdi Abbátis.
    - "!Ex Serm. 2. de Virgine Deipara‚ alias, de Aquæductu."
    - "Altius intuémini, fratres mei, quanto devotiónis afféctu a nobis Mariam
      volúerit honorári, qui totius boni plenitúdinem pósuit in María: ut
      proinde si quid spei in nobis est, si quid grátiæ, si quid salútis, ab ea
      novérimus redundáre, quæ ascéndit delíciis áffluens. Hortus plane
      deliciárum, quem non modo affláverit véniens‚ sed et perfláverit
      supervéniens auster ille divínus, ut úndique fluant et áffluant arómata
      ejus‚ charísmata scílicet gratiárum."
  responsory2:
    - "R. Beáta es, Virgo María, quæ Dóminum portásti, Creatórem mundi:"
    - "* Genuísti qui te fecit, et in ætérnum pérmanes Virgo."
    - V. Ave, María, grátia plena; Dóminus tecum.
    - R. Genuísti qui te fecit, et in ætérnum pérmanes Virgo.
    - "&Gloria"
    - R. Genuísti qui te fecit, et in ætérnum pérmanes Virgo.
  lectio3:
    - "Tolle corpus hoc soláre, quod illúminat mundum, ubi dies? Tolle Mariam
      hanc maris stellam, maris útique magni et spatiósi, quid nisi calígo
      invólvens, et umbra mortis, ac densíssimæ ténebræ relinquúntur? Totis ergo
      medúllis córdium, totis præcordiórum afféctibus‚ et votis ómnibus Mariam
      hanc venerémur: quia sic est volúntas ejus, qui totum nos habére vóluit
      per Maríam."
