  ant-matutinum:
    - O quam pulchra * est casta generátio cum claritáte!;;8
    - Nigra sum, * sed formósa, fíliæ Jerúsalem; ídeo diléxit me Rex, et
      introdúxit me in cubículum suum.;;18
    - Pulchra es * et decóra fília Jerúsalem, terríbilis ut castrórum ácies
      ordináta.;;23
    - Spécie tua * et pulchritúdine tua inténde, próspere procéde, et regna.;;44
    - "Adjuvábit eam * Deus vultu suo: Deus in médio ejus, non commovébitur.;;45"
    - Hæc est quæ nescívit, * thorum in delícto, habébit fructum in respectióne
      animárum sanctárum.;;47
    - Unguéntum effúsum * nomen tuum; ideo adolescéntulæ dilexérunt te nimis.;;84
    - Revértere, * revértere, Sunamítis; revértere, ut intueámur te.;;86
    - Dum esset Rex * in accúbitu suo, nardus mea dedit odórem suum.;;95
    - "Símile est * regnum cælórum hómini negotiatóri quærénti bonas margarítas:
      invénta una pretiósa, dedit ómnia sua, et comparávit eam.;;96"
    - Veniénte sponso, * prudens Virgo præparáta introívit cum eo ad núptias.;;97
    - Veni * elécta mea, et ponam in te thronum meum, quia concupívit Rex
      spéciem tuam.;;98
    - "Prudéntes Vírgines, * aptáte vestras lámpades: ecce sponsus venit, exíte
      óbviam ei.;;249;250;251"
