oratio:
  - "Indulgéntiam nobis, quǽsumus, Dómine, beáta N. Virgo et Martyr implóret:
    quæ tibi grata semper éxstitit, et mérito castitátis, et tuæ professióne
    virtútis."
  - $Per Dominum
