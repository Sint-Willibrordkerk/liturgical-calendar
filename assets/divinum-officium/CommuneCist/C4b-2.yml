      - "* Et ad portas paradísi coronávit eum."
      - V. Induit eum Dóminus lorícam fídei, et ornávit eum.
      - R. Et ad portas paradísi coronávit eum.
    lectio8:
      - Quantos, per longam incúriam peccáto labe resolútos et quadam lepræ
        contgióne perfúsos, castigatiónibus et exhortatiónibus expiándo, Deo in
        se operánte, mundávit? Quantórum ánimas, vivéntes in córpore jam
        defúnctas et delictórum mole óbrutas ac sepúltas, ad emendatiónem
        tamquam ad lucem vocándo, Deo esuscitávit; ut, Dómini sui admirándus
        imitátor, jam mórtuas Deo, e contrário mortíficet, vitáli morte,
        peccáto?
    responsory8:
      - R. Fidélis namque, ac prudens dispensátor in magni patrisfamílias domo
        constitútus erat,
      - "* Ut consérvis suis in témpore mensúram trítici erogáret."
      - "V. Pro salúte, et augménto gregis sibi commíssi cura pervígili
        sollícitus erat:"
      - R. Ut consérvis suis in témpore mensúram trítici erogáret.
