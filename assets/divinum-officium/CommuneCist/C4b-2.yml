    lectio1-in-3-loco:
      - De Epístola beáti Pauli Apóstoli ad Titum.
      - "!Cap. 1: 7-9"
      - "7 Opórtet Epíscopum sine crímine esse, sicut Dei dispensatórem: non
        supérbum, non iracúndum, non vinoléntum, non percussórem, non turpis
        lucri cúpidum:"
      - 8 sed hospitálem, benígnum, sóbrium, justum, sanctum, continéntem,
      - "9 amplecténtem eum, qui secúndum doctrínam est, fidélem sermónem: ut
        potens sit exhortári in doctrína sana, et eos, qui contradícunt‚
        argúere."
    lectio2-in-3-loco:
      - "!Cap. 1: 10-11,13-14"
      - "10 Sunt enim multi étiam inobediéntes vaníloqui, et seductóres: máxime
        qui de circumcisióne sunt:"
      - "11 quos opórtet redárgui: qui univérsas domos subvértunt, docéntes quæ
        non opórtet‚ turpis lucri grátia."
      - 13 Quam ob causam íncrepa illos dure, ut sani sint in fide,
      - 14 non intendéntes Judáicis fábulis, et mandátis hóminum, aversántium se
        a veritáte.
    lectio3-in-3-loco:
      - "!Cap. 2, 1-6"
      - "1 Tu autem lóquere quæ decent sanam doctrínam:"
      - "2 Senes ut sóbrii sint, pudíci, prudéntes, sani in fide, in dilectióne,
        in patiéntia:"
      - "3 Anus simíliter in hábitu sancto, non criminatríces, non multo vino
        serviéntes, bene docéntes:"
      - 4 ut prudéntiam dóceant adolescéntulas, ut viros suos ament, fílios suos
        díligant,
      - "5 prudéntes, castas, sóbrias, domus curam habéntes, benígnas, súbditas
        viris suis, ut non blasphemétur verbum Dei:"
      - 6 Júvenes simíliter hortáre ut sóbrii sint.
    lectio4-in-3-loco:
      - "!Cap. 2,7-8;3,8"
      - 7 In ómnibus teípsum præbe exémplum bonórum óperum, in doctrína, in
        integritáte, in gravitáte,
      - "8 verbum sanum, irreprehensíbile: ut is, qui ex advérso est, vereátur,
        nihil habens malum dícere de nobis."
      - "8 Fidélis sermo est: et de his volo te confirmáre: ut curent bonis
        opéribus præésse qui credunt Deo. Hæc sunt bona, et utília homínibus."
