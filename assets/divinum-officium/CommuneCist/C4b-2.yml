    responsory11:
      - "R. Beátus vir, qui invéntus est sine mácula, et qui post aurum non
        ábiit, nec sperávit in thesáuris pecúniæ:"
      - "* Ideo stabilíta sunt bona ipsíus in Dómino."
      - V. Pótuit enim tránsgredi, et non est transgréssus; fácere mala, et non
        fecit.
      - R. Ideo stabilíta sunt bona ipsíus in Dómino.
    lectio12:
      - "Sed is, qui quinque talénta accéperat, ália quinque lucrátus est: quia
        sunt nonnúlli, qui, etsi intérna ac mýstica penetráre nésciunt, pro
        intentióne tamen supérnæ pátriæ docent recta quos possunt; de ipsis
        exterióribus, quæ accepérunt, duplum taléntum portant; dumque se a
        carnis petulántia et a terrenárum rerum ámbitu atque a visibílium
        voluptáte custódiunt, ab his étiam álios admonéndo compéscunt. Et sunt
        nonnúlli, qui, quasi duóbus taléntis ditáti, intelléctum atque
        operatiónem percípiunt, subtília de intérnis intélligunt, mira in
        exterióribus operántur; cumque et intelligéndo et operándo áliis
        prǽdicant, quasi duplicátum de negótio lucrum repórtant."
      - "&teDeum"
    responsory12:
      - "R. Sint lumbi vestri præcíncti, et lucérnæ ardéntes in mánibus vestris:"
