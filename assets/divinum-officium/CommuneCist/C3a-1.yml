  rule:
    - Antiphonas horas
  ant-vespera:
    - Omnes Sancti, * quanta passi sunt torménta, ut secúri pervenírent ad
      palmam martýrii.
    - Cum palma * ad regna pervenérunt Sancti, corónas decóris meruérunt de manu
      Dei.
    - "Córpora Sanctórum * in pace sepúlta sunt: et vivent nómina eórum in
      ætérnum."
    - Mártyres Dómini * Dóminum benedícite in ætérnum.
    - Mártyrum chorus * laudáte Dóminum de cælis, allelúja.
  versum-1:
    - V. Justi in perpétuum vivent.
    - R. Et apud Dóminum est merces eórum.
  ant-1:
    - Isti sunt sancti * qui pro testaménto Dei sua córpora tradidérunt, et in
      sánguine Agni lavérunt stolas suas.
  invit:
    - Regem Mártyrum Dóminum, * Veníte, adorémus.
  ant-matutinum:
    - Secus decúrsus aquárum * plantávit víneam justórum, et in lege Dómini fuit
      volúntas eórum.;;1
    - Prædicántes * præcéptum Dómini constitúti sunt in monte sancto ejus.;;2
    - In lege Dómini * fuit volúntas ejus die ac nocte.;;1
    - Prǽdicans * præcéptum Dómini constitútus est in monte sancto ejus.;;2
    - "Voce mea * ad Dóminum clamávi: et exaudívit me de monte sancto suo.;;3"
    - Fílii hóminum * scitóte quia Dóminus sanctum suum mirificávit.;;4
    - Scuto bonæ voluntátis * tuæ coronásti eum Dómine.;;5
    - In univérsa terra * glória et honóre coronásti eum.;;8
    - "Justus Dóminus, * et justítiam diléxit: æquitátem vidit vultus ejus.;;10"
    - "Habitábit * in tabernáculo tuo: requiéscet in monte sancto tuo.;;14"
    - Posuísti, Dómine, * super caput ejus corónam de lápide pretióso.;;20
    - "Læténtur omnes, * qui sperant in te, Dómine, quóniam tu benedixísti
      justis: scuto bonæ voluntátis tuæ coronásti eos.;;5"
    - In lege Dómini * fuit volúntas ejus die ac nocte.;;1
    - Prǽdicans * præcéptum Dómini constitútus est in monte sancto ejus.;;2
    - "Voce mea * ad Dóminum clamávi: et exaudívit me de monte sancto suo.;;3"
    - Fílii hóminum * scitóte quia Dóminus sanctum suum mirificávit.;;4
    - Scuto bonæ voluntátis * tuæ coronásti eum Dómine.;;5
    - In univérsa terra * glória et honóre coronásti eum.;;8
    - "Justus Dóminus, * et justítiam diléxit: æquitátem vidit vultus ejus.;;10"
    - "Habitábit * in tabernáculo tuo: requiéscet in monte sancto tuo.;;14"
    - Posuísti, Dómine, * super caput ejus corónam de lápide pretióso.;;20
    - Sanctis, qui in terra sunt ejus, * mirificávit omnes voluntátes meas inter
      illos.;;15
    - Si coram homínibus * torménta passi sunt, spes electórum est immortális in
      ætérnum.
    - Tamquam aurum in fornáce * probávit eléctos Dóminus, et quasi holocáusti
      hóstiam accépit illos.
    - Istórum est enim * regnum cœlórum, qui contempsérunt vitam mundi, et
      pervenérunt ad præmia regni, et lavérunt stolas suas in sánguine Agni.
    - Via Justórum * recta facta est, et iter Sanctórum præparátum est.
    - Justi autem * in perpétuum vivent, et apud Dóminum est merces eórum.;;32
    - Justórum autem ánimæ * in manu Dei sunt, et non tanget illos torméntum
      mortis.;;33
    - Fulgébunt justi * sicut sol in regno Patris eórum, allelúia.;;45
    - Secus decúrsus aquárum * plantávit víneam justórum, et in lege Dómini fuit
      volúntas eórum.;;1
    - "Tamquam aurum * in fornáce probávit eléctos Dóminus: et quasi holocáusta
      accépit eos in ætérnum.;;2"
    - Si coram homínibus * torménta passi sunt, spes electórum est immortális in
      ætérnum.;;3
    - Dabo Sanctis meis * locum nominátum in regno Patris mei, dicit Dóminus.;;14
    - Sanctis, qui in terra sunt ejus, * mirificávit omnes voluntátes meas inter
      illos.;;15
    - Sancti qui sperant in Dómino, * habébunt fortitúdinem, assúment pennas ut
      áquilæ, volábunt, et non defícient.;;23
    - Justi autem * in perpétuum vivent, et apud Dóminum est merces eórum.;;32
    - "Tradidérunt * córpora sua in mortem, ne servírent idólis: ídeo coronáti
      póssident palmam.;;33"
    - "Ecce merces * Sanctórum copiósa est apud Deum: ipsi vero mórtui sunt pro
      Christo, et vivent in ætérnum.;;45"
    - Isti sunt Sancti, * qui pro testaménto Dei sua córpora tradidérunt, et in
      sánguine Agni lavérunt stolas suas.;;109
    - Sancti per fidem * vicérunt regna, operáti sunt justítiam, adépti sunt
      repromissiónes.;;110
    - "Sanctórum velut áquilæ * juvéntus renovábitur: florébunt sicut lílium in
      civitáte Dómini.;;111"
    - "Abstérget Deus * omnem lácrimam ab óculis Sanctórum: et jam non erit
      ámplius neque luctus, neque clamor, sed nec ullus dolor: quóniam prióra
      transiérunt.;;112"
    - In cæléstibus regnis * Sanctórum habitátio est, et in ætérnum réquies
      eórum.;;115
    - "Isti sunt Sancti, * qui pro Christi amóre minas hóminum contempsérunt:
      sancti Mártyres in regno cælórum exsúltant cum Angelis. O quam pretiósa
      est mors Sanctórum, qui assídue assístunt ante Dóminum, et ab ínvicem non
      sunt separáti!"
  nocturn-1-versum:
    - V. Exsúltent justi in conspéctu Dei.
    - R. Et delecténtur in lætítia.
