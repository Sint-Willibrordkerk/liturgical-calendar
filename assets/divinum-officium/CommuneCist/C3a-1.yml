  versum-2:
    - V. Justi in perpétuum vivent.
    - R. Et apud Dóminum est merces eórum.
  ant-2:
    - "Fulgébunt justi: * et tamquam scintíllæ in arundinéto discúrrent.
      Judicábunt natiónes, et regnábunt in ætérnum."
  responsory-breve-tertia:
    - R.br. Sancti tui, Dómine, * benedícent te.
    - R. Sancti tui, Dómine, * benedícent te.
    - V. Glóriam regni tui dicent, et poténtiam tuam loquéntur.
    - R. Benedícent te.
  ant-vespera-3:
    - Si coram homínibus * torménta passi sunt, spes electórum est immortális in
      ætérnum.
    - Tamquam aurum in fornáce * probávit eléctos Dóminus, et quasi holocáusti
      hóstiam accépit illos.
    - Istórum est enim * regnum cœlórum, qui contempsérunt vitam mundi, et
      pervenérunt ad præmia regni, et lavérunt stolas suas in sánguine Agni.
    - Via Justórum * recta facta est, et iter Sanctórum præparátum est.
  versum-3:
    - V. Justi in perpétuum vivent.
    - R. Et apud Dóminum est merces eórum.
  ant-3:
