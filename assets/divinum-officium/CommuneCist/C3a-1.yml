      palmas."
  lectio9-in-3-loco:
    - Léctio sancti Evangélii secúndum Lucam
    - "!Luc 12:1-8"
    - "In illo témpore: Dixit Jesus discípulis suis: Atténdite a fermento
      pharisæórum, quod est hypócrisis. Et réliqua."
    - _
    - Homilía sancti Bedæ Venerábilis Presbýteri
    - "!Lib. 4 in Lucam, cap. 12"
    - "De hoc ferménto Apóstolus præcépit: Itáque epulémur, non in ferménto
      véteri, neque in ferménto malítiæ et nequítiæ, sed in ázymis sinceritátis
      et veritátis. Nam, sicut módicum ferméntum totam farínæ, cui injícitur,
      massam corrúmpit, universámque mox conspersiónem suo sapóre commáculat;
      sic nimírum simulátio, cujus semel ánimum imbúerit, tota virtútum
      sinceritáte et veritáte fraudábit. Est ergo sensus: Atténdite ne æmulémini
      simulatóres; quia véniet profécto tempus, in quo et vestra virtus ómnibus,
      et eórum revelétur hypócrisis."
  lectio12-in-3-loco:
    - "Duo autem sunt génera persecutórum: unum palam sæviéntium, álterum ficte
      fraudulentérque blandiéntium. Contra utrúmque nos muníre atque institúere
      volens Salvátor, et supra ab hypócrisi pharisæórum atténdere, et hic a
      carníficum cæde prǽcipit non timére; quia vidélicet, post mortem nec horum
      crudélitas nec illórum váleat simulátio duráre. Nonne quinque pásseres
      véneunt dipóndio? Si minutíssima, inquit, animália, et quæ quólibet per
      aëra ferúntur volatília, Deus oblivísci non potest; vos, qui ad imáginem
      facti estis Creatóris, non debétis terréri ab his qui occídunt corpus;
      quia, qui irrationabília animália gubérnat, rationabília curáre non
      désinit."
    - "&teDeum"
  comment:
    - Section for Office of 3-Lessons (Simplex)
  lectio1s:
    - De libro Sapiéntiæ
    - "!Sap 5:1-4"
    - 1 Stabunt justi in magna constántia advérsus eos qui se angustiavérunt, et
      qui abstulérunt labóres eórum.
    - "2 Vidéntes turbabúntur timóre horríbili, et mirabúntur in subitatióne
      insperátæ salútis:"
    - "3 dicéntes intra se, pœniténtiam agéntes, et præ angústia spíritus
      geméntes: Hi sunt quos habúimus aliquándo in derísum, et in similitúdinem
      impropérii."
    - 4 Nos insensáti, vitam illórum æstimabámus insániam, et finem illórum sine
      honóre.
  responsory1s:
    - "R. Tradidérunt córpora sua propter Deum ad supplícia:"
    - "* Et meruérunt habére corónas perpétuas."
    - V. Isti sunt qui venérunt ex magna tribulatióne, et lavérunt stolas suas
      in sánguine Agni.
    - R. Et meruérunt habére corónas perpétuas.
    - "&Gloria"
    - R. Et meruérunt habére corónas perpétuas.
    - "V. Immánia enim pro Christo in suis corpóribus pertulérunt torménta:"
    - "R. Tradidérunt córpora sua propter Deum ad supplícia:"
    - "* Et meruérunt habére corónas perpétuas."
    - V. Isti sunt qui venérunt ex magna tribulatióne, et lavérunt stolas suas
      in sánguine Agni.
    - R. Et meruérunt habére corónas perpétuas.
    - "&Gloria"
    - R. Et meruérunt habére corónas perpétuas.
  responsory2s:
    - "R. Vérbera carníficum non timuérunt Sancti Dei, moriéntes pro Christi
      nómine:"
    - "* Ut herédes fíerent in domo Dómini."
    - V. Tradidérunt córpora sua propter Deum ad supplícia.
    - R. Ut herédes fíerent in domo Dómini.
  responsory3s:
    - "R. Hæc est vera fratérnitas, quæ numquam pótuit violári certámine: qui
      effúso sánguine secúti sunt Dóminum:"
    - "* Contemnéntes aulam régiam, pervenérunt ad regna cæléstia."
    - V. Ecce quam bonum et quam jucúndum habitáre fratres in unum.
    - R. Contemnéntes aulam régiam, pervenérunt ad regna cæléstia.
    - "&Gloria"
    - R. Contemnéntes aulam régiam, pervenérunt ad regna cæléstia.
oratio:
  - "Deus, qui nos ánnua sanctórum Mártyrum tuórum N. et N. sollemnitáte
    lætíficas: concéde propítius; ut, quorum gaudémus méritis, accendámur
    exémplis."
  - $Per Dominum.
