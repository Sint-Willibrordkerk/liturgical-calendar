      palmam martýrii.
    - Cum palma * ad regna pervenérunt Sancti, corónas decóris meruérunt de manu
      Dei.
    - "Córpora Sanctórum * in pace sepúlta sunt: et vivent nómina eórum in
      ætérnum."
    - Mártyres Dómini * Dóminum benedícite in ætérnum.
    - Mártyrum chorus * laudáte Dóminum de cælis, allelúja.
