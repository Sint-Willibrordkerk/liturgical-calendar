  responsory4:
    - R. Sancti tui, Dómine, mirábile consecúti sunt iter, serviéntes præcéptis
      tuis,
    - "* Ut inveniréntur illǽsi in aquis válidis: terra appáruit árida: et in
      Mari Rubro via sine impediménto."
    - V. Victrícem manum tuam laudavérunt páriter, et decantavérunt, Dómine,
      nomen sanctum tuum.
    - "R. Ut inveniréntur illǽsi in aquis válidis: terra appáruit árida: et in
      Mari Rubro via sine impediménto."
  responsory6:
    - "R. Hæc est vera fratérnitas, quæ numquam pótuit violári certámine: qui
      effúso sánguine secúti sunt Dóminum:"
    - "* Contemnéntes aulam régiam, pervenérunt ad regna cæléstia."
    - V. Ecce quam bonum et quam jucúndum habitáre fratres in unum.
    - R. Contemnéntes aulam régiam, pervenérunt ad regna cæléstia.
    - "&Gloria"
    - R. Contemnéntes aulam régiam, pervenérunt ad regna cæléstia.
  responsory7:
    - "R. Propter testaméntum Dómini, et leges patérnas, Sancti Dei perstitérunt
      in amóre fraternitátis:"
    - "* Quia unus fuit semper spíritus in eis, et una fides."
    - V. Ecce quam bonum et quam jucúndum habitáre fratres in unum.
    - R. Quia unus fuit semper spíritus in eis, et una fides.
    - "V. Memória eórum non derelinquétur, et nomen eórum in ætérnum manet:"
    - "R. Propter testaméntum Dómini, et leges patérnas, Sancti Dei perstitérunt
      in amóre fraternitátis:"
    - "* Quia unus fuit semper spíritus in eis, et una fides."
    - V. Ecce quam bonum et quam jucúndum habitáre fratres in unum.
    - R. Quia unus fuit semper spíritus in eis, et una fides.
  responsory8:
    - "R. Justi in perpétuum vivent, et apud Dóminum est merces eórum, et
      cogitátio illórum apud Altíssimum:"
    - "* Ideóque accípient regnum decóris de manu Dómini."
    - "V. Deus tentávit illos et invénit eos dignos se:"
    - R. Ideóque accípient regnum decóris de manu Dómini.
    - "&Gloria"
    - R. Ideóque accípient regnum decóris de manu Dómini.
  responsory9:
    - "R. Sancti per fidem vicérunt regna, operáti sunt justítiam, adépti sunt
      promissiónes, et fortes facti sunt in bello:"
    - "* Omnes testimónio fídei probáti."
    - V. Castra vertérunt exterórum, effugavérunt áciem gládii.
    - R. Omnes testimónio fídei probáti.
  lectio10:
    - "Sed his malis præveniéntibus, quia non statim finis sequátur, adjúngit:
      Surget gens contra gentem, et regnum advérsus regnum: et terræmótus magni
      erunt per loca, et pestiléntiæ, et fames, terrorésque de cælo: et signa
      magna erunt. Última tribulátio multis tribulatiónibus prævenítur: et per
      crebra mala, quæ prævéniunt, indicántur mala perpétua, quæ subsequéntur.
      Et ídeo post bella et seditiónes non statim finis: quia multa debent mala
      præcúrrere, ut malum váleant sine fine nuntiáre."
  responsory10:
    - R. Córpora Sanctórum in pace sepúlta sunt,
    - "* Et nómina eórum vivent in generatiónem et generatiónem."
    - V. Sapiéntiam Sanctórum narrent pópuli, et laudem eórum pronúntiet omnis
      Ecclésia.
    - R. Et nómina eórum vivent in generatiónem et generatiónem.
  responsory11:
    - R. Justórum ánimæ in manu Dei sunt,
    - "* Et non tanget illos torméntum mortis."
    - V. Visi sunt óculis insipiéntium mori, illi autem sunt in pace.
    - R. Et non tanget illos torméntum mortis.
  responsory12:
    - R. Lavérunt stolas suas,
    - "* Et cándidas eas fecérunt in sánguine Agni, Allelúia, allelúia,
      allelúia."
    - "V. Isti sunt qui venérunt ex magna tribulatióne, et lavérunt stolas suas:"
    - R. Et cándidas eas fecérunt in sánguine Agni, Allelúia, allelúia, allelúia.
  ant-laudes:
