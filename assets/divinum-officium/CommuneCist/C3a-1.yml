    lectio9-in-7-loco:
      - Léctio sancti Evangélii secúndum Lucam.
      - "!Luc 10:16-20"
      - "In illo témpore: Dixit Jesus discípulis suis: Qui vos audit, me audit:
        et qui vos spernit. Et réliqua."
      - _
      - Homilía sancti Bedæ Venerábilis Presbýteri
      - "!Lib. 3 in Luc. cap. 10"
      - "Ut in adiéndo quisque, vel spernéndo Evangélii prædicatóre non viles
        quasque persónas, sed Dóminum Salvatórem, immo ipsum Patrem spérnere se,
        vel audíre dísceret, ait: Qui vos audit, me audit: et qui von spernit,
        me spernit. Qui autem me spernit, spernit eum, qui me misit: quia procul
        dúbio in disípulo Magíster audítur et in fílio Pater honrátur. Potest et
        ita intélligi: Qui non facit misericórdiam uni de frátribus meis
        mínimis, nec mihi facit: quia et ipse pro his formam servi, et páuperis
        hábitum suscépi."
    lectio10-in-7-loco:
      - "Revérsi sunt autem septuagínta duo cum gáudio, dicéntes: Dómine, étiam
        dæmónia subjiciúntur nobis in nómine tuo. Bene quidem conféssi sunt,
        deferéntes honórem nómini Christi, sed quia infírma adhuc fide gaudébant
        virtútibus, vide, quid áudiunt. Et ait illis: Vidébam sátanam, sicut
        fulgur, de cælo cadéntem: non modo vídeo, sed prius vidébam, quando
        córruit; quod autem ait: sicut fulgur, vel præcípitem de supérnis ad ima
        lapsum signíficat, vel quia dejéctus adhuc transfigúrat se in ángelum
        lucis."
    lectio11-in-7-loco:
      - "Ecce dedi vobis potestátem, calcándi supra serpéntes et scorpiónes, hoc
        est, omne genus immundórum spirítuum de obséssis corpóribus ejiciéndi:
        quamvis et ad lítteram rectíssime possit áccipi: síquidem et Paulus a
        vípera invásus, nihil advérsi pátitur."
    lectio12-in-7-loco:
      - "Hoc sane inter serpéntes, qui dente, et scorpiónes, qui cauda nocent,
        distáre árbitror: quod serpéntes apérte sæviéntes, scorpiónes clánculo
        insidiántes, vel hómines, vel dæmones signíficent: serpéntes, qui
        inchoándis virtútibus venéna pravæ persuasiónis objíciunt: scorpiónes,
        qui consummátas virtútes ad finem vitiáre conténdunt. Verúmtamen in hoc
        nolíte gaudére, quia spíritus ejícere, sicut et virtútes álias fácere,
        intérdum non est ejus mériti, qui operátur; sed invocátio nóminis
        Christi hoc agit."
