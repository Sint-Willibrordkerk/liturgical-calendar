  - R. Spécie tua * Et pulchritúdine tua.
versum-1:
  - V. Dignáre me laudáre te, Virgo sacráta.
  - R. Da mihi virtútem contra hostes tuos.
ant-1:
  - "Sancta María, * succúrre míseris, juva pusillánimes, réfove flébiles, ora
    pro pópulo, intérveni pro clero, intercéde pro devóto femíneo sexu: séntiant
    omnes tuum juvámen, quicúmque célebrant tuam sanctam festivitátem."
tempore-paschali/invit:
  - Allelúia, allelúia, * Allelúia.
ant-matutinum:
  - Ecce tu pulchra es, * amíca mea, ecce tu pulchra es; óculi tui columbárum.;;8
  - Sicut lílium * inter spinas, sic amíca mea inter fílias.;;18
  - Favus distíllans * lábia tua, Sponsa, et odor vestimentórum tuórum sicut
    odor thuris.;;23
  - Emissiónes tuæ * paradísus malórum punicórum, cum pomórum frúctibus.;;44
  - Fons hortórum, * púteus aquárum vivéntium, quæ fluunt ímpetu de Líbano.;;45
  - Véniat * diléctus meus in hortum suum, et cómedat fructum pomórum suórum.;;47
  - Veni * in hortum meum, soror mea sponsa, méssui myrrham meam cum aromátibus
    meis.;;84
  - Comédi favum * cum melle meo, bibi vinum meum cum lacte meo.;;86
  - "Anima mea * liquefácta est, ut diléctus locútus est: quæsívi, et non invéni
    illum; vocávi, et non respóndit mihi: invenérunt me custódes civitátis,
    percussérunt me, et vulneravérunt me, tulérunt pállium meum custódes
    murórum: fíliæ Jerúsalem, nuntiáte dilécto, quia amóre lángueo.;;95"
  - Talis est * diléctus meus, et ipse est amícus meus, fíliæ Jerúsalem.;;96
  - "Descéndi * in hortum nucum, ut vidérem poma convállium, et inspícerem, si
    floruísset vínea, et germinássent mala púnica: revértere, tevértere,
    Sulamítis, revértere, revértere, ut intueámur te.;;97"
  - "Hortus conclúsus es, * Dei Génitrix, hortus conclúsus, fons signátus: surge
    própera, amíca mea, et veni.;;98"
  - Regáli ex progénie * María exórta refúlget; cujus précibus nos adjuvári,
    mente et spíritu devotíssime póscimus.;;249;250;251
