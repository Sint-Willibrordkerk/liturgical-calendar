  evangelium:
    - Sequéntia ++ sancti Evangélii secúndum Joánnem
    - "!Joannes 15:1-7"
    - "In illo témpore: Dixit Jesus discípulis suis: Ego sum vitis vera: et
      Pater meus agrícola est. Omnem pálmitem in me non feréntem fructum, tollet
      eum: et omnem, qui fert fructum, purgábit eum, ut fructum plus áfferat.
      Jam vos mundi estis propter sermónem, quem locútus sum vobis. Manéte in
      me: et ego in vobis. Sicut palmes non potest ferre fructum a semetípso,
      nisi mánserit in vite: sic nec vos, nisi in me manséritis. Ego sum vitis,
      vos pálmites: qui manet in me, et ego in eo, hic fert fructum multum: quia
      sine me nihil potéstis fácere. Si quis in me non mánserit, mittétur foras
      sicut palmes, et aréscet, et cólligent eum, et in ignem mittent, et ardet.
      Si manséritis in me, et verba mea in vobis mánserint: quodcúmque
      voluéritis, petétis, et fiet vobis."
