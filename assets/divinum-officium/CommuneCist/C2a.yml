  responsory1:
    - "R. Iste Sanctus pro lege Dei sui certávit usque ad mortem, et a verbis
      impiórum non tímuit:"
    - "* Fundátus enim erat supra firmam petram."
    - V. Iste est qui contémpsit vitam mundi, et pervénit ad cæléstia regna.
    - R. Fundátus enim erat supra firmam petram.
    - "V. Munímine régio septus, nullátenus est ab adversáriis superátus:"
    - "R. Iste Sanctus pro lege Dei sui certávit usque ad mortem, et a verbis
      impiórum non tímuit:"
    - "* Fundátus enim erat supra firmam petram."
    - V. Iste est qui contémpsit vitam mundi, et pervénit ad cæléstia regna.
