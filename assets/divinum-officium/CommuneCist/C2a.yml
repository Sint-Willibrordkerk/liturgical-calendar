  responsory7:
    - "R. Hic est vere Martyr, qui pro Christi nómine sánguinem suum fudit:"
    - "* Qui minas júdicum non tímuit, nec terrénæ dignitátis glóriam quæsívit,
      sed ad cæléstia regna pervénit."
    - V. Justum dedúxit Dóminus per vias rectas, et osténdit illi regnum Dei.
    - R. Qui minas júdicum non tímuit, nec terrénæ dignitátis glóriam quæsívit,
      sed ad cæléstia regna pervénit.
    - "&Gloria"
    - R. Qui minas júdicum non tímuit, nec terrénæ dignitátis glóriam quæsívit,
      sed ad cæléstia regna pervénit.
  lectio8:
    - "Contemplabátur enim quantum in ænígmate infírmitas humána óculum mentis
      in æternitáte fígere potest, quanta sint supérnæ civitátis gáudia: et ea
      enarráre non suffíciens admirándo clamábat Quid mihi est in cælo? Quasi
      díceret: Excédit vires meas, excédit facultátem eloquéntiæ meæ,
      transcéndit capacitátem intelligéntiæ meæ illud decus, illa glória, illa
      celsitúdo, qua nobis, a conturbatióne hóminum remótis, in abscóndito
      faciéi suæ Jesus Christus Dóminus noster reformábit corpus humilitátis
      nostræ, configurátum córpori claritátis suæ. Hujus perféctæ libertátis
      contemplatióne nullum vitábat perículum, nullum horrébat supplícium: et si
      mílies posset mori, non putábat se hanc digne posse áliqua ratióne
      promeréri."
  responsory8:
    - R. Pósuit corónam cápiti meo, et circúmdedit me vestiménto salútis,
    - "* Ad expugnándas Gentes et omnes inimícos."
    - V. Júdica, Dómine, nocéntes me, expúgna impugnántes me, apprehénde arma et
      scutum, et exsúrge in adjutórium mihi.
    - R. Ad expugnándas Gentes et omnes inimícos.
  responsory9:
    - R. Desidérium ánimæ ejus tribuísti ei Dómine,
    - "* Et voluntáte labiórum ejus non fraudásti eum."
    - "V. Quóniam prævenísti eum in benedictiónibus dulcédinis: posuísti in
      cápite ejus corónam de lápide pretióso."
    - R. Et voluntáte labiórum ejus non fraudásti eum.
  responsory10:
    - "R. Posuísti, Dómine, super caput ejus corónam de lápide pretióso:"
    - "* Vitam pétiit a te, et tribuísti ei in sǽculum sǽculi."
    - V. Desidérium ánimæ ejus tribuísti ei, et voluntáte labiórum ejus non
      fraudásti eum.
    - R. Vitam pétiit a te, et tribuísti ei in sǽculum sǽculi.
  lectio11:
    - "Sed ad hæc audíta inardéscit ánimus, jamque illic cupit assístere, ubi se
      sperat sine fine gaudére. Sed ad magna prǽmia perveníri non potest, nisi
      per magnos labóres. Unde et Paulus egrégius prædicátor dicit: Non
      coronábitur, nisi qui legítime certáverit. Deléctet ergo mentem magnitúdo
      præmiórum, sed non detérreat certámen labórum. Unde ad se veniéntibus
      Véritas dicit: Si quis venit ad me, et non odit patrem suum, et matrem, et
      uxórem, et fílios, et fratres, et soróres, adhuc autem et ánimam suam, non
      potest meus esse discípulus."
