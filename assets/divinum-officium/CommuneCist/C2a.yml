  responsory4:
    - "R. Hic est vir, qui non est derelíctus a Deo in die certáminis sui, et
      ipse conculcávit caput serpéntis antíqui:"
    - "* Modo coronátus est, quia fidéliter vixit in mandátis Dómini."
    - V. Quis est hic, et laudábimus eum? fecit enim mirabília in vita sua.
    - R. Modo coronátus est, quia fidéliter vixit in mandátis Dómini.
    - "&Gloria"
    - R. Modo coronátus est, quia fidéliter vixit in mandátis Dómini.
  lectio5:
    - Sermo sancti Augustíni Epíscopi
    - "!Sermo 44 de Sanctis"
    - "Triumphális beáti Mártyris N. dies hódie nobis anniversária celebritáte
      recúrrit: cujus glorificatióni sicut congáudet Ecclésia, sic ejus propónit
      sequénda vestígia. Si enim compátimur, et conglorificábimur. In cujus
      glorióso agóne duo nobis præcípue consideránda sunt: induráta vidélicet
      tortóris sævítia, et Mártyris invícta patiéntia. Sævítia tortóris, ut eam
      detestémur: patiéntia Mártyris, ut eam imitémur. Audi Psalmístam advérsus
      malítiam increpántem: Noli æmulári in malignántibus quóniam tamquam fœnum
      velóciter aréscent. Quod autem advérsus malignántes patiéntia exhibénda
      sit, audi Apóstolum suadéntem: Patiéntia vobis necessária est, ut
      reportétis promissiónes."
  responsory5:
    - "R. Stola jucunditátis índuit eum Dóminus:"
    - "* Et corónam pulchritúdinis pósuit super caput ejus."
    - "V. Cibávit illum Dóminus pane vitæ et intelléctus: et aqua sapiéntiæ
      salutáris potávit illum."
    - R. Et corónam pulchritúdinis pósuit super caput ejus.
    - "&Gloria"
    - R. Et corónam pulchritúdinis pósuit super caput ejus.
  lectio6:
    - "Coronáta ítaque est beáti Mártyris patiéntia: mancipáta est ætérnis
      cruciátibus tortóris incorrécta malítia. Hoc atténdens in agóne suo
      gloriósus Christi Athléta, non exhórruit cárcerem. Ad imitatiónem cápitis
      sui tolerávit probra, sustínuit irrisiónes, flagélla non tímuit: et quot
      ante mortem pro Christo pértulit supplícia, tot ei de se óbtulit
      sacrifícia. Quod enim propinánte Apóstolo bíberat, alte retinébat: Quia
      non sunt condígnæ passiónes hujus témporis ad futúram glóriam, quæ
      revelábitur in nobis. Et quia momentáneum hoc et leve nostræ
      tribulatiónis, ætérnum glóriæ pondus operátur in cælis. Hujus promissiónis
      amóre a terrénis suspénsus, et prægustáta supérnæ suavitátis dulcédine
      ineffabíliter afféctus, dicébat cum Psalmísta: Quid mihi est in cælo, et a
      te quid volui super terram? Defécit caro mea et cor meum: Deus cordis mei,
      et pars mea Deus in ætérnum."
