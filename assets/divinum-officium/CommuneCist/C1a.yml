  responsory11:
    - "R. Vos estis, qui permansístis mecum in tentatiónibus meis, dicit
      Dóminus, et ego dispóno vobis regnum:"
    - "* Ut edátis, et bibátis super mensam meam in regno meo, et sedeátis super
      thronos judicántes duódecim tribus Israël."
    - "V. Non vos me elegístis, sed ego elégi vos, et pósui vos:"
    - R. Ut edátis, et bibátis super mensam meam in regno meo, et sedeátis super
      thronos judicántes duódecim tribus Israël.
  responsory12:
    - "R. Vos estis lux mundi, dicit Dóminus:"
    - "* Qui in patiéntia vestra possidébitis ánimas vestras."
    - "V. Et ego dispóno vobis, sicut dispósuit mihi Pater meus regnum:"
    - R. Qui in patiéntia vestra possidébitis ánimas vestras.
    - "&Gloria"
    - R. Qui in patiéntia vestra possidébitis ánimas vestras.
  responsory12-duo:
    - R. Isti sunt duæ olívæ, et duo candelábra lucéntia ante Dóminum.
    - "* Habent potestátem cláudere cœlum núbibus, et aperíre portas ejus, quia
      linguæ eórum claves cœli factæ sunt."
    - "V. Isti sunt duo fílii splendóris, qui assístunt Dominatóri terræ:"
    - R. Habent potestátem cláudere cœlum núbibus, et aperíre portas ejus, quia
      linguæ eórum claves cœli factæ sunt.
