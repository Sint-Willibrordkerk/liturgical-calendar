  lectio6:
    - De Expositióne sancti Augustíni Epíscopi super psalmum octogésimum sextum
    - "!Ante medium"
    - "Fundaménta ejus in móntibus sanctis: díligit Dóminus portas Sion. Quare
      sunt fundaménta Apóstoli et Prophétæ? Quia eórum auctóritas portat
      infirmitátem nostram. Quare sunt portæ? Quia per ipsos intrámus ad regnum
      Dei. Prǽdicant enim nobis: et, cum per ipsos intrámus, per Christum
      intrámus; ipse est enim jánua. Et cum dicúntur duódecim portæ Jerúsalem,
      et una porta Christus et duódecim portæ Christus, quia in duódecim portis
      Christus; et ídeo duodenárius númerus Apostolórum. Sacraméntum magnum
      hujus duodenárii significátio est númeri. Sedébitis, inquit, super
      duódecim sedes, judicántes duódecim tribus Israël."
    - "Si duódecim sellæ ibi sunt, non est ubi sédeat tértius décimus Paulus
      Apóstolus, et non erit quómodo júdicet; et ipse se judicatúrum dixit, non
      hómines tantum, sed et ángelos. Quos ángelos, nisi apóstatas ángelos?
      Nescítis, inquit, quia ángelos judicábimus? Respondéret ergo turba: Quid
      te jactas judicatúrum? Ubi sedébis? Duódecim sedes dixit Dóminus duódecim
      Apóstolis, unus cécidit Judas, in locum ipsíus sanctus Matthías ordinátus
      est; implétus est duodenárius númerus sédium. Primo locum invéni, ubi
      sédeas; et sic te mináre judicatúrum. Duódecim ergo sedes quid sibi
      velint, videámus. Sacraméntum est cujúsdam universitátis; quia per totum
      orbem terrárum futúra erat Ecclésia, unde vocátur hoc ædifícium ad Christi
      compágem."
  responsory6:
    - "R. Isti sunt triumphatóres et amíci Dei, qui contemnéntes jussa
      príncipum, meruérunt prǽmia ætérna:"
    - "* Modo coronántur, et accípiunt palmam."
    - V. Isti sunt qui venérunt ex magna tribulatióne, et lavérunt stolas suas
      in sánguine Agni.
    - R. Modo coronántur, et accípiunt palmam.
    - "&Gloria"
    - R. Modo coronántur, et accípiunt palmam.
  lectio7:
    - "Si duódecim sellæ ibi sunt, non est ubi sédeat tértius décimus Paulus
      Apóstolus, et non erit quómodo júdicet; et ipse se judicatúrum dixit, non
      hómines tantum, sed et ángelos. Quos ángelos, nisi apóstatas ángelos?
      Nescítis, inquit, quia ángelos judicábimus? Respondéret ergo turba: Quid
      te jactas judicatúrum? Ubi sedébis? Duódecim sedes dixit Dóminus duódecim
      Apóstolis, unus cécidit Judas, in locum ipsíus sanctus Matthías ordinátus
      est; implétus est duodenárius númerus sédium. Primo locum invéni, ubi
      sédeas; et sic te mináre judicatúrum. Duódecim ergo sedes quid sibi
      velint, videámus. Sacraméntum est cujúsdam universitátis; quia per totum
      orbem terrárum futúra erat Ecclésia, unde vocátur hoc ædifícium ad Christi
      compágem."
    - Et ídeo, quia úndique venítur ad judicándum, duódecim sedes sunt; sicut,
      quia úndique intrátur in illam civitátem, duódecim portæ sunt. Non solum
      ergo illi duódecim et Apóstolus Paulus, sed quotquot judicatúri sunt,
      propter significatiónem universitátis, ad sedes duódecim pértinent;
      quemádmodum quotquot intrábunt, ad duódecim portas pértinent. Partes enim
      mundi quátuor sunt, Oriens, Occidens, Aquilo et Merídies. Istæ quátuor
      partes assídue nominántur in Scriptúris. Ab istis quátuor ventis, sicut
      dicit Dóminus in Evangélio, a quátuor ventis se collectúrum eléctos suos;
      ab ómnibus ergo istis quátuor ventis vocátur Ecclésia. Quómodo vocátur?
      Undique in Trinitáte vocátur. Non vocátur nisi per baptísmum in nómine
      Patris, et Fílii, et Spíritus Sancti. Quátuor ergo ter ducta duódecim
      inveniúntur.
