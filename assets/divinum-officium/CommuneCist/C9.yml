lectio9:
  - "!2. Machab, 12:43-46"
  - 43 Vir fortíssimus Judas, facta collatióne, duódecim míllia drachmas argénti
    misit Jerosólymam offérri pro peccátis mortuórum sacrifícium, bene et
    religióse de resurrectióne cógitans
  - 44 (nisi enim eos qui cecíderant resurrectúros speráret, supérfluum
    viderétur et vanum oráre pro mórtuis),
  - 45 et quia considerábat quod hi qui cum pietáte dormitiónem accéperant,
    óptimam habérent repósitam grátiam.
  - 46 Sancta ergo et salúbris est cogitátio pro defúnctis exoráre, ut a
    peccátis solvántur.
