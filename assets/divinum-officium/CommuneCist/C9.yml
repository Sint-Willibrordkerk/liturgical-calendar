ant-matutinum:
  - Dírige, * Dómine, Deus meus, in conspéctu tuo viam meam.;;5
  - "Convértere, * Dómine, et éripe ánimam meam: quóniam non est in morte, qui
    memor sit tui.;;6"
  - Nequándo rápiat * ut leo ánimam meam, dum non est qui rédimat, neque qui
    salvum fáciat.;;7
  - In loco páscuæ * ibi me collocávit.;;22
  - Delícta * juventútis meæ, et ignorántias meas ne memíneris, Dómine.;;24
  - Credo vidére * bona Dómini in terra vivéntium.;;26
  - "Compláceat * tibi, Dómine, ut erípias me: Dómine, ad adjuvándum me
    réspice.;;39"
  - Sana, Dómine, * ánimam meam, quia peccávi tibi.;;40
  - "Sitívit * ánima mea ad Deum vivum: quando véniam, et apparébo ante fáciem
    Dómini?;;41"
nocturn-1-versum:
  - V. Anima mea turbáta est valde.
  - R. Sed tu, Dómine, succúrre ei.
nocturn-2-versum:
  - V. Convértere, Dómine, et éripe ánimam meam.
  - R. Salvum me fac propter misericórdiam tuam.
nocturn-3-versum:
  - V. In memória ætérna erunt justi.
  - R. Ab auditióne mala non timébunt.
responsory3-versum:
  - V. Et non revertétur óculus meus, ut vídeat bona.
responsory3:
