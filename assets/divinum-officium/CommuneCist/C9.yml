ant-vespera:
  - Placébo Dómino * in regióne vivórum.;;114
  - Heu mihi Dómine, * quia incolátus meus prolongátus est.;;119
  - "Dóminus custódit te ab omni malo: * custódiat ánimam tuam Dóminus.;;120"
  - "Si iniquitátes * observáveris, Dómine: Dómine, quis sustinébit?;;129"
  - Opera * mánuum tuárum, Dómine, ne despícias.;;137
ant-1:
  - "Audívi vocem * de cœlo dicéntem: Beáti mórtui qui in Dómino moriúntur."
oratio-1:
  - $Pater totum secreto
  - _
  - "&psalm(145)"
  - $A porta inferi
  - "v. Deus, cui próprium est miseréri semper et párcere: § propitiáre animábus
    famulórum famularúmque tuárum, et ómnia eórum peccáta dimítte; * ut
    mortalitátis vínculis absolútæ, transíre mereántur ad vitam. §"
  - "v. Deus, véniæ largítor, et humánæ salútis amátor: § quæsumus cleméntiam
    tuam, * ut nostræ congregatiónis fratres, propínquos et benefactóres, qui ex
    hoc sæculo transiérunt, § beáta María semper Vírgine intercedénte cum
    ómnibus Sanctis tuis, ad perpétuæ beatitúdinis consórtium perveníre
    concédas. §"
  - "v. Fidélium Deus ómnium Cónditor, et Redémptor § animábus famulórum
    famularúmque tuárum remissiónem cunctórum tríbue peccatórum: * ut
    indulgéntiam, quam semper optavérunt, § piis supplicatiónibus consequántur."
  - v. Qui vivis et regnas in sæcula sæculórum.
  - R. Amen.
