lectio4:
  - "!1 Cor 4:10-15"
  - "10 Nos stulti propter Christum, vos autem prudéntes in Christo: nos
    infírmi, vos autem fortes: vos nóbiles, nos autem ignóbiles."
  - 11 Usque in hanc horam et esurímus, et sitímus, et nudi sumus, et cólaphis
    cǽdimur, et instábiles sumus,
  - "12 et laborámus operántes mánibus nostris: maledícimur, et benedícimus:
    persecutiónem pátimur, et sustinémus:"
  - "13 blasphemámur, et obsecrámus: tamquam purgaménta hujus mundi facti sumus,
    ómnium peripséma usque adhuc."
  - 14 Non ut confúndam vos, hæc scribo, sed ut fílios meos caríssimos móneo.
  - 15 Nam si decem míllia pædagogórum habeátis in Christo, sed non multos
    patres, nam in Christo Jesu per Evangélium ego vos génui.
