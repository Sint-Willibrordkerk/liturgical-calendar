lectio1:
  - De Epístola prima beáti Pauli Apóstoli ad Corínthios
  - "!1 Cor 4:1-5"
  - 1 Sic nos exístimet homo ut minístros Christi, et dispensatóres mysteriórum
    Dei.
  - 2 Hic jam quǽritur inter dispensatóres ut fidélis quis inveniátur.
  - "3 Mihi autem pro mínimo est ut a vobis júdicer, aut ab humáno die: sed
    neque meípsum júdico."
  - "4 Nihil enim mihi cónscius sum, sed non in hoc justificátus sum: qui autem
    júdicat me, Dóminus est."
  - "5 Ítaque nolíte ante tempus judicáre, quoadúsque véniat Dóminus: qui et
    illuminábit abscóndita tenebrárum, et manifestábit consília córdium: et tunc
    laus erit unicuíque a Deo."
responsory1:
  - R. Virtúte magna reddébant Apóstoli
  - "* Testimónium resurrectiónis Jesu Christi Dómini nostri, allelúja,
    allelúja."
  - V. Repléti quidem Spíritu Sancto, loquebántur cum fidúcia verbum Dei.
  - R. Testimónium resurrectiónis Jesu Christi Dómini nostri, allelúja, allelúja.
