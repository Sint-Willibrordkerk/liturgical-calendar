    rule:
      - Antiphonas horas
    comment:
      - "Lectiones 1..4 in 3 loco:"
      - Aliæ Lectiones ex Communi Confessoris Pontificis ex Breviario
        Cisterciensi (pag. 87*)
    ant-vespera:
      - Ecce sacérdos magnus, * qui in diébus suis plácuit Deo, et invéntus est
        justus.
      - Euge serve bone, * in módico fidélis, intra in gáudium Dómini tui.
      - Fidélis servus, et prudens, * quem constítuit Dóminus super famíliam
        suam.
      - Beátus ille servus, * cum vénerit Dóminus ejus, et pulsáverit jánuam, et
        invénerit eum vigilántem.
      - Ecce vere * Israëlita, in quo dolus non est.
