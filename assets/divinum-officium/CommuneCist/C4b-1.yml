    responsory9:
      - R. Magnificávit eum in conspéctu regum,
      - "* Et dedit illi corónam glóriæ."
      - V. Státuit illi testaméntum sempitérnum, et beatificávit illum.
      - R. Et dedit illi corónam glóriæ.
    responsory10:
      - R. Justum dedúxit Dóminus per vias rectas, † et osténdit illi regnum
        Dei, et dedit illi sciéntiam sanctórum;
      - "* Honestávit illum in labóribus suis."
      - V. Magnificávit eum in conspéctu regum, et dedit illi corónam glóriæ.
      - R. Honestávit illum in labóribus suis.
