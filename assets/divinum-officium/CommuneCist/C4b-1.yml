    nocturn-1-versum:
      - V. Ecce sacérdos magnus.
      - R. Qui in diébus suis plácuit Deo, et invéntus est justus.
    lectio2:
      - "@Commune/C4:Lectio1:s/.*5 /!1 Tim 3:5-9\\n5 /s"
    lectio3:
      - "!1 Tim 4:12-16"
      - 12 Exémplum esto fidélium in verbo, in conversatióne, in charitáte, in
        fide, in castitáte.
      - 13 Dum vénio, atténde lectióni, exhortatióni, et doctrínæ.
      - 14 Noli neglígere grátiam, quæ in te est, quæ data est tibi per
        prophetíam, cum impositióne mánuum presbytérii.
      - "15 Hæc meditáre, in his esto: ut proféctus tuus maniféstus sit ómnibus."
      - "16 Atténde tibi, et doctrínæ: insta in illis. Hoc enim fáciens, et
        teípsum salvum fácies, et eos qui te áudiunt."
    responsory3:
      - "R. Jurávit Dóminus, et non pœnitébit eum: Tu es sacérdos in ætérnum,"
      - "* Secúndum órdinem Melchísedech."
      - V. Dixit Dóminus Dómino meo, Sede a dextris meis.
      - R. Secúndum órdinem Melchísedech.
    lectio4:
      - "!1 Tim 6:13-16"
      - 13 Præcípio tibi coram Deo, qui vivíficat ómnia, et Christo Jesu, qui
        testimónium réddidit sub Póntio Piláto, bonam confessiónem,
      - 14 ut serves mandátum sine mácula, irreprehensíbile usque in advéntum
        Dómini nostri Jesu Christi,
      - "15 quem suis tempóribus osténdet beátus et solus potens, Rex regum, et
        Dóminus dominántium:"
      - "16 qui solus habet immortalitátem, et lucem inhábitat inaccessíbilem:
        quem nullus hóminum vidit, sed nec vidére potest: cui honor, et impérium
        sempitérnum. Amen."
    responsory4:
      - R. Iste Sanctus digne in memóriam vértitur hóminum, qui ad gáudium
        tránsiit Angelórum;
      - "* Quia in hac peregrinatióne solo córpore constitútus, cogitatióne et
        aviditáte in illa ætérna pátria conversátus est."
      - V. Vínculis carnis absolútus taléntum sibi créditum Dómino suo cum lucro
        reportávit.
      - R. Quia in hac peregrinatióne solo córpore constitútus, cogitatióne et
        aviditáte in illa ætérna pátria conversátus est.
