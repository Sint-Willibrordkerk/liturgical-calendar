    tempore-paschali/responsory12:
      - R. In diadémate cápitis Aaron lápides pretiósi fulgébant,
      - "* Dum perficerétur opus Dei, * Allelúia, allelúia, allelúia."
      - V. Coróna áurea super caput ejus, expréssa signo sanctitátis.
      - R. Dum perficerétur opus Dei.
      - "&Gloria"
      - R. Allelúia, allelúia, allelúia.
