    lectio1:
      - "!Sir 24:11-13"
      - 11 In ómnibus réquiem quæsívi, et in hereditáte Dómini morábor.
      - "12 Tunc præcépit, et dixit mihi Creátor ómnium: et qui creávit me,
        requiévit in tabernáculo meo."
      - "13 Et dixit mihi: In Jacob inhábita, et in Israël hereditáre, et in
        eléctis meis mitte radíces."
    lectio2:
      - "!Sir 24:15-16"
      - 15 Et sic in Sion firmáta sum, et in civitáte sanctificáta simíliter
        requiévi, et in Jerúsalem potéstas mea.
      - 16 Et radicávi in pópulo honorificáto, et in parte Dei mei heréditas
        illíus, et in plenitúdine sanctórum deténtio mea.
    responsory2:
      - "R. Beata es, Virgo María, quæ Dominum portasti, Creatorem mundi:"
      - "* Genuisti qui te fecit, et in æternum permanes Virgo."
      - V. Ave María, gratia plena, Dominus tecum.
      - R. Genuisti qui te fecit, et in æternum permanes Virgo.
    lectio3:
      - "!Sir 24:17-20"
      - "17 Quasi cedrus exaltáta sum in Líbano, et quasi cypréssus in monte
        Sion:"
      - "18 quasi palma exaltáta sum in Cades, et quasi plantátio rosæ in
        Jéricho:"
      - 19 quasi olíva speciósa in campis, et quasi plátanus exaltáta sum juxta
        aquam in platéis.
      - "20 Sicut cinnamómum et bálsamum aromatízans odórem dedi: quasi myrrha
        elécta dedi suavitátem odóris:"
      - "&teDeum"
    responsory3:
      - "R. Felix namque es, sacra Virgo María, et omni laude digníssima:"
      - "* Quia ex te ortus est sol justítiæ, Christus, Deus noster."
      - "V. Ora pro pópulo, intérveni pro clero, intercéde pro devóto femíneo
        sexu: séntiant omnes tuum juvámen, quicúmque célebrant tuam sanctam
        festivitátem."
      - R. Quia ex te ortus est sol justítiæ, Christus, Deus noster.
    benedictio:
      - Précibus et méritis beátæ Maríæ semper Vírginis et ómnium Sanctórum,
        perdúcat nos Dóminus ad regna cælórum.
      - Nos cum prole pia benedícat Virgo María.
      - Ipsa Virgo Vírginum intercédat pro nobis ad Dóminum.
      - Per Vírginem matrem concédat nobis Dóminus salútem et pacem.
