  officium:
    - Officium parvum Beatae Mariae Virginis Tempora Nativitatis
  rank:
    - Officium parvum Beatae Mariae Virginis Tempora Nativitatis
    - Simplex
    - "1"
  ant-vespera:
    - "O admirábile commércium: * Creátor géneris humáni, animátum corpus
      sumens, de Vírgine nasci dignátus est; et procédens homo sine sémine,
      largítus est nobis suam Deitátem.;;109"
    - "Quando natus es * ineffabíliter ex Vírgine, tunc implétæ sunt Scriptúræ:
      sicut plúvia in vellus descendísti, ut salvum fáceres genus humánum: te
      laudámus, Deus noster.;;112"
    - "Rubum, quem víderat Móyses * incombústum, conservátam agnóvimus tuam
      laudábilem virginitátem: Dei Génetrix, intercéde pro nobis.;;121"
    - "Germinávit radix Jesse, * orta est stella ex Jacob: Virgo péperit
      Salvatórem; te laudámus, Deus noster.;;126"
    - "Ecce María génuit * nobis Salvatórem, quem Joánnes videns, exclamávit,
      dicens: Ecce Agnus Dei, ecce qui tollit peccáta mundi, allelúja.;;147"
  ant-1:
    - "Magnum * hereditátis mystérium: templum Dei factus est úterus nesciéntis
      virum: non est pollútus ex ea carnem assúmens; omnes gentes vénient
      dicéntes: Glória tibi, Dómine."
  oratio:
    - "Deus, qui salútis ætérnæ, beátæ Maríæ virginitáte fecúnda, humáno generi
      præmia præstitísti: tríbue, quǽsumus; ut ipsam pro nobis intercédere
      sentiámus, per quam merúimus auctórem vitæ suscípere, Dóminum nostrum
      Jesum Christum, Fílium tuum:"
    - $Qui tecum
