    versum-0:
      - V. Ora pro nobis sancta Dei Génetrix.
      - R. Ut digni efficiámur promissiónibus Christi.
    ant-laudes:
      - "Assúmpta est María in cælum: * gaudent Angeli, laudántes benedícunt
        Dóminum."
      - María Virgo assúmpta est * ad æthéreum thálamum, in quo Rex regum
        stelláto sedet sólio.
      - "In odórem * unguentórum tuórum cúrrimus: adolescéntulæ dilexérunt te
        nimis."
      - "Benedícta * fília tu a Dómino: quia per te fructum vitæ communicávimus."
      - "Pulchra es, * et decóra, fília Jerúsalem: terríbilis ut castrórum ácies
        ordináta."
    capitulum-laudes:
      - "!Cant 6:8"
      - v. Vidérunt eam fíliæ Sion, et beatíssimam prædicavérunt et regínæ
        laudavérunt eam.
      - $Deo gratias
    versum-2:
      - V. Benedícta tu in muliéribus.
      - R. Et benedíctus fructus ventris tui.
    rubrica-cisterciensis/versum-2:
      - "!Eccli 24:26-28"
      - "v. Transíte ad me, omnes qui concupíscitis me, et a generatiónibus meis
        implémini: spíritus enim meus super mel dulcis, et heréditas mea super
        mel et favum: memória mea in generatióne sæculórum."
      - $Deo gratias
      - _
      - V. Speciósa facta es et suávis.
      - R. In delíciis tuis, sancta Dei Génetrix.
    ant-2:
      - "Beáta Dei Génetrix, María, * Virgo perpétua, templum Dómini, sacrárium
        Spíritus Sancti, sola sine exémplo placuísti Dómino nostro Jesu Christo:
        ora pro pópulo, intérveni pro clero, intercéde pro devóto femíneo sexu."
    rubrica-cisterciensis/ant-2:
      - "Beáta Dei Génetrix, María, * Virgo perpétua, templum Dómini, sacrárium
