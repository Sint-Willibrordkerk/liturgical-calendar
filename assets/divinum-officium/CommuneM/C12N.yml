      - "@Commune/C11:: s/\\s*\\:.*$/./ s/femíneo/fœmíneo/"
    oratio-1:
      - "Concéde nos fámulos tuos, quǽsumus, Dómine Deus, perpétua mentis et
        córporis sanitáte gaudére: et, gloriósa beátæ Maríæ semper Vírginis
        intercessióne, a præsénti liberári tristítia, et ætérna pérfrui
        lætítia."
      - $Per Dominum
    rubrica-cisterciensis/oratio-1:
      - "Concéde nos fámulos tuos, quǽsumus, Dómine Deus, perpétua mentis et
        córporis sanitáte gaudére: et, gloriósa beátæ Maríæ semper Vírginis
        intercessióne, a præsénti liberári tristítia, et ætérna pérfrui
        lætítia."
      - $Per Dominum
    commemoratio:
      - "!Commemoratio de Sanctis"
      - Ant. Sancti Dei omnes, intercédere dignémini pro nostra omniúmque salúte.
      - V. Lætámini in Dómino et exsultáte, justi.
      - R. Et gloriámini, omnes recti corde.
      - $Oremus
      - v. Prótege, Dómine, pópulum tuum, et, Apostolórum tuórum Petri et Pauli
        et aliórum Apostolórum patrocínio confidéntem, perpétua defensióne
        consérva.
      - "v. Omnes Sancti tui, quǽsumus, Dómine, nos ubíque ádjuvent: ut, dum
        eórum mérita recólimus, patrocínia sentiámus: et pacem tuam nostris
        concéde tempóribus, et ab Ecclésia tua cunctam repélle nequítiam; iter,
        actus et voluntátes nostras et ómnium famulórum tuórum, in salútis tuæ
        prosperitáte dispóne, benefactóribus nostris sempitérna bona retríbue,
        et ómnibus fidélibus defúnctis réquiem ætérnam concéde."
      - $Per Dominum
