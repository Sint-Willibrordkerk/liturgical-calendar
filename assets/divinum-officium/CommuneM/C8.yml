responsory11:
  - R. Benedíctus es in templo sancto glóriæ tuæ quod ædificátum est
  - "* Ad laudem et glóriam nóminis tui Dómine."
  - V. Bénedic domum istam quam ædificávi.
  - R. Ad laudem et glóriam nóminis tui Dómine.
lectio12:
  - "Verum, ne cæcum illum, tamquam fastidiósi páuperum, cito reliquísse
    videámur et transísse ad dívitem, exspectémus eum, quia exspectávit et
    Dóminus; interrogémus eum, quia interrogávit et Christus. Nos interrogémus,
    quia nescímus: ille, quia nóverat. Nos interrogémus, ut sciámus unde iste
    curátus sit: ille interrogávit, ut in uno plures discerémus unde Dóminum
    vidére mereámur. Interrogávit enim, ut crederémus, néminem, nisi
    confiténtem, posse salvári."
  - "&teDeum"
responsory12:
  - "R. Vidi civitátem sanctam Jerúsalem novam, † descendéntem de cælo a Deo
    parátam:"
  - "* Et audívi vocem de throno dicéntem: * Ecce tabernáculam Dei cum
    homínibus, et habitábit cum eis."
  - V. Et ipsi pópulus ejus erunt, † et ipse Deus cum eis erit eórum Deus.
  - "R. Et audívi vocem de throno dicéntem: Ecce tabernáculam Dei cum homínibus,
    et habitábit cum eis."
