  ad-missam/oratio-in-2-loco:
    - "Deus, qui invisibíliter ómnia cóntines, et tamen pro salúte géneris
      humáni signa tuæ poténtiæ visibíliter osténdis: templum hoc poténtia tuæ
      inhabitatiónis illústra, et concéde; ut omnes, qui huc deprecatúri
      convéniunt, ex quacúmque tribulatióne ad te clamáverint, consolatiónis tuæ
      benefícia consequántur."
    - $Per Dominum
  oratio-dedicationis-altaris:
    - "!Orationes sequentes: quibus similiter, si agatur de Altari fixo, additur
      sub unica"
    - conclusione Oratio de Mysterio vel Sancto, in cujus honorem Altare
      dedicatur.
    - "v. Deus, qui ex omni coaptatióne Sanctórum ætérnum tibi condis
      habitáculum: da ædificatióni tuæ increménta cœléstia; ut, quorum hic
      relíquias pio amóre compléctimur, eórum semper méritis adjuvémur."
    - $Per Dominum.
  lectio:
    - Léctio libri Apocalýpsis beáti Joánnis Apóstoli
    - "!Apoc 21:2-5"
    - "In diébus illis: Vidi sanctam civitátem Jerúsalem novam descendéntem de
      cœlo a Deo, parátam sicut sponsam ornátam viro suo. Et audívi vocem magnam
      de throno dicéntem: Ecce tabernáculum Dei cum homínibus, et habitábit cum
      eis. Et ipsi pópulus ejus erunt, et ipse Deus cum eis erit eórum Deus: et
      abstérget Deus omnem lácrimam ab óculis eórum: et mors ultra non erit,
      neque luctus neque clamor neque dolor erit ultra, quia prima abiérunt. Et
      dixit, qui sedébat in throno: Ecce, nova fácio ómnia."
