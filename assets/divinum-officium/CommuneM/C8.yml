lectio1:
  - De libro secundo Paralipómenon
  - "!2 Chr 7:1-5"
  - "1 Cum complésset Sálomon fundens preces, ignis descéndit de cælo et
    devorávit holocáusta et víctimas: et majéstas Dómini implévit domum."
  - 2 Nec póterant sacerdótes íngredi templum Dómini, eo quod implésset majéstas
    Dómini, templum Dómini.
  - "3 Sed et omnes fílii Israël vidébant descendéntem ignem, et glóriam Dómini
    super domum: et corruéntes proni in terram super paviméntum stratum lápide,
    adoravérunt et laudavérunt Dóminum: Quóniam bonus, quóniam in sǽculum
    misericórdia ejus."
  - 4 Rex autem et omnis pópulus immolábant víctimas coram Dómino.
  - "5 Mactávit ígitur rex Sálomon hóstias, boum vigínti duo míllia, aríetum
    centum vigínti míllia: et dedicávit domum Dei rex et univérsus pópulus."
lectio2:
  - De libro secundo Paralipómenon
  - "!2 Chr 7:1-5"
  - "1 Cum complésset Sálomon fundens preces, ignis descéndit de cælo et
    devorávit holocáusta et víctimas: et majéstas Dómini implévit domum."
  - 2 Nec póterant sacerdótes íngredi templum Dómini, eo quod implésset majéstas
    Dómini, templum Dómini.
  - "3 Sed et omnes fílii Israël vidébant descendéntem ignem, et glóriam Dómini
    super domum: et corruéntes proni in terram super paviméntum stratum lápide,
    adoravérunt et laudavérunt Dóminum: Quóniam bonus, quóniam in sǽculum
    misericórdia ejus."
  - 4 Rex autem et omnis pópulus immolábant víctimas coram Dómino.
  - "5 Mactávit ígitur rex Sálomon hóstias, boum vigínti duo míllia, aríetum
    centum vigínti míllia: et dedicávit domum Dei rex et univérsus pópulus."
  - "!2 Chr 7:6-9"
  - "6 Sacerdótes autem stabant in offíciis suis, et Levítæ in organis cárminum
    Dómini, quæ fecit David rex ad laudándum Dóminum: Quóniam in ætérnum
    misericórdia ejus; hymnos David canéntes per manus suas: porro sacerdótes
    canébant tubis ante eos, cunctúsque Israël stabat."
  - "7 Sanctificávit quoque Sálomon médium átrii ante templum Dómini: obtúlerat
    enim ibi holocáusta, et ádipes pacificórum: quia altáre ǽneum, quod fécerat,
    non póterat sustinére holocáusta et sacrifícia et ádipes."
  - 8 Fecit ergo Sálomon solemnitátem in témpore illo septem diébus, et omnis
    Israël cum eo, ecclésia magna valde ab intróitu Emath usque ad Torréntem
    Ægýpti.
  - 9 Fecítque die octávo colléctam, eo quod dedicásset altáre septem diébus, et
    solemnitátem celebrásset diébus septem.
lectio3:
  - "!2 Chr 7:6-9"
  - "6 Sacerdótes autem stabant in offíciis suis, et Levítæ in organis cárminum
    Dómini, quæ fecit David rex ad laudándum Dóminum: Quóniam in ætérnum
    misericórdia ejus; hymnos David canéntes per manus suas: porro sacerdótes
    canébant tubis ante eos, cunctúsque Israël stabat."
  - "7 Sanctificávit quoque Sálomon médium átrii ante templum Dómini: obtúlerat
    enim ibi holocáusta, et ádipes pacificórum: quia altáre ǽneum, quod fécerat,
    non póterat sustinére holocáusta et sacrifícia et ádipes."
  - 8 Fecit ergo Sálomon solemnitátem in témpore illo septem diébus, et omnis
    Israël cum eo, ecclésia magna valde ab intróitu Emath usque ad Torréntem
    Ægýpti.
  - 9 Fecítque die octávo colléctam, eo quod dedicásset altáre septem diébus, et
    solemnitátem celebrásset diébus septem.
lectio4:
  - "!2 Chr 7:11-16"
  - 11 Complevítque Sálomon domum Dómini, et domum regis, et ómnia quæ
    disposúerat in corde suo, ut fáceret in domo Dómini et in domo sua, et
    prosperátus est.
  - "12 Appáruit autem ei Dóminus nocte, et ait: Audívi oratiónem tuam, et elégi
    locum istum mihi in domum sacrifícii."
  - "13 Si cláusero cælum, et plúvia non flúxerit, et mandávero et præcépero
    locústæ, ut dévoret terram, et mísero pestiléntiam in pópulum meum:"
  - "14 convérsus autem pópulus meus, super quos invocátum est nomen meum,
    deprecátus me fúerit, et exquisíerit fáciem meam, et égerit pœniténtiam a
    viis suis pessimis: et ego exáudiam de cælo, et propítius ero peccátis
    eórum, et sanábo terram eórum."
  - 15 Oculi quoque mei erunt apérti, et aures meæ eréctæ ad oratiónem ejus qui
    in loco isto oráverit.
  - 16 Elégi enim et sanctificávi locum istum, ut sit nomen meum ibi in
    sempitérnum, et permáneant óculi mei et cor meum ibi cunctis diébus.
responsory4:
  - "R. Terríbilis est locus iste: † non est hic áliud nisi domus Dei et porta
    cæli:"
  - "* Vere étenim Dóminus est in loco isto, et ego nesciébam."
  - V. Vidit Jacob in somnis scalam, súmmitas ejus cælos tangébat, † et Ángelos
    Dei descendéntes et ascendéntes per eam, et ait.
  - R. Vere étenim Dóminus est in loco isto, et ego nesciébam.
lectio5:
  - Sermo sancti Augustini Episcopi
  - "!Sermo 252 de Tempore"
  - "Quotiescúmque, fratres caríssimi, altáris vel templi festivitátem cólimus,
    si fidéliter ac diligénter atténdimus et sancte ac juste vívimus, quidquid
    in templis manufáctis ágitur, totum in nobis spiritáli ædificatióne
    complétur. Non enim mentítus est ille qui dixit: Templum enim Dei sanctum
    est, quod estis vos; et íterum: Nescitis quia córpora vestra templum sunt
    Spíritus Sancti, qui in vobis est? Et ideo, fratres caríssimi, quia, nullis
    præcedéntibus méritis, per grátiam Dei merúimus fíeri templum Dei, quantum
    possumus cum ipsíus adjutório labóremus, ne Dóminus noster in templo suo,
    hoc est, in nobis ipsis, invéniat quod óculos suæ majestátis offéndat."
responsory5:
  - R. Orántibus in loco isto,
  - "* Dimítte peccáta pópuli tui, Deus, et osténde eis viam bonam per quam
    ámbulent, et da glóriam in loco isto."
  - V. Qui regis Israël inténde, qui dedúcis velut ovem Joseph, qui sedes super
    Chérubim.
  - R. Dimítte peccáta pópuli tui, Deus, et osténde eis viam bonam per quam
    ámbulent, et da glóriam in loco isto.
lectio6:
  - Sermo sancti Augustini Episcopi
  - "!Sermo 252 de Tempore"
  - "Quotiescúmque, fratres caríssimi, altáris vel templi festivitátem cólimus,
    si fidéliter ac diligénter atténdimus et sancte ac juste vívimus, quidquid
    in templis manufáctis ágitur, totum in nobis spiritáli ædificatióne
    complétur. Non enim mentítus est ille qui dixit: Templum enim Dei sanctum
    est, quod estis vos; et íterum: Nescitis quia córpora vestra templum sunt
    Spíritus Sancti, qui in vobis est? Et ideo, fratres caríssimi, quia, nullis
    præcedéntibus méritis, per grátiam Dei merúimus fíeri templum Dei, quantum
    possumus cum ipsíus adjutório labóremus, ne Dóminus noster in templo suo,
    hoc est, in nobis ipsis, invéniat quod óculos suæ majestátis offéndat."
  - Sed habitáculum cordis nostri evacuétur vítiis, et virtútibus repleátur;
    claudátur diábolo, et aperiátur Christo. Et ita labóremus, ut nobis bonórum
    óperum clávibus jánuam regni cæléstis aperíre possímus. Sicut enim malis
    opéribus, quasi quibúsdam seris ac véctibus, vitæ nobis janua claudítur;
    ita, absque dubio, bonis opéribus aperítur. Et ídeo, fratres caríssimi,
    unusquísque consíderet consciéntiam suam, et, quando se áliquo crímine
    vulnerátum esse cognóverit, prius oratiónibus, jejúniis vel eleemósynis
    stúdeat mundáre consciéntiam suam; et sic Eucharístiam præsúmat accípere.
responsory6:
  - "R. O quam metuéndus est locus iste:"
  - "* Vere non est hic áliud nisi domus Dei et porta cæli."
  - V. Hæc est domus Dómini fírmiter ædificáta, bene fundáta est supra firmam
    petram.
  - R. Vere non est hic áliud nisi domus Dei et porta cæli.
lectio7:
  - Sed habitáculum cordis nostri evacuétur vítiis, et virtútibus repleátur;
    claudátur diábolo, et aperiátur Christo. Et ita labóremus, ut nobis bonórum
