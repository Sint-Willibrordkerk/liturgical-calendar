  oratio:
    - "!In Anniversario Dedicationis Ecclesiæ"
    - "v. Deus, qui nobis per síngulos annos hujus sancti templi tui
      consecratiónis réparas diem, et sacris semper mystériis repræséntas
      incólumes: exáudi preces pópuli tui, et præsta; ut quisquis hoc templum
      benefícia petitúrus ingréditur, cuncta se impetrásse lætétur."
    - $Per Dominum
  oratio-in-2-loco:
    - "!In ipso die Dedicationis Ecclesiæ et per Ottava, et quando varianda est
      Oratio"
    - "v. Deus, qui invisibíliter ómnia cóntines, et tamen pro salúte géneris
      humáni signa tuæ poténtiæ visibíliter osténdis: templum hoc poténtia tuæ
      inhabitatiónis illústra, et concéde; ut omnes, qui huc deprecatúri
      convéniunt, ex quacúmque tribulatióne ad te clamáverint, consolatiónis
      tuas benefícia consequántur."
    - $Per Dominum
