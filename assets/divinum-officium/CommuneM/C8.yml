  lectio1:
    - De libro secundo Paralipómenon
    - "!2 Chr 7:1-5"
    - "1 Cum complésset Sálomon fundens preces, ignis descéndit de cælo et
      devorávit holocáusta et víctimas: et majéstas Dómini implévit domum."
    - 2 Nec póterant sacerdótes íngredi templum Dómini, eo quod implésset
      majéstas Dómini, templum Dómini.
    - "3 Sed et omnes fílii Israël vidébant descendéntem ignem, et glóriam
      Dómini super domum: et corruéntes proni in terram super paviméntum stratum
      lápide, adoravérunt et laudavérunt Dóminum: Quóniam bonus, quóniam in
      sǽculum misericórdia ejus."
    - 4 Rex autem et omnis pópulus immolábant víctimas coram Dómino.
    - "5 Mactávit ígitur rex Sálomon hóstias, boum vigínti duo míllia, aríetum
      centum vigínti míllia: et dedicávit domum Dei rex et univérsus pópulus."
  responsory1:
    - "R. In dedicatióne templi decantábat pópulus laudem:"
    - "* Et in ore eórum dulcis resonábat sonus."
    - V. Fundáta est domus Dómini supra vérticem móntium, et vénient ad eam
      omnes gentes.
    - R. Et in ore eórum dulcis resonábat sonus.
  lectio2:
    - "!2 Chr 7:6-9"
    - "6 Sacerdótes autem stabant in offíciis suis, et Levítæ in organis
      cárminum Dómini, quæ fecit David rex ad laudándum Dóminum: Quóniam in
      ætérnum misericórdia ejus; hymnos David canéntes per manus suas: porro
      sacerdótes canébant tubis ante eos, cunctúsque Israël stabat."
    - "7 Sanctificávit quoque Sálomon médium átrii ante templum Dómini:
      obtúlerat enim ibi holocáusta, et ádipes pacificórum: quia altáre ǽneum,
      quod fécerat, non póterat sustinére holocáusta et sacrifícia et ádipes."
    - 8 Fecit ergo Sálomon solemnitátem in témpore illo septem diébus, et omnis
      Israël cum eo, ecclésia magna valde ab intróitu Emath usque ad Torréntem
      Ægýpti.
    - 9 Fecítque die octávo colléctam, eo quod dedicásset altáre septem diébus,
      et solemnitátem celebrásset diébus septem.
  responsory2:
    - "R. Fundáta est domus Dómini supra vérticem móntium, et exaltáta est super
      omnes colles:"
    - "* Et vénient ad eam omnes gentes, et dicent: Glória tibi, Dómine."
    - V. Veniéntes autem vénient cum exsultatióne, portántes manípulos suos.
    - "R. Et vénient ad eam omnes gentes, et dicent: Glória tibi, Dómine."
  lectio3:
    - "!2 Chr 7:11-16"
    - 11 Complevítque Sálomon domum Dómini, et domum regis, et ómnia quæ
      disposúerat in corde suo, ut fáceret in domo Dómini et in domo sua, et
      prosperátus est.
    - "12 Appáruit autem ei Dóminus nocte, et ait: Audívi oratiónem tuam, et
      elégi locum istum mihi in domum sacrifícii."
    - "13 Si cláusero cælum, et plúvia non flúxerit, et mandávero et præcépero
      locústæ, ut dévoret terram, et mísero pestiléntiam in pópulum meum:"
    - "14 convérsus autem pópulus meus, super quos invocátum est nomen meum,
      deprecátus me fúerit, et exquisíerit fáciem meam, et égerit pœniténtiam a
      viis suis pessimis: et ego exáudiam de cælo, et propítius ero peccátis
      eórum, et sanábo terram eórum."
    - 15 Oculi quoque mei erunt apérti, et aures meæ eréctæ ad oratiónem ejus
      qui in loco isto oráverit.
    - 16 Elégi enim et sanctificávi locum istum, ut sit nomen meum ibi in
      sempitérnum, et permáneant óculi mei et cor meum ibi cunctis diébus.
  responsory3:
    - "R. Bénedic, Dómine, domum istam, quam ædificávi nómini tuo: veniéntium in
      loco isto"
    - "* Exáudi preces in excélso sólio glóriæ tuæ."
    - V. Dómine, si convérsus fúerit pópulus tuus, et oráverit ad sanctuárium
      tuum.
    - R. Exáudi preces in excélso sólio glóriæ tuæ.
    - "&Gloria"
    - R. Exáudi preces in excélso sólio glóriæ tuæ.
  lectio4:
    - Sermo sancti Augustini Episcopi
    - "!Sermo 252 de Tempore"
    - "Quotiescúmque, fratres caríssimi, altáris vel templi festivitátem
      cólimus, si fidéliter ac diligénter atténdimus et sancte ac juste vívimus,
      quidquid in templis manufáctis ágitur, totum in nobis spiritáli
      ædificatióne complétur. Non enim mentítus est ille qui dixit: Templum enim
      Dei sanctum est, quod estis vos; et íterum: Nescitis quia córpora vestra
      templum sunt Spíritus Sancti, qui in vobis est? Et ideo, fratres
      caríssimi, quia, nullis præcedéntibus méritis, per grátiam Dei merúimus
      fíeri templum Dei, quantum possumus cum ipsíus adjutório labóremus, ne
      Dóminus noster in templo suo, hoc est, in nobis ipsis, invéniat quod
      óculos suæ majestátis offéndat."
  responsory4:
    - R. Orántibus in loco isto,
    - "* Dimítte peccáta pópuli tui, Deus, et osténde eis viam bonam per quam
      ámbulent, et da glóriam in loco isto."
    - V. Qui regis Israël inténde, qui dedúcis velut ovem Joseph, qui sedes
      super Chérubim.
    - R. Dimítte peccáta pópuli tui, Deus, et osténde eis viam bonam per quam
      ámbulent, et da glóriam in loco isto.
  lectio5:
    - Sed habitáculum cordis nostri evacuétur vítiis, et virtútibus repleátur;
      claudátur diábolo, et aperiátur Christo. Et ita labóremus, ut nobis
      bonórum óperum clávibus jánuam regni cæléstis aperíre possímus. Sicut enim
      malis opéribus, quasi quibúsdam seris ac véctibus, vitæ nobis janua
      claudítur; ita, absque dubio, bonis opéribus aperítur. Et ídeo, fratres
      caríssimi, unusquísque consíderet consciéntiam suam, et, quando se áliquo
      crímine vulnerátum esse cognóverit, prius oratiónibus, jejúniis vel
      eleemósynis stúdeat mundáre consciéntiam suam; et sic Eucharístiam
      præsúmat accípere.
  responsory5:
    - "R. O quam metuéndus est locus iste:"
    - "* Vere non est hic áliud nisi domus Dei et porta cæli."
    - V. Hæc est domus Dómini fírmiter ædificáta, bene fundáta est supra firmam
      petram.
    - R. Vere non est hic áliud nisi domus Dei et porta cæli.
  lectio6:
    - Si enim, agnóscens reátum suum, ipse se a divíno altári subtráxerit, cito
      ad indulgéntiam divínæ misericórdiæ pervéniet. Quia, sicut qui se exáltat,
      humiliábitur; ita, e contrário, qui se humíliat ab altári Ecclésiæ pro
      emendatióne vitæ removére volúerit, ab ætérno illo et cælésti convívio
      excommunicári pénitus non timébit.
  responsory6:
    - "R. Mane surgens Jacob, erigébat lápidem in títulum, fundens óleum
      désuper; votum vovit Dómino:"
    - "* Vere locus iste sanctus est, et ego nesciébam."
    - V. Cumque evigilásset Jacob de somno, ait.
    - R. Vere locus iste sanctus est, et ego nesciébam.
    - "&Gloria"
    - R. Vere locus iste sanctus est, et ego nesciébam.
  lectio7:
    - Léctio sancti Evangélii secúndum Lucam
    - "!Luc 19:1-10"
    - "In illo témpore: Ingréssus Jesus perambulábat Jéricho. Et ecce vir nómine
      Zachǽus: et hic princeps erat publicanórum, et ipse dives. Et réliqua."
    - _
    - Homilía sancti Ambrósii Epíscopi
    - "!Lib. 8 in Luc., prope finem"
    - Zachǽus, statúra pusíllus, hoc est, nulla nobilitátis ingénitæ dignitáte
      sublímis, exíguus méritis sicut pópulus natiónum, audíto Dómini Salvatóris
      advéntu, quem sui non recéperant, vidére cupiébat. Sed nemo fácile Jesum
      videt; nemo potest Jesum vidére constitútus in terra. Et, quia non
      prophétas, non legem habébat, tamquam formæ grátiam naturális, ascéndit in
      sycómorum, vanitátem scílicet Judæórum vestígio suo próterens, erráta
      quoque córrigens superióris ætátis. Et ídeo Jesum in interióris domus
      recépit hospítio.
  responsory7:
    - "R. Domus mea, domus oratiónis vocábitur, dicit Dóminus: in ea omnis qui
      petit, áccipit; et qui quærit, ínvenit;"
    - "* Et pulsánti aperiétur."
    - V. Pétite, et accipiétis; quǽrite, et inveniétis.
    - R. Et pulsánti aperiétur.
  lectio8:
    - "Et bene ascéndit in árborem, ut arbor bona bonos fructus fáceret, ac,
      naturáli excísus oleástro et contra natúram insértus in bonam olívam,
      fructum posset legis afférre. Radix enim sancta, etsi rami inútiles.
      Quorum infructuósam glóriam plebs géntium, fide resurrectiónis, quasi
      quadam córporis elevatióne, transcéndit. Zachǽus ergo in sycómoro, cæcus
      in via: quorum álterum Dóminus miseratúrus exspéctat, álterum mansiónis
      suæ claritáte nobílitat; álterum sanatúrus intérrogat, apud álterum se,
      non invitátus, invítat. Sciébat enim úberem hospítii sui esse mercédem.
      Sed tamen, etsi nondum vocem invitántis audíerat, jam víderat afféctum."
  responsory8:
    - R. Lápides pretiósi omnes muri tui,
    - "* Et turres Jerúsalem gemmis ædificabúntur."
    - V. Portæ Jerúsalem ex sapphíro et smarágdo ædificabúntur, et ex lápide
      pretióso omnis circúitus muri ejus.
    - R. Et turres Jerúsalem gemmis ædificabúntur.
    - "&Gloria"
    - R. Et turres Jerúsalem gemmis ædificabúntur.
  lectio9:
    - "Verum, ne cæcum illum, tamquam fastidiósi páuperum, cito reliquísse
      videámur et transísse ad dívitem, exspectémus eum, quia exspectávit et
      Dóminus; interrogémus eum, quia interrogávit et Christus. Nos
      interrogémus, quia nescímus: ille, quia nóverat. Nos interrogémus, ut
      sciámus unde iste curátus sit: ille interrogávit, ut in uno plures
      discerémus unde Dóminum vidére mereámur. Interrogávit enim, ut crederémus,
      néminem, nisi confiténtem, posse salvári."
    - "&teDeum"
