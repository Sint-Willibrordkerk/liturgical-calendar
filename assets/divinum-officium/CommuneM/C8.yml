      nunc, et usque in sǽculum.
  evangelium:
    - Sequéntia ++ sancti Evangélii secúndum Lucam
    - "!Luc 19:1-10"
    - "In illo témpore: Ingréssus Jesus perambulábat Jéricho. Et ecce, vir
      nómine Zachǽus: et hic princeps erat publicanórum, et ipse dives: et
      quærébat vidére Jesum, quis esset: et non póterat præ turba, quia statúra
      pusíllus erat. Et præcúrrens ascéndit in árborem sycómorum, ut vidéret
      eum; quia inde erat transitúrus. Et cum venísset ad locum, suspíciens
      Jesus vidit illum, et dixit ad eum: Zachǽe, festínans descénde; quia hódie
      in domo tua opórtet me manére. Et festínans descéndit, et excépit illum
      gaudens. Et cum vidérent omnes, murmurábant, dicéntes, quod ad hóminem
      peccatórem divertísset. Stans autem Zachǽus, dixit ad Dóminum: Ecce,
      dimídium bonórum meórum, Dómine, do paupéribus: et si quid áliquem
      defraudávi, reddo quádruplum. Ait Jesus ad eum: Quia hódie salus dómui
      huic facta est: eo quod et ipse fílius sit Abrahæ. Venit enim Fílius
      hóminis quǽrere et salvum fácere, quod períerat."
  offertorium:
    - "!1 Par 29:17-18"
    - "Dómine Deus, in simplicitáte cordis mei lætus óbtuli univérsa; et pópulum
      tuum, qui repértus est, vidi cum ingénti gáudio: Deus Israël, custódi hanc
      voluntátem, ~allelúja."
  secreta:
    - "!Extra Ecclesiam dedicatam"
    - "v. Annue, quǽsumus, Dómine, précibus nostris: ut, dum hæc vota præséntia
      réddimus, ad ætérna prǽmia, te adjuvánte, perveníre mereámur."
    - $Per Dominum
  secreta-1-loco:
    - "!In ipsa Ecclesia dedicata"
    - "v. Annue, quǽsumus, Dómine, précibus nostris: ut, quicúmque intra templi
      hujus, cujus anniversárium dedicatiónis diem celebrámus, ámbitum
      continémur, plena tibi atque perfécta córporis et ánimæ devotióne
      placeámus; ut, dum hæc vota præséntia réddimus, ad ætérna prǽmia, te
      adjuvante, perveníre mereámur."
    - $Per Dominum
  secreta-2-loco:
    - "!In ipsa die Dedicationis Ecclesiæ et per Octavam"
    - "v. Deus, qui sacrandórum tibi auctor es múnerum, effúnde super hanc
      oratiónis domum benedictiónem tuam: ut ab ómnibus, in ea invocántibus
      nomen tuum, defensiónis tuæ auxílium sentiátur."
    - $Per Dominum
  secreta-dedicationes-altaris:
    - "Descéndat, quǽsumus, Dómine, Deus noster, Spíritus tuus Sanctus super hoc
      altare: qui et pópuli tui dona sanctíficet, et suméntium corda dignánter
      emúndet."
    - $Per Dominum eiusdem
  communio:
    - "!Matt 21:13"
    - "Domus mea domus oratiónis vocábitur, dicit Dóminus: in ea omnis, qui
      petit, áccipit; et qui quærit, invénit; et pulsánti aperiétur.
      (Allelúja.)"
  postcommunio:
    - "Deus, qui de vivis et electis lapídibus ætérnum majestáti tuæ prǽparas
      habitáculum: auxiliáre pópulo tuo supplicánti; ut, quod Ecclésiæ tuæ
      corporálibus próficit spátiis, spirituálibus amplificétur augméntis."
    - $Per Dominum
  postcommunio-2-loco:
    - "!In ipsa die Dedicationis Ecclesiæ et per Octavam"
    - "v. Quǽsumus, omnípotens Deus: ut in hoc loco, quem nómini tuo indígni
      dedicávimus, cunctis peténtibus aures tuæ pietátis accómmodes."
    - $Per Dominum
  postcommunio-dedicationis-altaris:
    - "Omnípotens sempitérne Deus, altare hoc, nómini tuo dedicátum, cæléstis
      virtútis benedictióne sanctífica: et ómnibus in te sperántibus auxílii tui
      munus osténde; ut et hic sacramentórum virtus et votórum obtineátur
      efféctus."
    - $Per Dominum
