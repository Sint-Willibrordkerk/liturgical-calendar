oratio:
  - "Præsta, quǽsumus, omnípotens Deus: ut, intercedénte beáto N. Mártyre tuo,
    et a cunctis adversitátibus liberémur in córpore, et a pravis cogitatiónibus
    mundémur in mente."
  - $Per Dominum
lectio9:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 10:26-32"
  - "In illo témpore: Dixit Jesus discípulis suis: Nihil est opértum, quod non
    revelábitur; et occúltum, quod non sciétur. Et réliqua."
  - _
  - Homilía sancti Hilárii Epíscopi
  - "!Comment. in Matthaeum, can. 10 post medium"
  - "Dóminus diem judícii osténdit, quæ abstrúsam voluntátis nostræ consciéntiam
    prodet: et ea quæ nunc occúlta existimántur, luce cognitiónis públicæ
    déteget. Ígitur non minas, non consília, non potestátes insectántium monet
    esse metuéndas: quia dies judícii nulla hæc fuísse, atque inánia revelábit.
    Et quod dico vobis in ténebris, dícite in lúmine: et quod in aure audítis,
    prædicáte super tecta. Non légimus Dóminum sólitum fuísse nóctibus
    sermocinári, et doctrínam in ténebris tradidísse: sed quia omnis sermo ejus
    carnálibus ténebræ sunt, et verbum ejus infidélibus nox est."
