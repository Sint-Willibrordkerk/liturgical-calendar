lectio11:
  - "Ítaque id quod a se dictum est, cum libertáte fídei et confessiónis vult
    esse loquéndum. Idcírco quæ in ténebris dicta sunt prædicári jussit in
    lúmine: ut quæ secréto áurium commíssa sunt, super tecta, id est, excélso
    loquéntium præcónio audiántur. Constánter enim Dei ingerénda cognítio est,
    et profúndum doctrínæ evangélicæ secrétum in lúmine prædicatiónis apostólicæ
    revelándum: non timéntes eos, quibus cum sit licéntia in córpora, tamen in
    ánimam jus nullum est: sed timéntes pótius Deum, cui perdéndæ in gehénna et
    ánimæ et córporis sit potéstas."
lectio12:
  - "Nolíte timére eos qui occídunt corpus. Nullus ígitur córporum nostrórum
    casus est pertimescéndus, neque ullus interiméndæ carnis admitténdus est
    dolor: quando pro natúræ suæ atque oríginis conditióne resolúta, in
    substántiam spirituális ánimæ refundátur. Et quia doctrínis tálibus
    confirmátos opórtet líberam confiténdi Dei habére constántiam, étiam
    conditiónem, qua tenerémur, adjécit: negatúrum se eum Patri in cælis, qui se
    homínibus in terra negásset: eum porro qui conféssus coram homínibus se
    fuísset, a se in cælis confiténdum: qualésque nos nóminis sui testes
    homínibus fuissémus, tali nos apud Deum Patrem testimónio ejus usúros."
  - "&teDeum"
