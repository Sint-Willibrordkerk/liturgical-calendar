    lectio11:
      - "@Commune/C4:Lectio8:s/.* Sed homo /Sed homo /s"
    responsory11:
      - R. Iste sanctus digne in memóriam vértitur hóminum, qui ad gáudium
        tránsiit angelórum; † quóniam in hac peregrinatióne solo córpore
        constitútus, cogitatióne et aviditáte
      - "* In illa ætérna pátria conversátus est."
      - V. Vínculis carnis absolútus taléntum, sibi créditum Dómino suo
        duplicátum reportávit.
      - R. In illa ætérna pátria conversátus est.
    lectio12:
      - "@Commune/C4:Lectio9"
    responsory12:
      - R. Elégit te Dóminus sacerdótem sibi
      - "* Ad sacrificándum ei hóstiam laudis."
      - V. Ímmola Deo sacrifícium laudis, et redde Altíssimo vota tua.
      - R. Ad sacrificándum ei hóstiam laudis.
