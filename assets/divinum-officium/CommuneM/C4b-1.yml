        óculis Dómini;;95
      - In fide * et lenitáte ípsius Sanctum fecit illum Dóminus, et osténdit
        illi glóriam suam;;96
      - "Justus * germinábit sicut lílium: et florébit in ætérnum ante
        Dóminum;;97"
      - Sint lumbi vestri * præcíncti et lucérnæ ardéntes in mánibus
        vestris;;256;257;258
