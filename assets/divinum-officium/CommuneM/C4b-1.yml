    responsory4:
      - "R. Ecce vere Isrælíta, in quo dolus non est invéntus: † qui probátus
        repértus est sacérdos magnus"
      - "* Juxta órdinem Melchísedech."
      - V. Státuit ei Dóminus testaméntum sempitérnum, † et dedit illi
        sacerdótium magnum.
      - R. Juxta órdinem Melchísedech.
