    lectio8:
      - "@Commune/C4:Lectio6:s/.* Dúplici /Dúplici /s s/$/~/"
      - Lauda ergo post perículum, prǽdica secúrum. Lauda navigántis
        felicitátem, sed cum pervénit ad portum; lauda ducis virtútem, sed cum
        perdúctus est ad triúmphum.
    responsory8:
      - R. Justum dedúxit Dóminus per vias rectas, † et osténdit illi regnum
        Dei, et dedit illi sciéntiam sanctórum;
      - "* Honestávit illum in labóribus suis."
      - V. Custodívit eum ab inimícis et a seductóribus tutávit illum.
      - R. Honestávit illum in labóribus suis.
    lectio9:
