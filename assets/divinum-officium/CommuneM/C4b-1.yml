    lectio9-in-2-loco:
      - Léctio sancti Evangélii secúndum Matthǽum
      - "!Matt 24:42-47"
      - "In illo témpore: Dixit Jesus discípulis suis: Vigiláte, quia nescítis
        qua hora Dóminus vester ventúrus sit. Et réliqua."
      - _
      - Homilía sancti Hilárii Epíscopi
      - "!Comment. in Matth., cap. 26 in fine‚"
      - "Ut ignorántiam illam diéi ómnibus táciti, non sine útilis siléntii
        ratióne esse scirémus, vigiláre nos Dóminus propter advéntum furis
        admónuit, et oratíonum assiduitáte deténtos ómnibus præceptórum suórum
        opéribus inhærére. Furem enim esse osténdit zábulum, ad detrahénda ex
        nobis spólia pervígilem, et córporum nostrórum dómibus insidiántem: ut
        ea incuriósis nobis, et somno déditis, consiliórum suórum atque
        illecebrárum jáculis perfódiat. Parátos ígitur esse nos cónvenit: quia
        diéi ignorátio inténtam sollicitúdinem suspénsæ exspectatiónis
        exágitet."
    lectio10-in-2-loco:
      - "!Cap. 27"
      - "Quisnam est fidélis servus et prudens, quem constítuit Dóminus super
        famíliam suam? Quamquam in commúne nos ad indeféssam vigilántiæ curam
        adhortétur: speciálem tamen pópuli princípibus, id est, epíscopis, in
        exspectatióne adventúque suo sollicitúdinem mandat. Hunc enim servum
        fidélem atque prudéntem, præpósitum famíliæ signíficat, cómmoda atque
        utilitátes commíssi sibi pópuli curántem."
    lectio11-in-2-loco:
      - "Qui si dicto áudiens, et præcéptis obédiens erit, id est, si doctrínæ
        opportunitáte et veritáte infírma confírmet, disrúpta consólidet,
        depraváta convértat, et verbum vitæ in æternitátis cibum aléndæ famíliæ
        dispéndat, atque hæc agens, hisque ímmorans deprehendátur: glóriam a
        Dómino tamquam dispensátor fidélis et víllicus útilis consequétur, et
        super ómnia bona constituétur; id est, in Dei glória collocábitur, quia
        nihil sit ultra, quod mélius sit."
    lectio12-in-2-loco:
      - "Quod, si cóntuens longam Dei patiéntiam, quæ in proféctum humánæ
        salútis exténditur, advérsum consérvos insoléscet, et sæculi malus
        vitiísque se tradet, præséntium tantum curam in cultu ventris exércens;
        desperáta die Dóminus advéniet, eúmque a bonis, quæ spopónderat,
        dívidet, portionémque ejus cum hypócritis in pœnæ æternitáte constítuet:
        quia advéntum desperávit, quia mandátis non obtemperáverit, quia
        præséntibus studúerit, quia vita Géntium víxerit, quia desperatióne
        judícii commíssam sibi famíliam fame, siti, cæde vexáverit."
    evangelium-in-2-loco:
      - "@Commune/C4-1:Evangelium"
  oratio:
    - "v. Exáudi, quǽsumus, Dómine, preces nostras, quas in beáti N. Confessóris
      tui atque Pontíficis solemnitáte deférimus: et, qui tibi digne méruit
      famulári, ejus intercedéntibus méritis, ab ómnibus nos absólve peccátis."
    - $Per Dominum.
communi-summorum-pontificum/missa:
  - Si diligis
communi-summorum-pontificum/rule:
  - Psalmi Dominica
  - Antiphonas horas
  - Prefatio=Apostolis
communi-summorum-pontificum/oratio-pro-commemoratio:
  - "Deus, qui Ecclésiam tuam, in apostólicæ petræ soliditáte fundátam, ab
    infernárum éruis terróre portárum: præsta, quǽsumus; ut, intercedénte beáto
    N. Summo Pontífice, in tua veritáte persístens, contínua securitáte
    muniátur."
  - $Per Dominum.
communi-summorum-pontificum/oratio:
  - "Gregem tuum, Pastor ætérne, placátus inténde: et, per beátum N. Summum
    Pontíficem, perpétua protectióne custódi; quem totíus Ecclésiæ præstitísti
    esse pastórem."
  - $Per Dominum
