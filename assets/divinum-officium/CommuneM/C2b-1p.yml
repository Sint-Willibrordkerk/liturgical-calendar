    lectio1:
      - De libro Sapiéntiæ
      - "!Sap 5:1-4"
      - 1 Stabunt justi in magna constántia advérsus eos qui se angustiavérunt,
        et qui abstulérunt labóres eórum.
      - "2 Vidéntes turbabúntur timóre horríbili, et mirabúntur in subitatióne
        insperátæ salútis:"
      - "3 dicéntes intra se, pœniténtiam agéntes, et præ angústia spíritus
        geméntes: Hi sunt quos habúimus aliquándo in derísum, et in
        similitúdinem impropérii."
      - 4 Nos insensáti, vitam illórum æstimabámus insániam, et finem illórum
        sine honóre.
    lectio2:
      - "!Sap 5:5-7;14"
      - 5 Ecce quómodo computáti sunt inter fílios Dei, et inter sanctos sors
        illórum est.
      - 6 Ergo errávimus a via veritátis, et justítiæ lumen non luxit nobis, et
        sol intelligéntiæ non est ortus nobis.
      - "7 Lassáti sumus in via iniquitátis et perditiónis, et ambulávimus vias
        diffíciles: viam autem Dómini ignorávimus."
      - 14 Tália dixérunt in inférno hi qui peccavérunt.
    lectio3:
      - "!Sap 5:16-17"
      - 16 Justi autem in perpétuum vivent, et apud Dóminum est merces eórum, et
        cogitátio illórum apud Altíssimum.
      - "17 Ideo accípient regnum decóris, et diadéma speciéi de manu Dómini:
        quóniam déxtera sua teget eos, et bráchio sancto suo deféndet illos."
    lectio4:
      - "!Sap 5:18-21"
      - 18 Accípiet armatúram zelus illíus, et armábit creatúram ad ultiónem
        inimicórum.
      - "19 Induet pro thoráce justítiam, et accípiet pro gálea judícium certum:"
      - 20 sumet scutum inexpugnábile æquitátem.
      - 21 Acuet autem duram iram in lánceam, et pugnábit cum illo orbis
        terrárum contra insensátos.
