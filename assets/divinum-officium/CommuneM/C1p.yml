responsory4:
  - R. Ibant Apóstoli gaudéntes a conspéctu concílii,
  - "* Quóniam digni hábiti sunt pro nómine Jesu contuméliam pati, † allelúja,
    allelúja, allelúja."
  - V. Non sunt loquélæ, neque sermónes, quorum non audiántur voces eórum.
  - R. Quóniam digni hábiti sunt pro nómine Jesu contuméliam pati, † allelúja,
    allelúja, allelúja.
responsory5:
  - R. Lux perpétua lucébit Sanctis tuis, Dómine,
  - "* Et ætérnitas témporum, allelúja, allelúja."
  - "V. Lætítia sempitérna erit super cápita eórum: gáudium et exsultatiónem
    obtinébunt."
  - R. Et ætérnitas témporum, allelúja, allelúja.
responsory6:
  - R. Virtúte magna reddébant Apóstoli
  - "* Testimónium resurrectiónis Jesu Christi Dómini nostri, allelúja,
    allelúja."
  - V. Repléti quidem Spíritu Sancto, loquebántur cum fidúcia verbum Dei.
  - R. Testimónium resurrectiónis Jesu Christi Dómini nostri, allelúja, allelúja.
responsory7:
  - R. Isti sunt agni novélli, qui annuntiavérunt, allelúja, modo venérunt ad
    fontes,
  - "* Repléti sunt claritáte, allelúja, allelúja."
  - V. In conspéctu Agni amícti sunt stolis albis, et palmæ in mánibus eórum.
  - R. Repléti sunt claritáte, allelúja, allelúja.
  - "&Gloria"
  - R. Repléti sunt claritáte, allelúja, allelúja.
responsory8:
  - "R. Vidi portam civitátis ad Oriéntem pósitam, et Apostolórum nómina et Agni
    super eam scripta:"
  - "* Et super muros ejus Angelórum custódiam, allelúja."
  - V. Vidi cælum novum, et terram novam, et civitátem novam descendéntem de
    cælo.
  - R. Et super muros ejus Angelórum custódiam, allelúja.
responsory9:
  - "R. Ego sum vitis vera, et vos pálmites:"
  - "* Qui manet in me, et ego in eo, hic fert fructum multum, allelúja,
    allelúja."
  - V. Sicut diléxit me Pater, et ego diléxi vos.
  - R. Qui manet in me, et ego in eo, hic fert fructum multum, allelúja,
    allelúja.
responsory10:
  - "R. Cándidi facti sunt Nazarǽi ejus, allelúja: splendórem Deo dedérunt,
    allelúja:"
  - "* Et sicut lac coaguláti sunt, allelúja, allelúja."
  - V. Candidióres nive, nitidióres lacte, rubicundióres ébore antíquo, sapphíro
    pulchrióres.
  - R. Et sicut lac coaguláti sunt, allelúja, allelúja.
  - "&Gloria"
  - R. Et sicut lac coaguláti sunt, allelúja, allelúja.
responsory11:
  - "R. De ore prudéntis procédit mel, allelúja: dulcédo mellis est sub língua
    ejus, allelúja:"
  - "* Favus distíllans lábia ejus, allelúja, allelúja."
  - V. Sapiéntia requiéscit in corde ejus, et prudéntia in sermóne oris illíus.
  - R. Favus distíllans lábia ejus, allelúja, allelúja.
  - "&Gloria"
  - R. Favus distíllans lábia ejus, allelúja, allelúja.
responsory12:
  - "R. Non vos me elegístis, sed ego elégi vos, et pósui vos:"
  - "* Ut eátis, et fructum afferátis, et fructus vester máneat, allelúja,
    allelúja."
  - V. Sicut misit me Pater, et ego mitto vos.
  - R. Ut eátis, et fructum afferátis, et fructus vester máneat, allelúja,
    allelúja.
