lectio2_7:
  - "!Cant 5:1-3"
  - "1 Véniat diléctus meus in hortum suum, et cómedat fructum pomórum suórum.
    Veni in hortum meum soror mea sponsa, méssui myrrham meam cum aromátibus
    meis: comédi favum cum melle meo, bibi vinum meum cum lacte meo: comédite
    amíci, et bíbite, et inebriámini caríssimi."
  - "2 Ego dórmio, et cor meum vígilat. Vox dilécti mei pulsántis: Aperi mihi
    soror mea, amíca mea, colúmba mea, immaculáta mea: quia caput meum plenum
    est rore, et cincínni mei guttis nóctium."
  - 3 Exspoliávi me túnica mea, quómodo índuar illa? lavi pedes meos, quómodo
    inquinábo illos?
