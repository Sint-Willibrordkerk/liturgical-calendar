lectio1_8:
  - "!Cant 5:4-7"
  - 4 Diléctus meus misit manum suam per forámen, et venter meus intrémuit ad
    tactum ejus.
  - "5 Surréxi ut aperírem dilécto meo: manus meæ stillavérunt myrrham, et
    dígiti mei pleni myrrha probatíssima."
  - "6 Péssulum óstii mei apérui dilécto meo, at ille declináverat, atque
    transíerat. Anima mea liquefácta est, ut locútus est: quæsívi, et non invéni
    illum: vocávi, et non respóndit mihi."
