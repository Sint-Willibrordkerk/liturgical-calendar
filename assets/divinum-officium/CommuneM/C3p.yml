  lectio5-in-2-loco:
    - De Epístola sancti Cypriáni Epíscopi et Mártyris ad Mártyres et
      Confessóres.
    - "!Lib. 2. Epist. 6."
    - "Quibus ego vos láudibus prǽdicem, fortíssimi Mártyres? robur péctoris
      vestri, et perseverántiam fídei, quo præcónio vocis exórnem? Tolerástis
      usque ad consummatiónem glóriæ duríssimam quæstiónem: nec cessístis
      supplíciis, sed vobis pótius supplícia cessérunt. Finem dolóribus, quem
      torménta non dabant, corónæ dedérunt. Laniéna grávior ad hoc diu
      perseverávit, non ut stantem fidem dejíceret, sed ut hómines Dei ad Deum
      velócius mítteret."
  lectio6-in-2-loco:
    - "Vidit admírans præséntium multitúdo cæléste certamen, certámen Dei,
      certámen spiritále, prǽlium Christi: stetísse servos ejus voce líbera,
      mente incorrúpta, virtúte divína, telis quidem sæculáribus nudos, sed
      armis fídei ardéntis armátos. Stetérunt torti torquéntibus fortióres: et
      pulsántes ac laniántes úngulas, pulsáta ac laniáta membra vicérunt.
      Inexpugnábilem fidem superáre non pótuit sǽviens diu plaga repetíta,
      quamvis rupta compáge víscerum torqueréntur in servis Dei jam non membra,
      sed vúlnera. Fluébat sanguis, qui incéndium persecutiónis exstíngueret,
      qui flammas et ignes gehénnæ glorióso cruóre sopíret."
  lectio7-in-2-loco:
    - "Vidit admírans præséntium multitúdo cæléste certamen, certámen Dei,
      certámen spiritále, prǽlium Christi: stetísse servos ejus voce líbera,
      mente incorrúpta, virtúte divína, telis quidem sæculáribus nudos, sed
      armis fídei ardéntis armátos. Stetérunt torti torquéntibus fortióres: et
      pulsántes ac laniántes úngulas, pulsáta ac laniáta membra vicérunt.
      Inexpugnábilem fidem superáre non pótuit sǽviens diu plaga repetíta,
      quamvis rupta compáge víscerum torqueréntur in servis Dei jam non membra,
      sed vúlnera. Fluébat sanguis, qui incéndium persecutiónis exstíngueret,
      qui flammas et ignes gehénnæ glorióso cruóre sopíret."
    - "O quale illud fuit spectáculum Dómino, quam sublíme, quam magnum, quam
      Dei óculis sacraménto ac devotióne mílitis ejus accéptum: sicut scriptum
      est in Psalmis, Spíritu Sancto loquénte ad nos páriter et monénte:
      Pretiósa est in conspéctu Dómini mors justórum ejus. Pretiósa mors hæc
      est, quæ emit immortalitátem prétio sui sánguinis; quæ accépit corónam de
      consummatióne virtútis. Quam lætus illic Christus fuit, quam libens in
      tálibus servis suis et pugnávit, et vicit protéctor fídei, dans
      credéntibus tantum, quantum se credit cápere qui sumit! Certámini suo
      ádfuit, præliatóres atque assertóres sui nóminis eréxit, corroborávit,
      animávit. Et qui pro nobis mortem semel vicit, semper vincit in nobis."
