        lectio4-in-2-loco:
          - De Expositióne sancti Augustíni Epíscopi super psalmum octogésimum
            sextum
          - "!Ante medium"
          - "Fundaménta ejus in móntibus sanctis: díligit Dóminus portas Sion.
            Quare sunt fundaménta Apóstoli et Prophétæ? Quia eórum auctóritas
            portat infirmitátem nostram. Quare sunt portæ? Quia per ipsos
            intrámus ad regnum Dei. Prǽdicant enim nobis: et, cum per ipsos
            intrámus, per Christum intrámus; ipse est enim jánua. Et cum
            dicúntur duódecim portæ Jerúsalem, et una porta Christus et duódecim
            portæ Christus, quia in duódecim portis Christus; et ídeo
            duodenárius númerus Apostolórum. Sacraméntum magnum hujus duodenárii
            significátio est númeri. Sedébitis, inquit, super duódecim sedes,
            judicántes duódecim tribus Israël."
        lectio5-in-2-loco:
          - "Si duódecim sellæ ibi sunt, non est ubi sédeat tértius décimus
            Paulus Apóstolus, et non erit quómodo júdicet; et ipse se
            judicatúrum dixit, non hómines tantum, sed et ángelos. Quos ángelos,
            nisi apóstatas ángelos? Nescítis, inquit, quia ángelos judicábimus?
            Respondéret ergo turba: Quid te jactas judicatúrum? Ubi sedébis?
            Duódecim sedes dixit Dóminus duódecim Apóstolis, unus cécidit Judas,
            in locum ipsíus sanctus Matthías ordinátus est; implétus est
            duodenárius númerus sédium. Primo locum invéni, ubi sédeas; et sic
            te mináre judicatúrum. Duódecim ergo sedes quid sibi velint,
            videámus. Sacraméntum est cujúsdam universitátis; quia per totum
            orbem terrárum futúra erat Ecclésia, unde vocátur hoc ædifícium ad
            Christi compágem."
        lectio6-in-2-loco:
          - Et ídeo, quia úndique venítur ad judicándum, duódecim sedes sunt;
            sicut, quia úndique intrátur in illam civitátem, duódecim portæ
            sunt. Non solum ergo illi duódecim et Apóstolus Paulus, sed quotquot
            judicatúri sunt, propter significatiónem universitátis, ad sedes
            duódecim pértinent; quemádmodum quotquot intrábunt, ad duódecim
            portas pértinent. Partes enim mundi quátuor sunt, Oriens, Occidens,
            Aquilo et Merídies. Istæ quátuor partes assídue nominántur in
            Scriptúris. Ab istis quátuor ventis, sicut dicit Dóminus in
            Evangélio, a quátuor ventis se collectúrum eléctos suos; ab ómnibus
            ergo istis quátuor ventis vocátur Ecclésia. Quómodo vocátur? Undique
            in Trinitáte vocátur. Non vocátur nisi per baptísmum in nómine
            Patris, et Fílii, et Spíritus Sancti. Quátuor ergo ter ducta
            duódecim inveniúntur.
        lectio7-in-2-loco:
          - Léctio sancti Evangélii secúndum Matthǽum
          - "!Matt 19:27-29"
          - "In illo témpore: Dixit Petrus ad Jesum: Ecce nos relíquimus ómnia,
            et secúti sumus te: quid ergo erit nobis? Et réliqua."
          - _
          - Homilía sancti Bedæ Venerábilis Presbýteri
          - "!Homilia in Natali S. Benedicti Ep."
          - "Perféctus ille est, qui ábiens vendit ómnia quæ habet, et dat
            paupéribus, ac véniens séquitur Christum; habébit enim thesáurum non
            deficiéntem in cælis. Unde bene, interrogánte Petro, dixit tálibus
            Jesus: Amen dico vobis, quod vos qui secúti estis me, in
            regeneratióne, cum séderit Fílius hóminis in sede majestátis suæ,
            sedébitis et vos super sedes duódecim, judicántes duódecim tribus
            Israël. In hac quippe vita pro ejus nómine laborántes, in ália
            prǽmium speráre dócuit, id est, in regeneratióne; cum vidélicet in
            vitam immortálem fuérimus resurgéndo regeneráti, qui in vitam
            cadúcam mortáliter erámus géniti."
        lectio8-in-2-loco:
          - "Et justa prorsus retribútio, ut, qui hic pro Christo humánæ glóriam
            celsitúdinis neglexérunt, illic a Christo júdices glorificáti
            singuláriter cum eo assídeant qui a sequéndis ejus vestígiis nulla
            ratióne póterant avélli. Nemo autem putet duódecim tantum Apóstolos,
            quia pro Juda prævaricánte Matthías eléctus est, tunc esse
            judicatúros; sicut nec duódecim solæ sunt tribus Israël judicándæ:
            alióquin tribus Levi, quæ tertiadécima est, injudicáta recédet."
        lectio9-in-2-loco:
          - "Et Paulus, qui tertiusdécimus est Apóstolus, judicándi sorte
            privábitur? cum ipse dicat: Nescítis quóniam ángelos judicábimus,
            quanto magis sæculária? Sciéndum namque est, omnes, qui ad exémplum
            Apostolórum, sua reliquérunt ómnia et secúti sunt Christum, júdices
            cum eo ventúros, sicut étiam omne mortálium genus esse judicándum.
            Quia enim duodenário sæpe número solet in Scriptúris univérsitas
            designári, per duódecim sedes Apostolórum ómnium numerósitas
            judicántium, et, per duódecim tribus Israël, univérsitas eórum qui
            judicándi sunt, osténditur."
          - "&teDeum"
