  lectio12-in-2-loco:
    - "Si manséritis in me, inquit, et verba mea in vobis mánserint: quodcúmque
      voluéritis petétis, et fiet vobis. Manéndo quippe in Christo, quid velle
      possunt, nisi quod cónvenit Christo? Quid velle possunt manéndo in
      Salvatóre, nisi quod non est aliénum a salúte? Áliud quippe vólumus quia
      sumus in Christo: et áliud vólumus quia sumus adhuc in hoc sǽculo. De
      mansióne namque hujus sǽculi nobis aliquándo subrépit, ut hoc petámus,
      quod nobis non expedíre nescímus. Sed absit ut fiat nobis, si manémus in
      Christo, qui non facit quando pétimus, nisi quod éxpedit nobis."
    - "&teDeum"
  evangelium-in-2-loco:
    - Sequéntia ++ sancti Evangélii secúndum Joánnem
    - "!Joannes 15:5-11"
    - "In illo témpore: Dixit Jesus discípulis suis: Ego sum vitis, vos
      pálmites: qui manet in me, et ego in eo, hic fert fructum multum: quia
      sine me nihil potéstis fácere. Si quis in me non mánserit, mittétur foras
      sicut palmes, et aréscet, et cólligent eum, et in ignem mittent, et ardet.
      Si manséritis in me, et verba mea in vobis mánserint: quodcúmque
      voluéritis, petétis, et fiet vobis. In hoc clarificátus est Pater meus,
      ut fructum plúrimum afferátis, et efficiámini mei discípuli. Sicut
      diléxit me Pater, et ego diléxi vos. Manéte in dilectióne mea. Si
      præcépta mea servavéritis, manébitis in dilectióne mea, sicut et ego
      Patris mei præcépta servávi, et máneo in ejus dilectióne. Hæc locútus
      sum vobis, ut gáudium meum in vobis sit, et gáudium vestrum impleátur."
