  lectio9-in-2-loco:
    - Léctio sancti Evangélii secúndum Joánnem
    - "!Joannes 15:5-10"
    - "In illo témpore: Dixit Jesus discípulis suis: Ego sum vitis, vos
      pálmites: qui manet in me, et ego in eo, hic fert fructum multum: quia
      sine me nihil potéstis fácere. Et réliqua."
    - _
    - Homilía sancti Augustíni Epíscopi
    - "!Tract. 81 in Joan., sub med."
    - "Ne quisquam putáret saltem parvum áliquem fructum posse a semetípso
      pálmitem ferre: cum dixísset, Hic fert fructum multum; non ait, Quia sine
      me parum potéstis fácere; sed, Nihil potéstis fácere. Sive ergo parum,
      sive multum, sine illo fíeri non potest, sine quo nihil fíeri potest: quia
      etsi parum attúlerit palmes, eum purgat agrícola, ut plus áfferat; tamen
      nisi in vite mánserit, et víxerit de radíce, quantúmlibet fructum a
      semetípso non potest ferre. Quamvis autem Christus vitis non esset, nisi
      homo esset: tamen istam grátiam palmítibus non præbéret, nisi étiam Deus
      esset."
