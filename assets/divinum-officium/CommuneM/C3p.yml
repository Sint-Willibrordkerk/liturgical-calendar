  responsory7:
    - R. Fíliæ Jerúsalem, veníte et vidéte Mártyres cum corónis, quibus
      coronávit eos Dóminus
    - "* In die solemnitátis et lætítiæ, allelúja."
    - V. Quóniam confortávit seras portárum tuárum, benedíxit fílios tuos in te.
    - R. In die solemnitátis et lætítiæ, allelúja.
    - "&Gloria"
    - R. In die solemnitátis et lætítiæ, allelúja.
  lectio8:
    - "Ignóta enim erat ante Christi advéntum via vitæ, quæ nullíus adhuc
      resurgéntis fúerat temeráta vestígio. At ubi Dóminus resurréxit, nota
      facta, solo attríta est plurimórum: de quibus sanctus Evangelísta ait:
      Multórum córpora Sanctórum surrexérunt cum eo, et introiérunt in sanctam
      civitátem. Unde cum Dóminus in resurrectióne sua díxerit, Notas mihi
      fecísti vias vitæ: póssumus et nos jam dícere Dómino: Notas fecísti nobis
      vias vitæ. Ipse enim nobis notas fecit vias vitæ, qui nobis sémitam
      manifestávit ad vitam. Notas enim mihi fecit vias vitæ, cum me dócuit
      fidem, misericórdiam, justítiam, castitátem: his enim pervenítur
      itinéribus ad salútem."
  responsory8:
    - R. Lætábitur justus in Dómino, et sperábit in eo, et laudabúntur
    - "* Omnes recti corde, allelúja, allelúja."
    - V. Lætamini in Dómino et exsultáte, justi, et gloriámini.
    - R. Omnes recti corde, allelúja, allelúja.
  lectio9:
    - Léctio sancti Evangélii secúndum Joánnem
    - "!Joannes 15:1-7"
    - "In illo témpore: Dixit Jesus discípulis suis: Ego sum vitis vera: et
      Pater meus agrícola est. Et réliqua."
    - _
    - Homilía sancti Augustíni Epíscopi
    - "!Tract. 80 in Joannem"
    - Iste locus evangélicus, fratres, ubi se dicit Dóminus vitem, et discípulos
      suos pálmites, secúndum hoc dicit, quod est caput Ecclésiæ, nosque membra
      ejus, mediátor Dei et hóminum, homo Christus Jesus. Uníus quippe natúræ
      sunt vitis et pálmites. Propter quod cum esset Deus, cujus natúræ non
      sumus, factus est homo, ut in illo esset vitis humána natúra, cujus et nos
      hómines pálmites esse possémus.
  lectio10:
    - "Quid ergo est, Ego sum vitis vera? Numquid ut ádderet, vera, hoc ad eam
      vitem rétulit, unde ista similitúdo transláta est? Sic enim dícitur vitis
      per similitúdinem, non per proprietátem: quemádmodum dícitur ovis, agnus,
      leo, petra, lapis anguláris, et cétera hujúsmodi, quæ magis ipsa sunt
      vera, ex quibus ducúntur istæ similitúdines, non proprietátes. Sed cum
      dicit, Ego sum vitis vera: ab illa se útique discérnit, cui dícitur:
      Quómodo convérsa es in amaritúdinem vitis aliéna? Nam quo pacto est vitis
      vera, quæ exspectáta est ut fáceret uvam, fecit autem spinas?"
  lectio11:
    - "Quid ergo est, Ego sum vitis vera? Numquid ut ádderet, vera, hoc ad eam
      vitem rétulit, unde ista similitúdo transláta est? Sic enim dícitur vitis
      per similitúdinem, non per proprietátem: quemádmodum dícitur ovis, agnus,
      leo, petra, lapis anguláris, et cétera hujúsmodi, quæ magis ipsa sunt
      vera, ex quibus ducúntur istæ similitúdines, non proprietátes. Sed cum
      dicit, Ego sum vitis vera: ab illa se útique discérnit, cui dícitur:
      Quómodo convérsa es in amaritúdinem vitis aliéna? Nam quo pacto est vitis
      vera, quæ exspectáta est ut fáceret uvam, fecit autem spinas?"
    - "Ego sum, inquit, vitis vera: et Pater meus agrícola est. Numquid unum
      sunt agrícola et vitis? Secúndum hoc ergo vitis Christus, secúndum quod
      ait: Pater major me est. Secúndum autem id, quod ait: Ego, et Pater unum
      sumus; et ipse agrícola est: nec talis, quales sunt, qui extrínsecus
      operándo éxhibent ministérium: sed talis, ut det étiam intrínsecus
      increméntum. Nam neque qui plantat est áliquid, neque qui rigat: sed, qui
      increméntum dat, Deus. Sed útique Deus est Christus, quia Deus erat
      Verbum: unde ipse, et Pater unum sunt. Et, si Verbum caro factum est, quod
      non erat, manet quod erat."
    - "&teDeum"
  responsory11:
