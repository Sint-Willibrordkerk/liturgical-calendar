        lectio1:
          - De Epístola prima beáti Pauli Apóstoli ad Corínthios
          - "!1 Cor 4:1-5"
          - 1 Sic nos exístimet homo ut minístros Christi, et dispensatóres
            mysteriórum Dei.
          - 2 Hic jam quǽritur inter dispensatóres ut fidélis quis inveniátur.
          - "3 Mihi autem pro mínimo est ut a vobis júdicer, aut ab humáno die:
            sed neque meípsum júdico."
          - "4 Nihil enim mihi cónscius sum, sed non in hoc justificátus sum:
            qui autem júdicat me, Dóminus est."
          - "5 Ítaque nolíte ante tempus judicáre, quoadúsque véniat Dóminus:
            qui et illuminábit abscóndita tenebrárum, et manifestábit consília
            córdium: et tunc laus erit unicuíque a Deo."
        responsory1:
          - "R. Ecce ego mitto vos sicut oves in médio lupórum, dicit Dóminus:"
          - "* Estóte ergo prudéntes sicut serpéntes, et símplices sicut
            colúmbæ."
          - V. Dum lucem habétis, crédite in lucem, ut fílii lucis sitis.
          - R. Estóte ergo prudéntes sicut serpéntes, et símplices sicut colúmbæ.
        lectio2:
          - "!1 Cor 4:6-9"
          - "6 Hæc autem, fratres, transfigurávi in me et Apóllo, propter vos:
            ut in nobis discátis, ne supra quam scriptum est, unus advérsus
            álterum inflétur pro álio."
          - 7 Quis enim te discérnit? Quid autem habes quod non accepísti? Si
            autem accepísti, quid gloriáris quasi non accéperis?
          - "8 Jam saturáti estis, jam dívites facti estis: sine nobis regnátis:
            et útinam regnétis, ut et nos vobíscum regnémus."
          - "9 Puto enim quod Deus nos Apóstolos novíssimos osténdit, tamquam
            morti destinátos: quia spectáculum facti sumus mundo, et Ángelis, et
            homínibus."
        responsory2:
          - "R. Tóllite jugum meum super vos, dicit Dóminus, et díscite a me,
            quia mitis sum et húmilis corde:"
          - "* Jugum enim meum suáve est, et onus meum leve."
          - V. Et inveniétis réquiem animábus vestris.
          - R. Jugum enim meum suáve est, et onus meum leve.
        lectio3:
          - "!1 Cor 4:10-15"
          - "10 Nos stulti propter Christum, vos autem prudéntes in Christo: nos
            infírmi, vos autem fortes: vos nóbiles, nos autem ignóbiles."
          - 11 Usque in hanc horam et esurímus, et sitímus, et nudi sumus, et
            cólaphis cǽdimur, et instábiles sumus,
          - "12 et laborámus operántes mánibus nostris: maledícimur, et
            benedícimus: persecutiónem pátimur, et sustinémus:"
          - "13 blasphemámur, et obsecrámus: tamquam purgaménta hujus mundi
            facti sumus, ómnium peripséma usque adhuc."
          - 14 Non ut confúndam vos, hæc scribo, sed ut fílios meos caríssimos
            móneo.
          - 15 Nam si decem míllia pædagogórum habeátis in Christo, sed non
            multos patres, nam in Christo Jesu per Evangélium ego vos génui.
        responsory3:
          - "R. Dum stetéritis ante reges et prǽsides, nolíte cogitáre quómodo
            aut quid loquámini:"
          - "* Dábitur enim vobis in illa hora, quid loquámini."
          - "V. Non enim vos estis qui loquímini: sed Spíritus Patris vestri,
            qui lóquitur in vobis."
          - R. Dábitur enim vobis in illa hora, quid loquámini.
          - "&Gloria"
          - R. Dábitur enim vobis in illa hora, quid loquámini.
        lectio4:
          - Sermo sancti Gregórii Papæ
          - "!Homilia 30 in Evangelia, post medium"
          - "Scriptum est: Spíritus Dómini ornávit cælos. Ornaménta enim cælórum
            sunt virtútes prædicántium. Quæ vidélicet ornaménta Paulus enúmerat,
            dicens: Álii datur per Spíritum sermo sapiéntiæ, álii sermo sciéntiæ
            secúndum eúndem Spíritum, álteri fides in eódem Spíritu, álii grátia
            sanitátum in uno Spíritu, álii operátio virtútum, álii prophetía,
            álii discrétio spirítuum, álii génera linguárum, álii interpretátio
            sermónum. Hæc autem ómnia operátur unus atque idem Spíritus,
            dívidens síngulis prout vult."
        responsory4:
          - "R. Vidi conjúnctos viros, habéntes spléndidas vestes, et Ángelus
            Dómini locútus est ad me, dicens:"
          - "* Isti sunt viri sancti facti amíci Dei."
          - V. Vidi Ángelum Dei fortem, volántem per médium cælum, voce magna
            clamántem et dicéntem.
          - R. Isti sunt viri sancti facti amíci Dei.
        lectio5:
          - "Quot ergo sunt bona prædicántium, tot sunt ornaménta cælórum. Hinc
            rursus scriptum est: Verbo Dómini cæli firmáti sunt. Verbum enim
            Dómini Fílius est Patris. Sed eósdem cælos, vidélicet sanctos
            Apóstolos, ut tota simul sancta Trínitas ostendátur operáta, repénte
            de Sancti Spíritus divinitáte adjúngitur: Et Spíritu oris ejus omnis
            virtus eórum. Cælórum ergo virtus de Spíritu sumpta est: quia mundi
            hujus potestátibus contraíre non præsúmerent, nisi eos Sancti
            Spíritus fortitúdo solidásset. Quales namque doctóres sanctæ
            Ecclésiæ ante advéntum hujus Spíritus fúerint, scimus: et post
            advéntum illíus, cujus fortitúdinis facti sint, conspícimus."
        responsory5:
          - "R. Beáti estis, cum maledíxerint vobis hómines, et persecúti vos
            fúerint, et díxerint omne malum advérsum vos, mentiéntes, propter
            me:"
          - "* Gaudéte et exsultáte, quóniam merces vestra copiósa est in cælis."
          - V. Cum vos óderint hómines, et cum separáverint vos, et
            exprobráverint, et ejécerint nomen vestrum tamquam malum propter
            Fílium hóminis.
          - R. Gaudéte et exsultáte, quóniam merces vestra copiósa est in cælis.
        lectio6:
          - "Certe iste ipse pastor Ecclésiæ, ad cujus sacratíssimum corpus
            sedémus, quantæ debilitátis, quantǽque formídinis ante advéntum
            Spíritus fúerit, ancílla ostiária requisíta dicat. Una enim mulíeris
            voce percúlsus, dum mori tímuit, Vitam negávit. Et pensándum, quia
            eum comprehénsum Petrus negávit in terra, quem suspénsum latro
            conféssus est in cruce. Sed vir iste tantæ formídinis, qualis post
            advéntum Spíritus exsístat, audiámus. Fit convéntus magistrátus
            atque seniórum, cæsis denuntiátur Apóstolis, ne in nómine Jesu loqui
            débeant: Petrus magna auctoritáte respóndet: Obedíre opórtet Deo
            magis quam homínibus."
        responsory6:
          - "R. Isti sunt triumphatóres et amíci Dei, qui contemnéntes jussa
            príncipum, meruérunt prǽmia ætérna:"
          - "* Modo coronántur, et accípiunt palmam."
          - V. Isti sunt qui venérunt ex magna tribulatióne, et lavérunt stolas
            suas in sánguine Agni.
          - R. Modo coronántur, et accípiunt palmam.
          - "&Gloria"
          - R. Modo coronántur, et accípiunt palmam.
        lectio7:
          - Léctio sancti Evangélii secúndum Matthǽum.
          - "!Matt 19:27-29"
          - "In illo témpore: Dixit Petrus ad Jesum: Ecce nos relíquimus ómnia,
            et secúti sumus te: quid ergo erit nobis? Et réliqua."
          - _
          - Homilía sancti Hierónymi Presbýteri.
          - "!Lib. 3. in Matth. cap. 19."
          - "Grandis fidúcia! Petrus piscátor erat, dives non fúerat, cibos manu
            et arte quærébat: et tamen lóquitur confidénter: Relíquimus ómnia.
            Et quia non súfficit tantum relínquere, jungit quod perféctum est:
            Et secúti sumus te. Fécimus quod jussísti: quid ígitur nobis dabis
            prǽmii? Jesus autem dixit illis: Amen dico vobis, quod vos qui
            secúti estis me, in regeneratióne, cum séderit Fílius hóminis in
            sede majestátis suæ, sedébitis et vos super sedes duódecim,
            judicántes duódecim tribus Ísraël. Non dixit: Qui reliquístis ómnia;
            hoc enim et Crates fecit philósophus, et multi álii divítias
            contempsérunt: sed, Qui secúti estis me: quod próprie Apostolórum
            est, atque credéntium."
        responsory7:
          - "R. Isti sunt qui vivéntes in carne, plantavérunt Ecclésiam sánguine
            suo:"
          - "* Cálicem Dómini bibérunt, et amíci Dei facti sunt."
          - V. In omnem terram exívit sonus eórum, et in fines orbis terræ verba
            eórum.
          - R. Cálicem Dómini bibérunt, et amíci Dei facti sunt.
        lectio8:
          - "In regeneratióne, cum séderit Fílius hóminis in sede majestátis suæ
            (quando et mórtui de corruptióne resúrgent incorrúpti) sedébitis et
            vos in sóliis judicántium, condemnántes duódecim tribus Ísraël: quia
            vobis credéntibus, illi crédere noluérunt. Et omnis qui relíquerit
            domum, vel fratres, aut soróres, aut patrem, aut matrem, aut uxórem,
            aut fílios, aut agros propter nomen meum, céntuplum accípiet, et
            vitam ætérnam possidébit. Locus iste cum illa senténtia cóngruit, in
            qua Salvátor lóquitur: Non veni pacem míttere, sed gládium. Veni
            enim separáre hóminem a patre suo, et matrem a fília, et nurum a
            socru: et inimíci hóminis doméstici ejus. Qui ergo propter fidem
            Christi, et prædicatiónem Evangélii, omnes afféctus contémpserint,
            atque divítias et sǽculi voluptátes: isti céntuplum recípient, et
            vitam ætérnam possidébunt."
        responsory8:
          - "R. Isti sunt viri sancti, quos elégit Dóminus in caritáte non
            ficta, et dedit illis glóriam sempitérnam:"
          - "* Quorum doctrína fulget Ecclésia, ut sole luna."
          - "V. Sancti per fidem vicérunt regna: operáti sunt justítiam."
          - R. Quorum doctrína fulget Ecclésia, ut sole luna.
          - "&Gloria"
          - R. Quorum doctrína fulget Ecclésia, ut sole luna.
        lectio9:
          - "Ex occasióne hujus senténtiæ quidam introdúcunt mille annos post
            resurrectiónem, dicéntes, tunc nobis céntuplum ómnium rerum quas
            dimísimus, et vitam ætérnam esse reddéndam: non intelligéntes, quod,
            si in céteris digna sit repromíssio, in uxóribus appáreat turpitúdo:
            ut qui unam pro Dómino dimíserit centum recípiat in futúro. Sensus
            ergo iste est: Qui carnália pro Salvatóre dimíserit, spirituália
            recípiet: quæ comparatióne et mérito sui ita erunt, quasi si parvo
            número centenárius númerus comparétur."
          - "&teDeum"
