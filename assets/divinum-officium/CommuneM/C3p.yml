  lectio1:
    - De libro Sapiéntiæ
    - "!Sap 5:1-4"
    - 1 Stabunt justi in magna constántia advérsus eos qui se angustiavérunt, et
      qui abstulérunt labóres eórum.
    - "2 Vidéntes turbabúntur timóre horríbili, et mirabúntur in subitatióne
      insperátæ salútis:"
    - "3 dicéntes intra se, pœniténtiam agéntes, et præ angústia spíritus
      geméntes: Hi sunt quos habúimus aliquándo in derísum, et in similitúdinem
      impropérii."
    - 4 Nos insensáti, vitam illórum æstimabámus insániam, et finem illórum sine
      honóre.
  lectio2:
    - "!Sap 5:5-7;14"
    - 5 Ecce quómodo computáti sunt inter fílios Dei, et inter sanctos sors
      illórum est.
    - 6 Ergo errávimus a via veritátis, et justítiæ lumen non luxit nobis, et
      sol intelligéntiæ non est ortus nobis.
    - "7 Lassáti sumus in via iniquitátis et perditiónis, et ambulávimus vias
      diffíciles: viam autem Dómini ignorávimus."
    - 14 Tália dixérunt in inférno hi qui peccavérunt.
  lectio3:
    - "!Sap 5:16-17"
    - 16 Justi autem in perpétuum vivent, et apud Dóminum est merces eórum, et
      cogitátio illórum apud Altíssimum.
    - "17 Ideo accípient regnum decóris, et diadéma speciéi de manu Dómini:
      quóniam déxtera sua teget eos, et bráchio sancto suo deféndet illos."
  lectio4:
    - "!Sap 5:18-21"
    - 18 Accípiet armatúram zelus illíus, et armábit creatúram ad ultiónem
      inimicórum.
    - "19 Induet pro thoráce justítiam, et accípiet pro gálea judícium certum:"
    - 20 sumet scutum inexpugnábile æquitátem.
    - 21 Acuet autem duram iram in lánceam, et pugnábit cum illo orbis terrárum
      contra insensátos.
  responsory4:
    - "R. De ore prudéntis procédit mel, allelúja: dulcédo mellis est sub língua
      ejus, allelúja:"
    - "* Favus distíllans lábia ejus, allelúja, allelúja."
    - V. Sapiéntia requiéscit in corde ejus, et prudéntia in sermóne oris illíus.
    - R. Favus distíllans lábia ejus, allelúja, allelúja.
    - "&Gloria"
    - R. Favus distíllans lábia ejus, allelúja, allelúja.
  lectio5:
    - Sermo sancti Ambrosii Episcopi
    - "!Serm. 22"
    - "Dignum et cóngruum est, fratres, ut post lætítiam Paschæ, quam in
      Ecclésia celebrávimus, gáudia nostra cum sanctis Martýribus conferámus: et
      iis annuntiémus Domínicæ resurrectiónis glóriam, qui consórtes sunt
      Domínicæ passiónis. Qui enim sócii sunt contuméliæ, debent et partícipes
      esse lætítiæ. Ita enim dicit beátus Apóstolus: Sicut sócii passiónum
      estis, et resurrectiónis éritis: si tolerábimus, inquit, et conregnábimus.
      Qui ergo toleravérunt mala propter Christum, debent et glóriam habére cum
      Christo."
  lectio6:
    - "Annuntiémus inquam sanctis Martýribus Domínicæ Paschæ grátiam: ut dum
      sepultúræ illíus prædicámus reseráta claustra, et horum sepúlcra
      reseréntur: dum corpus illíus mortuum dícimus tepéntibus venis súbito
      viguísse, horum quoque membra jam frígida immortalitátis calóre foveántur.
      Éadem enim rátio Mártyres súscitat, quæ et Dóminum suscitávit. Nam sicut
      viam passiónis ejus expérti sunt, ita experiéntur et vitæ; scriptum est
      enim in Psalmo: Notas mihi fecísti vias vitæ. Hoc útique in resurrectióne
      ex persóna dícitur Salvatóris: ut qui, dum post mortem ab ínferis redit ad
      súperos, incípiat notam habére viam vitæ, quæ ante habebátur ignóta."
  responsory6:
    - R. In servis suis, allelúja,
    - "* Consolábitur Deus, allelúja."
    - V. Judicábit Dóminus pópulum suum, et in servis suis.
    - R. Consolábitur Deus, allelúja.
