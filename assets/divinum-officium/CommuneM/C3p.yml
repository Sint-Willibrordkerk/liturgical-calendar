evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joannes 15:5-11"
  - "In illo témpore: Dixit Jesus discípulis suis: Ego sum vitis, vos pálmites:
    qui manet in me, et ego in eo, hic fert fructum multum: quia sine me nihil
    potéstis fácere. Si quis in me non mánserit, mittétur foras sicut palmes, et
    aréscet, et cólligent eum, et in ignem mittent, et ardet. Si manséritis in
    me, et verba mea in vobis mánserint: quodcúmque voluéritis, petétis, et fiet
    vobis. In hoc clarificátus est Pater meus, ut fructum plúrimum afferátis,
    et efficiámini mei discípuli. Sicut diléxit me Pater, et ego diléxi vos.
    Manéte in dilectióne mea. Si præcépta mea servavéritis, manébitis in
    dilectióne mea, sicut et ego Patris mei præcépta servávi, et máneo in
    ejus dilectióne. Hæc locútus sum vobis, ut gáudium meum in vobis sit, et
    gáudium vestrum impleátur."
