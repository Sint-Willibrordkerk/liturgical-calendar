      - "&Gloria"
      - R. Afferéntur tibi in lætítia et exsultatióne.
    lectio7:
      - Léctio sancti Evangélii secúndum Matthǽum
      - "!Matt 25:1-13"
      - "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Símile
        erit regnum cælórum decem virgínibus, quæ, accipiéntes lámpades suas,
        exiérunt óbviam sponso et sponsæ. Et réliqua."
      - _
      - Homilía sancti Gregórii Papæ
      - "!Homilía 12 in Evangelia"
      - Sæpe vos, fratres caríssimi, admóneo prava ópera fúgere, mundi hujus
        inquinaménta devitáre, sed hodiérna sancti Evangélii lectióne compéllor
        dícere, ut, et bona, quæ ágitis, cum magna cautéla teneátis;  ne per
        hoc, quod a vobis rectum géritur, favor aut grátia humána
        requirátur;  ne appetítus laudis subrépat, et, quod foris osténditur,
        intus a mercéde vacuétur. Ecce enim Redemptóris voce decem vírgines, et
        omnes dicúntur vírgines, et tamen intra beatitúdinis jánuam non omnes
        sunt recéptæ;  quia eárum quædam, dum de virginitáte sua glóriam foris
        éxpetunt, in vasis suis óleum habére noluérunt.
    responsory7:
      - "R. Hæc est Virgo sápiens, quam Dóminus vigilántem invénit, quæ accéptis
        lampádibus sumpsit secum óleum:"
      - "* Et veniénte Dómino, introívit cum eo ad núptias."
      - "V. Média nocte clamor factus est: Ecce sponsus venit, exíte óbviam ei."
      - R. Et veniénte Dómino, introívit cum eo ad núptias.
    lectio8:
      - "Sed prius quæréndum nobis est quid sit regnum cælórum, aut cur decem
        virgínibus comparétur, quæ étiam vírgines prudéntes et fátuæ dicántur.
        Dum enim cælórum regnum constat quia reprobórum nullus ingréditur, étiam
        fátuis virgínibus cur símile esse perhibétur? Sed sciéndum nobis est
        quod sæpe in sacro elóquio regnum cælórum præséntis témporis Ecclésia
        dícitur. De quo álio in loco Dóminus dicit: Mittet Fílius hóminis
        Ángelos suos, et cólligent de regno ejus ómnia scándala. Neque enim in
        illo regno beatitúdinis, in quo pax summa est, inveníri scándala
        póterunt, quæ colligántur."
    responsory8:
      - "R. Média nocte clamor factus est:"
      - "* Ecce sponsus venit, exíte óbviam ei."
      - V. Prudéntes vírgines, aptáte vestras lámpades.
      - R. Ecce sponsus venit, exíte óbviam ei.
      - "&Gloria"
      - R. Ecce sponsus venit, exíte óbviam ei.
    lectio9:
      - In quinque autem córporis sénsibus unusquísque subsístit;  geminátus
        autem quinárius denárium pérficit. Et, quia ex utróque sexu fidélium
        multitúdo collígitur, sancta Ecclésia decem virgínibus símilis esse
        denuntiátur. In qua quia mali cum bonis et réprobi cum eléctis admíxti
        sunt, recte símilis virgínibus prudéntibus et fátuis esse perhibétur.
        Sunt namque pleríque continéntes, qui ab appetítu se exterióri
        custódiunt et spe ad interióra rapiúntur, carnem mácerant, et toto
        desidério ad supérnam pátriam anhélant, ætérna prǽmia éxpetunt, pro
        labóribus suis recípere laudes humánas nolunt. Hi nimírum glóriam suam
        non in ore hóminum ponunt, sed intra consciéntiam cóntegunt. Et sunt
        pleríque, qui corpus per abstinéntiam afflígunt, sed de ipsa sua
        abstinéntia humános favóres éxpetunt.
      - "&teDeum"
