    lectio1:
      - De Epístola prima beáti Pauli Apóstoli ad Corínthios
      - "!1 Cor 7:25-31"
      - "25 De virgínibus præcéptum Dómini non hábeo: consílium autem do,
        tamquam misericórdiam consecútus a Dómino, ut sim fidélis."
      - 26 Exístimo ergo hoc bonum esse propter instántem necessitátem, quóniam
        bonum est hómini sic esse.
      - 27 Alligátus es uxóri? noli quǽrere solutiónem. Solútus es ab uxóre?
        noli quǽrere uxórem.
      - 28 Si autem accéperis uxórem, non peccásti. Et si núpserit virgo, non
        peccávit. Tribulatiónem tamen carnis habébunt hujúsmodi. Ego autem vobis
        parco.
      - "29 Hoc ítaque dico, fratres: Tempus breve est: réliquum est, ut et qui
        habent uxóres, tamquam non habéntes sint;"
      - 30 et qui flent, tamquam non flentes; et qui gaudent, tamquam non
        gaudéntes; et qui emunt, tamquam non possidéntes;
      - 31 et qui utúntur hoc mundo, tamquam non utántur; prǽterit enim figúra
        hujus mundi.
    responsory1:
      - R. Veni Sponsa Christi, áccipe corónam, quam tibi Dóminus præparávit in
        ætérnum; pro cujus amóre sánguinem tuum fudísti,
      - "* Et cum Ángelis in paradísum introísti."
      - V. Veni, elécta mea, et ponam in te thronum meum;  quia concupívit Rex
        spéciem tuam.
      - R. Et cum Ángelis in paradísum introísti.
    lectio2:
      - "!1 Cor 7:32-35"
      - 32 Volo autem vos sine sollicitúdine esse. Qui sine uxóre est,
        sollícitus est quæ Dómini sunt, quómodo pláceat Deo.
      - 33 Qui autem cum uxóre est, sollícitus est quæ sunt mundi, quómodo
        pláceat uxóri; et divísus est.
      - 34 Et múlier innúpta et virgo cógitat quæ Dómini sunt, ut sit sancta
        córpore et spíritu. Quæ autem nupta est, cógitat quæ sunt mundi, quómodo
        pláceat viro.
      - 35 Porro hoc ad utilitátem vestram dico, non ut láqueum vobis iníciam,
        sed ad id, quod honéstum est, et quod facultátem prǽbeat sine
        impediménto Dóminum obsecrándi.
    responsory2:
      - R. Diffúsa est grátia in lábiis tuis,
      - "* Proptérea benedíxit te Deus in ætérnum."
      - V. Spécie tua et pulchritúdine tua inténde, próspere procéde, et regna.
      - R. Proptérea benedíxit te Deus in ætérnum.
    lectio3:
      - "!1 Cor 7:36-40"
      - "36 Si quis autem turpem se vidéri exístimat super vírgine sua, quod sit
        superadúlta, et ita opórtet fíeri; quod vult fáciat: non peccat, si
        nubat."
      - 37 Nam, qui státuit in corde suo firmus, non habens necessitátem,
        potestátem autem habens suæ voluntátis, et hoc judicávit in corde suo,
        serváre vírginem suam, bene facit.
      - 38 Ígitur et qui matrimónio jungit vírginem suam, bene facit; et qui non
        jungit, mélius facit.
      - 39 Múlier alligáta est legi quanto témpore, vir ejus vivit. Quod, si
        dormíerit vir ejus, liberáta est; cui vult nubat, tantum in Dómino.
      - 40 Beátior autem erit, si sic permánserit, secúndum meum consílium; puto
        autem quod et ego Spíritum Dei hábeam.
