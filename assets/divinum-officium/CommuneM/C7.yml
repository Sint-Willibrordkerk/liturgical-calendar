    - R. Múlier timens Dóminum, ipsa laudábitur.
  lectio7:
    - Léctio sancti Evangélii secúndum Matthǽum
    - "!Matt 13:44-52"
    - "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Simile est
      regnum cælórum thesáuro abscóndito in agro. Et réliqua."
    - _
    - Homilía sancti Gregórii Papæ
    - "!Homilia 11 in Evangelia"
    - "Cælórum regnum, fratres caríssimi, idcírco terrénis rebus símile dícitur,
      ut, ex his quæ ánimus novit, surgat ad incógnita, quæ non novit: quátenus
      exémplo visibílium se ad invisibília rápiat, et, per ea quæ usu dídicit
      quasi confricátus incaléscat; ut per hoc, quod scit notum dilígere, discat
      et incógnita amáre. Ecce enim cælórum regnum thesáuro abscóndito in agro
      comparátur; quem, qui invénit homo, abscóndit, et præ gáudio illíus vadit,
      et vendit univérsa quæ habet, et emit agrum illum."
  responsory7:
    - "R. Os suum apéruit sapiéntiæ, et lex cleméntiæ in lingua ejus:
      considerávit sémitas domus suæ,"
    - "* Et panem otiósa non comédit."
    - "V. Gustávit et vidit quia bona est negotiátio ejus: non exstinguétur in
      nocte lucérna ejus."
    - R. Et panem otiósa non comédit.
  lectio8:
    - "Qua in re hoc quoque notándum est, quod invéntus thesáurus abscónditur,
      ut servétur: quia stúdium cæléstis desidérii a malígnis spirítibus
      custodíre non súfficit, qui hoc ab humánis láudibus non abscóndit. In
      præsénti étenim vita, quasi in via sumus, qua ad pátriam pérgimus. Malígni
      autem spíritus iter nostrum quasi quidam latrúnculi óbsident. Deprædári
      ergo desíderat, qui thesáurum públice portat in via. Hoc autem dico, non
      ut próximi ópera nostra bona non vídeant, cum scriptum sit: Vídeant ópera
      vestra bona, et gloríficent Patrem vestrum qui in cælis est; sed, ut per
      hoc quod ágimus, laudes extérius non quærámus. Sic autem sit opus in
      público, quátenus inténtio máneat in occúlto; ut, et de bono ópere
      próximis præbeámus exémplum, et tamen per intentiónem, qua Deo soli
      placére quǽrimus, semper optémus secrétum."
  responsory8:
    - "R. Regnum mundi et omnem ornátum sǽculi contémpsi, propter amórem Dómini
      mei Jesu Christi:"
    - "* Quem vidi, quem amávi, in quem crédidi, quem diléxi."
    - "V. Eructávit cor meum verbum bonum: dico ego ópera mea Regi."
    - R. Quem vidi, quem amávi, in quem crédidi, quem diléxi.
    - "&Gloria"
    - R. Quem vidi, quem amávi, in quem crédidi, quem diléxi.
  lectio9:
    - "Thesáurus autem cæléste est desidérium; ager vero, in quo thesáurus
      abscónditur, disciplína stúdii cæléstis. Quem profécto agrum, vénditis
      ómnibus, cómparat, qui, voluptátibus carnis renúntians, cuncta sua terréna
      desidéria per disciplínæ cæléstis custódiam calcat: ut nihil jam quod caro
      blandítur, líbeat; nihil, quod carnálem vitam trucídat, spíritus
      perhorréscat."
    - "&teDeum"
