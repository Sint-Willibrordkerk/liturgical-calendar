  evangelium:
    - Sequéntia ++ sancti Evangélii secúndum Matthǽum
    - "!Matt 13:44-52"
    - "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Símile est
      regnum cœlórum thesáuro abscóndito in agro: quem qui invénit homo,
      abscóndit, et præ gáudio illíus vadit, et vendit univérsa, quæ habet, et
      emit agrum illum. Íterum símile est regnum cœlórum hómini negotiatóri,
      quærénti bonas margarítas. Invénta autem una pretiósa margaríta, ábiit, et
      véndidit ómnia, quæ hábuit, et emit eam. Íterum símile est regnum cœlórum
      sagénæ missæ in mare et ex omni génere píscium congregánti. Quam, cum
      impléta esset, educéntes, et secus litus sedéntes, elegérunt bonos in
      vasa, malos autem foras misérunt. Sic erit in consummatióne sǽculi:
      exíbunt Angeli, et separábunt malos de médio justórum, et mittent eos in
      camínum ignis: ibi erit fletus et stridor déntium. Intellexístis hæc
      ómnia? Dicunt ei: Etiam. Ait illis: Ideo omnis scriba doctus in regno
      cœlórum símilis est hómini patrifamílias, qui profert de thesáuro suo nova
      et vétera."
  offertorium:
    - "!Ps 44:3"
    - "Diffúsa est grátia in lábiis tuis: proptérea benedíxit te Deus in
      ætérnum, et in sǽculum sǽculi. (Allelúja.)"
  secreta:
    - "Súscipe, Dómine, múnera, quæ in beátæ N. Vírginis et Mártyris tuæ
      sollemnitáte deférimus: cujus nos confídimus patrocínio liberári."
