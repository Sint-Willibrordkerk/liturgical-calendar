    lectio1-in-2-loco:
      - De libro Ecclesiástici
      - "!Sir 51:1-7"
      - 1 Confitébor tibi, Dómine, Rex, et collaudábo te Deum Salvatórem meum.
      - "2 Confitébor nómini tuo: quóniam adjútor et protéctor factus es mihi,"
      - 3 et liberásti corpus meum a perditióne, a láqueo linguæ iníquæ et a
        lábiis operántium mendácium, et in conspéctu astántium factus es mihi
        adjútor.
      - "4 Et liberásti me secúndum multitúdinem misericórdiæ nóminis tui a
        rugiéntibus, præparátis ad escam:"
      - 5 de mánibus quæréntium ánimam meam, et de portis tribulatiónum, quæ
        circumdedérunt me;
      - 6 a pressúra flammæ, quæ circúmdedit me, et in médio ignis non sum
        æstuáta;
      - 7 de altitúdine ventris ínferi, et a lingua coinquináta, et a verbo
        mendácii, a rege iníquo, et a lingua injústa.
    lectio2-in-2-loco:
      - "!Sir 51:8-12"
      - 8 Laudábit usque ad mortem ánima mea Dóminum,
      - 9 et vita mea appropínquans erat in inférno deórsum.
      - 10 Circumdedérunt me úndique, et non erat qui adjuváret. Respíciens eram
        ad adjutórium hóminum, et non erat.
      - "11 Memoráta sum misericórdiæ tuæ, Dómine, et operatiónis tuæ, quæ a
        sǽculo sunt:"
      - 12 quóniam éruis sustinéntes te, Dómine, et líberas eos de mánibus
        géntium.
    lectio3-in-2-loco:
      - "!Sir 51:13-17"
      - 13 Exaltásti super terram habitatiónem meam, et pro morte defluénte
        deprecáta sum.
      - 14 Invocávi Dóminum, Patrem Dómini mei, ut non derelínquat me in die
        tribulatiónis meæ, et in témpore superbórum, sine adjutório.
      - 15 Laudábo nomen tuum assídue, et collaudábo illud in confessióne, et
        exaudíta est orátio mea.
      - 16 Et liberásti me de perditióne, et eripuísti me de témpore iníquo.
      - 17 Proptérea confitébor, et laudem dicam tibi, et benedícam nómini
        Dómini.
    lectio4-in-2-loco:
      - Ex libro S. Cypriáni, Epíscopi et Mártyris, de disciplína et hábitu
        Vírginum
      - "!Lib. de hab. Virg. n. 3-5"
      - "Nunc nobis ad vírgines sermo est, quarum quo sublímior glória est,
        major et cura est. Flos est ille ecclesiástici gérminis, decus atque
        ornaméntum grátiæ spiritális, læta índoles, laudis et honóris opus
        íntegrum atque incorrúptum, Dei imágo respóndens ad sanctimóniam Dómini,
        illústrior pórtio gregis Christi. Gaudet per illas atque in illis
        lárgiter floret Ecclésiæ matris gloriósa fœcúnditas: quantóque plus
        copiósa virgínitas número suo addit, tanto plus gáudium matris augéscit.
        Ad has lóquimur, has adhortámur affectióne pótius quam potestáte: non
        quod, extrémi et mínimi et humilitátis nostræ ádmodum cónscii, áliquid
        ad censúram licéntiæ vindicémus; sed quod ad sollicitúdinem magis cauti,
        plus de diáboli infestatióne timeámus."
    lectio5-in-2-loco:
      - "Neque enim inánis hæc cáutio est, et vana formído, quæ ad salútis viam
        cónsulit, quæ domínica et vitália præcépta custódit, ut quæ se Christo
        dicáverint, et a carnáli concupiscéntia recedéntes tam carne, quam mente
        se Deo vóverint, consúmment opus suum magno prǽmio destinátum, nec
        ornári jam, aut placére cuíquam, nisi Dómino suo, stúdeant, a quo et
        mercédem virginitátis expéctant, dicénte ipso: Non omnes cápiunt verbum,
        sed illi quibus datum est. Sunt enim spadónes, qui ex útero matris sic
        nati sunt: et sunt spadónes, qui coácti sunt ab homínibus; et sunt
        spadónes, qui seípsos castravérunt propter regnum cœlórum."
    lectio6-in-2-loco:
      - "Dénuo quoque per hanc Angeli vocem continéntiæ munus osténditur,
        virgínitas prædicátur. Hi sunt, qui cum muliéribus se non
        coinquinavérunt: vírgines enim permansérunt: hi sunt qui sequúntur Agnum
        quocúmque íerit. Neque enim tantum másculis continéntiæ grátiam Dóminus
        repromíttit, et féminas prǽterit: sed quóniam fémina viri pórtio est, et
        ex eo sumpta atque formáta est, in Scriptúris fere ómnibus ad
        protoplástum Deus lóquitur, quia sunt duo in carne una, et in másculo
        simul significátur et fémina. Quod si Christum continéntia séquitur, et
        regno Dei virgínitas destinátur: quid est illis cum terréno cultu, et
        cum ornaméntis, quibus dum homínibus placére géstiunt, Deum offéndunt?"
    lectio7-in-2-loco:
      - Léctio sancti Evangélii secúndum Matthǽum
      - "!Matt 13:44-52"
      - "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Simile est
        regnum cælórum thesáuro abscóndito in agro. Et réliqua."
      - _
      - Homilía sancti Gregórii Papæ
      - "!Homilia 11 in Evangelia"
      - "Cælórum regnum, fratres caríssimi, idcírco terrénis rebus símile
        dícitur, ut, ex his quæ ánimus novit, surgat ad incógnita, quæ non
        novit: quátenus exémplo visibílium se ad invisibília rápiat, et, per ea
        quæ usu dídicit quasi confricátus incaléscat; ut per hoc, quod scit
        notum dilígere, discat et incógnita amáre. Ecce enim cælórum regnum
        thesáuro abscóndito in agro comparátur; quem, qui invénit homo,
        abscóndit, et præ gáudio illíus vadit, et vendit univérsa quæ habet, et
        emit agrum illum."
    lectio8-in-2-loco:
      - "Qua in re hoc quoque notándum est, quod invéntus thesáurus abscónditur,
        ut servétur: quia stúdium cæléstis desidérii a malígnis spirítibus
        custodíre non súfficit, qui hoc ab humánis láudibus non abscóndit. In
        præsénti étenim vita, quasi in via sumus, qua ad pátriam pérgimus.
        Malígni autem spíritus iter nostrum quasi quidam latrúnculi óbsident.
        Deprædári ergo desíderat, qui thesáurum públice portat in via. Hoc autem
        dico, non ut próximi ópera nostra bona non vídeant, cum scriptum sit:
        Vídeant ópera vestra bona, et gloríficent Patrem vestrum qui in cælis
        est; sed, ut per hoc quod ágimus, laudes extérius non quærámus. Sic
        autem sit opus in público, quátenus inténtio máneat in occúlto; ut, et
        de bono ópere próximis præbeámus exémplum, et tamen per intentiónem, qua
        Deo soli placére quǽrimus, semper optémus secrétum."
    lectio9-in-2-loco:
      - "Thesáurus autem cæléste est desidérium; ager vero, in quo thesáurus
        abscónditur, disciplína stúdii cæléstis. Quem profécto agrum, vénditis
        ómnibus, cómparat, qui, voluptátibus carnis renúntians, cuncta sua
        terréna desidéria per disciplínæ cæléstis custódiam calcat: ut nihil jam
        quod caro blandítur, líbeat; nihil, quod carnálem vitam trucídat,
        spíritus perhorréscat."
      - "&teDeum"
    lectio7-in-3-loco:
      - Léctio sancti Evangélii secúndum Matthǽum
      - "!Matt 19:3-12"
      - "In illo témpore: Accessérunt ad Jesum pharisæi, tentántes eum et
        dicéntes: Si licet hómini dimíttere uxórem suam quacúmque ex causa? Et
        réliqua."
      - _
      - Homilía S. Joánnis Chrysostomi
      - "!Homilia 63 in Matth., sub med."
      - "Dóminus noster, quia ad virginitátem hortári grave esse videbátur, a
        necessitáte legis de non solvéndo matrimónio, eos ad cupiditátem illíus
        tráhere studet. Deínde, ut eam esse possíbilem osténdat, sic inquit:
        Sunt eunúchi qui ex ventre matris ita nati sunt; et sunt qui ab
        homínibus eunúchi facti sunt, et sunt qui seípsos castravérunt propter
        regnum cælórum. Quibus verbis laténter eos ad eligéndam virginitátem
        indúcit, dum eam virtútem esse possíbilem ástruit."
    lectio8-in-3-loco:
      - "Id autem hoc fere modo confírmat: Cógita tecum, si aut a natúra talis
        esses, aut ab homínibus eam injúriam passus, quid fáceres, cum et
        ejúsmodi voluptáte caréres, et nullam, caréndo, mercédem consequeréris?
        Grátias ígitur nunc Deo agas, quod cum mercéde atque corónis idem
        sústines, quod illi sine corónis ac præmio tólerant. Immo vero non idem,
        sed multo lévius; tum quia spe erígeris et consciéntia recte facti, tum
        quia non ita ingéntibus concupiscéntiæ flúctibus jactáris."
    lectio9-in-3-loco:
      - "Cum ergo de illis eunúchis díxerit, qui, nisi étiam ipsi mente se
        contíneant, frustra et inutíliter tales sunt, ac de illis, qui, ut
        regnum cælórum consequántur, se cóntinent; subjúnxit rursus, dicens: Qui
        potest cápere, capiat; ut alacrióres effíciat eo ipso quod grave esse
        opus osténdit, et ineffábili benignitáte sua nóluit eam rem intra
        necessitátem legis conclúdere. Idque dicéndo, adhuc magis possíbilem
        esse demónstrat, ut voluntátis stúdium plus augeátur."
      - "&teDeum"
