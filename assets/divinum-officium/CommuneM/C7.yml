    lectio:
      - Léctio libri Sapiéntiæ
      - "!Eccli 51:1-8; 51:12"
      - "Confitébor tibi, Dómine, Rex, et collaudábo te Deum, Salvatórem meum.
        Confitébor nómini tuo: quóniam adjútor et protéctor factus es mihi, et
        liberásti corpus meum a perditióne, a láqueo línguæ iníquæ et a lábiis
        operántium mendácium, et in conspéctu astántium factus es mihi adjutor.
        Et liberasti me secúndum multitúdinem misericórdiæ nóminis tui a
        rugiéntibus, præparátis ad escam, de mánibus quæréntium ánimam meam, et
        de portis tribulatiónum, quæ circumdedérunt me: a pressúra flammæ, quæ
        circúmdedit me, et in médio ignis non sum æstuáta: de altitúdine ventris
        inferi, et a lingua coinquináta, et a verbo mendácii, a rege iníquo, et
        a lingua injústa: laudábit usque ad mortem ánima mea Dóminum: quóniam
        éruis sustinéntes te, et líberas eos de mánibus géntium, Dómine, Deus
        noster."
    graduale:
