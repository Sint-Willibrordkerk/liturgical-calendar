responsory7:
  - "R. Fallax grátia, et vana est pulchritúdo:"
  - "* Múlier timens Dóminum, ipsa laudábitur."
  - V. Date ei de fructu mánuum suárum, et laudent eam in portis ópera ejus.
  - R. Múlier timens Dóminum, ipsa laudábitur.
  - "&Gloria"
  - R. Múlier timens Dóminum, ipsa laudábitur.
lectio8:
  - Símilis huic vídua, velut eméritis veterána stipéndiis castitátis, et si
    conjúgii arma depónat, domus tamen totíus pacem gubérnat; et si vehéndis
    onéribus otiósa, maritándis tamen junióribus próvida, ubi cultus utílior,
    ubi fructus ubérior sit, quarum cópulam aptiórem seníli gravitáte dispónit.
    Itaque, si maturióribus quam junióribus commítitur ager, cur putes utiliórem
    nuptam esse quam víduam? Quod, si persecutóres fídei persecutóres fuérunt
    étiam viduitátis; útique fidem sequéntibus vidúitas non pro supplício
    fugiénda est, sed tenénda pro prǽmio.
responsory8:
  - "R. Quam pulchra es, amíca mea, quam pulchra es et suávis! óculi tui
    columbárum:"
  - "* Absque eo quod intrínsecus latet."
  - V. Astitit regína a dextris tuis in vestítu deauráto, circúmdata varietáte.
  - R. Absque eo quod intrínsecus latet.
  - "&Gloria"
  - R. Absque eo quod intrínsecus latet.
lectio9:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 13:44-52"
  - "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Simile est
    regnum cælórum thesáuro abscóndito in agro. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 11 in Evangelia"
  - "Cælórum regnum, fratres caríssimi, idcírco terrénis rebus símile dícitur,
    ut, ex his quæ ánimus novit, surgat ad incógnita, quæ non novit: quátenus
    exémplo visibílium se ad invisibília rápiat, et, per ea quæ usu dídicit
    quasi confricátus incaléscat; ut per hoc, quod scit notum dilígere, discat
    et incógnita amáre. Ecce enim cælórum regnum thesáuro abscóndito in agro
    comparátur; quem, qui invénit homo, abscóndit, et præ gáudio illíus vadit,
    et vendit univérsa quæ habet, et emit agrum illum."
responsory9:
  - "R. Os suum apéruit sapiéntiæ, et lex cleméntiæ in lingua ejus: considerávit
    sémitas domus suæ,"
  - "* Et panem otiósa non comédit."
  - "V. Gustávit et vidit quia bona est negotiátio ejus: non exstinguétur in
    nocte lucérna ejus."
  - R. Et panem otiósa non comédit.
lectio10:
  - "Qua in re hoc quoque notándum est, quod invéntus thesáurus abscónditur, ut
    servétur: quia stúdium cæléstis desidérii a malígnis spirítibus custodíre
    non súfficit, qui hoc ab humánis láudibus non abscóndit. In præsénti étenim
    vita, quasi in via sumus, qua ad pátriam pérgimus. Malígni autem spíritus
    iter nostrum quasi quidam latrúnculi óbsident. Deprædári ergo desíderat, qui
    thesáurum públice portat in via. Hoc autem dico, non ut próximi ópera nostra
    bona non vídeant, cum scriptum sit: Vídeant ópera vestra bona, et
    gloríficent Patrem vestrum qui in cælis est; sed, ut per hoc quod ágimus,
    laudes extérius non quærámus. Sic autem sit opus in público, quátenus
    inténtio máneat in occúlto; ut, et de bono ópere próximis præbeámus
    exémplum, et tamen per intentiónem, qua Deo soli placére quǽrimus, semper
    optémus secrétum."
responsory10:
  - "R. Regnum mundi et omnem ornátum sǽculi contémpsi, propter amórem Dómini
    mei Jesu Christi:"
  - "* Quem vidi, quem amávi, in quem crédidi, quem diléxi."
  - "V. Eructávit cor meum verbum bonum: dico ego ópera mea Regi."
  - R. Quem vidi, quem amávi, in quem crédidi, quem diléxi.
  - "&Gloria"
  - R. Quem vidi, quem amávi, in quem crédidi, quem diléxi.
