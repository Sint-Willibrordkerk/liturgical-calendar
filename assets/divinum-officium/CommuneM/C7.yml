      - "!Tractus"
      - "Veni, Sponsa Christi, áccipe corónam, quam tibi Dóminus præparávit in
        ætérnum: pro cujus amóre sánguinem tuum fudísti."
      - "!Ps 44:8; 44:5"
      - "Dilexísti justítiam, et odísti iniquitátem: proptérea unxit te Deus,
        Deus tuus, óleo lætítiæ præ consórtibus tuis."
      - V. Spécie tua et pulchritúdine tua inténde, próspere procéde et regna.
    evangelium:
      - Sequéntia ++ sancti Evangélii secúndum Matthǽum
      - "!Matt 25:1-13"
      - "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Símile
        erit regnum coelórum decem virgínibus: quæ, accipiéntes lámpades suas,
        exiérunt óbviam sponso et sponsæ. Quinque autem ex eis erant fátuæ, et
        quinque prudéntes: sed quinque fátuæ, accéptis lampádibus, non
        sumpsérunt óleum secum: prudéntes vero accepérunt óleum in vasis suis
        cum lampádibus. Moram autem faciénte sponso, dormitavérunt omnes et
        dormiérunt. Média autem nocte clamor factus est: Ecce, sponsus venit,
        exíte óbviam ei. Tunc surrexérunt omnes vírgines íllæ, et ornavérunt
        lámpades suas. Fátuæ autem sapiéntibus dixérunt: Date nobis de óleo
        vestro: quia lámpades nostræ exstinguúntur. Respondérunt prudéntes,
        dicéntes: Ne forte non suffíciat nobis et vobis, ite pótius ad
        vendéntes, et émite vobis. Dum autem irent émere, venit sponsus: et quæ
        parátæ erant, intravérunt cum eo ad núptias, et clausa est jánua.
        Novíssime vero véniunt et réliquæ vírgines, dicéntes: Dómine, Dómine,
        áperi nobis. At ille respóndens, ait: Amen, dico vobis, néscio vos.
        Vigiláte ítaque, quia nescítis diem neque horam."
    offertorium:
      - "!Ps 44:15-16"
      - "Afferéntur Regi Vírgines post eam: próximæ ejus afferéntur tibi in
        lætítia et exsultatióne: adducéntur in templum Regi Dómino. (Allelúja.)"
    secreta:
      - "Súscipe, Dómine, múnera, quæ in beátæ N. Vírginis et Mártyris tuæ
        sollemnitáte deférimus: cujus nos confídimus patrocínio liberári."
      - $Per Dominum
    communio:
      - "!Ps 118:78; 118:80"
      - "Confundántur supérbi, quia injúste iniquitátem fecérunt in me: ego
        autem in mandátis tuis exercébor, in tuis justificatiónibus, ut non
        confúndar. (Allelúja.)"
    postcommunio:
      - "Auxiliéntur nobis, Dómine, sumpta mystéria: et, intercedénte beáta N.
        Vírgine et Mártyre tua, sempitérna fáciant protectióne gaudére."
      - $Per Dominum
