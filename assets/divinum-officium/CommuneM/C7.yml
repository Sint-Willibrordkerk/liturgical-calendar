  lectio4-in-2-loco:
    - Sermo sancti Joánnis Chrysóstomi.
    - "!Serm. 67. de diversis novi Testamenti locis."
    - Ego máxime commemoratiónes díligo Mártyrum, díligo, et ampléctor; atque
      omnes quidem, sed tum præcípue, cum mulíerum certámina proponúntur. Quanto
      enim infírmius est vas, tanto major est grátia, tanto illústrius est
      trophǽum, tanto insígnior est victória, non ob imbecillitátem sexus
      athletárum, sed quod per ea, quibus vícerat inimícus, nunc étiam vincátur.
  lectio5-in-2-loco:
    - "Per mulíerem vicit, per mulíerem superátus est. Hoc illíus ántea telum
      erat: hoc illíus nunc cædis factum est instruméntum, hoc vas appáruit
      insuperábile. Peccávit illa prior, et mórtua est: ista mórtua est, ne
      peccáret. Illa tum fútilis promíssi spe infláta, Dei leges violávit: hæc
      vitam præséntem contémpsit, ne fidem in suum benefactórem ejuráret. Quam
      ígitur deínceps speráre póterunt excusatiónem viri, si molles sint, et
      ignávi; quam vero véniam, cum fórtiter ac viríliter se gerant mulíeres,
      cum ádeo se generose ad certámina pietátis accíngant?"
  lectio6-in-2-loco:
    - Fuit ili corpus imbecíllum, et obnóxius sexus injúriæ; verúmtamen ómnium
      horum imbecillitátem advéniens grátia occultávit. Nihil enim est, nihil
      plane poténtius est co, qui magno cum stúdio Dei timórem hábeat in mente
      defíxum; sed quamvis ignes, quamvis ferrum, quamvis béstias, quamvis áliud
      quidvis minêntur hostes, ómnia nullo negótio contémnit; quod útique Beáta
      ista étiam fecit.
