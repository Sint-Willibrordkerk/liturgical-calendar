  lectio4:
    - Ex Libro Sancti Ambrósii Epíscopi de Víduis
    - "!Prope finem"
    - Agrum hunc Ecclésiæ fértilem cerno, nunc integritátis flore vernántem,
      nunc viduitátis gravitáte polléntem, nunc étiam conjúgii frúctibus
      redundántem. Nam, etsi divérsi, uníus tamen agri fructus sunt; nec tanta
      hortórum lília, quantæ arístæ ségetum, méssium spicæ; compluriúmque spátia
      campórum recipiéndis aptántur semínibus, quam rédditis nováles frúctibus
      feriántur. Bona ergo vidúitas, quæ tóties apostólico judício prædicátur.
      Hæc enim magístra fídei, magístra est castitátis.
  lectio5:
    - "Unde et illi qui deórum suórum adultéria et probra venerántur, cælibátus
      et viduitátis statuére pœnas; ut, ǽmuli críminum, mulctárent stúdia
      virtútum, spécie quidem qua fœcunditátem quǽrerent, sed stúdio quo
      propósitum castitátis abolérent. Nam conféctis et miles stipéndiis arma
      depónit, et relícto offício quod gerébat, ad própria veteránus rura
      dimíttitur; ut et ipse exércitæ labóribus vitæ réquiem consequátur et
      álios spes futúræ quiétis subeúndis fáciat opéribus promptióres. Agrícola
      quoque matúrior torquéndam áliis stivam commíttit, et juveníli gravátus
      ópere, providéntiam curæ senílis explórat: vitem facílius tondére quam
      prémere, ut juvenescéntem luxúriam réprimat, et adolescéntem lascíviam
      falce succídat; parcórum quamdam pártuum castitátem docens étiam in
      vítibus expeténdam."
  lectio6:
    - Símilis huic vídua, velut eméritis veterána stipéndiis castitátis, et si
      conjúgii arma depónat, domus tamen totíus pacem gubérnat; et si vehéndis
      onéribus otiósa, maritándis tamen junióribus próvida, ubi cultus utílior,
      ubi fructus ubérior sit, quarum cópulam aptiórem seníli gravitáte
      dispónit. Itaque, si maturióribus quam junióribus commítitur ager, cur
      putes utiliórem nuptam esse quam víduam? Quod, si persecutóres fídei
      persecutóres fuérunt étiam viduitátis; útique fidem sequéntibus vidúitas
      non pro supplício fugiénda est, sed tenénda pro prǽmio.
