  - 10 Circumdedérunt me úndique, et non erat qui adjuváret. Respíciens eram ad
    adjutórium hóminum, et non erat.
  - "11 Memoráta sum misericórdiæ tuæ, Dómine, et operatiónis tuæ, quæ a sǽculo
    sunt:"
  - 12 quóniam éruis sustinéntes te, Dómine, et líberas eos de mánibus géntium.
lectio4:
  - "!Sir 51:13-17"
  - 13 Exaltásti super terram habitatiónem meam, et pro morte defluénte
    deprecáta sum.
  - 14 Invocávi Dóminum, Patrem Dómini mei, ut non derelínquat me in die
    tribulatiónis meæ, et in témpore superbórum, sine adjutório.
  - 15 Laudábo nomen tuum assídue, et collaudábo illud in confessióne, et
    exaudíta est orátio mea.
  - 16 Et liberásti me de perditióne, et eripuísti me de témpore iníquo.
  - 17 Proptérea confitébor, et laudem dicam tibi, et benedícam nómini Dómini.
responsory4:
  - "R. Pulchra fácie, sed púlchrior fide, beáta es, N., réspuens mundum,
    lætáberis cum Angelis:"
  - "* Intercéde pro ómnibus nobis."
  - V. Spécie tua et pulchritúdine tua inténde, próspere procéde, et regna.
  - R. Intercéde pro ómnibus nobis.
  - "&Gloria"
  - R. Intercéde pro ómnibus nobis.
lectio5:
  - Ex Libro Sancti Ambrósii Epíscopi de Víduis
  - "!Prope finem"
  - Agrum hunc Ecclésiæ fértilem cerno, nunc integritátis flore vernántem, nunc
    viduitátis gravitáte polléntem, nunc étiam conjúgii frúctibus redundántem.
    Nam, etsi divérsi, uníus tamen agri fructus sunt; nec tanta hortórum lília,
    quantæ arístæ ségetum, méssium spicæ; compluriúmque spátia campórum
    recipiéndis aptántur semínibus, quam rédditis nováles frúctibus feriántur.
    Bona ergo vidúitas, quæ tóties apostólico judício prædicátur. Hæc enim
    magístra fídei, magístra est castitátis.
responsory5:
  - "R. Propter veritátem, et mansuetúdinem, et justítiam:"
  - "* Et dedúcet te mirabíliter déxtera tua."
  - V. Spécie tua et pulchritúdine tua inténde, próspere procéde, et regna.
  - R. Et dedúcet te mirabíliter déxtera tua.
lectio6:
  - "Unde et illi qui deórum suórum adultéria et probra venerántur, cælibátus et
    viduitátis statuére pœnas; ut, ǽmuli críminum, mulctárent stúdia virtútum,
    spécie quidem qua fœcunditátem quǽrerent, sed stúdio quo propósitum
    castitátis abolérent. Nam conféctis et miles stipéndiis arma depónit, et
    relícto offício quod gerébat, ad própria veteránus rura dimíttitur; ut et
    ipse exércitæ labóribus vitæ réquiem consequátur et álios spes futúræ
    quiétis subeúndis fáciat opéribus promptióres. Agrícola quoque matúrior
    torquéndam áliis stivam commíttit, et juveníli gravátus ópere, providéntiam
    curæ senílis explórat: vitem facílius tondére quam prémere, ut juvenescéntem
    luxúriam réprimat, et adolescéntem lascíviam falce succídat; parcórum
    quamdam pártuum castitátem docens étiam in vítibus expeténdam."
responsory6:
  - "R. Dilexísti justítiam, et odísti iniquitátem:"
  - "* Proptérea unxit te Deus, Deus tuus, óleo lætítiæ."
  - V. Propter veritátem, et mansuetúdinem, et justítiam.
  - R. Proptérea unxit te Deus, Deus tuus, óleo lætítiæ.
