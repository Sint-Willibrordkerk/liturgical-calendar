    lectio4:
      - Sermo sancti Ambrósii Epíscopi
      - "!Lib. 1 de Virg., circa init."
      - Quóniam hódie natális est Vírginis, invítat nunc integritátis amor, ut
        áliquid de virginitáte dicámus;  ne, véluti tránsitu quodam præstrícta
        videátur, quæ principális est virtus. Non enim ídeo laudábilis
        virgínitas, quia in Martýribus reperítur;  sed quia ipsa Mártyres
        fáciat. Quis autem humáno eam possit ingénio comprehéndere, quam nec
        natúra suis inclúsit légibus? aut quis naturáli voce complécti, quod
        supra usum natúræ sit? E cælo accersívit quod imitarétur in terris. Nec
        immérito vivéndi sibi usum quæsívit e cælo, quæ Sponsum sibi invénit in
        cælo.
    responsory4:
      - "R. Propter veritátem, et mansuetúdinem, et justítiam:"
      - "* Et dedúcet te mirabíliter déxtera tua."
      - V. Spécie tua et pulchritúdine tua inténde, próspere procéde, et regna.
      - R. Et dedúcet te mirabíliter déxtera tua.
    lectio5:
      - Hæc nubes, áëra, Ángelos, sidéraque transgrédiens, Verbum Dei in ipso
        sinu Patris invénit, et toto hausit péctore. Nam quis tantum, cum
        invénerit, relínquat boni? Unguéntum enim exinanítum est nomen
        tuum;  proptérea adolescéntulæ dilexérunt te, et attraxérunt te.
        Postrémo, non meum est illud quóniam, Quæ non nubunt neque nubéntur,
        erunt sicut Ángeli Dei in cælo. Nemo ergo mirétur, si Ángelis
        comparéntur, quæ Angelórum Dómino copulántur.
    responsory5:
      - "R. Dilexísti justítiam, et odísti iniquitátem:"
      - "* Proptérea unxit te Deus, Deus tuus, óleo lætítiæ."
      - V. Propter veritátem, et mansuetúdinem, et justítiam.
      - R. Proptérea unxit te Deus, Deus tuus, óleo lætítiæ.
    lectio6:
      - "Quis ígitur neget hanc vitam fluxísse de cælo, quam non fácile
        invenímus in terris, nisi postquam Deus in hæc terréni córporis membra
        descéndit? Tunc in útero Virgo concépit, et Verbum caro factum est, ut
        caro fíeret Deus. Dicet áliquis: Sed étiam Elías nullíus corpórei cóitus
        fuísse permíxtus cupiditátibus invenítur. Ideo ergo curru raptus ad
        cælum;  ídeo cum Dómino appáret in glória;  ídeo Domínici ventúrus est
        præcúrsor advéntus."
    responsory6:
