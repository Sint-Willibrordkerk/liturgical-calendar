  responsory11:
    - "R. Beátus vir, qui invéntus est sine mácula, et qui post aurum non ábiit,
      nec sperávit in thesáuris pecúniæ:"
    - "* Ideo stabilíta sunt bona ipsíus in Dómino."
    - V. Pótuit enim tránsgredi, et non est transgréssus; fácere mala, et non
      fecit.
    - R. Ideo stabilíta sunt bona ipsíus in Dómino.
  lectio12:
    - "@Commune/C5:Lectio9"
  responsory12:
    - R. O beáti viri N. sancta præcónia! o inæstimábilis diléctio caritátis!
      qui, dum sæculi pompam contémpsit,
    - "* Ætérnæ vitæ conjúnctus est."
    - V. Cui vívere Christus fuit, et mori lucrum.
    - R. Ætérnæ vitæ conjúnctus est.
