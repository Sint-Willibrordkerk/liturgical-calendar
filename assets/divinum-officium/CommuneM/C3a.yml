  lectio9-in-7-loco:
    - Léctio sancti Evangélii secúndum Lucam.
    - "!Luc 10:16-20"
    - "In illo témpore: Dixit Jesus discípulis suis: Qui vos audit, me audit: et
      qui vos spernit. Et réliqua."
    - _
    - Homilía sancti Bedæ Venerábilis Presbýteri
    - "!Lib. 3 in Luc. cap. 10"
    - "Ut in adiéndo quisque, vel spernéndo Evangélii prædicatóre non viles
      quasque persónas, sed Dóminum Salvatórem, immo ipsum Patrem spérnere se,
      vel audíre dísceret, ait: Qui vos audit, me audit: et qui von spernit, me
      spernit. Qui autem me spernit, spernit eum, qui me misit: quia procul
      dúbio in disípulo Magíster audítur et in fílio Pater honrátur. Potest et
      ita intélligi: Qui non facit misericórdiam uni de frátribus meis mínimis,
      nec mihi facit: quia et ipse pro his formam servi, et páuperis hábitum
      suscépi."
  lectio10-in-7-loco:
    - "Revérsi sunt autem septuagínta duo cum gáudio, dicéntes: Dómine, étiam
      dæmónia subjiciúntur nobis in nómine tuo. Bene quidem conféssi sunt,
      deferéntes honórem nómini Christi, sed quia infírma adhuc fide gaudébant
      virtútibus, vide, quid áudiunt. Et ait illis: Vidébam sátanam, sicut
      fulgur, de cælo cadéntem: non modo vídeo, sed prius vidébam, quando
      córruit; quod autem ait: sicut fulgur, vel præcípitem de supérnis ad ima
      lapsum signíficat, vel quia dejéctus adhuc transfigúrat se in ángelum
      lucis."
  lectio11-in-7-loco:
    - "Ecce dedi vobis potestátem, calcándi supra serpéntes et scorpiónes, hoc
      est, omne genus immundórum spirítuum de obséssis corpóribus ejiciéndi:
      quamvis et ad lítteram rectíssime possit áccipi: síquidem et Paulus a
      vípera invásus, nihil advérsi pátitur."
  lectio12-in-7-loco:
    - "Hoc sane inter serpéntes, qui dente, et scorpiónes, qui cauda nocent,
      distáre árbitror: quod serpéntes apérte sæviéntes, scorpiónes clánculo
      insidiántes, vel hómines, vel dæmones signíficent: serpéntes, qui
      inchoándis virtútibus venéna pravæ persuasiónis objíciunt: scorpiónes, qui
      consummátas virtútes ad finem vitiáre conténdunt. Verúmtamen in hoc nolíte
      gaudére, quia spíritus ejícere, sicut et virtútes álias fácere, intérdum
      non est ejus mériti, qui operátur; sed invocátio nóminis Christi hoc
      agit."
  evangelium-in-2-loco:
    - Sequéntia ++ sancti Evangélii secúndum Lucam
    - "!Luc 6:17-23"
    - "In illo témpore: Descéndens Jesus de monte, stetit in loco campéstri, et
      turba discipulórum ejus, et multitúdo copiósa plebis ab omni Judǽa, et
      Jerúsalem, et marítima, et Tyri, et Sidónis, qui vénerant, ut audírent eum
      et sanaréntur a languóribus suis. Et, qui vexabántur a spirítibus
      immúndis, curabántur. Et omnis turba quærébat eum tángere: quia virtus de
      illo exíbat, et sanábat omnes. Et ipse, elevátis oculis in discípulos
      suos, dicébat: Beáti, páuperes: quia vestrum est regnum Dei. Beáti, qui
      nunc esurítis: quia saturabímini. Beáti, qui nunc fletis: quia ridébitis.
      Beáti éritis, cum vos óderint hómines, et cum separáverint vos et
      exprobréverint, et ejécerint nomen vestrum tamquam malum, propter Fílium
      hóminis. Gaudéte in illa die et exsultáte: ecce enim, merces vestra multa
      est in cœlo."
  evangelium-in-3-loco:
    - "@Commune/C3a-1"
  evangelium-in-4-loco:
    - "@Sancti/01-19"
  evangelium-in-5-loco:
    - Sequéntia ++ sancti Evangélii secúndum Matthǽum
    - "!Matt 5:1-12"
    - "In illo témpore: Videns Jesus turbas, ascéndit in montem, et cum
      sedísset, accessérunt ad eum discípuli ejus, et apériens os suum, docébat
      eos, dicens: Beáti páuperes spíritu: quóniam ipsórum est regnum cœlórum.
      Beáti mites: quóniam ipsi possidébunt terram. Beáti, qui lugent: quóniam
      ipsi consolabúntur. Beáti, qui esúriunt et sítiunt justítiam: quóniam ipsi
      saturabúntur. Beáti misericórdes: quóniam ipsi misericórdiam consequántur.
      Beáti mundo corde: quóniam ipsi Deum vidébunt. Beáti pacífici: quóniam
      fílii Dei vocabúntur. Beáti, qui persecutiónem patiúntur propter
      justítiam: quóniam ipsórum est regnum cœlórum. Beáti estis, cum
      maledíxerint vobis et persecúti vos fúerint, et díxerint omne malum
      advérsum vos, mentiéntes, propter me: gaudete et exsultáte, quóniam merces
      vestra copiósa est in cœlis."
  evangelium-in-6-loco:
    - "@Sancti/01-15"
  evangelium-in-7-loco:
    - Sequéntia ++ sancti Evangélii secúndum Lucam
    - "!Luc 10:16-20"
    - "In illo témpore: Dixit Jesus discípulis suis: Qui vos audit, me audit: et
      qui vos spernit, me spernit. Qui autem me spernit, spernit eum, qui misit
      me. Revérsi sunt autem septuagínta duo cum gáudio, dicéntes: Dómine, étiam
      dæmónia subjiciúntur nobis in nómine tuo. Et ait illis: Vidébam sátanam
      sicut fulgur de cœlo cadéntem. Ecce, dedi vobis potestátem calcandi supra
      serpéntes et scorpiónes, et super omnem virtútem inimíci: et nihil vobis
      nocébit. Verúmtamen in hoc nolíte gaudére, quia spíritus vobis
      subjiciúntur: gaudéte autem, quod nómina vestra scripta sunt in cœlis."
oratio:
  - "Deus, qui nos concédis sanctórum Mártyrum tuórum N. et N. natalítia cólere:
    da nobis in ætérna beatitúdine de eórum societáte gaudére."
  - $Per Dominum
lectio9:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 6:17-23"
  - "In illo témpore: Descéndens Jesus de monte, stetit in loco campéstri, et
    turba discipulórum ejus, et multitúdo copiósa plebis ab omni Judǽa, et
    Jerúsalem, et marítima, et Tyri, et Sidónis. Et réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Lib. 5. in Lucam. Cap. 6., post init."
  - "Advérte ómnia diligénter, quómodo et cum Apóstolis ascéndat et descéndat ad
    turbas. Quómodo enim turba nisi in húmili Christum vidéret? Non séquitur ad
    excélsa, non ascéndit ad sublímia. Dénique ubi descéndit, invénit infírmos:
    in excélsis enim infírmi esse non possunt. Hinc étiam Matthǽus docet in
    inferióribus débiles esse sanátos. Prius enim unusquísque sanándus est, ut
    paulátim virtútibus procedéntibus ascéndere possit ad montem; et ídeo
    quemque in inferióribus sanat, hoc est, a libídine révocat, injúriam
    cæcitátis avértit. Ad vúlnera nostra descéndit: ut usu quodam et cópia suæ
    natúræ, compartícipes nos fáciat esse regni cæléstis."
