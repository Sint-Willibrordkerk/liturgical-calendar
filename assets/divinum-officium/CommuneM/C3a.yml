  lectio11-in-4-loco:
    - Confírmat ígitur eos ad tolerántiam passiónum, fugæ, verberatiónis,
      intéritus et publici in eos odii propter nomen ejus. Atque his quidem
      vexatiónibus multi turbabúntur, et, tantis insurgéntibus malis
      scandalizabúntur, et usque in mutuum ódium excitabúntur. Et falsi prophetæ
      erunt (ut Nicolaus unus ex septem diacónibus fuit), multosque ementíta
      veritáte pervertent; et, abundante nequitia, caritas refrigéscet.
  lectio12-in-4-loco:
    - Sed usque in finem perseverántibus salus reserváta est; ac tum, per omnes
      orbis partes viris apostolicis dispersis, Evangélii véritas prædicábitur.
      Et, cum univérsis fúerit cognítio sacraménti cæléstis invecta, tum
      Jerúsalem occasus et finis incumbet; ut prædicatiónis fidem, et infidelium
      pœna et metus civitátis érutæ consequátur. Hæc ígitur in eam, ut fuerant
      prædicta, perfécta sunt; et, lapidatis, fugatis, peremptis Apóstolis,
      fame, bello, captivitáte consumpta est. Ac tum fuit digna non esse, cum,
      ejectis prædicatóribus Christi, indignam Dei prædicatióne se præbuit.
    - "&teDeum"
  lectio9-in-5-loco:
    - Léctio sancti Evangélii secúndum Matthǽum.
    - "!Matt 5:1-12"
    - "In illo témpore: Videns Jesus turbas, ascéndit in montem, et cum
      sedísset, accessérunt ad eum discípuli ejus. Et réliqua."
    - _
    - Homilia sancti Augustíni Epíscopi.
    - "!Liber 1 de sermone Dómini in monte, cap. 2. et 3."
    - "Beáti mundo corde; quóniam ipsi Deum vidébunt. Quam ergo stulti sunt, qui
      Deum istis exterióribus óculis quærunt, cum corde videátur, sicut álibi
      scriptum est: Et in simplicitáte cordis quærite illum. Hoc est enim mundum
      cor, quod est simplex cor. Et quemádmodum lumen hoc vidéri non potest,
      nisi óculis mundis; ita nec Deus vidétur, nisi mundum sit illud quo vidéri
      potest. Beáti pacífici; quóniam ipsi fílii Dei vocabúntur. In pace
      perféctio est, ubi nihil repúgnat; et ídeo fílii Dei pacífici, quóniam
      nihil in his resístit Deo, et útique fílii similitúdinem patris habére
      debent."
  lectio10-in-5-loco:
    - Léctio sancti Evangélii secúndum Matthǽum.
    - "!Matt 5:1-12"
    - "In illo témpore: Videns Jesus turbas, ascéndit in montem, et cum
      sedísset, accessérunt ad eum discípuli ejus. Et réliqua."
    - _
    - Homilia sancti Augustíni Epíscopi.
    - "!Liber 1 de sermone Dómini in monte, cap. 2. et 3."
    - "Beáti mundo corde; quóniam ipsi Deum vidébunt. Quam ergo stulti sunt, qui
      Deum istis exterióribus óculis quærunt, cum corde videátur, sicut álibi
      scriptum est: Et in simplicitáte cordis quærite illum. Hoc est enim mundum
      cor, quod est simplex cor. Et quemádmodum lumen hoc vidéri non potest,
      nisi óculis mundis; ita nec Deus vidétur, nisi mundum sit illud quo vidéri
      potest. Beáti pacífici; quóniam ipsi fílii Dei vocabúntur. In pace
      perféctio est, ubi nihil repúgnat; et ídeo fílii Dei pacífici, quóniam
      nihil in his resístit Deo, et útique fílii similitúdinem patris habére
      debent."
  lectio11-in-5-loco:
    - Pacífici autem in semetípsis sunt, qui omnes ánimi sui motus componéntes,
      et subjiciéntes ratióni, id est menti et spirítui, carnalésque
      concupiscéntias habéntes edómitas, fiunt regnum Dei. In quo ita sunt
      ordináta ómnia, ut id quod est in hómine præcípuum et excéllens, hoc
      ímperet, céteris non reluctántibus, quæ sunt nobis bestiísque commúnia;
      atque idípsum quod excélluit in hómine, id est mens et rátio, subjiciátur
      potióri, quod est ipsa véritas, unigénitus Fílius Dei. Neque enim imperáre
      inferióribus potest, nisi superióri se ipse subjíciat. Et hæc est pax, quæ
      datur in terra homínibus bonæ voluntátis; hæc vita consummáti perfectíque
      sapiéntis.
  lectio12-in-5-loco:
    - "De hujúsmodi regno pacatíssimo et ordinatíssimo missus est foras princeps
      hujus sæculi, qui pervérsis inordinatísque dominátur. Hac pace intrínsecus
      constitúta atque firmáta, quascúmque persecutiónes ille, qui foras missus
      est, forínsecus concitáverit, auget glóriam, quæ secúndum Deum est; non
      áliquid in illo ædifício labefáctans, sed deficiéntibus máchinis suis
      innotéscere fáciens, quanta fírmitas intus exstrúcta sit. Ideo séquitur:
      Beáti, qui persecutiónem patiúntur propter justítiam; quóniam ipsórum est
      regnum cælórum."
    - "&teDeum"
