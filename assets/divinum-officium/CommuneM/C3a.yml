      ut usu quodam et cópia suæ natúræ, compartícipes nos fáciat esse regni
      cæléstis."
  lectio11-in-2-loco:
    - "Beáti páuperes, quia vestrum est regnum Dei. Quátuor tantum beatitúdines
      sanctus Lucas Domínicas posuit, octo vero sanctus Matthǽus: sed in illis
      octo istæ quátuor sunt, et in quátuor istis illæ octo. Hic enim quátuor
      velut virtútes ampléxus est cardináles: ille in illis octo mýsticum
      númerum reserávit. Pro octáva enim multi inscribúntur Psalmi: et mandátum
      áccipis octo illis partem dare fortásse benedictiónibus. Sicut enim spei
      nostræ octáva perféctio est, ita octáva summa virtútum est."
  lectio12-in-2-loco:
    - "Sed prius quæ sunt amplióra videámus. Beáti, inquit, páuperes, quóniam
      vestrum est regnum Dei. Primam benedictiónem hanc utérque Evangelísta
      pósuit. Órdine enim prima est, et parens quædam generatióque virtútum:
      quia qui contempsérit sæculária, ipse merébitur sempitérna: nec potest
      quisquam méritum regni cæléstis adipísci, qui mundi cupiditáte pressus,
      emergéndi non habet facultátem."
    - "&teDeum"
  lectio9-in-3-loco:
    - Léctio sancti Evangélii secúndum Lucam
    - "!Luc 12:1-8"
    - "In illo témpore: Dixit Jesus discípulis suis: Atténdite a fermento
      pharisæórum, quod est hypócrisis. Et réliqua."
    - _
    - Homilía sancti Bedæ Venerábilis Presbýteri
    - "!Lib. 4 in Lucam, cap. 12"
    - "De hoc ferménto Apóstolus præcépit: Itáque epulémur, non in ferménto
      véteri, neque in ferménto malítiæ et nequítiæ, sed in ázymis sinceritátis
      et veritátis. Nam, sicut módicum ferméntum totam farínæ, cui injícitur,
      massam corrúmpit, universámque mox conspersiónem suo sapóre commáculat;
      sic nimírum simulátio, cujus semel ánimum imbúerit, tota virtútum
      sinceritáte et veritáte fraudábit. Est ergo sensus: Atténdite ne æmulémini
      simulatóres; quia véniet profécto tempus, in quo et vestra virtus ómnibus,
      et eórum revelétur hypócrisis."
  lectio10-in-3-loco:
    - "Verum quod séquitur: Quóniam quæ in ténebris dixístis, in lúmine
      dicéntur; non solum in futúro, quando cuncta córdium abscóndita
      proferéntur ad lucem, sed et in præsénti témpore potest congruénter
      áccipi. Quóniam quæ inter ténebras quondam pressurárum carcerúmque umbras
      vel locúti vel passi sunt Apóstoli; nunc, clarificáta per orbem Ecclésia,
      lectis eórum áctibus, públice prædicántur. Ne terreámini ab his qui
      occídunt corpus. Si persecutóres Sanctórum, occísis corpóribus, non habent
      ámplius quid contra illos agant: ergo supervácua furunt insánia, qui
      mórtua Mártyrum membra, feris avibúsque discerpénda projíciunt, cum
      nequáquam omnipoténtiæ Dei, quin ea resuscitándo vivíficet, obsístere
      possint."
  lectio11-in-3-loco:
    - "Verum quod séquitur: Quóniam quæ in ténebris dixístis, in lúmine
      dicéntur; non solum in futúro, quando cuncta córdium abscóndita
      proferéntur ad lucem, sed et in præsénti témpore potest congruénter
      áccipi. Quóniam quæ inter ténebras quondam pressurárum carcerúmque umbras
      vel locúti vel passi sunt Apóstoli; nunc, clarificáta per orbem Ecclésia,
      lectis eórum áctibus, públice prædicántur. Ne terreámini ab his qui
      occídunt corpus. Si persecutóres Sanctórum, occísis corpóribus, non habent
      ámplius quid contra illos agant: ergo supervácua furunt insánia, qui
      mórtua Mártyrum membra, feris avibúsque discerpénda projíciunt, cum
      nequáquam omnipoténtiæ Dei, quin ea resuscitándo vivíficet, obsístere
      possint."
  lectio12-in-3-loco:
    - "Duo autem sunt génera persecutórum: unum palam sæviéntium, álterum ficte
      fraudulentérque blandiéntium. Contra utrúmque nos muníre atque institúere
      volens Salvátor, et supra ab hypócrisi pharisæórum atténdere, et hic a
      carníficum cæde prǽcipit non timére; quia vidélicet, post mortem nec horum
      crudélitas nec illórum váleat simulátio duráre. Nonne quinque pásseres
      véneunt dipóndio? Si minutíssima, inquit, animália, et quæ quólibet per
      aëra ferúntur volatília, Deus oblivísci non potest; vos, qui ad imáginem
      facti estis Creatóris, non debétis terréri ab his qui occídunt corpus;
      quia, qui irrationabília animália gubérnat, rationabília curáre non
      désinit."
    - "&teDeum"
  lectio9-in-4-loco:
    - Léctio sancti Evangélii secúndum Matthǽum
    - "!Matt 24:3-13"
    - "In illo témpore: Sedénte Jesu super montem Oliveti, accessérunt ad eum
      discípuli secréto dicéntes: Dic nobis quando hæc erunt? Et réliqua."
    - _
    - Homilía sancti Hilarii Epíscopi
    - "!Comment. in Matth. cap. 25"
    - Discipuli Dóminum intérrogant quando hæc fíerent, quodve signum et
      adventus sui et consummatiónis sæculi nóscerent. Et, quia tria hæc in unum
      quæsíta sunt, distinctis et témporis et intelligéntiæ significatiónibus
      separántur. Respondétur ígitur primum de civitátis occasu, et confirmántur
      veritáte doctrinæ, ne quis fallax ignorántibus posset obrépere; venturi
      enim erant étiam eórum témpore, qui se Christum essent nuncupatúri. Ut
      ígitur fides pestífero mendácio détrahi posset, admonítio præcessit.
  lectio10-in-4-loco:
