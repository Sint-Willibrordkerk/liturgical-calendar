  lectio9-in-2-loco:
    - Léctio sancti Evangélii secúndum Lucam
    - "!Luc 6:17-23"
    - "In illo témpore: Descéndens Jesus de monte, stetit in loco campéstri, et
      turba discipulórum ejus, et multitúdo copiósa plebis ab omni Judǽa, et
      Jerúsalem, et marítima, et Tyri, et Sidónis. Et réliqua."
    - _
    - Homilía sancti Ambrósii Epíscopi
    - "!Lib. 5. in Lucam. Cap. 6., post init."
    - "Advérte ómnia diligénter, quómodo et cum Apóstolis ascéndat et descéndat
      ad turbas. Quómodo enim turba nisi in húmili Christum vidéret? Non
      séquitur ad excélsa, non ascéndit ad sublímia. Dénique ubi descéndit,
      invénit infírmos: in excélsis enim infírmi esse non possunt. Hinc étiam
      Matthǽus docet in inferióribus débiles esse sanátos. Prius enim
      unusquísque sanándus est, ut paulátim virtútibus procedéntibus ascéndere
      possit ad montem; et ídeo quemque in inferióribus sanat, hoc est, a
      libídine révocat, injúriam cæcitátis avértit. Ad vúlnera nostra descéndit:
      ut usu quodam et cópia suæ natúræ, compartícipes nos fáciat esse regni
      cæléstis."
  lectio10-in-2-loco:
    - Léctio sancti Evangélii secúndum Lucam
    - "!Luc 6:17-23"
    - "In illo témpore: Descéndens Jesus de monte, stetit in loco campéstri, et
      turba discipulórum ejus, et multitúdo copiósa plebis ab omni Judǽa, et
      Jerúsalem, et marítima, et Tyri, et Sidónis. Et réliqua."
    - _
    - Homilía sancti Ambrósii Epíscopi
    - "!Lib. 5. in Lucam. Cap. 6., post init."
    - "Advérte ómnia diligénter, quómodo et cum Apóstolis ascéndat et descéndat
      ad turbas. Quómodo enim turba nisi in húmili Christum vidéret? Non
