      - Isti sunt Sancti, * qui pro testaménto Dei sua córpora tradidérunt, et
        in sánguine Agni lavérunt stolas suas.;;109
      - Sancti per fidem * vicérunt regna, operáti sunt justítiam, adépti sunt
        repromissiónes.;;110
      - "Sanctórum velut áquilæ * juvéntus renovábitur: florébunt sicut lílium
        in civitáte Dómini.;;111"
      - "Abstérget Deus * omnem lácrimam ab óculis Sanctórum: et jam non erit
        ámplius neque luctus, neque clamor, sed nec ullus dolor: quóniam prióra
        transiérunt.;;112"
      - In cæléstibus regnis * Sanctórum habitátio est, et in ætérnum réquies
        eórum.;;115
    versum-3:
      - V. Exsultábunt Sancti in glória.
      - R. Lætabúntur in cubílibus suis.
    ant-3:
      - "Gaudent in cælis * ánimæ Sanctórum, qui Christi vestígia sunt secúti:
        et quia pro ejus amóre sánguinem suum fudérunt, ídeo cum Christo
        exsúltant sine fine."
    oratio3:
      - "Da, quǽsumus, omnípotens Deus: ut, qui beatórum Mártyrum tuórum N. et
        N. solémnia cólimus, eórum apud te intercessiónibus adjuvémur."
      - $Per Dominum
    lectio4-in-2-loco:
      - Sermo sancti Joánnis Chrysóstomi
      - "!Sermo 1 de Martyribus, tom. 3."
      - Nemo est, qui nésciat, Mártyrum glórias ad hoc divíno consílio a Dei
        pópulis frequentári, ut et illis débitus honor dicétur, et nobis
        virtútis exémpla, favénte Christo, monstréntur; ut, dum hæc ita
        celebrári perspícimus, cognoscámus quanta eos glória máneat in cælis,
        quorum natalítia táliter celebrántur in terris; quo possímus, étiam
        ipsi, tálibus provocári exémplis, virtúte pari, devotióne consímili ac
        fide; ut, Christo præstánte, dimicáre et víncere hostem possímus, ut,
        parta victória, cum iísdem Sanctis in regnis cæléstibus triumphémus.
    lectio5-in-2-loco:
      - Quis est enim, qui eórum volens mérito copulári, nisi prius constántiam
        eórum téneat, sectétur fidem, imitétur virtútem passiónis; eórum glóriam
        páribus vitæ lineaméntis aut invéniat aut exquírat? Qui, etsi martýrio
        par esse non possit, tamen múneris tanti dignitáte se quisque bonis
        áctibus dignum præbeat. Adest enim clementíssimus Deus, qui
        desiderántibus suis aut martýrium præbeat, aut, sine martýrio, cum
        Sanctis præmia divína retríbuat.
    lectio6-in-2-loco:
      - Ut enim infirmátur peccátor advérsis, ita justus tentatiónibus
        roborátur. Sic dimicárunt advérsus peccátum Sancti; sic, et laborándo
        fortióres, et moriéndo victóres effécti sunt. Nullus athlétes sine
        certámine fórtior dici, nullus sine victória póterit coronári. Nemo
        miles sine prœlio hostem subjécit; nemo sine bello imperatórem
        proméruit. Habes, christiáne, competéntia arma, quibus hostem expúgnes;
        habes fortíssima tela, quibus inimícum debelles.
    lectio7-in-2-loco:
      - Léctio sancti Evangélii secúndum Lucam
      - "!Luc 6:17-23"
      - "In illo témpore: Descéndens Jesus de monte, stetit in loco campéstri,
        et turba discipulórum ejus, et multitúdo copiósa plebis ab omni Judǽa,
        et Jerúsalem, et marítima, et Tyri, et Sidónis. Et réliqua."
      - _
      - Homilía sancti Ambrósii Epíscopi
      - "!Lib. 5. in Lucam. Cap. 6., post init."
      - "Advérte ómnia diligénter, quómodo et cum Apóstolis ascéndat et
        descéndat ad turbas. Quómodo enim turba nisi in húmili Christum vidéret?
        Non séquitur ad excélsa, non ascéndit ad sublímia. Dénique ubi
        descéndit, invénit infírmos: in excélsis enim infírmi esse non possunt.
        Hinc étiam Matthǽus docet in inferióribus débiles esse sanátos. Prius
        enim unusquísque sanándus est, ut paulátim virtútibus procedéntibus
        ascéndere possit ad montem; et ídeo quemque in inferióribus sanat, hoc
        est, a libídine révocat, injúriam cæcitátis avértit. Ad vúlnera nostra
        descéndit: ut usu quodam et cópia suæ natúræ, compartícipes nos fáciat
        esse regni cæléstis."
    lectio8-in-2-loco:
      - "Beáti páuperes, quia vestrum est regnum Dei. Quátuor tantum
        beatitúdines sanctus Lucas Domínicas posuit, octo vero sanctus Matthǽus:
        sed in illis octo istæ quátuor sunt, et in quátuor istis illæ octo. Hic
        enim quátuor velut virtútes ampléxus est cardináles: ille in illis octo
        mýsticum númerum reserávit. Pro octáva enim multi inscribúntur Psalmi:
        et mandátum áccipis octo illis partem dare fortásse benedictiónibus.
        Sicut enim spei nostræ octáva perféctio est, ita octáva summa virtútum
        est."
    responsory8-in-2-loco:
      - "R. Hæc est vera fratérnitas, quæ numquam pótuit violári certámine: qui
        effúso sánguine secúti sunt Dóminum:"
      - "* Contemnéntes aulam régiam, pervenérunt ad regna cæléstia."
      - V. Ecce quam bonum et quam jucúndum habitáre fratres in unum.
      - R. Contemnéntes aulam régiam, pervenérunt ad regna cæléstia.
      - "&Gloria"
      - R. Contemnéntes aulam régiam, pervenérunt ad regna cæléstia.
    lectio9-in-2-loco:
      - "Sed prius quæ sunt amplióra videámus. Beáti, inquit, páuperes, quóniam
        vestrum est regnum Dei. Primam benedictiónem hanc utérque Evangelísta
        pósuit. Órdine enim prima est, et parens quædam generatióque virtútum:
        quia qui contempsérit sæculária, ipse merébitur sempitérna: nec potest
        quisquam méritum regni cæléstis adipísci, qui mundi cupiditáte pressus,
        emergéndi non habet facultátem."
      - "&teDeum"
    lectio7-in-3-loco:
      - Léctio sancti Evangélii secúndum Lucam
      - "!Luc 12:1-8"
      - "In illo témpore: Dixit Jesus discípulis suis: Atténdite a fermento
        pharisæórum, quod est hypócrisis. Et réliqua."
      - _
      - Homilía sancti Bedæ Venerábilis Presbýteri
      - "!Lib. 4 in Lucam, cap. 12"
      - "De hoc ferménto Apóstolus præcépit: Itáque epulémur, non in ferménto
        véteri, neque in ferménto malítiæ et nequítiæ, sed in ázymis
        sinceritátis et veritátis. Nam, sicut módicum ferméntum totam farínæ,
        cui injícitur, massam corrúmpit, universámque mox conspersiónem suo
        sapóre commáculat; sic nimírum simulátio, cujus semel ánimum imbúerit,
        tota virtútum sinceritáte et veritáte fraudábit. Est ergo sensus:
        Atténdite ne æmulémini simulatóres; quia véniet profécto tempus, in quo
        et vestra virtus ómnibus, et eórum revelétur hypócrisis."
    lectio8-in-3-loco:
      - "Verum quod séquitur: Quóniam quæ in ténebris dixístis, in lúmine
        dicéntur; non solum in futúro, quando cuncta córdium abscóndita
        proferéntur ad lucem, sed et in præsénti témpore potest congruénter
        áccipi. Quóniam quæ inter ténebras quondam pressurárum carcerúmque
        umbras vel locúti vel passi sunt Apóstoli; nunc, clarificáta per orbem
        Ecclésia, lectis eórum áctibus, públice prædicántur. Ne terreámini ab
        his qui occídunt corpus. Si persecutóres Sanctórum, occísis corpóribus,
        non habent ámplius quid contra illos agant: ergo supervácua furunt
        insánia, qui mórtua Mártyrum membra, feris avibúsque discerpénda
        projíciunt, cum nequáquam omnipoténtiæ Dei, quin ea resuscitándo
        vivíficet, obsístere possint."
    lectio9-in-3-loco:
      - "Duo autem sunt génera persecutórum: unum palam sæviéntium, álterum
        ficte fraudulentérque blandiéntium. Contra utrúmque nos muníre atque
        institúere volens Salvátor, et supra ab hypócrisi pharisæórum atténdere,
        et hic a carníficum cæde prǽcipit non timére; quia vidélicet, post
        mortem nec horum crudélitas nec illórum váleat simulátio duráre. Nonne
        quinque pásseres véneunt dipóndio? Si minutíssima, inquit, animália, et
        quæ quólibet per aëra ferúntur volatília, Deus oblivísci non potest;
        vos, qui ad imáginem facti estis Creatóris, non debétis terréri ab his
        qui occídunt corpus; quia, qui irrationabília animália gubérnat,
        rationabília curáre non désinit."
      - "&teDeum"
    introitus:
      - "!Ps 78:11-12; 78:10"
      - "v. Intret in conspéctu tuo, Dómine, gémitus compeditórum: redde vicínis
        nostris séptuplum in sinu eórum: víndica sánguinem Sanctórum tuórum, qui
        effúsus est."
      - "!Ps 78:1"
      - "Deus, venérunt gentes in hereditátem tuam: polluérunt templum sanctum
        tuum: posuérunt Jerúsalem in pomórum custódiam."
      - "&Gloria"
      - "v. Intret in conspéctu tuo, Dómine, gémitus compeditórum: redde vicínis
        nostris séptuplum in sinu eórum: víndica sánguinem Sanctórum tuórum, qui
        effúsus est."
    lectio:
      - Léctio libri Sapiéntiæ
      - "!Sap 3:1-8"
      - "Justorum ánimæ in manu Dei sunt, et non tanget illos torméntum mortis.
        Visi sunt oculis insipiéntium mori: et æstimála est afflíctio exitus
        illórum: et quod a nobis est iter, extermínium: illi autem sunt in pace.
        Et si coram homínibus torménta passi sunt, spes illórum immortalitáte
        plena est. In paucis vexáti, in multis bene disponéntur: quóniam Deus
        tentávit eos, et invenit illos dignos se. Tamquam aurum in fornáce
        probávit illos, et quasi holocáusti hóstiam accépit illos, et in témpore
        erit respéctus illorum. Fulgébunt justi, et tamquam scintíllæ in
        arundinéto discúrrent. Judicábunt natiónes, et dominabúntur pópulis, et
        regnábit Dóminus illórum in perpétuum."
    graduale:
      - "!Exod 15:11"
      - "Gloriósus Deus in Sanctis suis: mirábilis in majestáte, fáciens
        prodígia."
      - "!Exod 15:6"
      - "V. Déxtera tua, Dómine, glorificáta est in virtúte: déxtera manus tua
        confrégit inimícos. Allelúja, allelúja."
      - "!Eccl 44:14"
      - Córpora Sanctórum in pace sepúlta sunt, et nómina eórum vivent in
        generatiónem et generatiónem. Allelúja.
    tractus:
      - "!Exod 15:11"
      - "Gloriósus Deus in Sanctis suis: mirábilis in majestáte, fáciens
        prodígia."
      - "!Exod 15:6"
      - "V. Déxtera tua, Dómine, glorificáta est in virtúte: déxtera manus tua
        confrégit inimícos."
      - "!Ps 125:5-6"
      - Qui séminant in lácrimis, in gáudio metent.
      - V. Eúntes ibant et flebant, mitténtes sémina sua.
      - V. Veniéntes autem vénient cum exsultatióne, portántes manípulos suos.
    evangelium:
      - Sequéntia ++ sancti Evangélii secúndum Lucam
      - "!Luc 21:9-19"
      - "In illo témpore: Dixit Jesus discípulis suis: Cum audiéritis prǽlia et
        seditiónes, nolíte terréri: opórtet primum hæc fíeri, sed nondum statim
        finis. Tunc dicébat illis: Surget gens contra gentem, et regnum advérsus
        regnum. Et terræmótus magni erunt per loca, et pestiléntiæ, et fames,
        terrorésque de coelo, et signa magna erunt. Sed ante hæc ómnia injícient
        vobis manus suas, et persequéntur tradéntes in synagógas et custódias,
        trahéntes ad reges et praesides propter nomen meum: contínget autem
        vobis in testimónium. Pónite ergo in córdibus vestris non præmeditári,
        quemádmodum respondeátis. Ego enim dabo vobis os et sapiéntiam, cui non
        potérunt resístere et contradícere omnes adversárii vestri. Tradémini
        autem a paréntibus, et frátribus, et cognátis, et amícis, et morte
        affícient ex vobis: et éritis ódio ómnibus propter nomen meum: et
        capíllus de cápite vestro non períbit. In patiéntia vestra possidébitis
        ánimas vestras."
    offertorium:
      - "!Ps 67:36"
      - "Mirábilis Deus in Sanctis suis: Deus Israël, ipse dabit virtútem et
        fortitúdinem plebi suæ: benedíctus Deus, allelúja."
    post-septuagesimam/offertorium:
      - "!Ps 67:36"
      - "Mirábilis Deus in Sanctis suis: Deus Israël, ipse dabit virtútem et
        fortitúdinem plebi suæ: benedíctus Deus."
    tempore-post-septuagesimam/offertorium:
      - "!Ps 67:36"
      - "Mirábilis Deus in Sanctis suis: Deus Israël, ipse dabit virtútem et
