      sustinére cum cápite."
  responsory7:
    - "R. Tamquam aurum in fornáce probávit eléctos Dóminus, et quasi holocáusti
      hóstiam accépit illos: et in témpore erit respéctus illórum:"
    - "* Quóniam donum et pax est eléctis Dei."
    - V. Qui confídunt in illum, intélligent veritátem, et fidéles in dilectióne
      acquiéscent illi.
    - R. Quóniam donum et pax est eléctis Dei.
    - "&Gloria"
    - R. Quóniam donum et pax est eléctis Dei.
  lectio8:
    - "Sed dicit áliquis: Et quis est qui possit beatórum Mártyrum vestígia
      sequi? Huic ego respóndeo, quia non solum Mártyres, sed étiam ipsum
      Dóminum cum ipsíus adjutório, si vólumus, póssumus imitári. Audi non me,
      sed ipsum Dóminum géneri humáno clamántem: Díscite a me, quia mitis sum et
      húmilis corde. Audi et Petrum Apóstolum admonéntem: Christus passus est
      pro nobis, relínquens nobis exémplum ut sequámur vestígia ejus."
  responsory8:
    - "R. Certámen magnum habuérunt Sancti Dei: transiérunt per ignem at aquam,
      et salvi facti sunt:"
    - "* Et corónas accepérunt a Dómino Deo."
    - V. Immánia enim pro Christo in suis corpóribus pertulérunt torménta.
    - R. Et corónas accepérunt a Dómino Deo.
  lectio9:
    - Léctio sancti Evangélii secúndum Lucam
    - "!Luc 21:9-19"
    - "In illo témpore: Dixit Jesus discípulis suis: Cum audiéritis prǽlia, et
      seditiónes, nolíte terréri: opórtet primum hæc fíeri, sed nondum statim
      finis. Et réliqua."
    - _
    - Homilía sancti Gregórii Papæ
    - "!Homilia 35 in Evangel."
    - "Dóminus ac Redémptor noster peritúri mundi præcurréntia mala denúntiat,
      ut eo minus pertúrbent veniéntia, quo fúerint præscíta. Minus enim jácula
      fériunt, quæ prævidéntur: et nos tolerabílius mundi mala suscípimus, si
      contra hæc per præsciéntiæ clípeum munímur. Ecce enim dicit: Cum
      audiéritis prǽlia et seditiónes, nolíte terréri: opórtet enim primum hæc
      fíeri, sed nondum statim finis. Pensánda sunt verba Redemptóris nostri,
      per quæ nos áliud intérius, áliud extérius passúros esse denúntiat; bella
      quippe ad hostes pértinent, seditiónes ad cives. Ut ergo nos índicet
      intérius exteriúsque turbári, áliud nos fatétur ab hóstibus, áliud a
      frátribus pérpeti."
  responsory9:
    - "R. Propter testaméntum Dómini, et leges patérnas, Sancti Dei perstitérunt
      in amóre fraternitátis:"
    - "* Quia unus fuit semper spíritus in eis, et una fides."
    - V. Ecce quam bonum et quam jucúndum habitáre fratres in unum.
    - R. Quia unus fuit semper spíritus in eis, et una fides.
  lectio10:
    - Léctio sancti Evangélii secúndum Lucam
    - "!Luc 21:9-19"
    - "In illo témpore: Dixit Jesus discípulis suis: Cum audiéritis prǽlia, et
      seditiónes, nolíte terréri: opórtet primum hæc fíeri, sed nondum statim
      finis. Et réliqua."
    - _
    - Homilía sancti Gregórii Papæ
    - "!Homilia 35 in Evangel."
    - "Dóminus ac Redémptor noster peritúri mundi præcurréntia mala denúntiat,
      ut eo minus pertúrbent veniéntia, quo fúerint præscíta. Minus enim jácula
      fériunt, quæ prævidéntur: et nos tolerabílius mundi mala suscípimus, si
      contra hæc per præsciéntiæ clípeum munímur. Ecce enim dicit: Cum
