    ant-matutinum:
      - Secus decúrsus aquárum * plantávit víneam justórum, et in lege Dómini
        fuit volúntas eórum.;;1
      - "Tamquam aurum * in fornáce probávit eléctos Dóminus: et quasi
        holocáusta accépit eos in ætérnum.;;2"
      - Si coram homínibus * torménta passi sunt, spes electórum est immortális
        in ætérnum.;;3
      - Dabo Sanctis meis * locum nominátum in regno Patris mei, dicit
        Dóminus.;;14
      - Sanctis, qui in terra sunt ejus, * mirificávit omnes voluntátes meas
        inter illos.;;15
      - Sancti qui sperant in Dómino, * habébunt fortitúdinem, assúment pennas
        ut áquilæ, volábunt, et non defícient.;;23
      - Justi autem * in perpétuum vivent, et apud Dóminum est merces eórum.;;32
      - "Tradidérunt * córpora sua in mortem, ne servírent idólis: ídeo coronáti
        póssident palmam.;;33"
      - "Ecce merces * Sanctórum copiósa est apud Deum: ipsi vero mórtui sunt
        pro Christo, et vivent in ætérnum.;;45"
