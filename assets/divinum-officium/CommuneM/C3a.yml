      intérius exteriúsque turbári, áliud nos fatétur ab hóstibus, áliud a
      frátribus pérpeti."
    - "Sed his malis præveniéntibus, quia non statim finis sequátur, adjúngit:
      Surget gens contra gentem, et regnum advérsus regnum: et terræmótus magni
      erunt per loca, et pestiléntiæ, et fames, terrorésque de cælo: et signa
      magna erunt. Última tribulátio multis tribulatiónibus prævenítur: et per
      crebra mala, quæ prævéniunt, indicántur mala perpétua, quæ subsequéntur.
      Et ídeo post bella et seditiónes non statim finis: quia multa debent mala
      præcúrrere, ut malum váleant sine fine nuntiáre."
  responsory10:
    - "R. Sancti mei, qui in carne pósiti, certámen habuístis:"
    - "* Mercédem labóris ego reddam vobis."
    - V. Veníte benedícti Patris mei, percípite regnum.
    - R. Mercédem labóris ego reddam vobis.
    - "&Gloria"
    - R. Mercédem labóris ego reddam vobis.
  lectio11:
    - "Sed his malis præveniéntibus, quia non statim finis sequátur, adjúngit:
      Surget gens contra gentem, et regnum advérsus regnum: et terræmótus magni
      erunt per loca, et pestiléntiæ, et fames, terrorésque de cælo: et signa
      magna erunt. Última tribulátio multis tribulatiónibus prævenítur: et per
      crebra mala, quæ prævéniunt, indicántur mala perpétua, quæ subsequéntur.
      Et ídeo post bella et seditiónes non statim finis: quia multa debent mala
      præcúrrere, ut malum váleant sine fine nuntiáre."
    - "Sed cum tot signa perturbatiónis dicta sint, opórtet, ut eórum
      consideratiónem bréviter per síngula perstringámus: quia necésse est, ut
      ália e cælo, ália e terra, ália ab eleméntis, ália ab homínibus patiámur.
      Ait enim: Surget gens contra gentem, ecce perturbátio hóminum: erunt
      terræmótus magni per loca, ecce respéctus iræ désuper: erunt pestiléntiæ
      ecce inæquálitas córporum: erit fames, ecce sterílitas terræ: terrorésque
      de cælo et tempestátes, ecce inæquálitas áëris. Quia ergo ómnia
      consummánda sunt, ante consummatiónem ómnia perturbántur: et qui in
      cunctis delíquimus, in cunctis ferímur: ut impleátur quod dícitur, Et
      pugnábit pro eo orbis terrárum contra insensátos."
    - "&teDeum"
  responsory11:
    - R. Córpora Sanctórum in pace sepúlta sunt,
    - "* Et nómina eórum vivent in generatiónem et generatiónem."
    - V. Sapiéntiam Sanctórum narrent pópuli, et laudem eórum pronúntiet omnis
      Ecclésia.
    - R. Et nómina eórum vivent in generatiónem et generatiónem.
