  lectio4:
    - "!Rom 8:35-39"
    - 35 Quis ergo nos separábit a caritáte Christi? tribulátio? an angústia? an
      fames? an núditas? an perículum? an persecútio? an gládius?
    - "36 (sicut scriptum est: Quia propter te mortificámur tota die: æstimáti
      sumus sicut oves occisiónis.)"
    - 37 Sed in his ómnibus superámus propter eum qui diléxit nos.
    - 38 Certus sum enim quia neque mors, neque vita, neque Ángeli, neque
      Principátus, neque Virtútes, neque instántia, neque futúra, neque
      fortitúdo,
    - 39 neque altitúdo, neque profúndum, neque creatúra ália póterit nos
      separáre a caritáte Dei, quæ est in Christo Jesu Dómino nostro.
  responsory4:
    - "R. Sancti per fidem vicérunt regna, operáti sunt justítiam, adépti sunt
      promissiónes, et fortes facti sunt in bello:"
    - "* Omnes testimónio fídei probáti."
    - V. Castra vertérunt exterórum, effugavérunt áciem gládii.
    - R. Omnes testimónio fídei probáti.
  lectio5:
    - Sermo sancti Augustíni Epíscopi
    - "!Serm. 47. de Sanctis."
    - "Quotiescúmque fratres caríssimi, sanctórum Mártyrum solémnia celebrámus,
      ita, ipsis intercedéntibus, exspectémus a Dómino cónsequi temporália
      benefícia, ut ipsos Mártyres imitándo accípere mereámur ætérna. Ab ipsis
      enim sanctórum Mártyrum in veritáte festivitátum gáudia celebrántur, qui
      ipsórum Mártyrum exémpla sequúntur. Solemnitátes enim Mártyrum
      exhortatiónes sunt martyriórum: ut imitári non pígeat, quod celebráre
      deléctat."
  responsory5:
    - "R. Sancti tui, Dómine, mirábile consecúti sunt iter, serviéntes præcéptis
      tuis, ut inveniréntur illǽsi in aquis válidis:"
    - "* Terra appáruit árida: et in Mari Rubro via sine impediménto."
    - V. Quóniam percússit petram, et fluxérunt aquæ, et torréntes inundavérunt.
    - "R. Terra appáruit árida: et in Mari Rubro via sine impediménto."
  rubrica-cisterciensis/responsory5: []
  lectio6:
    - Sermo sancti Augustíni Epíscopi
    - "!Serm. 47. de Sanctis."
    - "Quotiescúmque fratres caríssimi, sanctórum Mártyrum solémnia celebrámus,
      ita, ipsis intercedéntibus, exspectémus a Dómino cónsequi temporália
      benefícia, ut ipsos Mártyres imitándo accípere mereámur ætérna. Ab ipsis
      enim sanctórum Mártyrum in veritáte festivitátum gáudia celebrántur, qui
      ipsórum Mártyrum exémpla sequúntur. Solemnitátes enim Mártyrum
      exhortatiónes sunt martyriórum: ut imitári non pígeat, quod celebráre
      deléctat."
    - "Sed nos vólumus gaudére cum Sanctis: et tribulatiónem mundi nólumus
      sustinére cum ipsis. Qui enim sanctos Mártyres, in quantum potúerit,
      imitári nolúerit; ad eórum beatitúdinem non póterit perveníre. Sed et
      Paulus Apóstolus prǽdicat dicens: Si fuérimus sócii passiónum, érimus et
      consolatiónum. Et Dóminus in Evangélio: Si mundus vos odit, scitóte quia
      me priórem vobis ódio hábuit. Recúsat esse in córpore, qui ódium non vult
      sustinére cum cápite."
  responsory6:
    - "R. Vérbera carníficum non timuérunt Sancti Dei, moriéntes pro Christi
      nómine:"
    - "* Ut herédes fíerent in domo Dómini."
    - V. Tradidérunt córpora sua propter Deum ad supplícia.
    - R. Ut herédes fíerent in domo Dómini.
  lectio7:
    - "Sed nos vólumus gaudére cum Sanctis: et tribulatiónem mundi nólumus
      sustinére cum ipsis. Qui enim sanctos Mártyres, in quantum potúerit,
