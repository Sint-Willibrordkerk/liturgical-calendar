lectio11:
  - "Beáti páuperes, quia vestrum est regnum Dei. Quátuor tantum beatitúdines
    sanctus Lucas Domínicas posuit, octo vero sanctus Matthǽus: sed in illis
    octo istæ quátuor sunt, et in quátuor istis illæ octo. Hic enim quátuor
    velut virtútes ampléxus est cardináles: ille in illis octo mýsticum númerum
    reserávit. Pro octáva enim multi inscribúntur Psalmi: et mandátum áccipis
    octo illis partem dare fortásse benedictiónibus. Sicut enim spei nostræ
    octáva perféctio est, ita octáva summa virtútum est."
lectio12:
  - "Sed prius quæ sunt amplióra videámus. Beáti, inquit, páuperes, quóniam
    vestrum est regnum Dei. Primam benedictiónem hanc utérque Evangelísta
    pósuit. Órdine enim prima est, et parens quædam generatióque virtútum: quia
    qui contempsérit sæculária, ipse merébitur sempitérna: nec potest quisquam
    méritum regni cæléstis adipísci, qui mundi cupiditáte pressus, emergéndi non
    habet facultátem."
  - "&teDeum"
