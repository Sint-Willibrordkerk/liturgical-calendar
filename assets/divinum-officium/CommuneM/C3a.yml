    - "&teDeum"
  responsory12:
    - "R. Justórum ánimæ in manu Dei sunt, et non tanget illos torméntum mortis.
      Visi sunt óculis insipiéntium mori:"
    - "* Illi autem sunt in pace."
    - V. Deus tentávit illos, et invénit eos dignos se.
    - R. Illi autem sunt in pace.
    - "&Gloria"
    - R. Illi autem sunt in pace.
  mm-capitulum:
    - "!Sap 10:17"
    - "v. Réddidit Deus mercédem labórum sanctórum suórum, et dedúxit illos in
      via mirábili: et fuit illis in velaménto diéi, et in luce stellárum
      nocte."
    - $Deo gratias.
    - _
    - V. Justórum ánimæ in manu Dei sunt.
    - R. Et non tanget illos torméntum mortis.
  ant-vespera-3:
    - Isti sunt Sancti, * qui pro testaménto Dei sua córpora tradidérunt, et in
      sánguine Agni lavérunt stolas suas.;;109
    - Sancti per fidem * vicérunt regna, operáti sunt justítiam, adépti sunt
      repromissiónes.;;110
    - "Sanctórum velut áquilæ * juvéntus renovábitur: florébunt sicut lílium in
      civitáte Dómini.;;111"
    - "Abstérget Deus * omnem lácrimam ab óculis Sanctórum: et jam non erit
      ámplius neque luctus, neque clamor, sed nec ullus dolor: quóniam prióra
      transiérunt.;;112"
    - In cæléstibus regnis * Sanctórum habitátio est, et in ætérnum réquies
      eórum.;;115
  lectio5-in-2-loco:
    - Sermo sancti Joánnis Chrysóstomi
    - "!Sermo 1 de Martyribus, tom. 3."
    - Nemo est, qui nésciat, Mártyrum glórias ad hoc divíno consílio a Dei
      pópulis frequentári, ut et illis débitus honor dicétur, et nobis virtútis
      exémpla, favénte Christo, monstréntur; ut, dum hæc ita celebrári
      perspícimus, cognoscámus quanta eos glória máneat in cælis, quorum
      natalítia táliter celebrántur in terris; quo possímus, étiam ipsi, tálibus
      provocári exémplis, virtúte pari, devotióne consímili ac fide; ut, Christo
      præstánte, dimicáre et víncere hostem possímus, ut, parta victória, cum
      iísdem Sanctis in regnis cæléstibus triumphémus.
  lectio6-in-2-loco:
    - Quis est enim, qui eórum volens mérito copulári, nisi prius constántiam
      eórum téneat, sectétur fidem, imitétur virtútem passiónis; eórum glóriam
      páribus vitæ lineaméntis aut invéniat aut exquírat? Qui, etsi martýrio par
      esse non possit, tamen múneris tanti dignitáte se quisque bonis áctibus
      dignum præbeat. Adest enim clementíssimus Deus, qui desiderántibus suis
      aut martýrium præbeat, aut, sine martýrio, cum Sanctis præmia divína
      retríbuat.
  lectio7-in-2-loco:
    - Ut enim infirmátur peccátor advérsis, ita justus tentatiónibus roborátur.
      Sic dimicárunt advérsus peccátum Sancti; sic, et laborándo fortióres, et
      moriéndo victóres effécti sunt. Nullus athlétes sine certámine fórtior
      dici, nullus sine victória póterit coronári. Nemo miles sine prœlio hostem
      subjécit; nemo sine bello imperatórem proméruit. Habes, christiáne,
      competéntia arma, quibus hostem expúgnes; habes fortíssima tela, quibus
      inimícum debelles.
  lectio8-in-2-loco_:
    - His te jamdúdum Dóminus per grátiam ímbuit, et póstmodum Apóstolus Paulus
      armávit. Hæc sunt arma, quibus dimicárunt Sancti, quorum virtútes díligis
      et victórias admiráris. Imitáre, christiáne, quos díligis Sanctos; et
      quorum virtútes frequéntas, eórum vitam et institúta sectáre. Esto talis
      de eórum exémplo; quia et hi de superiórum tales effécti sunt. Nec enim
      virtus ab eo póterit imitári cujúsquam, qui ejus vitam non fúerit
      imitátus.
