    lectio1:
      - De Epístola beáti Pauli Apóstoli ad Romános
      - "!Rom 8:12-19"
      - "12 Fratres: Debitóres sumus non carni, ut secúndum carnem vivámus."
      - "13 Si enim secúndum carnem vixéritis, moriémini: si autem spíritu facta
        carnis mortificavéritis, vivétis."
      - 14 Quicúmque enim spíritu Dei agúntur, ii sunt fílii Dei.
      - "15 Non enim accepístis spíritum servitútis íterum in timóre, sed
        accepístis spíritum adoptiónis filiórum, in quo clamámus: Abba (Pater)."
      - 16 Ipse enim Spíritus testimónium reddit spirítui nostro quod sumus
        fílii Dei.
      - "17 Si autem fílii, et herédes: herédes, quidem Dei, coherédes autem
        Christi: si tamen compátimur ut et conglorificémur."
      - 18 Exístimo enim quod non sunt condígnæ passiónes hujus témporis ad
        futúram glóriam, quæ revelábitur in nobis.
      - 19 Nam exspectátio creatúræ revelatiónem filiórum Dei exspéctat.
    responsory1:
      - "R. Abstérget Deus omnem lácrimam ab óculis Sanctórum: et jam non erit
        ámplius neque luctus, neque clamor, sed nec ullus dolor:"
      - "* Quóniam prióra transiérunt."
      - V. Non esúrient, neque sítient ámplius, neque cadet super illos sol,
        neque ullus æstus.
      - R. Quóniam prióra transiérunt.
    lectio2:
      - "!Rom 8:28-34"
      - 28 Scimus autem quóniam diligéntibus Deum ómnia cooperántur in bonum iis
        qui secúndum propósitum vocáti sunt sancti.
      - 29 Nam quos præscívit et prædestinávit confórmes fíeri imáginis Fílii
        sui ut sit ipse primogénitus in multis frátribus.
      - "30 Quos autem prædestinávit, hos et vocávit: et quos vocávit, hos et
        justificávit: quos autem justificávit, illos et glorificávit."
      - 31 Quid ergo dicémus ad hæc? Si Deus pro nobis, quis contra nos?
      - 32 Qui étiam próprio Fílio suo non pepércit, sed pro nobis ómnibus
        trádidit illum, quómodo non étiam cum illo ómnia nobis donávit?
      - 33 Quis accusábit advérsus eléctos Dei? Deus qui justíficat,
      - 34 quis est qui condémnet? Christus Jesus, qui mórtuus est, immo qui et
        resurréxit, qui est ad déxteram Dei, qui étiam interpéllat pro nobis.
    responsory2:
      - "R. Viri sancti gloriósum sánguinem fudérunt pro Dómino, amavérunt
        Christum in vita sua, imitáti sunt eum in morte sua:"
      - "* Et ídeo corónas triumpháles meruérunt."
      - V. Unus spíritus, et una fides erat in eis.
      - R. Et ídeo corónas triumpháles meruérunt.
    lectio3:
      - "!Rom 8:35-39"
      - 35 Quis ergo nos separábit a caritáte Christi? tribulátio? an angústia?
        an fames? an núditas? an perículum? an persecútio? an gládius?
      - "36 (sicut scriptum est: Quia propter te mortificámur tota die: æstimáti
        sumus sicut oves occisiónis.)"
      - 37 Sed in his ómnibus superámus propter eum qui diléxit nos.
      - 38 Certus sum enim quia neque mors, neque vita, neque Ángeli, neque
        Principátus, neque Virtútes, neque instántia, neque futúra, neque
        fortitúdo,
      - 39 neque altitúdo, neque profúndum, neque creatúra ália póterit nos
        separáre a caritáte Dei, quæ est in Christo Jesu Dómino nostro.
    responsory3:
      - "R. Tradidérunt córpora sua propter Deum ad supplícia:"
      - "* Et meruérunt habére corónas perpétuas."
      - V. Isti sunt qui venérunt ex magna tribulatióne, et lavérunt stolas suas
        in sánguine Agni.
      - R. Et meruérunt habére corónas perpétuas.
      - "&Gloria"
      - R. Et meruérunt habére corónas perpétuas.
    lectio4:
      - Sermo sancti Augustíni Epíscopi
      - "!Serm. 47. de Sanctis."
      - "Quotiescúmque fratres caríssimi, sanctórum Mártyrum solémnia
        celebrámus, ita, ipsis intercedéntibus, exspectémus a Dómino cónsequi
        temporália benefícia, ut ipsos Mártyres imitándo accípere mereámur
        ætérna. Ab ipsis enim sanctórum Mártyrum in veritáte festivitátum gáudia
        celebrántur, qui ipsórum Mártyrum exémpla sequúntur. Solemnitátes enim
        Mártyrum exhortatiónes sunt martyriórum: ut imitári non pígeat, quod
        celebráre deléctat."
    responsory4:
      - "R. Sancti tui, Dómine, mirábile consecúti sunt iter, serviéntes
        præcéptis tuis, ut inveniréntur illǽsi in aquis válidis:"
      - "* Terra appáruit árida: et in Mari Rubro via sine impediménto."
      - V. Quóniam percússit petram, et fluxérunt aquæ, et torréntes
        inundavérunt.
      - "R. Terra appáruit árida: et in Mari Rubro via sine impediménto."
    lectio5:
      - "Sed nos vólumus gaudére cum Sanctis: et tribulatiónem mundi nólumus
        sustinére cum ipsis. Qui enim sanctos Mártyres, in quantum potúerit,
        imitári nolúerit; ad eórum beatitúdinem non póterit perveníre. Sed et
        Paulus Apóstolus prǽdicat dicens: Si fuérimus sócii passiónum, érimus et
        consolatiónum. Et Dóminus in Evangélio: Si mundus vos odit, scitóte quia
        me priórem vobis ódio hábuit. Recúsat esse in córpore, qui ódium non
        vult sustinére cum cápite."
    responsory5:
      - "R. Vérbera carníficum non timuérunt Sancti Dei, moriéntes pro Christi
        nómine:"
      - "* Ut herédes fíerent in domo Dómini."
      - V. Tradidérunt córpora sua propter Deum ad supplícia.
      - R. Ut herédes fíerent in domo Dómini.
    lectio6:
      - "Sed dicit áliquis: Et quis est qui possit beatórum Mártyrum vestígia
        sequi? Huic ego respóndeo, quia non solum Mártyres, sed étiam ipsum
        Dóminum cum ipsíus adjutório, si vólumus, póssumus imitári. Audi non me,
        sed ipsum Dóminum géneri humáno clamántem: Díscite a me, quia mitis sum
        et húmilis corde. Audi et Petrum Apóstolum admonéntem: Christus passus
        est pro nobis, relínquens nobis exémplum ut sequámur vestígia ejus."
    responsory6:
      - "R. Tamquam aurum in fornáce probávit eléctos Dóminus, et quasi
        holocáusti hóstiam accépit illos: et in témpore erit respéctus illórum:"
      - "* Quóniam donum et pax est eléctis Dei."
      - V. Qui confídunt in illum, intélligent veritátem, et fidéles in
        dilectióne acquiéscent illi.
      - R. Quóniam donum et pax est eléctis Dei.
      - "&Gloria"
      - R. Quóniam donum et pax est eléctis Dei.
    lectio7:
      - Léctio sancti Evangélii secúndum Lucam
      - "!Luc 21:9-19"
      - "In illo témpore: Dixit Jesus discípulis suis: Cum audiéritis prǽlia, et
        seditiónes, nolíte terréri: opórtet primum hæc fíeri, sed nondum statim
        finis. Et réliqua."
      - _
      - Homilía sancti Gregórii Papæ
      - "!Homilia 35 in Evangel."
      - "Dóminus ac Redémptor noster peritúri mundi præcurréntia mala denúntiat,
        ut eo minus pertúrbent veniéntia, quo fúerint præscíta. Minus enim
        jácula fériunt, quæ prævidéntur: et nos tolerabílius mundi mala
        suscípimus, si contra hæc per præsciéntiæ clípeum munímur. Ecce enim
        dicit: Cum audiéritis prǽlia et seditiónes, nolíte terréri: opórtet enim
        primum hæc fíeri, sed nondum statim finis. Pensánda sunt verba
        Redemptóris nostri, per quæ nos áliud intérius, áliud extérius passúros
        esse denúntiat; bella quippe ad hostes pértinent, seditiónes ad cives.
        Ut ergo nos índicet intérius exteriúsque turbári, áliud nos fatétur ab
        hóstibus, áliud a frátribus pérpeti."
    responsory7:
      - "R. Propter testaméntum Dómini, et leges patérnas, Sancti Dei
        perstitérunt in amóre fraternitátis:"
      - "* Quia unus fuit semper spíritus in eis, et una fides."
      - V. Ecce quam bonum et quam jucúndum habitáre fratres in unum.
      - R. Quia unus fuit semper spíritus in eis, et una fides.
    lectio8:
      - "Sed his malis præveniéntibus, quia non statim finis sequátur, adjúngit:
        Surget gens contra gentem, et regnum advérsus regnum: et terræmótus
        magni erunt per loca, et pestiléntiæ, et fames, terrorésque de cælo: et
        signa magna erunt. Última tribulátio multis tribulatiónibus prævenítur:
        et per crebra mala, quæ prævéniunt, indicántur mala perpétua, quæ
        subsequéntur. Et ídeo post bella et seditiónes non statim finis: quia
        multa debent mala præcúrrere, ut malum váleant sine fine nuntiáre."
    responsory8:
      - "R. Sancti mei, qui in carne pósiti, certámen habuístis:"
      - "* Mercédem labóris ego reddam vobis."
      - V. Veníte benedícti Patris mei, percípite regnum.
      - R. Mercédem labóris ego reddam vobis.
      - "&Gloria"
      - R. Mercédem labóris ego reddam vobis.
    lectio9:
      - "Sed cum tot signa perturbatiónis dicta sint, opórtet, ut eórum
        consideratiónem bréviter per síngula perstringámus: quia necésse est, ut
        ália e cælo, ália e terra, ália ab eleméntis, ália ab homínibus
        patiámur. Ait enim: Surget gens contra gentem, ecce perturbátio hóminum:
        erunt terræmótus magni per loca, ecce respéctus iræ désuper: erunt
        pestiléntiæ ecce inæquálitas córporum: erit fames, ecce sterílitas
        terræ: terrorésque de cælo et tempestátes, ecce inæquálitas áëris. Quia
        ergo ómnia consummánda sunt, ante consummatiónem ómnia perturbántur: et
        qui in cunctis delíquimus, in cunctis ferímur: ut impleátur quod
        dícitur, Et pugnábit pro eo orbis terrárum contra insensátos."
      - "&teDeum"
