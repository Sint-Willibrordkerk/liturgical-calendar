    lectio4:
      - Sermo sancti Augustíni Epíscopi
      - "!Sermo 44 de Sanctis"
      - "Triumphális beáti Mártyris N. dies hódie nobis anniversária celebritáte
        recúrrit: cujus glorificatióni sicut congáudet Ecclésia, sic ejus
        propónit sequénda vestígia. Si enim compátimur, et conglorificábimur. In
        cujus glorióso agóne duo nobis præcípue consideránda sunt: induráta
        vidélicet tortóris sævítia, et Mártyris invícta patiéntia. Sævítia
        tortóris, ut eam detestémur: patiéntia Mártyris, ut eam imitémur. Audi
        Psalmístam advérsus malítiam increpántem: Noli æmulári in malignántibus
        quóniam tamquam fœnum velóciter aréscent. Quod autem advérsus
        malignántes patiéntia exhibénda sit, audi Apóstolum suadéntem: Patiéntia
        vobis necessária est, ut reportétis promissiónes."
    responsory4:
      - "R. Honéstum fecit illum Dóminus, et custodívit eum ab inimícis, et a
        seductóribus tutávit illum:"
      - "* Et dedit illi claritátem ætérnam."
      - V. Descendítque cum illo in fóveam, et in vínculis non derelíquit eum.
      - R. Et dedit illi claritátem ætérnam.
    lectio5:
      - "Coronáta ítaque est beáti Mártyris patiéntia: mancipáta est ætérnis
        cruciátibus tortóris incorrécta malítia. Hoc atténdens in agóne suo
        gloriósus Christi Athléta, non exhórruit cárcerem. Ad imitatiónem
        cápitis sui tolerávit probra, sustínuit irrisiónes, flagélla non tímuit:
        et quot ante mortem pro Christo pértulit supplícia, tot ei de se óbtulit
        sacrifícia. Quod enim propinánte Apóstolo bíberat, alte retinébat: Quia
        non sunt condígnæ passiónes hujus témporis ad futúram glóriam, quæ
        revelábitur in nobis. Et quia momentáneum hoc et leve nostræ
        tribulatiónis, ætérnum glóriæ pondus operátur in cælis. Hujus
        promissiónis amóre a terrénis suspénsus, et prægustáta supérnæ
        suavitátis dulcédine ineffabíliter afféctus, dicébat cum Psalmísta: Quid
        mihi est in cælo, et a te quid volui super terram? Defécit caro mea et
        cor meum: Deus cordis mei, et pars mea Deus in ætérnum."
    responsory5:
      - R. Desidérium ánimæ ejus tribuísti ei Dómine,
      - "* Et voluntáte labiórum ejus non fraudásti eum."
      - "V. Quóniam prævenísti eum in benedictiónibus dulcédinis: posuísti in
        cápite ejus corónam de lápide pretióso."
      - R. Et voluntáte labiórum ejus non fraudásti eum.
    lectio6:
      - "Contemplabátur enim quantum in ænígmate infírmitas humána óculum mentis
        in æternitáte fígere potest, quanta sint supérnæ civitátis gáudia: et ea
        enarráre non suffíciens admirándo clamábat Quid mihi est in cælo? Quasi
        díceret: Excédit vires meas, excédit facultátem eloquéntiæ meæ,
        transcéndit capacitátem intelligéntiæ meæ illud decus, illa glória, illa
        celsitúdo, qua nobis, a conturbatióne hóminum remótis, in abscóndito
        faciéi suæ Jesus Christus Dóminus noster reformábit corpus humilitátis
        nostræ, configurátum córpori claritátis suæ. Hujus perféctæ libertátis
        contemplatióne nullum vitábat perículum, nullum horrébat supplícium: et
        si mílies posset mori, non putábat se hanc digne posse áliqua ratióne
        promeréri."
    responsory6:
      - "R. Stola jucunditátis índuit eum Dóminus:"
      - "* Et corónam pulchritúdinis pósuit super caput ejus."
      - "V. Cibávit illum Dóminus pane vitæ et intelléctus: et aqua sapiéntiæ
        salutáris potávit illum."
      - R. Et corónam pulchritúdinis pósuit super caput ejus.
      - "&Gloria"
      - R. Et corónam pulchritúdinis pósuit super caput ejus.
    lectio7:
      - Léctio sancti Evangélii secúndum Lucam
      - "!Luc 14:26-33"
      - "In illo témpore: Dixit Jesus turbis: Si quis venit ad me, et non odit
        patrem suum, et matrem, et uxórem, et fílios, et fratres, et soróres,
        adhuc autem et ánimam suam, non potest meus esse discípulus. Et
        réliqua."
      - _
      - Homilía sancti Gregórii Papæ
      - "!Homil. 37 in Evangelia"
      - Si considerémus fratres caríssimi, quæ et quanta sunt, quæ nobis
        promittúntur in cælis, viléscunt ánimo ómnia quæ habéntur in terris.
        Terréna namque substántia supérnæ felicitáti comparáta, pondus est, non
        subsídium. Temporális vita ætérnæ vitæ comparáta, mors est pótius
        dicénda quam vita. Ipse enim quotidiánus deféctus corruptiónis quid est
        áliud, quam quædam prolíxitas mortis? Quæ autem lingua dícere, vel quis
        intelléctus cápere súfficit, illa supérnæ civitátis quanta sint gáudia;
        Angelórum choris interésse, cum beatíssimis spirítibus glóriæ Conditóris
        assístere, præséntem Dei vultum cérnere, incircumscríptum lumen vidére,
        nullo mortis metu áffici, incorruptiónis perpétuæ múnere lætári?
    responsory7:
      - R. Coróna áurea super caput ejus,
      - "* Expréssa signo sanctitátis, glória honóris, et opus fortitúdinis."
      - V. Quóniam prævenísti eum in benedictiónibus dulcédinis, posuísti in
        cápite ejus corónam de lápide pretióso.
      - R. Expréssa signo sanctitátis, glória honóris, et opus fortitúdinis.
    lectio8:
      - "Sed ad hæc audíta inardéscit ánimus, jamque illic cupit assístere, ubi
        se sperat sine fine gaudére. Sed ad magna prǽmia perveníri non potest,
        nisi per magnos labóres. Unde et Paulus egrégius prædicátor dicit: Non
        coronábitur, nisi qui legítime certáverit. Deléctet ergo mentem
        magnitúdo præmiórum, sed non detérreat certámen labórum. Unde ad se
        veniéntibus Véritas dicit: Si quis venit ad me, et non odit patrem suum,
        et matrem, et uxórem, et fílios, et fratres, et soróres, adhuc autem et
        ánimam suam, non potest meus esse discípulus."
    responsory8-non-effusorum:
