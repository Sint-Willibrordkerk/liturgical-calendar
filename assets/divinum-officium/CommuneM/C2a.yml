  lectio8-in-2-loco:
    - "Pone ergo Mártyrem inter perícula constitútum, cum inde immánitas
      bestiárum ad incutiéndum terrórem ínfremat, aliúnde stridor candéntium
      laminárum et flamma fornácis ardéntis exæstuet; ex parte ália pérsonent
      tractus grávium catenárum, hinc cárnifex cruéntus assístat: Pone, inquam,
      circumspectántem ómnia plena supplíciis, deínde cogitántem mandáta divína,
      illum ignem perpétuum, illud sine fine incéndium perfidórum, illam pœnæ
      recrudescéntis ærúmnam; trepidáre corde, ne, dum præséntibus cedat,
      perpétuis se dedat exítiis; perturbári ánimo, dum futúri judícii rhomphæam
      illam terríbilem quadam conspéctus spécie contuétur. Nonne ad hanc
      trepidatiónem fidúciæ viri constántis, æquális in eúmdem concúrrit
      efféctum confidéntia cupiéntis ætérna, et divína trepidántis?"
  lectio9-in-2-loco:
    - Léctio sancti Evangélii secúndum Matthǽum
    - "!Matt 16:24-27"
    - "In illo témpore: Dixit Jesus discípulis suis: Si quis vult post me
      veníre, ábneget semetípsum, et tollat crucem suam, et sequátur me. Et
      réliqua."
    - _
    - Homilía sancti Gregórii Papæ
    - "!Homilia 32 in Evang."
    - "Quia Dóminus ac Redémptor noster novus homo venit in mundum, nova
      præcépta dedit mundo. Vitæ étenim nostræ véteri in vítiis enutrítæ
      contrarietátem oppósuit novitátis suæ. Quid enim vetus, quid carnális homo
      nóverat, nisi sua retinére, aliéna rápere, si posset; concupíscere, si non
      posset? Sed cæléstis médicus síngulis quibúsque vítiis obviántia ádhibet
      medicaménta. Nam sicut arte medicínæ cálida frígidis, frígida cálidis
      curántur: ita Dóminus noster contrária oppósuit medicaménta peccátis, ut
      lúbricis continéntiam, tenácibus largitátem, iracúndis mansuetúdinem,
      elátis præcíperet humilitátem."
  lectio10-in-2-loco:
    - Léctio sancti Evangélii secúndum Matthǽum
    - "!Matt 16:24-27"
    - "In illo témpore: Dixit Jesus discípulis suis: Si quis vult post me
      veníre, ábneget semetípsum, et tollat crucem suam, et sequátur me. Et
      réliqua."
    - _
    - Homilía sancti Gregórii Papæ
    - "!Homilia 32 in Evang."
    - "Quia Dóminus ac Redémptor noster novus homo venit in mundum, nova
      præcépta dedit mundo. Vitæ étenim nostræ véteri in vítiis enutrítæ
      contrarietátem oppósuit novitátis suæ. Quid enim vetus, quid carnális homo
      nóverat, nisi sua retinére, aliéna rápere, si posset; concupíscere, si non
      posset? Sed cæléstis médicus síngulis quibúsque vítiis obviántia ádhibet
      medicaménta. Nam sicut arte medicínæ cálida frígidis, frígida cálidis
      curántur: ita Dóminus noster contrária oppósuit medicaménta peccátis, ut
      lúbricis continéntiam, tenácibus largitátem, iracúndis mansuetúdinem,
      elátis præcíperet humilitátem."
    - "Certe cum se sequéntibus nova mandáta propóneret, dixit: Nisi quis
      renuntiáverit ómnibus quæ póssidet, non potest meus esse discípulus. Ac si
      apérte dicat: Qui per vitam véterem aliéna concupíscitis, per novæ
      conversatiónis stúdium et vestra largímini. Quid vero in hac lectióne
      dicat, audiámus: Qui vult post me veníre, ábneget semetípsum. Ibi dícitur,
      ut abnegémus nostra: hic dícitur, ut abnegémus nos. Et fortásse laboriósum
      non est hómini relínquere sua; sed valde laboriósum est relínquere
      semetípsum. Minus quippe est abnegáre quod habet; valde autem multum est
      abnegáre quod est."
  lectio11-in-2-loco:
    - "Certe cum se sequéntibus nova mandáta propóneret, dixit: Nisi quis
      renuntiáverit ómnibus quæ póssidet, non potest meus esse discípulus. Ac si
      apérte dicat: Qui per vitam véterem aliéna concupíscitis, per novæ
      conversatiónis stúdium et vestra largímini. Quid vero in hac lectióne
      dicat, audiámus: Qui vult post me veníre, ábneget semetípsum. Ibi dícitur,
      ut abnegémus nostra: hic dícitur, ut abnegémus nos. Et fortásse laboriósum
      non est hómini relínquere sua; sed valde laboriósum est relínquere
      semetípsum. Minus quippe est abnegáre quod habet; valde autem multum est
      abnegáre quod est."
  lectio12-in-2-loco:
    - "Ad se autem nobis veniéntibus Dóminus præcépit, ut renuntiémus nostris:
      quia quicúmque ad fídei agónem vénimus, luctámen contra malígnos spíritus
      súmimus. Nihil autem malígni spíritus in hoc mundo próprium póssident:
      nudi ergo cum nudis luctári debémus. Nam si vestítus quisque cum nudo
      luctátur, cítius ad terram dejícitur, quia habet unde teneátur. Quid enim
      sunt terréna ómnia, nisi quædam córporis induménta? Qui ergo contra
      diábolum ad certámen próperat, vestiménta abjíciat, ne succúmbat."
    - "&teDeum"
  lectio9-in-3-loco:
    - Léctio sancti Evangélii secúndum Matthǽum
    - "!Matt 10:34-42"
    - "In illo témpore: Dixit Jesus discípulis suis: Nolíte arbitrári quia pacem
      vénerim míttere in terram: non veni pacem míttere, sed gládium. Et
      réliqua."
    - _
    - Homilía sancti Hilárii Epíscopi
    - "!Comment. in Matth., can. 10"
    - "Quæ ista divísio est? inter prima enim legis præcépta accépimus: Honóra
      patrem tuum et matrem tuam; et ipse Dóminus ait: Pacem meam do vobis,
      pacem meam relínquo vobis. Quid sibi vult missus pótius gládius in terram,
      et separátus a patre fílius, et fília a matre, et nurus advérsus socrum,
      et hóminis doméstici ejus inimíci? Igitur exínde pública auctóritas
      impietáti proferétur. Ubíque ódia, ubíque bella, et gládius Dómini inter
      patrem et fílium, et inter filiam matrémque desæviens."
  lectio10-in-3-loco:
    - Léctio sancti Evangélii secúndum Matthǽum
    - "!Matt 10:34-42"
    - "In illo témpore: Dixit Jesus discípulis suis: Nolíte arbitrári quia pacem
      vénerim míttere in terram: non veni pacem míttere, sed gládium. Et
      réliqua."
    - _
    - Homilía sancti Hilárii Epíscopi
    - "!Comment. in Matth., can. 10"
    - "Quæ ista divísio est? inter prima enim legis præcépta accépimus: Honóra
      patrem tuum et matrem tuam; et ipse Dóminus ait: Pacem meam do vobis,
      pacem meam relínquo vobis. Quid sibi vult missus pótius gládius in terram,
      et separátus a patre fílius, et fília a matre, et nurus advérsus socrum,
      et hóminis doméstici ejus inimíci? Igitur exínde pública auctóritas
      impietáti proferétur. Ubíque ódia, ubíque bella, et gládius Dómini inter
      patrem et fílium, et inter filiam matrémque desæviens."
    - Gládius telórum ómnium telum acutíssimum est, in quo sit jus potestátis,
      et judícii sevéritas, et animadvérsio peccatórum. Et, hujus quidem teli
      nómine, novi Evangélii prædicatiónem appellátam frequens in prophétis
      auctóritas est. Dei ígitur verbum nuncupátum meminérimus in gládio; qui
      gládius missus in terram est, idest, prædicátio ejus hóminum córdibus
      infúsa. Fitque gravis in domo una dissénsio, et doméstica novo hómini
      erunt inimíca; quia ille, per verbum Dei divísus ab illis, manére et
      intérior et extérior, id est, et corpus et anima, in spíritus novitáte
      gaudébit.
  lectio11-in-3-loco:
    - Gládius telórum ómnium telum acutíssimum est, in quo sit jus potestátis,
      et judícii sevéritas, et animadvérsio peccatórum. Et, hujus quidem teli
      nómine, novi Evangélii prædicatiónem appellátam frequens in prophétis
      auctóritas est. Dei ígitur verbum nuncupátum meminérimus in gládio; qui
      gládius missus in terram est, idest, prædicátio ejus hóminum córdibus
      infúsa. Fitque gravis in domo una dissénsio, et doméstica novo hómini
      erunt inimíca; quia ille, per verbum Dei divísus ab illis, manére et
      intérior et extérior, id est, et corpus et anima, in spíritus novitáte
      gaudébit.
  lectio12-in-3-loco:
    - "Pergit deínde eódem præceptórum et intelligéntiæ decúrsu. Nam, posteáquam
      relinquénda ómnia, quæ in sæculo caríssima sunt, imperáverat, adjécit: Qui
      non áccipit crucem suam, et séquitur me, non est me dignus; quia Qui
      Christi sunt, crucifixérunt corpus cum vítiis et concupiscéntia. Et
      indígnus est Christo, qui non crucem suam, in qua compátimur, commórimur,
      consepelímur, conresúrgimus, accípiens, Dóminum sit secúrus, in hoc
      sacraménto fídei, spíritus novitáte victúrus."
    - "&teDeum"
  lectio9-in-4-loco:
    - Léctio sancti Evangélii secúndum Matthǽum
    - "!Matt 10:26-32"
    - "In illo témpore: Dixit Jesus discípulis suis: Nihil est opértum, quod non
      revelábitur; et occúltum, quod non sciétur. Et réliqua."
    - _
    - Homilía sancti Hilárii Epíscopi
    - "!Comment. in Matthaeum, can. 10 post medium"
    - "Dóminus diem judícii osténdit, quæ abstrúsam voluntátis nostræ
      consciéntiam prodet: et ea quæ nunc occúlta existimántur, luce cognitiónis
      públicæ déteget. Ígitur non minas, non consília, non potestátes
      insectántium monet esse metuéndas: quia dies judícii nulla hæc fuísse,
      atque inánia revelábit. Et quod dico vobis in ténebris, dícite in lúmine:
      et quod in aure audítis, prædicáte super tecta. Non légimus Dóminum
      sólitum fuísse nóctibus sermocinári, et doctrínam in ténebris tradidísse:
      sed quia omnis sermo ejus carnálibus ténebræ sunt, et verbum ejus
      infidélibus nox est."
  lectio10-in-4-loco:
    - Léctio sancti Evangélii secúndum Matthǽum
    - "!Matt 10:26-32"
    - "In illo témpore: Dixit Jesus discípulis suis: Nihil est opértum, quod non
      revelábitur; et occúltum, quod non sciétur. Et réliqua."
    - _
    - Homilía sancti Hilárii Epíscopi
    - "!Comment. in Matthaeum, can. 10 post medium"
    - "Dóminus diem judícii osténdit, quæ abstrúsam voluntátis nostræ
      consciéntiam prodet: et ea quæ nunc occúlta existimántur, luce cognitiónis
      públicæ déteget. Ígitur non minas, non consília, non potestátes
      insectántium monet esse metuéndas: quia dies judícii nulla hæc fuísse,
      atque inánia revelábit. Et quod dico vobis in ténebris, dícite in lúmine:
      et quod in aure audítis, prædicáte super tecta. Non légimus Dóminum
      sólitum fuísse nóctibus sermocinári, et doctrínam in ténebris tradidísse:
      sed quia omnis sermo ejus carnálibus ténebræ sunt, et verbum ejus
      infidélibus nox est."
  lectio11-in-4-loco:
    - "Ítaque id quod a se dictum est, cum libertáte fídei et confessiónis vult
      esse loquéndum. Idcírco quæ in ténebris dicta sunt prædicári jussit in
      lúmine: ut quæ secréto áurium commíssa sunt, super tecta, id est, excélso
      loquéntium præcónio audiántur. Constánter enim Dei ingerénda cognítio est,
      et profúndum doctrínæ evangélicæ secrétum in lúmine prædicatiónis
      apostólicæ revelándum: non timéntes eos, quibus cum sit licéntia in
      córpora, tamen in ánimam jus nullum est: sed timéntes pótius Deum, cui
      perdéndæ in gehénna et ánimæ et córporis sit potéstas."
  lectio12-in-4-loco:
    - "Nolíte timére eos qui occídunt corpus. Nullus ígitur córporum nostrórum
      casus est pertimescéndus, neque ullus interiméndæ carnis admitténdus est
      dolor: quando pro natúræ suæ atque oríginis conditióne resolúta, in
      substántiam spirituális ánimæ refundátur. Et quia doctrínis tálibus
      confirmátos opórtet líberam confiténdi Dei habére constántiam, étiam
      conditiónem, qua tenerémur, adjécit: negatúrum se eum Patri in cælis, qui
      se homínibus in terra negásset: eum porro qui conféssus coram homínibus se
      fuísset, a se in cælis confiténdum: qualésque nos nóminis sui testes
      homínibus fuissémus, tali nos apud Deum Patrem testimónio ejus usúros."
    - "&teDeum"
oratio:
  - "Præsta, quǽsumus, omnípotens Deus: ut, qui beáti N. Mártyris tui natalítia
    cólimus, intercessióne ejus in tui nóminis amóre roborémur."
  - $Per Dominum
lectio1:
  - De Epístola beáti Pauli Apóstoli ad Romános
  - "!Rom 8:12-19"
  - "12 Fratres: Debitóres sumus non carni, ut secúndum carnem vivámus."
  - "13 Si enim secúndum carnem vixéritis, moriémini: si autem spíritu facta
    carnis mortificavéritis, vivétis."
  - 14 Quicúmque enim spíritu Dei agúntur, ii sunt fílii Dei.
  - "15 Non enim accepístis spíritum servitútis íterum in timóre, sed accepístis
    spíritum adoptiónis filiórum, in quo clamámus: Abba (Pater)."
  - 16 Ipse enim Spíritus testimónium reddit spirítui nostro quod sumus fílii
    Dei.
  - "17 Si autem fílii, et herédes: herédes, quidem Dei, coherédes autem
    Christi: si tamen compátimur ut et conglorificémur."
  - 18 Exístimo enim quod non sunt condígnæ passiónes hujus témporis ad futúram
    glóriam, quæ revelábitur in nobis.
  - 19 Nam exspectátio creatúræ revelatiónem filiórum Dei exspéctat.
