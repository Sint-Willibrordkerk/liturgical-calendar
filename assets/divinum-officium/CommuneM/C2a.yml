  lectio5-in-2-loco:
    - De Expositióne sancti Ambrósii Epíscopi in Psalmum centésimum décimum
      octávum
    - "!Sermo 21, n. 7 et 8"
    - "Príncipes persecúti sunt me gratis: et a verbis tuis trepidávit cor meum.
      Bene hoc Martyr dicit, quod injúste persecutiónum torménta sustineat; qui
      nihil rapúerit, nullum violentus oppresserit, nullius sánguinem fuderit,
      nullius torum putaverit esse violándum; qui nihil légibus debeat, et
      gravióra latronum sustinere cogátur supplícia; qui loquátur juste, et non
      audiátur; qui loquátur plena salútis, et impugnétur, ut possit dicere: Cum
      loquébar illis, impugnábant me gratis. Gratis ígitur persecutiónem
      pátitur, qui impugnátur sine crimine; impugnátur ut noxius cum sit in tali
      confessióne laudábilis; impugnátur quasi veneficus, qui in nómine Dómini
      gloriátur, cum pietas virtútum ómnium fundaméntum sit."
  lectio6-in-2-loco:
    - De Expositióne sancti Ambrósii Epíscopi in Psalmum centésimum décimum
      octávum
    - "!Sermo 21, n. 7 et 8"
    - "Príncipes persecúti sunt me gratis: et a verbis tuis trepidávit cor meum.
      Bene hoc Martyr dicit, quod injúste persecutiónum torménta sustineat; qui
      nihil rapúerit, nullum violentus oppresserit, nullius sánguinem fuderit,
      nullius torum putaverit esse violándum; qui nihil légibus debeat, et
      gravióra latronum sustinere cogátur supplícia; qui loquátur juste, et non
      audiátur; qui loquátur plena salútis, et impugnétur, ut possit dicere: Cum
      loquébar illis, impugnábant me gratis. Gratis ígitur persecutiónem
      pátitur, qui impugnátur sine crimine; impugnátur ut noxius cum sit in tali
      confessióne laudábilis; impugnátur quasi veneficus, qui in nómine Dómini
      gloriátur, cum pietas virtútum ómnium fundaméntum sit."
    - "Vere frustra impugnátur, qui apud ímpios et infidos impietátis
      arcessitur, cum fidei sit magister. Verum, qui gratis impugnátur, fortis
      debet esse et constans; quómodo ergo subtexuit: Et a verbis tuis
      trepidávit cor meum? Trepidare infirmitátis est, timoris atque formidinis.
      Sed est étiam infirmitas ad salútem, est étiam timor sanctórum: Timéte
      Dóminum, omnes sancti ejus; et, Beátus vir, qui timet Dóminum. Qua ratióne
      beatus? Quia in mandatis ejus cupit nimis."
  lectio7-in-2-loco:
