    - 25 Et nunc ecce ego scio quia ámplius non vidébitis fáciem meam vos omnes,
      per quos transívi prǽdicans regnum Dei.
    - 26 Quaprópter contéstor vos hodiérna die, quia mundus sum a sánguine
      ómnium.
    - 27 Non enim subterfúgi, quóminus annuntiárem omne consílium Dei vobis.
    - 28 Atténdite vobis, et univérso gregi, in quo vos Spíritus Sanctus pósuit
      epíscopos régere Ecclésiam Dei, quam acquisívit sánguine suo.
    - 29 Ego scio quóniam intrábunt post discessiónem meam lupi rapáces in vos,
