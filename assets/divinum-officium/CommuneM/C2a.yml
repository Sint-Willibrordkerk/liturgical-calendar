    lectio1:
      - De Áctibus Apostolórum
      - "!Acts 20:17-24"
      - 17 A Miléto Paulus mittens Éphesum, vocávit majóres natu Ecclésiæ.
      - "18 Qui cum veníssent ad eum, et simul essent, dixit eis: Vos scitis a
        prima die qua ingréssus sum in Ásiam, quáliter vobíscum per omne tempus
        fúerim,"
      - "19 sérviens Dómino cum omni humilitáte, et lácrimis, et tentatiónibus,
        quae mihi accidérunt ex insídiis Judæórum:"
      - 20 quómodo nihil subtráxerim utílium, quóminus annuntiárem vobis et
        docérem vos, públice et per domos,
      - 21 testíficans Judǽis atque Gentílibus in Deum pœniténtiam, et fidem in
        Dóminum nostrum Jesum Christum.
      - "22 Et nunc ecce alligátus ego spíritu, vado in Jerúsalem: quæ in ea
        ventúra sint mihi, ignórans:"
      - "23 nisi quod Spíritus Sanctus per omnes civitátes mihi protestátur,
        dicens: Quóniam víncula et tribulatiónes Jerosólymis me manent."
      - "24 Sed nihil horum véreor: nec fácio ánimam meam pretiosiórem quam me,
        dúmmodo consúmmem cursum meum, et ministérium verbi quod accépi a Dómino
        Jesu, testificári Evangélium grátiæ Dei."
    responsory1:
      - "R. Iste Sanctus pro lege Dei sui certávit usque ad mortem, et a verbis
        impiórum non tímuit:"
      - "* Fundátus enim erat supra firmam petram."
      - V. Iste est qui contémpsit vitam mundi, et pervénit ad cæléstia regna.
      - R. Fundátus enim erat supra firmam petram.
    lectio2:
      - "!Acts 20:25-31"
      - 25 Et nunc ecce ego scio quia ámplius non vidébitis fáciem meam vos
        omnes, per quos transívi prǽdicans regnum Dei.
      - 26 Quaprópter contéstor vos hodiérna die, quia mundus sum a sánguine
        ómnium.
      - 27 Non enim subterfúgi, quóminus annuntiárem omne consílium Dei vobis.
      - 28 Atténdite vobis, et univérso gregi, in quo vos Spíritus Sanctus
        pósuit epíscopos régere Ecclésiam Dei, quam acquisívit sánguine suo.
      - 29 Ego scio quóniam intrábunt post discessiónem meam lupi rapáces in
        vos, non parcéntes gregi.
      - 30 Et ex vobis ipsis exsúrgent viri loquéntes pervérsa, ut abdúcant
        discípulos post se.
      - 31 Propter quod vigiláte, memória retinéntes quóniam per triénnium nocte
        et die non cessávi, cum lácrimis monens unumquémque vestrum.
    responsory2:
