  lectio1:
    - De Áctibus Apostolórum
    - "!Acts 20:17-24"
    - 17 A Miléto Paulus mittens Éphesum, vocávit majóres natu Ecclésiæ.
    - "18 Qui cum veníssent ad eum, et simul essent, dixit eis: Vos scitis a
      prima die qua ingréssus sum in Ásiam, quáliter vobíscum per omne tempus
      fúerim,"
    - "19 sérviens Dómino cum omni humilitáte, et lácrimis, et tentatiónibus,
      quae mihi accidérunt ex insídiis Judæórum:"
    - 20 quómodo nihil subtráxerim utílium, quóminus annuntiárem vobis et
      docérem vos, públice et per domos,
    - 21 testíficans Judǽis atque Gentílibus in Deum pœniténtiam, et fidem in
      Dóminum nostrum Jesum Christum.
    - "22 Et nunc ecce alligátus ego spíritu, vado in Jerúsalem: quæ in ea
      ventúra sint mihi, ignórans:"
    - "23 nisi quod Spíritus Sanctus per omnes civitátes mihi protestátur,
      dicens: Quóniam víncula et tribulatiónes Jerosólymis me manent."
    - "24 Sed nihil horum véreor: nec fácio ánimam meam pretiosiórem quam me,
      dúmmodo consúmmem cursum meum, et ministérium verbi quod accépi a Dómino
      Jesu, testificári Evangélium grátiæ Dei."
