      - R. Magna est glória ejus * In salutári tuo.
    versum-3:
      - V. Justus ut palma florébit.
      - R. Sicut cedrus Líbani multiplicábitur.
    ant-3:
      - Qui vult veníre post me, * ábneget semetípsum, et tollat crucem suam, et
        sequátur me.
    lectio4-in-2-loco:
      - De Expositióne sancti Ambrósii Epíscopi in Psalmum centésimum décimum
        octávum
      - "!Sermo 21, n. 7 et 8"
      - "Príncipes persecúti sunt me gratis: et a verbis tuis trepidávit cor
        meum. Bene hoc Martyr dicit, quod injúste persecutiónum torménta
        sustineat; qui nihil rapúerit, nullum violentus oppresserit, nullius
        sánguinem fuderit, nullius torum putaverit esse violándum; qui nihil
        légibus debeat, et gravióra latronum sustinere cogátur supplícia; qui
        loquátur juste, et non audiátur; qui loquátur plena salútis, et
        impugnétur, ut possit dicere: Cum loquébar illis, impugnábant me gratis.
        Gratis ígitur persecutiónem pátitur, qui impugnátur sine crimine;
        impugnátur ut noxius cum sit in tali confessióne laudábilis; impugnátur
        quasi veneficus, qui in nómine Dómini gloriátur, cum pietas virtútum
        ómnium fundaméntum sit."
    lectio5-in-2-loco:
      - "Vere frustra impugnátur, qui apud ímpios et infidos impietátis
        arcessitur, cum fidei sit magister. Verum, qui gratis impugnátur, fortis
        debet esse et constans; quómodo ergo subtexuit: Et a verbis tuis
        trepidávit cor meum? Trepidare infirmitátis est, timoris atque
        formidinis. Sed est étiam infirmitas ad salútem, est étiam timor
        sanctórum: Timéte Dóminum, omnes sancti ejus; et, Beátus vir, qui timet
        Dóminum. Qua ratióne beatus? Quia in mandatis ejus cupit nimis."
    lectio6-in-2-loco:
      - "Pone ergo Mártyrem inter perícula constitútum, cum inde immánitas
        bestiárum ad incutiéndum terrórem ínfremat, aliúnde stridor candéntium
        laminárum et flamma fornácis ardéntis exæstuet; ex parte ália pérsonent
        tractus grávium catenárum, hinc cárnifex cruéntus assístat: Pone,
        inquam, circumspectántem ómnia plena supplíciis, deínde cogitántem
        mandáta divína, illum ignem perpétuum, illud sine fine incéndium
        perfidórum, illam pœnæ recrudescéntis ærúmnam; trepidáre corde, ne, dum
        præséntibus cedat, perpétuis se dedat exítiis; perturbári ánimo, dum
        futúri judícii rhomphæam illam terríbilem quadam conspéctus spécie
        contuétur. Nonne ad hanc trepidatiónem fidúciæ viri constántis, æquális
        in eúmdem concúrrit efféctum confidéntia cupiéntis ætérna, et divína
        trepidántis?"
    lectio7-in-2-loco:
      - Léctio sancti Evangélii secúndum Matthǽum
      - "!Matt 16:24-27"
      - "In illo témpore: Dixit Jesus discípulis suis: Si quis vult post me
        veníre, ábneget semetípsum, et tollat crucem suam, et sequátur me. Et
        réliqua."
      - _
      - Homilía sancti Gregórii Papæ
      - "!Homilia 32 in Evang."
      - "Quia Dóminus ac Redémptor noster novus homo venit in mundum, nova
        præcépta dedit mundo. Vitæ étenim nostræ véteri in vítiis enutrítæ
        contrarietátem oppósuit novitátis suæ. Quid enim vetus, quid carnális
        homo nóverat, nisi sua retinére, aliéna rápere, si posset; concupíscere,
        si non posset? Sed cæléstis médicus síngulis quibúsque vítiis obviántia
        ádhibet medicaménta. Nam sicut arte medicínæ cálida frígidis, frígida
        cálidis curántur: ita Dóminus noster contrária oppósuit medicaménta
        peccátis, ut lúbricis continéntiam, tenácibus largitátem, iracúndis
        mansuetúdinem, elátis præcíperet humilitátem."
    lectio8-in-2-loco:
      - "Certe cum se sequéntibus nova mandáta propóneret, dixit: Nisi quis
        renuntiáverit ómnibus quæ póssidet, non potest meus esse discípulus. Ac
        si apérte dicat: Qui per vitam véterem aliéna concupíscitis, per novæ
        conversatiónis stúdium et vestra largímini. Quid vero in hac lectióne
        dicat, audiámus: Qui vult post me veníre, ábneget semetípsum. Ibi
        dícitur, ut abnegémus nostra: hic dícitur, ut abnegémus nos. Et fortásse
        laboriósum non est hómini relínquere sua; sed valde laboriósum est
        relínquere semetípsum. Minus quippe est abnegáre quod habet; valde autem
        multum est abnegáre quod est."
    lectio9-in-2-loco:
      - "Ad se autem nobis veniéntibus Dóminus præcépit, ut renuntiémus nostris:
        quia quicúmque ad fídei agónem vénimus, luctámen contra malígnos
        spíritus súmimus. Nihil autem malígni spíritus in hoc mundo próprium
        póssident: nudi ergo cum nudis luctári debémus. Nam si vestítus quisque
        cum nudo luctátur, cítius ad terram dejícitur, quia habet unde teneátur.
        Quid enim sunt terréna ómnia, nisi quædam córporis induménta? Qui ergo
        contra diábolum ad certámen próperat, vestiménta abjíciat, ne
        succúmbat."
      - "&teDeum"
    lectio7-in-3-loco:
      - Léctio sancti Evangélii secúndum Matthǽum
      - "!Matt 10:34-42"
      - "In illo témpore: Dixit Jesus discípulis suis: Nolíte arbitrári quia
        pacem vénerim míttere in terram: non veni pacem míttere, sed gládium. Et
        réliqua."
      - _
      - Homilía sancti Hilárii Epíscopi
      - "!Comment. in Matth., can. 10"
      - "Quæ ista divísio est? inter prima enim legis præcépta accépimus: Honóra
        patrem tuum et matrem tuam; et ipse Dóminus ait: Pacem meam do vobis,
        pacem meam relínquo vobis. Quid sibi vult missus pótius gládius in
        terram, et separátus a patre fílius, et fília a matre, et nurus advérsus
        socrum, et hóminis doméstici ejus inimíci? Igitur exínde pública
        auctóritas impietáti proferétur. Ubíque ódia, ubíque bella, et gládius
        Dómini inter patrem et fílium, et inter filiam matrémque desæviens."
    lectio8-in-3-loco:
      - Gládius telórum ómnium telum acutíssimum est, in quo sit jus potestátis,
        et judícii sevéritas, et animadvérsio peccatórum. Et, hujus quidem teli
        nómine, novi Evangélii prædicatiónem appellátam frequens in prophétis
        auctóritas est. Dei ígitur verbum nuncupátum meminérimus in gládio; qui
        gládius missus in terram est, idest, prædicátio ejus hóminum córdibus
        infúsa. Fitque gravis in domo una dissénsio, et doméstica novo hómini
        erunt inimíca; quia ille, per verbum Dei divísus ab illis, manére et
        intérior et extérior, id est, et corpus et anima, in spíritus novitáte
        gaudébit.
    lectio9-in-3-loco:
      - "Pergit deínde eódem præceptórum et intelligéntiæ decúrsu. Nam,
        posteáquam relinquénda ómnia, quæ in sæculo caríssima sunt, imperáverat,
        adjécit: Qui non áccipit crucem suam, et séquitur me, non est me dignus;
        quia Qui Christi sunt, crucifixérunt corpus cum vítiis et
        concupiscéntia. Et indígnus est Christo, qui non crucem suam, in qua
        compátimur, commórimur, consepelímur, conresúrgimus, accípiens, Dóminum
        sit secúrus, in hoc sacraménto fídei, spíritus novitáte victúrus."
      - "&teDeum"
    lectio7-in-4-loco:
      - Léctio sancti Evangélii secúndum Matthǽum
      - "!Matt 10:26-32"
      - "In illo témpore: Dixit Jesus discípulis suis: Nihil est opértum, quod
        non revelábitur; et occúltum, quod non sciétur. Et réliqua."
      - _
      - Homilía sancti Hilárii Epíscopi
      - "!Comment. in Matthaeum, can. 10 post medium"
      - "Dóminus diem judícii osténdit, quæ abstrúsam voluntátis nostræ
        consciéntiam prodet: et ea quæ nunc occúlta existimántur, luce
        cognitiónis públicæ déteget. Ígitur non minas, non consília, non
        potestátes insectántium monet esse metuéndas: quia dies judícii nulla
        hæc fuísse, atque inánia revelábit. Et quod dico vobis in ténebris,
        dícite in lúmine: et quod in aure audítis, prædicáte super tecta. Non
        légimus Dóminum sólitum fuísse nóctibus sermocinári, et doctrínam in
        ténebris tradidísse: sed quia omnis sermo ejus carnálibus ténebræ sunt,
        et verbum ejus infidélibus nox est."
    lectio8-in-4-loco:
      - "Ítaque id quod a se dictum est, cum libertáte fídei et confessiónis
        vult esse loquéndum. Idcírco quæ in ténebris dicta sunt prædicári jussit
        in lúmine: ut quæ secréto áurium commíssa sunt, super tecta, id est,
        excélso loquéntium præcónio audiántur. Constánter enim Dei ingerénda
        cognítio est, et profúndum doctrínæ evangélicæ secrétum in lúmine
        prædicatiónis apostólicæ revelándum: non timéntes eos, quibus cum sit
        licéntia in córpora, tamen in ánimam jus nullum est: sed timéntes pótius
        Deum, cui perdéndæ in gehénna et ánimæ et córporis sit potéstas."
    lectio9-in-4-loco:
      - "Nolíte timére eos qui occídunt corpus. Nullus ígitur córporum nostrórum
        casus est pertimescéndus, neque ullus interiméndæ carnis admitténdus est
        dolor: quando pro natúræ suæ atque oríginis conditióne resolúta, in
        substántiam spirituális ánimæ refundátur. Et quia doctrínis tálibus
        confirmátos opórtet líberam confiténdi Dei habére constántiam, étiam
        conditiónem, qua tenerémur, adjécit: negatúrum se eum Patri in cælis,
        qui se homínibus in terra negásset: eum porro qui conféssus coram
        homínibus se fuísset, a se in cælis confiténdum: qualésque nos nóminis
        sui testes homínibus fuissémus, tali nos apud Deum Patrem testimónio
        ejus usúros."
      - "&teDeum"
    introitus:
      - "!Eccli 45:30"
      - "v. Státuit ei Dóminus testaméntum pacis, et príncipem fecit eum: ut sit
        illi sacerdótii dígnitas in ætérnum. (Allelúja, allelúja.)"
      - "!Ps 131:1."
      - "Meménto, Dómine, David: et omnis mansuetúdinis ejus."
      - "&Gloria"
      - "v. Státuit ei Dóminus testaméntum pacis, et príncipem fecit eum: ut sit
        illi sacerdótii dígnitas in ætérnum. (Allelúja, allelúja.)"
    lectio:
      - Léctio Epístolæ beáti Jacóbi Apóstoli
      - "!Jac 1:12-18."
      - "Caríssimi: Beátus vir, qui suffert tentatiónem: quóniam, cum probátus
        fúerit, accípiet corónam vitæ, quam repromísit Deus diligéntibus se.
        Nemo, cum tentátur, dicat, quóniam a Deo tentátur: Deus enim intentátor
        malórum est: ipse autem néminem tentat. Unusquísque vero tentátur a
        concupiscéntia sua abstráctus et illéctus. Deinde Concupiscéntia cum
        concéperit, parit peccátum: peccátum vero cum consummátum fúerit,
        génerat mortem. Nolíte itaque erráre, fratres mei dilectíssimi. Omne
        datum óptimum et omne donum perféctum desúrsum est, descéndens a Patre
        lúminum, apud quem non est transmutátio nec vicissitúdinis obumbrátio.
        Voluntárie enim génuit nos verbo veritátis, ut simus inítium aliquod
        creatúræ ejus."
    graduale:
      - "!Ps 88:21-23"
      - "Invéni David servum meum, óleo sancto meo unxi eum: manus enim mea
        auxiliábitur ei, et bráchium meum confortábit eum."
      - V. Nihil profíciet inimícus in eo, et fílius iniquitátis non nocébit ei.
        Allelúja, allelúja
      - "!Ps 109:4"
      - "Jurávit Dóminus, et non pœnitébit eum: Tu es sacérdos in ætérnum,
        secúndum órdinem Melchísedech. Allelúja."
    tractus:
      - "!Ps 88:21-23"
      - "Invéni David servum meum, óleo sancto meo unxi eum: manus enim mea
        auxiliábitur ei, et bráchium meum confortábit eum."
      - V. Nihil profíciet inimícus in eo, et fílius iniquitátis non nocébit ei.
      - "!Ps 20:3-4"
      - "Desidérium ánimæ ejus tribuísti ei: et voluntáte labiórum ejus non
        fraudásti eum."
      - V. Quóniam prævenísti eum in benedictiónibus dulcédinis.
      - V. Posuísti in cápite ejus corónam de lápide pretióso.
    evangelium:
      - Sequéntia ++ sancti Evangélii secúndum Lucam
      - "!Luc 14:26-33"
      - "In illo témpore: Dixit Jesus turbis: Si quis venit ad me, et non odit
        patrem suum, et matrem, et uxórem, et fílios, et fratres, et soróres,
        adhuc autem et ánimam suam, non potest meus esse discípulus. Et qui non
        bájulat crucem suam, et venit post me, non potest meus esse discípulus.
        Quis enim ex vobis volens turrim ædificáre, non prius sedens cómputat
        sumptus, qui necessárii sunt, si hábeat ad perficiéndum; ne, posteáquam
        posúerit fundaméntum, et non potúerit perfícere, omnes, qui vident,
        incípiant illúdere ei, dicéntes: Quia hic homo cœpit ædificáre, et non
        pótuit consummáre? Aut quis rex itúrus commíttere bellum advérsus álium
        regem, non sedens prius cógitat, si possit cum decem mílibus occúrrere
        ei, qui cum vigínti mílibus venit ad se? Alióquin, adhuc illo longe
        agénte, legatiónem mittens, rogat ea, quæ pacis sunt. Sic ergo omnis ex
        vobis, qui non renúntiat ómnibus, quæ póssidet, non potest meus esse
        discípulus."
    offertorium:
      - "!Ps 88:25"
      - "Véritas mea et misericórdia mea cum ipso: et in nómine meo exaltábitur
        cornu ejus. (Allelúja.)"
    secreta:
      - "Hóstias tibi, Dómine, beáti N. Mártyris tui atque Pontíficis dicátas
        méritis, benígnus assúme: et ad perpétuum nobis tríbue proveníre
        subsídium."
      - $Per Dominum
    communio:
      - "!Ps 88:36; 88:37-38"
      - "Semel jurávi in sancto meo: Semen ejus in ætérnum manébit: et sedes
        ejus sicut sol in conspéctu meo, et sicut luna perfécta in ætérnum, et
        testis in coelo fidélis. (Allelúja.)"
    postcommunio:
      - "Refécti participatióne múneris sacri, quǽsumus, Dómine, Deus noster:
        ut, cujus exséquimur cultum, intercedénte beáto N. Mártyre tuo atque
        Pontífice, sentiámus efféctum."
      - $Per Dominum
