    responsory8:
      - "R. Hic est vere Martyr, qui pro Christi nómine sánguinem suum fudit:"
      - "* Qui minas júdicum non tímuit, nec terrénæ dignitátis glóriam
        quæsívit, sed ad cæléstia regna pervénit."
      - V. Justum dedúxit Dóminus per vias rectas, et osténdit illi regnum Dei.
      - R. Qui minas júdicum non tímuit, nec terrénæ dignitátis glóriam
        quæsívit, sed ad cæléstia regna pervénit.
      - "&Gloria"
      - R. Qui minas júdicum non tímuit, nec terrénæ dignitátis glóriam
        quæsívit, sed ad cæléstia regna pervénit.
    lectio9:
      - "Sed percontári libet, quómodo paréntes et carnáliter propínquos
        præcípimur odísse, qui jubémur et inimícos dilígere? Et certe Véritas de
        uxóre dicit: Quod Deus conjúnxit, homo non séparet. Et Paulus ait: Viri,
        dilígite uxóres vestras, sicut et Christus Ecclésiam. Ecce, discípulus
        uxórem diligéndam prǽdicat, cum magíster dicat: Qui uxórem non odit, non
        potest meus esse discípulus. Numquid áliud judex núntiat, áliud præco
        clamat? An simul et odísse póssumus, et dilígere? Sed si vim præcépti
        perpéndimus, utrúmque ágere per discretiónem valémus: ut uxórem, et eos,
        qui nobis carnis cognatióne conjúncti sunt, et quos próximos nóvimus,
        diligámus; et quos adversários in via Dei pátimur, odiéndo et fugiéndo
        nesciámus."
      - "&teDeum"
