  responsory12:
    - "R. Gaudéte, justi, in Dómino, allelúja:"
    - "* Rectos decet collaudátio, allelúja, allelúja."
    - "V. Cantáte ei cánticum novum: bene psállite ei in vociferatióne."
    - R. Rectos decet collaudátio, allelúja, allelúja.
