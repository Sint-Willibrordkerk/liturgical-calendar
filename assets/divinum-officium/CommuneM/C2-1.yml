    - "@Commune/C3:Lectio8"
  responsory11:
    - "R. Glória et honóre coronásti eum, Dómine, et constituísti eum super
      ópera mánuum tuárum:"
    - "* Ómnia subjecísti sub pédibus ejus."
    - V. Quóniam prævenísti eum in benedictiónibus dulcédinis, posuísti in
      cápite ejus corónam de lápide pretióso.
    - R. Ómnia subjecísti sub pédibus ejus.
  lectio12:
    - "@Commune/C3:Lectio9:s/\\&teDeum .*//s"
  responsory12:
    - "R. Beátus vir, qui suffert tentatiónem: quóniam cum probátus fúerit,
      accípiet corónam vitæ,"
    - "* Quam repromísit Deus diligéntibus se."
    - V. Hic accípiet benedictiónem a Dómino, et misericórdiam a Deo salutári
      suo.
    - R. Quam repromísit Deus diligéntibus se.
    - "&Gloria"
    - R. Quam repromísit Deus diligéntibus se.
  mm-capitulum:
