lectio1:
  - De Sermóne sancti Joánnis Damascéni
  - "!Oratio II in Dormit. Deiparæ, n. 15"
  - "Nos, qui Deum cólimus, Deum, inquam, non ex nihilo prodúctum, sed
    sempitérnum ex sempitérno, omníque causa, ratióne et cogitatióne tum
    témporis tum natúræ superiórem; Dei Matrem honorámus et venerámur: non quod
    divinitátem ejus ortum ex ea traxísse statuámus (Dei síquidem generátio
    témpore caret, eamdémque cum Patre æternitátem habet), verum secúndam
    nativitátem confitémur, per voluntáriam carnis susceptiónem, cujus causam et
    nóvimus, et láudibus efférimus. Propter nos enim, ac nostræ salútis causa
    incarnátur, qui sine inítio incorpóreus est, ut símili per símile salútem
    áfferat: atque assúmpta sine viríli compléxu carne, ex hac sacra Vírgine
    páritur, ipse totus Deus manens, et totus homo factus: ipse totus Deus una
    cum carne sua, totúsque homo cum sua divinitáte. Ad hunc modum Dei Matrem
    Vírginem istam agnóscimus, ejúsque dormitiónem celebrámus."
rubrica-1617/lectio1:
  - "@Sancti/08-18bmv:Lectio4o"
lectio2:
  - "Hanc Dei incarnáti Matrem nos, qui eo locupletáti sumus,ut Christi pópulus
    et simus et dicámur, sacris hódie cánticis prædicémus; hanc noctúrnis
    statiónibus honorémus; hanc ánimi et córporis mundítia oblectémus: hanc,
    inquam, vere puram, atque ómnibus post Deum puritáte præstántem. Solent enim
    simília simílibus exsultáre. Hanc misericórdia et commiseratióne erga egénos
    colámus et observémus. Si enim Deus nulla re æque cólitur, atque
    misericórdia: quis contradícet Matrem quoque non lætári simílibus?"
rubrica-1617/lectio2:
  - "@Sancti/08-18bmv:Lectio5o"
lectio3:
  - "Hæc ineffabilem divínæ in nos dilectiónis abyssum pu-blicávit. Per hanc
    diutúrnum illud bellum, quod cum Creatóre gerebátur, profligátum fuit; per
    hanc nobis cum eo reconciliatio sancíta, paxque et grátia donáta est: unde
    Angeli una cum homínibus choros ágitant, et qui prius contémptui erámus, Dei
    fílii effécti sumus. Ex ea vite uvam collégimus: ex ea immortalitátis germen
    excérpsimus. Hæc nobis ómnia bona conciliávit. In hac Deus homo factus est,
    et homo Deus. Et quid hoc admirabílius? quid beátius?"
rubrica-1617/lectio3:
  - "@Sancti/08-18bmv:Lectio6o"
