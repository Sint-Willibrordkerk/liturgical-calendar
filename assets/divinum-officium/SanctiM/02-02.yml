ant-matutinum-3n:
  - "Adórna * thálamum tuum, Sion, et súspice Regem Christum: † quem Virgo post
    partum, quem génuit, adorávit."
lectio1:
  - "@Sancti/02-02:Lectio1"
lectio2:
  - "@Sancti/02-02:Lectio2:s/-5/-4/ s/ Omne.*//s"
lectio3:
  - "@Sancti/02-02:Lectio2:2-7 s/1-/4-/ s/1 .*Omne/4 Omne/s"
lectio4:
  - "@Sancti/02-02:Lectio3"
responsory4:
  - "R. Suscépimus Deus misericórdiam tuam in médio templi tui: † secúndum nomen
    tuum, Deus, sic et laus tua in fines terræ:"
  - "* Justítia plena est déxtera tua."
  - "V. Lætétur mons Sion, et exsúltent fíliæ Judæ: propter judícia tua, Dómine."
  - R. Justítia plena est déxtera tua.
lectio5:
  - "@Sancti/02-02:Lectio4:s/Tunc .*//s"
responsory5:
  - "@Sancti/02-02:Responsory4"
lectio6:
  - "@Sancti/02-02:Lectio4:s/.* Tunc /Tunc /s s/$/~/"
  - "@Sancti/02-02:Lectio5:s/Dictum .*//s"
responsory6:
  - "@Sancti/02-02:Responsory5"
lectio7:
  - "@Sancti/02-02:Lectio5:s/.* Dictum /Dictum /s s/$/~/"
  - "@Sancti/02-02:Lectio6:s/Dénique, .*//s"
responsory7:
  - "@Sancti/02-02:Responsory6"
lectio8:
  - "@Sancti/02-02:Lectio6:s/.* Dénique, /Dénique, /s"
responsory8:
  - "R. Nunc dimíttis servum tuum, Dómine, secúndum verbum tuum in pace:"
  - "* Quia vidérunt óculi mei salutáre tuum."
  - V. Lumen ad revelatiónem Géntium, et glóriam plebis tuæ Israël.
  - R. Quia vidérunt óculi mei salutáre tuum.
lectio9:
  - "@Sancti/02-02:Lectio7:s/Virgo .*//s"
responsory9:
  - "@Sancti/02-02:Responsory7"
lectio10:
