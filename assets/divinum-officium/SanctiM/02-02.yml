  - "@Sancti/02-02:Lectio8:s/Et ipse .*//s"
responsory10:
  - "@Sancti/02-02:Responsory8"
lectio11:
  - "@Sancti/02-02:Lectio8:s/.* Et ipse /Et ipse /s s/$/~/"
  - "@Sancti/02-02:Lectio9:s/Vides .*//s"
responsory11:
  - "R. Hódie María Virgo púerum offert in templo, † quem Símeon senex accépit
    in mánibus:"
  - "* Et Anna vídua Christum agnóvit advenísse in terris."
  - V. Cum indúcerent púerum Jesum paréntes ejus in templum, † accépit eum
    Símeon in ulnas suas.
  - R. Et Anna vídua Christum agnóvit advenísse in terris.
lectio12:
  - "@Sancti/02-02:Lectio9:s/.* Vides /Vides /s"
responsory12:
  - "@Sancti/03-25:Responsory8"
