responsory4:
  - "R. Descéndit de cælis Deus verus a Patre génitus, † introívit in úterum
    Vírginis, nobis ut apparéret visíbilis, indútus carne humána protoparénte
    édita:"
  - "* Et exívit per portam clausam † Deus et homo, Lux et vita, cónditor mundi."
  - V. Tamquam sponsus † Dóminus procédens de thálamo suo.
  - R. Et exívit per portam clausam † Deus et homo, Lux et vita, cónditor mundi.
