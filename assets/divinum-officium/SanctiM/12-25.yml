responsory8:
  - "R. Angelus ad pastóres ait: Annúntio vobis gáudium magnum: quod erit omni
    pópulo: † quia natus est vobis Salvátor,"
  - "* Qui est Christus Dóminus, in civitáte David."
  - V. Inveniétis infántem pannis involútum et pósitum in præsépio.
  - R. Qui est Christus Dóminus, in civitáte David.
lectio9:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 1:1-6"
  - Liber generatiónis Jesu Christi, fílii David, fílii Abraham. Abraham génuit
    Isaac, Isaac autem génuit Jacob. Et réliqua.
  - _
  - Homilía sancti Hierónymi Presbýteri
  - "!Lib. 1 Comment. in Matth. v. 1"
  - "In Isaía légimus: Generatiónem ejus quis enarrábit? Non ergo putémus
    Evangelístam Prophétæ esse contrárium, ut quod ille impossíbile dixit
    effátu, hic narráre incípiat: quia ibi de generatióne Divinitátis, hic de
    incarnatióne est dictum. A carnálibus autem cœpit, ut per hóminem, Deum
    díscere incipiámus. Fílii David, fílii Abraham. Ordo præpósterus, sed
    necessário commutátus. Si enim primum posuísset Abraham et póstea David,
    rursus ei repeténdus fúerat Abraham, ut generatiónis séries texerétur."
