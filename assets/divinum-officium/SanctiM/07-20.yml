officium:
  - Ss. Hieronymi Æmilianii, Josephi Calasanctii et Joannis Baptistæ de la Salle
    Confessorum
rank:
  - ""
  - Simplex
  - "1.1"
versum-1:
  - "@Commune/C3"
ant-1:
  - O viri * misericordiæ, quorum non accepérunt obliviónem justítiæ, semen
    eórum et fílii propter eos in ætérnum cum glória pérmanent.
oratio:
  - Deus, misericordiárum pater, qui Ecclésiæ tuæ ad sancte fovéndum juventútem
    beátos Hierónymum, Joséphum et Joánnem Baptístam singulári caritáte
    providísti concéde nobis eórum méritis; ut spíritum adoptiónis, quo fílii
    tui nominámur et sumus, fidéliter custodiámus.
  - $Per Dominum
versum-2:
  - "@Commune/C3"
ant-2:
  - "Amen dico vobis: * quod uni ex mínimis meis fecístis, mihi fecístis:
    veníte, benedícti Patris mei, posidéte parátum vobis regnum ab inítio
    sǽculi."
