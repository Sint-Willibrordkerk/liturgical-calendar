responsory8:
  - R. Míchaël et Angeli ejus pugnábant cum diábolo;
  - "* Et ille hostis antíquus victus est ab eis."
  - "V. Factum est proélium magnum in cælo: † Míchaël et Angeli ejus
    præliabántur cum dracóne."
  - R. Et ille hostis antíquus victus est ab eis.
