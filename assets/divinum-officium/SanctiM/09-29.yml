antmatutinumm:
  - Sancte Míchaël Archángele, defénde nos in proélio, * ut non pereámus in
    treméndo judício, allelúja.;;89
  - Stetit Angelus juxta aram templi, * habens thuríbulum áureum in manu sua.;;98
  - "Benedícite Dóminum, omnes Angeli ejus: * benedícite, minístri ejus, qui
    fácitis voluntátem ejus: † benedícite Dóminum.;;102"
ant-matutinum-3n:
  - "Míchaël, Gábriel, * Chérubim et Séraphim, qui non cessant clamáre quotídie,
    dicéntes: † Dignus es, Dómine, accípere glóriam, allelúja."
