responsory4:
  - "R. Te sanctum Dóminum in excélsis laudant omnes Angeli, dicéntes:"
  - "* Te decet laus et honor, Dómine."
  - V. Chérubim quoque et Séraphim sanctus proclámant, † et omnis cǽlicus ordo
    dicens.
  - R. Te decet laus et honor, Dómine.
