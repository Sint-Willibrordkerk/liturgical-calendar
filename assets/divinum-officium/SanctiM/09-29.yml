responsory11:
  - R. Nunc facta est salus et virtus et regnum Deo nostro et potéstas Christi
    ejus,
  - "* Quia projéctus est accusátor fratrum nostrórum, † qui accusábat illos
    ante conspéctum Dei nostri die ac nocte, † allelúja, allelúja."
  - V. Proptérea lætámini cæli, et qui habitátis in eis.
  - R. Quia projéctus est accusátor fratrum nostrórum, † qui accusábat illos
    ante conspéctum Dei nostri die ac nocte, † allelúja, allelúja.
lectio12:
  - "@Sancti/09-29:Lectio9"
responsory12:
  - "R. Fidélis sermo, et omni acceptióne dignus: † Míchaël Archángelus qui
    pugnávit cum diábolo:"
  - "* Grátia Dei ille victor in cælis éxstitit et ille hostis antíquus pátuit
    ruínæ magnæ."
  - V. Gaudent Angeli lætántur Archángeli de Michaéle Dei núntio.
  - R. Grátia Dei ille victor in cælis éxstitit et ille hostis antíquus pátuit
    ruínæ magnæ.
