lectio10:
  - "Quod autem intérrogat Dóminus, et, illa peténte, respóndit: Quid vis? non
    venit de ignorántia: sed ex ejus persóna dícitur, qui flagellándus et
    crucifigéndus erat. Quómodo et in hæmorrhoísa: Quis me tétigit? Et de
    Lázaro: Ubi posuístis eum? In véteri quoque testaménto: Adam, ubi es? Et:
    Descéndens vidébo si juxta clamórem, qui venit ad me, perfíciant: sin autem
    non est, ut sciam. Póstulat autem mater filiórum Zebedæi erróre mulíebri et
    pietátis afféctu, nésciens quid péteret. Nec mirum si ista arguátur
    imperétiæ, cum de Petro dicátur, quando tria vult fácere tabernácula,
    nésciens quid díceret."
