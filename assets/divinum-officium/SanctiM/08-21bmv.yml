lectio1:
  - "@CommuneM/C10:Lectio M083:s/ Quidni.*//"
lectio2:
  - "Ac si manifestius dicant: Quanta est hæc, aut, unde ei ascendenti utique de
    deserto affluentia tanta deliciarum? Nec enim pares inveniuntur deliciae vel
    in nobis, quos in civitate Dómini laetificat fluminis impetus, qui a vultu
    gloriae, voluptatis torrente potamur. Quae est ista, quae de sub sole, ubi
    nihil est nisi labor et dolor et afflictio spiritus, ascendit deliciis
    spiritualibus affluens?~"
  - "@CommuneM/C10:Lectio M083:s/.* (?=Quidni)//s"
lectio3:
  - "@CommuneM/C10:Lectio M084:3 s/ / ígitur /"
