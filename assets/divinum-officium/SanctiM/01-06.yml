responsory8:
  - "R. Interrogábat Magos Heródes: Quod signum vidístis super natum Regem? †
    Stellam vídimus fulgéntem, cujus splendor illúminat mundum:"
  - "* Et nos cognóvimus et vénimus adoráre Dóminum."
  - V. Magi véniunt ab Oriénte inquiréntes fáciem Dómini et dicéntes.
  - R. Et nos cognóvimus et vénimus adoráre Dóminum.
