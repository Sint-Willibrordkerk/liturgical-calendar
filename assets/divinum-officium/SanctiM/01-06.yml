responsory11:
  - "R. Venit lumen tuum, Jerúsalem, † et glória Dómini super te orta est :"
  - "* Et ambulábunt gentes in lúmine tuo, et reges in splendóre ortus tui."
  - V. Fílii tui de longe vénient et fíliæ tuæ de látere surgent.
  - R. Et ambulábunt gentes in lúmine tuo, et reges in splendóre ortus tui.
lectio12:
  - "@Sancti/01-06:Lectio9"
responsory12:
  - "R. Hic est dies præclárus in quo Salvátor mundi appáruit, † quem prophétæ
    predixérunt, Angeli annuntiavérunt:"
  - "* Cujus stellam Magi vidéntes gavísi sunt, et múnera ei obtulérunt."
  - "V. Dies sanctificátus illúxit nobis: † veníte gentes et adoráte Dóminum."
  - R. Cujus stellam Magi vidéntes gavísi sunt, et múnera ei obtulérunt.
rv1:
  - "R. Illumináre, illumináre Jerúsalem, quia venit lux tua: * Et glória Dómini
    super te orta est."
  - "V. Et ambulábunt Gentes in lúmine tuo, et reges in splendóre ortus tui:"
  - R. Et glória Dómini super te orta est.
