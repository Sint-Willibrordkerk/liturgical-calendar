antmatutinumm:
  - Suscépimus, * Deus, misericórdiam tuam, † in médio templi tui.;;47
  - Homo natus est * in ea, et ipse fundávit eam Altíssimus.;;86
  - Notum * fecit Dóminus allelúja; † salutáre suum, allelúja.;;97
  - "Tria sunt * múnera quæ obtulérunt Magi Dómino, aurum, thus et myrrham: †
    Fílio Dei, Regi magno, allelúja.;;98"
