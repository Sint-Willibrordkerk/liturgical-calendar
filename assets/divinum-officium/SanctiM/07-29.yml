rubrica-cisterciensis/rule:
  - "vide C6b:"
  - 3 lectiones
rubrica-cisterciensis/lectio2:
  - "Martha, Christi Dómini hospítio clara, post ejus ascénsum in cœlum, cum
    germánis et multis Christiánis comprehénsa a Judæis, in navem sine velo, ac
    remígio impósita, Deo gubernánte, Massíliam appéllit. Eo miráculo finítimæ
    gentes in Christum credidérunt: Lazarúsque Massiliénsium, et Maximínus
    Aquénsium Epíscopus creátur. Magdaléna vero oratióni assuéta, partem
    óptimam, quam elégerat, non relínquens, in vastam spelúncam se cóndidit."
rubrica-cisterciensis/lectio3:
  - Martha autem, mirábili vitæ sanctitáte, Massiliénsium ánimos in sui amórem
    convértens, in locum remótum a viris se recépit, ubi cum áliquot fœminis pie
    vixit, ac demum, morte sua multo ante praedícta, miráculis clara migrávit ad
    Dóminum, quarto Kaléndas Augústi. Cujus corpus apud Taráscum magnam habet
    veneratiónem.
