antmatutinumm:
  - "Nazarǽus * vocábitur puer iste: † vinum et síceram non bibet, et omne
    immúndum non manducábit ex útero matris suæ.;;63"
  - "Erit enim * magnus coram Dómino: † nam et manus ejus cum ipso est.;;64"
  - Ipse præíbit * ante illum in spíritu et virtúte Elíæ † paráre Dómino plebem
    perféctam.;;91
rubrica-cisterciensis/antmatutinumm:
  - Joánnes * est nomen ejus, vinum et síceram non bibet, et multi in nativitáte
    ejus gaudébunt.;;63
  - Ipse præíbit * ante illum in spíritu et virtúte Elíæ paráre Dómino plebem
    perféctam.;;64
  - "Nazarǽus * vocábitur puer iste: vinum et síceram non bibet, et omne
    immúndum non manducábit ex útero matris suæ.;;91"
ant-matutinum-3n:
  - "Descéndit * angelus Dómini ad Zacharíam, dicens: † Accípe púerum in
    senectúte tua, et habébit nomen Joánnes Baptísta."
rubrica-cisterciensis/ant-matutinum-3n:
  - Pro eo * quod non credidísti verbis meis, eris tacens, et non póteris loqui
    usque in diem nativitátis ejus.
