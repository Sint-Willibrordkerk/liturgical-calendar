responsory11_:
  - "R. Ipse præíbit ante illum in spíritu et virtúte Elíæ:"
  - "* Ut convértat corda patrum in fílios, et incrédulos ad prudéntiam
    justórum, † paráre Dómino plebem perféctam."
  - V. Erit enim magnus coram Dómino, et Spíritu Sancto replébitur.
  - R. Ut convértat corda patrum in fílios, et incrédulos ad prudéntiam
    justórum, † paráre Dómino plebem perféctam.
