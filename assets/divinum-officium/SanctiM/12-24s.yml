responsory12:
  - "R. Nascétur nobis párvulus, et vocábitur Deus, Fortis: † Ipse sedébit super
    thronum David patris sui, et imperábit:"
  - "* Cujus potéstas super húmerum ejus."
  - V. Multiplicábitur ejus impérium, † et pacis non erit finis.
