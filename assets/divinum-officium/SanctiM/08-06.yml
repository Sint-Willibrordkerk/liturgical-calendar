responsory4:
  - R. Assúmpsit Jesus Petrum, et Jacóbum, et Joánnem fratrem ejus;
  - "* In montem excélsum seórsum ascéndens, ibi se transfigúrans, † suæ glóriæ
    claritátem eis osténdit."
  - V. Ne vidéntes ejus passiónem turbaréntur, sed fortióri soliditáte
    firmaréntur.
  - R. In montem excélsum seórsum ascéndens, ibi se transfigúrans, † suæ glóriæ
    claritátem eis osténdit.
