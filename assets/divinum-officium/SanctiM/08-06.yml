antmatutinumm:
  - "Ecce, * nubes lúcida obumbrávit eos: patérna vos audíta est: † Hic est
    Fílius meus.;;45"
  - Petrus * et qui cum illo præséntes erant, Christo lætificáti, † vidére
    glóriam Dei.;;46
  - "Respóndens Petrus, * ait ad Jesum: † Dómine si vis faciámus hic tria
    tabernácula.;;47"
ant-matutinum-3n:
  - Hódie ad patris vocem, transfiguráto Dómino, Moyses et Elías affluérunt
    spléndidi, † excéssum ejus, quem completúrus erat, loquéntes.
