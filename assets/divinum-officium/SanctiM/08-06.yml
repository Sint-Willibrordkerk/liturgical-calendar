responsory8:
  - R. Assúmptis hódie Dóminus Jesus tribus discípulis, montem, ut oráret,
    súbiit excélsum solus, † et orans coram eis transfigurátus est, faciésque
    ejus ut sol resplénduit
  - "* Ac vestiménta ejus ut nix facta sunt cándida."
  - V. Ut autem testimónium habéret a lege et prophétis, † hinc inde Móyses et
    Elías visi sunt in majestáte.
  - R. Ac vestiménta ejus ut nix facta sunt cándida.
