responsory11:
  - "R. Descendéntibus illis de monte præcépit Jesus dicens: † Némini dixéritis
    visiónem quam vidístis"
  - "* Donec Fílius hóminis a mórtuis resúrgat."
  - V. Ne mors ejus áliquo modo impedirétur, † si hæc vísio in pópulo statim
    divularétur.
  - R. Donec Fílius hóminis a mórtuis resúrgat.
lectio12:
  - "@Sancti/08-06:Lectio9"
responsory12:
  - "R. Dum orásset Dóminus, facta est spécies vultus ejus áltera, † et vestítus
    ejus albus ac refúlgens:"
  - "* Et duo viri loquebántur cum illo, † Móyses et Elías visi in majestáte."
  - V. Dicébant autem excéssum ejus, quem completúrus erat in Jerúsalem.
  - R. Et duo viri loquebántur cum illo, † Móyses et Elías visi in majestáte.
