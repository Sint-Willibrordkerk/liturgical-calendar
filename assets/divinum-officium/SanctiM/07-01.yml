responsory8:
  - "R. Gratificávit † nos Deus in dilécto Fílio suo:"
  - "* In quo habémus redemptiónem per Sánguinem ejus in remissiónem peccatórum."
  - V. Ecce venit plenitúdo témporis, in quo misit Deus Fílium suum in terras.
  - R. In quo habémus redemptiónem per Sánguinem ejus in remissiónem peccatórum.
