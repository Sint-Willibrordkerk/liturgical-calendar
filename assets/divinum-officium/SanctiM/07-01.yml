responsory12:
  - R. Ecce † vox Sánguinis Fílii tui, fratris nostri, de terra clamat ad te,
    Dómine.
  - "* Benedícta terra, quæ apéruit os suum, et suscépit Sánguinem Redemptóris."
  - V. Hæc est Sánguinis aspérsio, mélius loquens quam Abel.
  - R. Benedícta terra, quæ apéruit os suum, et suscépit Sánguinem Redemptóris.
