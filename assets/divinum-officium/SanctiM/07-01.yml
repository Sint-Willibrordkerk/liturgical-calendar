lectio7:
  - "@Sancti/07-01:Lectio5:s/.* (?=Si enim)// s/ Latus.*// s/$/~/"
  - "Mortuo enim, ait, Jesu, et adhuc in cruce pendente, approximat miles, latus
    lancea percussit, et exinde aqua fluxit et Sanguis : unum baptismatis
    symbolum, aliud sacramenti. Ideo non ait: Exiit Sanguis et aqua; sed exiit
    aqua primum et Sanguis, quia primum baptismate diluimur et postea mysterio
    dedicamur.~"
