responsory4:
  - "R. Benedictiónes patris tui confortátæ sunt benedictiónibus patrum ejus:"
  - "* Donec veníret desidérium cóllium æternórum."
  - V. Fiant in cápite Joseph, et in vértice Nazaraéi inter fratres suos.
  - R. Donec veníret desidérium cóllium æternórum.
lectio5:
  - "@Sancti/03-19:Lectio4"
responsory5:
  - "R. Angelus Dómini appáruit Joseph, dicens: † Joseph, fili David, noli
    timére accípere Maríam cónjugem tuam"
  - "* Quod enim in ea natum est de Spíritu Sancto est."
  - V. Páriet autem Fílium et vocábis nomen ejus Jesus.
  - R. Quod enim in ea natum est de Spíritu Sancto est.
