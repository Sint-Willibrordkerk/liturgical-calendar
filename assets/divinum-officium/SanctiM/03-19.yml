responsory9:
  - "R. Ibant paréntes Jesu per omnes annos in Jerúsalem in die solémni Paschæ:
    † consumptísque diébus cum redírent, remánsit puer Jesus in Jerúsalem,"
  - "* Et non cognovérunt paréntes ejus."
  - V. Existimántes autem illum esse in comitátu, † requirébant eum inter
    cognátos et notos.
  - R. Et non cognovérunt paréntes ejus.
