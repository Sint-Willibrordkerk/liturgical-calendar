lectio12:
  - "Joseph, fili David, noli timére accípere Maríam uxórem tuam. Jam et supra
    díximus sponsas uxóres appelláre: quod plénius liber advérsus Helvídium
    docet. Et blandiéntis Angelus lóquitur, ut justítiam siléntii comprobáret.
    Simúlque notándum, quod Joseph fílius esse dicátur David, ut María quoque de
    stirpe David monstrarétur."
responsory12:
  - R. Fidélis servus et prudens, quem constítuit Dóminus super famíliam suam
  - "* Amen dico vobis, quóniam super ómnia bona sua constítuet eum."
  - V. Qui custos est Dómini sui, glorificátur.
  - R. Amen dico vobis, quóniam super ómnia bona sua constítuet eum.
