antmatutinumm:
  - Induxérunt * púerum Jesum paréntes ejus † ut fácerent secúndum consuetúdinem
    legis pro eo.;;23
  - Et ut perfecérunt * ómnia secúndum legem Dómini, † revérsi sunt in Galiláeam
    in civitátem suam Názareth.;;96
  - "Mirabántur omnes * in verbis grátiæ, quæ procedébant de ore ipsíus, et
    dicébant: † Nonne hic est fílius Joseph?;;97"
ant-matutinum-3n:
  - "Invénit Philíppus * Nathánæl, et dicit ei: † Quem scripsit Móyses in Lege,
    et Prophétæ, invénimus Jesum, fílium Joseph, a Názareth."
