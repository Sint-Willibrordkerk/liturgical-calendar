references: "@Sancti/07-31"
name:
  - Ignátii
rubrica-cisterciensis/lectio1:
  - "@CommuneCist/C5:Lectio1S2"
rubrica-cisterciensis/lectio2:
  - Ignátius, Loyólæ in Cantábria natus, in propugnatióne Pampelonénsi, accépto
    vúlnere, gráviter decúmbens, ex fortúita piórum librórum lectióne, ad
    Christi Sanctorúmque sectánda vestígia mirabíliter exársit. Ad montem
    Serrátum proféctus, ante Aram beatíssimæ Vírginis suspénsis armis, noctem
    éxcubans, sacræ milítiæ tyrocínium pósuit. Inde Manrésam secédens, præcláris
    ibi fuit illustratiónibus recreátus.
rubrica-cisterciensis/responsory2:
  - "@CommuneCist/C5:Responsory5"
rubrica-cisterciensis/lectio3:
  - Lutétiae Parisiórum, in monte Mártyrum prima Ordinis fundaménta jecit.
    Ethnicæ superstitióni, hæresíque bellum indíxit, apértis ubíque ad pietátem
    et lítteras gymnasiis. Templórum nitor, Catechísmi tradítio, conciónum ac
    Sacramentórum frequéntia ab ipso increméntum accepérunt. Dæmones fugávit,
    vultu radiánti conspéctus est, ac ætátis annum agens sexagésimum quintum, ad
    Dómini sui ampléxum migrávit. Hunc Gregórius decimus quintus, méritis et
    miráculis illústrem, fastis Sanctórum adscrípsit.
rubrica-cisterciensis/responsory3:
  - "@CommuneCist/C5:Responsory12"
