rubrica-barroux/responsory-vespera-1:
  - "@Sancti/03-25:Responsory8:1-2"
  - "V. Gabriélem Archángelum scimus divínitus te esse affátum: úterum tuum de
    Spíritu Sancto crédimus impregnátum: erubéscat Judǽus ínfelix, qui dicit
    Christum ex Joseph sémine esse natum."
  - "@Sancti/03-25:Responsory8:4"
