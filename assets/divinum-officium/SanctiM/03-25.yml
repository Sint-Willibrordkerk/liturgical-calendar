responsory4:
  - "R. Quæ cum audísset, turbáta est in sermone ejus: † et cogitábat, qualis
    esset ista salutátio"
  - "* Et ait Angelus ei."
  - V. Ne tímeas Maria, invenísti enim grátiam apud Deum.
  - R. Et ait Angelus ei.
