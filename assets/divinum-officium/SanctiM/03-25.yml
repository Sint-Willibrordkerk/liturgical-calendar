responsory7:
  - "R. Dixit autem María ad Angelum: † Quómodo fiet istud, quóniam virum non
    cognósco?"
  - "* Et respóndens Angelus dixit ei."
  - V. Spíritus Sanctus supervéniet in te, et virtus Altíssimi obumbrábit tibi.
  - R. Et respóndens Angelus dixit ei.
lectio8:
  - Verax namque misericórdia Dei, cum ad reparándum humánum genus ineffabíliter
    ei multa suppéterent, hanc potíssimum consuléndi viam elégit, qua ad
    destruéndum opus diáboli non virtúte uterétur poténtiæ, sed ratióne
    justítiæ. Nam supérbia hostis antíqui non inmérito sibi in omnes hómines jus
    tyránnicum vindicábat, nec indébito dominátu premébat, quos a mandáto Dei
    spontáneos in obséquium suæ voluntátis illéxerat. Non ítaque juste amítteret
    originálem humáni géneris servitútem, nisi de eo quod subégerat vincerétur.
responsory8:
  - "R. Dixit autem María: Ecce ancílla Dómini:"
  - "* Fiat mihi secúndum verbum tuum."
  - V. Benedícta tu in muliéribus, et benedíctus fructus ventris tui.
  - R. Fiat mihi secúndum verbum tuum.
lectio9:
  - "@Sancti/03-25:Lectio7"
responsory9:
  - R. Beátam me dicent omnes generatiónes,
  - "* Quia fecit mihi Dóminus magna qui potens est, † et sanctum nomen ejus."
  - "V. Magníficat ánima mea Dóminum: † et exsultávit spíritus meus in Deo,
    salutári meo."
  - R. Quia fecit mihi Dóminus magna qui potens est, † et sanctum nomen ejus.
lectio10:
  - "Et bene utrúmque pósuit Scriptúra, ut et desponsáta esset, et virgo: virgo,
    ut expers virílis consórtii viderétur: desponsáta, ne temerátæ virginitátis
    adurerétur infámia, cujus gravis alvus corruptélæ viderétur insigne
    præférre. Máluit autem Dóminus áliquos de suo ortu quam de matris pudóre
    dubitáre. Sciébat enim téneram esse vírginis verecúndiam, et lúbricam famam
    pudóris: nec putávit ortus sui fidem matris injúriis adstruéndam."
