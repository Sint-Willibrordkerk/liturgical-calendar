rank:
  - S. Mariæ Bernardæ Soubirous, Vírginis
  - Simplex
  - "1.1"
  - "@C6"
oratio:
  - "Humílium, Deus, protéctor et amátor, qui fámulam tuam Maríam Bernárdam
    Immaculátæ Vírginís Maríæ apparitióne et allóquio recreásti: præsta,
    quǽsumus; ut, per símplices fídei sémitas, ad tuam in cœlis visiónem
    perveníre mereámur."
  - $Per Dominum
ant-2:
  - Osténdit mihi María * thesáuros incomparábiles, quos mihi dáturam in cælis
    repromísit.
