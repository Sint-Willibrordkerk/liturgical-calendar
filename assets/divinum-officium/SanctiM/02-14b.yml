ant-laudes:
  - Sapiéntiam * sanctórum narrent pópuli, et laudes eórum núntiet Ecclésia.
  - Dabo sanctis meis * locum nominátum in regno Patris mei, dicit Dóminus.
  - "Beáti pacífici, * beáti mundo corde: quóniam ipsi Deum vidébunt."
  - "Sacerdótes Dei, benedícite Dóminum: servi Dómini, hymnum dícite Deo."
  - "Nomen sempitérnum * dabo sanctis meis, dicit Dóminus: gáudium et lætítiam
    obtinébunt in ætérnum."
capitulum-laudes:
  - "!Sir 44:10-11"
  - v. Illi viri misericórdiæ sunt, quorum pietátes non defuérunt. Cum sémine
    eórum pérmanent bona.
  - $Deo gratias
