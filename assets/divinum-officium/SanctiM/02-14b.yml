  - "@Commune/C3:Versum 1"
capitulum-sexta:
  - "!Sir 44:12"
  - v. Heréditas sancta nepótes eórum, et in testaméntis stetit semen eórum.
  - $Deo gratias
responsory-sextam:
  - "@Commune/C3:Nocturn 2 Versum"
capitulum-nona:
  - "!Sir 49:14"
  - v. In diébus suis ædificavérunt domum, et exaltavérunt templum sanctum
    Dómino, parátum in glóriam sempitérnam.
  - $Deo gratias
