ant-matutinum-3n:
  - Hodie concepta est beata virgo Maria ex progenie David, * per quam salus
    mundi credentibus apparuit.
lectio1:
  - "@Sancti/12-08o::s/11.*//s s/-13/-11/"
responsory1:
  - R. Hodie concepta est beata virgo Maria ex progenie David.
  - "* Per quam salus mundi credentibus apparuit, cujus vita gloriosa lucem
    dedit sæculo."
  - V. Conceptionem beatæ Mariæ virginis cum gaudio celebremus.
  - R. Per quam salus mundi credentibus apparuit, cujus vita gloriosa lucem
    dedit sæculo.
lectio2:
  - "@Sancti/12-08o:Lectio1:s/5-13/11-15/ s/5 .*11/11/s~"
  - "@Sancti/12-08o:Lectio2:2-3"
responsory2:
  - "R. Beatissimæ virginis Mariæ Conceptionem devotissime celebremus:"
  - "* Ut ipsa pro nobis intercedat ad Dominum Jesum Christum."
  - V. Cum jucunditate Conceptionem beatæ Mariæ virginis devotissime celebremus.
  - R. Ut ipsa pro nobis intercedat ad Dominum Jesum Christum.
lectio3:
  - "@Sancti/12-08o:Lectio2:s/14-/16-/ s/14 .*16/16/s"
responsory3:
  - R. Gloriosæ virginis Mariæ Conceptionem dignissimam recolamus,
  - "* Cujus Dominus humilitatem respexit, quæ Angelo nuntiante concepit
    Salvatorem mundi."
  - V. Beatissimæ virginis Mariæ Conceptionem devotissime celebremus.
  - R. Cujus Dominus humilitatem respexit, quæ Angelo nuntiante concepit
    Salvatorem mundi.
lectio4:
  - "@Sancti/12-08o:Lectio3"
responsory4:
  - "R. Regali ex progenie Maria exorta refulget:"
  - "* Cujus precibus nos adjuvari mente et spiritu devotissime poscimus."
  - V. Corde et animo Christo canamus gloriam, in hac sacra solemnitate præcelsæ
    genitricis suæ.
  - R. Cujus precibus nos adjuvari mente et spiritu devotissime poscimus.
lectio5:
  - "@Sancti/12-08o:Lectio4:s/Primus .*//s"
responsory5:
  - R. Conceptio gloriosæ virginis Mariæ ex femine Abrahæ, ortæ de tribu Juda,
    clara ex stirpe David,
  - "* Cujus vita inclyta cunctas illustrat Ecclesias."
  - V. Hodie concepta est beata virgo Maria ex progenie David.
  - R. Cujus vita inclyta cunctas illustrat Ecclesias.
responsory6:
  - R. Cum jucunditate Conceptionem beatæ Mariæ celebremus.
  - "* Ut ipsa pro nobis intercedat ad Dominum Jesum Christum."
  - V. Corde et animo Christo canamus gloriam, in hac sacra solemnitate præcelsæ
    genitricis Dei Mariæ.
  - R. Ut ipsa pro nobis intercedat ad Dominum Jesum Christum.
lectio7:
  - "@Sancti/12-08o:Lectio5:s/.* Corde/Corde/s"
responsory7:
  - "R. Conceptio tua Dei genitrix virgo, gaudium annuntiavit universo mundo:"
  - "* Ex te enim ortus est sol justitiæ, Christus Deus noster: Qui solvens
    maledictionem, dedit benedictionem: et confundens mortem, donavit nobis
    vitam sempiternam."
  - V. Benedicta tu in mulieribus, et benedictus fructus ventris tui.
  - "R. Ex te enim ortus est sol justitiæ, Christus Deus noster: Qui solvens
    maledictionem, dedit benedictionem: et confundens mortem, donavit nobis
    vitam sempiternam."
lectio8:
  - "@Sancti/12-08o:Lectio6"
responsory8:
  - R. Corde et animo Christo canamus gloriam, in hac sacra solemnitate præcelsæ
    genitricis Dei Virginis Mariæ,
  - "* Ut ipsa intercedat pro nobis ad Dominum."
  - V. Cum jucunditate, Conceptionem sanctæ Mariæ solembiter celebremus.
  - R. Ut ipsa intercedat pro nobis ad Dominum.
lectio9:
  - "@Sancti/09-13bmv:Lectio7:s/Nam illa .*//s"
responsory9:
  - "@Sancti/07-02:Responsory7"
lectio10:
  - "@Sancti/09-13bmv:Lectio7:s/.* Nam illa/Nam illa/s s/$/~/"
  - "@Sancti/09-13bmv:Lectio8:s/Neque .*//s"
responsory10:
  - "@Sancti/12-08:Responsory8"
lectio11:
  - "@Sancti/09-13bmv:Lectio8:s/.* Neque/Neque/s"
responsory11:
  - "R. Conceptionem hodiernam perpetuæ virginis Dei genitricis Mariæ solemniter
    celebremus:"
  - "* Qua celsitudo throni processit."
  - V. Regali ex progenie Maria exorta refulget.
  - R. Qua celsitudo throni processit.
lectio12:
  - "@Sancti/09-13bmv:Lectio9"
responsory12:
  - "R. Sancta et immaculata virginitas, quibus te laudibus efferam nescio:"
  - "* Quia quem cæli capere non poterant, tuo gremio contulisti."
  - V. Benedicta tu in mulieribus, et benedictus fructus ventris tui.
  - R. Quia quem cæli capere non poterant, tuo gremio contulisti.
evangelium:
  - "@Sancti/09-08"
