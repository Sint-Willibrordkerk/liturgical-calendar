references: "@Sancti/12-08o"
rank:
  - Conceptione Beatæ Mariæ Virginis
  - Duplex majus
  - "4"
  - "@C11"
rule:
  - ex C11;
  - 12 lectiones
  - Antiphonas horas
  - Doxology=Nat
