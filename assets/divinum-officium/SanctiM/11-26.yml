references: "@Sancti/11-26"
rubrica-tridentina/rule:
  - ex C5b;
  - 12 lectiones
  - In 1 Nocturno lectiones ex Commune in 2 loco
lectio5:
  - "@Sancti/11-26:Lectio4"
lectio6:
  - "@Sancti/11-26:Lectio5:s/Ut autem.*//s"
lectio7:
  - "@Sancti/11-26:Lectio5:s/.*(Ut autem)/$1/s s/$/~/"
  - "@Sancti/11-26:Lectio6:s/Spíritu.*//s"
lectio8:
  - "@Sancti/11-26:Lectio6:s/.*(Spíritu)/$1/s"
