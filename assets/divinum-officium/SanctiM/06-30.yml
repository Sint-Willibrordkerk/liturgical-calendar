antmatutinumm:
  - Ter virgis cæsus sum, * semel lapidátus sum, ter naufrágium pértuli pro
    Christo Dómino.;;97
  - "Grátia Dei * sum id quod sum: et grátia ejus in me vácua non fuit.;;98"
  - "Súfficit tibi, * Paule, grátia mea: nam virtus mea in infirmitáte
    perfícitur.;;100"
  - "Ecce ego † mitto vos sicut oves in médio lupórum, dicit Dóminus: estóte
    ergo prudéntes sicut serpéntes, et símplices sicut colúmbæ.;;253;254;255"
  - Vade, Ananía, * et quære Saulum, ecce enim orat; quia vas electiónis est
    mihi, ut portet nomen meum coram géntibus et régibus et fíliis
    Israël.;;253;254;255
