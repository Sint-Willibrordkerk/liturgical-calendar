oratio:
  - "Preces pópuli tui, quǽsumus, Dómine, propítius réspice: et intermissióne
    beáti Leónis Confessóris tui atque Pontíficis, cujus hódie solémnia cólimus;
    flagélla tue iracúndiæ, quæ pro peccátis nostris mereámur, averte."
  - $Per Dominum
