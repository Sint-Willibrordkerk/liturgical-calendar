lectio2:
  - Robértus Eboráci in Anglia natus, pueríles ludos ab infántia vitans,
    litterárum stúdio ánimum applícuit. Factus Sacérdos‚ et cujúsdam ecclésiæ
    rector, solitúdinis desidério sancti Benedícti hábitum suscépit. Strictióris
    observántiæ causa, ad Ordinem Cisterciénsem, et Monastérium de Fóntibus
    tránsiens, post probátam virtútem‚ a Richárdo Abbáte, novo Monastério
    præfícitur. Abstinéntiam mirífice cóluit, solitóque Offícii penso non
    conténtus quotídie psaltérium ex integro recitábat.
lectio3:
  - Divínitus ei multa fuére reveláta, dæmónia per ipsum fugáta, et familiáris
    beáto Patri Bernárdo factus, ab ipso zonam recépit in amóris arguméntum‚ et
    ipsíus innocéntiæ ac puritátis testimónium. Cum Godríco Eremíta viro
    sanctíssimo sæpe de divínis collocútus, sancto fine quiévit anno millésimo
    centésimo quinquagésimo nono, séptimo Idus Júnii. Ejus autem ánima inter
    Angelos visa est a Godríco, et mutus ad ejus túmulum orans loquélam accépit.
