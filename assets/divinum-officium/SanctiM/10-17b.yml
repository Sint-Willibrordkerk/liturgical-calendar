lectio4:
  - "@CommuneM/C6"
lectio5:
  - "Margarita Maria Alacoque in pago Diæcesis Augustodunensis honesto genere
    nata, miro prævenientis gratiæ instinctu a teneris annis viam perfectionis
    arripuit, uc primos Innocentissimi cordis affectus ad eam interioris vitæ
    formam, ad quäm divinitus electa erat; composuit. Puellula vix dum rationis
    compos nihil magis in deliciis habuit, quam genibus positis, iunctisque
    manibus coelesti sponso sistere se, Ei cor suum dicare, et virginalem
    devovere castitatem, Ipso interius votum supra ætatem inspirante. Studium
    placendi Iesu, et pietas in Deiparam, cui se ab illo commendatam novit,
    pariter crevere cum annis. Ex hoc Christi amore, quem produéta ad plures
    horas meditatio alebat, ingens exarsit patiendi amor, ut Ei, quem unice
    diligebat, similem se exhiberet. Hinc corpus ieiuniis, vigiliis, aliisque
    asperitatibus ad morbum usque amixit: animum vero inter diuturnas
    vexationes, quas patre orbata à famulis pertulit, ad imaginem Eius, qui
    mitis est et humilis corde, constanter effingens, brevi ad magnam
    sanctitatem in ipso sæculo pervenit."
lectio6:
  - Ordinem Visitationis Sanctae Mariæ, quo a propinquis abesset longius,
    Paredii ingressa, statim in tirocinio cunctis religiosæ vitæ virtutibus
    indubium sanctitatis specimen præbuit.. Interim Christus sublimioris
    orationis dono, internis locutionibus, aliisque charismatis sponsam suam
    illustrare et ad sua consilia proprius disponere instituit. Inter varias
    apparitiones illa maxime celebris fuit, qua ante Eucharistiam oranti Iesus
    semetipsum conspiciendum obtulit, et divinum Cor suum in aperto pectore
    flammis incensum, et spinis constrictum ostendit, præcepitque, ut pro tali
    charitate, et ad reparandas ingratorum hominum iniurias illa publicum Cordi
    suo cultum, magnis propositis gratiarum præmiis, instituendum curaret, et
    cunctantem humilitatis causa, seque tantæ rei imparem dictitantem, promisso
    auxilio et prænuntiato successu confirmavit. Exinde fidissima Christi sponsa
    hoc unum spirare, verbis, exemplis, scriptis, iugi vitæ suæ sacrificio hoc
    unum quærere visa est, ut sanctissimo Cordi Iesu interior, exteriorque
    cultus, qualem Ei placere ab Ipso didicerat, ab omnibus tribueretur, quod et
    tunc fieri mirabiliter cæpit, et postea, approbante sancta Sede, quanto
    fructu sit perfectum universus orbis catholicus testatur.
lectio7:
  - "Quod enixe à Domino petierat, illustria Eius dona in sui conteraptum
    verterentur, abunde obtinuit. Nunquam enim defuere domi et foris qui illam
    misere illusam credentes, aut saltem dubitantes, eius spiritum dicteriis
    carperent, vel certe assiduis ac duris subiicerent experimentis : in quibus
    tamen mitissimæ Virginis humilitas, patientia, obedientia, et charitas magis
    semper eluxerunt. Contumelias quoque ac minas ab extraneis ob nobilern
    alumnam a tirocinio fortiter dimissam invicta constantia toleravit.
    Accessere morbi graves, et diuturni, quibus levandis remedia a medicis
    oblata nocebant. Inter hæc illa in divino Christi Corde absorpta, et igne
    charitatis eius incensa plura et graviora pati semper optabat."
lectio8:
  - "Extremum morbum patientissime toleranti subito divini iudicii cogitatio
    tantum iniecit metum, ut cum tremore ac fletu Crucifixum stringens
    misericordiam sibi precaretur: sed mox consolationes Dei lætificaverunt
    animam eius. Igitur tamquam consummata charitatis victima, die decima
    septima Octobris ad sponsum evolavit, annos nata tres et quadraginta.
    Cælestem eius gloriam miracula confirmaverunt, quibus rite probatis, eam
    Pius Nonus Pontifex Maximus magna piorum gratulatione quartodecimo Kalendas
    Octobris Anni Millesimi octingentesimi sexagesimi quarti beatarum Virginum
    cætum inscripsit."
