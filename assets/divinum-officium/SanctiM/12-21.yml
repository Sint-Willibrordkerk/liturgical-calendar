  - Certe iste ipse pastor Ecclésiæ, ad cujus sacratíssimum corpus sedémus,
    quantæ debilitátis, quantǽque formídinis ante advéntum Spíritus fúerit,
    ancílla ostiária requisíta dicat. Una enim mulíeris voce percúlsus, dum mori
    tímuit, vitam negávit.
