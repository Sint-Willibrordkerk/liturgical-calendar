rubrica-cisterciensis/lectio2:
  - Vincéntius a Paulo, natióne Gallus, Pódii non procul ab Aquis Tarbéllis in
    Aquitánia natus, jam tum a púero exímiam in páuperes charitátem præ se
    tulit. A custódia patérni gregis ad lítteras vocátus, et póstea sacerdótio
    insignítus, in Turcas incídit, qui captívum in Africam abduxérunt. Sed cum
    herum ipsum Christo lucrifecísset, ex bárbaris oris una cum eo, opitulánte
    Deípara se prorípiens, ad Apostólica límina iter instítuit; unde in Gálliam
    revérsus, animárum ministério indeféssus incúbuit. Primárius sacrórum
    miníster in Gálliæ trirémibus renuntiátus a rege, mirum quo zelo et ducum et
    rémigum salúti óperam posúerit. Moniálibus Visitatiónis a sancto Francísco
    Salésio præpósitus, tanta prudéntia per annos círciter quadragínta eam curam
    sustínuit, ut máxime comprobáverit judícium sanctíssimi Præsulis, qui
    sacerdótem Vincéntio digniórem nullum se nosse fatebátur. Evangelizándis
    paupéribus, præsértim rurícolis, tum se, tum alúmnos Congregatiónis, quam
    sub nómine Presbyterórum Missiónis instítuit, perpétuo voto obstrínxit.
    Quantum autem augéndæ Cleri disciplínæ, et quantum amplificándæ fídei et
    pietáti allaboráverit‚ testántur, inter ália, erécta majórum Clericórum
    seminária, et multi verbi Dei præcónes non ad solas Gálliæ et Európæ
    províncias missi, sed et usque ad Bárbaros et Indos.
rubrica-cisterciensis/lectio3:
  - Nullum fuit calamitátis genus, cui patérne non occúrrerit. Fidéles sub
    Turcárum jugo geméntes‚ infántes expósitos, vírgines periclitántes‚ moniáles
    dispérsas, ad trirémes damnátos, peregrínos infírmos, artífices inválidos,
    ipsósque mente captos, ac innúmeros mendícos subsídiis et hospítiis etiámnum
    superstítibus excépit ac pie fovit. Divérsas províncias peste, fame bellóque
    vastátas prolíxe refécit. Plúrima ad perquiréndos et sublevándos míseros
    sodalítia fundávit‚ inter quæ célebris matronárum cœtus, et late diffúsa sub
    nómine Charitátis puellárum Socíetas. Ipse vero hæc inter et ália gravíssima
    negótia, Deo júgiter inténtus, cunctis affábilis, ac sibi semper constans,
    simplex, rectus, húmilis, ab honóribus, divítiis ac delíciis semper
    abhórruit. Demum labóribus et sénio conféctus, anno supra millésimum
    sexcentésimo sexagésimo, ætátis suæ octogésimo quinto, Parísiis in domo
    sancti Lázari‚ quæ caput est Congregatiónis Missiónis, plácide obdormívit.
    Quem virtútibus, méritis ac miráculis clarum Clemens duodécimus inter
    Sanctos rétulit.
