responsory8:
  - "R. In própria venit, et sui eum non recepérunt: † quotquot autem recepérunt
    eum, dedit eis potestátem fílios Dei fíeri:"
  - "* Qui non ex sanguínibus, neque ex voluntáte carnis, neque ex voluntáte
    viri, sed ex Deo nati sunt."
  - "V. Si autem filii, et herédes: † herédes, quidem Dei, coherédes autem
    Christi."
  - R. Qui non ex sanguínibus, neque ex voluntáte carnis, neque ex voluntáte
    viri, sed ex Deo nati sunt.
