responsory11:
  - "R. Párvulus natus est nobis, et fílius datus est nobis, † et factus est
    principátus super húmerum ejus:"
  - "* Et vocábitur Admirábilis, Deus Fortis."
  - V. Multiplicabitur ejus imperium, † et pacis non erit finis.
  - R. Et vocábitur Admirábilis, Deus Fortis.
