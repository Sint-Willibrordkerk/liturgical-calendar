rubrica-cisterciensis/lectio2:
  - "Bonaventúra, Balneorégii in Etrúria natus infans ex matris voto religióni
    beáti Francísci dicátur. Itaque adoléscens in Ordinem Fratrum Minórum
    adscríbi vóluit: ubi Alexandro de Ales magístro‚ ad summam doctrínæ
    perfectiónem brevi pervénit. Unde séptimo post anno libros Sententiárum
    Parísiis públice summa cum laude est interpretátus: quos étiam præcláris
    póstea commentáriis illustrávit. Post sex annos, sui Ordinis Generális
    Miníster Romæ factus, ea prudéntiæ ac sanctitátis laude ministérium gessit,
    ut in ómnium ore et admiratióne esset."
rubrica-cisterciensis/lectio3:
  - "Multa scripsit in quibus summam eruditiónem cum pari pietátis ardóre
    conjúngens, lectórem docéndo movet. Quem Gregórius décimus, ejus sanctimóniæ
    et sapiéntiæ fama commótus, cardinálem et Epíscopum Albanénsem creávit.
    Eumdem adhuc vivéntem beátus Thomas Aquínas sanctum appellávit. Cum enim
    vitam sancti Francísci scribéntem comperísset: Sinámus, inquit, sanctum pro
    sancto laboráre. Migrávit e vita prídie Idus Júlii, in Concílio Lugdunénsi,
    quinquagínta tres annos natus, multis éditis miráculis. Quem Xystus quartus
    rétulit in Sanctórum númerum."
