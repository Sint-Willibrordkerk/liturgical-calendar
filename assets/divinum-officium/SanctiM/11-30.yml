    aquisívi;;46
  - Ego si crucis * patíbulum expavéscerem, † crucis glóriam non prædicárem.;;60
  - "Videns Andréas * crucem, cum gáudio dicébat: † Quia amátor tui semper fui,
    et desiderávi te amplécti, o bona crux.;;74"
ant-matutinum-3n:
  - Unus ex duóbus, * qui secúti sunt Dóminum, erat Andréas, frater Simónis
    Petri, allelúja.
