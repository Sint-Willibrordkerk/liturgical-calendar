responsory8:
  - "R. Beátus Andréas de cruce clamábat, dicens: † Dómine Jesu Christe,
    magíster bone,"
  - "* Non júbeas me depóni de ista cruce, nisi prius accípias spíritum meum."
  - V. Quóniam tu es protéctor meus, Christe, † in manus tuas comméndo spíritum
    meum.
  - R. Non júbeas me depóni de ista cruce, nisi prius accípias spíritum meum.
