responsory11:
  - R. Vir iste in pópulo suo mitíssimus appáruit, † sanctitáte autem et grátia
    plenus
  - "* Iste est qui assídue orat pro pópulo et pro civitáte ista."
  - "V. Pro eo, ut me dilígerent, detrahébant mihi: † ego autem orábam."
  - R. Iste est qui assídue orat pro pópulo et pro civitáte ista.
lectio12:
  - "@Sancti/11-30:Lectio9:s/.*Sed hac/Sed hac/s"
responsory12:
  - R. Diléxit Andréam Dóminus in odórem suavitátis, dum pendéret in cruce, †
    dignum sibi computávit Mártyrem, quem vocábit Apóstolum, dum esset in mari
  - "* Et ídeo amícus Dei appellátus est."
  - V. Andréas, Christi fámulus, dignus Dei Apóstolus, germánus Petri, et is
    possessióne sócius.
  - R. Et ídeo amícus Dei appellátus est.
