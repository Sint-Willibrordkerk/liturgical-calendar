rank:
  - ""
  - Simplex
  - "1.1"
  - "@C5b"
oratio:
  - "Deus, qui beátum Bernárdum Abbátem a sǽculi pompa ad amórem solitúdinis
    evocátum, in miseránda pópuli contagióne caritátis víctimam efficísti:
    quǽsumus, ut per ejus vestígia gradiéntes, ejúsdem caritátis et glóriæ
    tríbuas esse consórtes."
  - $Per Dominum
rubrica-1930/oratio:
  - "Deus, qui per beátum Bernárdum novum anachoréticæ vitæ genus in Ecclésia
    tua exordíri voluísti: concéde, quæsumus; ut, ejus vestígiis insisténtes,
    ætérnæ vitæ præmia cónsequi mereámur."
  - $Per Dominum
