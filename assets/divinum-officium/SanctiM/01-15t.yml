lectio5:
  - Maurus nobilis Romanus, puer a patre Eutychio Deo sub sancti Benedicti
    disciplína oblatus, brevi tantum divina grátia profecit, ut ipsi magistro
    admiratióni esset; qui illum sæpe, véluti regularis observantiæ et virtútum
    ómnium specimen, ceteris discípulis ad imitándum proponebat.
lectio6:
  - Cujus adhuc adolescentis illud admirábilis obediéntiæ exemplum a sancto
    Gregório Papa commemorátur. Nam, cum Placidus mónachus in lacum prolapsus,
    aquárum ímpetu raperétur, sancti Patris jussu accurrens Maurus, et super
    aquas incédens, socium capíllis apprehensum, ad terram attraxit.
lectio7:
  - Continentiæ tantá fuit, ut per Quadragesimam bis tantum in hebdomada, et
    quidem parcissime cibum sumeter. Somnum stando, vel cum nimia, eum lassitudo
    compulisset, sededo, super aggestum calcis et fabuli strato cilicio
    capiebat.
lectio8:
  - Missus in Gálliam ab eodem sancto Benedicto, célebri monasterio exstructo,
    cui annos quadragínta præfuit, monasticam disciplínam mirifice propagávit.
    Denique sanctitáte et miraculis clarus, septuagenario major migrávit in
    cælum, anno salútis quingentésimo sexagésimo quinto.
