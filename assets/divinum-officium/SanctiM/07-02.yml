references: "@Sancti/07-02"
rule:
  - 12 lectiones
  - Doxology=Nat
ant-matutinum-3n:
  - "Adest namque * Visitátio sacratíssime Vírginis, quæ ex regáli progénie
    génita génuit Christum Regem Dóminum: † ipsa intercédat pro peccátis
    nostris."
lectio1:
  - "@Sancti/07-02:Lectio1:1-7 s/-7/-5/"
lectio2:
  - "@Sancti/07-02:Lectio1:2-9 s/1-7/6-9/ s/1 .*6 /6 /s"
  - "@Sancti/07-02:Lectio2:2-3"
lectio3:
  - "@Sancti/07-02:Lectio2:s/8-/10-/ s/8 .*10 /10 /s"
lectio4:
  - "@Sancti/07-02:Lectio3"
responsory4:
  - "R. Magníficat ánima mea Dóminum: † et exsultávit spíritus meus in Deo,
    salutári meo,"
  - "* Quia respéxit humilitátem ancíllæ suæ."
  - V. Ecce enim ex hoc beátam me dicent omnes generatiónes.
  - R. Quia respéxit humilitátem ancíllæ suæ.
lectio5:
  - "@Sancti/07-02:Lectio4"
responsory5:
  - "@Sancti/07-02:Responsory4"
lectio6:
  - "@Sancti/07-02:Lectio5"
responsory6:
  - "@Sancti/07-02:Responsory5"
lectio7:
  - "@Sancti/07-02:Lectio6:s/Vídeo, .*//s"
responsory7:
  - "@Sancti/07-02:Responsory6"
lectio8:
  - "@Sancti/07-02:Lectio6:s/.* Vídeo, /Vídeo, /s"
responsory8:
  - R. Hódie visitávit Elízabeth beáta Virgo María ex progénie David; † per quam
    salus mundi credéntibus appáruit,
  - "* Cujus vita gloriósa lucem dedit sǽculo."
  - V. Beatíssimæ Vírginis Maríæ Visitatiónem devotíssime celebrémus.
  - R. Cujus vita gloriósa lucem dedit sǽculo.
lectio9:
  - "@Sancti/07-02:Lectio7:s/Illa natúræ.*//s"
responsory9:
  - "@Sancti/07-02:Responsory7"
lectio10:
  - "@Sancti/07-02:Lectio7:s/.* Illa natúræ/Illa natúræ/s"
responsory10:
  - "@Sancti/07-02:Responsory8"
lectio11:
  - "@Sancti/07-02:Lectio8"
responsory11:
  - R. Cum jucunditáte Visitatiónem sanctæ Maríæ celebrémus,
  - "* Ut ipsa pro nobis intercédat ad Dóminum Jesum Christum."
  - V. Gloriósæ Virginis Maríæ Visitatiónem digníssime recolámus.
  - R. Ut ipsa pro nobis intercédat ad Dóminum Jesum Christum.
lectio12:
  - "@Sancti/07-02:Lectio9"
responsory12:
  - "R. Sancta et immaculáta virgínitas, † quibus te láudibus éfferam, néscio:"
  - "* Quia quem cæli cápere non póterant, tuo grémio contulísti."
  - V. Benedícta tu in muliéribus, † et benedíctus fructus ventris tui.
  - R. Quia quem cæli cápere non póterant, tuo grémio contulísti.
