responsory11:
  - R. Martínus sacérdos Dei cui post Apóstolos tantam grátiam Dóminus cóntulit,
    † ut tres mórtuos suscitáret, et álias virtútes præcláras osténderet, inter
    álios Confessóres et Mártyres
  - "* Et rosa fulget in Gállia."
  - V. Córpore quidem virgíneo blandum habébat elóquium gravis erat in móribus
    inténta mente cælo suspénsus.
  - R. Et rosa fulget in Gállia.
