responsory4:
  - R. Dum sacraménta offérret beatus Martínus,
  - "* Globus ígneus appáruit super caput ejus."
  - V. Sum enim ad Deum preces emítteret, † et pro univérso grege sibi commísso
    deprecarétur.
  - R. Globus ígneus appáruit super caput ejus.
