rubrica-barroux/ant-vespera:
  - "@:Ant Laudes"
antmatutinumm:
  - Dum sacraménta * offérret beátus Martínus, † globus ígneus appáruit super
    caput ejus.;;20
  - "Sínite me, * inquit, cælum vidére ut spíritus dirigátur ad Dóminum: † nihil
    in me repériet inimícus, sed sinus Abrahæ me suscípiet.;;23"
  - Beáti * viri corpus usque ad locum sepúlcri, † hymnis canóra cæléstibus
    turba proséquitur.;;97
ant-matutinum-3n:
  - O vere beátum, * o ineffábilem pietáte, misericórdia caritáte! † quarum ut
    viscéribus semper totus affluébat in Dómino, sic non desit nobis non desit
    in ævum.
