responsory8:
  - R. O virum ineffábilem, nec labóre victum nec morte vincéndum,
  - "* Qui nec mori tímuit nec vívere recusávit!"
  - V. O vere beátum in cujus ore dolus non fuit, † numquam in illíus lingua,
    nisi Christus, nisi pax, nisi misercórdia ínerat.
  - R. Qui nec mori tímuit nec vívere recusávit!
