antmatutinumm:
  - Dulce lignum, * dulces clavos, dulce pondus sustínuit, † quæ sola digna fuit
    portáre prétium hujus sǽculi.;;8
  - "Virga tua, et báculus tuus: * ipsa me consoláta sunt, † Dómine, Deus
    meus.;;22"
  - Adorámus Crucis signáculum, * per quod salútis súmpsimus sacraméntum.;;98
ant-matutinum-3n:
  - "Mihi autem * absit gloriári, nisi in cruce Dómini nostri Jesu Christi: per
    quem mihi mundus crucifíxus est, et ego mundo."
