lectio10:
  - "Paulo autem univérsus mundus crucifíxus erat, et ipse mundo. Sic, qui
    veheménter cupiditáte sequéndi Christum tenétur, ad nihil ámplius hujus vitæ
    convérti potest: non ad paréntum aut cognatórum amórem, ubi præcéptis Dómini
    contrárius fúerit; (tunc enim occasiónem habet illud: Si quis venit ad me,
    et non ódio habet patrem suum et matrem et réliqua); non ad humánum timórem,
    ut propter ipsum subtrahámus áliquid utílium, id quod perpetrárunt Sancti,
    qui dixérunt: Obedíre opórtet Deo magis quam homínibus."
