lectio2:
  - Basilíus nóbilis Cáppadox, Athénis una cum Gregório Nazianzéno, ejus
    amicíssimo, sæculáribus lítteris, deínde in Monastério sacris erudítus, ad
    prædicándum Jesu Christi Evangélium in Pontum fuit accersítus. Mox ab
    Eusébio Cæsaréæ Epíscopo, adjútor adhíbitus, in ejus locum succéssit. Fílium
    Patri consubstantiálem esse deféndit, ac Valéntem imperatórem sibi irátum,
    miráculis ádeo flexit, ut ab exílii senténtia discédere coégerit.
rubrica-cisterciensis/responsory2:
  - "@ CommuneCist/C4:Responsory3"
lectio3:
  - "Abstinéntia et continéntia fuit admirábili: única túnica conténtus erat: in
    jejúnio et oratióne assíduus, virginitátem perpétuo cóluit. Monastériis
    extrúctis, ita Monachórum institútum temperá­vit‚ ut solitáriæ atque actuósæ
    vitæ utilitátes præcláre simul conjúngeret. Multa erudíte scripsit, ac nemo,
    teste Gregório Nazianzéno, sacræ Scriptúræ libros vérius aut ubérius
    explicávit. Obiit Kaléndis Januárii, cum tantum spíritu vivens, præter ossa
    et pellem, nulla prætérea córporis parte constáre viderétur."
