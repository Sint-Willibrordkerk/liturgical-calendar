  - Stetit Angelus * juxta aram templi, habens thuríbulum áureum in manu sua.;;95
  - Mitte, Dómine, * Angelum bonum ante nos in timóre bráchii tui, ut métuant
    qui odérunt nos.;;97
  - "Angelus meus * vobíscum est, dicit Dóminus: ipse autem exquíret ánimas
    vestras.;;98"
ant-matutinum-3n:
  - Ecce ego * mitto Angelum meum, qui præparábit viam meam ante fáciem tuam.
