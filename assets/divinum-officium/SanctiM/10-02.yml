  - "@Sancti/10-02:Lectio3"
responsory4:
  - "R. Vidit Jacob † scalam stantem super terram, et cacúmen illíus tangens
    cælum, Ángelosque Dei ascendéntes per eam Dóminum inníxum scalæ, dicéntem
    sibi:"
  - "* Ego sum Dóminus Deus tuus et protéctor tuus quóniam perréxeris."
  - "V. Ivérunt Jacob óbviam Angeli Dei, quos, cum vidísset. ait: Castra Dei
    sunt hæc, per quæ auxiliátor mihi Deus, dicens."
  - R. Ego sum Dóminus Deus tuus et protéctor tuus quóniam perréxeris.
