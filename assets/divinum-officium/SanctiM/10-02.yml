lectio3:
  - "!Zach 1:13-16"
  - 13 Et respóndit Dóminus ángelo qui loquebátur in me verba bona, verba
    consolatória.
  - "14 Et dixit ad me ángelus qui loquebátur in me: Clama, dicens: Hæc dicit
    Dóminus exercítuum: Zelátus sum Jerúsalem et Sion zelo magno."
  - 15 Et ira magna ego iráscor super gentes opuléntas, quia ego irátus sum
    parum, ipsi vero adiuvérunt in malum.
  - "16 Proptérea hæc dicit Dóminus: Revértar ad Jerúsalem in misericórdiis, et
    domus mea ædificábitur in ea, ait Dóminus exercítuum, et perpendículum
    extendétur super Jerúsalem."
