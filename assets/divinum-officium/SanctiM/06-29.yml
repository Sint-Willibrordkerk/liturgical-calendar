lectio11:
  - "@Sancti/06-29:Lectio8:s/.* Petrus /Petrus /s s/$/~/"
  - "@Sancti/06-29:Lectio9:s/Quod .*//s"
responsory11:
  - R. Qui regni claves et curam tradit ovílis
  - "* Qui cæli terrǽque Petro commíttit habénas: † ut réseret clausis et solvat
    vincla ligátis."
  - V. Ipse tua Petre jussit vincula solvi qui te mundanos constituit solvere
    nexus.
  - "R. Qui cæli terrǽque Petro commíttit habénas: † ut réseret clausis et
    solvat vincla ligátis."
lectio12:
  - "@Sancti/06-29:Lectio9:s/.* Quod /Quod /s"
responsory12:
  - "R. Beátus es Simon Bar Jona: quia caro et sanguis non revelávit tibi, sed
    Pater meus, qui in cælis est"
  - "* Dicit Dóminus."
  - V. Et ego dico tibi, quia tu es Petrus, et super hanc petram ædificábo
    Ecclésiam meam.
  - R. Dicit Dóminus.
