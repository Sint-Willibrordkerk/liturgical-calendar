lectio8:
  - "@Sancti/06-29:Lectio6:s/.* Hæc autem /Hæc autem /s"
responsory8:
  - R. Solve, jubénte Deo terrárum Petre caténas,
  - "* Qui facis ut páteant cæléstia regna beátis."
  - "V. Quodcúmque ligáveris super terram, erit ligátum et in cælis: † et
    quodcúmque sólveris super terram, erit solútum et in cælis."
  - R. Qui facis ut páteant cæléstia regna beátis.
lectio9:
  - "@Sancti/06-29:Lectio7"
responsory9:
  - "@Sancti/06-29:Responsory7"
lectio10:
