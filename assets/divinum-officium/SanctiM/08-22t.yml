lectio12:
  - "Néminem móveat, quod suscípiens múlier Dóminum, non María, sed Martha
    vocátur: quando in hac una et summa María et Marthæ negótium, et Maríæ non
    otiósum ótium invenítur. Omnis quidem glória fíliæ regis ab intus:
    nihilóminus tamen in fímbriis áureis circumamícta est varietáte. Non est de
    número fatuárum vírginum: prudens est virgo; lámpadem habet, sed in vase
    óleum portat."
