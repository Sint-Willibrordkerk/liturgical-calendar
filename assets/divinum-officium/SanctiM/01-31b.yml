rank:
  - S. Petri Nolasci et Raymundi de Pennafort, Confessorum
  - Simplex
  - "1.1"
  - "@C5"
oratio:
  - "Deus, qui in tuae caritatis exemplum, ad fidelium redemptionem sanctos
    Petrum et Raymundum Ecclesiam tuam nova prole fecundare divinitus docuisti:
    ipsorum nobis intercessione concede; a peccati servitute solutis, in
    caelesti patria perpetua libertate gaudere."
  - $Qui vivis
versum-2:
  - "@Commune/C3"
ant-2:
  - Fulgébunt justi * sicut sol in conspéctu Dei.
commemoratio-2:
  - "@Commune/C5:Oratio proper"
  - $Oratio
  - "v. Deus, qui sanctum Joánnem Confessórem tuum adolescéntium patrem et
    magístrum excitásti, ac per eum, auxiliatríce Vírgine María, novas in
    Ecclésia tua famílias floréscere voluísti: concéde, quǽsumus; ut eódem
    caritátis igne succénsi, ánimas quǽrere, tibíque soli servíre valeámus."
  - $Per Dominum
