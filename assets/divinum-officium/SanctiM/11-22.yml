antmatutinumm:
  - Cæcília * me misit ad vos, ut ostendátis mihi sanctum Urbánum; quia ad ipsum
    hábeo secréta, quæ pérferam;;84
  - Triduánas * a Dómino popósci indúcias, ut domum meam ecclésiam
    consecrárem.;;86
  - Accínxit * fortitúdine lumbos suos, et roborávit bráchium suum; ideóque
    lucérna ejus non exstinguétur in sempitérnum.;;98
ant-matutinum-3n:
  - Virgo gloriósa * semper Evangélium Christi gerébat in péctore suo, et non
    diébus neque nóctibus, a collóquiis divínis et oratióne cessábat.
