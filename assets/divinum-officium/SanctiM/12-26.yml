references: "@Sancti/12-26"
rule:
  - 12 lectiones
ant-matutinum-3n:
  - Jerúsalem, * Jerúsalem, quæ occídis prophétas, † et lápidas eos, qui ad te
    missi sunt.
lectio1:
  - "@Sancti/12-26:Lectio1:s/-6/-4/ s/5 .*//s"
lectio2:
  - "@Sancti/12-26:Lectio1:2-20 s/1-/5-/ s/1 .*5 /5 /s"
lectio3:
  - "@Sancti/12-26:Lectio2"
lectio4:
  - "@Sancti/12-26:Lectio3"
responsory4:
  - R. Cum esset plenus Spíritu Sancto beátus Stéphanus, † inténdens in cælum
    vidit glóriam Dei,
  - "* Et Jesum stantem a dextris Dei."
  - V. Et clamans voce magna dixit † Ecce vídeo cælos apértos.
  - R. Et Jesum stantem a dextris Dei.
lectio5:
  - "@Sancti/12-26:Lectio4"
responsory5:
  - "@Sancti/12-26:Responsory4"
lectio6:
  - "@Sancti/12-26:Lectio5:s/Heri Christus.*//s"
responsory6:
  - "@Sancti/12-26:Responsory5"
lectio7:
  - "@Sancti/12-26:Lectio5:s/.* Heri Christus/Heri Christus/s s/$/~/"
  - "@Sancti/12-26:Lectio6:s/Stéphanus ergo.*//s"
responsory7:
  - "@Sancti/12-26:Responsory6"
lectio8:
  - "@Sancti/12-26:Lectio6:s/.* Stéphanus ergo/Stéphanus ergo/s"
responsory8:
  - R. Surrexérunt quidam de synagóga, disputántes cum Stéphano,
  - "* Et non póterunt resístere sapiéntiæ et Spirítui qui loquebátur."
  - V. Commovérunt ítaque plebem, † et concurréntes rapuérunt eum, et adduxérunt
    in concílium.
  - R. Et non póterunt resístere sapiéntiæ et Spirítui qui loquebátur.
lectio9:
  - "@Sancti/12-26:Lectio7"
responsory9:
  - "@Sancti/12-26:Responsory7"
lectio10:
  - "@Sancti/12-26:Lectio8:s/Alii Zacharíam patrem.*//s"
responsory10:
  - "@Sancti/12-26:Responsory8"
lectio11:
  - "@Sancti/12-26:Lectio8:s/.* Alii Zacharíam patrem/Alii Zacharíam patrem/s
    s/$/~/"
  - "@Sancti/12-26:Lectio9:s/Cum ergo .*//s"
responsory11:
  - "R. Hestérna die Dóminus natus est in terris, ut Stéphanus nascerétur in
    cælis: † ingréssus est Dóminus mundum,"
  - "* Ut Stéphanus ingrederétur in cælum."
  - V. Heri enim rex noster trábea carnis indútus, † de aula úteri virginális
    egrédiens visitáre dignátus est mundum.
  - R. Ut Stéphanus ingrederétur in cælum.
lectio12:
  - "@Sancti/12-26:Lectio9:s/.* Cum ergo /Cum ergo /s"
responsory12:
  - R. Sepeliérunt Stéphanum viri timoráti, † et fecérunt planctum magnum super
    eum.
  - "* Facta est persecútio magna advérsus Ecclésiam, quæ erat Jerosólymis."
  - V. Saulus autem conséntiens neci ejus, devastábat Ecclésiam.
  - R. Facta est persecútio magna advérsus Ecclésiam, quæ erat Jerosólymis.
