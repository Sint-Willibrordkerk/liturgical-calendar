references: "@Sancti/03-12"
rule:
  - ex C4a;
  - 12 lectiones
ant-vespera:
  - "@:Ant Laudes"
hymnus-vespera:
  - v. Anglórum jam Apóstolus,
  - Nunc Angelórum sócius,
  - Ut tunc, Gregóri, Géntibus,
  - Succúrre jam credéntibus.
  - _
  - Tu largas opum cópias,
  - Omnémque mundi glóriam
  - Spernis, ut inops ínopem
  - Jesum sequáris príncipem.
  - _
  - Vidétur egens náufragus,
  - "Dum stipem petit Ángelus:"
  - Tu munus jam post géminum
  - Præbes et vas argénteum.
  - _
  - Ex hoc te Christus témpore
  - "Suæ præfert Ecclésiæ:"
  - Sic Petri gradum pércipis,
  - Cujus et normam séqueris.
  - _
  - O Póntifex egrégie,
  - Lux et decus Ecclésiæ,
  - Non sinas in perículis,
  - Quos tot mandátis ínstruis.
  - _
  - Sit Patri laus ingénito,
  - Sit decus Unigénito,
  - Sit utriúsque párili
  - Majéstas summa Flámini.
  - Amen.
ant-1:
  - "@Commune/C4a::s/N\\./Gregóri/"
hymnus-matutinum:
  - "@:Hymnus Vespera"
ant-matutinum-3n:
  - Duódecim * paupéribus ad mensam invitátis, † Angelum Dómini convívam
    tredécimum habére méruit.
