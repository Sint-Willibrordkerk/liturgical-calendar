ant-laudes:
  - Benedícta tu * a Deo tuo, quóniam in omni gente, quæ audíerit nomen tuum,
    magnificábitur super te Deus Isræl.
  - Dominus elégit te, * ut sis ei, et fáciat te in laudem, et nomen, et glóriam
    suam.
  - Eris coróna glóriæ * in manu Dómini, et diadéma regni in manu Dei tui, quia
    complácuit Dómino in te.
  - Dominus fáciet et tecum * misericórdiam et veritátem, quia ostendísti
    grátiam et fidem.
  - Erúmpet quasi mane * lumen tuum, et anteíbit fáciem tuam justítia tua, et
    glória Dómini cólliget te.
capitulum-laudes:
  - "!Is 66:12"
  - "v. Hæc dicit Dóminus: Ecce ego declinábo super eam quasi flúvium pacis, et
    quasi torréntem inundántem glóriam géntium, quam sugétis: † ad úbera
    portabímini, * et super génua blandiéntur vobis."
  - $Deo gratias
responsory-laudes:
  - R.br. Exsultábo et lætábor, Dómine, * In misericórdia tua.
  - R. Exsultábo et lætábor, Dómine, * In misericórdia tua.
  - V. Quóniam respéxit humilitátem meam.
  - R. In misericórdia tua.
  - "&Gloria1"
  - R. Exsultábo et lætábor, Dómine, * In misericórdia tua.
hymnus-laudes:
  - Imménsa Christi cáritas
  - Majóra cogit ággredi
  - Apostoló[rum] et Mártyrum
  - Auctam corána Víginem.
  - _
  - Optans amóris víctima
  - Ex igne adúri mýstico,
  - Sponsum precátur últimas
  - Flammas vorántes éxcitet.
  - _
  - Æternitátis núntia
  - "Optáta mors jam pérvenit:"
  - "Hæc íngemens: Te díligo!"
  - Terési[a] ad Christ[um] émigrat.
  - _
  - Cæléstibus nunc gáudiis
  - Fruens, ab arce síderum,
  - Quas lárgiter promíseras,
  - Rosas meménto spárgere.
  - _
  - Tu corde Rex mitíssime,
  - Qui párvulis regnum paras,
  - Nos hanc secútos ingredi
  - Præsta beáta límina.
  - _
  - Laus, honor, virtus, glória
  - Deo Patri et Filio,
  - Sancto simul Paráclito
  - In sempitérna saécula.
  - Amen.
versum-2:
  - V. Erit tibi Dóminus in lucem sempitérnam.
  - R. Et Deus tuus in glóriam tuam.
ant-2:
  - Requiem tibi dabit * Dóminus semper, et implébit splendóribus ánimam tuam;
    et eris quasi hortus irríguus, et sicut fons aquárum, cujus non defícient
    aquæ.
responsory-tertiam:
  - V. Exsultábo et lætábor, Dómine, in misericórdia tua.
  - R. Quóniam respéxit humilitátem meam.
capitulum-sexta:
  - "!Is 66:13"
  - v. Quómodo si cui mater blandiátur, † ita ego consolábor vos, * et in
    Jerúsalem consolabímini.
  - $Deo gratias
responsory-sextam:
  - V. Anima mea, exsultábit in Dómino.
  - R. Et delectábitur super salutári suo.
capitulum-nona:
  - "!Is 66:14"
  - v. Vidébitis, et gaudébit cor vestrum, † et ossa vestra quasi herba
    germinábunt * et cognoscétur manus Dómini servis ejus, et indignábitur
    inimícis suis.
  - $Deo gratias
responsory-nonam:
  - V. Laudáte Dóminum, quia bonus Dóminus.
  - R. Psállite nómini ejus, quoniam suáve.
hymnus-vespera-3:
  - v. Luce divína rutilántis aulæ
  - Sédibus, virgo, frúeris, secúndans
  - Vota, promísso réfoves precántes
  - Imbre rosárum.
  - _
  - Sint rosæ nobis fídei supérnæ
  - Lumen affúlgens, columénque rebus
  - Spes in advérsis, et amóris almi
  - Vívida virtus.
  - _
  - Sint rosæ nobis tuus ille fidens
  - Candor infántis Dómino, patérno
  - Grata qui præbet vel acérba nostræ
  - Númine vitæ.
  - _
  - Præstet hoc nobis Déitas beáta
  - Patris, ac Nati paritérque Sancti
  - Spíritus, cujus réboat in omni
  - Glória mundo.
  - Amen.
versum-3:
  - V. Manus Dómini confortávit te.
  - R. Et ídeo eris benedícta in ætérnum.
ant-3:
  - Benedíctus Dóminus, * quia hódie nomen tuum ita magnificávit, ut non recédat
    laus tua de ore hóminum, qui mémores fúerint virtútis Dómini in ætérnum.
