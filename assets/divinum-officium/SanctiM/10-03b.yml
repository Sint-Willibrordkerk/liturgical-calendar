responsory-vespera:
  - R.br. Anima mea * Exsultábit in Dómino.
  - R. Anima mea * Exsultábit in Dómino.
  - V. Et delectábitur super salutári suo.
  - R. Exsultábit in Dómino.
  - "&Gloria1"
  - R. Anima mea * Exsultábit in Dómino.
hymnus-vespera:
  - v. Nomen decúsque cóncinant
  - Terésiæ almæ vírginis
  - Qui sancta divi párvuli
  - Credunt amántque múnera.
  - _
  - Carméli summos vértices
  - "Patróna Mater déligit:"
  - Terési[a] illuc ádvolat,
  - Sponsi premens vestígia.
  - _
  - Affláta Jesu númine,
  - Secréta pandit grátiæ;
  - Magístra mundo símplices
  - Infántium docet vias.
  - _
  - Virtútis ipsa flósculos
  - Olent sacráta límina,
  - Quæ casta vir ut ángelus
  - immíssus e cælo, colit.
  - _
  - At júbilum non éxprimit
  - Omnes amóris ímpetus;
  - Nec septa magnos cláudere
  - Ejus valent anhélitus.
  - _
  - Jesu, tibi sit glória,
  - Qui te revélas párvulis,
  - Cum Patre et almo Spiritu,
  - In sempitérna sǽcula.
  - Amen.
versum-1:
  - V. Ego autem in Dómino gaudébo.
  - R. Et exsultábo in Deo Jesu meo.
ant-1:
  - Ego Dóminus * sponsábo te mihi in sempitérnum; et sponsábo te mihi in
    iustítia et iudício, et in misericórdia et miseratiónibus; et sponsábo te
    mihi in fide.
