  - R. Qui me dignátus est † ab omni plaga curáre, et mamíllam meam meo péctori
    restitúere,
  - "* Ipsum ínvoco Deum vivum."
  - V. Medicínam carnálem córpori meo numquam exhíbui, sed hábeo Dóminum Jesum
    Christum, qui solo sermóne restáurat univérsa.
  - R. Ipsum ínvoco Deum vivum.
