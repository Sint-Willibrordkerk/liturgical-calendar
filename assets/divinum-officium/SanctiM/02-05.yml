antmatutinumm:
  - Et si ingenua es, * cur te ostendis servilem personam? Quia ancilla Christia
    sum, ideo me ostendo servilem personam;;2
  - Agatha ingréssa cárcerem, benedicébat Dóminum Jesum Christum;;86
  - Mens mea * solidáta est, et a Christo fundáta;;95
ant-matutinum-3n:
  - "Beata Agatha * ingréssa cárcerem, expándit manus suas ad Deum et dixit:
    Dómine qui me fecísti víncere torménta carnifícium, jube me ad tuam
    misericórdiam perveníre."
