  - R. Gaudeamus † omnes in Domino, diem festum celebrantes sub honore beatæ
    Agathæ Virginis;
  - "* De cujus passióne gaudent Angeli, et colláudant Fílium Dei."
  - V. Immaculatus Dominus immaculatam sibi famulam in hoc fragili corpore
    positam misericorditer consecravit.
  - R. De cujus passióne gaudent Angeli, et colláudant Fílium Dei.
