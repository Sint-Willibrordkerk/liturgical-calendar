  - "@Commune/C4a:Ant 1:s/N\\./Hierónyme/"
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Mt 5 13"
  - "In illo témpore: Dixit Jesus discípulis suis: Vos estis sal terræ. Quod si
    sal evanúerit, in quo saliétur? ad níhilum valet ultra, nisi ut mittátur
    foras, et conculcétur ab homínibus. Vos estis lux mundi. Non potest cívitas
    abscóndi supra montem pósita, neque accéndunt lucérnam, et ponunt eam sub
    módio, sed super candelábrum, ut lúceat ómnibus qui in domo sunt. Sic lúceat
    lux vestra coram homínibus: ut vídeant ópera vestra bona, et gloríficent
    Patrem vestrum, qui in cælis est. Nolíte putáre quóniam veni sólvere legem
    aut prophétas: non veni sólvere, sed adimplére. Amen quippe dico vobis,
    donec tránseat cælum et terra, iota unum aut unus apex non præteríbit a
    lege, donec ómnia fiant. Qui ergo sólverit unum de mandátis istis mínimis,
    et docúerit sic hómines, mínimus vocábitur in regno cælórum: qui autem
    fécerit et docúerit, hic magnus vocábitur in regno cælórum."
