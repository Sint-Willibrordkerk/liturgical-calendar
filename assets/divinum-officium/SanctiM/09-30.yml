  - "@Sancti/09-30:Lectio9:s/.* (?=Donec)// s/$/~/"
  - "Quod autem sequitur : Jota unum aut unus apex non praeteribit a lege, donec
    omnia fiant; ex figura litterae ostenditur,quod etiam quae minima putantur
    in lege, sacramentis spiritualibus plena sint, et omnia recapitulentur in
    Evangelio."
