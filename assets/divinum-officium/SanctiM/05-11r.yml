responsory12:
  - R. Tanto témpore vobíscum sum, et non cognovístis me?
  - "* Philíppe, qui videt me, videt et Patrem meum, allelúja: † Non créditis
    quia ego in Patre, et Pater in me est? † allelúja, allelúja."
  - V. Dómine, osténde nobis Patrem, et súfficit nobis.
  - "R. Philíppe, qui videt me, videt et Patrem meum, allelúja: † Non créditis
    quia ego in Patre, et Pater in me est? † allelúja, allelúja."
