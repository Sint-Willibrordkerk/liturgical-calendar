lectio1:
  - De Epístola ad Romános
  - "!Rom 5:1-5"
  - "1 Justificáti ergo ex fide, pacem habeámus ad Deum per Dóminum nostrum
    Jesum Christum:"
  - 2 per quem et habémus accéssum per fidem in grátiam istam, in qua stamus, et
    gloriámur in spe glóriæ filiórum Dei.
  - "3 Non solum autem, sed et gloriámur in tribulatiónibus: sciéntes quod
    tribulátio patiéntiam operátur:"
  - "4 patiéntia autem probatiónem, probátio vero spem:"
  - "5 spes autem non confúndit: quia cáritas Dei diffúsa est in córdibus
    nostris per Spíritum Sanctum, qui datus est nobis."
responsory1:
  - "@Sancti/01-01"
lectio2:
  - "!Rom 5:6-9"
  - 6 Ut quid enim Christus, cum adhuc infírmi essémus, secúndum tempus, pro
    ímpiis mórtuus est?
  - "7 Vix enim pro justo quis móritur: nam pro bono fórsitan quis áudeat mori."
  - "8 Comméndat autem caritátem suam Deus in nobis: quóniam cum adhuc
    peccatóres essémus, secúndum tempus,"
  - "9 Christus pro nobis mórtuus est: multo ígitur magis nunc justificáti in
    sánguine ipsíus, salvi érimus ab ira per ipsum."
responsory2:
  - "@Sancti/01-01"
lectio3:
  - "!Rom 5:10-12"
  - "10 Si enim cum inimíci essémus, reconciliáti sumus Deo per mortem Fílii
    ejus: multo magis reconciliáti, salvi érimus in vita ipsíus."
  - "11 Non solum autem: sed et gloriámur in Deo per Dóminum nostrum Jesum
    Christum, per quem nunc reconciliatiónem accépimus."
  - 12 Proptérea sicut per unum hóminem peccátum in hunc mundum intrávit, et per
    peccátum mors, et ita in omnes hómines mors pertránsiit, in quo omnes
    peccavérunt.
responsory3:
