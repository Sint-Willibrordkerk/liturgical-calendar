ant-2:
  - Antequam convenírent, * invénta est María habens in útero de Spíritu Sancto,
    allelúja.
rubrica-cisterciensis/ant-2:
  - Gaude et lætáre, * fília Sion, quia ecce ego vénio, et habitábo in médio
    tui, dicit Dóminus.
ant-3_:
  - "Quǽrite Dóminum, * dum inveníri potest: invocáte eum, dum prope est,
    allelúja."
ant-3c:
