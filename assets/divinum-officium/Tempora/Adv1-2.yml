lectio1:
  - De Isaía Prophéta
  - "!Isa 2:1-3"
  - 1 Verbum, quod vidit Isaías, fílius Amos, super Judam et Jerúsalem.
  - 2 Et erit in novíssimis diébus præparátus mons domus Dómini in vértice
    móntium, et elevábitur super colles; et fluent ad eum omnes gentes.
  - "3 Et ibunt pópuli multi, et dicent: Veníte, et ascendámus ad montem Dómini,
    et ad domum Dei Jacob, et docébit nos vias suas, et ambulábimus in sémitis
    ejus: quia de Sion exíbit lex, et verbum Dómini de Jerúsalem."
responsory1:
  - "R. Montes Israël, ramos vestros expándite, et floréte, et fructus fácite:"
  - "* Prope est ut véniat dies Dómini."
  - "V. Roráte, cæli, désuper, et nubes pluant justum: aperiátur terra, et
    gérminet Salvatórem."
  - R. Prope est ut véniat dies Dómini.
lectio2:
  - "!Isa 2:4-6"
  - "4 Et judicábit gentes, et árguet pópulos multos: et conflábunt gládios suos
    in vómeres, et lánceas suas in falces: non levábit gens contra gentem
    gládium, nec exercebúntur ultra ad prǽlium."
  - 5 Domus Jacob, veníte, et ambulémus in lúmine Dómini.
  - "6 Projecísti enim pópulum tuum, domum Jacob: quia repléti sunt ut olim, et
    áugures habuérunt ut Philísthiim, et púeris aliénis adhæsérunt."
responsory2:
  - "R. Erúmpant montes jucunditátem, et colles justítiam:"
  - "* Quia lux mundi Dóminus cum poténtia venit."
  - V. De Sion exíbit lex, et verbum Dómini de Jerúsalem.
  - R. Quia lux mundi Dóminus cum poténtia venit.
lectio3:
  - "!Isa 2:7-9"
  - "7 Repléta est terra argénto et auro: et non est finis thesaurórum ejus:"
  - "8 et repléta est terra ejus equis: et innumerábiles quadrígæ ejus. Et
    repléta est terra ejus idólis: opus mánuum suárum adoravérunt, quod fecérunt
    dígiti eórum."
  - 9 Et incurvávit se homo, et humiliátus est vir, ne ergo dimíttas eis.
responsory3:
  - R. Ecce ab Austro vénio, ego Dóminus Deus vester,
  - "* Visitáre vos in pace."
  - "V. Aspíciam vos, et créscere fáciam: multiplicabímini, et firmábo pactum
    meum vobíscum."
  - R. Visitáre vos in pace.
  - "&Gloria"
  - R. Visitáre vos in pace.
