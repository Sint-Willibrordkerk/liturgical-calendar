lectio1:
  - De Isaía Prophéta.
  - "!Isa 12:1-6"
  - "1 Et dices in die illa: Confitébor tibi, Dómine, quóniam irátus es mihi;
    convérsus est furor tuus, et consolátus es me."
  - "2 Ecce Deus salvátor meus; fiduciáliter agam, et non timébo: quia fortitúdo
    mea et laus mea Dóminus, et factus est mihi in salútem."
  - 3 Hauriétis aquas in gáudio de fóntibus salvatóris.
  - "4 Et dicétis in die illa: Confitémini Dómino et invocáte nomen ejus; notas
    fácite in pópulis adinventiónes ejus; mementóte quóniam excélsum est nomen
    ejus."
  - 5 Cantáte Dómino, quóniam magnífice fecit; annuntiáte hoc in univérsa terra.
  - 6 Exsúlta et lauda, habitátio Sion, quia magnus in médio tui Sanctus Israël.
responsory1:
  - "@Tempora/Pent01-4:Responsory6"
lectio2:
  - "!Isa 26:1-6"
  - "1 In die illa cantábitur cánticum istud in terra Juda: Urbs fortitúdinis
    nostræ Sion; salvátor ponétur in ea murus et antemurále."
  - 2 Aperíte portas, et ingrediátur gens justa, custódiens veritátem.
  - "3 Vetus error ábiit: servábis pacem; pacem, quia in te sperávimus."
  - 4 Sperástis in Dómino in sǽculis ætérnis; in Dómino Deo forti in perpétuum.
  - "5 Quia incurvábit habitántes in excélso; civitátem sublímem humiliábit:
    humiliábit eam usque ad terram, détrahet eam usque ad púlverem."
  - 6 Conculcábit eam pes, pedes páuperis, gressus egenórum.
responsory2:
  - "R. Ecce vídimus eum non habéntem spéciem, neque decórem: aspéctus ejus in
    eo non est: hic peccáta nostra portávit, et pro nobis dolet: ipse autem
    vulnerátus est propter iniquitátes nostras,"
  - "* Cujus livóre sanáti sumus."
  - V. Vere languóres nostros ipse tulit, et dolóres nostros ipse portávit.
  - R. Cujus livóre sanáti sumus.
lectio3:
  - "!Isa 26:7-9"
  - 7 Sémita justi recta est, rectus callis justi ad ambulándum.
  - "8 Et in sémita judiciórum tuórum, Dómine, sustinúimus te: nomen tuum et
    memoriále tuum in desidério ánimæ."
  - 9 Anima mea desiderávit te in nocte, sed et spíritu meo in præcórdiis meis
    de mane vigilábo ad te. Cum féceris judícia tua in terra, justítiam discent
    habitatóres orbis.
responsory3:
  - "@Tempora/Pent01-0:Responsory2"
lectio4:
  - De Sermóne sancti Bernardi Abbátis.
  - "!Sermo 3. de Passione."
  - "Quia semel venímus ad Cor dulcíssimum Jesu, et bonum est nos hic esse, ne
    sinámus nos fácile avélli ab eo, de quo scriptum est: Recedéntes a te, in
    terra scribéntur. Quid autem accedéntes? Tu ipse doces nos. Tu dixísti
    accedéntibus ad te: Gaudéte, quia nómina vestra scripta sunt in cælo.
    Accedámus ergo ad te, et exsultábimus, et lætábimur in te, mémores Cordis
    tui. O quam bonum et quam jucúndum habitáre in Corde hoc! Quin pótius dabo
    ómnia, omnes cogitatiónes et afféctus mentis commutábo, jactans omne
    cogitátum meum in Cor Dómini Jesu, et sine fallácia illud me enútriet."
responsory4:
  - "@Tempora/Pent01-4:Responsory7"
lectio5:
  - "Ad hoc templum, ad hæc Sancta sanctórum, ad hanc arcam testaménti adorábo,
    et laudábo nomen Dómini, dicens cum David: Invéni cor meum, ut orem Deum
    meum. Et ego invéni Cor regis, fratris, et amíci benígni Jesu. Et numquid
    non adorábo? Hoc ígitur Corde tuo, et meo, dulcíssime Jesu, invénto, orábo
    te Deum meum: admítte tantum in sacrárium exauditiónis tuæ preces meas, imo
    me totum trahe in Cor tuum. O ómnium pulchritúdine speciosíssime Jesu:
    ámplius lava me ab iniquitáte mea, et a peccáto meo munda me: ut purificátus
    per te, ad te puríssimum possim accédere, et in Corde tuo ómnibus diébus
    vitæ meæ mérear habitáre, et ut vidére simul, et fácere tuam váleam
    voluntátem!"
responsory5:
  - "@Tempora/Quad6-6:Responsory1"
lectio6:
  - "Ad hoc enim perforátum est latus tuum, ut nobis patéscat intróitus. Ad hoc
    vulnerátum est Cor tuum, ut in illo, et in te ab exterióribus
    perturbatiónibus absolúti habitáre possímus. Nihilóminus et proptérea
    vulnerátum est, ut per vulnus visíbile vulnus amóris invisíbile videámus.
    Quómodo hic ardor mélius osténdi potest, nisi quod non solum corpus, verum
    étiam ipsum Cor láncea vulnerári permísit? Carnále ergo vulnus, vulnus
    spirituále osténdit. Quis illud Cor tam vulnerátum non díligat? Quis tam
    amans non rédamet? Quis tam castum non amplectátur? Nos ígitur adhuc in
    córpore manéntes, quantum póssumus, amémus, redamémus, amplectámur
    vulnerátum nostrum, cujus ímpii agrícolæ fodérunt manus et pedes, latus et
    Cor: stemúsque, ut cor nostrum, durum adhuc et impœ́nitens, amóris sui
    vínculo constríngere, et jáculo vulneráre dignétur. Quam caritátem Christi
    patiéntis, et pro géneris humáni redemptióne moriéntis, atque in suæ mortis
    commemoratiónem instituéntis sacraméntum córporis et sánguinis sui, ut
    fidéles sub sanctíssimi Cordis sýmbolo devótius ac fervéntius recólant,
    ejusdémque fructus ubérius percípiant, Clemens décimus tértius Póntifex
    Máximus ejúsdem sanctíssimi Cordis festum quibúsdam peténtibus Ecclésiis
    celebráre permísit, ac dénique Summus Póntifex Pius nonus illud ad univérsam
    exténdit Ecclésiam."
responsory6:
  - "@Tempora/Pent01-0"
lectio7:
  - Léctio sancti Evangélii secúndum Joánnem.
  - "!Joannes 19:31-37"
  - "In illo témpore: Judǽi, quóniam parascéve erat, ut non remanérent in cruce
    córpora sábbato (erat enim magnus dies ille sábbati), rogavérunt Pilátum, ut
    frangeréntur eórum crura, et tolleréntur. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi.
  - "!Tractatus 120. in Joánnem."
  - "Unus mílitum láncea latus ejus apéruit, et contínuo exívit sanguis et aqua.
    Vigilánti verbo Evangelísta usus est, ut non díceret: Latus ejus percússit,
    aut vulnerávit, aut quid áliud, sed apéruit; ut illic quodámmodo vitæ óstium
    panderétur, unde sacraménta Ecclésiæ manavérunt, sine quibus ad vitam, quæ
    vera vita est, non intrátur. Ille sanguis qui fusus est, in remissiónem
    fusus est peccatórum. Aqua illa salutáre témperat póculum: hæc et lavácrum
    præstat, et potum. Hoc prænuntiábat quod Noë in látere arcæ óstium fácere
    jussus est, quo intrárent animália, quæ non erant dilúvio peritúra, quibus
    præfigurabátur Ecclésia."
responsory7:
  - "@Tempora/Pent01-4:Responsory8"
lectio8:
  - De Homilía sancti Joánnis Chrysóstomi.
  - "!Hom. 84."
  - "Vides quanti sit véritas? Per ea quæ Judǽi fáciunt prophetía implétur: ália
    enim ex hoc manifestáta est. Venérunt ergo mílites, et aliórum fregérunt
    crura, non Christi; sed ad Judæórum grátiam conciliándam, latus ejus láncea
    aperuérunt, et mórtuo adhuc insúltant. O péssimam voluntátem ac
    scelestíssimam! Noli tamen perturbári, o dilectíssime! quæ enim malo illi
    ánimo patrarunt, veritáti consentiébant. Prophetía hinc impléta est,
    inquiens: Vidébunt in quem transfixérunt. Neque hoc tantum, sed non
    creditúris fuit fídei arguméntum, ut Thomæ, et qui cum eo erant. Ad hæc et
    arcánum mystérium confirmátum est: exívit enim sanguis et aqua. Non casu et
    simplíciter hi fontes scaturiérunt, sed quóniam ex ambobus Ecclésia
    constitúta est."
responsory8:
  - "R. Recéssit Pastor noster, fons aquæ vivæ, ad cujus tránsitum sol
    obscurátus est:"
  - "* Portas mortis, et seras páriter Salvátor noster disrúpit."
  - V. Destrúxit quidem claustra inférni, et subvértit poténtias diáboli.
  - R. Portas mortis, et seras páriter Salvátor noster disrúpit.
  - "&Gloria"
  - R. Portas mortis, et seras páriter Salvátor noster disrúpit.
lectio9:
  - "!De Homilía sancti Bonaventúræ Epíscopi."
  - "!Liber de ligno Vitæ."
  - Porro ut de látere Christi dormiéntis formarétur Ecclésia, divína est
    ordinatióne indúltum, ut unus mílitum láncea latus sacrum illud aperiéndo
    perfóderet, quátenus sánguine cum aqua manénte prétium effunderétur nostræ
    salútis, quod a fonte scílicet Cordis arcáno profúsum, vim daret sacraméntis
    Ecclésiæ ad vitam grátiæ conferéndam, essétque jam in Christo vivéntibus
    póculum fontis vivi, saliéntis in vitam ætérnam. Surge ígitur ánima amíca
    Christi, vigiláre non cesses, ibi os appóne, ut háurias aquas de fóntibus
    Salvatóris.
  - "&teDeum"
