introitus:
  - "!Jer. in Thren. 3"
  - "v. Miserebitur secundum multitudinem misericordiarum suarum: non enim
    humiliavit ex corde suo et abiecit filios hominum: bonus est Dominus
    sperantibus in eum animae quaerenti illum."
  - "!Ps. 88"
  - Misericordias Domini in aeternum cantabo in generationem et generationem.
  - "&Gloria"
  - "v. Miserebitur secundum multitudinem misericordiarum suarum: non enim
    humiliavit ex corde suo et abiecit filios hominum: bonus est Dominus
    sperantibus in eum animae quaerenti illum."
oratio:
  - "Concede, quaesumus omnipotens Deus: ut qui in sanctissimo dilecti Filii tui
    Corde gloriantes, parecipua in nos caritatis eius beneficia recolimus: eorum
    partier et actu delectemur, et fructu."
  - $Per eundem
lectio:
  - "!c. 12"
  - Confitebor tibi Domine quoniam iratus es mihi conversus est furor tuus et
    consolatus es me. Ecce Deus salvator meus fiducialiter agam et non timebo
    quia fortitudo mea et laus mea Dominus Deus et factus est mihi in salute.
    Haurietis aquas in gaudio de fontibus salvatoris. Et dicetis in illa die
    confitemini Domino et invocate nomen eius notas facite in populis
    adinventiones eius mementote quoniam excelsum est nomen eius Cantate Domino
    quoniam magnifice fecit adnuntiate hoc in universa terra. Exulta et lauda
    habitatio Sion quia magnus in medio tui Sanctus Israel.
graduale:
  - "!Jer. In Thren. 1"
  - O vos omnes qui transitis per viam adtendite et videte si est dolor sicut
    dolor meus.
  - "!Joan. 13"
  - Cum dilexisset suos qui erant in mundo in finem dilexit eos.
  - "!Matt. 13"
  - Alleluia, Alleluia. Discite a me quia mitis sum et humilis corde et
    invenietis requiem animabus vestris. Alleluia.
gradualep:
  - "!Ps. 29"
  - "Alleluia, Alleluia. Domine Deus meus clamavi ad te et sanasti me: eduxisti
    ab inferno animam meam. Alleluia."
  - V. Convertisti planctum meum in gaudium mihi; conscidisti saccum meum et
    circumdedisti me laetitia. Alleluia.
tractus:
  - "!Ps. 68"
  - "Improperium expectavit cor meum et miseriam: et sistinui qui simul
    contristaretur, et non fuit: et qui consolaretur et non inveni."
  - "!Ps. 21"
  - "Ego autem sum vermis et non homo: opprobrium hominum et abiectio plebes."
  - "V. Omnes videntes me deriserunt me: locuti sunt labiis moverunt caput."
  - V. Sicut aqua effusus sum et dispersa sunt universa ossa mea factum est cor
    meum tamquam cera liquescens in medio ventris mei.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joannes 19:31-37"
  - "In illo témpore: Judǽi - quóniam Parascéve erat, - ut non remanérent in
    cruce córpora sábbato - erat enim magnus dies ille sábbati, - rogavérunt
    Pilátum, ut frangeréntur eórum crura, et tolleréntur. Venérunt ergo mílites:
    et primi quidem fregérunt crura et alteríus, qui crucifíxus est cum eo. Ad
    Jesum autem cum veníssent, ut vidérunt eum jam mórtuum, non fregérunt ejus
    crura, sed unus mílitum láncea latus ejus apéruit, et contínuo exívit
    sanguis et aqua. Et qui vidit, testimónium perhíbuit: et verum est
    testimónium ejus."
offertorium:
  - "!Ps. 102"
  - Benedic anima mea Domino, et noli oblivisci omnes retributiones ejus, qui
    replet in bonis desiderium tuum, alleluia.
secreta:
  - "Tuere nos, Domine, tua tibi holocausta offerentes: ad quae ut ferventius
    corda nostra praeparantur, flammis adiire tuae divinae caritatis:"
  - $Qui vivis
communio:
  - "!Ps. 68"
  - "Improperium exspedtavit cor meum, et miseriam: et sustinui qui simul
    contristaretur, et non fuit: et qui consolaretur, et non inveni, alleluia."
postcommunio:
  - "Pacificis pasti delicis, et salutaribus sacramentis, te supplices exoramus,
    Domine Deus noster: ut, qui mitis es et humilis corde, nos a vitiorum labe
    purgatos, propensius facias a superbis saeculi vanitatibus abhorrere."
  - $Qui vivis
