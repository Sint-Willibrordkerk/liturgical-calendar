introitus:
  - "!Ps 34:1-2."
  - "v. Júdica, Dómine, nocéntes me, expúgna impugnántes me: apprehénde arma et
    scutum, et exsúrge in adjutórium meum, Dómine, virtus salútis meæ."
  - "!Ps 34:3"
  - "Effúnde frámeam, et conclúde advérsus eos, qui persequúntur me: dic ánimæ
    meæ: Salus tua ego sum."
  - "v. Júdica, Dómine, nocéntes me, expúgna impugnántes me: apprehénde arma et
    scutum, et exsúrge in adjutórium meum, Dómine, virtus salútis meæ."
oratio:
  - "Da, quǽsumus, omnípotens Deus: ut, qui in tot advérsis ex nostra
    infirmitáte defícimus; intercedénte unigéniti Fílii tui passióne
    respirémus:"
  - $Qui tecum
lectio:
  - Léctio Isaíæ Prophétæ
  - "!Isa 50:5-10"
  - "In diébus illis: Dixit Isaías: Dóminus Deus apéruit mihi aurem, ego autem
    non contradíco: retrórsum non ábii. Corpus meum dedi percutiéntibus et genas
    meas velléntibus: fáciem meam non avérti ab increpántibus et conspuéntibus
    in me. Dóminus Deus auxiliátor meus, ídeo non sum confúsus: ídeo posui
    fáciem meam ut petram duríssimam, et scio, quóniam non confúndar. Juxta est,
    qui justíficat me, quis contradícet mihi? Stemus simul, quis est adversárius
    meus? Accédat ad me. Ecce, Dóminus Deus auxiliátor meus: quis est, qui
    condémnet me? Ecce, omnes quasi vestiméntum conteréntur, tinea cómedet eos.
    Quis ex vobis timens Dóminum, áudiens vocem servi sui? Qui ambulávit in
    ténebris, et non est lumen ei, speret in nómine Dómini, et innitátur super
    Deum suum."
graduale:
  - "!Ps 34:23 et 3"
  - Exsúrge, Dómine, et inténde judício meo, Deus meus et Dóminus meus, in
    causam meam.
  - V. Effúnde frámeam, et conclúde advérsus eos, qui me persequúntur.
  - _
  - "!Tractus"
  - "!Ps 102:10"
  - "Dómine, non secúndum peccáta nostra, quæ fécimus nos: neque secúndum
    iniquitátes nostras retríbuas nobis"
  - "!Ps 78:8-9"
  - "Dómine, ne memíneris iniquitátum nostrárum antiquárum: cito antícipent nos
    misericórdiæ tuæ, quia páuperes facti sumus nimis. (Hic genuflectitur)"
  - "V. Adjuva nos, Deus, salutáris noster: et propter glóriam nóminis tui,
    Dómine, líbera nos: et propítius esto peccátis nostris, propter nomen tuum."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem.
  - "!Joann 12:1-9"
  - "Ante sex dies Paschæ venit Jesus Bethániam, ubi Lázarus fúerat mórtuus,
    quem suscitávit Jesus. Fecérunt autem ei cenam ibi: et Martha ministrábat,
    Lázarus vero unus erat ex discumbéntibus cum eo. María ergo accépit libram
    unguénti nardi pístici pretiósi, et unxit pedes Jesu, et extérsit pedes ejus
    capíllis suis: et domus impléta est ex odóre unguénti. Dixit ergo unus ex
    discípulis ejus, Judas Iscariótes, qui erat eum traditúrus: Quare hoc
    unguéntum non véniit trecéntis denáriis, et datum est egénis? Dixit autem
    hoc, non quia de egénis pertinébat ad eum, sed quia fur erat, et lóculos
    habens, ea, quæ mittebántur, portábat. Dixit ergo Jesus: Sínite illam, ut in
    diem sepultúræ meæ servet illud. Páuperes enim semper habétis vobíscum: me
    autem non semper habétis. Cognóvit ergo turba multa ex Judǽis, quia illic
    est: et venérunt, non propter Jesum tantum, sed ut Lázarum vidérent, quem
    suscitávit a mórtuis."
offertorium:
  - "!Ps 142:9-10"
  - "Eripe me de inimícis meis, Dómine: ad te confúgi, doce me fácere voluntátem
    tuam: quia Deus meus es tu."
secreta:
  - Hæc sacrifícia nos, omnípotens Deus, poténti virtúte mundátos, ad suum
    fáciant purióres veníre princípium.
  - $Per Dominum
communio:
  - "!Ps 34:26"
  - "Erubéscant et revereántur simul, qui gratulántur malis meis: induántur
    pudóre et reveréntia, qui malígna loquúntur advérsus me."
postcommunio:
  - "Prǽbeant nobis, Dómine, divínum tua sancta fervórem: quo eórum páriter et
    actu delectémur et fructu."
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Adjuva nos, Deus, salutáris noster: et ad benefícia recolénda, quibus
    nos instauráre dignátus es, tríbue veníre gaudéntes."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 12:1-9"
  - Ante sex dies Paschæ venit Jesus Bethániam, ubi Lázarus fúerat mórtuus, quem
    suscitávit Jesus. Et réliqua.
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tractus 50 in Joann., post initium"
  - "Ne putárent hómines phantásma esse factum, quia mórtuus resurréxit, Lázarus
    unus erat ex recumbéntibus: vivébat, loquebátur, epulabátur, véritas
    ostendebátur, infidélitas Judæórum confundebátur. Discumbébat ergo Jesus cum
    Lázaro, et céteris: ministrábat Martha, una ex soróribus Lázari. María vero,
    áltera soror Lázari, accépit libram unguénti nardi pístici pretiósi, et
    unxit pedes Jesu, et extérsit capíllis suis pedes ejus, et domus impléta est
    ex odóre unguénti. Factum audívimus: mystérium requirámus."
responsory1:
  - "R. Viri ímpii dixérunt: Opprimámus virum justum injúste, et deglutiámus eum
    tamquam inférnus vivum: auferámus memóriam illíus de terra: et de spóliis
    ejus sortem mittámus inter nos: ipsi enim homicídæ thesaurizavérunt sibi
    mala."
  - "* Insipiéntes et malígni odérunt sapiéntiam: et rei facti sunt in
    cogitatiónibus suis."
  - "V. Hæc cogitavérunt, et erravérunt: et excæcávit illos malítia eórum."
  - "R. Insipiéntes et malígni odérunt sapiéntiam: et rei facti sunt in
    cogitatiónibus suis."
lectio2:
  - "Quæcúmque ánima fidélis vis esse, cum María unge pedes Dómini pretióso
    unguénto. Unguéntum illud justítia fuit, ídeo libra fuit: erat autem
    unguéntum nardi pístici pretiósi. Quod ait, pístici, locum áliquem crédere
    debémus, unde hoc erat unguéntum pretiósum: nec tamen hoc vacat, et
    sacraménto óptime cónsonat. Pistis Græce, fides Latíne dícitur. Quærébas
    operári justítiam. Justus ex fide vivit. Unge pedes Jesu bene vivéndo:
    Domínica sectáre vestígia. Capíllis terge: si habes supérflua, da
    paupéribus, et Dómini pedes tersísti: capílli enim supérflua córporis
    vidéntur. Habes quod agas de supérfluis tuis: tibi supérflua sunt, sed
    Dómini pédibus necessária sunt. Forte in terra Dómini pedes índigent."
responsory2:
  - "R. Oppróbrium factus sum nimis inimícis meis: vidérunt me, et movérunt
    cápita sua:"
  - "* Adjuva me, Dómine, Deus meus."
  - V. Locúti sunt advérsum me lingua dolósa, et sermónibus ódii circumdedérunt
    me.
  - R. Adjuva me, Dómine, Deus meus.
lectio3:
  - "De quibus enim, nisi de membris suis in fine dictúrus est: Cum uni ex
    mínimis meis fecístis, mihi fecístis? Supérflua vestra impendístis: sed
    pédibus meis obsecúti estis. Domus autem impléta est odóre: mundus implétus
    est fama bona: nam odor bonus, fama bona est. Qui male vivunt, et Christiáni
    vocántur, injúriam Christo fáciunt: de quálibus dictum est, quod per eos
    nomen Dómini blasphemátur. Si per tales nomen Dei blasphemátur, per bonos
    nomen Dómini laudátur. Audi Apóstolum: Christi bonus odor sumus, inquit, in
    omni loco."
responsory3:
  - "R. Insurrexérunt in me viri iníqui absque misericórdia, quæsiérunt me
    interfícere: et non pepercérunt in fáciem meam spúere, et lánceis suis
    vulneravérunt me: et concússa sunt ómnia ossa mea:"
  - "* Ego autem existimábam me tamquam mórtuum super terram."
  - "V. Effudérunt furórem suum in me: fremuérunt contra me déntibus suis."
  - R. Ego autem existimábam me tamquam mórtuum super terram.
  - "&Gloria"
  - "R. Insurrexérunt in me viri iníqui absque misericórdia, quæsiérunt me
    interfícere: et non pepercérunt in fáciem meam spúere, et lánceis suis
    vulneravérunt me: et concússa sunt ómnia ossa mea: * Ego autem existimábam
    me tamquam mórtuum super terram."
