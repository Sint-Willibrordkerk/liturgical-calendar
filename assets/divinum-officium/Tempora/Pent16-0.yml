introitus:
  - "!Ps 85:3; 85:5"
  - "v. Miserére mihi, Dómine, quóniam ad te clamávi tota die: quia tu, Dómine,
    suávis ac mitis es, et copiósus in misericórdia ómnibus invocántibus te."
  - "!Ps 85:1"
  - "Inclína, Dómine, aurem tuam mihi, et exáudi me: quóniam inops, et pauper
    sum ego."
  - "&Gloria"
  - "v. Miserére mihi, Dómine, quóniam ad te clamávi tota die: quia tu, Dómine,
    suávis ac mitis es, et copiósus in misericórdia ómnibus invocántibus te."
oratio:
  - "Tua nos, quǽsumus, Dómine, grátia semper et prævéniat et sequátur: ac bonis
    opéribus júgiter præstet esse inténtos."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Ephésios
  - "!Ephes 3:13-21"
  - "Fratres: Obsecro vos, ne deficiátis in tribulatiónibus meis pro vobis: quæ
    est glória vestra. Hujus rei grátia flecto génua mea ad Patrem Dómini nostri
    Jesu Christi, ex quo omnis patérnitas in cœlis et in terra nominátur, ut det
    vobis secúndum divítias glóriæ suæ, virtúte corroborári per Spíritum ejus in
    interiórem hóminem, Christum habitáre per fidem in córdibus vestris: in
    caritáte radicáti et  fundáti, ut póssitis comprehéndere cum ómnibus
    sanctis, quæ sit latitúdo et longitúdo et sublímitas et profúndum: scire
    étiam supereminéntem sciéntiæ caritátem Christi, ut impleámini in omnem
    plenitúdinem Dei. Ei autem, qui potens est ómnia fácere superabundánter,
    quam pétimus aut intellégimus, secúndum virtútem, quæ operátur in nobis:
    ipsi glória in Ecclésia et in Christo Jesu, in omnes generatiónes sǽculi
    sæculórum. Amen."
graduale:
  - "!Ps 101:16-17"
  - Timébunt gentes nomen tuum, Dómine, et omnes reges terræ glóriam tuam.
  - V. Quóniam ædificávit Dóminus Sion, et vidébitur in majestáte sua. Allelúja,
    allelúja
  - "!Ps 97:1"
  - "Cantáte Dómino cánticum novum: quia mirabília fecit Dóminus. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam.
  - "!Luc 14:1-11"
  - "In illo témpore: Cum intráret Jesus in domum cujúsdam príncipis pharisæórum
    sábbato manducáre panem, et ipsi observábant eum. Et ecce, homo quidam
    hydrópicus erat ante illum. Et respóndens Jesus dixit ad legisperítos et
    pharisǽos, dicens: Si licet sábbato curáre? At illi tacuérunt. Ipse vero
    apprehénsum sanávit eum ac dimísit. Et respóndens ad illos, dixit: Cujus
    vestrum ásinus aut bos in púteum cadet, et non contínuo éxtrahet illum die
    sábbati? Et non póterant ad hæc respóndere illi. Dicebat autem et ad
    invitátos parábolam, inténdens, quómodo primos accúbitus elígerent, dicens
    ad illos: Cum invitátus fúeris ad núptias, non discúmbas in primo loco, ne
    forte honorátior te sit invitátus ab illo, et véniens is, qui te et illum
    vocávit, dicat tibi: Da huic locum: et tunc incípias cum rubóre novíssimum
    locum tenére. Sed cum vocátus fúeris, vade, recúmbe in novíssimo loco: ut,
    cum vénerit, qui te invitávit, dicat tibi: Amíce, ascénde supérius. Tunc
    erit tibi glória coram simul discumbéntibus: quia omnis, qui se exáltat,
    humiliábitur: et qui se humíliat, exaltábitur."
offertorium:
  - "!Ps 39:14; 39:15"
  - "Dómine, in auxílium meum réspice: confundántur et revereántur, qui quærunt
    ánimam meam, ut áuferant eam: Dómine, in auxílium meum réspice."
secreta:
  - "Munda nos, quǽsumus, Dómine, sacrifícii præséntis efféctu: et pérfice
    miserátus in nobis; ut ejus mereámur esse partícipes."
  - $Per Dominum
communio:
  - "!Ps 70:16-17; 70:18"
  - "Dómine, memorábor justítiæ tuæ solíus: Deus, docuísti me a juventúte mea:
    et usque in senéctam et sénium, Deus, ne derelínquas me."
postcommunio:
  - "Purífica, quǽsumus, Dómine, mentes nostras benígnus, et rénova cœléstibus
    sacraméntis: ut consequénter et córporum præsens páriter et futúrum capiámus
    auxílium."
  - $Per Dominum
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 14:1-11"
  - "In illo témpore: Cum intráret Jesus in domum cujúsdam príncipis pharisæórum
    sábbato manducáre panem, et ipsi observábant eum. Et ecce homo quidam
    hydrópicus erat ante illum. Et réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Liber 7 in Lucæ cap. 14"
  - "Curátur hydrópicus, in quo fluxus carnis exúberans ánimæ gravábat offícia,
    spíritus exstinguébat ardórem. Deínde docétur humílitas, dum in illo
    convívio nuptiáli appeténtia loci superióris arcétur; cleménter tamen, ut
    persuásio humanitátis aspertitátem coërcitiónis exclúderet, rátio profíceret
    ad persuasiónis efféctum, et corréctio emendáret afféctum. Huic quasi
    próximo límine humánitas copulátur: quæ ita Domínicæ senténtiæ definitióne
    distínguitur, si in páuperes et débiles conferátur: nam hospitálem esse
    remuneratúris, afféctus avarítiæ est."
lectio8:
  - "Postrémo jam quasi eméritæ milítiæ viro contemnendárum stipéndium
    præscríbitur facultátum: quod neque ille, qui stúdiis inténtus inferióribus
    possessiónes sibi terrénas coémit, regnum cæli possit adipísci, cum Dóminus
    dicat: Vende ómnia tua, et séquere me: nec ille, qui emit boves, cum Eliséus
    occíderit, et pópulo divíserit quos habébat: et ille qui duxit uxórem,
    cógitet quæ mundi sunt, non quæ Dei. Non quo conjúgium reprehendátur, sed
    quia ad majórem honórem vocétur intégritas: quóniam múlier innúpta et vídua
    cógitat quæ sunt Dómini, ut sit sancta córpore et spíritu."
lectio9:
  - "Sed ut in grátiam, ut supra cum víduis, ita nunc étiam cum conjúgibus
    revertámur: non refúgimus opiniónem, quam sequúntur pleríque, ut tria génera
    hóminum a consórtio magnæ illíus cœnæ æstimémus exclúdi: Gentílium,
    Judæórum, Hæreticórum. Et ídeo Apóstolus avarítiam dicit esse fugiéndam; ne
    impedíti more Gentíli, iniquitáte, malítia, impudicítia, avarítia, ad regnum
    Christi perveníre nequeámus. Omnis enim immúndus aut avárus, quod est
    idolórum sérvitus, non habet hereditátem in regno Christi et Dei."
  - "&teDeum"
