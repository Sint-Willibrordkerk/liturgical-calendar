introitus:
  - "v. Salus pópuli ego sum, dicit Dóminus: de quacúmque tribulatióne
    clamáverint ad me, exáudiam eos: et ero illórum Dóminus in perpétuum."
  - "!Ps 77:1"
  - "Attendite, pópule meus, legem meam: inclináte aurem vestram in verba oris
    mei."
  - "&Gloria"
  - "v. Salus pópuli ego sum, dicit Dóminus: de quacúmque tribulatióne
    clamáverint ad me, exáudiam eos: et ero illórum Dóminus in perpétuum."
oratio:
  - "Omnípotens et miséricors Deus, univérsa nobis adversántia propitiátus
    exclúde: ut mente et córpore páriter expedíti, quæ tua sunt, líberis
    méntibus exsequámur."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Ephésios
  - "!Ephes 4:23-28"
  - "Fratres: Renovámini spíritu mentis vestræ, et indúite novum hóminem, qui
    secúndum Deum creátus est in justítia et sanctitáte veritátis. Propter quod
    deponéntes mendácium, loquímini veritátem unusquísque cum próximo suo:
    quóniam sumus ínvicem membra. Irascímini, et nolíte peccáre: sol non occídat
    super iracúndiam vestram. Nolíte locum dare diábolo: qui furabátur, jam non
    furétur; magis autem labóret, operándo mánibus suis, quod bonum est, ut
    hábeat, unde tríbuat necessitátem patiénti."
graduale:
  - "!Ps 140:2"
  - Dirigátur orátio mea, sicut incénsum in conspéctu tuo, Dómine.
  - V. Elevatio mánuum meárum sacrifícium vespertínum. Allelúja, allelúja
  - "!Ps 104:1"
  - "Confitémini Dómino, et invocáte nomen ejus: annuntiáte inter gentes ópera
    ejus. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 22:1-14"
  - "In illo témpore: Loquebátur Jesus princípibus sacerdótum et pharisǽis in
    parábolis, dicens: Símile factum est regnum cœlórum hómini regi, qui fecit
    núptias fílio suo. Et misit servos suos vocáre invitátos ad nuptias, et
    nolébant veníre. Iterum misit álios servos, dicens: Dícite invitátis: Ecce,
    prándium meum parávi, tauri mei et altília occísa sunt, et ómnia paráta:
    veníte ad núptias. Illi autem neglexérunt: et abiérunt, álius in villam
    suam, álius vero ad negotiatiónem suam: réliqui vero tenuérunt servos ejus,
    et contuméliis afféctos occidérunt. Rex autem cum audísset, iratus est: et,
    missis exercítibus suis, pérdidit homicídas illos et civitátem illórum
    succéndit. Tunc ait servis suis: Núptiæ quidem parátæ sunt, sed, qui
    invitáti erant, non fuérunt digni. Ite ergo ad exitus viárum et, quoscúmque
    invenéritis, vocáte ad núptias. Et egréssi servi ejus in vias,
    congregavérunt omnes, quos invenérunt, malos et bonos: et implétæ sunt
    núptiæ discumbéntium. Intrávit autem rex, ut vidéret discumbéntes, et vidit
    ibi hóminem non vestítum veste nuptiáli. Et ait illi: Amíce, quómodo huc
    intrásti non habens vestem nuptiálem? At ille obmútuit. Tunc dixit rex
    minístris: Ligátis mánibus et pédibus ejus, míttite eum in ténebras
    exterióres: ibi erit fletus et stridor déntium. Multi enim sunt vocáti,
    pauci vero elécti."
offertorium:
  - "!Ps 137:7"
  - "Si ambulávero in médio tribulatiónis, vivificábis me, Dómine: et super iram
    inimicórum meórum exténdes manum tuam, et salvum me fáciet déxtera tua."
secreta:
  - Hæc múnera, quǽsumus, Dómine, quæ óculis tuæ majestátis offérimus, salutária
    nobis esse concéde.
  - $Per Dominum
communio:
  - "!Ps 118:4-5"
  - "Tu mandásti mandáta tua custodíri nimis: útinam dirigántur viæ meæ, ad
    custodiéndas justificatiónes tuas."
postcommunio:
  - Tua nos, Dómine, medicinális operátio, et a nostris perversitátibus
    cleménter expédiat, et tuis semper fáciat inhærére mandátis.
  - $Per Dominum
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 22:1-14"
  - "In illo témpore: Loquebátur Jesus princípibus sacerdótum et pharisǽis in
    parábolis, dicens: Símile factum est regnum cælórum hómini regi, qui fecit
    núptias fílio suo. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 38 in Evangelia, post initium"
  - "Sæpe jam me dixísse mémini, quod plerúmque in sancto Evangélio regnum
    cælórum præsens Ecclésia nominátur: congregátio quippe justórum, regnum
    cælórum dícitur. Quia enim per prophétam Dóminus dicit: Cælum mihi sedes
    est; et Sálomon ait: Anima justi sedes sapiéntiæ; Paulus étiam dicit
    Christum Dei virtútem, et Dei sapiéntiam: líquido collígere debémus, quia si
    Deus sapiéntia, ánima autem justi, sedes sapiéntiæ, dum cælum dícitur sedes
    Dei, cælum ergo est ánima justi. Hinc per Psalmístam de sanctis
    prædicatóribus dícitur: Cæli enárrant glóriam Dei."
lectio8:
  - "Regnum ergo cælórum est Ecclésia justórum: quia dum eórum corda in terra
    nil ámbiunt, per hoc quod ad supérna suspírant, jam in eis Dóminus quasi in
    cæléstibus regnat. Dicátur ergo: Símile est regnum cælórum hómini regi, qui
    fecit núptias fílio suo. Jam intélligit cáritas vestra, quis est iste Rex,
    Regis fílii pater: ille nimírum, cui Psalmísta ait: Deus judícium tuum Regi
    da, et justítiam tuam fílio Regis. Qui fecit núptias fílio suo. Tunc enim
    Deus Pater Deo Fílio suo núptias fecit, quando hunc in útero Vírginis humánæ
    natúræ conjúnxit, quando Deum ante sǽcula fíeri vóluit hóminem in fine
    sæculórum."
lectio9:
  - "Sed quia ex duábus persónis fíeri solet ista nuptiális conjúnctio; absit
    hoc ab intelléctibus nostris, ut persónam Dei et hóminis Redemptóris nostri
    Jesu Christi, ex duábus persónis credámus unítam. Ex duábus quippe atque in
    duábus hunc natúris exsístere dícimus; sed ex duábus persónis compósitum
    credi, ut nefas vitámus. Apértius ergo atque secúrius dici potest, quia in
    hoc Pater Regi Fílio núptias fecit, quo ei per incarnatiónis mystérium
    sanctam Ecclésiam sociávit. Uterus autem Genitrícis Vírginis, hujus sponsi
    thálamus fuit. Unde et Psalmísta dicit: In sole pósuit tabernáculum suum, et
    ipse tamquam sponsus procédens de thálamo suo."
  - "&teDeum"
ant-2:
  - "Dícite invitátis: * Ecce prándium meum parávi, veníte ad núptias, allelúja."
ant-3:
