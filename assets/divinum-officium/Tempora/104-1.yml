lectio1:
  - De libro secúndo Machabæórum
  - "!2 Mac 2:1-3"
  - 1 Invenítur autem in descriptiónibus Jeremíæ prophétæ, quod jussit eos ignem
    accípere qui transmigrábant, ut significátum est, et ut mandávit
    transmigrátis,
  - 2 et dedit illis legem, ne oblivisceréntur præcépta Dómini, et ut non
    exerrárent méntibus, vidéntes simulácra áurea et argéntea, et ornaménta
    eórum;
  - 3 et ália hujúsmodi dicens, hortabátur ne legem amovérent a corde suo.
responsory1:
  - "@Tempora/101-1:Responsory1"
lectio2:
  - "!2 Mac 2:4-6"
  - 4 Erat autem in ipsa scriptúra, quómodo tabernáculum et arcam jussit
    prophéta, divíno respónso ad se facto, comitári secum, úsquequo éxiit in
    montem, in quo Móyses ascéndit, et vidit Dei hereditátem.
  - "5 Et véniens ibi Jeremías, invénit locum spelúncæ: et tabernáculum, et
    arcam, et altáre incénsi íntulit illuc, et óstium obstrúxit."
  - "6 Et accessérunt quidam simul, qui sequebántur, ut notárent sibi locum: et
    non potuérunt inveníre."
responsory2:
  - "@Tempora/101-1:Responsory2"
lectio3:
  - "!2 Mac 2:7-9"
  - "7 Ut autem cognóvit Jeremías, culpans illos dixit: quod ignótus erit locus,
    donec cóngreget Deus congregatiónem pópuli, et propítius fiat;"
  - 8 et tunc Dóminus osténdet hæc, et apparébit majéstas Dómini, et nubes erit,
    sicut et Móysi manifestabátur, et sicut, cum Sálomon pétiit ut locus
    sanctificarétur magno Deo, manifestábat hæc;
  - "9 magnífice étenim sapiéntiam tractábat: et ut sapiéntiam habens, óbtulit
    sacrifícium dedicatiónis et consummatiónis templi."
responsory3:
  - "@Tempora/101-1:Responsory3"
