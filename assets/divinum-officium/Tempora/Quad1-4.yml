lectio:
  - Léctio Ezechiélis Prophétæ
  - "!Ezech 18:1-9"
  - "In diébus illis: Factus est sermo Dómini ad me, dicens: Quid est, quod
    inter vos parábolam vértitis in provérbium istud in terra Israël, dicéntes:
    Patres comedérunt uvam acérbam, et dentes filiórum obstupéscunt? Vivo ego,
    dicit Dóminus Deus, si erit ultra vobis parábola hæc in provérbium in
    Israël. Ecce, omnes ánimæ meæ sunt: ut ánima patris, ita et ánima fílii mea
    est: ánima, quæ peccáverit, ipsa moriétur. Et vir si fúerit justus, et
    fécerit judícium et justítiam, in móntibus non coméderit, et óculos suos non
    leváverit ad idóla domus Israël: et uxórem próximi sui non violáverit, et ad
    mulíerem menstruátam non accésserit: et hóminem non contristáverit: pignus
    debitóri reddíderit, per vim nihil rapúerit: panem suum esuriénti déderit,
    et nudum operúerit vestiménto: ad usúram non commodáverit, et ámplius non
    accéperit: ab iniquitáte avértent manum suam, et judícium verum fécerit
    inter virum et virum: in præcéptis meis ambuláverit, et judícia mea
    custodíerit, ut fáciat veritátem: hic justus est, vita vivet, ait Dóminus
    omnípotens."
graduale:
  - "!Ps 16:8; 16:2"
  - "Custódi me, Dómine, ut pupíllam óculi: sub umbra alárum tuárum prótege me."
  - "V. De vultu tuo judícium meum pródeat: óculi tui vídeant æquitátem."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 15:21-28"
  - "In illo témpore: Egréssus Jesus secéssit in partes Tyri et Sidónis. Et
    ecce, múlier Chananǽa a fínibus illis egréssa clamávit, dicens ei: Miserére
    mei, Dómine, fili David: fília mea male a dæmónio vexátur. Qui non respóndit
    ei verbum. Et accedéntes discípuli ejus rogábant eum, dicéntes: Dimítte eam;
    quia clamat post nos. Ipse autem respóndens, ait: Non sum missus nisi ad
    oves, quæ periérunt domus Israël. At illa venit, et adorávit eum, dicens:
    Dómine, ádjuva me. Qui respóndens, ait: Non est bonum súmere panem filiórum,
    et míttere cánibus. At illa dixit: Etiam, Dómine: nam et catélli edunt de
    micis, quæ cadunt de mensa dominórum suórum. Tunc respóndens Jesus, ait
    illi: O múlier, magna est fides tua: fiat tibi, sicut vis. Et sanáta est
    fília ejus ex illa hora."
offertorium:
  - "!Ps 33:8-9"
  - "Immíttet Angelus Dómini in circúitu timéntium eum, et erípiet eos: gustáte,
    et vidéte, quóniam suávis est Dóminus."
secreta:
  - Sacrifícia, Dómine, quǽsumus, propénsius ista nos salvent, quæ medicinálibus
    sunt institúta jejúniis.
  - $Per Dominum
communio:
  - "!Joann 6:52"
  - Panis, quem ego dédero, caro mea est pro sǽculi vita.
postcommunio:
  - Tuórum nos, Dómine, largitáte donórum, et temporálibus attólle præsídiis, et
    rénova sempitérnis.
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - V. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Da, quǽsumus, Dómine, pópulis christiánis: et, quæ profiténtur,
    agnóscere, et cœléste munus dilígere, quod frequéntant."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 15:21-28"
  - "In illo témpore: Egréssus Jesus secéssit in partes Tyri et Sidónis. Et
    réliqua."
  - _
  - Homilía sancti Hierónymi Presbýteri
  - "!Liber 2 Comm. in cap. 15. Matthæi"
  - Scribis et pharisǽis calumniatóribus derelíctis, transgréditur in partes
    Tyri et Sidónis, ut Týrios Sidoniósque curáret. Múlier autem Chananǽa
    egréditur de fínibus prístinis, ut clamans fíliæ ímpetret sanitátem. Obsérva
    quod in quintodécimo loco fília Chananǽæ sanétur. Miserére mei, Dómine, Fili
    David. Inde novit vocáre Fílium David, quia egréssa jam fúerat de fínibus
    suis, et errórem Tyriórum ac Sidoniórum loci et fídei commutatióne
    dimíserat.
responsory1:
  - "R. Tribulárer, si nescírem misericórdias tuas, Dómine; tu dixísti: Nolo
    mortem peccatóris, sed ut magis convertátur et vivat:"
  - "* Qui Chananǽam et publicánum vocásti ad pœniténtiam."
  - V. Secúndum multitúdinem dolórum meórum in corde meo, consolatiónes tuæ
    lætificavérunt ánimam meam.
  - R. Qui Chananǽam et publicánum vocásti ad pœniténtiam.
lectio2:
  - "Fília mea male a dæmónio vexátur. Ego fíliam Chananǽæ puto ánimas esse
    credéntium, quæ male a dæmónio vexabántur, ignorántes Creatórem, et
    adorántes lápidem. Qui non respóndit ei verbum: non de supérbia pharisáica,
    nec de scribárum supercílio: sed ne ipse senténtiæ suæ viderétur esse
    contrárius, per quam jússerat: In viam géntium ne abiéritis, et in civitátes
    Samaritanórum ne intravéritis. Nolébat enim occasiónem calumniatóribus dare:
    perfectámque salútem géntium passiónis et resurrectiónis témpori
    reservábat."
responsory2:
  - "@Tempora/Quad1-0:Responsory2"
lectio3:
  - "Et accedéntes discípuli ejus, rogábant eum, dicéntes: Dimítte eam, quia
    clamat post nos. Discípuli illo adhuc témpore mystéria Dómini nesciéntes,
    vel misericórdia commóti, rogábant pro Chananǽa mulíere, quam alter
    Evangelísta Syrophœníssam appéllat: vel importunitáte ejus carére cupiéntes,
    quia non ut cleméntem, sed ut durum médicum crébrius inclamáret. Ipse aútem
    respóndens ait: Non sum missus, nisi ad oves quæ periérunt domus Israël. Non
    quo et ad gentes non missus sit, sed quo primum missus sit ad Israël: ut
    illis non recipiéntibus Evangélium, justa fíeret ad gentes transmigrátio."
responsory3:
  - "@Tempora/Quad1-0:Responsory3"
ant-2:
  - "Egréssus Jesus * secéssit in partes Tyri et Sidónis: et ecce múlier
    Chananǽa a fínibus illis egréssa, clamábat dicens: Miserére mei, Fili
    David."
oratio-2:
  - "Devotiónem pópuli tui, quǽsumus, Dómine, benígnus inténde: ut, qui per
    abstinéntiam macerántur in córpore, per fructum boni óperis reficiántur in
    mente."
  - $Per Dominum
ant-3:
  - "O múlier, * magna est fides tua: fiat tibi sicut petísti."
oratio-3:
  - "Da, quǽsumus, Dómine, pópulis christiánis: et, quæ profiténtur, agnóscere,
    et cæléste munus dilígere, quod frequéntant."
  - $Per Dominum
