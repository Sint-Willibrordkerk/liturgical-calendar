introitus:
  - "!Ps 55:2"
  - "v. Miserére mihi, Dómine, quóniam conculcávit me homo: tota die bellans
    tribulávit me."
  - "!Ps 55:3"
  - "Conculcavérunt me inimíci mei tota die: quóniam multi bellántes advérsum
    me."
  - "v. Miserére mihi, Dómine, quóniam conculcávit me homo: tota die bellans
    tribulávit me."
oratio:
  - "Sanctífica, quǽsumus, Dómine, nostra jejúnia: et cunctárum nobis
    indulgéntiam propítius largíre culpárum."
  - $Per Dominum
lectio:
  - Léctio Jonæ Prophétæ.
  - "!Jonæ 3:1-10"
  - "In diébus illis: Factum est verbum Dómini ad Jonam Prophétam secúndo,
    dicens: Surge, et vade in Níniven civitátem magnam: et prǽdica in ea
    prædicatiónem, quam ego loquor ad te. Et surréxit Jonas, et ábiit in Níniven
    juxta verbum Dómini. Et Nínive erat civitas magna itínere trium diérum. Et
    cœpit Jonas introíre in civitátem itínere diéi uníus: et clamávit et dixit:
    Adhuc quadragínta dies, et Nínive subvertétur. Et credidérunt viri Ninivítæ
    in Deum: et prædicavérunt jejúnium, et vestíti sunt saccis a majore usque ad
    minórem. Et pervénit verbum ad regem Nínive: et surréxit de sólio suo, et
    abjécit vestiméntum suum a se, et indútus est sacco, et sedit in cínere. Et
    clamávit et dixit in Nínive ex ore regis et príncipum ejus, dicens: Hómines
    et juménta et boves et pécora non gustent quidquam: nec pascántur, et aquam
    non bibant. Et operiántur saccis hómines et juménta, et clament ad Dóminum
    in fortitúdine, et convertátur vir a via sua mala, et ab iniquitáte, quæ est
    in mánibus eórum. Quis scit, si convertátur et ignóscat Deus: et revertátur
    a furóre iræ suæ, et non períbimus? Et vidit Deus ópera eórum, quia convérsi
    sunt de via sua mala: et misértus est pópulo suo Dóminus, Deus noster."
graduale:
  - "!Ps 53:4, 3"
  - "Deus, exáudi oratiónem meam: áuribus pércipe verba oris mei."
  - V. Deus, in nómine tuo salvum me fac, et in virtúte tua líbera me.
  - _
  - "!Tractus"
  - "!Ps 102:10"
  - "Dómine, non secúndum peccáta nostra, quæ fécimus nos: neque secúndum
    iniquitátes nostras retríbuas nobis."
  - "!Ps 78:8-9"
  - "V. Dómine, ne memíneris iniquitátum nostrárum antiquárum: cito antícipent
    nos misericórdiæ tuæ, quia páuperes facti sumus nimis. (Hic genuflectitur)"
  - "V. Adjuva nos, Deus, salutáris noster: et propter glóriam nóminis tui,
    Dómine, líbera nos: et propítius esto peccátis nostris, propter nomen tuum."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem.
  - "!Joann 7:32-39"
  - "In illo témpore: Misérunt príncipes et pharisǽi minístros, ut
    apprehénderent Jesum. Dixit ergo eis Jesus: Adhuc módicum tempus vobíscum
    sum: et vado ad eum, qui me misit. Quærétis me, et non inveniétis: et ubi
    ego sum, vos non potéstis veníre. Dixérunt ergo Judǽi ad semetípsos: Quo hic
    itúrus est, quia non inveniémus eum? numquid in dispersiónem géntium itúrus
    est, et doctúrus gentes? Quis est hic sermo, quem dixit: Quærétis me, et non
    inveniétis: et ubi sum ego, vos non potéstis veníre? In novíssimo autem die
    magno festivitátis stabat Jesus, et clamábat, dicens: Si quis sitit, véniat
    ad me et bibat. Qui credit in me, sicut dicit Scriptúra, flúmina de ventre
    ejus fluent aquæ vivæ. Hoc autem dixit de Spíritu, quem acceptúri erant
    credéntes in eum."
offertorium:
  - "!Ps 6:5"
  - "Dómine, convértere, et éripe ánimam meam: salvum me fac propter
    misericórdiam tuam."
secreta:
  - "Concéde nobis, Dómine, Deus noster: ut hæc hóstia salutáris et nostrórum
    fiat purgátio delictórum, et tuæ propitiátio majestátis."
  - $Per Dominum
communio:
  - "!Ps 23:10"
  - Dóminus virtútum ipse est Rex glóriæ.
postcommunio:
  - Sacraménti tui, quǽsumus, Dómine, participátio salutáris, et purificatiónem
    nobis tríbuat, et medélam.
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Da, quǽsumus, Dómine, pópulo tuo salútem mentis et córporis: ut, bonis
    opéribus inhæréndo, tua semper mereátur protectióne deféndi."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 7:32-39"
  - "In illo témpore: Misérunt príncipes et pharisǽi minístros, ut
    apprehénderent Jesum. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tract. 31 in Joannem, circa medium"
  - "Quómodo apprehénderent adhuc noléntem? Quia ergo non póterant apprehéndere
    noléntem, missi sunt, ut audírent docéntem. Quid docéntem? Dicit ergo Jesus:
    Adhuc módicum tempus vobíscum sum. Quod modo vultis fácere, factúri estis;
    sed non modo, quia modo nolo. Quare adhuc modo nolo? Quia adhuc módicum
    tempus vobíscum sum, et tunc vado ad eum qui me misit. Implére débeo
    dispensatiónem meam, et sic perveníre ad passiónem meam."
responsory1:
  - "R. Deus meus, éripe me de manu peccatóris: et de manu contra legem agéntis,
    et iníqui:"
  - "* Quóniam tu es patiéntia mea."
  - "V. Deus meus, ne elongéris a me: Deus meus, in auxílium meum réspice."
  - R. Quóniam tu es patiéntia mea.
lectio2:
  - "Quærétis me, et non inveniétis, et ubi sum ego, vos non potéstis veníre.
    Hic jam resurrectiónem suam prædíxit: noluérunt enim agnóscere præséntem, et
    póstea quæsiérunt, cum vidérent in eum multitúdinem jam credéntem. Magna
    enim signa facta sunt étiam cum Dóminus resurréxit, et ascéndit in cælum.
    Tunc per discípulos facta sunt magna: sed ille per illos, qui et per
    seípsum: ipse quippe illis díxerat: Sine me nihil potéstis fácere. Quando
    claudus ille, qui sedébat ad portam, ad vocem Petri surréxit, et suis
    pédibus ambulávit, ita ut hómines miraréntur, sic eos allocútus est Petrus,
    quia non in sua potestáte ista fecit, sed in virtúte illíus, quem ipsi
    occidérunt. Multi compúncti dixérunt: Quid faciémus?"
responsory2:
  - "R. Qui custodiébant ánimam meam, consílium fecérunt in unum, dicéntes: Deus
    derelíquit eum,"
  - "* Persequímini et comprehéndite eum: quia non est qui líberet eum: Deus
    meus, ne elongéris a me: Deus meus, in adjutórium meum inténde."
  - "V. Omnes inimíci advérsum me cogitábant mala mihi: verbum iníquum
    mandavérunt advérsum me, dicéntes."
  - "R. Persequímini et comprehéndite eum: quia non est qui líberet eum: Deus
    meus, ne elongéris a me: Deus meus, in adjutórium meum inténde."
lectio3:
  - "Vidérunt enim se ingénti crímine impietátis adstríctos, quando illum
    occidérunt, quem venerári et adoráre debuérunt: et hoc putábant esse
    inexpiábile. Magnum enim fácinus erat, cujus considerátio illos fáceret
    desperáre: sed non debébant desperáre, pro quibus in cruce pendens Dóminus
    est dignátus oráre. Díxerat enim: Pater, ignósce illis, quia nésciunt quid
    fáciunt. Vidébat quosdam suos inter multos aliénos: illis jam petébat
    véniam, a quibus adhuc accipiébat injúriam. Non enim attendébat quod ab
    ipsis moriebátur, sed quia pro ipsis moriebátur."
responsory3:
  - "R. Pacífice loquebántur mihi inimíci mei, et in ira molésti erant mihi:"
  - "* Vidísti, Dómine, ne síleas, ne discédas a me."
  - V. Ego autem cum mihi molésti essent, induébam me cilício, et humiliábam in
    jejúnio ánimam meam.
  - R. Vidísti, Dómine, ne síleas, ne discédas a me.
  - "&Gloria"
  - "R. Pacífice loquebántur mihi inimíci mei, et in ira molésti erant mihi: *
