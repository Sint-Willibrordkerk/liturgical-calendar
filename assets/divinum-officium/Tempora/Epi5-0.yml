officium:
  - Dominica V Post Epiphaniam
rank:
  - ""
  - Semiduplex
  - "5"
rule:
  - 9 lectiones
  - Symbolum Athanasium
  - Gloria
  - Credo
  - Prefatio=Trinitate
introitus:
  - "@Tempora/Epi3-0:Introitus"
oratio:
  - "Famíliam tuam, quǽsumus, Dómine, contínua pietáte custódi: ut, quæ in sola
    spe grátiæ cœléstis innítitur, tua semper protectióne muniátur."
  - $Per Dominum
lectio:
  - "@Tempora/Epi1-0"
graduale:
  - "!Ps 101:16-17"
  - Timébunt gentes nomen tuum, Dómine, et omnes reges terræ glóriam tuam.
  - V. Quóniam ædificávit Dóminus Sion, et vidébitur in majestáte sua. Allelúja,
    allelúja.
  - "!Ps 96:1"
  - "V. Dóminus regnávit, exsúltet terra: læténtur ínsulæ multæ. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 13:24-30"
  - "In illo témpore: Dixit Jesus turbis parábolam hanc: Símile factum est
    regnum cœlórum hómini, qui seminávit bonum semen in agro suo. Cum autem
    dormírent hómines, venit inimícus ejus, et superseminávit zizánia in médio
    trítici, et ábiit. Cum autem crevísset herba et fructum fecísset, tunc
    apparuérunt et zizánia. Accedéntes autem servi patrisfamílias, dixérunt ei:
    Dómine, nonne bonum semen seminásti in agro tuo? Unde ergo habet zizánia? Et
    ait illis: Inimícus homo hoc fecit. Servi autem dixérunt ei: Vis, imus, et
    collígimus ea? Et ait: Non: ne forte colligéntes zizánia eradicétis simul
    cum eis et tríticum. Sínite utráque créscere usque ad messem, et in témpore
    messis dicam messóribus: Collígite primum zizánia, et alligáte ea in
    fascículos ad comburéndum, tríticum autem congregáte in hórreum meum."
offertorium:
  - "!Ps 117:16; 117:17"
  - "Déxtera Dómini fecit virtutem, déxtera Dómini exaltávit me: non móriar, sed
    vivam, et narrábo ópera Dómini."
secreta:
  - "Hóstias tibi, Dómine, placatiónis offérimus: ut et delícta nostra miserátus
    absólvas, et nutántia corda tu dírigas."
  - $Per Dominum
communio:
  - "@Tempora/Epi3-0:Communio"
postcommunio:
  - "Quǽsumus, omnípotens Deus: ut illíus salutáris capiámus efféctum, cujus per
    hæc mystéria pignus accépimus."
  - $Per Dominum
rubrica-cisterciensis/ant-1:
  - "@Tempora/Epi4-0"
lectio1:
  - Incipit Epístola prima beáti Pauli Apóstoli ad Timótheum
  - "!1 Tim 1:1-4"
  - "1 Paulus Apóstolus Jesu Christi secúndum impérium Dei Salvatóris nostri, et
    Christi Jesu spei nostræ:"
  - 2 Timótheo dilécto fílio in fide. Grátia, misericórdia, et pax a Deo Patre,
    et Christo Jesu Dómino nostro.
  - 3 Sicut rogávi te ut remanéres Ephesi, cum irem in Macedóniam, ut
    denuntiáres quibúsdam ne áliter docérent,
  - "4 neque inténderent fábulis, et genealogíis interminátis: quæ quæstiónes
    præstant magis quam ædificatiónem Dei, quæ est in fide."
responsory1:
  - "@Tempora/Epi2-0:Responsory1"
lectio2:
  - "!1 Tim 1:5-11"
  - 5 Finis autem præcépti est cáritas de corde puro, et consciéntia bona, et
    fide non ficta.
  - 6 A quibus quidam aberrántes, convérsi sunt in vanilóquium,
  - 7 voléntes esse legis doctóres, non intellegéntes neque quæ loquúntur, neque
    de quibus affírmant.
  - "8 Scimus autem quia bona est lex, si quis ea legítime utátur:"
  - 9 sciens hoc quia lex justo non est pósita, sed injústis, et non súbditis,
    ímpiis et peccatóribus, scelerátis, et contaminátis, parricídis et
    matricídis, homicídis,
  - 10 fornicáriis, masculórum concubitóribus, plagiáriis, mendácibus et
    perjúris, et si quid áliud sanæ doctrínæ adversátur,
  - 11 quæ est secúndum Evangélium glóriæ beáti Dei, quod créditum est mihi.
responsory2:
  - "@Tempora/Epi2-0:Responsory2"
lectio3:
  - "!1 Tim 1:12-16"
  - "12 Grátias ago ei, qui me confortávit Christo Jesu Dómino nostro, quia
    fidélem me existimávit, ponens in ministério:"
  - "13 qui prius blasphémus fui, et persecútor, et contumeliósus: sed
    misericórdiam Dei consecútus sum, quia ignórans feci in incredulitáte."
  - 14 Superabundávit autem grátia Dómini nostri cum fide et dilectióne, quæ est
    in Christo Jesu.
  - "15 Fidélis sermo, et omni acceptióne dignus: quod Christus Jesus venit in
    hunc mundum peccatóres salvos fácere, quorum primus ego sum."
  - "16 Sed ídeo misericórdiam consecútus sum: ut in me primo osténderet
    Christus Jesus omnem patiéntiam ad informatiónem eórum, qui creditúri sunt
    illi, in vitam ætérnam."
responsory3:
  - "@Tempora/Epi2-0:Responsory3"
lectio4:
  - Sermo sancti Augustíni Epíscopi
  - "!De Verbis Apóstoli, Sermo 8 sub initio"
  - "Humanus sermo, et omni acceptióne dignus, quia Christus Jesus venit in hunc
    mundum peccatóres salvos fácere. Attende Evangélium: Venit enim Fílius
    hóminis quarere, et salvare, quod períerat. Si homo non periísset, Fílius
    hóminis non venísset. Ergo períerat homo: venit Deus homo, et invéntus est
    homo. Períerat homo per líberam voluntátem: venit Deus homo per grátiam
    liberatrícem."
responsory4:
  - "@Tempora/Epi2-0:Responsory4"
lectio5:
  - "Quæris, quid valeat ad malum líberum arbítrium? Récole hóminem peccántem.
    Quæris, quid valeat ad auxílium Deus et homo? Attende in eo grátiam
    liberántem. Nusquam pótuit sic osténdi, quantum valeat volúntas hóminis
    usurpáta per supérbiam, ad uténdum sine adjutório Dei: malum non pótuit
    plus, et manifestius éxprimi, quam in hómine primo. Ecce perit primus homo,
    et ubi esset, nisi venísset secundus homo? quia et ille homo, ideo et iste
    homo; et ideo humanus sermo."
responsory5:
  - "@Tempora/Epi2-0:Responsory5"
lectio6:
  - "Prorsus nusquam sic appáret benígnitas gratiæ, et liberálitas omnipoténtiæ
    Dei, quam in hómine mediatore Dei et hóminum, hómine Christo Jesu. Quid enim
    dícimus, fratres mei? In fide catholica nutrítis loquor, vel in pacem
    catholicam lucratis. Nóvimus et tenémus, mediatórem Dei et hóminum, hóminem
    Christum Jesum, in quantum homo erat, ejus esse natúræ, cujus et nos sumus.
    Non enim alterius natúræ caro nostra, et caro illíus: nec alterius natúræ
    ánima nostra, et ánima illíus. Hanc suscépit natúram, quam salvandam esse
    judicávit."
responsory6:
  - "@Tempora/Epi2-0:Responsory6"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 13:24-30"
  - "In illo témpore: Dixit Jesus turbis parábolam hanc: Simile factum est
    regnum cælórum hómini, qui seminávit bonum semen in agro suo. Et réliqua."
  - _
  - Homilía S. Augustíni Epíscopi
  - "!Liber Quæst. Evang. in Matth. cap. 11, tom. 4"
  - "Cum negligéntius ágerent præpósiti Ecclésiæ, aut cum dormitiónem mortis
    accíperent Apóstoli, venit diábolus, et superseminávit eos, quos malos
    fílios Dóminus interpretátur. Sed quǽritur: utrum hærétici sint, an male
    vivéntes cathólici? Possunt enim dici fílii mali étiam hærétici, quia ex
    eódem Evangélii sémine, et Christi nómine procreáti, pravis opiniónibus ad
    falsa dógmata convertúntur."
responsory7:
  - "@Tempora/Epi2-0:Responsory7"
lectio8:
  - "Sed quod dicit eos in médio trítici seminatos, quasi vidéntur illi
    significari, qui uníus communiónis sunt. Verúmtamen quóniam Dóminus agrum
    ipsum, non Ecclésiam, sed hunc mundum interpretátus est: bene intelligúntur
    hærétici, quia non societáte uníus Ecclésiæ, vel uníus fidei, sed societáte
    solíus nóminis christiáni in hoc mundo permiscéntur bonis. At illi, qui in
    eádem fide mali sunt, pálea pótius quam zizánia reputántur: quia pálea étiam
    fundaméntum ipsum habet cum fruménto, radicémque communem."
responsory8:
  - "@Tempora/Pent01-0:Responsory8"
lectio9:
  - "In illa plane sagéna, qua concludúntur et mali et boni pisces, non absurde
    mali cathólici intelligúntur. Aliud est enim mare, quod magis mundum istum
    signíficat: aliud sagéna, quæ uníus fidei, vel uníus Ecclésiæ communiónem
    vidétur osténdere. Inter hæréticos et malos cathólicos hoc ínterest, quod
    hæretici falsa credunt: illi autem, vera credéntes, non vivunt ita ut
    credunt."
  - "&teDeum"
ant-2:
  - "Dómine, * nonne bonum semen seminásti in agro tuo? unde ergo habet zizánia?
    Et ait illis: Hoc fecit inimícus homo."
ant-3:
  - "Collígite * primum zizánia, et alligáte ea in fascículos ad comburéndum:
    tríticum autem congregáte in hórreum meum, dicit Dóminus."
