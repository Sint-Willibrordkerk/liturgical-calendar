officium:
  - Feria tertia infra Hebdomadam X post Octavam Pentecostes
rank:
  - ""
  - Feria
  - "1"
rule:
  - Oratio Dominica
  - Suffr=Sanctorum;Maria3,Ecclesiæ,Papa;;
lectio1:
  - De libro quarto Regum
  - "!4 Reg 12:1-3"
  - "1 Anno séptimo Jehu, regnávit Joas: et quadragínta annis regnávit in
    Jerúsalem. Nomen matris ejus Sébia de Bersabée."
  - 2 Fecítque Joas rectum coram Dómino cunctis diébus quibus dócuit eum Jójada
    sacérdos;
  - 3 verúmtamen excélsa non ábstulit; adhuc enim pópulus immolábat, et adolébat
    in excélsis incénsum.
responsory1:
  - "@Tempora/Pent03-2Feria:Responsory1"
lectio2:
  - "!4 Reg 12:4-5"
  - "4 Dixítque Joas ad sacerdótes: Omnem pecúniam sanctórum, quæ illáta fúerit
    in templum Dómini a prætereúntibus, quæ offértur pro prétio ánimæ, et quam
    sponte et arbítrio cordis sui ínferunt in templum Dómini,"
  - 5 accípiant illam sacerdótes juxta órdinem suum, et instáurent sartatécta
    domus, si quid necessárium víderint instauratióne.
responsory2:
  - "@Tempora/Pent03-2Feria:Responsory2"
lectio3:
  - "!4 Reg 12:6-8"
  - 6 Igitur usque ad vigésimum tértium annum regis Joas, non instauravérunt
    sacerdótes sartatécta templi.
  - "7 Vocavítque rex Joas Jójadam pontíficem et sacerdótes, dicens eis: Quare
    sartatécta non instaurátis templi? Nolíte ergo ámplius accípere pecúniam
    juxta órdinem vestrum; sed ad instauratiónem templi réddite eam."
  - 8 Prohibitíque sunt sacerdótes ultra accípere pecúniam a pópulo, et
    instauráre sartatécta domus.
responsory3:
  - "@Tempora/Pent03-2Feria:Responsory3"
