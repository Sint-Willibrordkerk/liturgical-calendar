introitus:
  - "!Ps 53:6-7"
  - "v. Ecce, Deus adjuvat me, et Dóminus suscéptor est ánimæ meæ: avérte mala
    inimícis meis, et in veritáte tua dispérde illos, protéctor meus, Dómine."
  - "!Ps 53:3"
  - "Deus, in nómine tuo salvum me fac: et in virtúte tua libera me."
  - "&Gloria"
  - "v. Ecce, Deus adjuvat me, et Dóminus suscéptor est ánimæ meæ: avérte mala
    inimícis meis, et in veritáte tua dispérde illos, protéctor meus, Dómine."
oratio:
  - "Páteant aures misericórdiæ tuæ, Dómine, précibus supplicántium: et, ut
    peténtibus desideráta concédas; fac eos quæ tibi sunt plácita, postuláre."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Corinthios
  - "!1 Cor 10:6-13"
  - "Fratres: Non simus concupiscéntes malórum, sicut et illi concupiérunt.
    Neque idolólatræ efficiámini, sicut quidam ex ipsis: quemádmodum scriptum
    est: Sedit pópulus manducáre et bíbere, et surrexérunt lúdere. Neque
    fornicémur, sicut quidam ex ipsis fornicáti sunt, et cecidérunt una die
    vigínti tria mília. Neque tentémus Christum, sicut quidam eórum tentavérunt,
    et a serpéntibus periérunt. Neque murmuravéritis, sicut quidam eórum
    murmuravérunt, et periérunt ab exterminatóre. Hæc autem ómnia in figúra
    contingébant illis: scripta sunt autem ad correptiónem nostram, in quos
    fines sæculórum devenérunt. Itaque qui se exístimat stare, vídeat ne cadat.
    Tentátio vos non apprehéndat, nisi humána: fidélis autem Deus est, qui non
    patiétur vos tentári supra id, quod potéstis, sed fáciet étiam cum
    tentatióne provéntum, ut póssitis sustinére."
graduale:
  - "!Ps 8:2"
  - Dómine, Dóminus noster, quam admirábile est nomen tuum in universa terra!
  - V. Quóniam eleváta est magnificéntia tua super cœlos.
  - Allelúja, allelúja.
  - "!Ps 58:2"
  - "Eripe me de inimícis meis, Deus meus: et ab insurgéntibus in me líbera me.
    Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 19:41-47"
  - "In illo témpore: Cum appropinquáret Jesus Jerúsalem, videns civitátem,
    flevit super illam, dicens: Quia si cognovísses et tu, et quidem in hac die
    tua, quæ ad pacem tibi, nunc autem abscóndita sunt ab óculis tuis. Quia
    vénient dies in te: et circúmdabunt te inimíci tui vallo, et circúmdabunt
    te: et coangustábunt te úndique: et ad terram prostérnent te, et fílios
    tuos, qui in te sunt, et non relínquent in te lápidem super lápidem: eo quod
    non cognóveris tempus visitatiónis tuæ. Et ingréssus in templum, cœpit
    ejícere vendéntes in illo et eméntes, dicens illis: Scriptum est: Quia domus
    mea domus oratiónis est. Vos autem fecístis illam speluncam latrónum. Et
    erat docens cotídie in templo."
offertorium:
  - "!Ps 18:9, 10, 11, 12"
  - "Justítiæ Dómini rectæ, lætificántes corda, et judícia ejus dulcióra super
    mel et favum: nam et servus tuus custódit ea."
secreta:
  - "Concéde nobis, quǽsumus, Dómine, hæc digne frequentáre mystéria: quia,
    quóties hujus hóstiæ commemorátio celebrátur, opus nostræ redemptiónis
    exercétur."
  - $Per Dominum
communio:
  - "!Joann 6:57"
  - Qui mandúcat meam carnem et bibit meum sánguinem, in me manet et ego in eo,
    dicit Dóminus.
postcommunio:
  - Tui nobis, quǽsumus, Dómine, commúnio sacraménti, et purificatiónem
    cónferat, et tríbuat unitátem.
  - $Per Dominum
ant-1:
  - "Dum tólleret Dóminus * Elíam per túrbinem in cælum, Eliséus clamábat: Pater
    mi, currus Israël et auríga ejus."
rubrica-cisterciensis/ant-1:
  - Obsecro, Dómine, * aufer iniquitátem servi tui, quia insipiénter egi.
lectio1:
  - Incipit liber quartus Regum
  - "!4 Reg 1:1-4"
  - 1 Prævaricátus est autem Moab in Israël, postquam mórtuus est Achab.
  - "2 Cecidítque Ochozías per cancéllos cœnáculi sui, quod habébat in Samaría,
    et ægrotávit; misítque núntios dicens ad eos: Ite, consúlite Beélzebub deum
    Accaron, utrum vívere queam de infirmitáte mea hac."
  - "3 Angelus autem Dómini locútus est ad Elíam Thesbíten dicens: Surge et
    ascénde in occúrsum nuntiórum regis Samaríæ et dices ad eos: Numquid non est
    Deus in Israël, ut eátis ad consuléndum Beélzebub deum Accaron?"
  - "4 Quam ob rem hæc dicit Dóminus: De léctulo, super quem ascendísti, non
    descéndes, sed morte moriéris."
responsory1:
  - "@Tempora/Pent01-1"
lectio2:
  - "!4 Reg 1:4-6"
  - 4 Et ábiit Elías.
  - "5 Reversíque sunt núntii ad Ochozíam. Qui dixit eis: Quare revérsi estis?"
  - "6 At illi respondérunt ei: vir occúrrit nobis et dixit ad nos: Ite et
    revertímini ad regem qui misit vos, et dicétis ei: Hæc dicit Dóminus:
    Numquid quia non erat Deus in Israël, mittis ut consulátur Beélzebub deus
    Accaron? Idcírco de léctulo, super quem ascendísti, non descéndes, sed morte
    moriéris."
responsory2:
  - "@Tempora/Pent01-1"
lectio3:
  - "!4 Reg 1:7-10"
  - "7 Qui dixit eis: Cujus figúræ et hábitus est vir ille, qui occúrrit vobis
    et locútus est verba hæc?"
  - "8 At illi dixérunt: Vir pilósus et zona pellícea accínctus rénibus. Qui
    ait: Elías Thesbítes est."
  - "9 Misítque ad eum quinquagenárium príncipem et quinquagínta qui erant sub
    eo. Qui ascéndit ad eum sedentíque in vértice montis ait: Homo Dei, rex
    præcépit ut descéndas."
  - "10 Respondénsque Elías dixit quinquagenário: Si homo Dei sum, descéndat
    ignis de cælo, et dévoret te et quinquagínta tuos. Descéndit ítaque ignis de
    cælo, et devorávit eum et quinquagínta qui erant cum eo."
responsory3:
  - "@Tempora/Pent01-1"
lectio4:
  - Sermo sancti Augustíni Epíscopi
  - "!Sermo 201 de Tempore"
  - "In lectiónibus quæ nobis diébus istis recitántur, fratres caríssimi,
    frequénter admónui, ut non sequámur lítteram occidéntem, et vivificántem
    spíritum relinquámur. Sic enim Apóstolus ait: Líttera enim occídit, spíritus
    vivíficat. Si enim hoc tantum vólumus intellégere quod sonat in líttera, aut
    parvam, aut prope nullam ædificatiónem de divínis lectiónibus capiémus. Illa
    enim ómnia quæ recitántur, typus erant et imágo futurórum. In Judǽis enim
    figuráta, in nobis, grátia Dei donánte, compléta sunt."
responsory4:
  - "@Tempora/Pent01-2:Responsory1"
lectio5:
  - Beátus enim Elías typum hábuit Dómini Salvatóris. Sicut enim Elías a Judǽis
    persecutiónem passus est; ita et verus Elías Dóminus noster ab ipsis Judǽis
    reprobátus est et contémptus. Elías relíquit gentem suam; et Christus
    deséruit synagógam. Elías ábiit in desértum; et Christus venit in mundum.
    Elías in desérto corvis ministrántibus pascebátur; et Christus in desérto
    mundi hujus Géntium fide refícitur.
responsory5:
  - "@Tempora/Pent01-2:Responsory2"
lectio6:
  - "Corvi enim illi qui beáto Elíæ, jubénte Dómino, ministrábant, Géntium
    pópulum figurábant. Proptérea et de géntium Ecclésia dícitur: Nigra sum et
    formósa, fília Jerúsalem. Unde est Ecclésia nigra et formósa? Nigra per
    natúram, formósa per grátiam. Unde nigra? Ecce in iniquitátibus concéptus
    sum, et in delíctis péperit me mater mea. Unde formósa? Aspérges me hyssópo,
    et mundábor: lavábis me, et super nivem dealbábor."
responsory6:
  - "@Tempora/Pent01-2:Responsory3"
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 19:41-47"
  - "In illo témpore: Cum appropinquáret Jesus Jerúsalem, videns civitátem
    flevit super illam dicens: Quia si cognovísses et tu, et quidem in hac die
    tua, quæ ad pacem tibi! Nunc autem abscóndita sunt ab óculis tuis. Et
    réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 39 in Evangelia"
  - "Quod a flente Dómino illa Jerosolymórum subvérsio descríbitur, quæ a
    Vespasiáno et Tito Románis princípibus facta est, nullus qui históriam
    eversiónis ejúsdem legit, ignórat. Románi étenim príncipes denuntiántur, cum
    dícitur: Quia vénient dies in te, et circúmdabunt te inimíci tui vallo. Hoc
    quoque quod ádditur: Non relínquent in te lápidem super lápidem: étiam jam
    ipsa ejúsdem civitátis transmigrátio testátur; quia dum nunc in eo loco
    constrúcta est, ubi extra portam fúerat Dóminus crucifíxus, prior illa
    Jerúsalem, ut dícitur, fúnditus est evérsa."
responsory7:
  - "@Tempora/Pent01-3:Responsory1"
lectio8:
  - "Cui ex qua culpa eversiónis suæ pœna fúerit illáta, subjúngitur: Eo quod
    non cognóveris tempus visitatiónis tuæ. Creátor quippe hóminum per
    incarnatiónis suæ mystérium hanc visitáre dignátus est; sed ipsa timóris et
    amóris ílius recordáta non est. Unde étiam per prophétam in increpatióne
    cordis humáni aves cæli ad testimónium deducúntur, dum dícitur: Milvus in
    cælo cognóvit tempus suum, turtur et hirúndo et cicónia custodiérunt tempus
    advéntus sui; pópulus autem meus non cognóvit judícium Dómini."
responsory8:
  - "@Tempora/Pent01-0:Responsory8"
lectio9:
  - "Flevit étenim prius Redémptor ruínam pérfidæ civitátis, quam ipsa sibi
    cívitas non cognoscébat esse ventúram. Cui a flente Dómino recte dícitur:
    Quia si cognovísses, et tu; subáudi, fleres; quæ modo, quæ nescis quod
    ímminet, exsúltas. Unde et súbditur: Et quidem in hac die tua, quæ ad pacem
    tibi. Cum enim carnis se voluptátibus daret, et ventúra mala non
    prospíceret; in die sua, quæ ad pacem esse ei póterant, habébat."
  - "&teDeum"
ant-2:
  - "Cum appropinquáret * Dóminus Jerúsalem videns civitátem flevit super illam,
    et dixit: Quia si cognovísses et tu, quia vénient dies in te, et
    circúmdabunt te inimíci tui vallo et circúmdabunt te et coangustábunt te
    úndique et ad terram prostérnent te: eo quod non cognovísti tempus
    visitatiónis tuæ, allelúja."
ant-3:
  - "Scriptum est enim: * Quia domus mea domus oratiónis est cunctis géntibus;
    vos autem fecístis illam spelúncam latrónum. Et erat cotídie docens in
    templo."
