introitus:
  - "!Ps 27:8-9"
  - "v. Dóminus fortitudo plebis suæ, et protéctor salutárium Christi sui est:
    salvum fac pópulum tuum, Dómine, et benedic hereditáti tuæ, et rege eos
    usque in sǽculum."
  - "!Ps 27:1"
  - "Ad te, Dómine, clamábo, Deus meus, ne síleas a me: ne quando táceas a me,
    et assimilábor descendéntibus in lacum."
  - "&Gloria"
  - "v. Dóminus fortitudo plebis suæ, et protéctor salutárium Christi sui est:
    salvum fac pópulum tuum, Dómine, et benedic hereditáti tuæ, et rege eos
    usque in sǽculum."
oratio:
  - "Deus virtútum, cujus est totum quod est óptimum: ínsere pectóribus nostris
    amórem tui nóminis, et præsta in nobis religiónis augméntum; ut, quæ sunt
    bona, nútrias, ac pietátis stúdio, quæ sunt nutríta, custódias."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Romános
  - "!Rom 6:3-11"
  - "Fratres: Quicúmque baptizáti sumus in Christo Jesu, in morte ipsíus
    baptizáti sumus. Consepúlti enim sumus cum illo per baptísmum in mortem: ut,
    quómodo Christus surréxit a mórtuis per glóriam Patris, ita et nos in
    novitáte vitæ ambulémus. Si enim complantáti facti sumus similitúdini mortis
    ejus: simul et resurrectiónis érimus. Hoc sciéntes, quia vetus homo noster
    simul crucifíxus est: ut destruátur corpus peccáti, et ultra non serviámus
    peccáto. Qui enim mórtuus est, justificátus est a peccáto. Si autem mórtui
    sumus cum Christo: crédimus, quia simul étiam vivémus cum Christo: sciéntes,
    quod Christus resurgens ex mórtuis, jam non móritur, mors illi ultra non
    dominábitur. Quod enim mórtuus est peccáto, mórtuus est semel: quod autem
    vivit, vivit Deo. Ita et vos existimáte, vos mórtuos quidem esse peccáto,
    vivéntes autem Deo, in Christo Jesu, Dómino nostro."
graduale:
  - "!Ps 89:13; 89:1"
  - Convértere, Dómine, aliquántulum, et deprecáre super servos tuos.
  - V. Dómine, refúgium factus es nobis, a generatióne et progénie.
  - Allelúja, allelúja.
  - "!Ps 30:2-3"
  - "In te, Dómine, sperávi, non confúndar in ætérnum: in justítia tua líbera me
    et éripe me: inclína ad me aurem tuam, accélera, ut erípias me. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Marcum
  - "!Marc 8:1-9"
  - "In illo témpore: Cum turba multa esset cum Jesu, nec habérent, quod
    manducárent, convocátis discípulis, ait illis: Miséreor super turbam: quia
    ecce jam tríduo sústinent me, nec habent quod mandúcent: et si dimísero eos
    jejúnos in domum suam, defícient in via: quidam enim ex eis de longe
    venérunt. Et respondérunt ei discípuli sui: Unde illos quis póterit hic
    saturáre pánibus in solitúdine? Et interrogávit eos: Quot panes habétis? Qui
    dixérunt: Septem. Et præcépit turbæ discúmbere super terram. Et accípiens
    septem panes, grátias agens fregit, et dabat discípulis suis, ut appónerent,
    et apposuérunt turbæ. Et habébant piscículos paucos: et ipsos benedíxit, et
    jussit appóni. Et manducavérunt, et saturáti sunt, et sustulérunt quod
    superáverat de fragméntis, septem sportas. Erant autem qui manducáverant,
    quasi quátuor mília: et dimísit eos."
offertorium:
  - "!Ps 16:5; 16:6-7"
  - "Pérfice gressus meos in sémitis tuis, ut non moveántur vestígia mea:
    inclína aurem tuam, et exáudi verba mea: mirífica misericórdias tuas, qui
    salvos facis sperántes in te, Dómine."
secreta:
  - "Propitiáre, Dómine, supplicatiónibus nostris, et has pópuli tui oblatiónes
    benígnus assúme: et, ut nullíus sit írritum votum, nullíus vácua postulátio,
    præsta; ut, quod fidéliter pétimus, efficáciter consequámur."
  - $Per Dominum.
communio:
  - "!Ps 26:6"
  - "Circuíbo et immolábo in tabernáculo ejus hóstiam jubilatiónis: cantábo et
    psalmum dicam Dómino."
postcommunio:
  - "Repléti sumus, Dómine, munéribus tuis: tríbue, quǽsumus; ut eórum et
    mundémur efféctu et muniámur auxílio."
  - $Per Dominum
