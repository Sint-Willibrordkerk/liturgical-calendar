introitus:
  - "!Phil 4:4-6"
  - "v. Gaudéte in Dómino semper: íterum dico, gaudéte. Modéstia vestra nota sit
    ómnibus homínibus: Dóminus enim prope est. Nihil sollíciti sitis: sed in
    omni oratióne petitiónes vestræ innotéscant apud Deum."
  - "!Ps 84:2"
  - "Benedixísti, Dómine, terram tuam: avertísti captivitátem Jacob."
  - "&Gloria"
  - "v. Gaudéte in Dómino semper: íterum dico, gaudéte. Modéstia vestra nota sit
    ómnibus homínibus: Dóminus enim prope est. Nihil sollíciti sitis: sed in
    omni oratióne petitiónes vestræ innotéscant apud Deum."
oratio:
  - "Aurem tuam, quǽsumus, Dómine, précibus nostris accómmoda: et mentis nostræ
    ténebras, grátia tuæ visitatiónis illústra:"
  - $Qui vivis
lectio:
  - Lectio Epístolæ beáti Pauli Apóstoli ad Philippénses
  - "!Philipp 4:4-7"
  - "Fratres: Gaudéte in Dómino semper: íterum dico, gaudéte. Modéstia vestra
    nota sit ómnibus homínibus: Dóminus prope est. Nihil sollíciti sitis: sed in
    omni oratióne et obsecratióne, cum gratiárum actióne, petitiónes vestræ
    innotéscant apud Deum. Et pax Dei, quæ exsúperat omnem sensum, custódiat
    corda vestra et intellegéntias vestras, in Christo Jesu, Dómino nostro."
graduale:
  - "!Ps 79:2; 79:3; 79:2"
  - Qui sedes, Dómine, super Chérubim, éxcita poténtiam tuam, et veni.
  - "V. Qui regis Israël, inténde: qui dedúcis, velut ovem, Joseph. Allelúja,
    allelúja,"
  - V. Excita, Dómine, potentiam tuam, et veni, ut salvos fácias nos. Allelúja.
gradualef:
  - "!Ps 79:2; 79:3; 79:2"
  - Qui sedes, Dómine, super Chérubim, éxcita poténtiam tuam, et veni.
  - "V. Qui regis Israël, inténde: qui dedúcis, velut ovem, Joseph."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joann 1:19-28"
  - "In illo tempore: Misérunt Judǽi ab Jerosólymis sacerdótes et levítas ad
    Joánnem, ut interrogárent eum: Tu quis es? Et conféssus est, et non negávit:
    et conféssus est: Quia non sum ego Christus. Et interrogavérunt eum: Quid
    ergo? Elías es tu? Et dixit: Non sum. Prophéta es tu? Et respondit: Non.
    Dixérunt ergo ei: Quis es, ut respónsum demus his, qui misérunt nos? Quid
    dicis de te ipso? Ait: Ego vox clamántis in desérto: Dirígite viam Dómini,
    sicut dixit Isaías Prophéta. Et qui missi fúerant, erant ex pharisǽis. Et
    interrogavérunt eum, et dixérunt ei: Quid ergo baptízas, si tu non es
    Christus, neque Elías, neque Prophéta? Respóndit eis Joánnes, dicens: Ego
    baptízo in aqua: médius autem vestrum stetit, quem vos nescítis. Ipse est,
    qui post me ventúrus est, qui ante me factus est: cujus ego non sum dignus
    ut solvam ejus corrígiam calceaménti. Hæc in Bethánia facta sunt trans
    Jordánem, ubi erat Joánnes baptízans."
offertorium:
  - "!Ps 84:2"
  - "Benedixísti, Dómine, terram tuam: avertísti captivitátem Jacob: remisísti
    iniquitatem plebis tuæ."
secreta:
  - "Devotiónis nostræ tibi, quǽsumus, Dómine, hóstia júgiter immolétur: quæ et
    sacri péragat institúta mystérii, et salutáre tuum in nobis mirabíliter
    operétur."
  - $Per Dominum
communio:
  - "!Is 35:4."
  - "Dícite: pusillánimes, confortámini et nolíte timére: ecce, Deus noster
    véniet et salvábit nos."
postcommunio:
  - "Implorámus, Dómine, cleméntiam tuam: ut hæc divína subsídia, a vítiis
    expiátos, ad festa ventúra nos prǽparent."
  - $Per Dominum
