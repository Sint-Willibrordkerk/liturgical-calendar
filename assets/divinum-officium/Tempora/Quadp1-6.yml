lectio1:
  - De libro Génesis
  - "!Gen 5:15-21"
  - 15 Vixit autem Maláleel sexagínta quinque annis, et génuit Jared.
  - 16 Et vixit Maláleel, postquam génuit Jared, octingéntis trigínta annis, et
    génuit fílios et fílias.
  - 17 Et facti sunt omnes dies Maláleel octingénti nonagínta quinque anni, et
    mórtuus est.
  - 18 Vixítque Jared centum sexagínta duóbus annis, et génuit Henoch.
  - 19 Et vixit Jared, postquam génuit Henoch, octingéntis annis, et génuit
    fílios et fílias.
  - 20 Et facti sunt omnes dies Jared nongénti sexagínta duo anni, et mórtuus
    est.
  - 21 Porro Henoch vixit sexagínta quinque annis, et génuit Mathúsalam.
responsory1:
  - "@Tempora/Quadp1-0:Responsory7"
lectio2:
  - "!Gen 5:22-27"
  - "22 Et ambulávit Henoch cum Deo: et vixit, postquam génuit Mathúsalam,
    trecéntis annis, et génuit fílios et fílias."
  - 23 Et facti sunt omnes dies Henoch trecénti sexagínta quinque anni.
  - "24 Ambulavítque cum Deo, et non appáruit: quia tulit eum Deus."
  - 25 Vixit quoque Mathúsala centum octogínta septem annis, et génuit Lamech.
  - 26 Et vixit Mathúsala, postquam génuit Lamech, septingéntis octogínta duóbus
    annis, et génuit fílios et fílias.
  - 27 Et facti sunt omnes dies Mathúsala nongénti sexagínta novem anni, et
    mórtuus est.
responsory2:
  - "@Tempora/Quadp1-0:Responsory8"
lectio3:
  - "!Gen 5:28-31"
  - "28 Vixit autem Lamech centum octogínta duóbus annis, et génuit fílium:"
  - "29 vocavítque nomen ejus Noë, dicens: Iste consolábitur nos ab opéribus et
    labóribus mánuum nostrárum in terra, cui maledíxit Dóminus."
  - 30 Vixítque Lamech, postquam génuit Noë, quingéntis nonagínta quinque annis,
    et génuit fílios et fílias.
  - 31 Et facti sunt omnes dies Lamech septingénti septuagínta septem anni, et
    mórtuus est.
responsory3:
  - "@Tempora/Quadp1-0:Responsory9"
