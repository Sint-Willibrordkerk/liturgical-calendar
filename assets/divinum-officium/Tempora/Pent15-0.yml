introitus:
  - "!Ps 85:1; 85:2-3"
  - "v. Inclína, Dómine, aurem tuam ad me, et exáudi me: salvum fac servum tuum,
    Deus meus, sperántem in te: miserére mihi, Dómine, quóniam ad te clamávi
    tota die."
  - "!Ps 85:4"
  - "Lætífica ánimam servi tui: quia ad te, Dómine, ánimam meam levávi."
  - "&Gloria"
  - "v. Inclína, Dómine, aurem tuam ad me, et exáudi me: salvum fac servum tuum,
    Deus meus, sperántem in te: miserére mihi, Dómine, quóniam ad te clamávi
    tota die."
oratio:
  - "Ecclésiam tuam, Dómine, miserátio continuáta mundet et múniat: et quia sine
    te non potest salva consístere; tuo semper múnere gubernétur."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Gálatas.
  - "!Gal 5:25-26; 6:1-10"
  - "Fratres: Si spíritu vívimus, spíritu et ambulémus. Non efficiámur inanis
    glóriæ cúpidi, ínvicem provocántes, ínvicem invidéntes. Fratres, et si
    præoccupátus fúerit homo in áliquo delícto, vos, qui spirituáles estis,
    hujúsmodi instrúite in spíritu lenitátis, consíderans teípsum, ne et tu
    tentéris. Alter alteríus ónera portáte, et sic adimplébitis legem Christi.
    Nam si quis exístimat se áliquid esse, cum nihil sit, ipse se sedúcit. Opus
    autem suum probet unusquísque, et sic in semetípso tantum glóriam habébit,
    et non in áltero. Unusquísque enim onus suum portábit. Commúnicet autem is,
    qui catechizátur verbo, ei, qui se catechízat, in ómnibus bonis. Nolíte
    erráre: Deus non irridétur. Quæ enim semináverit homo, hæc et metet. Quóniam
    qui séminat in carne sua, de carne et metet corruptiónem: qui autem séminat
    in spíritu, de spíritu metet vitam ætérnam. Bonum autem faciéntes, non
    deficiámus: témpore enim suo metémus, non deficiéntes. Ergo, dum tempus
    habémus, operémur bonum ad omnes, maxime autem ad domésticos fídei."
graduale:
  - "!Ps 91:2-3"
  - "Bonum est confitéri Dómino: et psallere nómini tuo, Altíssime."
  - V. Ad annuntiándum mane misericórdiam tuam, et veritátem tuam per noctem.
    Allelúja, allelúja.
  - "!Ps 94:3"
  - Quóniam Deus magnus Dóminus, et Rex magnus super omnem terram. Allelúja.
evangelium:
  - "@Tempora/Quad4-4"
offertorium:
  - "!Ps 39:2; 39:3; 39:4"
  - "Exspéctans exspectávi Dóminum, et respéxit me: et exaudívit deprecatiónem
    meam: et immísit in os meum cánticum novum, hymnum Deo nostro."
secreta:
  - "Tua nos, Dómine, sacramenta custodiant: et contra diabólicos semper
    tueántur incúrsus."
  - $Per Dominum
communio:
  - "@Tempora/Quad1-4:Communio"
postcommunio:
  - "Mentes nostras et córpora possídeat, quǽsumus, Dómine, doni cœléstis
    operátio: ut non noster sensus in nobis, sed júgiter ejus prævéniat
    efféctus."
  - $Per Dominum
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 7:11-16"
  - "In illo témpore: Ibat Jesus in civitátem, quæ vocátur Naim; et ibant cum eo
    discípuli ejus, et turba copiósa. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Sermo 44 de verbis Domini, circa initium"
  - "De júvene illo resuscitáto gavísa est mater vídua; de homínibus in spíritu
    cotídie suscitátis gaudet mater Ecclésia. Ille quidem mórtuus erat córpore;
    illi autem mente. Illíus mors visíbilis visibíliter plangebátur; illórum
    mors invisíbilis nec quærebátur, nec videbátur. Quæsívit ille, qui nóverat
    mórtuos. Ille solus nóverat mórtuos, qui póterat fácere vivos. Nisi enim ad
    mórtuos suscitándos venísset, Apóstolus non díceret: Surge, qui dormis, et
    exsúrge a mórtuis, et illuminábit te Christus."
lectio8:
  - "Tres autem mórtuos invenímus a Dómino resuscitátos visibíliter, míllia
    invisibíliter. Quot autem mórtuos visibíliter suscitáverit, quis novit? Non
    enim ómnia, quæ fecit, scripta sunt. Joánnes hoc dixit: Multa ália fecit
    Jesus, quæ si scripta essent, árbitror totum mundum non posse libros cápere.
    Multi ergo sunt álii sine dúbio suscitáti, sed non tres frustra commemoráti.
    Dóminus enim noster Jesus Christus ea quæ faciébat corporáliter, étiam
    spiritáliter volébat intélligi. Neque enim tantum mirácula propter mirácula
    faciébat; sed ut illa, quæ faciébat, mira essent vidéntibus, vera essent
    intelligéntibus."
responsory8:
  - "@Tempora/Pent01-0:Responsory8"
lectio9:
  - "Quemádmodum qui videt lítteras in códice óptime scripto, et non novit
    légere, laudat quidem antiquárii manum, admírans ápicum pulchritúdinem; sed
    quid sibi velint, quid índicent illi ápices, nescit, et est óculis laudátor,
    mente non cógnitor. Alius autem et laudat artifícium, et capit intelléctum:
    ille útique, qui non solum vidére quod commúne est ómnibus, potest, sed
    étiam légere; quod qui non dídicit, non potest. Ita qui vidérunt Christi
    mirácula, et non intellexérunt quid sibi vellent, et quid intelligéntibus
    quodámmodo innúerent, miráti sunt tantum quia facta sunt; álii vero et facta
    miráti, et intellécta assecúti. Tales nos in schola Christi esse debémus."
  - "&teDeum"
ant-2:
  - "Ibat Jesus * in civitátem, quæ vocátur Naim: et ecce defúnctus efferebátur
    fílius únicus matris suæ."
rubrica-cisterciensis/ant-2:
  - "Accéssit autem Jesus, * et tétigit lóculum: hi autem qui portábant,
    stetérunt: et ait: Adoléscens, tibi dico, surge: et resédit qui erat
    mórtuus, allelúia."
ant-3:
  - Prophéta magnus * surréxit in nobis, et quia Deus visitávit plebem suam.
rubrica-cisterciensis-aut-rubrica-praedicatorum/ant-3:
  - "Accépit autem omnes timor, * et magnificábant Deum, dicéntes: Quia Prophéta
    magnus surréxit in nobis, et quia Deus visitávit plebem suam."
