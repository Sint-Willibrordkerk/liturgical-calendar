introitus:
  - "!Ps 87:3"
  - "v. Intret orátio mea in conspéctu tuo: inclína aurem tuam ad precem meam,
    Dómine."
  - "!Ps 87:2"
  - "Dómine, Deus salútis meæ: in die clamávi, et nocte coram te."
  - "&Gloria"
  - "v. Intret orátio mea in conspéctu tuo: inclína aurem tuam ad precem meam,
    Dómine."
lectiol1:
  - Léctio libri Deuteronómii
  - "!Deut 26:12-19"
  - "In diébus illis: Locútus est Móyses ad pópulum, dicens: Quando compléveris
    décimam cunctárum frugum tuárum, loquéris in conspéctu Dómini, Dei tui:
    Abstuli, quod sanctificátum est de domo mea, et dedi illud levítæ et ádvenæ
    et pupíllo ac víduæ, sicut jussísti mihi: non præterívi mandáta tua, nec sum
    oblítus impérii tui. Obœdívi voci Dómini, Dei mei, et feci ómnia, sicut
    præcepísti mihi. Réspice de sanctuário tuo et de excélso cœlórum habitáculo,
    et benedic pópulo tuo Israël, et terræ, quam dedísti nobis, sicut jurásti
    pátribus nostris, terræ lacte et melle manánti. Hódie Dóminus, Deus tuus,
    præcépit tibi, ut fácias mandáta hæc atque judícia: et custódias et ímpleas
    ex toto corde tuo et ex tota ánima tua. Dóminum elegísti hódie, ut sit tibi
    Deus, et ámbules in viis ejus, et custódias cæremónias illíus et mandáta
    atque judícia, et obœ́dias ejus império. Et Dóminus elégit te hódie, ut sis
    ei pópulus peculiáris, sicut locútus est tibi, et custódias ómnia præcépta
    illíus: et fáciat te excelsiórem cunctis géntibus, quas creávit in laudem et
    nomen et glóriam suam: ut sis pópulus sanctus Dómini, Dei tui, sicut locútus
    est."
  - $Deo gratias
gradualel1:
  - "!Ps 78:9; 78:10"
  - "Propítius esto, Dómine, peccátis nostris: ne quando dicant gentes: Ubi est
    Deus eórum?"
  - "V. Adjuva nos, Deus, salutáris noster: et propter honórem nóminis tui,
    Dómine, líbera nos."
oratiol1:
  - "Protéctor noster, áspice, Deus: ut, qui malórum nostrórum póndere prémimur,
    percépta misericórdia, líbera tibi mente famulémur."
  - $Per Dominum
lectiol2:
  - Léctio libri Deuteronómii
  - "!Deut 11:22-25"
  - "In diébus illis: Dixit Móyses fíliis Israël: Si custodiéritis mandáta, quæ
    ego præcípio vobis, et fecéritis ea, ut diligátis Dóminum, Deum vestrum, et
    ambulétis in ómnibus viis ejus, adhæréntes ei, dispérdet Dóminus omnes
    gentes istas ante fáciem vestram, et possidébitis eas, quæ majóres et
    fortióres vobis sunt. Omnis locus quem calcáverit pes vester, vester erit. A
    desérto et a Líbano, a flúmine magno Euphráte usque ad mare Occidentále,
    erunt términi vestri. Nullus stabit contra vos: terrórem vestrum et
    formídinem dabit Dóminus, Deus vester, super omnem terram, quam calcatúri
    estis, sicut locútus est vobis Dóminus, Deus vester."
  - $Deo gratias
gradualel2:
  - "!Ps 83:10; 83:9"
  - Protéctor noster, áspice, Deus, et réspice super servos tuos.
  - V. Dómine, Deus virtútum, exáudi preces servórum tuórum.
oratiol2:
  - "Adésto, quǽsumus, Dómine, supplicatiónibus nostris: ut esse, te largiénte,
    mereámur et inter próspera húmiles, et inter advérsa secúri."
  - $Per Dominum
lectiol3:
  - Léctio libri Machabæórum
  - "!2 Mach 1:23-26; 1:27"
  - "In diébus illis: Oratiónem faciébant omnes sacerdótes, dum consummarétur
    sacrifícium, Jónatha inchoánte, céteris autem respondéntibus. Et Nehemíæ
    erat orátio hunc habens modum: Dómine Deus, ómnium Creátor, terríbilis et
    fortis, justus et miséricors, qui solus es bonus rex, solus præstans, solus
    justus et omnípotens et ætérnus, qui líberas Israël de omni malo, qui
    fecísti patres eléctos et sanctificásti eos: áccipe sacrifícium pro univérso
    pópulo tuo Israël, et custódi partem tuam et sanctífica: ut sciant gentes,
    quia tu es Deus noster."
  - $Deo gratias
gradualel3:
  - "!Ps 89:13; 89:1"
  - Convértere, Dómine, aliquántulum, et deprecáre super servos tuos.
  - V. Dómine, refúgium factus es nobis, a generatióne et progénie.
oratiol3:
  - "Preces pópuli tui, quǽsumus, Dómine, cleménter exáudi: ut, qui juste pro
    peccátis nostris afflígimur, pro tui nóminis glória misericórditer
    liberémur."
  - $Per Dominum
lectiol4:
  - Léctio libri Sapiéntiæ
  - "!Eccli 36:1-10"
  - "Miserére nostri, Deus ómnium, et réspice nos, et osténde nobis lucem
    miseratiónum tuárum: et immítte timórem tuum super gentes, quæ non
    exquisiérunt te, ut cognóscant, quia non est Deus nisi tu, et enárrent
    magnália tua. Alleva manum tuam super gentes aliénas, ut vídeant poténtiam
    tuam. Sicut enim in conspéctu eórum sanctificátus es in nobis, sic in
    conspéctu nostro magnificáberis in eis, ut cognóscant te, sicut et nos
    cognóvimus, quóniam non est Deus præter te, Dómine. Innova signa et immúta
    mirabília. Glorífica manum et bráchium dextrum. Excita furórem et effúnde
    iram. Tolle adversárium et afflíge inimícum. Festína tempus et meménto
    finis, ut enárrent mirabília tua, Dómine, Deus noster."
  - $Deo gratias
gradualel4:
  - "!Ps 140:2"
  - Dirigátur orátio mea sicut incénsum in conspéctu tuo, Dómine.
  - V. Elevátio mánuum meárum sacrifícium vespertínum.
oratiol4:
  - "Actiónes nostras, quǽsumus, Dómine, aspirándo prǽveni, et adjuvándo
    proséquere: ut cuncta nostra orátio et operátio a te semper incípiat, et per
    te cœpta finiátur."
  - $Per Dominum
lectiol5:
  - "@Tempora/093-6"
oratiol5:
  - "@Tempora/093-6"
oratio:
  - "Pópulum tuum, quǽsumus, Dómine, propítius réspice: atque ab eo flagélla tuæ
    iracúndiæ cleménter avérte."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Thessalonicénses
  - "!1 Thess 5:14-23"
  - "Fratres: Rogámus vos, corrípite inquiétos, consolámini pusillánimes,
    suscípite infirmos, patiéntes estóte ad omnes. Vidéte, ne quis malum pro
    malo alícui reddat: sed semper quod bonum est sectámini in ínvicem, et in
    omnes. Semper gaudéte. Sine intermissióne oráte. In ómnibus grátias ágite:
    hæc est enim volúntas Dei in Christo Jesu in ómnibus vobis. Spíritum nolíte
    exstínguere. Prophetías nolíte spérnere. Omnia autem probáte: quod bonum est
    tenéte. Ab omni spécie mala abstinéte vos. Ipse autem Deus pacis sanctíficet
    vos per ómnia: ut ínteger spíritus vester, et ánima, et corpus sine queréla,
    in advéntu Dómini nostri Jesu Christi servétur."
graduale:
  - "!Ps 116:1-2"
  - "Laudáte Dóminum, omnes gentes: et collaudáte eum, omnes pópuli."
  - "V. Quóniam confirmáta est super nos misericórdia ejus: et véritas Dómini
    manet in ætérnum."
evangelium:
  - "@Tempora/Quad2-0:Evangelium"
offertorium:
  - "!Ps 87:2-3"
  - "Dómine, Deus salútis meæ, in die clamávi et nocte coram te: intret orátio
    mea in conspéctu tuo, Dómine."
secreta:
  - "Præséntibus sacrifíciis, quǽsumus, Dómine, jejúnia nostra sanctífica: ut,
    quod observántia nostra profitétur extrínsecus, intérius operétur."
  - $Per Dominum
communio:
  - "!Ps 7:2"
  - "Dómine, Deus meus, in te sperávi: líbera me ab ómnibus persequéntibus me,
    et éripe me."
postcommunio:
  - Sanctificatiónibus tuis, omnípotens Deus, et vítia nostra curéntur, et
    remédia nobis ætérna provéniant.
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Fidéles tuos, Deus, benedíctio desideráta confírmet: quæ eos et a tua
    voluntáte numquam fáciat discrepáre, et tuis semper indúlgeat benefíciis
    gratulári."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 17:1-9"
  - "In illo témpore: Assúmpsit Jesus Petrum, et Jacóbum, et Joánnem fratrem
    ejus, et duxit illos in montem excélsum seórsum: et transfigurátus est ante
    eos. Et réliqua."
  - _
  - Homilía sancti Leónis Papæ
  - "!Homilia de Transfiguratione Domini"
  - "Evangélica lectio, dilectíssimi, quæ per aures córporis interiórem méntium
    nostrárum pulsávit audítum, ad magni sacraménti nos intellegéntiam vocat:
    quam, aspiránte grátia Dei, facílius assequémur, si consideratiónem nostram
    ad ea, quæ paulo supérius sunt narráta, referámus. Salvátor enim humáni
    géneris Jesus Christus, condens eam fidem, quæ et ímpios ad justítiam, et
    mórtuos révocat ad vitam, ad hoc discípulos suos doctrínæ mónitis, et óperum
    miráculis imbuébat, ut idem Christus et Unigénitus Dei, et hóminis Fílius
    crederétur. Nam unum horum sine áltero non próderat ad salútem: et æquális
    erat perículi, Dóminum Jesum Christum aut Deum tantúmmodo sine hómine, aut
    sine Deo solum hóminem credidísse: cum utrúmque esset páriter confiténdum:
    quia sicut Deo vera humánitas, ita hómini ínerat vera divínitas."
responsory1:
  - "@Tempora/Quad1-0:Responsory7"
lectio2:
  - "Ad confírmandam ergo hujus fídei salubérrimam cognitiónem interrogáverat
    discípulos suos Dóminus, inter divérsas aliórum opiniónes quid ipsi de eo
    créderent, quidve sentírent. Ubi Petrus Apóstolus, per revelatiónem summi
    Patris corpórea súperans, et humána transcéndens, vidit mentis óculis Fílium
    Dei vivi, et conféssus est glóriam Deitátis; quia non ad solam respéxit
    substántiam carnis et sánguinis: tantúmque in hac fídei sublimitáte
    complácuit, ut beatitúdinis felicitáte donátus, sacram inviolábilis petræ
    accíperet firmitátem: super quam fundáta Ecclésia, portis ínferi et mortis
    légibus prævaléret: nec in solvéndis aut ligándis quorumcúmque causis áliud
    ratum esset in cælis, quam quod Petri sedísset arbítrio."
responsory2:
  - "@Tempora/Quad1-0:Responsory8"
lectio3:
  - "Hæc autem, dilectíssimi, laudátæ intellegéntiæ celsitúdo instruénda erat de
    inferióris substántiæ sacraménto: ne apostólica fides ad glóriam confiténdæ
    in Christo Deitátis evécta, infirmitátis nostræ receptiónem indígnam
    impassíbili Deo atque incóngruam judicáret: et ita jam in Christo humánam
    créderet glorificátam esse natúram, ut nec supplício posset áffici, nec
    morte dissólvi. Et ídeo dicénte Dómino, quod oportéret eum ire Jerosólymam,
    et multa pati a senióribus et scribis, ac princípibus sacerdótum, et occídi,
    et tértia die resúrgere: cum beátus Petrus, qui supérno illustrátus lúmine,
    de ardentíssima Fílii Dei confessióne fervébat, contumélias illusiónum et
    crudelíssimæ mortis oppróbrium religióso, ut putábat, et líbero fastídio
    respuísset; benígna a Jesu increpatióne corréptus, et ad cupiditátem
    participándæ cum eo passiónis animátus est."
responsory3:
  - "@Tempora/Quad1-3:Responsory3"
