lectiol1:
  - Léctio Amos Prophétæ
  - "!Amos 9:13-15"
  - "Hæc dicit Dóminus Deus: Ecce, dies véniunt: et comprehéndet arátor
    messórem, et calcátor uvæ mitténtem semen: et stillábunt montes dulcédinem,
    et omnes colles culti erunt. Et convértam captivitátem pópuli mei Israël: et
    ædificábunt civitátes desértas et inhabitábunt: et plantábunt víneas et
    bibent vinum eárum: et fácient hortos et cómedent fructus eórum. Et plantábo
    eos super humum suam: et non evéllam eos ultra de terra sua, quam dedi eis:
    dicit Dóminus, Deus tuus."
  - $Deo gratias
gradualel1:
  - "!Ps 112,5-7"
  - Quis sicut Dóminus, Deus noster, qui in altis hábitat, et humilia réspicit
    in cœlo et in terra?
  - V. Súscitans a terra ínopem et de stércore érigens páuperem.
oratiol1:
  - "Præsta, quǽsumus, Dómine, famíliæ tuæ supplicánti: ut, dum a cibis
    corporálibus se ábstinet, a vítiis quoque mente jejúnet."
  - $Per Dominum
oratio:
  - "Misericórdiæ tuæ remédiis, quǽsumus, Dómine, fragílitas nostra subsístat:
    ut, quæ sua conditióne attéritur, tua cleméntia reparétur."
  - $Per Dominum
lectio:
  - Léctio libri Esdræ
  - "!Neh 8:1-10"
  - "In diébus illis: Congregátus est omnis pópulus quasi vir unus ad platéam,
    quæ est ante portam aquárum: et dixérunt Esdræ scribæ, ut afférret librum
    legis Moysi, quam præcéperat Dóminus Israéli. Attulit ergo Esdras sacérdos
    legem coram multitúdine virórum et mulíerum, cunctísque qui póterant
    intellégere, in die prima mensis séptimi. Et legit in eo apérte in platéa,
    quæ erat ante portam aquárum, de mane usque ad médiam diem, in conspéctu
    virórum et mulíerum et sapiéntium: et aures omnis pópuli erant eréctæ ad
    librum. Stetit autem Esdras scriba super gradum lígneum, quem fécerat ad
    loquendum. Et apéruit librum coram omni pópulo: super univérsum quippe
    pópulum eminébat: et cum aperuísset eum, stetit omnis pópulus. Et benedíxit
    Esdras Dómino, Deo magno: et respóndit omnis pópulus: Amen, Amen: élevans
    manus suas: et incurváti sunt et adoravérunt Deum proni in terram. Porro
    levítæ siléntium faciébant in pópulo ad audiéndam legem: pópulus autem
    stabat in gradu suo. Et legérunt in libro legis Dei distíncte et apérte ad
    intellegéndum: et intellexérunt, cum legerétur. Dixit autem Nehemías, et
    Esdras sacérdos et scriba, et levítæ interpretántes univérso pópulo: Dies
    sanctificátus est Dómino, Deo nostro, nolíte lugére et nolíte flere. Et
    dixit eis: Ite, comédite pínguia et bíbite mulsum, et míttite partes his,
    qui non præparavérunt sibi: quia sanctus dies Dómini est, et nolíte
    contristári: gáudium étenim Dómini est fortitúdo nostra."
graduale:
  - "!Ps 32:12 ; 32:6"
  - "Beáta gens, cujus est Dóminus Deus eórum: pópulus, quem elégit Dóminus in
    hereditátem sibi."
  - "V. Verbo Dómini cœli firmáti sunt: et spíritu oris ejus omnis virtus eórum."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Marcum
  - "!Marc 9:16-28"
  - "In illo témpore: Respóndens unus de turba, dixit ad Jesum: Magíster, áttuli
    fílium meum ad te, habéntem spíritum mutum: qui, ubicúmque eum
    apprehénderit, allídit illum, et spumat et stridet déntibus et aréscit: et
    dixi discípulis tuis, ut ejícerent illum, et non potúerunt. Qui respóndens
    eis, dixit: O generátio incrédula, quámdiu apud vos ero? quámdiu vos pátiar?
    Afférte illum ad me. Et attúlerunt eum. Et cum vidísset eum, statim spíritus
    conturbávit illum: et elísus in terram, volutabátur spumans. Et interrogávit
    patrem ejus: Quantum témporis est, ex quo ei hoc áccidit? At ille ait: Ab
    infántia: et frequénter eum in ignem et in aquas misit, ut eum pérderet. Sed
    si quid potes, ádjuva nos, misértus nostri. Jesus autem ait illi: Si potes
    credere, ómnia possibília sunt credénti. Et contínuo exclámans pater pueri,
    cum lácrimis ajébat: Credo, Dómine: ádjuva incredulitátem meam. Et cum
    vidéret Jesus concurréntem turbam, comminátus est spirítui immundo, dicens
    illi: Surde et mute spíritus, ego præcípio tibi, exi ab eo: et ámplius ne
    intróëas in eum. Et exclámans et multum discérpens eum, éxiit ab eo, et
    factus est sicut mórtuus, ita ut multi dícerent: Quia mórtuus est. Jesus
    autem tenens manum ejus, elevávit eum, et surréxit. Et cum introísset in
    domum, discípuli ejus secréto interrogábant eum: Quare nos non potúimus
    ejícere eum? Et dixit illis: Hoc genus in nullo potest exíre nisi in
    oratióne et jejúnio."
offertorium:
  - "!Ps 118:47; 118:48"
  - "Meditábor in mandátis tuis, quæ diléxi valde: et levábo manus meas ad
    mandáta tua, quæ diléxi."
secreta:
  - "Hæc hóstia, Dómine, quǽsumus, emúndet nostra delícta: et ad sacrifícium
    celebrándum, subditórum tibi córpora mentésque sanctíficet."
  - $Per Dominum
communio:
  - "!Neh 8:10"
  - "Comédite pínguia et bíbite mulsum, et míttite partes his, qui non
    præparavérunt sibi: sanctus enim dies Dómini est, nolíte contristári:
    gáudium étenim Dómini est fortitúdo nostra."
postcommunio:
  - "Suméntes, Dómine, dona cœléstia, supplíciter deprecámur: ut, quæ sédula
    servitúte, donánte te, gérimus, dignis sénsibus tuo múnere capiámus."
  - $Per Dominum
