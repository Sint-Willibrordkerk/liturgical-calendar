lectio1:
  - Léctio sancti Evangélii secúndum Marcum
  - "!Marc 9:16-28"
  - "In illo témpore: Respóndens unus de turba dixit ad Jesum: Magíster, áttuli
    fílium meum ad te habéntem spíritum mutum. Et réliqua."
  - _
  - Homilía sancti Bedæ Venerábilis Presbýteri
  - "!Liber 3, cap. 38 in Marcum 9"
  - "Dæmoníacum hunc, quem descéndens de monte Dóminus sanávit, Marcus quidem
    surdum mutúmque, Matthǽus vero lunáticum fuísse commémorat. Signíficat autem
    eos, de quibus scriptum est: Stultus ut luna mutátur. Qui nunquam in eódem
    statu permanéntes, nunc ad illa vítia mutáti, crescunt atque decréscunt. Qui
    muti sunt, non confiténdo fidem; surdi, nec ipsum aliquátenus veritátis
    audiéndo sermónem. Spumant autem, cum stultítia tabéscunt; stultórum namque
    et languéntium atque hébetum est, spumas salivárum ex ore dimíttere.
    Strident déntibus, cum iracúndiæ furóre flamméscunt: aréscunt, cum ótio
    torpénte languéscunt, et nulla virtútis indústria confortáti enérviter
    vivunt."
responsory1:
  - "@Tempora/093-0:Responsory7"
lectio2:
  - "Quod autem ait: Et dixi discípulis tuis ut eícerent illum, et non
    potuérunt; laténter Apóstolos accúsat, cum impossibílitas curándi, intérdum
    non ad imbecillitátem curántium, sed ad eórum, qui curándi sunt, fidem
    referátur, dicénte Dómino: Fiat tibi secúndum fidem tuam. Qui respóndens
    eis, dixit: O generátio incrédula, quámdiu apud vos ero? quámdiu vos pátiar?
    Non quod tǽdio superátus sit mansuétus ac mitis, qui non apéruit sicut agnus
    coram tondénte os suum, nec in verba furóris erúpit; sed quo in
    similitúdinem médici, si ægrótum vídeat contra sua præcépta se gérere,
    dicat: Usquequo accédam ad domum tuam? quoúsque artis meæ perdam indústriam,
    me áliud jubénte, et te áliud perpetránte?"
responsory2:
  - "@Tempora/093-0:Responsory2"
lectio3:
  - "Et dixit illis: Hoc genus in nullo potest exíre, nisi in oratióne et
    jejúnio. Dum docet Apóstolos quómodo dæmon nequíssimus débeat expélli, omnes
    instítuit ad vitam; ut scílicet novérimus, gravíssima quæque vel immundórum
    spirítuum, vel hóminum tentaménta jejúniis et oratiónibus esse superánda:
    iram quoque Dómini, cum in ultiónem nostrórum scélerum fúerit accénsa, hoc
    remédio singulári posse placári. Jejúnium autem generále est, non solum ab
    escis, sed et a cunctis illécebris abstinére carnálibus, immo ab ómnibus
    vitiórum continére se passiónibus. Sic et orátio generális non in verbis
    solum est, quibus divínam cleméntiam invocámus, verum étiam in ómnibus, quæ
    in obséquium nostri Conditóris fídei devotióne gérimus."
responsory3:
  - "@Tempora/093-0:Responsory3"
