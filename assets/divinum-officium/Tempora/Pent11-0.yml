introitus:
  - "!Ps 67:6-7; 67:36"
  - "v. Deus in loco sancto suo: Deus qui inhabitáre facit unánimes in domo:
    ipse dabit virtútem et fortitúdinem plebi suæ."
  - "!Ps 67:2"
  - "Exsúrgat Deus, et dissipéntur inimíci ejus: et fúgiant, qui odérunt eum, a
    fácie ejus."
  - "&Gloria"
  - "v. Deus in loco sancto suo: Deus qui inhabitáre facit unánimes in domo:
    ipse dabit virtútem et fortitúdinem plebi suæ."
oratio:
  - "Omnípotens sempitérne Deus, qui, abundántia pietátis tuæ, et mérita
    súpplicum excédis et vota: effúnde super nos misericórdiam tuam; ut dimíttas
    quæ consciéntia métuit, et adícias quod orátio non præsúmit."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Corínthios.
  - "!1 Cor 15:1-10"
  - "Fratres: Notum vobis fácio Evangélium, quod prædicávi vobis, quod et
    accepístis, in quo et statis, per quod et salvámini: qua ratione
    prædicáverim vobis, si tenétis, nisi frustra credidístis. Trádidi enim vobis
    in primis, quod et accépi: quóniam Christus mortuus est pro peccátis nostris
    secúndum Scriptúras: et quia sepúltus est, et quia resurréxit tértia die
    secúndum Scriptúras: et quia visus est Cephæ, et post hoc úndecim. Deinde
    visus est plus quam quingéntis frátribus simul, ex quibus multi manent usque
    adhuc, quidam autem dormiérunt. Deinde visus est Jacóbo, deinde Apóstolis
    ómnibus: novíssime autem ómnium tamquam abortívo, visus est et mihi. Ego
    enim sum mínimus Apostolórum, qui non sum dignus vocári Apóstolus, quóniam
    persecútus sum Ecclésiam Dei. Grátia autem Dei sum id quod sum, et grátia
    ejus in me vácua non fuit."
graduale:
  - "!Ps 27:7 27:1"
  - "In Deo sperávit cor meum, et adjútus sum: et reflóruit caro mea, et ex
    voluntáte mea confitébor illi."
  - "V. Ad te, Dómine, clamávi: Deus meus, ne síleas, ne discédas a me.
    Allelúja, allelúja"
  - "!Ps 80:2-3"
  - "Exsultáte Deo, adjutóri nostro, jubiláte Deo Jacob: súmite psalmum jucúndum
    cum cíthara. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Marcum.
  - "!Marc 7:31-37"
  - "In illo témpore: Exiens Jesus de fínibus Tyri, venit per Sidónem ad mare
    Galilǽæ, inter médios fines Decapóleos. Et addúcunt ei surdum et mutum, et
    deprecabántur eum, ut impónat illi manum. Et apprehéndens eum de turba
    seórsum, misit dígitos suos in aurículas ejus: et éxspuens, tétigit linguam
    ejus: et suspíciens in cœlum, ingémuit, et ait illi: Ephphetha, quod est
    adaperíre. Et statim apértæ sunt aures ejus, et solútum est vínculum linguæ
    ejus, et loquebátur recte. Et præcépit illis, ne cui dícerent. Quanto autem
    eis præcipiébat, tanto magis plus prædicábant: et eo ámplius admirabántur,
    dicéntes: Bene ómnia fecit: et surdos fecit audíre et mutos loqui."
offertorium:
  - "!Ps 29:2-3"
  - "Exaltábo te, Dómine, quóniam suscepísti me, nec delectásti inimícos meos
    super me: Dómine, clamávi ad te, et sanásti me."
secreta:
  - "Réspice, Dómine, quǽsumus, nostram propítius servitútem: ut, quod
    offérimus, sit tibi munus accéptum, et sit nostræ fragilitátis subsidium."
  - $Per Dominum
communio:
  - "!Prov 3:9-10"
  - "Hónora Dóminum de tua substántia, et de prímitiis frugum tuárum: et
    implebúntur hórrea tua saturitáte, et vino torculária redundábunt."
postcommunio:
  - "Sentiámus, quǽsumus, Dómine, tui perceptióne sacraménti, subsídium mentis
    et córporis: ut, in utróque salváti, cæléstis remédii plenitúdine
    gloriémur."
  - $Per Dominum
ant-1:
  - "Obsécro, Dómine: * meménto, quæso, quómodo ambuláverim coram te in veritáte
    et in corde perfécto et quod plácitum est coram te, fécerim."
rubrica-cisterciensis/ant-1:
  - Exáudisti, Dómine, * oratiónem servi tui, ut ædificárem templum nómini tuo.
lectio1:
  - De libro quarto Regum
  - "!4 Reg 20:1-3"
  - "1 In diébus illis ægrotáret Ezechías usque ad mortem, et venit ad eum
    Isaías fílius Amos prophéta dixítque ei: Hæc dicit Dóminus Deus: Prǽcipe
    dómui tuæ, moriéris enim tu et non vives."
  - "2 Qui convértit fáciem suam ad paríetem et orávit Dóminum, dicens:"
  - "3 Obsecro, Dómine: meménto, quæso, quómodo ambuláverim coram te in veritáte
    et in corde perfécto et quod plácitum est coram te fécerim. Flevit ítaque
    Ezechías fletu magno."
responsory1:
  - "@Tempora/Pent01-1:Responsory1"
lectio2:
  - "!4 Reg 20:4-7"
  - "4 Et ántequam egrederétur Isaías médiam partem átrii, factus est sermo
    Dómini ad eum, dicens:"
  - "5 Revértere et dic Ezechíæ duci pópuli mei: Hæc dicit Dóminus Deus David
    patris tui: Audívi oratiónem tuam et vidi lácrimas tuas et ecce sanávi te:
    die tértio ascéndes templum Dómini,"
  - 6 et addam diébus tuis quíndecim annos; sed et de manu regis Assyriórum
    liberábo te et civitátem hanc et prótegam urbem istam propter me et propter
    David servum meum.
  - "7 Dixítque Isaías: Afférte massam ficórum. Quam cum attulíssent et
    posuíssent super ulcus ejus, curátus est."
responsory2:
  - "@Tempora/Pent01-1:Responsory2"
lectio3:
  - "!4 Reg 20:8-11"
  - "8 Díxerat autem Ezechías ad Isaíam: Quod erit signum quia Dóminus me
    sanábit, et quia ascensúrus sum die tértia templum Dómini?"
  - "9 Cui ait Isaías: Hoc erit signum a Dómino, quod factúrus sit Dóminus
    sermónem quem locútus est: vis ut ascéndat umbra decem líneis, an ut
    revertátur tótidem grádibus?"
  - "10 Et ait Ezechías: Fácile est umbram créscere decem líneis, nec hoc volo
    ut fiat; sed ut revertátur retrórsum decem grádibus."
  - 11 Invocávit ítaque Isaías prophéta Dóminum, et redúxit umbram per líneas,
    quibus jam descénderat in horológio Achaz, retrórsum decem grádibus.
responsory3:
  - "@Tempora/Pent01-1:Responsory3"
lectio4:
  - Ex Expositióne sancti Hierónymi Presbýteri in Isaíam Prophétam
  - "!Lib. 11 in Isaíæ cap. 38"
  - "Ne elevarétur cor Ezechíæ post incredíbiles triúmphos et de média
    captivitáte victóriam, infirmitáte córporis sui visitátur, et audit se esse
    moritúrum; ut convérsus ad Dóminum flectat senténtiam ejus. Quod quidem et
    in Jona prophéta légimus, et in comminatiónibus contra David: quæ dicúntur
    futúra, nec facta sunt, non Deo mutánte senténtiam, sed provocánte humánum
    genus ad notítiam sui. Dóminus enim pœ́nitens est super malítiis.
    Convertítque Ezechías fáciem suam ad paríetem, quia ad templum ire non
    póterat. Ad paríetem autem templi, juxta quod Sálomon palátium exstrúxerat;
    vel absolúte ad paríetem, ne lácrimas suas assidéntibus ostentáre
    viderétur."
responsory4:
  - "@Tempora/Pent01-2:Responsory1"
lectio5:
  - "Audiénsque se esse moritúrum, non precátur vitam et annos plúrimos, sed in
    Dei judício, quid velit præstáre, dimíttit. Nóverat enim idcírco Deo
    placuísse Salomónem, quod annos vitæ non petíerit amplióres; sed itúrus ad
    Dóminum narrat ópera sua, quómodo ambuláverit coram eo in veritáte et in
    corde perfécto. Felix consciéntia, quæ afflictiónis témpore bonórum óperum
    recordátur. Beáti enim mundo corde: quóniam ipsi Deum vidébunt. Et quómodo
    álibi scríbitur: Quis gloriábitur purum habére se cor? Quod ita sólvitur:
    perfectiónem cordis in eo nunc dici, quod idóla destrúxerit, templi valvas
    aperúerit, serpéntem ǽneum comminúerit, et cétera fécerit quæ Scriptúra
    commémorat."
responsory5:
  - "@Tempora/Pent01-2:Responsory2"
lectio6:
  - "Flevit autem fletu magno, propter promissiónem Dómini ad David, quam
    vidébat in sua morte peritúram. Eo enim témpore Ezechías fílios non habébat;
    nam post mortem ejus Manásses cum duódecim esset annórum, regnáre cœpit in
    Judǽa: ex quo perspícuum est, post tértium annum concéssæ vitæ Manássen esse
    generátum. Ergo iste omnis est fletus, quod desperábat Christum de suo
    sémine nascitúrum. Alii ásserunt, quamvis sanctos viros morte terréri,
    propter incértum judícii et ignoratiónem senténtiæ Dei, quam sedem habitúri
    sint."
responsory6:
  - "@Tempora/Pent01-2:Responsory3"
lectio7:
  - Léctio sancti Evangélii secúndum Marcum
  - "!Marc 7:31-37"
  - "In illo témpore: Exiens Jesus de fínibus Tyri venit per Sidónem ad mare
    Galilǽæ inter médios fines Decapóleos. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 10, liber 1 in Ezech., ante medium"
  - "Quid est quod creátor ómnium Deus, cum surdum et mutum sanáre voluísset, in
    aures illíus suos dígitos misit, et éxspuens linguam ejus tétigit? Quid per
    dígitos Redemptóris, nisi dona Sancti Spíritus designántur? Unde cum in álio
    loco ejecísset dæmónium, dixit: Si in dígito Dei eício dæmónia, profécto
    pervénit in vos regnum Dei. Qua de re per Evangelístam álium dixísse
    descríbitur: Si ego in Spíritu Dei eício dǽmones, ígitur pervénit in vos
    regnum Dei. Ex quo utróque loco collígitur, quia dígitus Spíritus vocátur.
    Dígitos ergo in aurículas míttere, est per dona Spíritus Sancti mentem surdi
    ad obediéndum aperíre."
responsory7:
  - "@Tempora/Pent01-3:Responsory1"
lectio8:
  - "Quid est vero, quod éxspuens linguam ejus tétigit? Salíva nobis est ex ore
    Redemptóris, accépta sapiéntia in elóquio divíno. Salíva quippe ex cápite
    défluit in ore. Ea ergo sapiéntia, quæ ipse est, dum lingua nostra tángitur,
    mox ad prædicatiónis verba formátur. Qui suspíciens in cælum, ingémuit: non
    quod ipse necessárium gémitum habéret, qui dabat quod postulábat; sed nos ad
    eum gémere, qui cælo prǽsidet, dócuit: ut et aures nostræ per donum Spíritus
    Sancti aperíri, et lingua per salívam oris, id est, per sciéntiam divínæ
    locutiónis, solvi débeat ad verba prædicatiónis."
responsory8:
  - "@Tempora/Pent01-0:Responsory8"
lectio9:
  - "Cui mox, Ephphétha, id est, Adaperíre dícitur: et statim apértæ sunt aures
    ejus, et solútum est vínculum linguæ ejus. Qua in re notándum est, quia
    propter clausas aures dictum est, Adaperíre. Sed cui aures cordis ad
    obediéndum apértæ fúerint, ex subsequénti procul dúbio étiam linguæ ejus
    vínculum sólvitur; ut bona quæ ipse fécerit, étiam faciénda áliis loquátur.
    Ubi bene ádditur: Et loquebátur recte. Ille enim recte lóquitur, qui prius
    obediéndo fécerit quæ loquéndo ádmonet esse faciénda."
  - "&teDeum"
