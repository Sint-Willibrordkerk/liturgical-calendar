  - "!Ps 84:2"
  - "Benedixísti, Dómine, terram tuam: avertísti captivitátem Jacob."
  - "&Gloria"
  - "v. Dicit Dóminus: Ego cógito cogitatiónes pacis, et non afflictiónis:
