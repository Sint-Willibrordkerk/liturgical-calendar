oratio:
  - "Absólve, quǽsumus, Dómine, tuórum delícta populórum: ut a peccatórum
    néxibus, quæ pro nostra fragilitáte contráximus, tua benignitáte liberémur."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Philippénses
  - "!Phil 3:17-21; 4:1-3"
  - "Fratres: Imitatóres mei estóte, et observáte eos, qui ita ámbulant, sicut
    habétis formam nostram. Multi enim ámbulant, quos sæpe dicébam vobis - nunc
    autem et flens dico - inimícos Crucis Christi: quorum finis intéritus:
    quorum Deus venter est: et glória in confusióne ipsórum, qui terréna
    sápiunt. Nostra autem conversátio in cœlis est: unde étiam Salvatórem
    exspectámus, Dóminum nostrum Jesum Christum, qui reformábit corpus
    humilitátis nostræ, configurátum córpori claritátis suæ, secúndum
    operatiónem, qua étiam possit subjícere sibi ómnia. Itaque, fratres mei
    caríssimi et desideratíssimi, gáudium meum et coróna mea: sic state in
    Dómino, caríssimi. Evódiam rogo et Sýntychen déprecor idípsum sápere in
    Dómino. Etiam rogo et te, germáne compar, ádjuva illas, quæ mecum
    laboravérunt in Evangélio cum Cleménte et céteris adjutóribus meis, quorum
    nómina sunt in libro vitæ."
graduale:
  - "!Ps 43:8-9"
  - "Liberásti nos, Dómine, ex affligéntibus nos: et eos, qui nos odérunt,
    confudísti."
  - V. In Deo laudábimur tota die, et in nómine tuo confitébimur in sǽcula.
    Allelúja, allelúja.
  - "!Ps 129:1-2"
  - "De profúndis clamávi ad te, Dómine: Dómine, exáudi oratiónem meam.
    Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 9:18-26"
  - "In illo témpore: Loquénte Jesu ad turbas, ecce, princeps unus accéssit et
    adorábat eum, dicens: Dómine, fília mea modo defúncta est: sed veni, impóne
    manum tuam super eam, et vivet. Et surgens Jesus sequebátur eum et discípuli
    ejus. Et ecce múlier, quæ sánguinis fluxum patiebátur duódecim annis,
    accéssit retro et tétigit fímbriam vestiménti ejus. Dicébat enim intra se:
    Si tetígero tantum vestiméntum ejus, salva ero. At Jesus convérsus et videns
    eam, dixit: Confíde, fília, fides tua te salvam fecit. Et salva facta est
    múlier ex illa hora. Et cum venísset Jesus in domum príncipis, et vidísset
    tibícines et turbam tumultuántem, dicebat: Recédite: non est enim mórtua
    puélla, sed dormit. Et deridébant eum. Et cum ejécta esset turba, intrávit
    et ténuit manum ejus. Et surréxit puélla. Et éxiit fama hæc in univérsam
    terram illam."
offertorium:
  - "!Ps 129:1-2"
  - "De profúndis clamávi ad te, Dómine: Dómine, exáudi oratiónem meam: de
    profúndis clamávi ad te, Dómine."
secreta:
  - "Pro nostræ servitútis augménto sacrifícium tibi, Dómine, laudis offérimus:
    ut, quod imméritis contulísti, propítius exsequáris."
  - $Per Dominum
communio:
  - "!Marc 11:24"
  - Amen, dico vobis, quidquid orántes pétitis, crédite, quia accipiétis, et
    fiet vobis.
postcommunio:
  - "Quǽsumus, omnípotens Deus: ut, quos divína tríbuis participatióne gaudére,
    humánis non sinas subjacére perículis."
  - $Per Dominum
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 9:18-26"
  - "In illo témpore: Loquénte Jesu ad turbas, ecce princeps unus accéssit et
    adorábat eum dicens: Dómine, fília mea modo defúncta est. Et réliqua."
  - _
  - Homilía sancti Hierónymi Presbýteri
  - "!Liber 1 Comment. in cap. 9 Matthæi"
  - "Octávum signum est, in quo princeps suscitári póstulat fíliam suam, nolens
    de mystério veræ circumcisiónis exclúdi: sed subíntrat múlier sánguine
    fluens, et octávo sanátur loco; ut príncipis fília de hoc exclúsa número,
    véniat ad nonum, juxta illud quod in Psalmis dícitur: Æthiópia prævéniet
    manus ejus Deo; et, Cum intráverit plenitúdo géntium, tunc omnis Israël
    salvus fiet."
lectio8:
  - Et ecce múlier, quæ sánguinis fluxum patiebátur duódecim annis, accéssit
    retro, et tétigit fímbriam vestiménti ejus. In Evangélio secúndum Lucam
    scríbitur, quod príncipis fília duódecim annos habéret ætátis. Nota ergo,
    quod eo témpore hæc múlier, id est, Géntium pópulus cœ́perit ægrotáre, quo
    genus Judæórum credíderat. Nisi enim ex comparatióne virtútum, vítium non
    osténditur.
lectio9:
  - "Hæc autem múlier sánguine fluens, non in domo, non in urbe accédit ad
    Dóminum, quia juxta legem úrbibus excludebátur; sed in itínere, ambulánte
    Dómino; ut, dum pergit ad áliam, ália curarétur. Unde dicunt et Apóstoli:
    Vobis quidem oportébat prædicári verbum Dei: sed quóniam vos judicástis
    indígnos salúte, transgrédimur ad gentes."
  - "&teDeum"
ant-2:
  - "Dicébat enim * intra se: Si tetígero fímbriam vestiménti ejus tantum, salva
