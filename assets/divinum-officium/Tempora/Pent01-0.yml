lectio1:
  - De Isaía Prophéta
  - "!Isa 6:1-4"
  - "1 In anno, quo mórtuus est rex Ozías, vidi Dóminum sedéntem super sólium
    excélsum et elevátum: et ea, quæ sub ipso erant, replébant templum."
  - "2 Séraphim stabant super illud: sex alæ uni, et sex alæ álteri, duábus
    velábant fáciem ejus, et duábus velábant pedes ejus, et duábus volábant."
  - "3 Et clamábant alter ad álterum, et dicébant: Sanctus, sanctus, sanctus,
    Dóminus exercítuum, plena est omnis terra glória ejus."
  - 4 Et commóta sunt superliminária cárdinum a voce clamántis, et domus repléta
    est fumo.
responsory1:
  - "R. Vidi Dóminum sedéntem super sólium excélsum et elevátum, et plena erat
    omnis terra majestáte ejus:"
  - "* Et ea, quæ sub ipso erant, replébant templum."
  - "V. Séraphim stabant super illud: sex alæ uni, et sex alæ álteri."
  - R. Et ea, quæ sub ipso erant, replébant templum.
lectio2:
  - "!Isa 6:5-8"
  - "5 Et dixi: Væ mihi, quia tácui, quia vir pollútus lábiis ego sum, et in
    médio pópuli pollúta lábia habéntis ego hábito, et Regem Dóminum exercítuum
    vidi óculis meis."
  - 6 Et volávit ad me unus de Séraphim, et in manu ejus cálculus, quem fórcipe
    túlerat de altári.
  - "7 Et tétigit os meum, et dixit: Ecce tétigit hoc lábia tua, et auferétur
    iníquitas tua, et peccátum tuum mundábitur."
  - "8 Et audívi vocem Dómini dicéntis: Quem mittam? et quis ibit nobis? Et
    dixi: Ecce ego, mitte me."
responsory2:
  - "R. Benedíctus Dóminus Deus Israël, qui facit mirabília magna solus:"
  - "* Et benedíctum nomen majestátis ejus in ætérnum."
  - "V. Replébitur majestáte ejus omnis terra: fiat, fiat."
  - R. Et benedíctum nomen majestátis ejus in ætérnum.
lectio3:
  - "!Isa 6:9-12"
  - "9 Et dixit: Vade, et dices pópulo huic: Audíte audiéntes, et nolíte
    intellégere: et vidéte visiónem, et nolíte cognóscere."
  - 10 Excǽca cor pópuli hujus, et aures ejus ággrava, et óculos ejus claude, ne
    forte vídeat óculis suis, et áuribus suis áudiat, et corde suo intéllegat,
    et convertátur, et sanem eum.
  - "11 Et dixi: Usquequo, Dómine? Et dixit: Donec desoléntur civitátes absque
    habitatóre, et domus sine hómine, et terra relinquétur desérta,"
  - 12 et longe fáciet Dóminus hómines, et multiplicábitur quæ derelícta fúerat
    in médio terræ.
responsory3:
  - "R. Benedícat nos Deus, Deus noster, benedícat nos Deus:"
  - "* Et métuant eum omnes fines terræ."
  - V. Deus misereátur nostri, et benedícat nos Deus.
  - R. Et métuant eum omnes fines terræ.
  - "&Gloria"
  - R. Et métuant eum omnes fines terræ.
lectio4:
  - Ex libro sancti Fulgéntii Epíscopi, de fide ad Petrum
  - "!Inter Opera Augustini, tom. 3"
  - Fides, quam sancti Patriárchæ atque Prophétæ ante incarnatiónem Fílii Dei
    divínitus accepérunt, quam étiam sancti Apóstoli ab ipso Dómino in carne
    pósito audiérunt, et Spíritus Sancti magistério instrúcti non solum sermóne
    prædicavérunt, verum étiam ad instructiónem salubérrimam posterórum scriptis
    suis índitam reliquérunt; unum Deum prǽdicat Trinitátem, id est, Patrem, et
    Fílium, et Spíritum Sanctum. Sed Trínitas vera non esset, si una eadémque
    persóna dicerétur Pater et Fílius et Spíritus Sanctus.
responsory4:
  - R. Quis Deus magnus sicut Deus noster?
  - "* Tu es Deus, qui facis mirabília."
  - "V. Notam fecísti in pópulis virtútem tuam: redemísti in brácchio tuo
    pópulum tuum."
  - R. Tu es Deus, qui facis mirabília.
lectio5:
  - Si enim, sicut est Patris, et Fílii, et Spíritus Sancti una substántia, sic
    esset una persóna; nihil omníno esset in quo veráciter Trínitas dicerétur.
    Rursus quidem Trínitas esset vera, sed unus Deus Trínitas ipsa non esset, si
    quemádmodum Pater, et Fílius, et Spíritus Sanctus personárum sunt ab ínvicem
    proprietáte distíncti, sic fuíssent naturárum quoque diversitáte discréti.
    Sed quia in illo uno vero Deo Trinitáte, non solum quod unus Deus est, sed
    étiam quod Trínitas est, naturáliter verum est; proptérea ipse verus Deus in
    persónis Trínitas est, et in una natúra unus est.
responsory5:
  - R. Tibi laus, tibi glória, tibi gratiárum áctio in sǽcula sempitérna,
  - "* O beáta Trínitas."
  - "V. Et benedíctum nomen glóriæ tuæ sanctum: et laudábile et superexaltátum
    in sǽcula."
  - R. O beáta Trínitas.
lectio6:
  - "Per hanc unitátem naturálem totus Pater in Fílio et Spíritu Sancto est,
    totus Fílius in Patre et Spíritu Sancto est, totus quoque Spíritus Sanctus
    in Patre et Fílio. Nullus horum extra quémlibet ipsórum est: quia nemo álium
    aut præcédit æternitáte, aut excédit magnitúdine, aut súperat potestáte:
    quia nec Fílio nec Spíritu Sancto, quantum ad natúræ divínæ unitátem
    pértinet, aut antérior aut major Pater est; nec Fílii ætérnitas atque
    imménsitas, velut antérior aut major, Spíritus Sancti immensitátem
    æternitatémque aut præcédere aut excédere naturáliter potest."
responsory6:
  - "R. Magnus Dóminus, et laudábilis nimis:"
  - "* Et sapiéntiæ ejus non est númerus."
  - "V. Magnus Dóminus, et magna virtus ejus: et sapiéntiæ ejus non est finis."
  - R. Et sapiéntiæ ejus non est númerus.
  - "&Gloria"
  - R. Et sapiéntiæ ejus non est númerus.
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 28:18-20"
  - "In illo témpore: Dixit Jesus discípulis suis: Data est mihi omnis potéstas
    in cælo et in terra. Eúntes ergo docéte omnes gentes, baptizántes eos in
    nómine Patris, et Fílii, et Spíritus Sancti. Et réliqua."
  - _
  - Homilía sancti Gregórii Nazianzéni
  - "!In Tractatu de fide, post init."
  - "Quis catholicórum ignórat Patrem vere esse Patrem, Fílium vere esse Fílium,
    et Spíritum Sanctum vere esse Spíritum Sanctum? sicut ipse Dóminus ad
    Apóstolos suos dicit: Eúntes baptizáte omnes gentes in nómine Patris, et
    Fílii, et Spíritus Sancti. Hæc est perfécta Trínitas in unitáte consístens,
    quam scílicet uníus substántiæ profitémur. Non enim nos secúndum córporum
    conditiónem, divisiónem in Deo fácimus; sed secúndum divínæ natúræ
    poténtiam, quæ in matéria non est, et nóminum persónas vere constáre
    crédimus, et unitátem divinitátis esse testámur."
responsory7:
  - "R. Benedicámus Patrem et Fílium cum Sancto Spíritu:"
  - "* Laudémus et superexaltémus eum in sǽcula."
  - "V. Benedíctus es, Dómine, in firmaménto cæli: et laudábilis et gloriósus in
    sǽcula."
  - R. Laudémus et superexaltémus eum in sǽcula.
lectio8:
  - "@:Lectio8a"
rubrica-1960/lectio8:
  - "@:Lectio8a:s/ Dénique.*//s"
lectio8a:
  - "Nec extensiónem partis alicújus ex parte, ut quidam putavérunt, Dei Fílium
    dícimus: nec verbum sine re, velut sonum vocis, accípimus: sed tria nómina
    et tres persónas uníus esse esséntiæ, uníus majestátis atque poténtiæ
    crédimus. Et ídeo unum Deum confitémur: quia únitas majestátis, plúrium
    vocábulo deos próhibet appellári. Dénique Patrem et Fílium cathólice
    nominámus; duos autem Deos dícere, nec póssumus, nec debémus. Non quod
    Fílius Dei Deus non sit, immo verus Deus de Deo vero; sed quia non aliúnde,
    quam de ipso uno Patre, Dei Fílium nóvimus, perínde unum Deum dícimus. Hoc
    enim Prophétæ, hoc Apóstoli tradidérunt: hoc ipse Dóminus dócuit, cum dicit:
    Ego et Pater unum sumus. Unum ad unitátem divinitátis, ut dixi, refert;
    Sumus autem, persónis assígnat."
responsory8:
  - "R. Duo Séraphim clamábant alter ad álterum:"
  - "* Sanctus, sanctus, sanctus Dóminus Deus Sábaoth: * Plena est omnis terra
    glória ejus."
  - "V. Tres sunt qui testimónium dant in cælo: Pater, Verbum, et Spíritus
    Sanctus: et hi tres unum sunt."
  - R. Sanctus, sanctus, sanctus Dóminus Deus Sábaoth.
  - "&Gloria"
  - R. Plena est omnis terra glória ejus.
