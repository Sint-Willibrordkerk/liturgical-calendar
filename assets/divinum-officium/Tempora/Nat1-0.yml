lectio:
  - Lectio Epístolæ beati Pauli Apóstoli ad Gálatas.
  - "!Gal 4:1-7"
  - "Fratres: Quanto témpore heres párvulus est, nihil differt a servo, cum sit
    dóminus ómnium: sed sub tutóribus et actóribus est usque ad præfinítum
    tempus a patre: ita et nos, cum essémus párvuli, sub eleméntis mundi erámus
    serviéntes. At ubi venit plenitúdo témporis, misit Deus Fílium suum, factum
    ex mulíere, factum sub lege, ut eos, qui sub lege erant, redímeret, ut
    adoptiónem filiórum reciperémus. Quóniam autem estis fílii, misit Deus
    Spíritum Fílii sui in corda vestra, clamántem: Abba, Pater. Itaque jam non
    est servus, sed fílius: quod si fílius, et heres per Deum."
graduale:
  - "!Ps 44:3; 44:2"
  - "Speciósus forma præ filiis hóminum: diffúsa est gratia in lábiis tuis."
  - "V. Eructávit cor meum verbum bonum, dico ego ópera mea Regi: lingua mea
    cálamus scribæ, velóciter scribéntis. Allelúja, allelúja."
  - "!Ps 92:1."
  - "Dóminus regnávit, decórem índuit: índuit Dóminus fortitúdinem, et præcínxit
    se virtúte. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secundum Lucam.
  - "!Luc 2:33-40"
  - "In illo témpore: Erat Joseph et María Mater Jesu, mirántes super his quæ
    dicebántur de illo. Et benedíxit illis Símeon, et dixit ad Maríam Matrem
    ejus: Ecce, pósitus est hic in ruínam et in resurrectiónem multórum in
    Israël: et in signum, cui contradicétur: et tuam ipsíus ánimam pertransíbit
    gládius, ut reveléntur ex multis córdibus cogitatiónes. Et erat Anna
    prophetíssa, fília Phánuel, de tribu Aser: hæc procésserat in diébus multis,
    et víxerat cum viro suo annis septem a virginitáte sua. Et hæc vídua usque
    ad annos octogínta quátuor: quæ non discedébat de templo, jejúniis et
    obsecratiónibus sérviens nocte ac die. Et hæc, ipsa hora supervéniens,
    confitebátur Dómino, et loquebátur de illo ómnibus, qui exspectábant
    redemptiónem Israël. Et ut perfecérunt ómnia secúndum legem Dómini, revérsi
    sunt in Galilǽam in civitátem suam Názareth. Puer autem crescébat, et
    confortabátur, plenus sapiéntia: et grátia Dei erat in illo."
offertorium:
  - "!Ps 92:1-2"
  - "Deus firmávit orbem terræ, qui non commovébitur: paráta sedes tua, Deus, ex
    tunc, a sǽculo tu es."
secreta:
  - "Concéde, quǽsumus, omnípotens Deus: ut óculis tuæ majestátis munus oblátum,
    et grátiam nobis piæ devotiónis obtineat, et efféctum beátæ perennitátis
    acquírat."
  - $Per Dominum
