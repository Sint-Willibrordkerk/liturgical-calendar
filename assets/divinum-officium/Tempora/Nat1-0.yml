lectio4:
  - Sermo sancti Leónis Papæ
  - "!Sermo 9 de Nativ. Dom."
  - "Excédit quidem, dilectíssimi, multúmque superéminet humáni elóquii
    facultátem divini operis magnitúdo: et inde óritur difficultas fandi, unde
    adest rátio non tacendi. Quia in Christo Jesu Fílio Dei non solum ad divinam
    esséntiam, sed étiam ad humanam spectat natúram quod dictum est per
    prophétam: Generatiónem ejus quis enarrábit? Utrámque enim substántiam in
    unam convenísse persónam, nisi fides credat, sermo non explicat. Et ideo
    numquam materia déficit laudis, quia numquam sufficit copia laudatóris."
responsory4:
  - "@Sancti/12-25:Responsory5"
lectio5:
  - Gaudeámus ígitur, quod ad eloquéndum tantæ misericórdiæ sacraméntum ímpares
    sumus; et cum salútis nostræ altitúdinem prómere non valeamus, sentiámus
    nobis bonum esse, quod vincimur. Nemo enim ad cognitiónem veritátis magis
    propinquat, quam qui intélligit in rebus divinis, étiam si multum profíciat,
    semper sibi superesse quod quærat. Nam qui se ad id, in quod tendit,
    pervenísse præsúmit, non quæsíta réperit, sed in inquisitióne déficit.
responsory5:
  - "@Sancti/12-25:Responsory6"
lectio6:
  - "Ne autem infirmitátis nostræ perturbemur angústiis, evangélicæ nos et
    prophéticæ ádjuvant voces; quibus ita accendimur, et docemur, ut nos
    nativitátem Dómini, qua Verbum caro factum est, non tam prætéritam recólere,
    quam præséntem videámur inspícere. Quod enim pastóribus pro gregum suórum
    custódia vigilántibus nuntiávit Angelus, étiam nostrum implévit audítum: et
    ideo Dominicis ovibus præsumus, quia verba divínitus édita cordis aure
    servámus: tamquam et in hodiérna festivitáte dicátur: Evangelizo vobis
    gáudium magnum, quod erit omni pópulo, quia natus est vobis hódie Salvator,
    qui est Christus Dóminus, in civitáte David."
responsory6:
  - "@Sancti/12-25:Responsory7"
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 2:33-40"
  - "In illo témpore: Erat Joseph, et María mater Jesu, mirántes super his, quæ
    dicebántur de illo. Et réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Lib. 2 in cap. 2 Lucæ, prope finem"
  - Vides úberem in omnes grátiam, Dómini generatióne diffúsam, et prophetíam
    incrédulis negátam esse, non justis. Ecce et Símeon prophétat, in ruínam et
    resurrectiónem plurimórum venísse Dóminum Jesum Christum, ut justórum,
    iniquorúmque mérita discérnat; et pro nostrórum qualitáte factórum, judex
    verus et justus aut supplícia decérnat, aut prǽmia.
responsory7:
  - "@Sancti/12-25:Responsory8"
lectio8:
  - Et tuam ipsíus ánimam pertransíbit gládius. Nec littera, nec historia docet,
    ex hac vita Mariam corporalis necis passióne migrasse. Non enim anima, sed
    corpus materiali gládio transverberátur. Et ideo prudéntiam Maríæ haud
    ignaram mysterii cæléstis osténdit. Vivum enim verbum Dei, et válidum, et
    acutius omni gládio acutíssimo, pénetrans usque ad divisiónem ánimæ et
    spíritus, artuum quoque et medullárum, cogitatiónes cordis et secreta
    scrutátur animórum, quia nuda et apérta sunt ómnia Dei Fílio, quem
    consciéntiæ secreta non fallunt.
responsory8:
  - "R. O Regem cæli, cui talia famulántur obsequia: stábulo pónitur, qui
    cóntinet mundum:"
  - "* Jacet in præsépio, et in cælis regnat."
  - V. Natus est nobis hódie Salvator, qui est Christus Dóminus, in civitáte
    David.
  - R. Jacet in præsépio, et in cælis regnat.
  - "&Gloria"
  - R. Jacet in præsépio, et in cælis regnat.
lectio9:
  - Prophetávit ítaque Simeon, prophetáverat virgo, prophetáverat copuláta
    conjugio; prophétare debuit étiam vidua, ne qua aut proféssio deésset, aut
    sexus. Et ideo Anna et stipendiis viduitátis, et móribus talis inducitur, ut
    digna plane fuísse credátur, quæ Redemptórem ómnium venisse nuntiáret. Cujus
    mérita cum álibi descripsérimus, cum víduas hortarémur, hoc loco, quóniam ad
    ália properámus, non putámus iteránda.
  - "&teDeum"
