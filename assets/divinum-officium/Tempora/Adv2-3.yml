rubrica-cisterciensis/rank:
  - ""
  - Feria major
  - "1.15"
lectio1:
  - De Isaía Prophéta
  - "!Isa 16:1-4"
  - 1 Emítte Agnum, Dómine, Dominatórem terræ de Petra desérti ad montem fíliæ
    Sion.
  - "2 Et erit: Sicut avis fúgiens, et pulli de nido avolántes, sic erunt fíliæ
    Moab in transcénsu Arnon."
  - "3 Ini consílium, coge concílium: pone quasi noctem umbram tuam in merídie:
    abscónde fugiéntes, et vagos ne prodas."
  - "4 Habitábunt apud te prófugi mei: Moab esto latíbulum eórum a fácie
    vastatóris."
responsory1:
  - "@Tempora/Adv1-3:Responsory1"
lectio2:
  - "!Isa 16:4-6"
  - 4 Fínitus est enim pulvis, consummátus est miser, defécit qui conculcábat
    terram.
  - 5 Et præparábitur in misericórdia sólium, et sedébit super illud in veritáte
    in tabernáculo David, júdicans et quærens judícium, et velóciter reddens
    quod justum est.
  - "6 Audívimus supérbiam Moab, supérbus est valde: supérbia ejus et arrogántia
    ejus, et indignátio ejus, plus quam fortitúdo ejus."
responsory2:
  - "@Tempora/Adv1-3:Responsory2"
lectio3:
  - "!Isa 16:7-8"
  - "7 Idcírco ululábit Moab ad Moab, univérsus ululábit: his, qui lætántur
    super muros cocti láteris, loquímini plagas suas."
  - "8 Quóniam suburbána Hésebon desérta sunt, et víneam Sábama dómini géntium
    excidérunt: flagélla ejus usque ad Jazer pervenérunt: erravérunt in desérto,
    propágines ejus relictæ sunt, transiérunt mare."
responsory3:
  - "@Tempora/Adv2-0:Responsory9"
rubrica-cisterciensis/ant-laudes:
  - "@Tempora/Adv2-0"
ant-2:
  - Ecce ego mitto * Angelum meum, qui præparábit viam meam ante fáciem tuam.
ant-3:
  - Sion, renováberis, * et vidébis justum tuum, qui ventúrus est in te.
