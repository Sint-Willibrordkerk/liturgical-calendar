oratio:
  - "Dírigat corda nostra, quǽsumus, Dómine, tuæ miseratiónis operátio: quia
    tibi sine te placére non póssumus."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Corinthios
  - "!1 Cor 1:4-8"
  - "Fratres: Grátias ago Deo meo semper pro vobis in grátia Dei, quæ data est
    vobis in Christo Jesu: quod in ómnibus dívites facti estis in illo, in omni
    verbo et in omni sciéntia: sicut testimónium Christi confirmátum est in
    vobis: ita ut nihil vobis desit in ulla grátia, exspectántibus revelatiónem
    Dómini nostri Jesu Christi, qui et confirmábit vos usque in finem sine
    crímine, in die advéntus Dómini nostri Jesu Christi."
graduale:
  - "!Ps 121:1; 121:7"
  - "Lætátus sum in his, quæ dicta sunt mihi: in domum Dómini íbimus."
  - "V. Fiat pax in virtúte tua: et abundántia in túrribus tuis. Allelúja,
    allelúja"
  - "!Ps 101:16"
  - Timébunt gentes nomen tuum, Dómine, et omnes reges terræ glóriam tuam.
    Allelúja.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 9:1-8"
  - "In illo témpore: Ascéndens Jesus in navículam, transfretávit et venit in
    civitátem suam. Et ecce, offerébant ei paralýticum jacéntem in lecto. Et
    videns Jesus fidem illórum, dixit paralýtico: Confíde, fili, remittúntur
    tibi peccáta tua. Et ecce, quidam de scribis dixérunt intra se: Hic
    blasphémat. Et cum vidísset Jesus cogitatiónes eórum, dixit: Ut quid
    cogitátis mala in córdibus vestris? Quid est facílius dícere: Dimittúntur
    tibi peccáta tua; an dícere: Surge et ámbula? Ut autem sciátis, quia Fílius
    hóminis habet potestátem in terra dimitténdi peccáta, tunc ait paralýtico:
    Surge, tolle lectum tuum, et vade in domum tuam. Et surréxit et ábiit in
    domum suam. Vidéntes autem turbæ timuérunt, et glorificavérunt Deum, qui
    dedit potestátem talem homínibus."
offertorium:
  - "!Exodi 24:4; 24:5"
  - "Sanctificávit Móyses altáre Dómino, ófferens super illud holocáusta et
    ímmolans víctimas: fecit sacrifícium vespertínum in odórem suavitátis Dómino
    Deo, in conspéctu filiórum Israël."
secreta:
  - "Deus, qui nos, per hujus sacrifícii veneránda commércia, uníus summæ
    divinitátis partícipes éfficis: præsta, quǽsumus; ut, sicut tuam cognóscimus
    veritátem, sic eam dignis móribus assequámur."
  - $Per Dominum
communio:
  - "!Ps 95:8-9"
  - "Tóllite hóstias, et introíte in átria ejus: adoráte Dóminum in aula sancta
    ejus."
postcommunio:
  - "Grátias tibi reférimus, Dómine, sacro múnere vegetáti: tuam misericórdiam
    deprecántes; ut dignos nos ejus participatióne perfícias."
  - $Per Dominum
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 9:1-8"
  - "In illo témpore: Ascéndens Jesus in navículam transfretávit et venit in
    civitátem suam. Et réliqua."
  - _
  - Homilía sancti Petri Chrysólogi
  - "!Sermo 50"
  - Christum in humánis áctibus divína gessísse mystéria, et in rebus
    visibílibus invisibília exercuísse negótia, léctio hodiérna monstrávit.
    Ascéndit, inquit, in navículam, et transfretávit, et venit in civitátem
    suam. Nonne ipse est, qui, fugátis flúctibus, maris profúnda nudávit, ut
    Israëlíticus pópulus inter stupéntes undas sicco vestígio velut móntium
    cóncava pertransíret? Nonne hic est, qui Petri pédibus marínos vórtices
    inclinávit, ut iter líquidum humánis gréssibus sólidum præbéret obséquium.
lectio8:
  - "Et quid est, quod ipse sibi sic maris dénegat servitútem, ut brevíssimi
    lacus tránsitum sub mercéde náutica transfretáret? Ascéndit, inquit, in
    navículam, et transfretávit. Et quid mirum, fratres? Christus venit
    suscípere infirmitátes nostras, et suas nobis conférre virtútes; humána
    quǽrere, præstáre divína; accípere injúrias, réddere dignitátes; ferre
    tǽdia, reférre sanitátes: quia médicus, qui non fert infirmitátes, curáre
    nescit; et qui non fúerit cum infírmo infirmátus, infírmo non potest
    conférre sanitátem."
lectio9:
  - Christus ergo, si in suis mansísset virtútibus, commúne cum homínibus nil
    habéret; et nisi implésset carnis órdinem, carnis in illo esset otiósa
    suscéptio. Ascéndit, inquit, in navículam, et transfretávit, et venit in
    civitátem suam. Creátor rerum orbis Dóminus, posteáquam se propter nos
    nostra angustávit in carne, cœpit habére humánam pátriam, cœpit civitátis
    Judáicæ esse civis, paréntes habére cœpit paréntum ómnium ipse parens; ut
    invitáret amor, attráheret cáritas, vincíret afféctio, suadéret humánitas,
    quos fúgerat dominátio, metus dispérserat, fécerat vis potestátis extórres.
  - "&teDeum"
ant-2:
  - "Dixit Dóminus * paralýtico: Confíde, fili, remittúntur tibi peccáta tua."
ant-3:
  - "Tulit ergo * paralýticus lectum suum, in quo jacébat, magníficans Deum: et
    omnis plebs, ut vidit, dedit laudem Deo."
