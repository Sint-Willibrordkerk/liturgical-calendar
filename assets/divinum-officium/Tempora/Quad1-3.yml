  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Lib. 7 in Lucæ cap. 11"
  - Judæórum plebe damnáta, Ecclésiæ mystérium evidénter exprímitur, quæ in
    Ninivítis per pœniténtiam, et in regína Austri per stúdium percipiéndæ
    sapiéntiæ, de totíus orbis fínibus congregátur, ut pacífici Salomónis verba
    cognóscat. Regína plane, cujus regnum est indivísum, de divérsis et
    distántibus pópulis in unum corpus assúrgens.
responsory1:
  - "@Tempora/Quad1-0:Responsory7"
lectio2:
  - "Itaque sacraméntum illud magnum est de Christo et Ecclésia. Sed tamen hoc
    majus est, quia illud in figúra ante præcéssit, nunc autem plenum in
    veritáte mystérium est. Illic enim Sálomon typus, hic autem Christus in suo
    córpore est. Ex duóbus ígitur constat Ecclésia: ut aut peccáre nésciat, aut
    peccáre désinat. Pœniténtia enim delíctum ábolet, sapiéntia cavet."
responsory2:
  - "@Tempora/Quad1-0:Responsory8"
lectio3:
  - Céterum Jonæ signum, ut typus Domínicæ passiónis, ita étiam grávium, quæ
    Judǽi commíserint, testificátio peccatórum est. Simul advértere licet et
    majestátis oráculum, et pietátis indícium. Namque Ninivitárum exémplo et
    denuntiátur supplícium, et remédium demonstrátur. Unde étiam Judǽi debent
    non desperáre indulgéntiam, si velint ágere pœniténtiam.
responsory3:
  - "R. Abscóndite eleemósynam in sinu páuperum, et ipsa orábit pro vobis ad
    Dóminum:"
  - "* Quia sicut aqua extínguit ignem, ita eleemósyna extínguit peccátum."
  - V. Date eleemósynam, et ecce ómnia munda sunt vobis.
  - R. Quia sicut aqua extínguit ignem, ita eleemósyna extínguit peccátum.
  - "&Gloria"
