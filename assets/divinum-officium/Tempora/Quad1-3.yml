lectiol1:
  - Léctio libri Exodi
  - "!Exod 24:12-18"
  - "In diébus illis: Dixit Dóminus ad Móysen: Ascénde ad me in montem, et esto
    ibi: dabóque tibi tábulas lapídeas, et legem ac mandáta quæ scripsi: ut
    dóceas fílios Israël. Surrexérunt Moyses et Josue miníster ejus:
    ascendénsque Moyses in montem Dei, senióribus ait: Exspectáte hic, donec
    revertámur ad vos. Habétis Aaron et Hur vobíscum: si quid natum fúerit
    quæstiónis, referétis ad eos. Cumque ascendísset Moyses, opéruit nubes
    montem, et habitávit glória Dómini super Sínai, tegens illum nube sex
    diébus: séptimo autem die vocávit eum de médio calíginis. Erat autem spécies
    glóriæ Dómini, quasi ignis ardens super vérticem montis; in conspéctu
    filiórum Israël. Ingressúsque Móyses médium nébulæ, ascéndit in montem: et
    fuit ibi quadragínta diébus et quadragínta nóctibus."
  - $Deo gratias
gradualel1:
  - "!Ps 24:17-18"
  - "Tribulatiónes cordis mei dilatátæ sunt: de necessitátibus meis éripe me,
    Dómine."
  - "V. Vide humilitátem meam, et labórem meum: et dimítte ómnia peccáta mea."
oratiol1:
  - "Devotiónem pópuli tui, quǽsumus, Dómine, benígnus inténde: ut, qui per
    abstinéntiam macerántur in córpore, per fructum boni óperis reficiántur in
    mente."
  - $Per Dominum
oratio:
  - "Preces nostras, quǽsumus, Dómine, cleménter exáudi: et contra cuncta nobis
    adversántia, déxteram tuæ majestátis exténde."
  - $Per Dominum
lectio:
  - Léctio libri Regum
  - "!3 Reg 19:3-8"
  - "In diébus illis: Venit Elías in Bersabée Juda, et dimísit ibi púerum suum,
    et perréxit in desértum, viam uníus diéi. Cumque venísset, et sedéret subter
    unam juníperum, petívit ánimæ suæ, ut morerétur, et ait: Súfficit mihi,
    Dómine, tolle ánimam meam: neque enim mélior sum quam patres mei.
    Projecítque se, et obdormívit in umbra juníperi: et ecce, Angelus Dómini
    tétigit eum, et dixit illi: Surge et cómede. Respéxit, et ecce ad caput suum
    subcinerícius panis, et vas aquæ: comédit ergo et bibit, et rursum
    obdormívit. Reversúsque est Angelus Dómini secundo, et tétigit eum, dixítque
    illi: Surge, cómede: grandis enim tibi restat via. Qui cum surrexísset,
    comédit et bibit, et ambulávit in fortitúdine cibi illíus quadragínta diébus
    et quadragínta nóctibus, usque ad montem Dei Horeb."
graduale:
  - "!Ps 24:17; 24:18; 24:1-4"
  - "De necessitátibus meis éripe me, Dómine: vide humilitátem meam et labórem
    meum: et dimítte ómnia peccáta mea."
  - "V. Ad te, Dómine, levávi ánimam meam: Deus meus, in te confído, non
    erubéscam: neque irrídeant me inimíci mei."
  - "V. Etenim univérsi, qui te exspéctant, non confundéntur: confundántur omnes
    faciéntes vana."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 12:38-50"
  - "In illo témpore: Respondérunt Jesu quidam de scribis et pharisǽis,
    dicéntes: Magíster, vólumus a te signum vidére. Qui respóndens, ait illis:
    Generátio mala et adúltera signum quærit: et signum non dábitur ei, nisi
    signum Jonæ Prophétæ. Sicut enim fuit Jonas in ventre ceti tribus diébus et
    tribus nóctibus: sic erit Fílius hóminis in corde terræ tribus diébus et
    tribus nóctibus. Viri Ninivítæ surgent in judício cum generatióne ista, et
    condemnábunt eam: quia pæniténtiam egérunt in prædicatióne Jonæ. Et ecce
    plus quam Jonas hic. Regína Austri surget in judício cum generatióne ista,
    et condemnábit eam: quia venit a fínibus terræ audire sapiéntiam Salomónis.
    Et ecce plus quam Sálomon hic. Cum autem immúndus spíritus exíerit ab
    hómine, ámbulat per loca árida, quærens réquiem, et non invénit. Tunc dicit:
    Revértar in domum meam, unde exívi. Et véniens invénit eam vacántem, scopis
    mundátam, et ornátam. Tunc vadit, et assúmit septem álios spíritus secum
    nequióres se, et intrántes hábitant ibi: et fiunt novíssima hóminis illíus
    pejóra prióribus. Sic erit et generatióni huic péssimæ. Adhuc eo loquénte ad
    turbas, ecce, Mater ejus et fratres stabant foris, quæréntes loqui ei. Dixit
    autem ei quidam: Ecce, mater tua et fratres tui foris stant, quæréntes te.
    At ipse respóndens dicénti sibi, ait: Quæ est mater mea, et qui sunt fratres
    mei? Et exténdens manum in discípulos suos, dixit: Ecce mater mea et fratres
    mei. Quicúmque enim fécerit voluntátem Patris mei, qui in cœlis est: ipse
    meus frater et soror et mater est."
offertorium:
  - "!Ps 118:47; 118:48"
  - "Meditábor in mandátis tuis, quæ diléxi valde: et levábo manus meas ad
    mandáta tua, quæ diléxi."
secreta:
  - "@Tempora/Epi5-0:Secreta"
communio:
  - "!Ps 5:2-4"
  - "Intéllege clamórem meum: inténde voci oratiónis meæ, Rex meus et Deus meus:
    quóniam ad te orábo, Dómine."
postcommunio:
  - Tui, Dómine, perceptióne sacraménti, et a nostris mundémur occúltis, et ab
    hóstium liberémur insídiis.
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "V. Mentes nostras, quǽsumus, Dómine, lúmine tuæ claritátis illústra: ut
    vidére possímus, quæ agénda sunt; et, quæ recta sunt, ágere valeámus."
  - $Per Dominum
