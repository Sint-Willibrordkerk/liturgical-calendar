introitus:
  - "!Ps 24:6; 24:3; 24:22"
  - "v. Reminíscere miseratiónum tuárum, Dómine, et misericórdiæ tuæ, quæ a
    sǽculo sunt: ne umquam dominéntur nobis inimíci nostri: líbera nos, Deus
    Israël, ex ómnibus angústiis nostris."
  - "!Ps 24:1-2"
  - "Ad te, Dómine, levávi ánimam meam: Deus meus, in te confído, non erubéscam."
  - "&Gloria"
  - "v. Reminíscere miseratiónum tuárum, Dómine, et misericórdiæ tuæ, quæ a
    sǽculo sunt: ne umquam dominéntur nobis inimíci nostri: líbera nos, Deus
