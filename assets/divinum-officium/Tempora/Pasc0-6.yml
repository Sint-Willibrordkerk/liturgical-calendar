introitus:
  - "!Ps 104:43."
  - "v. Edúxit Dóminus pópulum suum in exsultatióne, allelúja: et eléctos suos
    in lætítia, allelúja, allelúja."
  - "!Ps 104:1"
  - "Confitémini Dómino et invocáte nomen ejus: annuntiáte inter gentes ópera
    ejus."
  - "&Gloria"
  - "v. Edúxit Dóminus pópulum suum in exsultatióne, allelúja: et eléctos suos
    in lætítia, allelúja, allelúja."
oratio:
  - "Concéde, quǽsumus, omnípotens Deus: ut, qui festa paschália venerándo
    égimus, per hæc contíngere ad gáudia ætérna mereámur."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Petri Apóstoli
  - "!1 Pet 2:1-10"
  - "Caríssimi: Deponéntes ígitur omnem malítiam, et omnem dolum, et
    simulatiónes, et invídias, et omnes detractiónes, sicut modo géniti
    infántes, rationábile, sine dolo lac concupíscite: ut in eo crescátis in
    salútem: si tamen gustástis, quóniam dulcis est Dóminus. Ad quem accedéntes
    lápidem vivum, ab homínibus quidem reprobátum, a Deo autem eléctum et
    honorificátum: et ipsi tamquam lápides vivi superædificámini, domus
    spirituális, sacerdótium sanctum, offérre spirituáles hóstias, acceptábiles
    Deo per Jesum Christum. Propter quod cóntinet Scriptúra: Ecce, pono in Sion
    lápidem summum angulárem, eléctum, pretiósum: et qui credíderit in eum, non
    confundátur. Vobis ígitur honor credéntibus: non credéntibus autem lapis,
    quem reprobavérunt ædificántes, hic factus est in caput ánguli, et lapis
    offensiónis, et petra scándali his, qui offéndunt verbo, nec credunt in quo
    et pósiti sunt. Vos autem genus eléctum, regále sacerdótium, gens sancta,
    pópulus acquisitiónis: ut virtútes annuntiétis ejus, qui de ténebris vos
    vocávit in admirábile lumen suum. Qui aliquándo non pópulus, nunc autem
    pópulus Dei: qui non consecúti misericórdiam, nunc autem misericórdiam
    consecúti."
graduale:
  - Allelúja, allelúja.
  - "!Ps 117:24"
  - "Hæc dies, quam fecit Dóminus: exsultémus et lætémur in ea. Allelúja."
  - "!Ps 112:1"
  - Laudáte, púeri, Dóminum, laudáte nomen Dómini.
  - _
  - "! Ab hoc die usque ad Sabbatum Quatuor Temporum Pentecostes inclusive, in
    omnibus Missis, non dicitur Graduale sed quatuor Allelúja cum duobus
    Versibus, ordine infrascripto; in Missa tamen Rogationum, in Vigilia
    Pentecostes et post quamlibet Lectionem in Sabbato Quatuor Temporum ejusdem,
    unum Allelúja dicitur cum unico Versu."
sequentia:
  - "@Tempora/Pasc0-0:Sequentia"
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem.
  - "!Joannes 20:1-9"
  - "In illo témpore: Una sábbati, María Magdaléne venit mane, cum adhuc ténebræ
    essent, ad monuméntum: et vidit lápidem sublátum a monuménto. Cucúrrit ergo,
    et venit ad Simónem Petrum, et ad álium discípulum, quem amábat Jesus, et
    dicit illis: Tulérunt Dóminum de monuménto, et nescímus, ubi posuérunt eum.
    Exiit ergo Petrus et ille álius discípulus, et venérunt ad monuméntum.
    Currébant autem duo simul, et ille álius discípulus præcucúrrit cítius
    Petro, et venit primus ad monuméntum. Et cum se inclinásset, vidit pósita
    linteámina, non tamen introívit. Venit ergo Simon Petrus sequens eum, et
    introívit in monuméntum, et vidit linteámina pósita, et sudárium, quod
    fúerat super caput ejus, non cum linteamínibus pósitum, sed separátim
    involútum in unum locum. Tunc ergo introívit et ille discípulus, qui vénerat
    primus ad monuméntum: et vidit et crédidit: nondum enim sciébant Scriptúram,
    quia oportébat eum a mórtuis resúrgere."
offertorium:
  - "!Ps 7:26-27"
  - "Benedíctus, qui venit in nómine Dómini: benedíximus vobis de domo Dómini:
    Deus Dóminus, et illúxit nobis, allelúja, allelúja."
secreta:
  - "Concéde, quǽsumus, Dómine, semper nos per hæc mystéria paschália gratulári:
    ut contínua nostræ reparatiónis operátio perpétuæ nobis fiat causa lætítiæ."
  - $Per Dominum
communio:
  - "!Gal 3:27"
  - Omnes, qui in Christo baptizáti estis, Christum induístis, allelúja.
postcommunio:
  - "Redemptiónis nostræ múnere vegetáti, quǽsumus, Dómine: ut, hoc perpétuæ
    salútis auxílio, fides semper vera profíciat."
  - $Per Dominum
