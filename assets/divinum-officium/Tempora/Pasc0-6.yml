lectio1:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 20:1-9"
  - "In illo témpore: Una sábbati María Magdaléne venit mane, cum adhuc ténebræ
    essent, ad monuméntum. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 22 in Evangelia"
  - "Léctio sancti Evangélii, quam modo, fratres, audístis, valde in superfície
    histórica est apérta: sed ejus nobis sunt mystéria sub brevitáte requirénda.
    María Magdaléne, cum adhuc ténebræ essent, venit ad monuméntum. Juxta
    históriam notátur hora: juxta intelléctum vero mýsticum, requiréntis
    signátur intellegéntia. María étenim auctórem ómnium, quem in carne víderat
    mórtuum, quærébat in monuménto; et quia hunc mínime invénit, furátum
    crédidit. Adhuc ergo erant ténebræ, cum venit ad monuméntum. Cucúrrit
    cítius, discípulis nuntiávit: sed illi præ céteris cucurrérunt, qui præ
    céteris amavérunt, vidélicet Petrus et Joánnes."
responsory1:
  - "R. Christus resúrgens ex mórtuis, jam non móritur, mors illi ultra non
    dominábitur: quod enim mórtuus est peccáto, mórtuus est semel:"
  - "* Quod autem vivit, vivit Deo, allelúja, allelúja."
  - V. Mórtuus est semel propter delícta nostra, et resurréxit propter
    justificatiónem nostram.
  - R. Quod autem vivit, vivit Deo, allelúja, allelúja.
lectio2:
  - "Currébant autem duo simul: sed Joánnes præcucúrrit cítius Petro. Venit
    prior ad monuméntum, et íngredi non præsúmpsit. Venit ergo postérior Petrus,
    et intrávit. Quid, fratres, quid cursus signíficat? Numquid hæc tam subtílis
    Evangelístæ descríptio a mystériis vacáre credénda est? Mínime. Neque enim
    se Joánnes et præísse, et non intrásse díceret, si in ipsa sui trepidatióne
    mystérium defuísse credidísset. Quid ergo per Joánnem, nisi synagóga: quid
    per Petrum, nisi Ecclésia designátur?"
responsory2:
  - "R. Isti sunt agni novélli, qui annuntiavérunt, allelúja: modo venérunt ad
    fontes,"
  - "* Repléti sunt claritáte, allelúja, allelúja."
  - V. In conspéctu Agni amícti sunt stolis albis, et palmæ in mánibus eórum.
  - R. Repléti sunt claritáte, allelúja, allelúja.
  - "&Gloria"
  - R. Repléti sunt claritáte, allelúja, allelúja.
lectio3:
  - "Nec mirum esse videátur, quod per juniórem synagóga, per seniórem vero
    Ecclésia signári perhibétur: quia etsi ad Dei cultum prior est synagóga,
    quam Ecclésia géntium, ad usum tamen sǽculi prior est multitúdo géntium,
    quam synagóga, Paulo attestánte, qui ait: Quia non prius quod spiritále est,
    sed quod animále. Per seniórem ergo Petrum significátur Ecclésia géntium:
    per juniórem vero Joánnem synagóga Judæórum. Currunt ambo simul: quia ab
    ortus sui témpore usque ad occásum, pari et commúni via, etsi non pari et
    commúni sensu, gentílitas cum synagóga cucúrrit. Venit synagóga prior ad
    monuméntum, sed mínime intrávit: quia legis quidem mandáta percépit,
    prophetías de incarnatióne ac passióne Domínica audívit, sed crédere in
    mórtuum nóluit."
  - "&teDeum"
ant-2:
  - Currébant duo simul, * et ille álius discípulus præcucúrrit cítius Petro, et
    venit prior ad monuméntum, allelúja.
