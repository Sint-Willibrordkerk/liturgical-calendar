introitus:
  - "!Ps 104:3-4."
  - "v. Lætétur cor quæréntium Dóminum: quǽrite Dóminum, et confirmámini:
    quǽrite fáciem ejus semper."
  - "!Ps 104:1"
  - "Confitémini Dómino, et invocáte nomen ejus: annuntiáte inter gentes ópera
    ejus."
  - "&Gloria"
  - "v. Lætétur cor quæréntium Dóminum: quǽrite Dóminum, et confirmámini:
    quǽrite fáciem ejus semper."
oratio:
  - "Præsta, quǽsumus, omnípotens Deus: ut, quos jejúnia votíva castígant, ipsa
    quoque devótio sancta lætíficet; ut, terrénis afféctibus mitigátis, facílius
    cœléstia capiámus."
  - $Per Dominum
lectio:
  - Léctio libri Regum
  - "!4 Reg 4:25-38"
  - "In diébus illis: Venit múlier Sunamítis ad Eliséum in montem Carméli:
    cumque vidísset eam vir Dei e contra, ait ad Giézi púerum suum: Ecce
    Sunamítis illa. Vade ergo in occúrsum ejus, et dic ei: Recte ne ágitur circa
    te, et circa virum tuum, et circa fílium tuum? Quæ respóndit: Recte. Cumque
    venísset ad virum Dei in montem, apprehéndit pedes ejus: et accéssit Giézi,
    ut amovéret eam. Et ait homo Dei: Dimítte illam: ánima enim ejus in
    amaritúdine est, et Dóminus celávit a me, et non indicávit mihi. Quæ dixit
    illi: Numquid petívi fílium a dómino meo? Numquid non dixi tibi: Ne illúdas
    me? Et ille ait ad Giézi: Accínge lumbos tuos, et tolle báculum meum in manu
    tua, et vade. Si occurrérit tibi homo, non salútes eum: et si salutáverit te
    quíspiam, non respóndeas illi: et pones báculum meum super fáciem púeri.
    Porro mater púeri ait: Vivit Dóminus et vivit ánima tua, non dimíttam te.
    Surréxit ergo, et secútus est eam. Giézi autem præcésserat ante eos, et
    posúerat báculum super fáciem púeri, et non erat vox neque sensus:
    reversúsque est in occúrsum ejus, et nuntiávit ei, dicens: Non surréxit
    puer. Ingréssus est ergo Eliséus domum, et ecce, puer mórtuus jacébat in
    léctulo ejus: ingressúsque clausit óstium super se et super púerum: et
    orávit ad Dóminum. Et ascéndit, et incúbuit super púerum: posuítque os suum
    super os ejus, et óculos suos super óculos ejus, et manus suas super manus
    ejus: et incurvávit se super eum: et calefácta est caro púeri. At ille
    revérsus, deambulávit in domo, semel huc atque illuc: et ascéndit et
    incúbuit super eum: et oscitávit puer sépties, aperuítque oculos. At ille
    vocávit Giézi, et dixit ei: Voca Sunamítidem hanc. Quæ vocáta ingréssa est
    ad eum. Qui ait: Tolle fílium tuum. Venit illa, et córruit ad pedes ejus, et
    adorávit super terram: tulítque fílium suum, et egréssa est, et Eliséus
    revérsus est in Gálgala."
graduale:
  - "!Ps 73:20, 19, 22"
  - "Réspice, Dómine, in testaméntum tuum: et ánimas páuperum tuórum ne
    obliviscáris in finem."
  - "V. Exsúrge, Dómine, júdica causam tuam: memor esto oppróbrii servórum
    tuórum."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 7:11-16"
  - "In illo témpore: Ibat Jesus in civitátem, quæ vocátur Naim: et ibant cum eo
    discípuli ejus et turba copiósa. Cum autem appropinquáret portæ civitátis,
    ecce, defúnctus efferebátur fílius únicus matris suæ: et hæc vídua erat, et
    turba civitátis multa cum illa. Quam cum vidísset Dóminus, misericórdia
    motus super eam, dixit illi: Noli flere. Et accéssit et tétigit lóculum. -
    Hi autem, qui portábant, stetérunt - Et ait: Adoléscens, tibi dico, surge.
    Et resédit, qui erat mórtuus, et cœpit loqui. Et dedit illum matri suæ.
    Accépit autem omnes timor: et magnificábant Deum, dicéntes: Quia Prophéta
    magnus surréxit in nobis: et quia Deus visitávit plebem suam."
offertorium:
  - "!Ps 69:2, 3, 4"
  - "Dómine, ad adjuvándum me festína: confundántur omnes, qui cógitant servis
    tuis mala."
secreta:
  - "Purífica nos, miséricors Deus: ut Ecclésiæ tuæ preces, quæ tibi gratæ sunt,
    pia múnera deferéntes, fiant expiátis méntibus gratióres."
  - $Per Dominum
communio:
  - "!Ps 70:16-17, 18"
  - "Dómine, memorábor justítiæ tuæ solíus: Deus, docuísti me a juventúte mea:
    et usque in senéctam et sénium, Deus, ne derelínquas me."
postcommunio:
  - "Cœléstia dona capiéntibus, quǽsumus, Dómine: non ad judícium proveníre
    patiáris, quæ fidélibus tuis ad remédium providísti."
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Pópuli tui, Deus, institútor et rector, peccáta, quibus impugnátur,
    expélle: ut semper tibi plácitus, et tuo munímine sit secúrus."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 7:11-16"
  - "In illo témpore: Ibat Jesus in civitátem, quæ vocátur Naim: et ibant cum eo
    discípuli ejus, et turba copiósa. Et réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Lib. 5 Comment. in Lucæ cap. 7, post initium"
  - "Et hic locus ad utrámque redúndat grátiam; et ut cito flecti divínam
    misericórdiam matris víduæ lamentatióne credámus, ejus præcípue, quæ únici
    fílii vel labóre, vel morte frangátur; cui tamen víduæ gravitátis méritum
    exsequiárum turba concíliet: et ut hanc víduam populórum turba septam, plus
    vidéri esse quam féminam, quæ resurrectiónem únici et adolescéntis fílii
    suis lácrimis merúerit impetráre: eo quod sancta Ecclésia pópulum juniórem a
    pompa fúneris atque a suprémis sepúlcri, suárum révocet ad vitam
    contemplatióne lacrimárum: quæ flere prohibétur eum, cui resurréctio
    debebátur."
responsory1:
  - "@Tempora/Quad4-0:Responsory1"
lectio2:
  - "Qui quidem mórtuus in lóculo materiálibus quátuor ad sepúlcrum ferebátur
    eleméntis, sed spem resurgéndi habébat, quia ferebátur in ligno. Quod etsi
    nobis ante non próderat, tamen posteáquam Jesus id tétigit, profícere cœpit
    ad vitam: ut esset indício, salútem pópulo per crucis patíbulum refundéndam.
    Audíto ígitur Dei verbo, stetérunt acérbi illi fúneris portitóres, qui
    corpus humánum letháli fluxu natúræ materiális urgébant. Quid enim áliud,
    nisi quasi in quodam féretro, hoc est, suprémi fúneris instruménto, jacémus
    exánimes, cum vel ignis immódicæ cupiditátis exǽstuat, vel frígidus humor
    exúndat, vel pigra quadam terréni córporis habitúdine vigor hebetátur
    animórum; vel concréta noster spíritus labe, puræ lucis vácuus mentem alit?
    Hi sunt nostri fúneris portitóres."
responsory2:
  - "@Tempora/Quad4-0:Responsory2"
lectio3:
  - "Sed quamvis supréma mortis spem vitæ omnis aboléverint, et túmulo próxima
    córpora jáceant defunctórum: verbo tamen Dei jam mórtua resúrgunt cadávera:
    vox redit, rédditur fílius matri, revocátur a túmulo, erípitur a sepúlcro.
    Quis iste est túmulus tuus, nisi mali mores? Túmulus tuus perfídia est:
    sepúlcrum tuum guttur est. Sepúlcrum enim patens, est guttur eórum, unde
    verba mórtua proferúntur. Ab hoc sepúlcro te líberat Christus: ab hoc túmulo
    surges, si áudias verbum Dei. Et si grave peccátum est, quod pœniténtiæ
    lácrimis ipse laváre non possis; fleat pro te mater Ecclésia, quæ pro
    síngulis tamquam pro únicis fíliis vídua mater intérvenit. Compátitur enim
    quodam spiritáli dolóre natúræ, cum suos líberos lethálibus vítiis ad mortem
    cernit urgéri."
responsory3:
  - "@Tempora/Quad4-0:Responsory3"
