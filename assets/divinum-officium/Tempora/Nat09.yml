lectio3:
  - "!Rom 13:8-10"
  - "8 Némini quidquam debeátis, nisi ut ínvicem diligátis: qui enim díligit
    próximum, legem implévit."
  - "9 Nam, Non adulterábis, Non occídes, Non furáberis, Non falsum testimónium
    dices, Non concupísces: et si quod est áliud mandátum, in hoc verbo
    instaurátur: Díliges próximum tuum sicut teípsum."
  - 10 Diléctio próximi malum non operátur. Plenitúdo ergo legis est diléctio.
