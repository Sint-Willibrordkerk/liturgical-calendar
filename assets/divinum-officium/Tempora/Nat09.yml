lectio1:
  - De Epístola ad Romános
  - "!Rom 13:1-4"
  - "1 Omnis ánima potestátibus sublimióribus súbdita sit: non est enim potéstas
    nisi a Deo: quæ autem sunt, a Deo ordinátæ sunt."
  - "2 Itaque qui resístit potestáti, Dei ordinatióni resístit. Qui autem
    resístunt, ipsi sibi damnatiónem acquírunt:"
  - "3 nam príncipes non sunt timóri boni óperis, sed mali. Vis autem non timére
    potestátem? Bonum fac: et habébis laudem ex illa;"
  - 4 Dei enim miníster est tibi in bonum.
rubrica-196/responsory1:
  - "@SanctiM/01-07"
rubrica-1960/rubrica-196/responsory1:
  - "@Sancti/01-06:Responsory1InfraOctavam"
lectio2:
  - "!Rom 13:4-7"
  - "4 Si autem malum féceris, time: non enim sine causa gládium portat. Dei
    enim miníster est: vindex in iram ei, qui malum agit."
  - 5 Ideo necessitáte súbditi estóte non solum propter iram, sed étiam propter
    consciéntiam.
  - "6 Ideo enim et tribúta præstátis: minístri enim Dei sunt, in hoc ipsum
    serviéntes."
  - "7 Réddite ómnibus débita: cui tribútum, tribútum: cui vectígal, vectígal:
    cui timórem, timórem: cui honórem, honórem."
