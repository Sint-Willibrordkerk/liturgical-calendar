introitus:
  - "!Ps 67:8 67:9"
  - "v. Deus, dum egrederéris coram pópulo tuo, iter fáciens eis, hábitans in
    illis, allelúja: terra mota est, cœli distillavérunt, allelúja, allelúja."
  - "!Ps. 67:2."
  - "Exsúrgat Deus, et dissipéntur inimíci ejus: et fúgiant, qui odérunt eum, a
    fácie ejus."
  - "&Gloria"
  - "v. Deus, dum egrederéris coram pópulo tuo, iter fáciens eis, hábitans in
