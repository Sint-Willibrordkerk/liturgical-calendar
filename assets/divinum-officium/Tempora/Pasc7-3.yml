lectio1:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 6:44-52"
  - "In illo témpore: Dixit Jesus turbis Judæórum: Nemo potest veníre ad me,
    nisi Pater, qui misit me, tráxerit eum. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tract. 26 in Joann., post init."
  - "Noli cogitáre te invítum trahi: tráhitur ánimus et amóre. Nec timére
    debémus, ne ab homínibus, qui verba perpéndunt, et a rebus máxime divínis
    intellegéndis longe remóti sunt, in hoc Scripturárum sanctárum evangélico
    verbo fórsitan reprehendámur, et dicátur nobis: Quómodo voluntáte credo, si
    trahor? Ego dico: Parum est voluntáte: étiam voluptáte tráheris. Quid est,
    trahi voluptáte? Delectáre in Dómino: et dabit tibi petitiónes cordis tui.
    Est quædam volúptas cordis, cui panis dulcis est ille cæléstis. Porro si
    poétæ dícere lícuit: Trahit sua quemque volúptas: non necéssitas, sed
    volúptas; non obligátio, sed delectátio: quanto fórtius nos dícere debémus,
    trahi hóminem ad Christum, qui delectátur veritáte, delectátur beatitúdine,
    delectátur justítia, delectátur sempitérna vita, quod totum Christus est? An
    vero habent córporis sensus voluptátes suas, et ánimus deséritur a
    voluptátibus suis? Si ánimus non habet voluptátes suas, unde dícitur: Fílii
    autem hóminum sub tégmine alárum tuárum sperábunt: inebriabúntur ab ubertáte
    domus tuæ, et torrénte voluptátis tuæ potábis eos. Quóniam apud te est fons
    vitæ: et in lúmine tuo vidébimus lumen."
responsory1:
  - "R. Disciplínam et sapiéntiam dócuit eos Dóminus, allelúja: firmávit in
    illis grátiam Spíritus sui,"
  - "* Et intelléctu implévit corda eórum, allelúja."
  - V. Repentíno namque sónitu Spíritus Sanctus super eos venit.
  - R. Et intelléctu implévit corda eórum, allelúja.
lectio2:
  - "Da amántem, et sentit quod dico: da desiderántem, da esuriéntem, da in ista
    solitúdine peregrinántem, atque sitiéntem, et fontem ætérnæ pátriæ
    suspirántem: da talem, et scit quid dicam. Si autem frígido loquor, nescit,
    quid loquor. Tales erant isti, qui ínvicem murmurábant. Pater, inquit, quem
    tráxerit, venit ad me. Quid est autem, Pater quem tráxerit, cum ipse
    Christus trahat? Quare vóluit dícere, Pater quem tráxerit? Si trahéndi
    sumus, ab illo trahámur, cui dicit quædam, quæ díligit: Post odórem
    unguentórum tuórum currémus. Sed quid intéllegi vóluit, advertámus fratres,
    et, quantum póssumus, capiámus. Trahit Pater ad Fílium eos, qui proptérea
    credunt in Fílium, quia eum cógitant Patrem habére Deum. Deus enim Pater
    æquálem sibi génuit Fílium; et qui cógitat, atque in fide sua sentit et
    rúminat, æquálem esse Patri eum, in quem credit, ipsum trahit Pater ad
    Fílium."
responsory2:
  - "R. Ite in univérsum orbem, et prædicáte Evangélium, allelúja:"
  - "* Qui credíderit et baptizátus fúerit, salvus erit, allelúja, allelúja,
    allelúja."
  - V. In nómine meo dæmónia ejícient, linguis loquéntur novis, serpéntes
    tollent.
  - R. Qui credíderit et baptizátus fúerit, salvus erit, allelúja, allelúja,
    allelúja.
  - "&Gloria"
  - R. Qui credíderit et baptizátus fúerit, salvus erit, allelúja, allelúja,
    allelúja.
lectio3:
  - "Aríus crédidit creatúram, non eum traxit Pater; quia non consíderat Patrem,
    qui Fílium non credit æquálem. Quid dicis, o Ari? quid dicis, hærétice? quid
    loquéris? Quid est Christus? Non, inquit, Deus verus, sed quem fecit Deus
    verus. Non te traxit Pater; non enim intellexísti Patrem, cujus Fílium
    negas. Aliud cógitas, non est ipse Fílius: nec a Patre tráheris, nec ad
    Fílium tráheris. Aliud est enim Fílius, áliud quod tu dicis. Photínus dicit:
    Homo solum est Christus, non est et Deus. Qui sic credit, non Pater eum
    traxit. Quem traxit Pater? Illum qui dicit: Tu es Christus Fílius Dei vivi.
    Ramum víridem osténdis ovi, et trahis illam. Nuces púero demonstrántur, et
    tráhitur: et quod currit, tráhitur, amándo tráhitur, sine læsióne córporis
    tráhitur, cordis vínculo tráhitur. Si ergo ista, quæ inter delícias et
    voluptátes terrénas revelántur amántibus, trahunt, quóniam verum est, Trahit
    sua quemque volúptas; non trahit revelátus Christus a Patre? Quid enim
    fórtius desíderat ánima, quam veritátem?"
  - "&teDeum"
