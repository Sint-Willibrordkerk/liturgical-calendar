lectiol1:
  - Léctio Actuum Apostolórum
  - "!Act 2:14-21."
  - "In diébus illis: Stans Petrus cum úndecim, levávit vocem suam, et locútus
    est eis: Viri Judǽi, et qui habitátis Jerúsalem univérsi, hoc vobis notum
    sit, et áuribus percípite verba mea. Non enim, sicut vos æstimátis, hi ébrii
    sunt, cum sit hora diéi tértia: sed hoc est, quod dictum est per Prophétam
    Joël: Et erit in novíssimis diébus - dicit Dóminus - effúndam de Spíritu meo
    super omnem carnem, et prophetábunt fílii vestri et fíliæ vestræ, et júvenes
    vestri visiónes vidébunt, et senióres vestri sómnia somniábunt. Et quidem
    super servos meos et super ancíllas meas in diébus illis effúndam de Spíritu
    meo, et prophetábunt: et dabo prodígia in cœlo sursum et signa in terra
    deórsum, sánguinem et ignem et vapórem fumi. Sol convertétur in ténebras et
    luna in sánguinem, antequam véniat dies Dómini magnus et maniféstus. Et
    erit: omnis, quicúmque invocáverit nomen Dómini, salvus erit."
  - $Deo gratias
gradualel1:
  - Alleluia.
  - "!Ps 32:6"
  - Verbo Dómini cœli firmáti sunt, et Spíritu oris ejus omnis virtus eórum.
  - _
  - "#Gloria"
  - v. Glória in excélsis Deo. Et in terra pax homínibus bonæ voluntátis.
    Laudámus te. Benedícimus te. Adorámus te. Glorificámus te. Grátias ágimus
    tibi propter magnam glóriam tuam. Dómine Deus, Rex cæléstis, Deus Pater
    omnípotens. Dómine Fili unigénite, Jesu Christe. Dómine Deus, Agnus Dei,
    Fílius Patris. Qui tollis peccáta mundi, miserére nobis. Qui tollis peccáta
    mundi, súscipe deprecatiónem nostram. Qui sedes ad déxteram Patris, miserére
    nobis. Quóniam tu solus Sanctus. Tu solus Dóminus. Tu solus Altíssimus, Jesu
    Christe. Cum Sancto Spíritu + in glória Dei Patris. Amen.
oratiol1:
  - "Præsta, quǽsumus, omnípotens et miséricors Deus: ut Spíritus Sanctus
    advéniens, templum nos glóriæ suæ dignánter inhabitándo perfíciat."
  - $Per Dominum eiusdem
oratio:
  - "Mentes nostras, quǽsumus, Dómine, Paráclitus, qui a te procédit, illúminet:
    et indúcat in omnem, sicut tuus promísit Fílius, veritátem:"
  - $Qui tecum eiusdem
lectio:
  - Léctio Actuum Apostolórum
  - "!Acts 5:12-16"
  - "In diébus illis: Per manus autem Apostolórum fiébant signa et prodígia
    multa in plebe. Et erant unanímiter omnes in pórticu Salomónis. Ceterórum
    autem nemo audébat se conjúngere illis: sed magnificábat eos pópulus. Magis
    autem augebátur credéntium in Dómino multitúdo virórum ac mulíerum, ita ut
    in pláteas ejícerent infírmos, et pónerent in léctulis ac grabátis, ut,
    veniénte Petro, saltem umbra illíus obumbráret quemquam illórum, et
    liberaréntur ab infirmitátibus suis. Concurrébat autem et multitúdo
    vicinárum civitátum Jerúsalem, afferéntes ægros et vexátos a spirítibus
    immúndis: qui curabántur omnes."
graduale:
  - Allelúja, allelúja.
  - "V. (Hic genuflectitur) Veni, Sancte Spíritus, reple tuórum corda fidélium:
    et tui amóris in eis ignem accénde."
sequentia:
  - "@Tempora/Pasc7-0:Sequentia"
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joannes 6:44-52"
  - "In illo témpore: Dixit Jesus turbis Judæórum: Nemo potest veníre ad me,
    nisi Pater, qui misit me, tráxerit eum: et ego resuscitábo eum in novíssimo
    die. Est scriptum in Prophétis: Et erunt omnes docíbiles Dei. Omnis, qui
    audívit a Patre et dídicit, venit ad me. Non quia Patrem vidit quisquam,
    nisi is, qui est a Deo, hic vidit Patrem. Amen, amen, dico vobis: qui credit
    in me, habet vitam ætérnam. Ego sum panis vitæ. Patres vestri manducavérunt
    manna in desérto, et mórtui sunt. Hic est panis de cœlo descéndens: ut, si
    quis ex ipso manducáverit, non moriátur. Ego sum panis vivus, qui de cœlo
    descéndi. Si quis manducáverit ex hoc pane, vivet in ætérnum: et panis, quem
    ego dabo, caro mea est pro mundi vita."
offertorium:
  - "!Ps 118:47-48"
  - "Meditábor in mandátis tuis, quæ diléxi valde: et levábo manus meas ad
    mandáta tua, quæ diléxi, allelúja."
secreta:
  - "Accipe, quǽsumus, Dómine, munus oblátum: et dignánter operáre; ut, quod
    mystériis ágimus, piis efféctibus celebrámus."
  - $Per Dominum.
communio:
  - "!Joannes 14:27"
  - "Pacem relínquo vobis, allelúja: pacem meam do vobis, allelúja, allelúja."
postcommunio:
  - "Suméntes, Dómine, cœléstia sacraménta, quǽsumus cleméntiam tuam: ut quod
    temporáliter gérimus ætérnis gáudiis consequámur"
  - $Per Dominum.
