lectio1:
  - De Isaía Prophéta
  - "!Isa 14:1-2"
  - "1 Prope est ut véniat tempus ejus, et dies ejus non elongabúntur.
    Miserébitur enim Dóminus Jacob, et éliget adhuc de Israël, et requiéscere
    eos fáciet super humum suam: adjungétur ádvena ad eos, et adhærébit dómui
    Jacob."
  - "2 Et tenébunt eos pópuli, et addúcent eos in locum suum: et possidébit eos
    domus Israël super terram Dómini in servos et ancíllas: et erunt capiéntes
    eos, qui se céperant, et subícient exactóres suos."
responsory1:
  - "@Tempora/Adv1-2:Responsory1"
lectio2:
  - "!Isa 14:3-6"
  - "3 Et erit in die illa, cum réquiem déderit tibi Deus a labóre tuo, et a
    concussióne tua, et a servitúte dura, qua ante servísti:"
  - "4 sumes parábolam istam contra regem Babylónis, et dices: Quómodo cessávit
    exáctor, quiévit tribútum?"
  - 5 Contrívit Dóminus báculum impiórum, virgam dominántium,
  - 6 cædéntem pópulos in indignatióne, plaga insanábili, subiciéntem in furóre
    gentes, persequéntem crudéliter.
responsory2:
  - "@Tempora/Adv1-2:Responsory2"
lectio3:
  - "!Isa 14:12-15"
  - 12 Quómodo cecidísti de cælo, lúcifer, qui mane oriebáris? corruísti in
    terram, qui vulnerábas gentes?
  - "13 qui dicébas in corde tuo: In cælum conscéndam, super astra Dei exaltábo
    sólium meum, sedébo in monte testaménti, in latéribus Aquilónis."
  - 14 Ascéndam super altitúdinem núbium, símilis ero Altíssimo.
  - 15 Verúmtamen ad inférnum detrahéris in profúndum laci.
responsory3:
  - "@Tempora/Adv1-2:Responsory3"
rubrica-cisterciensis/ant-laudes:
  - "@Tempora/Adv2-0"
ant-2:
  - Super te, * Jerúsalem, oriétur Dóminus, et glória ejus in te vidébitur.
ant-3:
  - Vox clamántis * in desérto, Paráte viam Dómini, rectas fácite sémitas Dei
    nostri.
