lectio1:
  - De Epístola ad Romános
  - "!Rom 7:1-3"
  - 1 An ignorátis, fratres, (sciéntibus enim legem loquor) quia lex in hómine
    dominátur, quanto témpore vivit?
  - "2 Nam quæ sub viro est múlier, vivénte viro, alligáta est legi: si autem
    mórtuus fúerit vir ejus, solúta est a lege viri."
  - "3 Igitur, vivénte viro, vocábitur adúltera si fúerit cum álio viro: si
    autem mórtuus fúerit vir ejus, liberáta est a lege viri, ut non sit adúltera
    si fúerit cum álio viro."
responsory1:
  - "@Sancti/12-25:Responsory6"
lectio2:
  - "!Rom 7:4-6"
  - "4 Itaque, fratres mei, et vos mortificáti estis legi per corpus Christi: ut
    sitis altérius, qui ex mórtuis resurréxit, ut fructificémus Deo."
  - 5 Cum enim essémus in carne, passiónes peccatórum, quæ per legem erant,
    operabántur in membris nostris, ut fructificárent morti.
  - 6 Nunc autem solúti sumus a lege mortis, in qua detinebámur, ita ut
    serviámus in novitáte spíritus, et non in vetustáte lítteræ.
responsory2:
  - "@Sancti/01-01:Responsory8"
lectio3:
  - "!Rom 7:7-9"
  - "7 Quid ergo dicémus? lex peccátum est? Absit. Sed peccátum non cognóvi,
    nisi per legem: nam concupiscéntiam nesciébam, nisi lex díceret: Non
    concupísces."
  - 8 Occasióne autem accépta, peccátum per mandátum operátum est in me omnem
    concupiscéntiam. Sine lege enim peccátum mórtuum erat.
  - 9 Ego autem vivébam sine lege aliquándo. Sed cum venísset mandátum, peccátum
    revíxit.
responsory3:
