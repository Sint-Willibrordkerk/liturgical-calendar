introitus:
  - "!Ps 47:10-11."
  - "v. Suscépimus, Deus, misericórdiam tuam in médio templi tui: secúndum nomen
    tuum, Deus, ita et laus tua in fines terræ: justítia plena est déxtera tua."
  - "!Ps 47:2."
  - "Magnus Dóminus, et laudábilis nimis: in civitáte Dei nostri, in monte
    sancto ejus."
  - "&Gloria"
  - "v. Suscépimus, Deus, misericórdiam tuam in médio templi tui: secúndum nomen
    tuum, Deus, ita et laus tua in fines terræ: justítia plena est déxtera tua."
oratio:
  - "Largíre nobis, quǽsumus, Dómine, semper spíritum cogitándi quæ recta sunt,
    propítius et agéndi: ut, qui sine te esse non póssumus, secúndum te vívere
    valeámus."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Romános
  - "!Rom 8:12-17"
  - "Fratres: Debitóres sumus non carni, ut secúndum carnem vivámus. Si enim
    secúndum carnem vixéritis, moriémini: si autem spíritu facta carnis
    mortificavéritis, vivétis. Quicúmque enim spíritu Dei aguntur, ii sunt fílii
    Dei. Non enim accepístis spíritum servitútis íterum in timóre, sed
    accepístis spíritum adoptiónis filiórum, in quo clamámus: Abba  - Pater. -
    Ipse enim Spíritus testimónium reddit spirítui nostro, quod sumus fílii Dei.
    Si autem fílii, et herédes: herédes quidem Dei, coherédes autem Christi."
graduale:
  - "!Ps 30:3"
  - Esto mihi in Deum protectórem, et in locum refúgii, ut salvum me fácias.
  - "!Ps 70:1"
  - "V. Deus, in te sperávi: Dómine, non confúndar in ætérnum."
  - Allelúja, allelúja.
  - "!Ps 47:2"
  - Magnus Dóminus, et laudábilis valde, in civitáte Dei nostri, in monte sancto
    ejus. Allelúja.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 16:1-9"
  - "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Homo quidam
    erat dives, qui habébat víllicum: et hic diffamátus est apud illum, quasi
    dissipásset bona ipsíus. Et vocávit illum et ait illi: Quid hoc audio de te?
    redde ratiónem villicatiónis tuæ: jam enim non póteris villicáre. Ait autem
    víllicus intra se: Quid fáciam, quia dóminus meus aufert a me villicatiónem?
    fódere non váleo, mendicáre erubésco. Scio, quid fáciam, ut, cum amótus
    fúero a villicatióne, recípiant me in domos suas. Convocátis itaque síngulis
    debitóribus dómini sui, dicébat primo: Quantum debes dómino meo? At ille
    dixit: Centum cados ólei. Dixítque illi: Accipe cautiónem tuam: et sede
    cito, scribe quinquagínta. Deínde álii dixit: Tu vero quantum debes? Qui
    ait: Centum coros trítici. Ait illi: Accipe lítteras tuas, et scribe
    octogínta. Et laudávit dóminus víllicum iniquitátis, quia prudénter
    fecísset: quia fílii hujus sǽculi prudentióres fíliis lucis in generatióne
    sua sunt. Et ego vobis dico: fácite vobis amicos de mammóna iniquitátis: ut,
    cum defecéritis, recípiant vos in ætérna tabernácula."
offertorium:
  - "!Ps 17:28; 17:32"
  - "Pópulum húmilem salvum fácies, Dómine, et óculos superbórum humiliábis:
    quóniam quis Deus præter te, Dómine?"
secreta:
  - "Súscipe, quǽsumus, Dómine, múnera, quæ tibi de tua largitáte deférimus: ut
    hæc sacrosáncta mystéria, grátiæ tuæ operánte virtúte, et præséntis vitæ nos
    conversatióne sanctíficent, et ad gáudia sempitérna perdúcant."
  - $Per Dominum
communio:
  - "!Ps 33:9"
  - "Gustáte et vidéte, quóniam suávis est Dóminus: beátus vir, qui sperat in
    eo."
postcommunio:
  - "Sit nobis, Dómine, reparátio mentis et córporis cæléste mystérium: ut,
    cujus exséquimur cultum, sentiámus efféctum."
  - $Per Dominum
ant-1_:
  - Exaudísti, Dómine, * oratiónem servi tui, ut ædificárem templum nómini tuo.
ant-1:
  - "@:Ant 1_"
rubrica-cisterciensis/ant-1:
  - "@:Ant 1C"
ant-1c:
  - "Rex autem David * coopérto cápite incédens lugébat fílium suum, dicens:
    Absalom fili mi, fili mi Absalom, quis mihi det ut ego móriar pro te, fili
    mi Absalom?"
lectio1:
  - De libro tértio Regum
  - "!3 Reg 9:1-5"
  - 1 Factum est autem cum perfecísset Sálomon ædifícium domus Dómini et
    ædifícium regis et omne quod optáverat et volúerat fácere,
  - 2 appáruit ei Dóminus secúndo, sicut apparúerat ei in Gábaon.
  - "3 Dixítque Dóminus ad eum: Exaudívi oratiónem tuam et deprecatiónem tuam,
    quam deprecátus es coram me; sanctificávi domum hanc, quam ædificásti, ut
    pónerem nomen meum ibi in sempitérnum; et erunt óculi mei et cor meum ibi
    cunctis diébus."
  - 4 Tu quoque, si ambuláveris coram me sicut ambulávit pater tuus in
    simplicitáte cordis et in æquitáte, et féceris ómnia quæ præcépi tibi et
    legítima mea et judícia mea serváveris,
  - "5 ponam thronum regni tui super Israël in sempitérnum, sicut locútus sum
    David, patri tuo dicens: Non auferétur vir de génere tuo de sólio Israël."
responsory1:
  - "@Tempora/Pent01-1"
lectio2:
  - "!3 Reg 9:6-9"
  - 6 Si autem aversióne avérsi fuéritis vos et fílii vestri non sequéntes me
    nec custodiéntes mandáta mea et cæremónias meas quas propósui vobis, sed
    abiéritis et coluéritis deos aliénos et adoravéritis eos;
  - 7 áuferam Israël de superfície terræ quam dedi eis, et templum quod
    sanctificávi nómini meo proíciam a conspéctu meo, erítque Israël in
    provérbium et in fábulam cunctis pópulis,
  - "8 et domus hæc erit in exémplum: omnis qui transíerit per eam stupébit et
    sibilábit et dicet: Quare fecit Dóminus sic terræ huic et dómui huic?"
  - "9 Et respondébunt: Quia dereliquérunt Dóminum Deum suum, qui edúxit patres
    eórum de terra Ægýpti, et secúti sunt deos aliénos et adoravérunt eos et
    coluérunt eos; idcírco indúxit Dóminus super eos omne malum hoc."
responsory2:
  - "@Tempora/Pent01-1"
lectio3:
  - "!3 Reg 9:10-14"
  - 10 Explétis autem annis vigínti postquam ædificáverat Sálomon duas domos, id
    est domus Dómini et domum regis
  - 11 (Hiram rege Tyri præbénte Salomóni ligna cédrina et abiégna et aurum
    juxta omne quod opus habúerat), tunc dedit Sálomon Hiram vigínti óppida in
    terra Galilǽæ.
  - 12 Et egréssus est Hiram de Tyro ut vidéret óppida, quæ déderat ei Sálomon,
    et non placuérunt ei,
  - "13 et ait: Hǽcine sunt civitátes, quas dedísti mihi, frater? Et appellávit
    eas terram Chabul usque in diem hanc."
  - 14 Misit quoque Hiram ad regem Salomónem centum vigínti talénta auri.
responsory3:
  - "@Tempora/Pent01-1"
lectio4:
  - Ex libro sancti Augustíni Epíscopi de Civitáte Dei.
  - "!Liber 17. cap. 8. sub medio."
  - Facta est quidem nonnúlla imágo rei futúræ étiam in Salomóne, in eo quod
    templum ædificávit, et pacem hábuit secúndum nomen suum (Sálomon quippe
    pacíficus est Latíne), et in exórdio regni sui mirabíliter laudábilis fuit.
    Sed eádem sua persóna per umbram futúri prænuntiábat étiam ipse Christum
    Dóminum nostrum, non exhibébat. Unde quædam de illo ita scripta sunt, quasi
    de ipso ista prædícta sint, dum Scriptúra sancta étiam rebus gestis
    prophétans, quodámmodo in eo figúram delíneat futurórum.
responsory4:
  - "@Tempora/Pent01-2:Responsory1"
lectio5:
  - "Nam præter libros divínæ históriæ, ubi regnásse narrátur, Psalmus étiam
    septuagésimus primus título nóminis ejus inscríptus est. In quo tam multa
    dicúntur, quæ omníno ei conveníre non possunt, Dómino autem Christo
    aptíssima perspicuitáte convéniunt: ut evidénter appáreat, quod in illo
    figúra qualiscúmque adumbráta sit, in isto autem ipsa véritas præsentáta."
responsory5:
  - "@Tempora/Pent01-2:Responsory2"
lectio6:
  - "Notum est enim quibus términis regnum conclúsum fúerit Salomónis: et tamen
    in eo Psalmo légitur, ut ália táceam: Dominábitur a mari usque ad mare, et a
    flúmine usque ad términos orbis terræ; quod in Christo vidémus impléri. A
    flúmine quippe dominándi sumpsit exórdium, ubi baptizátus a Joánne, eódem
    monstránte, cœpit agnósci a discípulis, qui eum non solum magístrum, verum
    étiam Dóminum appellavérunt."
responsory6:
  - "@Tempora/Pent01-2:Responsory3"
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 16:1-9"
  - "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Homo quidam
    erat dives, qui habébat víllicum, et hic diffamátus est apud illum quasi
    dissipásset bona ipsíus. Et réliqua."
  - _
  - Homilía sancti Hierónymi Presbýteri
  - "!Epistola 151 ad Algasium, quæst. 6, tom. 3"
  - "Si dispensátor iníqui mammónæ, dómini voce laudátur, quod de re iníqua sibi
    justítiam præparárit; et passus dispéndia dóminus laudat dispensatóris
    prudéntiam, quod advérsus dóminum quidem fraudulénter, sed pro se prudénter
    égerit: quanto magis Christus, qui nullum damnum sustinére potest, et pronus
    est ad cleméntiam, laudábit discípulos suos, si in eos qui creditúri sibi
    sunt, misericórdes fúerint?"
responsory7:
  - "@Tempora/Pent01-3:Responsory1"
lectio8:
  - "Dénique post parábolam íntulit: Et ego vobis dico, Fácite vobis amícos de
    iníquo mammóna. Mammóna autem non Hebræórum, sed Syrórum lingua divítiæ
    nuncupántur, quod de iniquitáte colléctæ sint. Si ergo iníquitas bene
    dispensáta vértitur in justítiam; quanto magis sermo divínus, in quo nulla
    est iníquitas, qui et Apóstolis créditus est, si bene fúerit dispensátus,
    dispensatóres suos levábit in cælum?"
responsory8:
  - "@Tempora/Pent01-0:Responsory8"
lectio9:
  - "Quam ob rem séquitur: Qui fidélis est in mínimo, hoc est, in carnálibus; et
    in multis fidélis erit, hoc est, in spirituálibus. Qui autem in parvo
    iníquus est, ut non det frátribus ad uténdum, quod a Deo pro ómnibus est
    creátum; iste et in spirituáli pecúnia dividénda iníquus erit, ut non pro
    necessitáte, sed pro persónis doctrínam Dómini dívidat. Si autem, inquit,
    carnáles divítia, quæ labúntur, non bene dispensátis; veras æternásque
    divítias doctrínæ Dei quis credet vobis?"
  - "&teDeum"
ant-2:
  - "Ait dóminus víllico: * Quid hoc áudio de te? redde ratiónem villicatiónis
    tuæ, allelúja."
ant-3:
  - Quid fáciam, * quia dóminus meus aufert a me villicatiónem? Fódere non
    váleo, mendicáre erubésco. Scio quid fáciam, ut, cum amótus fúero a
    villicatióne, recípiant me in domos suas.
