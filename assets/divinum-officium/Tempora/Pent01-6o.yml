lectio2:
  - "@Tempora/Pent01-6::s/-12/-14/"
  - 13 Prædíxi enim ei quod iudicatúrus essem domum eius in ætérnum propter
    iniquitátem, eo quod nóverat indígne ágere fílios suos, et non corripúerit
    eos.
  - 14 Idcírco iurávi dómui Heli quod non expiétur iníquitas domus eius víctimis
    et munéribus usque in ætérnum.
lectio4:
  - "@Tempora/Pent01-6::s/$/~/"
  - "Hoc itaque Job insinuas dicebat de servis, quibus erat supra modu
    desiderabilis, quod desiderium ostēdentes dicebant: Quis dederit nobis ex
    carnibus ejus impleri? Propterea quidë et Christus id fecit, in majorem nos
    induces charitatem, et suum erga nos ostendens desiderium, nõ tantum se
    præbens cupientibus vidēdum, sed et palpandum, et comedēdum, et carni dentes
    infigere, et coimplicari, et omne desiderium implere."
