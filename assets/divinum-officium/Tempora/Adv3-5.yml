introitus:
  - "!Ps 118:151-152"
  - "v. Prope es tu, Dómine, et omnes viæ tuæ véritas: inítio cognóvi de
    testimóniis tuis, quia in ætérnum tu es."
  - "!Ps 118:1"
  - "Beati immaculáti in via: qui ámbulant in lege Dómini."
  - "&Gloria"
  - "v. Prope es tu, Dómine, et omnes viæ tuæ véritas: inítio cognóvi de
    testimóniis tuis, quia in ætérnum tu es."
oratio:
  - "Excita, quǽsumus, Dómine, poténtiam tuam, et veni: ut hi, qui in tua
    pietáte confídunt, ab omni cítius adversitáte liberéntur:"
  - $Qui vivis
lectio:
  - Léctio Isaíæ Prophétæ
  - "!Is 11:1-5"
  - "Hæc dicit Dóminus Deus: Egrediétur virga de radíce Jesse, et flos de radíce
    ejus ascéndet. Et requiéscet super eum spíritus Dómini: spíritus sapiéntiæ
    et intelléctus, spíritus consílii et fortitúdinis, spíritus sciéntiæ et
    pietátis; et replébit eum spíritus timóris Dómini. Non secundum visiónem
    oculórum judicábit: neque secúndum audítum áurium árguet: sed judicábit in
    justítia páuperes, et árguet in æquitáte pro mansuétis terræ: et percútiet
    terram virga oris sui, et spíritu labiórum suórum interfíciet ímpium. Et
    erit justítia cíngulum lumbórum ejus: et fides cinctórium renum ejus."
graduale:
  - "!Ps 84:8; 84:2"
  - "Osténde nobis, Dómine, misericórdiam tuam: et salutáre tuum da nobis."
  - "V. Benedixísti, Dómine, terram tuam: avertísti captivitátem Jacob."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 1:39-47"
  - "In illo témpore: Exsúrgens María ábiit in montána cum festinatióne in
    civitátem Juda: et intrávit in domum Zacharíæ et salutávit Elísabeth. Et
    factum est, ut audivit salutatiónem Maríæ Elísabeth, exsultávit infans in
    útero ejus: et repléta est Spíritu Sancto Elísabeth, et exclamávit voce
    magna et dixit: Benedícta tu inter mulíeres, et benedíctus fructus ventris
    tui. Et unde hoc mihi, ut véniat Mater Dómini mei ad me? Ecce enim, ut facta
    est vox salutatiónis tuæ in áuribus meis, exsultávit in gáudio infans in
    útero meo. Et beáta, quæ credidísti, quóniam perficiéntur ea, quæ dicta sunt
    tibi a Dómino. Et ait María: Magníficat ánima mea Dóminum: et exsultávit
    spíritus meus in Deo, salutári meo."
offertorium:
  - "!Ps 84:7-8"
  - "Deus, tu convérsus vivificábis nos, et plebs tua lætábitur in te: osténde
    nobis, Dómine, misericórdiam tuam, et salutáre tuum da nobis."
secreta:
  - "@Commune/C2"
communio:
  - "!Zach 14:5"
  - "Ecce, Dóminus véniet et omnes Sancti ejus cum eo: et erit in die illa lux
    magna."
postcommunio:
  - "Tui nos, Dómine, sacraménti libátio sancta restáuret: et a vetustáte
    purgátos, in mystérii salutáris fáciat transíre consórtium."
  - $Per Dominum
