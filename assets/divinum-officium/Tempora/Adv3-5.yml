lectio1:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 1:39-47"
  - "In illo témpore: Exsúrgens María ábiit in montána cum festinatióne in
    civitátem Juda: et intrávit in domum Zacharíæ, et salutávit Elísabeth. Et
    réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Lib. 2 in Luc. cap. 1 post init."
  - "Morále est ómnibus, ut qui fidem éxigunt, fidem ástruant. Et ídeo Angelus,
    cum abscóndita nuntiáret, ut fidem astrúeret exémplo, senióris féminæ
    sterilísque concéptum Vírgini Maríæ nuntiávit: ut possíbile Deo omne, quod
    ei placúerit, asséreret. Ubi audívit hoc María, non quasi incrédula de
    oráculo, nec quasi incérta de núntio, nec quasi dúbitans de exémplo, sed
    quasi læta pro voto, religiósa pro offício, festína pro gáudio, in montána
    perréxit. Quo enim jam Deo plena, nisi ad superióra cum festinatióne
    conténderet? Nescit tarda molímina Sancti Spíritus grátia."
responsory1:
  - R. Emítte Agnum, Dómine, Dominatórem terræ,
  - "* De Petra desérti ad montem fíliæ Sion."
  - V. Osténde nobis, Dómine, misericórdiam tuam, et salutáre tuum da nobis.
  - R. De Petra desérti ad montem fíliæ Sion.
lectio2:
  - Díscite et vos, sanctæ mulíeres, sedulitátem, quam prægnántibus debeátis
    exhibére cognátis. Maríam, quæ ante sola in íntimis penetrálibus versabátur,
    non a público virginitátis pudor, non ab stúdio aspéritas móntium, non ab
    offício prolíxitas itíneris retardávit. In montána Virgo cum festinatióne,
    Virgo offícii memor, injúriæ ímmemor, afféctu urgénte non sexu, relícta
    perréxit domo. Díscite, vírgines, non circumcursáre per aliénas ædes, non
    demorári in platéis, non áliquos in público miscére sermónes. María in domo
    sera, festína in público, mansit apud cognátam suam tribus ménsibus.
responsory2:
  - "R. Roráte, cæli, désuper, et nubes pluant justum:"
  - "* Aperiátur terra, et gérminet Salvatórem."
  - V. Emítte Agnum, Dómine, Dominatórem terræ, de Petra desérti ad montem fíliæ
    Sion.
  - R. Aperiátur terra, et gérminet Salvatórem.
lectio3:
  - "Didicístis, vírgines, pudórem Maríæ: díscite humilitátem. Venit propínqua
    ad próximam, júnior ad seniórem: nec solum venit, sed étiam prior salutávit.
    Decet enim, ut quanto cástior virgo, tanto humílior sit. Nóverit deférre
    senióribus. Sit magístra humilitátis, in qua est proféssio castitátis. Est
    et causa pietátis, est étiam norma doctrínæ. Contuéndum est enim, quia
    supérior venit ad inferiórem, ut inférior adjuvétur: María ad Elísabeth,
    Christus ad Joánnem."
responsory3:
  - "R. Germinavérunt campi erémi germen odóris Israël: quia ecce Deus noster
    cum virtúte véniet,"
  - "* Et splendor ejus cum eo."
  - "V. Ex Sion spécies decóris ejus: Deus noster maniféste véniet."
  - R. Et splendor ejus cum eo.
  - "&Gloria"
  - R. Et splendor ejus cum eo.
