lectio1:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 28:16-20"
  - "In illo témpore: Undecim discípuli abiérunt in Galilǽam in montem, ubi
    constitúerat illis Jesus. Et réliqua."
  - _
  - Homilía sancti Hierónymi Presbýteri
  - "!Lib. 4 Comment. in Matth., in fine"
  - "Post resurrectiónem Jesus in monte Galilǽæ conspícitur, ibíque adorátur;
    licet quidam dúbitent, et dubitátio eórum nostram áugeat fidem. Tunc
    maniféstius osténditur Thomæ, et latus láncea vulnerátum, et manus fixas
    demónstrat clavis. Accédens Jesus locútus est eis, dicens: Data est mihi
    omnis potéstas in cælo et in terra. Illi potéstas data est, qui paulo ante
    crucifíxus, qui sepúltus in túmulo, qui mórtuus jacúerat, qui póstea
    resurréxit. In cælo autem et in terra potéstas data est: ut qui ante
    regnábat in cælo, per fidem credéntium regnet et in terris."
responsory1:
  - "R. Surgens Jesus Dóminus noster, stans in médio discipulórum suórum, dixit:"
  - "* Pax vobis, allelúja: gavísi sunt discípuli viso Dómino, allelúja."
  - V. Una ergo sabbatórum, cum fores essent clausæ, ubi erant discípuli
    congregáti, venit Jesus, et stetit in medio eórum, et dixit eis.
  - "R. Pax vobis, allelúja: gavísi sunt discípuli viso Dómino, allelúja."
lectio2:
  - "Eúntes autem docéte omnes gentes, baptizántes eos in nómine Patris, et
    Fílii, et Spíritus Sancti. Primum docent omnes gentes, deínde doctas
    intíngunt aqua. Non enim potest fíeri, ut corpus baptísmi recípiat
    sacraméntum, nisi ante ánima fídei suscéperit veritátem. Baptizántur autem
    in nómine Patris, et Fílii, et Spíritus Sancti: ut quorum una est divínitas,
    una sit largítio: noménque Trinitátis, unus Deus est."
responsory2:
  - "R. Expurgáte vetus ferméntum, ut sitis nova conspérsio: étenim Pascha
    nostrum immolátus est Christus:"
  - "* Itaque epulémur in Dómino, allelúja."
  - V. Mórtuus est propter delícta nostra, et resurréxit propter justificatiónem
    nostram.
  - R. Itaque epulémur in Dómino, allelúja.
  - "&Gloria"
  - R. Itaque epulémur in Dómino, allelúja.
lectio3:
  - "Docéntes eos serváre ómnia, quæcúmque mandávi vobis. Ordo præcípuus: jussit
    Apóstolis, ut primum docérent univérsas gentes, deínde fídei intíngerent
    sacraménto, et post fidem ac baptísma, quæ essent observánda præcíperent. Ac
    ne putémus lévia esse, quæ jussa sunt, et pauca, áddidit: Omnia quæcúmque
    mandávi vobis: ut quicúmque credíderint, qui in Trinitáte fúerint baptizáti,
    ómnia fáciant, quæ præcépta sunt. Et ecce ego vobíscum sum usque ad
    consummatiónem sǽculi. Qui usque ad consummatiónem sǽculi cum discípulis se
    futúrum esse promíttit, et illos osténdit semper esse victúros, et se
    nunquam a credéntibus recessúrum."
  - "&teDeum"
