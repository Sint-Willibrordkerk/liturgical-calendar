introitus:
  - "!Ps 77:53"
  - "v. Edúxit eos Dóminus in spe, allelúja: et inimícos eórum opéruit mare,
    allelúja, allelúja, allelúja."
  - "!Ps 77:1"
  - "Atténdite, pópule meus, legem meam: inclináte aurem vestram in verba oris
    mei."
  - "&Gloria"
  - "v. Edúxit eos Dóminus in spe, allelúja: et inimícos eórum opéruit mare,
    allelúja, allelúja, allelúja."
oratio:
  - "Omnípotens sempitérne Deus, qui paschále sacraméntum in reconciliatiónis
    humánæ fœ́dere contulísti: da méntibus nostris; ut, quod professióne
    celebrámus, imitémur efféctu."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Petri Apóstoli
  - "!1 Petri 3:18-22"
  - "Caríssimi: Christus semel pro peccátis nostris mórtuus est, justus pro
    injústis, ut nos offérret Deo, mortificátus quidem carne, vivificátus autem
    spíritu. In quo et his, qui in cárcere erant, spirítibus véniens prædicávit:
    qui incréduli fúerant aliquándo, quando exspectábant Dei patiéntiam in
    diébus Noë, cum fabricarétur arca, in qua pauci, id est octo ánimæ salvæ
    factæ sunt per aquam. Quod et vos nunc símilis formæ salvos facit baptísma:
    non carnis deposítio sórdium, sed consciéntiæ bonæ interrogátio in Deum per
    resurrectiónem Jesu Christi, Dómini nostri, qui est in dextera Dei."
graduale:
  - "!Ps 117:24; 117:26-27"
  - "Hæc dies, quam fecit Dóminus: exsultémus et lætémur in ea."
  - "V. Benedíctus, qui venit in nómine Dómini: Deus Dóminus, et illúxit nobis."
  - Allelúja, allelúja.
  - "!Ps 95:10"
  - "Dícite in géntibus: quia Dóminus regnávit a ligno."
sequentia:
  - "@Tempora/Pasc0-0:Sequentia"
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 28:16-20"
  - "In illo témpore: Undecim discípuli abiérunt in Galilǽam, in montem, ubi
    constitúerat illis Jesus. Et vidéntes eum adoravérunt: quidam autem
    dubitavérunt. Et accédens Jesus locútus est eis, dicens: Data est mihi omnis
    potéstas in cœlo, et in terra. Eúntes ergo, docéte omnes gentes, baptizántes
    eos in nómine Patris, et Fílii, et Spíritus Sancti: docéntes eos serváre
    ómnia, quæcúmque mandávi vobis. Et ecce, ego vobíscum sum ómnibus diébus
    usque ad consummatiónem sǽculi."
offertorium:
  - "!Exod 12:14"
  - "Erit vobis hæc dies memoriális, allelúja: et diem festum celebrábitis
    solémnem Dómino in progénies vestras: legítimum sempitérnum diem, allelúja,
    allelúja, allelúja."
secreta:
  - "Hóstias, quǽsumus, Dómine, placátus assúme: quas et pro renatórum
    expiatióne peccáti deférimus, et pro acceleratióne cœléstis auxílii."
  - $Per Dominum
communio:
  - "!Matt 28:18-19"
  - "Data est mihi omnis potéstas in cœlo et in terra, allelúja: eúntes, docéte
    omnes gentes, baptizántes eos in nómine Patris, et Fílii, et Spíritus
    Sancti, allelúja, allelúja."
postcommunio:
  - "Réspice, quǽsumus, Dómine, pópulum tuum: et, quem ætérnis dignátus es
    renováre mystériis, a temporálibus culpis dignánter absólve."
  - $Per Dominum
