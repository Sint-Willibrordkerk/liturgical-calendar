  - "Et véniunt in prǽdium, cui nomen Gethsémani. Et ait discípulis suis: J.
    Sedéte hic, donec orem. C. Et assúmit Petrum et Jacóbum et Joánnem secum: et
    cœpit pavére et tædére. Et ait illis: J. Tristis est ánima mea usque ad
    mortem: sustinéte hic, et vigiláte. C. Et cum processísset páululum,
    prócidit super terram: et orábat, ut, si fíeri posset, transíret ab eo hora:
    et dixit: J. Abba, Pater, ómnia tibi possibília sunt, transfer cálicem hunc
    a me: sed non quod ego volo, sed quod tu. C. Et venit et invénit eos
    dormiéntes. Et ait Petro: J. Simon, dormis? non potuísti una hora vigiláre?
    Vigiláte et oráte, ut non intrétis in tentatiónem. Spíritus quidem promptus
    est, caro vero infírma. C. Et íterum ábiens orávit, eúndem sermónem dicens.
    Et revérsus, dénuo invénit eos dormiéntes - erant enim óculi eórum graváti -
    et ignorábant, quid respondérent ei. Et venit tértio, et ait illis: J.
    Dormíte jam et requiéscite. Súfficit: venit hora: ecce, Fílius hóminis
    tradétur in manus peccatórum. Súrgite, eámus: ecce, qui me tradet, prope
    est. C. Et, adhuc eo loquénte, venit Judas Iscariótes, unus de duódecim, et
    cum eo turba multa cum gládiis et lignis, a summis sacerdótibus et scribis
    et senióribus. Déderat autem tráditor ejus signum eis, dicens: S. Quemcúmque
    osculátus fúero, ipse est, tenéte eum et dúcite caute. C. Et cum venísset,
    statim accédens ad eum, ait: S. Ave, Rabbi. C. Et osculátus est eum. At illi
    manus injecérunt in eum, et tenuérunt eum. Unus autem quidam de
    circumstántibus, edúcens gládium, percússit servum summi sacerdótis: et
    amputávit illi aurículam. Et respóndens Jesus, ait illis: J. Tamquam ad
    latrónem exístis cum gládiis et lignis comprehéndere me? cotídie eram apud
    vos in templo docens, et non me tenuístis. Sed ut impleántur Scriptúræ. C.
    Tunc discípuli ejus relinquéntes eum, omnes fugérunt. Adoléscens autem
    quidam sequebátur eum amíctus síndone super nudo: et tenuérunt eum. At ille,
    rejécta síndone, nudus profúgit ab eis. Et adduxérunt Jesum ad summum
    sacerdótem: et convenérunt omnes sacerdótes et scribæ et senióres. Petrus
    autem a longe secútus est eum usque intro in átrium summi sacerdótis: et
    sedébat cum minístris ad ignem, et calefaciébat se. Summi vero sacerdótes et
    omne concílium quærébant advérsus Jesum testimónium, ut eum morti tráderent,
    nec inveniébant. Multi enim testimónium falsum dicébant advérsus eum: et
    conveniéntia testimónia non erant. Et quidam surgéntes, falsum testimónium
    ferébant advérsus eum, dicéntes: S. Quóniam nos audívimus eum dicéntem: Ego
    dissólvam templum hoc manufáctum, et per tríduum áliud non manufáctum
    ædificábo. C. Et non erat convéniens testimónium illórum. Et exsúrgens
    summus sacérdos in médium, interrogávit Jesum, dicens: S. Non respóndes
    quidquam ad ea, quæ tibi objiciúntur ab his? C. Ille autem tacébat et nihil
    respóndit. Rursum summus sacérdos interrogábat eum, et dixit ei: S. Tu es
    Christus, Fílius Dei benedícti? C. Jesus autem dixit illi: J. Ego sum: et
    vidébitis Fílium hóminis sedéntem a dextris virtútis Dei, et veniéntem cum
    núbibus cœli. C. Summus autem sacérdos scindens vestiménta sua, ait: S. Quid
    adhuc desiderámus testes? Audístis blasphémiam: quid vobis videtur? C. Qui
    omnes condemnavérunt eum esse reum mortis. Et cœpérunt quidam conspúere eum,
    et veláre fáciem ejus, et cólaphis eum cǽdere, et dícere ei: S. Prophetíza.
    C. Et minístri álapis eum cædébant. Et cum esset Petrus in átrio deórsum,
    venit una ex ancíllis summi sacerdótis: et cum vidísset Petrum calefaciéntem
    se, aspíciens illum, ait: S. Et tu cum Jesu Nazaréno eras. C. At ille
    negávit, dicens: S. Neque scio neque novi, quid dicas. C. Et éxiit foras
    ante átrium, et gallus cantávit. Rursus autem cum vidísset illum ancílla,
    cœpit dícere circumstántibus: Quia hic ex illis est. At ille íterum negávit.
    Et post pusíllum rursus, qui astábant, dicébant Petro: S. Vere ex illis es:
    nam et Galilǽus es. C. Ille autem cœpit anathematizáre et juráre: Quia
    néscio hóminem istum, quem dícitis. Et statim gallus íterum cantávit. Et
    recordátus est Petrus verbi, quod díxerat ei Jesus: Priúsquam gallus cantet
    bis, ter me negábis. Et cœpit flere. Et conféstim mane consílium faciéntes
    summi sacerdótes, cum senióribus et scribis et univérso concílio, vinciéntes
    Jesum, duxérunt, et tradidérunt Piláto. Et interrogávit eum Pilátus: S. Tu
    es Rex Judæórum? C. At ille respóndens, ait illi: J. Tu dicis. C. Et
    accusábant eum summi sacerdótes in multis. Pilátus autem rursum interrogávit
    eum, dicens: S. Non respóndes quidquam? vide, in quantis te accúsant. C.
    Jesus autem ámplius nihil respóndit, ita ut mirarétur Pilátus. Per diem
    autem festum solébat dimíttere illis unum ex vinctis, quemcúmque petiíssent.
    Erat autem, qui dicebátur Barábbas, qui cum seditiósis erat vinctus, qui in
    seditióne fécerat homicídium. Et cum ascendísset turba, cœpit rogáre, sicut
    semper faciébat illis. Pilátus autem respóndit eis, et dixit: S. Vultis
    dimíttam vobis Regem Judæórum? C. Sciébat enim, quod per invídiam
    tradidíssent eum summi sacerdótes. Pontífices autem concitavérunt turbam, ut
    magis Barábbam dimítteret eis. Pilátus autem íterum respóndens, ait illis:
    S. Quid ergo vultis fáciam Regi Judæórum? C. At illi íterum clamavérunt: S.
    Crucifíge eum. C. Pilátus vero dicébat illis: S. Quid enim mali fecit? C. At
    illi magis clamábant: S. Crucifíge eum. C. Pilátus autem volens pópulo
    satisfácere, dimísit illis Barábbam, et trádidit Jesum flagéllis cæsum, ut
    crucifigerétur. Mílites autem duxérunt eum in átrium prætórii, et cónvocant
    totam cohórtem, et índuunt eum púrpura, et impónunt ei plecténtes spíneam
    corónam. Et cœpérunt salutáre eum: Ave, Rex Judæórum. Et percutiébant caput
    ejus arúndine: et conspuébant eum et, ponéntes génua, adorábant eum. Et
    postquam illusérunt ei, exuérunt illum púrpura, et induérunt eum vestiméntis
    suis: et edúcunt illum, ut crucifígerent eum. Et angariavérunt prætereúntem
    quémpiam, Simónem Cyrenǽum, veniéntem de villa, patrem Alexándri et Rufi, ut
    tólleret crucem ejus. Et perdúcunt illum in Gólgotha locum, quod est
    interpretátum Calváriæ locus. Et dabant ei bíbere myrrhátum vinum: et non
    accépit. Et crucifigéntes eum, divisérunt vestiménta ejus, mitténtes sortem
    super eis, quis quid tólleret. Erat autem hora tértia: et crucifixérunt eum.
    Et erat títulus causæ ejus inscríptus: Rex Judæórum. Et cum eo crucifígunt
    duos latrónes: unum a dextris et alium a sinístris ejus. Et impléta est
    Scriptúra, quæ dicit: Et cum iníquis reputátus est. Et prætereúntes
    blasphemábant eum, movéntes cápita sua et dicéntes: S. Vah, qui déstruis
    templum Dei, et in tribus diébus reædíficas: salvum fac temetípsum,
    descéndens de cruce. C. Simíliter et summi sacerdótes illudéntes, ad
    altérutrum cum scribis dicébant: S. Alios salvos fecit, seípsum non potest
    salvum fácere. Christus Rex Israël descéndat nunc de cruce, ut videámus et
    credámus. C. Et qui cum eo crucifíxi erant, convitiabántur ei. Et facta hora
    sexta, ténebræ factæ sunt per totam terram, usque in horam nonam. Et hora
    nona exclamávit Jesus voce magna, dicens: J. Eloi, Eloi, lamma sabactháni?
    C. Quod est interpretátum: J. Deus meus, Deus meus, ut quid dereliquísti me?
    C. Et quidam de circumstántibus audiéntes, dicébant: S. Ecce, Elíam vocat.
    C. Currens autem unus, et implens spóngiam acéto, circumponénsque cálamo,
    potum dabat ei, dicens: S. Sínite, videámus, si véniat Elías ad deponéndum
    eum. C. Jesus autem emíssa voce magna exspirávit. (Hic genuflectitur, et
    pausatur aliquantulum) Et velum templi scissum est in duo, a summo usque
    deórsum. Videns autem centúrio, qui ex advérso stabat, quia sic clamans
    exspirásset, ait: S. Vere hic homo Fílius Dei erat. C. Erant autem et
    mulíeres de longe aspiciéntes: inter quas erat María Magdaléne, et María
    Jacóbi minóris, et Joseph mater, et Salóme: et cum esset in Galilǽa,
    sequebántur eum, et ministrábant ei, et áliæ multæ, quæ simul cum eo
    ascénderant Jerosólymam. ~"
  - _
  - "v. Munda cor meum ac lábia mea, omnípotens Deus, qui lábia Isaíæ Prophétæ
    cálculo mundásti igníto: ita me tua grata miseratióne dignáre mundáre, ut
    sanctum Evangélium tuum digne váleam nuntiáre. Per Christum, Dóminum
    nostrum. Amen."
  - D. Jube, domne, benedicere.
  - "S. Dóminus sit in corde tuo et in lábiis tuis: ut digne et competénter
    annúnties Evangélium suum: In nómine Patris, et Fílii, + et Spíritus Sancti.
    Amen."
  - _
  - Et cum jam sero esset factum ((quia erat Parascéve, quod est ante sábbatum))
    venit Joseph ab Arimathǽa, nóbilis decúrio, qui et ipse erat exspéctans
    regnum Dei, et audácter introívit ad Pilátum, et pétiit corpus Jesu. Pilátus
    autem mirabátur, si jam obiísset. Et accersíto centurióne, interrogávit eum,
    si jam mórtuus esset. Et cum cognovísset a centurióne, donávit corpus
    Joseph. Joseph autem mercátus síndonem, et depónens eum invólvit síndone, et
    pósuit eum in monuménto, quod erat excísum de petra, et advólvit lápidem ad
    óstium monuménti.
