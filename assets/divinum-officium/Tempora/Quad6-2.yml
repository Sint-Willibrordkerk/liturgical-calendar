  - "Discérne causam meam, * Dómine: ab hómine iníquo et dolóso éripe me."
  - Dum tribulárer, * clamávi ad Dóminum de ventre ínferi, et exaudívit me.
  - "Dómine, vim pátior, * respónde pro me: quia néscio quid dicam inimícis
    meis."
  - "Dixérunt ímpii: * Opprimámus virum justum, quóniam contrárius est opéribus
    nostris."
