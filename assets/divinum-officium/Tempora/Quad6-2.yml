  - v. Pássio Dómini nostri Jesu Christi secúndum Marcum
  - "!Marc 14:32-72; 15, 1-46"
  - "In illo témpore: Erat Pascha, et ázyma post bíduum, et quærébant summi
    sacerdótes et scribæ, quómodo Jesum dolo tenérent et occíderent. Dicébant
    autem: S. Non in die festo, ne forte tumúltus fíeret in pópulo. C. Et cum
    esset Jesus Bethániæ in domo Simónis leprósi, et recúmberet: venit múlier
    habens alabástrum unguénti nardi spicáti pretiósi, et fracto alabástro,
    effúdit super caput ejus. Erant autem quidam indígne feréntes intra
    semetípsos, et dicéntes: S. Ut quid perdítio ista unguénti facta est?
    Póterat enim unguéntum istud venúmdari plus quam trecéntis denáriis, et dari
    paupéribus. C. Et fremébant in eam. Jesus autem dixit: J. Sínite eam: quid
    illi molésti estis? Bonum opus operáta est in me. Semper enim páuperes
    habétis vobíscum: et cum voluéritis, potéstis illis benefácere: me autem non
    semper habétis. Quod hábuit hæc, fecit: prævénit úngere corpus meum in
    sepultúram. Amen, dico vobis: Ubicúmque prædicátum fúerit Evangélium istud
    in univérso mundo, et, quod fecit hæc, narrábitur in memóriam ejus. C. Et
    Judas Iscariótes, unus de duódecim, ábiit ad summos sacerdótes, ut próderet
    eum illis. Qui audiéntes, gavísi sunt: et promisérunt ei pecúniam se
    datúros. Et quærébat, quómodo illum opportúne tráderet. Et primo die
    azymórum quando pascha immolábant, dicunt ei discípuli: S. Quo vis eámus, et
    parémus tibi, ut mandúces pascha? C. Et mittit duos ex discípulis suis, et
    dicit eis: J. Ite in civitátem: et occúrret vobis homo lagénam aquæ
    bájulans, sequímini eum: et quocúmque introíerit, dícite dómino domus, quia
    Magíster dicit: Ubi est reféctio mea, ubi pascha cum discípulis meis
    mandúcem? Et ipse vobis demonstrábit cenáculum grande stratum: et illic
    paráte nobis. C. Et abiérunt discípuli ejus, et venérunt in civitátem: et
    invenérunt, sicut díxerat illis, et paravérunt pascha. Véspere autem facto,
    venit cum duódecim. Et discumbéntibus eis et manducántibus, ait Jesus: J.
    Amen, dico vobis, quia unus ex vobis tradet me, qui mánducat mecum. C. At
    illi cœpérunt contristári et dícere ei singulátim: S. Numquid ego? C. Qui
    ait illis: J. Unus ex duódecim, qui intíngit mecum manum in catíno. Et
    Fílius quidem hóminis vadit, sicut scriptum est de eo: væ autem hómini illi,
    per quem Fílius hóminis tradétur. Bonum erat ei, si non esset natus homo
    ille. C. Et manducántibus illis, accépit Jesus panem: et benedícens fregit,
    et dedit eis, et ait: J. Súmite, hoc est corpus meum. C. Et accépto cálice,
    grátias agens dedit eis: et bibérunt ex illo omnes. Et ait illis: J. Hic est
    sanguis meus novi Testaménti, qui pro multis effundétur. Amen, dico vobis,
    quia jam non bibam de hoc genímine vitis usque in diem illum, cum illud
    bibam novum in regno Dei. C. Et hymno dicto, exiérunt in montem Olivárum. Et
    ait eis Jesus: J. Omnes scandalizabímini in me in nocte ista: quia scriptum
    est: Percútiam pastórem, et dispergéntur oves. Sed postquam resurréxero,
    præcédam vos in Galilǽam, C. Petrus autem ait illi: S. Et si omnes
    scandalizáti fúerint in te, sed non ego. C. Et ait illi Jesus: J. Amen, dico
    tibi, quia tu hódie in nocte hac, priúsquam gallus vocem bis déderit, ter me
    es negatúrus. C. At ille ámplius loquebátur: S. Et si oportúerit me simul
    cómmori tibi, non te negábo. C. Simíliter autem et omnes dicébant."
  - _
  - "v. Munda cor meum ac lábia mea, omnípotens Deus, qui lábia Isaíæ Prophétæ
    cálculo mundásti igníto: ita me tua grata miseratióne dignáre mundáre, ut
    sanctum Evangélium tuum digne váleam nuntiáre. Per Christum, Dóminum
    nostrum. Amen."
  - D. Jube, domne, benedicere.
  - "S. Dóminus sit in corde tuo et in lábiis tuis: ut digne et competénter
    annúnties Evangélium suum: In nómine Patris, et Fílii, + et Spíritus Sancti.
    Amen."
  - _
