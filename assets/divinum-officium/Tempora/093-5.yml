oratio:
  - "Præsta, quǽsumus, omnípotens Deus: ut observatiónes sacras ánnua devotióne
    recoléntes, et córpore tibi placeámus, et mente."
  - $Per Dominum
lectio:
  - Léctio Osee Prophétæ
  - "!Osee 14:2-10"
  - "Hæc dicit Dóminus Deus: Convértere, Israël, ad Dóminum, Deum tuum: quóniam
    corruísti in iniquitáte tua. Tóllite vobíscum verba, et convertímini ad
    Dóminum et dícite ei: Omnem aufer iniquitátem, áccipe bonum: et reddémus
    vítulos labiórum nostrórum. Assur non salvábit nos, super equum non
    ascendémus, nec dicémus ultra: Dii nostri ópera mánuum nostrárum: quia ejus,
    qui in te est, miseréberis pupílli. Sanábo contritiónes eórum, díligam eos
    spontánee: quia avérsus est furor meus ab eis. Ero quasi ros, Israël
    germinábit sicut lílium, et erúmpet radix ejus ut Líbani. Ibunt rami ejus,
    et erit quasi olíva glória ejus: et odor ejus ut Líbani. Converténtur
    sedéntes in umbra ejus: vivent trítico, et germinábunt quasi vínea:
    memoriále ejus sicut vinum Líbani. Ephraim quid mihi ultra idóla? ego
    exáudiam, et dírigam eum ego ut abíetem viréntem: ex me fructus tuus
    invéntus est. Quis sápiens, et intélleget ista? intéllegens, et sciet hæc?
    Quia rectæ viæ Dómini, et justi ambulábunt in eis: prævaricatóres vero
    córruent in eis."
