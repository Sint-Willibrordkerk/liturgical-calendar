offertorium:
  - "!Ps 102:2; 102:5"
  - "Bénedic, ánima mea, Dómino, et noli oblivísci omnes retributiónes ejus: et
    renovábitur, sicut áquilæ, juvéntus tua."
secreta:
  - "Accépta tibi sint, Dómine, quǽsumus, nostri dona jejúnii: quæ et expiándo
    nos tua grátia dignos effíciant, et ad sempitérna promíssa perdúcant."
  - $Per Dominum
communio:
  - "!Ps 118:22; 118:24"
  - "Aufer a me oppróbrium et contémptum, quia mandáta tua exquisívi, Dómine:
    nam et testimónia tua meditátio mea est."
postcommunio:
  - "Quǽsumus, omnípotens Deus: ut, de percéptis munéribus grátias exhibéntes,
    benefícia potióra sumámus."
  - $Per Dominum
