ad-vesperam-aut-rubrica-196/oratio: []
lectio1:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 7:36-50"
  - "In illo témpore: Rogábat Jesum quidam de pharisǽis, ut manducáret cum illo.
    Et ingréssus domum pharisǽi discúbuit. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 33 in Evangelia, post initium"
  - "Quem pharisǽus de falsa justítia præsúmens, nisi Judáicum pópulum; quem
    peccátrix múlier ad vestígia Dómini véniens et plorans, nisi convérsam
    gentilitátem desígnat? Quæ cum alabástro venit, unguéntum fudit, retro secus
    pedes Dómini stetit, lácrimis pedes rigávit, capíllis tersit, eosdémque quos
    infundébat et tergébat pedes osculári non désiit. Nos ergo, nos illa múlier
    expréssit, si toto corde ad Dóminum post peccáta redeámus, si ejus
    pœniténtiæ luctus imitémur. Quid namque unguénto, nisi bonæ odor opiniónis
    exprímitur? Unde et Paulus dicit: Christi bonus odor sumus Deo in omni
    loco."
responsory1:
  - "@Tempora/093-0:Responsory4"
lectio2:
  - "Si ergo recta ópera ágimus, quibus opiniónis bonæ odóre Ecclésiam
    respergámus, quid in Dómini córpore, nisi unguéntum fúndimus? Sed secus
    pedes Jesu múlier stetit: contra pedes enim dómini stétimus, cum in peccátis
    pósiti ejus itinéribus renitebámur. Sed si ad veram pœniténtiam post peccáta
    convértimur, jam retro secus pedes stamus; quia ejus vestígia séquimur, quem
    impugnabámus. Lácrimis múlier pedes ejus rigat: quod nos quoque veráciter
    ágimus, si quibúslibet últimis membris Dómini per compassiónis afféctum
    inclinámur, si sanctis ejus in tribulatióne compátimur, si eórum tristítiam,
    nostram putámus."
responsory2:
  - "@Tempora/093-0:Responsory5"
lectio3:
  - "Capíllis ergo pedes Dómini térgimus, quando sanctis ejus, quibus ex
    caritáte compátimur, étiam ex his quæ nobis supérfluunt, miserémur: quátenus
    sic mens per compassiónem dóleat, ut étiam larga manus afféctum dolóris
    osténdat. Rigat namque lácrimis Redemptóris pedes, sed capíllis suis non
    tergit, qui utcúmque proximórum dolóri compátitur, sed tamen eis ex his, quæ
    sibi supérfluunt, non miserétur. Plorat, et non tergit, qui verba quidem
    dolóris tríbuit, sed non ministrándo quæ desunt, vim dolóris mínime
    abscíndit. Osculátur múlier pedes, quos tergit: quod nos quoque plene
    ágimus, si studióse dilígimus, quos ex largitáte continémus: ne gravis nobis
    sit necéssitas próximi; ne ipsa nobis ejus indigéntia, quæ sustentátur, fiat
    onerósa: et cum manus necessária tríbuit, ánimus a dilectióne torpéscat."
responsory3:
  - "@Tempora/093-0:Responsory6"
ant-2:
  - Múlier, * quæ erat in civitáte peccátrix, stans retro secus pedes Dómini,
    lácrimis cœpit rigáre pedes ejus et capíllis cápitis sui tergébat, et
    deosculabátur pedes ejus et unguénto ungébat.
rubrica-cisterciensis/ant-2:
  - "In diébus illis: * Múlier, quæ erat in civitáte peccátrix, ut cognóvit quod
    Jesus accubuísset in domo Simónis leprósi, attúlit alabástrum unguénti: et
    stans retro secus pedes Dómini Jesu, lácrimis cœpit rigáre pedes ejus, et
    capíllis cápitis sui tergébat, et osculabátur pedes ejus, et unguénto
    ungébat."
