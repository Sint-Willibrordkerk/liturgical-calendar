introitus:
  - "!Ps 26:8; 26:9"
  - "v. Tibi dixit cor meum, quæsívi vultum tuum. vultum tuum, Dómine, requíram:
    ne avértas fáciem tuam a me."
  - "!Ps 26:1"
  - "Dóminus illuminátio mea, et salus mea: quem timébo?"
  - "&Gloria"
  - "v. Tibi dixit cor meum, quæsívi vultum tuum. vultum tuum, Dómine, requíram:
    ne avértas fáciem tuam a me."
oratio:
  - "Pérfice, quǽsumus, Dómine, benígnus in nobis observántiæ sanctæ subsídium:
    ut, quæ te auctóre faciénda cognóvimus, te operánte impleámus."
  - $Per Dominum
lectio:
  - Léctio libri Regum.
  - "!3 Reg 17:8-16"
  - "In diébus illis: Factus est sermo Dómini ad Elíam Thesbíten, dicens: Surge
    et vade in Saréphta Sidoniórum, et manébis ibi: præcépi enim ibi mulíeri
    víduæ, ut pascat te. Surréxit et ábiit in Saréphta. Cumque venísset ad
    portam civitátis, appáruit ei múlier vídua cólligens ligna, et vocávit eam,
    dixítque ei: Da mihi páululum aquæ in vase, ut bibam. Cumque illa pérgeret,
    ut afférret, clamávit post tergum ejus, dicens: Affer mihi, óbsecro, et
    buccéllam panis in manu tua. Quæ respóndit: Vivit Dóminus, Deus tuus, quia
    non hábeo panem, nisi quantum pugíllus cápere potest farínæ in hýdria, et
    páululum ólei in lécytho: en, cóllige duo ligna, ut ingrédiar, et fáciam
    illum mihi et fílio meo, ut comedámus et moriámur. Ad quam Elías ait: Noli
    timére, sed vade, et fac, sicut dixísti: verúmtamen mihi primum fac de ipsa
    farínula subcinerícium panem párvulum, et affer ad me: tibi autem et fílio
    tuo fácies póstea. Hæc autem dicit Dóminus, Deus Israël: Hýdria farínæ non
    defíciet, nec lécythus ólei minuétur, usque ad diem, in qua Dóminus datúrus
    est plúviam super fáciem terræ. Quæ ábiit, et fecit juxta verbum Elíæ: et
    comédit ipse et illa et domus ejus: et ex illa die hýdria farínæ non
    defécit, et lécythus ólei non est imminútus, juxta verbum Dómini, quod
    locútus fúerat in manu Elíæ."
graduale:
  - "!Ps 54:23; 54:17; 54:18; 54:19"
  - Jacta cogitátum tuum in Dómino, et ipse te enútriet.
  - V. Dum clamárem ad Dóminum, exaudívit vocem meam ab his, qui appropínquant
    mihi.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum.
  - "!Matt 23:1-12"
  - "In illo témpore: Locútus est Jesus ad turbas et ad discípulos suos, dicens:
    Super cáthedram Móysi sedérunt scribæ et pharisǽi. Omnia ergo, quæcúmque
    díxerint vobis, serváte et fácite: secúndum ópera vero eórum nolíte fácere:
    dicunt enim, et non fáciunt. Alligant enim ónera grávia et importabília, et
    impónunt in húmeros hóminum: dígito autem suo nolunt ea movére. Omnia vero
    ópera sua fáciunt, ut videántur ab homínibus: dilátant enim phylactéria sua,
    et magníficant fímbrias. Amant autem primos recúbitus in cenis, et primas
    cáthedras in synagógis, et salutatiónes in foro, et vocári ab homínibus
    Rabbi. Vos autem nolíte vocári Rabbi: unus est enim Magíster vester, omnes
    autem vos fratres estis. Et patrem nolíte vocáre vobis super terram, unus
    est enim Pater vester, qui in cœlis est. Nec vocémini magístri: quia
    Magíster vester unus est, Christus. Qui major est vestrum, erit miníster
    vester. Qui autem se exaltáverit, humiliábitur: et qui se humiliáverit,
    exaltábitur."
offertorium:
  - "!Ps 50:3."
  - "Miserére mei, Dómine, secúndum magnam misericórdiam tuam: dele, Dómine,
    iniquitátem meam."
secreta:
  - "Sanctificatiónem tuam nobis, Dómine, his mystériis operáre placátus: quæ
    nos et a terrénis purget vítiis, et ad cœléstia dona perdúcat."
  - $Per Dominum
communio:
  - "!Ps 9:2-3"
  - "Narrábo ómnia mirabília tua: lætábor, et exsultábo in te: psallam nómini
    tuo, Altíssime."
postcommunio:
  - "Ut sacris, Dómine, reddámur digni munéribus: fac nos tuis, quǽsumus, semper
    obœdíre mandátis."
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Propitiáre, Dómine, supplicatiónibus nostris, et animárum nostrárum
    medére languóribus: ut, remissióne percépta, in tua semper benedictióne
    lætámur."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 23:1-12"
  - "In illo témpore: Locútus est Jesus ad turbas, et ad discípulos suos,
    dicens: Super cáthedram Móysi sedérunt scribæ et pharisǽi. Omnia ergo
    quæcúmque díxerint vobis, serváte, et fácite: secúndum ópera vero eórum
    nolíte fácere. Et réliqua."
  - _
  - Homilía sancti Hierónymi Presbýteri
  - "!Lib. 4 Comment. in cap. 23 Matthæi"
  - "Quid mansuétius, quid benígnius Dómino? Tentátur a pharisǽis, confringúntur
    insídiæ eórum, et secúndum Psalmístam: Sagíttæ parvulórum factæ sunt plagæ
    eórum: et nihilóminus propter sacerdótii et nóminis dignitátem hortátur
    pópulos, ut subiciántur eis, non ópera, sed doctrínam considerántes. Quod
    autem ait, Super cáthedram Móysi sedérunt scribæ et pharisǽi: per cáthedram,
    doctrínam Legis osténdit. Ergo et illud quod dícitur in Psalmo: In cáthedra
    pestiléntiæ non sedit: et, Cáthedras vendéntium colúmbas evértit: doctrínam
    debémus accípere."
responsory1:
  - "@Tempora/Quad2-0:Responsory4"
lectio2:
  - Alligant enim ónera grávia et importabília, et impónunt in húmeros hóminum,
    dígito autem suo nolunt ea movére. Hoc generáliter advérsus omnes magístros,
    qui grávia jubent, et minóra non fáciunt. Notándum autem, quod et húmeri, et
    dígitus, et ónera, et víncula quibus alligántur ónera, spirituáliter
    intellegénda sunt. Omnia vero ópera sua fáciunt, ut videántur ab homínibus.
    Quicúmque ígitur ita facit quódlibet, ut videátur ab homínibus, scriba et
    pharisǽus est.
responsory2:
  - "@Tempora/Quad2-0:Responsory5"
lectio3:
  - "Dilátant enim phylactéria sua, et magníficant fímbrias. Amant quoque primos
    recúbitus in cenis, et primas cáthedras in synagógis, et salutatiónes in
    foro, et vocári ab homínibus Rabbi. Væ nobis míseris, ad quos pharisæórum
    vítia transiérunt. Dóminus cum dedísset mandáta Legis per Móysen, ad
    extrémum íntulit: Ligábis ea in manu tua, et erunt immóta ante óculos tuos.
    Et est sensus: Præcépta mea sint in manu tua, ut ópere compleántur: sint
    ante óculos tuos, ut die ac nocte meditéris in eis. Hoc pharisǽi male
    interpretántes, scribébant in membránis decálogum Móysi, id est, decem verba
    Legis, complicántes ea et ligántes in fronte, et quasi corónam cápiti
    faciéntes: ut semper ante óculos moveréntur."
responsory3:
  - "@Tempora/Quad2-0:Responsory6"
