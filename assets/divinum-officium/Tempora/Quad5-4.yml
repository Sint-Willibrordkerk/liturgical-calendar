introitus:
  - "!Dan 3:31"
  - "v. Omnia, quæ fecísti nobis, Dómine, in vero judício fecísti: quia
    peccávimus tibi, et mandátis tuis non obedívimus: sed da glóriam nómini tuo,
    et fac nobíscum secúndum multitúdinem misericórdiæ tuæ."
  - "!Ps 118:1"
  - "Beáti immaculáti in via: qui ámbulant in lege Dómini."
  - "v. Omnia, quæ fecísti nobis, Dómine, in vero judício fecísti: quia
    peccávimus tibi, et mandátis tuis non obedívimus: sed da glóriam nómini tuo,
    et fac nobíscum secúndum multitúdinem misericórdiæ tuæ."
oratio:
  - "Præsta, quǽsumus, omnípotens Deus: ut dígnitas condiciónis humánæ, per
    immoderántiam sauciáta, medicinális parsimóniæ stúdio reformétur."
  - $Per Dominum
lectio:
  - Léctio Daniélis Prophétæ
  - "!Dan 3:25, 34-45"
  - "In diébus illis: Orávit Azarías Dóminum, dicens: Dómine, Deus noster: ne,
    quǽsumus, tradas nos in perpétuum propter nomen tuum, et ne díssipes
    testaméntum tuum: neque áuferas misericórdiam tuam a nobis propter Abraham
    diléctum tuum, et Isaac servum tuum, et Israël sanctum tuum: quibus locútus
    es, póllicens, quod multiplicáres semen eórum sicut stellas cœli, et sicut
    arénam, quæ est in líttore maris: quia, Dómine, imminúti sumus plus quam
    omnes gentes, sumúsque húmiles in univérsa terra hódie propter peccáta
    nostra. Et non est in témpore hoc princeps, et dux, et prophéta, neque
    holocáustum, neque sacrifícium, neque oblátio, neque incénsum, neque locus
    primitiárum coram te, ut possímus inveníre misericórdiam tuam: sed in ánimo
    contríto et spíritu humilitátis suscipiámur. Sicut in holocáusto aríetum et
    taurórum, et sicut in míllibus agnórum pínguium: sic fiat sacrifícium
    nostrum in conspéctu tuo hódie, ut pláceat tibi: quóniam non est confúsio
    confidéntibus in te. Et nunc séquimur te in toto corde, et timémus te, et
    quǽrimus fáciem tuam. Ne confúndas nos: sed fac nobíscum juxta mansuetúdinem
    tuam et secúndum multitúdinem misericórdiæ tuæ. Et érue nos in mirabílibus
    tuis, et da glóriam nómini tuo, Dómine: et confundántur omnes, qui osténdunt
    servis tuis mala, confundántur in omni poténtia tua: et robur eórum
    conterátur: et sciant, quia tu es Dóminus, Deus solus, et gloriósus super
    orbem terrárum, Dómine, Deus noster."
graduale:
  - "!Ps 95:8-9"
  - "Tóllite hóstias, et introíte in átria ejus: adoráte Dóminum in aula sancta
    ejus"
  - "!Ps 28:9"
  - "Revelávit Dóminus condénsa: et in templo ejus omnes dicent glóriam."
evangelium:
  - "@Sancti/07-22"
offertorium:
  - "!Ps 136:1"
  - "Super flúmina Babylónis illic sédimus et flévimus: dum recordarémur tui,
    Sion."
secreta:
  - "Dómine, Deus noster, qui in his pótius creatúris, quas ad fragilitátis
    nostræ subsídium condidísti, tuo quoque nómini múnera jussísti dicánda
    constítui: tríbue, quǽsumus; ut et vitæ nobis præséntis auxílium et
    æternitátis effíciant sacraméntum."
  - $Per Dominum
communio:
  - "!Ps 118:49-50"
  - "Meménto verbi tui servo tuo, Dómine, in quo mihi spem dedísti: hæc me
    consoláta est in humilitáte mea."
postcommunio:
  - "Quod ore súmpsimus, Dómine, pura mente capiámus: et de munere temporáli,
    fiat nobis remédium sempitérnum."
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Esto, quǽsumus, Dómine, propítius plebi tuæ: ut, quæ tibi non placent,
    respuéntes; tuórum pótius repleántur delectatiónibus mandatórum."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 7:36-50"
  - "In illo témpore: Rogábat Jesum quidam de pharisǽis, ut manducáret cum illo.
    Et ingréssus domum pharisǽi discúbuit. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 33 in Evangelia"
  - Cogitánti mihi de Maríæ Magdalénæ pœniténtia, flere magis libet, quam
    áliquid dícere. Cujus enim vel sáxeum pectus illæ hujus peccatrícis lácrimæ
    ad exémplum pœniténdi non emólliant? Considerávit namque quid fecit, et
    nóluit moderári quid fáceret. Super convivántes ingréssa est, non jussa
    venit, inter épulas lácrimas óbtulit. Díscite, quo dolóre ardet, quæ flere
    et inter épulas non erubéscit.
responsory1:
  - "@Tempora/Quad5-1:Responsory1"
lectio2:
  - Hanc vero, quam Lucas peccatrícem mulíerem, Joánnes Maríam nóminat, illam
    esse Maríam crédimus, de qua Marcus septem dæmónia ejécta fuísse testátur.
    Et quid per septem dæmónia, nisi univérsa vítia designántur? Quia enim
    septem diébus omne tempus comprehénditur, recte septenário número
    univérsitas figurátur. Septem ergo dæmónia María hábuit, quæ univérsis
    vítiis plena fuit.
responsory2:
  - "@Tempora/Quad5-0:Responsory2"
lectio3:
  - "Sed ecce quia turpitúdinis suæ máculas aspéxit, lavánda ad fontem
    misericórdiæ cucúrrit, convivántes non erúbuit. Nam quia semetípsam gráviter
    erubescébat intus, nihil esse crédidit, quod verecundarétur foris. Quid ergo
    mirámur, fratres? Maríam veniéntem, an Dóminum suscipiéntem? Suscipiéntem
    dicam, an trahéntem? Sed mélius trahéntem dicam, et suscipiéntem: quia
    nimírum ipse eam per misericórdiam traxit intus, qui per mansuetúdinem
    suscépit foris."
responsory3:
  - "@Tempora/Quad5-0:Responsory3"
