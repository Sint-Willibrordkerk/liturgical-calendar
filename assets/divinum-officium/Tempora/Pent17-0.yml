introitus:
  - "!Ps 118:137; 118:124"
  - "v. Justus es, Dómine, et rectum judícium tuum: fac cum servo tuo secúndum
    misericórdiam tuam."
  - "!Ps 118:1"
  - "Beáti immaculáti in via: qui ámbulant in lege Dómini."
  - "&Gloria"
  - "v. Justus es, Dómine, et rectum judícium tuum: fac cum servo tuo secúndum
    misericórdiam tuam."
oratio:
  - "Da, quǽsumus, Dómine, pópulo tuo diabólica vitáre contágia: et te solum
    Deum pura mente sectári."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Ephésios
  - "!Ephes 4:1-6"
  - "Fratres: Obsecro vos ego vinctus in Dómino, ut digne ambulétis vocatióne,
    qua vocáti estis, cum omni humilitáte et mansuetúdine, cum patiéntia,
    supportántes ínvicem in caritáte, sollíciti serváre unitátem spíritus in
    vínculo pacis. Unum corpus et unus spíritus, sicut vocáti estis in una spe
    vocatiónis vestræ. Unus Dóminus, una fides, unum baptísma. Unus Deus et
    Pater ómnium, qui est super omnes et per ómnia et in ómnibus nobis. Qui est
    benedíctus in sǽcula sæculórum. Amen."
graduale:
  - "!Ps 32:12; 32:6"
  - "Beáta gens, cujus est Dóminus Deus eórum: pópulus, quem elégit Dóminus in
    hereditátem sibi."
  - "V. Verbo Dómini cœli firmáti sunt: et spíritu oris ejus omnis virtus eórum.
    Allelúja, allelúja"
  - "!Ps 101:2"
  - Dómine, exáudi oratiónem meam, et clamor meus ad te pervéniat. Allelúja.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 22:34-46"
  - "In illo témpore: Accessérunt ad Jesum pharisǽi: et interrogávit eum unus ex
    eis legis doctor, tentans eum: Magíster, quod est mandátum magnum in lege?
    Ait illi Jesus: Díliges Dóminum, Deum tuum, ex toto corde tuo et in tota
    ánima tua et in tota mente tua. Hoc est máximum et primum mandátum. Secúndum
    autem símile est huic: Díliges próximum tuum sicut teípsum. In his duóbus
    mandátis univérsa lex pendet et prophétæ. Congregátis autem pharisǽis,
    interrogávit eos Jesus, dicens: Quid vobis vidétur de Christo? cujus fílius
    est? Dicunt ei: David. Ait illis: Quómodo ergo David in spíritu vocat eum
    Dóminum, dicens: Dixit Dóminus Dómino meo, sede a dextris meis, donec ponam
    inimícos tuos scabéllum pedum tuórum? Si ergo David vocat eum Dóminum,
    quómodo fílius ejus est? Et nemo poterat ei respóndere verbum: neque ausus
    fuit quisquam ex illa die eum ámplius interrogáre."
offertorium:
  - "!Dan 9:17; 9:18; 9:19"
  - "Orávi Deum meum ego Dániel, dicens: Exáudi, Dómine, preces servi tui:
    illúmina fáciem tuam super sanctuárium tuum: et propítius inténde pópulum
    istum, super quem invocátum est nomen tuum, Deus."
secreta:
  - "Majestátem tuam, Dómine, supplíciter deprecámur: ut hæc sancta, quæ
    gérimus, et a prætéritis nos delictis éxuant et futúris."
  - $Per Dominum
communio:
  - "!Ps 75:12-13"
  - "Vovéte et réddite Dómino, Deo vestro, omnes, qui in circúitu ejus affértis
    múnera: terríbili, et ei qui aufert spíritum príncipum: terríbili apud omnes
    reges terræ."
postcommunio:
  - "@Tempora/Quad1-6:Postcommunio"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 22:34-46"
  - "In illo témpore: Accessérunt ad Jesum pharisǽi, et interrogávit eum unus ex
    eis legis doctor tentans eum: Magíster, quod est mandátum magnum in lege? Et
    réliqua."
  - _
  - Homilía sancti Joánnis Chrysóstomi
  - "!Homilia 72 in Matthæum"
  - "Sadducǽis confúsis, pharisǽi rursus aggrediúntur; cumque quiéscere
    oportéret, decertáre voluérunt: et legis perítiam profiténtem præmíttunt,
    non díscere, sed tentáre cupiéntes; ac ita intérrogant: Quodnam primum
    mandátum in lege sit. Nam cum primum illud sit, Díliges Dóminum Deum tuum:
    putántes causas sibi allatúrum ad mandátum hoc corrigéndum, áliquid addéndo,
    quóniam Deum se faciébat, hoc modo intérrogant. Quid ígitur Christus? Ut
    osténdat idcírco ad hæc eos devenísse, quia nulla in eis esset cáritas, sed
    invídiæ livóre tabéscerent: Díliges, inquit, Dóminum Deum tuum: hoc primum
    et magnum mandátum est. Secúndum autem símile huic: Díliges próximum tuum
    sicut teípsum."
lectio8:
  - "Quam ob rem símile est huic?  Quóniam hoc illud indúcit, et ab illo rursus
    munítur. Quicúmque enim male agit, ódio habet lucem, et non venit ad lucem.
    Et rursus: Dixit insípiens in corde suo, Non est Deus. Deínde séquitur:
    Corrúpti sunt, et abominábiles facti sunt in stúdiis suis. Et íterum: Radix
    ómnium malórum avarítia est; quam quidam appeténtes, erravérunt a fide. Et,
    Qui díligit me, mandáta mea servábit: quorum caput et radix est: Díliges
    Dóminum Deum tuum, et próximum tuum sicut teípsum."
lectio9:
  - "Si ergo dilígere Deum, dilígere próximum est: (nam si díligis me, o Petre,
    inquit, pasce oves meas) si étiam diléctio próximi facit ut mandáta
    custódias: mérito ait in his totam legem et prophétas pendére. Et
    quemádmodum in superióribus, cum de resurrectióne interrogarétur, plus
    dócuit quam tentántes petébant; sic in hoc loco de primo interrogátus
    mandáto, secúndum étiam non valde quam primum inférius, sponte áttulit;
    secúndum enim est primo símile. Ita occúlte insinuávit, ódio illos ad
    quæréndum incitári. Cáritas enim, inquit, non æmulátur."
  - "&teDeum"
ant-2:
  - "Magíster, * quod est mandátum magnum in lege? Ait illi Jesus: Díliges
    Dóminum Deum tuum ex toto corde tuo, allelúja."
ant-3:
  - "Quid vobis * vidétur de Christo? cujus fílius est? Dicunt ei omnes: David.
    Dicit eis Jesus: Quómodo David in spíritu vocat eum Dóminum dicens: Dixit
    Dóminus Dómino meo: Sede a dextris meis?"
