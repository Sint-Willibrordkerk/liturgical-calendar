oratio:
  - "Sacræ nobis, quǽsumus, Dómine, observatiónis jejúnia: et piæ conversatiónis
    augméntum, et tuæ propitiatiónis contínuum præstent auxílium."
  - $Per Dominum
lectio:
  - Léctio libri Exodi.
  - "!Exod 32:7-14"
  - "In diébus illis: Locútus est Dóminus ad Móysen, dicens: Descénde de monte:
    peccávit pópulus tuus, quem eduxísti de terra Ægýpti. Recessérunt cito de
    via, quam ostendísti eis: fecerúntque sibi vítulum conflátilem, et
    adoravérunt, atque immolántes ei hóstias, dixérunt: Isti sunt dii tui,
    Israël, qui te eduxérunt de terra Ægýpti. Rursúmque ait Dóminus ad Móysen:
    Cerno, quod pópulus iste duræ cervícis sit: dimítte me, ut irascátur furor
    meus contra eos, et déleam eos, faciámque te in gentem magnam. Móyses autem
    orábat Dóminum, Deum suum, dicens: Cur, Dómine, iráscitur furor tuus contra
    pópulum tuum, quem eduxísti de terra Ægýpti in fortitúdine magna et in manu
    robústa? Ne quæro dicant Ægýptii: Cállide edúxit eos, ut interfíceret in
    móntibus et deléret e terra: quiéscat ira tua, et esto placábilis super
    nequítia pópuli tui. Recordáre Abraham, Isaac et Israël, servórum tuórum,
    quibus jurásti per temetípsum, dicens: Multiplicábo semen vestrum sicut
    stellas cœli: et univérsam terram hanc, de qua locútus sum, dabo sémini
    vestro, et possidébitis eam semper. Placatúsque est Dóminus, ne fáceret
    malum, quod locútus fúerat advérsus pópulum suum."
graduale:
  - "!Ps 43:26, 2"
  - "Exsúrge, Dómine, fer opem nobis: et líbera nos propter nomen tuum."
  - "V. Deus, áuribus nostris audívimus: et patres nostri annuntiavérunt nobis
    opus, quod operátus es in diébus eórum et in diébus antíquis."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem.
  - "!Joann 7:14-31"
  - "In illo témpore: Jam die festo mediánte, ascéndit Jesus in templum, et
    docébat. Et mirabántur Judǽi, dicéntes: Quómodo hic lítteras scit, cum non
    didícerit? Respóndit eis Jesus et dixit: Mea doctrína non est mea, sed ejus,
    qui misit me. Si quis volúerit voluntátem ejus fácere, cognóscet de
    doctrína, utrum ex Deo sit, an ego a meípso loquar. Qui a semetípso
    lóquitur, glóriam própriam quærit. Qui autem quærit glóriam ejus, qui misit
    eum, hic verax est, et injustítia in illo non est. Nonne Móyses dedit vobis
    legem: et nemo ex vobis facit legem? quid me quǽritis interfícere ?
    Respóndit turba, et dixit: Dæmónium habes: quis te quærit interfícere ?
    Respóndit Jesus et dixit eis: Unum opus feci, et omnes mirámini. Proptérea
    Móyses dedit vobis circumcisiónem  -non quia ex Móyse est, sed ex pátribus:
    - et in sábbato circumcíditis hóminem. Si circumcisiónem áccipit homo in
    sábbato, ut non solvátur lex Móysi: mihi indignámini, quia totum hóminem
    sanum feci in sábbato? Nolíte judicáre secúndum fáciem, sed justum judícium
    judicáte. Dicébant ergo quidam ex Jerosólymis: Nonne hic est, quem quærunt
    interfícere ? Et ecce, palam lóquitur, et nihil ei dicunt. Numquid vere
    cognovérunt príncipes, quia hic est Christus? Sed hunc scimus, unde sit:
    Christus autem, cum vénerit, nemo scit, unde sit. Clamábat ergo Jesus in
    templo docens, et dicens: Et me scitis et, unde sim, scitis, et a meípso non
    veni, sed est verus, qui misit me, quem vos nescítis. Ego scio eum, quia ab
    ipso sum, et ipse me misit. Quærébant ergo eum apprehéndere: et nemo misit
    in illum manus, quia nondum vénerat hora ejus. De turba autem multi
    credidérunt in eum."
offertorium:
  - "!Ps 39:2, 3, 4"
  - "Exspéctans exspectávi Dóminum, et respéxit me: et exaudívit deprecatiónem
    meam: et immísit in os meum cánticum novum, hymnum Deo nostro."
secreta:
  - "Hæc hóstia, Dómine, quǽsumus, emúndet nostra delícta: et, ad sacrifícium
    celebrándum, subditórum tibi córpora mentésque sanctíficet."
  - $Per Dominum
communio:
  - "!Ps 19:6"
  - "Lætábimur in salutári tuo: et in nómine Dómini, Dei nostri, magnificábimur."
postcommunio:
  - "Hujus nos, Dómine, percéptio sacraménti mundet a crímine: et ad cæléstia
    regna perdúcat."
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Miserére, Dómine, pópulo tuo: et contínuis tribulatiónibus laborántem,
    propítius respiráre concéde."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Joánnem.
  - "!Joannes 7:14-31"
  - "In illo témpore: Jam die festo mediánte, ascéndit Jesus in templum, et
    docébat. Et mirabántur Judæi. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi.
  - "!Tract. 29 in Joánnem, sub init."
  - "Ille qui latebat, docebat, et palam loquebátur, et non tenebátur. Illud
    enim ut latéret, erat causa exempli, hoc potestátis. Sed cum docéret,
    mirabántur Judæi. Omnes quidem, quantum árbitror, mirabántur, sed non omnes
    convertebántur. Et unde admiratio? Quia multi nóverant ubi natus,
    quemádmodum fúerit educatus. Numquam eum víderant litteras discéntem:
    audiébant autem de lege disputántem, legis testimónia proferéntem, quæ nemo
    posset proferre, nisi legísset, nemo légeret, nisi litteras didicísset: et
    ideo mirabántur. Eórum autem admirátio, magistro facta est insinuandæ altius
    veritátis occasio. Ex eórum quippe admiratióne et verbis, dixit Dóminus
    profúndum aliquid, et diligentius ínspici et discúti dignum."
responsory1:
  - "@Tempora/Quad4-2:Responsory1"
lectio2:
  - "Quid ergo Dóminus respóndit eis, admirántibus quómodo sciret litteras, quas
    non didícerat? Mea, inquit, doctrina non est mea, sed ejus qui misit me. Hæc
    est profúnditas prima: vidétur enim paucis verbis quasi contraria locútus.
    Non enim ait: Ista doctrina non est mea: sed, Mea doctrina non est mea. Si
    non tua, quómodo tua? si tua, quómodo non tua? Tu enim dicis utrúmque: et
    mea doctrina, et non mea."
