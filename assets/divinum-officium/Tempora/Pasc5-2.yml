lectio1:
  - De Epístola prima beáti Petri Apóstoli
  - "!1 Pet 4:1-7"
  - "1 Christo ígitur passo in carne, et vos eádem cogitatióne armámini: quia
    qui passus est in carne, désiit a peccátis:"
  - 2 ut jam non desidériis hóminum, sed voluntáti Dei, quod réliquum est in
    carne vivat témporis.
  - 3 Súfficit enim prætéritum tempus ad voluntátem géntium consummándam his qui
    ambulavérunt in luxúriis, desidériis, vinoléntiis, comessatiónibus,
    potatiónibus, et illícitis idolórum cúltibus.
  - 4 In quo admirántur non concurréntibus vobis in eándem luxúriæ confusiónem,
    blasphemántes.
  - 5 Qui reddent ratiónem ei qui parátus est judicáre vivos et mórtuos.
  - "6 Propter hoc enim et mórtuis evangelizátum est: ut judicéntur quidem
    secúndum hómines in carne, vivant autem secúndum Deum in spíritu."
  - 7 Omnium autem finis appropinquávit.
responsory1:
  - "@Tempora/Pasc4-0:Responsory4"
lectio2:
  - "!1 Pet 4:7-11"
  - 7 Estóte ítaque prudéntes, et vigiláte in oratiónibus.
  - "8 Ante ómnia autem, mútuam in vobismetípsis caritátem contínuam habéntes:
    quia cáritas óperit multitúdinem peccatórum."
  - 9 Hospitáles ínvicem sine murmuratióne.
  - 10 Unusquísque, sicut accépit grátiam, in altérutrum illam administrántes,
    sicut boni dispensatóres multifórmis grátiæ Dei.
  - "11 Si quis lóquitur, quasi sermónes Dei: si quis minístrat, tamquam ex
    virtúte, quam adminístrat Deus: ut in ómnibus honorificétur Deus per Jesum
    Christum: cui est glória et impérium in sǽcula sæculórum. Amen."
responsory2:
  - "@Tempora/Pasc4-0:Responsory5"
  - "&Gloria"
  - R. Ne repéllas me a mandátis tuis, allelúja, allelúja.
lectio3:
  - "!1 Pet 4:12-17"
  - "12 Caríssimi, nolíte peregrinári in fervóre, qui ad tentatiónem vobis fit,
    quasi novi áliquid vobis contíngat:"
  - 13 sed communicántes Christi passiónibus gaudéte, ut et in revelatióne
    glóriæ ejus gaudeátis exsultántes.
  - "14 Si exprobrámini in nómine Christi, beáti éritis: quóniam quod est
    honóris, glóriæ, et virtútis Dei, et qui est ejus Spíritus, super vos
    requiéscit."
  - 15 Nemo autem vestrum patiátur ut homicída, aut fur, aut malédicus, aut
    alienórum appetítor.
  - "16 Si autem ut Christiánus, non erubéscat: gloríficet autem Deum in isto
    nómine:"
  - 17 quóniam tempus est ut incípiat judícium a domo Dei.
