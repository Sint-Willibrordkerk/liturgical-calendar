rubrica-cisterciensis/ant-1:
  - "@Tempora/Nat26"
lectio1:
  - Incipit Epístola beáti Pauli Apóstoli ad Romános
  - "!Rom 1:1-7"
  - 1 Paulus, servus Jesu Christi, vocátus Apóstolus, segregátus in Evangélium
    Dei,
  - 2 quod ante promíserat per prophétas suos in Scriptúris sanctis
  - 3 de Fílio suo, qui factus est ei ex sémine David secúndum carnem,
  - "4 qui prædestinátus est Fílius Dei in virtúte secúndum spíritum
    sanctificatiónis ex resurrectióne mortuórum Jesu Christi Dómini nostri:"
  - 5 per quem accépimus grátiam, et apostolátum ad obediéndum fídei in ómnibus
    géntibus pro nómine ejus,
  - "6 in quibus estis et vos vocáti Jesu Christi:"
  - 7 ómnibus qui sunt Romæ, diléctis Dei, vocátis sanctis. Grátia vobis, et pax
    a Deo Patre nostro, et Dómino Jesu Christo.
responsory1:
  - "@Sancti/12-25:Responsory2"
lectio2:
  - "!Rom 1:8-12"
  - "8 Primum quidem grátias ago Deo meo per Jesum Christum pro ómnibus vobis:
    quia fides vestra annuntiátur in univérso mundo."
  - 9 Testis enim mihi est Deus, cui sérvio in spíritu meo in Evangélio Fílii
    ejus, quod sine intermissióne memóriam vestri fácio
  - "10 semper in oratiónibus meis: óbsecrans, si quómodo tandem aliquándo
    prósperum iter hábeam in voluntáte Dei veniéndi ad vos."
  - "11 Desídero enim vidére vos, ut áliquid impértiar vobis grátiæ spirituális
    ad confirmándos vos:"
  - 12 id est, simul consolári in vobis per eam quæ ínvicem est, fidem vestram
    atque meam.
responsory2:
  - "@Sancti/12-25:Responsory3"
lectio3:
  - "!Rom 1:13-19"
  - "13 Nolo autem vos ignoráre fratres: quia sæpe propósui veníre ad vos (et
    prohíbitus sum usque adhuc) ut áliquem fructum hábeam et in vobis, sicut et
    in céteris géntibus."
  - "14 Græcis ac bárbaris, sapiéntibus, et insipiéntibus débitor sum:"
  - 15 ita (quod in me) promptum est et vobis, qui Romæ estis, evangelizáre.
  - 16 Non enim erubésco Evangélium. Virtus enim Dei est in salútem omni
    credénti, Judǽo primum, et Græco.
  - "17 Justítia enim Dei in eo revelátur ex fide in fidem: sicut scriptum est:
    Justus autem ex fide vivit."
  - "18 Revelátur enim ira Dei de cælo super omnem impietátem, et injustítiam
    hóminum eórum, qui veritátem Dei in injustítia détinent:"
  - 19 quia quod notum est Dei, maniféstum est in illis. Deus enim illis
    manifestávit.
responsory3:
  - "@Sancti/12-25:Responsory4"
