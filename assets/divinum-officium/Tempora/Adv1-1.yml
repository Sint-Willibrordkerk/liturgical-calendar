ant-3_:
  - "Leva, Jerúsalem, * óculos tuos, et vide poténtiam regis: ecce Salvátor
    venit sólvere te a vínculo."
ant-3c:
  - Jerúsalem, * réspice ad Oriéntem, et vide, allelúia.
