rubrica-cisterciensis/rank:
  - ""
  - Feria major
  - "1.15"
lectio1:
  - De Isaía Prophéta
  - "!Isa 1:16-18"
  - "16 Lavámini, mundi estóte, auférte malum cogitatiónum vestrárum ab óculis
    meis: quiéscite ágere pervérse,"
  - "17 díscite benefácere: quǽrite judícium, subveníte opprésso, judicáte
    pupíllo, deféndite víduam."
  - "18 Et veníte, et argúite me, dicit Dóminus: si fúerint peccáta vestra ut
    cóccinum, quasi nix dealbabúntur: et si fúerint rubra quasi vermículus,
    velut lana alba erunt."
responsory1:
  - "R. Súscipe verbum, Virgo María, quod tibi a Dómino per Angelum transmíssum
    est: concípies et páries Deum páriter et hóminem,"
  - "* Ut benedícta dicáris inter omnes mulíeres."
  - "V. Páries quidem fílium, et virginitátis non patiéris detriméntum:
    efficiéris grávida, et eris mater semper intácta."
  - R. Ut benedícta dicáris inter omnes mulíeres.
lectio2:
  - "!Isa 1:19-23"
  - 19 Si voluéritis, et audiéritis me, bona terræ comedétis.
  - 20 Quod si noluéritis, et me ad iracúndiam provocavéritis, gládius devorábit
    vos, quia os Dómini locútum est.
  - 21 Quómodo facta est méretrix cívitas fidélis, plena judícii? Justítia
    habitávit in ea, nunc autem homicídæ.
  - "22 Argéntum tuum versum est in scóriam: vinum tuum mixtum est aqua."
  - "23 Príncipes tui infidéles, sócii furum: omnes díligunt múnera, sequúntur
    retributiónes. Pupíllo non júdicant: et causa víduæ non ingréditur ad
    illos."
responsory2:
  - "R. Læténtur cæli, et exsúltet terra, jubiláte, montes, laudem: quia Dóminus
    noster véniet,"
  - "* Et páuperum suórum miserébitur."
  - V. Oriétur in diébus ejus justítia, et abundántia pacis.
  - R. Et páuperum suórum miserébitur.
lectio3:
  - "!Isa 1:24-28"
  - "24 Propter hoc ait Dóminus Deus exercítuum fortis Israël: Heu! consolábor
    super hóstibus meis, et vindicábor de inimícis meis."
  - 25 Et convértam manum meam ad te, et éxcoquam ad purum scóriam tuam, et
    áuferam omne stannum tuum.
  - "26 Et restítuam júdices tuos ut fuérunt prius, et consiliários tuos sicut
    antíquitus: post hæc vocáberis cívitas justi, urbs fidélis."
  - "27 Sion in judício redimétur, et redúcent eam in justítia:"
  - "28 et cónteret sceléstos, et peccatóres simul: et qui dereliquérunt
    Dóminum, consuméntur."
responsory3:
  - "R. Aliéni non transíbunt per Jerúsalem ámplius:"
  - "* Nam in illa die stillábunt montes dulcédinem, et colles fluent lac et
    mel, dicit Dóminus."
  - V. Deus a Líbano véniet, et Sanctus de monte umbróso et condénso.
  - R. Nam in illa die stillábunt montes dulcédinem, et colles fluent lac et
    mel, dicit Dóminus.
  - "&Gloria"
  - R. Nam in illa die stillábunt montes dulcédinem, et colles fluent lac et
    mel, dicit Dóminus.
