lectio1:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 5:17-26"
  - "In illo témpore: Factum est in una diérum, et Jesus sedébat docens. Et
    erant pharisǽi sedéntes, et legis doctóres, qui vénerant ex omni castéllo
    Galilǽæ et Judǽæ, et Jerúsalem: et virtus Dómini erat ad sanándum eos. Et
    réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Liber 5 in cap. 5 Lucæ, post initium"
  - Non otiósa hujus paralýtici, nec angústa medicína est, quando Dóminus et
    orásse præmíttitur; non útique propter suffrágium, sed propter exémplum.
    Imitándi enim spécimen dedit, non precándi ámbitum requisívit. Et
    conveniéntibus ex omni Galilǽa, et Judǽa, et Jerúsalem, legis doctóribus,
    inter ceterórum remédia debílium, paralýtici istíus medicína descríbitur.
    Primum ómnium, quod ante díximus, unusquísque æger peténdæ precatóres
    salútis debet adhibére, per quos nostræ vitæ compágo resolúta, actuúmque
    nostrórum clauda vestígia, verbi cæléstis remédio reforméntur.
responsory1:
  - "R. Non vos me elegístis, sed ego elégi vos, et pósui vos:"
  - "* Ut eátis, et fructum afferátis, et fructus vester máneat, allelúja,
    allelúja."
  - V. Sicut misit me Pater, et ego mitto vos.
  - R. Ut eátis, et fructum afferátis, et fructus vester máneat, allelúja,
    allelúja.
lectio2:
  - "Sint ígitur áliqui monitóres mentis, qui ánimum hóminis, quamvis exterióris
    córporis debilitáte torpéntem, ad superióra érigant. Quorum rursus
    adminículis et attóllere et humiliáre se fácilis ante Jesum locétur,
    Domínico vidéri dignus aspéctu. Humilitátem enim réspicit Dóminus: quia
    respéxit humilitátem ancíllæ suæ. Quorum fidem ut vidit, dixit: Homo,
    remittúntur tibi peccáta tua. Magnus Dóminus, qui aliórum mérito ignóscit
    áliis: et dum álios probat, áliis reláxat erráta. Cur apud te, homo, colléga
    non váleat, cum apud Deum servus et interveniéndi méritum, et jus hábeat
    impetrándi?"
responsory2:
  - "R. Spíritus Dómini replévit orbem terrárum:"
  - "* Et hoc quod cóntinet ómnia, sciéntiam habet vocis, allelúja, allelúja."
  - V. Omnium est enim ártifex, omnem habens virtútem, ómnia prospíciens.
  - R. Et hoc quod cóntinet ómnia, sciéntiam habet vocis, allelúja, allelúja.
  - "&Gloria"
  - R. Et hoc quod cóntinet ómnia, sciéntiam habet vocis, allelúja, allelúja.
lectio3:
  - "Disce, qui júdicas, ignóscere: disce, qui æger es, impetráre. Si grávium
    peccatórum diffídis véniam, ádhibe precatóres, ádhibe Ecclésiam, quæ pro te
    precétur, cujus contemplatióne, quod tibi Dóminus negáre posset, ignóscat.
    Et quamvis históriæ fidem non debeámus omíttere, ut vere paralýtici istíus
    corpus credámus esse sanátum: cognósce tamen interióris hóminis sanitátem,
    cui peccáta donántur. Cum Judǽi ásserunt peccáta a solo Deo posse concédi,
    Deum útique eum confiténtur; suóque judício perfídiam suam produnt, qui opus
    ástruunt, ut persónam negent."
  - "&teDeum"
