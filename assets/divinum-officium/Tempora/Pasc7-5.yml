ant-3:
  - Paráclitus autem * Spíritus Sanctus, quem mittet Pater in nómine meo, ille
    vos docébit ómnia, et súggeret vobis ómnia, quæcúmque díxero vobis,
    allelúja.
rubrica-cisterciensis/ant-3:
  - "Jam non multa * loquar vobíscum, venit enim princeps mundi hujus, et in me
    non habet quidquam: sed ut cognóscat mundus quia díligo Patrem, et sicut
    mandátum dedit mihi Pater, sic fácio, allelúia."
