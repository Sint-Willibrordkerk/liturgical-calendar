officium:
  - Dominica II post Epiphaniam
rank:
  - ""
  - Semiduplex
  - "5"
rule:
  - 9 lectiones
  - Gloria
  - Credo
  - Prefatio=Trinitate
introitus:
  - "!Ps 65:4"
  - "v. Omnis terra adóret te, Deus, et psallat tibi: psalmum dicat nómini tuo,
    Altíssime."
  - "!Ps 65:1-2"
  - "Jubiláte Deo, omnis terra, psalmum dícite nómini ejus: date glóriam laudi
    ejus."
  - "&Gloria"
  - "v. Omnis terra adóret te, Deus, et psallat tibi: psalmum dicat nómini tuo,
    Altíssime."
oratio:
  - "Omnípotens sempitérne Deus, qui cæléstia simul et terréna moderáris:
    supplicatiónes pópuli tui cleménter exáudi; et pacem tuam nostris concéde
    tempóribus."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Romános.
  - "!Rom 12:6-16"
  - "Fratres: Habéntes donatiónes secúndum grátiam, quæ data est nobis,
    differéntes: sive prophetíam secúndum ratiónem fídei, sive ministérium in
    ministrándo, sive qui docet in doctrína, qui exhortátur in exhortándo, qui
    tríbuit in simplicitáte, qui præest in sollicitúdine, qui miserétur in
    hilaritáte. Diléctio sine simulatióne. Odiéntes malum, adhæréntes bono:
    Caritáte fraternitátis ínvicem diligéntes: Honóre ínvicem præveniéntes:
    Sollicitúdine non pigri: Spíritu fervéntes: Dómino serviéntes: Spe
    gaudéntes: In tribulatióne patiéntes: Oratióni instántes: Necessitátibus
    sanctórum communicántes: Hospitalitátem sectántes. Benedícite persequéntibus
    vos: benedícite, et nolíte maledícere. Gaudére cum gaudéntibus, flere cum
    fléntibus: Idípsum ínvicem sentiéntes: Non alta sapiéntes, sed humílibus
    consentiéntes."
graduale:
  - "!Ps 106:20-21"
  - "Misit Dóminus verbum suum, et sanávit eos: et erípuit eos de intéritu
    eórum."
  - "V. Confiteántur Dómino misericórdiæ ejus: et mirabília ejus fíliis hóminum.
    Allelúja, allelúja."
  - "!Ps 148:2"
  - "Laudáte Dóminum, omnes Angeli ejus: laudáte eum, omnes virtútes ejus.
    Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem.
  - "!Joann 2:1-11"
  - "In illo témpore: Núptiæ factæ sunt in Cana Galilǽæ: et erat Mater Jesu ibi.
    Vocátus est autem et Jesus, et discípuli ejus ad núptias. Et deficiénte
    vino, dicit Mater Jesu ad eum: Vinum non habent. Et dicit ei Jesus: Quid
    mihi et tibi est, mulier? nondum venit hora mea. Dicit Mater ejus minístris:
    Quodcúmque díxerit vobis, fácite. Erant autem ibi lapídeæ hýdriæ sex pósitæ
    secúndum purificatiónem Judæórum, capiéntes síngulæ metrétas binas vel
    ternas. Dicit eis Jesus: Implete hýdrias aqua. Et implevérunt eas usque ad
    summum. Et dicit eis Jesus: Hauríte nunc, et ferte architriclíno. Et
    tulérunt. Ut autem gustávit architriclínus aquam vinum fáctam, et non
    sciébat unde esset, minístri autem sciébant, qui háuserant aquam: vocat
    sponsum architriclínus, et dicit ei: Omnis homo primum bonum vinum ponit: et
    cum inebriáti fúerint, tunc id, quod detérius est. Tu autem servásti bonum
    vinum usque adhuc. Hoc fecit inítium signórum Jesus in Cana Galilǽæ: et
    manifestávit glóriam suam, et credidérunt in eum discípuli ejus."
offertorium:
  - "!Ps 65:1-2; 65:16"
  - "Jubiláte Deo, univérsa terra: psalmum dícite nómini ejus: veníte et audíte,
    et narrábo vobis, omnes qui timétis Deum, quanta fecit Dóminus ánimæ meæ,
    allelúja."
secreta:
  - "Oblata, Dómine, múnera sanctífica: nosque a peccatórum nostrórum máculis
    emúnda."
  - $Per Dominum
communio:
  - "!Joann 2:7; 2:8; 2:9; 2:10-11"
  - "Dicit Dóminus: Implete hýdrias aqua et ferte architriclíno. Cum gustásset
    architriclínus aquam vinum factam, dicit sponso: Servásti bonum vinum usque
    adhuc. Hoc signum fecit Jesus primum coram discípulis suis."
postcommunio:
  - "Augeátur in nobis, quǽsumus, Dómine, tuæ virtútis operatio: ut divínis
    vegetáti sacraméntis, ad eórum promíssa capiénda, tuo múnere præparémur."
  - $Per Dominum
ant-1:
  - "Suscépit Deus * Israël, púerum suum: sicut locútus est ad Abraham, et semen
    ejus usque in sǽculum."
rubrica-cisterciensis/ant-1:
  - Fratres, * confortámini in grátia Dei, quæ est in Christo Jesu Dómino
    nostro, allelúia.
lectio1:
  - Incipit Epístola secúnda beáti Pauli Apóstoli ad Corínthios
  - "!2 Cor 1:1-5"
  - 1 Paulus, Apóstolus Jesu Christi per voluntátem Dei, et Timótheus frater,
    Ecclésiæ Dei, quæ est Corínthi cum ómnibus sanctis, qui sunt in univérsa
    Achája.
  - 2 Grátia vobis, et pax a Deo Patre nostro, et Dómino Jesu Christo.
  - 3 Benedíctus Deus et Pater Dómini nostri Jesu Christi, Pater
    misericordiárum, et Deus totíus consolatiónis,
  - "4 qui consolátur nos in omni tribulatióne nostra: ut possímus et ipsi
    consolári eos qui in omni pressúra sunt, per exhortatiónem, qua exhortámur
    et ipsi a Deo."
  - "5 Quóniam sicut abúndant passiónes Christi in nobis: ita et per Christum
    abúndat consolátio nostra."
responsory1:
  - "R. Dómine, ne in ira tua árguas me, neque in furóre tuo corrípias me:"
  - "* Miserére mei, Dómine, quóniam infírmus sum."
  - V. Timor et tremor venérunt super me, et contexérunt me ténebræ.
  - R. Miserére mei, Dómine, quóniam infírmus sum.
lectio2:
  - "!2 Cor 1:6-7"
  - "6 Sive autem tribulámur pro vestra exhortatióne et salúte, sive consolámur
    pro vestra consolatióne, sive exhortámur pro vestra exhortatióne et salúte,
    quæ operátur tolerántiam earúndem passiónum, quas et nos pátimur:"
  - "7 ut spes nostra firma sit pro vobis: sciéntes quod sicut sócii passiónum
    estis, sic éritis et consolatiónis."
responsory2:
  - "R. Deus, qui sedes super thronum, et júdicas æquitátem, esto refúgium
    páuperum in tribulatióne:"
  - "* Quia tu solus labórem et dolórem consíderas."
  - V. Tibi enim derelíctus est pauper, pupíllo tu eris adjútor.
  - R. Quia tu solus labórem et dolórem consíderas.
lectio3:
  - "!2 Cor 1:8-11"
  - 8 Non enim vólumus ignoráre vos, fratres, de tribulatióne nostra, quæ facta
    est in Asia, quóniam supra modum graváti sumus supra virtútem, ita ut
    tædéret nos étiam vívere.
  - "9 Sed ipsi in nobismetípsis respónsum mortis habúimus, ut non simus
    fidéntes in nobis, sed in Deo, qui súscitat mórtuos:"
  - "10 qui de tantis perículis nos erípuit, et éruit: in quem sperámus quóniam
    et adhuc erípiet,"
  - "11 adjuvántibus et vobis in oratióne pro nobis: ut ex multórum persónis,
    ejus quæ in nobis est donatiónis, per multos grátiæ agántur pro nobis."
responsory3:
  - "R. A dextris est mihi Dóminus, ne commóvear:"
  - "* Propter hoc dilatátum est cor meum, et exsultávit lingua mea."
  - V. Dóminus pars hereditátis meæ, et cálicis mei.
  - R. Propter hoc dilatátum est cor meum, et exsultávit lingua mea.
  - "&Gloria"
  - R. Propter hoc dilatátum est cor meum, et exsultávit lingua mea.
lectio4:
  - Sermo sancti Joánnis Chrysóstomi
  - "!Præfatio in Epistolas Beati Pauli"
  - "Beáti Pauli Epistolárum lectiónem dum assídue auscúlto, perque hebdómadas
    síngulas bis sæpe, et ter et quater, quotiescúmque sanctórum Mártyrum
    memórias celebrámus, gáudio exsúlto, tuba illa spiritáli pérfruens, et
    éxcitor, ac desidério incalésco, vocem mihi amícam agnóscens, et fere
    præséntem ipsum intuéri, et disseréntem audíre vídeor. Sed tamen dóleo et
    moléste fero, quod virum hunc non omnes, sicut par est, cognóscunt: verum
    ita illum nonnúlli ignórant, ut ne Epistolárum quidem ejus númerum plane
    sciant. Hoc vero non imperítia facit: sed quod nolint beáti hujus viri
    scripta in mánibus habére."
responsory4:
  - "R. Notas mihi fecísti, Dómine, vias vitæ:"
  - "* Adimplébis me lætítia cum vultu tuo: delectatiónes in déxtera tua usque
    in finem."
  - V. Tu es qui restítues hereditátem meam mihi.
  - "R. Adimplébis me lætítia cum vultu tuo: delectatiónes in déxtera tua usque
    in finem."
lectio5:
  - "Neque enim nos, quæ scimus, si quid scimus, ab ingénii bonitáte atque
    acúmine scimus: sed quod erga hunc virum impénse affécti, ab illíus lectióne
    numquam discédimus: síquidem qui amant, ii plus quam céteri omnes eórum
    facta norunt, quos amant, ut qui de iis ipsis sint sollíciti. Id quod beátus
    hic véluti osténdens, ad Philippénses ait: Sicut est mihi justum, ut hoc de
    vobis ómnibus séntiam, eo quod hábeam vos in corde, et in vínculis meis, et
    in defensióne et confirmatióne Evangélii."
responsory5:
  - "R. Díligam te, Dómine, virtus mea: Dóminus firmaméntum meum,"
  - "* Et refúgium meum."
  - V. Liberátor meus, Deus meus, adjútor meus.
  - R. Et refúgium meum.
lectio6:
  - "Quaprópter si et vos quoque lectióni diligénter atténdere voluéritis, nihil
    áliud vobis erit requiréndum. Verax est enim Christi sermo dicéntis:
    Quǽrite, et inveniétis: pulsáte, et aperiétur vobis. Céterum, quandóquidem
    complúres ex iis, qui huc nobíscum convéniunt, et liberórum educatiónem, et
    uxóris curam, et famíliæ providéntiam suscepére, ob idque totos sese huic
    labóri dare non sústinent: at certe ipsi vos excitáte ad ea saltem capiénda,
    quæ álii collégerint; stúdii tantúmdem iis, quæ dicta fúerint, auscultándis,
    quantum pecúniis colligéndis impertiéntes. Nam etsi turpe sit, non nisi
    tantum stúdii a vobis exígere: optábile tamen erit, si tantum saltem
    tribuátis."
responsory6:
  - "R. Dómini est terra, et plenitúdo ejus:"
  - "* Orbis terrárum, et univérsi qui hábitant in eo."
  - V. Ipse super mária fundávit eam, et super flúmina præparávit illam.
  - R. Orbis terrárum, et univérsi qui hábitant in eo.
  - "&Gloria"
  - R. Orbis terrárum, et univérsi qui hábitant in eo.
lectio7:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 2:1-11"
  - "In illo témpore: Núptiæ factæ sunt in Cana Galilǽæ, et erat mater Jesu ibi.
    Vocátus est autem et Jesus, et discípuli ejus ad núptias. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tract. 9 in Joannem, post initium"
  - "Quod Dóminus invitátus venit ad núptias, étiam excépta mýstica
    significatióne, confirmáre vóluit, quod ipse fecit núptias. Futúri enim
    erant, de quibus dixit Apóstolus, prohibéntes núbere, et dicéntes quod malum
    essent núptiæ, et quod diábolus eas fecísset: cum idem Dóminus dicat in
    Evangélio interrogátus, utrum líceat hómini dimíttere uxórem suam ex
    quálibet causa, non licére, excépta causa fornicatiónis. In qua responsióne,
    si meminístis, hoc ait: Quod Deus conjúnxit, homo non séparet."
responsory7:
  - "R. Ad te, Dómine, levávi ánimam meam:"
  - "* Deus meus, in te confído, non erubéscam."
  - V. Custódi ánimam meam, et éripe me.
  - R. Deus meus, in te confído, non erubéscam.
lectio8:
  - "Et qui bene erudíti sunt in fide catholica novérunt, quod Deus fécerit
    nuptias: et sicut conjúnctio a Deo, ita divortium a diabolo sit. Sed
    proptérea in causa fornicatiónis licet uxórem dimíttere: quia ipsa esse uxor
    prior nóluit, quæ fidem conjugalem maríto non servávit. Nec illæ, quæ
    virginitátem Deo vovent, quamquam ampliórem gradum honoris et sanctitátis in
    Ecclésia teneant, sine nuptiis sunt: nam et ipsæ pertinent ad nuptias cum
    tota Ecclésia, in quibus nuptiis sponsus est Christus."
responsory8:
  - "@Tempora/Pent01-0:Responsory8"
lectio9:
  - "Ac per hoc ergo Dóminus invitátus venit ad nuptias, ut conjugális cástitas
    firmarétur, et ostenderétur sacraméntum nuptiárum: quia et illárum nuptiárum
    sponsus personam Dómini figurábat cui dictum est: Servásti vinum bonum usque
    adhuc. Bonum enim vinum Christus servávit usque adhuc, id est, Evangélium
    suum."
  - "&teDeum"
ant-2:
  - Núptiæ factæ sunt * in Cana Galilǽæ, et erat ibi Jesus cum María matre sua.
ant-3:
  - Deficiénte vino, * jussit Jesus impléri hýdrias aqua, quæ in vinum convérsa
    est, allelúja.
