    vos ómnia, allelúja./s"
lectio1:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 10:1-10"
  - "In illo témpore: Dixit Jesus pharisǽis: Amen, amen dico vobis: qui non
    intrat per óstium in ovíle óvium, sed ascéndit aliúnde, ille fur est, et
    latro. Qui autem intrat per óstium, pastor est óvium. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tract. 45 in Joann. post initium"
  - "Dóminus de grege suo, et de óstio quo intrátur ad ovíle, similitúdinem
    propósuit in hodiérna lectióne. Dicant ergo pagáni: Bene vívimus! Si per
    óstium non intrant, quid prodest eis unde gloriántur? Ad hoc enim debet
    unicuíque prodésse bene vívere, ut detur illi semper vívere: nam cui non
    datur semper vívere, quid prodest bene vívere? Quia nec bene vívere dicéndi
    sunt, qui finem bene vivéndi vel cæcitáte nésciunt, vel inflatióne
    contémnunt. Non est autem cuíquam spes vera et certa semper vivéndi, nisi
    agnóscat vitam, quod est Christus, et per jánuam intret in ovíle."
responsory1:
  - "R. Apparuérunt Apóstolis dispertítæ linguæ tamquam ignis, allelúja:"
  - "* Sedítque supra síngulos eórum Spíritus Sanctus, allelúja, allelúja."
  - V. Et cœpérunt loqui váriis linguis, prout Spíritus Sanctus dabat éloqui
    illis.
  - R. Sedítque supra síngulos eórum Spíritus Sanctus, allelúja, allelúja.
lectio2:
  - "Quærunt ergo plerúmque tales hómines étiam persuadére homínibus, ut bene
    vivant, et Christiáni non sint. Per áliam partem volunt ascéndere, rápere et
    occídere; non, ut bonus pastor, conserváre atque salváre. Fuérunt ergo
    quidam philósophi de virtútibus et vítiis subtília multa tractántes,
    dividéntes, definiéntes, ratiocinatiónes acutíssimas concludéntes, libros
    impléntes, suam sapiéntiam buccis crepántibus ventilántes, qui étiam dícere
    audérent homínibus: Nos sequímini, sectam nostram tenéte, si vultis beáte
    vívere. Sed non intrábant per óstium: pérdere volébant, mactáre et
    occídere."
responsory2:
  - R. Loquebántur váriis linguis Apóstoli magnália Dei,
  - "* Prout Spíritus Sanctus dabat éloqui illis, allelúja."
  - V. Repléti sunt omnes Spíritu Sancto, et cœpérunt loqui.
  - R. Prout Spíritus Sanctus dabat éloqui illis, allelúja.
  - "&Gloria"
  - R. Prout Spíritus Sanctus dabat éloqui illis, allelúja.
lectio3:
  - "Quid de istis dicam? Ecce ipsi pharisǽi legébant, et in eo quod legébant,
    Christum sonábant, ventúrum sperábant, et præséntem non agnoscébant.
    Jactábant se étiam ipsi inter Vidéntes, hoc est, inter sapiéntes, et
    negábant Christum, et non intrábant per óstium. Ergo et ipsi, si quos forte
    sedúcerent, mactándos et occidéndos, non liberándos sedúcerent. Et hos
    dimittámus. Videámus illos, si forte ipsi intrant per óstium, qui ipsíus
    Christi nómine gloriántur. Innumerábiles enim sunt, qui se Vidéntes non
    solum jactant, sed a Christo illuminátos vidéri volunt: sunt autem
    hærétici."
  - "&teDeum"
