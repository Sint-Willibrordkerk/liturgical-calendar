introitus:
  - "!Esdr 2:36 2:37"
  - "v. Accípite jucunditátem glóriæ vestræ, allelúja: grátias agéntes Deo,
    allelúja: qui vos ad cœléstia regna vocávit, allelúja, allelúja, allelúja."
  - "!Ps 77:1."
  - "Atténdite, pópule meus, legem meam: inclináte aurem vestram in verba oris
    mei."
  - "&Gloria"
  - "v. Accípite jucunditátem glóriæ vestræ, allelúja: grátias agéntes Deo,
    allelúja: qui vos ad cœléstia regna vocávit, allelúja, allelúja, allelúja."
oratio:
  - "Adsit nobis, quǽsumus, Dómine, virtus Spíritus Sancti: quæ et corda nostra
    cleménter expúrget, et ab ómnibus tueátur advérsis."
  - $Per Dominum eiusdem
lectio:
  - Léctio Actuum Apostolórum
  - "!Acts 8:14-17"
  - "In diébus illis: Cum audíssent Apóstoli, qui erant Jerosólymis, quod
    recepísset Samaría verbum Dei, misérunt ad eos Petrum et Joánnem. Qui cum
    veníssent, oravérunt pro ipsis, ut accíperent Spíritum Sanctum: nondum enim
    in quemquam illórum vénerat, sed baptizáti tantum erant in nómine Dómini
    Jesu. Tunc imponébant manus super illos, et accipiébant Spíritum Sanctum."
graduale:
  - Allelúja, allelúja.
  - "!Ps 14:26"
  - Spíritus Sanctus docébit vos, quæcúmque díxero vobis. Allelúja. (Hic
    genuflectitur)
  - "V. Veni, Sancte Spíritus, reple tuórum corda fidélium: et tui amóris in eis
    ignem accénde."
sequentia:
  - "@Tempora/Pasc7-0:Sequentia"
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joannes 10:1-10"
  - "In illo témpore: Dixit Jesus pharisǽis: Amen, amen, dico vobis: qui non
    intrat per óstium in ovíle óvium, sed ascéndit aliúnde, ille fur est et
    latro. Qui autem intrat per óstium, pastor est óvium. Huic ostiárius áperit,
    et oves vocem ejus áudiunt, et próprias oves vocat nominátim et edúcit eas.
    Et cum próprias oves emíserit, ante eas vadit: et oves illum sequúntur, quia
    sciunt vocem ejus. Aliénum autem non sequúntur, sed fúgiunt ab eo; quia non
    novérunt vocem alienórum. Hoc provérbium dixit eis Jesus. Illi autem non
    cognovérunt, quid loquerétur eis. Dixit ergo eis íterum Jesus: Amen, amen,
    dico vobis, quia ego sum óstium óvium. Omnes, quotquot venérunt, fures sunt
    et latrónes, et non audiérunt eos oves. Ego sum óstium. Per me si quis
    introíerit, salvábitur: et ingrediétur et egrediétur et páscua invéniet. Fur
    non venit, nisi ut furétur et mactet et perdat. Ego veni, ut vitam hábeant
    et abundántius hábeant."
offertorium:
  - "!Ps 77:23-25"
  - "Portas cœli aperuit Dóminus: et pluit illis manna, ut éderent: panem cœli
    dedit eis, panem Angelórum manducávit homo, allelúja."
secreta:
  - "Puríficet nos, quǽsumus. Dómine, múneris præséntis oblátio: et dignos sacra
    participatióne effíciat."
  - $Per Dominum
communio:
  - "!Joannes 15:26; 16:14"
  - "Spíritus qui a Patre procédit, allelúja: ille me clarificábit, allelúja,
    allelúja."
postcommunio:
  - "Mentes nostras, quǽsumus, Dómine, Spíritus Sanctus divínis réparet
    sacraméntis: quia ipse est remíssio ómnium peccatórum."
  - $Per Dominum eiusdem
