introitus:
  - "!Ps 89:1; 89:2"
  - "v. Dómine, refúgium factus es nobis a generatióne et progénie: a sǽculo et
    in sǽculum tu es."
  - "!Ps 89:2"
  - "Priúsquam montes fíerent, aut formarétur terra et orbis: a sǽculo et usque
    in sǽculum tu es Deus."
  - "&Gloria"
  - "v. Dómine, refúgium factus es nobis a generatióne et progénie: a sǽculo et
    in sǽculum tu es."
oratio:
  - "Réspice, Dómine, famíliam tuam: et præsta; ut apud te mens nostra tuo
    desidério fúlgeat, quæ se carnis maceratióne castígat."
  - $Per Dominum
lectio:
  - Léctio Isaíæ Prophétæ
  - "!Is 55:6-11"
  - "In diébus illis: Locútus est Isaías Prophéta, dicens: Quǽrite Dóminum, dum
    inveníri potest: invocáte eum, dum prope est. Derelínquat ímpius viam suam,
    et vir iníquus cogitatiónes suas, et revertátur ad Dóminum: et miserébitur
    ejus, et ad Deum nostrum: quóniam multus est ad ignoscéndum. Non enim
    cogitationes meæ cogitatiónes vestræ: neque viæ vestræ viæ meæ, dicit
    Dóminus. Quia sicut exaltántur cœli a terra, sic exaltátæ sunt viæ meæ a
    viis vestris, et cogitatiónes meæ a cogitatiónibus vestris. Et quómodo
    descéndit imber et nix de cœlo, et illuc ultra non revértitur, sed inébriat
    terram, et infúndit eam, et germináre eam facit, et dat semen serénti, et
    panem comedénti: sic erit verbum meum, quod egrediétur de ore meo: non
    revertétur ad me vácuum, sed fáciet quæcúmque volui, et prosperábitur in
    his, ad quæ misi illud: ait Dóminus omnípotens."
graduale:
  - "!Ps 140:2"
  - Dirigátur orátio mea sicut incénsum in conspéctu tuo, Dómine,
  - V. Elevátio mánuum meárum sacrifícium vespertínum.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 21:10-17"
  - "In illo témpore: Cum intrásset Jesus Jerosólymam, commóta est univérsa
    cívitas, dicens: Quis est hic? Pópuli autem dicébant: Hic est Jesus Prophéta
    a Názareth Galilǽæ. Et intrávit Jesus in templum Dei, et ejiciébat omnes
    vendéntes, et eméntes in templo; et mensas nummulariórum et cáthedras
    vendéntium colúmbas evértit: et dicit eis: Scriptum est: Domus mea domus
    oratiónis vocábitur: vos autem fecístis illam spelúncam latrónum. Et
    accessérunt ad eum cæci et claudi in templo: et sanávit eos. Vidéntes autem
    príncipes sacerdótum et scribæ mirabília, quæ fecit, et púeros clamantes in
    templo, et dicéntes: Hosánna fílio David: indignáti sunt, et dixérunt ei:
    Audis, quid isti dicunt? Jesus autem dixit eis: Utique. Numquam legístis:
    Quia ex ore infántium et lacténtium perfecísti laudem? Et relíctis illis,
    ábiit foras extra civitátem in Bethániam: ibíque mansit."
offertorium:
  - "!Ps 30:15-16"
  - "In te sperávi, Dómine; dixi: Tu es Deus meus, in mánibus tuis témpora mea."
secreta:
  - "Oblátis, quǽsumus, Dómine, placáre munéribus: et a cunctis nos defénde
    perículis."
  - $Per Dominum
communio:
  - "!Ps 4:2"
  - "Cum invocárem te, exaudísti me, Deus justítiæ meæ: in tribulatióne
    dilatásti me: miserére mihi, Dómine, et exáudi oratiónem meam."
postcommunio:
  - "@Tempora/Epi5-0:Postcommunio"
super-populum:
  - "!Oratio super Populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Ascéndant ad te, Dómine, preces nostræ: et ab Ecclésia tua cunctam
    repélle nequítiam."
  - $Per Dominum
