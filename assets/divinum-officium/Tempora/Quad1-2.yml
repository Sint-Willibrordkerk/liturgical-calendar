lectio1:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 21:10-17"
  - "In illo témpore: Cum intrásset Jesus Jerosólymam, commóta est univérsa
    cívitas, dicens: Quis est hic? Et réliqua."
  - _
  - Homilía sancti Bedæ Venerábilis Presbýteri
  - "!Homil. 7 in Quadrag. tom. 7"
  - "Quod maledicéndo ficum infructuósam per figúram fecit Dóminus, hoc idem mox
    apértius osténdit, eiciéndo ímprobos e templo. Neque enim áliquid peccávit
    arbor, quod esuriénte Dómino poma non hábuit, quorum necdum tempus
    advénerat: sed peccavére sacerdótes, qui in domo Dómini negótia sæculária
    gerébant, et fructum pietátis, quem debúerant, quemque in eis Dóminus
    esuriébat, ferre superséderant. Arefécit Dóminus árborem maledícto, ut
    hómines hæc vidéntes, sive audiéntes, multo magis intellégerent sese divíno
    condemnándos esse judício, si absque óperum fructu, de plausu tantum sibi
    religiósi sermónis, velut de sónitu et teguménto blandiréntur viridántium
    foliórum."
responsory1:
  - "@Tempora/Quad1-0:Responsory4"
lectio2:
  - "Verum quia non intellexérunt, in ipsos consequénter districtiónem méritæ
    ultiónis exércuit: et ejécit commércia rerum humanárum de domo illa, in qua
    divínas tantum res agi, hóstias et oratiónes Dei offérri, verbum Dei legi,
    audíri, et decantári præcéptum erat. Et quidem credéndum est, quia ea tantum
    vendi vel emi repérerit in templo quæ ad ministérium necessária essent
    ejúsdem templi, juxta hoc quod álias factum légimus, cum idem templum
    ingrédiens, invénit in eo vendéntes et eméntes oves, et boves, et colúmbas:
    quia nimírum hæc ómnia non nisi ut offerréntur in domo Dómini, eos qui de
    longe vénerant, ab indígenis comparáre credéndum est."
responsory2:
  - "@Tempora/Quad1-0:Responsory5"
lectio3:
  - "Si ergo Dóminus nec ea volébat venúmdari in templo, quæ in templo volébat
    offérri, vidélicet propter stúdium avarítiæ, sive fraudis, quod próprium
    solet esse negotiántium fácinus: quanta putas animadversióne puníret, si
    invenísset ibi áliquos rísui vel vanilóquio vacántes aut álii cuílibet vítio
    mancipátos? Si enim ea quæ álibi líbere geri póterant, Dóminus in domo sua
    temporália negótia geri non pátitur: quanto magis ea quæ nusquam fíeri
    licet, plus cæléstis iræ meréntur, si in ǽdibus Deo sacrátis agúntur? Verum
    quia Spíritus Sanctus in colúmba super Dóminum appáruit, recte per colúmbas
    Sancti Spíritus charísmata signántur. Qui autem sunt in templo Dei hódie,
    qui colúmbas vendunt, nisi qui in Ecclésia prétium de impositióne manus
    accípiunt, per quam vidélicet impositiónem Spíritus Sanctus cǽlitus datur?"
responsory3:
  - "@Tempora/Quad1-0:Responsory6"
