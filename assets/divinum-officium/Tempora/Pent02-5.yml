lectio9:
  - Ad hoc enim perforátum est latus tuum, ut nobis páteat intróitus. Ad hoc
    vulnerátum est Cor tuum, ut in illo ab exterióribus turbatiónibus absolúti
    habitáre possímus. Nihilóminus et proptérea vulnerátum est, ut per vulnus
    visíbile, vulnus amóris invisíbile videámus. Quómodo hic ardor mélius posset
    osténdi, nisi quod non solum corpus, verum étiam ipsum Cor láncea vulnerári
    permísit? Carnále ergo vulnus, vulnus spirituále osténdit. Quis illud Cor
    tam vulnerátum non díligat? quis tam amántem non rédamet? quis tam castum
    non amplectátur? Nos ígitur adhuc in carne manéntes, quantum póssumus,
    amántem redamémus, amplectámur vulnerátum nostrum, cujus ímpii agrícolæ
    fodérunt manus et pedes, latus et Cor; oremúsque ut cor nostrum, adhuc durum
    et impœ́nitens, amóris sui vínculo constríngere et jáculo vulneráre
    dignétur.
  - "&teDeum"
