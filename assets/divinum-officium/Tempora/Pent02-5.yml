evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joannes 19:31-37"
  - "In illo témpore: Judǽi - quóniam Parascéve erat, - ut non remanérent in
    cruce córpora sábbato - erat enim magnus dies ille sábbati, - rogavérunt
    Pilátum, ut frangeréntur eórum crura, et tolleréntur. Venérunt ergo mílites:
    et primi quidem fregérunt crura et alteríus, qui crucifíxus est cum eo. Ad
    Jesum autem cum veníssent, ut vidérunt eum jam mórtuum, non fregérunt ejus
    crura, sed unus mílitum láncea latus ejus apéruit, et contínuo exívit
    sanguis et aqua. Et qui vidit, testimónium perhíbuit: et verum est
    testimónium ejus. Et ille scit quia vera dicit, ut et vos credátis. Facta
    sunt enim hæc ut Scriptúra implerétur: Os non comminuétis ex eo. Et íterum
    alia Scriptúra dicit: Vidébunt in quem transfixérunt."
offertorium:
