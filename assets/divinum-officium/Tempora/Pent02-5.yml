lectio1:
  - De Jeremía Prophéta
  - "!Jer 24:5-7"
  - "5 Hæc dicit Dóminus, Deus Israël: Cognóscam transmigratiónem Juda, quam
    emísi de loco isto in terram Chaldæórum, in bonum."
  - 6 Et ponam óculos meos super eos ad placándum, et redúcam eos in terram
    hanc; et ædificábo eos, et non déstruam; et plantábo eos et non evéllam.
  - 7 Et dabo eis cor ut sciant me, quia ego sum Dóminus; et erunt mihi in
    pópulum, et ego ero eis in Deum, quia reverténtur ad me in toto corde suo.
responsory1:
  - R. Fériam eis pactum sempitérnum et non désinam eis benefácere et timórem
    meum dabo in corde eórum
  - "* Ut non recédant a me."
  - V. Et lætábor super eis cum bene eis fécero in toto Corde meo.
  - R. Ut non recédant a me.
lectio2:
  - "!Jer 30:18-19; 30:21-24"
  - "18 Hæc dicit Dóminus: Ecce ego convértam conversiónem tabernaculórum Jacob,
    et tectis ejus miserébor, et ædificábitur cívitas in excélso suo, et templum
    juxta órdinem suum fundábitur,"
  - 19 et egrediétur de eis laus, voxque ludéntium.
  - 21 Et erit dux ejus ex eo, et princeps de médio ejus producétur; et,
    applicábo eum et accédet ad me. Quis enim iste est qui ápplicet cor suum ut
    appropínquet mihi? ait Dóminus.
  - 22 Et éritis mihi in pópulum, et ego ero vobis in Deum.
  - 23 Ecce turbo Dómini, furor egrédiens, procélla ruens; in cápite impiórum
    conquiéscet.
  - "24 Non avértet iram indignatiónis Dóminus, donec fáciat et cómpleat
    cogitatiónem Cordis sui: in novíssimo diérum intellegétis ea."
responsory2:
  - R. Si inimícus meus maledixísset mihi, sustinuíssem útique
  - "* Tu vero homo unánimis qui simul mecum dulces capiébas cibos."
  - V. Et si is qui me óderat super me magna locútus fuísset, abscondíssem me
    fórsitan ab eo.
  - R. Tu vero homo unánimis qui simul mecum dulces capiébas cibos.
lectio3:
  - "!Jer 31:1-3; 31:31-33"
  - 1 In témpore illo, dicit Dóminus, ero Deus univérsis cognatiónibus Israël,
    et ipsi erunt mihi in pópulum.
  - "2 Hæc dicit Dóminus: Invénit grátiam in desérto pópulus qui remánserat a
    gládio; vadet ad réquiem suam Israël."
  - "3 Longe Dóminus appáruit mihi. Et in caritáte perpétua diléxi te: ídeo
    attráxi te, míserans."
  - "31 Ecce dies vénient, dicit Dóminus: et fériam dómui Israël et dómui Juda
    fœdus novum:"
  - "32 non secúndum pactum, quod pépigi cum pátribus eórum in die, qua
    apprehéndi manum eórum, ut edúcerem eos de Terra Ægýpti: pactum quod írritum
    fecérunt, et ego dominátus sum eórum, dicit Dóminus."
  - "33 Sed hoc erit pactum, quod fériam cum domo Israël: post dies illos dicit
    Dóminus: Dabo legem meam in viscéribus eórum, et in corde eórum scribam eam:
    et ero eis in Deum, et ipsi erunt mihi in pópulum."
responsory3:
  - R. Cum essémus mórtui peccátis, convivificávit nos Deus in Christo
  - "* Propter nímiam caritátem suam qua diléxit nos."
  - V. Ut osténderet in sǽculis superveniéntibus abundántes divítias grátiæ suæ.
  - R. Propter nímiam caritátem suam qua diléxit nos.
  - "&Gloria"
  - R. Propter nímiam caritátem suam qua diléxit nos.
lectio4:
  - "Inter mira sacræ doctrínæ pietatísque increménta, quibus divínæ Sapiéntiæ
    consília clárius in dies Ecclésiæ manifestántur, vix áliud magis conspícuum
    est quam triumphális progréssio cultus sacratíssimi Cordis Jesu. Sǽpius
    quidem, priórum decúrsu témporum, Patres, Doctóres, Sancti, Redemptóris
    nostri amórem celebrárunt: vulnus in látere Christi apértum ómnium gratiárum
    arcánum dixérunt fontem. At inde a médio ævo, cum tenerióre quadam erga
    sanctíssimam Salvatóris Humanitátem religióne fidéles áffici cœpti sunt,
    ánimæ contemplatívæ per plagam illam ad ipsum Cor, amóre hóminum vulnerátum,
    penetráre fere solébant. Atque ex eo témpore hæc contemplátio sanctíssimis
    quibúsque ita familiáris evásit, ut neque régio neque ordo religiósus sit,
    in quibus non insígnia, hac ætáte, ejus reperiántur testimónia. Próximis
    demum sǽculis, eóque potíssimum témpore quo hærétici, sub falsæ pietátis
    título, a sanctíssima Eucharístia Christiános detérrere conabántur, cultus
    sacratíssimo Cordi públice exhibéri cœptus est, ópera imprímis sancti
    Joánnis Eudes, qui auctor litúrgici cultus sacrórum Córdium Jesu et Maríæ
    haud immérito nuncupátur."
responsory4:
  - R. Prope est Dóminus ómnibus invocántibus eum,
  - "* Omnibus invocántibus eum in veritáte."
  - V. Miserátor et miséricors Dóminus, pátiens et multum miséricors.
  - R. Omnibus invocántibus eum in veritáte.
lectio5:
  - Verum, ad cultum sacratíssimi Cordis Jesu plene perfectéque constituéndum,
    eundémque per totum orbem propagándum, Deus ipse sibi instruméntum elégit
    humíllimam ex órdine Visitatiónis vírginem, sanctam Margarítam Maríam
    Alacóque, cui, a prima quidem ætáte jam in Eucharístiæ Sacraméntum amóre
    flagránti, Christus Dóminus sæpenúmero appárens, divíni Cordis sui et
    divítias et optáta significáre dignátus est. Quarum apparitiónum celebérrima
    illa est, qua ei ante Eucharístiam oránti Jesus conspiciéndum se dedit,
    sacratíssimum Cor osténdit et conquéstus quod, pro imménsa sua caritáte,
    nihil nisi ingratórum hóminum contumélias recíperet, ipsi præcépit ut novum
    festum, féria sexta post Octávam Córporis Christi, instituéndum curáret, quo
    Cor suum honóre débito colerétur, atque injúriæ sibi in Sacraménto amóris a
    peccatóribus illátæ dignis expiaréntur obséquiis. Quot autem quantásque Dei
    fámula in Christi mandátis exsequéndis expérta sit difficultátes, nemo est
    qui ignóret; sed ab ipso Dómino confirmáta, atque a religiósis ánimæ suæ
    moderatóribus, qui incredíbili quodam ardóre ad hunc cultum promovéndum
    laborárunt, strénue adjúta, múnere sibi cǽlitus commísso fidéliter fungi ad
    mortem usque non déstitit.
responsory5:
  - R. Confíteor tibi, Pater, Dómine cæli et terræ, quia abscondísti hæc a
    sapiéntibus et prudéntibus
  - "* Et revelásti ea párvulis."
  - V. Ita, Pater, quóniam sic fuit plácitum ante te.
  - R. Et revelásti ea párvulis.
lectio6:
  - Anno tandem millésimo septingentésimo sexagésimo quinto, Clemens décimus
    tértius Póntifex Máximus offícium et missam in honórem sacratíssimi Cordis
    Jesu approbávit; Pius vero nonus festum ad univérsam Ecclésiam exténdit.
    Exínde, cultus sacratíssimi Cordis, quasi flumen exúndans, prolútis
    impediméntis ómnibus, per totum se orbem effúdit, et, novo illucescénte
    sǽculo, jubilǽo indícto, Leo décimus tértius humánum genus univérsum
    sacratíssimo Cordi devótum vóluit. Quæ consecrátio, in ómnibus quidem
    cathólici orbis ecclésiis, solémni ritu perácta, ingens áttulit devotiónis
    hujus increméntum, et ad eam non solum pópulos, verum étiam singuláres
    famílias addúxit, quæ Divíno Cordi innumerábiles se dévovent, regióque ejus
    império subíciunt. Dénique, Pius undécimus Póntifex Máximus, quo plénius
    festi solémnitas pópuli christiáni devotióni tam late paténti respondéret,
    sacratíssimi Cordis Jesu festum ad ritum dúplicem primæ classis cum octáva
    evéxit; ac prætérea, ut violáta jura Christi summi Regis ac Dómini
    amantíssimi resarciréntur, populorúmque peccáta defleréntur, eódem festo die
    piaculárem precatiónem in ómnibus christiáni orbis templis quotánnis
    recitándam mandávit.
responsory6:
  - R. Omnes gentes quascúmque fecísti, vénient
  - "* Et adorábunt coram te, Dómine."
  - V. Et glorificábunt nomen tuum, quóniam magnus es tu, et fáciens mirabília.
  - R. Et adorábunt coram te, Dómine.
  - "&Gloria"
  - R. Et adorábunt coram te, Dómine.
lectio7:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 19:31-37"
  - "In illo témpore: Judǽi, quóniam parascéve erat, ut non remanérent in cruce
    córpora sábbato (erat enim magnus dies ille sábbati) rogavérunt Pilátum, ut
    frangeréntur eórum crura et tolleréntur. Et réliqua."
  - _
  - Homilía sancti Bonaventúræ Epíscopi
  - "!Liber de ligno vitæ, num. 30"
  - "Ut de látere Christi dormiéntis in cruce formarétur Ecclésia, et Scriptúra
    implerétur quæ dicit: Vidébunt in quem transfixérunt, divína est ordinatióne
    indúltum ut unus mílitum láncea latus illud sacrum aperiéndo perfóderet,
    quátenus sánguine cum aqua manánte, prétium effunderétur nostræ salútis quod
    a fonte scílicet Cordis arcáno profúsum, vim daret sacraméntis Ecclésiæ ad
    vitam grátiæ conferéndam, essétque jam in Christo vivéntibus póculum fontis
    vivi, saliéntis in vitam ætérnam. Surge ígitur, ánima amíca Christi,
    vigiláre non cesses, ibi os appóne, ut háurias aquas de fóntibus
    salvatóris."
responsory7:
  - R. Ego si exaltátus fúero a terra
  - "* Omnia traham ad meípsum."
  - V. Hoc autem dicébat signíficans qua morte esset moritúrus.
  - R. Omnia traham ad meípsum.
lectio8:
  - "!De vite mystica, cap. 3"
  - "Quia semel vénimus ad Cor Dómini Jesu dulcíssimi, et bonum est nos hic
    esse, non fácile evellámur ab eo. O quam bonum et jucúndum habitáre in Corde
    hoc. Bonus thesáurus, pretiósa margaríta Cor tuum, óptime Jesu, quam, fosso
    agro córporis tui, invenímus. Quis hanc margarítam abíciat? Quin pótius,
    dabo omnes margarítas, cogitatiónes et affectiónes meas commutábo et
    comparábo illam mihi, jactans omnem cogitátum meum in Cor boni Jesu, et sine
    fallácia illud me enútriet. Hoc ígitur tuo et meo Corde, dulcíssime Jesu,
    invénto, orábo te Deum meum: admítte in sacrárium exauditiónis preces meas:
    immo me totum trahe in Cor tuum."
