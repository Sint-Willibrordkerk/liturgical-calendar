oratio:
  - "Deus, qui nobis in Corde Fílii tui, nostris vulneráto peccátis, infinítos
    dilectiónis thesáuros misericórditer largíri dignáris: concéde, quǽsumus;
    ut, illi devótum pietátis nostræ præstántes obséquium, dignæ quoque
    satisfactiónis exhibeámus offícium."
  - $Per eundem
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Ephésios
  - "!Eph 3:8-12, 14-19"
  - "Fratres: Mihi, ómnium sanctórum mínimo, data est grátia hæc, in géntibus
    evangelizáre investigábiles divítias Christi, et illumináre omnes, quæ sit
    dispensátio sacraménti abscónditi a sǽculis in Deo, qui ómnia creávit: ut
    innotéscat principátibus et potestátibus in cœléstibus per Ecclésiam
    multifórmis sapiéntia Dei, secúndum præfinitiónem sæculórum, quam fecit in
    Christo Jesu, Dómino nostro, in quo habémus fidúciam et accéssum in
    confidéntia per fidem ejus. Hujus rei grátia flecto génua mea ad Patrem
    Dómini nostri Jesu Christi, ex quo omnis patérnitas in cœlis ei in terra
    nominátur, ut det vobis, secúndum divítias glóriæ suæ, virtúte corroborári
    per Spíritum ejus in interiórem hóminem, Christum habitáre per fidem in
    córdibus vestris: in caritáte radicáti et fundáti, ut póssitis comprehéndere
    cum ómnibus sanctis, quæ sit latitúdo, et longitúdo, et sublímitas, et
    profúndum: scire étiam supereminéntem sciéntiæ caritátem Christi, ut
    impleámini in omnem plenitúdinem Dei."
