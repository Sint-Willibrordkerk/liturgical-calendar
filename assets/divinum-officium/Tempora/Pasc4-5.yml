lectio1:
  - De Epístola beáti Jacóbi Apóstoli
  - "!Jas 4:1-4"
  - "1 Unde bella et lites in vobis? nonne hinc: ex concupiscéntiis vestris, quæ
    mílitant in membris vestris?"
  - "2 concupíscitis, et non habétis: occíditis, et zelátis: et non potéstis
    adipísci: litigátis, et belligerátis, et non habétis, propter quod non
    postulátis."
  - "3 Pétitis, et non accípitis: eo quod male petátis: ut in concupiscéntiis
    vestris insumátis."
  - 4 Adúlteri, nescítis quia amicítia hujus mundi inimíca est Dei? quicúmque
    ergo volúerit amícus esse sǽculi hujus, inimícus Dei constitúitur.
responsory1:
  - "@Tempora/Pasc4-0:Responsory4"
lectio2:
  - "!Jas 4:5-10"
  - "5 An putátis quia inániter Scriptúra dicat: Ad invídiam concupíscit
    spíritus qui hábitat in vobis?"
  - "6 majórem autem dat grátiam. Propter quod dicit: Deus supérbis resístit,
    humílibus autem dat grátiam."
  - 7 Súbditi ergo estóte Deo, resístite autem diábolo, et fúgiet a vobis.
  - "8 Appropinquáte Deo, et appropinquábit vobis. Emundáte manus, peccatóres:
    et purificáte corda, dúplices ánimo."
  - "9 Míseri estóte, et lugéte, et ploráte: risus vester in luctum convertátur,
    et gáudium in mœrórem."
  - 10 Humiliámini in conspéctu Dómini, et exaltábit vos.
responsory2:
  - "@Tempora/Pasc4-0:Responsory5"
  - "&Gloria"
  - R. Ne repéllas me a mandátis tuis, allelúja, allelúja.
lectio3:
  - "!Jas 4:11-15"
  - 11 Nolíte detráhere altérutrum fratres. Qui détrahit fratri, aut qui júdicat
    fratrem suum, détrahit legi, et júdicat legem. Si autem júdicas legem, non
    es factor legis, sed judex.
  - 12 Unus est legislátor et judex, qui potest pérdere et liberáre.
  - "13 Tu autem quis es, qui júdicas próximum? Ecce nunc qui dícitis: Hódie,
    aut crástino íbimus in illam civitátem, et faciémus ibi quidem annum, et
    mercábimur, et lucrum faciémus:"
  - 14 qui ignorátis quid erit in crástino.
  - "15 Quæ est enim vita vestra? vapor est ad módicum parens, et deínceps
    exterminábitur; pro eo ut dicátis: Si Dóminus volúerit. Et: Si vixérimus,
    faciémus hoc, aut illud."
responsory3:
  - "@Tempora/Pasc4-0:Responsory6"
ant-2:
  - Isti sunt sermónes, * quos dicébam vobis, cum essem vobíscum, allelúja,
    allelúja.
