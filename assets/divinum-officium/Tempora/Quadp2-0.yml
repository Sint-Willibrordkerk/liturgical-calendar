lectio1:
  - De libro Génesis
  - "!Gen 5:31; 6:1-4"
  - 31 Noë vero cum quingentórum esset annórum, génuit Sem, Cham et Japheth.
  - 1 Cumque cœpíssent hómines multiplicári super terram, et fílias procreássent,
  - 2 vidéntes fílii Dei fílias hóminum quod essent pulchræ, accepérunt sibi
    uxóres ex ómnibus, quas elégerant.
  - "3 Dixítque Deus: Non permanébit spíritus meus in hómine in ætérnum, quia
    caro est: erúntque dies illíus centum vigínti annórum."
  - "4 Gigántes autem erant super terram in diébus illis: postquam enim ingréssi
    sunt fílii Dei ad fílias hóminum, illǽque genuérunt, isti sunt poténtes a
    sǽculo viri famósi."
responsory1:
  - "R. Dixit Dóminus ad Noë: Finis univérsæ carnis venit coram me: repléta est
    terra iniquitáte eórum,"
  - "* Et ego dispérdam eos cum terra."
  - V. Fac tibi arcam de lignis lævigátis, mansiúnculas in ea fácies.
  - R. Et ego dispérdam eos cum terra.
lectio2:
  - "!Gen 6:5-8"
  - 5 Videns autem Deus quod multa malítia hóminum esset in terra, et cuncta
    cogitátio cordis inténta esset ad malum omni témpore,
  - 6 pœnítuit eum quod hóminem fecísset in terra. Et tactus dolóre cordis
    intrínsecus,
  - "7 Delébo, inquit, hóminem, quem creávi, a fácie terræ, ab hómine usque ad
    animántia, a réptili usque ad vólucres cæli: pœ́nitet enim me fecísse eos."
  - 8 Noë vero invénit grátiam coram Dómino.
responsory2:
  - "R. Noë, vir justus atque perféctus, cum Deo ambulávit:"
  - "* Et fecit ómnia quæcúmque præcépit ei Deus."
  - V. Fecit sibi arcam, ut salvarétur univérsum semen.
  - R. Et fecit ómnia quæcúmque præcépit ei Deus.
lectio3:
  - "!Gen 6:9-15"
  - "9 Hæ sunt generatiónes Noë: Noë vir justus atque perféctus fuit in
    generatiónibus suis; cum Deo ambulávit."
  - 10 Et génuit tres fílios, Sem, Cham et Japheth.
  - 11 Corrúpta est autem terra coram Deo, et repléta est iniquitáte.
  - 12 Cumque vidísset Deus terram esse corrúptam (omnis quippe caro corrúperat
    viam suam super terram),
  - "13 dixit ad Noë: Finis univérsæ carnis venit coram me: repléta est terra
    iniquitáte a fácie eórum, et ego dispérdam eos cum terra."
  - 14 Fac tibi arcam de lignis lævigátis; mansiúnculas in arca fácies, et
    bitúmine línies intrínsecus et extrínsecus.
  - "15 Et sic fácies eam: trecentórum cubitórum erit longitúdo arcæ,
    quinquagínta cubitórum latitúdo, et trigínta cubitórum altitúdo illíus."
responsory3:
  - "R. Quadragínta dies et noctes apérti sunt cæli, et ex omni carne habénte
    spíritum vitæ ingréssa sunt in arcam:"
  - "* Et clausit a foris óstium Dóminus."
  - V. In artículo diéi illíus ingréssus est Noë in arcam et fílii ejus, et uxor
    illíus et uxóres filiórum ejus.
  - R. Et clausit a foris óstium Dóminus.
  - "&Gloria"
  - R. Et clausit a foris óstium Dóminus.
lectio4:
  - Ex libro sancti Ambrósii Epíscopi de Noë et arca
  - "!Cap. 4. circa med."
  - "Habes, quia irátus Dóminus est: quóniam quamvis cogitáret, hoc est sciret,
    quia homo pósitus in terræ regióne, carnem portans, sine peccáto esse non
    possit, (terra enim velut quidam tentatiónum locus est, caróque corruptélæ
    illécebra) tamen cum habérent mentem ratiónis capácem, virtutémque ánimæ
    infusam córpori, sine consideratióne áliqua in lapsum ruérunt, ex quo
    revocáre se nollent. Neque enim Deus cógitat sicut hómines, ut áliqua ei
    nova succédat senténtia, neque iráscitur quasi mutábilis: sed ídeo hæc
    legúntur, ut exprimátur peccatórum nostrórum acérbitas, quæ divínam merúerit
    offénsam: tamquam eoúsque incréverit culpa, ut étiam Deus, qui naturáliter
    non movétur aut ira, aut ódio, aut passióne ulla, provocátus videátur ad
    iracúndiam."
responsory4:
  - "R. Ædificávit Noë altáre Dómino, ófferens super illud holocáustum:
    odoratúsque est Dóminus odórem suavitátis, et benedíxit ei, dicens:"
  - "* Créscite, et multiplicámini, et repléte terram."
  - V. Ecce ego státuam pactum meum vobíscum, et cum sémine vestro post vos.
  - R. Créscite, et multiplicámini, et repléte terram.
lectio5:
  - "Minitátus est prætérea, quod deléret hóminem. Ab hómine, inquit, usque ad
    pecus, et a reptílibus usque ad volatília delébo. Quid læserant
    irrationabília? Sed quia propter hóminem illa facta erant, eo útique deléto,
    propter quem facta sunt, cónsequens erat, ut étiam illa deleréntur, quia non
    erat qui his uterétur. Sensu autem altióre illud manifestátur: quia homo
    mens est, quæ est ratiónis capax. Homo enim definítur ánimal vivum, mortále,
    rationábile. Principáli ígitur exstíncto, étiam sensus omnis exstínguitur:
    eo quod nihil réliqui ad salútem supérsit, cum salútis fundaméntum virtus
    defécerit."
responsory5:
  - "R. Ponam arcum meum in núbibus cæli, dixit Dóminus ad Noë:"
  - "* Et recordábor fœ́deris mei, quod pépigi tecum."
  - V. Cumque obdúxero núbibus cælum, apparébit arcus meus in núbibus.
  - R. Et recordábor fœ́deris mei, quod pépigi tecum.
lectio6:
  - "Ad condemnatiónem autem ceterórum, et ad expressiónem pietátis divínæ,
    dícitur Noë apud Deum grátiam invenísse. Simul osténditur, quod hóminem
    justum non obúmbret aliórum offénsio, quando ipse ad totíus géneris
    reservátur seminárium. Qui non generatiónis nobilitáte, sed justítiæ et
    perfectiónis mérito laudátur. Probáti enim viri genus, virtútis prosápia
    est: quia sicut hóminum genus hómines, ita animárum genus virtútes sunt.
    Etenim famíliæ hóminum splendóre géneris nobilitántur, animárum autem
    clarificátur grátia splendóre virtútis."
responsory6:
  - "R. Per memetípsum jurávi, dicit Dóminus, non adíciam ultra aquas dilúvii
    super terram: pacti mei recordábor,"
  - "* Ut non perdam aquis dilúvii omnem carnem."
  - V. Arcum meum ponam in núbibus, et erit signum fœ́deris inter me et inter
    terram.
  - R. Ut non perdam aquis dilúvii omnem carnem.
  - "&Gloria"
  - R. Ut non perdam aquis dilúvii omnem carnem.
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 8:4-15"
  - "In illo témpore: Cum autem turba plúrima convenírent, et de civitátibus
    properárent ad Jesum, dixit per similitúdinem: Exiit qui séminat, semináre
    semen suum. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 15 in Evangelia"
  - "Léctio sancti Evangélii, quam modo, fratres caríssimi, audístis,
    expositióne non índiget, sed admonitióne. Quam enim per semetípsam Véritas
    expósuit, hanc discútere humána fragílitas non præsúmat. Sed est quod
    sollícite in hac ipsa expositióne Domínica pensáre debeámus: quia si nos
    vobis semen verbum, agrum mundum, vólucres dæmónia, spinas divítias
    significáre dicerémus ad credéndum nobis mens fórsitan vestra dubitáret.
    Unde et idem Dóminus per semetípsum dignátus est expónere quod dicébat, ut
    sciátis rerum significatiónes quǽrere in iis étiam, quæ per semetípsum
    nóluit explanáre."
responsory7:
  - "R. Benedíxit Deus Noë, et fíliis ejus, et dixit ad eos:"
  - "* Créscite, et multiplicámini, et repléte terram."
  - V. Ecce ego státuam pactum meum vobíscum, et cum sémine vestro post vos.
  - R. Créscite, et multiplicámini, et repléte terram.
lectio8:
  - "Exponéndo ergo quod dixit, figuráte se loqui innótuit: quátenus certos nos
    rédderet, cum vobis nostra fragílitas verbórum illíus figúras aperíret. Quis
    enim mihi umquam créderet, si spinas divítias interpretári voluíssem? máxime
    cum illæ pugnant, istæ deléctent. Et tamen spinæ sunt, quia cogitatiónum
    suárum punctiónibus mentem lácerant: et cum usque ad peccátum pértrahunt,
    quasi inflícto vúlnere cruéntant. Quas bene hoc in loco, álio Evangelísta
    testánte, nequáquam Dóminus divítias, sed falláces divítias appéllat."
responsory8:
  - "R. Ecce ego státuam pactum meum vobíscum, et cum sémine vestro post vos:"
  - "* Neque erit deínceps dilúvium díssipans terram."
  - V. Arcum meum ponam in núbibus, et erit signum fœ́deris inter me et inter
    terram.
  - R. Neque erit deínceps dilúvium díssipans terram.
lectio9:
  - "Falláces enim sunt, quæ nobíscum diu permanére non possunt: falláces sunt,
    quæ mentis nostræ inópiam non expéllunt. Solæ autem divítiæ veræ sunt, quæ
    nos dívites virtútibus fáciunt. Si ergo, fratres caríssimi, esse dívites
    cúpitis, veras divítias amáte. Si culmen veri honóris quæritis, ad cæléste
    regnum téndite. Si glóriam dignitátum dilígitis, in illa supérna Angelórum
    cúria adscríbi festináte. Verba Dómini, quæ aure percípitis, mente retinéte.
    Cibus enim mentis est sermo Dei: et quasi accéptus cibus stómacho languénte
    rejícitur, quando audítus sermo in ventre memóriæ non tenétur. Sed quisquis
    aliménta non rétinet, hujus profécto vita desperátur."
responsory9:
  - "R. Cum turba plúrima convenírent ad Jesum, et de civitátibus properárent ad
    eum, dixit per similitúdinem:"
  - "* Exiit qui séminat, semináre semen suum."
  - V. Et dum séminat, áliud cécidit in terram bonam, et ortum fecit fructum
    céntuplum.
  - R. Exiit qui séminat, semináre semen suum.
  - "&Gloria"
  - R. Exiit qui séminat, semináre semen suum.
