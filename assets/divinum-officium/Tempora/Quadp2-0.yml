oratio:
  - "Deus, qui cónspicis, quia ex nulla nostra actióne confídimus: concéde
    propítius; ut, contra advérsa ómnia, Doctóris géntium protectióne muniámur."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Corínthios
  - "!2 Cor 11:19-33; 12:1-9"
  - "Fratres: Libénter suffértis insipiéntes: cum sitis ipsi sapiéntes.
    Sustinétis enim, si quis vos in servitútem rédigit, si quis dévorat, si quis
    áccipit, si quis extóllitur, si quis in fáciem vos cædit. Secúndum
    ignobilitátem dico, quasi nos infírmi fuérimus in hac parte. In quo quis
    audet, - in insipiéntia dico - áudeo et ego: Hebræi sunt, et ego: Israëlítæ
    sunt, et ego: Semen Abrahæ sunt, et ego: Minístri Christi sunt, - ut minus
    sápiens dico - plus ego: in labóribus plúrimis, in carcéribus abundántius,
    in plagis supra modum, in mórtibus frequénter. A Judæis quínquies
    quadragénas, una minus, accépi. Ter virgis cæsus sum, semel lapidátus sum,
    ter naufrágium feci, nocte et die in profúndo maris fui: in itinéribus sæpe,
    perículis flúminum, perículis latrónum, perículis ex génere, perículis ex
    géntibus, perículis in civitáte, perículis in solitúdine, perículis in mari,
    perículis in falsis frátribus: in labóre et ærúmna, in vigíliis multis, in
    fame et siti, in jejúniis multis, in frigóre et nuditáte: præter illa, quæ
    extrínsecus sunt, instántia mea cotidiána, sollicitúdo ómnium Ecclesiárum.
    Quis infirmátur, et ego non infírmor? quis scandalizátur, et ego non uror?
    Si gloriári opórtet: quæ infirmitátis meæ sunt, gloriábor. Deus et Pater
    Dómini nostri Jesu Christi, qui est benedíctus in sǽcula, scit quod non
    méntior. Damásci præpósitus gentis Arétæ regis, custodiébat civitátem
    Damascenórum, ut me comprehénderet: et per fenéstram in sporta dimíssus sum
    per murum, et sic effúgi manus ejus. Si gloriári opórtet - non éxpedit
    quidem, - véniam autem ad visiónes et revelatiónes Dómini. Scio hóminem in
    Christo ante annos quatuórdecim, - sive in córpore néscio, sive extra corpus
    néscio, Deus scit - raptum hujúsmodi usque ad tértium cælum. Et scio
    hujúsmodi hóminem, - sive in córpore, sive extra corpus néscio, Deus scit:-
    quóniam raptus est in paradisum: et audivit arcána verba, quæ non licet
    homini loqui. Pro hujúsmodi gloriábor: pro me autem nihil gloriábor nisi in
    infirmitátibus meis. Nam, et si volúero gloriári, non ero insípiens:
    veritátem enim dicam: parco autem, ne quis me exístimet supra id, quod videt
    in me, aut áliquid audit ex me. Et ne magnitúdo revelatiónem extóllat me,
    datus est mihi stímulus carnis meæ ángelus sátanæ, qui me colaphízet.
    Propter quod ter Dóminum rogávi, ut discéderet a me: et dixit mihi: Súfficit
    tibi grátia mea: nam virtus in infirmitáte perfícitur. Libénter ígitur
    gloriábor in infirmitátibus meis, ut inhábitet in me virtus Christi."
