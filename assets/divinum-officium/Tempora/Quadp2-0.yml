evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 8:4-15"
  - "In illo témpore: Cum turba plúrima convenírent, et de civitátibus
    properárent ad Jesum, dixit per similitúdinem: Exiit, qui séminat, semináre
    semen suum: et dum séminat, áliud cécidit secus viam, et conculcátum est, et
    vólucres cæli comedérunt illud. Et áliud cécidit supra petram: et natum
    áruit, quia non habébat humórem. Et áliud cécidit inter spinas, et simul
    exórtæ spinæ suffocavérunt illud. Et áliud cécidit in terram bonam: et ortum
    fecit fructum céntuplum. Hæc dicens, clamábat: Qui habet aures audiéndi,
    áudiat. Interrogábant autem eum discípuli ejus, quæ esset hæc parábola.
    Quibus ipse dixit: Vobis datum est nosse mystérium regni Dei, céteris autem
    in parábolis: ut vidéntes non vídeant, et audiéntes non intéllegant. Est
    autem hæc parábola: Semen est verbum Dei. Qui autem secus viam, hi sunt qui
    áudiunt: déinde venit diábolus, et tollit verbum de corde eórum, ne
    credéntes salvi fiant. Nam qui supra petram: qui cum audíerint, cum gáudio
    suscípiunt verbum: et hi radíces non habent: qui ad tempus credunt, et in
    témpore tentatiónis recédunt. Quod autem in spinas cécidit: hi sunt, qui
    audiérunt, et a sollicitudínibus et divítiis et voluptátibus vitæ eúntes,
    suffocántur, et non réferunt fructum. Quod autem in bonam terram: hi sunt,
    qui in corde bono et óptimo audiéntes verbum rétinent, et fructum áfferunt
    in patiéntia."
