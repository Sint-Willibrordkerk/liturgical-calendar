introitus:
  - "!Ps 43:23-26"
  - "v. Exsúrge, quare obdórmis, Dómine? exsúrge, et ne repéllas in finem: quare
    fáciem tuam avértis, oblivísceris tribulatiónem nostram? adhæsit in terra
    venter noster: exsúrge, Dómine, ádjuva nos, et líbera nos."
  - "!Ps 43:2"
  - "Deus, áuribus nostris audívimus: patres nostri annuntiavérunt nobis."
  - "&Gloria"
  - "v. Exsúrge, quare obdórmis, Dómine? exsúrge, et ne repéllas in finem: quare
    fáciem tuam avértis, oblivísceris tribulatiónem nostram? adhæsit in terra
