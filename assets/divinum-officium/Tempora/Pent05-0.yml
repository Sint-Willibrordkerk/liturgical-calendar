introitus:
  - "!Ps 26:7; 26:9"
  - "v. Exáudi, Dómine, vocem meam, qua clamávi ad te: adjútor meus esto, ne
    derelínquas me neque despícias me, Deus, salutáris meus."
  - "!Ps 26:1"
  - Dóminus illuminátio mea et salus mea, quem timébo?
  - "&Gloria"
  - "v. Exáudi, Dómine, vocem meam, qua clamávi ad te: adjútor meus esto, ne
    derelínquas me neque despícias me, Deus, salutáris meus."
oratio:
  - "Deus, qui diligéntibus te bona invisibília præparásti: infúnde córdibus
    nostris tui amóris afféctum; ut te in ómnibus et super ómnia diligéntes,
    promissiónes tuas, quæ omne desidérium súperant, consequámur."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Petri Apóstoli
  - "!1 Pet 3:8-15"
  - "Caríssimi: Omnes unánimes in oratióne estóte, compatiéntes, fraternitátis
    amatóres, misericórdes, modésti, húmiles: non reddéntes malum pro malo, nec
    maledíctum pro maledícto, sed e contrário benedicéntes: quia in hoc vocáti
    estis, ut benedictiónem hereditáte possideátis. Qui enim vult vitam dilígere
    et dies vidére bonos, coérceat linguam suam a malo, et lábia ejus ne
    loquántur dolum. Declínet a malo, et fáciat bonum: inquírat pacem, et
    sequátur eam. Quia óculi Dómini super justos, et aures ejus in preces eórum:
    vultus autem Dómini super faciéntes mala. Et quis est, qui vobis nóceat, si
    boni æmulatóres fuéritis? Sed et si quid patímini propter justítiam, beáti.
    Timórem autem eórum ne timuéritis: et non conturbémini. Dóminum autem
    Christum sanctificáte in córdibus vestris."
graduale:
  - "!Ps 83:10; 83:9"
  - Protéctor noster, áspice, Deus, et réspice super servos tuos.
  - V. Dómine, Deus virtútum, exáudi preces servórum tuórum.
  - Allelúja, allelúja.
  - "!Ps 20:1"
  - "Dómine, in virtúte tua lætábitur rex: et super salutáre tuum exsultábit
    veheménter. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 5:20-24"
  - "In illo témpore: Dixit Jesus discípulis suis: Nisi abundáverit justítia
    vestra plus quam scribárum et pharisæórum, non intrábitis in regnum cœlórum.
    Audístis, quia dictum est antíquis: Non occídes: qui autem occíderit, reus
    erit judício. Ego autem dico vobis: quia omnis, qui iráscitur fratri suo,
    reus erit judício. Qui autem díxerit fratri suo, raca: reus erit concílio.
    Qui autem díxerit, fátue: reus erit gehénnæ ignis. Si ergo offers munus tuum
    ad altáre, et ibi recordátus fúeris, quia frater tuus habet áliquid advérsum
    te: relínque ibi munus tuum ante altáre et vade prius reconciliári fratri
    tuo: et tunc véniens ófferes munus tuum."
offertorium:
  - "!Ps 15:7 et 8"
  - "Benedícam Dóminum, qui tríbuit mihi intelléctum: providébam Deum in
    conspéctu meo semper: quóniam a dextris est mihi, ne commóvear."
secreta:
  - "Propitiáre, Dómine, supplicatiónibus nostris: et has oblatiónes famulórum
    famularúmque tuárum benígnus assúme; ut, quod sínguli obtulérunt ad honórem
    nóminis tui, cunctis profíciat ad salútem."
  - $Per Dominum
communio:
  - "!Ps 26:4"
  - "Unam pétii a Dómino, hanc requíram: ut inhábitem in domo Dómini ómnibus
    diébus vitæ meæ."
postcommunio:
  - "Quos cœlésti, Dómine, dono satiásti: præsta, quǽsumus; ut a nostris
    mundémur occúltis et ab hóstium liberémur insídiis."
  - $Per Dominum
ant-1_:
  - "Montes Gélboë, * nec ros nec plúvia véniant super vos: quia in te abjéctus
    est clípeus fórtium, clípeus Saul, quasi non esset unctus óleo. Quómodo
    cecidérunt fortes in bello? Jónathas in excélsis interféctus est: Saul et
    Jónathas, amábiles et decóri valde in vita sua, in morte quoque non sunt
    divísi."
ant-1:
  - "@:Ant 1_"
rubrica-cisterciensis/ant-1:
  - "@:Ant 1C"
ant-1c:
  - Quis enim * in ómnibus, sicut David fidélis invéntus est in regno tuo,
    egrédiens, et regrédiens, et pergens ad impérium regis?
lectio1:
  - Incipit liber secúndus Regum
  - "!2 Reg 1:1-4"
  - 1 Factum est autem, postquam mórtuus est Saul, ut David reverterétur a cæde
    Amalec et manéret in Síceleg duos dies.
  - 2 In die autem tértia appáruit homo véniens de castris Saul veste conscíssa
    et púlvere conspérsus caput et, ut venit ad David, cécidit super fáciem suam
    et adorávit.
  - "3 Dixítque ad eum David: Unde venis? Qui ait ad eum: De castris Israël
    fugi."
  - "4 Et dixit ad eum David: Quod est verbum quod factum est? Indica mihi. Qui
    ait: Fugit pópulus ex prǽlio, et multi corruéntes e pópulo mórtui sunt; sed
    et Saul et Jónathas fílius ejus interiérunt."
responsory1:
  - "@Tempora/Pent01-1"
lectio2:
  - "!2 Reg 1:5-10"
  - "5 Dixítque David ad adolescéntem qui nuntiábat ei: Unde scis quia mórtuus
    est Saul et Jónathas fílius ejus?"
  - "6 Et ait adoléscens qui nuntiábat ei: Casu veni in montem Gélboë, et Saul
    incumbébat super hastam suam. Porro currus et équites appropinquábant ei,"
  - "7 et convérsus post tergum suum vidénsque me vocávit; cui cum respondíssem:
    Adsum,"
  - "8 dixit mihi: Quisnam es tu? Et ajo ad eum: Amalecítes ego sum."
  - "9 Et locútus est mihi: Sta super me et intérfice me, quóniam tenent me
    angústiæ, et adhuc tota ánima mea in me est."
  - 10 Stansque super eum, occídi illum, sciébam enim quod vívere non póterat
    post ruínam; et tuli diadéma, quod erat in cápite ejus et armíllam de
    brácchio illíus et áttuli ad te dóminum meum huc.
responsory2:
  - "@Tempora/Pent01-1"
lectio3:
  - "!2 Reg 1:11-15"
  - 11 Apprehéndens autem David, vestiménta sua scidit, omnésque viri, qui erant
    cum eo,
  - 12 et planxérunt, et flevérunt, et jejunavérunt usque ad vésperam super
    Saul, et super Jónathan fílium ejus, et super pópulum Dómini et super domum
    Israël, eo quod corruíssent gládio.
  - "13 Dixítque David ad júvenem qui nuntiáverat ei: Unde es tu? Qui respóndit:
    Fílius hóminis ádvenæ Amalecítæ ego sum."
  - "14 Et ait ad eum David: Quare non timuísti míttere manum tuam, ut occíderes
    christum Dómini?"
  - "15 Vocánsque David unum de púeris suis ait: Accédens írrue in eum. Qui
    percússit illum, et mórtuus est."
responsory3:
  - "@Tempora/Pent01-1"
lectio4:
  - Ex libro Morálium sancti Gregórii Papæ
  - "!Liber 4, Cap. 3 et 4"
  - "Quid est quod David, qui retribuéntibus sibi mala non réddidit, cum Saul et
    Jónathas bello occúmberent, Gélboë móntibus maledíxit, dicens: Montes
    Gélboë, nec ros nec plúvia véniant super vos: neque sint agri primitiárum:
    quia ibi abjéctus est clýpeus fórtius, clýpeus Saul, quasi non esset unctus
    óleo? Quid est quod Jeremías, cum prædicatiónem suam cérneret audiéntium
    difficultáte præpedíri, maledíxit dicens: Maledíctus vir, qui annuntiávit
    patri meo, dicens: Natus est tibi puer másculus?"
responsory4:
  - "@Tempora/Pent01-2:Responsory1"
lectio5:
  - "Quid ergo montes Gélboë, Saul moriénte, deliquérunt, quátenus in eos nec
    ros nec plúvia cáderet et ab omni eos viriditátis gérmine senténtiæ sermo
    siccáret? Sed quia Gélboë interpretátur decúrsus, per Saul autem unctum et
    mórtuum mors nostri mediatóris exprímitur; non immérito per Gélboë montes
    supérba Judæórum corda signántur, quæ dum in hujus mundi desidériis
    défluunt, in Christi, id est, uncti se morte miscuérunt: et quia in eis
    unctus rex corporáliter móritur, ipsi ab omni grátiæ rore siccántur."
responsory5:
  - "@Tempora/Pent01-2:Responsory2"
lectio6:
  - "De quibus et bene dícitur, ut agri primitiárum esse non possint. Supérbæ
    quippe Hebræórum mentes primitívos fructus non ferunt: quia in Redemptóris
    advéntu ex parte máxima in perfídia remanéntes, primórdia fídei sequi
    noluérunt. Sancta namque Ecclésia in primítiis suis multitúdine Géntium
    fœcundáta, vix in mundi fine Judǽos quos invénerit, súscipit, et extréma
    cólligens, eos quasi relíquias frugum ponit."
responsory6:
  - "@Tempora/Pent01-2:Responsory3"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 5:20-24"
  - "In illo témpore: Dixit Jesus discípulis suis: Nisi abundáverit justítia
    vestra plus quam scribárum et pharisæórum, non intrábitis in regnum cælórum.
    Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Liber 1 de Sermóne Dómini in monte, cap. 9"
  - "Justítia pharisæórum est, ut non occídant: justítia eórum, qui intratúri
    sunt in regnum cælórum, ut non irascántur sine causa. Mínimum est ergo, non
    occídere; et qui illud sólverit, mínimus vocábitur in regno cælórum. Qui
    autem illud impléverit, ut non occídat, non contínuo magnus erit, et idóneus
    regno cælórum; sed tamen ascéndit áliquem gradum: perficiétur autem, si nec
    irascátur sine causa; quod si perfécerit, multo remótior erit ab homicídio.
    Quaprópter qui docet ut non irascámur, non solvit legem ne occidámus, et in
    corde, dum non iráscimur, innocéntiam custodiámus."
responsory7:
  - "@Tempora/Pent01-3:Responsory1"
lectio8:
  - "Gradus ítaque sunt in istis peccátis: ut primo quisque irascátur, et eum
    motum retíneat corde concéptum. Jam si extórserit vocem indignántis ipsa
    commótio, non significántem áliquid, sed illum ánimi motum ipsa eruptióne
    testántem, qua feriátur ille, cui iráscitur; plus est útique, quam si
    surgens ira siléntio premerétur. Si vero non solum vox indignántis audiátur,
    sed étiam verbum, quo jam certam ejus vituperatiónem, in quem profértur,
    desígnet et notet; quis dúbitet, ámplius hoc esse, quam si solus
    indignatiónis sonus ederétur?"
responsory8:
  - "@Tempora/Pent01-0:Responsory8"
lectio9:
  - "Vide nunc étiam tres reátus, judícii, concílii, et gehénnæ ignis. Nam in
    judício adhuc defensióni datur locus. In concílio autem, quamquam et
    judícium esse sóleat, tamen quia interésse áliquid hoc loco fatéri cogit
    ipsa distínctio, vidétur ad concílium pertinére senténtiæ prolátio; quando
    non jam cum ipso reo ágitur, utrum damnándus sit; sed inter se, qui
    júdicant, cónferunt quo supplício damnári opórteat, quem constat esse
    damnándum. Gehénna vero ignis, nec damnatiónem habet dúbiam, sicut judícium,
    nec damnáti pœnam, sicut concílium: in gehénna quippe ignis, certa est
    damnátio, et pœna damnáti."
  - "&teDeum"
ant-2:
  - "Audístis * quia dictum est antíquis: Non occídes; qui autem occíderit, reus
    erit judício."
rubrica-cisterciensis/ant-2:
  - Nisi abundáverit * justítia vestra plus quam Scribárum, et Pharisæórum, non
    intrábitis in regnum cœlórum.
ant-3:
  - Si offers * munus tuum ad altáre et recordátus fúeris quia frater tuus habet
    áliquid advérsus te, relínque ibi munus tuum ante altáre, et vade prius
    reconciliári fratri tuo, et tunc véniens ófferes munus tuum, allelúja.
