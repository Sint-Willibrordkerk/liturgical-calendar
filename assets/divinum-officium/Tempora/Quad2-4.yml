introitus:
  - "!Ps 69:2; 69:3"
  - "v. Deus, in adjutórium meum inténde: Dómine, ad adjuvándum me festína:
    confundántur et revereántur inimíci mei, qui quærunt ánimam meam."
  - "!Ps 69:4"
  - "Avertántur retrórsum et erubéscant: qui cógitant mihi mala."
  - "&Gloria"
  - "v. Deus, in adjutórium meum inténde: Dómine, ad adjuvándum me festína:
    confundántur et revereántur inimíci mei, qui quærunt ánimam meam."
oratio:
  - "Præsta nobis, quǽsumus, Dómine, auxílium grátiæ tuæ: ut, jejúniis et
    oratiónibus conveniénter inténti, liberémur ab hóstibus mentis et córporis."
  - $Per Dominum
lectio:
  - Léctio Jeremíæ Prophétæ.
  - "!Jer 17:5-10"
  - "Hæc dicit Dóminus Deus: Maledíctus homo, qui confídit in hómine, et ponit
    carnem bráchium suum, et a Dómino recédit cor ejus. Erit enim quasi myrícæ
    in desérto, et non vidébit, cum vénerit bonum: sed habitábit in siccitáte in
    desérto, in terra salsúginis et inhabitábili. Benedíctus vir, qui confídit
    in Dómino, et erit Dóminus fidúcia ejus. Et erit quasi lignum, quod
    transplantátur super aquas, quod ad humórem mittit radíces suas: et non
    timébit, cum vénerit æstus. Et erit fólium ejus víride, et in témpore
    siccitátis non erit sollícitum, nec aliquándo désinet fácere fructum. Pravum
    est cor ómnium et inscrutábile: quis cognóscet illud? Ego Dóminus scrutans
    cor, et probans renes: qui do unicuíque juxta viam suam, et juxta fructum
    adinventiónum suárum: dicit Dóminus omnípotens."
graduale:
  - "!Ps 78:9; 78:10"
  - "Propítius esto, Dómine, peccátis nostris: ne quando dicant gentes: Ubi est
    Deus eórum?"
  - "V. Adjuva nos, Deus, salutáris noster: et propter honórem nóminis tui,
    Dómine, líbera nos."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam.
  - "!Luc 16:19-31"
  - "In illo témpore: Dixit Jesus pharisǽis: Homo quidam erat dives, qui
    induebátur púrpura et bysso: et epulabátur cotídie spléndide. Et erat quidam
    mendícus, nómine Lázarus, qui jacébat ad jánuam ejus, ulcéribus plenus,
    cúpiens saturári de micis, quæ cadébant de mensa dívitis, et nemo illi
    dabat: sed et canes veniébant et lingébant úlcera ejus. Factum est autem, ut
    morerétur mendícus, et portarétur ab Angelis in sinum Abrahæ. Mórtuus est
    autem et dives, et sepúltus est in inférno. Elevans autem óculos suos, cum
    esset in torméntis, vidit Abraham a longe, et Lázarum in sinu ejus: et ipse
    clamans, dixit: Pater Abraham, miserére mei, et mitte Lázarum, ut intíngat
    extrémum dígiti sui in aquam, ut refrígeret linguam meam, quia crúcior in
    hac flamma. Et dixit illi Abraham: Fili, recordáre, quia recepísti bona in
    vita tua, et Lázarus simíliter mala: nunc autem hic consolátur, tu vero
    cruciáris. Et in his ómnibus, inter nos et vos chaos magnum firmátum est: ut
    hi, qui volunt hinc transíre ad vos, non possint, neque inde huc transmeáre.
    Et ait: Rogo ergo te, pater, ut mittas eum in domum patris mei. Hábeo enim
    quinque fratres, ut testétur illis, ne et ipsi véniant in hunc locum
    tormentórum. Et ait illi Abraham: Habent Móysen et Prophétas: áudiant illos.
    At ille dixit: Non, pater Abraham: sed si quis ex mórtuis íerit ad eos,
    pæniténtiam agent. Ait autem illi: Si Móysen et Prophétas non áudiunt, neque
    si quis ex mórtuis resurréxerit, credent."
offertorium:
  - "!Exod 32:11; 32:13; 32:14"
  - "Precátus est Móyses in conspéctu Dómini, Dei sui, et dixit: Quare, Dómine,
    irásceris in pópulo tuo? parce iræ ánimæ tuæ: meménto Abraham, Isaac et
    Jacob, quibus jurásti dare terram fluéntem lac et mel. Et placátus est
    Dóminus de malignitáte, quam dixit fácere pópulo suo."
secreta:
  - "Præsénti sacrifício, nómini tuo nos, Dómine, jejúnia dicáta sanctíficent:
    ut, quod observántia nostra profitétur extérius, intérius operétur efféctu."
  - $Per Dominum
communio:
  - "@Tempora/Pent09-0"
postcommunio:
  - "Grátia tua nos, quǽsumus, Dómine, non derelínquat: quæ et sacræ nos déditos
    fáciat servitúti, et tuam nobis opem semper acquírat."
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Adésto, Dómine, fámulis tuis, et perpétuam benignitátem largíre
    poscéntibus: ut iis, qui te auctóre et gubernatóre gloriántur, et congregáta
    restáures et restauráta consérves."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 16:19-31"
  - "In illo témpore: Dixit Jesus pharisǽis: Homo quidam erat dives, qui
    induebátur púrpura et bysso: et epulabátur cotídie spléndide. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 40 in Evangelia"
  - "Quem, fratres caríssimi, quem dives iste, qui induebátur púrpura et bysso,
    et epulabátur cotídie spléndide, nisi Judáicum pópulum signat: qui cultum
    vitæ extérius hábuit, qui accéptæ legis delíciis ad nitórem usus est, non ad
    utilitátem? Quem vero Lázarus ulcéribus plenus, nisi gentílem pópulum
    figuráliter éxprimit? Qui dum convérsus ad Deum peccáta confitéri sua non
    erúbuit, huic vulnus in cute fuit. In cutis quippe vúlnere virus a
    viscéribus tráhitur, et foras erúmpit."
responsory1:
  - "@Tempora/Quad2-0:Responsory1"
lectio2:
  - "Quid est ergo peccatórum conféssio, nisi quædam vúlnerum rúptio? Quia
    peccáti virus salúbriter aperítur in confessióne, quod pestífere latébat in
    mente. Vúlnera étenim cutis in superfíciem trahunt humórem putrédinis. Et
    confiténdo peccáta, quid áliud ágimus, nisi malum, quod in nobis latébat,
    aperímus? Sed Lázarus vulnerátus cupiébat saturári de micis, quæ cadébant de
    mensa dívitis, et nemo illi dabat: quia gentílium quemque ad cognitiónem
    legis admíttere supérbus ille pópulus despiciébat."
responsory2:
  - "@Tempora/Quad2-0:Responsory2"
lectio3:
  - "Qui dum doctrínam legis non ad caritátem hábuit, sed ad elatiónem, quasi de
    accéptis ópibus túmuit: et quia ei verba defluébant de sciéntia, quasi micæ
    cadébant de mensa. At contra, jacéntis páuperis vúlnera lingébant canes.
    Nonnúnquam solent in sacro elóquio, per canes prædicatóres intéllegi. Canum
    étenim lingua, vulnus dum lingit, curat: quia et doctóres sancti, dum in
    confessióne peccáti nostri nos ínstruunt, quasi vulnus mentis per linguam
    tangunt."
responsory3:
  - "@Tempora/Quad2-0:Responsory3"
