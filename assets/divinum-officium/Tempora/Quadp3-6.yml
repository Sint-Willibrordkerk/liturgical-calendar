oratio:
  - "Adésto, Dómine, supplicatiónibus nostris: et concéde; ut hoc sollémne
    jejúnium, quod animábus corporibúsque curándis salúbriter institútum est,
    devóto servítio celebrémus."
  - $Per Dominum
lectio:
  - Léctio Isaíæ Prophétæ.
  - "!Isa 58:9-14"
  - "Hæc dicit Dóminus Deus: Si abstúleris de médio tui caténam, et desíeris
    exténdere dígitum, et loqui quod non prodest. Cum effúderis esuriénti ánimam
    tuam, et ánimam afflíctam repléveris, oriétur in ténebris lux tua, et
    ténebræ tuæ erunt sicut merídies. Et réquiem tibi dabit Dóminus semper, et
    implébit splendóribus ánimam tuam, et ossa tua liberábit, et eris quasi
    hortus irríguus, et sicut fons aquárum, cujus non defícient aquæ. Et
    ædificabúntur in te desérta sæculórum: fundaménta generatiónis et
    generatiónis suscitábis: et vocáberis ædificátor sépium, avértens sémitas in
    quiétem. Si avérteris a sábbato pedem tuum, fácere voluntátem tuam in die
    sancto meo, et vocáveris sábbatum delicátum, et sanctum Dómini gloriósum, et
    glorificáveris eum, dum non facis vias tuas, et non invénitur volúntas tua,
    ut loquáris sermónem: tunc delectáberis super Dómino: et sustóllam te super
    altitúdines terræ, et cibábo te hereditáte Jacob, patris tui. Os enim Dómini
    locútum est."
graduale:
  - "!Ps 26:4"
  - Unam pétii a Dómino, hanc requíram, ut inhábitem in domo Dómini,
  - V. Ut vídeam voluptátem Dómini, et prótegar a templo sancto ejus.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Marcum.
  - "!Marc 6:47-56"
  - "In illo témpore: Cum sero esset, erat navis in médio mari, et Jesus solus
    in terra. Et videns discípulos suos laborántes in remigándo - erat enim
    ventus contrárius eis, - et circa quartam vigíliam noctis venit ad eos
    ámbulans supra mare: et volébat præteríre eos. At illi, ut vidérunt eum
    ambulántem supra mare, putavérunt phantásma esse, et exclamavérunt. Omnes
    enim vidérunt eum, et conturbáti sunt. Et statim locútus est cum eis, et
    dixit eis: Confídite, ego sum, nolíte timére. Et ascéndit ad illos in navim,
    et cessávit ventus. Et plus magis intra se stupébant: non enim intellexérunt
    de pánibus: erat enim cor eórum obcæcátum. Et cum transfretássent, venérunt
    in terram Genésareth, et applicuérunt. Cumque egréssi essent de navi,
    contínuo cognovérunt eum: et percurréntes univérsam regiónem illam, cœpérunt
    in grabátis eos, qui se male habébant, circumférre ubi audiébant eum esse.
    Et quocúmque introíbat, in vicos vel in villas aut civitátes, in platéis
    ponébant infírmos, et deprecabántur eum, ut vel fímbriam vestiménti ejus
    tángerent: et quotquot tangébant eum, salvi fiébant."
offertorium:
  - "@Tempora/Quadp3-5:Offertorium"
secreta:
  - "Súscipe, Dómine, sacrifícium, cujus te voluísti dignánter immolatióne
    placári: præsta, quǽsumus; ut, hujus operatióne mundáti, beneplácitum tibi
    nostræ mentis offerámus afféctum."
  - $Per Dominum
communio:
  - "@Tempora/Quadp3-5:Communio"
postcommunio:
  - "Cœléstis vitæ múnere vegetáti, quǽsumus, Dómine: ut, quod est nobis in
    præsénti vita mystérium, fiat æternitátis auxílium."
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Fidéles tui, Deus, per tua dona firméntur: ut éadem et percipiéndo
    requírant, et quæréndo sine fine percípiant."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Marcum
  - "!Marc 6:47-56"
  - "In illo témpore: Cum sero esset, erat navis in médio mari, et Jesus solus
    in terra. Et réliqua."
  - _
  - Homilía sancti venerábilis Bedæ Presbýteri
  - "!Lib. 2, cap. 28 in cap. 6 Marci, tom. 4"
  - "Labor discipulórum in remigándo, et contrárius eis ventus, labóres sanctæ
    Ecclésiæ varios desígnat: quæ inter undas sǽculi adversántis, et immundórum
    flatus spirítuum, ad quiétem pátriæ cæléstis, quasi ad fidam líttoris
    statiónem, perveníre conátur. Ubi bene dícitur, quia navis erat in médio
    mari, et ipse solus in terra: quia nonnúnquam Ecclésia tantis gentílium
    pressúris non solum afflícta, sed et fœdáta est, ut, si fíeri posset,
    Redémptor ipsíus eam prorsus deseruísse ad tempus viderétur."
responsory1:
  - "@Tempora/Quadp3-0:Responsory7"
lectio2:
  - "Unde est illa vox ejus inter undas procellásque tentatiónum irruéntium
    deprehénsæ, atque auxílium protectiónis illíus gemebúndo clamóre quæréntis:
    Ut quid, Dómine, recessísti longe, déspicis in opportunitátibus, in
    tribulatióne? Quæ páriter vocem inimíci persequéntibus expónit, in
    sequéntibus Psalmi subíciens: Dixit enim in corde suo: Oblítus est Deus,
    avértit fáciem suam, ne vídeat usque in finem."
responsory2:
  - "@Tempora/Quadp3-0:Responsory8"
lectio3:
  - "Verum ille non oblivíscitur oratiónem páuperum, neque avértit fáciem suam a
    sperántibus in se: quin pótius et certántes cum hóstibus, ut vincant,
    ádjuvat, et victóres in ætérnum corónat. Unde hic quoque apérte dícitur,
    quia vidit eos laborántes in remigándo. Videt quippe Dóminus laborántes in
    mari, quamvis ipse pósitus in terra: quia etsi ad horam différre videátur
    auxílium tribulátis impéndere, nihilóminus eos, ne in tribulatiónibus
    defíciant, suæ respéctu pietátis corróborat: et aliquándo étiam manifésto
    adjutório, victis adversitátibus, quasi calcátis sedatísque flúctuum
    volumínibus líberat."
responsory3:
  - "@Tempora/Quadp3-1:Responsory1"
