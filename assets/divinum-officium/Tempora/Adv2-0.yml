rubrica-tridentina/ant-vespera: []
ant-1:
  - Veni, Dómine, * visitáre nos in pace, ut lætémur coram te corde perfécto.
rubrica-cisterciensis/ant-1:
  - Sion, noli timére, * ecce Deus tuus véniet, allelúja.
lectio1:
  - De Isaía Prophéta
  - "!Isa 11:1-4"
  - 1 Et egrediétur virga de radíce Jesse, et flos de radíce ejus ascéndet.
  - "2 Et requiéscet super eum Spíritus Dómini: spíritus sapiéntiæ et
    intelléctus, spíritus consílii et fortitúdinis, spíritus sciéntiæ et
    pietátis;"
  - "3 Et replébit eum spíritus timóris Dómini: non secúndum visiónem oculórum
    judicábit, neque secúndum audítum áurium árguet:"
  - "4 Sed judicábit in justítia páuperes, et árguet in æquitáte pro mansuétis
    terræ:"
responsory1:
  - "R. Jerúsalem, cito véniet salus tua: Quare mœróre consúmeris? numquid
    consiliárius non est tibi, quia innovávit te dolor?"
  - "* Salvábo te, et liberábo te, noli timére."
  - V. Ego enim sum Dóminus, Deus tuus, Sanctus Israël, Redémptor tuus.
  - R. Salvábo te, et liberábo te, noli timére.
lectio2:
  - "!Isa 11:4-7"
  - 4 Et percútiet terram virga oris sui, et spíritu labiórum suórum interfíciet
    ímpium.
  - "5 Et erit justítia cíngulum lumbórum ejus: et fides cinctórium renis ejus."
  - 6 Habitábit lupus cum agno, et pardus cum hædo accubábit, vitúlus et leo et
    ovis simul morabúntur, et puer párvulus minábit eos.
  - 7 Vítulus et ursus pascéntur, simul requiéscent cátuli eórum, et leo quasi
    bos cómedet páleas.
responsory2:
  - "R. Ecce Dóminus véniet, et omnes Sancti ejus cum eo, et erit in die illa
    lux magna: et exíbunt de Jerúsalem sicut aqua munda: et regnábit Dóminus in
    ætérnum"
  - "* Super omnes gentes."
  - "V. Ecce Dóminus cum virtúte véniet: et regnum in manu ejus, et potéstas, et
    impérium."
  - R. Super omnes gentes.
lectio3:
  - "!Isa 11:8-10"
  - 8 Et delectábitur infans ab úbere super forámine áspidis, et in cavérna
    réguli, qui ablactátus fúerit, manum suam mittet.
  - "9 Non nocébunt, et non occídent in univérso monte sancto meo: quia repléta
    est terra sciéntia Dómini, sicut aquæ maris operiéntes."
  - 10 In die illa radix Jesse, qui stat in signum populórum, ipsum gentes
    deprecabúntur, et erit sepúlcrum ejus gloriósum.
responsory3:
  - "R. Cívitas Jerúsalem, noli flere: quóniam dóluit Dóminus super te:"
  - "* Et áuferet a te omnem tribulatiónem."
  - "V. Ecce Dóminus in fortitúdine véniet: et brácchium ejus dominábitur."
  - R. Et áuferet a te omnem tribulatiónem.
  - "&Gloria"
  - R. Et áuferet a te omnem tribulatiónem.
lectio4:
  - De Expositióne sancti Hierónymi Presbýteri in Isaíam Prophétam
  - "!Liber 4. in cap. 11 Isaíæ."
  - "Et egrediétur virga de radíce Jesse. Usque ad principium visiónis, vel
    pónderis Babylónis, quod vidit Isaías, fílius Amos, omnis hæc prophetía de
    Christo est: quam per partes vólumus explanare, ne simul propósita atque
    disserta lectóris confundat memóriam. Virgam et florem de radíce Jesse ipsum
    Dóminum Judæi interpretántur: quod scilicet in virga regnántis poténtia, in
    flore pulchritúdo monstrétur."
responsory4:
  - R. Ecce véniet Dóminus, protéctor noster, Sanctus Israël,
  - "* Corónam regni habens in cápite suo."
  - V. Et dominábitur a mari usque ad mare, et a flúmine usque ad términos orbis
    terrárum.
  - R. Corónam regni habens in cápite suo.
lectio5:
  - "Nos autem virgam de radíce Jesse sanctam Mariam Vírginem intelligámus, quæ
    nullum hábuit sibi frúticem cohæréntem, de qua et supra légimus: Ecce virgo
    concípiet et pariet fílium. Et florem, Dóminum Salvatórem, qui dicit in
    Cántico canticórum: Ego flos campi, et lílium convallium."
responsory5:
  - "R. Sicut mater consolátur fílios suos, ita consolábor vos, dicit Dóminus:
    et de Jerúsalem civitáte quam elégi, véniet vobis auxílium:"
  - "* Et vidébitis et gaudébit cor vestrum."
  - V. Dabo in Sion salútem, et in Jerúsalem glóriam meam.
  - R. Et vidébitis et gaudébit cor vestrum.
lectio6:
  - "Super hunc ígitur florem, qui de trunco et radíce Jesse per Mariam Vírginem
    repénte consúrget, requiéscet Spíritus Dómini: quia in ipso complácuit omnem
    plenitúdinem divinitátis habitáre corporáliter: nequaquam per partes, ut in
    ceteris Sanctis: sed juxta Evangélium eórum, quod Hebræo sermóne conscríptum
    legunt Nazaræi: Descéndet super eum omnis fons Spíritus Sancti. Dóminus
    autem Spíritus est: et ubi Spíritus Dómini, ibi libertas."
responsory6:
  - "R. Jerúsalem, plantábis víneam in móntibus tuis: exsultábis, quóniam dies
    Dómini véniet: surge, Sion, convértere ad Dóminum Deum tuum: gaude et
    lætáre, Jacob:"
  - "* Quia de médio géntium Salvátor tuus véniet."
  - "V. Exsúlta satis, fília Sion: júbila, fília Jerúsalem."
  - R. Quia de médio géntium Salvátor tuus véniet.
  - "&Gloria"
  - R. Quia de médio géntium Salvátor tuus véniet.
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 11:2-10"
  - "In illo témpore: Cum audísset Joánnes in vínculis ópera Christi, mittens
    duos de discípulis suis, ait illi: Tu es qui ventúrus es, an álium
    exspectámus? Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 6 in Evangelia, post initium"
  - "Visis tot signis tantísque virtútibus, non scandalizári quisque pótuit, sed
    admirári. Sed infidélium mens grave in illo scándalum pértulit, cum eum post
    tot mirácula moriéntem vidit. Unde et Paulus dicit: Nos autem prædicámus
    Christum crucifíxum, Judǽis quidem scándalum, géntibus autem stultítiam.
    Stultum quippe homínibus visum est, ut pro homínibus Auctor vitæ morerétur:
    et inde contra eum homo scándalum sumpsit, unde ei ámplius débitor fíeri
    débuit. Nam tanto Deus ab homínibus dígnius honorándus est, quanto pro
    homínibus et indígna suscépit."
responsory7:
  - "R. Egrediétur Dóminus de Samaría ad portam, quæ réspicit ad Oriéntem: et
    véniet in Béthlehem ámbulans super aquas redemptiónis Judæ:"
  - "* Tunc salvus erit omnis homo: quia ecce véniet."
  - V. Et præparábitur in misericórdia sólium ejus, et sedébit super illud in
    veritáte.
  - "R. Tunc salvus erit omnis homo: quia ecce véniet."
lectio8:
  - "Quid est ergo dicere: Beátus qui non fúerit scandalizátus in me; nisi
    apérta voce abjectiónem mortis suæ humilitátemque signare? Ac si patenter
    dicat: Mira quidem facio, sed abjecta pérpeti non dedignor. Quia ergo
    moriéndo te súbsequor, cavéndum valde est homínibus, ne in me mortem
    despíciant, qui signa venerántur."
responsory8:
  - "R. Festína, ne tardáveris, Dómine:"
  - "* Et líbera pópulum tuum."
  - "V. Veni, Dómine, et noli tardáre: reláxa facínora plebi tuæ."
  - R. Et líbera pópulum tuum.
lectio9:
  - "Sed dimissis Joánnis discípulis, quid de eodem Joánne turbis dicat,
    audiámus: Quid exístis in desértum vidére? Arúndinem vento agitatam? Quod
    videlicet non asseréndo , sed negando intulit. Arúndinem quippe mox ut aura
    contígerit, in partem álteram inflectit. Et quid per arúndinem, nisi
    carnalis animus designátur? Qui mox ut favore vel detractióne tangitur,
    statim in partem quámlibet inclinátur?"
responsory9:
  - R. Ecce Dóminus véniet cum splendóre descéndens, et virtus ejus cum eo,
  - "* Visitáre pópulum suum in pace, et constitúere super eum vitam
    sempitérnam."
  - V. Ecce Dóminus noster cum virtúte véniet.
  - R. Visitáre pópulum suum in pace, et constitúere super eum vitam sempitérnam.
  - "&Gloria"
  - R. Visitáre pópulum suum in pace, et constitúere super eum vitam sempitérnam.
ant-laudes:
  - Ecce in núbibus cæli * Dóminus véniet cum potestáte magna, allelúja.
  - "Urbs fortitúdinis * nostræ Sion, Salvátor ponétur in ea murus et
    antemurále: aperíte portas, quia nobíscum Deus, allelúja."
  - "Ecce apparébit * Dóminus, et non mentiétur: si moram fécerit, exspécta eum,
    quia véniet, et non tardábit, allelúja."
  - "Montes et colles * cantábunt coram Deo laudem, et ómnia ligna silvárum
    plaudent mánibus: quóniam véniet Dominátor Dóminus in regnum ætérnum,
    allelúja, allelúja."
  - Ecce Dóminus * noster cum virtúte véniet, et illuminábit óculos servórum
    suórum, allelúja.
