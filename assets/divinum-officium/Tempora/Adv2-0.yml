introitus:
  - "!Is 30:30"
  - "v. Pópulus Sion, ecce, Dóminus véniet ad salvándas gentes: et audítam
    fáciet Dóminus glóriam vocis suæ in lætítia cordis vestri."
  - "!Ps 79:2"
  - "Qui regis Israël, inténde: qui dedúcis, velut ovem, Joseph."
  - "&Gloria"
  - "v. Pópulus Sion, ecce, Dóminus véniet ad salvándas gentes: et audítam
