oratio:
  - "Excita, Dómine, corda nostra ad præparándas Unigéniti tui vias: ut, per
    ejus advéntum, purificátis tibi méntibus servíre mereámur:"
  - $Qui tecum
lectio:
  - Lectio Epístolæ beáti Pauli Apostoli ad Romános
  - "!Rom 15:4-13."
  - "Fratres: Quæcúmque scripta sunt, ad nostram doctrínam scripta sunt: ut per
    patiéntiam et consolatiónem Scripturárum spem habeámus. Deus autem patiéntiæ
    et solácii det vobis idípsum sápere in altérutrum secúndum Jesum Christum:
    ut unánimes, uno ore honorificétis Deum et Patrem Dómini nostri Jesu
    Christi. Propter quod suscípite ínvicem, sicut et Christus suscépit vos in
    honórem Dei. Dico enim Christum Jesum minístrum fuísse circumcisiónis
    propter veritátem Dei, ad confirmándas promissiónes patrum: gentes autem
    super misericórdia honoráre Deum, sicut scriptum est: Proptérea confitébor
    tibi in géntibus, Dómine, et nómini tuo cantábo. Et íterum dicit: Lætámini,
    gentes, cum plebe ejus. Et iterum: Laudáte, omnes gentes, Dóminum: et
    magnificáte eum, omnes pópuli. Et rursus Isaías ait: Erit radix Jesse, et
    qui exsúrget régere gentes, in eum gentes sperábunt. Deus autem spei répleat
    vos omni gáudio et pace in credéndo: ut abundétis in spe et virtúte Spíritus
    Sancti."
graduale:
  - "!Ps 49:2-3; 49:5"
  - "Ex Sion species decóris ejus: Deus maniféste véniet,"
  - V. Congregáte illi sanctos ejus, qui ordinavérunt testaméntum ejus super
    sacrifícia. Allelúja, allelúja,
  - "!Ps 121:1"
  - "V. Lætátus sum in his, quæ dicta sunt mihi: in domum Dómini íbimus.
    Allelúja."
gradualef:
  - "!Ps 49:2-3; 49:5"
