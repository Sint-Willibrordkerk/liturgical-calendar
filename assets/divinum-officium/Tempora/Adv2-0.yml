evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 11:2-10"
  - "In illo tempore: Cum audísset Joánnes in vínculis ópera Christi, mittens
    duos de discípulis suis, ait illi: Tu es, qui ventúrus es, an alium
    exspectámus? Et respóndens Jesus, ait illis: Eúntes renuntiáte Joánni, quæ
    audístis et vidístis. Cæci vident, claudi ámbulant, leprósi mundántur, surdi
    áudiunt, mórtui resúrgunt, páuperes evangelizántur: et beátus est, qui non
    fúerit scandalizátus in me. Illis autem abeúntibus, cœpit Jesus dícere ad
    turbas de Joánne: Quid exístis in desértum vidére? arúndinem vento agitátam?
    Sed quid exístis vidére? hóminem móllibus vestitum? Ecce, qui móllibus
    vestiúntur, in dómibus regum sunt. Sed quid exístis vidére? Prophétam? Etiam
    dico vobis, et plus quam Prophétam. Hic est enim, de quo scriptum est: Ecce,
    ego mitto Angelum meum ante fáciem tuam, qui præparábit viam tuam ante te."
offertorium:
  - "!Ps 84:7-8"
  - "Deus, tu convérsus vivificábis nos, et plebs tua lætábitur in te: osténde
    nobis, Dómine, misericórdiam tuam, et salutáre tuum da nobis."
secreta:
  - "Placáre, quǽsumus, Dómine, humilitátis nostræ précibus et hóstiis: et, ubi
    nulla suppétunt suffrágia meritórum, tuis nobis succúrre præsídiis."
  - $Per Dominum
communio:
  - "!Bar 5:5; 4:36"
  - Jerúsalem, surge et sta in excélso, et vide jucunditátem, quæ véniet tibi a
    Deo tuo.
postcommunio:
  - "Repléti cibo spirituális alimóniæ, súpplices te, Dómine, deprecámur: ut,
    hujus participatióne mystérii, dóceas nos terréna despícere et amáre
    cœléstia."
  - $Per Dominum
