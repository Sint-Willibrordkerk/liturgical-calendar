introitus:
  - "!Sap 11:24 11:25; 11:27"
  - "v. Miseréris ómnium, Dómine, et nihil odísti eórum quæ fecísti, dissímulans
    peccáta hóminum propter pæniténtiam et parcens illis: quia tu es Dóminus,
    Deus noster"
  - "!Ps 56:2"
  - "Miserére mei, Deus, miserére mei: quóniam in te confídit ánima mea."
  - "&Gloria"
  - "v. Miseréris ómnium, Dómine, et nihil odísti eórum quæ fecísti, dissímulans
    peccáta hóminum propter pæniténtiam et parcens illis: quia tu es Dóminus,
    Deus noster"
oratio:
  - "Præsta, Dómine, fidélibus tuis: ut jejuniórum veneránda sollémnia, et
    cóngrua pietáte suscípiant, et secúra devotióne percúrrant."
  - $Per Dominum
lectio:
  - Léctio Joélis Prophétæ
  - "!Joël 2:12-19"
  - "Hæc dicit Dóminus: Convertímini ad me in toto corde vestro, in jejúnio, et
    in fletu, et in planctu. Et scíndite corda vestra, et non vestiménta vestra,
    et convertímini ad Dóminum, Deum vestrum: quia benígnus et miséricors est,
    pátiens, et multæ misericórdiæ, et præstábilis super malítia. Quis scit, si
    convertátur, et ignóscat, et relínquat post se benedictiónem, sacrifícium et
    libámen Dómino, Deo vestro? Cánite tuba in Sion, sanctificáte jejúnium,
    vocáte coetum, congregáte pópulum, sanctificáte ecclésiam, coadunáte senes,
    congregáte parvulos et sugéntes úbera: egrediátur sponsus de cubíli suo, et
    sponsa de thálamo suo. Inter vestíbulum et altare plorábunt sacerdótes
    minístri Dómini, et dicent: Parce, Dómine, parce pópulo tuo: et ne des
    hereditátem tuam in oppróbrium, ut dominéntur eis natiónes. Quare dicunt in
    pópulis: Ubi est Deus eórum? Zelátus est Dóminus terram suam, et pepércit
    pópulo suo. Et respóndit Dóminus, et dixit populo suo: Ecce, ego mittam
    vobis fruméntum et vinum et óleum, et replebímini eis: et non dabo vos ultra
    oppróbrium in géntibus: dicit Dóminus omnípotens."
graduale:
  - "!Ps 56:2; 56:4"
  - "Miserére mei, Deus, miserére mei: quóniam in te confídit ánima mea."
  - V. Misit de coelo, et liberávit me, dedit in oppróbrium conculcántes me.
  - _
  - "!Tractus"
  - "!Ps 102:10"
  - "Dómine, non secúndum peccáta nostra, quæ fécimus nos: neque secúndum
    iniquitátes nostras retríbuas nobis."
  - "!Ps 78:8-9"
  - "Dómine, ne memíneris iniquitátum nostrarum antiquarum: cito antícipent nos
    misericórdiæ tuæ, quia páuperes facti sumus nimis. (Hic genuflectitur)"
  - "V. Adjuva nos, Deus, salutáris noster: et propter glóriam nóminis tui,
    Dómine, libera nos: et propítius esto peccátis nostris, propter nomen tuum."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum.
  - "!Matt 6:16-21"
  - "In illo témpore: Dixit Jesus discípulis suis: Cum jejunátis, nolíte fíeri,
    sicut hypócritæ, tristes. Extérminant enim fácies suas, ut appáreant
    homínibus jejunántes. Amen, dico vobis, quia recepérunt mercédem suam. Tu
    autem, cum jejúnas, unge caput tuum, et fáciem tuam lava, ne videáris
    homínibus jejúnans, sed Patri tuo, qui est in abscóndito: et Pater tuus, qui
    videt in abscóndito, reddet tibi. Nolíte thesaurizáre vobis thesáuros in
    terra: ubi ærúgo et tínea demolítur: et ubi fures effódiunt et furántur.
    Thesaurizáte autem vobis thesáuros in coelo: ubi neque ærúgo neque tínea
    demolítur; et ubi fures non effódiunt nec furántur. Ubi enim est thesáurus
    tuus, ibi est et cor tuum."
offertorium:
  - "!Ps 29:2-3"
  - "Exaltábo te, Dómine, quóniam suscepísti me, nec delectásti inimícos meos
    super me: Dómine, clamávi ad te, et sanásti me."
secreta:
  - "Fac nos, quǽsumus, Dómine, his munéribus offeréndis conveniénter aptári:
    quibus ipsíus venerábilis sacraménti celebrámus exórdium."
  - $Per Dominum
communio:
  - "!Ps 1:2 et 3."
  - Qui meditábitur in lege Dómini die ac nocte, dabit fructum suum in témpore
    suo.
postcommunio:
  - "Percépta nobis, Dómine, prǽbeant sacraménta subsídium: ut tibi grata sint
    nostra jejúnia, et nobis profíciant ad medélam."
  - $Per Dominum
super-populum:
  - "!Deinde Sacerdos absolute dicit:"
  - "!Oratio super populum"
  - v. Orémus.
  - "!Et Diaconus, si in officio Diaconatus serviat versus ad populum, junctis
    manibus, dicit. Alioquin ipse Sacerdos, stans in eodem loco ante librum, et
    non vertens se ad populum."
  - v. Humiliáte cápita vestra Deo.
  - _
  - "v. Inclinántes se, Dómine, majestáti tuæ, propitiátus inténde: ut, qui
    divíno múnere sunt refécti, coeléstibus semper nutriántur auxíliis."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 6:16-21"
  - "In illo témpore: Dixit Jesus discípulis suis: Cum jejunátis, nolíte fíeri
    sicut hypócritæ, tristes. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Lib. 2 de Serm. Domini in monte, cap. 12 tom. 4"
  - "Maniféstum est, his præcéptis omnem nostram intentiónem in interióra gáudia
    dírigi: ne foris quæréntes mercédem, huic sǽculo conformémur, et amittámus
    promissiónem tanto solidióris atque firmióris, quanto interióris
    beatitúdinis, qua nos elégit Deus confórmes fíeri imáginis Fílii sui. In hoc
    autem capítulo máxime adverténdum est, non in solo rerum corporeárum nitóre
    atque pompa, sed étiam in ipsis sórdibus luctuósis esse posse jactántiam et
    eo periculosiórem, quo sub nómine servitútis Dei décipit."
responsory1:
  - "@Tempora/Quadp3-0:Responsory7"
lectio2:
  - "Qui ergo immoderáto cultu córporis atque vestítu, vel ceterárum rerum
    nitóre præfúlget, fácile convíncitur rebus ipsis, pompárum sǽculi esse
    sectátor, nec quemquam fallit dolósa imágine sanctitátis. Qui autem in
    professióne christianitátis, inusitáto squalóre ac sórdibus inténtos in se
    óculos hóminum facit, cum id voluntáte fáciat, non necessitáte patiátur: ex
    céteris ejus opéribus potest cónici, utrum hoc contémptu supérflui cultus,
    an ambitióne áliqua fáciat: quia et sub ovína pelle cavéndos lupos Dóminus
    præcépit: Sed ex frúctibus, inquit, eórum cognoscétis eos."
responsory2:
  - "@Tempora/Quadp3-0:Responsory8"
lectio3:
  - "Cum enim cœ́perint alíquibus tentatiónibus ea ipsa scílicet illis súbtrahi,
    vel negári, quæ isto velámine vel consecúti sunt, vel cónsequi cúpiunt: tunc
    necésse est ut appáreat, utrum lupus in ovína pelle sit, an ovis in sua. Non
    tamen proptérea ornátu supérfluo debet aspéctus hóminum mulcére Christiánus,
    quia illum parcum hábitum ac necessárium étiam simulatóres sǽpius usúrpant,
    ut incáutos decípiant: quia et illæ oves non debent pelles suas depónere, si
    aliquándo eis lupi se cóntegant."
responsory3:
  - "@Tempora/Quadp3-1:Responsory1"
rubrica-monastica/responsory3:
  - "@Tempora/Quadp3-1:Responsory2"
versum-0:
  - "@Psalterium/Special/Preces:Preces feriales Laudes:5-6"
ant-2:
  - Cum jejunátis, * nolíte fíeri sicut hypócritæ, tristes.
oratio-2:
  - "Præsta, Dómine, fidélibus tuis: ut jejuniórum veneránda solémnia, et
    cóngrua pietáte suscípiant, et secúra devotióne percúrrant."
  - $Per Dominum
ant-3:
  - Thesaurizáte vobis * thesáuros in cælo, ubi nec ærúgo, nec tínea demolítur.
oratio-3:
  - "Inclinántes se, Dómine, majestáti tuæ, propitiátus inténde: ut, qui divíno
    múnere sunt refécti, cæléstibus semper nutriántur auxíliis."
  - $Per Dominum
