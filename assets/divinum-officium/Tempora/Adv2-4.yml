lectio1:
  - De Isaía Prophéta
  - "!Isa 19:1-2"
  - 1 Onus Ægýpti. Ecce Dóminus ascéndet super nubem levem, et ingrediétur
    Ægýptum, et commovebúntur simulácra Ægýpti a fácie ejus, et cor Ægýpti
    tabéscet in médio ejus.
  - "2 Et concúrrere fáciam Ægýptios advérsus Ægýptios: et pugnábit vir contra
    fratrem suum, et vir contra amícum suum, cívitas advérsus civitátem, regnum
    advérsus regnum."
responsory1:
  - "@Tempora/Adv2-0:Responsory1"
lectio2:
  - "!Isa 19:3-6"
  - "3 Et dirumpétur spíritus Ægýpti in viscéribus ejus, et consílium ejus
    præcipitábo: et interrogábunt simulácra sua, et divínos suos, et pythónes,
    et aríolos."
  - 4 Et tradam Ægýptum in manu dominórum crudélium, et rex fortis dominábitur
    eórum, ait Dóminus Deus exercítuum.
  - 5 Et aréscet aqua de mari, et flúvius desolábitur, atque siccábitur.
  - "6 Et defícient flúmina: attenuabúntur, et siccabúntur rivi ággerum."
responsory2:
  - "@Tempora/Adv2-0:Responsory2"
lectio3:
  - "!Isa 19:11-13"
  - "11 Stulti príncipes Táneos, sapiéntes consiliárii Pharaónis dedérunt
    consílium insípiens. Quómodo dicétis Pharaóni: Fílius sapiéntium ego, fílius
    regum antiquórum?"
  - 12 Ubi nunc sunt sapiéntes tui? annúntient tibi, et índicent quid
    cogitáverit Dóminus exercítuum super Ægýptum.
  - 13 Stulti facti sunt príncipes Táneos, emarcuérunt príncipes Mémpheos,
    decepérunt Ægýptum, ángulum populórum ejus.
responsory3:
  - "@Tempora/Adv2-0:Responsory3"
rubrica-cisterciensis/ant-laudes:
  - "@Tempora/Adv2-0"
ant-2:
  - Tu es qui ventúrus es, * Dómine, quem exspectámus, ut salvum fácias pópulum
    tuum.
ant-3:
  - "Qui post me véniet, * ante me factus est: cujus non sum dignus calceaménta
    sólvere."
