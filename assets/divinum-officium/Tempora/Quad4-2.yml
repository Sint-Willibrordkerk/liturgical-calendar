communio:
  - "!Ps 19:6"
  - "Lætábimur in salutári tuo: et in nómine Dómini, Dei nostri, magnificábimur."
postcommunio:
  - "Hujus nos, Dómine, percéptio sacraménti mundet a crímine: et ad cæléstia
    regna perdúcat."
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Miserére, Dómine, pópulo tuo: et contínuis tribulatiónibus laborántem,
    propítius respiráre concéde."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 7:14-31"
  - "In illo témpore: Jam die festo mediánte, ascéndit Jesus in templum, et
    docébat. Et mirabántur Judǽi. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tract. 29 in Joannem, sub init."
  - "Ille qui latébat, docébat, et palam loquebátur, et non tenebátur. Illud
    enim ut latéret, erat causa exémpli, hoc potestátis. Sed cum docéret,
    mirabántur Judǽi. Omnes quidem, quantum árbitror, mirabántur, sed non omnes
    convertebántur. Et unde admirátio? Quia multi nóverant ubi natus,
    quemádmodum fúerit educátus. Nunquam eum víderant lítteras discéntem:
    audiébant autem de lege disputántem, legis testimónia proferéntem, quæ nemo
    posset proférre, nisi legísset, nemo légeret, nisi lítteras didicísset: et
    ídeo mirabántur. Eórum autem admirátio, magístro facta est insinuándæ áltius
    veritátis occásio."
responsory1:
  - R. Quid me quǽritis interfícere, hóminem qui vera locútus sum vobis?
  - "* Si male locútus sum, testimónium pérhibe de malo: si autem bene, cur me
    cædis?"
  - "V. Multa bona ópera operátus sum vobis: propter quod opus vultis me
    occídere?"
  - "R. Si male locútus sum, testimónium pérhibe de malo: si autem bene, cur me
    cædis?"
lectio2:
  - "Ex eórum quippe admiratióne et verbis, dixit Dóminus profúndum áliquid, et
    diligéntius ínspici et discúti dignum. Quid ergo Dóminus respóndit eis,
    admirántibus quómodo sciret lítteras, quas non didícerat? Mea, inquit,
    doctrína non est mea, sed ejus qui misit me. Hæc est profúnditas prima:
    vidétur enim paucis verbis quasi contrária locútus. Non enim ait: Ista
    doctrína non est mea: sed, Mea doctrína non est mea. Si non tua, quómodo
    tua? si tua, quómodo non tua? Tu enim dicis utrúmque: et mea doctrína, et
    non mea."
responsory2:
  - "R. Addúxi vos per desértum quadragínta annis ego Dóminus, et non sunt
    attríta vestiménta vestra:"
  - "* Manna de cælo plui vobis, et oblíti estis me, dicit Dóminus."
  - V. Ego addúxi vos de terra Ægýpti, et de domo servitútis liberávi vos.
  - R. Manna de cælo plui vobis, et oblíti estis me, dicit Dóminus.
lectio3:
  - "Si ergo intueámur diligénter quod ipse in exórdio dicit sanctus
    Evangelísta: In princípio erat Verbum, et Verbum erat apud Deum, et Deus
    erat Verbum: inde pendet hujus solútio quæstiónis. Quæ est doctrína Patris,
    nisi Verbum Patris? Ipse ergo Christus doctrína Patris, si Verbum Patris.
    Sed quia Verbum, non potest esse nullíus, sed alicújus: et suam doctrínam
    dixit seípsum, et non suam, quia Patris est Verbum. Quid enim tam tuum quam
    tu? Et quid tam non tuum quam tu, si alicújus est, quod es?"
