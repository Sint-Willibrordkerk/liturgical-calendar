  - "!Ps 54:3-4"
  - "Contristátus sum in exercitatióne mea: et conturbátus sum a voce inimíci et
    a tribulatióne peccatóris."
  - "&Gloria"
  - "v. Exáudi, Deus, oratiónem meam, et ne despéxeris deprecatiónem meam:
