lectio1:
  - De Epístola ad Romános
  - "!Rom 2:1-4"
  - "1 Propter quod inexcusábilis es, o homo omnis qui júdicas. In quo enim
    júdicas álterum, teípsum condémnas: éadem enim agis quæ júdicas."
  - 2 Scimus enim quóniam judícium Dei est secúndum veritátem in eos qui tália
    agunt.
  - 3 Exístimas autem hoc, o homo, qui júdicas eos qui tália agunt, et facis ea,
    quia tu effúgies judícium Dei?
  - 4 an divítias bonitátis ejus, et patiéntiæ, et longanimitátis contémnis?
    Ignóras quóniam benígnitas Dei ad pœniténtiam te addúcit?
responsory1:
  - "@Sancti/12-25:Responsory2"
lectio2:
  - "!Rom 2:5-8"
  - 5 Secúndum autem durítiam tuam, et impǽnitens cor, thesaurízas tibi iram in
    die iræ, et revelatiónis justi judícii Dei,
  - "6 qui reddet unicuíque secúndum ópera ejus:"
  - "7 iis quidem qui secúndum patiéntiam boni óperis, glóriam, et honórem, et
    incorruptiónem quærunt, vitam ætérnam:"
  - 8 iis autem qui sunt ex contentióne, et qui non acquiéscunt veritáti,
    credunt autem iniquitáti, ira et indignátio.
responsory2:
  - "@Sancti/12-25:Responsory3"
lectio3:
  - "!Rom 2:9-13"
  - "9 Tribulátio et angústia in omnem ánimam hóminis operántis malum, Judǽi
    primum, et Græci:"
  - "10 glória autem, et honor, et pax omni operánti bonum, Judǽo primum, et
    Græco:"
  - 11 non enim est accéptio personárum apud Deum.
  - "12 Quicúmque enim sine lege peccavérunt, sine lege períbunt: et quicúmque
    in lege peccavérunt, per legem judicabúntur."
  - 13 Non enim auditóres legis justi sunt apud Deum, sed factóres legis
    justificabúntur.
responsory3:
  - "@Sancti/12-25:Responsory4"
lectio4:
  - Sermo sancti Leónis Papæ
  - "!Sermo 6 de Nativitáte Dómini"
  - Omnibus quidem diébus, dilectíssimi, atque tempóribus, ánimis fidélium
    divína meditántium Dómini et Salvatóris nostri ex Matre Vírgine ortus
    occúrrit, ut mens, ad confessiónem sui auctóris erécta, sive in gémitu
    supplicatiónis, sive in exsultatióne laudis, sive in sacrifícii oblatióne
    versétur, nihil crébrius nihílque fidéntius spiritáli attíngat intúitu, quam
    quod Deus, Dei Fílius, génitus de Patre coætérno, idem étiam partu est natus
    humáno. Sed hanc adorándam in cælo et in terra nativitátem nullus nobis dies
    magis quam hodiérnus insínuat, et nova étiam in eleméntis luce radiánte,
    coram sénsibus nostris mirábilis sacraménti íngerit claritátem. Non solum
    enim in memóriam, sed in conspéctum quodámmodo redit Angeli Gabriélis cum
    María stupénte collóquium, et concéptio de Spíritu Sancto tam mire promíssa
    quam crédita.
responsory4:
  - "@Sancti/12-25:Responsory5"
lectio5:
  - "Hódie enim auctor mundi éditus est útero virgináli, et qui omnes natúras
    cóndidit, ejus est factus fílius, quam creávit. Hódie Verbum Dei carne
    appáruit vestítum, et quod numquam fuit humánis óculis visíbile, cœpit étiam
    mánibus esse tractábile. Hódie génitum in nostræ carnis animǽque substántia
    Salvatórem angélicis vócibus didicére pastóres, et apud Dominicórum prǽsules
    gregum hódie evangelizándi forma præcóndita est; ut nos quoque cum cæléstis
    milítiæ dicámus exércitu: Glória in excélsis Deo, et in terra pax homínibus
    bonæ voluntátis."
responsory5:
  - "@Sancti/12-25:Responsory6"
lectio6:
  - Unde ipsa colláti múneris magnitúdo dignam a nobis éxigit suo splendóre
    reveréntiam. Ideo enim, sicut beátus Apóstolus docet, non spíritum hujus
    mundi accépimus, sed spíritum qui ex Deo est, ut sciámus quæ a Deo donáta
    sunt nobis; qui non áliter pie cólitur, nisi id ei, quod ipse tríbuit,
    offerátur. Quid autem in thesáuro Domínicæ largitátis ad honórem præséntis
    festi tam cóngruum póssumus inveníre, quam pacem, quæ in nativitáte Dómini
    prima est Angélico prædicáta concéntu? Ipsa enim est quæ parit fílios Dei,
    nutrix dilectiónis et génitrix unitátis, réquies beatórum et æternitátis
    habitáculum; cujus hoc opus próprium et speciále benefícium est, ut jungat
    Deo quos secérnit de mundo.
responsory6:
  - "@Sancti/12-25:Responsory7"
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 2:15-20"
  - "In illo témpore: Pastóres loquebántur ad ínvicem: Transeámus usque
    Béthlehem, et videámus hoc verbum quod factum est, quod Dóminus osténdit
    nobis. Et venérunt festinántes. Et réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Liber 2 in cap. 2. Lucæ, circa med."
  - "Vides festináre pastóres; nemo enim cum desídia Christum requírit. Vides
    pastóres Angelo credidísse: et tu Patri, Fílio, Spirítui Sancto, Angelis,
    Prophétis et Apóstolis crédere non vis? Vide, quam signánter Scriptúra
    singulórum libret moménta verbórum. Festínant, inquit, Verbum vidére. Etenim
    cum caro Dómini vidétur, Verbum vidétur, quod est Fílius."
responsory7:
  - "@Sancti/12-25:Responsory8"
lectio8:
  - Non medíocre fídei tibi hoc videátur exémplum, quod vilis sit persóna
    pastórum. Certe quo vílior ad prudéntiam, eo pretiósior ad fidem. Non
    gymnásia choris reférta sapiéntium, sed plebem Dóminus símplicem requisívit,
    quæ phaleráre audíta et fucáre nescíret. Simplícitas enim quǽritur, non
    ambítio desiderátur.
responsory8:
  - "@Tempora/Nat1-0"
lectio9:
  - Nec contemnénda putes quasi vília verba pastórum. A pastóribus enim María
    fidem cólligit, a pastóribus pópulus ad Dei reveréntiam congregátur. Miráti
    étiam sunt omnes qui audiérunt, de iis, quæ dicebántur a pastóribus ad
    ipsos. Mária autem conservábat ómnia verba hæc, cónferens in corde suo.
    Discámus sanctæ Vírginis in ómnibus castitátem, quæ non minus ore pudíca
    quam córpore, arguménta fídei conferébat in corde.
  - "&teDeum"
