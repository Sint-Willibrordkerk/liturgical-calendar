lectio1:
  - Incipit Epístola tértia beáti Joánnis Apóstoli
  - "!3 Joannes 1:1-4"
  - 1 Sénior Gaio caríssimo, quem ego díligo in veritáte.
  - 2 Caríssime, de ómnibus oratiónem fácio próspere te íngredi, et valére sicut
    próspere agit ánima tua.
  - 3 Gavísus sum valde veniéntibus frátribus, et testimónium perhibéntibus
    veritáti tuæ, sicut tu in veritáte ámbulas.
  - 4 Majórem horum non hábeo grátiam, quam ut áudiam fílios meos in veritáte
    ambuláre.
