lectio2:
  - "!3 Joannes 1:5-10"
  - 5 Caríssime, fidéliter facis quidquid operáris in fratres, et hoc in
    peregrínos,
  - "6 qui testimónium reddidérunt caritáti tuæ in conspéctu ecclésiæ: quos,
    benefáciens, dedúces digne Deo."
  - 7 Pro nómine enim ejus profécti sunt, nihil accipiéntes a géntibus.
  - 8 Nos ergo debémus suscípere hujúsmodi, ut cooperatóres simus veritátis.
  - "9 Scripsíssem fórsitan ecclésiæ: sed is qui amat primátum gérere in eis,
    Diótrephes, non récipit nos:"
  - "10 propter hoc si vénero, commonébo ejus ópera, quæ facit, verbis malígnis
    gárriens in nos: et quasi non ei ista suffíciant, neque ipse súscipit
    fratres: et eos qui suscípiunt, próhibet, et de ecclésia éicit."
