lectio3:
  - "!3 Joannes 1:11-14"
  - "11 Caríssime, noli imitári malum, sed quod bonum est. Qui benéfacit, ex Deo
    est: qui maléfacit, non vidit Deum."
  - "12 Demétrio testimónium rédditur ab ómnibus, et ab ipsa veritáte, sed et
    nos testimónium perhibémus: et nosti quóniam testimónium nostrum verum est."
  - "13 Multa hábui tibi scríbere: sed nólui per atraméntum et cálamum scríbere
    tibi."
  - 14 Spero autem prótinus te vidére, et os ad os loquémur. Pax tibi. Salútant
    te amíci. Salúta amícos nominátim.
