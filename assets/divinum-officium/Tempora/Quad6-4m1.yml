officium:
  - De missa chrismatis
rank:
  - ""
  - Feria privilegiata Duplex I classis
  - "7"
rule:
  - Gloria
  - Credo
  - Prefatio=Chrismatis
  - celebranda aut de missa chrismatis aut missa in coena Domini
  - prelude
prelude:
  - "!Benedictio olei catechumenorum et infirmorum, et confectio sacri
    chrismatis peraguntur secundum ordinem in Pontificali Romano descriptum."
introitus:
  - "!Ex 30:25,31"
  - "v. Fácies unctiónis óleum, et fíliis Israël dices: Hoc óleum unctiónis
    sanctum erit mihi in generatiónes vestras."
  - "!Ps 88:2"
  - "Misericórdias Dómini in ætérnum cantábo: in generatiónem et generatiónem
    annuntiábo veritátem tuam in ore meo. Fácies unctiónis."
  - "v. Fácies unctiónis óleum, et fíliis Israël dices: Hoc óleum unctiónis
    sanctum erit mihi in generatiónes vestras."
oratio:
  - Dómine, Deus, qui in regenerándis plébibus tuis ministério úteris
    sacerdótum; tríbue nobis perseverántem in tua voluntáte famulátum; ut dono
    grátiæ tuæ, in diébus nostris, et méritis et número sacrátus tibi pópulus
    augeátur.
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Jacóbi Apóstoli.
  - "!Jc 5:13-16"
  - "Fratres: Tristátur áliquis vestrum? Oret. Æquo ánimo est? Psallat.
    Infirmátur quis in vobis? Indúcat presbýteros ecclésiæ, et orent super eum,
    ungéntes eum óleo in nómine Dómini; et orátio fídei salvábit infírmum, et
    alleviábit eum Dóminus; et si in peccátis sit, remitténtur ei. Confitémini
    ergo altérutrum peccáta vestra, et oráte pro ínvicem ut salvémini; multum
    enim valet deprecátio justi assídua."
graduale:
  - "!Ps 27:7-8"
  - "In Deo sperávit cor meum, et adjútus sum. Et reflóruit caro mea: et ex
    voluntáte mea confitébor ei."
  - "V. Dóminus fortitúdo plebis suæ: et protéctor salvatiónum Christi sui est."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Marcum.
  - "!Marc 6:7-13"
  - "In illo témpore: Vocávit Jesus duódecim, et coepit eos míttere binos, et
    dabat illis potestátem spirítuum immundórum. Et præcépit eis, ne quid
    tóllerent in via, nisi virgam tantum; non peram, non panem, neque in zona
    æs, sed calceátos sandáliis, et ne indueréntur duábus túnicis. Et dicébat
    eis: « Quocúmque introiéritis in domum, illic manéte, donec exeátis inde; et
    quicúmque non recéperint vos, nec audíerint vos, exeúntes inde, excútite
    púlverem de pédibus vestris, in testimónium illis ». Et exeúntes prædicábant
    ut pæniténtiam ágerent; et dæmónia multa ejiciébant, et ungébant óleo multos
    ægros, et sanábant."
offertorium:
  - "!Ps 44:7"
  - "Dilexísti justítiam, et odísti iniquitátem: proptérea unxit te Deus, Deus
    tuus, óleo lætítiæ."
secreta:
  - Hujus sacrifícii poténtia, Dómine, quǽsumus, et vetustátem nostram cleménter
    abstérgat, et novitátem nobis áugeat et salútem.
  - $Per Dominum
communio:
  - "!Marc. 6:12-13"
  - Prædicábant Apóstoli ut pæniténtiam ágerent, et ungébant óleo multos ægros,
    et sanábant.
postcommunio:
  - "Præsta, quǽsumus, Dómine: ut, sicut de prætéritis ad nova transímus; ita,
    vetustáte depósita, sanctificátis méntibus innovémur."
  - $Per Dominum
