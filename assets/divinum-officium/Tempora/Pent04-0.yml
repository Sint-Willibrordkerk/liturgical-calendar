lectio1:
  - De libro primo Regum
  - "!1 Reg 17:1-7"
  - 1 Congregántes autem Philísthiim ágmina sua in prǽlium convenérunt in Socho
    Judæ, et castrametáti sunt inter Socho et Azéca in fínibus Dommim.
  - 2 Porro Saul et fílii Israël congregáti venérunt in Vallem terebínthi, et
    direxérunt áciem ad pugnándum contra Philísthiim.
  - 3 Et Philísthiim stabant super montem ex parte hac, et Israël stabat supra
    montem ex áltera parte, vallísque erat inter eos.
  - 4 Et egréssus est vir spúrius de castris Philisthinórum nómine Góliath de
    Geth altitúdinis sex cubitórum et palmi.
  - 5 Et cassis ǽrea super caput ejus, et loríca squamáta induebátur; porro
    pondus lorícæ ejus quinque míllia siclórum æris erat.
  - 6 Et ócreas ǽreas habébat in crúribus, et clípeus ǽreus tegébat húmeros ejus.
  - 7 Hastíle autem hastæ ejus erat quasi liciatórium texéntium; ipsum autem
    ferrum hastæ ejus sexcéntos siclos habébat ferri; et ármiger ejus
    antecedébat eum.
responsory1:
  - "@Tempora/Pent01-1"
lectio2:
  - "!1 Reg 17:8-11"
  - "8 Stansque clamábat advérsum phalángas Israël et dicébat eis: Quare
    venístis paráti ad prǽlium? Numquid ego non sum Philisthǽus, et vos servi
    Saul? Elígite ex vobis virum, et descéndat ad singuláre certámen:"
  - 9 si quíverit pugnáre mecum et percússerit me, érimus vobis servi; si autem
    ego prævalúero et percússero eum, vos servi éritis et serviétis nobis.
  - "10 Et ajébat Philisthǽus: Ego exprobrávi agmínibus Israël hódie: Date mihi
    virum, et íneat mecum singuláre certámen."
  - 11 Audiens autem Saul et omnes Israëlítæ sermónes Philisthǽi hujuscémodi,
    stupébant et metuébant nimis.
responsory2:
  - "@Tempora/Pent01-1"
lectio3:
  - "!1 Reg 17:12-16"
  - 12 David autem erat fílius viri Ephrathǽi, de quo supra dictum est, de
    Béthlehem Juda, cui nomen erat Isai, qui habébat octo fílios, et erat vir in
    diébus Saul senex et grandǽvus inter viros.
  - 13 Abiérunt autem tres fílii ejus majóres post Saul in prǽlium; et nómina
    trium filiórum ejus, qui perrexérunt ad bellum, Eliab primogénitus et
    secúndus Abínadab tertiúsque Samma;
  - 14 David autem erat mínimus. Tribus ergo majóribus secútis Saulem,
  - 15 ábiit David et revérsus est a Saul, ut pásceret gregem patris sui in
    Béthlehem.
  - 16 Procedébat vero Philisthǽus mane et véspere, et stabat quadragínta diébus.
responsory3:
  - "@Tempora/Pent01-1"
lectio4:
  - Sermo sancti Augustíni Epíscopi
  - "!Sermo 197 de Temp. circa med."
  - "Stabant fílii Israël contra adversários quadragínta diébus. Quadragínta
    dies, propter quátuor témpora et quátuor partes orbis terræ, vitam præséntem
    signíficant, in qua contra Góliath vel exércitum ejus, id est, contra
    diábolum et ángelos ejus, Christianórum pópulus pugnáre non désinit. Nec
    tamen víncere posset, nisi verus David Christus cum báculo, id est, cum
    crucis mystério descendísset. Ante advéntum enim Christi, fratres caríssimi,
    solútus erat diábolus; véniens Christus fecit de eo, quod in Evangélio
    dictum est: Nemo potest intráre in domum fortis et vasa ejus dirípere, nisi
    prius alligáverit fortem. Venit ergo Christus et alligávit diábolum."
responsory4:
  - "@Tempora/Pent01-2:Responsory1"
lectio5:
  - "Sed dicit áliquis: Si alligátus est, quare adhuc tantum prǽvalet? Verum
    est, fratres caríssimi, quia multum prǽvalet: sed tépidis, et negligéntibus,
    et Deum in veritáte non timéntibus dominátur. Alligátus est enim tamquam
    innéxus canis caténis et néminem potest mordére, nisi eum qui se illi
    mortífera securitáte conjúnxerit. Jam vidéte, fratres, quam stultus est homo
    ille, quem canis in caténa pósitus mordet. Tu te illi per voluntátes et
    cupiditátes sǽculi noli conjúngere, et ille ad te non præsúmit accédere.
    Latráre potest, sollicitáre potest; mordére omníno non potest, nisi
    voléntem. Non enim cogéndo, sed suadéndo nocet; nec extórquet a nobis
    consénsum, sed petit."
responsory5:
  - "@Tempora/Pent01-2:Responsory2"
lectio6:
  - "Venit ergo David et invénit Judæórum pópulum contra diábolum præliántem; et
    cum nullus esset qui præsúmeret ad singuláre certámen accédere, ille qui
    figúram Christi gerébat, procéssit ad prǽlium, tulit báculum in manu sua et
    éxiit contra Góliath. Et in illo quidem tunc figurátum est, quod in Dómino
    Jesu Christo complétum est. Venit enim verus David Christus, qui contra
    spiritálem Góliath, id est, contra diábolum pugnatúrus crucem suam ipse
    portávit. Vidéte, fratres, ubi David Góliath percússerit: in fronte útique,
    ubi crucis signáculum non habébat. Sicut enim báculus crucis typum hábuit,
    ita étiam et lapis ille, de quo percússus est, Christum Dóminum figurábat."
responsory6:
  - "@Tempora/Pent01-2:Responsory3"
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 5:1-11"
  - "In illo témpore: Cum turbæ irrúerent in Jesum, ut audírent verbum Dei, et
    ipse stabat secus stagnum Genésareth. Et réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Liber 4 in Lucæ cap. 5 prope finem libri"
  - "Ubi Dóminus multis impartívit varia génera sanitátum, nec témpore, nec loco
    pótuit ab stúdio sanándi turba cohibéri. Vesper incúbuit sequebántur:
    stagnum occúrrit, urgébant: et ídeo ascéndit in Petri navim. Hæc est illa
    navis, quæ adhuc secúndum Matthǽum flúctuat, secúndum Lucam replétur
    píscibus: ut et princípia Ecclésiæ fluctuántis, et posterióra exuberántis
    agnóscas. Pisces enim sunt, qui hanc enávigant vitam. Ibi adhuc discípulis
    Christus dormit, hic prǽcipit; dormit enim tépidis, perféctis vígilat."
responsory7:
  - "@Tempora/Pent01-3:Responsory1"
lectio8:
  - "Non turbátur hæc navis, in qua prudéntia navigat, abest perfidia, fides
    aspirat. Quemádmodum enim turbari poterat, cui præerat is, in quo Ecclésiæ
    firmaméntum est? Illic ergo turbátio, ubi módica fides; hic securitas, ubi
    perfécta diléctio. Et si aliis imperátur ut laxent rétia sua, soli tamen
    Petro dícitur: Duc in altum; hoc est, in profúndum disputatiónum. Quid enim
    tam altum, quam altitúdinem divitiárum vidére, scire Dei Fílium, et
    professiónem divinæ generatiónis assúmere? Quam licet mens non queat humana
    plene ratiónis investigatióne comprehéndere, fidei tamen plenitúdo
    compléctitur."
responsory8:
  - "@Tempora/Pent01-0:Responsory8"
lectio9:
  - "Nam, etsi non licet mihi scire quemádmodum natus sit, non licete tamen
    nescire quod natus sit. Seriem generatiónis ignoro; sed auctórem
    generatiónis agnosco. Non interfúimus cum ex Patre Dei Fílius nascerétur;
    sed interfúimus cum a Patre Dei Fílius dicerétur. Si Deo non crédimus, cui
    credémus? Omnia enim quæ crédimus, vel visu crédimus, vel audítu: visus sæpe
    fállitur, audítus in fide est."
  - "&teDeum"
