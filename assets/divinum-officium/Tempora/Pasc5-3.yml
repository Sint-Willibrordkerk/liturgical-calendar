  - "Jubiláte Deo, omnis terra, psalmum dícite nómini ejus: date glóriam laudi
    ejus."
  - "&Gloria"
  - "v. Vocem jucunditátis annuntiáte, et audiátur, allelúja: annuntiáte usque
