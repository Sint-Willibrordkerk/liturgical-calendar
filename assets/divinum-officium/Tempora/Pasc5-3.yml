  - "@Tempora/Pasc0-2:Secreta"
sed-non-rubrica-1960/commemoratio-secreta:
  - "!de Rogationibus"
  - Hæc múnera, quǽsumus, Dómine, et víncula nostræ pravitátis absólvant, et tuæ
    nobis misericórdiæ dona concílient.
  - $Per Dominum
communio:
  - "!Ps 95:2."
  - "Cantáte Dómino, allelúja: cantáte Dómino et benedícite nomen ejus: bene
    nuntiáte de die in diem salutáre ejus, allelúja, allelúja."
sed-non-rubrica-1960/postcommunio-mariæ:
  - "@Commune/C10:Postcommunio"
postcommunio:
  - "Tríbue nobis, Dómine, cœléstis mensæ virtúte satiátis: et desideráre, quæ
    recta sunt, et desideráta percípere."
  - $Per Dominum
sed-non-rubrica-1960/commemoratio-postcommunio:
  - "!de Rogationibus"
  - "Vota nostra, quǽsumus, Dómine, pio favóre proséquere: ut, dum dona tua in
    tribulatióne percípimus, de consolatióne nostra in tuo amóre crescámus."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 17:1-11"
  - "In illo témpore: Sublevátis Jesus óculis in cælum, dixit: Pater, venit
    hora, clarífica Fílium tuum. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tractatus 104 in Joannem, sub med."
  - "Póterat Dóminus noster, unigénitus et coætérnus Patri, in forma servi, et
    ex forma servi, si hoc opus esset, oráre siléntio: sed ita se Patri exhibére
    vóluit precatórem, ut meminísset nostrum se esse doctórem. Proínde eam, quam
    fecit oratiónem pro nobis, notam fecit et nobis: quóniam tanti magístri non
    solum ad ipsos sermocinátio, sed étiam pro ipsis ad Patrem orátio,
    discipulórum est ædificátio: et si illórum, qui hæc dicta áderant auditúri,
    profécto et nostra, qui fuerámus conscrípta lectúri."
responsory1:
  - "@Tempora/Pasc4-0:Responsory7"
lectio2:
  - "Quaprópter hoc quod ait: Pater, venit hora, clarífica Fílium tuum:
    osténdit, omne tempus, et quid, quando fáceret vel fíeri síneret, ab illo
    esse dispósitum, qui témpori súbditus non est: quóniam quæ futúra erant per
    síngula témpora, in Dei sapiéntia causas efficiéntes habent, in qua nulla
    sunt témpora. Non ergo credátur hæc hora fato urgénte venísse, sed Deo
    pótius ordinánte. Nec sidérea necéssitas Christi connéxuit passiónem: absit
    enim ut sídera mori cógerent síderum Conditórem."
responsory2:
  - "@Tempora/Pasc4-0:Responsory8"
lectio3:
  - "Clarificátum a Patre Fílium nonnúlli accípiunt in hoc, quod ei non
    pepércit, sed pro nobis ómnibus trádidit eum. Sed si passióne clarificátus
    dícitur, quanto magis resurrectióne? Nam in passióne magis ejus humílitas
    quam cláritas commendátur, Apóstolo teste, qui dicit: Humiliávit semetípsum,
    factus obédiens usque ad mortem, mortem autem crucis. Deínde séquitur, et de
    ejus clarificatióne jam dicit: Propter quod et Deus illum exaltávit, et
    donávit ei nomen, quod est super omne nomen: ut in nómine Jesu omne genu
    flectátur, cæléstium, terréstrium, et infernórum. Et omnis lingua
    confiteátur, quia Dóminus Jesus Christus in glória est Dei Patris. Hæc est
    clarificátio Dómini nostri Jesu Christi, quæ ab ejus resurrectióne sumpsit
    exórdium."
responsory3:
  - "@Tempora/Pasc4-1:Responsory1"
  - "&Gloria"
  - R. A Dómino, allelúja, allelúja.
