oratio:
  - "Deus, a quo bona cuncta procédunt, largíre supplícibus tuis: ut cogitémus,
    te inspiránte, quæ recta sunt; et, te gubernánte, eadem faciámus."
  - $Per Dominum
sed-non-rubrica-1960/commemoratio-oratio:
  - "!de Rogationibus"
  - "Præsta, quǽsumus, omnípotens Deus: ut, qui in afflictióne nostra de tua
    pietáte confídimus; contra advérsa ómnia, tua semper protectióne muniámur."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Ephésios
  - "!Eph 4:7-13"
  - "Fratres: Unicuíque nostrum data est grátia secúndum mensúram donatiónis
    Christi. Propter quod dicit: Ascéndens in altum, captívam duxit
    captivitátem: dedit dona homínibus. Quod autem ascéndit, quid est, nisi quia
    et descéndit primum in inferióres partes terræ? Qui descéndit, ipse est et
    qui ascéndit super omnes cœlos, ut impléret ómnia. Et ipse dedit quosdam
    quidem apóstolos, quosdam autem prophétas, álios vero evangelístas, álios
    autem pastóres et doctóres, ad consummatiónem sanctórum in opus ministérii,
    in ædificatiónem córporis Christi: donec occurrámus omnes in unitátem fídei,
    et agnitiónis Fílii Dei, in virum perféctum, in mensúram ætátis plenitúdinis
    Christi."
graduale:
  - Allelúja, allelúja.
  - V. Surréxit Christus, et illúxit nobis, quos rédemit sánguine suo. Allelúja.
  - "!Joannes 16:28"
  - "V. Exívi a Patre, et veni in mundum: íterum relínquo mundum, et vado ad
    Patrem. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem.
  - "!Joannes 17:1-11"
  - "In illo témpore: Sublevátis Jesus óculis in cœlum, dixit: Pater, venit
    hora, clarífica Fílium tuum, ut Fílius tuus claríficet te: sicut dedísti ei
    potestátem omnis carnis, ut omne, quod dedísti ei, det eis vitam ætérnam.
    Hæc est autem vita ætérna: ut cognóscant te, solum Deum verum, et quem
    misísti Jesum Christum. Ego te clarificávi super terram: opus consummávi,
    quod dedísti mihi, ut fáciam: et nunc clarífica me tu, Pater, apud
    temetípsum, claritáte, quam hábui, priúsquam mundus esset, apud te.
    Manifestávi nomen tuum homínibus, quos dedísti mihi de mundo. Tui erant, et
    mihi eos dedísti; et sermónem tuum servavérunt. Nunc cognovérunt, quia
    ómnia, quæ dedísti mihi, abs te sunt: quia verba, quæ dedísti mihi, dedi
    eis: et ipsi accepérunt, et cognovérunt vere, quia a te exivi, et
    credidérunt, quia tu me misísti. Ego pro eis rogo, non pro mundo rogo, sed
    pro his, quos dedísti mihi: quia tui sunt: et mea ómnia tua sunt, et tua mea
    sunt: et clarificátus sum in eis. Et jam non sum in mundo, et hi in mundo
    sunt, et ego ad te vénio."
offertorium:
  - "!Ps 65:8-9; 65:20"
  - "Benedícite, gentes, Dóminum, Deum nostrum, et obaudíte vocem laudis ejus:
    qui pósuit ánimam meam ad vitam, et non dedit commovéri pedes meos:
    benedíctus Dóminus, qui non amóvit deprecatiónem meam et misericórdiam suam
    a me, allelúja."
