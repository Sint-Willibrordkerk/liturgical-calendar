lectio1:
  - De Epístola beáti Jacóbi Apóstoli
  - "!Jas 2:1-4"
  - 1 Fratres mei, nolíte in personárum acceptióne habére fidem Dómini nostri
    Jesu Christi glóriæ.
  - 2 Etenim si introíerit in convéntum vestrum vir áureum ánnulum habens in
    veste cándida, introíerit autem et pauper in sórdido hábitu,
  - "3 et intendátis in eum qui indútus est veste præclára, et dixéritis ei: Tu
    sede hic bene: páuperi autem dicátis: Tu sta illic; aut sede sub scabéllo
    pedum meórum:"
  - 4 nonne judicátis apud vosmetípsos, et facti estis júdices cogitatiónum
    iniquárum?
responsory1:
  - "@Tempora/Pasc4-0:Responsory4"
lectio2:
  - "!Jas 2:5-9"
  - "5 Audíte, fratres mei dilectíssimi: nonne Deus elégit páuperes in hoc
    mundo, dívites in fide, et hærédes regni, quod repromísit Deus diligéntibus
    se?"
  - 6 vos autem exhonorástis páuperem. Nonne dívites per poténtiam ópprimunt
    vos, et ipsi trahunt vos ad judícia?
  - 7 nonne ipsi blasphémant bonum nomen, quod invocátum est super vos?
  - "8 Si tamen legem perfícitis regálem secúndum Scriptúras: Díliges próximum
    tuum sicut teípsum: bene fácitis:"
  - 9 si autem persónas accípitis, peccátum operámini, redargúti a lege quasi
    transgressóres.
responsory2:
  - "@Tempora/Pasc4-0:Responsory5"
  - "&Gloria"
  - R. Ne repéllas me a mandátis tuis, allelúja, allelúja.
lectio3:
  - "!Jas 2:10-13"
  - 10 Quicúmque autem totam legem serváverit, offéndat autem in uno, factus est
    ómnium reus.
  - "11 Qui enim dixit: Non mœcháberis, dixit et: Non occídes. Quod si non
    mœcháberis, occídes autem, factus es transgréssor legis."
  - 12 Sic loquímini, et sic fácite sicut per legem libertátis incipiéntes
    judicári.
  - "13 Judícium enim sine misericórdia illi qui non fecit misericórdiam:
    superexáltat autem misericórdia judícium."
responsory3:
  - "@Tempora/Pasc4-0:Responsory6"
ant-2:
  - "Pax vobis, * ego sum, allelúja: nolíte timére, allelúja."
