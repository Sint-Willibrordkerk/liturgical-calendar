evangelium1:
  - Pássio Dómini nostri Jesu Christi secúndum Matthǽum.
  - "!Matt 26:1-75; 27:1-66."
evangelium2:
  - "In illo témpore: Dixit Jesus discípulis suis: J. Scitis, quid post bíduum
    Pascha fiet, et Fílius hóminis tradétur, ut crucifigátur. C. Tunc congregáti
    sunt príncipes sacerdótum et senióres pópuli in átrium príncipis sacerdótum,
    qui dicebátur Cáiphas: et consílium fecérunt, ut Jesum dolo tenérent et
    occíderent. Dicébant autem: S. Non in die festo, ne forte tumúltus fíeret in
    pópulo. C. Cum autem Jesus esset in Bethánia in domo Simónis leprósi,
    accéssit ad eum múlier habens alabástrum unguénti pretiósi, et effúdit super
    caput ipsíus recumbéntis. Vidéntes autem discípuli, indignáti sunt,
    dicéntes: S. Ut quid perdítio hæc? pótuit enim istud venúmdari multo, et
    dari paupéribus. C. Sciens autem Jesus, ait illis: J. Quid molésti estis
    huic mulíeri? opus enim bonum operáta est in me. Nam semper páuperes habétis
    vobíscum: me autem non semper habétis. Mittens enim hæc unguéntum hoc in
    corpus meum, ad sepeliéndum me fecit. Amen, dico vobis, ubicúmque prædicátum
    fúerit hoc Evangélium in toto mundo, dicétur et, quod hæc fecit, in memóriam
    ejus. C. Tunc ábiit unus de duódecim, qui dicebátur Judas Iscariótes, ad
    príncipes sacerdótum, et ait illis: S. Quid vultis mihi dare, et ego vobis
    eum tradam? C. At illi constituérunt ei trigínta argénteos. Et exínde
    quærébat opportunitátem, ut eum tráderet. Prima autem die azymórum
    accessérunt discípuli ad Jesum, dicéntes: S. Ubi vis parémus tibi comédere
    pascha? C. At Jesus dixit: J. Ite in civitátem ad quendam, et dícite ei:
    Magíster dicit: Tempus meum prope est, apud te fácio pascha cum discípulis
    meis. C. Et fecérunt discípuli, sicut constítuit illis Jesus, et paravérunt
    pascha. Véspere autem facto, discumbébat cum duódecim discípulis suis. Et
    edéntibus illis, dixit: J. Amen, dico vobis, quia unus vestrum me traditúrus
    est. C. Et contristáti valde, cœpérunt sínguli dícere: S. Numquid ego sum,
    Dómine? C. At ipse respóndens, ait: J. Qui intíngit mecum manum in
    parópside, hic me tradet. Fílius quidem hóminis vadit, sicut scriptum est de
    illo: væ autem hómini illi, per quem Fílius hóminis tradétur: bonum erat ei,
    si natus non fuísset homo ille. C. Respóndens autem Judas, qui trádidit eum,
    dixit: S. Numquid ego sum, Rabbi? C. Ait illi: J. Tu dixísti. C. Cenántibus
    autem eis, accépit Jesus panem, et benedíxit, ac fregit, dedítque discípulis
    suis, et ait: J. Accípite et comédite: hoc est corpus meum. C. Et accípiens
    cálicem, grátias egit: et dedit illis, dicens: J. Bíbite ex hoc omnes. Hic
    est enim sanguis meus novi Testaménti, qui pro multis effundétur in
    remissiónem peccatórum. Dico autem vobis: non bibam ámodo de hoc genímine
    vitis usque in diem illum, cum illud bibam vobíscum novum in regno Patris
    mei. C. Et hymno dicto, exiérunt in montem Olivéti. Tunc dicit illis Jesus:
    J. Omnes vos scándalum patiémini in me in ista nocte. Scriptum est enim:
    Percútiam pastórem, et dispergéntur oves gregis. Postquam autem resurréxero,
    præcédam vos in Galilæam. C. Respóndens autem Petrus, ait illi: S. Et si
    omnes scandalizáti fúerint in te, ego numquam scandalizábor. C. Ait illi
    Jesus: J. Amen, dico tibi, quia in hac nocte, antequam gallus cantet, ter me
    negábis. C. Ait illi Petrus: S. Etiam si oportúerit me mori tecum, non te
    negábo. C. Simíliter et omnes discípuli dixérunt."
evangelium3:
  - "Tunc venit Jesus cum illis in villam, quæ dícitur Gethsémani, et dixit
    discípulis suis: J. Sedéte hic, donec vadam illuc et orem. C. Et assúmpto
    Petro et duóbus fíliis Zebedæi, cœpit contristári et mæstus esse. Tunc ait
    illis: J. Tristis est ánima mea usque ad mortem: sustinéte hic, et vigilate
    mecum. C. Et progréssus pusíllum, prócidit in fáciem suam, orans et dicens:
    J. Pater mi, si possíbile est, tránseat a me calix iste: Verúmtamen non
    sicut ego volo, sed sicut tu. C. Et venit ad discípulos suos, et invénit eos
    dormiéntes: et dicit Petro: J. Sic non potuístis una hora vigiláre mecum?
    Vigiláte et oráte, ut non intrétis in tentatiónem. Spíritus quidem promptus
    est, caro autem infírma. C. Iterum secúndo ábiit et orávit, dicens: J. Pater
    mi, si non potest hic calix transíre, nisi bibam illum, fiat volúntas tua.
    C. Et venit íterum, et invenit eos dormiéntes: erant enim óculi eórum
    graváti. Et relíctis illis, íterum ábiit et orávit tértio, eúndem sermónem
    dicens. Tunc venit ad discípulos suos, et dicit illis: J. Dormíte jam et
    requiéscite: ecce, appropinquávit hora, et Fílius hóminis tradétur in manus
    peccatórum. Súrgite, eámus: ecce, appropinquávit, qui me tradet. C. Adhuc eo
    loquénte, ecce, Judas, unus de duódecim, venit, et cum eo turba multa cum
    gládiis et fústibus, missi a princípibus sacerdótum et senióribus pópuli.
    Qui autem trádidit eum, dedit illis signum, dicens: S. Quemcúmque osculátus
    fúero, ipse est, tenéte eum. C. Et conféstim accédens ad Jesum, dixit: S.
    Ave, Rabbi. C. Et osculátus est eum. Dixítque illi Jesus: J. Amíce, ad quid
    venísti? C. Tunc accessérunt, et manus injecérunt in Jesum et tenuérunt eum.
    Et ecce, unus ex his, qui erant cum Jesu, exténdens manum, exémit gládium
    suum, et percútiens servum príncipis sacerdótum, amputávit aurículam ejus.
    Tunc ait illi Jesus: J. Convérte gládium tuum in locum suum. Omnes enim, qui
    accéperint gládium, gládio períbunt. An putas, quia non possum rogáre Patrem
    meum, et exhibébit mihi modo plus quam duódecim legiónes Angelórum? Quómodo
    ergo implebúntur Scripturæ, quia sic oportet fíeri? C. In illa hora dixit
    Jesus turbis: J. Tamquam ad latrónem exístis cum gládiis et fústibus
    comprehéndere me: cotídie apud vos sedébam docens in templo, et non me
    tenuístis. C. Hoc autem totum factum est, ut adimpleréntur Scripturæ
    Prophetárum. Tunc discípuli omnes, relícto eo, fugérunt. At illi tenéntes
    Jesum, duxérunt ad Cáipham, príncipem sacerdótum, ubi scribæ et senióres
    convénerant. Petrus autem sequebátur eum a longe, usque in átrium príncipis
    sacerdótum. Et ingréssus intro, sedébat cum minístris, ut vidéret finem.
    Príncipes autem sacerdótum et omne concílium quærébant falsum testimónium
    contra Jesum, ut eum morti tráderent: et non invenérunt, cum multi falsi
    testes accessíssent. Novíssime autem venérunt duo falsi testes et dixérunt:
    S. Hic dixit: Possum destrúere templum Dei, et post tríduum reædificáre
    illud. C. Et surgens princeps sacerdótum, ait illi: S. Nihil respóndes ad
    ea, quæ isti advérsum te testificántur? C. Jesus autem tacébat. Et princeps
    sacerdótum ait illi: S. Adjúro te per Deum vivum, ut dicas nobis, si tu es
    Christus, Fílius Dei. C. Dicit illi Jesus: J. Tu dixísti. Verúmtamen dico
    vobis, ámodo vidébitis Fílium hóminis sedéntem a dextris virtútis Dei, et
    veniéntem in núbibus cœli. C. Tunc princeps sacerdótum scidit vestiménta
    sua, dicens: S. Blasphemávit: quid adhuc egémus téstibus? Ecce, nunc
    audístis blasphémiam: quid vobis vidétur? C. At illi respondéntes dixérunt:
    S. Reus est mortis. C. Tunc exspuérunt in fáciem ejus, et cólaphis eum
    cecidérunt, álii autem palmas in fáciem ejus dedérunt, dicéntes: S.
    Prophetíza nobis, Christe, quis est, qui te percússit? C. Petrus vero
    sedébat foris in átrio: et accéssit ad eum una ancílla, dicens: S. Et tu cum
    Jesu Galilæo eras. C. At ille negávit coram ómnibus, dicens: S. Néscio, quid
    dicis. C. Exeúnte autem illo jánuam, vidit eum ália ancílla, et ait his, qui
    erant ibi: S. Et hic erat cum Jesu Nazaréno. C. Et íterum negávit cum
    juraménto: Quia non novi hóminem. Et post pusíllum accessérunt, qui stabant,
    et dixérunt Petro: S. Vere et tu ex illis es: nam et loquéla tua maniféstum
    te facit. C. Tunc cœpit detestári et juráre, quia non novísset hóminem. Et
    contínuo gallus cantávit. Et recordátus est Petrus verbi Jesu, quod díxerat:
    Priúsquam gallus cantet, ter me negábis. Et egréssus foras, flevit amáre.
    Mane autem facto, consílium iniérunt omnes príncipes sacerdótum et senióres
    pópuli advérsus Jesum, ut eum morti tráderent. Et vinctum adduxérunt eum, et
    tradidérunt Póntio Piláto præsidi. Tunc videns Judas, qui eum trádidit, quod
    damnátus esset, pæniténtia ductus, réttulit trigínta argénteos princípibus
    sacerdótum et senióribus, dicens: S. Peccávi, tradens sánguinem justum. C.
    At illi dixérunt: S. Quid ad nos? Tu vidéris. C. Et projéctis argénteis in
    templo, recéssit: et ábiens, láqueo se suspéndit. Príncipes autem
    sacerdótum, accéptis argénteis, dixérunt: S. Non licet eos míttere in
    córbonam: quia prétium sánguinis est. C. Consílio autem ínito, emérunt ex
    illis agrum fíguli, in sepultúram peregrinórum. Propter hoc vocátus est ager
    ille, Hacéldama, hoc est, ager sánguinis, usque in hodiérnum diem. Tunc
    implétum est, quod dictum est per Jeremíam Prophétam, dicéntem: Et
    accepérunt trigínta argénteos prétium appretiáti, quem appretiavérunt a
    fíliis Israël: et dedérunt eos in agrum fíguli, sicut constítuit mihi
    Dóminus. Jesus autem stetit ante præsidem, et interrogávit eum præses,
    dicens: S. Tu es Rex Judæórum? C. Dicit illi Jesus: J. Tu dicis. C. Et cum
    accusarétur a princípibus sacerdótum et senióribus, nihil respóndit. Tunc
    dicit illi Pilátus: S. Non audis, quanta advérsum te dicunt testimónia? C.
    Et non respóndit ei ad ullum verbum, ita ut mirarétur præses veheménter. Per
    diem autem sollémnem consuéverat præses pópulo dimíttere unum vinctum, quem
    voluíssent. Habébat autem tunc vinctum insígnem, qui dicebátur Barábbas.
    Congregátis ergo illis, dixit Pilátus: S. Quem vultis dimíttam vobis:
    Barábbam, an Jesum, qui dícitur Christus? C. Sciébat enim, quod per invídiam
    tradidíssent eum. Sedénte autem illo pro tribunáli, misit ad eum uxor ejus,
    dicens: S. Nihil tibi et justo illi: multa enim passa sum hódie per visum
    propter eum. C. Príncipes autem sacerdótum et senióres persuasérunt populis,
    ut péterent Barábbam, Jesum vero pérderent. Respóndens autem præses, ait
    illis: S. Quem vultis vobis de duóbus dimítti? C. At illi dixérunt: S.
    Barábbam. C. Dicit illis Pilátus: S. Quid ígitur fáciam de Jesu, qui dícitur
    Christus? C. Dicunt omnes: S. Crucifigátur. C. Ait illis præses: S. Quid
    enim mali fecit? C. At illi magis clamábant, dicéntes: S. Crucifigátur. C.
    Videns autem Pilátus, quia nihil profíceret, sed magis tumúltus fíeret:
    accépta aqua, lavit manus coram pópulo, dicens: S. Innocens ego sum a
    sánguine justi hujus: vos vidéritis. C. Et respóndens univérsus pópulus,
    dixit: S. Sanguis ejus super nos et super fílios nostros. C. Tunc dimísit
    illis Barábbam: Jesum autem flagellátum trádidit eis, ut crucifigerétur.
    Tunc mílites præsidis suscipiéntes Jesum in prætórium, congregavérunt ad eum
    univérsam cohórtem: et exuéntes eum, chlámydem coccíneam circumdedérunt ei:
    et plecténtes corónam de spinis, posuérunt super caput ejus, et arúndinem in
    déxtera ejus. Et genu flexo ante eum, illudébant ei, dicéntes: S. Ave, Rex
    Judæórum. C. Et exspuéntes in eum, accepérunt arúndinem, et percutiébant
    caput ejus. Et postquam illusérunt ei, exuérunt eum chlámyde et induérunt
    eum vestiméntis ejus, et duxérunt eum, ut crucifígerent. Exeúntes autem,
    invenérunt hóminem Cyrenæum, nómine Simónem: hunc angariavérunt, ut tólleret
    crucem ejus. Et venérunt in locum, qui dícitur Gólgotha, quod est Calváriæ
    locus. Et dedérunt ei vinum bíbere cum felle mixtum. Et cum gustásset,
    nóluit bibere. Postquam autem crucifixérunt eum, divisérunt vestiménta ejus,
    sortem mitténtes: ut implerétur, quod dictum est per Prophétam dicentem:
    Divisérunt sibi vestiménta mea, et super vestem meam misérunt sortem. Et
    sedéntes, servábant eum. Et imposuérunt super caput ejus causam ipsíus
    scriptam: Hic est Jesus, Rex Judæórum. Tunc crucifíxi sunt cum eo duo
    latrónes: unus a dextris et unus a sinístris. Prætereúntes autem
    blasphemábant eum, movéntes cápita sua et dicéntes: S. Vah, qui déstruis
    templum Dei et in tríduo illud reædíficas: salva temetípsum. Si Fílius Dei
    es, descénde de cruce. C. Simíliter et príncipes sacerdótum illudéntes cum
    scribis et senióribus, dicébant: S. Alios salvos fecit, seípsum non potest
    salvum fácere: si Rex Israël est, descéndat nunc de cruce, et crédimus ei:
    confídit in Deo: líberet nunc, si vult eum: dixit enim: Quia Fílius Dei sum.
    C. Idípsum autem et latrónes, qui crucifíxi erant cum eo, improperábant ei.
    A sexta autem hora ténebræ factæ sunt super univérsam terram usque ad horam
    nonam. Et circa horam nonam clamávit Jesus voce magna, dicens: J. Eli, Eli,
    lamma sabactháni? C. Hoc est: J. Deus meus, Deus meus, ut quid dereliquísti
    me? C. Quidam autem illic stantes et audiéntes dicébant: S. Elíam vocat
    iste. C. Et contínuo currens unus ex eis, accéptam spóngiam implévit acéto
    et impósuit arúndini, et dabat ei bíbere. Céteri vero dicébant: S. Sine,
    videámus, an véniat Elías líberans eum. C. Jesus autem íterum clamans voce
    magna, emísit spíritum."
  - "!Hic genuflectitur, et pausatur aliquantulum."
  - "Et ecce, velum templi scissum est in duas partes a summo usque deórsum: et
    terra mota est, et petræ scissæ sunt, et monuménta apérta sunt: et multa
    córpora sanctórum, qui dormíerant, surrexérunt. Et exeúntes de monuméntis
    post resurrectiónem ejus, venérunt in sanctam civitátem, et apparuérunt
    multis. Centúrio autem et qui cum eo erant, custodiéntes Jesum, viso
    terræmótu et his, quæ fiébant, timuérunt valde, dicéntes: S. Vere Fílius Dei
    erat iste. C. Erant autem ibi mulíeres multæ a longe, quæ secútæ erant Jesum
    a Galilæa, ministrántes ei: inter quas erat María Magdaléne, et María
    Jacóbi, et Joseph mater, et mater filiórum Zebedæi. Cum autem sero factum
    esset, venit quidam homo dives ab Arimathæa, nómine Joseph, qui et ipse
    discípulus erat Jesu. Hic accéssit ad Pilátum, et pétiit corpus Jesu. Tunc
    Pilátus jussit reddi corpus. Et accépto córpore, Joseph invólvit illud in
    síndone munda. Et pósuit illud in monuménto suo novo, quod excíderat in
    petra. Et advólvit saxum magnum ad óstium monuménti, et ábiit."
evangelium4:
  - Erat autem ibi María Magdaléne et áltera María, sedéntes contra sepúlcrum.
  - _
  - "v. Munda cor meum ac lábia mea, omnípotens Deus, qui lábia Isaíæ Prophétæ
    cálculo mundásti igníto: ita me tua grata miseratióne dignáre mundáre, ut
    sanctum Evangélium tuum digne váleam nuntiáre. Per Christum, Dóminum
    nostrum. Amen."
  - D. Jube, domne, benedícere.
  - "S. Dóminus sit in corde tuo et in lábiis tuis: ut digne et competénter
    annúnties Evangélium suum: In nómine Patris, et Fílii, + et Spíritus Sancti.
    Amen."
  - _
  - "v. Altera autem die, quæ est post Parascéven, convenérunt príncipes
    sacerdótum et pharisǽi ad Pilátum, dicéntes: Dómine, recordáti sumus, quia
    sedúctor ille dixit adhuc vivens: Post tres dies resúrgam. Jube ergo
    custodíri sepúlcrum usque in diem tértium: ne forte véniant discípuli ejus,
    et furéntur eum, et dicant plebi: Surréxit a mórtuis; et erit novíssimus
    error pejor prióre. Ait illis Pilátus: Habétis custódiam, ite, custodíte,
    sicut scitis. Illi autem abeúntes, muniérunt sepúlcrum, signántes lápidem,
    cum custódibus."
offertorium:
  - "!Ps 68:21-22."
  - "Impropérium exspectávit cor meum et misériam: et sustínui, qui simul mecum
    contristarétur, et non fuit: consolántem me quæsívi, et non invéni: et
    dedérunt in escam meam fel, et in siti mea potavérunt me acéto."
secreta:
  - "Concéde, quǽsumus, Dómine: ut óculis tuæ majestátis munus oblátum, et
    grátiam nobis devotiónis obtíneat, et efféctum beátæ perennitátis acquírat."
  - $Per Dominum
communio:
  - "!Matt 26:42."
  - "Pater, si non potest hic calix transíre, nisi bibam illum: fiat volúntas
    tua."
postcommunio:
  - "Per hujus, Dómine, operatiónem mystérii: et vitia nostra purgéntur, et
    justa desidéria compleántur."
  - $Per Dominum
rubrica-cisterciensis/responsory-vespera-1:
  - "Responsorium. Circumdedérunt me viri mendáces, sine causa flagéllis
    cecidérunt me: * Sed tu, Dómine, defénsor víndica me."
  - V. Quóniam tribulátio próxima est, et non est qui ádjuvet.
  - R. Sed tu, Dómine, defénsor víndica me.
ant-1:
  - "Pater juste, * mundus te non cognóvit: ego autem novi te, quia tu me
    misísti."
rubrica-cisterciensis-aut-rubrica-praedicatorum/ant-1:
  - Clarífica me, Pater, * apud temetípsum claritáte, quam hábui, priúsquam
    mundus fíeret.
lectio1:
  - De Jeremía Prophéta
  - "!Jer 2:12-17"
  - 12 Obstupéscite, cæli, super hoc, et, portæ ejus, desolámini veheménter,
    dicit Dóminus.
  - "13 Duo enim mala fecit pópulus meus: Me dereliquérunt fontem aquæ vivæ, et
    fodérunt sibi cistérnas, cistérnas dissipátas, quæ continére non valent
    aquas."
  - 14 Numquid servus est Israël, aut vernáculus? Quare ergo factus est in
    prædam?
  - "15 Super eum rugiérunt leónes, et dedérunt vocem suam, posuérunt terram
    ejus in solitúdinem: civitátes ejus exústæ sunt, et non est qui hábitet in
    eis."
  - 16 Fílii quoque Mémpheos et Taphnes constupravérunt te usque ad vérticem.
  - 17 Numquid non istud factum est tibi, quia dereliquísti Dóminum Deum tuum eo
    témpore, quo ducébat te per viam?
responsory1:
  - "R. In die qua invocávi te, Dómine, dixísti: Noli timére:"
  - "* Judicásti causam meam, et liberásti me, Dómine, Deus meus."
  - V. In die tribulatiónis meæ clamávi ad te, quia exaudísti me.
  - R. Judicásti causam meam, et liberásti me, Dómine, Deus meus.
lectio2:
  - "!Jer 2:18-22"
  - 18 Et nunc quid tibi vis in via Ægýpti, ut bibas aquam túrbidam? et quid
    tibi cum via Assyriórum, ut bibas aquam flúminis?
  - 19 Arguet te malítia tua, et avérsio tua increpábit te. Scito, et vide quia
    malum et amárum est reliquísse te Dóminum Deum tuum, et non esse timórem mei
    apud te, dicit Dóminus Deus exercítuum.
  - "20 A sǽculo confregísti jugum meum, rupísti víncula mea, et dixísti: Non
    sérviam. In omni enim colle sublími, et sub omni ligno frondóso, tu
    prosternebáris méretrix."
  - "21 Ego autem plantávi te víneam eléctam, omne semen verum: quómodo ergo
    convérsa es mihi in pravum, vínea aliéna?"
  - 22 Si láveris te nitro, et multiplicáveris tibi herbam borith, maculáta es
    in iniquitáte tua coram me, dicit Dóminus Deus.
responsory2:
  - "R. Fratres mei elongavérunt se a me: et noti mei"
  - "* Quasi aliéni recessérunt a me."
  - V. Dereliquérunt me próximi mei, et qui me novérunt.
  - R. Quasi aliéni recessérunt a me.
lectio3:
  - "!Jer 2:29-32"
  - 29 Quid vultis mecum judício conténdere? Omnes dereliquístis me, dicit
    Dóminus.
  - "30 Frustra percússi fílios vestros, disciplínam non recepérunt: devorávit
    gládius vester prophétas vestros, quasi leo vastátor"
  - "31 generátio vestra. Vidéte verbum Dómini: Numquid solitúdo factus sum
    Israéli, aut terra serótina? Quare ergo dixit pópulus meus: Recéssimus, non
    veniémus ultra ad te?"
  - 32 Numquid obliviscétur virgo ornaménti sui, aut sponsa fásciæ pectorális
    suæ? pópulus vero meus oblítus est mei diébus innúmeris.
responsory3:
  - "R. Atténde, Dómine, ad me, et audi voces adversariórum meórum:"
  - "* Numquid rédditur pro bono malum, quia fodérunt fóveam ánimæ meæ?"
  - V. Recordáre quod stéterim in conspéctu tuo, ut lóquerer pro eis bonum, et
    avérterem indignatiónem tuam ab eis.
  - R. Numquid rédditur pro bono malum, quia fodérunt fóveam ánimæ meæ?
  - "&Gloria"
  - "R. Atténde, Dómine, ad me, et audi voces adversariórum meórum: * Numquid
    rédditur pro bono malum, quia fodérunt fóveam ánimæ meæ?"
lectio4:
  - Sermo sancti Leónis Papæ
  - "!Sermo 11 de Passióne Dómini"
  - "Desideráta nobis, dilectíssimi, et univérso optábilis mundo adest
    festívitas Domínicæ passiónis, quæ nos inter exsultatiónes spirituálium
    gaudiórum silére non pátitur. Quia etsi diffícile est, de eádem solemnitáte
    sǽpius digne aptéque dissérere: non est tamen líberum sacerdóti in tanto
    divínæ misericórdiæ sacraménto fidélibus pópulis subtráhere sermónis
    offícium: cum ipsa matéria ex eo quod est ineffábilis, fandi tríbuat
    facultátem: nec possit defícere quod dicátur, dum numquam potest satis esse
    quod dícitur. Succúmbat ergo humána infírmitas glóriæ Dei, et in explicándis
    opéribus misericórdiæ ejus, ímparem se semper invéniat. Laborémus sensu,
    hæreámus ingénio, deficiámus elóquio: bonum est ut nobis parum sit, quod
    étiam recte de Dómini majestáte sentímus."
responsory4:
  - "R. Conclúsit vias meas inimícus, insidiátor factus est mihi sicut leo in
    abscóndito, replévit et inebriávit me amaritúdine: deduxérunt in lacum
    mortis vitam meam, et posuérunt lápidem contra me."
  - "* Vide, Dómine, iniquitátes illórum: et júdica causam ánimæ meæ, defénsor
    vitæ meæ."
  - V. Factus sum in derísum omni pópulo meo, cánticum eórum tota die.
  - "R. Vide, Dómine, iniquitátes illórum: et júdica causam ánimæ meæ, defénsor
    vitæ meæ."
lectio5:
  - "Dicénte enim prophéta: Quǽrite Dóminum, et confirmámini, quǽrite fáciem
    ejus semper: némini præsuméndum est, quod totum quod quærit, invénerit, ne
    désinat propinquáre, qui cessárit accédere. Quid autem inter ómnia ópera
    Dei, in quibus humánæ admiratiónis fatigátur inténtio, ita contemplatiónem
    mentis nostræ et obléctat et súperat, sicut pássio Salvatóris? Qui ut
    humánum genus vínculis mortíferæ prævaricatiónis absólveret, et sæviénti
    diábolo poténtiam suæ majestátis occúluit, et infirmitátem nostræ
    humilitátis objécit. Si enim crudélis et supérbus inimícus consílium
    misericórdiæ Dei nosse potuísset, Judæórum ánimos mansuetúdine pótius
    temperáre, quam injústis ódiis studuísset accéndere: ne ómnium captivórum
    amítteret servitútem, dum nihil sibi debéntis perséquitur libertátem."
responsory5:
  - "R. Salvum me fac, Deus, quóniam intravérunt aquæ usque ad ánimam meam: ne
    avértas fáciem tuam a me:"
  - "* Quóniam tríbulor, exáudi me, Dómine, Deus meus."
  - "V. Inténde ánimæ meæ, et líbera eam: propter inimícos meos éripe me."
  - R. Quóniam tríbulor, exáudi me, Dómine, Deus meus.
lectio6:
  - "Feféllit ergo illum malígnitas sua, íntulit supplícium Fílio Dei, quod
    cunctis fíliis hóminum in remédium verterétur. Fudit sánguinem justum, qui
    reconciliándo mundo et prétium esset, et póculum. Suscépit Dóminus, quod
    secúndum propósitum suæ voluntátis elégit. Admísit in se ímpias manus
    furéntium: quæ dum próprio incúmbunt scéleri, famulátæ sunt Redemptóri.
    Cujus étiam circa interfectóres suos tanta erat pietátis afféctio, ut de
    cruce súpplicans Patri, non se vindicári, sed illis postuláret ignósci."
responsory6:
  - "R. Noli esse mihi, Dómine, aliénus: parce mihi in die mala: confundántur
    omnes qui me persequúntur,"
  - "* Et non confúndar ego."
  - V. Confundántur omnes inimíci mei, qui quærunt ánimam meam.
  - R. Et non confúndar ego.
  - "&Gloria"
  - "R. Noli esse mihi, Dómine, aliénus: parce mihi in die mala: confundántur
    omnes qui me persequúntur, * Et non confúndar ego."
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 21:1-9"
  - "In illo témpore: Cum appropinquásset Jesus Jerosólymis, et venísset
    Béthphage ad montem Olivéti: tunc misit duos discípulos, dicens eis. Et
    réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Liber 9 in Lucam"
  - "Pulchre relíctis Judǽis, habitatúrus in afféctibus géntium, templum Dóminus
    ascéndit. Hoc enim templum est verum, in quo non in líttera, sed in spíritu
    Dóminus adorátur. Hoc Dei templum est, quod fídei séries, non lápidum
    structúra fundávit. Deserúntur ergo qui óderant: eligúntur qui amatúri
    erant. Et ídeo ad montem venit Olivéti, ut novéllas óleas in sublími virtúte
    plantáret, quarum mater est illa, quæ sursum est, Jerúsalem. In hoc monte
    est ille cæléstis agrícola: ut plantáti omnes in domo Dei, possint virítim
    dícere: Ego autem sicut olíva fructífera in domo Dómini."
responsory7:
  - "R. Dóminus mecum est tamquam bellátor fortis: proptérea persecúti sunt me,
    et intellégere non potuérunt: Dómine, probas renes et corda:"
  - "* Tibi revelávi causam meam."
  - "V. Vidísti, Dómine, iniquitátes eórum advérsum me: júdica judícium meum."
  - R. Tibi revelávi causam meam.
lectio8:
  - "Et fortásse ipse mons Christus est. Quis enim álius tales fructus ferret
    oleárum, non curvescéntium ubertáte baccárum, sed spíritus plenitúdine
    géntium fœcundárum? Ipse est per quem ascéndimus, et ad quem ascéndimus.
    Ipse est jánua, ipse est via, qui aperítur, et qui áperit: qui pulsátur ab
    ingrediéntibus, et ab eméritis adorátur. Ergo in castéllo erat, et ligátus
    erat pullus cum ásina: non póterat solvi nisi jussu Dómini. Solvit eum manus
    apostólica. Talis actus, talis vita, talis grátia. Esto talis et tu, ut
    possis ligátos sólvere."
responsory8:
  - "R. Dixérunt ímpii apud se, non recte cogitántes: Circumveniámus justum,
    quóniam contrárius est opéribus nostris: promíttit se sciéntiam Dei habére,
    Fílium Dei se nóminat, et gloriátur patrem se habére Deum:"
  - "* Videámus si sermónes illíus veri sunt: et si est vere Fílius Dei, líberet
    eum de mánibus nostris: morte turpíssima condemnémus eum."
  - "V. Tamquam nugáces æstimáti sumus ab illo, et ábstinet se a viis nostris
    tamquam ab immundítiis: et præfert novíssima justórum."
  - "R. Videámus si sermónes illíus veri sunt: et si est vere Fílius Dei,
    líberet eum de mánibus nostris: morte turpíssima condemnémus eum."
lectio9:
  - "Nunc considerémus qui fúerint illi, qui erróre detécto, de paradíso ejécti,
    in castéllum sint relegáti. Et vides, quemádmodum quos mors expúlerat, vita
    revocáverit. Et ídeo secúndum Matthǽum, et ásinam et pullum légimus: ut quia
    in duóbus homínibus utérque fúerat sexus expúlsus, in duóbus animálibus
    sexus utérque revocétur. Ergo illic in ásina matre quasi Hevam figurávit
    erróris: hic autem in pullo generalitátem pópuli Gentílis expréssit: et ídeo
    pullo sedétur ásinæ. Et bene, in quo nemo sedit: quia nullus, ántequam
    Christus, natiónum pópulos vocávit ad Ecclésiam. Dénique secúndum Marcum sic
    habes: Quem nemo adhuc sedit hóminum."
responsory9:
  - "R. Circumdedérunt me viri mendáces: sine causa flagéllis cecidérunt me:"
  - "* Sed tu, Dómine defénsor, víndica me."
  - V. Quóniam tribulátio próxima est, et non est qui ádjuvet.
  - R. Sed tu, Dómine defénsor, víndica me.
  - "&Gloria"
  - "R. Circumdedérunt me viri mendáces: sine causa flagéllis cecidérunt me: *
    Sed tu, Dómine defénsor, víndica me."
