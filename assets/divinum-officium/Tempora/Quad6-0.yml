rule:
  - 9 lectiones
  - Symbolum Athanasium(rubrica tridentina)
  - no Gloria
  - Credo
  - Prefatio=Quad5
  - Prelude
  - Passio
  - omit commemoratio
prelude:
  - "#Benedictio Palmorum"
  - "!Antiphona"
  - "!Matt 21:9"
  - "Hosánna fílio David: benedíctus, qui venit in nómine Dómini. O Rex Israël:
    Hosánna in excélsis."
  - "! Deinde Sacerdos stans in cornu Epistolæ, non vertens se ad populum,
    dicit, manibus junctis, in tono Orationis ferialis:"
  - $Dominus vobiscum
  - $Oremus
  - "v. Deus, quem dilígere et amáre justítia est, ineffábilis grátiæ tuæ in
    nobis dona multíplica: et qui fecísti nos in morte Fílii tui speráre quæ
    crédimus; fac nos eódem resurgénte perveníre quo téndimus:"
  - $Qui tecum
  - _
  - _
  - "! Postea Subdiaconus in loco solito cantat sequentem Lectionem in tono
    Epistolæ, et in fine osculatur manum Sacerdotis."
  - "!!Lectio"
  - Léctio libri Exodi.
  - "!Exod 15:27; 16:1-7"
  - "In diébus illis: Venérunt fílii Israël in Elim, ubi erant duódecim fontes
    aquárum et septuagínta palmæ: et castrametáti sunt juxta aquas. Profectíque
    sunt de Elim, et venit omnis multitúdo filiórum Israël in desértum Sin, quod
    est inter Elim et Sínai: quintodécimo die mensis secúndi, postquam egréssi
    sunt de terra Ægýpti. Et murmurávit omnis congregátio filiórum Israël contra
    Móysen et Aaron in solitúdine. Dixerúntque fílii Israël ad eos: Utinam
    mórtui essémus per manum Dómini in terra Ægýpti, quando sedebámus super
    ollas cárnium, et comedebámus panem in saturitáte: cur eduxístis nos in
    desértum istud, ut occiderétis omnem multitúdinem fame? Dixit autem Dóminus
    ad Móysen: Ecce, ego pluam vobis panes de cœlo: egrediátur pópulus, et
    cólligat quæ suffíciunt per síngulos dies: ut tentem eum, utrum ámbulet in
    lege mea an non. Die autem sexto parent quod ínferant: et sit duplum, quam
    collígere sciébant per síngulos dies. Dixerúntque Móyses et Aaron ad omnes
    fílios Israël: Véspere sciétis, quod Dóminus edúxerit vos de terra Ægýpti:
    et mane vidébitis glóriam Dómini."
  - $Deo gratias
  - _
  - _
  - "! Deinde cantatur pro Graduali."
  - "!!Graduale"
  - "!Joann 11:47-49, 50, 53"
  - "R. Collegérunt pontífices et pharisǽi concílium, et dixérunt: Quid fácimus,
    quia hic homo multa signa facit? Si dimíttimus eum sic, omnes credent in
    eum:"
  - "* Et vénient Románi, et tollent nostrum locum et gentem."
  - "V. Unus autem ex illis, Cáiphas nómine, cum esset póntifex anni illíus,
    prophetávit dicens: Expedit vobis, ut unus moriátur homo pro pópulo, et non
    tota gens péreat. Ab illo ergo die cogitavérunt interfícere eum, dicéntes."
  - "* Et vénient Románi, et tollent nostrum locum et gentem."
  - _
  - "!Vel aliud"
  - "!Matt 28:39, 41"
  - "R. In monte Olivéti orávit ad Patrem: Pater, si fíeri potest, tránseat a me
    calix iste."
  - "* Spíritus quidem promptus est, caro autem infírma: fiat volúntas tua."
  - V. Vigiláte et oráte, ut non intrétis in tentatiónem.
  - "* Spíritus quidem promptus est, caro autem infírma: fiat volúntas tua."
  - _
  - _
  - "! Interim dum cantatur Responsorium, Diaconus ponit librum Evangeliorum
    super Altare: et Sacerdos, ministrante Diacono naviculam, ponit incensum in
    thuribulo. Deinde Diaconus dicit: Munda cor meum, accipit librum de Altari,
    petit benedictionem a Sacerdote:"
  - "v. Munda cor meum ac labia mea, omnípotens Deus, qui labia Isaíæ Prophétæ
    cálculo mundásti igníto: ita me tua grata miseratióne dignáre mundáre, ut
    sanctum Evangélium tuum digne váleam nuntiáre. Per Christum, Dóminum
    nostrum."
  - R. Amen.
  - "! Postea accipit librum de Altari, et rursus genuflexus petit benedictionem
    a Sacerdote, dicens:"
  - D. Jube, domne, benedícere.
  - "! Sacerdos respondet:"
  - "S. Dóminus sit in corde tuo et in lábiis tuis: ut digne et competénter
    annúnties Evangélium suum: In nómine Patris, et Fílii, + et Spíritus Sancti.
    Amen."
  - "! postea, Subdiacono librum tenente, medius inter duos Acolythos tenentes
    candelabra accensa, signat librum, incensat, et cantat Evangelium, ut infra,
    more consueto: quo finito, Subdiaconus defert librum osculandum Sacerdoti,
    qui et incensatur a Diacono."
  - _
  - "!!Evangelium"
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum.
  - R. Glória tibi, Dómine.
  - "!Matt 21:1-9"
  - "In illo témpore: Cum appropinquásset Jesus Jerosólymis, et venísset
    Béthphage ad montem Olivéti: tunc misit duos discípulos suos, dicens eis:
    Ite in castéllum, quod contra vos est, et statim inveniétis ásinam alligátam
    et pullum cum ea: sólvite et addúcite mihi: et si quis vobis áliquid
    díxerit, dícite, quia Dóminus his opus habet, et conféstim dimíttet eos. Hoc
    autem totum factum est, ut adimplerétur, quod dictum est per Prophétam,
    dicéntem: Dícite fíliæ Sion: Ecce, Rex tuus venit tibi mansuétus, sedens
    super ásinam et pullum, fílium subjugális. Eúntes autem discípuli, fecérunt,
    sicut præcépit illis Jesus. Et adduxérunt ásinam et pullum: et imposuérunt
    super eos vestiménta sua, et eum désuper sedére tecérunt. Plúrima autem
    turba stravérunt vestiménta sua in via: álii autem cædébant ramos de
    arbóribus, et sternébant in via: turbæ autem, quæ præcedébant et quæ
    sequebántur, clamábant, dicéntes: Hosánna fílio David: benedíctus, qui venit
    in nómine Dómini."
  - R. Laus tibi, Christe!
  - S. Per Evangélica dicta, deleántur nostra delícta.
  - _
  - _
  - "!!Benedictio palmorum"
  - "! Post hæc benedicuntur rami. Sacerdos stans in eodem cornu Epistolæ, dicit
    in tono Orationis ferialis:"
  - $Dominus vobiscum
  - $Oremus
  - "v. Auge fidem in te sperántium, Deus, et súpplicum preces cleménter exáudi:
    véniat super nos múltiplex misericórdia tua: bene + dicántur et hi pálmites
    palmárum, seu olivárum: et sicut in figúra Ecclésiæ multiplicásti Noë
    egrediéntem de arca, et Móysen exeúntem de Ægýpto cum fíliis Israël: ita
    nos, portántes palmas et ramos olivárum, bonis áctibus occurrámus óbviam
    Christo: et per ipsum in gáudium introëámus ætérnum:"
  - $Qui tecum
  - V. Dóminus vobíscum.
  - R. Et cum spíritu tuo.
  - V. Sursum corda.
  - R. Habémus ad Dóminum.
  - V. Grátias agámus Dómino Deo nostro.
  - R. Dignum et justum est.
  - "v. Vere dignum et justum est, æquum et salutáre, nos tibi semper et ubíque
    grátias ágere: Dómine sancte, Pater omnípotens, æterne Deus: Qui gloriáris
    in consílio Sanctórum tuórum. Tibi enim sérviunt creatúræ tuæ: quia te solum
    auctórem et Deum cognóscunt, et omnis factúra tua te colláudat, et
    benedícunt te Sancti tui. Quia illud magnum Unigéniti tui nomen coram
    régibus et potestátibus hujus sǽculi líbera voce confiténtur. Cui assístunt
    Angeli et Archángeli, Throni et Dominatiónes: cumque omni milítia cæléstis
    exércitus hymnum glóriæ tuæ cóncinunt, sine fine dicéntes."
  - v. Sanctus, Sanctus, Sanctus Dóminus, Deus Sábaoth. Pleni sunt cæli et terra
    glória tua. Hosánna in excélsis. Benedíctus, qui venit in nómine Dómini.
    Hosánna in excélsis.
  - _
  - _
  - "! Sequitur."
  - $Dominus vobiscum
  - $Oremus
  - "v. Pétimus, Dómine sancte, Pater omnípotens, ætérne Deus: ut hanc creatúram
    olívæ, quam ex ligni matéria prodíre jussísti, quamque colúmba rédiens ad
    arcam próprio pértulit ore, bene + dícere et sancti + ficáre dignéris: ut,
    quicúmque ex ea recéperint, accípiant sibi protectiónem ánimæ et córporis:
    fiátque, Dómine, nostræ salútis remédium tuæ grátiæ sacraméntum."
  - $Per Dominum
  - _
  - _
  - $Oremus
  - "v. Deus, qui dispérsa cóngregas, et congregáta consérvas: qui pópulis,
    óbviam Jesu ramos portántibus, benedixísti: béne + dic étiam hos ramos palmæ
    et olívæ, quos tui fámuli ad honórem nóminis tui fidéliter suscípiunt; ut,
    in quemcúmque locum introdúcti fúerint, tuam benedictiónem habitatóres loci
    illíus consequántur: et, omni adversitáte effugáta, déxtera tua prótegat,
    quos rédemit Jesus Christus, Fílius tuus, Dóminus noster:"
  - $Qui tecum
  - _
  - _
  - $Oremus
  - "v. Deus, qui miro dispositiónis órdine, ex rebus étiam insensibílibus,
    dispensatiónem nostræ salútis osténdere voluísti: da, quǽsumus; ut devota
    tuórum corda fidélium salúbriter intéllegant, quid mýstice desígnet in
    facto, quod hódie, cœlésti lúmine affláta, Redemptóri óbviam procédens,
    palmárum atque olivárum ramos vestígiis ejus turba substrávit. Palmárum
    igitur rami de mortis príncipe triúmphos exspéctant; súrculi vero olivárum
    spirituálem unctiónem advenísse Quodámmodo clamant. Intelléxit enim jam tunc
    illa hóminum beáta multitúdo præfigurári: quia Redémptor noster, humánis
    cóndolens misériis, pro totíus mundi vita cum mortis príncipe esset
    pugnatúrus ac moriéndo triumphatúrus. Et ídeo tália óbsequens administrávit,
    quæ in illo ei triúmphos victóriæ et misericórdiæ pinguédinem declarárent.
    Quod nos quoque plena fide, et factum et significátum retinéntes, te, Dómine
    sancte, Pater omnípotens, ætérne Deus, per eúndem Dóminum nostrum Jesum
    Christum supplíciter exorámus: ut in ipso atque per ipsum, cujus nos membra
    fíeri voluísti, de mortis império victóriam reportántes, ipsíus gloriósæ
    resurrectiónis partícipes esse mereámur:"
  - $Qui tecum
  - _
  - _
  - $Oremus
  - "v. Deus, qui, per olívæ ramum, pacem terris colúmbam nuntiáre jussísti:
    præsta, quǽsumus; ut hos olívæ ceterarúmque arbórum ramos cœlésti bene +
    dictióne sanctífices: ut cuncto pópulo tuo profíciant ad salútem. Per
    Christum, Dóminum nostrum."
  - R. Amen.
  - _
  - _
  - $Oremus
  - "v. Bene + dic, quǽsumus, Dómine, hos palmárum seu olivárum ramos: et
    præsta; ut, quod pópulus tuus in tui veneratiónem hodiérna die corporáliter
    agit, hoc spirituáliter summa devotióne perfíciat, de hoste victóriam
    reportándo et opus misericórdiæ summópere diligéndo."
  - $Per Dominum
  - _
  - _
  - "! Hic Celebrans ponit incensum in thuribulum, deinde ter aspergit ramos
    aqua benedicta, dicendo Antiphonam Aspérges me sine cantu, et sine Psalmo:
    et ter adolet incenso. Postea dicit:"
  - $Dominus vobiscum
  - $Oremus
  - "v. Deus, qui Fílium tuum Jesum Christum, Dóminum nostrum, pro salute nostra
    in hunc mundum misísti, ut se humiliáret ad nos et nos revocáret ad te: cui
    étiam, dum Jerúsalem veniret, ut adimpléret Scripturas, credentium populorum
    turba, fidelissima devotione, vestimenta sua cum ramis palmarum in via
    sternébant: præsta, quǽsumus; ut illi fídei viam præparémus, de qua, remoto
    lápide offensiónis et petra scándali, fróndeant apud te ópera nostra
    justítiæ ramis: ut ejus vestigia sequi mereámur:"
  - $Qui tecum.
  - _
  - _
  - "!!Pueri Hebræorum"
  - "! Completa benedictione, dignior ex Clero accedit ad Altare, et dat ramum
    benedictum Celebranti, qui non genuflectit, nec osculatur manum dantis.
    Postea Celebrans stans ante Altare versus ad populum, distríbuit ramos,
    primum digniori, a quo ipse accepit, deinde Diacono et Subdiacono paratis,
    et aliis Clericis singulatim per ordinem, ultimo laicis: omnibus
    genuflectentibus et ramum ac manum Celebrantis osculantibus, exceptis
    Prælatis, si adsint. Et cum incoeperit distribuere, a Choro cantantur
    sequentes Antiphonæ:"
  - "!Antiphona"
  - "!Ps 12:13"
  - "Ant. Pueri Hebræórum, portántes ramos olivárum, obviavérunt Dómino,
    clamántes et dicéntes: Hosánna in excélsis."
  - _
  - "!Alia Antiphona"
  - "!Matt 21:8 et 9"
  - "Ant. Púeri Hebræórum vestiménta prosternébant in via et clamábant,
    dicéntes: Hosánna fílio David: benedíctus, qui venit in nómine Dómini."
  - "! Quæ si non sufficiant, repetantur, quousque ramorum distributio finiatur.
    Deinde Sacerdos dicit:"
  - $Dominus vobiscum
  - $Oremus
  - "v. Omnípotens sempitérne Deus, qui Dóminum nostrum Jesum Christum super
    pullum ásinæ sedére fecísti, et turbas populórum vestiménta vel ramos
    arbórum in via stérnere et Hosánna decantáre in laudem ipsíus docuísti: da,
    quǽsumus; ut illórum innocéntiam imitári possímus, et eórum méritum cónsequi
    mereámur."
  - $Per eundem
  - _
  - _
  - "! Postea fit Processio. Et primo Celebrans imponit incensum in thuribulum:
    et Diaconus vertens se ad populum, dicit:"
  - V. Procedámus in pace.
  - "! Et Chorus respondet:"
  - R. In nómine Christi. Amen.
  - "! Præcedit Thuriferarius cum thuribulo fumiganti: deinde Subdiaconus
    paratus, deferens Crucem, medius inter duos Acolythos cum candelabris
    accensis: sequitur Clerus per ordinem, ultimo Celebrans cum Diacono a
    sinistris, omnes cum ramis in manibus: et cantantur sequentes Antiphonæ, vel
    omnes vel aliquæ, quousque durat Processio."
  - "!Antiphona"
  - "!Matt 21:1-3, 7, 8, 9"
  - "v. Cum appropinquáret Dóminus Jerosólymam, misit duos ex discípulis suis,
    dicens: Ite in castéllum, quod contra vos est: et inveniétis pullum ásinæ
    alligátum, super quem nullus hóminum sedit: sólvite et addúcite mihi. Si
    quis vos interrogáverit, dícite: Opus Dómino est. Solvéntes adduxérunt ad
    Jesum: et imposuérunt illi vestiménta sua, et sedit super eum: alii
    expandébant vestiménta sua in via: alii ramos de arbóribus sternébant: et
    qui sequebántur, clamábant: Hosánna, benedíctus, qui venit in nómine Dómini:
    benedíctum regnum patris nostri David: Hosánna in excélsis: miserére nobis,
    fili David."
  - _
  - "!Alia Antiphona"
  - "!Joann 12:12, 13"
  - "v. Cum audísset pópulus, quia Jesus venit Jerosólymam, accepérunt ramos
    palmárum: et exiérunt ei óbviam, et clamábant púeri, dicéntes: Hic est, qui
    ventúrus est in salútem pópuli. Hic est salus nostra et redémptio Israël.
    Quantus est iste, cui Throni et Dominatiónes occúrrunt! Noli timére, fília
    Sion: ecce, Rex tuus venit tibi, sedens super pullum ásinæ, sicut scriptum
    est, Salve, Rex, fabricátor mundi, qui venísti redímere nos."
  - _
  - "!Alia Antiphona."
  - "v. Ante sex dies sollémnis Paschæ, quando venit Dóminus in civitátem
    Jerúsalem, occurrérunt ei pueri: et in mánibus portábant ramos palmárum, et
    clamábant voce magna, dicéntes: Hosánna in excélsis: benedíctus, qui venísti
    in multitúdine misericórdiæ tuæ: Hosánna in excélsis."
  - _
  - "!Alia Antiphona."
  - "v. Occúrrunt turbæ cum flóribus et palmis Redemptóri óbviam: et victóri
    triumphánti digna dant obséquia: Fílium Dei ore gentes prædicant: et in
    laudem Christi voces tonant per núbila: Hosánna in excélsis."
  - _
  - "!Alia Antiphona."
  - "v. Cum Angelis et púeris fidéles inveniántur, triumphatóri mortis damántes:
    Hosánna in excélsis. Alia Antiphona. Turba multa, quæ convénerat ad diem
    festum, clamábat Dómino: Benedíctus, qui venit in nómine Dómini: Hosánna in
    excélsis."
  - _
  - "!Alia Antiphona."
  - "v. Turba multa, quæ convénerat ad diem festum, clamábat Dómino: Benedíctus,
    qui venit in nómine Dómini: Hosánna in excélsis."
  - _
  - _
  - "! In reversione Processionis, duo vel quatuor Cantores intrant in
    ecclesiam, et clauso ostio, stantes versa facie ad Processionem, incipiunt
    Glória, laus, et decantant duos primos versus. Sacerdos vero, cum aliis
    extra ecclesiam, repetit eosdem."
  - "!Deinde, qui sunt intus, cantant alios versus sequentes: vel omnes vel
    partem, prout videbitur: et, qui sunt extra, ad quoslibet duos versus
    respondent: Glória, laus, sicut a principio"
  - "V. Glória, laus et honor tibi sit, Rex Christe, Redémptor: Cui pueríle
    decus prompsit Hosánna pium."
  - "R. Glória, laus et honor tibi sit, Rex Christe, Redémptor: Cui pueríle
    decus prompsit Hosánna pium."
  - "v. Israël es tu Rex, Davidis et ínclita proles: Nómine qui in Dómini, Rex
    benedícte, venis."
  - "R. Glória, laus et honor tibi sit, Rex Christe, Redémptor: Cui pueríle
    decus prompsit Hosánna pium."
  - v. Cœtus in excélsis te laudat cælicus omnis, Et mortális homo, et cuncta
    creáta simul.
  - "R. Glória, laus et honor tibi sit, Rex Christe, Redémptor: Cui pueríle
    decus prompsit Hosánna pium."
  - "v. Plebs Hebræa tibi cum palmis óbvia venit: Cum prece, voto, hymnis,
    ádsumus ecce tibi."
  - "R. Glória, laus et honor tibi sit, Rex Christe, Redémptor: Cui pueríle
    decus prompsit Hosánna pium."
  - "v. Hi tibi passúro solvébant múnia laudis: Nos tibi regnánti pángimus ecce
    melos."
  - "R. Glória, laus et honor tibi sit, Rex Christe, Redémptor: Cui pueríle
    decus prompsit Hosánna pium."
  - "v. Hi placuére tibi, pláceat devótio nostra: Rex bone, Rex clemens, cui
    bona cuncta placent."
  - "R. Glória, laus et honor tibi sit, Rex Christe, Redémptor: Cui pueríle
    decus prompsit Hosánna pium."
  - _
  - _
  - "! Postea Subdiaconus hastili Crucis percutit portam: qua statim aperta,
    Processio intrat ecclesiam, cantando:"
  - "!!Responsorium"
  - R. Ingrediénte Dómino in sanctam civitátem, Hebræórum púeri resurrectiónem
    vitæ pronuntiántes,
  - "* Cum ramis palmárum: Hosánna, clamábant, in excélsis."
  - V. Cum audísset pópulus, quod Jesus veníret Jerosólymam, exiérunt óbviam ei.
  - "* Cum ramis palmárum: Hosánna, clamábant, in excélsis."
  - _
  - "! Deinde celebratur Missa, et rami tenentur in manibus, dum cantatur Passio
    et Evangelium tantum."
introitus:
  - "!Ps 21:20 et 22."
  - "v. Dómine, ne longe fácias auxílium tuum a me, ad defensiónem meam áspice:
    líbera me de ore leónis, et a córnibus unicórnium humilitátem meam."
  - "!Ps 21:2"
  - "Deus, Deus meus, réspice in me: quare me dereliquísti? longe a salúte mea
    verba delictórum meórum."
  - "v. Dómine, ne longe fácias auxílium tuum a me, ad defensiónem meam áspice:
    líbera me de ore leónis, et a córnibus unicórnium humilitátem meam."
oratio:
  - "Omnípotens sempitérne Deus, qui humáno géneri, ad imitándum humilitátis
    exémplum, Salvatórem nostrum carnem súmere et crucem subíre fecísti: concéde
    propítius; ut et patiéntiæ ipsíus habére documénta et resurrectiónis
    consórtia mereámur."
  - $Per eundem
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Philippénses.
  - "!Phil 2:5-11"
  - "Fratres: Hoc enim sentíte in vobis, quod et in Christo Jesu: qui, cum in
    forma Dei esset, non rapínam arbitrátus est esse se æquálem Deo: sed
    semetípsum exinanívit, formam servi accípiens, in similitúdinem hóminum
    factus, et hábitu invéntus ut homo. Humiliávit semetípsum, factus obédiens
    usque ad mortem, mortem autem crucis. Propter quod et Deus exaltávit illum:
    et donávit illi nomen, quod est super omne nomen: (hic genuflectitur) ut in
    nómine Jesu omne genu flectátur cœléstium, terréstrium et infernórum: et
    omnis lingua confiteátur, quia Dóminus Jesus Christus in glória est Dei
    Patris."
graduale:
  - "!Ps 72:24 et 1-3"
  - "Tenuísti manum déxteram meam: et in voluntáte tua deduxísti me: et cum
    glória assumpsísti me."
  - "V. Quam bonus Israël Deus rectis corde! mei autem pæne moti sunt pedes:
    pæne effúsi sunt gressus mei: quia zelávi in peccatóribus, pacem peccatórum
    videns."
  - _
  - "!Tractus 21:2-9, 18, 19, 22, 24, 32"
  - "Deus, Deus meus, réspice in me: quare me dereliquísti?"
  - V. Longe a salúte mea verba delictórum meórum.
  - "V. Deus meus, clamábo per diem, nec exáudies: in nocte, et non ad
    insipiéntiam mihi."
  - V. Tu autem in sancto hábitas, laus Israël.
  - "V. In te speravérunt patres nostri: speravérunt, et liberásti eos."
  - "V. Ad te clamavérunt, et salvi facti sunt: in te speravérunt, et non sunt
    confúsi."
  - "V. Ego autem sum vermis, et non homo: oppróbrium hóminum et abjéctio
    plebis."
  - "V. Omnes, qui vidébant me, aspernabántur me: locúti sunt lábiis et movérunt
    caput."
  - "V. Sperávit in Dómino, erípiat eum: salvum fáciat eum, quóniam vult eum."
  - "V. Ipsi vero consideravérunt et conspexérunt me: divisérunt sibi vestiménta
    mea, et super vestem meam misérunt sortem."
  - "V. Líbera me de ore leónis: et a córnibus unicórnium humilitátem meam."
  - "V. Qui timétis Dóminum, laudáte eum: univérsum semen Jacob, magnificáte
    eum."
  - "V. Annuntiábitur Dómino generátio ventúra: et annuntiábunt cœli justítiam
    ejus."
  - V. Pópulo, qui nascétur, quem fecit Dóminus.
