introitus:
  - "!Ps 17:48-49"
  - "v. Liberátor meus de géntibus iracúndis: ab insurgéntibus in me exaltábis
    me: a viro iníquo erípies me, Dómine."
  - "!Ps 17:2-3"
  - "Díligam te, Dómine, virtus mea: Dóminus firmaméntum meum, et refúgium meum,
    et liberátor meus."
  - "v. Liberátor meus de géntibus iracúndis: ab insurgéntibus in me exaltábis
    me: a viro iníquo erípies me, Dómine."
oratio:
  - "Sanctificáto hoc jejúnio, Deus, tuórum corda fidélium miserátor illústra:
    et quibus devotiónis præstas afféctum, præbe supplicántibus pium benígnus
    audítum."
  - $Per Dominum
lectio:
  - Léctio libri Levítici.
  - "!Lev 19:1-2, 11-19, 25"
  - "In diébus illis: Locútus est Dóminus ad Móysen, dicens: Lóquere ad omnem
    cœtum filiórum Israël, et dices ad eos: Ego Dóminus, Deus vester. Non
    faciétis furtum. Non mentiémini, nec decípiet unusquísque próximum suum. Non
    perjurábis in nómine meo, nec póllues nomen Dei tui. Ego Dóminus. Non fácies
    calúmniam próximo tuo: nec vi ópprimes eum. Non morábitur opus mercenárii
    tui apud te usque mane. Non maledíces surdo, nec coram cæco pones
    offendículum: sed timébis Dóminum, Deum tuum, quia ego sum Dóminus. Non
    fácies quod iníquum est, nec injúste judicábis. Non consíderes persónam
    páuperis, nec honóres vultum poténtis. Juste júdica próximo tuo. Non eris
    criminátor, nec susúrro in pópulo. Non stabis contra sánguinem próximi tui.
    Ego Dóminus. Non óderis fratrem tuum in corde tuo, sed públice árgue eum, ne
    hábeas super illo peccátum. Non quæras ultiónem, nec memor eris injúriæ
    cívium tuórum. Díliges amícum tuum sicut teípsum. Ego Dóminus. Leges meas
    custodíte. Ego enim sum Dóminus, Deus vester."
graduale:
  - "!Ps 29:2-4"
  - "Exaltábo te, Dómine, quóniam suscepísti me: nec delectásti inimícos meos
    super me."
  - "V. Dómine, Deus meus, clamávi ad te, et sanásti me: Dómine, abstraxísti ab
    ínferis ánimam meam, salvásti me a descendéntibus in lacum."
  - _
  - "!Tractus"
  - "!Ps 102:10"
  - "Dómine, non secúndum peccáta nostra, quæ fécimus nos: neque secúndum
    iniquitátes nostras retríbuas nobis."
  - "!Ps 78:8-9"
  - "V. Dómine, ne memíneris iniquitátum nostrárum antiquárum: cito antícipent
    nos misericórdiæ tuæ, quia páuperes facti sumus nimis. (Hic genuflectitur)"
  - "V. Adjuva nos, Deus, salutáris noster: et propter glóriam nóminis tui,
    Dómine, líbera nos: et propítius esto peccátis nostris, propter nomen tuum."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem.
  - "!Joann 10:22-38"
  - "In illo témpore: Facta sunt encǽnia in Jerosólymis: et hiems erat. Et
    ambulábat Jesus in templo, in pórticu Salomónis. Circumdedérunt ergo eum
    Judǽi, et dicébant ei: Quoúsque ánimam nostram tollis? Si tu es Christus,
    dic nobis palam. Respóndit eis Jesus: Loquor vobis, et non créditis: Opera,
    quæ ego fácio in nómine Patris mei, hæc testimónium pérhibent de me: sed vos
    non créditis, quia non estis ex óvibus meis. Oves meæ vocem meam áudiunt: et
    ego cognósco eas, et sequúntur me: et ego vitam ætérnam do eis: et non
    períbunt in ætérnum, et non rápiet eas quisquam de manu mea. Pater meus quod
    dedit mihi, majus ómnibus est: et nemo potest rápere de manu Patris mei. Ego
    et Pater unum sumus. Sustulérunt ergo lápides Judǽi, ut lapidárent
    eum.  Respóndit eis Jesus: Multa bona ópera osténdi vobis ex Patre meo,
    propter quod eórum opus me lapidátis? Respondérunt ei Judǽi: De bono ópere
    non lapidámus te, sed de blasphémia: et quia tu, homo cum sis, facis teípsum
    Deum. Respóndit eis Jesus: Nonne scriptum est in lege vestra: quia ego dixi,
    dii estis? Si illos dixit deos, ad quos sermo Dei factus est, et non potest
    solvi Scriptúra: quem Pater sanctificávit, et misit in mundum, vos dícitis:
    Quia blasphémas: quia dixi, Fílius Dei sum? Si non fácio ópera Patris mei,
    nolíte crédere mihi. Si autem fácio, et si mihi non vultis crédere, opéribus
    crédite, ut cognoscátis et credátis, quia Pater in me est et ego in Patre."
offertorium:
  - "!Ps 58:2"
  - "Eripe me de inimícis meis, Deus meus: et ab insurgéntibus in me líbera me,
    Dómine."
secreta:
  - "Annue, miséricors Deus: ut hóstias placatiónis et laudis sincéro tibi
    deferámus obséquio."
  - $Per Dominum
communio:
  - "!Ps 25:6-7"
  - "Lavábo inter innocéntes manus meas, et circuíbo altáre tuum, Dómine: ut
    áudiam vocem laudis tuæ, et enárrem univérsa mirabília tua."
postcommunio:
  - "@Tempora/Quadp3-4:Postcommunio"
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Adésto supplicatiónibus nostris, omnípotens Deus: et, quibus fidúciam
    sperándæ pietátis indúlges; consuétæ misericórdiæ tríbue benígnus efféctum."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 10:22-38"
  - "In illo témpore: Facta sunt encǽnia in Jerosólymis: et hiems erat. Et
    ambulábat Jesus in templo, in pórticu Salomónis. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tractatus 48 in Joannem, circa init."
  - "Encǽnia festívitas erat dedicatiónis templi. Græce enim cænon dícitur
    novum. Quandocúmque novum áliquid fúerit dedicátum, encǽnia vocántur. Jam et
    usus habet hoc verbum. Si quis nova túnica induátur, encæniáre dícitur.
    Illum enim diem, quo templum dedicátum est, Judǽi solémniter celebrábant:
    ipse dies festus agebátur, cum ea quæ lecta sunt, locútus est Dóminus."
responsory1:
  - "@Tempora/Quad5-0:Responsory7"
lectio2:
  - "Hiems erat, et ambulábat Jesus in templo, in pórticu Salomónis.
    Circumdedérunt ergo eum Judǽi, et dicébant ei: Quoúsque ánimam nostram
    tollis? Si tu es Christus, dic nobis palam. Non veritátem desiderábant, sed
    calúmniam præparábant. Hiems erat, et frígidi erant: ad illum enim divínum
    ignem accédere pigri erant. Si accédere est crédere: qui credit, accédit:
    qui negat, recédit. Non movétur ánima pédibus, sed afféctibus."
responsory2:
  - "@Tempora/Quad5-0:Responsory8"
lectio3:
  - "Frigúerant diligéndi caritáte, et ardébant nocéndi cupiditáte. Longe
    áberant, et ibi erant: non accedébant credéndo, et premébant persequéndo.
    Quærébant audíre a Dómino, Ego sum Christus: et fortásse de Christo secúndum
    hóminem sapiébant. Prædicavérunt enim prophétæ Christum: sed divinitátem
    Christi et in prophétis et in ipso Evangélio nec hærétici intéllegunt:
    quanto minus Judǽi, quámdiu velámen est super cor eórum?"
responsory3:
  - "@Tempora/Quad5-0:Responsory9"
