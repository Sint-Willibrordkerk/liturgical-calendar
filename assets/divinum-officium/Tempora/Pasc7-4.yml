lectio1:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 9:1-6"
  - "In illo témpore: Convocátis Jesus duódecim Apóstolis, dedit illis virtútem
    et potestátem super ómnia dæmónia, et ut languóres curárent. Et réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Liber 6 in cap. 9 Lucæ"
  - "Qualis débeat esse, qui evangelízat regnum Dei, præcéptis evangélicis
    designátur: ut sine virga, sine pera, sine calceaménto, sine pane, sine
    pecúnia, hoc est, subsídii sæculáris adminícula non requírens, fidéque
    tutus, putet sibi quo minus ea requírat, magis posse suppétere. Quæ possunt,
    qui volunt, ad eum deriváre tractátum, ut spiritálem tantúmmodo locus iste
    formáre videátur afféctum: qui velut induméntum quoddam videátur córporis
    exuísse, non solum potestáte rejécta contemptísque divítiis, sed étiam
    carnis ipsíus illécebris abdicátis. Quibus primo ómnium datur pacis atque
    constántiæ generále mandátum, ut pacem ferant, constántiam servent,
    hospitális necessitúdinis jura custódiant: aliénum a prædicatóre regni
    cæléstis ástruens cursitáre per domos, et inviolábilis hospítii jura
    mutáre."
responsory1:
  - "R. Advénit ignis divínus, non combúrens sed illúminans, non consúmens sed
    lucens: et invénit corda discipulórum receptácula munda:"
  - "* Et tríbuit eis charísmatum dona, allelúja, allelúja."
  - V. Invénit eos concórdes caritáte, et collustrávit eos inúndans grátia
    Deitátis.
  - R. Et tríbuit eis charísmatum dona, allelúja, allelúja.
lectio2:
  - "Sed, ut hospítii grátia deferénda censétur: ita étiam, si non recipiántur,
    excutiéndum púlverem, et egrediéndum de civitáte mandátur. Quo non medíocris
    boni remunerátio docétur hospítii: ut non solum pacem tribuámus hospítibus,
    verum étiam, si qua eos terrénæ obúmbrant delícta levitátis, recéptis
    apostólicæ prædicatiónis vestígiis auferántur. Nec otióse secúndum Matthǽum,
    domus, quam ingrediántur Apóstoli, eligénda decérnitur: ut mutándi hospítii,
    necessitudinísque violándæ causa non súppetat. Non tamen éadem cáutio
    receptóri mandátur hospítii: ne, dum hospes elígitur, hospitálitas ipsa
    minuátur."
responsory2:
  - "R. Spíritus Sanctus replévit totam domum, ubi erant Apóstoli: et
    apparuérunt illis dispertítæ linguæ, tamquam ignis, sedítque supra síngulos
    eórum:"
  - "* Et repléti sunt omnes Spíritu Sancto, et cœpérunt loqui váriis linguis,
    prout Spíritus Sanctus dabat éloqui illis, allelúja, allelúja, allelúja."
  - V. Dum ergo essent in unum discípuli congregáti propter metum Judæórum,
    sonus repénte de cælo venit super eos.
  - R. Et repléti sunt omnes Spíritu Sancto, et cœpérunt loqui váriis linguis,
    prout Spíritus Sanctus dabat éloqui illis, allelúja, allelúja, allelúja.
  - "&Gloria"
  - R. Et repléti sunt omnes Spíritu Sancto, et cœpérunt loqui váriis linguis,
    prout Spíritus Sanctus dabat éloqui illis, allelúja, allelúja, allelúja.
lectio3:
  - "Sed hæc, ut secúndum lítteram de hospítii religióne venerábilis est forma
    præcépti: ita étiam de mystério senténtia cæléstis arrídet. Etenim cum domus
    elígitur, dignus hospes inquíritur. Videámus ígitur, ne forte Ecclésia
    præferénda designétur, et Christus. Quæ enim dígnior domus apostólicæ
    prædicatiónis ingréssu, quam sancta Ecclésia? Aut quis præferéndus magis
    ómnibus vidétur esse quam Christus, qui pedes suis laváre consuévit
    hospítibus: et quoscúmque sua recéperit domo, pollútis non patiátur habitáre
    vestígiis; sed maculósos licet vitæ prióris, in réliquum tamen dignétur
    mundáre procéssus? Hic est ígitur solus, quem nemo debet desérere, nemo
    mutáre. Cui bene dícitur: Dómine, ad quem íbimus? verba vitæ ætérnæ habes,
    et nos crédimus."
  - "&teDeum"
