evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 9:1-6"
  - "In illo témpore: Convocátis Jesus duódecim Apóstolis, dedit illis virtútem
    et potestátem super ómnia dæmónia, et ut languóres curárent. Et misit illos
    prædicáre regnum Dei et sanáre infírmos. Et ait ad illos: Nihil tuléritis in
    via, neque virgam, neque peram, neque panem, neque pecúniam, neque duas
    túnicas habeátis. Et in quamcúmque domum intravéritis, ibi manéte et inde ne
    exeátis. Et quicúmque non recéperint vos: exeúntes de civitáte illa, étiam
    púlverem pedum vestrórum excútite in testimónium supra illos. Egréssi autem
    circuíbant per castélla, evangelizántes et curántes ubíque."
offertorium:
  - "!Ps 67:29-30"
  - "Confírma hoc, Deus, quod operátus es in nobis: a templo tuo, quod est in
    Jerúsalem, tibi ófferent reges múnera, allelúja."
secreta:
  - "Múnera, quǽsumus, Dómine, oblata sanctífica: et corda nostra Sancti
    Spíritus illustratióne emúnda."
  - $Per Dominum eiusdem
