lectio:
  - Léctio Actuum Apostolórum
  - "!Acts 8:5-8"
  - "In diébus illis: Philíppus descéndens in civitátem Samaríæ, prædicábat
    illis Christum. Intendébant autem turbæ his, quæ a Philíppo dicebántur,
    unanímiter audiéntes et vidéntes signa, quæ faciébat. Multi enim eórum, qui
    habébant spíritus immúndos, clamántes voce magna, exíbant. Multi autem
    paralýtici et claudi curáti sunt. Factum est ergo gáudium magnum in illa
    civitáte."
graduale:
  - Allelúja, allelúja.
  - "!Ps 103:30"
  - V. Emítte Spíritum tuum, et creabúntur, et renovábis fáciem terræ. Allelúja.
    (Hic genuflectitur)
  - "V. Veni, Sancte Spíritus, reple tuórum corda fidélium: et tui amóris in eis
    ignem accénde."
