introitus:
  - "!Ps 46:2"
  - "v. Omnes gentes, pláudite mánibus: jubiláte Deo in voce exsultatiónis."
  - "!Ps 46:3"
  - "Quóniam Dóminus excélsus, terríbilis: Rex magnus super omnem terram."
  - "&Gloria"
  - "v. Omnes gentes, pláudite mánibus: jubiláte Deo in voce exsultatiónis."
oratio:
  - "Deus, cujus providéntia in sui dispositióne non fállitur: te súpplices
    exorámus; ut nóxia cuncta submóveas, et ómnia nobis profutúra concédas."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Romános
  - "!Rom 6:19-23"
  - "Fratres: Humánum dico, propter infirmitátem carnis vestræ: sicut enim
    exhibuístis membra vestra servíre immundítiæ et iniquitáti ad iniquitátem,
    ita nunc exhibéte membra vestra servíre justítiæ in sanctificatiónem. Cum
    enim servi essétis peccáti, líberi fuístis justítiæ. Quem ergo fructum
    habuístis tunc in illis, in quibus nunc erubéscitis? Nam finis illórum mors
    est. Nunc vero liberáti a peccáto, servi autem facti Deo, habétis fructum
    vestrum in sanctificatiónem, finem vero vitam ætérnam. Stipéndia enim
    peccáti mors. Grátia autem Dei vita ætérna, in Christo Jesu, Dómino nostro."
graduale:
  - "!Ps 33:12; 33:6"
  - "Veníte, fílii, audíte me: timórem Dómini docébo vos."
  - "V. Accédite ad eum, et illuminámini: et fácies vestræ non confundéntur."
  - Allelúja, allelúja.
  - "!Ps 46:2"
  - "Omnes gentes, pláudite mánibus: jubiláte Deo in voce exsultatiónis.
    Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 7:15-21"
  - "In illo témpore: Dixit Jesus discípulis suis: Atténdite a falsis prophétis,
    qui véniunt ad vos in vestiméntis óvium, intrínsecus autem sunt lupi
    rapáces: a frúctibus eórum cognoscétis eos. Numquid cólligunt de spinis
    uvas, aut de tríbulis ficus? Sic omnis arbor bona fructus bonos facit: mala
    autem arbor malos fructus facit. Non potest arbor bona malos fructus fácere:
    neque arbor mala bonos fructus fácere. Omnis arbor, quæ non facit fructum
    bonum, excidétur et in ignem mittétur. Igitur ex frúctibus eórum cognoscétis
    eos. Non omnis, qui dicit mihi, Dómine, Dómine, intrábit in regnum cœlórum:
    sed qui facit voluntátem Patris mei, qui in cœlis est, ipse intrábit in
    regnum cœlórum.~"
offertorium:
  - "!Dan 3:40"
  - "v. Sicut in holocáustis aríetum et taurórum, et sicut in mílibus agnórum
    pínguium: sic fiat sacrifícium nostrum in conspéctu tuo hódie, ut pláceat
    tibi: quia non est confúsio confidéntibus in te, Dómine."
secreta:
  - "Deus, qui legálium differéntiam hostiárum unius sacrifícii perfectione
    sanxísti: accipe sacrifícium a devótis tibi fámulis, et pari benedictióne,
    sicut múnera Abel, sanctífica; ut, quod sínguli obtulérunt ad majestátis tuæ
    honórem, cunctis profíciat ad salútem."
  - $Per Dominum
communio:
  - "!Ps 30:3"
  - Inclína aurem tuam, accélera, ut erípias me.
postcommunio:
  - Tua nos, Dómine, medicinális operátio, et a nostris perversitátibus
    cleménter expédiat, et ad ea, quæ sunt recta, perdúcat.
  - $Per Dominum
ant-1_:
  - "Unxérunt Salomónem * Sadoc sacérdos et Nathan prophéta, regem in Gihon et
    ascendéntes læti dixérunt: Vivat rex in ætérnum."
ant-1:
  - "@:Ant 1_"
rubrica-cisterciensis/ant-1:
  - "@:Ant 1C"
ant-1c:
  - "Dóleo super te, frater mi Jónatha, amábilis valde super amórem mulíerum: et
    sicut mater únicum amat fílium, ita te diligébam: sagítta Jónathæ numquam
    ábiit retrórsum, nec declinávit clypeus ejus de bello, et hasta ejus non est
    avérsa."
lectio1:
  - Incipit liber tértius Regum
  - "!3 Reg 1:1-4"
  - "1 Et rex David senúerat habebátque ætátis plúrimos dies: cumque operirétur
    véstibus, non calefiébat."
  - "2 Dixérunt ergo ei servi sui: Quærámus dómino nostro regi adolescéntulam
    vírginem, et stet coram rege et fóveat eum dormiátque in sinu suo et
    calefáciat dóminum nostrum regem."
  - 3 Quæsiérunt ígitur adolescéntulam speciósam in ómnibus fínibus Israël et
    invenérunt Abísag Sunamítidem et adduxérunt eam ad regem.
  - 4 Erat autem puélla pulchra nimis dormiebátque cum rege et ministrábat ei;
    rex vero non cognóvit eam.
responsory1:
  - "@Tempora/Pent01-1"
lectio2:
  - "!3 Reg 1:5-8"
  - "5 Adonías autem fílius Haggith elevabátur, dicens: Ego regnábo. Fecítque
    sibi currus et équites et quinquagínta viros, qui cúrrerent ante eum."
  - "6 Nec corrípuit eum pater suus aliquándo dicens: Quare hoc fecísti? Erat
    autem et ipse pulcher valde, secúndus natu post Absalom."
  - 7 Et sermo ei cum Joab fílio Sárviæ et cum Abíathar sacerdóte, qui
    adjuvábant partes Adoníæ.
  - 8 Sadoc vero sacérdos, et Banájas fílius Jójadæ, et Nathan prophéta, et
    Sémei et Rei, et robur exércitus David non erat cum Adonía.
responsory2:
  - "@Tempora/Pent01-1"
lectio3:
  - "!3 Reg 1:11-15"
  - "11 Dixit ítaque Nathan ad Bethsabée matrem Salomónis: Num audísti quod
    regnáverit Adonías fílius Haggith, et dóminus noster David hoc ignórat?"
  - 12 Nunc ergo veni, áccipe consílium a me et salva ánimam tuam filiíque tui
    Salomónis.
  - "13 Vade et ingrédere ad regem David et dic ei: Nonne tu, dómine mi rex,
    jurásti mihi ancíllæ tuæ dicens: Sálomon fílius tuus regnábit post me et
    ipse sedébit in sólio meo? Quare ergo regnat Adonías?"
  - 14 Et, adhuc ibi te loquénte cum rege, ego véniam post te et complébo
    sermónes tuos.
  - 15 Ingréssa est ítaque Bethsabée ad regem in cubículum.
responsory3:
  - "@Tempora/Pent01-1"
lectio4:
  - Ex Epístola sancti Hierónymi Presbýteri ad Nepotiánum
  - "!Epist. 2, tom. 1"
  - "David annos natus septuagínta, bellicósus quondam vir, senectúte
    frigescénte, non póterat calefíeri. Quǽritur ítaque puélla de univérsis
    fínibus Israël Abísag Sunamítis, quæ cum rege dormíret, et seníle corpus
    calefáceret. Quæ est ista Sunamítis, uxor et virgo, tam fervens, ut frígidum
    calefáceret; tam sancta, ut caléntem ad libídinem non provocáret? Expónat
    sapientíssimus Sálomon patris sui delícias, et pacíficus bellatóris viri
    narret ampléxus: Pósside sapiéntiam, pósside intelligéntiam. Ne
    obliviscáris, et ne declináveris a verbis oris mei: neque derelínquas illam,
    et apprehéndet te: ama illam, et servábit te. Princípium sapiéntiæ, pósside
    sapiéntiam, et in omni possessióne tua pósside intelligéntiam: circúmda
    illam, et exaltábit te; honóra illam, et amplexábitur te, ut det cápiti tuo
    corónam gratiárum. Coróna quoque deliciárum próteget te."
responsory4:
  - "@Tempora/Pent01-2:Responsory1"
lectio5:
  - "Omnes pene virtútes córporis mutántur in sénibus, et crescénte sola
    sapiéntia, decréscunt cétera: jejúnia, vigíliæ, chaméuniæ, id est, super
    paviméntum dormitiónes, huc illúcque discúrsus, peregrinórum suscéptio,
    defénsio páuperum, instántia oratiónum et perseverántia, visitátio
    languéntium, labor mánuum unde præbeántur eleemósynæ. Et, ne sermónem
    lóngius prótraham, cuncta exercéntur, fracto córpore, minóra fiunt."
responsory5:
  - "@Tempora/Pent01-2:Responsory2"
lectio6:
  - Nec hoc dico, quod in juvénibus et adhuc solidióris ætátis, his dumtáxat,
    qui labóre et ardentíssimo stúdio, vitæ quoque sanctimónia, et oratiónis ad
    Dóminum Jesum frequéntia, sciéntiam consecúti sunt, frígeat sapiéntia, quæ
    in plerísque sénibus ætáte marcéscit; sed quod adolescéntia multa córporis
    bella sustíneat, et inter incentíva vitiórum et carnis titillatiónes, quasi
    ignis in lignis virídibus suffocétur, ut suum non possit explicáre fulgórem.
    Senéctus vero rursus eórum qui adolescéntiam suam honéstis ártibus
    instruxérunt, et in lege Dómini meditáti sunt die ac nocte, ætáte fit
    dóctior, usu trítior, procéssu témporis sapiéntior, et véterum studiórum
    dulcíssimos fructus metit.
responsory6:
  - "@Tempora/Pent01-2:Responsory3"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 7:15-21"
  - "In illo témpore: Dixit Jesus discípulis suis: Atténdite a falsis prophétis,
    qui véniunt ad vos in vestiméntis óvium, intrínsecus autem sunt lupi
    rapáces. Et réliqua."
  - _
  - Homilía sancti Hilárii Epíscopi
  - "!Comment. in Matth. can. 6"
  - "Blandiménta verbórum et mansuetúdinis simulatiónem ádmonet fructu
    operatiónis expéndi oportére; ut non qualem quis verbis réferat, sed qualem
    se rebus effíciat, spectémus; quia in multis vestítu óvium rábies lupína
    contégitur. Ergo ut spinæ uvas, ut tríbuli ficus non génerant, et ut iníquæ
    árbores utília poma non áfferunt; ita ne in istis quidem consístere docet
    boni óperis efféctum, et idcírco omnes cognoscéndos esse de frúctibus.
    Regnum enim cælórum sola verbórum offícia non óbtinent; neque qui díxerit:
    Dómine, Dómine, heres illíus erit."
responsory7:
  - "@Tempora/Pent01-3:Responsory1"
lectio8:
  - "Quid enim mériti est Dómino dícere, Dómine? Numquid Dóminus non erit, nisi
    fúerit dictus a nobis? Et quæ offícii sánctitas est nóminis nuncupátio, cum
    cæléstis regni iter obediéntia pótius voluntátis Dei, non nuncupátio,
    repertúra sit? Multi mihi dicent in illa die: Dómine, Dómine, nonne in tuo
    nómine prophetávimus? Etiam nunc pseudoprophetárum frauduléntiam et
    hypocritárum simulaménta condémnat, qui glóriam sibi ex verbi virtúte
    præsúmunt, in doctrínæ prophetía, et dæmoniórum fuga, et istiúsmodi óperum
    virtútibus."
responsory8:
  - "@Tempora/Pent01-0:Responsory8"
lectio9:
  - "Atque hinc sibi regnum cælórum pollicéntur: quasi vero eórum áliquid
    próprium sit, quæ loquúntur aut fáciunt, et non ómnia virtus Dei invocáta
    perfíciat; cum doctrínæ sciéntiam léctio áfferat, dæmónia Christi nomen
    exágitet. De nostro ígitur est beáta illa ætérnitas promerénda,
    præstandúmque est áliquid ex próprio, ut bonum velímus, malum omne vitémus,
    totóque afféctu præcéptis cæléstibus obtemperémus, ac tálibus offíciis
    cógniti Deo simus, agamúsque pótius quod vult, quam quod potest gloriémur;
    repúdians eos ac repéllens, quos a cognitióne sua, ópera iniquitátis
    avérterint."
  - "&teDeum"
