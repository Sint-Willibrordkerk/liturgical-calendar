commemoratio:
  - "!Commemoratio pro Octava S. Joseph"
  - "@Tempora/Pasc2-3:Oratio"
lectio1:
  - Incipit liber Apocalýpsis beáti Joánnis Apóstoli
  - "!Apo 1:1-6"
  - "1 Apocalýpsis Jesu Christi, quam dedit illi Deus palam fácere servis suis,
    quæ opórtet fíeri cito: et significávit, mittens per ángelum suum servo suo
    Joánni,"
  - 2 qui testimónium perhíbuit verbo Dei, et testimónium Jesu Christi,
    quæcúmque vidit.
  - "3 Beátus qui legit, et audit verba prophetíæ hujus, et servat ea, quæ in ea
    scripta sunt: tempus enim prope est."
  - "4 Joánnes septem ecclésiis, quæ sunt in Asia. Grátia vobis, et pax ab eo,
    qui est, et qui erat, et qui ventúrus est: et a septem spirítibus qui in
    conspéctu throni ejus sunt:"
  - 5 et a Jesu Christo, qui est testis fidélis, primogénitus mortuórum, et
    princeps regum terræ, qui diléxit nos, et lavit nos a peccátis nostris in
    sánguine suo,
  - "6 et fecit nos regnum, et sacerdótes Deo et Patri suo: ipsi glória et
    impérium in sǽcula sæculórum. Amen."
responsory1:
  - "R. Dignus es, Dómine, accípere librum, et aperíre signácula ejus, allelúja:
    quóniam occísus es, et redemísti nos Deo"
  - "* In sánguine tuo, allelúja."
  - V. Fecísti enim nos Deo nostro regnum et sacerdótium.
  - R. In sánguine tuo, allelúja.
lectio2:
  - "!Apo 1:7-11"
  - "7 Ecce venit cum núbibus, et vidébit eum omnis óculus, et qui eum
    pupugérunt. Et plangent se super eum omnes tribus terræ. Etiam: amen."
  - "8 Ego sum alpha et ómega, princípium et finis, dicit Dóminus Deus: qui est,
    et qui erat, et qui ventúrus est, omnípotens."
  - "9 Ego Joánnes frater vester, et párticeps in tribulatióne, et regno, et
    patiéntia in Christo Jesu: fui in ínsula, quæ appellátur Patmos, propter
    verbum Dei, et testimónium Jesu:"
  - 10 fui in spíritu in domínica die, et audívi post me vocem magnam tamquam
    tubæ,
  - "11 dicéntis: Quod vides, scribe in libro: et mitte septem ecclésiis, quæ
    sunt in Asia, Epheso, et Smyrnæ, et Pérgamo, et Thyatíræ, et Sardis, et
    Philadelphíæ, et Laodicíæ."
responsory2:
  - "R. Ego sicut vitis fructificávi suavitátem odóris, allelúja:"
  - "* Transíte ad me, omnes qui concupíscitis me, et a generatiónibus meis
    adimplémini, allelúja, allelúja."
  - "V. In me omnis grátia viæ et veritátis: in me omnes spes vitæ et virtútis."
  - R. Transíte ad me, omnes qui concupíscitis me, et a generatiónibus meis
    adimplémini, allelúja, allelúja.
lectio3:
  - "!Apo 1:12-19"
  - "12 Et convérsus sum ut vidérem vocem, quæ loquebátur mecum: et convérsus
    vidi septem candelábra áurea:"
  - "13 et in médio septem candelabrórum aureórum, símilem Fílio hóminis
    vestítum podére, et præcínctum ad mamíllas zona áurea:"
  - "14 caput autem ejus, et capílli erant cándidi tamquam lana alba, et tamquam
    nix, et óculi ejus tamquam flamma ignis:"
  - "15 et pedes ejus símiles aurichálco, sicut in camíno ardénti, et vox illíus
    tamquam vox aquárum multárum:"
  - "16 et habébat in déxtera sua stellas septem: et de ore ejus gládius utráque
    parte acútus exíbat: et fácies ejus sicut sol lucet in virtúte sua."
  - "17 Et cum vidíssem eum, cécidi ad pedes ejus tamquam mórtuus. Et pósuit
    déxteram suam super me, dicens: Noli timére: ego sum primus, et novíssimus,"
  - "18 et vivus, et fui mórtuus, et ecce sum vivens in sǽcula sæculórum: et
    hábeo claves mortis, et inférni."
  - 19 Scribe ergo quæ vidísti, et quæ sunt, et quæ opórtet fíeri post hæc.
responsory3:
  - "R. Audívi vocem de cælo, tamquam vocem tonítrui magni, allelúja: Regnábit
    Deus noster in ætérnum, allelúja:"
  - "* Quia facta est salus, et virtus, et potéstas Christi ejus, allelúja,
    allelúja."
  - "V. Et vox de throno exívit, dicens: Laudem dícite Deo nostro, omnes Sancti
    ejus, et qui timétis Deum, pusílli et magni."
  - R. Quia facta est salus, et virtus, et potéstas Christi ejus, allelúja,
    allelúja.
  - "&Gloria"
  - R. Quia facta est salus, et virtus, et potéstas Christi ejus, allelúja,
    allelúja.
lectio4:
  - Sermo sancti Augustíni Epíscopi
  - "!Sermo 147 de Tempore"
  - "Diébus his sanctis resurrectióni Dómini dedicátis, quantum donánte ipso
    póssumus, de carnis resurrectióne tractémus. Hæc enim est fides nostra: hoc
    donum in Dómini nostri Jesu Christi nobis carne promíssum est, et in ipso
    præcéssit exémplum. Vóluit enim nobis, quod promísit in fine, non solum
    prænuntiáre, sed étiam demonstráre. Illi quidem qui tunc fuérunt, cum illum
    vidérent, et cum expavéscerent, et spíritum se vidére créderent, soliditátem
    córporis tenuérunt. Locútus est enim non solum verbis ad aures eórum, sed
    étiam spécie ad óculos eórum: parúmque erat se præbére cernéndum, nisi étiam
    offérret pertractándum atque palpándum."
responsory4:
  - "R. Locútus est ad me unus ex septem Angelis, dicens: Veni, osténdam tibi
    novam nuptam, sponsam Agni:"
  - "* Et vidi Jerúsalem descendéntem de cælo, ornátam monílibus suis, allelúja,
    allelúja, allelúja."
  - V. Et sústulit me in spíritu in montem magnum et altum.
  - R. Et vidi Jerúsalem descendéntem de cælo, ornátam monílibus suis, allelúja,
    allelúja, allelúja.
lectio5:
  - "Ait enim: Quid turbáti estis, et cogitatiónes ascéndunt in cor vestrum?
    Putavérunt enim se spíritum vidére. Quid turbáti estis, inquit, et
    cogitatiónes ascéndunt in cor vestrum? Vidéte manus meas, et pedes meos:
    palpáte, et vidéte: quia spíritus ossa et carnem non habet, sicut me vidétis
    habére. Contra istam evidéntiam disputábant hómines. Quid enim áliud
    fácerent hómines, qui ea, quæ sunt hóminum, sápiunt, quam sic disputáre de
    Deo contra Deum? Ille enim Deus est, isti hómines sunt. Sed Deus novit
    cogitatiónes hóminum, quóniam vanæ sunt."
responsory5:
  - "R. Audívi vocem in cælo Angelórum multórum dicéntium:"
  - "* Timéte Dóminum, et date claritátem illi, et adoráte eum, qui fecit cælum
    et terram, mare et fontes aquárum, allelúja, allelúja."
  - V. Vidi Angelum Dei fortem, volántem per médium cæli, voce magna clamántem
    et dicéntem.
  - R. Timéte Dóminum, et date claritátem illi, et adoráte eum, qui fecit cælum
    et terram, mare et fontes aquárum, allelúja, allelúja.
lectio6:
  - "In hómine carnáli tota régula intelligéndi est consuetúdo cernéndi. Quod
    solent vidére, credunt: quod non solent, non credunt. Præter consuetúdinem
    facit Deus mirácula, quia Deus est. Majóra quidem mirácula sunt, tot
    quotídie hómines nasci, qui non erant, quam paucos resurrexísse, qui erant:
    et tamen ista mirácula non consideratióne comprehénsa sunt, sed assiduitáte
    viluérunt. Resurréxit Christus: absolúta est res. Corpus erat, caro erat:
    pepéndit in cruce, emísit ánimam, pósita est caro in sepúlcro. Exhíbuit
    illam vivam, qui vivébat in illa. Quare mirámur? quare non crédimus? Deus
    est, qui fecit."
responsory6:
  - "R. Véniens a Líbano quam pulchra facta est, allelúja:"
  - "* Et odor vestimentórum ejus super ómnia arómata, allelúja, allelúja."
  - V. Favus distíllans lábia ejus, mel et lac sub lingua ejus.
  - R. Et odor vestimentórum ejus super ómnia arómata, allelúja, allelúja.
  - "&Gloria"
  - R. Et odor vestimentórum ejus super ómnia arómata, allelúja, allelúja.
lectio7:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 16:16-22"
  - "In illo témpore: Dixit Jesus discípulis suis: Módicum, et jam non vidébitis
    me; et íterum módicum, et vidébitis me: quia vado ad Patrem. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tr. 101 in Joann., sub fine"
  - "Módicum est hoc totum spátium, quo præsens pérvolat sǽculum. Unde dicit
    idem ipse Evangelísta in Epístola sua: Novíssima hora est. Ideo namque
    áddidit: Quia vado ad Patrem: quod ad priórem senténtiam referéndum est, ubi
    ait: Módicum et jam non vidébitis me: non ad posteriórem, ubi ait: Et íterum
    módicum, et vidébitis me. Eúndo quippe ad Patrem, factúrus erat ut eum non
    vidérent. Ac per hoc non ídeo dictum est, quia fúerat moritúrus, et donec
    resúrgeret, ab eórum aspéctibus recessúrus: sed quod esset itúrus ad Patrem,
    quod fecit posteáquam resurréxit, et cum eis per quadragínta dies
    conversátus, ascéndit in cælum."
responsory7:
  - "R. Decantábat pópulus Israël, allelúja: et univérsa multitúdo Jacob canébat
    legítime:"
  - "* Et David cum cantóribus cítharam percutiébat in domo Dómini, et laudes
    Deo canébat, allelúja, allelúja."
  - "V. Sanctificáti sunt ergo sacerdótes et levítæ: et univérsus Israël
    deducébat arcam fœ́deris Dómini in júbilo."
  - R. Et David cum cantóribus cítharam percutiébat in domo Dómini, et laudes
    Deo canébat, allelúja, allelúja.
lectio8:
  - "Illis ergo ait: Módicum, et jam non vidébitis me; qui eum corporáliter tunc
    vidébant: quia itúrus erat ad Patrem, et eum deínceps mortálem visúri non
    erant, qualem, cum ista loquerétur, vidébant. Quod vero áddidit: Et íterum
    módicum, et vidébitis me: univérsæ promísit Ecclésiæ, sicut univérsæ
    promísit: Ecce ego vobíscum sum usque ad consummatiónem sǽculi. Non tardat
    Dóminus promíssum. Módicum et vidébimus eum: ubi jam nihil rogémus, nihil
    interrogémus, quia nihil desiderándum remanébit, nihil quæréndum latébit."
responsory8:
  - R. Tristítia vestra, allelúja,
  - "* Convertétur in gáudium, allelúja, allelúja."
  - V. Mundus autem gaudébit, vos vero contristabímini, sed tristítia vestra.
  - R. Convertétur in gáudium, allelúja, allelúja.
  - "&Gloria"
  - R. Convertétur in gáudium, allelúja, allelúja.
lectio9:
  - "Hoc módicum longum nobis vidétur, quóniam adhuc ágitur; cum finítum fúerit,
    tunc sentiémus quam módicum fúerit. Non ergo sit gáudium nostrum quale habet
    mundus, de quo dictum est: Mundus autem gaudébit. Nec tamen in hujus
    desidérii parturitióne sine gáudio tristes simus: sed, sicut ait Apóstolus:
    Spe gaudéntes: In tribulatióne patiéntes: quia et ipsa partúriens, cui
    comparáti sumus, plus gaudet de mox futúra prole, quam tristis est de
    præsénti dolóre. Sed hujus sermónis iste sit finis: habent enim quæstiónem
    molestíssimam, quæ sequúntur: nec brevitáte coarctánda sunt, ut possint
    commódius, si Dóminus volúerit, explicári."
  - "&teDeum"
