oratio:
  - "Præsta, quǽsumus, omnípotens Deus: ut, qui paschália festa perégimus, hæc,
    te largiénte, móribus et vita teneámus."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Joánnis Apóstoli
  - "!1 Joannes 5:4-10"
  - "Caríssimi: Omne, quod natum est ex Deo, vincit mundum: et hæc est victória,
    quæ vincit mundum, fides nostra. Quis est, qui vincit mundum, nisi qui
    credit, quóniam Jesus est Fílius Dei? Hic est, qui venit per aquam et
    sánguinem, Jesus Christus: non in aqua solum, sed in aqua et sánguine. Et
    Spíritus est, qui testificátur, quóniam Christus est véritas. Quóniam tres
    sunt, qui testimónium dant in cœlo: Pater, Verbum, et Spíritus Sanctus: et
    hi tres unum sunt. Et tres sunt, qui testimónium dant in terra: Spíritus, et
    aqua, et sanguis: et hi tres unum sunt. Si testimónium hóminum accípimus,
    testimónium Dei majus est: quóniam hoc est testimónium Dei, quod majus est:
    quóniam testificátus est de Fílio suo. Qui credit in Fílium Dei, habet
    testimónium Dei in se."
graduale:
  - Allelúja, allelúja.
  - "!Matt 28:7"
  - In die resurrectiónis meæ, dicit Dóminus, præcédam vos in Galilǽam. Allelúja.
  - "!Joannes 20:26"
  - "Post dies octo, jánuis clausis, stetit Jesus in médio discipulórum suórum,
    et dixit: Pax vobis. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joannes 20:19-31"
  - "In illo témpore: Cum sero esset die illo, una sabbatórum, et fores essent
    clausæ, ubi erant discípuli congregáti propter metum Judæórum: venit Jesus,
    et stetit in médio, et dixit eis: Pax vobis. Et cum hoc dixísset, osténdit
    eis manus et latus. Gavísi sunt ergo discípuli, viso Dómino. Dixit ergo eis
    íterum: Pax vobis. Sicut misit me Pater, et ego mitto vos. Hæc cum dixísset,
    insufflávit, et dixit eis: Accípite Spíritum Sanctum: quorum remiséritis
    peccáta, remittúntur eis; et quorum retinuéritis, reténta sunt. Thomas autem
    unus ex duódecim, qui dícitur Dídymus, non erat cum eis, quando venit Jesus.
    Dixérunt ergo ei álii discípuli: Vídimus Dóminum. Ille autem dixit eis: Nisi
    vídero in mánibus ejus fixúram clavórum, et mittam dígitum meum in locum
    clavórum, et mittam manum meam in latus ejus, non credam. Et post dies octo,
    íterum erant discípuli ejus intus, et Thomas cum eis. Venit Jesus, jánuis
    clausis, et stetit in médio, et dixit: Pax vobis. Deínde dicit Thomæ: Infer
    dígitum tuum huc et vide manus meas, et affer manum tuam et mitte in latus
    meum: et noli esse incrédulus, sed fidélis. Respóndit Thomas et dixit ei:
    Dóminus meus et Deus meus. Dixit ei Jesus: Quia vidísti me, Thoma,
    credidísti: beáti, qui non vidérunt, et credidérunt. Multa quidem et ália
    signa fecit Jesus in conspéctu discipulórum suórum, quæ non sunt scripta in
    libro hoc. Hæc autem scripta sunt, ut credátis, quia Jesus est Christus,
    Fílius Dei: et ut credéntes vitam habeátis in nómine ejus."
offertorium:
  - "!Matt 28:2; 28:5-6"
  - "Angelus Dómini descéndit de cœlo, et dixit muliéribus: Quem quǽritis,
    surréxit, sicut dixit, allelúja."
secreta:
  - "Súscipe múnera, Dómine, quǽsumus, exsultántis Ecclésiæ: et, cui causam
    tanti gáudii præstitísti, perpétuæ fructum concéde lætítiæ."
  - $Per Dominum.
communio:
  - "!Joannes 20:27"
  - "Mitte manum tuam, et cognósce loca clavórum, allelúja: et noli esse
    incrédulus, sed fidélis, allelúja, allelúja."
postcommunio:
  - "Quǽsumus, Dómine, Deus noster: ut sacrosáncta mystéria, quæ pro
    reparatiónis nostræ munímine contulísti; et præsens nobis remédium esse
    fácias et futúrum."
  - $Per Dominum.
