lectio1:
  - De Epístola beáti Pauli Apóstoli ad Colossénses
  - "!Col 3:1-7"
  - "1 Si consurrexístis cum Christo: quæ sursum sunt quǽrite, ubi Christus est
    in déxtera Dei sedens:"
  - 2 quæ sursum sunt sápite, non quæ super terram.
  - 3 Mórtui enim estis, et vita vestra est abscóndita cum Christo in Deo.
  - "4 Cum Christus apparúerit, vita vestra: tunc et vos apparébitis cum ipso in
    glória."
  - "5 Mortificáte ergo membra vestra, quæ sunt super terram: fornicatiónem,
    immundítiam, libídinem, concupiscéntiam malam, et avarítiam, quæ est
    simulacrórum sérvitus:"
  - "6 propter quæ venit ira Dei super fílios incredulitátis:"
  - 7 in quibus et vos ambulástis aliquándo, cum viverétis in illis.
