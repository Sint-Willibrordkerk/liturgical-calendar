lectio2:
  - "!Col 3:8-13"
  - "8 Nunc autem depónite et vos ómnia: iram, indignatiónem, malítiam,
    blasphémiam, turpem sermónem de ore vestro."
  - 9 Nolíte mentíri ínvicem, expoliántes vos véterem hóminem cum áctibus suis,
  - "10 et induéntes novum eum, qui renovátur in agnitiónem secúndum imáginem
    ejus qui creávit illum:"
  - "11 ubi non est gentílis et Judǽus, circumcísio et præpútium, Bárbarus et
    Scytha, servus et liber: sed ómnia, et in ómnibus Christus."
  - "12 Indúite vos ergo, sicut elécti Dei, sancti, et dilécti, víscera
    misericórdiæ, benignitátem, humilitátem, modéstiam, patiéntiam:"
  - "13 supportántes ínvicem, et donántes vobismetípsis si quis advérsus áliquem
    habet querélam: sicut et Dóminus donávit vobis, ita et vos."
responsory2:
  - "R. Angelus Dómini locútus est muliéribus, dicens: Quem quǽritis? an Jesum
    quǽritis? Jam surréxit:"
  - "* Veníte, et vidéte, allelúja, allelúja."
  - V. Jesum quǽritis Nazarénum crucifíxum? Surréxit, non est hic.
  - R. Veníte, et vidéte, allelúja, allelúja.
lectio3:
  - "!Col 3:14-17"
  - "14 Super ómnia autem hæc, caritátem habéte, quod est vínculum perfectiónis:"
  - "15 et pax Christi exsúltet in córdibus vestris, in qua et vocáti estis in
    uno córpore: et grati estóte."
  - 16 Verbum Christi hábitet in vobis abundánter, in omni sapiéntia, docéntes,
    et commonéntes vosmetípsos, psalmis, hymnis, et cánticis spirituálibus, in
    grátia cantántes in córdibus vestris Deo.
  - 17 Omne, quodcúmque fácitis in verbo aut in ópere, ómnia in nómine Dómini
    Jesu Christi, grátias agéntes Deo et Patri per ipsum.
responsory3:
  - "@Tempora/Pasc0-0:Responsory2"
lectio4:
  - Sermo sancti Augustíni Epíscopi
  - "!Sermo 1 in Octava Paschæ, qui est 157 de Tempore"
  - "Paschális solémnitas hodiérna festivitáte conclúditur, et ídeo hódie
    Neophytórum hábitus commutátur: ita tamen, ut candor, qui de hábitu
    depónitur, semper in corde teneátur. In qua quidem primum nobis agéndum est,
    ut quia pascháles dies sunt, id est, indulgéntiæ ac remissiónis, ita a nobis
    sanctórum diérum festívitas agátur, ut relaxatióne córporum púritas non
    obfuscétur: sed pótius abstinéntes ab omni luxu, ebrietáte, lascívia, demus
    óperam sóbriæ remissióni, ac sanctæ sinceritáti: ut, quidquid modo corporáli
    abstinéntia non acquírimus, méntium puritáte quærámus."
responsory4:
  - "@Tempora/Pasc0-1:Responsory1"
lectio5:
  - "Ad omnes quidem pértinet sermo, quos cura nostra compléctitur: verúmtamen
    hódie termináta sacramentórum solemnitáte, vos allóquimur, novélla gérmina
    sanctitátis, regeneráta ex aqua et Spíritu Sancto: germen pium, exámen
    novéllum, flos nostri honóris, et fructus labóris, gáudium et coróna mea,
    omnes qui statis in Dómino. Apostólicis verbis vos álloquor: Ecce nox
    præcéssit, dies autem appropinquávit: abjícite ópera tenebrárum, et indúite
    vos arma lucis. Sicut in die honéste ambulémus: non in comessatiónibus et
    ebrietátibus, non in cubílibus et impudicítiis, non in contentióne et
    æmulatióne: sed induímini Dóminum Jesum Christum."
responsory5:
  - "@Tempora/Pasc0-1:Responsory2"
lectio6:
  - "Habémus, inquit, certiórem prophéticum sermónem: cui bene fácitis
    intendéntes tamquam lucérnæ in obscúro loco, donec dies lucéscat, et lúcifer
    oriátur in córdibus vestris. Sint ergo lumbi vestri accíncti, et lucérnæ
    ardéntes in mánibus vestris: et vos símiles homínibus exspectántibus dóminum
    suum, quando revertátur a núptiis. Ecce dies advéniunt, in quibus Dóminus
    dicit: Pusíllum, inquit, et non vidébitis me, et íterum pusíllum, et
    vidébitis me. Hæc est hora, de qua dixit: Vos tristes éritis, sǽculum autem
    gaudébit: id est, vita ista tentatiónibus plena, in qua peregrinámur ab eo.
    Sed íterum, inquit, vidébo vos, et gaudébit cor vestrum, et gáudium vestrum
    nemo tollet a vobis."
responsory6:
  - "@Tempora/Pasc0-2:Responsory1"
lectio7:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 20:19-31"
  - "In illo témpore: Cum sero esset die illo, una sabbatórum, et fores essent
    clausæ, ubi erant discípuli congregáti propter metum Judæórum: venit Jesus,
    et stetit in médio, et dixit eis: Pax vobis. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 26 in Evangelia"
  - "Prima lectiónis hujus evangélicæ quǽstio ánimum pulsat: quómodo post
    resurrectiónem corpus Domínicum verum fuit, quod clausis jánuis ad
    discípulos íngredi pótuit? Sed sciéndum nobis est, quod divína operátio, si
    ratióne comprehénditur, non est admirábilis: nec fides habet méritum, cui
    humána rátio præbet experiméntum. Sed hæc ipsa nostri Redemptóris ópera, quæ
    ex semetípsis comprehéndi nequáquam possunt, ex ália ejus operatióne
    pensánda sunt: ut rebus mirabílibus fidem prǽbeant facta mirabilióra. Illud
    enim corpus Dómini intrávit ad discípulos jánuis clausis, quod vidélicet ad
    humános óculos per nativitátem suam clauso exívit útero Vírginis. Quid ergo
    mirum, si clausis jánuis post resurrectiónem suam in ætérnum jam victúrus
    intrávit, qui moritúrus véniens, non apérto útero Vírginis exívit?"
responsory7:
  - "@Tempora/Pasc0-2:Responsory2"
lectio8:
  - "Sed quia ad illud corpus, quod vidéri póterat, fides intuéntium dubitábat:
    osténdit eis prótinus manus et latus, palpándam carnem prǽbuit, quam clausis
    jánuis introdúxit. Qua in re duo mira, et juxta humánam ratiónem sibi valde
    contrária osténdit: dum post resurrectiónem suam corpus suum incorruptíbile,
    et tamen palpábile demonstrávit. Nam et corrúmpi necésse est quod palpátur:
    et palpári non potest quod non corrúmpitur. Sed miro modo atque inæstimábili
    Redémptor noster et incorruptíbile post resurrectiónem, et palpábile corpus
    exhíbuit: ut monstrándo incorruptíbile, invitáret ad prǽmium, et præbéndo
    palpábile, firmáret ad fidem. Et incorruptíbilem se ergo, et palpábilem
    demonstrávit: ut profécto esse post resurrectiónem osténderet corpus suum et
    ejúsdem natúræ, et altérius glóriæ."
responsory8:
  - "@Tempora/Pasc0-5:Responsory1"
lectio9:
  - "Dixit eis: Pax vobis. Sicut misit me Pater, et ego mitto vos: id est, sicut
    misit me Pater Deus Deum, et ego mitto vos homo hómines. Pater Fílium misit,
    qui hunc pro redemptióne géneris humáni incarnári constítuit. Quem vidélicet
    in mundum veníre ad passiónem vóluit: sed tamen amávit Fílium, quem ad
    passiónem misit. Eléctos vero Apóstolos Dóminus non ad mundi gáudia, sed
    sicut ipse missus est, ad passiónes in mundum mittit. Quia ergo et Fílius
    amátur a Patre, et tamen ad passiónem míttitur: ita et discípuli a Dómino
    amántur, qui tamen ad passiónem mittúntur in mundum. Itaque recte dícitur:
    Sicut misit me Pater, et ego mitto vos: id est, ea vos caritáte díligo, cum
    inter scándala persecutórum mitto, qua me caritáte Pater díligit, quem
    veníre ad tolerándas passiónes fecit."
  - "&teDeum"
