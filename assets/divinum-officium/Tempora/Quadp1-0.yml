evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 20:1-16"
  - "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Simile est
    regnum coelórum hómini patrifamílias, qui éxiit primo mane condúcere
    operários in víneam suam. Conventióne autem facta cum operáriis ex denário
    diúrno, misit eos in víneam suam. Et egréssus circa horam tértiam, vidit
    álios stantes in foro otiósos, et dixit illis: Ite et vos in víneam meam, et
    quod justum fúerit, dabo vobis. Illi autem abiérunt. Iterum autem éxiit
    circa sextam et nonam horam: et fecit simíliter. Circa undécimam vero éxiit,
    et invénit álios stantes, et dicit illis: Quid hic statis tota die otiósi?
    Dicunt ei: Quia nemo nos condúxit. Dicit illis: Ite et vos in víneam meam.
    Cum sero autem factum esset, dicit dóminus víneæ procuratóri suo: Voca
    operários, et redde illis mercédem, incípiens a novíssimis usque ad primos.
    Cum veníssent ergo qui circa undécimam horam vénerant, accepérunt síngulos
    denários. Veniéntes autem et primi, arbitráti sunt, quod plus essent
    acceptúri: accepérunt autem et ipsi síngulos denários. Et accipiéntes
    murmurábant advérsus patremfamílias, dicéntes: Hi novíssimi una hora
    fecérunt et pares illos nobis fecísti, qui portávimus pondus diéi et æstus.
    At ille respóndens uni eórum, dixit: Amíce, non facio tibi injúriam: nonne
    ex denário convenísti mecum? Tolle quod tuum est, et vade: volo autem et
    huic novíssimo dare sicut et tibi. Aut non licet mihi, quod volo, fácere? an
    óculus tuus nequam est, quia ego bonus sum? Sic erunt novíssimi primi, et
    primi novíssimi. Multi enim sunt vocáti, pauci vero elécti."
