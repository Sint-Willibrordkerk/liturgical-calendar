lectio4:
  - Ex libro Enchirídii sancti Augustíni Epíscopi
  - "!Cap 25, 26 et 27 tomi 3"
  - "Mortis supplícium Dóminus hómini comminátus fúerat, si peccáret: sic eum
    múnerans líbero arbítrio, ut tamen régeret império, terréret exítio: atque
    in paradísi felicitáte, tamquam in umbra vitæ, unde justítia custodíta in
    melióra conscénderet, collocávit. Hinc post peccátum exsul efféctus, stirpem
    quoque suam, quam peccándo in se tamquam in radíce vitiáverat, pœna mortis
    et damnatióne obstrínxit: ut quidquid prolis ex illo, et simul damnáta, per
    quam peccáverat, cónjuge, per carnálem concupiscéntiam, in qua inobediéntiæ
    pœna símilis retribúta est, nascerétur, tráheret originále peccátum, quo
    traherétur per erróres dolorésque divérsos ad illud extrémum cum
    desertóribus ángelis, vitiatóribus et possessóribus et consórtibus suis,
    sine fine supplícium."
responsory4:
  - "R. Tulit Dóminus hóminem, et pósuit eum in paradíso voluptátis:"
  - "* Ut operarétur et custodíret illum."
  - V. Plantáverat autem Dóminus Deus paradísum voluptátis a princípio, in quo
    pósuit hóminem quem formáverat.
  - R. Ut operarétur et custodíret illum.
lectio5:
  - "Sic per unum hóminem peccátum intrávit in mundum, et per peccátum mors: et
    ita in omnes hómines pertránsiit, in quo omnes peccavérunt. Mundum quippe
    appellávit eo loco Apóstolus univérsum genus humánum. Ita ergo res se
    habebant. Jacebat in malis, vel étiam volvebátur, et de malis in mala
    præcipitabátur totius humani generis massa damnáta: et adjuncta parti eórum,
    qui peccáverant, angelórum, luebat impiæ desertiónis digníssimas pœnas."
responsory5:
  - "R. Dixit Dóminus Deus: Non est bonum hóminem esse solum:"
  - "* Faciámus ei adjutórium símile sibi."
  - "V. Adæ vero non inveniebátur adjútor símilis sibi: dixit vero Deus."
  - R. Faciámus ei adjutórium símile sibi.
lectio6:
  - "Ad iram quippe Dei pertinet justam, quidquid cæca et indómita
    concupiscéntia faciunt libénter mali, et quidquid maniféstis opértisque
    pœnis patiúntur invíti: non sane Creatoris desisténte bonitáte, et malis
    angelis subministrare vitam, vivacemque poténtiam, (quæ subministrátio si
    auferátur, interibunt) et hóminum, quamvis de propágine vitiáta damnatáque
    nascéntium, formare semina, et animare, et ordinare membra per témporum
    ætates, per locórum spatia vegetare sensus, aliménta donare. Mélius enim
    judicáre de malis bene fácere, quam mala nulla esse permittere."
responsory6:
  - "R. Immísit Dóminus sopórem in Adam, et tulit unam de costis ejus: † Et
    ædificávit costam, quam túlerat Dóminus de Adam, in mulíerem, et addúxit eam
    ad Adam, ut vidéret quid vocáret eam:"
  - "* Et vocávit nomen ejus Virágo, quia de viro sumpta est."
  - V. Cumque obdormísset, tulit unam de costis ejus, et replévit carnem pro ea.
  - R. Et ædificávit costam, quam túlerat Dóminus de Adam, in mulíerem, et
    addúxit eam ad Adam, ut vidéret quid vocáret eam.
  - "&Gloria"
  - R. Et vocávit nomen ejus Virágo, quia de viro sumpta est.
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 20:1-16"
  - "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Símile est
    regnum cælórum hómini patrifamílias, qui éxiit primo mane condúcere
    operários in víneam suam. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homil. 19 in Evangelium post princ."
  - Regnum cælórum hómini patrifamílias símile dícitur, qui ad excoléndam víneam
    suam operários condúcit. Quis vero patrisfamílias similitúdinem réctius
    tenet, quam Cónditor noster, qui regit quos cóndidit, et eléctos suos sic in
    hoc mundo póssidet, quasi subjéctos dóminus in domo? Qui habet víneam,
    universálem scílicet Ecclésiam, quæ ab Abel justo usque ad últimum eléctum,
    qui in fine mundi nascitúrus est, quot Sanctos prótulit, quasi tot pálmites
    misit.
responsory7:
  - "R. Plantáverat autem Dóminus Deus paradísum voluptátis a princípio:"
  - "* In quo pósuit hóminem, quem formáverat."
  - V. Produxítque Dóminus Deus de humo omne lignum pulchrum visu, et ad
    vescéndum suáve; lignum étiam vitæ in médio paradísi.
  - R. In quo pósuit hóminem, quem formáverat.
lectio8:
  - "Hic ítaque paterfamílias ad excoléndam víneam suam, mane, hora tértia,
    sexta, nona et undécima operários condúcit: quia a mundi hujus inítio usque
    in finem ad erudiéndam plebem fidélium, prædicatóres congregáre non
    desístit. Mane étenim mundi fuit ab Adam usque ad Noë: hora vero tértia a
    Noë usque ad Abraham: sexta quoque ab Abraham usque ad Móysen: nona autem a
    Móyse usque ad advéntum Dómini: undécima vero ab advéntu Dómini usque ad
    finem mundi. In qua prædicatóres sancti Apóstoli missi sunt, qui mercédem
    plenam et tarde veniéntes accepérunt."
responsory8:
  - "R. Ecce Adam quasi unus ex nobis factus est sciens bonum et malum:"
  - "* Vidéte, ne forte sumat de ligno vitæ, et vivat in ætérnum."
  - V. Fecit quoque Dóminus Deus Adæ túnicam pellíceam, et índuit eum, et dixit.
  - R. Vidéte, ne forte sumat de ligno vitæ, et vivat in ætérnum.
lectio9:
  - "Ad erudiéndam ergo Dóminus plebem suam, quasi ad excoléndam víneam suam,
    nullo témpore déstitit operários míttere: quia et prius per Patres, et
    póstmodum per legis Doctóres et Prophétas, ad extrémum vero per Apóstolos,
    dum plebis suæ mores excóluit, quasi per operários in víneæ cultúra
    laborávit: quamvis in quólibet módulo vel mensúra, quisquis cum fide recta
    bonæ prædicátor actiónis éxstitit, hujus víneæ operárius fuit. Operátor ergo
    mane, hora tértia, sexta, et nona, antíquus ille et Hebráicus pópulus
    designátur: qui in eléctis suis ab ipso mundi exórdio, dum recta fide Deum
    stúduit cólere, quasi non déstitit in víneæ cultúra laboráre. Ad undécimam
    vero Gentíles vocántur, quibus et dícitur: Quid hic statis tota die otiósi?"
responsory9:
  - "R. Ubi est Abel frater tuus? dixit Dóminus ad Cain. Néscio, Dómine, numquid
    custos fratris mei sum ego? Et dixit ad eum: Quid fecísti?"
  - "* Ecce vox sánguinis fratris tui Abel clamat ad me de terra."
  - V. Maledíctus eris super terram, quæ apéruit os suum, et suscépit sánguinem
    fratris tui de manu tua.
  - R. Ecce vox sánguinis fratris tui Abel clamat ad me de terra.
  - "&Gloria"
  - R. Ecce vox sánguinis fratris tui Abel clamat ad me de terra.
