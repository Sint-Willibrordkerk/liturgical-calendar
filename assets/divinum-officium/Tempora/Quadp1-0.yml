oratio:
  - "Preces pópuli tui, quǽsumus, Dómine, cleménter exáudi: ut, qui juste pro
    peccátis nostris afflígimur, pro tui nóminis glória misericórditer
    liberémur."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Corínthios
  - "!1 Cor 9:24-27; 10:1-5"
  - "Fratres: Nescítis, quod ii, qui in stádio currunt, omnes quidem currunt,
    sed unus áccipit bravíum? Sic cúrrite, ut comprehendátis. Omnis autem, qui
    in agóne conténdit, ab ómnibus se ábstinet: et illi quidem, ut corruptíbilem
    corónam accípiant; nos autem incorrúptam. Ego ígitur sic curro, non quasi in
    incértum: sic pugno, non quasi áërem vérberans: sed castígo corpus meum, et
    in servitútem rédigo: ne forte, cum áliis prædicáverim, ipse réprobus
    effíciar. Nolo enim vos ignoráre, fratres, quóniam patres nostri omnes sub
    nube fuérunt, et omnes mare transiérunt, et omnes in Móyse baptizáti sunt in
    nube et in mari: et omnes eándem escam spiritálem manducavérunt, et omnes
    eúndem potum spiritálem bibérunt bibébant autem de spiritáli, consequénte
    eos, petra: petra autem erat Christus: sed non in plúribus eórum
    beneplácitum est Deo."
graduale:
