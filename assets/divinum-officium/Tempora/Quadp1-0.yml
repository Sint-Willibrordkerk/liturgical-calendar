  - V. Fiant aures tuæ intendéntes in oratiónem servi tui.
  - "V. Si iniquitátes observáveris, Dómine: Dómine, quis sustinébit?"
  - V. Quia apud te propitiátio est, et propter legem tuam sustínui te, Dómine.
