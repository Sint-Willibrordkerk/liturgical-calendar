oratio:
  - "Deus, qui unigénitum Fílium tuum constituísti humáni géneris Salvatórem, et
    Jesum vocári jussísti: concéde propítius; ut, cujus sanctum nomen venerámur
    in terris, ejus quoque aspéctu perfruámur in cælis."
  - $Per eundem
lectio:
  - Léctio Actuum Apostolorum
  - "!Act 4:8-12"
  - "In diébus illis: Petrus, replétus Spíritu Sancto, dixit: Príncipes pópuli
    et senióres, audíte: Si nos hódie dijudicámur in benefácto hóminis infírmi,
    in quo iste salvus factus est, notum sit ómnibus vobis et omni plebi Israël:
    quia in nómine Dómini nostri Jesu Christi Nazaréni, quem vos crucifixístis,
    quem Deus suscitávit a mórtuis, in hoc iste astat coram vobis sanus. Hic est
    lapis, qui reprobátus est a vobis ædificántibus: qui factus est in caput
    ánguli: et non est in alio áliquo salus. Nec enim aliud nomen est sub cœlo
    datum homínibus, in quo opórteat nos salvos fíeri."
graduale:
  - "!Ps 105:47"
  - "Salvos fac nos, Dómine, Deus noster, et cóngrega nos de natiónibus: ut
    confiteámur nómini sancto tuo, et gloriémur in glória tua."
  - "!Isa 63:16"
  - "Tu, Dómine, Pater noster et Redémptor noster: a sǽculo nomen tuum.
    Allelúja, allelúja"
  - "!Ps 144:21"
  - Laudem Dómini loquétur os meum, et benedícat omnis caro nomen sanctum ejus.
    Allelúja.
gradualep:
