  - Nomen tuum, Dómine, * decet sanctitudo in longitúdinem diérum.
  - Oleum effúsum * Nomen tuum, ídeo adolescéntulæ dilexérunt te.
  - Magnum est * Nomen meum, et honorábile in Géntibus, dicit Dóminus.
  - Jesus Nazarénus * Rex Judæórum, Imperátor cœli, et Dóminus dominántium.
  - Vincénti dabo * manna abscónditum, et Nomen novum scriptum, quod nemo scit,
    nisi qui áccipit.
capitulum-laudes:
  - "!Phil 2:8-10"
  - "v. Fratres: Christus humiliávit semetípsum, factus obédiens usque ad
    mortem, mortem autem crucis. Propter quod et Deus exaltávit illum, et
    donávit illi nomen, quod est super omne nomen, ut in nómine Jesu omne genu
    flectátur."
  - $Deo gratias
hymnus-laudes:
  - v. Jesu decus angélicum,
  - In aure dulce cánticum,
  - In ore mel miríficum,
  - In corde nectar cǽlicum.
  - _
  - Qui te gustant, esúriunt;
  - Qui bibunt, adhuc sítiunt;
  - Desideráre nésciunt,
  - Nisi Jesum, quem díligunt.
  - _
  - O Jesu mi dulcíssime,
  - Spes suspirántis ánimæ!
  - Te quærunt piæ lácrimæ,
  - Te clamor mentis íntimæ.
  - _
  - Mane nobíscum, Dómine,
  - Et nos illústra lúmine;
  - Pulsa mentis calígine,
  - Mundum reple dulcédine.
  - _
  - Jesu, flos Matris Vírginis,
  - Amor nostræ dulcédinis,
  - Tibi laus, honor nóminis,
  - Regnum beatitúdinis.
  - Amen.
