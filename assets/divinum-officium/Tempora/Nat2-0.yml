  - R. Laudábo nomen tuum assídue,
  - "* Et collaudábo illud in confessióne."
  - "V. Lætábor et exsultábo in te: psallam nómini tuo, Altíssime."
  - R. Et collaudábo illud in confessióne.
  - "&Gloria"
  - R. Et collaudábo illud in confessióne.
lectio4:
  - Sermo sancti Bernárdi Abbátis
  - "!Sermo 15 super Cantica, circa medium"
  - "Non otióse Spíritus Sanctus nomen Sponsi óleo cómparat, cum ita dóceat
    sponsam ad Sponsum clamáre: Oleum effúsum nomen tuum. Oleum enim lucet,
    pascit et ungit. Fovet ignem, nutrit carnem, lenit dolórem: lux, cibus,
    medicína. Vide idem nunc et de Sponsi nómine: Lucet prædicátum, pascit
    recogitátum, invocátum lenit et ungit. Et percurrámus síngula. Unde putas in
    toto orbe tanta et tam súbita fídei lux, nisi de prædicáto nómine Jesu?
    Nonne in hujus nóminis luce Deus nos vocávit in admirábile lumen suum;
    quibus illuminátis, et in lúmine isto vidéntibus lumen, dicat mérito Paulus:
    Fuístis aliquándo ténebræ, nunc autem lux in Dómino?"
responsory4:
  - "R. Sperent in te, qui novérunt nomen tuum:"
  - "* Quóniam non dereliquísti quæréntes te, Dómine."
  - V. Exsúrge, Dómine, ádjuva nos, et líbera nos propter nomen tuum.
  - R. Quóniam non dereliquísti quæréntes te, Dómine.
lectio5:
  - "Hoc dénique nomen coram régibus, et géntibus, et fíliis Israël portáre
    jussus est idem Apóstolus; et portábat nomen tamquam lumen, et illuminábat
    pátriam, et clamábat ubíque: Nox præcéssit, dies autem appropinquávit.
    Abiciámus ergo ópera tenebrárum, et induámur arma lucis, sicut in die
    honéste ambulémus. Et monstrábat ómnibus lucérnam super candelábrum,
    annúntians in omni loco Jesum, et hunc crucifíxum. Quómodo lux ista
    resplénduit ac perstrínxit cunctórum intuéntium óculos, quando de ore Petri,
    tamquam fulgur egrédiens, claudi uníus corporáles plantas solidávit et
    bases, multósque spirituáliter cæcos illuminávit? Numquid non ignem sparsit,
    cum ait: In nómine Jesu Christi Nazaréni surge et ámbula?"
responsory5:
  - R. Confiteámur nómini tuo magno,
  - "* Quóniam terríbile et sanctum est."
  - V. Hi in cúrribus, et hi in equis, nos autem in nómine Dómini, Dei nostri,
    invocábimus.
  - R. Quóniam terríbile et sanctum est.
lectio6:
  - Nec tantum lux est nomen Jesu, sed est et cibus. An non tóties confortáris,
    quóties recordáris? Quid æque mentem cogitántis impínguat? Quid ita
    exercitátos réparat sensus, virtútes róborat, végetat mores bonos atque
    honéstos, castas fovet affectiónes? Aridus est omnis ánimæ cibus, si non
    óleo isto infúnditur; insípidus est, si non hoc sale condítur. Si scribas,
    non sapit mihi, nisi légero ibi Jesum. Si dísputes aut cónferas, non sapit
    mihi, nisi sonúerit ibi Jesus. Jesus mel in ore, in aure melos, in corde
    júbilus. Sed est et medicína. Tristátur áliquis nostrum? Véniat in cor ejus
    Jesus, et inde sáliat in os. Et ecce ad exórtum nóminis lumen, núbilum omne
    díffugit, redit serénum. Lábitur quis in crimen? currit ínsuper ad láqueum
    mortis desperándo? Nonne, si ínvocet nomen vitæ, conféstim respirábit ad
    vitam?
responsory6:
  - R. Læténtur omnes, qui sperant in te, Dómine, in ætérnum exsultábunt, et
    habitábis in eis, et gloriabúntur in te omnes,
  - "* Qui díligunt nomen tuum."
  - V. Dómine, in lúmine vultus tui ambulábunt, et in nómine tuo exsultábunt
    tota die.
  - R. Qui díligunt nomen tuum.
  - "&Gloria"
  - R. Qui díligunt nomen tuum.
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 2:21"
  - "In illo témpore: Postquam consummáti sunt dies octo, ut circumciderétur
    Puer: vocátum est nomen ejus Jesus. Et réliqua."
  - _
  - Homilía sancti Bernárdi Abbátis
  - "!Sermo 1 de Circumcisione"
  - Magnum et mirábile sacraméntum! Circumcíditur Puer, et vocátur Jesus. Quid
    sibi vult ista connéxio? Circumcísio nempe magis salvándi, quam Salvatóris
    esse vidétur; et Salvatórem circumcídere pótius decet, quam circumcídi. Sed
    agnósce mediatórem Dei et hóminum, qui ab ipso nativitátis suæ exórdio
    divínis humána sóciat, ima summis. Náscitur ex mulíere, sed cui fecunditátis
    fructus sic accédat, ut non décidat flos virginitátis. Pannis invólvitur;
    sed panni ipsi angélicis láudibus honorántur. Abscónditur in præsépio; sed
    próditur radiánte stella de cælo. Sic et circumcísio veritátem suscéptæ
    probat humanitátis; et nomen, quod est super omne nomen, glóriam índicat
    majestátis. Circumcíditur tamquam verus Abrahæ fílius; Jesus vocátur tamquam
    verus Fílius Dei.
responsory7:
  - "R. Tribulatiónem et dolórem invéni:"
  - "* Et nomen Dómini invocávi."
  - V. Turris fortíssima nomen Dómini, in ipso sperávi, et adjútus sum.
  - R. Et nomen Dómini invocávi.
lectio8:
  - "Neque enim ad instar priórum meus iste Jesus nomen vácuum aut ináne portat:
    non est in eo magni nóminis umbra, sed véritas. Cǽlitus síquidem índitum
    nomen Evangelísta testátur, quod vocátum est ab Angelo, priúsquam in útero
    conciperétur. Et atténde verbi profunditátem: Postquam natus est Jesus,
    Jesus vocátur ab homínibus, qui vocátus est ab Angelo, priúsquam in útero
    conciperétur. Idem quippe et Angeli Salvátor et hóminis; sed hóminis ab
    incarnatióne, Angeli ab inítio creatúræ. Vocátum est, ait, nomen ejus Jesus,
    quod vocátum est ab Angelo. In ore ergo duórum vel trium téstium stat omne
    verbum; et ipsum, quod in Prophéta abbreviátum, maniféstius in Evangélio
    légitur caro factum."
responsory8:
  - R. Exspectábo nomen tuum, Dómine,
  - "* Quóniam bonum est in conspéctu sanctórum tuórum."
  - V. Ut confiteámur nómini sancto tuo, et gloriémur in laude tua.
  - R. Quóniam bonum est in conspéctu sanctórum tuórum.
  - "&Gloria"
  - R. Quóniam bonum est in conspéctu sanctórum tuórum.
lectio9:
  - "!Sermo 2 de Circumcisione"
  - "Mérito sane, dum circumcíditur puer, qui natus est nobis, Salvátor vocátur;
    quod vidélicet ex hoc jam cœ́perit operári salútem nostram, immaculátum
    illum pro nobis sánguinem fundens. Neque enim jam quǽrere est Christiánis,
    cur volúerit Dóminus Christus circumcídi. Propter hoc síquidem circumcísus
    est, propter quod natus, propter quod passus. Nihil horum propter se, sed
    ómnia propter eléctos. Nec in peccáto génitus, nec a peccáto circumcísus,
    nec mórtuus est pro peccáto suo; magis autem propter delícta nostra. Quod
    vocátum est, inquit, ab Angelo, priúsquam in útero conciperétur. Vocátum
    plane, non impósitum: nempe hoc ei nomen est ab ætérno. A natúra própria
    habet, ut sit Salvátor: innátum est ei nomen hoc, non índitum ab humána vel
    angélica creatúra."
  - "&teDeum"
versum-0:
