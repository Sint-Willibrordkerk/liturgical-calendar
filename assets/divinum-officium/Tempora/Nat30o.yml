references: "@Tempora/Nat30"
comment:
  - Dec 30, if it happens on a Saturday or – after 1900 – also on a Monday, it's
    of the Octave with Romans 1. Before 1900, if it is a Monday, S. Thomas is
    transferred here, and Romans 1 is read on Sunday Dec 29.
