introitus:
  - "!Sap 10:20-21"
  - "v. Victrícem manum tuam, Dómine, laudavérunt páriter, allelúja: quia
    sapiéntia apéruit os mutum, et linguas infántium fecit disértas, allelúja,
    allelúja."
  - "!Ps 97:1"
  - "Cantáte Dómino cánticum novum: quia mirabília fecit."
  - "&Gloria"
  - "v. Victrícem manum tuam, Dómine, laudavérunt páriter, allelúja: quia
    sapiéntia apéruit os mutum, et linguas infántium fecit disértas, allelúja,
    allelúja."
oratio:
  - "Deus, qui diversitátem géntium in confessióne tui nóminis adunásti: da, ut
    renátis fonte baptísmatis una sit fides méntium, et píetas actiónum."
  - $Per Dominum
lectio:
  - Léctio Actuum Apostolorum
  - "!Act 8:26-40"
  - "In diébus illis: Angelus Dómini locútus est ad Philíppum, dicens: Surge et
    vade contra meridiánum ad viam, quæ descéndit ab Jerúsalem in Gazam: hæc est
    desérta. Et surgens ábiit. Et ecce vir Æthiops eunúchus, potens Candácis
    regínæ Æthíopum, qui erat super omnes gazas ejus, vénerat adoráre in
    Jerúsalem: et revertebátur sedens super currum suum, legénsque Isaíam
    Prophétam. Dixit autem Spíritus Philíppo: Accéde et adjúnge te ad currum
    istum. Accúrrens autem Philíppus, audívit eum legéntem Isaíam Prophétam, et
    dixit: Putásne, intéllegis, quæ legis? Qui ait: Et quómodo possum, si non
    áliquis osténderit mihi? Rogavítque Philíppum, ut ascénderet et sedéret
    secum. Locus autem Scriptúræ, quam legébat, erat hic: Tamquam ovis ad
    occisiónem ductus est: et sicut agnus coram tondénte se, sine voce, sic non
    apéruit os suum. In humilitáte judícium ejus sublátum est. Generatiónem ejus
    quis enarrábit, quóniam tollétur de terra vita ejus? Respóndens autem
    eunúchus Philíppo, dixit: Obsecro te, de quo Prophéta dicit hoc? de se, an
    de álio áliquo? Apériens autem Philíppus os suum, et incípiens a Scriptúra
    ista, evangelizávit illi Jesum. Et dum irent per viam, venérunt ad quandam
    aquam: et ait eunúchus: Ecce aqua, quid próhibet me baptizári? Dixit autem
    Philíppus: Si credis ex toto corde, licet. Et respóndens, ait: Credo, Fílium
    Dei esse Jesum Christum. Et jussit stare currum: et descendérunt utérque in
    aquam, Philíppus et eunúchus, et baptizávit eum. Cum autem ascendíssent de
    aqua, Spíritus Dómini rápuit Philíppum, et ámplius non vidit eum eunúchus.
    Ibat autem per viam suam gaudens. Philíppus autem invéntus est in Azóto, et
    pertránsiens evangelizábat civitátibus cunctis - donec veníret Cæsaréam -
    nomen Dómini Jesu Christi."
graduale:
  - "!Ps 117:24; 117:22-23."
  - "Hæc dies, quam fecit Dóminus: exsultémus et lætémur in ea."
  - "V. Lápidem, quem reprobavérunt ædificántes, hic factus est in caput ánguli:
    a Dómino factum est istud, et est mirábile in óculis nostris."
  - Allelúja, allelúja,
  - "V. Surréxit Christus, qui creávit ómnia: et misértus est humáno géneri."
sequentia:
  - "@Tempora/Pasc0-0:Sequentia"
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joannes 20:11-18"
  - "In illo témpore: María stabat ad monuméntum foris, plorans. Dum ergo
    fleret, inclinávit se et prospéxit in monuméntum: et vidit duos Angelos in
    albis, sedéntes, unum ad caput et unum ad pedes, ubi pósitum fúerat corpus
    Jesu. Dicunt ei illi: Múlier, quid ploras? Dicit eis: Quia tulérunt Dóminum
    meum: et néscio, ubi posuérunt eum. Hæc cum dixísset, convérsa est
    retrórsum, et vidit Jesum stantem: et non sciébat, quia Jesus est. Dicit ei
    Jesus: Múlier, quid ploras? quem quæris? Illa exístimans, quia hortulánus
    esset, dicit ei: Dómine, si tu sustulísti eum, dícito mihi, ubi posuísti
    eum: et ego eum tollam. Dicit ei Jesus: María. Convérsa illa, dicit ei:
    Rabbóni - quod dícitur Magíster. - Dicit ei Jesus: Noli me tángere, nondum
    enim ascéndi ad Patrem meum: vade autem ad fratres meos et dic eis: Ascéndo
    ad Patrem meum et Patrem vestrum, Deum meum et Deum vestrum. Venit María
    Magdaléne annúntians discípulis: Quia vidi Dóminum, et hæc dixit mihi."
offertorium:
  - "!Exod 13:5"
  - In die solemnitátis vestræ, dicit Dóminus, indúcam vos in terram fluéntem
    lac et mel, allelúja.
secreta:
  - "Súscipe, quǽsumus, Dómine, múnera populórum tuórum propítius: ut,
    confessióne tui nóminis et baptísmate renováti, sempitérnam beatitúdinem
    consequántur."
  - $Per Dominum
communio:
  - "!1 Pet 2:9"
  - "Pópulus acquisitiónis, annuntiáte virtútes ejus, allelúja: qui vos de
    ténebris vocávit in admirábile lumen suum, allelúja."
postcommunio:
  - "Exáudi, Dómine, preces nostras: ut redemptiónis nostræ sacrosáncta
    commércia, et vitæ nobis cónferant præséntis auxílium, et gáudia sempitérna
    concílient."
  - $Per Dominum.
