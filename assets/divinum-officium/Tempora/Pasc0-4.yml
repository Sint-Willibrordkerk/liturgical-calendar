lectio1:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 20:11-18"
  - "In illo témpore: María stabat ad monuméntum foris, plorans. Dum ergo
    fleret, inclinávit se, et prospéxit in monuméntum: et vidit duos Angelos in
    albis, sedéntes. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 25 in Evangelia"
  - "María Magdaléne, quæ fúerat in civitáte peccátrix, amándo veritátem, lavit
    lácrimis máculas críminis: et vox Veritátis implétur, qua dícitur: Dimíssa
    sunt ei peccáta multa, quia diléxit multum. Quæ enim prius frígida peccándo
    remánserat, póstmodum amándo fórtiter ardébat. Nam postquam venit ad
    monuméntum, ibíque corpus Domínicum non invénit, sublátum crédidit, atque
    discípulis nuntiávit: qui veniéntes vidérunt, atque ita esse, ut múlier
    díxerat, credidérunt. Et de eis prótinus scriptum est: Abiérunt ergo
    discípuli ad semetípsos: ac deínde subjúngitur: María autem stabat ad
    monuméntum foris, plorans."
responsory1:
  - "R. Tulérunt Dóminum meum, et néscio ubi posuérunt eum. Dicunt ei Angeli:
    Múlier, quid ploras? surréxit sicut dixit:"
  - "* Præcédet vos in Galilǽam: ibi eum vidébitis, allelúja, allelúja."
  - "V. Cum ergo fleret, inclinávit se, et prospéxit in monuméntum: et vidit
    duos Angelos in albis, sedéntes, qui dicunt ei."
  - "R. Præcédet vos in Galilǽam: ibi eum vidébitis, allelúja, allelúja."
lectio2:
  - "Qua in re pensándum est, hujus mulíeris mentem quanta vis amóris
    accénderat, quæ a monuménto Dómini, étiam discípulis recedéntibus, non
    recedébat. Exquirébat quem non invénerat: flebat inquírendo, et amóris sui
    igne succénsa, ejus, quem ablátum crédidit, ardébat desidério. Unde
    cóntigit, ut eum sola tunc vidéret, quæ remánserat ut quǽreret: quia nimírum
    virtus boni óperis, perseverántia est: et voce Veritátis dícitur: Qui autem
    perseveráverit usque in finem, hic salvus erit."
responsory2:
  - "R. Congratulámini mihi omnes qui dilígitis Dóminum, quia quem quærébam,
    appáruit mihi:"
  - "* Et dum flerem ad monuméntum, vidi Dóminum, allelúja, allelúja."
  - V. Recedéntibus discípulis, non recedébam, et amóris ejus igne succénsa,
    ardébam desidério.
  - R. Et dum flerem ad monuméntum, vidi Dóminum, allelúja, allelúja.
  - "&Gloria"
  - R. Et dum flerem ad monuméntum, vidi Dóminum, allelúja, allelúja.
lectio3:
  - "María ergo cum fleret, inclinávit se, et prospéxit in monuméntum. Certe jam
    monuméntum vácuum víderat, jam sublátum Dóminum nuntiáverat: quid est, quod
    se íterum inclínat, íterum vidére desíderat? Sed amánti semel aspexísse non
    súfficit: quia vis amóris intentiónem multíplicat inquisitiónis. Quæsívit
    ergo prius, et mínime invénit: perseverávit ut quǽreret, unde et cóntigit,
    ut inveníret: actúmque est, ut desidéria diláta créscerent, et crescéntia
    cáperent quod inveníssent."
  - "&teDeum"
