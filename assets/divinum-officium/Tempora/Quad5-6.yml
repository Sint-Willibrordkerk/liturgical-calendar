lectio2:
  - "In crástinum autem turba multa, quæ vénerat ad diem festum, cum audíssent
    quia venit Jesus Jerosólymam: accepérunt ramos palmárum, et processérunt
    óbviam ei, et clamábant: Hosánna, benedíctus qui venit in nómine Dómini, Rex
    Israël. Rami palmárum laudes sunt, significántes victóriam: quia erat
    Dóminus mortem moriéndo superatúrus, et trophǽo crucis de diábolo mortis
    príncipe triumphatúrus. Vox autem obsecrántis est Hosánna, sicut nonnúlli
    dicunt, qui Hebrǽam linguam novérunt, magis afféctum índicans, quam rem
    áliquam signíficans, sicut sunt in lingua Latína, quas interjectiónes
    vocant: velut cum doléntes dícimus, heu; vel cum delectámur, vah dícimus."
responsory2:
  - "@Tempora/Quad5-0:Responsory8"
lectio3:
  - "Has ei laudes turba dicébat: Hosánna, benedíctus, qui venit in nómine
    Dómini, Rex Israël. Quam crucem mentis invidéntia príncipum Judæórum pérpeti
    potúerat, quando Regem suum Christum tanta multitúdo clamábat? Sed quid fuit
    Dómino Regem esse Israël? Quid magnum fuit Regi sæculórum, Regem fíeri
    hóminum? Non enim Rex Israël Christus ad exigéndum tribútum, vel exércitum
    ferro armándum, hostésque visibíliter debellándos: sed Rex Israël, quod
    mentes regat, quod in ætérnum cónsulat, quod in regnum cælórum credéntes,
    sperántes, amantésque perdúcat."
responsory3:
  - "@Tempora/Quad5-0:Responsory9"
