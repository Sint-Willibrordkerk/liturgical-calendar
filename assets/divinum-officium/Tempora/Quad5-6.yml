oratio:
  - "Profíciat, quǽsumus, Dómine, plebs tibi dicáta piæ devotiónis afféctu: ut
    sacris actiónibus erudíta, quanto majestáti tuæ fit grátior, tanto donis
    potióribus augeátur."
  - $Per Dominum
lectio:
  - Léctio Jeremíæ Prophétæ
  - "!Jer 18:18-23"
  - "In diébus illis: Dixérunt ímpii Judǽi ad ínvicem: Veníte, et cogitémus
    contra justum cogitatiónes: non enim períbit lex a sacerdóte, neque
    consílium a sapiénte, nec sermo a prophéta: veníte, et percutiámus eum
    lingua, et non attendámus ad univérsos sermónes ejus. Atténde, Dómine, ad
    me, et audi vocem adversariórum meórum. Numquid rédditur pro bono malum,
    quia fodérunt fóveam ánimæ meæ? Recordáre, quod stéterim in conspéctu tuo,
    ut lóquerer pro eis bonum, et avérterem indignatiónem tuam ab eis. Proptérea
    da fílios eórum in famem, et deduc eos in manus gládii: fiant uxóres eórum
    absque líberis, et víduæ: et viri eárum interficiántur morte: júvenes eórum
    confodiántur gládio in prǽlio. Audiátur clamor de dómibus eórum: addúces
    enim super eos latrónem repénte: quia fodérunt fóveam, ut cáperent me, et
    láqueos abscondérunt pédibus meis. Tu autem, Dómine, scis omne consílium
    eórum advérsum me in mortem: ne propitiéris iniquitáti eórum, et peccátum
    eórum a fácie tua non deleátur. Fiant corruéntes in conspéctu tuo, in
    témpore furóris tui abútere eis, Dómine, Deus noster."
graduale:
  - "!Ps 34:20, 22"
  - "Pacífice loquebántur mihi inimíci mei: et in ira molésti erant mihi."
  - "V. Vidísti, Dómine, ne síleas: ne discédas a me."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joann 12:10-36"
  - "In illo témpore: Cogitavérunt príncipes sacerdótum, ut et Lázarum
    interfícerent: quia multi propter illum abíbant ex Judǽis, et credébant in
    Jesum. In crástinum autem turba multa, quæ vénerat ad diem festum, cum
    audíssent, quia venit Jesus Jerosólymam, accepérunt ramos palmárum, et
    processérunt óbviam ei, et clamábant: Hosánna, benedíctus, qui venit in
    nómine Dómini, Rex Israël. Et invénit Jesus aséllum, et sedit super eum,
    sicut scriptum est: Noli timére, fília Sion: ecce, Rex tuus venit sedens
    super pullum ásinæ. Hæc non cognovérunt discípuli ejus primum: sed quando
    glorificátus est Jesus, tunc recordáti sunt, quia hæc erant scripta de eo:
    et hæc fecérunt ei. Testimónium ergo perhibébat turba, quæ erat cum eo,
    quando Lázarum vocávit de monuménto, et suscitávit eum a mórtuis. Proptérea
    et óbviam venit ei turba: quia audiérunt eum fecísse hoc signum. Pharisǽi
    ergo dixérunt ad semetípsos: Vidétis, quia nihil profícimus? Ecce, mundus
    totus post eum ábiit. Erant autem quidam gentíles ex his, qui ascénderant,
    ut adorárent in die festo. Hi ergo accessérunt ad Philíppum, qui erat a
    Bethsáida Galilǽæ: et rogábant eum, dicéntes: Dómine, vólumus Jesum vidére.
    Venit Philíppus, et dicit Andréæ: Andréas rursum et Philíppus dixérunt Jesu.
    Jesus autem respóndit eis, dicens: Venit hora, ut clarificétur Fílius
    hóminis. Amen, amen, dico vobis, nisi granum fruménti cadens in terram
    mórtuum fúerit, ipsum solum manet: si autem mórtuum fúerit, multum fructum
    affert. Qui amat ánimam suam, perdet eam: et qui odit ánimam suam in hoc
    mundo, in vitam ætérnam custódit eam. Si quis mihi minístrat, me sequátur:
    et ubi sum ego, illic et miníster meus erit. Si quis mihi ministráverit,
    honorificábit eum Pater meus. Nunc ánima mea turbáta est. Et quid dicam?
    Pater, salvífica me ex hac hora. Sed proptérea veni in horam hanc. Pater,
    clarífica nomen tuum. Venit ergo vox de cœlo: Et clarificávi, et íterum
    clarificábo. Turba ergo, quæ stabat et audíerat, dicebat tonítruum esse
    factum. Alii dicébant: Angelus ei locútus est. Respóndit Jesus et dixit: Non
    propter me hæc vox venit, sed propter vos. Nunc judícium est mundi, nunc
    princeps hujus mundi ejiciétur foras. Et ego si exaltátus fúero a terra,
    ómnia traham ad meípsum. - Hoc autem dicébat, signíficans, qua morte esset
    moritúrus. - Respóndit ei turba: Nos audívimus ex lege, quia Christus manet
    in ætérnum, et quómodo tu dicis: Opórtet exaltári Fílium hominis? Quis est
    iste Fílius hominis? Dixit ergo eis Jesus: Adhuc módicum lumen in vobis est.
    Ambuláte, dum lucem habétis, ut non vos ténebræ comprehéndant: et qui
    ámbulat in ténebris, nescit, quo vadat. Dum lucem habétis, crédite in lucem:
    ut fílii lucis sitis. Hæc locútus est Jesus: et ábiit, et abscóndit se ab
    eis."
offertorium:
  - "!Ps 118:12, 121, 42"
  - "Benedíctus es, Dómine, doce me justificatiónes tuas: et non tradas
    calumniántibus me supérbis: et respondébo exprobrántibus mihi verbum."
secreta:
  - "A cunctis nos, quǽsumus, Dómine, reátibus et perículis propitiátus absólve:
    quos tanti mystérii tríbuis esse consórtes."
  - $Per Dominum
communio:
  - "!Ps 26:12"
  - "Ne tradíderis me, Dómine, in ánimas persequéntium me: quóniam insurrexérunt
    in me testes iníqui, et mentíta est iníquitas sibi."
postcommunio:
  - "Divíni múneris largitáte satiáti, quǽsumus, Dómine, Deus noster: ut hujus
    semper participatióne vivámus."
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Tueátur, quǽsumus, Dómine, déxtera tua pópulum deprecántem: et
    purificátum dignánter erúdiat; ut, consolatióne præsénti, ad futúra bona
    profíciat."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 12:10-36"
  - "In illo témpore: Cogitavérunt príncipes sacerdótum ut et Lázarum
    interfícerent: quia multi propter illum abíbant ex Judǽis, et credébant in
    Jesum. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tractatus 50 in Joannem, in fine"
  - "Viso Lázaro resuscitáto, quia tantum miráculum Dómini tanta erat evidéntia
    diffamátum, tanta manifestatióne declarátum, ut non possent vel occultáre
    quod factum est, vel negáre: quid invenérunt, vidéte. Cogitavérunt autem
    príncipes sacerdótum ut et Lázarum interfícerent. O stulta cogitátio, et
    cæca sævítia! Dóminus Christus, qui suscitáre pótuit mórtuum, non posset
    occísum! Quando Lázaro inferebátis necem, numquid auferebátis Dómino
    potestátem? Si áliud vobis vidétur mórtuus, áliud occísus: ecce Dóminus
    utrúmque fecit, et Lázarum mórtuum, et seípsum suscitávit occísum."
responsory1:
