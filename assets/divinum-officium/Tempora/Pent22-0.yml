oratio:
  - "Deus, refúgium nostrum et virtus: adésto piis Ecclésiæ tuæ précibus, auctor
    ipse pietátis, et præsta; ut, quod fidéliter pétimus, efficáciter
    consequámur."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Philippénses
  - "!Phil 1:6-11"
  - "Fratres: Confídimus in Dómino Jesu, quia, qui cœpit in vobis opus bonum,
    perfíciet usque in diem Christi Jesu. Sicut est mihi justum hoc sentíre pro
    ómnibus vobis: eo quod hábeam vos in corde, et in vínculis meis, et in
    defensióne, et confirmatióne Evangélii, sócios gáudii mei omnes vos esse.
    Testis enim mihi est Deus, quómodo cúpiam omnes vos in viscéribus Jesu
    Christi. Et hoc oro, ut cáritas vestra magis ac magis abúndet in sciéntia et
    in omni sensu: ut probétis potióra, ut sitis sincéri et sine offénsa in diem
    Christi, repléti fructu justítiæ per Jesum Christum, in glóriam et laudem
    Dei."
graduale:
  - "!Ps 132:1-2"
  - Ecce, quam bonum et quam jucúndum, habitáre fratres in unum!
  - V. Sicut unguéntum in cápite, quod descéndit in barbam, barbam Aaron.
  - Allelúja, allelúja.
  - "!Ps 113:11"
  - "Qui timent Dóminum sperent in eo: adjútor et protéctor eórum est. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 22:15-21"
  - "In illo témpore: Abeúntes pharisǽi consílium iniérunt, ut cáperent Jesum in
    sermóne. Et mittunt ei discípulos suos cum Herodiánis, dicéntes: Magíster,
    scimus, quia verax es et viam Dei in veritáte doces, et non est tibi cura de
    áliquo: non enim réspicis persónam hóminum: dic ergo nobis, quid tibi
    vidétur, licet censum dare Cǽsari, an non? Cógnita autem Jesus nequítia
    eórum, ait: Quid me tentátis, hypócritæ? Osténdite mihi numísma census. At
    illi obtulérunt ei denárium. Et ait illis Jesus: Cujus est imágo hæc et
    superscríptio? Dicunt ei: Cǽsaris. Tunc ait illis: Réddite ergo, quæ sunt
    Cǽsaris, Cǽsari; et, quæ sunt Dei, Deo."
offertorium:
  - "!Esth 14:12; 14:13"
  - "Recordáre mei, Dómine, omni potentátui dóminans: et da sermónem rectum in
    os meum, ut pláceant verba mea in conspéctu príncipis."
secreta:
  - "Da, miséricors Deus: ut hæc salutáris oblátio et a própriis nos reátibus
    indesinénter expédiat, et ab ómnibus tueátur advérsis."
  - $Per Dominum
communio:
  - "!Ps 16:6"
  - "Ego clamávi, quóniam exaudísti me, Deus: inclína aurem tuam et exáudi verba
    mea."
postcommunio:
  - "Súmpsimus, Dómine, sacri dona mystérii, humíliter deprecántes: ut, quæ in
    tui commemoratiónem nos fácere præcepísti, in nostræ profíciant infirmitátis
    auxílium:"
  - $Qui vivis
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 22:15-21"
  - "In illo témpore: Abeúntes pharisǽi consílium iniérunt ut cáperent Jesum in
    sermóne. Et réliqua."
  - _
  - Homilía sancti Hilárii Epíscopi
  - "!Comment. in Matth. can. 23"
  - Frequénter pharisǽi commovéntur, et occasiónem insimulándi eum habére ex
    prætéritis non possunt. Cádere enim vítium in gesta ejus et dicta non
    póterat; sed de malítiæ afféctu, in omnem se inquisitiónem reperiúndæ
    accusatiónis exténdunt. Namque a sǽculi vítiis, atque a superstitiónibus
    humanárum religiónum, univérsos ad spem regni cæléstis vocábat. Igitur an
    violáret sǽculi potestátem, de propósitæ interrogatiónis condicióne
    perténtant; an vidélicet reddi tribútum Cǽsari oportéret.
lectio8:
  - "Qui intérna cognitiónum secréta cognóscens (Deus enim nihil eórum quæ intra
    hóminem sunt abscónsa, non speculátur) afférri sibi denárium jussit, et
    quæsívit cujus et inscríptio esset et forma. Pharisǽi respondérunt: Cǽsaris
    eam esse. Quibus ait: Cǽsari redhibénda esse quæ Cǽsaris sunt; Deo autem
    reddénda esse, quæ Dei sunt. O plenam miráculi responsiónem, et perféctam
    dicti cæléstis absolutiónem! Ita ómnia inter contémptum sǽculi, et
    contuméliam lædéndi Cǽsaris temperávit, ut curis ómnibus et offíciis humánis
    devótas Deo mentes absólveret, cum Cǽsari quæ ejus essent, reddénda
    decérnit."
lectio9:
  - "Si enim nihil ejus penes nos reséderit, conditióne reddéndi ei quæ sua
    sunt, non tenébimur. Porro autem si rebus illíus incubámus, si jure
    potestátis ejus útimur, et nos tamquam mercenários aliéni patrimónii
    procuratióni subjícimus; extra querélam injúriæ est, Cǽsari redhibéri quod
    Cǽsaris est, Deo autem quæ ejus sunt própria, réddere nos oportére, corpus,
    ánimam, voluntátem. Ab eo enim hæc profécta atque aucta retinémus: proínde
    condígnum est, ut ei se totum reddant, cui debére se récolunt et oríginem et
    proféctum."
  - "&teDeum"
