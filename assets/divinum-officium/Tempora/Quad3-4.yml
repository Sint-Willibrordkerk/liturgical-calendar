lectio3:
  - "Et bene sábbato cœpit, ut ipsum se osténderet Creatórem, qui ópera opéribus
    intéxeret, et prosequerétur opus, quod ipse jam cœ́perat: ut si domum faber
    renováre dispónat, non a fundaméntis, sed a culmínibus íncipit sólvere
    vetustátem. Itaque ibi prius manum ádmovet, ubi ante desíerat: deínde a
    minóribus íncipit, ut ad majóra pervéniat. Liberáre a dǽmone et hómines, sed
    in verbo Dei possunt: resurrectiónem mórtuis imperáre, divínæ solíus est
    potestátis. Fortássis étiam in typo mulíeris illíus socrus Simónis et
    Andréæ, váriis críminum fébribus caro nostra languébat, et diversárum
    cupiditátum immódicis æstuábat illécebris. Nec minórem febrem amóris esse
    díxerim, quam calóris. Itaque illa ánimum, hæc corpus inflámmat. Febris enim
    nostra, avarítia est: febris nostra, libído est: febris nostra, luxúria est:
    febris nostra, ambítio est: febris nostra, iracúndia est."
responsory3:
  - "@Tempora/Quad3-0:Responsory3"
ant-2:
  - "Exíbant autem dæmónia * a multis clamántia, et dicéntia, Quia tu es
    Christus Fílius Dei: et íncrepans non sinébat ea loqui, quia sciébant ipsum
    esse Christum."
