  - Suffr=Maria1;Ecclesiæ,Papa;;
lectio1:
  - De Isaía Prophéta
  - "!Isa 51:1-3"
  - "1 Audíte me, qui sequímini quod justum est, et quǽritis Dóminum: atténdite
    ad petram unde excísi estis, et ad cavérnam laci, de qua præcísi estis."
  - 2 Atténdite ad Abraham patrem vestrum, et ad Saram, quæ péperit vos, quia
    unum vocávi eum, et benedíxi ei, et multiplicávi eum.
  - "3 Consolábitur ergo Dóminus Sion, et consolábitur omnes ruínas ejus: et
    ponet desértum ejus quasi delícias, et solitúdinem ejus quasi hortum Dómini.
    Gáudium et lætítia inveniétur in ea, gratiárum áctio et vox laudis."
responsory1:
  - "@Tempora/Adv4-0:Responsory7"
lectio2:
  - "!Isa 51:4-6"
  - "4 Atténdite ad me, pópule meus, et tribus mea, me audíte: quia lex a me
    éxiet, et judícium meum in lucem populórum requiéscet."
  - "5 Prope est justus meus, egréssus est salvátor meus, et brácchia mea
    pópulos judicábunt: me ínsulæ exspectábunt, et brácchium meum sustinébunt."
  - "6 Leváte in cælum óculos vestros, et vidéte sub terra deórsum: quia cæli
    sicut fumus liquéscent, et terra sicut vestiméntum atterétur, et habitatóres
    ejus sicut hæc interíbunt: Salus autem mea in sempitérnum erit, et justítia
    mea non defíciet."
responsory2:
  - "@Tempora/Adv4-0:Responsory8"
lectio3:
  - "!Isa 51:7-8"
  - "7 Audíte me, qui scitis justum, pópulus meus, lex mea in corde eórum:
    nolíte timére oppróbrium hóminum, et blasphémias eórum ne metuátis."
  - "8 Sicut enim vestiméntum, sic cómedet eos vermis: et sicut lanam, sic
    devorábit eos tínea: Salus autem mea in sempitérnum erit, et justítia mea in
    generatiónes generatiónum."
responsory3:
  - "@Tempora/Adv4-0:Responsory9"
rubrica-cisterciensis/ant-laudes:
  - "@Tempora/Adv4-0"
ant-2:
  - Ponam in Sion * salútem, et in Jerúsalem glóriam meam, allelúja.
rubrica-cisterciensis/ant-2:
  - "Non auferétur * sceptrum de Juda, et dux de fémore ejus, donec véniat qui
    mitténdus est: et ipse erit expectátio Géntium."
