  - Dóminus illuminátio mea et salus mea, quem timébo?
  - "&Gloria"
  - "v. Exáudi, Dómine, vocem meam, qua clamávi ad te: adjútor meus esto, ne
    derelínquas me neque despícias me, Deus, salutáris meus."
oratio:
  - "Deus, qui diligéntibus te bona invisibília præparásti: infúnde córdibus
    nostris tui amóris afféctum; ut te in ómnibus et super ómnia diligéntes,
    promissiónes tuas, quæ omne desidérium súperant, consequámur."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Petri Apóstoli.
  - "!1 Pet 3:8-15"
  - "Caríssimi: Omnes unánimes in oratióne estóte, compatiéntes, fraternitátis
    amatóres, misericórdes, modésti, húmiles: non reddéntes malum pro malo, nec
    maledíctum pro maledícto, sed e contrário benedicéntes: quia in hoc vocáti
    estis, ut benedictiónem hereditáte possideátis. Qui enim vult vitam dilígere
    et dies vidére bonos, coérceat linguam suam a malo, et lábia ejus ne
    loquántur dolum. Declínet a malo, et fáciat bonum: inquírat pacem, et
    sequátur eam. Quia óculi Dómini super justos, et aures ejus in preces eórum:
    vultus autem Dómini super faciéntes mala. Et quis est, qui vobis nóceat, si
    boni æmulatóres fuéritis? Sed et si quid patímini propter justítiam, beáti.
    Timórem autem eórum ne timuéritis: et non conturbémini. Dóminum autem
    Christum sanctificáte in córdibus vestris."
graduale:
  - "!Ps 83:10; 83:9"
  - Protéctor noster, áspice, Deus, et réspice super servos tuos,
  - V. Dómine, Deus virtútum, exáudi preces servórum tuórum. Allelúja, allelúja
  - "!Ps 20:1"
  - "Dómine, in virtúte tua lætábitur rex: et super salutáre tuum exsultábit
    veheménter. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum.
  - "!Matt 5:20-24"
  - "In illo témpore: Dixit Jesus discípulis suis: Nisi abundáverit justítia
    vestra plus quam scribárum et pharisæórum, non intrábitis in regnum cœlórum.
    Audístis, quia dictum est antíquis: Non occídes: qui autem occíderit, reus
    erit judício. Ego autem dico vobis: quia omnis, qui iráscitur fratri suo,
    reus erit judício. Qui autem díxerit fratri suo, raca: reus erit concílio.
    Qui autem díxerit, fátue: reus erit gehénnæ ignis. Si ergo offers munus tuum
    ad altáre, et ibi recordátus fúeris, quia frater tuus habet áliquid advérsum
    te: relínque ibi munus tuum ante altáre et vade prius reconciliári fratri
    tuo: et tunc véniens ófferes munus tuum."
offertorium:
  - "!Ps 15:7 et 8."
  - "Benedícam Dóminum, qui tríbuit mihi intelléctum: providébam Deum in
    conspéctu meo semper: quóniam a dextris est mihi, ne commóvear."
secreta:
  - "Propitiáre, Dómine, supplicatiónibus nostris: et has oblatiónes famulórum
    famularúmque tuárum benígnus assúme; ut, quod sínguli obtulérunt ad honórem
    nóminis tui, cunctis profíciat ad salútem."
  - $Per Dominum
communio:
  - "!Ps 26:4"
  - "Unam pétii a Dómino, hanc requíram: ut inhábitem in domo Dómini ómnibus
    diébus vitæ meæ."
postcommunio:
  - "Quos cœlésti, Dómine, dono satiásti: præsta, quǽsumus; ut a nostris
    mundémur occúltis et ab hóstium liberémur insídiis."
  - $Per Dominum
references: "@Tempora/Pent05-0"
lectio3:
  - "!2 Reg 1:11-16"
  - 11 Apprehendens autem David, vestimenta sua scidit, omnesque viri qui erant
    cum eo,
  - 12 et planxerunt, et fleverunt, et jejunaverunt usque ad vesperam super
    Saul, et super Jonathan filium ejus, et super populum Domini, et super domum
    Israël, eo quod corruissent gladio.
  - "13 Dixítque David ad juvenem qui nuntiaverat ei: Unde es tu? Qui respondit:
    Filius hominis advenæ Amalecitæ ego sum."
  - "14 Et ait ad eum David: Quare non timuisti mittere manum tuam ut occideres
    christum Domini?"
  - "15 Vocansque David unum de pueris suis, ait: Accedens irrue in eum. Qui
    percussit illum, et mortuus est."
  - "16 Et ait ad eum David: Sanguis tuus super caput tuum: os enim tuum locutum
    est adversum te, dicens: Ego interfeci christum Domini."
lectio5:
  - "Quid ergo montes Gelboë, Saul moriente deliquerunt, quatenus in eos nec ros
    nec pluvia caderet et ab omni eos viriditatis germine sententiæ sermo
    siccaret? Sed quia Gelboë interpretatur decursus, per Saul autem unctum et
    mortuum, mors nostri mediatoris exprimitur: non immerito per Gelboë montes
    superba Judæorum corda signantur: quæ dum in hujus mundi desideriis
    defluunt, in Christi, id est, uncti se morte miscuerunt: et quia in eis
    unctus rex corporaliter moritur, ipsi ab omni gratiæ rore siccantur. De
    quibus et bene dicitur, ut agri primitiarum esse non possint."
lectio6:
  - "Superbæ quippe Hebræorum mentes primitivos fructus non ferunt: quia in
    Redemptoris adventu ex parte maxima in perfidia remanentes, primordia fidei
    sequi noluerunt. Sancta namque Ecclesia in primitiis suis multitudine
    Gentium fœcundata, vix in mundi fine Judæos quos invenerit, suscipit, et
    extrema colligens, eos quasi reliquias frugum ponit. De quibus nimirum
    reliquiis Isaias dicit: Si fuerit numerus filiorum Israël quasi aréna maris,
    reliquiæ saluæ fient. Possunt tamen idcirco Gelboë montes ore prophetæ
    maledici, ut dum fructus ex arescente terra non oritur, possessores terræ
    sterilitatis damno feriantur: quatenus ipsi maledictionis sententiam
    acciperent, qui apud se mortem regis suscipere, iniquitate sua exigente,
    meruissent."
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum.
  - "!Matt 5:20-24"
  - "In illo témpore: Dixit Jesus discipulis suis: Nisi abundaverit justitia
    vestra plus quam scribarum et pharisæorum, non intrabitis in regnum cælorum.
    Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi.
  - "!Liber 1. de Sermone Domini in monte. cap. 9."
  - "Justitia pharisæorum est, ut non occidant: justitia eorum qui intraturi
    sunt in regnum cælorum, ut non irascantur sine causa. Minimum est ergo, non
    occidere: et qui illud solverit, minimus vocabitur in regno cælorum. Qui
    autem illud impleverit, ut non occidat, non continuo magnus erit, et idoneus
    regno cælorum; sed tamen ascendit aliquem gradum: perficietur autem, si nec
    irascatur sine causa: quod si perfecerit, multo remotior erit ab homicidio.
    Quapropter qui docet ut non irascamur, non solvit legem ne occidamus, sed
    implet potius: ut et foris, dum non occidimus; et in corde, dum non
    irascimur, innocentiam custodiamus. Audistis ergo, inquit, quia dictum est
    antiquis: Non occides: qui autem occiderit judicium reus erit Ego autem dico
    uobis, quia omnis qui irascitur fratri suo sine causa, reus erit judicio:
    qui autem dixerit fratri suo, raca, reus erit concilio: qui autem dixerit,
    fatue, reus erit gehennæ ignis."
lectio8:
  - "Gradus ítaque sunt in istis peccatis: ut primo quisque irascatur, et eum
    motum retineat corde conceptum. Jam si extorserit vocem indignantis ipsa
    commotio, non significantem aliquid, sed illum animi motum ipsa eruptione
    testantem, qua feriatur ille, cui irascitur: plus est utique quam si surgens
    ira silentio premeretur. Si vero non solum vox indignantis audiatur, sed
    étiam verbum, quo jam certam ejus vituperationem, in quem profertur,
    designet et notet: quis dubitet, amplius hoc esse, quam sin solus
    indignationis sonus ederetur? Itaque in primo unum est, idest ira sola: in
    secúndo duo, et ira, et uox, quæ iram significat, et in uoce ipsa certæ
    uituperationis expressio."
lectio9:
  - "Vide nunc étiam tres reatus, judicii, concilii, et gehennæ ignis. Nam in
    judicio adhuc defensioni datur locus. In concilio autem, quamquam et
    judicium esse soleat, tamen quia interesse aliquid hoc loco fateri cogit
    ipsa distinctio, videtur ad concilium pertinere sententiæ prolatio: quando
    non jam cum ipso reo agitur, utrum damnandus sit; sed inter se, qui
    judicant, conferunt quo supplicio damnari oporteat, quem constat esse
    damnandum. Gehenna vero ignis, nec damnationem habet dubiam, sicut judicium;
    nec damnati pœnam, sicut concilium: in gehenna quippe ignis, certa est
    damnatio, et pœna damnati. Videntur ergo aliqui gradus in peccatis, et in
    reatu, sed quibus modis inuisibiliter exhibeantur pœnæ meritis animarum,
    quis potest dicere?"
  - "&teDeum"
