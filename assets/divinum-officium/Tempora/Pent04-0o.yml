oratio:
  - "Da nobis, quǽsumus, Dómine: ut et mundi cursus pacífice nobis tuo órdine
    dirigátur; et Ecclésia tua tranquílla devotióne lætétur."
  - $Per Dominum.
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Romános.
  - "!Rom 8:18-23."
  - "Fratres: Exístimo, quod non sunt condígnæ passiónes hujus témporis ad
    futúram glóriam, quæ revelábitur in nobis. Nam exspectátio creatúræ
    revelatiónem filiórum Dei exspéctat. Vanitáti enim creatúra subjécta est,
    non volens, sed propter eum, qui subjécit eam in spe: quia et ipsa creatúra
    liberábitur a servitúte corruptiónis, in libertátem glóriæ filiórum Dei.
    Scimus enim, quod omnis creatúra ingemíscit et párturit usque adhuc. Non
    solum autem illa, sed et nos ipsi primítias spíritus habéntes: et ipsi intra
    nos gémimus, adoptiónem filiórum Dei exspectántes, redemptiónem córporis
    nostri: in Christo Jesu, Dómino nostro."
graduale:
  - "!Ps 78:9; 78:10"
  - "Propítius esto, Dómine, peccátis nostris: ne quando dicant gentes: Ubi est
    Deus eórum?"
  - "V. Adjuva nos, Deus, salutáris noster: et propter honórem nóminis tui,
    Dómine, líbera nos. Allelúja, allelúja"
  - "!Ps 9:5; 9:10"
  - "Deus, qui sedes super thronum, et júdicas æquitátem: esto refúgium páuperum
    in tribulatióne. Allelúja"
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam.
  - "!Luc 5:1-11"
  - "In illo témpore: Cum turbæ irrúerent in Jesum, ut audírent verbum Dei, et
    ipse stabat secus stagnum Genésareth. Et vidit duas naves stantes secus
    stagnum: piscatóres autem descénderant et lavábant rétia. Ascéndens autem in
    unam navim, quæ erat Simónis, rogávit eum a terra redúcere pusíllum. Et
    sedens docébat de navícula turbas. Ut cessávit autem loqui, dixit ad
    Simónem: Duc in altum, et laxáte rétia vestra in captúram. Et respóndens
    Simon, dixit illi: Præcéptor, per totam noctem laborántes, nihil cépimus: in
    verbo autem tuo laxábo rete. Et cum hoc fecíssent, conclusérunt píscium
    multitúdinem copiósam: rumpebátur autem rete eórum. Et annuérunt sóciis, qui
    erant in ália navi, ut venírent et adjuvárent eos. Et venérunt, et
    implevérunt ambas navículas, ita ut pæne mergeréntur. Quod cum vidéret Simon
    Petrus, prócidit ad génua Jesu, dicens: Exi a me, quia homo peccátor sum,
    Dómine. Stupor enim circumdéderat eum et omnes, qui cum illo erant, in
    captúra píscium, quam céperant: simíliter autem Jacóbum et Joánnem, fílios
    Zebedǽi, qui erant sócii Simónis. Et ait ad Simónem Jesus: Noli timére: ex
    hoc jam hómines eris cápiens. Et subdúctis ad terram návibus, relictis
    ómnibus, secuti sunt eum."
offertorium:
  - "!Ps 12:4-5"
  - "Illúmina óculos meos, ne umquam obdórmiam in morte: ne quando dicat
    inimícus meus: Præválui advérsus eum."
secreta:
  - "Oblatiónibus nostris, quǽsumus, Dómine, placáre suscéptis: et ad te nostras
    étiam rebélles compélle propítius voluntátes."
  - $Per Dominum
communio:
  - "!Ps 17:3"
  - "Dóminus firmaméntum meum, et refúgium meum, et liberátor meus: Deus meus,
    adjútor meus."
postcommunio:
  - "Mystéria nos, Dómine, quǽsumus, sumpta puríficent: et suo múnere tueántur."
  - $Per Dominum
references: "@Tempora/Pent04-0"
lectio2:
  - "!1 Reg 17:8-12"
  - "8 Stansque clamabat adversum phalangas Israël, et dicebat eis: Quare
    venistis parati ad prælium? Numquid ego non sum Philisthæus, et vos servi
    Saul? Eligite ex vobis virum, et descendat ad singulare certamen,"
  - "9 si quiverit pugnare mecum, et percusserit me, erimus vobis servi: si
    autem ego prævaluero, et percussero eum, vos servi eritis, et servietis
    nobis."
  - "10 Et ajebat Philisthæus: Ego exprobravi agminibus Israël hodie: Date mihi
    virum, et ineat mecum singulare certamen."
  - 11 Audiens autem Saul et omnes Israëlitæ sermones Philisthæi hujuscemodi,
    stupebant, et metuebant nimis.
  - 12 David autem erat filius viri Ephrathæi, de quo supra dictum est, de
    Bethlehem Juda, cui nomen erat Isai, qui habebat octo filios, et erat vir in
    diebus Saul senex, et grandævus inter viros.
lectio3:
  - "!1 Reg 17:13-20"
  - "13 Abierunt autem tres filii ejus majores post Saul in prælium: et nomina
    trium filiorum ejus qui perrexerunt ad bellum, Eliab primogenitus, et
    secundus Abinadab, tertiusque Samma."
  - 14 David autem erat minimus. Tribus ergo majoribus secutis Saulem,
  - 15 abiit David, et reversus est a Saul ut pasceret gregem patris sui in
    Bethlehem.
  - 16 Procedebat vero Philisthæus mane et vespere, et stabat quadraginta diebus.
  - "17 Dixit autem Isai ad David filium suum : Accipe fratribus tuis ephi
    polentæ, et decem panes istos, et curre in castra ad fratres tuos,"
  - "18 et decem formellas casei has deferes ad tribunum : et fratres tuos
    visitabis, si recte agant : et cum quibus ordinati sunt, disce."
  - 19 Saul autem, et illi, et omnes filii Israël, in Valle terebinthi pugnabant
    adversum Philisthiim.
  - "20 Surrexit ítaque David mane, et commendavit gregem custodi : et onustus
    abiit, sicut præceperat ei Isai."
lectio8:
  - Denique et si alijs imperatur, ut laxent retia sua, soli tamen Petro
    dicitur, Duc in altum:hocest in profundum disputationum. Quid enim tam
    altum, quam altitudinem divitiarum uidere, scire dei filium, et professionem
    divinæ generationis assumere. quam licet mens humana non queat plena
    rationis inuestigatione comprehendere, fidei tamen plenitudo complectitur.
    Nam etsi non licet mihi scire, quemadmodum natus sit; non licet tamen
    nescire, quod natus sit. Seriem generationis ignoro, sed auctoritatem
    generationis agnosco. Non interfuimus cum ex patre dei filius nasceretur;
    sed interfuimus, cum a patre dei filius diceretur.
lectio9:
  - "Si deo non credimus, cui credimus? Omnia enim, quæ credimus, uel visu
    credimus, uel auditu. Visus sæpe fallitur, auditus in fide est. An
    asserentis persona discutitur? Si uiri boni dicerent, nefas putaremus non
    credere : Deus asserit, probat filius,  refugiens sol fateretur, tremens
    terra testatur. In hoc altum disputationis Ecclesia a Petro ducitur : ut
    uideat hinc resurgentem dei filium, inde spiritum sanctum profluentem. Quæ
    sunt autem apostolorum quæ laxari jubentur retia, nisi uerborum
    complexiones, et quasi quidam orationis sinus, et disputationum recessus,
    qui eos quos cœperint non amittant? Et bene apostolica instrumenta piscandi
    retia sunt, quæ non captos perimunt sed reseruant, et de profundo ad lumen
    extrahunt."
  - "&teDeum"
