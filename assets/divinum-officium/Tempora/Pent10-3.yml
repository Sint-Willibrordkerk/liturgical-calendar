lectio1:
  - De libro quarto Regum
  - "!4 Reg 13:14-17"
  - "14 Eliséus autem ægrotábat infirmitáte, qua et mórtuus est; descendítque ad
    eum Joas rex Israël, et flebat coram eo, dicebátque: Pater mi, pater mi,
    currus Israël et auríga ejus."
  - "15 Et ait illi Eliséus: Affer arcum et sagíttas. Cumque attulísset ad eum
    arcum et sagíttas,"
  - "16 dixit ad regem Israël: Pone manum tuam super arcum. Et, cum posuísset
    ille manum suam, superpósuit Eliséus manus suas mánibus regis,"
  - "17 et ait: Aperi fenéstram orientálem. Cumque aperuísset, dixit Eliséus:
    Jace sagíttam. Et jecit. Et ait Eliséus: Sagítta salútis Dómini, et sagítta
    salútis contra Sýriam; percutiésque Sýriam in Aphec, donec consúmas eam."
responsory1:
  - "@Tempora/Pent01-3:Responsory1"
lectio2:
  - "!4 Reg 13:18-20"
  - "18 Et ait: Tolle sagíttas. Qui cum tulísset, rursum dixit ei: Pércute
    jáculo terram. Et, cum percussísset tribus vícibus, et stetísset,"
  - "19 irátus est vir Dei contra eum, et ait: Si percussísses quínquies aut
    séxies sive sépties, percussísses Sýriam usque ad consumptiónem; nunc autem
    tribus vícibus percúties eam."
  - 20 Mórtuus est ergo Eliséus, et sepeliérunt eum. Latrúnculi autem de Moab
    venérunt in terram in ipso anno.
responsory2:
  - "@Tempora/Pent01-3:Responsory2"
lectio3:
  - "!4 Reg 13:21; 13:24-25"
  - 21 Quidam autem sepeliéntes hóminem, vidérunt latrúnculos, et projecérunt
    cadáver in sepúlcro Eliséi. Quod cum tetigísset ossa Eliséi, revíxit homo et
    stetit super pedes suos.
  - 24 Mórtuus est autem Házaël rex Sýriæ, et regnávit Bénadad fílius ejus pro
    eo.
  - 25 Porro Joas fílius Jóachaz tulit urbes de manu Bénadad fílii Házaël, quas
    túlerat de manu Jóachaz patris sui jure prǽlii; tribus vícibus percússit eum
    Joas, et réddidit civitátes Israël.
responsory3:
  - "@Tempora/Pent01-3:Responsory3"
