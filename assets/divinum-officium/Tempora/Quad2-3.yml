introitus:
  - "!Ps 37:22-23."
  - "v. Ne derelínquas me, Dómine, Deus meus, ne discédas a me: inténde in
    adjutórium meum, Dómine, virtus salútis meæ."
  - "!Ps 37:2"
  - "Dómine, ne in furóre tuo árguas me: neque in ira tua corrípias me."
  - "&Gloria"
  - "v. Ne derelínquas me, Dómine, Deus meus, ne discédas a me: inténde in
    adjutórium meum, Dómine, virtus salútis meæ."
oratio:
  - "Pópulum tuum, quǽsumus, Dómine, propítius réspice: et, quos ab escis
    carnálibus prǽcipis abstinére, a nóxiis quoque vítiis cessáre concéde."
  - $Per Dominum
lectio:
  - Léctio libri Esther.
  - "!Esth 13:8-11; 13:15-17"
  - "In diébus illis: Orávit Mardochǽus ad Dóminum, dicens: Dómine, Dómine, Rex
    omnípotens, in dicióne enim tua cuncta sunt pósita, et non est, qui possit
    tuæ resístere voluntáti, si decréveris salváre Israël. Tu fecísti cœlum et
    terram, et quidquid cœli ámbitu continétur. Dóminus ómnium es, nec est, qui
    resístat majestáti tuæ. Et nunc, Dómine Rex, Deus Abraham, miserére pópuli
    tui, quia volunt nos inimíci nostri pérdere, et hereditátem tuam delére. Ne
    despícias partem tuam, quam redemísti tibi de Ægýpto. Exáudi deprecatiónem
    meam, et propítius esto sorti et funículo tuo, et convérte luctum nostrum in
    gáudium, ut vivéntes laudémus nomen tuum, Dómine, et ne claudas ora te
    canéntium, Dómine, Deus noster."
graduale:
  - "!Ps 27:9; 27:1"
  - Salvum fac pópulum tuum, Dómine, et bénedic hereditáti tuæ.
  - "V. Ad te, Dómine, clamávi: Deus meus, ne síleas a me, et ero símilis
    descendéntibus in lacum."
  - _
  - "!Tractus"
  - "!Ps 102:10"
  - "Dómine, non secúndum peccáta nostra, quæ fécimus nos: neque secúndum
    iniquitátes nostras retríbuas nobis"
  - "!Ps 78:8-9"
  - "Dómine, ne memíneris iniquitátum nostrárum antiquárum: cito antícipent nos
    misericórdiæ tuæ, quia páuperes facti sumus nimis. (Hic genuflectitur)"
  - "V. Adjuva nos, Deus, salutáris noster: et propter glóriam nóminis tui,
    Dómine, líbera nos: et propítius esto peccátis nostris, propter nomen tuum."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum.
  - "!Matt 20:17-28"
  - "In illo témpore: Ascéndens Jesus Jerosólymam, assúmpsit duódecim discípulos
    secréto, et ait illis: Ecce, ascéndimus Jerosólymam, et Fílius hóminis
    tradétur princípibus sacerdótum, et scribis, et condemnábunt eum morte, et
    tradent eum Géntibus ad illudéndum, et flagellándum, et crucifigéndum, et
    tértia die resúrget. Tunc accéssit ad eum mater filiórum Zebedǽi cum fíliis
    suis, adórans et petens áliquid ab eo. Qui dixit ei: Quid vis? Ait illi:
    Dic, ut sédeant hi duo fílii mei, unus ad déxteram tuam et unus ad sinístram
    in regno tuo. Respóndens autem Jesus, dixit: Nescítis, quid petátis.
    Potéstis bíbere cálicem, quem ego bibitúrus sum? Dicunt ei: Póssumus. Ait
    illis: Cálicem quidem meum bibétis: sedére autem ad déxteram meam vel
    sinístram, non est meum dare vobis, sed quibus parátum est a Patre meo. Et
    audiéntes decem, indignáti sunt de duóbus frátribus. Jesus autem vocávit eos
    ad se, et ait: Scitis, quia príncipes géntium dominántur eórum: et qui
    majóres sunt, potestátem exércent in eos. Non ita erit inter vos: sed
    quicúmque volúerit inter vos major fíeri, sit vester miníster: et qui
    volúerit inter vos primus esse, erit vester servus. Sicut Fílius hóminis non
    venit ministrári, sed ministráre, et dare ánimam suam, redemptiónem pro
    multis."
offertorium:
  - "!Ps 24:1-3"
  - "Ad te, Dómine, levávi ánimam meam: Deus meus, in te confído, non erubéscam:
    neque irrídeant me inimíci mei: étenim univérsi, qui te exspéctant, non
    confundéntur."
secreta:
  - "Hóstias, Dómine, quas tibi offérimus, propítius réspice: et, per hæc sancta
    commércia, víncula peccatórum nostrórum absólve."
  - $Per Dominum
communio:
  - "!Ps 10:8"
  - "Justus Dóminus, et justítiam diléxit: æquitátem vidit vultus ejus."
postcommunio:
  - "Sumptis, Dómine, sacraméntis: ad redemptiónis ætérnæ, quǽsumus, proficiámus
    augméntum."
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Deus, innocéntiæ restitútor et amátor, dírige ad te tuórum corda
    servórum: ut, spíritus tui fervóre concépto, et in fide inveniántur
    stábiles, et in ópere efficáces."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 20:17-28"
  - "In illo témpore: Ascéndens Jesus Jerosólymam, assúmpsit duódecim discípulos
    secréto, et ait illis: Ecce ascéndimus Jerosólymam, et Fílius hóminis
    tradétur princípibus sacerdótum, et scribis, et condemnábunt eum morte. Et
    réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Lib. 5 de Fide ad Gratianum, cap. 2, post initium"
  - "Consideráte, quæ mater filiórum Zebedǽi cum fíliis et pro fíliis petat:
    mater est útique, cui pro filiórum honóre sollícitæ, immoderátior quidem,
    sed tamen ignoscénda mensúra votórum est. Atque mater ætáte longǽva, stúdio
    religiósa, solátio destitúta, quæ tunc témporis, quando vel juvánda, vel
    alénda foret válidæ prolis auxílio, abésse sibi líberos patiebátur, et
    voluptáti suæ mercédem sequéntium Christum prætúlerat filiórum. Qui prima
    voce vocáti a Dómino (ut légimus) relíctis rétibus et patre, secúti sunt
    eum."
responsory1:
  - "@Tempora/Quad2-0:Responsory7"
lectio2:
  - "Hæc ígitur, stúdio matérnæ sedulitátis indulgéntior, obsecrábat Salvatórem,
    dicens: Ut sédeant hi duo fílii mei, unus ad déxteram tuam, et alter ad
    sinístram in regno tuo. Etsi error, pietátis tamen error est. Nésciunt enim
    matérna víscera patiéntiam: etsi voti avára, tamen veniábilis cupíditas, quæ
    non pecúniæ est ávida, sed grátiæ. Nec inverecúnda petítio, quæ non sibi,
    sed líberis consulébat. Matrem consideráte, matrem cogitáte."
responsory2:
  - "@Tempora/Quad2-0:Responsory8"
lectio3:
  - "Considerábat Christus matris dilectiónem, quæ filiórum mercéde grandǽvam
    solabátur senéctam: et desidériis licet fessa matérnis, carissimórum
    pignórum tolerábat abséntiam. Consideráte étiam féminam, hoc est, sexum
    fragiliórem, quem Dóminus própria nondum confirmáverat passióne.
    Consideráte, inquam, Hevæ illíus primæ mulíeris herédem, transfúsa in omnes
    immoderátæ cupiditátis successióne labéntem: quam Dóminus adhuc próprio
    sánguine non redémerat, nondum inólitam afféctibus ómnium immódici contra
    fas honóris appeténtiam suo Christus cruóre dilúerat. Hereditário ígitur
    múlier delinquébat erróre."
responsory3:
  - "@Tempora/Quad2-0:Responsory9"
