lectio2:
  - "!Rom 16:17-19"
  - 17 Rogo autem vos fratres, ut observétis eos qui dissensiónes et
    offendícula, præter doctrínam, quam vos didicístis, fáciunt, et declináte ab
    illis.
  - "18 Hujuscémodi enim Christo Dómino nostro non sérviunt, sed suo ventri: et
    per dulces sermónes et benedictiónes sedúcunt corda innocéntium."
  - 19 Vestra enim obediéntia in omnem locum divulgáta est. Gáudeo ígitur in
    vobis. Sed volo vos sapiéntes esse in bono, et símplices in malo.
