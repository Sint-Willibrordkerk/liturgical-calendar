lectio3:
  - "!Rom 16:21-24"
  - 21 Salútat vos Timótheus adjútor meus, et Lúcius, et Jason, et Sosípater
    cognáti mei.
  - 22 Salúto vos ego Tértius, qui scripsi epístolam, in Dómino.
  - 23 Salútat vos Cajus hospes meus, et univérsa ecclésia. Salútat vos Erástus
    arcárius civitátis, et Quartus, frater.
  - 24 Grátia Dómini nostri Jesu Christi cum ómnibus vobis. Amen.
