lectio1:
  - De Epístola ad Romános
  - "!Rom 16:1-5"
  - "1 Comméndo autem vobis Phœben sorórem nostram, quæ est in ministério
    ecclésiæ, quæ est in Cenchris:"
  - "2 ut eam suscipiátis in Dómino digne sanctis: et assistátis ei in quocúmque
    negótio vestri indigúerit: étenim ipsa quoque ásstitit multis, et mihi
    ipsi."
  - 3 Salutáte Priscam et Aquilam, adjutóres meos in Christo Jesu
  - "4 (qui pro ánima mea suas cervíces supposuérunt: quibus non solus ego
    grátias ago, sed et cunctæ ecclésiæ géntium),"
  - 5 et domésticam ecclésiam eórum. Salutáte Epǽnetum diléctum mihi, qui est
    primitívus Asiæ in Christo.
