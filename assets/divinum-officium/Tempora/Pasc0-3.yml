oratio:
  - "Deus, qui nos Resurrectiónis Domínicæ ánnua solemnitáte lætíficas: concéde
    propítius; ut per temporália festa, quæ ágimus, perveníre ad gáudia ætérna
    mereámur."
  - $Per eundem
lectio:
  - Léctio Actuum Apostolórum
  - "!Acts 3:13-15; 3:17-19"
  - "In diébus illis: Apériens Petrus os suum, dixit: Viri Israëlítæ, et qui
    timétis Deum, audíte. Deus Abraham et Deus Isaac et Deus Jacob, Deus patrum
    nostrórum, glorificávit Fílium suum Jesum, quem vos quidem tradidístis et
    negástis ante fáciem Piláti, judicánte illo dimítti. Vos autem sanctum et
    justum negástis, et petístis virum homicídam donári vobis: auctórem vero
    vitæ interfecístis, quem Deus suscitávit a mórtuis, cujus nos testes sumus.
    Et nunc, fratres, scio, quia per ignorántiam fecístis, sicut et príncipes
    vestri. Deus autem, quæ prænuntiávit per os ómnium Prophetárum, pati
    Christum suum, sic implévit. Pœnitémini ígitur et convertímini, ut deleántur
    peccáta vestra."
graduale:
  - "!Ps 117:24; 117:16"
  - "Hæc dies, quam fecit Dóminus: exsultémus et lætémur in ea."
  - V. Déxtera Dómini fecit virtútem, déxtera Dómini exaltávit me.
  - Allelúja, allelúja.
  - "!Luc 24:34"
  - "V. Surréxit Dóminus vere: et appáruit Petro."
