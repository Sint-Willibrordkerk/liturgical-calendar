evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joannes 21:1-14"
  - "In illo témpore: Manifestávit se íterum Jesus discípulis ad mare
    Tiberíadis. Manifestávit autem sic. Erant simul Simon Petrus et Thomas, qui
    dícitur Dídymus, et Nathánaël, qui erat a Cana Galilǽæ, et fílii Zebedǽi et
    álii ex discípulis ejus duo. Dicit eis Simon Petrus: Vado piscári. Dicunt
    ei: Venímus et nos tecum. Et exiérunt et ascendérunt in navim: et illa nocte
    nihil prendidérunt. Mane autem facto, stetit Jesus in lítore: non tamen
    cognovérunt discípuli, quia Jesus est. Dixit ergo eis Jesus: Púeri, numquid
    pulmentárium habétis? Respondérunt ei: Non. Dicit eis: Míttite in déxteram
    navígii rete, et inveniétis. Misérunt ergo: et jam non valébant illud
    tráhere præ multitúdine píscium. Dixit ergo discípulus ille, quem diligébat
    Jesus, Petro: Dóminus est. Simon Petrus cum audísset, quia Dóminus est,
    túnica succínxit se - erat enim nudus, - et misit se in mare. Alii autem
    discípuli navígio venérunt - non enim longe erant a terra, sed quasi cúbitis
    ducéntis, - trahéntes rete píscium. Ut ergo descendérunt in terram, vidérunt
    prunas pósitas, et piscem superpósitum, et panem. Dicit eis Jesus: Afférte
    de píscibus, quos prendidístis nunc. Ascéndit Simon Petrus, et traxit rete
    in terram, plenum magnis píscibus centum quinquagínta tribus. Et cum tanti
    essent, non est scissum rete. Dicit eis Jesus: Veníte, prandéte. Et nemo
    audébat discumbéntium interrogáre eum: Tu quis es? sciéntes, quia Dóminus
    est. Et venit Jesus, et áccipit panem, et dat eis, et piscem simíliter. Hoc
    jam tértio manifestátus est Jesus discípulis suis, cum resurrexísset a
    mórtuis."
offertorium:
  - "!Ps 77:23-25"
  - "Portas cœli apéruit Dóminus: et pluit illis manna, ut éderent: panem cœli
    dedit eis: panem Angelórum manducávit homo, allelúja."
secreta:
  - "Sacrifícia, Dómine, paschálibus gáudiis immolámus: quibus Ecclésia tua
    mirabíliter et páscitur et nutrítur."
  - $Per Dominum
communio:
  - "!Rom 6:9"
  - "Christus resúrgens ex mórtuis jam non móritur, allelúja: mors illi ultra
    non dominábitur, allelúja, allelúja."
postcommunio:
  - "Ab omni nos, quǽsumus, Dómine, vetustáte purgátos: sacraménti tui veneránda
    percéptio in novam tránsferat creatúram:"
  - $Qui vivis
