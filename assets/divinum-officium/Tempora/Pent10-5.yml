lectio1:
  - De libro quarto Regum
  - "!4 Reg 17:21-23"
  - 21 Separávit Jeróboam Israël a Dómino, et peccáre eos fecit peccátum magnum.
  - 22 Et ambulavérunt fílii Israël in univérsis peccátis Jeróboam quæ fécerat,
    et non recessérunt ab eis,
  - 23 úsquequo Dóminus auférret Israël a fácie sua, sicut locútus fúerat in
    manu ómnium servórum suórum prophetárum; translatúsque est Israël de terra
    sua in Assýrios, usque in diem hanc.
responsory1:
  - "@Tempora/Pent01-2:Responsory1"
lectio2:
  - "!4 Reg 17:24-25"
  - "24 Addúxit autem rex Assyriórum de Babylóne et de Cutha et de Avah et de
    Emath et de Sephárvaim, et collocávit eos in civitátibus Samaríæ pro fíliis
    Israël: qui possedérunt Samaríam, et habitavérunt in úrbibus ejus."
  - 25 Cumque ibi habitáre cœpíssent, non timébant Dóminum, et immísit in eos
    Dóminus leónes, qui interficiébant eos.
responsory2:
  - "@Tempora/Pent01-2:Responsory2"
lectio3:
  - "!4 Reg 17:26-27"
  - "26 Nuntiatúmque est regi Assyriórum et dictum: gentes, quas transtulísti,
    et habitáre fecísti in civitátibus Samaríæ, ignórant legítima Dei terræ: et
    immísit in eos Dóminus leónes, et ecce interfíciunt eos, eo quod ignórent
    ritum Dei terræ."
  - "27 Præcépit autem rex Assyriórum, dicens: Dúcite illuc unum de
    sacerdótibus, quos inde captívos adduxístis; et vadat, et hábitet cum eis:
    et dóceat eos legítima Dei terræ."
responsory3:
  - "@Tempora/Pent01-2:Responsory3"
