introitus:
  - "!Ps 24:1-3"
  - "v. Ad te levávi ánimam meam: Deus meus, in te confído, non erubéscam: neque
    irrídeant me inimíci mei: étenim univérsi, qui te exspéctant, non
    confundéntur."
  - "!Ps 24:4"
  - "Vias tuas, Dómine, demónstra mihi: et sémitas tuas édoce me."
  - "&Gloria"
  - "v. Ad te levávi ánimam meam: Deus meus, in te confído, non erubéscam: neque
    irrídeant me inimíci mei: étenim univérsi, qui te exspéctant, non
    confundéntur."
oratio:
  - "Excita, quǽsumus, Dómine, poténtiam tuam, et veni: ut ab imminéntibus
    peccatórum nostrórum perículis, te mereámur protegénte éripi, te liberánte
    salvári:"
  - $Qui vivis
lectio:
  - Lectio Epístolæ beáti Pauli Apóstoli ad Romános
  - "!Rom 13:11-14."
  - "Fratres: Sciéntes, quia hora est jam nos de somno súrgere. Nunc enim
    própior est nostra salus, quam cum credídimus. Nox præcéssit, dies autem
    appropinquávit. Abjiciámus ergo ópera tenebrárum, et induámur arma lucis.
    Sicut in die honéste ambulémus: non in comessatiónibus et ebrietátibus, non
    in cubílibus et impudicítiis, non in contentióne et æmulatióne: sed
    induímini Dóminum Jesum Christum."
graduale:
  - "!Ps 24:3; 24:4"
  - Univérsi, qui te exspéctant, non confundéntur, Dómine.
  - "V. Vias tuas, Dómine, notas fac mihi: et sémitas tuas édoce me. Allelúja,
    allelúja."
  - "!Ps 84:8."
  - "V. Osténde nobis, Dómine, misericórdiam tuam: et salutáre tuum da nobis.
    Allelúja."
gradualef:
  - "!Ps 24:3; 24:4"
  - Univérsi, qui te exspéctant, non confundéntur, Dómine.
  - "V. Vias tuas, Dómine, notas fac mihi: et sémitas tuas édoce me."
evangelium:
  - Sequéntia ++ sancti Evangélii secundum Lucam
  - "!Luc 21:25-33."
  - "In illo témpore: Dixit Jesus discípulis suis: Erunt signa in sole et luna
    et stellis, et in terris pressúra géntium præ confusióne sónitus maris et
    flúctuum: arescéntibus homínibus præ timóre et exspectatióne, quæ
    supervénient univérso orbi: nam virtútes cœlórum movebúntur. Et tunc
    vidébunt Fílium hóminis veniéntem in nube cum potestáte magna et majestáte.
    His autem fíeri incipiéntibus, respícite et leváte cápita vestra: quóniam
    appropínquat redémptio vestra. Et dixit illis similitúdinem: Vidéte
    ficúlneam et omnes árbores: cum prodúcunt jam ex se fructum, scitis, quóniam
    prope est æstas. Ita et vos, cum vidéritis hæc fíeri, scitóte, quóniam prope
    est regnum Dei. Amen, dico vobis, quia non præteríbit generátio hæc, donec
    ómnia fiant. Cœlum et terra transíbunt: verba autem mea non transíbunt."
offertorium:
  - "!Ps 24:1-3."
  - "Ad te levávi ánimam meam: Deus meus, in te confído, non erubéscam: neque
    irrídeant me inimíci mei: étenim univérsi, qui te exspéctant, non
    confundéntur."
secreta:
  - Hæc sacra nos, Dómine, poténti virtúte mundátos ad suum fáciant purióres
    veníre princípium.
  - $Per Dominum
communio:
  - "!Ps 84:13."
  - "Dóminus dabit benignitátem: et terra nostra dabit fructum suum."
postcommunio:
  - "Suscipiámus, Dómine, misericórdiam tuam in médio templi tui: ut
    reparatiónis nostræ ventúra sollémnia cóngruis honóribus præcedámus."
  - $Per Dominum
