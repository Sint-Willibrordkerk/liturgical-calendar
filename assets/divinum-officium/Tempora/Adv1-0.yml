rubrica-cisterciensis/responsory-vespera-1:
  - "Responsorium. Missus est Gábriel Angelus ad Maríam Vírginem desponsátam
    Joseph, núntians ei verbum; et expavéscit Virgo de lúmine: ne tímeas, María,
    invenísti grátiam apud Dóminum:"
  - "* Ecce concípies, et páries, et vocábitur Altíssimi Fílius."
  - V. Dabit ei Dóminus Deus sedem David, patris ejus, et regnábit in domo Jacob
    in ætérnum.
  - R. Ecce concípies, et páries, et vocábitur Altíssimi Fílius.
versum-1:
  - "@Psalterium/Special/Major Special:Adv Versum 3"
ant-1:
  - Ecce nomen Dómini * venit de longínquo, et cláritas ejus replet orbem
    terrárum.
rubrica-cisterciensis/invit:
  - Ecce venit Rex, * Occurrámus óbviam Salvatóri nostro.
lectio1:
  - Incipit liber Isaíæ Prophétæ
  - "!Isa 1:1-3"
  - 1 Vísio Isaíæ fílii Amos, quam vidit super Judam et Jerúsalem, in diébus
    Ozíæ, Jóatham, Achaz, et Ezechíæ, regum Juda.
  - "2 Audíte, cæli, et áuribus pércipe, terra, quóniam Dóminus locútus est:
    Fílios enutrívi, et exaltávi: ipsi autem sprevérunt me."
  - "3 Cognóvit bos possessórem suum, et ásinus præsépe dómini sui: Israël autem
    me non cognóvit, et pópulus meus non intelléxit."
responsory1:
  - "R. Aspíciens a longe, ecce vídeo Dei poténtiam veniéntem, et nébulam totam
    terram tegéntem. * Ite óbviam ei, et dícite: * Núntia nobis, si tu es ipse,
    * Qui regnatúrus es in pópulo Israël."
  - V. Quique terrígenæ, et fílii hóminum, simul in unum dives et pauper. Ite
    óbviam ei, et dícite.
  - V. Qui regis Israël, inténde, qui dedúcis velut ovem Joseph. Núntia nobis,
    si tu es ipse.
  - V. Tóllite portas, príncipes, vestras, et elevámini portæ æternáles, et
    introíbit Rex glóriæ. Qui regnatúrus es in pópulo Israël.
  - "&Gloria"
  - "R. Aspíciens a longe, ecce vídeo Dei poténtiam veniéntem, et nébulam totam
    terram tegéntem. * Ite óbviam ei, et dícite: * Núntia nobis, si tu es ipse,
    * Qui regnatúrus es in pópulo Israël."
lectio2:
  - "!Isa 1:4-6"
  - "4 Væ genti peccatríci, pópulo gravi iniquitáte, sémini nequam, fíliis
    scelerátis: dereliquérunt Dóminum, blasphemavérunt Sanctum Israël,
    abalienáti sunt retrórsum."
  - 5 Super quo percútiam vos ultra, addéntes prævaricatiónem? omne caput
    lánguidum, et omne cor mærens.
  - "6 A planta pedis usque ad vérticem non est in eo sánitas: vulnus, et livor,
    et plaga tumens non est circumligáta, nec curáta medicámine, neque fota
    óleo."
responsory2:
  - "R. Aspiciébam in visu noctis, et ecce in núbibus cæli Fílius hóminis
    veniébat: et datum est ei regnum, et honor:"
  - "* Et omnis pópulus, tribus, et linguæ sérvient ei."
  - "V. Potéstas ejus, potéstas ætérna, quæ non auferétur: et regnum ejus, quod
    non corrumpétur."
  - R. Et omnis pópulus, tribus, et linguæ sérvient ei.
lectio3:
  - "!Isa 1:7-9"
  - "7 Terra vestra desérta, civitátes vestræ succénsæ igni: regiónem vestram
    coram vobis aliéni dévorant, et desolábitur sicut in vastitáte hostíli."
  - 8 Et derelinquétur fília Sion ut umbráculum in vínea, et sicut tugúrium in
    cucumerário, et sicut cívitas quæ vastátur.
  - 9 Nisi Dóminus exercítuum reliquísset nobis semen, quasi Sódoma fuissémus,
    et quasi Gomórrha símiles essémus.
responsory3:
  - "R. Missus est Gábriel Angelus ad Maríam Vírginem desponsátam Joseph,
    núntians ei verbum; et expavéscit Virgo de lúmine: ne tímeas, María,
    invenísti grátiam apud Dóminum:"
  - "* Ecce concípies, et páries, et vocábitur Altíssimi Fílius."
  - V. Dabit ei Dóminus Deus sedem David, patris ejus, et regnábit in domo Jacob
    in ætérnum.
  - R. Ecce concípies, et páries, et vocábitur Altíssimi Fílius.
  - "&Gloria"
  - R. Ecce concípies, et páries, et vocábitur Altíssimi Fílius.
lectio4:
  - Sermo sancti Leónis Papæ
  - "!Sermo 8 de jejunio decimi mensis et eleemosynis"
  - "Cum de advéntu regni Dei, et de mundi fine ac témporum, discípulos suos
    Salvátor instrúeret, totámque Ecclésiam suam in Apóstolis erudíret: Cavéte,
    inquit, ne forte gravéntur corda vestra in crápula, et ebrietáte, et
    cogitatiónibus sæculáribus. Quod útique præcéptum, dilectíssimi, ad nos
    speciálius pertinére cognóscimus, quibus denuntiátus dies, etiámsi est
    occúltus, non dubitátur esse vicínus."
responsory4:
  - "R. Ave, María, grátia plena, Dóminus tecum:"
  - "* Spíritus Sanctus supervéniet in te, et virtus Altíssimi obumbrábit tibi:
    quod enim ex te nascétur Sanctum, vocábitur Fílius Dei."
  - V. Quómodo fiet istud, quóniam virum non cognósco? Et respóndens Angelus,
    dixit ei.
  - "R. Spíritus Sanctus supervéniet in te, et virtus Altíssimi obumbrábit tibi:
    quod enim ex te nascétur Sanctum, vocábitur Fílius Dei."
lectio5:
  - "Ad cujus advéntum omnem hóminem cónvenit præparári: ne quem aut ventri
    déditum, aut curis sæculáribus invéniat implicátum. Quotidiáno enim,
    dilectíssimi, experiménto probátur, potus satietáte áciem mentis obtúndi, et
    cibórum nimietáte vigórem cordis hebetári; ita ut delectátio edéndi étiam
    córporum contrária sit salúti, nisi rátio temperántiæ obsístat illécebræ, et
    quod futúrum est óneri, súbtrahat voluptáti."
responsory5:
  - R. Salvatórem exspectámus, Dóminum Jesum Christum,
  - "* Qui reformábit corpus humilitátis nostræ configurátum córpori claritátis
    suæ."
  - V. Sóbrie, et juste, et pie vivámus in hoc sǽculo, exspectántes beátam spem,
    et advéntum glóriæ magni Dei.
  - R. Qui reformábit corpus humilitátis nostræ configurátum córpori claritátis
    suæ.
lectio6:
  - "Quamvis enim sine ánima nihil caro desíderet, et inde accípiat sensus, unde
    sumit et motus: ejúsdem tamen est ánimæ, quædam sibi súbditæ negáre
    substántiæ, et interióri judício ab inconveniéntibus exterióra frenáre: ut a
    corpóreis cupiditátibus sǽpius líbera, in aula mentis possit divínæ vacáre
    sapiéntiæ: ubi omni strépitu terrenárum silénte curárum, in meditatiónibus
    sanctis, et in delíciis lætétur ætérnis."
responsory6:
  - "R. Obsecro, Dómine, mitte quem missúrus es: vide afflictiónem pópuli tui:"
  - "* Sicut locútus es, veni, * Et líbera nos."
  - V. Qui regis Israël, inténde, qui dedúcis velut ovem Joseph, qui sedes super
    Chérubim.
  - R. Sicut locútus es, veni.
  - "&Gloria"
  - R. Et líbera nos.
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 21:25-33"
  - "In illo témpore: Dixit Jesus discípulis suis: Erunt signa in sole, et luna,
    et stellis, et in terris pressúra géntium. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 1 in Evangelia"
  - "Dóminus ac Redémptor noster parátos nos inveníre desíderans, senescéntem
    mundum quæ mala sequántur denúntiat, ut nos ab ejus amóre compéscat.
    Appropinquántem ejus términum quantæ percussiónes prævéniant, innotéscit:
    ut, si Deum metúere in tranquillitáte nólumus, saltem vicínum ejus judícium
    vel percussiónibus attríti timeámus."
responsory7:
  - "R. Ecce virgo concípiet, et páriet fílium, dicit Dóminus:"
  - "* Et vocábitur nomen ejus Admirábilis, Deus, Fortis."
  - V. Super sólium David, et super regnum ejus sedébit in ætérnum.
  - R. Et vocábitur nomen ejus Admirábilis, Deus, Fortis.
lectio8:
  - "Huic étenim lectióni sancti Evangélii, quam modo vestra fratérnitas
    audívit, paulo supérius Dóminus præmísit, dicens: Exsúrget gens contra
    gentem, et regnum advérsus regnum: et erunt terræmótus magni per loca, et
    pestiléntiæ, et fames. Et quibúsdam interpósitis, hoc, quod modo audístis,
    adjúnxit: Erunt signa in sole, et luna, et stellis, et in terris pressúra
    géntium præ confusióne sónitus maris, et flúctuum. Ex quibus profécto
    ómnibus ália jam facta cérnimus, ália in próximo ventúra formidámus."
responsory8:
  - "R. Audíte verbum Dómini, gentes, et annuntiáte illud in fínibus terræ:"
  - "* Et ínsulis, quæ procul sunt, dícite: Salvátor noster advéniet."
  - "V. Annuntiáte, et audítum fácite: loquímini, et clamáte."
  - "R. Et ínsulis, quæ procul sunt, dícite: Salvátor noster advéniet."
lectio9:
  - "Nam gentem contra gentem exsúrgere, earúmque pressúram terris insístere,
    plus jam in nostris tempóribus cérnimus, quam in codícibus légimus. Quod
    terræmótus urbes innúmeras óbruat, ex áliis mundi pártibus scitis quam
    frequénter audívimus. Pestiléntias sine cessatióne pátimur. Signa vero in
    sole, et luna, et stellis, adhuc apérte mínime vídimus: sed quia et hæc non
    longe sint, ex ipsa jam áëris immutatióne collígimus."
responsory9:
  - "R. Ecce dies véniunt, dicit Dóminus, et suscitábo David germen justum: et
    regnábit rex, et sápiens erit, et fáciet judícium et justítiam in terra:"
  - "* Et hoc est nomen quod vocábunt eum: * Dóminus justus noster."
  - V. In diébus illis salvábitur Juda, et Israël habitábit confidénter.
  - "R. Et hoc est nomen quod vocábunt eum:"
  - "&Gloria"
  - R. Dóminus justus noster.
ant-laudes:
  - In illa die * stillábunt montes dulcédinem, et colles fluent lac et mel,
    allelúja.
  - Jucundáre, * fília Sion, et exsúlta satis, fília Jerúsalem, allelúja.
  - "Ecce Dóminus véniet, * et omnes Sancti ejus cum eo: et erit in die illa lux
    magna, allelúja."
  - "Omnes sitiéntes, * veníte ad aquas: quǽrite Dóminum, dum inveníri potest,
    allelúja."
  - Ecce véniet * Prophéta magnus, et ipse renovábit Jerúsalem, allelúja.
