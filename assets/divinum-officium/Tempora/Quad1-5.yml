lectio1:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 5:1-15"
  - "In illo témpore: Erat dies festus Judæórum, et ascéndit Jesus Jerosólymam.
    Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tractatus 17 in Joannem, post initium"
  - "Videámus quid volúerit significáre in illo uno, quem étiam ipse servans
    unitátis mystérium, de tot languéntibus unum sanáre dignátus est. Invénit in
    annis ejus númerum quemdam languóris: trigínta et octo annos habébat in
    infirmitáte. Hic númerus quómodo magis ad languórem pertíneat, quam ad
    sanitátem, paulo diligéntius exponéndum est. Inténtos vos volo: áderit
    Dóminus, ut cóngrue loquar, et sufficiénter audiátis. Quadragenárius númerus
    sacrátus nobis in quadam perfectióne commendátur; notum esse árbitror
    caritáti vestræ: testántur sæpíssime divínæ Scriptúræ: jejúnium hoc número
    consecrátum esse, bene nostis. Nam et Móyses quadragínta diébus jejunávit,
    et Elías tótidem: et ipse Dóminus noster et Salvátor Jesus Christus hunc
    jejúnii númerum implévit. Per Móysen significátur Lex, per Elíam
    significántur Prophétæ, per Dóminum significátur Evangélium. Ideo in illo
    monte tres apparuérunt, ubi se discípulis osténdit in claritáte vultus et
    vestis suæ: appáruit enim médius inter Móysen et Elíam, tamquam Evangélium
    testimónium habéret a Lege et Prophétis."
responsory1:
  - "@Tempora/Quad1-0:Responsory4"
lectio2:
  - "Sive ergo in Lege, sive in Prophétis, sive in Evangélio, quadragenárius
    númerus nobis in jejúnio commendátur. Jejúnium autem magnum et generále est,
    abstinére ab iniquitátibus et illícitis voluptátibus sǽculi, quod est
    perféctum jejúnium: Ut abnegántes impietátem et sæculáres cupiditátes,
    temperánter et juste et pie vivámus in hoc sǽculo. Huic jejúnio quam
    mercédem addit Apóstolus? Séquitur et dicit: Exspectántes illam beátam spem,
    et manifestatiónem glóriæ beáti Dei et Salvatóris nostri Jesu Christi. In
    hoc ergo sǽculo quasi quadragésimam abstinéntiæ celebrámus, cum bene
    vívimus, cum ab iniquitátibus et ab illícitis voluptátibus abstinémus: sed
    quia hæc abstinéntia sine mercéde non erit, exspectámus beátam illam spem,
    et revelatiónem glóriæ magni Dei et Salvatóris nostri Jesu Christi. In illa
    spe, cum fúerit de spe facta res, acceptúri sumus mercédem denárium. Ipsa
    enim merces rédditur operáriis in vínea laborántibus, secúndum Evangélium,
    quod vos credo reminísci: neque enim ómnia commemoránda sunt tamquam rúdibus
    et imperítis. Denárius ergo, qui accépit nomen a número decem, rédditur, et
    conjúnctus quadragenário fit quinquagenárius: unde cum labóre celebrámus
    Quadragésimam ante Pascha; cum lætítia vero, tamquam accépta mercéde,
    Quinquagésimam post Pascha."
responsory2:
  - "@Tempora/Quad1-0:Responsory5"
lectio3:
  - "Mementóte quod proposúerim númerum trigínta octo annórum in illo lánguido.
    Volo expónere, quare númerus ille trigésimus et octávus, languóris sit
    pótius quam sanitátis. Ergo, ut dicébam, cáritas implet Legem: ad
    plenitúdinem Legis in ómnibus opéribus pértinet quadragenárius númerus. In
    caritáte autem duo præcépta nobis commendántur: Díliges Dóminum Deum tuum ex
    toto corde tuo, et ex tota ánima tua, et ex tota mente tua: et díliges
    próximum tuum sicut teípsum. In his duóbus præcéptis tota Lex pendet, et
    Prophétæ. Mérito et illa vídua omnes facultátes suas, duo minúta misit in
    dona Dei: mérito et pro illo lánguido a latrónibus sauciáto stabulárius duos
    nummos accépit, unde sanarétur: mérito apud Samaritános bíduum fecit Jesus,
    ut eos caritáte firmáret. Binário ergo isto número cum áliquid boni
    significátur, máxime bipertíta cáritas commendátur. Si ergo quadragenárius
    númerus habet perfectiónem Legis, et Lex non implétur nisi in gémino
    præcépto caritátis: quid miráris, quia languébat, qui ad quadragínta, duo
    minus habébat?"
