oratio:
  - "Esto, Dómine, propítius plebi tuæ: et, quam tibi facis esse devótam,
    benígno réfove miserátus auxílio."
  - $Per Dominum
lectio:
  - Léctio Ezechiélis Prophétæ
  - "!Ezech 18:20-28"
  - "Hæc dicit Dóminus Deus: Anima, quæ peccáverit, ipsa moriétur: fílius non
    portábit iniquitátem patris, et pater non portábit iniquitátem fílii:
    justítia justi super eum erit, et impíetas ímpii erit super eum. Si autem
    ímpius égerit pæniténtiam ab ómnibus peccátis suis, quæ operátus est, et
    custodíerit ómnia præcépta mea, et fécerit judícium et justítiam: vita
    vivet, et non moriétur. Omnium iniquitátum ejus, quas operátus est, non
    recordábor: in justítia sua, quam operátus est, vivet. Numquid voluntátis
    meæ est mors ímpii, dicit Dóminus Deus, et non ut convertátur a viis suis,
    et vivat? Si autem avérterit se justus a justítia sua, et fécerit
    iniquitátem secúndum omnes abominatiónes, quas operári solet ímpius, numquid
    vivet? omnes justítiæ ejus, quas fécerat, non recordabúntur: in
    prævaricatióne, qua prævaricátus est, et in peccáto suo, quod peccávit, in
    ipsis moriétur. Et dixístis: Non est æqua via Dómini. Audíte ergo, domus
    Israël: Numquid via mea non est æqua, et non magis viæ vestræ pravæ sunt?
    Cum enim avérterit se justus a justítia sua, et fécerit iniquitátem,
    moriétur in eis: in injustítia, quam operátus est, moriétur. Et cum
    avérterit se ímpius ab impietáte sua, quam operátus est, et fécerit judícium
    et justítiam: ipse ánimam suam vivificábit. Consíderans enim, et avértens se
    ab ómnibus iniquitátibus suis, quas operátus est, vita vivet, et non
    moriétur, ait Dóminus omnípotens."
graduale:
  - "!Ps 85:2; 85:6"
  - Salvum fac servum tuum. Deus meus, sperántem in te.
  - V. Auribus pércipe, Dómine, oratiónem meam.
  - _
  - "!Tractus"
  - "!Ps 102:10"
  - "Dómine, non secúndum peccáta nostra, quæ fécimus nos: neque secúndum
    iniquitátes nostras retríbuas nobis"
  - "!Ps 78:8-9"
  - "Dómine, ne memíneris iniquitátum nostrárum antiquárum: cito antícipent nos
