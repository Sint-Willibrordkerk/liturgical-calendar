  - "V. Adjuva nos, Deus, salutáris noster: et propter glóriam nóminis tui,
    Dómine, líbera nos: et propítius esto peccátis nostris, propter nomen tuum."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joann 5:1-15"
  - "In illo témpore: Erat dies festus Judæórum, et ascéndit Jesus Jerosólymam.
    Est autem Jerosólymis Probática piscína, quæ cognominátur hebráice
    Bethsáida, quinque pórticus habens. In his jacébat multitúdo magna
    languéntium, cæcórum, claudórum, aridórum exspectántium aquæ motum. Angelus
    autem Dómini descendébat secúndum tempus in piscínam, et movebátur aqua. Et,
    qui prior descendísset in piscínam post motiónem aquæ, sanus fiébat, a
    quacúmque detinebátur infirmitáte. Erat autem quidam homo ibi, trigínta et
    octo annos habens in infirmitáte sua. Hunc cum vidísset Jesus jacéntem, et
    cognovísset, quia jam multum tempus habéret, dicit ei: Vis sanus fíeri?
    Respóndit ei lánguidus: Dómine, hóminem non hábeo, ut, cum turbáta fúerit
    aqua, mittat me in piscínam: dum vénio enim ego, álius ante me descéndit.
    Dicit ei Jesus: Surge, tolle grabátum tuum, et ámbula. Et statim sanus
    factus est homo ille: et sústulit grabátum suum, et ambulábat. Erat autem
    sábbatum in die illo. Dicébant ergo Judǽi illi, qui sanátus fúerat: Sábbatum
    est, non licet tibi tóllere grabátum tuum. Respóndit eis: Qui me sanum
    fecit, ille mihi dixit: Tolle grabátum tuum, et ámbula. Interrogavérunt ergo
    eum: Quis est ille homo, qui dixit tibi: Tolle grabátum tuum et ámbula? Is
    autem, qui sanus fúerat efféctus, nesciébat, quis esset. Jesus enim
    declinávit a turba constitúta in loco. Póstea invénit eum Jesus in templo,
    et dixit illi: Ecce, sanus factus es: jam noli peccáre, ne detérius tibi
    áliquid contíngat. Abiit ille homo, et nuntiávit Judǽis, quia Jesus esset,
    qui fecit eum sanum."
offertorium:
  - "!Ps 102:2; 102:5"
  - "Bénedic, ánima mea, Dómino, et noli oblivísci omnes retributiónes ejus: et
    renovábitur, sicut áquilæ, juvéntus tua."
