introitus:
  - "!Ps 55:5."
  - "v. In Deo laudábo verbum, in Dómino laudábo sermónem: in Deo sperábo, non
    timebo, quid fáciat mihi homo."
  - "!Ps 55:2"
  - "Miserére mei, Deus, quóniam conculcávit me homo: tota die bellans
    tribulávit me."
  - "&Gloria"
  - "v. In Deo laudábo verbum, in Dómino laudábo sermónem: in Deo sperábo, non
    timebo, quid fáciat mihi homo."
oratio:
  - "Córdibus nostris, quǽsumus, Dómine, grátiam tuam benígnus infúnde: ut,
    sicut ab escis carnálibus abstinémus; ita sensus quoque nostros a nóxiis
    retrahámus excéssibus."
  - $Per Dominum
lectio:
  - Léctio libri Regum.
  - "!4 Reg 5:1-15"
  - "In diébus illis: Náaman, princeps milítiæ regis Sýriæ, erat vir magnus apud
    dóminum suum, et honorátus: per illum enim dedit Dóminus salútem Sýriæ: erat
    autem vir fortis et dives, sed leprósus. Porro de Sýria egréssi fúerant
    latrúnculi, et captívam dúxerant de terra Israël puéllam párvulam, quæ erat
    in obséquio uxóris Náaman, quæ ait ad dóminam suam: Utinam fuísset dóminus
    meus ad Prophétam, qui est in Samaría: profécto curásset eum a lepra, quam
    habet. Ingréssus est ítaque Náaman ad dóminum suum, et nuntiávit ei, dicens:
    Sic et sic locúta est puélla de terra Israël. Dixítque ei rex Sýriæ: Vade,
    et mittam lítteras ad regem Israël. Qui cum proféctus esset, et tulísset
    secum decem talénta argénti, et sex míllia áureos, et decem mutatória
    vestimentórum, détulit lítteras ad regem Israël in hæc verba: Cum accéperis
    epístolam hanc, scito, quod míserim ad te Náaman servum meum, ut cures eum a
    lepra sua. Cumque legísset rex Israël lítteras, scidit vestiménta sua, et
    ait: Numquid Deus ego sum, ut occídere possim et vivificáre, quia iste misit
    ad me, ut curem hóminem a lepra sua? animadvértite et vidéte, quod
    occasiónes quærat advérsum me. Quod cum audísset Eliséus vir Dei, scidísse
    vidélicet regem Israël vestiménta sua, misit ad eum, dicens: Quare scidísti
    vestiménta tua? véniat ad me, et sciat esse prophétam in Israël. Venit ergo
    Náaman cum equis et cúrribus, et stetit ad óstium domus Eliséi: misítque ad
    eum Eliséus núntium, dicens: Vade, et laváre sépties in Jordáne, et recípiet
    sanitátem caro tua, atque mundáberis. Irátus Náaman recedébat, dicens:
    Putábam, quod egrederétur ad me, et stans invocáret nomen Dómini, Dei sui,
    et tángeret manu sua locum lepræ, et curáret me. Numquid non melióres sunt
    Abana et Pharphar, flúvii Damásci, ómnibus aquis Israël, ut laver in eis, et
    munder? Cum ergo vertísset se, et abíret indígnans, accessérunt ad eum servi
    sui, et locúti sunt ei: Pater, et si rem grandem dixísset tibi Prophéta,
    certe fácere debúeras: quanto magis quia nunc dixit tibi: Laváre, et
    mundáberis? Descéndit, et lavit in Jordáne sépties, juxta sermónem viri Dei,
    et restitúta est caro ejus, sicut caro púeri párvuli, et mundátus est.
    Reversúsque ad virum Dei cum univérso comitátu suo, venit, et stetit coram
    eo, et ait: Vere scio, quod non sit álius Deus in univérsa terra, nisi
    tantum in Israël."
graduale:
  - "!Ps 55:9, 2"
  - "Deus, vitam meam annuntiávi tibi: posuísti lácrimas meas in conspéctu tuo."
  - "V. Miserére mei, Dómine, quóniam conculcávit me homo: tota die bellans
    tribulávit me."
  - _
  - "!Tractus"
  - "!Ps 102:10"
  - "Dómine, non secúndum peccáta nostra, quæ fécimus nos: neque secúndum
    iniquitátes nostras retríbuas nobis."
  - "!Ps 78:8-9"
  - "V. Dómine, ne memíneris iniquitátum nostrárum antiquárum: cito antícipent
    nos misericórdiæ tuæ, quia páuperes facti sumus nimis. (Hic genuflectitur)"
  - "V. Adjuva nos, Deus, salutáris noster: et propter glóriam nóminis tui,
    Dómine, líbera nos: et propítius esto peccátis nostris, propter nomen tuum."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam.
  - "!Luc 4:23-30."
  - "In illo témpore: Dixit Jesus pharisǽis: Utique dicétis mihi hanc
    similitúdinem: Médice, cura teípsum: quanta audívimus facta in Caphárnaum,
    fac et hic in pátria tua. Ait autem: Amen, dico vobis, quia nemo prophéta
    accéptus est in pátria sua. In veritáte dico vobis, multæ víduæ erant in
    diébus Elíæ in Israël, quando clausum est cœlum annis tribus et ménsibus
    sex, cum facta esset fames magna in omni terra: et ad nullam illárum missus
    est Elías, nisi in Sarépta Sidóniæ ad mulíerem víduam. Et multi leprósi
    erant in Israël sub Eliséo Prophéta: et nemo eórum mundátus est nisi Náaman
    Syrus. Et repléti sunt omnes in synagóga ira, hæc audiéntes. Et surrexérunt,
    et ejecérunt illum extra civitátem: et duxérunt illum usque ad supercílium
    montis, super quem cívitas illórum erat ædificáta, ut præcipitárent eum.
    Ipse autem tránsiens per médium illórum, ibat."
offertorium:
  - "!Ps 54:2-3"
  - "Exáudi, Deus, oratiónem meam, et ne despéxeris deprecatiónem meam: inténde
    in me, et exáudi me."
secreta:
  - Munus, quod tibi, Dómine, nostræ servitútis offérimus, tu salutáre nobis
    pérfice sacraméntum.
  - $Per Dominum
communio:
  - "!Ps 13:7"
  - Quis dabit ex Sion salutáre Israël? cum avérterit Dóminus captivitátem
    plebis suæ, exsultábit Jacob, et lætábitur Israël.
postcommunio:
  - "Præsta, quǽsumus, omnípotens et miséricors Deus: ut, quod ore contíngimus,
    pura mente capiámus."
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Subvéniat nobis, Dómine, misericórdia tua: ut ab imminéntibus peccatórum
    nostrórum perículis, te mereámur protegénte éripi, te liberánte salvári."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 4:23-30"
  - "In illo témpore: Dixit Jesus pharisǽis: Utique dicétis mihi hanc
    similitúdinem: Médice, cura te ipsum: quanta audívimus facta in Caphárnaum,
    fac et hic in pátria tua. Et réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Lib. 4 in c. 4 Lucæ, post med."
  - "Non medíocris invídia próditur, quæ cívicæ caritátis oblíta, in acérba ódia
    causas amóris infléctit. Simul hoc exémplo páriter et oráculo declarátur,
    quod frustra opem misericórdiæ cæléstis exspéctes, si aliénæ frúctibus
    virtútis invídeas. Aspernátor enim Dóminus invidórum est: et ab iis qui
    divína benefícia in áliis persequúntur, mirácula suæ potestátis avértit.
    Domínicæ quippe carnis actus, divinitátis exémplum est: et invisibília nobis
    ejus, per ea quæ sunt visibília, demonstrántur."
responsory1:
  - "R. Tóllite hinc vobíscum múnera, et ite ad dóminum terræ: et cum
    invenéritis, adoráte eum super terram:"
  - "* Deus autem meus fáciat eum vobis placábilem: et remíttat et hunc fratrem
    vestrum vobíscum, et eum quem tenet in vínculis."
  - V. Súmite de óptimis terræ frúgibus in vasis vestris, et deférte viro múnera.
  - "R. Deus autem meus fáciat eum vobis placábilem: et remíttat et hunc fratrem
    vestrum vobíscum, et eum quem tenet in vínculis."
lectio2:
  - "Non otióse ítaque Salvátor excúsat, quod nulla in pátria sua mirácula
    virtútis operátus sit: ne fortássis áliquis viliórem pátriæ nobis esse
    debére putáret afféctum. Neque enim cives póterat non amáre, qui amáret
    omnes: sed ipsi se caritáte pátriæ, dum ínvident, abdicárunt. In veritáte
    dico vobis: multæ víduæ fuérunt in diébus Elíæ. Non quia Elíæ dies fuérunt,
    sed in quibus Elías operátus est: aut quia Elías dies faciébat illis, qui in
    ejus opéribus lucem vidébant grátiæ spiritális, et convertebántur ad
    Dóminum. Et ídeo aperiebátur cælum vidéntibus ætérna et divína mystéria:
    claudebátur, et fames erat, quando nulla erat cognoscéndæ divinitátis
    ubértas. Sed de hoc plénius díximus, cum de víduis scriberémus."
responsory2:
  - R. Iste est frater vester mínimus, de quo dixerátis mihi? Deus misereátur
    tibi, fili mi.
  - "* Festinavítque in domum, et plorávit: quia erumpébant lácrimæ, et non
    póterat se continére."
  - "V. Attóllens autem Joseph óculos, vidit Bénjamin stantem: et commóta sunt
    ómnia víscera ejus super fratre suo."
  - "R. Festinavítque in domum, et plorávit: quia erumpébant lácrimæ, et non
    póterat se continére."
lectio3:
  - "Et multi leprósi erant in Judǽa tempóribus Eliséi prophétæ: et nemo eórum
    mundátus est, nisi Náaman Syrus. Evidénter hic sermo nos Dómini salutáris
    infórmat, et ad stúdium venerándæ divinitátis hortátur: quod nemo sanátus
    osténditur, et maculósi morbo córporis absolútus, nisi qui religióso offício
    stúduit sanitáti. Non enim dormiéntibus divína benefícia, sed observántibus
    deferúntur. Díximus in libro álio, in vídua illa, ad quam Elías diréctus
    est, typum Ecclésiæ præmíssum. Pópulus Ecclésiam congregávit, ut sequátur
    pópulus ille ex alienígenis congregátus. Pópulus ille ante leprósus, pópulus
    ille ante maculósus, priúsquam mýstico baptizarétur in flúmine: idem post
    sacraménta baptísmatis máculis córporis et mentis ablútus, jam non lepra,
    sed immaculáta virgo cœpit esse sine ruga."
responsory3:
  - "R. Dixit Joseph úndecim frátribus suis: Ego sum Joseph, quem vendidístis in
    Ægýptum: adhuc vivit pater noster sénior, de quo dixerátis mihi?"
  - "* Ite, addúcite eum ad me, ut possit vívere."
  - "V. Biénnium enim est, quod cœpit esse fames in terra: et adhuc restant anni
    quinque, quibus nec arári póterit, nec meti."
  - R. Ite, addúcite eum ad me, ut possit vívere.
  - "&Gloria"
  - R. Ite, addúcite eum ad me, ut possit vívere.
