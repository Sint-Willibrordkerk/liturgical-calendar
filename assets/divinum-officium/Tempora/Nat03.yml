lectio1:
  - De Epístola ad Romános
  - "!Rom 6:1-5"
  - 1 Quid ergo dicémus? permanébimus in peccáto ut grátia abúndet?
  - 2 Absit. Qui enim mórtui sumus peccáto, quómodo adhuc vivémus in illo?
  - 3 an ignorátis quia quicúmque baptizáti sumus in Christo Jesu, in morte
    ipsíus baptizáti sumus?
  - "4 Consepúlti enim sumus cum illo per baptísmum in mortem: ut quómodo
    Christus surréxit a mórtuis per glóriam Patris, ita et nos in novitáte vitæ
    ambulémus."
  - "5 Si enim complantáti facti sumus similitúdini mortis ejus: simul et
    resurrectiónis érimus."
responsory1:
  - "@Sancti/01-01:Responsory4"
lectio2:
  - "!Rom 6:6-11"
  - 6 Hoc sciéntes, quia vetus homo noster simul crucifíxus est, ut destruátur
    corpus peccáti, et ultra non serviámus peccáto.
  - 7 Qui enim mórtuus est, justificátus est a peccáto.
  - 8 Si autem mórtui sumus cum Christo, crédimus quia simul étiam vivémus cum
    Christo,
  - "9 sciéntes quod Christus resúrgens ex mórtuis jam non móritur: mors illi
    ultra non dominábitur."
  - "10 Quod enim mórtuus est peccáto, mórtuus est semel: quod autem vivit,
    vivit Deo."
  - 11 Ita et vos existimáte vos mórtuos quidem esse peccáto, vivéntes autem
    Deo, in Christo Jesu Dómino nostro.
responsory2:
  - "@Sancti/01-01:Responsory5"
lectio3:
  - "!Rom 6:12-18"
  - 12 Non ergo regnet peccátum in vestro mortáli córpore ut obediátis
    concupiscéntiis ejus.
  - "13 Sed neque exhibeátis membra vestra arma iniquitátis peccáto: sed
    exhibéte vos Deo, tamquam ex mórtuis vivéntes: et membra vestra arma
    justítiæ Deo."
  - "14 Peccátum enim vobis non dominábitur: non enim sub lege estis, sed sub
    grátia."
  - 15 Quid ergo? peccábimus, quóniam non sumus sub lege, sed sub grátia? Absit.
  - 16 Nescítis quóniam cui exhibétis vos servos ad obediéndum, servi estis
    ejus, cui obedítis, sive peccáti ad mortem, sive obeditiónis ad justítiam?
  - 17 Grátias autem Deo quod fuístis servi peccáti, obedístis autem ex corde in
    eam formam doctrínæ, in quam tráditi estis.
  - 18 Liberáti autem a peccáto, servi facti estis justítiæ.
