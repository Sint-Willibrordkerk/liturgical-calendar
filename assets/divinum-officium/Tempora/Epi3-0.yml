oratio:
  - "Omnípotens sempitérne Deus, infirmitátem nostram propítius réspice: atque,
    ad protegéndum nos, déxteram tuæ majestátis exténde."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Romános.
  - "!Rom 12:16-21"
  - "Fratres: Nolíte esse prudéntes apud vosmetípsos: nulli malum pro malo
    reddéntes: providéntes bona non tantum coram Deo, sed étiam coram ómnibus
    homínibus. Si fíeri potest, quod ex vobis est, cum ómnibus homínibus pacem
    habéntes: Non vosmetípsos defendéntes, caríssimi, sed date locum iræ.
    Scriptum est enim: Mihi vindícta: ego retríbuam, dicit Dóminus. Sed si
    esuríerit inimícus tuus, ciba illum: si sitit, potum da illi: hoc enim
    fáciens, carbónes ignis cóngeres super caput ejus. Noli vinci a malo, sed
    vince in bono malum."
graduale:
  - "!Ps 101:16-17"
  - Timébunt gentes nomen tuum, Dómine, et omnes reges terræ glóriam tuam.
  - V. Quóniam ædificávit Dóminus Sion, et vidébitur in majestáte sua. Allelúja,
    allelúja.
  - "!Ps 96:1"
  - "Dóminus regnávit, exsúltet terra: læténtur ínsulæ multæ. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum.
  - "!Matt 8:1-13"
  - "In illo témpore: Cum descendísset Jesus de monte, secútæ sunt eum turbæ
    multæ: et ecce, leprósus véniens adorábat eum, dicens: Dómine, si vis, potes
    me mundáre. Et exténdens Jesus manum, tétigit eum, dicens: Volo. Mundáre. Et
    conféstim mundáta est lepra ejus. Et ait illi Jesus: Vide, némini díxeris:
    sed vade, osténde te sacerdóti, et offer munus, quod præcépit Móyses, in
    testimónium illis. Cum autem introísset Caphárnaum, accéssit ad eum
    centúrio, rogans eum et dicens: Dómine, puer meus jacet in domo paralýticus,
    et male torquetur. Et ait illi Jesus: Ego véniam, et curábo eum. Et
    respóndens centúrio, ait: Dómine, non sum dignus, ut intres sub tectum meum:
    sed tantum dic verbo, et sanábitur puer meus. Nam et ego homo sum sub
    potestáte constitútus, habens sub me mílites, et dico huic: Vade, et vadit;
    et alii: Veni, et venit; et servo meo: Fac hoc, et facit. Audiens autem
    Jesus, mirátus est, et sequéntibus se dixit: Amen, dico vobis, non inveni
    tantam fidem in Israël. Dico autem vobis, quod multi ab Oriénte et Occidénte
    vénient, et recúmbent cum Abraham et Isaac et Jacob in regno cœlórum: fílii
    autem regni ejiciéntur in ténebras exterióres: ibi erit fletus et stridor
    déntium. Et dixit Jesus centurióni: Vade et, sicut credidísti, fiat tibi. Et
    sanátus est puer in illa hora."
offertorium:
  - "!Ps 117:16; 117:17"
  - "Déxtera Dómini fecit virtutem, déxtera Dómini exaltávit me: non móriar, sed
    vivam, et narrábo ópera Dómini."
secreta:
  - "Hæc hóstia, Dómine, quǽsumus, emúndet nostra delícta: et, ad sacrifícium
    celebrándum, subditórum tibi córpora mentésque sanctíficet."
  - $Per Dominum
communio:
  - "!Luc 4:22"
  - Mirabántur omnes de his, quæ procedébant de ore Dei.
postcommunio:
  - "Quos tantis, Dómine, largíris uti mystériis: quǽsumus; ut efféctibus nos
    eórum veráciter aptáre dignéris."
  - $Per Dominum
lectio1:
  - Incipit Epístola beáti Pauli Apóstoli ad Gálatas
  - "!Gal 1:1-5"
  - "1 Paulus Apóstolus non ab homínibus, neque per hóminem, sed per Jesum
    Christum, et Deum Patrem, qui suscitávit eum a mórtuis:"
  - 2 et qui mecum sunt omnes fratres, ecclésiis Galátiæ.
  - 3 Grátia vobis, et pax a Deo Patre, et Dómino nostro Jesu Christo,
  - 4 qui dedit semetípsum pro peccátis nostris, ut eríperet nos de præsénti
    sǽculo nequam, secúndum voluntátem Dei et Patris nostri,
  - 5 cui est glória in sǽcula sæculórum. Amen.
responsory1:
  - "@Tempora/Epi2-0:Responsory1"
lectio2:
  - "!Gal 1:6-10"
  - "6 Miror quod sic tam cito transferímini ab eo, qui vos vocávit in grátiam
    Christi in áliud Evangélium:"
  - 7 quod non est áliud, nisi sunt áliqui, qui vos contúrbant, et volunt
    convértere Evangélium Christi.
  - 8 Sed licet nos, aut Angelus de cælo evangelízet vobis prætérquam quod
    evangelizávimus vobis, anáthema sit.
  - "9 Sicut prædíximus, et nunc íterum dico: Si quis vobis evangelizáverit
    præter id, quod accepístis, anáthema sit."
  - 10 Modo enim homínibus suádeo, an Deo? An quæro homínibus placére? Si adhuc
    homínibus placérem, Christi servus non essem.
responsory2:
  - "@Tempora/Epi2-0:Responsory2"
lectio3:
  - "!Gal 1:11-14"
  - "11 Notum enim vobis fácio, fratres, Evangélium, quod evangelizátum est a
    me, quia non est secúndum hóminem:"
  - 12 neque enim ego ab hómine accépi illud, neque dídici, sed per revelatiónem
    Jesu Christi.
  - "13 Audístis enim conversatiónem meam aliquándo in Judaísmo: quóniam supra
    modum persequébar Ecclésiam Dei, et expugnábam illam,"
  - 14 et proficiébam in Judaísmo supra multos coætáneos meos in génere meo,
    abundántius æmulátor exístens paternárum meárum traditiónum.
responsory3:
  - "@Tempora/Epi2-0:Responsory3"
lectio4:
  - De Expositióne sancti Augustíni Epíscopi in Epístolam ad Gálatas
  - "!Præfátio tom. 4"
  - "Causa, propter quam scribit Apóstolus ad Gálatas, hæc est: ut intélligant
    grátiam Dei id secum ágere, ut sub lege jam non sint. Cum enim prædicáta eis
    esset Evangélii grátia, non defuérunt quidam ex circumcisióne, quamvis
    Christiáni nómine, nondum tamen tenéntes ipsum gratiæ benefícium, et adhuc
    voléntes esse sub onéribus legis, quæ Dóminus Deus imposúerat non justítiæ
    serviéntibus, sed peccáto, justam scílicet legem injústis homínibus dando ad
    demonstranda peccáta eórum, non auferenda. Non enim aufert peccáta, nisi
    grátia fidei, quæ per dilectiónem operátur."
responsory4:
  - "@Tempora/Epi2-0:Responsory4"
lectio5:
  - Sub hac ergo grátia jam Gálatas constitútos illi volébant constitúere sub
    onéribus legis, asseverántes nihil eis prodésse Evangélium, nisi
    circumcideréntur, et céteras carnáles Judáici ritus observatiónes subírent.
    Et ídeo Paulum Apóstolum suspéctum habére cœ́perant, a quo illis Evangélium
    prædicátum erat, tamquam non tenéntem disciplínam ceterórum Apostolórum, qui
    gentes cogébant judaizáre.
responsory5:
  - "@Tempora/Epi2-0:Responsory5"
lectio6:
  - "Talis quidem quǽstio est et in Epístola ad Romános: verúmtamen vidétur
    áliquid interésse, quod ibi contentiónem ipsam dírimit, litémque compónit,
    quæ inter eos, qui ex Judǽis, et eos, qui ex Géntibus credíderant, orta
    erat: cum illi tamquam ex méritis óperum legis, sibi rédditum Evangélii
    prǽmium arbitraréntur, quod prǽmium incircumcísis tamquam imméritis nolébant
    dari: illi contra Judǽis se præférre gestírent, tamquam interfectóribus
    Dómini. In hac vero epístola ad eos scribit, qui jam commóti erant
    auctoritáte illórum, qui ex Judǽis erant, et ad observatiónes legis
    cogébant."
responsory6:
  - "@Tempora/Epi2-0:Responsory6"
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 8:1-13"
  - "In illo témpore: Cum descendísset Jesus de monte, secútæ sunt eum turbæ
    multæ: et ecce leprósus véniens, adorábat eum. Et réliqua."
  - _
  - Homilía sancti Hierónymi Presbýteri
  - "!Liber 1 Comment. in cap. 8 Matth."
  - "De monte Dómino descendénte, occúrrunt turbæ, quia ad altióra ascéndere non
    valuérunt. Et primus ei occúrrit leprósus: necdum enim póterat cum lepra tam
    multíplicem in monte Salvatóris audíre sermónem. Et notándum, quod hic
    primus speciáliter curátus sit: secúndo, puer centuriónis: tértio, socrus
    Petri fébriens in Caphárnaum: quarto loco, qui obláti sunt ei a dæmónio
    vexáti: quorum spíritus verbo eiciébat, quando et omnes male habéntes
    curávit."
responsory7:
  - "@Tempora/Epi2-0:Responsory7"
lectio8:
  - "Et ecce leprósus véniens adorábat eum, dicens. Recte post prædicatiónem
    atque doctrínam, signi offértur occásio, ut per virtútem miráculi,
    prætéritus apud audiéntes sermo firmétur. Dómine, si vis, potes me mundáre.
    Qui voluntátem rogat, de virtúte non dúbitat. Et exténdens Jesus manum
    tétigit eum, dicens: Volo, mundáre. Extendénte manum Dómino, statim lepra
    fugit. Simúlque consídera, quam húmilis, et sine jactántia respónsio. Ille
    díxerat, Si vis: Dóminus respóndit, Volo. Ille præmíserat, Potes me mundáre:
    Dóminus jungit, et dicit, Mundáre. Non ergo, ut pleríque Latinórum putant,
    jungéndum est, et legéndum, Volo mundáre: sed separátim, ut primum dicat,
    Volo; deínde ímperet, Mundáre."
responsory8:
  - "@Tempora/Pent01-0:Responsory8"
lectio9:
  - "Et ait illi Jesus: Vide, némini díxeris. Et revéra quid erat necésse ut
    sermóne jactáret, quod córpore præferébat? Sed vade, osténde te sacerdóti.
    Várias ob causas mittit eum ad sacerdótem: primum propter humilitátem, ut
    sacerdótibus deférre honórem videátur. Erat enim lege præcéptum, ut, qui
    mundáti fúerant a lepra, offérrent múnera sacerdótibus. Deínde, ut mundátum
    vidéntes leprósum, aut créderent Salvatóri, aut non créderent: si créderent,
    salvaréntur; si non créderent, inexcusábiles forent. Et simul, ne, quod in
    eo sæpíssime criminabántur, legem viderétur infríngere."
  - "&teDeum"
