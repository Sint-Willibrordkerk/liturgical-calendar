lectio:
  - Léctio Ezechiélis Prophétæ
  - "!Ezech 34:11-16"
  - "Hæc dicit Dóminus Deus: Ecce, ego ipse requíram oves meas, et visitábo eas.
    Sicut vísitat pastor gregem suum in die, quando fúerit in médio óvium suárum
    dissipatárum: sic visitábo oves meas, et liberábo eas de ómnibus locis, in
    quibus dispérsæ fúerant in die nubis et calíginis. Et edúcam eas de pópulis,
    et congregábo eas de terris, et indúcam eas in terram suam: et pascam eas in
    móntibus Israël, in rivis, et in cunctis sédibus terræ. In páscuis ubérrimis
    pascam eas, et in móntibus excélsis Israël erunt páscua eárum: ibi
    requiéscent in herbis viréntibus, et in páscuis pínguibus pascéntur super
    montes Israël. Ego pascam oves meas, et ego eas accubáre fáciam, dicit
    Dóminus Deus. Quod períerat, requíram; et quod abjéctum erat, redúcam; et
    quod confractum fúerat, alligábo; et quod infírmum fúerat, consolidábo; et
    quod pingue et forte, custódiam: et pascam illas in judício, dicit Dóminus
    omnípotens."
graduale:
  - "!Ps 83:10; 83:9"
  - Protéctor noster, áspice, Deus, et réspice super servos tuos.
  - V. Dómine, Deus virtútum, exáudi preces servórum tuórum.
  - _
  - "!Tractus"
  - "!Ps 102:10"
  - "Dómine, non secúndum peccáta nostra, quæ fécimus nos: neque secúndum
    iniquitátes nostras retríbuas nobis"
  - "!Ps 78:8-9"
  - "Dómine, ne memíneris iniquitátum nostrárum antiquárum: cito antícipent nos
    misericórdiæ tuæ, quia páuperes facti sumus nimis. (Hic genuflectitur)"
  - "V. Adjuva nos, Deus, salutáris noster: et propter glóriam nóminis tui,
    Dómine, líbera nos: et propítius esto peccátis nostris, propter nomen tuum."
evangelium:
  - Sequéntia ++ sancti Evangélii secundum Matthǽum
  - "!Matt 25:31-46"
  - "In illo témpore: Dixit Jesus discípulis suis: Cum vénerit Fílius hóminis in
    majestáte sua, et omnes Angeli cum eo, tunc sedébit super sedem majestátis
    suæ: et congregabúntur ante eum omnes gentes, et separábit eos ab ínvicem,
    sicut pastor ségregat oves ab hædis: et státuet oves quidem a dextris suis,
    hædos autem a sinístris. Tunc dicet Rex his, qui a dextris ejus erunt:
    Veníte, benedícti Patris mei, possidéte parátum vobis regnum a constitutióne
    mundi. Esurívi enim, et dedístis mihi manducáre; sitívi, et dedístis mihi
    bíbere; hospes eram, et collegístis me; nudus, et cooperuístis me; infírmus,
    et visitástis me; in cárcere eram, et venístis ad me. Tunc respondébunt ei
    justi, dicéntes: Dómine, quando te vídimus esuriéntem, et pávimus te;
    sitiéntem, et dedimus tibi potum? quando autem te vídimus hóspitem, et
    collégimus te? aut nudum, et cooperúimus te? aut quando te vídimus infírmum,
    aut in cárcere, et vénimus ad te? Et respóndens Rex, dicet illis: Amen, dico
    vobis: quámdiu fecístis uni ex his frátribus meis mínimis, mihi fecístis.
    Tunc dicet et his, qui a sinístris erunt: Discédite a me, maledícti, in
    ignem ætérnum, qui parátus est diábolo et ángelis ejus. Esurívi enim, et non
    dedístis mihi manducáre; sitívi, et non dedístis mihi potum; hospes eram, et
    non collegístis me; nudus, et non cooperuístis me; infírmus et in cárcere,
    et non visitástis me. Tunc respondébunt ei et ipsi, dicéntes: Dómine, quando
    te vídimus esuriéntem, aut sitiéntem, aut hóspitem, aut nudum, aut infírmum,
    aut in cárcere, et non ministrávimus tibi? Tunc respondébit illis, dicens:
    Amen, dico vobis: Quámdiu non fecístis uni de minóribus his, nec mihi
    fecístis. Et ibunt hi in supplícium ætérnum: justi autem in vitam ætérnam."
offertorium:
  - "!Ps 118:18; 118:26; 118:73"
  - "Levábo óculos meos, et considerábo mirabília tua, Dómine, ut dóceas me
    justítias tuas: da mihi intelléctum, et discam mandáta tua."
secreta:
  - "Múnera tibi, Dómine, obláta sanctífica: nosque a peccatórum nostrórum
    máculis emúnda."
  - $Per Dominum
communio:
  - "!Matt 25:40; 25:34"
  - "Amen, dico vobis: quod uni ex mínimis meis fecístis, mihi fecístis: veníte,
    benedícti Patris mei, possidéte parátum vobis regnum ab inítio sǽculi."
postcommunio:
  - "Salutáris tui, Dómine, múnere satiáti, súpplices exorámus: ut, cujus
    lætámur gustu, renovémur efféctu."
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Absólve, quǽsumus, Dómine, nostrórum víncula peccatórum: et, quidquid
    pro eis merémur, propitiátus avérte."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 25:31-46"
  - "In illo témpore: Dixit Jesus discípulis suis: Cum vénerit Fílius hóminis in
    majestáte sua, et omnes Angeli cum eo, tunc sedébit super sedem majestátis
    suæ: et congregabúntur ante eum omnes gentes. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Lib. de fide et operibus. cap. 15 tom. 4, circa medium"
  - "Si mandátis non servátis, ad vitam veníri potest per solam fidem, quæ sine
    opéribus mórtua est: illud deínde quómodo verum erit, quod eis, quos ad
    sinístram positúrus est, dicet: Ite in ignem ætérnum, qui parátus est
    diábolo, et ángelis ejus: nec íncrepat, quia in eum non credidérunt; sed
    quia bona ópera non fecérunt? Nam profécto, ne sibi quisquam de fide, quæ
    sine opéribus mórtua est, promíttat ætérnam vitam; proptérea omnes gentes
    segregatúrum se dixit, quæ permíxtæ eisdem páscuis utebántur: ut appáreat,
    eos illi dictúros: Dómine, quando te vídimus illa et illa patiéntem, et non
    ministrávimus tibi? qui in eum credíderant, sed bona operári non curáverant,
    tamquam de ipsa fide mórtua ad vitam pervenirétur ætérnam."
responsory1:
  - "@Tempora/Quad1-0:Responsory1"
lectio2:
  - "An forte ibunt in ignem ætérnum, qui ópera misericórdiæ non fecérunt: et
    non ibunt, qui aliéna rapuérunt? vel corrumpéndo in se templum Dei, in
    seípsos immisericórdes fuérunt: quasi ópera misericórdiæ prosint áliquid
    sine dilectióne, dicénte Apóstolo: Si distríbuam ómnia mea paupéribus,
    caritátem autem non hábeam, nihil mihi prodest? Aut díligat quisquam
    próximum sicut seípsum, qui non díligit seípsum? Qui enim díligit
    iniquitátem, odit ánimam suam."
responsory2:
  - "@Tempora/Quad1-0:Responsory2"
lectio3:
  - "Neque illud dici hic póterit, in quo nonnúlli seípsos sedúcunt, ignem
    ætérnum dictum, non ipsam combustiónem ætérnam. Per ignem quippe, qui
    ætérnus erit, transitúros arbitrántur eos, quibus propter fidem mórtuam per
    ignem promíttunt salútem: ut vidélicet ipse ignis ætérnus sit, combústio
    vero eórum, hoc est, operátio ignis, nos sit in eos ætérna: cum et hoc
    prǽvidens Dóminus senténtiam suam conclúsit ita dicens: Sic ibunt illi in
    combustiónem ætérnam, justi autem in vitam ætérnam. Erit ergo ætérna
    combústio, sicut ignis: et eos in illam itúros Véritas dicit, quorum non
    fidem, sed bona ópera defuísse declarávit."
responsory3:
  - "@Tempora/Quad1-0:Responsory3"
