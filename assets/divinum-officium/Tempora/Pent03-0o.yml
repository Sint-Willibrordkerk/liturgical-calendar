lectio4:
  - De Expositióne sancti Gregórii Papæ in libros Regum
  - "!Lib. 4, cap. 5 in I Reg. c. 10"
  - "Tulit autem Sámuel lentículam ólei, et effúdit super caput ejus. Hoc
    profécto hac unctióne exprímitur, quod in sancta Ecclésia nunc étiam
    materiáliter exhibétur: quia qui in cúlmine pónitur, sacraménta súscipit
    unctiónis. Quia vero ipsa únctio sacraméntum est: is qui promovétur, bene
    foris úngitur, si intus virtute sacraménti roborétur. Ipsas ergo olei
    virtútes prius videámus atténtius. Oleum quippe liquóribus áliis
    superfértur: óleum ignem fovet: óleum vúlnera curáre consuévit. Per illud
    ergo, misericórdiæ bonum signíficat, quia scriptum de Dómino est:
    Miseratiónes ejus super ómnia ópera ejus. Quia ignem fovet, prædicatónis
    grátiam desígnat, quæ electórum mentes illúminat."
responsory4:
  - "@Tempora/Pent01-2:Responsory1"
lectio5:
  - "Quia vero vúlnera per óleum curántur, hoc profécto insínuat, quod
    detergénda sunt vúlnera peccatórum. Ungátur ergo caput regis, quia spiritáli
    gratia mens est replénda doctóris. Hábeat in unctióne sua óleum, hábeat
    misericórdiam abundántem, quæ sibi virtútibus áliis præferátur. Hábeat
    óleum, ut dura ardórem sancti Spíritus in se nutrit, lucére veheménter áliis
    per verbum possit. Hábeat nihilóminus óleum medicínæ: ut sapiénter dispónat,
    quáliter peccatórum fœtóres tergat, et ægras mentes salúti restítuat."
responsory5:
  - "@Tempora/Pent01-2:Responsory2"
lectio6:
  - "Sed lentícula Saul úngitur, non pro præsignánda doctrína, sed ad expriménda
    futúra. Lentícula quidem parvum est vas. Quid ergo est, quod lentícula ólei
    Saul úngitur, nisi quia in fine reprobátur? Nara quia obedíre Deo póstea
    nóluit, a Samuéle audívit: Quia projecísti sermónem Dómini, proécit te
    Dóminus, ne sis rex. Velut enim lentícula ólei parum hábuit, qui spirituálem
    grátiam proiciéndus accépit. Quod in rectóribus quoque sanctæ Ecclésiæ
    conveniénter accípitur. Plerúmque enim culmen prælatiónis accípiunt, qui in
    caritáte Dei et próximi perfécti non sunt."
