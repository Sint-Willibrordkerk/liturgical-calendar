introitus:
  - "!Ps 53:3-4"
  - "v. Deus, in nómine tuo salvum me fac, et in virtúte tua líbera me: Deus,
    exáudi oratiónem meam: áuribus pércipe verba oris mei."
  - "!Ps 53:5"
  - "Quóniam aliéni insurrexérunt in me: et fortes quæsiérunt ánimam meam."
  - "&Gloria"
  - "v. Deus, in nómine tuo salvum me fac, et in virtúte tua líbera me: Deus,
