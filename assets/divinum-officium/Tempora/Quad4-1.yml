oratio:
  - "Præsta, quǽsumus, omnípotens Deus: ut, observatiónes sacras ánnua devotióne
    recoléntes, et córpore tibi placeámus et mente."
  - $Per Dominum
lectio:
  - Léctio libri Regum
  - "!3 Reg 3:16-28."
  - "In diébus illis: Venérunt duæ mulíeres meretríces ad regem Salomónem,
    steterúntque coram eo, quarum una ait: Obsecro, mi dómine: ego et múlier hæc
    habitabámus in domo una, et péperi apud eam in cubículo. Tértia autem die
    postquam ego péperi, péperit et hæc: et erámus simul, nullúsque álius
    nobíscum in domo, excéptis nobis duábus. Mórtuus est autem fílius mulíeris
    hujus nocte: dórmiens quippe oppréssit eum. Et consúrgens intempéstæ noctis
    siléntio, tulit fílium meum de látere meo ancíllæ tuæ dormiéntis, et
    collocávit in sinu suo: suum autem fílium, qui erat mórtuus, pósuit in sinu
    meo. Cumque surrexíssem mane, ut darem lac fílio meo, appáruit mórtuus: quem
    diligéntius íntuens clara luce, deprehéndi non esse meum, quem genúeram.
    Respondítque áltera múlier: Non est ita, ut dicis, sed fílius tuus mórtuus
    est, meus autem vivit. E contrário illa dicébat: Mentiris: fílius quippe
    meus vivit, et fílius tuus mórtuus est. Atque in hunc modum contendébant
    coram rege. Tunc rex ait: Hæc dicit Fílius meus vivit, et fílius tuus
    mórtuus est. Et ista respóndit: Non, sed fílius tuus mórtuus est, meus autem
    vivit. Dixit ergo rex: Afférte mihi gládium. Cumque attulíssent gládium
    coram rege: Divídite, inquit, infántem vivum in duas partes, et dat dimídiam
    partem uni, et dimídiam partem álteri. Dixit autem múlier, cujus fílius erat
    vivus, ad regem - commóta sunt quippe víscera ejus super fílio suo: -
    Obsecro, dómine, date illi infántem vivum, et nolíte interfícere eum. E
    contrário illa dicébat: Nec mihi nec tibi sit, sed dividátur. Respóndit rex
    et ait: Date huic infántem vivum, et non occidátur: hæc est enim mater ejus.
    Audívit ítaque omnis Israël judícium, quod judicásset rex, et timuérunt
    regem, vidéntes sapiéntiam Dei esse in eo ad faciéndum judícium."
graduale:
  - "!Ps 30:3"
  - Esto mihi in Deum protectórem et in locum refúgii, ut salvum me fácias.
  - "!Ps 70:1."
  - "V. Deus, in te sperávi: Dómine, non confúndar in ætérnum."
  - _
  - "!Tractus"
  - "!Ps 102:10"
  - "Dómine, non secúndum peccáta nostra, quæ fécimus nos: neque secúndum
    iniquitátes nostras retríbuas nobis."
  - "!Ps 78:8-9"
  - "V. Dómine, ne memíneris iniquitátum nostrárum antiquárum: cito antícipent
    nos misericórdiæ tuæ, quia páuperes facti sumus nimis. (Hic genuflectitur)"
  - "V. Adjuva nos, Deus, salutáris noster: et propter glóriam nóminis tui,
    Dómine, líbera nos: et propítius esto peccátis nostris, propter nomen tuum."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joann 2:13-25"
  - "In illo témpore: Prope erat Pascha Judæórum, et ascéndit Jesus Jerosólymam:
    et invénit in templo vendéntes boves et oves et colúmbas, et nummulários
    sedéntes. Et cum fecísset quasi flagéllum de funículis, omnes ejécit de
    templo, oves quoque et boves, et nummulariórum effúdit æs et mensas
    subvértit. Et his, qui colúmbas vendébant, dixit: Auférte ista hinc, et
    nolíte fácere domum Patris mei domum negotiatiónis. Recordáti sunt vero
    discípuli ejus, quia scriptum est: Zelus domus tuæ comédit me. Respondérunt
    ergo Judǽi, et dixérunt ei: Quod signum osténdis nobis, quia hæc facis?
    Respóndit Jesus et dixit eis: Sólvite templum hoc, et in tribus diébus
    excitábo illud. Dixérunt ergo Judǽi: Quadragínta et sex annis ædificátum est
    templum hoc, et tu in tribus diébus excitábis illud? Ille autem dicébat de
    templo córporis sui. Cum ergo resurrexísset a mórtuis, recordáti sunt
    discípuli ejus, quia hoc dicébat, et credidérunt Scriptúræ, et sermóni, quem
    dixit Jesus. Cum autem esset Jerosólymis in Pascha in die festo, multi
    credidérunt in nómine ejus, vidéntes signa ejus, quæ faciébat. Ipse autem
    Jesus non credébat semetípsum eis, eo quod ipse nosset omnes, et quia opus
    ei non erat, ut quis testimónium perhibéret de hómine: ipse enim sciébat,
    quid esset in hómine."
offertorium:
  - "!Ps 99:1-2"
  - "Jubiláte Deo, omnis terra, servíte Dómino in lætítia: intráte in conspéctu
    ejus in exsultatióne: quia Dóminus ipse est Deus."
secreta:
  - Oblátum tibi, Dómine, sacrifícium vivíficet nos semper et múniat.
  - $Per Dominum
communio:
  - "!Ps 18:13, 14"
  - "Ab occúltis meis munda me, Dómine: et ab aliénis parce servo tuo."
postcommunio:
  - "Sumptis, Dómine, salutáribus sacraméntis: ad redemptiónis ætérnæ, quǽsumus,
    proficiámus augméntum."
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Deprecatiónem nostram, quǽsumus. Dómine, benígnus exáudi: et, quibus
    supplicándi præstas afféctum, tríbue defensiónis auxílium."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 2:13-25"
  - "In illo témpore: Prope erat Pascha Judæórum, et ascéndit Jesus Jerosólymam:
    et invénit in templo vendéntes boves, et oves, et colúmbas. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tract. 10 in Joannem, post init."
  - "Quid audívimus, fratres? Ecce templum illud figúra adhuc erat, et ejécit
    inde Dóminus omnes qui sua quærébant, qui ad núndinas vénerant. Et quæ ibi
    vendébant illi? Quæ opus habébant hómines in sacrifíciis illíus témporis.
    Novit enim cáritas vestra, quod sacrifícia illi pópulo pro ejus carnalitáte,
    et corde adhuc lapídeo, tália data sunt, quibus tenerétur, ne in idóla
    deflúeret: et immolábant ibi sacrifícia, boves, oves et colúmbas. Nostis,
    quia legístis."
responsory1:
  - R. Vos, qui transitúri estis Jordánem, ædificáte altáre Dómino
  - "* De lapídibus, quos ferrum non tétigit: et offérte super illud holocáusta,
    et hóstias pacíficas Deo vestro."
  - V. Cumque intravéritis terram, quam Dóminus datúrus est vobis, ædificáte ibi
    altáre Dómino.
  - "R. De lapídibus, quos ferrum non tétigit: et offérte super illud
    holocáusta, et hóstias pacíficas Deo vestro."
lectio2:
  - "Non ergo magnum peccátum, si hoc vendébant in templo, quod emebátur ut
    offerétur in templo: et tamen ejécit inde illos. Quid si ibi ebriósos
    inveníret, quid fáceret Dóminus, si vendéntes ea quæ lícita sunt, et contra
    justítiam non sunt (quæ enim honéste emúntur, non illícite vendúntur)
    éxpulit tamen, et non est passus domum oratiónis fíeri domum negotiatiónis?"
responsory2:
  - "R. Audi, Israël, præcépta Dómini, et ea in corde tuo quasi in libro scribe:"
  - "* Et dabo tibi terram fluéntem lac et mel."
  - "V. Obsérva ígitur, et audi vocem meam: et inimícus ero inimícis tuis."
  - R. Et dabo tibi terram fluéntem lac et mel.
lectio3:
  - "Si negotiatiónis domus non debet fíeri domus Dei, potatiónis debet fíeri?
    Nos autem quando ista dícimus, strident déntibus suis advérsus nos: et
    consolátur nos Psalmus, quem audístis: Stridérunt in me déntibus suis.
    Nóvimus et nos audíre unde curémur: etsi ingeminántur flagélla Christo, quia
    flagellátur sermo ipsíus. Congregáta sunt, inquit, in me flagélla, et
    nesciébant. Flagellátus est flagéllis Judæórum: flagellátur blasphémiis
    falsórum Christianórum: multíplicant flagélla Dómino Deo suo, et nésciunt.
    Faciámus nos, quantum ipse ádjuvat. Ego autem, cum mihi molésti essent,
    induébam me cilício, et humiliábam in jejúnio ánimam meam."
responsory3:
  - "R. Sicut fui cum Moyse ita ero tecum, dicit Dóminus:"
  - "* Confortáre, et esto robústus: introdúces pópulum meum ad terram lacte et
    melle manántem."
  - "V. Noli timére, quóniam tecum sum: ad quæcúmque perréxeris, non dimíttam
    te, neque derelínquam."
  - "R. Confortáre, et esto robústus: introdúces pópulum meum ad terram lacte et
    melle manántem."
  - "&Gloria"
  - "R. Confortáre, et esto robústus: introdúces pópulum meum ad terram lacte et
