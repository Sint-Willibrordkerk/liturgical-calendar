introitus:
  - "!Ps 17:7."
  - "v. Exaudívit de templo sancto suo vocem meam, allelúja: et clamor meus in
    conspectu ejus, introívit in aures ejus, allelúja, allelúja."
  - "!Ps 17:2-3"
  - "Díligam te, Dómine, virtus mea: Dóminus firmaméntum meum et refúgium meum
    et liberátor meus."
  - "&Gloria"
  - "v. Exaudívit de templo sancto suo vocem meam, allelúja: et clamor meus in
