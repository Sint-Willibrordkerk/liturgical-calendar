lectio1:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 11:5-13"
  - "In illo témpore: Dixit Jesus discípulis suis: Quis vestrum habébit amícum,
    et ibit ad illum media nocte, et dicet illi: Amice, cómmoda mihi tres panes.
    Et réliqua."
  - _
  - Homilía sancti Ambrósii Epíscopi
  - "!Liber 7 in Lucæ cap. 11"
  - Alius præcépti locus est, ut ómnibus moméntis, non solum diébus, sed étiam
    noctibus, orátio deferátur. Vides enim, quod iste qui media nocte perréxit,
    tres panes ab amico suo póstulans, et in ipsa peténdi intentióne persístens,
    non defraudétur oratis. Qui sunt isti tres panes, nisi mysterii cæléstis
    aliméntum? Quod si diligas Dóminum Deum tuum, non solum tibi, sed étiam
    aliis póteris emereri. Quis autem amicior nobis, quam qui pro nobis corpus
    suum trádidit?
responsory1:
  - "@Tempora/Pasc4-1:Responsory1"
lectio2:
  - "Ab hoc media nocte panes David pétiit, et accépit. Petiit enim, quando
    dicebat: Media nocte surgébam ad confiténdum tibi. Ideo meruit hos panes,
    quos appósuit nobis edendos. Petiit cum dicit: Lavábo per síngulas noctes
    lectum meum. Neque enim tímuit, ne excitaret dormiéntem, quem scit semper
    vigilántem. Et ideo scriptórum mémores, noctibus ac diébus oratióni
    instántes, peccátis nostris véniam postulemus."
responsory2:
  - "@Tempora/Pasc4-1:Responsory2"
lectio3:
  - "Nam si ille tam sanctus, et qui regni erat necessitátibus occupatus,
    septies in die laudem Dómino dicebat, matutínis, et vespertinis sacrifíciis
    semper intentus; quid nos fácere oportet, qui eo ámplius rogare debemus, quo
    frequéntius carnis ac mentis fragilitáte delinquimus, ut de via lassis, et
    istíus ævi cursu, ac vitæ hujus anfractu gráviter fatigátis, panis
    refectiónis deésse non possit, qui hóminis corda confírmet? Nec solum media
    nocte Dóminus, sed ómnibus prope docet vigilándum esse moméntis. Venit enim
    et vespertína, et secunda, et tertia vigília: et pulsáre consuévit. Beáti
    ítaque servi illi, quos cum venerit Dóminus, invénerit vigilántes."
responsory3:
  - "@Tempora/Pasc4-1:Responsory3"
