oratio:
  - "Præsta, quǽsumus, omnípotens Deus: ut, qui in afflictióne nostra de tua
    pietáte confídimus; contra advérsa ómnia, tua semper protectióne muniámur."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Jacóbi Apóstoli.
  - "!Jas 5:16-20"
  - "Caríssimi: Confitémini altérutrum peccáta vestra, et oráte pro ínvicem, ut
    salvémini: multum enim valet deprecátio justi assídua. Elías homo erat
    símilis nobis passíbilis: et oratióne orávit, ut non plúeret super terram,
    et non pluit annos tres et menses sex. Et rursum orávit: et cœlum dedit
    plúviam et terra dedit fructum suum. Fratres mei, si quis ex vobis erráverit
    a veritáte et convérterit quis eum: scire debet, quóniam, qui convérti
    fécerit peccatórem ab erróre viæ suæ, salvábit ánimam ejus a morte, et
    opériet multitúdinem peccatórum."
graduale:
  - Allelúja.
  - "!Ps 117:1."
  - "Confitémini Dómino, quóniam bonus: quóniam in sǽculum misericórdia ejus."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam.
  - "!Luc 11:5-13"
  - "In illo témpore: Dixit Jesus discípulis suis: Quis vestrum habébit amícum,
    et íbit ad illum média nocte, et dicet illi: Amíce, cómmoda mihi tres panes,
    quóniam amícus meus venit de via ad me, et non hábeo quod ponam ante illum:
    et ille deíntus respóndens, dicat: Noli mihi moléstus esse, jam óstium
    clausum est, et púeri mei mecum sunt in cubíli, non possum súrgere et dare
    tibi. Et si ille perseveráverit pulsans: dico vobis, etsi non dabit illi
    surgens, eo quod amícus ejus sit, propter improbitátem tamen ejus surget et
    dabit illi, quotquot habet necessários. Et ego dico vobis: Pétite, et
    dábitur vobis: quǽrite, et inveniétis: pulsáte, et aperiétur vobis. Omnis
    enim, qui petit, áccipit: et qui quærit, invénit: et pulsánti aperietur,
    Quis autem ex vobis patrem pétii panem, numquid lápidem dabit illi? Aut
    piscem: numquid pro pisce serpéntem dabit illi? Aut si petíerit ovum:
    numquid pórriget illi scorpiónem? Si ergo vos, cum sitis mali, nostis bona
    data dare fíliis vestris: quanto magis Pater vester de cœlo dabit spíritum
    bonum peténtibus se?"
offertorium:
  - "!Ps 108:30-31"
  - "Confitébor Dómino nimis in ore meo: et in médio multórum laudábo eum, qui
    ástitit a dextris páuperis: ut salvam fáceret a persequéntibus ánimam meam,
    allelúja."
secreta:
  - Hæc múnera, quǽsumus, Dómine, et víncula nostræ pravitátis absólvant, et tuæ
    nobis misericórdiæ dona concílient.
  - $Per Dominum.
communio:
  - "!Luc 11:9-10"
  - "Pétite, et accipiétis: quǽrite, et inveniétis: pulsáte, et aperiétur vobis:
    omnis enim qui pétit, áccipit: et qui quærit, ínvenit: et pulsánti
    aperiétur, allelúja."
postcommunio:
  - "Vota nostra, quǽsumus, Dómine, pio favóre proséquere: ut, dum dona tua in
    tribulatióne percípimus, de consolatióne nostra in tuo amóre crescámus."
  - $Per Dominum
