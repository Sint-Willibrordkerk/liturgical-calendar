introitus:
  - "!Ps 26:14"
  - "v. Exspécta Dóminum, viríliter age: et confortétur cor tuum, et sústine
    Dóminum."
  - "!Ps 26:1"
  - "Dóminus illuminátio mea et salus mea: quem timebo?"
  - "v. Exspécta Dóminum, viríliter age: et confortétur cor tuum, et sústine
    Dóminum."
oratio:
  - "Nostra tibi, Dómine, quǽsumus, sint accépta jejúnia: quæ nos et expiándo
    grátia tua dignos effíciant; et ad remédia perdúcant ætérna."
  - $Per Dominum
lectio:
  - Léctio Daniélis Prophétæ
  - "!Dan 14:27, 28-42"
  - "In diébus illis: Congregáti sunt Babylónii ad regem, et dixérunt ei: Trade
    nobis Daniélem, qui Bel destrúxit et dracónem interfécit, alióquin
    interficiémus te, et domum tuam. Vidit ergo rex, quod irrúerent in eum
    veheménter: et necessitáte compúlsus trádidit eis Daniélem. Qui misérunt eum
    in lacum leónum, et erat ibi diébus sex. Porro in lacu erant leónes septem,
    et dabántur eis duo córpora cotídie et duæ oves: et tunc non data sunt eis,
    ut devorárent Daniélem. Erat autem Hábacuc prophéta in Judǽa, et ipse
    cóxerat pulméntum, et intríverat panes in alvéolo: et ibat in campum, ut
    ferret messóribus. Dixítque Angelus Dómini ad Hábacuc: Fer prándium, quod
    habes, in Babylónem Daniéli, qui est in lacu leónum. Et dixit Hábacuc:
    Dómine, Babylónem non vidi, et lacum néscio. Et apprehéndit eum Angelus
    Dómini in vértice ejus, et portávit eum capíllo cápitis sui, posuítque eum
    in Babylóne supra lacum in ímpetu spíritus sui. Et clamávit Hábacuc, dicens:
    Dániel, serve Dei, tolle prándium, quod misit tibi Deus. Et ait Dániel:
    Recordátus es mei, Deus, et non dereliquísti diligéntes te. Surgénsque
    Daniel comédit. Porro Angelus Dómini restítuit Hábacuc conféstim in loco
    suo. Venit ergo rex die séptimo, ut lugéret Daniélem: et venit ad lacum et
    introspéxit, et ecce Dániel sedens in médio leónum. Et exclamávit voce magna
    rex, dicens: Magnus es, Dómine, Deus Daniélis. Et extráxit eum de lacu
    leónum. Porro illos, qui perditiónis ejus causa fúerant, intromísit in
    lacum, et devoráti sunt in moménto coram eo. Tunc rex ait: Páveant omnes
    habitántes in univérsa terra Deum Daniélis: quia ipse est salvátor, fáciens
    signa et mirabília in terra: qui liberávit Daniélem de lacu leónum."
graduale:
  - "!Ps 42:1, 3"
  - "Discérne causam meam, Dómine: ab hómine iníquo et dolóso éripe me."
  - "V. Emítte lucem tuam et veritátem tuam: ipsa me deduxérunt, et adduxérunt
    in montem sanctum tuum."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joann 7:1-13"
  - "In illo témpore: Ambulábat Jesus in Galilǽam, non enim volébat in Judǽam
    ambuláre, quia quærébant eum Judǽi interfícere. Erat autem in próximo dies
    festus Judæórum, Scenopégia. Dixérunt autem ad eum fratres ejus: Transi
    hinc, et vade in Judǽam, ut et discípuli tui vídeant ópera tua, quæ facis.
    Nemo quippe in occúlto quid facit, et quærit ipse in palam esse: si hæc
    facis, manifésta teipsum mundo. Neque enim fratres ejus credébant in eum.
    Dixit ergo eis Jesus: Tempus meum nondum advénit: tempus autem vestrum
    semper est parátum. Non potest mundus odísse vos: me autem odit: quia ego
    testimónium perhíbeo de illo, quod ópera ejus mala sunt. Vos ascéndite ad
    diem festum hunc, ego autem non ascéndo ad diem festum istum: quia meum
    tempus nondum implétum est. Hæc cum dixísset, ipse mansit in Galilǽa. Ut
    autem ascendérunt fratres ejus, tunc et ipse ascéndit ad diem festum non
    maniféste, sed quasi in occúlto. Judǽi ergo quærébant eum in die festo, et
    dicébant: Ubi est ille? Et murmur multum erat in turba de eo. Quidam enim
    dicébant: Quia bonus est. Alii autem dicébant: Non, sed sedúcit turbas. Nemo
    tamen palam loquebátur de illo, propter metum Judæórum."
offertorium:
  - "!Ps 9:11-12, 13"
  - "Sperent in te omnes, qui novérunt nomen tuum, Dómine: quóniam non
    derelínquis quæréntes te: psállite Dómino, qui hábitat in Sion: quóniam non
    est oblítus oratiónes páuperum."
secreta:
  - "Hóstias tibi, Dómine, deférimus immolándas: quæ temporálem consolatiónem
    signíficent; ut promíssa non desperémus ætérna."
  - $Per Dominum
communio:
  - "!Ps 24:22"
  - Rédime me, Deus Israël, ex ómnibus angústiis meis.
postcommunio:
  - "Da, quǽsumus, omnípotens Deus: ut, quæ divína sunt, júgiter exsequéntes,
    donis mereámur cœléstibus propinquáre."
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Da nobis, quǽsumus, Dómine: perseverántem in tua voluntáte famulátum; ut
    in diébus nostris, et mérito et número, pópulus tibi sérviens augeátur."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 7:1-13"
  - "In illo témpore: Ambulábat Jesus in Galilǽam: non enim volébat in Judǽam
    ambuláre, quia quærébant eum Judǽi interfícere. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tractatus 28 in Joannem"
  - "In isto Evangélii capítulo, fratres, Dóminus noster Jesus Christus secúndum
    hóminem se plúrimum commendávit fídei nostræ. Etenim semper hoc egit dictis
    et factis suis, ut Deus credátur et homo: Deus qui nos fecit, homo qui nos
    quæsívit: Deus cum Patre semper, homo nobíscum ex témpore. Non enim quǽreret
    quem fécerat, nisi fíeret ipse quod fécerat. Verum hoc mementóte, et de
    córdibus vestris nolíte dimíttere: sic esse Christum hóminem factum, ut non
    destíterit Deus esse. Manens Deus accépit hóminem, qui fecit hóminem."
responsory1:
  - "R. Adjútor et suscéptor meus es tu, Dómine: et in verbum tuum sperávi:"
  - "* Declináte a me, malígni: et scrutábor mandáta Dei mei."
  - "V. Iníquos ódio hábui: et legem tuam diléxi."
  - "R. Declináte a me, malígni: et scrutábor mandáta Dei mei."
lectio2:
  - "Quando ergo látuit ut homo, non poténtiam perdidísse putándus est, sed
    exémplum infirmitáti præbuísse. Ille enim quando vóluit, deténtus est:
    quando vóluit, occísus est. Sed quóniam futúra erant membra ejus, id est,
    fidéles ejus, qui non habérent illam potestátem, quam habébat ipse Deus
    noster: quod latébat, quod se tamquam ne occiderétur, occultábat, hoc
    indicábat factúra esse membra sua, in quibus útique membris suis ipse erat."
responsory2:
  - "R. Docébo iníquos vias tuas: et ímpii ad te converténtur:"
  - "* Líbera me de sanguínibus, Deus, Deus salútis meæ."
  - "V. Dómine, lábia mea apéries: et os meum annuntiábit laudem tuam."
  - R. Líbera me de sanguínibus, Deus, Deus salútis meæ.
lectio3:
  - "Non enim Christus in cápite, et non in córpore: sed Christus totus in
    cápite, et in córpore. Quod ergo membra ejus, ipse: quod autem ipse, non
    contínuo membra ejus. Nam si non ipsi essent membra ejus, non díceret Saulo:
    Quid me perséqueris? Non enim Saulus ipsum, sed membra ejus, id est, fidéles
    ejus, in terra persequebátur. Nóluit tamen dícere sanctos meos, servos meos,
    postrémo honorabílius, fratres meos: sed me, hoc est membra mea, quibus ego
    sum caput."
responsory3:
  - "R. Ne perdas cum ímpiis, Deus, ánimam meam, et cum viris sánguinum vitam
    meam:"
  - "* Rédime me, Dómine."
  - V. Eripe me, Dómine, ab hómine malo, a viro iníquo líbera me.
  - R. Rédime me, Dómine.
  - "&Gloria"
  - "R. Ne perdas cum ímpiis, Deus, ánimam meam, et cum viris sánguinum vitam
    meam: * Rédime me, Dómine."
