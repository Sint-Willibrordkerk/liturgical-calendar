introitus:
  - "!Ps 73:20; 73:19; 73:23"
  - "v. Réspice, Dómine, in testaméntum tuum, et ánimas páuperum tuórum ne
    derelínquas in finem: exsúrge, Dómine, et júdica causam tuam, et ne
    obliviscáris voces quæréntium te."
  - "!Ps 73:1"
  - "Ut quid, Deus, reppulísti in finem: irátus est furor tuus super oves páscuæ
    tuæ?"
  - "&Gloria"
  - "v. Réspice, Dómine, in testaméntum tuum, et ánimas páuperum tuórum ne
    derelínquas in finem: exsúrge, Dómine, et júdica causam tuam, et ne
    obliviscáris voces quæréntium te."
oratio:
  - "Omnípotens sempitérne Deus, da nobis fídei, spei et caritátis augméntum:
    et, ut mereámur asséqui quod promíttis, fac nos amáre quod prǽcipis."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Gálatas
  - "!Gal 3:16-22"
  - "Fratres: Abrahæ dictæ sunt promissiónes, et sémini ejus. Non dicit: Et
    semínibus, quasi in multis; sed quasi in uno: Et sémini tuo, qui est
    Christus. Hoc autem dico: testaméntum confirmátum a Deo, quæ post
    quadringéntos et trigínta annos facta est lex, non írritum facit ad
    evacuándam promissiónem. Nam si ex lege heréditas, jam non ex promissióne.
    Abrahæ autem per repromissiónem donávit Deus. Quid igitur lex? Propter
    transgressiónes pósita est, donec veníret semen, cui promíserat, ordináta
    per Angelos in manu mediatóris. Mediátor autem uníus non est: Deus autem
    unus est. Lex ergo advérsus promíssa Dei? Absit. Si enim data esset lex, quæ
    posset vivificáre, vere ex lege esset justítia. Sed conclúsit Scriptúra
    ómnia sub peccáto, ut promíssio ex fide Jesu Christi darétur credéntibus."
graduale:
  - "!Ps 73:20; 73:19; 73:22"
  - "Réspice, Dómine, in testaméntum tuum: et ánimas páuperum tuórum ne
    obliviscáris in finem."
  - "V. Exsúrge, Dómine, et júdica causam tuam: memor esto oppróbrii servórum
    tuórum. Allelúja, allelúja"
  - "!Ps 89:1"
  - Dómine, refúgium factus es nobis a generatióne et progénie. Allelúja.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 17:11-19"
  - "In illo témpore: Dum iret Jesus in Jerúsalem, transíbat per médiam Samaríam
    et Galilǽam. Et cum ingrederétur quoddam castéllum, occurrérunt ei decem
    viri leprósi, qui stetérunt a longe; et levavérunt vocem dicéntes: Jesu
    præcéptor, miserére nostri. Quos ut vidit, dixit: Ite, osténdite vos
    sacerdótibus. Et factum est, dum irent, mundáti sunt. Unus autem ex illis,
    ut vidit quia mundátus est, regréssus est, cum magna voce magníficans Deum,
    et cecidit in fáciem ante pedes ejus, grátias agens: et hic erat
    Samaritánus. Respóndens autem Jesus, dixit: Nonne decem mundáti sunt? et
    novem ubi sunt? Non est invéntus, qui redíret et daret glóriam Deo, nisi hic
    alienígena. Et ait illi: Surge, vade; quia fides tua te salvum fecit."
offertorium:
  - "!Ps 30:15-16"
  - "In te sperávi, Dómine; dixi: Tu es Deus meus, in mánibus tuis témpora mea."
secreta:
  - "Propitiáre, Dómine, pópulo tuo, propitiáre munéribus: ut, hac oblatióne
    placátus, et indulgéntiam nobis tríbuas et postuláta concedas."
  - $Per Dominum
communio:
  - "!Sap 16:20"
  - Panem de cœlo dedísti nobis, Dómine, habéntem omne delectaméntum et omnem
    sapórem suavitátis.
postcommunio:
  - "Sumptis, Dómine, cœléstibus sacraméntis: ad redemptiónis ætérnæ, quǽsumus,
    proficiámus augméntum."
  - $Per Dominum
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 17:11-19"
  - "In illo témpore: Dum iret Jesus in Jerúsalem, transíbat per médiam Samaríam
    et Galilǽam. Et cum ingrederétur quoddam castéllum, occurrérunt ei decem
    viri leprósi. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Lib. 2 quæst. Evang. cap. 40"
  - "De decem leprósis, quos Dóminus ita mundávit, cum ait: Ite, osténdite vos
    sacerdótibus; quæri potest, cur eos ad sacerdótes míserit, ut cum irent,
    mundaréntur. Nullum enim eórum, quibus hæc corporália benefícia prǽstitit,
    invenítur misísse ad sacerdótes, nisi leprósos. Nam et illum a lepra
    mundáverat, cui dixit: Vade, osténde te sacerdótibus, et offer pro te
    sacrifícium, quod præcépit Móyses, in testimónium illis. Quæréndum ígitur
    est, quid ipsa lepra signíficet: non enim sanáti, sed mundáti dicúntur, qui
    ea caruérunt. Colóris quippe vítium est, non valetúdinis, aut integritátis
    sénsuum atque membrórum."
lectio8:
  - Leprósi ergo non absúrde intélligi possunt, qui sciéntiam veræ fídei non
    habéntes, várias doctrínas profiténtur erróris. Non enim abscóndunt
    imperítiam suam; sed pro summa perítia próferunt in lucem, et jactántia
    sermónis osténtant. Nulla porro falsa doctrína est, quæ non áliqua vera
    intermísceat. Vera ergo falsis inordináte permíxta, in una disputatióne vel
    narratióne hóminis, tamquam in uníus córporis colóre apparéntia, signíficant
    lepram, tamquam veris falsísque colórum variántem atque maculántem.
responsory8:
  - "@Tempora/Pent01-0:Responsory8"
lectio9:
  - "Hi autem tam vitándi sunt Ecclésiæ, ut, si fíeri potest, lóngius remóti,
    magno clamóre Christum interpéllent; sicut isti decem stetérunt a longe, et
    levavérunt vocem, dicéntes: Jesu præcéptor, miserére nostri. Nam et quod
    præceptórem vocant, quo nómine néscio utrum quisquam Dóminum interpelláverit
    pro medicína corporáli; satis puto significáre, lepram falsam esse
    doctrínam, quam bonus præcéptor abstérgit."
  - "&teDeum"
