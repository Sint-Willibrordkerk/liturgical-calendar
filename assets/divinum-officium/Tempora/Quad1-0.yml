lectio2:
  - "!2 Cor 6:11-16"
  - 11 Os nostrum patet ad vos, o Corínthii; cor nostrum dilatátum est.
  - "12 Non angustiámini in nobis: angustiámini autem in viscéribus vestris:"
  - 13 eándem autem habéntes remuneratiónem, tamquam fíliis dico, dilatámini et
    vos.
  - 14 Nolíte jugum dúcere cum infidélibus. Quæ enim participátio justítiæ cum
    iniquitáte? aut quæ socíetas luci ad ténebras?
  - 15 quæ autem convéntio Christi ad Bélial? aut quæ pars fidéli cum infidéli?
  - "16 qui autem consénsus templo Dei cum idólis? vos enim estis templum Dei
    vivi, sicut dicit Deus: Quóniam inhabitábo in illis, et inambulábo inter
    eos, et ero illórum Deus, et ipsi erunt mihi pópulus."
responsory2:
  - "R. In ómnibus exhibeámus nosmetípsos sicut Dei minístros in multa
