lectio3:
  - "!2 Cor 7:4-9"
  - 4 Replétus sum consolatióne; superabúndo gáudio in omni tribulatióne nostra.
  - "5 Nam et cum venissémus in Macedóniam, nullam réquiem hábuit caro nostra,
    sed omnem tribulatiónem passi sumus: foris pugnæ, intus timóres."
  - 6 Sed qui consolátur húmiles, consolátus est nos Deus in advéntu Titi.
  - 7 Non solum autem in advéntu ejus, sed étiam in consolatióne, qua consolátus
    est in vobis, réferens nobis vestrum desidérium, vestrum fletum, vestram
    æmulatiónem pro me, ita ut magis gaudérem.
  - "8 Quóniam etsi contristávi vos in epístola, non me pœ́nitet: etsi
    pœnitéret, videns quod epístola illa (etsi ad horam) vos contristávit,"
  - "9 nunc gáudeo: non quia contristáti estis, sed quia contristáti estis ad
    pœniténtiam."
responsory3:
  - "R. In jejúnio et fletu orábunt sacerdótes, dicéntes:"
  - "* Parce, Dómine, parce pópulo tuo; et ne des hereditátem tuam in
    perditiónem."
  - V. Inter vestíbulum et altáre plorábunt sacerdótes, dicéntes.
  - R. Parce, Dómine, parce pópulo tuo; et ne des hereditátem tuam in
    perditiónem.
  - "&Gloria"
  - R. Parce, Dómine, parce pópulo tuo; et ne des hereditátem tuam in
    perditiónem.
lectio4:
  - Sermo sancti Leónis Papæ
  - "!Sermo 4 de Quadragesima"
  - "Prædicatúrus vobis, dilectíssimi, sacratíssimum maximumque jejunium, quo
    aptius utar exordio, quam ut verbis Apóstoli, in quo Christus loquebátur,
    incipiam, dicamque quod lectum est: Ecce nunc tempus acceptábile: ecce nunc
    dies salútis? Quamvis enim nulla sint témpora, quæ divinis non sint plena
    munéribus, et semper nobis ad misericórdiam Dei per ipsíus grátiam præstétur
    accéssus: nunc tamen ómnium mentes majori studio ad spiritales profectus
    movéri, et ampliori fiducia oportet animari, quando ad univérsa pietátis
    officia, illíus nos diéi, in quo redempti sumus, recursus invítat: ut
    excéllens super ómnia passiónis Dominicæ sacraméntum, purificátis et
    corpóribus et ánimis celebremus."
responsory4:
  - "R. Emendémus in mélius, quæ ignoránter peccávimus: ne súbito præoccupáti
    die mortis, quærámus spátium pœniténtiæ, et inveníre non possímus:"
  - "* Atténde, Dómine, et miserére, quia peccávimus tibi."
  - V. Adjuva nos, Deus salutáris noster, et propter honórem nóminis tui,
    Dómine, líbera nos.
  - R. Atténde, Dómine, et miserére, quia peccávimus tibi.
lectio5:
  - "Debebátur quidem tantis mystériis ita incessábilis devotio, et continuáta
    reveréntia, ut tales permanerémus in conspéctu Dei, quales nos in ipso
    Paschali festo dignum est inveníri. Sed quia hæc fortitúdo paucórum est: et
    dum carnis fragilitate austerior observántia relaxátur, dumque per varias
    actiónes vitæ hujus sollicitúdo disténditur, necesse est de mundano púlvere
    étiam religiosa corda sordéscere: magna divinæ institutiónis salubritate
    provisum est, ut ad reparandam méntium puritátem quadragínta nobis diérum
    exercitátio mederétur, in quibus aliórum témporum culpas, et pia ópera
    redímerent, et jejunia casta decóquerent."
responsory5:
  - "R. Derelínquat ímpius viam suam, et vir iníquus cogitatiónes suas, et
    revertátur ad Dóminum, et miserébitur ejus:"
  - "* Quia benígnus et miséricors est, et præstábilis super malítia Dóminus
    Deus noster."
  - V. Non vult Dóminus mortem peccatóris, sed ut convertátur et vivat.
  - R. Quia benígnus et miséricors est, et præstábilis super malítia Dóminus
    Deus noster.
lectio6:
  - "Ingressuri ígitur, dilectíssimi, dies mysticos, et purificandis ánimis
    atque corpóribus sacratius institutos, præceptis apostolicis obedire
    curemus, emundántes nos ab omni inquinaménto carnis ac spíritus: ut
    castigátis colluctatiónibus, quæ sunt inter utramque substantiam, animus,
    quem sub Dei gubernaculis constitutum, corporis sui decet esse rectórem,
    dominatiónis suæ obtíneat dignitátem: ut némini dantes ullam offensiónem,
    vituperatiónibus obloquéntium non simus obnoxii. Digna enim ab infidelibus
    reprehensióne carpemur, et nostro vítio linguæ impiæ in injúriam se
    religiónis armábunt, si jejunántium mores a puritate perfectæ continéntiæ
    discrepárint. Non enim in sola abstinéntia cibi stat nostri summa jejunii:
    aut fructuose corpori esca subtrahitur, nisi mens ab iniquitáte revocétur."
responsory6:
  - "R. Paradísi portas apéruit nobis jejúnii tempus: suscipiámus illud orántes,
    et deprecántes:"
  - "* Ut in die resurrectiónis cum Dómino gloriémur."
  - V. In ómnibus exhibeámus nosmetípsos sicut Dei minístros in multa patiéntia.
  - R. Ut in die resurrectiónis cum Dómino gloriémur.
  - "&Gloria"
  - R. Ut in die resurrectiónis cum Dómino gloriémur.
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 4:1-11"
  - "In illo témpore: Ductus est Jesus in desértum a Spíritu, ut tentarétur a
    diábolo. Et cum jejunásset quadragínta diébus et quadragínta nóctibus,
    póstea esúriit. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 16 in Evangelia"
  - "Dubitári a quibúsdam solet, a quo spíritu sit Jesus ductus in desértum,
    propter hoc quod súbditur: Assúmpsit eum diábolus in sanctam civitátem: et
    rursum: Assúmpsit eum in montem excélsum valde. Sed vere et absque ulla
    quæstióne conveniénter accípitur, ut a Sancto Spíritu in desértum ductus
    credátur: ut illuc eum suus Spíritus dúceret, ubi hunc ad tentándum malígnus
    spíritus inveníret. Sed ecce cum dícitur Deus homo vel in excélsum montem,
    vel in sanctam civitátem a diábolo assúmptus, mens réfugit crédere, humánæ
    hoc audíre aures expavéscunt. Qui tamen non esse incredibília ista
    cognóscimus, si in illo et ália facta pensámus."
responsory7:
  - "R. Scíndite corda vestra, et non vestiménta vestra: et convertímini ad
    Dóminum Deum vestrum:"
  - "* Quia benígnus et miséricors est."
  - V. Derelínquat ímpius viam suam, et vir iníquus cogitatiónes suas, et
    revertátur ad Dóminum, et miserébitur ejus.
  - R. Quia benígnus et miséricors est.
lectio8:
  - "Certe iniquórum ómnium caput diabolus est: et hujus cápitis membra sunt
    omnes iniqui. An non diaboli membrum fuit Pilatus? an non diaboli membra
    Judæi persequéntes, et milites crucifigéntes Christum fuérunt? Quid ergo
    mirum, si se ab illo permisit in montem duci, qui se pértulit étiam a
    membris illíus crucifigi? Non est ergo indignum Redemptori nostro quod
    tentari vóluit, qui vénerat occídi. Justum quippe erat, ut sic tentatiónes
    nostras suis tentatiónibus vínceret, sicut mortem nostram vénerat sua morte
    superare."
responsory8:
  - "R. Frange esuriénti panem tuum, et egénos vagósque induc in domum tuam:"
  - "* Tunc erúmpet quasi mane lumen tuum, et anteíbit fáciem tuam justítia tua."
  - V. Cum víderis nudum, óperi eum, et carnem tuam ne despéxeris.
  - R. Tunc erúmpet quasi mane lumen tuum, et anteíbit fáciem tuam justítia tua.
lectio9:
  - "Sed sciéndum nobis est, quia tribus modis tentátio agitur: suggestióne,
    delectatióne et consénsu. Et nos cum tentamur, plerumque in delectatiónem,
    aut étiam in consénsum lábimur: quia de carnis peccáto propagati, in nobis
    ipsis étiam gérimus, unde certámina tolerámus. Deus vero, qui in útero
    Vírginis incarnatus, in mundum sine peccáto vénerat, nihil contradictiónis
    in semetípso tolerábat. Tentari ergo per suggestiónem pótuit: sed ejus
    mentem peccáti delectátio non momórdit. Atque ideo omnis diabolica illa
    tentátio foris, non intus fuit."
responsory9:
  - "R. Angelis suis Deus mandávit de te, ut custódiant te in ómnibus viis tuis:"
  - "* In mánibus portábunt te, ne umquam offéndas ad lápidem pedem tuum."
  - V. Super áspidem et basilíscum ambulábis, et conculcábis leónem et dracónem.
  - R. In mánibus portábunt te, ne umquam offéndas ad lápidem pedem tuum.
  - "&Gloria"
  - R. In mánibus portábunt te, ne umquam offéndas ad lápidem pedem tuum.
