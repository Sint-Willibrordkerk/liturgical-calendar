responsory1_:
  - "R. Recordáre, Dómine, testaménti tui, et dic Angelo percutiénti: Cesset jam
    manus tua,"
  - "* Ut non desolétur terra, et ne perdas omnem ánimam vivam."
  - "V. Ego sum qui peccávi, ego qui iníque egi: isti qui oves sunt, quid
    fecérunt? Avertátur, óbsecro, furor tuus, Dómine, a pópulo tuo."
  - R. Ut non desolétur terra, et ne perdas omnem ánimam vivam.
rubrica-cisterciensis/responsory1_:
  - "R. Recordáre, Dómine, testaménti tui, et dic Angelo percutiénti: Cesset jam
    manus tua,"
  - "* Ut non desolétur terra, et ne perdas omnem ánimam vivam."
  - "V. Quiéscat, Dómine, ira tua a pópulo tuo, et a civitáte sancta tua:"
  - R. Ut non desolétur terra, et ne perdas omnem ánimam vivam.
responsory1:
  - "@:Responsory1_"
rubrica-cisterciensis/responsory1:
  - "@:Responsory1C"
responsory1c:
  - "R. Planxit autem David planctu magno super Saül, et fílios ejus, et dixit:
    Quómodo cecidérunt fortes in bello,"
  - "* Et periérunt arma béllica; ínclyti Israël, flete."
  - "V. Montes Gélboë, nec ros nec plúvia super vos descéndant, ubi cecidérunt
    vulneráti multi:"
  - R. Et periérunt arma béllica; ínclyti Israël, flete.
