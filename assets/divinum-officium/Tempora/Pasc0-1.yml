oratio:
  - "Deus, qui sollemnitáte pascháli, mundo remédia contulísti: pópulum tuum,
    quǽsumus, cælésti dono proséquere; ut et perféctam libertátem consequi
    mereátur, et ad vitam profíciat sempitérnam."
  - $Per Dominum
lectio:
  - Léctio Actuum Apostólorum
  - "!Act. 10, 37-43."
  - "In diébus illis: Stans Petrus in médio plebis, dixit: Viri fratres, vos
    scitis, quod factum est verbum per univérsam Judǽam: incípiens enim a
    Galilǽa, post baptísmum, quod prædicávit Joánnes, Jesum a Názareth: quómodo
    unxit eum Deus Spíritu Sancto et virtúte, qui pertránsiit benefaciéndo, et
    sanándo omnes oppréssos a diábolo, quóniam Deus erat cum illo. Et nos testes
    sumus ómnium, quæ fecit in regióne Judæórum et Jerúsalem, quem occidérunt
    suspendéntes in ligno. Hunc Deus suscitávit tértia die, et dedit eum
    maniféstum fíeri, non omni pópulo, sed téstibus præordinátis a Deo: nobis,
    qui manducávimus et bíbimus cum illo, postquam resurréxit a mórtuis. Et
    præcépit nobis prædicáre pópulo et testificári, quia ipse est, qui
    constitútus est a Deo judex vivórum et mortuórum. Huic omnes Prophétæ
    testimónium pérhibent, remissiónem peccatórum accípere per nomen ejus omnes,
    qui credunt in eum."
graduale:
  - "!Ps 117:24; 117:2"
  - "Hæc dies, quam fecit Dóminus: exsultémus et lætémur in ea."
  - "V. Dicat nunc Israël, quóniam bonus: quóniam in sǽculum misericórdia ejus."
  - Allelúja, allelúja.
  - "!Matt 28:2"
  - "Angelus Dómini descéndit de cœlo: et accédens revólvit lápidem, et sedébat
    super eum."
sequentia:
  - "@Tempora/Pasc0-0:Sequentia"
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc. 24:13-35"
  - "In illo témpore: Duo ex discípulis Jesu ibant ipsa die in castéllum, quod
    erat in spátio stadiórum sexagínta ab Jerúsalem, nómine Emmaus. Et ipsi
    loquebántur ad ínvicem de his ómnibus, quæ accíderant. Et factum est, dum
    fabularéntur et secum quǽrerent: et ipse Jesus appropínquans ibat cum illis:
    óculi autem illórum tenebántur, ne eum agnóscerent. Et ait ad illos: Qui
    sunt hi sermónes, quos confértis ad ínvicem ambulántes, et estis tristes? Et
    respóndens unus, cui nomen Cléophas, dixit ei: Tu solus peregrínus es in
    Jerúsalem, et non cognovísti, quæ facta sunt in illa his diébus? Quibus ille
    dixit: Quæ? Et dixérunt: De Jesu Nazaréno, qui fuit vir Prophéta potens in
    ópere et sermóne, coram Deo et omni pópulo: et quómodo eum tradidérunt summi
    sacerdótes et príncipes nostri in damnatiónem mortis, et crucifixérunt eum.
    Nos autem sperabámus, quia ipse esset redemptúrus Israël: et nunc super hæc
    ómnia tértia dies est hódie, quod hæc facta sunt. Sed et mulíeres quædam ex
    nostris terruérunt nos, quæ ante lucem fuérunt ad monuméntum, et, non
    invénto córpore ejus, venérunt, dicéntes se étiam visiónem Angelórum
    vidísse, qui dicunt eum vívere. Et abiérunt quidam ex nostris ad monuméntum:
    et ita invenérunt, sicut mulíeres dixérunt, ipsum vero non invenérunt. Et
    ipse dixit ad eos: O stulti et tardi corde ad credéndum in ómnibus, quæ
    locúti sunt Prophétæ! Nonne hæc opórtuit pati Christum, et ita intráre in
    glóriam suam? Et incípiens a Móyse et ómnibus Prophétis, interpretabátur
    illis in ómnibus Scriptúris, quæ de ipso erant. Et appropinquavérunt
    castéllo, quo ibant: et ipse se finxit lóngius ire. Et coëgérunt illum,
    dicéntes: Mane nobiscum, quóniam advesperáscit et inclináta est jam dies. Et
    intrávit cum illis. Et factum est, dum recúmberet cum eis, accépit panem, et
    benedíxit, ac fregit, et porrigébat illis. Et apérti sunt óculi eórum, et
    cognovérunt eum: et ipse evánuit ex óculis eórum. Et dixérunt ad ínvicem:
    Nonne cor nostrum ardens erat in nobis, dum loquerétur in via, et aperíret
    nobis Scriptúras? Et surgéntes eádem hora regréssi sunt in Jerúsalem: et
    invenérunt congregátas úndecim, et eos, qui cum illis erant, dicéntes: Quod
    surréxit Dóminus vere, et appáruit Simóni. Et ipsi narrábant, quæ gesta
    erant in via: et quómodo cognovérunt eum in fractióne panis."
offertorium:
  - "!Matt 28:2; 28:5-6"
  - "Angelus Dómini descéndit de cœlo, et dixit muliéribus: Quem quǽritis,
    surréxit, sicut dixit, allelúja."
secreta:
  - "Súscipe, quǽsumus, Dómine, preces pópuli tui cum oblatiónibus hostiárum:
    ut, paschálibus initiáta mystériis, ad æternitátis nobis medélam, te
    operánte, profíciant."
  - $Per Dominum
communio:
  - "!Luc 24:34"
  - Surréxit Dóminus, et appáruit Petro, allelúja.
postcommunio:
  - "Spíritum nobis, Dómine, tuæ caritátis infúnde: ut, quos sacraméntis
    paschálibus satiásti, tua fácias pietáte concórdes."
  - $Per Dominum eiusdem
lectio1:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 24:13-35"
  - "In illo témpore: Duo ex discípulis Jesu ibant ipsa die in castéllum, quod
    erat in spátio stadiórum sexagínta ab Jerúsalem, nómine Emmaus. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 23 in Evangelia"
  - "Audístis, fratres caríssimi, quia duóbus discípulis ambulántibus in via,
    non quidem credéntibus, sed tamen de se loquéntibus, Dóminus appáruit: sed
    eis spéciem, quam recognóscerent, non osténdit. Hoc ergo egit foris Dóminus
    in óculis córporis, quod apud ipsos agebátur intus in óculis cordis. Ipsi
    namque apud semetípsos intus et amábant, et dubitábant: eis autem Dóminus
    foris et præsens áderat, et quis esset non ostendébat. De se ergo
    loquéntibus præséntiam exhíbuit: sed de se dubitántibus cognitiónis suæ
    spéciem abscóndit."
responsory1:
  - "R. María Magdaléne, et áltera María ibant dilúculo ad monuméntum:"
  - "* Jesum quem quǽritis, non est hic, surréxit sicut locútus est, præcédet
    vos in Galilǽam, ibi eum vidébitis, allelúja, allelúja."
  - "V. Et valde mane una sabbatórum véniunt ad monuméntum, orto jam sole: et
    introëúntes vidérunt júvenem sedéntem in dextris, qui dixit illis."
  - R. Jesum quem quǽritis, non est hic, surréxit sicut locútus est, præcédet
    vos in Galilǽam, ibi eum vidébitis, allelúja, allelúja.
lectio2:
  - "Verba quidem cóntulit, durítiam intelléctus increpávit, sacræ Scriptúræ
    mystéria, quæ de seípso erant, apéruit: et tamen quia adhuc in eórum
    córdibus peregrínus erat a fide, se ire lóngius finxit. Fíngere namque,
    compónere dícimus: unde et compositóres luti, fígulos vocámus. Nihil ergo
    simplex Véritas per duplicitátem fecit: sed talem se eis exhíbuit in
    córpore, qualis apud illos erat in mente. Probándi autem erant, si hi, qui
    eum etsi necdum ut Deum dilígerent, saltem ut peregrínum amáre potuíssent."
responsory2:
  - "R. Surréxit pastor bonus, qui ánimam suam pósuit pro óvibus suis, et pro
    grege suo mori dignátus est:"
  - "* Allelúja, allelúja, allelúja."
  - V. Etenim Pascha nostrum immolátus est Christus.
  - R. Allelúja, allelúja, allelúja.
  - "&Gloria"
  - R. Allelúja, allelúja, allelúja.
lectio3:
  - "Sed quia esse extránei a caritáte non póterant hi, cum quibus Véritas
    gradiebátur: eum ad hospítium quasi peregrínum vocant. Cur autem dícimus,
    vocant, cum illic scriptum sit: Et coëgérunt eum? Ex quo nimírum exémplo
    collígitur, quia peregríni ad hospítium non solum invitándi sunt, sed étiam
    trahéndi. Mensam ígitur ponunt, panes cibósque ófferunt: et Deum, quem in
    Scriptúræ sacræ expositióne non cognóverant, in panis fractióne cognóscunt.
    Audiéndo ergo præcépta Dei illumináti non sunt, faciéndo illumináti sunt:
    quia scriptum est: Non auditóres legis justi sunt apud Deum, sed factóres
    legis justificabúntur. Quisquis ergo vult audíta intellégere, festínet ea,
    quæ jam audíre pótuit, ópere implére. Ecce Dóminus non est cógnitus dum
    loquerétur, et dignátus est cognósci, dum páscitur."
  - "&teDeum"
