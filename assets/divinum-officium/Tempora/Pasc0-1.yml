introitus:
  - "!Exod 13:5; 13:9"
  - "v. Introdúxit vos Dóminus in terram fluéntem lac et mel, allelúja: et ut
    lex Dómini semper sit in ore vestro, allelúja, allelúja."
  - "!Ps 104:1"
  - "Confitémini Dómino et invocáte nomen ejus: annuntiáte inter gentes ópera
    ejus."
  - "&Gloria"
  - "v. Introdúxit vos Dóminus in terram fluéntem lac et mel, allelúja: et ut
