introitus:
  - "!Ps 17:19-20"
  - "v. Factus est Dóminus protéctor meus, et edúxit me in latitúdinem: salvum
    me fecit, quóniam vóluit me."
  - "!Ps 17:2-3"
  - "Díligam te. Dómine, virtus mea: Dóminus firmaméntum meum et refúgium meum
    et liberátor meus."
  - "&Gloria"
  - "v. Factus est Dóminus protéctor meus, et edúxit me in latitúdinem: salvum
    me fecit, quóniam vóluit me."
oratio:
  - "Sancti nóminis tui, Dómine, timórem páriter et amórem fac nos habére
    perpétuum: quia numquam tua gubernatióne destítuis, quos in soliditáte tuæ
    dilectiónis instítuis."
  - $Per Dominum
commemoratio-oratio:
  - "!Pro Octava SSmi. Corporis Christi"
  - "Deus, qui nobis sub Sacraménto mirábili passiónis tuæ memóriam reliquísti:
    tríbue, quǽsumus, ita nos Córporis et Sánguinis tui sacra mystéria venerári;
    ut redemptiónis tuæ fructum in nobis júgiter sentiámus:"
  - $Qui vivis
lectio:
  - Léctio Epístolæ beáti Joánnis Apóstoli
  - "!1 John 3:13-18"
  - "Caríssimi: Nolíte mirári, si odit vos mundus. Nos scimus, quóniam transláti
    sumus de morte ad vitam, quóniam dilígimus fratres. Qui non díligit, manet
    in morte: omnis, qui odit fratrem suum, homicída est. Et scitis, quóniam
    omnis homicída non habet vitam ætérnam in semetípso manéntem. In hoc
    cognóvimus caritátem Dei, quóniam ille ánimam suam pro nobis pósuit: et nos
    debémus pro frátribus ánimas pónere. Qui habúerit substántiam hujus mundi,
    et víderit fratrem suum necessitátem habére, et cláuserit víscera sua ab eo:
    quómodo cáritas Dei manet in eo? Filíoli mei, non diligámus verbo neque
    lingua, sed ópere et veritáte."
graduale:
  - "!Ps 119:1-2"
  - Ad Dóminum, cum tribulárer, clamávi, et exaudívit me.
  - V. Dómine, libera ánimam meam a lábiis iníquis, et a lingua dolósa.
    Allelúja, allelúja.
  - "!Ps 7:2"
  - "Dómine, Deus meus, in te sperávi: salvum me fac ex ómnibus persequéntibus
    me et líbera me. Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 14:16-24"
  - "In illo témpore: Dixit Jesus pharisǽis parábolam hanc: Homo quidam fecit
    cœnam magnam, et vocávit multos. Et misit servum suum hora cœnæ dícere
    invitátis, ut venírent, quia jam paráta sunt ómnia. Et cœpérunt simul omnes
    excusáre. Primus dixit ei: Villam emi, et necésse hábeo exíre et vidére
    illam: rogo te, habe me excusátum. Et alter dixit: Juga boum emi quinque et
    eo probáre illa: rogo te, habe me excusátum. Et álius dixit: Uxórem duxi, et
    ídeo non possum veníre. Et revérsus servus nuntiávit hæc dómino suo. Tunc
    irátus paterfamílias, dixit servo suo: Exi cito in pláteas et vicos
    civitátis: et páuperes ac débiles et cæcos et claudos íntroduc huc. Et ait
    servus: Dómine, factum est, ut imperásti, et adhuc locus est. Et ait dóminus
    servo: Exi in vias et sepes: et compélle intrare, ut impleátur domus mea.
    Dico autem vobis, quod nemo virórum illórum, qui vocáti sunt, gustábit cœnam
    meam."
offertorium:
  - "!Ps 6:5"
  - "Dómine, convértere, et éripe ánimam meam: salvum me fac propter
    misericórdiam tuam."
secreta:
  - "Oblátio nos, Dómine, tuo nómini dicánda puríficet: et de die in diem ad
    cœléstis vitæ tránsferat actiónem."
  - $Per Dominum.
commemoratio-secreta:
  - "!Pro Octava Ssmi Corporis Christi"
  - "Ecclésiæ tuæ, quǽsumus, Dómine, unitátis et pacis propítius dona concéde:
    quæ sub oblátis munéribus mýstice designántur."
  - $Per Dominum
communio:
  - "!Ps 12:6"
  - "Cantábo Dómino, qui bona tríbuit mihi: et psallam nómini Dómini altíssimi."
postcommunio:
  - "Sumptis munéribus sacris, quǽsumus, Dómine: ut cum frequentatióne mystérii,
    crescat nostræ salútis efféctus."
  - $Per Dominum
commemoratio-postcommunio:
  - "!Pro Octava Ssmi Corporis Christi"
  - "Fac nos, quǽsumus, Dómine, divinitátis tuæ sempitérna fruitióne repléri:
    quam pretiósi Córporis et Sánguinis tui temporális percéptio præfigúrat:"
  - $Qui vivis
