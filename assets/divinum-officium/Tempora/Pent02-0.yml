lectio1:
  - De libro primo Regum
  - "!1 Reg 4:1-3"
  - "1 Et factum est in diébus illis, convenérunt Philísthiim in pugnam: et
    egréssus est Israël óbviam Philísthiim in prǽlium, et castrametátus est
    juxta lápidem Adiutórii. Porro Philísthiim venérunt in Aphec,"
  - "2 et instruxérunt áciem contra Israël. Inito autem certámine, terga vertit
    Israël Philisthǽis: et cæsa sunt in illo certámine passim per agros, quasi
    quátuor míllia virórum."
  - "3 Et revérsus est pópulus ad castra: dixerúntque majóres natu de Israël:
    Quare percússit nos Dóminus hódie coram Philísthiim? afferámus ad nos de
    Silo arcam fœ́deris Dómini, et véniat in médium nostri, ut salvet nos de
    manu inimicórum nostrórum."
lectio2:
  - "!1 Reg 4:4-6"
  - "4 Misit ergo pópulus in Silo, et tulérunt inde arcam fœ́deris Dómini
    exercítuum sedéntis super chérubim: erántque duo fílii Heli cum arca
    fœ́deris Dei, Ophni et Phínees."
  - 5 Cumque venísset arca fœ́deris Dómini in castra, vociferátus est omnis
    Israël clamóre grandi, et persónuit terra.
  - "6 Et audiérunt Philísthiim vocem clamóris, dixerúntque: Quænam est hæc vox
    clamóris magni in castris Hebræórum? Et cognovérunt quod arca Dómini
    venísset in castra."
lectio3:
  - "!1 Reg 4:7-11"
  - "7 Timuerúntque Philísthiim, dicéntes: Venit Deus in castra. Et ingemuérunt,
    dicéntes:"
  - "8 Væ nobis: non enim fuit tanta exultátio heri et nudiustértius: væ nobis.
    Quis nos salvábit de manu deórum sublímium istórum? hi sunt dii, qui
    percussérunt Ægýptum omni plaga in desérto."
  - "9 Confortámini, et estóte viri, Philísthiim, ne serviátis Hebrǽis, sicut et
    illi serviérunt vobis: confortámini, et belláte."
  - "10 Pugnavérunt ergo Philísthiim, et cæsus est Israël, et fugit unusquísque
    in tabernáculum suum: et facta est plaga magna nimis, et cecidérunt de
    Israël trigínta míllia péditum."
  - "11 Et arca Dei capta est: duo quoque fílii Heli mórtui sunt, Ophni et
    Phínees."
lectio4:
  - Sermo sancti Joánnis Chrysostomi
  - "!Ex Hom. 60 ad pop. Antioch"
  - "Quóniam Verbum dicit: Hoc est corpus meum; et assentiámur et credámus et
    intellectuálibus ipsum óculis intueámur. Nihil enim sensíbile nobis Christus
    trádidit; sed sensibílibus quidem rebus, at ómnia intelligibília. Itidem et
    in baptísmate: per rem nempe sensíbilem, aquam, donum confértur;
    intelligíbile vero quod perfícitur, generátio et renovátio. Si enim
    incorpóreus esses, nuda et incorpórea tibi dedísset ipse dona; sed quóniam
    ánima córpori consérta est, in sensibílibus intelligibília tibi præbet. Quot
    nunc dicunt: Vellem ipsíus formam aspícere, figúram, vestiménta,
    calceaménta? Ecce eum vides, ipsum tangis, ipsum mandúcas. Et tu quidem
    vestiménta cupis vidére; ipse vero tibi concédit non tantum vidére, verum et
    manducáre, et tángere, et intra te súmere."
lectio5:
  - "Igitur accédat nemo cum náusea, nemo resolútus; omnes accénsi, omnes
    fervéntes et excitáti. Nam si Judǽi stantes, et calceaménta in pédibus
    habéntes, et báculos mánibus gestántes, agnum cum festinatióne comedébant;
    te multo magis opórtet esse solértem. Nam illi quidem in Palæstínam erant
    profectúri, et proptérea viatórum figúram habébant: tu vero debes in cælum
    migráre. Quaprópter in ómnibus opórtet te vigiláre; nec enim parva pœna
    propónitur indígne suméntibus. Cógita quantum advérsus proditórem
    indignáris, et contra eos qui illum crucifixérunt: ítaque consídera, ne tu
    quoque sis reus córporis et sánguinis Christi. Illi sanctíssimum corpus
    occidérunt, tu vero pollúta súscipis ánima, post tot benefícia. Neque enim
    illi satis fuit, hóminem fíeri, cólaphis cædi, et crucifígi; verum et
    semetípsum nobis commíscet; et non fide tantum, verum et ipsa re, nos suum
    éfficit corpus."
lectio6:
  - Quo non opórtet ígitur esse puriórem, tali fruéntem sacrifício? quo solári
    rádio non splendidiórem manum, carnem hanc dividéntem? os quod igni
    spiritáli replétur, linguam quæ treméndo nimis sánguine rubéscit? Cógita
    quali sis insignítus honóre, quali mensa fruáris. Quod Angeli vidéntes
    horréscunt, neque líbere audent intuéri propter emicántem inde splendórem;
    hoc nos páscimur, huic nos unímur, et facti sumus unum Christi corpus, et
    una caro. Quis loquétur poténtias Dómini, audítas fáciet omnes laudes ejus?
    Quis pastor oves próprio pascit cruóre? Et quid dico, pastor? Matres multæ
    sunt, quæ post partus dolóres, fílios áliis tradunt nutrícibus. Hoc autem
    ipse non est passus; sed ipse nos próprio sánguine pascit, et per ómnia nos
    sibi coagméntat.
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 14:16-24"
  - "In illo témpore: Dixit Jesus pharisǽis parábolam hanc: Homo quidam fecit
    cenam magnam, et vocávit multos. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 36 in Evangelia"
  - "Hoc distáre, fratres caríssimi, inter delícias córporis et cordis solet:
    quod corporáles delíciæ, cum non habéntur, grave in se desidérium accéndunt;
    cum vero ávide edúntur, comedéntem prótinus in fastídium per satietátem
    vertunt. At contra, spiritáles delíciæ, cum non habéntur, in fastídio sunt;
    cum vero habéntur, in desidério: tantóque a comedénte ámplius esuriúntur,
    quanto et ab esuriénte ámplius comedúntur. In illis appetítus placet,
    experiéntia dísplicet; in istis appetítus saturitátem, satúritas fastídium
    génerat: in istis autem appetítus saturitátem, satúritas appetítum parit."
lectio8:
  - "Augent enim spiritáles delíciæ desidérium in mente, dum sátiant: quia
    quanto magis eárum sapor percípitur, eo ámplius cognóscitur quod avídius
    amétur; et idcírco non hábitæ amári non possunt, quia eárum sapor ignorátur.
    Quis enim amáre váleat quod ignórat? Proínde Psalmísta nos ádmonet, dicens:
    Gustáte et vidéte, quóniam suávis est Dóminus. Ac si apérte dicat:
    Suavitátem ejus non cognóscitis, si hanc mínime gustátis; sed cibum vitæ ex
    paláto cordis tángite, ut probántes ejus dulcédinem, amáre valeátis. Has
    autem homo delícias tunc amísit, cum in paradíso peccávit; extra éxiit, cum
    os a cibo ætérnæ dulcédinis clausit."
responsory8:
  - R. Homo quidam fecit cœnam magnam, et misit servum suum hora cœnæ dícere
    invitátis ut venírent,
  - "* Quia paráta sunt ómnia."
  - V. Veníte, comédite panem meum, et bíbite vinum quod míscui vobis.
  - R. Quia paráta sunt ómnia.
  - "&Gloria"
  - R. Quia paráta sunt ómnia.
lectio9:
  - Unde nos quoque, nati in hujus peregrinatiónis ærúmna, huc fastidiósi jam
    vénimus, nescímus quid desideráre debeámus. Tantóque se ámplius fastídii
    nostri morbus exággerat, quanto se magis ab esu illíus dulcédinis ánimus
    elóngat; et eo jam intérnas delícias non áppetit, quo eas comédere, diu
    longéque desuévit. Fastídio ergo nostro tabéscimus, et longa inédiæ peste
    fatigámur. Et quia gustáre intus nólumus parátam dulcédinem, amámus foris
    míseri famem nostram.
  - "&teDeum"
