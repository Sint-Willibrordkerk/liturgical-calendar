lectio1:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 3:1-6"
  - Anno quintodécimo impérii Tibérii Cǽsaris, procuránte Póntio Piláto Judǽam.
    Et réliqua.
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 20 in Evangelia"
  - "Redemptóris nostri Præcúrsor, quo témpore prædicatiónis offícium accéperit,
    memoráto Románæ reipúblicæ príncipe, et Judǽæ régibus, designátur. Quia enim
    illum prædicáre veniébat, qui et ex Judǽa quosdam, et multos ex géntibus
    redemptúrus erat: per regem géntium et príncipes Judæórum prædicatiónis ejus
    témpora designántur.  Quia autem gentílitas colligénda erat, et Judǽa pro
    culpa perfídiæ dispergénda, ipsa quoque descríptio terréni principátus
    osténdit: quóniam et in Romána república unus præfuísse descríbitur, et in
    Judǽæ regno per quartam partem plúrimi principabántur."
responsory1:
  - "R. Egrediétur virga de radíce Jesse, et flos de radíce ejus ascéndet:"
  - "* Et erit justítia cíngulum lumbórum ejus, et fides cinctórium renum ejus."
  - "V. Et requiéscet super eum spíritus Dómini: spíritus sapiéntiæ, et
    intelléctus: spíritus consílii, et fortitúdinis."
  - R. Et erit justítia cíngulum lumbórum ejus, et fides cinctórium renum ejus.
lectio2:
  - "Voce étenim nostri Redemptóris dícitur: Omne regnum in seípsum divisum
    desolábitur. Liquet ergo, quod ad finem regni Judǽa pervénerat, quæ tot
    régibus divísa subjacébat. Apte quoque non solum quibus régibus, sed étiam
    quibus sacerdótibus actum sit, demonstrátur: et quia illum Joánnes Baptísta
    prædicáret, qui simul Rex et Sacérdos exsísteret, Lucas Evangelísta
    prædicatiónis ejus témpora per regnum et sacerdótium designávit."
responsory2:
  - "R. Radix Jesse, qui exsúrget judicáre gentes, in eum gentes sperábunt:"
  - "* Et erit nomen ejus benedíctum in sǽcula."
  - V. Super ipsum continébunt reges os suum, ipsum gentes deprecabúntur.
  - R. Et erit nomen ejus benedíctum in sǽcula.
lectio3:
  - "Et venit in omnem regiónem Jordánis, prǽdicans baptísmum pœniténtiæ in
    remissiónem peccatórum. Cunctis legéntibus liquet, quia Joánnes non solum
    baptísmum pœniténtiæ prædicávit, verum étiam quibúsdam dedit: sed tamen
    baptísmum suum in remissiónem peccatórum dare non pótuit. Remíssio étenim
    peccatórum in solo nobis baptísmo Christi tribúitur. Notándum ítaque, quod
    dícitur: Prǽdicans baptísmum pœniténtiæ in remissiónem peccatórum: quóniam
    baptísmum, quod peccáta sólveret, quia dare non póterat, prædicábat: ut
    sicut incarnátum Verbum Patris præcurrébat verbo prædicatiónis, ita
    baptísmum pœniténtiæ, quo peccáta solvúntur, præcúrreret suo baptísmate, quo
    peccáta solvi non possunt."
responsory3:
  - "R. Veni, Dómine, et noli tardáre: reláxa facínora plebi tuæ,"
  - "* Et révoca dispérsos in terram suam."
  - V. Excíta, Dómine, poténtiam tuam, et veni, ut salvos fácias nos.
  - R. Et révoca dispérsos in terram suam.
  - "&Gloria"
  - R. Et révoca dispérsos in terram suam.
rubrica-cisterciensis/ant-laudes:
  - "Roráte coeli désuper, * et nubes pluant Justum : aperiátur terra, et
    gérminet Salvatórem."
ant-2:
  - "Quómodo fiet istud, * Angele Dei, quóniam virum non cognósco? Audi, María
    Virgo: Spíritus Sanctus supervéniet in te, et virtus Altíssimi obumbrábit
    tibi."
rubrica-cisterciensis/ant-2:
  - Omnis vallis implébitur, * et omnis mons, et collis humiliábitur, et vidébit
    omnis caro salutáre Dei.
rubrica-cisterciensis/ant-prima:
  - "Consúrge, consúrge: * indúere fortitúdinem bráchium Dómini."
rubrica-cisterciensis/ant-tertia:
  - "Gaudéte in Dómino semper: * íterum dico gaudéte: Dóminus enim prope est,
    nihil sollíciti sitis."
rubrica-cisterciensis/ant-sexta:
  - "Exspectétur sicut plúvia * elóquium Dómini: et descéndat, sicut ros, super
    nos Deus noster."
rubrica-cisterciensis/ant-nona:
  - Dabit ei Dóminus * sedem David patris ejus, et regnábit in ætérnum.
