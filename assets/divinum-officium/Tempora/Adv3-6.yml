introitus:
  - "!Ps 79:4; 79:2"
  - "v. Veni, et osténde nobis fáciem tuam, Dómine, qui sedes super Chérubim: et
    salvi érimus."
  - "!Ps 79:2"
  - "Qui regis Israël, inténde: qui dedúcis, velut ovem, Joseph."
  - "&Gloria"
  - "v. Veni, et osténde nobis fáciem tuam, Dómine, qui sedes super Chérubim: et
    salvi érimus."
lectiol1:
  - Léctio Isaíæ Prophétæ
  - "!Isa 19:20-22"
  - "In diebus illis: Clamábunt ad Dóminum a facie tribulántis, et mittet eis
    salvatórem et propugnatórem, qui líberet eos. Et cognoscétur Dóminus ab
    Ægýpto, et cognóscent Ægýptii Dóminum in die illa: et colent eum in hóstiis
    et in munéribus: et vota vovébunt Dómino, et solvent. Et percútiet Dóminus
    Ægýptum plaga, et sanábit eam: et revertántur ad Dóminum, et placábitur eis,
    et sanábit eos Dóminus, Deus noster."
  - $Deo gratias
gradualel1:
  - "!Ps 18:7; 18:2"
  - "A summo cœlo egréssio ejus: et occúrsus ejus usque ad summum ejus."
  - "V. Cœli enárrant glóriam Dei: et opera mánuum ejus annúntiat firmaméntum."
oratiol1:
  - "Concéde, quǽsumus, omnípotens Deus: ut, qui sub peccáti jugo et vetústa
    servitúte deprímimur; exspectáta unigéniti Fílii tui nova nativitáte
    liberémur:"
  - $Qui tecum
lectiol2:
  - Léctio Isaíæ Prophétæ
  - "!Isa 35:1-7"
  - "Hæc dicit Dóminus: Lætábitur desérta et ínvia, ei exsultábit solitúdo, et
    florébit quasi lílium. Gérminans germinábit, et exsultábit lætabúnda et
    laudans: glória Líbani data est ei: decor Carméli et Saron, ipsi vidébunt
    glóriam Dómini, et decórem Dei nostri. Confortáte manus dissolútas, et génua
    debília roboráte. Dícite pusillánimis: Confortámini, et nolíte timére: ecce,
    Deus vester ultiónem addúcet retributiónis: Deus ipse véniet, et salvábit
    vos. Tunc aperiéntur óculi cæcórum, et aures surdórum patébunt. Tunc sáliet
    sicut cervus claudus, et apérta erit lingua mutórum: quia scissæ sunt in
    desérto aquæ, et torréntes in solitúdine. Et quæ erat árida, erit in
    stagnum, et sítiens in fontes aquárum: ait Dóminus omnípotens."
  - $Deo gratias
gradualel2:
  - "!Ps 18:6; 18:7"
  - "In sole pósuit tabernáculum suum: et ipse tamquam sponsus procédens de
    thálamo suo."
  - "V. A summo cœlo egréssio ejus: et occúrsus ejus usque ad summum ejus."
oratiol2:
  - "Indígnos nos, quǽsumus, Dómine, fámulos tuos, quos actiónis própriæ culpa
    contrístat, unigéniti Fílii tui advéntu lætífica:"
  - $Qui tecum
lectiol3:
  - Léctio Isaíæ Prophétæ
  - "!Is 40:9-11"
  - "Hæc dicit Dóminus: Super montem excélsum ascénde tu, qui evangelízas Sion:
    exálta in fortitúdine vocem tuam, qui evangelízas Jerúsalem: exálta, noli
    timére. Dic civitátibus Juda: Ecce, Deus vester: ecce, Dóminus Deus in
    fortitúdine véniet, et bráchium ejus dominábitur: ecce, merces ejus cum eo,
    et opus illíus coram illo. Sicut pastor gregem suum pascet: in bráchio suo
    congregábit agnos, et in sinu suo levábit, Dóminus, Deus noster."
  - $Deo gratias
gradualel3:
  - "!Ps 79:20; 79:3"
  - "Dómine, Deus virtútum, convérte nos: et osténde fáciem tuam, et salvi
    érimus."
  - V. Excita, Dómine, poténtiam tuam, et veni, ut salvos fácias nos.
oratiol3:
  - "Prǽsta, quǽsumus, omnípotens Deus: ut Fílii tui ventúra sollémnitas et
    præséntis nobis vitæ remédia cónferat, et prǽmia ætérna concédat."
  - $Per eundem
lectiol4:
  - Léctio Isaíæ Prophétæ
  - "!Is 45:1-8."
  - "Hæc dicit Dóminus christo meo Cyro, cujus apprehéndi déxteram, ut subjíciam
    ante fáciem ejus gentes, et dorsa regum vertam, et apériam coram eo jánuas,
    et portæ non claudéntur. Ego ante te ibo: et gloriósos terræ humiliábo:
    portas ǽreas cónteram, et vectes férreos confríngam. Et dabo tibi thesáuros
    abscónditos et arcána secretórum: ut scias, quia ego Dóminus, qui voco nomen
    tuum, Deus Israël. Propter servum meum Jacob, et Israël electum meum, et
    vocávi te nómine tuo: assimilávi te, et non cognovísti me. Ego Dóminus, et
    non est ámplius: extra me non est Deus: accínxi te, et non cognovísti me: ut
    sciant hi, qui ab ortu solis, et qui ab occidénte, quóniam absque me non
    est. Ego Dóminus, et non est alter, formans lucem et creans ténebras,
    fáciens pacem et creans malum: ego Dóminus faciens omnia hæc. Roráte, cœli,
    désuper, et nubes pluant justum: aperiátur terra, et gérminet Salvatórem: et
    justítia oriátur simul: ego Dóminus creávi eum."
  - $Deo gratias
gradualel4:
  - "!Ps 79:3,; 79:2; 79:3"
  - Excita, Dómine, poténtiam tuam, et veni, ut salvos fácias nos.
  - "V. Qui regis Israël, inténde: qui dedúcis, velut ovem, Joseph: qui sedes
    super Chérubim, appáre coram Ephraim, Bénjamin, et Manásse."
oratiol4:
  - "Preces pópuli tui, quǽsumus, Dómine, cleménter exáudi: ut, qui juste pro
    peccátis nostris afflígimur, pietátis tuæ visitatióne consolémur:"
  - $Qui vivis
lectiol5:
  - "@Tempora/093-6"
oratiol5:
  - "@Tempora/093-6"
oratio:
  - "Deus, qui cónspicis, quia ex nostra pravitáte afflígimur: concéde
    propítius; ut ex tua visitatióne consolémur:"
  - $Qui vivis
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Thessalonicénses
  - "!2 Thess 2:1-8"
  - "Fratres: Rogámus vos per advéntum Dómini nostri Jesu Christi, et nostræ
    congregatiónis in ipsum: ut non cito moveámini a vestro sensu, neque
    terreámini, neque per spíritum, neque per sermónem, neque per epístolam
    tamquam per nos missam, quasi instet dies Dómini. Ne quis vos sedúcat ullo
    modo: quóniam nisi vénerit discéssio primum, et revelátus fuerit homo
    peccáti, fílius perditiónis, qui adversátur, et extóllitur supra omne, quod
    dícitur Deus aut quod cólitur, ita ut in templo Dei sédeat osténdens se,
    tamquam sit Deus. Non retinétis, quod, cum adhuc essem apud vos, hæc dicébam
    vobis? Et nunc quid detíneat, scitis, ut revelétur in suo témpore. Nam
    mystérium jam operátur iniquitátis: tantum ut, qui tenet nunc, téneat, donec
    de médio fiat. Et tunc revelábitur ille iníquus, quem Dóminus Jesus
    interfíciet spíritu oris sui, et déstruet illustratióne advéntus sui."
graduale:
  - "!Ps:79:2-3"
  - "Qui regis Israël, inténde: qui dedúcis, velut ovem, Joseph."
  - V. Qui sedes super Chérubim, appáre coram Ephraim, Bénjamin, et Manásse.
  - "V. Excita, Dómine, poténtiam tuam, et veni: ut salvos fácias nos."
evangelium:
  - Sequéntia ++ sancti Evangélii secundum Lucam
  - "!Luc 3:1-6"
  - "Anno quintodécimo impérii Tibérii Cǽsaris, procuránte Póntio Piláto Judǽam,
    tetrárcha autem Galilǽæ Heróde, Philíppo autem fratre ejus tetrárcha Iturǽæ
    et Trachonítidis regionis, et Lysánia Abilínæ tetrárcha, sub princípibus
    sacerdotum Anna et Cáipha: factum est verbum Domini super Joannem, Zacharíæ
    filium, in deserto. Et venit in omnem regiónem Jordánis, prǽdicans baptísmum
    pæniténtiæ in remissiónem peccatórum, sicut scriptum est in libro sermónum
    Isaíæ Prophétæ: Vox clamántis in desérto: Paráte viam Dómini: rectas fácite
    sémitas ejus: omnis vallis implébitur: et omnis mons et collis humiliábitur:
    et erunt prava in dirécta, et áspera in vias planas: et vidébit omnis caro
    salutáre Dei."
offertorium:
  - "!Zach 9:9"
  - "Exsúlta satis, fília Sion, prǽdica, fília Jerúsalem: ecce, Rex tuus venit
    tibi sanctus et Salvátor."
secreta:
  - "Sacrifíciis præséntibus, quǽsumus, Dómine, placátus inténde: ut et
    devotióni nostræ profíciant et salúti."
  - $Per Dominum
communio:
  - "!Ps 18:6-7"
  - "Exsultávit ut gigas ad curréndam viam: a summo cœlo egréssio ejus, et
    occúrsus ejus usque ad summum ejus."
postcommunio:
  - "Quǽsumus, Dómine, Deus noster: ut sacrosáncta mystéria, quæ pro
    reparatiónis nostræ munímine contulísti; et præsens nobis remédium esse
    fácias et futúrum."
  - $Per Dominum
