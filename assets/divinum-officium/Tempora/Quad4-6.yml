introitus:
  - "!Isa 55:1"
  - "v. Sitiéntes, veníte ad aquas, dicit Dóminus: et qui non habétis prétium,
    veníte et bíbite cum lætítia."
  - "!Ps 77:1."
  - "Atténdite, pópule meus, legem meam: inclináte aurem vestram in verba oris
    mei."
  - "&Gloria"
  - "v. Sitiéntes, veníte ad aquas, dicit Dóminus: et qui non habétis prétium,
    veníte et bíbite cum lætítia."
oratio:
  - "Fiat, Dómine, quǽsumus, per grátiam tuam fructuósus nostræ devotiónis
    afféctus: quia tunc nobis próderunt suscépta jejúnia, si tuæ sint plácita
    pietáti."
  - $Per Dominum
lectio:
  - Léctio Isaíæ Prophétæ.
  - "!Isa 49:8-15"
  - "Hæc dicit Dóminus: In témpore plácito exaudívi te, et in die salútis
    auxiliátus sum tui: et servávi te, et dedi te in fœdus pópuli, ut suscitáres
    terram, et possidéres hereditátes dissipátas: ut díceres his, qui vincti
    sunt: Exíte: et his, qui in ténebris: Revelámini. Super vias pascéntur, et
    in ómnibus planis páscua eórum. Non esúrient neque sítient, et non percútiet
    eos æstus et sol: quia miserátor eórum reget eos, et ad fontes aquárum
    potábit eos. Et ponam omnes montes meos in viam, et sémitæ meæ exaltabúntur.
    Ecce, isti de longe vénient, et ecce illi ab aquilóne et mari, et isti de
    terra austráli. Laudáte, cœli, et exsúlta, terra, jubiláte, montes, laudem:
    quia consolátus est Dóminus pópulum suum, et páuperum suórum miserébitur. Et
    dixit Sion: Derelíquit me Dóminus, et Dóminus oblítus est mei. Numquid
    oblivísci potest múlier infántem suum, ut non misereátur fílio uteri sui? et
    si illa oblíta fúerit, ego tamen non oblivíscar tui, dicit Dóminus
    omnípotens."
graduale:
  - "!Ps 9:14, 1-2"
  - "Tibi, Dómine, derelíctus est pauper: pupíllo tu eris adjútor."
  - V. Ut quid, Dómine, recessísti longe, déspicis in opportunitátibus, in
    tribulatióne? dum supérbit ímpius, incénditur pauper.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem.
  - "!Joann 8:12-20"
  - "In illo témpore: Locútus est Jesus turbis Judæórum, dicens: Ego sum lux
    mundi: qui séquitur me, non ámbulat in ténebris, sed habébit lumen vitæ.
    Dixérunt ergo ei pharisǽi: Tu de te ipso testimónium pérhibes: testimónium
    tuum non est verum. Respóndit Jesus et dixit eis: Et si ego testimónium
    perhíbeo de meípso, verum est testimónium meum: quia scio, unde veni et quo
    vado: vos autem nescítis, unde vénio aut quo vado. Vos secúndum carnem
    judicátis: ego non júdico quemquam: et si júdico ego, judícium meum verum
    est, quia solus non sum: sed ego et, qui misit me, Pater. Et in lege vestra
    scriptum est, quia duórum hóminum testimónium verum est. Ego sum, qui
    testimónium perhíbeo de meípso: et testimónium pérhibet de me, qui misit me,
    Pater. Dicébant ergo ei: Ubi est Pater tuus? Respóndit Jesus: Neque me
    scitis neque Patrem meum: si me scirétis, fórsitan et Patrem meum scirétis.
    Hæc verba locútus est Jesus in gazophylácio, docens in templo: et nemo
    apprehéndit eum, quia necdum vénerat hora ejus."
offertorium:
  - "!Ps 17:3"
  - "Factus est Dóminus firmaméntum meum, et refúgium meum, et liberátor meus:
    et sperábo in eum."
secreta:
  - "Oblatiónibus nostris, quǽsumus, Dómine, placáre suscéptis: et ad te nostras
    étiam rebélles compélle propítius voluntátes."
  - $Per Dominum
communio:
  - "!Ps 22:1-2"
  - "Dóminus regit me, et nihil mihi déerit: in loco páscuæ ibi me collocávit:
    super aquam refectiónis educávit me."
postcommunio:
  - "Tua nos, quǽsumus, Dómine, sancta puríficent: et operatióne sua tibi
    plácitos esse perfíciant."
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Deus, qui sperántibus in te miseréri pótius éligis quam irásci: da nobis
    digne flere mala, quæ fécimus; ut tuæ consolatiónis grátiam inveníre
    mereámur."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 8:12-20"
  - "In illo témpore: Locútus est Jesus turbis Judæórum, dicens: Ego sum lux
    mundi: qui séquitur me, non ámbulat in ténebris, sed habébit lumen vitæ. Et
    réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tract. 34 in Joannem, post init."
  - "Quod ait Dóminus: Ego sum lux mundi: clarum puto esse eis, qui habent
    óculos, unde hujus lucis partícipes fiant: qui autem non habent óculos, nisi
    in sola carne, mirántur quod dictum est a Dómino Jesu Christo: Ego sum lux
    mundi. Et forte non desit qui dicat apud semetípsum: Numquid forte Dóminus
    Christus est sol iste, qui ortu et occásu péragit diem? Non enim defuérunt
    hærétici, qui ista sensérunt. Manichǽi solem istum óculis cárneis visíbilem,
    expósitum et públicum non tantum homínibus, sed étiam pecóribus ad vidéndum,
    Christum Dóminum esse putavérunt."
responsory1:
  - "@Tempora/Quad4-0:Responsory7"
lectio2:
  - "Sed cathólicæ Ecclésiæ recta fides ímprobat tale comméntum, et diabólicam
    doctrínam esse cognóscit: nec solum agnóscit credéndo, sed in quibus potest
    convíncit étiam disputándo. Improbémus ítaque hujúsmodi errórem, quem sancta
    ab inítio anathematizávit Ecclésia. Non arbitrémur Dóminum Jesum Christum
    hunc esse solem, quem vidémus oríri ab Oriénte, occídere in Occidénte: cujus
    cúrsui nox succédit, cujus rádii nube obumbrántur: qui certa de loco in
    locum motióne cómmigrat. Non est hoc Dóminus Christus. Non est Dóminus
    Christus sol factus, sed per quem sol factus est. Omnia enim per ipsum facta
    sunt, et sine ipso factum est nihil."
responsory2:
  - "@Tempora/Quad4-0:Responsory8"
lectio3:
  - "Est ergo lux, quæ fecit hanc lucem. Hanc amémus, hanc intellégere cupiámus,
    ipsam sitíamus, ut ad ipsam duce ipsa aliquándo veniámus: et in illa ita
    vivámus, ut nunquam omníno moriámur. Ista enim lux est, de qua prophetía
    olim præmíssa ita in Psalmo cécinit: Quóniam apud te est fons vitæ, et in
    lúmine tuo vidébimus lumen. Advértite quid de tali luce antíquus sanctórum
    hóminum Dei sermo præmíserit. Hómines, inquit, et juménta salvos fácies,
    Dómine: sicut multiplicáta est misericórdia tua, Deus."
responsory3:
  - "@Tempora/Quad4-0:Responsory9"
