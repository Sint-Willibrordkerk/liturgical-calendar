rubrica-1955-aut-rubrica-1960/prelude-matutinum:
  - "!Cum solemnis vigiliæ paschalis celebratio locum obtineat officii nocturni
    dominicæ Resurrectionis, Matutino ejusdem dominicæ Resurrectionis omisso,
    statim inter Missarum vigiliæ solemnia, post communionem, cantatur Laudes.
    Officium dominicæ Resurrectionis prosequitur deínde cum Prima."
  - _
  - "!Qui vero solemni vigiliæ paschali non interfuerunt, tenentur dicere
    Matutinum et Laudes dominicæ Resurrectionis."
