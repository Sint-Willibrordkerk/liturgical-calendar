lectio1:
  - Léctio sancti Evangélii secúndum Marcum
  - "!Marc 16:1-7"
  - "In illo témpore: María Magdaléne, et María Jacóbi, et Salóme emérunt
    arómata, ut veniéntes úngerent Jesum. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 21 in Evangelia"
  - "Audístis, fratres caríssimi, quod sanctæ mulíeres, quæ Dóminum fúerant
    secútæ, cum aromátibus ad monuméntum venérunt, et ei, quem vivéntem
    diléxerant, étiam mórtuo, stúdio humanitátis obsequúntur. Sed res gesta
    áliquid in sancta Ecclésia signat geréndum. Sic quippe necésse est ut
    audiámus quæ facta sunt, quátenus cogitémus étiam quæ nobis sint ex eórum
    imitatióne faciénda. Et nos ergo in eum, qui est mórtuus, credéntes, si
    odóre virtútum reférti, cum opinióne bonórum óperum Dóminum quǽrimus, ad
    monuméntum profécto illíus cum aromátibus venímus. Illæ autem mulíeres
    Angelos vident, quæ cum aromátibus venérunt: quia vidélicet illæ mentes
    supérnos cives aspíciunt, quæ cum virtútum odóribus ad Dóminum per sancta
    desidéria proficiscúntur."
responsory1:
  - "R. Angelus Dómini descéndit de cælo, et accédens revólvit lápidem, et super
    eum sedit, et dixit muliéribus:"
  - "* Nolíte timére: scio enim quia crucifíxum quǽritis: jam surréxit: veníte,
    et vidéte locum, ubi pósitus erat Dóminus, allelúja."
  - "V. Et introëúntes in monuméntum, vidérunt júvenem sedéntem in dextris,
    coopértum stola cándida, et obstupuérunt: qui dixit illis."
  - "R. Nolíte timére: scio enim quia crucifíxum quǽritis: jam surréxit: veníte,
    et vidéte locum, ubi pósitus erat Dóminus, allelúja."
  - "&Gloria"
  - "R. Angelus Dómini descéndit de cælo, et accédens revólvit lápidem, et super
    eum sedit, et dixit muliéribus: * Nolíte timére: scio enim quia crucifíxum
    quǽritis: jam surréxit: veníte, et vidéte locum, ubi pósitus erat Dóminus,
    allelúja."
lectio2:
  - "Notándum vero nobis est, quidnam sit, quod in dextris sedére Angelus
    cérnitur. Quid namque per sinístram, nisi vita præsens: quid vero per
    déxteram, nisi perpétua vita designátur? Unde in Cánticis canticórum
    scriptum est: Læva ejus sub cápite meo, et déxtera illíus amplexábitur me.
    Quia ergo Redémptor noster jam præséntis vitæ corruptiónem transíerat, recte
    Angelus qui nuntiáre perénnem ejus vitam vénerat, in déxtera sedébat. Qui
    stola cándida coopértus appáruit: quia festivitátis nostræ gáudia nuntiávit.
    Candor étenim vestis, splendórem nostræ denúntiat solemnitátis. Nostræ
    dicámus, an suæ? Sed ut fateámur vérius, et suæ dicámus, et nostræ. Illa
    quippe Redemptóris nostri resurréctio et nostra festívitas fuit, quia nos ad
    immortalitátem redúxit: et Angelórum festívitas éxstitit, quia nos revocándo
    ad cæléstia, eórum númerum implévit."
responsory2:
  - R. Cum transísset sábbatum, María Magdaléne, et María Jacóbi, et Salóme
    emérunt arómata,
  - "* Ut veniéntes úngerent Jesum, allelúja, allelúja."
  - V. Et valde mane una sabbatórum, véniunt ad monuméntum, orto jam sole.
  - R. Ut veniéntes úngerent Jesum, allelúja, allelúja.
  - "&Gloria"
  - R. Ut veniéntes úngerent Jesum, allelúja, allelúja.
lectio3:
  - "In sua ergo ac nostra festivitáte Angelus in albis véstibus appáruit: quia
    dum nos per resurrectiónem Domínicam ad supérna redúcimur, cæléstis pátriæ
    damna reparántur. Sed quid adveniéntes féminas affátur, audiámus: Nolíte
    expavéscere. Ac si apérte dicat, Páveant illi, qui non amant advéntum
    supernórum cívium: pertiméscant, qui carnálibus desidériis pressi, ad eórum
    se societátem pertíngere posse despérant. Vos autem, cur pertiméscitis, quæ
    vestros concíves vidétis? Unde et Matthǽus Angelum apparuísse descríbens,
    ait: Erat aspéctus ejus sicut fulgur, et vestiménta ejus sicut nix. In
    fúlgure étenim terror timóris est, in nive autem blandiméntum candóris."
  - "&teDeum"
