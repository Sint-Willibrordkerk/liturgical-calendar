evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Marcum.
  - "!Marc 16:1-7."
  - "In illo témpore: María Magdaléne et María Jacóbi et Salóme emérunt arómata,
    ut veniéntes úngerent Jesum. Et valde mane una sabbatórum, véniunt ad
    monuméntum, orto jam sole. Et dicébant ad ínvicem: Quis revólvet nobis
    lápidem ab óstio monuménti? Et respiciéntes vidérunt revolútum lápidem. Erat
    quippe magnus valde. Et introëúntes in monuméntum vidérunt júvenem sedéntem
    in dextris, coopértum stola cándida, et obstupuérunt. Qui dicit illis:
    Nolíte expavéscere: Jesum quǽritis Nazarénum, crucifíxum: surréxit, non est
    hic, ecce locus, ubi posuérunt eum. Sed ite, dícite discípulis ejus et
    Petro, quia præcédit vos in Galilǽam: ibi eum vidébitis, sicut dixit vobis."
offertorium:
  - "!Ps. 75:9-10."
  - Terra trémuit, et quiévit, dum resúrgeret in judício Deus, allelúja.
secreta:
  - "Súscipe, quǽsumus, Dómine, preces pópuli tui cum oblatiónibus hostiárum:
    ut, Paschálibus initiáta mystériis, ad æternitátis nobis medélam, te
    operánte, profíciant."
  - $Per Dominum
