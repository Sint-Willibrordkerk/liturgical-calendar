introitus:
  - "!Ps 83:10-11"
  - "v. Protéctor noster, áspice, Deus, et réspice in fáciem Christi tui: quia
    mélior est dies una in átriis tuis super mília."
  - "!Ps 83:2-3"
  - V. Quam dilécta tabernácula tua, Dómine virtútum! Concupíscit, et déficit
    ánima mea in átria Dómini.
  - "&Gloria"
  - "v. Protéctor noster, áspice, Deus, et réspice in fáciem Christi tui: quia
    mélior est dies una in átriis tuis super mília."
oratio:
  - "Custódi, Dómine, quǽsumus, Ecclésiam tuam propitiatióne perpétua: et quia
    sine te lábitur humána mortálitas; tuis semper auxíliis et abstrahátur a
    nóxiis et ad salutária dirigátur."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Gálatas.
  - "!Gal 5:16-24"
  - "Fratres: Spíritu ambuláte, et desidéria carnis non perficiétis. Caro enim
    concupíscit advérsus spíritum, spíritus autem advérsus carnem: hæc enim sibi
    ínvicem adversántur, ut non quæcúmque vultis, illa faciátis. Quod si spíritu
    ducímini, non estis sub lege. Manifésta sunt autem ópera carnis, quæ sunt
    fornicátio, immundítia, impudicítia, luxúria, idolórum sérvitus, venefícia,
    inimicítiæ, contentiónes, æmulatiónes, iræ, rixæ, dissensiónes, sectæ,
    invídiæ, homicídia, ebrietátes, comessatiónes, et his simília: quæ prædíco
    vobis, sicut prædíxi: quóniam, qui talia agunt, regnum Dei non consequántur.
    Fructus autem Spíritus est: cáritas, gáudium, pax, patiéntia, benígnitas,
    bónitas, longanímitas, mansuetúdo, fides, modéstia, continéntia, cástitas.
    Advérsus hujúsmodi non est lex. Qui autem sunt Christi, carnem suam
    crucifixérunt cum vítiis et concupiscéntiis."
graduale:
  - "!Ps 117:8-9"
  - Bonum est confidére in Dómino, quam confidére in hómine.
  - V. Bonum est speráre in Dómino, quam speráre in princípibus. Allelúja,
    allelúja.
  - "!Ps 94:1."
  - Veníte, exsultémus Dómino, jubilémus Deo, salutári nostro. Allelúja.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum
  - "!Matt 6:24-33"
  - "In illo témpore: Dixit Jesus discípulis suis: Nemo potest duóbus dóminis
    servíre: aut enim unum ódio habébit, et álterum díliget: aut unum
    sustinébit, et álterum contémnet. Non potéstis Deo servíre et mammónæ. Ideo
    dico vobis, ne sollíciti sitis ánimæ vestræ, quid manducétis, neque córpori
    vestro, quid induámini. Nonne ánima plus est quam esca: et corpus plus quam
    vestiméntum? Respícite volatília cœli, quóniam non serunt neque metunt neque
    cóngregant in hórrea: et Pater vester cœléstis pascit illa. Nonne vos magis
    pluris estis illis? Quis autem vestrum cógitans potest adjícere ad statúram
    suam cúbitum unum? Et de vestiménto quid sollíciti estis? Consideráte lília
    agri, quómodo crescunt: non labórant neque nent. Dico autem vobis, quóniam
    nec Sálomon in omni glória sua coopértus est sicut unum ex istis. Si autem
    fænum agri, quod hódie est et cras in clíbanum míttitur, Deus sic vestit:
    quanto magis vos módicæ fídei? Nolíte ergo sollíciti esse, dicéntes: Quid
    manducábimus aut quid bibémus aut quo operiémur? Hæc enim ómnia gentes
    inquírunt. Scit enim Pater vester, quia his ómnibus indigétis. Quǽrite ergo
    primum regnum Dei et justítiam ejus: et hæc ómnia adjiciéntur vobis."
offertorium:
  - "!Ps 33:8-9"
  - "Immíttet Angelus Dómini in circúitu timéntium eum, et erípiet eos: gustáte
    et vidéte, quóniam suávis est Dóminus."
secreta:
  - Concéde nobis, Dómine, quǽsumus, ut hæc hóstia salutáris et nostrórum fiat
    purgátio delictórum, et tuæ propitiátio potestátis.
  - $Per Dominum
communio:
  - "!Matt 6:33"
  - Primum quǽrite regnum Dei, et ómnia adjiciéntur vobis, dicit Dóminus.
postcommunio:
  - "Puríficent semper et múniant tua sacraménta nos, Deus: et ad perpétuæ
    ducant salvatiónis efféctum."
  - $Per Dominum
lectio7:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 6:24-33"
  - "In illo témpore: Dixit Jesus discípulis suis: Nemo potest duóbus dóminis
    servíre. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Lib. 2 de Sermone Dómini in monte, cap. 14"
  - "Nemo potest duóbus dóminis servíre. Ad hanc ipsam intentiónem referéndum
    est quod consequénter expónit, dicens: Aut enim unum ódio habébit, et
    álterum díliget; aut álterum patiétur, et álterum contémnet. Quæ verba
    diligénter consideránda sunt: nam, qui sint duo dómini, deínceps osténdit,
    cum dicit: Non potéstis Deo servíre, et mammónæ. Mammóna apud Hebrǽos
    divítiæ appellári dicúntur. Cóngruit et Púnicum nomen; nam lucrum Púnice
    mammon dícitur."
lectio8:
  - Sed qui servit mammónæ, illi útique servit, qui rebus istis terrénis mérito
    suæ perversitátis præpósitus, magistrátus hujus sǽculi a Dómino dícitur. Aut
    enim unum ódio habébit homo, et álterum díliget, id est, Deum; aut álterum
    patiétur, et álterum contémnet. Patiétur enim durum et perniciósum dóminum,
    quisquis servit mammónæ; sua enim cupiditáte implicátus, súbditur diábolo,
    et non eum díligit. Quis enim est qui díligat diábolum? sed tamen pátitur.
responsory8:
  - "@Tempora/Pent01-0:Responsory8"
lectio9:
  - "Ideo, inquit, dico vobis, non habére sollicitúdinem ánimæ vestræ quid
    edátis, neque córpori vestro quid induátis; ne forte, quamvis jam supérflua
    non quærántur, propter ipsa necessária cor duplicétur, et ad ipsa
    conquirénda, nostra detorqueátur inténtio, cum áliquid quasi misericórditer
    operámur: id est, ut cum consúlere alícui vidéri vólumus, nostrum
    emoluméntum ibi pótius, quam illíus utilitátem attendámus; et ídeo nobis non
    videámur peccáre, quia non supérflua, sed necessária sunt, quæ cónsequi
    vólumus."
  - "&teDeum"
