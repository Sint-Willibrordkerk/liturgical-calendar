oratio:
  - "Exáudi nos, omnípotens et miséricors Deus: et continéntiæ salutáris
    propítius nobis dona concéde."
  - $Per Dominum
lectio:
  - Léctio libri Regum.
  - "!4 Reg 4:1-7"
  - "In diébus illis: Múlier quædam clamábat ad Eliséum Prophétam, dicens:
    Servus tuus vir meus mórtuus est, et tu nosti, quia servus tuus fuit timens
    Dóminum: et ecce, créditor venit, ut tollat duos fílios meos ad serviéndum
    sibi. Cui dixit Eliséus: Quid vis, ut fáciam tibi? Dic mihi, quid habes in
    domo tua? At illa respóndit: Non hábeo ancílla tua quidquam in domo mea,
    nisi parum ólei, quo ungar. Cui ait: Vade, pete mútuo ab ómnibus vicínis
    tuis vasa vácua non pauca. Et ingrédere, et claude óstium tuum, cum
    intrínsecus fúeris tu et fílii tui: et mitte inde in ómnia vasa hæc: et cum
    plena fúerint, tolles. Ivit ítaque múlier, et clausit óstium super se et
    super fílios suos: illi offerébant vasa, et illa infundébat. Cumque plena
    fuíssent vasa, dixit ad fílium suum: Affer mihi adhuc vas. Et ille
    respóndit: Non hábeo. Stetítque óleum. Venit autem illa, et indicávit hómini
    Dei. Et ille: Vade, inquit, vende oleum, et redde creditóri tuo: tu autem et
    fílii tui vívite de réliquo."
graduale:
  - "!Ps 18:13-14"
  - "Ab occúltis meis munda me, Dómine: et ab aliénis parce servo tuo."
  - "V. Si mei non fúerint domináti, tunc immaculátus ero: et emundábor a
    delícto máximo."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Matthǽum.
  - "!Matt 18:15-22"
  - "In illo témpore: Dixit Jesus discípulis suis: Si peccáverit in te frater
    tuus, vade, et córripe eum inter te et ipsum solum. Si te audíerit, lucrátus
    eris fratrem tuum. Si autem te non audíerit, ádhibe tecum adhuc unum vel
    duos, ut in ore duórum vel trium téstium stet omne verbum. Quod si non
    audíerit eos: dic ecclésiæ. Si autem ecclésiam non audíerit: sit tibi sicut
    éthnicus et publicánus. Amen, dico vobis, quæcúmque alligavéritis super
    terram, erunt ligáta et in cœlo: et quæcúmque solvéritis super terram, erunt
    solúta et in cœlo. Iterum dico vobis, quia si duo ex vobis consénserint
    super terram, de omni re quamcúmque petíerint, fiet illis a Patre meo, qui
    in cœlis est. Ubi enim sunt duo vel tres congregáti in nómine meo, ibi sum
    in médio eórum. Tunc accédens Petrus ad eum, dixit: Dómine, quóties peccábit
    in me frater meus, et dimíttam ei? usque sépties? Dicit illi Jesus: Non dico
    tibi usque sépties, sed usque septuágies sépties."
offertorium:
  - "!Ps 117:16, 17"
  - "Déxtera Dómini fecit virtútem, déxtera Dómini exaltávit me: non móriar, sed
    vivam, et narrábo ópera Dómini."
secreta:
  - "Per hæc véniat, quǽsumus, Dómine, sacraménta nostræ redemptiónis efféctus:
    qui nos et ab humánis rétrahat semper excéssibus, et ad salutária dona
    perdúcat."
  - $Per Dominum
communio:
  - "!Ps 14:1-2"
  - Dómine, quis habitábit in tabernáculo tuo? aut quis requiéscet in monte
    sancto tuo? Qui ingréditur sine mácula, et operátur justítiam.
postcommunio:
  - "Sacris, Dómine, mystériis expiáti: et véniam, quǽsumus, consequámur et
    grátiam."
  - $Per Dominum
super-populum:
  - "!Oratio super populum"
  - v. Orémus.
  - v. Humiliáte cápita vestra Deo.
  - "v. Tua nos, Dómine, protectióne defénde: et ab omni semper iniquitáte
    custódi."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Matthǽum
  - "!Matt 18:15-22"
  - "In illo témpore: Dixit Jesus discípulis suis: Si peccáverit in te frater
    tuus, vade, et córripe eum inter te et ipsum solum. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Sermo 16 de Verbis Domini, tomus 10, post initium"
  - "Quare illum córripis? Quia tu doles, quod peccáverit in te? Absit. Si amóre
    tui id facis, nihil facis: si amóre illíus facis, óptime facis. Dénique in
    ipsis verbis atténde, cujus amóre id fácere débeas, utrum tui, an illíus. Si
    te audíerit, inquit, lucrátus es fratrem tuum. Ergo propter illum fac, ut
    lucréris illum. Sic faciéndo lucráris: nisi fecísses, períerat. Quid est
    ergo, quod pleríque hómines ista peccáta contémnunt, et dicunt: Quid magnum
    feci? In hóminem peccávi. Noli contémnere: in hóminem peccásti."
responsory1:
  - "R. Nuntiavérunt Jacob dicéntes: Joseph fílius tuus vivit, et ipse dominátur
    in tota terra Ægýpti: quo audíto revíxit spíritus ejus, et dixit:"
  - "* Súfficit mihi, vadam et vidébo eum ántequam móriar."
  - V. Cumque audísset Jacob quod fílius ejus víveret, quasi de gravi somno
    evígilans, ait.
  - R. Súfficit mihi, vadam et vidébo eum ántequam móriar.
lectio2:
  - "Vis nosse, quia in hóminem peccándo perísti? Si te ille, in quem peccásti,
    corripúerit inter te et ipsum solum, et audíeris illum, lucrátus est te.
    Quid est, Lucrátus est te; nisi quia períeras, si non lucrarétur te? Nam si
    non períeras, quómodo te lucrátus est? Nemo ergo contémnat, quando peccat in
    fratrem. Ait enim quodam loco Apóstolus: Sic autem peccántes in fratres, et
    percutiéntes consciéntiam eórum infírmam, in Christum peccátis: ídeo quia
    membra Christi omnes facti sumus. Quómodo non peccas in Christum, qui peccas
    in membrum Christi?"
responsory2:
  - "@Tempora/Quad3-0:Responsory5"
lectio3:
  - "Nemo ergo dicat, quia non peccávi in Deum, sed peccávi in fratrem: in
    hóminem peccávi, leve, vel nullum peccátum est. Forte inde dicis: Leve est,
    quia cito curátur. Peccásti in fratrem: fac satis, et sanátus es. Cito
    fecísti mortíferam rem, sed remédium cito invenísti. Quis nostrum speret
    regnum cælórum, fratres mei, quando dicit Evangélium: Qui díxerit fratri
    suo, Fátue: reus erit gehénnæ ignis? Magnus terror: sed vide ibi remédium.
    Si obtúleris munus tuum ad altáre, et ibi recordátus fúeris, quia frater
    tuus habet áliquid advérsum te, relínque ibi munus tuum ante altáre. Non
    iráscitur Deus, quia differs impónere munus tuum: te quærit Deus magis, quam
    munus tuum."
