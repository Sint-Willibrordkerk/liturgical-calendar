  - "!Ps 16:1"
  - "Exáudi, Dómine, justítiam meam: inténde deprecatiónem meam."
  - "&Gloria"
  - "v. Ego clamávi, quóniam exaudísti me, Deus: inclína aurem tuam, et exáudi
