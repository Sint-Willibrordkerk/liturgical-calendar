introitus:
  - "!Ps 80:17"
  - "v. Cibávit eos ex ádipe fruménti, allelúja: et de petra, melle saturávit
    eos, allelúja, allelúja."
  - "!Ps 80:2"
  - "Exsultáte Deo, adjutóri nostro: jubiláte Deo Jacob."
  - "&Gloria"
  - "v. Cibávit eos ex ádipe fruménti, allelúja: et de petra, melle saturávit
    eos, allelúja, allelúja."
oratio:
  - "Deus, qui Apóstolis tuis Sanctum dedísti Spíritum: concéde plebi tuæ piæ
    petitiónis efféctum; ut, quibus dedísti fidem, largiáris et pacem."
  - $Per Dominum eiusdem
lectio:
  - Léctio Actuum Apostolórum
  - "!Acts 10:34; 10:42-48"
  - "In diébus illis: Apériens Petrus os suum, dixit: Viri fratres, nobis
    præcépit Dóminus prædicáre pópulo: et testificári, quia ipse est, qui
    constitútus est a Deo judex vivórum et mortuórum. Huic omnes Prophétæ
    testimónium pérhibent, remissiónem peccatórum accípere per nomen ejus omnes,
    qui credunt in eum. Adhuc loquénte Petro verba hæc, cecidit Spíritus Sanctus
    super omnes, qui audiébant verbum. Et obstupuérunt ex circumcisióne fidéles,
    qui vénerant cum Petro: quia et in natiónes grátia Spíritus Sancti effúsa
    est. Audiébant enim illos loquéntes linguis et magnificántes Deum. Tunc
    respóndit Petrus: Numquid aquam quis prohibére potest, ut non baptizéntur
    hi, qui Spíritum Sanctum accepérunt sicut et nos? Et jussit eos baptizári in
    nómine Dómini Jesu Christi."
graduale:
  - Allelúja, allelúja.
  - "!Acts 2:4"
  - Loquebántur váriis linguis Apóstoli magnália Dei. Allelúja. (Hic
    genuflectitur)
  - "V. Veni, Sancte Spiritus, reple tuorum corda fidélium: et tui amóris in eis
    ignem accénde."
sequentia:
  - "@Tempora/Pasc7-0:Sequentia"
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joannes 3:16-21"
  - "In illo témpore: Dixit Jesus Nicodémo: Sic Deus diléxit mundum, ut Fílium
    suum unigénitum daret: ut omnis, qui credit in eum, non péreat, sed hábeat
    vitam ætérnam. Non enim misit Deus Fílium suum in mundum, ut júdicet mundum,
    sed ut salvétur mundus per ipsum. Qui credit in eum, non judicátur; qui
    autem non credit, jam judicátus est: quia non credit in nómine unigéniti
    Fílii Dei. Hoc est autem judícium: quia lux venit in mundum, et dilexérunt
    hómines magis ténebras quam lucem: erant enim eórum mala ópera. Omnis enim,
    qui male agit, odit lucem, et non venit ad lucem, ut non arguántur ópera
    ejus: qui autem facit veritátem, venit ad lucem, ut manifesténtur ópera
    ejus, quia in Deo sunt facta."
offertorium:
  - "!Ps 17:14 et 16"
  - "Intónuit de cœlo Dóminus, et Altíssimus dedit vocem suam: et apparuérunt
    fontes aquárum, allelúja."
secreta:
  - "Propítius, Dómine, quǽsumus, hæc dona sanctífica: et, hóstiæ spiritális
    oblatióne suscépta, nosmetípsos tibi pérfice munus ætérnum."
  - $Per Dominum.
communio:
  - "!Joannes 14:26"
  - "Spíritus Sanctus docébit vos, allelúja: quæcúmque díxero vobis, allelúja,
    allelúja."
postcommunio:
  - "Adésto, quǽsumus, Dómine, pópulo tuo: et, quem mystériis cœléstibus
    imbuísti, ab hóstium furóre defénde."
  - $Per Dominum
lectio1:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 3:16-21"
  - "In illo témpore: Dixit Jesus Nicodémo: Sic Deus diléxit mundum, ut Fílium
    suum unigénitum daret: ut omnis, qui credit in eum, non péreat, sed hábeat
    vitam ætérnam. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tract. 12 in Joann., sub fin."
  - "Quantum in médico est, sanáre venit ægrótum. Ipse se intérimit, qui
    præcépta médici observáre non vult. Venit Salvátor in mundum. Quare Salvátor
    dictus est mundi, nisi ut salvet mundum, non ut júdicet mundum? Salvári non
    vis ab ipso: ex te judicáberis. Et quid dicam, Judicáberis? Vide quid ait:
    Qui credit in eum, non judicátur. Qui autem non credit: quid dictúrum
    sperábas, nisi: Judicátur? Quod addit: Jam, inquit, judicátus est: nondum
    appáruit judícium, et jam factum est judícium."
responsory1:
  - "R. Jam non dicam vos servos, sed amícos meos; quia ómnia cognovístis, quæ
    operátus sum in médio vestri, allelúja:"
  - "* Accípite Spíritum Sanctum in vobis Paráclitum: ille est, quem Pater
    mittet vobis, allelúja."
  - V. Vos amíci mei estis, si fecéritis quæ ego præcípio vobis.
  - "R. Accípite Spíritum Sanctum in vobis Paráclitum: ille est, quem Pater
    mittet vobis, allelúja."
lectio2:
  - "Novit enim Dóminus qui sunt ejus: novit qui permáneant ad corónam, qui
    permáneant ad flammam. Novit in área sua tríticum, novit et páleam: novit
    ségetem, novit et zizánia. Jam judicátus est, qui non credit. Quare
    judicátus? Quia non crédidit in nómine unigéniti Fílii Dei. Hoc est autem
    judícium: quia lux venit in mundum, et dilexérunt hómines magis ténebras,
    quam lucem: erant enim mala ópera eórum. Fratres mei, quorum ópera bona
    invénit Dóminus? Nullórum. Omnia ópera mala invénit. Quómodo ergo quidam
    fecérunt veritátem, et venérunt ad lucem? Et hoc enim séquitur: Qui autem
    facit veritátem, venit ad lucem."
responsory2:
  - "R. Spíritus Sanctus, procédens a throno, Apostolórum péctora invisibíliter
    penetrávit novo sanctificatiónis signo:"
  - "* Ut in ore eórum ómnium génera nasceréntur linguárum, allelúja."
  - V. Advénit ignis divínus, non combúrens, sed illúminans, et tríbuit eis
    charísmatum dona.
  - R. Ut in ore eórum ómnium génera nasceréntur linguárum, allelúja.
  - "&Gloria"
  - R. Ut in ore eórum ómnium génera nasceréntur linguárum, allelúja.
lectio3:
  - "Sed dilexérunt, inquit, ténebras magis quam lucem. Ibi pósuit vim. Multi
    enim dilexérunt peccáta sua, multi conféssi sunt peccáta sua: quia qui
    confitétur peccáta sua, et accúsat peccáta sua, jam cum Deo facit. Accúsat
    Deus peccáta tua: si et tu accúsas, conjúngeris Deo. Quasi duæ res sunt,
    homo et peccátor. Quod audis homo, Deus fecit: quod audis peccátor, ipse
    homo fecit. Dele, quod fecísti, ut Deus salvet, quod fecit. Opórtet ut
    óderis in te opus tuum, et ames in te opus Dei. Cum autem cœ́perit tibi
    displicére quod fecísti, inde incípiunt bona ópera tua, quia accúsas mala
    ópera tua. Inítium óperum bonórum, conféssio est óperum malórum."
  - "&teDeum"
