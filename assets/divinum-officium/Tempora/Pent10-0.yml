introitus:
  - "!Ps 54:17-20; 54:23"
  - "v. Dum clamárem ad Dóminum, exaudívit vocem meam, ab his, qui appropínquant
    mihi: et humiliávit eos, qui est ante sǽcula et manet in ætérnum: jacta
    cogitátum tuum in Dómino, et ipse te enútriet."
  - "!Ps 54:2-3"
  - "Exáudi, Deus, oratiónem meam, et ne despéxeris deprecatiónem meam: inténde
    mihi et exáudi me."
  - "&Gloria"
  - "v. Dum clamárem ad Dóminum, exaudívit vocem meam, ab his, qui appropínquant
    mihi: et humiliávit eos, qui est ante sǽcula et manet in ætérnum: jacta
    cogitátum tuum in Dómino, et ipse te enútriet."
oratio:
  - "Deus, qui omnipoténtiam tuam parcéndo máxime et miserándo maniféstas:
    multíplica super nos misericórdiam tuam; ut, ad tua promíssa curréntes,
    cæléstium bonórum fácias esse consórtes."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Corínthios
  - "!1 Cor 12:2-11"
  - "Fratres: Scitis, quóniam, cum gentes essétis, ad simulácra muta prout
    ducebámini eúntes. Ideo notum vobisfacio, quod nemo in Spíritu Dei loquens,
    dicit anáthema Jesu. Et nemo potest dícere, Dóminus Jesus, nisi in Spíritu
    Sancto. Divisiónes vero gratiárum sunt, idem autem Spíritus. Et divisiónes
    ministratiónum sunt, idem autem Dóminus. Et divisiónes operatiónum sunt,
    idem vero Deus, qui operátur ómnia in ómnibus. Unicuíque autem datur
    manifestátio Spíritus ad utilitátem. Alii quidem per Spíritum datur sermo
    sapiéntiæ álii autem sermo sciéntiæ secúndum eúndem Spíritum: álteri fides
    in eódem Spíritu: álii grátia sanitátum in uno Spíritu: álii operátio
    virtútum, álii prophetía, álii discrétio spirítuum, álii génera linguárum,
    álii interpretátio sermónum. Hæc autem ómnia operátur unus atque idem
    Spíritus, dívidens síngulis, prout vult."
graduale:
  - "!Ps 16:8; 16:2"
  - "Custódi me, Dómine, ut pupíllam óculi: sub umbra alárum tuárum prótege me."
  - "V. De vultu tuo judícium meum pródeat: óculi tui vídeant æquitátem."
  - Allelúja, allelúja.
  - "!Ps 64:2"
  - "Te decet hymnus, Deus, in Sion: et tibi reddétur votum in Jerúsalem.
    Allelúja."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 18:9-14"
  - "In illo témpore: Dixit Jesus ad quosdam, qui in se confidébant tamquam
    justi et aspernabántur céteros, parábolam istam: Duo hómines ascendérunt in
    templum, ut orárent: unus pharisǽus, et alter publicánus. Pharisǽus stans,
    hæc apud se orábat: Deus, grátias ago tibi, quia non sum sicut céteri
    hóminum: raptóres, injústi, adúlteri: velut étiam hic publicánus. Jejúno bis
    in sábbato: décimas do ómnium, quæ possídeo. Et publicánus a longe stans
    nolébat nec óculos ad cœlum leváre: sed percutiébat pectus suum, dicens:
    Deus, propítius esto mihi peccatóri. Dico vobis: descéndit hic justificátus
    in domum suam ab illo: quia omnis qui se exáltat, humiliábitur: et qui se
    humíliat, exaltábitur."
offertorium:
  - "!Ps 24:1-3"
  - "Ad te, Dómine, levávi ánimam meam: Deus meus, in te confído, non erubéscam:
    neque irrídeant me inimíci mei: étenim univérsi, qui te exspéctant, non
    confundéntur."
secreta:
  - "Tibi, Dómine, sacrifícia dicáta reddántur: quæ sic ad honórem nóminis tui
    deferénda tribuísti, ut eadem remédia fíeri nostra præstáres."
  - $Per Dominum
communio:
  - "!Ps 50:21"
  - Acceptábis sacrificium justítiæ, oblatiónes et holocáusta, super altáre
    tuum, Dómine.
postcommunio:
  - "Quǽsumus, Dómine, Deus noster: ut, quos divínis reparáre non désinis
    sacraméntis, tuis non destítuas benígnus auxíliis."
  - $Per Dominum
