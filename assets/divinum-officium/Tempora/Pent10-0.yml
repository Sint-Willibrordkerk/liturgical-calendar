lectio1:
  - De libro quarto Regum
  - "!4 Reg 9:29-34"
  - 29 Anno undécimo Joram fílii Achab regnávit Ochozías super Judam,
  - 30 venítque Jehu in Jézrahel. Porro Jézabel, intróitu ejus audíto, depínxit
    óculos suos stíbio et ornávit caput suum et respéxit per fenéstram
  - "31 ingrediéntem Jehu per portam et ait: Numquid pax potest esse Zambri, qui
    interfécit dóminum suum?"
  - "32 Levavítque Jehu fáciem suam ad fenéstram et ait: Quæ est ista? Et
    inclinavérunt se ad eum duo vel tres eunúchi."
  - "33 At ille dixit eis: Præcipitáte eam deórsum; et præcipitavérunt eam,
    aspersúsque est sánguine páries, et equórum úngulæ conculcavérunt eam."
  - "34 Cumque introgréssus esset ut coméderet biberétque, ait: Ite et vidéte
    maledíctam illam et sepelíte eam, quia fília regis est."
responsory1:
  - "@Tempora/Pent01-1"
lectio2:
  - "!4 Reg 9:35-37; 10:1-3"
  - 35 Cumque issent ut sepelírent eam, non invenérunt nisi calváriam et pedes
    et summas manus.
  - "36 Reversíque nuntiavérunt ei. Et ait Jehu: Sermo Dómini est, quem locútus
    est per servum suum Elíam Thesbíten dicens: In agro Jézrahel cómedent canes
    carnes Jézabel,"
  - "37 et erunt carnes Jézabel sicut stercus super fáciem terræ in agro
    Jézrahel, ita ut prætereúntes dicant: Hǽccine est illa Jézabel?"
  - "1 Erant autem Achab septuagínta fílii in Samaría. Scripsit ergo Jehu
    lítteras et misit in Samaríam ad optimátes civitátis et ad majóres natu et
    ad nutrícios Achab, dicens:"
  - 2 Statim ut accepéritis lítteras has, qui habétis fílios dómini vestri et
    currus et equos et civitátes firmas et arma,
  - 3 elígite meliórem et eum qui vobis placúerit de fíliis dómini vestri et eum
    pónite super sólium patris sui et pugnáte pro domo dómini vestri.
responsory2:
  - "@Tempora/Pent01-1"
lectio3:
  - "!4 Reg 10:4-7"
  - "4 Timuérunt illi veheménter et dixérunt: Ecce duo reges non potuérunt stare
    coram eo, et quómodo nos valébimus resístere?"
  - "5 Misérunt ergo præpósiti domus et præfécti civitátis et majóres natu et
    nutrícii ad Jehu dicéntes: Servi tui sumus: quæcúmque jússeris faciémus, nec
    constituémus nobis regem: quæcúmque tibi placent, fac."
  - "6 Rescrípsit autem eis lítteras secúndo dicens: Si mei estis et obedítis
    mihi, tóllite cápita filiórum dómini vestri et veníte ad me hac eádem hora
    cras in Jézrahel. Porro fílii regis, septuagínta viri, apud optimátes
    civitátis nutriebántur."
  - 7 Cumque veníssent lítteræ ad eos, tulérunt fílios regis et occidérunt
    septuagínta viros et posuérunt cápita eórum in cóphinis et misérunt ad eum
    in Jézrahel.
responsory3:
  - "@Tempora/Pent01-1"
lectio4:
  - Sermo sancti Joánnis Chrysóstomi
  - "!Homilia 25 in Epistola ad Romanos"
  - "Non putémus nos excusatiónem habitúros, si quando delictórum sócios
    invenérimus: nam istud, supplícium magis augébit. Quandóquidem et serpens
    magis punítus est quam múlier, quemádmodum et múlier plus quam vir. Et
    Jézabel majóres pœnas dedit, quam Achab víneæ raptor; ipsa quippe univérsum
    istud negótium texúerat, regíque lapsus occasiónem déderat. Igitur et tu
    quoque, si réliquis perditiónis causa fúeris, gravióra patiéris quam qui per
    te subvérsi sunt. Neque enim peccáre tantum in se perditiónis habet, quantum
    quod réliqui ad peccándum inducúntur."
responsory4:
  - "@Tempora/Pent01-2:Responsory1"
lectio5:
  - "Itaque, si quando peccántes vidérimus, non solum non impellámus, sed et
    extrahámus ex ipso malítiæ bárathro, ne et aliénæ perditiónis pœnas demus.
    Recordémur quoque perpétuo terríbilis illíus tribunális, flúminis ígnei,
    vinculórum insolubílium, profundárum tenebrárum, stridórum déntium,
    venenosíque vermis. Sed dices: Benígnus est Deus. Ergo hæc ómnia verba sunt,
    et neque punítur dives ille Lázari contémptor, neque fátuæ vírgines a sponso
    rejiciúntur? Ergo qui Christum non pavérunt, in ignem diábolo præparátum non
    abíbunt? Ergo qui sórdibus est véstibus, non períbit, manus ac pedes
    vinctus? Qui centum denários a consérvo suo exégit, non tradétur tortóribus?
    Quod de mœchis dictum est, nimírum quod vermis eórum non moriétur, et ignis
    eórum non exstinguétur, verum non erit?"
responsory5:
  - "@Tempora/Pent01-2:Responsory2"
lectio6:
  - Sed minátur ista tantúmmodo Deus? Utique ínquies. Et unde, dic quæso, tantam
    rem audes públice loqui, atque ex te ipso ferre senténtiam? Ego quippe et ex
    iis quæ dixit Deus, et ex iis quæ fecit, contrárium probáre pótero. Quod si
    propter futúra non credis, vel saltem propter ea quæ jam facta sunt, crede.
    Non enim certe minæ sunt et verba tantúmmodo, quæ facta sunt et in opus
    ipsum exiérunt. Quis ígitur totum orbem indúcto dilúvio stagnávit, ac grave
    illud naufrágium, omnimodámque géneris nostri perditiónem effécit? Quis
    deínde fúlmina illa, télaque flammántia super terram Sodomórum dimísit? Quis
    univérsum Ægýpti exércitum in mare demérsit? Quis synagógam Abíron
    combússit? Quis septuagínta illa míllia propter Davídis peccátum uno
    témporis moménto peste occídit? Nonne hæc ómnia et ália Deus illis íntulit?
responsory6:
  - "@Tempora/Pent01-2:Responsory3"
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 18:9-14"
  - "In illo témpore: Dixit Jesus ad quosdam, qui in se confidébant tamquam
    justi et aspernabántur céteros, parábolam istam: Duo hómines ascendérunt in
    templum ut orárent: unus pharisǽus, et alter publicánus. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Sermo 36 de Verbis Domini, circa medium"
  - "Díceret saltem pharisǽus: Non sum sicut multi hómines. Quid est, céteri
    hómines, nisi omnes præter ipsum? Ego, inquit, justus sum, céteri
    peccatóres. Non sum sicut céteri hómines, injústi, raptóres, adúlteri. Et
    ecce tibi ex vicíno publicáno majóris tumóris occásio: Sicut, inquit,
    publicánus iste. Ego, inquit, solus sum: iste de céteris est. Non sum,
    inquit, talis, qualis iste, per justítias meas, quibus iníquus non sum."
responsory7:
  - "@Tempora/Pent01-3:Responsory1"
lectio8:
  - "Jejúno bis in sábbato, décimas do ómnium quæ possídeo. Quid rogáverit Deum,
    quære in verbis ejus, nihil invénies. Ascéndit oráre: nóluit Deum rogáre,
    sed se laudáre. Parum est, non Deum rogáre, sed se laudáre; ínsuper et
    rogánti insultáre. Publicánus autem de longínquo stabat et Deo tamen ipse
    appropinquábat: cordis consciéntia eum removébat, píetas applicábat.
    Publicánus autem de longínquo stabat, sed Dóminus eum de propínquo
    attendébat."
responsory8:
  - "@Tempora/Pent01-0:Responsory8"
lectio9:
  - "Excélsus enim Dóminus, et humília réspicit; excélsos autem, qualis erat
    ille pharisǽus, a longe cognóscit. Excélsa quidem Deus a longe cognóscit,
    sed non ignóscit. Adhuc audi humilitátem publicáni. Parum est, quia de
    longínquo stabat: nec óculos suos ad cælum levábat: ut aspicerétur, non
    aspiciébat; respícere sursum non audébat: premébat consciéntia, spes
    sublevábat. Adhuc audi: Percutiébat pectus suum. Pœnas a se ipso exigébat;
    proptérea Dóminus confiténti parcébat. Percutiébat pectus suum, dicens:
    Dómine, propítius esto mihi peccatóri. Ecce qui rogat. Quid miráris, si Deus
    ignóscit, quando ipse agnóscit?"
  - "&teDeum"
