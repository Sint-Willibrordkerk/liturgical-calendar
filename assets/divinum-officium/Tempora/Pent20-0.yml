lectio7:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 4:46-53"
  - "In illo témpore: Erat quidam régulus, cujus fílius infirmabátur Caphárnaum.
    Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 28 in Evangelia"
  - "Léctio sancti Evangélii, quam modo, fratres, audístis, expositióne non
    índiget: sed ne hanc táciti præteriísse videámur, exhortándo pótius quam
    exponéndo in ea áliquid loquámur. Hoc autem nobis solúmmodo de expositióne
    vídeo esse requiréndum, cur is, qui ad salútem fílio peténdam vénerat,
    audívit: Nisi signa et prodígia vidéritis, non créditis. Qui enim salútem
    fílio quærébat, proculdúbio credébat; neque enim ab eo quǽreret salútem,
    quem non créderet Salvatórem. Quare ergo dícitur: Nisi signa et prodígia
    vidéritis, non créditis: qui ante crédidit, quam signa vidéret?"
lectio8:
  - Sed mementóte quid pétiit; et apérte cognoscétis, quia in fide dubitávit.
    Popóscit namque, ut descénderet et sanáret fílium ejus. Corporálem ergo
    præséntiam Dómini quærébat, qui per spíritum nusquam déerat. Minus ítaque in
    illum crédidit, quem non putávit posse salútem dare, nisi præsens esset et
    córpore. Si enim perfécte credidísset, proculdúbio sciret, quia non esset
    locus ubi non esset Deus.
lectio9:
  - "Ex magna ergo parte diffísus est, qui virtútem non dedit majestáti, sed
    præséntiæ corporáli. Salútem ítaque fílio pétiit, et tamen in fide
    dubitávit; quia eum ad quem vénerat, et poténtem ad curándum crédidit, et
    tamen moriénti fílio esse abséntem putávit. Sed Dóminus, qui rogátur ut
    vadat, quia non desit ubi invitátur, índicat: solo jussu salútem réddidit,
    qui voluntáte ómnia creávit."
  - "&teDeum"
ant-2:
  - Erat quidam régulus, * cujus fílius infirmabátur Caphárnaum. Hic cum
    audísset quod Jesus veníret in Galilǽam, rogábat eum ut sanáret fílium ejus.
ant-3:
  - "Cognóvit autem pater * quia illa hora erat, in qua dixit Jesus: Fílius tuus
    vivit; et crédidit ipse et domus ejus tota."
