oratio:
  - "Largíre, quǽsumus, Dómine, fidélibus tuis indulgéntiam placátus et pacem:
    ut páriter ab ómnibus mundéntur offénsis, et secúra tibi mente desérviant."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Ephésios
  - "!Ephes 5:15-21"
  - "Fratres: Vidéte, quómodo caute ambulétis: non quasi insipiéntes, sed ut
    sapiéntes, rediméntes tempus, quóniam dies mali sunt. Proptérea nolíte fíeri
    imprudéntes, sed intellegéntes, quæ sit volúntas Dei. Et nolíte inebriári
    vino, in quo est luxúria: sed implémini Spíritu Sancto, loquéntes
    vobismetípsis in psalmis et hymnis et cánticis spirituálibus, cantántes et
    psalléntes in córdibus vestris Dómino: grátias agéntes semper pro ómnibus,
    in nómine Dómini nostri Jesu Christi, Deo et Patri. Subjecti ínvicem in
    timóre Christi."
graduale:
  - "!Ps 144:15-16"
  - "Oculi ómnium in te sperant, Dómine: et tu das illis escam in témpore
