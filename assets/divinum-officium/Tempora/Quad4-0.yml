    afflígimur, tuæ grátiæ consolatióne respirémus."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Pauli Apóstoli ad Gálatas
  - "!Gal 4:22-31"
  - "Fratres: Scriptum est: Quóniam Abraham duos fílios hábuit: unum de ancílla,
    et unum de líbera. Sed qui de ancílla, secúndum carnem natus est: qui autem
    de líbera, per repromissiónem: quæ sunt per allegoríam dicta. Hæc enim sunt
    duo testaménta. Unum quidem in monte Sina, in servitútem génerans: quæ est
    Agar: Sina enim mons est in Arábia, qui conjúnctus est ei, quæ nunc est
    Jerúsalem, et servit cum fíliis suis. Illa autem, quæ sursum est Jerúsalem,
    líbera est, quæ est mater nostra. Scriptum est enim: Lætáre, stérilis, quæ
    non paris: erúmpe, et clama, quæ non párturis: quia multi fílii desértæ,
    magis quam ejus, quæ habet virum. Nos autem, fratres, secúndum Isaac
    promissiónis fílii sumus. Sed quómodo tunc is, qui secúndum carnem natus
    fúerat, persequebátur eum, qui secúndum spíritum: ita et nunc. Sed quid
    dicit Scriptúra? Ejice ancíllam et fílium ejus: non enim heres erit fílius
    ancíllæ cum fílio líberæ. Itaque, fratres, non sumus ancíllæ fílii, sed
    líberæ: qua libertáte Christus nos liberávit."
graduale:
