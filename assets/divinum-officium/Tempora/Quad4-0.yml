lectio1:
  - De libro Exodi
  - "!Exod 3:1-6"
  - 1 Móyses autem pascébat oves Jethro sóceri sui sacerdótis Mádian; cumque
    minásset gregem ad interióra desérti, venit ad montem Dei Horeb.
  - 2 Apparuítque ei Dóminus in flamma ignis de médio rubi; et vidébat quod
    rubus ardéret et non comburerétur.
  - "3 Dixit ergo Móyses: Vadam, et vidébo visiónem hanc magnam, quare non
    comburátur rubus."
  - "4 Cernens autem Dóminus quod pérgeret ad vidéndum, vocávit eum de médio
    rubi, et ait: Móyses, Móyses! Qui respóndit: Adsum."
  - "5 At ille: Ne apprópies, inquit, huc: solve calceaméntum de pédibus tuis;
    locus enim, in quo stas, terra sancta est."
  - "6 Et ait: Ego sum Deus patris tui, Deus Abraham, Deus Isaac, et Deus Jacob.
    Abscóndit Móyses fáciem suam: non enim audébat aspícere contra Deum."
responsory1:
  - "R. Locútus est Dóminus ad Móysen, dicens: Descénde in Ægýptum, et dic
    Pharaóni:"
  - "* Ut dimíttat pópulum meum: indurátum est cor Pharaónis: non vult dimíttere
    pópulum meum, nisi in manu forti."
  - "V. Clamor filiórum Israël venit ad me, vidíque afflictiónem eórum: sed
    veni, mittam te ad Pharaónem."
  - "R. Ut dimíttat pópulum meum: indurátum est cor Pharaónis: non vult
    dimíttere pópulum meum, nisi in manu forti."
lectio2:
  - "!Exod 3:7-10"
  - "7 Cui ait Dóminus: Vidi afflictiónem pópuli mei in Ægýpto, et clamórem ejus
    audívi propter durítiam eórum qui præsunt opéribus:"
  - 8 et sciens dolórem ejus, descéndi ut líberem eum de mánibus Ægyptiórum, et
    edúcam de terra illa in terram bonam et spatiósam, in terram quæ fluit lacte
    et melle, ad loca Chananǽi, et Hethǽi, et Amorrhǽi, et Pherezǽi, et Hevǽi,
    et Jebusǽi.
  - "9 Clamor ergo filiórum Israël venit ad me: vidíque afflictiónem eórum, qua
    ab Ægýptiis opprimúntur."
  - 10 Sed veni, et mittam te ad Pharaónem, ut edúcas pópulum meum, fílios
    Israël de Ægýpto.
responsory2:
  - "R. Stetit Móyses coram Pharaóne, et dixit: Hæc dicit Dóminus:"
  - "* Dimítte pópulum meum, ut sacríficet mihi in desérto."
  - V. Dóminus Deus Hebræórum misit me ad te, dicens.
  - R. Dimítte pópulum meum, ut sacríficet mihi in desérto.
lectio3:
  - "!Exod 3:11-15"
  - "11 Dixítque Móyses ad Deum: Quis sum ego, ut vadam ad Pharaónem, et edúcam
    fílios Israël de Ægýpto?"
  - "12 Qui dixit ei: Ego ero tecum: et hoc habébis signum, quod míserim te: Cum
    edúxeris pópulum de Ægýpto, immolábis Deo super montem istum."
  - "13 Ait Móyses ad Deum: Ecce, ego vadam ad fílios Israël, et dicam eis: Deus
    patrum vestrórum misit me ad vos. Si díxerint mihi: Quod est nomen ejus?
    quid dicam eis?"
  - "14 Dixit Deus ad Móysen: Ego sum qui sum. Ait: Sic dices fíliis Israël: Qui
    est, misit me ad vos."
  - "15 Dixítque íterum Deus ad Móysen: Hæc dices fíliis Israël: Dóminus Deus
    patrum vestrórum, Deus Abraham, Deus Isaac, et Deus Jacob, misit me ad vos;
    hoc nomen mihi est in ætérnum, et hoc memoriále meum in generatiónem et
    generatiónem."
responsory3:
  - "R. Cantémus Dómino: glorióse enim honorificátus est, equum et ascensórem
    projécit in mare:"
  - "* Adjútor et protéctor factus est mihi Dóminus in salútem."
  - V. Dóminus quasi vir pugnátor, Omnípotens nomen ejus.
  - R. Adjútor et protéctor factus est mihi Dóminus in salútem.
  - "&Gloria"
  - R. Adjútor et protéctor factus est mihi Dóminus in salútem.
lectio4:
  - Sermo sancti Basilíi Magni
  - "!Homilia 1 de jejúnio, ante med."
  - "Móysen per jejunium nóvimus in montem ascendísse: neque enim áliter ausus
    esset vérticem fumántem adire, atque in calíginem íngredi, nisi jejúnio
    munítus. Per jejunium mandáta digito Dei in tábulis conscripta suscépit.
    Item supra montem jejunium legis latæ conciliator fuit: inférius vero, gula
    ad idololatríam pópulum dedúxit, ac contaminávit. Sedit, inquit, pópulus
    manducare et bíbere, et surrexérunt lúdere. Quadragínta diérum labórem ac
    perseverantiam, Dei servo continuo jejunante ac orante, una tantum pópuli
    ebríetas cassam irritamque réddidit. Quas enim tabulas Dei dígito
    conscriptas jejunium accepit, has ebríetas contrívit: Prophéta sanctíssimo
    indignum existimante, vinoléntum pópulum a Deo legem accípere."
responsory4:
  - "R. In mare viæ tuæ, et sémitæ tuæ in aquis multis:"
  - "* Deduxísti sicut oves pópulum tuum in manu Móysi et Aaron."
  - V. Transtulísti illos per mare Rubrum, et transvexísti eos per aquam nímiam.
  - R. Deduxísti sicut oves pópulum tuum in manu Móysi et Aaron.
lectio5:
  - Uno témporis momento ob gulam pópulus ille per maxima prodígia Dei cultum
    edoctus, in Ægyptíacam idololatríam turpíssime devolutus est. Ex quo si
    utrumque simul cónferas, vidére licet, jejunium ad Deum ducere, delicias
    vero salútem pérdere. Quid Esau inquinávit, servumque fratris réddidit?
    nonne esca una, propter quam primogenita vendidit? Samuelem vero nonne per
    jejunium orátio largíta est matri? Quid fortíssimum Samsónem inexpugnábilem
    réddidit? nonne jejunium, cum quo in matris ventre concéptus est? Jejunium
    concépit, jejunium nutrívit, jejunium virum effécit. Quod sane Angelus matri
    præcepit, monens quæcúmque ex vite procéderent, ne attíngeret, non vinum,
    non síceram bíberet. Jejunium prophétas génuit, poténtes confírmat atque
    róborat.
responsory5:
  - "R. Qui persequebántur pópulum tuum, Dómine, demersísti eos in profúndum:"
  - "* Et in colúmna nubis ductor eórum fuísti."
  - V. Deduxísti sicut oves pópulum tuum in manu Móysi et Aaron.
  - R. Et in colúmna nubis ductor eórum fuísti.
lectio6:
  - "Jejunium legislatóres sapiéntes facit: ánimæ optima custódia, corporis
    socius securus, fortibus viris muniméntum et arma, athlétis et certántibus
    exercitátio. Hoc præterea tentatiónes propulsat, ad pietátem armat, cum
    sobrietáte hábitat, temperantiæ ópifex est: in bellis fortitúdinem affert,
    in pace quietem docet: nazaræum sanctificat, sacerdotem pérficit: neque enim
    fas est sine jejúnio sacrifícium attíngere, non solum in mystica nunc et
    vera Dei adoratióne, sed nec in illa, in qua sacrifícium secúndum legem in
    figura offerebátur. Jejunium Elíam magnæ visiónis spectatórem fecit:
    quadragínta namque diérum jejúnio cum ánimam purgasset, in spelúnca meruit,
    quantum fas est homini, Deum vidére. Móyses íterum legem accípiens, íterum
    jejunia secutus est. Ninivítæ, nisi cum illis et bruta jejunassent, ruínæ
    minas nequáquam evasissent. In desérto autem quorúmnam membra cecidérunt?
    nonne illórum, qui carnes appetivére?"
responsory6:
  - "R. Móyses fámulus Dei jejunávit quadragínta diébus et quadragínta nóctibus:"
  - "* Ut legem Dómini mererétur accípere."
  - V. Ascéndens Móyses in montem Sínai ad Dóminum, fuit ibi quadragínta diébus
    et quadragínta nóctibus.
  - R. Ut legem Dómini mererétur accípere.
  - "&Gloria"
  - R. Ut legem Dómini mererétur accípere.
lectio7:
  - Léctio sancti Evangélii secúndum Joánnem
  - "!Joannes 6:1-15"
  - "In illo témpore: Abiit Jesus trans mare Galilǽæ, quod est Tiberíadis: et
    sequebátur eum multitúdo magna, quia vidébant signa, quæ faciébat super his
    qui infirmabántur. Et réliqua."
  - _
  - Homilía sancti Augustíni Epíscopi
  - "!Tract. 24 in Joannem"
  - "Mirácula, quæ fecit Dóminus noster Jesus Christus, sunt quidem divína
    ópera, et ad intellegéndum Deum de visibílibus ádmonent humánam mentem. Quia
    enim ille non est talis substántia, quæ vidéri óculis possit; et mirácula
    ejus, quibus totum mundum regit, universámque creatúram adminístrat,
    assiduitáte viluérunt, ita ut pene nemo dignétur atténdere ópera Dei mira et
    stupénda in quólibet séminis grano: secúndum ipsam suam misericórdiam,
    servávit sibi quædam, quæ fáceret opportúno témpore præter usitátum cursum
    ordinémque natúræ; ut non majóra, sed insólita vidéndo stupérent, quibus
    cotidiána vilúerant."
responsory7:
  - "R. Spléndida facta est fácies Móysi, dum respíceret in eum Dóminus:"
  - "* Vidéntes senióres claritátem vultus ejus, admirántes timuérunt valde."
  - V. Cumque descendísset de monte Sínai, portábat duas tábulas testimónii,
    ignórans quod cornúta esset fácies ejus ex consórtio sermónis Dei.
  - R. Vidéntes senióres claritátem vultus ejus, admirántes timuérunt valde.
lectio8:
  - "Majus enim miraculum est gubernátio totius mundi, quam saturátio quinque
    millium hóminum de quinque pánibus. Et tamen hoc nemo mirátur: illud
    mirántur hómines, non quia majus est, sed quia rarum est. Quis enim et nunc
    pascit univérsum mundum, nisi ille, qui de paucis granis ségetes creat?
    Fecit ergo quo modo Deus. Unde enim multiplicat de paucis granis ségetes,
    inde in mánibus suis multiplicávit quinque panes: potéstas enim erat in
    mánibus Christi. Panes autem illi quinque, quasi semina erant, non quidem
    terræ mandata, sed ab eo, qui terram fecit, multiplicata."
responsory8:
  - "R. Ecce mitto Angelum meum, qui præcédat te, et custódiat semper:"
  - "* Obsérva et audi vocem meam, et inimícus ero inimícis tuis, et affligéntes
    te afflígam: et præcédet te Angelus meus."
  - "V. Israël, si me audíeris, non erit in te deus recens, neque adorábis deum
    aliénum: ego enim Dóminus."
  - "R. Obsérva et audi vocem meam, et inimícus ero inimícis tuis, et
    affligéntes te afflígam: et præcédet te Angelus meus."
lectio9:
  - "Hoc ergo admótum est sensibus, quo erigerétur mens: et exhíbitum óculis,
    ubi exercerétur intelléctus: ut invisibilem Deum per visibília ópera
    mirarémur, et erécti ad fidem, et purgáti per fidem, étiam ipsum invisibilem
    vidére cuperemus, quem de rebus visibílibus invisibilem nosceremus. Nec
    tamen sufficit hæc intuéri in miraculis Christi. Interrogémus ipsa miracula,
    quid nobis loquántur de Christo: habent enim, si intelligántur, linguam
    suam. Nam quia ipse Christus Verbum Dei est: étiam factum Verbi, verbum
    nobis est."
responsory9:
  - "R. Atténdite, pópule meus, legem meam:"
  - "* Inclináte aurem vestram in verba oris mei."
  - "V. Apériam in parábolis os meum: loquar propositiónes ab inítio sǽculi."
  - R. Inclináte aurem vestram in verba oris mei.
  - "&Gloria"
  - R. Inclináte aurem vestram in verba oris mei.
