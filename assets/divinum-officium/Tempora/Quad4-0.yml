  - "!Tractus"
  - "!Ps 124:1-2"
  - "Qui confídunt in Dómino, sicut mons Sion: non commovébitur in ætérnum, qui
    hábitat in Jerúsalem."
  - "V. Montes in circúitu ejus: et Dóminus in circúitu pópuli sui, ex hoc nunc
    et usque in sǽculum."
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Joánnem
  - "!Joann 6:1-15"
  - "In illo témpore: Abiit Jesus trans mare Galilǽæ, quod est Tiberíadis: et
    sequebátur eum multitúdo magna, quia vidébant signa, quæ faciébat super his,
    qui infirmabántur. Súbiit ergo in montem Jesus: et ibi sedébat cum
    discípulis suis. Erat autem próximum Pascha, dies festus Judæórum. Cum
    sublevásset ergo óculos Jesus et vidísset, quia multitúdo máxima venit ad
    eum, dixit ad Philíppum: Unde emémus panes, ut mandúcent hi? Hoc autem
    dicébat tentans eum: ipse enim sciébat, quid esset factúrus. Respóndit ei
    Philíppus: Ducentórum denariórum panes non suffíciunt eis, ut unusquísque
    módicum quid accípiat. Dicit ei unus ex discípulis ejus, Andréas, frater
    Simónis Petri: Est puer unus hic, qui habet quinque panes hordeáceos et duos
    pisces: sed hæc quid sunt inter tantos? Dixit ergo Jesus: Fácite hómines
    discúmbere. Erat autem fænum multum in loco. Discubuérunt ergo viri, número
    quasi quinque míllia. Accépit ergo Jesus panes, et cum grátias egísset,
    distríbuit discumbéntibus: simíliter et ex píscibus, quantum volébant. Ut
    autem impléti sunt, dixit discípulis suis: Collígite quæ superavérunt
    fragménta, ne péreant. Collegérunt ergo, et implevérunt duódecim cóphinos
    fragmentórum ex quinque pánibus hordeáceis, quæ superfuérunt his, qui
    manducáverant. Illi ergo hómines cum vidíssent, quod Jesus fécerat signum,
    dicébant: Quia hic est vere Prophéta, qui ventúrus est in mundum. Jesus ergo
    cum cognovísset, quia ventúri essent, ut ráperent eum et fácerent eum regem,
    fugit íterum in montem ipse solus."
offertorium:
