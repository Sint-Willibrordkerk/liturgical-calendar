introitus:
  - "!Ps. 24:16; 24:18"
  - "v. Réspice in me et miserére mei, Dómine: quóniam únicus et pauper sum ego:
    vide humilitátem meam et labórem meum: et dimítte ómnia peccáta mea, Deus
    meus."
  - "!Ps. 24:1-2"
  - "Ad te, Dómine, levávi ánimam meam: Deus meus, in te confído, non erubéscam."
  - "&Gloria"
  - "v. Réspice in me et miserére mei, Dómine: quóniam únicus et pauper sum ego:
    vide humilitátem meam et labórem meum: et dimítte ómnia peccáta mea, Deus
    meus."
oratio:
  - "Protéctor in te sperántium, Deus, sine quo nihil est válidum, nihil
    sanctum: multíplica super nos misericórdiam tuam; ut, te rectóre, te duce,
    sic transeámus per bona temporália, ut non amittámus ætérna."
  - $Per Dominum
lectio:
  - Léctio Epístolæ beáti Petri Apóstoli
  - "!1 Pet. 5:6-11"
  - "Caríssimi: Humiliámini sub poténti manu Dei, ut vos exáltet in témpore
    visitatiónis: omnem sollicitúdinem vestram projiciéntes in eum, quóniam ipsi
    cura est de vobis. Sóbrii estote et vigiláte: quia adversárius vester
    diábolus tamquam leo rúgiens circuit, quærens, quem dévoret: cui resístite
    fortes in fide: sciéntes eándem passiónem ei, quæ in mundo est, vestræ
    fraternitáti fíeri. Deus autem omnis grátiæ, qui vocávit nos in ætérnam suam
    glóriam in Christo Jesu, módicum passos ipse perfíciet, confirmábit
    solidabítque. Ipsi glória et impérium in sǽcula sæculórum. Amen."
graduale:
  - "!Ps. 54:23; 54:17; 54:19"
  - "Jacta cogitátum tuum in Dómino: et ipse te enútriet."
  - V. Dum clamárem ad Dóminum, exaudívit vocem meam ab his, qui appropínquant
    mihi. Allelúja, allelúja.
  - "!Ps. 7:12"
  - Deus judex justus, fortis et pátiens, numquid iráscitur per síngulos dies?
    Allelúja.
evangelium:
  - Sequéntia ++ sancti Evangélii secúndum Lucam
  - "!Luc 15:1-10"
  - "In illo témpore: Erant appropinquántes ad Jesum publicáni et peccatóres, ut
    audírent illum. Et murmurábant pharisǽi et scribæ, dicéntes: Quia hic
    peccatóres recipit et mandúcat cum illis. Et ait ad illos parábolam istam,
    dicens: Quis ex vobis homo, qui habet centum oves: et si perdíderit unam ex
    illis, nonne dimíttit nonagínta novem in desérto, et vadit ad illam, quæ
    períerat, donec invéniat eam? Et cum invénerit eam, impónit in húmeros suos
    gaudens: et véniens domum, cónvocat amícos et vicínos, dicens illis:
    Congratulámini mihi, quia invéni ovem meam, quæ períerat? Dico vobis, quod
    ita gáudium erit in cœlo super uno peccatóre pœniténtiam agénte, quam super
    nonagínta novem justis, qui non índigent pœniténtia. Aut quæ múlier habens
    drachmas decem, si perdíderit drachmam unam, nonne accéndit lucérnam, et
    evérrit domum, et quærit diligénter, donec invéniat? Et cum invénerit,
    cónvocat amícas et vicínas, dicens: Congratulámini mihi, quia invéni
    drachmam, quam perdíderam? Ita dico vobis: gáudium erit coram Angelis Dei
    super uno peccatóre pœniténtiam agénte."
offertorium:
  - "!Ps. 9:11-12 9:13"
  - "Sperent in te omnes, qui novérunt nomen tuum, Dómine: quóniam non
    derelínquis quæréntes te: psállite Dómino, qui hábitat in Sion: quóniam non
    est oblítus oratiónem páuperum."
secreta:
  - "Réspice, Dómine, múnera supplicántis Ecclésiæ: et salúti credéntium
    perpétua sanctificatióne suménda concéde."
  - $Per Dominum
communio:
  - "!Luc 15:10."
  - "Dico vobis: gáudium est Angelis Dei super uno peccatóre pœniténtiam agénte."
postcommunio:
  - "Sancta tua nos, Dómine, sumpta vivíficent: et misericórdiæ sempitérnæ
    prǽparent expiátos."
  - $Per Dominum
