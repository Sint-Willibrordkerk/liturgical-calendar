versum-1:
  - V. Memóriam fecit mirabílium suórum miserátor Dóminus.
  - R. Escam dedit timéntibus se.
ant-1:
  - Cognovérunt omnes * a Dan usque Bersabée, quod fidélis Sámuel prophéta esset
    Dómini.
rubrica-cisterciensis/ant-1:
  - Præváluit David * in Philisthæum in funda et lápide in nómine Dómini.
commemoratio:
  - "!Commemoratio de Octava SSmi Cordis Jesu"
  - "@Tempora/Pent02-5:Oratio"
lectio1:
  - De libro primo Regum
  - "!1 Reg 9:18-21"
  - "18 Accéssit autem Saul ad Samuélem in médio portæ, et ait: Indica, oro,
    mihi, ubi est domus vidéntis."
  - "19 Et respóndit Sámuel Sauli, dicens: Ego sum videns: ascénde ante me in
    excélsum, ut comedátis mecum hódie, et dimíttam te mane: et ómnia quæ sunt
    in corde tuo indicábo tibi."
  - 20 Et de ásinis quas nudiustértius perdidísti, ne sollícitus sis, quia
    invéntæ sunt. Et cujus erunt óptima quæque Israël? nonne tibi et omni dómui
    patris tui?
  - "21 Respóndens autem Saul, ait: Numquid non fílius Jémini ego sum de mínima
    tribu Israël, et cognátio mea novíssima inter omnes famílias de tribu
    Bénjamin? quare ergo locútus est mihi sermónem istum?"
lectio2:
  - "!1 Reg 9:22-25"
  - "22 Assúmens ítaque Sámuel Saulem et púerum ejus, introdúxit eos in
    triclínium, et dedit eis locum in cápite eórum qui fúerant invitáti: erant
    enim quasi trigínta viri."
  - "23 Dixítque Sámuel coco: Da partem quam dedi tibi, et præcépi ut repóneres
    seórsum apud te."
  - "24 Levávit autem cocus armum, et pósuit ante Saul. Dixítque Sámuel: Ecce
    quod remánsit: pone ante te, et cómede, quia de indústria servátum est tibi
    quando pópulum vocávi. Et comédit Saul cum Samuéle in die illa."
  - "25 Et descendérunt de excélso in óppidum, et locútus est cum Saule in
    solário: stravítque Saul in solário, et dormívit."
lectio3:
  - "!1 Reg 9:26-27; 10:1"
  - "26 Cumque mane surrexíssent, et jam elucésceret, vocávit Sámuel Saulem in
    solário, dicens: Surge, et dimíttam te. Et surréxit Saul: egressíque sunt
    ambo, ipse vidélicet, et Sámuel."
  - "27 Cumque descénderent in extréma parte civitátis, Sámuel dixit ad Saul:
    Dic púero ut antecédat nos et tránseat: tu autem subsíste paulísper, ut
    índicem tibi verbum Dómini."
  - "1 Tulit autem Sámuel lentículam ólei, et effúdit super caput ejus: et
    deosculátus est eum, et ait: Ecce unxit te Dóminus super hereditátem suam in
    príncipem, et liberábis pópulum suum de mánibus inimicórum ejus qui in
    circúitu ejus sunt."
lectio4:
  - "!Ex lítteris Encyclicis Pii Papæ undécimi"
  - "At certe inter cétera illa, quæ próprie ad sacratíssimi Cordis cultum
    pértinent, pia éminet ac memoránda est consecrátio, qua, nos nostráque ómnia
    ætérnæ Núminis caritáti accépta referéntes, divíno Jesu Cordi devovémus.
    Verum, áliud accédat opórtet, honéstæ satisfactiónis, ínquimus, seu
    reparatiónis, quam dicunt, offícium sacratíssimo Cordi Jesu præstándum. Nam,
    si illud est in consecratióne primum ac præcípuum ut amóri Creatóris
    creatúræ amor rependátur, álterum sponte hinc séquitur, ut eídem increáto
    Amóri, si quando aut oblivióne negléctus, aut offénsa violátus sit, illátæ
    quoquo modo injúriæ compensári débeant: quod quidem débitum reparatiónem
    vulgáto nómine vocámus."
lectio5:
  - "Quodsi ad utrámque rem iísdem prorsus ratiónibus impéllimur, reparándi
    tamen expiandíque offício ob validiórem quemdam justítiæ et amóris títulum
    tenémur: justítiæ quidem, ut irrogáta Deo nostris flagítiis expiétur offénsa
    et violátus ordo pœniténtia redintegrétur; amóris vero, ut Christo patiénti
    ac « saturáto oppróbriis » compatiámur eíque nonníhil solácii pro tenuitáte
    nostra afferámus. Peccatóres enim cum simus omnes, multísque oneráti culpis,
    non eo solo cultu Deus noster nobis est honorándus, quo vel ejus summam
    Majestátem débitis obséquiis adorémus, vel ejus suprémum domínium precándo
    agnoscámus, vel ejus infinítam largitátem gratiárum actiónibus laudémus; sed
    prætérea Deo justo víndici satisfaciámus opórtet « pro innumerabílibus
    peccátis et offensiónibus et negligéntiis » nostris. Consecratióni ígitur,
    qua Deo devovémur et sancti Deo vocámur, ea sanctitáte ac firmitáte quæ, ut
    docet Angélicus, consecratiónis est própria, addénda est expiátio, qua
    pénitus peccáta exstinguántur, ne forte indignitátem nostram impudéntem
    revérberet summæ justítiæ sánctitas, munúsque nostrum pótius árceat invísum
    quam gratum suscípiat."
lectio6:
  - "Hoc autem expiatiónis offícium humáno géneri univérso incúmbit, quippe
    quod, ut christiána docémur fide, post Adæ miserándum casum, hereditária
    labe inféctum, concupiscéntiis obnóxium et misérrime depravátum, in
    perníciem detrudéndum fuísset sempitérnam. Id quidem supérbi hac nostra
    ætáte sapiéntes, véterem Pelágii errórem secúti, inficiántur, natívam
    quandam virtútem humánæ natúræ jactántes quæ suápte vi ad altióra usque
    progrediátur; sed falsa hæc humánæ supérbiæ comménta réjicit Apóstolus,
    illud nos ádmonens: « natúra erámus fílii iræ ». Et sane jam ab inítio
    commúnis illíus expiatiónis débitum quasi agnovére hómines et Deo
    sacrifíciis vel públicis placándo, naturáli quodam sensu ducti, óperam dare
    cœpérunt."
lectio7:
  - Léctio sancti Evangélii secúndum Lucam
  - "!Luc 15:1-10"
  - "In illo témpore: Erant appropinquántes ad Jesum publicáni et peccatóres, ut
    audírent illum. Et réliqua."
  - _
  - Homilía sancti Gregórii Papæ
  - "!Homilia 34 in Evangelium, n. 2-3, post initium"
  - "Audístis in lectióne evangélica, fratres mei, quia peccatóres et publicáni
    accessérunt ad Redemptórem nostrum; et non solum ad colloquéndum, sed étiam
    ad convescéndum recépti sunt. Quod vidéntes pharisǽi dedignáti sunt. Ex qua
    re collígite quia vera justítia compassiónem habet, falsa justítia
    dedignatiónem. Quamvis et justi sóleant recte peccatóribus dedignári: sed
    áliud est quod ágitur typho supérbiæ, áliud quod zelo disciplínæ."
lectio8:
  - "Dedignántur étenim, sed non dedignántes: despérant, sed non desperántes:
    persecutiónem cómmovent, sed amántes: quia etsi foris increpatiónes per
    disciplínam exággerant, intus tamen dulcédinem per caritátem servant.
    Præpónunt sibi in ánimo ipsos plerúmque quos córrigunt: melióres exístimant
    eos quoque quos júdicant. Quod vidélicet agéntes, et per disciplínam
    súbditos, et per humilitátem custódiunt semetípsos."
lectio9:
  - "At contra, hi qui de falsa justítia superbíre solent, céteros quosque
    despíciunt, nulla infirmántibus misericórdia condescéndunt: quo se
    peccatóres esse non credunt, eo detérius peccatóres fiunt. De quorum
    profécto número pharisǽi exstíterant, qui diiudicántes Dóminum quod
    peccatóres suscíperet, arénti corde ipsum fontem misericórdiæ
    reprehendébant. Sed quia ægri erant, ita ut ægros se esse nescírent;
    quátenus quod erant agnóscerent, cæléstis eos médicus blandis foméntis
    curat, benígnum paradígma óbjicit, et in eórum corde vúlneris tumórem
    premit."
  - "&teDeum"
